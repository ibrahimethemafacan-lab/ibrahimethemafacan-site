, "a": 2, "e": "Kurul iznine tabi eşikler %10, %20, %33 ve %50'dir; %25 bunlar arasında yoktur."}, {"q": "Esas sözleşmesinin onaylandığı tarihten itibaren 1 yıl içinde ihraç başvurusu yapmayan VKŞ ne yapmalıdır?", "o": ["Derhal tasfiye edilir", "Hiçbir yükümlülüğü yoktur", "Kurul ek 1 yıl süre verir", "1 yıllık sürenin dolmasını izleyen 1 ay içinde başvuru yapmalı, faaliyet konusunu değiştirmeli veya infisah kararı alıp tasfiyeye girmelidir", "Sermayesini artırmalıdır"], "a": 3, "e": "Süre dolduktan sonraki 1 ay içinde bu üç seçenekten biri uygulanmalıdır."}, {"q": "VKŞ yönetim kurulu ile ilgili hangisi yanlıştır?", "o": ["En az 3 kişiden oluşur", "En az bir bağımsız üye zorunludur", "En az bir üyenin SPF Düzey 3 lisansı olmalıdır", "Üyelerde en az 5 yıllık tecrübe aranır", "Fon kullanıcısı ile kurucunun aynı olduğu ihraçlarda önemli işlemler bağımsız üyenin oyu aranmadan yapılabilir"], "a": 4, "e": "Bu durumda önemli işlemler bağımsız üye veya üyelerin olumlu oyuna bağlıdır."}, {"q": "Kira sertifikası yatırımcı raporu ile ilgili hangisi doğrudur?", "o": ["Üç aylık dönemler itibarıyla VKŞ yönetim kurulunca hazırlanır ve dönem bitimini izleyen 5 iş günü içinde halka arzda KAP'ta yayımlanır", "Aylık hazırlanır ve 6 iş günü içinde ilan edilir", "Yıllık hazırlanır ve bağımsız denetçi imzalar", "Altı aylık hazırlanır ve yalnız Kurula gönderilir", "Fon kullanıcısı tarafından hazırlanır"], "a": 0, "e": "Rapor üç aylık dönemlerle VKŞ yönetim kurulunca düzenlenir; 5 iş günü içinde halka arzda KAP'ta yayımlanır, diğerlerinde Kurula ve yatırımcılara iletilir."}, {"q": "VKŞ'nin finansal durum tablosunda kira sertifikası tertiplerine ilişkin varlık ve yükümlülükler nasıl raporlanır?", "o": ["Tek kalemde toplu olarak", "Tertip bazında, likidite esasına göre ve itfa tarihi en yakın tertip en üstte", "İhraç tarihi en eski tertip en üstte", "Tutar büyüklüğüne göre", "Fon kullanıcısına göre alfabetik"], "a": 1, "e": "Varlık ve yükümlülükler tertip bazında gruplanıp likidite esasına göre ve itfası en yakın tertip en üstte raporlanır."}]}, {"id": 6, "kisa": "Gayrimenkul Sertifikaları", "baslik": "Gayrimenkul Sertifikaları ve VII-128.2 Tebliği", "ozet": "Gayrimenkul projelerinin finansmanı için ihraç edilen, asli edimle konuta, tali edimle nakde dönüşen sertifikalar; ihraççı şartları, edim sorumlusu, raporlar, fon aktarımı, projenin gecikmesi ve kentsel dönüşüm istisnaları.", "notlar": "<h3>Gayrimenkule dayalı araçlar ve tarihçe<\/h3>\n<ul>\n<li>Mevzuattaki üç araç: <b>gayrimenkul yatırım fonu katılma payı<\/b>, <b>gayrimenkul yatırım ortaklığı payı<\/b>, <b>gayrimenkul sertifikası<\/b>.<\/li>\n<li><b>GYF:<\/b> fonların tapuda adlarına kayıt yaptıramaması nedeniyle 6362 sayılı SPKn ile tapu işlemleriyle sınırlı kişilik verildi; ilk düzenleme <b>III-52.3<\/b> (03.01.2014). 2016'dan itibaren başvurular arttı.<\/li>\n<li><b>GYO:<\/b> ilk düzenleme Seri VI No:11 (<b>1998<\/b>); bugün <b>III-48.1<\/b> (28.05.2013).<\/li>\n<li><b>Gayrimenkul sertifikası<\/b> bu üçünün en eskisi. 1989'da TOKİ'nin <b>konut sertifikaları<\/b> (İstanbul Halkalı Toplu Konut Sertifikaları; her sertifika <b>1 m²<\/b>, toplam <b>250.000 m²<\/b> borsaya kote) ilgi görmedi (uzun süre, yüksek fiyat, düşük getiri).<\/li>\n<li>İlk düzenleme Seri III No:19 (<b>20.07.1995<\/b>): nominal değeri eşit, <b>hamiline<\/b> yazılı menkul kıymet; 2009 değişikliğine rağmen ihraç yapılamadı.<\/li>\n<li><b>VII-128.2<\/b> Gayrimenkul Sertifikaları Tebliği: SPKn m.128/1-(e) ve m.130/3'e dayanır; <b>05.07.2013<\/b>'te yayımlanıp yürürlüğe girdi. 2016 (VII-128.2a, kentsel dönüşüm; 64. Hükümet 2016 Eylem Planı), 2017 (b ve c) değişiklikleri. 4 bölüm.<\/li>\n<li>İlk ihraç <b>TOKİ<\/b> tarafından; <b>07.04.2017<\/b>'den itibaren BİAŞ Pay Piyasası <b>Yapılandırılmış Ürünler ve Fon Pazarı<\/b>'nda işlem görüyor.<\/li>\n<\/ul>\n\n<h3>Tanım ve özellikler<\/h3>\n<ul>\n<li><b>Gayrimenkul sertifikası:<\/b> ihraççıların inşa edilecek veya edilmekte olan gayrimenkul projelerinin finansmanında kullanmak üzere ihraç ettikleri, projenin belirli bağımsız bölümlerini veya bağımsız bölümlerin belirli bir alan birimini temsil eden, <b>nominal değeri eşit<\/b> sermaye piyasası aracı.<\/li>\n<li>Pay gibi projeye ortaklık hakkı verir ama belirli vadesi olduğundan <b>hibrit<\/b> yapıdadır.<\/li>\n<li><b>Asli edim:<\/b> belirli sayıda sertifika karşılığında konut veya işyeri edinme (gayrimenkule dönüşüm). <b>Tali edim:<\/b> sertifika oranında proje değer artışından yararlanma (nakde dönüşüm). Ayrıca kentsel dönüşümde hak sahiplerine sertifika verilmesi; borsa zorunluluğuyla likidite; <b>kısmi itfa<\/b> ile erken kazanç.<\/li>\n<li>Yurt içinde halka arz veya nitelikli yatırımcıya satış ya da yurt dışında ihraç; borsada işlem zorunlu; ihraç ve itfa yetkili kuruluşlar aracılığıyla.<\/li>\n<li><b>Faydalar:<\/b> yatırımcıya düşük bütçeyle gayrimenkul yatırımı, değer artışına ortaklık, likidite, <b>%10 stopaj<\/b> ile vergi avantajı; ihraççıya ön finansman, alternatif satış kanalı, marka bilinirliği, öngörülebilir nakit akışı; hak sahiplerine riskli yapıların takası ve sürdürülebilir kentsel dönüşüm.<\/li>\n<\/ul>\n<h4>Temel kavramlar<\/h4>\n<ul>\n<li><b>Bağımsız bölüm:<\/b> 634 sayılı Kat Mülkiyeti Kanununa göre bağımsız mülkiyete konu bölüm.<\/li>\n<li><b>Vade:<\/b> ihraç tarihinden edimlerin ifa sürelerinin bitimine kadar öngörülen süre. <b>Proje bitiş tarihi:<\/b> ihraca konu bölümlerin tamamlanması için öngörülen tarih. Vade proje bitişinden sonra olabilir (TOKİ örneğinde bitiş 06.12.2019, vade 06.04.2020).<\/li>\n<li><b>Asli edim kullanım süresi:<\/b> yatırımcının asli edim talebini bildireceği süre; <b>asli ve tali edim ifa süreleri:<\/b> ihraççının edimleri yerine getireceği süreler.<\/li>\n<li><b>Edim sorumlusu:<\/b> edimlerin izahnameye uygunluğunu kontrol eden, sermaye piyasasında yetkili <b>bağımsız denetim kuruluşu<\/b>.<\/li>\n<li><b>Yapı denetim kuruluşu:<\/b> 4708 sayılı Kanuna göre Çevre ve Şehircilik Bakanlığı izniyle münhasıran yapı denetimi yapan, ortaklarının tamamı mimar ve mühendis olan tüzel kişi.<\/li>\n<li><b>Hak sahibi:<\/b> 6306, 2985 ve 775 sayılı Kanunlar kapsamında kentsel dönüşüm alanında hak sahipliği tespit edilen ve uzlaşılan kişi.<\/li>\n<li><b>İtfa bedeli:<\/b> başvurudaki değerleme raporuna göre belirlenen sertifika bedeli. <b>Cezai şart:<\/b> edimler yerine getirilmezse ihraççıya edimlere ek yükümlülük.<\/li>\n<li><b>Arsa sahibi:<\/b> arsanın maliki gerçek veya tüzel kişi. <b>İhraççı:<\/b> anonim ortaklıklar ve mevzuatıyla araç ihracına yetkili kamu kurumları.<\/li>\n<\/ul>\n\n<h3>İhraç esasları<\/h3>\n<ul>\n<li>Belirli bağımsız bölümleri temsilen ihraçta her bölüme karşılık sertifika adedi <b>ihraç öncesi<\/b> belirlenir. Alan birimi temsilen ihraçta blok, kat, cephe, malzeme farkları için asli edim sırasında <b>şerefiye<\/b> istenebilir; esaslar izahnamede açıklanır.<\/li>\n<li>Bölümler üzerinde edimleri engelleyen ayni veya şahsi hak, haciz veya projenin esaslı unsurlarına ilişkin ihtilaf olmamalı.<\/li>\n<li>Ancak bütünü tamamlanınca kullanılabilen bina veya blokta bölümlerin <b>bir kısmı<\/b> ihraca konu edilemez; tamamı konu edilmeli ve aynı kalite standardında inşa edilmeli (TOKİ, İller Bankası ve iştirakleri hariç).<\/li>\n<li><b>İhraç tutarı:<\/b> başvuruda hazırlanan değerleme raporundaki değer referans alınarak ihraççı belirler; izahnamede belirtilirse <b>ek satış<\/b> yapılabilir, ek satış dahil toplam tutar izahnamede yazılır.<\/li>\n<li>Bölümler proje bitiş tarihinden önce tamamlanır ve bu durum bitiş tarihinden en az <b>15 gün önce<\/b> açıklanırsa yeni tarih esas alınır; izahname değişikliği gerekmez.<\/li>\n<li><b>Sigorta<\/b> yaptırılırsa Kurul; itfa bedeli ve cezai şart için <b>banka garantisi<\/b>, yalnız nitelikli yatırımcıya satış ve <b>derecelendirme<\/b> şartlarını aramaz. Sigorta yoksa Kurul bunları talep edebilir.<\/li>\n<li><b>Borsa:<\/b> yurt içi ihraçta halka arzda da nitelikli yatırımcıya satışta da borsada işlem <b>zorunlu<\/b>; Kurula başvuruyla eş zamanlı borsaya başvurulur. Kotasyon değerlendirme yapılmadan; halka arz edilenler <b>Yapılandırılmış Ürünler ve Fon Pazarı<\/b>, nitelikli yatırımcıya ihraç edilenler <b>Girişim Sermayesi Pazarı<\/b>'nda. <b>Kredili işlem ve açığa satış yapılamaz<\/b>. Halka arzda izahnamede yazılırsa fiyat istikrarı işlemleri yapılabilir.<\/li>\n<li>Yurt içinde MKK'da <b>kayden<\/b> ihraç; yurt dışı ihraç bilgileri ve değişiklikleri <b>3 iş günü<\/b> içinde MKK'ya.<\/li>\n<li><b>İtfa:<\/b> asli veya tali edimin yerine getirilmesi (ve gerekirse cezai şart) ile; proje gerçekleşmezse itfa bedeli ve cezai şart ödenerek. Öngörülmüşse proje bitişinden önce ihraççının belirleyeceği tutar veya borsa fiyatından <b>geri alım<\/b> mümkün.<\/li>\n<li>İhraç ve itfa, yüklenimli aracılık yetkili bankalar ile portföy aracılığı, genel saklama veya aracılık yüklenimi yapan <b>aracı kurumlar<\/b> vasıtasıyla yapılır. Edimi yerine getirilen veya itfa edilen sertifikalar MKK esaslarıyla iptal edilir.<\/li>\n<\/ul>\n<h4>Edim sorumlusu<\/h4>\n<ul>\n<li>İhraççı ile <b>Kurula başvurudan önce<\/b> sözleşme imzalanır.<\/li>\n<li>Kontrol eder: edimlerin izahnameye uygunluğu; tali edim satış fiyatlarının değerleme ve piyasa koşullarına uygunluğu; yatırımcıya aktarılan tutarların satış bedeline uygunluğu.<\/li>\n<li><b>ISRS 4400<\/b>'e uygun <b>güvence raporu<\/b>: halka arzda proje bitişini izleyen <b>üç aylık<\/b>, halka arz edilmeksizin <b>altı aylık<\/b> periyotlar; ihraççıya iletilir ve <b>aynı gün<\/b> KAP'ta ilan edilir.<\/li>\n<li>Yatırımcı aleyhine tespitlerde zararın nasıl tazmin edileceği izahnamede yazılır.<\/li>\n<\/ul>\n\n<h3>İhraççı şartları<\/h3>\n<ol>\n<li><b>Tecrübe:<\/b> projenin satış değerinin <b>en az yarısı<\/b> büyüklüğünde bir projeyi başvurudan önceki <b>5 yıl<\/b> içinde tamamlamış olmak (GYO ise tamamlatmış olmak). Sertifika ihracı için kurulmuş AŞ'de bu şartı yönetim kontrolüne sahip ortaklardan biri sağlar.<\/li>\n<li><b>Arsa:<\/b> arsanın mülkiyetine <b>münferiden<\/b> sahip olmak ve tapunun kat irtifakına çevrilmesi veya ihraççı lehine kat irtifakı kurulması.<\/li>\n<li><b>Finansal:<\/b> son yıllık denetlenmiş tablolarda <b>özkaynakların ödenmiş veya çıkarılmış sermayeden yüksek<\/b> olması.<\/li>\n<li><b>Derecelendirme:<\/b> yatırım yapılabilir seviyede uzun vadeli not.<\/li>\n<\/ol>\n<ul>\n<li><b>TOKİ, İller Bankası<\/b> veya bağlı ortaklık ve iştiraklerinin ihraççı olması halinde (1), (3) ve (4) aranmaz; yatırımcıların aynı projeden doğrudan konut edinenlerle <b>eşit haklara<\/b> sahip olacağına dair düzenleme zorunlu; talep halinde diğer şartlardan muafiyet verilebilir.<\/li>\n<li>Bunlar ihraççı değil ama arsa sahibiyse (2) aranmaz; eşit hak hükmü konur; ihraççı tamamlayamazsa projeyi TOKİ veya İller Bankası tamamlar.<\/li>\n<li>Sermayesinin veya oy haklarının <b>%51<\/b> veya fazlası doğrudan veya dolaylı kamuya ait ihraççılara talep üzerine şartlardan muafiyet verilebilir.<\/li>\n<\/ul>\n\n<h3>Raporlar<\/h3>\n<table><tr><th>Rapor<\/th><th>Hazırlayan ve içerik<\/th><\/tr>\n<tr><td>Değerleme raporu<\/td><td><b>Değerleme kuruluşu<\/b>; başvuru ve proje bitiş tarihlerinde; bölümlerin tahmini satış bedeli, emsal değerler ve projedeki emsal satış bedelleri.<\/td><\/tr>\n<tr><td>Fizibilite raporu<\/td><td><b>Yapı denetim kuruluşu<\/b>; edimlerin sürede yerine getirilemeyeceği anlaşılınca; tamamlanma düzeyi, gereken süre ve tahmini maliyet.<\/td><\/tr>\n<tr><td>İnşaat ilerleme raporu<\/td><td><b>Yapı denetim kuruluşu<\/b>; fonların inşaat ilerlemesine göre ihraççıya aktarılması için.<\/td><\/tr>\n<tr><td>Yatırımcı raporu<\/td><td>İhraççı; bölümlerin tamamlanma düzeyi ve asli edim talepleri; itfaya kadar <b>6 aylık<\/b> dönemlerle, imzalandığı gün sitede ve KAP'ta (yurt dışında Kurula ve yatırımcılara).<\/td><\/tr>\n<\/table>\n<ul>\n<li>Fizibilite ve inşaat ilerleme raporlarındaki yanlış bilgilerden yapı denetim kuruluşları sorumludur. TOKİ ve İller Bankası projelerinde değerleme ve fizibilite raporları başka kurumlarca hazırlanabilir.<\/li>\n<\/ul>\n\n<h3>Asli edim<\/h3>\n<ul>\n<li>Talepler yetkili kuruluşlar vasıtasıyla <b>MKS<\/b> üzerinden ihraççıya iletilir. Kullanım süresinin ilk günü borsada işlem görme tarihinden <b>önce olamaz<\/b>.<\/li>\n<li>Yatırımcı gereken sayıda sertifikayı ihraççı hesabına aktarır ve gerekirse şerefiye öder; sertifikalarda haciz veya rehin olmamalı. Paylı mülkiyetle birden fazla yatırımcı talep edebilir.<\/li>\n<li>Aynı bölümü birden fazla kişi isterse öncelik izahnameye göre; belirleme yoksa <b>zaman önceliği<\/b>.<\/li>\n<li>Proje bitişinden önce talepte tapu devri yapılır veya satış vaadi ya da alım hakkı sözleşmesi imzalanıp <b>tapuya şerh<\/b> edilir (TOKİ ve İller Bankası projelerinde şerh aranmaz). Sertifikalar edim ifa edilene veya itfa bedeli ödenene kadar <b>bloke<\/b> edilir. Satış vaadi sözleşmelerinde gecikme için cezai şart zorunlu (TOKİ ve İller Bankası hariç).<\/li>\n<li>Yeterli sertifikası olmayanlara izahnamede açıklanırsa kredi veya nakit ödeme imkânı sağlanabilir.<\/li>\n<\/ul>\n<h3>Tali edim<\/h3>\n<ul>\n<li>Asli edim süresinde başvurmayan veya şartları yerine getirmeyenler <b>tali edimi talep etmiş sayılır<\/b>. İhraççı karşılık gelen bölümleri satıp tutarı sertifika oranında dağıtmak zorundadır.<\/li>\n<li>İzahnamede öngörülmüşse tali edim süresinde asli edime geçilebilir; gereken sertifika sayısı ihraç öncesi izahnamedekiyle aynıdır.<\/li>\n<li>Satış tutarı tüm bölümler satılıncaya kadar yetkili kuruluşça devlet tahvili, hazine bonosu, Hazine kira sertifikası, mevduat veya katılma hesabında değerlendirilir ve satışların tamamlanmasını izleyen <b>2 iş günü<\/b> içinde aktarılır. Süre beklenmeden <b>kısmi itfa<\/b> da yapılabilir.<\/li>\n<li>Tali edim süresi bitene kadar bölümler <b>ihraççıya ve ilişkili taraflarına satılamaz<\/b> (TOKİ ve İller Bankası hariç).<\/li>\n<li>Süre sonunda satılamayan bölümler için ödemede vadeden önceki <b>3 aylık<\/b> dönemde borsada oluşan ağırlıklı ortalama fiyatların ortalaması esas; sağlıklı değilse değerleme raporu. Bu durumda bölümler değerleme değerinden aşağı olmamak üzere ilişkili taraflara satılabilir. Ödemeler süre bitimini izleyen <b>10 iş günü<\/b> içinde.<\/li>\n<\/ul>\n\n<h3>Projenin gecikmesi ve gerçekleşmemesi<\/h3>\n<ul>\n<li><b>Gecikme:<\/b> anlaşıldığı tarihten itibaren <b>15 iş günü<\/b> içinde fizibilite raporu hazırlanıp Kurula ek süre başvurusu yapılır. Ek süre, genel zorlayıcı sebepler dışında proje bitiş tarihini izleyen <b>180 günü<\/b> aşamaz. Gecikme bilgisi, ek süre, yeni edim süreleri ve cezai şart izahname usulüyle duyurulur; edimler yeni sürede yerine getirilir ve cezai şart ödenir.<\/li>\n<li><b>Gerçekleşmeme:<\/b> ek süre sonunda veya ek süre istenmemişse vade sonunda edimler yerine getirilemezse ihraççı <b>itfa bedeli ve cezai şartı<\/b> öder.<\/li>\n<li>Ödeyemezse: <b>ilk iş günü<\/b> Kurula bilgi ve KAP'ta özel durum açıklaması; güncel fizibilite raporu ve sertifika sahipleri toplantısının yer ve tarihi en geç <b>30 gün<\/b> içinde yetkili kuruluşça KAP'ta ilan; ilandan itibaren en geç <b>30 gün<\/b> içinde toplantı. Masraflar bloke fondan.<\/li>\n<li>Toplantıda TTK genel kurul hükümleri kıyasen; <b>toplantı nisabı aranmaz<\/b>, katılanların çoğunluğuyla karar. Seçenekler: projenin üçüncü kişilere tamamlatılması veya bloke fon ile tamamlanmayan kısmın satılıp bedelin dağıtılarak itfa.<\/li>\n<\/ul>\n\n<h3>Fonların kullanımı<\/h3>\n<ul>\n<li>Fon yetkili kuruluşça bir bankada <b>özel hesapta<\/b> toplanır ve vekil özeniyle devlet tahvili, hazine bonosu, Hazine kira sertifikası, vadeli mevduat veya katılma hesabında ihraççı adına değerlendirilir.<\/li>\n<li>Fon öncelikle sertifikaya konu bölümlerin tamamlanmasında ve yalnız o projede veya başvuru tarihi itibarıyla proje için kullanılmış finansmanın geri ödenmesinde kullanılır. Haczedilemez, rehnedilemez, iflas masasına girmez.<\/li>\n<li>Değerleme, fizibilite ve inşaat ilerleme raporları için asgari ücret tarifesine göre hesaplanan kısım yetkili kuruluşta <b>bloke<\/b> edilir.<\/li>\n<li><b>Aktarım:<\/b> <b>%25<\/b> inşaat başlamadan önce doğrudan; <b>%65<\/b> inşaat ilerleme raporlarındaki oranlarda; <b>%10<\/b> tüm edimler ifa edildikten sonra. Başka kişi tamamlarsa ona aktarılır.<\/li>\n<li>Proje gerçekleşmezse kalan tutarlar ihraççıya aktarılmaz; itfadan sonra kalanlar ihraççıya aktarılır.<\/li>\n<li>İtfa bedeli ve cezai şart için <b>banka garantisi<\/b>, <b>banka teminat mektubu<\/b> veya <b>tamamlama sigortası<\/b> varsa fonun tamamı doğrudan ihraççıya aktarılabilir; harcamalar ayrı izlenir. TOKİ ve İller Bankası projelerinde bu kısıtlar uygulanmaz.<\/li>\n<\/ul>\n\n<h3>Başvuru ve Kurul ücreti<\/h3>\n<ul>\n<li>Tebliğ Ek-1 belgeleriyle başvuru; değerleme değerini referans alan ihraç tutarını aşmayan tavan içinde tertipler. Halka arzda her tertip öncesi Ek-2 ile onay; halka arz edilmeksizin satışta tavan onayından itibaren <b>1 yıl<\/b> içinde her tertip öncesi tertip ihraç belgesi onayı.<\/li>\n<li><b>Kurul ücreti:<\/b> ihraç değerinin (nominalden az olmamak üzere) <b>binde 2<\/b>'si; 24.06.2016 duyurusuyla <b>%50 indirim<\/b>, yani uygulamada <b>binde 1<\/b>.<\/li>\n<li>Kamunun %51 veya fazla sahip olduğu ihraççılar için 07.03.2017'den itibaren <b>2 yıl<\/b> süreyle Kurul ücreti <b>binde sıfır<\/b> uygulandı.<\/li>\n<\/ul>\n\n<h3>Kentsel dönüşüm amaçlı ihraçlar<\/h3>\n<ul>\n<li>2016 değişikliği: anlaşma sağlanırsa kentsel dönüşüm alanındaki <b>hak sahiplerine<\/b> sertifika verilebilir; amaç arsa edinme maliyetini düşürmek ve hak sahiplerine sertifikayı nakde veya konuta çevirme esnekliği sağlamak.<\/li>\n<li><b>İhraççılar:<\/b> 6306 sayılı Kanunla Çevre ve Şehircilik Bakanlığının yetki devri ve proje onayıyla <b>İller Bankası ve TOKİ<\/b> veya bunların belirlediği tüzel kişiler; yetki devriyle <b>belediyeler<\/b> veya belediyelerin belirlediği, İller Bankası garantörlüğündeki tüzel kişiler; Bakanlığın 6306 m.6/5-(ç) uyarınca belirlediği tüzel kişiler; 775 ve 2985 sayılı Kanunlarla TOKİ ve anlaştığı tüzel kişiler.<\/li>\n<li>TOKİ ve İller Bankası ile iştirakleri dışındaki ihraççılarda <b>özkaynak > sermaye<\/b> ve <b>yatırım yapılabilir not<\/b> şartı aranır.<\/li>\n<li>6306 kapsamında Çevre ve Şehircilik Bakanlığının uygun görüşü; belediye ihraçlarında ek olarak 4749 sayılı Kanun kapsamında <b>Hazine ve Maliye Bakanlığı izni<\/b>. Sayılmayan ihraççılar kentsel dönüşüm hükümlerinden yararlanamaz.<\/li>\n<li>Hak sahibine verilecek sertifika adedi ilgili mevzuata göre tespit edilen taşınmaz değeriyle belirlenir; değerleme raporu da dikkate alınabilir. Belirli bölümler hak sahiplerine tahsis edilebilir. Onaydan sonra yatırımcılar hak sahipleriyle <b>eşit haklara<\/b> sahiptir.<\/li>\n<li><b>Geri alım<\/b> öngörülürse asgari tutar ve fiyat bilgisi <b>her ayın ilk işlem günü<\/b> açıklanır; geri alınanların iptali için derhal MKK'ya başvurulur.<\/li>\n<li>Projenin tamamlatılacağına dair hüküm zorunlu (TOKİ veya İller Bankası tarafından).<\/li>\n<li>Proje gerçekleşmezse veya <b>1 yıldan fazla gecikirse<\/b>, ihraç değerinden aşağı olmamak üzere belirlenecek tutar (ve öngörülmüşse cezai şart) ödenerek itfa zorunlu.<\/li>\n<li><b>Muafiyetler:<\/b> satış vaadi veya alım hakkı şerhi aranmaz; cezai şart ancak öngörülürse uygulanır; edim sorumlusu sözleşmesi, ihraççı şartları (m.5), cezai şart zorunlulukları ve gerçekleşmeme prosedürleri uygulanmaz. TOKİ ve İller Bankası ihraçlarında raporlar onlarca hazırlanıp <b>üç aylık<\/b> açıklanabilir, fon doğrudan aktarılır, ilişkili taraf satış yasağı ve fon kullanım kısıtları uygulanmaz.<\/li>\n<\/ul>\n\n<h3>Kamuyu aydınlatma (internet sitesi ve KAP)<\/h3>\n<ul>\n<li>Asli edim kullanım ve ifa süreleri ile tali edim için sertifikaların aktarılacağı süre: başlangıçtan en az <b>10 gün önce<\/b>.<\/li>\n<li>Tali edimden asli edime geçiş için talep süresi: başlangıçtan en az <b>10 gün önce<\/b>.<\/li>\n<li>Değerleme, inşaat ilerleme ve fizibilite raporlarının sonuçları: hazırlandığı <b>gün<\/b>.<\/li>\n<li>Projedeki ihraca konu olmayan benzer bölümlerin ortalama satış fiyatları: <b>her ayın ilk iş günü<\/b>.<\/li>\n<li>Geri alım fiyat bilgisi: <b>her ayın ilk iş günü<\/b>.<\/li>\n<li>Tali edim süresindeki satışlar ve itfalar: her <b>üç aylık<\/b> dönemin son iş günü.<\/li>\n<li>Edim sorumlusunun güvence raporu: iletildiği <b>gün<\/b>.<\/li>\n<\/ul>", "sorular": [{"q": "Gayrimenkul sertifikasıyla ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Vadesi bulunmayan, süresiz bir ortaklık payıdır", "İnşa edilecek veya edilmekte olan projelerin finansmanı için ihraç edilir", "Belirli bağımsız bölümleri veya belirli bir alan birimini temsil eder", "Nominal değerleri eşittir", "Hibrit yapıda bir araç olarak nitelendirilebilir"], "a": 0, "e": "Gayrimenkul sertifikası projeye bağlı belirli bir vadeye sahiptir; bu yüzden hibrit sayılır."}, {"q": "Türkiye'de ilk gayrimenkul sertifikası ihracını gerçekleştiren kurum ve sertifikaların işlem görmeye başladığı yıl hangisidir?", "o": ["Emlak Konut GYO – 2015", "TOKİ – 2017", "İller Bankası – 2016", "TOKİ – 1995", "Çevre ve Şehircilik Bakanlığı – 2018"], "a": 1, "e": "İlk ihraç TOKİ tarafından yapılmış ve sertifikalar 07.04.2017'den itibaren işlem görmüştür."}, {"q": "Gayrimenkul sertifikası sahiplerinin sahip oldukları sertifika oranında, bağımsız bölümlerin satışından elde edilen tutarı almasına ne ad verilir?", "o": ["Asli edim", "Cezai şart", "Tali edim", "İtfa bedeli", "Şerefiye"], "a": 2, "e": "Tali edim bölümlerin satılarak bedelin sertifika oranında dağıtılmasıdır; asli edim ise bağımsız bölümün teslimidir."}, {"q": "Edim sorumlusu ile ilgili hangisi doğrudur?", "o": ["Yapı denetim kuruluşudur", "Değerleme kuruluşudur", "Yetkili kuruluş olan aracı kurumdur", "Sermaye piyasasında yetkili bağımsız denetim kuruluşudur ve ihraççıyla Kurula başvurudan önce sözleşme imzalanır", "Borsa İstanbul tarafından atanır"], "a": 3, "e": "Edim sorumlusu bağımsız denetim kuruluşudur; sözleşme Kurula başvurudan önce imzalanır."}, {"q": "Halka arz yoluyla ihraç edilen gayrimenkul sertifikaları Borsa İstanbul'da hangi pazarda işlem görür?", "o": ["Yıldız Pazar", "Ana Pazar", "Borçlanma Araçları Piyasası", "Girişim Sermayesi Pazarı", "Yapılandırılmış Ürünler ve Fon Pazarı"], "a": 4, "e": "Halka arz edilenler Yapılandırılmış Ürünler ve Fon Pazarı'nda, nitelikli yatırımcıya ihraç edilenler Girişim Sermayesi Pazarı'nda işlem görür."}, {"q": "Gayrimenkul sertifikalarının borsada işlem görmesiyle ilgili hangisi yanlıştır?", "o": ["Kredili işlemlere konu edilebilir", "Kotasyon için borsa ayrıca değerlendirme yapmaz", "Yurt içi ihraçlarda borsada işlem görmesi zorunludur", "Açığa satışı yapılamaz", "Halka arzda izahnamede belirtilirse fiyat istikrarı işlemleri yapılabilir"], "a": 0, "e": "Gayrimenkul sertifikaları kredili işlemlere konu edilemez ve açığa satılamaz."}, {"q": "Gayrimenkul projesinin tamamlanması için sigorta yaptırılması halinde aşağıdakilerden hangisi Kurulca aranmayan şartlar arasında yer almaz?", "o": ["İtfa bedeli ve cezai şartın banka garantisi", "Borsada işlem görme", "Derecelendirme", "Satışın yalnız nitelikli yatırımcıya yapılması", "Hiçbiri; hepsi aranmayan şartlardandır"], "a": 1, "e": "Sigorta varsa banka garantisi, yalnız nitelikli yatırımcıya satış ve derecelendirme şartları aranmaz; yurt içi ihraçlarda borsada işlem görme zorunluluğu ise devam eder.", "k": 1}, {"q": "Özel sektör ihraççısının sağlaması gereken proje tecrübesi şartı hangisidir?", "o": ["Son 3 yılda projenin satış değeri kadar proje tamamlamış olmak", "Son 10 yılda en az iki proje tamamlamış olmak", "Son 5 yılda projenin satış değerinin en az yarısı büyüklüğünde proje tamamlamış olmak", "Son 5 yılda projenin satış değerinin iki katı büyüklüğünde proje tamamlamış olmak", "Tecrübe şartı yoktur"], "a": 2, "e": "Başvurudan önceki 5 yılda proje satış değerinin en az yarısı büyüklüğünde bir projeyi tamamlamış olmak gerekir."}, {"q": "TOKİ'nin ihraççı olduğu gayrimenkul sertifikası ihracında aşağıdaki ihraççı şartlarından hangisi aranmaya devam eder?", "o": ["Proje tecrübesi", "Özkaynakların sermayeden yüksek olması", "Derecelendirme notu", "Arsa mülkiyeti ve kat irtifakı", "Hiçbiri"], "a": 3, "e": "TOKİ ve İller Bankası ihraççı ise tecrübe, finansal durum ve derecelendirme şartları aranmaz; arsa şartı Tebliğde muaf tutulanlar arasında sayılmamıştır."}, {"q": "Gayrimenkul sertifikası ihracında fizibilite ve inşaat ilerleme raporlarını kim hazırlar?", "o": ["Değerleme kuruluşu", "Edim sorumlusu", "Derecelendirme kuruluşu", "Yetkili kuruluş", "Yapı denetim kuruluşu"], "a": 4, "e": "Fizibilite ve inşaat ilerleme raporları yapı denetim kuruluşlarınca hazırlanır ve bu raporlardaki yanlış bilgilerden onlar sorumludur."}, {"q": "Yurt içinde satılan gayrimenkul sertifikalarına ilişkin yatırımcı raporu hangi sıklıkla ilan edilir?", "o": ["Altı aylık", "Üç aylık", "Aylık", "Yıllık", "Yalnız proje bitişinde"], "a": 0, "e": "Yatırımcı raporu itfaya kadar 6 aylık dönemler itibarıyla, imzalandığı gün internet sitesinde ve KAP'ta ilan edilir."}, {"q": "Aynı bağımsız bölümü birden fazla yatırımcının talep etmesi halinde izahnamede bir belirleme yoksa hangi esas uygulanır?", "o": ["En çok sertifikaya sahip olana öncelik", "Zaman önceliği", "Kura", "Eşit paylı mülkiyet", "İhraççının takdiri"], "a": 1, "e": "İzahnamede öncelik belirlenmemişse zaman önceliği esas alınır."}, {"q": "Tali edim ifa süresi sonunda satılamayan bağımsız bölümler için yatırımcılara ödemede kural olarak hangi fiyat esas alınır?", "o": ["İhraç fiyatı", "Nominal değer", "Vade tarihinden önceki üç aylık dönemde borsada oluşan ağırlıklı ortalama fiyatların ortalaması", "Son işlem günü kapanış fiyatı", "Edim sorumlusunun belirlediği fiyat"], "a": 2, "e": "Vadeden önceki 3 aylık dönemin borsa ağırlıklı ortalama fiyatlarının ortalaması esastır; sağlıklı değilse değerleme raporu kullanılır."}, {"q": "Projenin gecikmesi halinde Kurulca verilecek ek süre, genel zorlayıcı sebepler dışında, proje bitiş tarihini izleyen kaç günü aşamaz?", "o": ["30 gün", "90 gün", "120 gün", "180 gün", "365 gün"], "a": 3, "e": "Ek süre proje bitiş tarihini izleyen 180 günü aşamaz."}, {"q": "Projenin geciktiğinin anlaşılmasından itibaren fizibilite raporu hazırlanıp Kurula ek süre başvurusu kaç iş günü içinde yapılmalıdır?", "o": ["5 iş günü", "10 iş günü", "30 iş günü", "20 iş günü", "15 iş günü"], "a": 4, "e": "Gecikmenin anlaşıldığı tarihten itibaren 15 iş günü içinde fizibilite raporu hazırlanıp ek süre talep edilir."}, {"q": "İhraççının itfa bedeli ve cezai şartı ödeyemediği durumda yapılan gayrimenkul sertifikası sahipleri toplantısıyla ilgili hangisi doğrudur?", "o": ["Toplantı nisabı aranmaz, katılanların çoğunluğuyla karar alınır", "Karar için oybirliği gerekir", "Toplantı nisabı olarak sertifikaların yarısı aranır", "Toplantıyı ihraççı düzenler", "Toplantı 90 gün içinde yapılır"], "a": 0, "e": "Toplantı nisabı aranmaksızın katılanların çoğunluğuyla karar alınır; toplantıyı yetkili kuruluş düzenler."}, {"q": "Banka garantisi, teminat mektubu veya sigorta bulunmayan bir gayrimenkul sertifikası ihracında fonun ihraççıya aktarım oranları hangisidir?", "o": ["%50 başta, %50 sonda", "%25 inşaat öncesi, %65 inşaat ilerlemesine göre, %10 edimler sonrası", "%10 inşaat öncesi, %80 ilerlemeye göre, %10 sonda", "%100 inşaat öncesi", "%30 inşaat öncesi, %60 ilerlemeye göre, %10 sonda"], "a": 1, "e": "Fonun %25'i inşaat başlamadan, %65'i inşaat ilerleme raporlarına göre, %10'u tüm edimler ifa edildikten sonra aktarılır."}, {"q": "Gayrimenkul sertifikası ihraçlarında %50 indirim sonrasında uygulanan Kurul ücreti oranı hangisidir?", "o": ["Binde 0,5", "Binde 2", "Binde 1", "On binde 5", "Binde 4"], "a": 2, "e": "Normal oran binde 2'dir; 2016'daki %50 indirimle binde 1 uygulanır."}, {"q": "Kentsel dönüşüm amaçlı projelerde projenin hangi süreden fazla gecikmesi halinde sertifikaların itfası zorunludur?", "o": ["3 ay", "6 ay", "180 gün", "1 yıl", "2 yıl"], "a": 3, "e": "Proje gerçekleşmezse veya 1 yıldan uzun gecikirse ihraç değerinden aşağı olmamak üzere belirlenen tutarla itfa zorunludur."}, {"q": "Belediyelerin kentsel dönüşüm amaçlı gayrimenkul sertifikası ihracında Çevre ve Şehircilik Bakanlığının uygun görüşüne ek olarak hangi izin aranır?", "o": ["BDDK izni", "Borsa İstanbul onayı", "İçişleri Bakanlığı izni", "TOKİ onayı", "4749 sayılı Kanun kapsamında Hazine ve Maliye Bakanlığı izni"], "a": 4, "e": "Belediyeler ve iştirakleri ihraççıysa ayrıca 4749 sayılı Kanun kapsamında Hazine ve Maliye Bakanlığının izni alınır."}, {"q": "Gayrimenkul sertifikasında asli edim kullanım süreleri ihraççı tarafından en geç ne zaman kamuya açıklanmalıdır?", "o": ["Başlangıçtan en az 10 gün önce", "Başlangıçtan en az 3 gün önce", "Sürenin başladığı gün", "Başlangıçtan en az 30 gün önce", "Ayın ilk iş günü"], "a": 0, "e": "Asli edim kullanım ve ifa süreleri başlangıçtan en az 10 gün önce internet sitesinde ve KAP'ta açıklanır."}, {"q": "Gayrimenkul sertifikasına konu olmayan benzer bağımsız bölümlerin ortalama satış fiyatları ne zaman açıklanır?", "o": ["Her gün", "Her ayın ilk iş günü", "Her haftanın ilk iş günü", "Üç aylık dönem sonunda", "Proje bitişinde"], "a": 1, "e": "Emsal satış fiyatları ve geri alım fiyat bilgisi her ayın ilk iş günü açıklanır."}]}, {"id": 7, "kisa": "Varant ve Sertifikalar", "baslik": "Varantlar ve Yatırım Kuruluşu Sertifikaları (VII-128.3)", "ozet": "Alım ve satım varantının kâr-zarar mantığı, opsiyonlarla farkları, fiyatı etkileyen faktörler, sertifika türleri; yatırım kuruluşu varantı ve sertifikası ihracı, piyasa yapıcılık, borsa işlem esasları ve ortaklık varantı kuralları.", "notlar": "<h3>Varant: kavram ve tarihçe<\/h3>\n<ul>\n<li>İngilizce <b>warrant<\/b> (garanti, kefil, hak). İlk kullanım 18. yüzyılda ABD; finansal araç olarak 1900'lerin başı ABD; yoğun kullanım 1970'ler ABD; Avrupa'da 1980'ler İngiltere. Türkiye'de ilk işlem <b>13.08.2010<\/b>, <b>Deutsche Bank<\/b>'ın aracı kuruluş varantı.<\/li>\n<li><b>Varant:<\/b> dayanak varlık veya göstergeyi önceden belirlenen fiyattan, belirli tarihte veya tarihe kadar alma ya da satma hakkı veren; kaydi teslimat veya nakit uzlaşıyla kullanılan; <b>spot piyasa kurallarıyla<\/b> işlem gören araç. Menkul kıymetleştirilmiş opsiyon gibidir; işleyişi opsiyona, işlem kuralları paya benzer. BİAŞ'ta <b>pay piyasasında<\/b> işlem görür.<\/li>\n<li>Terimler: <b>kullanma<\/b> (hakkın işleme konulması), <b>varant primi<\/b> (alıcının baştan ödediği bedel), <b>kullanım fiyatı<\/b> (başta belirlenen alma veya satma fiyatı), <b>uzlaşı ödemesi<\/b> (kullanım fiyatı ile dayanak fiyatı farkının ödenmesi), <b>vade<\/b> (son kullanma tarihi), <b>dönüşüm<\/b> (kaydi veya nakdi), <b>işleme koyma fiyatı<\/b>, <b>dönüşüm oranı<\/b> (bir varantın kaç dayanak paya hak verdiği veya bir pay için kaç varant gerektiği).<\/li>\n<li><b>Türler (ihraççıya göre):<\/b> <b>yatırım kuruluşu varantı<\/b> (covered warrant; endeks, pay, sepet ve diğer enstrümanlara) ve <b>ortaklık varantı<\/b> (halka açık şirketin kendi paylarına). Türkiye'de ortaklık varantında <b>yalnız alım varantı<\/b> ihraç edilebilir (pay fiyatının düşürülmesini önlemek için). Konvertibl döviz, kıymetli maden, emtia ve uluslararası endekslere dayalı varant <b>SPK onayına<\/b> tabidir.<\/li>\n<li>Hak paydan oluşan araca ilişkinse <b>dayanak varlık<\/b>, endeks ise <b>dayanak gösterge<\/b>. Dayanak paylar <b>BIST 30<\/b>'dan seçilir.<\/li>\n<li><b>Dikkat:<\/b> varant alan dayanak payı almış olmaz; kâr payı, rüçhan, tasfiye payı, oy, yönetime katılma ve bilgi alma hakları yoktur.<\/li>\n<li>Kaldıraç sağlar, riskten korunmada kullanılabilir; kaldıraç nedeniyle beklenmeyen fiyat hareketinde risklidir.<\/li>\n<\/ul>\n\n<h3>Alım ve satım varantında kâr-zarar<\/h3>\n<table><tr><th><\/th><th>Alım (call) varantı<\/th><th>Satım (put) varantı<\/th><\/tr>\n<tr><td>Beklenti<\/td><td>Fiyat yükselecek<\/td><td>Fiyat düşecek<\/td><\/tr>\n<tr><td>Kullanılır<\/td><td>F > K<\/td><td>F < K<\/td><\/tr>\n<tr><td>Varant değeri<\/td><td>F − K<\/td><td>K − F<\/td><\/tr>\n<tr><td>Alıcı net kârı<\/td><td>F − K − P<\/td><td>K − F − P<\/td><\/tr>\n<tr><td>Kullanılmazsa<\/td><td>Alıcı zararı = satıcı kârı = P<\/td><td>Alıcı zararı = satıcı kârı = P<\/td><\/tr>\n<tr><td>Başabaş<\/td><td>F = K + P<\/td><td>F = K − P<\/td><\/tr>\n<tr><td>Alıcı kârı<\/td><td>Teorik olarak sınırsız<\/td><td>Dayanak sıfıra düşene kadar<\/td><\/tr>\n<\/table>\n<ul>\n<li>F: kullanım anında dayanak fiyatı, K: kullanım fiyatı, P: prim. Alıcının hakkı <b>seçimlik<\/b>; satıcı (ihraççı) yükümlüdür. Taraflar için <b>sıfır toplamlı<\/b>: birinin kârı diğerinin zararı.<\/li>\n<li>Örnek (kitap): K = 140, P = 4. Alımda F = 150 ise uzlaşı 10, net kâr 6; F = 200 ise 56; F = 100 ise kullanılmaz, zarar 4. Satımda F = 130 ise net kâr 6; F = 100 ise 36; F = 160 ise zarar 4.<\/li>\n<li>Paranın zaman değeri dikkate alınırsa başabaş noktası biraz ileri kayar.<\/li>\n<\/ul>\n<h4>Varant ve opsiyon<\/h4>\n<table><tr><th>Konu<\/th><th>Opsiyon<\/th><th>Varant<\/th><\/tr>\n<tr><td>Standart<\/td><td>Borsanın belirlediği standart sözleşme<\/td><td>İhraççı belirler, daha esnek<\/td><\/tr>\n<tr><td>Teminat<\/td><td>Teminat ve teminat tamamlama var<\/td><td>Yatırımcıdan teminat <b>istenmez<\/b>; sorumluluk ihraççıda<\/td><\/tr>\n<tr><td>Taraflar<\/td><td>Satan taraf opsiyonu yazar<\/td><td>Tek ihraççı; yatırımcı <b>yazan taraf olamaz<\/b><\/td><\/tr>\n<tr><td>Piyasa<\/td><td>Vadeli işlem piyasası<\/td><td><b>Spot<\/b> piyasa<\/td><\/tr>\n<tr><td>Vade<\/td><td>Standart vadeler<\/td><td>Standart vade yok<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Avantajlar:<\/b> asimetrik getiri (sınırlı zarar, sınırsız kâr), kaldıraç, düşük komisyon, piyasa yapıcı sayesinde likidite ve dar makas, <b>teminatsız<\/b> işlem (zarar yatırılan parayla sınırlı).<\/li>\n<li><b>Dezavantajlar:<\/b> klasik araçlardan farklı hareket (bilgi gerekir), sınırlı vade, her gün eriyen <b>zaman değeri<\/b>, aşırı kaldıraç riski.<\/li>\n<\/ul>\n<h4>Fiyatı etkileyen faktörler<\/h4>\n<ul>\n<li>Fiyatlamada <b>Black-Scholes<\/b> ve Black-Scholes-Merton yaygın; ayrıca Galai-Schneller, binom ve diğer modeller. Temel mantık kâr olasılığının bugünkü değeri.<\/li>\n<\/ul>\n<table><tr><th>Faktör artarsa<\/th><th>Alım varantı<\/th><th>Satım varantı<\/th><\/tr>\n<tr><td>Dayanak fiyatı<\/td><td>+<\/td><td>−<\/td><\/tr>\n<tr><td>İşleme koyma fiyatı<\/td><td>−<\/td><td>+<\/td><\/tr>\n<tr><td>Vadeye kalan gün<\/td><td>+<\/td><td>+<\/td><\/tr>\n<tr><td>Volatilite<\/td><td>+<\/td><td>+<\/td><\/tr>\n<tr><td>Faiz oranı<\/td><td>+<\/td><td>−<\/td><\/tr>\n<tr><td>Temettü<\/td><td>−<\/td><td>+<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Yunan harfleri:<\/b> <b>delta<\/b> dayanak fiyatına, <b>teta<\/b> vadeye kalan süreye, <b>gama<\/b> deltadaki değişime (dayanak fiyatına duyarlılıktaki hata), <b>vega<\/b> volatiliteye, <b>ro<\/b> faize duyarlılık.<\/li>\n<\/ul>\n\n<h3>Sertifikalar<\/h3>\n<ul>\n<li>Yapılandırılmış kaldıraçlı ürün; önceden belirlenen koşullarda ihraççıdan <b>alacak hakkı<\/b> verir; vade sonunda nihai değer ile kullanım fiyatı farkı üzerinden geri ödeme. Varanta benzer ama değer hesabı ve <b>nakavt<\/b> özelliğiyle ayrılır. Fonlar ihraççının şahsi mali sorumluluğundadır; ihraççının kredibilitesi önemlidir.<\/li>\n<li><b>İskontolu (discount):<\/b> dayanağa piyasa değerinden iskontolu yatırım; karşılığında <b>üst limit (cap)<\/b> ile azami getiri sınırlanır. Vade sonunda fiyat limitin üstündeyse limit getirisi, altındaysa dayanak fiyatı veya dayanağın kendisi.<\/li>\n<li><b>Turbo (long/short):<\/b> dayanak ile işleme koyma fiyatı farkı; <b>bariyere<\/b> ulaşınca nakavt olur, artık değer ödenebilir, itfa otomatik, borsa işlem sırasını <b>sürekli kapatır<\/b>. Fiyatlamada zaman değeri yerine <b>finansman maliyeti<\/b>; değeri içsel değerdir.<\/li>\n<li><b>Endeks sertifika:<\/b> göstergeye birebir bağlı, dönüşüm oranı (ör. 1/100) ve/veya kur ile çarpılarak geri ödeme; açık uçlu olabilir.<\/li>\n<li><b>Prim ödeyen (bonus):<\/b> dayanak vade boyunca bariyerin altına düşmezse önceden belirlenen primli tutar; düşerse dayanağın o anki fiyatı. Bariyer dayanak fiyatının altında, prim üstünde belirlenir.<\/li>\n<\/ul>\n\n<h3>VII-128.3 Tebliği<\/h3>\n<ul>\n<li>Önceki düzenlemeler: Seri III No:36 ortaklık varantı (21.01.2009; uygulaması olmadı) ve No:37 aracı kuruluş varantı (21.07.2009; büyük rağbet). <b>VII-128.3<\/b> <b>10.09.2013<\/b>'te yayımlanıp yürürlüğe girdi; 5 bölüm.<\/li>\n<li><b>Yenilikler:<\/b> tek Tebliğde birleştirme ve aracı kuruluş varantı adının <b>yatırım kuruluşu varantı<\/b> olması; yatırım kuruluşu sertifikalarının kapsama alınması; nitelikli yatırımcıya satış imkânı; dayanak olarak <b>devlet iç borçlanma senedi<\/b>; banka veya aracı kurum grubundaki başka şirketin ihraççı olabilmesi; ortaklık varantında <b>Amerikan tipi<\/b>; ortaklık varantında kaydi teslimat yanında pay ve nakdi uzlaşı; ortaklık varantlarının <b>%25<\/b>'inin halka arz edilmeksizin satılabilmesi.<\/li>\n<li><b>Ortaklık varantı:<\/b> payları borsada işlem gören veya görecek kayıtlı sermayeli ihraççının kendi paylarına ya da borsada işlem gören başka ortaklığın paylarına ilişkin, <b>halka arz sırasında<\/b> ihraç edilen araç.<\/li>\n<li><b>Yatırım kuruluşu varantı:<\/b> dayanağı belirli fiyattan alma veya satma hakkı; kaydi teslimat veya nakdi uzlaşı.<\/li>\n<li><b>Yatırım kuruluşu sertifikası:<\/b> turbo, iskontolu ve Kurulun uygun gördüğü diğerleri.<\/li>\n<li><b>Dayanak varlık:<\/b> BIST 30 payları veya sepeti; Kurul uygun görürse borsada işlem gören devlet iç borçlanma senetleri, konvertibl döviz, kıymetli maden, emtia. <b>Dayanak gösterge:<\/b> borsa pay endeksleri; Kurul uygun görürse uluslararası endeksler.<\/li>\n<li><b>Nakavt:<\/b> dayanağın bariyere ulaşması, aşması veya altında kalmasıyla değerin yitirilmesi. <b>Artık değer:<\/b> nakavtta izahnamede belirtilmişse ödenen tutar. <b>Bariyer:<\/b> geçersizlik (veya izahnamedeki başka amaç) seviyesi.<\/li>\n<li><b>Piyasa yapıcı:<\/b> kotasyon vermekle yükümlü, borsaca yetkilendirilmiş borsa üyesi aracı kurum. <b>Yetkili kuruluş:<\/b> halka arza aracılık yetkili aracı kurum ile yatırım ve kalkınma bankaları.<\/li>\n<\/ul>\n\n<h3>Yatırım kuruluşu varantı ve sertifikası ihracı<\/h3>\n<ul>\n<li><b>İhraççılar:<\/b> yatırım yapılabilir seviyenin <b>en yüksek ilk üç kademesine<\/b> denk uzun vadeli notu olan Türkiye'de veya yurt dışında yerleşik <b>banka ve aracı kurumlar<\/b>. Notu olmayan Türkiye'deki banka veya aracı kurum, bu notu taşıyan banka veya aracı kurum <b>garantisiyle<\/b> ihraç edebilir. Notlu kurumun şirketler topluluğundaki banka veya aracı kurum olmayan şirket de o kurumun garantisiyle ihraç edebilir. Yurt dışı ihraççıda yabancı araç düzenlemeleri de uygulanır.<\/li>\n<li><b>Ortaklık varantı ihraççıları:<\/b> payları borsada işlem gören ve borsaya başvurmuş ortaklıklar.<\/li>\n<li>İzahname veya ihraç belgesi onayı zorunlu; başvuru <b>yetkili organ kararından itibaren 3 ay<\/b> içinde. İzahname <b>birden fazla belgeden<\/b> oluşmak zorunda.<\/li>\n<li>İzahnamede: ihraççı ve garantörün mali durumu, risk yönetimi, garanti esasları, riskler ve satış esasları, dayanaktaki değişikliklerde işlemler, fiyat açıklamaları, bariyer değişiklikleri, nakavt ve artık değer, iskontolu sertifikada azami fiyat, piyasa yapıcılık, uzlaşı biçimi.<\/li>\n<li>Derecelendirme notu vade boyunca <b>yılda en az bir<\/b> gözden geçirilir. Satış sırasında not belirtilen seviyenin altına düşerse ihraççı ihracı durdurur; durdurmazsa Kurul durdurur ve yeni ihraca izin vermez; işlem gören varantlar <b>işlem görmeye devam eder<\/b>.<\/li>\n<li>Halka arzda geçerlilik süresince her tertip için satıştan en az <b>5 iş günü önce<\/b> SPAN veya arz programı sirküleri onayı için başvurulur. Nitelikli yatırımcıya veya yurt dışı ihraçta her tertip için tertip ihraç belgesi onayı. Satıştan vazgeçme derhal Kurula bildirilir.<\/li>\n<li><b>Satış:<\/b> halka arz veya halka arz edilmeksizin; <b>yurt içinde tahsisli satış yapılamaz<\/b>. Nitelikli yatırımcıya satılanlar da yetkili kuruluş vasıtasıyla satılır ve borsada işlem görür; işlem <b>piyasa yapıcılık<\/b> esaslı.<\/li>\n<li><b>Vade:<\/b> en az <b>2 ay<\/b>, en fazla <b>5 yıl<\/b>; satış süresi vadeyi geçmemek üzere serbest; vade başlangıcı satışa sunulan ilk gün. Nominal değer en az <b>1 kuruş<\/b>.<\/li>\n<li>BIST 30 paylı ve <b>kaydi teslimatlı<\/b> ihraçlarda işleme konu olacak paylar ortaklığın <b>fiili dolaşımdaki payının %20<\/b>'sini aşamaz; nakit uzlaşıda limit yok. BIST 30 dışı dayanaklarda <b>nakdi uzlaşı zorunlu<\/b>.<\/li>\n<li>İhraççılar <b>kendi sermayelerini temsil eden payları<\/b> dayanak yapamaz. Kurul genel ihraç limiti koyabilir; garantör için de geçerli olur.<\/li>\n<li>Yurt içinde MKK'da kayden ihraç zorunlu; yurt dışında da kural (toplu hesap ve Kurul muafiyeti mümkün); kayden ihraç yoksa bilgiler <b>3 iş günü<\/b> içinde MKK'ya.<\/li>\n<\/ul>\n<h4>Borsa işlem esasları (varant)<\/h4>\n<ul>\n<li>Avrupa ve Amerikan tipi, alım ve satım varantları işlem görür; aynı dayanağa birden fazla ihraççı olabilir. İhraççı, dayanak, vade, işleme koyma fiyatı ve türü aynı olanlar <b>aynı sırada<\/b>.<\/li>\n<li>Başvuruda ihraççı bir piyasa yapıcı belirler; piyasa yapıcı Borsa'nın <b>Piyasa Yapıcılık Taahhütnamesi<\/b>'ni imzalamadan başlayamaz; aykırılıkta Borsa Genel Müdürlüğü görevine son verir.<\/li>\n<li><b>Yapılandırılmış Ürünler ve Fon Pazarı<\/b>; pay piyasası sürekli işlem saatlerinde, sürekli işlem ve piyasa yapıcılı. <b>Baz fiyat yok<\/b>, alt-üst limit yok (serbest marj). Fiyat adımı her seviyede <b>1 kuruş<\/b>. 1 lot = 1 varant. <b>Kredili alım ve açığa satış yapılamaz<\/b>.<\/li>\n<li>Açılış ve kapanış seanslarında işlem yok; açılışta yalnız piyasa yapıcı kotasyonu için <b>2 dakikalık<\/b> bölüm. Her varantta en az bir piyasa yapıcı.<\/li>\n<li>Dayanak payın sırası kapanırsa varant da kapanır; sepette paylardan biri kapanırsa sepet varant kapanır; endekste paylar kapansa da endeks hesaplandıkça varant açık kalır.<\/li>\n<li>Piyasa yapıcı değişirse yeni atamaya kadar sıra durdurulur; süresinde atanmazsa vade sonuna kadar kapalı kalabilir. İhraççı yükümlülüğünü yerine getiremez, iflas veya konkordato talep ederse <b>tüm varantları<\/b> kapatılır.<\/li>\n<li><b>Takas<\/b> el değiştirme, <b>dönüşüm<\/b> vade sonu hak kullanımıdır. Borsanın sorumluluğu yoktur; hak kullanımında ödeme güçlüğü riski yatırımcıdadır ve <b>Garanti Hesabından karşılanmaz<\/b>; alım satım takasında Garanti Hesabı kullanılabilir.<\/li>\n<li>Son işlem günü kural olarak vade sonu (sirkülerde daha önce olabilir). Hak sahipleri <b>V+2<\/b>'de belirlenir, hak kullanımı en erken <b>V+3<\/b>'te başlar.<\/li>\n<li>Dönüşüm sonuçları: nakit uzlaşı; kaydi teslimat (alımda ihraççı pay, yatırımcı kullanım bedeli verir; satımda tersi); başabaş veya zararda aktarım yok.<\/li>\n<\/ul>\n<h4>Sertifikaların borsa esasları<\/h4>\n<ul>\n<li>Yapılandırılmış Ürünler ve Fon Pazarı veya Girişim Sermayesi Pazarı; varantlarla aynı saatler; baz fiyat yok; fiyat adımı 1 kuruş; takas <b>T+2<\/b>.<\/li>\n<li>Vadesi dolan veya (sepet ve endeks hariç) dayanağı kottan çıkan sertifika pazardan sürekli çıkarılır; nakavt veya kabul edilen erken itfa talebinde otomatik çıkarılır.<\/li>\n<\/ul>\n<h4>Piyasa yapıcılık<\/h4>\n<ul>\n<li>Nitelikli yatırımcıya satılanlar dahil, başvuruda bir aracı kurum piyasa yapıcı olarak bildirilir. Şartlar: <b>portföy aracılığı<\/b> izni ve iç kontrol için yıllık <b>özel amaçlı bağımsız denetim raporu<\/b>. Bu şartları taşıyan aracı kurum kendi ihracında piyasa yapıcı olabilir.<\/li>\n<li>İhraççı ile sözleşme; sürekli alım-satım kotasyonu zorunlu (olağanüstü ve mücbir hallerde kalkar, derhal borsaya bildirilir).<\/li>\n<li>Piyasa yapıcı değişirse ihraççı <b>3 iş günü<\/b> içinde yenisini bildirir; Kurul <b>5 iş günü<\/b> içinde aksini bildirmezse atanmış olur.<\/li>\n<li>Sorumluluğu kaldıran veya hafifleten sözleşme kaydı konamaz (rücu hakkı saklı). Yurt dışı ihraççıda özel durum, finansal raporlama ve bilgi gönderiminden ihraççı ile piyasa yapıcı <b>müteselsilen<\/b> sorumlu.<\/li>\n<li>İlke Kararı (2021): piyasa yapıcılık riskinden korunma için kendi veya ana ortaklık paylarında işlemler geri alım programı yükümlülüğünden istisna; geri alınan paylar sermayenin <b>%1<\/b>'ini aşamaz; aşan alımlar II-22.1'e uygun yapılır.<\/li>\n<\/ul>\n<h4>Nakavt ve kamuyu aydınlatma<\/h4>\n<ul>\n<li>Bariyere ulaşılır veya aşılırsa araç geçersiz olur; değer ödenmeden veya sıfıra yakın artık değerle sona erer. İhraççı KAP'ta ilan eder; otomatik kottan çıkar; artık değer <b>T+5<\/b>'i geçmeden ödenir.<\/li>\n<li>Halka arz edilenlerde dayanaktaki değişiklik nedeniyle haklardaki, bariyerdeki değişiklik ve nakavt <b>özel durum açıklamasıyla<\/b> duyurulur. Yurt dışı ihraççıda açıklama piyasa yapıcı aracılığıyla yapılır ve <b>2 iş günü<\/b> içinde ihraççının sitesinde de yayımlanır; izahname yeri tescili piyasa yapıcının bağlı olduğu ticaret siciline.<\/li>\n<\/ul>\n\n<h3>Ortaklık varantı<\/h3>\n<ul>\n<li><b>Yetki:<\/b> esas sözleşmede yetki hükmü ve <b>genel kurul kararı<\/b> (esas sözleşmede daha ağır nisap yoksa <b>TTK m.418<\/b>); yetki esas sözleşmeyle <b>yönetim kuruluna<\/b> devredilebilir. Kendi payları üzerine yazılı ihraç için <b>kayıtlı sermaye sistemi<\/b> zorunlu.<\/li>\n<li>Dayanak: kendi payları veya borsada işlem gören başka ortaklığın payları. Bir aracın halka arzı sırasında o aracı alanlara <b>bedelli veya bedelsiz<\/b> verilir.<\/li>\n<li><b>Bedelsiz:<\/b> aracı alanlara aldıkları miktarla <b>orantılı<\/b> verilmesi zorunlu. <b>Bedelli:<\/b> aracı almak varantı almayı gerektirmez; satış süresinde satılamayanlar <b>iptal<\/b>.<\/li>\n<li>İzahnamede belirtilirse ihraççı talebiyle <b>erken itfa<\/b> edilebilir.<\/li>\n<li>Bedelli varantların toplam nominalinin <b>%25<\/b>'i halka arz edilmeksizin satılabilir; ayrıca ihraç belgesi verilmez; alıcıların aracı alma zorunluluğu yok; bunların vadesi <b>1 yıldan az olamaz<\/b> ve kullanım fiyatı halka arz fiyatından aşağı olamaz.<\/li>\n<li>İlgili araç paysa paylar <b>sermaye artırımıyla<\/b> ihraç edilmeli. Paylarını <b>ilk defa<\/b> halka arz eden yalnız <b>kendi payları<\/b> üzerine varant çıkarabilir.<\/li>\n<li><b>Ayrı izahname yok<\/b>; bilgiler ilgili aracın izahnamesinde; başvuru yetkili organ kararından itibaren <b>3 ay<\/b> içinde.<\/li>\n<li><b>Satış:<\/b> nitelikli yatırımcıya satılanlar yetkili kuruluşla satılır ve borsada işlem görür; satış ilgili aracın halka arzına aracılık eden yetkili kuruluşla; vade <b>2 ay–5 yıl<\/b> (halka arz edilmeksizin satılanlarda en az 1 yıl); satış süresi ilgili aracın satış süresiyle sınırlı; vade başlangıcı aracın satışa sunulduğu ilk gün; nominal en az 1 kuruş.<\/li>\n<li>Borsaya ihraççı başvurur; halka arz edilmeksizin satılanlar da <b>yatırımcı sayısı sınırı olmadan<\/b> işlem görebilir. Aracılık işlem aracılığı izinli aracı kurumlarca; TSPB'nin belirlediği <b>risk bildirim formu<\/b> zorunlu. Bedelsiz ihraçta ilk gün baz fiyatı borsa belirler.<\/li>\n<li><b>Uzlaşı yöntemleri:<\/b> <b>kaydi teslimat<\/b> (payı kullanım fiyatından satın alma), <b>pay ile uzlaşı<\/b> (fark kadar pay), <b>nakdi uzlaşı<\/b> (fark kadar nakit). İhraççı birini zorunlu tutabilir. İhraççı portföyündeki varantlar kullanılamaz.<\/li>\n<li><b>Kullanım süresi:<\/b> vade sonunda kullanılıyorsa vade bitimini izleyen ilk iş günü başlar; <b>en az 5, en fazla 10 iş günü<\/b>. Vade içinde kullanılıyorsa izahnamede belirlenir.<\/li>\n<li><b>Kullanım oranı<\/b> vade boyunca <b>değiştirilemez<\/b>; artırım, temettü, birleşme gibi işlemlerde kullanım <b>fiyatı<\/b> düzeltilir ve özel durum açıklamasıyla duyurulur.<\/li>\n<li><b>Kendi payları, vade sonunda kullanım:<\/b> kaydi teslimat ve pay ile uzlaşıda kullanım süresinin başlangıcından en az <b>45 gün önce<\/b> tahsisli artırım ihraç belgesi başvurusu (pay miktarı tüm hakların kaydi teslimatla kullanılacağı varsayımıyla); en az <b>15 gün önce<\/b> özel durum açıklaması. Kullanılmayan paylar iptal.<\/li>\n<li><b>Kendi payları, vade içinde kullanım:<\/b> paylar izahname onayından önce ortakların yeni pay alma hakkı tamamen kısıtlanarak <b>hazır bekletilir<\/b>; devirler birincil piyasada; sonuçlar <b>her ay sonunu izleyen 3 iş günü<\/b> ve süre sonunda 3 iş günü içinde açıklanır; satılamayanlar iptal; süre sonundan <b>10 iş günü<\/b> içinde esas sözleşme tadili için Kurula, uygun görüşten sonra <b>15 iş günü<\/b> içinde tescil.<\/li>\n<li>Kullanımı engellemek için vade sonu yakınında (vade içi kullanımda vade boyunca) fiyatı düşürecek artırım, bölünme, tedavülü artırıcı işlemler yapılmaz (önce nakdi uzlaşı imkânı verilirse yapılabilir); kullanımı sağlamak için fiyatı yükseltecek sermaye azaltımı, geri alım gibi işlemler de yapılamaz. Giderler ihraççıya aittir.<\/li>\n<li>Başka ortaklık payında: payların nasıl temin edileceği izahnamede; en az <b>15 gün önce<\/b> özel durum açıklaması.<\/li>\n<li><b>Öncelik:<\/b> kendi payları üzerine yazılı varantların kullanımında ihraç edilecek paylar, <b>TTK m.461<\/b> yeni pay alma hakkı dahil her türlü önceliğin önünde varant sahiplerine tahsis edilir; tahsisli satış süre kuralları aranmaz.<\/li>\n<li><b>Sona erme:<\/b> kullanılmayan haklar kullanım süresi sonunda düşer, varantlar iptal; tasfiyesiz infisahta (birleşme) yükümlülükler devralana geçer; tasfiyede akıbet izahnamede yazılır.<\/li>\n<\/ul>", "sorular": [{"q": "Türkiye'de varantların işlem görmeye başlamasıyla ilgili hangisi doğrudur?", "o": ["13.08.2010'da Deutsche Bank'ın ihraç ettiği aracı kuruluş varantıyla", "2005'te bir ortaklık varantıyla", "2013'te TOKİ'nin ihracıyla", "2009'da İş Yatırım'ın ortaklık varantıyla", "1998'de Hazine'nin ihracıyla"], "a": 0, "e": "Türkiye'de varant işlemleri 13.08.2010'da Deutsche Bank'ın aracı kuruluş varantıyla başladı."}, {"q": "Pay senedine dayalı bir alım varantı satın alan yatırımcı aşağıdaki haklardan hangisine sahip olur?", "o": ["Kâr payı hakkı", "Dayanak payı önceden belirlenen fiyattan alma hakkı", "Yeni pay alma hakkı", "Oy hakkı", "Tasfiye bakiyesine katılma hakkı"], "a": 1, "e": "Varant yalnızca dayanağı alma veya satma hakkı verir; payın sağladığı ortaklık haklarını sağlamaz."}, {"q": "Türkiye'de ortaklık varantı olarak hangi tür ihraç edilebilir?", "o": ["Yalnız satım varantı", "Alım ve satım varantı", "Yalnız alım varantı", "Yalnız nakavt özellikli varant", "Yalnız endekse dayalı varant"], "a": 2, "e": "Ortaklık varantlarında yalnız alım varantı ihraç edilebilir; bu, şirket pay fiyatının düşürülmesini önlemeye yöneliktir."}, {"q": "Kullanım fiyatı 50 TL, primi 3 TL olan alım varantında vade sonunda dayanak fiyatı 58 TL ise alıcının net kârı ne kadardır?", "o": ["3 TL", "11 TL", "8 TL", "5 TL", "58 TL"], "a": 3, "e": "Net kâr = F − K − P = 58 − 50 − 3 = 5 TL."}, {"q": "Kullanım fiyatı 80 TL, primi 5 TL olan satım varantında vade sonunda dayanak fiyatı 90 TL ise alıcının durumu nedir?", "o": ["10 TL kâr", "5 TL kâr", "Başabaş", "15 TL zarar", "5 TL zarar"], "a": 4, "e": "F > K olduğundan satım varantı kullanılmaz; alıcı ödediği prim kadar, 5 TL zarar eder."}, {"q": "Kullanım fiyatı 120 TL, primi 6 TL olan bir alım varantının başabaş noktası (paranın zaman değeri ihmal edildiğinde) hangisidir?", "o": ["126 TL", "120 TL", "114 TL", "132 TL", "106 TL"], "a": 0, "e": "Alım varantında başabaş F = K + P = 120 + 6 = 126 TL'dir."}, {"q": "Aşağıdakilerden hangisi kitapta varantların avantajları arasında sayılmaz?", "o": ["Asimetrik getiri", "Vadenin sınırlı olması", "Kaldıraç imkanı", "Düşük işlem komisyonu", "Teminatsız işlem yapma olanağı"], "a": 1, "e": "Vadenin sınırlı olması bir dezavantajdır: vade sonunda kullanılmayan varant sona erer. Diğerleri kitapta sayılan avantajlardır."}, {"q": "Aşağıdaki faktörlerden hangisinin artması hem alım hem de satım varantının fiyatını artırır?", "o": ["Dayanak varlık fiyatı", "İşleme koyma fiyatı", "Volatilite", "Faiz oranı", "Temettü"], "a": 2, "e": "Vadeye kalan süre ve volatilite her iki varant türünün fiyatını da artırır."}, {"q": "Faiz oranlarının yükselmesi varant fiyatlarını nasıl etkiler?", "o": ["Alım artar, satım artar", "Alım azalır, satım artar", "Her ikisi azalır", "Alım artar, satım azalır", "Etkilemez"], "a": 3, "e": "Faiz ile alım varantı arasında pozitif, satım varantı arasında negatif ilişki vardır."}, {"q": "Varant fiyatının volatiliteye duyarlılığını ölçen katsayı hangisidir?", "o": ["Delta", "Teta", "Gama", "Ro", "Vega"], "a": 4, "e": "Vega volatiliteye, delta dayanak fiyatına, teta süreye, ro faize duyarlılığı ölçer."}, {"q": "Dayanak varlığın bariyer seviyesine gelmesiyle nakavt olan ve fiyatlamasında zaman değeri yerine finansman maliyeti kullanılan sertifika hangisidir?", "o": ["Turbo sertifika", "İskontolu sertifika", "Endeks sertifika", "Prim ödeyen sertifika", "Gayrimenkul sertifikası"], "a": 0, "e": "Turbo sertifikalar bariyerde nakavt olur ve değerleri içsel değerdir."}, {"q": "Yatırımcının dayanağa iskontolu yatırım yaptığı ancak getirisinin bir üst limitle (cap) sınırlandığı sertifika hangisidir?", "o": ["Turbo sertifika", "İskontolu sertifika", "Endeks sertifika", "Bonus sertifika", "Depo sertifikası"], "a": 1, "e": "İskontolu sertifikada yatırımcı iskonto karşılığında üst limiti aşan getiriden vazgeçer."}, {"q": "Yatırım kuruluşu varantı ihraç edebilmek için banka veya aracı kurumun sahip olması gereken uzun vadeli derecelendirme notu hangisidir?", "o": ["Yatırım yapılabilir seviyenin en alt kademesi", "Herhangi bir not", "Yatırım yapılabilir seviyenin en yüksek ilk üç kademesi", "Yalnız AAA", "Not şartı yoktur"], "a": 2, "e": "İhraççının yatırım yapılabilir seviyenin en yüksek ilk üç kademesine denk uzun vadeli notu olmalı; yoksa böyle bir kuruluşun garantisi gerekir."}, {"q": "Yatırım kuruluşu varantlarına ilişkin izahname onayı için Kurula başvuru, yetkili organ kararından itibaren en geç ne kadar sürede yapılmalıdır?", "o": ["1 ay", "2 ay", "6 ay", "3 ay", "1 yıl"], "a": 3, "e": "Başvuru yetkili organ kararının alındığı tarihten itibaren 3 ay içinde yapılmalıdır."}, {"q": "Yatırım kuruluşu varantlarının vadesi ile ilgili hangisi doğrudur?", "o": ["En az 1 ay, en fazla 2 yıl", "Vade sınırı yoktur", "En az 3 ay, en fazla 3 yıl", "En az 6 ay, en fazla 10 yıl", "En az 2 ay, en fazla 5 yıl"], "a": 4, "e": "Vade iki aydan az, beş yıldan fazla olamaz."}, {"q": "Dayanağı BIST 30 payı olan ve kaydi teslimatlı yatırım kuruluşu varantlarında işleme konu olacak paylar, ilgili ortaklığın fiili dolaşımdaki paylarının yüzde kaçını aşamaz?", "o": ["%20", "%10", "%5", "%25", "%50"], "a": 0, "e": "Sınır fiili dolaşımdaki payların %20'sidir; nakit uzlaşıda bu limit uygulanmaz."}, {"q": "Yatırım kuruluşu varantları ile ilgili hangisi yanlıştır?", "o": ["Borsada piyasa yapıcılık esasına göre işlem görür", "Yurt içinde tahsisli olarak satılabilir", "İhraççı kendi paylarını dayanak varlık olarak kullanamaz", "Nominal değeri 1 kuruştan aşağı olamaz", "BIST 30 dışı dayanaklarda nakdi uzlaşı zorunludur"], "a": 1, "e": "Yatırım kuruluşu varantları ve sertifikaları yurt içinde tahsisli olarak satılamaz."}, {"q": "Borsada varant işlemleriyle ilgili hangisi doğrudur?", "o": ["Baz fiyat uygulanır ve günlük fiyat limitleri vardır", "Varantlar açığa satışa konu edilebilir", "Fiyat adımı her seviyede 1 kuruştur ve baz fiyat yoktur", "Bir lot 100 varanttır", "Varantlar açılış seansında işlem görür"], "a": 2, "e": "Varantlarda baz fiyat ve limit yoktur, fiyat adımı 1 kuruştur, bir lot 1 varanttır; kredili alım ve açığa satış yapılamaz."}, {"q": "Varantlarda son işlem günü V ise hak sahipleri hangi gün belirlenir ve hak kullanımı en erken ne zaman başlar?", "o": ["V ve V+1", "V+1 ve V+2", "V+3 ve V+5", "V+2 ve V+3", "V+5 ve V+10"], "a": 3, "e": "Takas V+2'de tamamlanıp hak sahipleri belirlenir; hak kullanımı en erken V+3'te başlar."}, {"q": "Varant ihraççısının hak kullanımında ödeme güçlüğüne düşmesi halinde yatırımcının mağduriyeti için hangisi doğrudur?", "o": ["Borsa Garanti Hesabından karşılanır", "Yatırımcı Tazmin Merkezi öder", "Takasbank öder", "Piyasa yapıcı öder", "Risk tamamen yatırımcıya aittir; Garanti Hesabından karşılanmaz"], "a": 4, "e": "Hak kullanımındaki ödeme güçlüğünde risk yatırımcıdadır; Garanti Hesabı yalnız borsadaki alım satım takası için kullanılabilir."}, {"q": "Piyasa yapıcının değişmesi halinde ihraççının yeni piyasa yapıcıyı bildirme süresi ve Kurulun itiraz süresi hangisidir?", "o": ["3 iş günü ve 5 iş günü", "1 iş günü ve 3 iş günü", "5 iş günü ve 10 iş günü", "10 iş günü ve 15 iş günü", "Derhal ve 2 iş günü"], "a": 0, "e": "İhraççı 3 iş günü içinde yeni piyasa yapıcıyı bildirir; Kurul 5 iş günü içinde aksini bildirmezse atanmış olur."}, {"q": "Nakavt olan yatırım kuruluşu sertifikalarında artık değer yatırımcıya en geç ne zaman ödenir?", "o": ["T+1", "T+5", "T+3", "T+2", "T+10"], "a": 1, "e": "İhraççı artık değeri 5 iş gününü (T+5) geçmemek üzere yatırımcıya transfer eder."}, {"q": "Ortaklık varantında bedel karşılığı satılacak varantların halka arz edilmeksizin satışa sunulabilecek azami oranı ve bunların asgari vadesi hangisidir?", "o": ["%10 – 6 ay", "%20 – 1 yıl", "%25 – 1 yıl", "%25 – 2 ay", "%50 – 2 yıl"], "a": 2, "e": "Toplam nominalin %25'i halka arz edilmeksizin satılabilir; bunların vadesi 1 yıldan az olamaz."}, {"q": "Vade sonunda kullanılabilen ortaklık varantlarında kullanım süresi ile ilgili hangisi doğrudur?", "o": ["Vade bitiminde başlar, en az 2 en fazla 5 iş günüdür", "Süresi ihraççı tarafından sınırsız belirlenir", "Vadeden 15 gün önce başlar, 30 gün sürer", "Vade bitimini izleyen ilk iş günü başlar, en az 5 en fazla 10 iş günüdür", "Vade bitimini izleyen 45. gün başlar"], "a": 3, "e": "Kullanım süresi vade bitimini izleyen ilk iş günü başlar; 5 iş gününden az, 10 iş gününden fazla olamaz."}, {"q": "Kendi payları üzerine yazılı ortaklık varantlarının kullanımında ihraç edilecek paylarla ilgili hangisi doğrudur?", "o": ["Ortakların yeni pay alma hakkı varant sahiplerinden önce gelir", "Giderler varant sahiplerine aittir", "Paylar halka arz edilerek satılır", "Kullanım oranı vade boyunca değiştirilebilir", "Paylar TTK m.461'deki yeni pay alma hakkı dahil her türlü önceliğin önünde varant sahiplerine tahsis edilir"], "a": 4, "e": "Bu paylar her türlü önceliğin önüne alınarak varant sahiplerine tahsis edilir; giderler ihraççıya aittir."}]}, {"id": 8, "kisa": "Yabancı SPA ve Depo Sert.", "baslik": "Yabancı Sermaye Piyasası Araçları, Depo Sertifikaları ve Yabancı Yatırım Fonu Payları (VII-128.4)", "ozet": "Depo sertifikalarının türleri ve işleyişi; yabancı araçların Türkiye'de halka arzının ön şartları, temsilci, izahname beyanları, kamuyu aydınlatma ve finansal raporlama; yabancı yatırım fonlarının satış şartları ve fon temsilcisi.", "notlar": "<h3>Depo sertifikası: kavram<\/h3>\n<ul>\n<li><b>Depo sertifikası:<\/b> bir depo kuruluşuna depo edilen belirli miktar menkul kıymeti temsilen çıkarılan, o kıymetin tüm haklarına sahip ve ona <b>özdeş<\/b> menkul kıymet. Dayanak kıymetler ihraççının ülkesindeki saklama kuruluşunda tutulur.<\/li>\n<li>İlk olarak <b>1927<\/b>'de, İngiliz şirketlerinin yabancı borsalarda kote olmasının yasak olması nedeniyle Amerikalı yatırımcılar için ortaya çıktı.<\/li>\n<li>Adlandırma: ABD'de <b>ADR<\/b> (American Depositary Receipt), Avrupa'da <b>EDR<\/b>, çeşitli uluslararası piyasalarda <b>GDR<\/b>.<\/li>\n<li><b>Yatırımcıya faydalar:<\/b> işlem gördüğü piyasanın para biriminde alım satım; doğrudan yabancı kıymete göre <b>düşük maliyet<\/b>; yabancı yatırımcı kısıtlarını ve kendi yatırım kısıtlarını (emeklilik, sigorta fonları) aşma; risk azaltma (yerel takas, saat sorunları yok); saat ve kur farkıyla <b>arbitraj<\/b>. ADR'ler ABD'de ihraç edilmiş sayıldığından yabancı paya yatırım yasağı olan ABD kurumları alabilir; temettüler sertifika para birimine çevrilerek ödenir.<\/li>\n<li><b>İhraççıya faydalar:<\/b> uluslararası tanınırlık, yurt dışından sermaye artırımı, likidite, ABD piyasasına erişim (nitelikli kurumsal yatırımcılara tescil ve periyodik raporlama olmadan).<\/li>\n<\/ul>\n<h4>Türler<\/h4>\n<ul>\n<li><b>ADR:<\/b> dolar cinsinden ABD'de ihraç; SEC yükümlülüklerine bağlı olarak yalnız <b>Nitelikli Kurumsal Alıcılara (QIB)<\/b> satılabilir, OTC'de veya borsada işlem görebilir; QIB'lerdeki ve borsadakiler sermaye artırımıyla fon toplayabilir.<\/li>\n<li><b>Sponsorsuz ADR:<\/b> yatırımcı, broker-dealer ve depocu arasında; ihraççının katılımı yok (genelde itiraz etmediğine dair mektup alınır); <b>maliyetleri ADR sahipleri<\/b> üstlenir.<\/li>\n<li><b>Sponsorlu ADR:<\/b> uygulamada yaygın; yabancı şirket depocu ile sözleşme imzalar, <b>masraflar şirkete<\/b> aittir; depocu yatırımcı sorularını yanıtlar, raporları iletir, kâr payını öder, oy kullanmaya yardımcı olur; bilgi riski düşük. İhraççı ABD standartlarında tablo hazırlar veya farkları açıklar.<\/li>\n<li><b>EDR:<\/b> Avrupa merkezli banka çıkarır; <b>Euro<\/b> cinsinden; genelde <b>Londra ve Lüksemburg<\/b>'a kote; takas <b>Euroclear ve CEDEL<\/b>; SEC koşullarını sağlayamayan şirketler için.<\/li>\n<li><b>GDR:<\/b> ADR ve EDR karışımı; ABD ve Avrupa'dan fon; ABD'de ihraç edilen kısmı SEC'in ADR yükümlülüklerine tabidir.<\/li>\n<\/ul>\n<h4>İşleyiş ve taraflar<\/h4>\n<ul>\n<li>Dört taraf: <b>ihraççı firma<\/b>, ihraççı ülkedeki <b>saklama kuruluşu<\/b>, <b>uluslararası depocu banka<\/b>, <b>uluslararası takas kuruluşu<\/b>.<\/li>\n<li>Süreç: firma depocu bankayla <b>depozitör anlaşması<\/b> imzalar → payları ülkesindeki saklama kuruluşuna yatırır → saklama kuruluşu depocuyu bilgilendirir → depocu banka özdeş depo sertifikalarını ihraç eder → takas kuruluşuna veya müşteriye teslim.<\/li>\n<\/ul>\n\n<h3>Yasal çerçeve<\/h3>\n<ul>\n<li><b>1567 sayılı<\/b> Türk Parasının Kıymetini Koruma Hakkında Kanun m.1'e dayanan <b>32 sayılı Karar<\/b> (1989). 1993 değişikliğiyle m.15/(c): dışarıda yerleşiklerin Türkiye'de araç ihracı ve satışı sermaye piyasası mevzuatına göre yapılır.<\/li>\n<li>Tarihçe: Seri III No:20 (<b>1996<\/b>) → Seri VII No:14 yabancı fon (<b>1998<\/b>) → Seri III No:44 (<b>2010<\/b>) → <b>VII-128.4<\/b> (<b>23.10.2013<\/b>; 2015'te değiştirildi). Dayanak SPKn m.12, 13, 128/1-(e), 130/3 ve 32 sayılı Karar m.15/(c). Fon hükümleri <b>01.07.2014<\/b>'te yürürlüğe girdi. Tebliğ <b>9 bölüm<\/b>.<\/li>\n<li>Yenilikler: izahname beyanları; çıkar çatışması yoksa piyasa yapıcının temsilci olabilmesi; kamuyu aydınlatma yeniden düzenlendi; sorumluluk Kanunla uyumlu; fon temsilcisi banka veya geniş yetkili aracı kurum; fon şartları (10 milyon Avro, 2 milyon Avro, 3 yıl); sirküler yerine <b>yatırımcı bilgi formu<\/b>; fon paylarının MKK'da temsilci hesabında izlenmesi; temsilci ile fon ihraççısı arasında <b>tahkim<\/b> imkânı.<\/li>\n<\/ul>\n<h4>Kapsam<\/h4>\n<ul>\n<li>Kurula başvuru zorunlu işlemler: yabancı araç ve depo sertifikalarının halka arzı; paylar hariç yabancı araç ve depo sertifikalarının tahsisli ve/veya nitelikli yatırımcıya satışı; payları veya depo sertifikaları borsada işlem gören yabancı ortaklıkların tahsisli ve/veya nitelikli yatırımcıya satışları; yabancı fon paylarının satışı; borsada işlem gören yabancı ortaklıkların bedelli ve bedelsiz pay ihracı; yurt dışı borsalarda işlem gören yabancı ortaklık araçlarının borsada işlem görmeye başlaması.<\/li>\n<li><b>Yabancı ortaklık:<\/b> 32 sayılı Karardaki dışarıda yerleşik kişilerden ülke mevzuatına göre araç ihraç eden ortaklık. Fon benzeri kolektif yatırım kuruluşları yabancı ortaklık değil, <b>fon<\/b> hükümlerine tabidir.<\/li>\n<li><b>Yabancı sermaye piyasası aracı:<\/b> fon payları hariç; yabancı ortaklıklar, yabancı devletler ve mahalli idarelerce ihraç edilen araçlar. Yabancı devlet ve mahalli idare araçları için Kurul ücreti <b>binde sıfır<\/b>.<\/li>\n<li><b>Yabancı fon payının satışı:<\/b> bedel karşılığı satış ile pazarlama amaçlı bire bir veya toplu, her türlü iletişimle tanıtım ve yatırımcıyla ilişki kurmaya yönelik <b>her türlü faaliyet<\/b>.<\/li>\n<li><b>Uluslararası kuruluşlar<\/b> (Hazine, TCMB gibi kurumların üye veya ortak olduğu): ortaklık hakkı vermeyen araç satışı veya borsada işlem görmesi için yalnız <b>Kurula bilgi<\/b> verir; izahname hükümleri uygulanmaz; ihtiyari belge onaylanmaz; Kurul ücreti binde sıfır; özel durum, finansal raporlama ve denetim düzenlemelerine tabi değil; borsa KAP'ta duyuru yapar.<\/li>\n<li><b>Kapsam dışı:<\/b> Türkiye'de yerleşiklerin halka arz niteliği taşımadan yetkili kuruluşlarla yurt dışı piyasalarda işlem yapması; satış Türkiye'de olmamak, halka arz izlenimi vermemek kaydıyla <b>çalışanlara pay edindirme<\/b> planları.<\/li>\n<li><b>Kurul Kararı (27.02.2015):<\/b> yabancı <b>borsa yatırım fonu<\/b> alım satımı Tebliğ kapsamında. Temsilci olmayan yatırım kuruluşlarının sitelerinde ve platformlarında hiçbir yabancı fonun unvanı veya bilgisi ve yönlendirici ifade yer alamaz; yalnız genel finansal okuryazarlık bilgisi verilebilir. Kendi talebiyle başvuran yatırımcı işlem öncesi bilgilendirilir. Uyum son tarihi 31.03.2015.<\/li>\n<\/ul>\n\n<h3>Yabancı sermaye piyasası araçları<\/h3>\n<h4>Halka arz ön şartları<\/h4>\n<ul>\n<li>Borsa veya yetkili otorite tarafından yatırımcıyı koruma gerekçesiyle <b>reddedilmemiş<\/b> olması.<\/li>\n<li><b>TL<\/b> veya <b>TCMB'nin günlük kur ilan ettiği<\/b> yabancı para üzerinden düzenlenmiş olması.<\/li>\n<li>İhraç ülkesinde Türkiye'de satışa, ödemelere ve yönetimsel hakların kullanımına <b>kısıtlama olmaması<\/b>.<\/li>\n<li>Devri veya tedavülü kısıtlayan kayıt ya da ayni hak, hapis hakkı bulunmaması.<\/li>\n<li>Pay dışı ihraçlarda başvurudan önceki <b>1 yıl<\/b> içinde <b>yatırım yapılabilir<\/b> uzun vadeli not.<\/li>\n<li>Kurul ek şart getirebilir.<\/li>\n<\/ul>\n<h4>Temsilci<\/h4>\n<ul>\n<li>Halka arzda temsilci atanması <b>zorunlu<\/b>; tahsisli ve/veya nitelikli yatırımcıya satışta <b>isteğe bağlı<\/b>.<\/li>\n<li><b>Temsilci:<\/b> yabancı ortaklık, pay sahibi veya depocu kuruluşla sözleşme ilişkisi olan, Türkiye'de yerleşik <b>geniş yetkili aracı kurum<\/b> veya <b>kalkınma ve yatırım bankası<\/b>.<\/li>\n<li><b>Depocu kuruluş:<\/b> saklama kuruluşunda kendi adına ve sertifika sahipleri hesabına saklanan araçları temsilen depo sertifikası çıkaran <b>banka<\/b> veya geniş yetkili aracı kurum.<\/li>\n<li>Yazılı temsilcilik sözleşmesi şart (depo sertifikalı halka arzda depocu ile temsilci arasında; sahiplerince ilk halka arzda bu kişi ile temsilci arasında, yabancı ortaklık da imzalar). Süre en az aracın vadesi kadar; <b>60 gün önceden ihbarla<\/b> sona erdirilebilir; ihbar süresinde yeni temsilci atanıp Kurula bildirilir; iflas gibi hallerde derhal. Yükümlülükler yeni sözleşme Kurula sunulana kadar sürer.<\/li>\n<li>Depocu kuruluş temsilci niteliklerini taşıyorsa temsilci olabilir; piyasa yapıcı çıkar çatışması yoksa temsilci olabilir.<\/li>\n<li><b>Temsilcinin yükümlülükleri:<\/b> mali ve yönetimsel hakların kullandırılması; her ay sonu saklama kuruluşundaki araç ve sertifika miktarları, aylık alış-satış ve değiştirme miktarlarını gösteren bildirim formunun <b>ay sonunu izleyen bir hafta<\/b> içinde KAP'a gönderilmesi; yabancı ortaklığın ödeme açıklamasını izleyen <b>iş günü<\/b> depo sertifikası ödeme bilgisinin KAP'a gönderilmesi; ödemelerin yapılması; kamuyu aydınlatma; yurt dışındaki aynı nitelikli araçların <b>kapanış fiyatlarını günlük<\/b> kendi sitesinde duyurmak; izahnameyi imzalamak (depo sertifikalı halka arzda ihraççı yerine depocu imzalar).<\/li>\n<li>Depocu ile temsilci farklıysa yükümlülüklerden <b>müteselsilen<\/b> sorumludurlar.<\/li>\n<\/ul>\n<h4>Başvuru, izahname, sorumluluk<\/h4>\n<ul>\n<li>Yabancı ortaklık, depocu kuruluş veya temsilci Tebliğ Ek-1 ile Kurula; gerekiyorsa aynı zamanda borsaya başvurur. Kurul kaynaklı belgeler <b>Türkçe<\/b>, diğerlerinin Türkçe çevirisi; Kurul yeminli tercüme isteyebilir.<\/li>\n<li>Belgeler ilgili tebliğlere göre düzenlenir; II-5.1 m.28/2 uygulanmaz.<\/li>\n<li>İzahnamede: yurt dışı izahname ve ilan yerleri; döviz cinsinden ihraçta kur, kur etkisi ve giderler; sertifikanın dayanak araçla <b>değiştirilme<\/b> şekli ve süresi; ödeme esasları; nominali <b>100.000 TL ve üzeri<\/b> depo sertifikalarında UFRS veya Uluslararası Denetim Standartları kullanılmıyorsa farkların açıklanması; finansal raporların orijinal dil nüshalarının yeri; mali ve yönetimsel haklar ve MKK'da kullanımı; kote olduğu borsalar (değilse nedeni); saklama kuruluşu; performans bilgisi.<\/li>\n<li><b>İzahname ekindeki beyanlar:<\/b> Türkiye'deki sahiplerin yurt dışındakilerle <b>eşit haklara<\/b> sahip olduğu; uyuşmazlıklarda <b>Türk hukuku ve Türk mahkemeleri<\/b>; ülke yasal sistemi ve yükümlülüklere uyum; Türkiye'de satışa kısıtlama olmadığı; devir kısıtı olmadığı ve intifa hakkı olup olmadığı.<\/li>\n<li><b>Sorumluluk:<\/b> ihraççı SPKn m.10 ve 32'ye göre sorumlu; temsilci izahnameden m.10'daki <b>lider aracı kurum gibi<\/b> (ihraççıdan tazmin edilemezse kusuru oranında). Depo sertifikalı halka arzda ihraççı sorumluluğunu <b>depocu kuruluş da<\/b> taşır.<\/li>\n<li><b>Döviz cinsinden ihraç:<\/b> satış işlemleri <b>TL<\/b> üzerinden; anapara, faiz, kâr payı ve kupon ödemeleri aracın para biriminde veya TL olabilir.<\/li>\n<li><b>Kayden izleme:<\/b> yetkili saklama kuruluşunda MKK adına hesapta saklanan araçlar MKK'da hak sahibi bazında izlenir.<\/li>\n<\/ul>\n<h4>Depo sertifikasının saklanması ve değiştirilmesi<\/h4>\n<ul>\n<li>Tebliğdeki tanım: saklama kuruluşunda saklanan araçları temsilen depocu kuruluşun ihraç ettiği, aynı hakları veren, özdeş, nominali TL veya TCMB kuru ilan edilen yabancı para cinsinden araç. <b>Saklama kuruluşu:<\/b> ülkesinde saklamaya yetkili ve Kurulca uygun görülen kurum.<\/li>\n<li>Dayanak araçlar Kurula başvurudan <b>önce<\/b> saklama kuruluşunda depocu adına depo edilir; onaydan sonra sertifikalar MKK'da kayden ihraç edilir. Depocu kuruluşun <b>MKK üyesi<\/b> olması zorunlu.<\/li>\n<li>Saklama kuruluşunda MKK hesabı varsa araçlar orada saklanır ve aylık bildirim formunu MKK gönderir.<\/li>\n<li>Yabancı ortaklığın nakdi veya bedelsiz artırımında yeni paylar da depo sertifikası olarak çıkarılır.<\/li>\n<li>Sahibi istediğinde sertifika temsil ettiği araçla <b>değiştirilir<\/b>; esasları depocu belirler, izahnamede yazılır; Kurul değişiklik isteyebilir; MKK hesabında saklanıyorsa MKK'nın uygun görüşüyle.<\/li>\n<\/ul>\n<h4>Kamuyu aydınlatma, finansal raporlama, denetim<\/h4>\n<ul>\n<li>Yabancı ortaklıklar, benzer ve aynı pazardaki Türkiye'deki ortaklıkların kamuyu aydınlatma yükümlülüklerine (farklılaştırılanlar hariç) uyar. Özel durum açıklamalarının dili <b>Türkçe<\/b>; yurt dışı açıklamanın sitesi belirtilir.<\/li>\n<li>Kurulun kabul ettiği standartlar esas; <b>UFRS<\/b> veya AB'nin kabul ettiği hali bunlara uyum sayılır. Başka GKGMS için Kurul uygun görüşü gerekir; Kurul farkların açıklanmasını isteyebilir.<\/li>\n<li>Türkiye'de ilan edilecek tablolarda sunum para birimi <b>TL<\/b>. Benzer ortaklıkların tablo ve dipnot <b>formatlarına uyma zorunluluğu yok<\/b>.<\/li>\n<li>Açıklama süreleri benzer ortaklıklarınkiyle aynı. Yurt dışındaki azami süre <b>daha kısaysa<\/b>: TL sunumlu tablolar (dipnotsuz), sorumluluk beyanı ve denetim görüş sayfası çevirisi eş zamanlı, tam raporlar Kurul süresi içinde. Yurt dışı süre <b>daha uzunsa<\/b>: Kurul süresi içinde ne zaman açıklanacağını bildiren özel durum açıklaması; yurt dışıyla eş zamanlı özet; tam çeviri bundan itibaren en geç <b>10 iş günü<\/b> içinde.<\/li>\n<li><b>Bağımsız denetim:<\/b> Kurul esasları veya <b>IFAC<\/b> Uluslararası Denetim Standartları; Kurul listesindeki kuruluşlar veya bunların üye ya da iştiraki olduğu uluslararası kuruluşlar. Kurul uyum beyanı isteyebilir.<\/li>\n<li>Pay Tebliği'ndeki borsada işlem gören niteliğe dönüştürme hükümleri payları borsada işlem gören yabancı ortaklıklara <b>uygulanmaz<\/b>.<\/li>\n<li>Mali ve yönetimsel haklar yabancı ülke mevzuatına tabi. Depo sertifikalarında oy hakkı, sahipler talimat vermedikçe depocu tarafından vekil sıfatıyla <b>resen kullanılamaz<\/b>.<\/li>\n<li>Yabancı ortaklıklar Kurulun <b>kâr dağıtımı ve kurumsal yönetim<\/b> düzenlemelerinden (Kurul gerekli görmedikçe) muaftır. Zorunlu pay alım teklifinde <b>yatırımcı lehine<\/b> olan ülke mevzuatı uygulanır.<\/li>\n<\/ul>\n\n<h3>Yabancı yatırım fonları<\/h3>\n<ul>\n<li><b>Fon ihraççısı:<\/b> fonun kurucusu veya yöneticisi. Tebliğin fon bölümünde izahname, temsilci, ihraççı ve saklama kuruluşu kavramları fon izahnamesi, fon temsilcisi vb. anlamına gelir.<\/li>\n<\/ul>\n<h4>Fon şartları<\/h4>\n<ul>\n<li>Alım satım TL veya TCMB kuru ilan edilen yabancı para üzerinden.<\/li>\n<li>İhraççının ülkesinde satış için yetkili otorite <b>izni<\/b>; Türkiye'de satışa ve ödemelere kısıtlama olmaması.<\/li>\n<li>Payların yurt dışında satılmaya başlanmasından itibaren en az <b>3 yıl<\/b> geçmiş olması ve satılacak payların başvuru tarihindeki cari değerinin en az <b>2.000.000 Avro<\/b>.<\/li>\n<li>Fonun net varlık değerinin en az <b>10.000.000 Avro<\/b>.<\/li>\n<li>NAV'ın en az <b>%80<\/b>'i Türkiye'de yerleşik ihraççıların araçları ve Türk kamu borçlanma araçları <b>dışındaki<\/b> varlıklarda.<\/li>\n<li>Dışarıdan portföy yönetimi alınıyorsa yöneticinin ülkesinde yetki belgesi.<\/li>\n<li>NAV'ın <b>%10<\/b>'undan fazlası aynı kurum veya ortaklığın araçlarına yatırılmamış (kamu ihraçlarında en fazla <b>%35<\/b>).<\/li>\n<li>Tek başına bir ortaklıkta sermayenin veya oy haklarının <b>%10<\/b>'undan fazlasına sahip olmamak.<\/li>\n<li>Borçlanma ve ödünç verme ülke kuralları Türk fon mevzuatına uygun.<\/li>\n<li>Yılda en az bir kez uluslararası standartlarla hazırlanmış tabloların bağımsız denetimi.<\/li>\n<li>Kurula bilgi ve denetim imkânı veren <b>taahhütname<\/b> (masraflar fon ve/veya temsilciye ait).<\/li>\n<li>Şartlar kaybedilirse Kurul satışı geçici veya sürekli durdurabilir; sürekli durdurmada temsilci izahname yer bilgisinin sicilden <b>terkini<\/b> için Kurula başvurur.<\/li>\n<li>Türkiye'de <b>halka arz<\/b> için paylar kurulduğu ülkede halka arz edilmiş olmalı.<\/li>\n<\/ul>\n<h4>Fon temsilcisi ve saklama<\/h4>\n<ul>\n<li>Türkiye'de temsilci ve Tebliğ Ek-3 asgari içerikli yazılı sözleşme şart. Temsilci: <b>bankalar<\/b> veya Türkiye'de yerleşik <b>geniş yetkili aracı kurumlar<\/b>. Son 1 yılda 1 ay veya daha fazla faaliyet durdurma kararı olmamalı. Sözleşme biterse yükümlülükler yenisi Kurulca uygun görülene kadar sürer.<\/li>\n<li><b>Temsilcinin sorumlulukları:<\/b> Türkiye'deki pay sahiplerinin yurt dışındakilerle eşit hakları ve ödemelerin Türkiye'de yapılması; zamanında açıklama ve bildirimler, belgelerin doğruluğu; payların fonun esaslarına göre alım satımı; fon ödeme yapamazsa geri alım süresini izleyen en geç <b>2 iş günü<\/b> içinde bedelin <b>tam ve nakden<\/b> ödenerek payların geri alınması; kayıtların doğru tutulması ve uyumu.<\/li>\n<li><b>Fon saklama kuruluşu:<\/b> yurt dışında yetkilendirilmiş saklayıcı; varlıklar en az <b>bir<\/b> saklama kuruluşunda saklanır.<\/li>\n<\/ul>\n<h4>Başvuru ve satış<\/h4>\n<ul>\n<li>Temsilci; izahname, <b>yatırımcı bilgi formu<\/b> ve başvuru formuyla Kurula başvurur. Kurul ülke otoritesinden görüş isteyebilir; başvuru <b>banka<\/b> tarafından yapılmışsa <b>BDDK<\/b> görüşü alınır. Birden çok portföylü fonda her portföy ayrı fon sayılır.<\/li>\n<li>İzahname Türkçe, ayrıntılı, temsilci ve fon yetkililerince imzalı. Kurul <b>20 iş günü<\/b> içinde inceler; eksikler başvurudan itibaren 10 iş günü içinde bildirilir, <b>20 iş günü<\/b> içinde tamamlanır, süre tamamlanınca başlar.<\/li>\n<li>Onaylı izahnamede Türkiye'de satılacak <b>pay adedi<\/b> yer alır; üzerindeki satış da Kurul onayına tabi (bu durumda 3 yıl ve 2 milyon Avro şartı aranmaz).<\/li>\n<li>Onay tekeffül veya tavsiye değildir. Açıklamalar yetersiz veya yanıltıcıysa ya da temsilci şartları yoksa gerekçeli ret; onaylanmazsa satış yapılamaz.<\/li>\n<li>İzahname ve yatırımcı bilgi formu izin yazısının tebellüğünü izleyen <b>10 iş günü<\/b> içinde <b>KAP<\/b>'ta ve temsilcinin sitesinde yayımlanır; izahname tescil ve TTSG'de ilan edilmez ama <b>nerede yayımlandığı<\/b> tescil ve ilan edilir; tescil tarihi yatırımcı bilgi formunda yazılır.<\/li>\n<li><b>Yatırımcı bilgi formu:<\/b> fonun yapısı, stratejisi ve risklerini yansıtan özet form; doğruluk ve güncellikten temsilci sorumlu.<\/li>\n<li>Değişiklikler öğrenildiği tarihi izleyen <b>iş günü<\/b> Kurula bildirilir; Kurul kaydına girdiği tarihi izleyen <b>10 iş günü<\/b> içinde ilan edilir. Aykırılıkta satış durdurulabilir; savaş, doğal afet, ekonomik kriz, iletişim çöküşü gibi olağanüstü hallerde de durdurulabilir.<\/li>\n<li>Paylar yurt dışında temsilci adına toplu veya hak sahibi bazında, ayrıca <b>MKK'da temsilcinin alt hesabında<\/b> hak sahibi bazında izlenir. Alım satım <b>temsilci aracılığıyla<\/b>; paylar ancak fona veya yetki varsa temsilciye geri satılabilir.<\/li>\n<li><b>Tahsisli satış:<\/b> yalnız <b>nitelikli yatırımcılara<\/b>; izahname yerine <b>ihraç belgesi<\/b>; %80 yatırım şartı dışındaki ön şartlar aranmaz; ilan-tescil, yatırımcı bilgi formu ve kamuyu aydınlatma hükümleri uygulanmaz; temsilci nitelikli yatırımcı belgelerini tutar; bu fonlar <b>hiçbir şekilde ilan ve reklam veremez<\/b>.<\/li>\n<li><b>Kamuyu aydınlatma:<\/b> finansal raporlar, denetim raporu ve periyodik raporların aslı ile <b>Türkçe özetleri<\/b> KAP'ta (temsilci sorumlu); temsilcinin aylık tablosu en geç <b>izleyen ayın ilk haftası<\/b> içinde KAP'ta. Kurul ek bilgi ve ilan isteyebilir.<\/li>\n<li>Türkiye'de yerleşiklerin Tebliğ dışında Türk Parası Kıymetini Koruma mevzuatıyla yaptıkları yabancı fon işlemleri aracı kuruluşlarca <b>ay sonunu izleyen 6 iş günü<\/b> içinde Kurula bildirilir.<\/li>\n<\/ul>", "sorular": [{"q": "Depo sertifikalarının ilk ortaya çıktığı yıl ve neden hangisidir?", "o": ["1927 – İngiliz şirketlerinin yabancı borsalarda kote olmasının yasak olması", "1945 – Bretton Woods sistemi", "1971 – Altın standardının kalkması", "1987 – Borsa çöküşü", "1999 – Euro'nun kabulü"], "a": 0, "e": "Depo sertifikaları 1927'de İngiliz şirket paylarına yatırım yapmak isteyen Amerikalı yatırımcılar için ortaya çıktı."}, {"q": "Euro cinsinden ihraç edilen, genellikle Londra ve Lüksemburg borsalarına kote olan ve takası Euroclear ile CEDEL üzerinden yapılan depo sertifikası hangisidir?", "o": ["ADR", "EDR", "GDR", "Sponsorlu ADR", "IDR"], "a": 1, "e": "EDR Avrupa merkezli banka tarafından çıkarılır ve bu özellikleri taşır."}, {"q": "Sponsorsuz ADR ile ilgili hangisi doğrudur?", "o": ["Masrafları yabancı şirket üstlenir", "Depocu yatırımcılara tüm raporları göndermekle yükümlüdür", "İhraççının katılımı olmadan depocu tarafından çıkarılır ve maliyetleri ADR sahipleri üstlenir", "Uygulamada en yaygın türdür", "İhraççı ABD standartlarında tablo hazırlamak zorundadır"], "a": 2, "e": "Sponsorsuz ADR ihraççının katılımı olmadan çıkarılır; maliyetleri ADR sahipleri üstlenir. Uygulamada sponsorlu ADR daha yaygındır."}, {"q": "Depo sertifikası işlemlerinin dört tarafı arasında aşağıdakilerden hangisi yer almaz?", "o": ["Depo sertifikası ihraç etmek isteyen firma", "İhraççı ülkedeki saklama kuruluşu", "Uluslararası depocu banka", "Derecelendirme kuruluşu", "Uluslararası takas kuruluşu"], "a": 3, "e": "Dört taraf ihraççı firma, saklama kuruluşu, uluslararası depocu banka ve uluslararası takas kuruluşudur."}, {"q": "Dışarıda yerleşik kişilerin Türkiye'de menkul kıymet ihracının sermaye piyasası mevzuatına göre yapılacağını hükme bağlayan düzenleme hangisidir?", "o": ["5411 sayılı Bankacılık Kanunu", "6362 sayılı SPKn m.61", "6102 sayılı TTK m.418", "4749 sayılı Kanun m.7/A", "32 sayılı Karar m.15/(c)"], "a": 4, "e": "1567 sayılı Kanuna dayanan 32 sayılı Kararın 15/(c) bendi bu hükmü içerir."}, {"q": "Aşağıdakilerden hangisi VII-128.4 Tebliği kapsamı dışındadır?", "o": ["Satışı Türkiye'de gerçekleşmeyen ve halka arz izlenimi vermeyen çalışanlara pay edindirme planları", "Yabancı sermaye piyasası araçlarının halka arzı", "Yabancı fon paylarının satışı", "Yabancı borsa yatırım fonu alım satımı", "Borsada işlem gören yabancı ortaklığın bedelsiz pay ihracı"], "a": 0, "e": "Koşulları sağlayan çalışanlara pay edindirme planları kapsam dışıdır; yabancı borsa yatırım fonu işlemleri ise 2015 Kurul Kararına göre kapsamdadır."}, {"q": "Yabancı devletler ve mahalli idarelerin Türkiye'deki ihraçlarına uygulanan Kurul ücreti oranı hangisidir?", "o": ["Binde 0,5", "Binde sıfır", "Binde 1", "Binde 2", "On binde 5"], "a": 1, "e": "Yabancı devlet ve mahalli idar
