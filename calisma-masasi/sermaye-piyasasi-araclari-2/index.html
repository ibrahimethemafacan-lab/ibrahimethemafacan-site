in lira olan tahsisli satış şeklinde olur. Halka arz edilirse borsada işlem görmesi zorunlu. Uyum ilkeleri ihlal edilmişse, uyum sağlanana kadar yeni tertip çıkarılamaz.", "Tedavül limiti önemli bir sayı. Dolaşımdaki teminatlı menkul kıymet, ihraççının aktif toplamının yüzde onunu geçemez. Yatırım yapılabilir seviyenin en üst üç kademesinde notu olan bankalar ve finansal kuruluşlar için bu limit yüzde yüz artırılır, yani yüzde yirmiye çıkar. İpotek finansmanı kuruluşları için ise limit hiç yok.", "Teminat defteri, teminat varlıklarını ve türevleri ihraççının diğer mallarından ayırmak için tutulan kayıt sistemidir. Halka arzda izahname başvurusundan önce oluşturulmalı. Uyuşmazlıkta defter kayıtları esas alınır. Elektronik defter her güncellendiğinde Merkezi Kayıt Kuruluşuna gönderilir. Teminat varlıklar haczedilemez, rehnedilemez ve iflas masasına girmez.", "Teminat varlıklara gelince, varlık teminatlı tarafta tüketici ve ticari krediler, kiralama ve sigortalı faktoring alacakları, TOKİ alacakları, gayrimenkul yatırım ortaklığı alacakları var. İpotek teminatlı tarafta ise ipotekli konut kredileri, konut kiralama alacakları ve ipotekli ticari krediler. İkame varlıklar her ikisinde de var: nakit, Merkez Bankası likidite senetleri, devlet tahvilleri, Hazine kefaletli kağıtlar, OECD ülkelerinin devlet kağıtları. Mevduat bu listede yok.", "Türev araçlar faiz ve kur riskinden korunmak için deftere alınabilir. Karşı tarafın yatırım yapılabilir notu olmalı; birden fazla notu varsa en yüksek ikinci not esas alınır. Karşı taraf, ihraççı iflas etse bile sözleşmeyi tek taraflı feshedemez. Değerleme de sadece karşı tarafın verdiği fiyata dayanamaz.", "Şimdi bölümün kalbi: üç uyum ilkesi. Nominal değer uyumunda teminatların nominali menkul kıymetlerin nominalinden az olamaz ve türevler bu hesaba girmez. Nakit akımı uyumunda önümüzdeki bir yıl içinde teminattan gelecek faiz, ödenecek faizden az olamaz. Net bugünkü değer uyumunda ise teminatların bugünkü değeri yükümlülüklerden fazla olmalı; ipotek teminatlıda bu fazla en az yüzde iki.", "İpotek teminatlı ihraçta bazı kesintiler var. Konut kredisinde teminat değerinin yüzde sekseninin üstü, ipotekli ticari kredide yüzde ellisinin üstü hesaba katılmaz. İkame varlıklar toplamın yüzde on beşini aşamaz; deniz ve hava taşıtı dışındaki ticari krediler de yüzde on beşi aşamaz. Uyum en az ayda bir kontrol edilir.", "Stres testi ipotek teminatlıda her zaman, varlık teminatlıda ise para birimi ya da faiz türü farklıysa zorunlu. Şoklar şöyle: Türk lirası faizine artı eksi üç yüz baz puan, döviz faizine artı eksi yüz elli baz puan, döviz kuruna artı eksi yüzde otuz. Test en az ayda bir yapılır.", "Uyum bozulursa ihraççı bunu hemen teminat sorumlusuna bildirir ve bir ay içinde düzeltir. Bu süre boyunca teminattan gelen paralar ayrı bir hesapta tutulur ve sadece vadesi gelen borçlara kullanılır.", "Teminat sorumlusu, bilgi sistemleri denetimi yapmaya yetkili bir bağımsız denetim kuruluşudur. İhraçtan önce sözleşmeyle belirlenir. Şirketin kendi finansal tablolarını denetleyen kuruluş teminat sorumlusu olamaz; bu klasik bir tuzak. Teminat uyum raporunu halka arzda üç ayda bir, diğer ihraçlarda altı ayda bir hazırlar ve dönem sonundan itibaren yirmi iş günü içinde ihraççıya verir. Varlık sayısı beş yüzü aşıyorsa ya da ortalama anapara yirmi bin liranın altındaysa yüzde doksan beş güvenle örneklem kullanabilir.", "İhraççı iflas ederse, faaliyet izni kaldırılırsa ya da yönetimi kamuya devredilirse Kurul bir idareci atayabilir. İdareci borçları üstlenmeden teminatları yönetir, satabilir, yeni varlık alabilir, repo yapabilir. Gerekirse erken itfayı Kurula önerir. Gelir önce yatırımcılara gider.", "Kamuyu aydınlatmada yatırımcı raporu üç ayda bir hazırlanır ve dönem sonundan itibaren altı iş günü içinde ilan edilir. Teminat uyum raporu ise ihraççıya geldiği gün ilan edilir. Ödeme yapılamazsa bu da aynı gün açıklanır.", "Özetleyelim: birincisi, teminatlı menkul kıymet ihraççının genel yükümlülüğüdür ve varlıklar bilançoda kalır. İkincisi, tedavül limiti aktiflerin yüzde onu, yüksek notluda yüzde yirmi. Üçüncüsü, üç uyum ilkesi ve ipotek teminatlıda en az yüzde iki fazla. Dördüncüsü, stres testinde üç yüz, yüz elli baz puan ve yüzde otuz kur şoku. Beşincisi, şirketin denetçisi teminat sorumlusu olamaz. Şimdi sorulara geçebilirsin."], "5": ["Merhaba, faizsiz finans araçları ve kira sertifikaları bölümündeyiz. Bu bölüm iki katmanlı: önce faizsiz finansın kavramları, Arapça terimler ve tarihçe; sonra Kira Sertifikaları Tebliği. Terimleri doğru eşleştirmek burada puanı getiriyor.", "Faizsiz finans paranın zaman değerini tamamen reddetmez. Bir malın peşin fiyatıyla vadeli fiyatının farklı olması caizdir. Reddedilen, paranın kendisinin faizle alınıp satılmasıdır. İslam kuralları üç başlıktır: akideye ilişkin, şer'i yani hukuki ve ahlaki kurallar. Hukuk kuralları da ibadat ve muamelat diye ikiye ayrılır; finans kuralları muamelat içindedir.", "Dört yasağı ezberle. Riba faiz yasağıdır; borç veren hiç risk almadan önceden belirlenmiş bir getiri alamaz. Gharar, sözleşmenin esaslı unsurunda önemli belirsizliktir; kira süresi belli değilse gharar vardır. Haram, sözleşme konusunun meşru olmasıdır; alkol veya faiz üzerine sözleşme olmaz. Maysir ise spekülasyon ve kumar yasağıdır. Bunlara iki temel unsur eşlik eder: varlığa dayalı finansman ve kâr zarar ortaklığı.", "Karşılıksız yöntemler zekât, sadaka, vakıf ve karz-ı hasendir; karz-ı hasen faizsiz ödünçtür, aynı miktar geri alınır. Karşılıklı yöntemlerde mudaraba emek sermaye ortaklığıdır; bir taraf para, diğeri emek koyar ve zararın tamamını sermayedar üstlenir. Muşarakada ise herkes sermaye koyar ve zarara sermayesi oranında katılır. Murabaha bir satıştır: mal peşin alınıp kâr eklenerek vadeli satılır.", "İcara kiralamadır. İstisna siparişle mal yaptırmadır, ileride üretilecek bir şeyin satışıdır. Selem ise tam tersi gibi düşünebileceğin bir yapı: bedel peşin, ürün vadeli. Tarımda kullanılır, ürün misli olmalıdır; altın, gümüş, döviz ve çek gibi para benzerleri seleme konu olamaz.", "Tarihçede üç tarih var: ilk İslami banka bin dokuz yüz altmış üçte Mısır'da, ilk İslami sigorta şirketi bin dokuz yüz yetmiş dokuzda Sudan'da, ilk İslami bono bin dokuz yüz seksen üçte Malezya hükümeti tarafından çıkarıldı. Sıra banka, sigorta, bono; altmış üç, yetmiş dokuz, seksen üç.", "Kira Sertifikaları Tebliği iki bin on üç yılında çıktı ve Sermaye Piyasası Kanununun altmış birinci maddesine dayanır. Kira sertifikasını varlık kiralama şirketi ihraç eder. Varlık kiralama şirketi, sadece kira sertifikası çıkarmak için anonim şirket olarak kurulan bir sermaye piyasası kurumudur. Hazinenin dört bin yedi yüz kırk dokuz sayılı Kanuna göre çıkardığı kira sertifikaları ise bu Tebliğe tabi değil.", "Altı tür var: sahipliğe dayalı, yönetim sözleşmesine dayalı, alım satıma dayalı, ortaklığa dayalı, eser sözleşmesine dayalı ve hibrit. Sahipliğe dayalıda varlık şirkete devredilir; yönetim sözleşmesine dayalıda ise mülkiyet devredilmez, varlık sadece şirket lehine yönetilir. Bu farkı sınavda sorarlar.", "Yüzde doksan kuralı üç türde geçerli: sahipliğe dayalı, ortaklığa dayalı ve eser sözleşmesine dayalı ihraçta ihraç tutarı değerleme raporundaki gerçeğe uygun değerin yüzde doksanını aşamaz. Ortaklığa dayalıda ayrıca şirket lehine rehin kurulması zorunlu. Eser sözleşmesinde bedel peşin ödenirse yükleniciden teminat alınır.", "Alım satıma dayalı sertifikada hız önemli. Şirket, fonlar hesabına geçtikten sonraki iş günü varlığı spot piyasadan alıp vadeli satmak zorunda. Yapamazsa paralar en geç ikinci iş günü yatırımcıya iade edilir. Varlık da Borsa İstanbul gibi likit bir piyasada işlem görmeli.", "Kurul ücretleri vadeye göre: yüz seksen güne kadar on binde iki buçuk, bir yıla kadar on binde üç buçuk, iki yıla kadar on binde beş, daha uzunsa binde bir. Ama iki bin on altıdan beri kira sertifikalarında bu ücretlere yüzde elli indirim uygulanıyor.", "Kimler varlık kiralama şirketi kurabilir? Bankalar, aracı kurumlar, ipotek finansmanı kuruluşları, borsada işlem gören gayrimenkul yatırım ortaklıkları, kurumsal yönetimde birinci ve ikinci gruptaki halka açık şirketler, yatırım yapılabilir notu olan şirketler ve Hazinenin yüzde elli bir ortak olduğu şirketler. Son dört grup yalnız kendi finansmanı için şirket kurabilir.", "Pay devirlerinde yüzde on, yirmi, otuz üç ve elli eşikleri Kurul iznine tabidir; yönetim veya oy imtiyazlı payların devri ise her oranda izne tabidir. Eşik altındaki devirler on beş gün içinde Kurula bildirilir. Şirket kredi kullanamaz, borçlanamaz. Esas sözleşme onayından sonra bir yıl içinde ihraç başvurusu yapmazsa, bir ay içinde ya başvurur, ya faaliyet konusunu değiştirir ya da tasfiyeye girer.", "Yönetim kurulu en az üç kişi; en az biri bağımsız, en az biri Düzey üç lisanslı; üyelerde beş yıl tecrübe aranır. Fon kullanıcısı ile kurucu aynı şirketse, varlık satışı gibi önemli işlemler bağımsız üyenin olumlu oyuna bağlıdır. Şirket, sertifika sahiplerine ödeme yapılmadan isteğe bağlı olarak tasfiye edilemez.", "Yatırımcı raporu üç ayda bir yönetim kurulunca hazırlanır ve dönem sonundan itibaren beş iş günü içinde halka arzda Kamuyu Aydınlatma Platformunda yayımlanır. Varlık finansmanı ve teminatlı menkul kıymetlerde bu süre altı iş günüydü; burada beş, karıştırma.", "Özetleyelim: birincisi, dört yasak riba, gharar, haram ve maysir. İkincisi, mudarabada zarar sermayedarın, muşarakada sermaye payı oranında. Üçüncüsü, altmış üç Mısır, yetmiş dokuz Sudan, seksen üç Malezya. Dördüncüsü, altı tür sertifika ve yüzde doksan sınırı. Beşincisi, Kurul ücretinde yüzde elli indirim ve yatırımcı raporunda beş iş günü. Şimdi sorulara geçebilirsin."], "6": ["Merhaba, gayrimenkul sertifikaları bölümündeyiz. Bu araç, inşa edilen bir projenin bağımsız bölümlerini parça parça yatırımcıya satmanın sermaye piyasası yolu. Bölüm uzun ama mantığı basit: yatırımcı ya konutu alır ya da parasını alır.", "Tarihçeyle başlayalım. Gayrimenkule dayalı üç araç var: gayrimenkul yatırım fonu, gayrimenkul yatırım ortaklığı ve gayrimenkul sertifikası. Sertifika en eskisi. Bin dokuz yüz seksen dokuzda TOKİ'nin Halkalı konut sertifikaları vardı; her sertifika bir metrekareydi ama tutmadı. Bin dokuz yüz doksan beşte ilk tebliğ çıktı, yine ihraç yapılamadı. Bugünkü tebliğ iki bin on üçte geldi ve ilk ihracı TOKİ yaptı; sertifikalar iki bin on yedi Nisanından beri borsada işlem görüyor.", "Tanım şöyle: inşa edilecek ya da edilmekte olan projenin finansmanı için çıkarılan, projenin belirli bağımsız bölümlerini ya da belirli bir alan birimini temsil eden, nominal değeri eşit sermaye piyasası aracı. Hem projeye ortaklık veriyor hem de vadesi var; bu yüzden hibrit sayılıyor.", "İki anahtar kelime: asli edim ve tali edim. Asli edimde yatırımcı yeterli sertifikayı ihraççıya verir ve bağımsız bölümün tapusunu alır; yani gayrimenkule dönüşüm. Tali edimde ise asli edimi istemeyen yatırımcılar için bölümler satılır ve para sertifika oranında dağıtılır; yani nakde dönüşüm. Asli edim süresinde başvurmayan yatırımcı tali edimi istemiş sayılır.", "Satış yöntemleri: yurt içinde halka arz, nitelikli yatırımcıya satış ya da yurt dışı ihraç. Yurt içinde her iki durumda da borsada işlem görmek zorunlu. Halka arz edilenler Yapılandırılmış Ürünler ve Fon Pazarında, nitelikli yatırımcıya satılanlar Girişim Sermayesi Pazarında işlem görür. Kredili işlem ve açığa satış yasak.", "Özel sektör ihraççısında dört şart var. Bir: son beş yılda bu projenin satış değerinin en az yarısı büyüklüğünde bir proje tamamlamış olmak. İki: arsanın tek başına sahibi olmak ve kat irtifakı kurmuş olmak. Üç: özkaynakların sermayeden büyük olması. Dört: yatırım yapılabilir kredi notu. TOKİ ve İller Bankası ihraççı ise birinci, üçüncü ve dördüncü şartlar aranmaz.", "Edim sorumlusu bir bağımsız denetim kuruluşudur ve sözleşmesi Kurula başvurudan önce imzalanır. Edimlerin doğru yapılıp yapılmadığını, satış fiyatlarının uygunluğunu kontrol eder. Güvence raporunu halka arzda üç ayda bir, halka arz edilmeksizin ihraçta altı ayda bir hazırlar ve rapor aynı gün Kamuyu Aydınlatma Platformunda ilan edilir.", "Raporlarda kim neyi hazırlar, bunu karıştırma. Değerleme raporunu değerleme kuruluşu, fizibilite ve inşaat ilerleme raporlarını yapı denetim kuruluşu hazırlar. Yatırımcı raporunu ise ihraççı altı ayda bir yayımlar.", "Proje bitiş tarihinden önce tamamlanırsa ve bu bitişten en az on beş gün önce açıklanırsa yeni tarih geçerli olur. Sigorta yaptırılmışsa Kurul banka garantisi, nitelikli yatırımcı ve derecelendirme şartlarını aramaz. Ama borsada işlem zorunluluğu devam eder.", "Tali edimde satış parası, bölümlerin hepsi satılana kadar devlet tahvili, hazine bonosu ya da mevduatta değerlendirilir ve satış bitince iki iş günü içinde yatırımcıya aktarılır. Satılamayan bölümler için vadeden önceki üç ayın borsa ortalama fiyatı esas alınır ve ödeme on iş günü içinde yapılır. Tali edim süresi bitene kadar bölümler ihraççıya veya ilişkili taraflarına satılamaz.", "Proje gecikirse ihraççı on beş iş günü içinde fizibilite raporu hazırlatıp Kuruldan ek süre ister. Bu ek süre, zorlayıcı sebepler dışında, proje bitiş tarihinden itibaren yüz seksen günü geçemez. Proje hiç gerçekleşmezse ihraççı itfa bedelini ve cezai şartı öder.", "Ödeyemezse süreç şöyle işler: ilk iş günü Kurula bildirim ve özel durum açıklaması; otuz gün içinde fizibilite raporu ve toplantı ilanı; ilandan itibaren otuz gün içinde sertifika sahipleri toplantısı. Toplantıda nisap aranmaz, katılanların çoğunluğu karar verir: ya proje başkasına tamamlatılır ya da kalan fon ve yarım kalan kısım satılıp para dağıtılır.", "Fonun ihraççıya aktarımı yüzde yirmi beş, altmış beş, on kuralına bağlı. Yüzde yirmi beşi inşaat başlamadan, yüzde altmış beşi inşaat ilerledikçe, yüzde onu da tüm edimler bittikten sonra. Banka garantisi, teminat mektubu ya da tamamlama sigortası varsa fonun tamamı baştan aktarılabilir. Kurul ücreti binde iki ama yüzde elli indirimle binde bir.", "Kentsel dönüşüm tarafında hak sahiplerine sertifika verilebiliyor. İhraççılar TOKİ, İller Bankası, yetki devri alan belediyeler ve bunların belirlediği tüzel kişiler. Belediye ihraç yapacaksa Çevre ve Şehircilik Bakanlığının görüşüne ek olarak Hazine ve Maliye Bakanlığının izni gerekir. Proje bir yıldan fazla gecikirse sertifikalar en az ihraç değerinden itfa edilmek zorunda.", "Kamuyu aydınlatmada iki sayı yeter: edim süreleri başlangıçtan en az on gün önce açıklanır; emsal satış fiyatları ve geri alım fiyatları her ayın ilk iş günü açıklanır. Raporların sonuçları ise hazırlandıkları gün ilan edilir.", "Özetleyelim: birincisi, asli edim konut, tali edim nakit. İkincisi, ihraççıda beş yıl içinde yarı büyüklükte proje tecrübesi. Üçüncüsü, ek süre en fazla yüz seksen gün, başvuru on beş iş günü içinde. Dördüncüsü, fon aktarımında yirmi beş, altmış beş, on. Beşincisi, Kurul ücreti indirimle binde bir. Şimdi sorulara geçebilirsin."], "7": ["Merhaba, varantlar ve yatırım kuruluşu sertifikaları bölümündeyiz. Bu bölüm iki kafalı: bir yanda opsiyon mantığına dayalı kâr zarar hesapları ve fiyat faktörleri, öbür yanda Tebliğin süreleri ve oranları. İkisinden de soru gelir.", "Varant, bir dayanak varlığı önceden belirlenen fiyattan belirli bir tarihte ya da tarihe kadar alma veya satma hakkı veren bir araç. İşleyişi opsiyona benzer ama payla aynı sınıfta, spot piyasada işlem görür. Türkiye'de ilk varant iki bin on Ağustosunda Deutsche Bank tarafından çıkarıldı. Varant alan yatırımcı payı almış olmaz; ne kâr payı, ne oy hakkı, ne rüçhan hakkı vardır.", "İki tür var: yatırım kuruluşu varantı ve ortaklık varantı. Yatırım kuruluşu varantını bankalar ve aracı kurumlar çıkarır. Ortaklık varantını ise şirket kendi payları üzerine çıkarır ve Türkiye'de ortaklık varantı sadece alım varantı olabilir.", "Kâr zarar hesabı basit. Alım varantında dayanak fiyatı kullanım fiyatının üstündeyse varant kullanılır, net kâr fiyat eksi kullanım fiyatı eksi primdir. Değilse alıcı sadece primi kaybeder. Satım varantında tam tersi: dayanak fiyatı kullanım fiyatının altındaysa kullanılır, net kâr kullanım fiyatı eksi fiyat eksi primdir. Alım varantında başabaş noktası kullanım fiyatı artı prim, satımda kullanım fiyatı eksi prim.", "Bir örnek: kullanım fiyatı yüz kırk, prim dört lira. Pay yüz elliye çıkarsa alım varantı sahibi on lira alır, primi düşünce altı lira kâr eder. Pay yüze düşerse varantı kullanmaz, dört lira kaybeder. Unutma, bu sıfır toplamlı bir oyun: alıcının kârı ihraççının zararıdır.", "Opsiyonla farklara gelince: opsiyon borsanın standart sözleşmesidir, varantı ihraççı tasarlar. Opsiyonda teminat var, varantta yatırımcıdan teminat istenmez. Varantta yatırımcı yazan taraf olamaz, tek ihraççı vardır. Opsiyon vadeli işlem piyasasında, varant spot piyasada işlem görür. Varantın standart vadesi de yoktur.", "Fiyatı etkileyen faktörler tablosunu ezberle. Dayanak fiyatı artarsa alım değerlenir, satım değer kaybeder. Kullanım fiyatı artarsa tersi. Vadeye kalan süre ve volatilite arttıkça hem alım hem satım değerlenir. Faiz artarsa alım değerlenir, satım düşer. Temettü artarsa alım düşer, satım değerlenir. Yunan harflerinde delta fiyata, teta zamana, vega volatiliteye, ro faize duyarlılıktır.", "Sertifikalar dört tür. İskontolu sertifikada dayanağı indirimli alırsın ama getirin bir tavanla sınırlanır. Turbo sertifikada bir bariyer vardır; dayanak oraya değince sertifika nakavt olur ve sona erer. Endeks sertifika endeksi birebir izler. Prim ödeyen yani bonus sertifikada dayanak bariyerin altına düşmezse önceden belirlenen primli tutarı alırsın.", "Tebliğ iki bin on üç Eylülünde yürürlüğe girdi. Yatırım kuruluşu varantı çıkaracak banka ya da aracı kurumun yatırım yapılabilir seviyenin en üst üç kademesinde notu olmalı. Notu yoksa böyle bir kurumun garantisiyle çıkarabilir. Başvuru yetkili organ kararından itibaren üç ay içinde yapılır ve izahname birden fazla belgeden oluşmak zorunda.", "Sayılara bak: vade en az iki ay, en fazla beş yıl. Nominal değer en az bir kuruş. Kaydi teslimatlı ve BIST otuz paylarına dayalı ihraçlarda işleme konu paylar fiili dolaşımın yüzde yirmisini geçemez. BIST otuz dışındaki dayanaklarda nakit uzlaşı zorunlu. İhraççı kendi payını dayanak yapamaz. Ve yatırım kuruluşu varantı yurt içinde tahsisli olarak satılamaz.", "Borsada varantlar Yapılandırılmış Ürünler ve Fon Pazarında, piyasa yapıcılı sürekli işlemle alınıp satılır. Baz fiyat yok, fiyat limiti yok, fiyat adımı bir kuruş, bir lot bir varant. Kredili alım ve açığa satış yapılamaz. Açılışta sadece piyasa yapıcının kotasyon girdiği iki dakikalık bir bölüm var.", "Hak kullanımında takvim: vade günü V ise hak sahipleri V artı iki günde belirlenir, kullanım en erken V artı üçte başlar. İhraççı ödeme yapamazsa risk yatırımcıya aittir; borsa garanti hesabı bu durumu karşılamaz.", "Piyasa yapıcı portföy aracılığı izni olan bir aracı kurumdur. Değişirse ihraççı üç iş günü içinde yenisini bildirir, Kurul beş iş günü içinde itiraz etmezse atanmış olur. Nakavt olan sertifikada ihraççı artık değeri en geç beş iş günü içinde öder.", "Ortaklık varantında yetki için esas sözleşme hükmü ve genel kurul kararı gerekir; nisapta Türk Ticaret Kanununun dört yüz on sekizinci maddesi. Kendi payları üzerine çıkarmak için kayıtlı sermaye sistemi şart. Ayrı izahname yoktur, ilgili aracın izahnamesinde yer alır. Bedelsiz verilirse aldığın araçla orantılı verilir; bedelliyse satılamayanlar iptal edilir.", "Bedelli ortaklık varantlarının yüzde yirmi beşi halka arz edilmeksizin satılabilir; bunların vadesi en az bir yıl, kullanım fiyatı da halka arz fiyatından düşük olamaz. Vade sonunda kullanılan varantlarda kullanım süresi beş ila on iş günüdür. Kendi paylarında, kullanım süresinden en az kırk beş gün önce ihraç belgesi başvurusu, on beş gün önce özel durum açıklaması yapılır. Kullanım oranı vade boyunca değiştirilemez ve varant sahipleri yeni pay alma hakkı dahil tüm önceliklerin önüne geçer.", "Özetleyelim: birincisi, alım varantında kâr fiyat eksi kullanım eksi prim, satımda kullanım eksi fiyat eksi prim. İkincisi, süre ve volatilite her iki varantı da değerlendirir. Üçüncüsü, vade iki ay ile beş yıl, nominal bir kuruş, fiili dolaşımın yüzde yirmisi. Dördüncüsü, V artı iki ve V artı üç, artık değer için beş iş günü. Beşincisi, ortaklık varantında yüzde yirmi beş, bir yıl ve beş ila on iş günü. Şimdi sorulara geçebilirsin."], "8": ["Merhaba, yabancı sermaye piyasası araçları, depo sertifikaları ve yabancı yatırım fonları bölümündeyiz. Burada iki şey öğreneceksin: depo sertifikası nasıl çalışır ve yabancı bir aracın ya da fonun Türkiye'de satılabilmesi için hangi şartlar gerekir.", "Depo sertifikası, bir saklama kuruluşunda tutulan yabancı payları temsil eden ve onlarla aynı hakları veren, onlara özdeş bir menkul kıymettir. İlk kez bin dokuz yüz yirmi yedide çıktı; İngiliz şirketleri yabancı borsalarda kote olamadığı için Amerikalı yatırımcılara bu yol bulundu.", "Adlarını ayırt et: Amerika'da işlem görene ADR, Avrupa'dakine EDR, birden fazla uluslararası piyasadakine GDR denir. EDR Euro cinsindendir, genelde Londra ve Lüksemburg'a kote olur, takası Euroclear ve CEDEL üzerinden yapılır. GDR ise ADR ile EDR'nin karışımı gibidir.", "ADR'de sponsorlu ve sponsorsuz ayrımı var. Sponsorsuzda şirketin katılımı yoktur, masrafları sertifika sahipleri öder. Sponsorlu ADR'de ise şirket depocu bankayla sözleşme yapar, masrafları şirket öder ve depocu yatırımcıya raporları, kâr paylarını, oy bilgilerini iletir. Uygulamada sponsorlu olan daha yaygın.", "Depo sertifikası işleminin dört tarafı var: sertifika çıkarmak isteyen şirket, şirketin ülkesindeki saklama kuruluşu, uluslararası depocu banka ve uluslararası takas kuruluşu. Şirket payları kendi ülkesindeki saklama kuruluşuna yatırır, depocu banka da bunları temsilen sertifika çıkarır.", "Hukuki dayanağa gelince: Türk Parasının Kıymetini Koruma Hakkında otuz iki sayılı Karar, yabancıların Türkiye'deki ihraçlarının sermaye piyasası mevzuatına göre yapılacağını söyler. Bugünkü tebliğ iki bin on üçte çıktı ve dokuz bölümden oluşuyor. Yabancı devletlerin ve uluslararası kuruluşların ihraçlarında Kurul ücreti binde sıfır.", "Kapsam dışı olanları hatırla: Türkiye'de yerleşik birinin kendi isteğiyle yetkili kuruluş aracılığıyla yurt dışında işlem yapması ve şartları sağlayan çalışan pay edindirme planları. Ama yabancı borsa yatırım fonu işlemleri kapsamda. Temsilci olmayan aracı kurumlar sitelerinde hiçbir yabancı fonun adını veremez, yönlendirme yapamaz.", "Yabancı bir aracın Türkiye'de halka arz edilebilmesi için: başka bir otorite tarafından reddedilmemiş olmalı, Türk lirası ya da Merkez Bankasının kur ilan ettiği bir döviz cinsinden olmalı, Türkiye'de satışa ve ödemelere kısıtlama olmamalı, devir kısıtı bulunmamalı. Pay dışı araçlarda da son bir yılda yatırım yapılabilir kredi notu alınmış olmalı.", "Halka arzda temsilci zorunludur; tahsisli ya da nitelikli yatırımcıya satışta isteğe bağlıdır. Temsilci, Türkiye'de yerleşik geniş yetkili aracı kurum ya da kalkınma ve yatırım bankasıdır. Temsilcilik sözleşmesi altmış gün önceden ihbarla sona erdirilebilir. Temsilci, aylık bildirim formunu ay sonundan itibaren bir hafta içinde Kamuyu Aydınlatma Platformuna gönderir ve yurt dışındaki kapanış fiyatlarını her gün kendi sitesinde duyurur.", "İzahnamenin ekinde birkaç beyan şart: Türkiye'deki yatırımcının yurt dışındakilerle eşit haklara sahip olduğu, uyuşmazlıkta Türk hukuku ve Türk mahkemelerinin yetkili olduğu, satışa ve devre kısıt olmadığı. Sorumlulukta ihraççı birinci derecede sorumlu; temsilci ise lider aracı kurum gibi, ihraççıdan tahsil edilemeyen zarardan kusuru oranında sorumlu. Depo sertifikalı halka arzda depocu kuruluş da ihraççı sorumluluğunu taşır.", "Döviz cinsinden ihraçta satış Türk lirası üzerinden yapılır; faiz ve kâr payı ödemeleri ise döviz ya da Türk lirası olabilir. Depo sertifikası istendiğinde temsil ettiği yabancı payla değiştirilir. Depocu kuruluş Merkezi Kayıt Kuruluşu üyesi olmak zorunda. Oy hakkını ise sertifika sahipleri talimat vermedikçe depocu kendiliğinden kullanamaz.", "Finansal raporlamada uluslararası finansal raporlama standartları kabul ediliyor, ama Türkiye'de ilan edilen tablolarda para birimi Türk lirası olmalı. Yabancı şirketler yerli şirketlerin tablo formatlarına uymak zorunda değil ve kâr dağıtımı ile kurumsal yönetim düzenlemelerinden muaflar. Özel durum açıklamaları ise Türkçe yapılır.", "Yabancı yatırım fonlarında sayılar önemli. Fonun net varlık değeri en az on milyon Avro, Türkiye'de satılacak payların değeri en az iki milyon Avro, payların yurt dışında satışa başlamasının üzerinden en az üç yıl geçmiş olmalı. Fon varlıklarının en az yüzde sekseni Türk varlıkları dışında olmalı; tek bir ihraççıya yüzde ondan fazla yatırım yapılamaz, kamu ihraçlarında bu sınır yüzde otuz beş. Fon tek bir şirkette de yüzde ondan fazla paya sahip olamaz.", "Fon temsilcisi bir banka ya da geniş yetkili aracı kurumdur. Fon ödeme yapamazsa temsilci, geri alım süresinden sonra en geç iki iş günü içinde payları nakden geri almak zorunda. Kurul izahnameyi yirmi iş gününde inceler; başvuruyu banka yaptıysa Bankacılık Düzenleme ve Denetleme Kurumunun görüşü alınır. Onaydan sonra on iş günü içinde izahname ve yatırımcı bilgi formu yayımlanır.", "Tahsisli satışta yabancı fon payları sadece nitelikli yatırımcılara satılır, izahname yerine ihraç belgesi hazırlanır ve bu fonlar hiç reklam yapamaz. Temsilcinin aylık tablosu da izleyen ayın ilk haftası içinde Kamuyu Aydınlatma Platformunda ilan edilir.", "Özetleyelim: birincisi, ADR Amerika, EDR Avrupa, GDR küresel; sponsorsuzda masraf yatırımcıda. İkincisi, halka arzda temsilci zorunlu, sözleşme altmış gün ihbarla biter. Üçüncüsü, satış Türk lirasıyla, ilan edilen tablolar Türk lirası cinsinden. Dördüncüsü, fonda on milyon Avro, iki milyon Avro, üç yıl ve yüzde seksen. Beşincisi, fon temsilcisi iki iş günü içinde geri alım yapar. Şimdi sorulara geçebilirsin."], "9": ["Merhaba, projeye dayalı menkul kıymetler bölümündeyiz. Bu araç büyük altyapı ve enerji projelerinin finansmanı için var. Yapı, varlık finansmanı fonlarına çok benziyor; o yüzden sana özellikle farklı olan sayıları göstereceğim, çünkü sınavda tuzak tam orada.", "Düzenleme iki bin yirmi yılında yedi bin iki yüz yirmi iki sayılı Kanunla Sermaye Piyasası Kanununa eklenen altmış bir B maddesine dayanıyor. Tebliğ iki bin yirmi bir Temmuzunda yürürlüğe girdi. Proje finansman fonu, projeye dayalı menkul kıymet karşılığı toplanan parayla, yatırımcılar hesabına inançlı mülkiyet esasına göre kurulan, tüzel kişiliği olmayan bir malvarlığıdır. Amaç, yatırımcının proje yüklenicisinin riskinden bağımsız bir ürüne sahip olması.", "Dayanak iki türlü olabilir: projenin gelirleri ve hakları, ya da bankaların ve geniş yetkili aracı kurumların projelere verdiği teminatlı kredilerden doğan alacaklar. Proje de uzun vadeli, sermaye yoğun kamu hizmeti projesi demek: ulaşım, enerji, altyapı, sağlık, haberleşme gibi.", "Fonu kimler kurabilir? Sadece bankalar ve geniş yetkili aracı kurumlar. Kurucuda son üç yılda bir ay veya daha uzun faaliyet durdurma kararı olmamalı; varlık finansmanında bu süre bir yıldı. Fon Türkiye'de kurulur, adında proje finansman fonu ibaresi geçer ve yalnızca nakit yönetimi için, varlıklarının yüzde birini geçmeyecek kadar borçlanabilir.", "Başvuru takvimi: Kurul eksiksiz başvuruyu yirmi iş gününde sonuçlandırır. Onaylanan içtüzük altı iş günü içinde tescil edilir. Tescilden sonra altı ay içinde ihraç başvurusu yapılmalı; bu süre bir defaya mahsus altı ay uzatılabilir. Varlık finansmanında uzatma üç aydı, burada altı ay, bunu karıştırma.", "İhraç şekilleri tanıdık: halka arz, nitelikli yatırımcıya satış, birim nominali en az yüz bin lira olan tahsisli satış ya da yurt dışı ihraç. Yurt içi ihraç tek seferde yapılır. Halka arzda kredi derecelendirmesi ve borsa başvurusu zorunlu.", "İhraç tavanı bölümün en önemli kısmı. Genel kural, proje maliyetinin yüzde yetmiş beşi. Kalan en az yüzde yirmi beşi kaynak kuruluşun özkaynağından gelmeli; kaynak kuruluş özel amaçlı şirketse ya da yeni kurulduysa ortaklarının özkaynağından. Belediyeler, kamu iktisadi teşebbüsleri, yap işlet devret ve kamu özel iş birliği projelerinde ya da idarenin garanti ettiği gelirlerde tavan yüzde seksene kadar çıkabilir. İhale yapılmışsa sözleşmedeki tutar esas alınır.", "Öngörülemeyen bir ek maliyet çıkarsa ek fizibiliteyle tavanın yüzde yirmisine kadar ek tavan verilebilir. Bu durumda kaynak kuruluş ek tavanın en az yüzde yirmi beşi kadar özkaynak koyar ve yeni kağıtlar önce on beş iş günü boyunca mevcut yatırımcılara teklif edilir.", "Kurul ücreti iki kademeli: vadesi üç yüz altmış dört güne kadar olanlarda on binde beş, daha uzun olanlarda binde bir. Ücret izahname fona teslim edilmeden önce ödenir.", "Fon kurulu en az üç kişi; en az biri bağımsız, en az biri Düzey üç lisanslı, üyelerde beş yıl tecrübe aranır. Türev işlemi yapılacaksa risk yönetimini kuracak fon kurulu üyesinin hem Düzey üç hem Türev Araçlar lisansı olmalı. Fon denetçisi Düzey üç lisanslı olur; raporları takvim yılını izleyen üç ay içinde sunar.", "Hizmet sağlayıcı projenin ilerlemesini ve maliyet durumunu üç ayda bir fon kuruluna raporlar. Bağımsız denetim kuruluşu hizmet sağlayıcıyı yılda bir inceler; varlık finansmanında bu altı ayda birdi. Hizmet sağlayıcı değişirse kayıtları ve parayı en geç beş iş günü içinde devreder.", "Portföyde projenin şartları önemli: bağımsız fizibilite yapılmış, izin ve ruhsatlar alınmış, çevresel etkiler değerlendirilmiş ve proje Türkiye'de olmalı. İpotekli kredilerde ipotek birinci derecede olmalı. Türev karşı tarafının birden fazla notu varsa en yüksek not esas alınır; teminatlı menkul kıymetlerde en yüksek ikinci nottu. Varlıklar ihraçtan sonra bir ay içinde fona devredilir.", "Nakit iki şekilde aktarılır: doğrudan aktarımda beklemeden yatırımcıya, dolaylı aktarımda belirlenen vadelere kadar fonda bekletilerek. Proje gelirlerine dayalı ihraçta toplanan paranın yüzde on beşi ihraçtan hemen sonra, kalan yüzde seksen beşi altı aylık ilerleme raporlarına göre kaynak kuruluşa aktarılır. Kredi alacaklarına dayalı ihraçta ise para doğrudan aktarılabilir.", "Proje gecikirse kaynak kuruluş on beş iş günü içinde fizibilite raporu hazırlatıp Kuruldan ek süre ister. Proje gerçekleşmezse teminatlar hemen nakde çevrilir ve hesapta kalan parayla birlikte yatırımcılara dağıtılır. Belgeler, menkul kıymetler itfa edildikten sonra on yıl saklanır.", "Kamuyu aydınlatmada neredeyse her şey altı iş günü: içtüzük, görev değişiklikleri, derecelendirme notları ve üç ayda bir yatırımcı raporu. Halka arzda KAP'taki fon bilgileri değişirse iki iş günü içinde güncellenir.", "Özetleyelim: birincisi, kurucular banka ve geniş yetkili aracı kurum, son üç yıl şartı. İkincisi, altı ay artı altı ay başvuru süresi. Üçüncüsü, tavan yüzde yetmiş beş, kamu projelerinde yüzde seksen, ek tavan yüzde yirmi. Dördüncüsü, Kurul ücreti on binde beş ya da binde bir. Beşincisi, yüzde on beş artı yüzde seksen beş aktarım ve on yıl saklama. Şimdi sorulara geçebilirsin."], "10": ["Merhaba, kitabın son bölümündeyiz: sermaye piyasası araçlarının teminatlı ihracı. Bu bölüm kısa ama süre dolu. Temel fikir şu: tahvil çıkaran şirket bazı varlıklarını bağımsız bir teminat yöneticisine devreder; şirket ödemezse teminat yöneticisi hiç vakit kaybetmeden bu varlıkları satıp yatırımcıya dağıtır.", "Dayanak, iki bin yirmi yılında yedi bin iki yüz yirmi iki sayılı Kanunla eklenen otuz bir B maddesi. Tebliğ ise iki bin yirmi bir Temmuzunda, projeye dayalı menkul kıymet tebliğiyle aynı gün yürürlüğe girdi. Amaç, yurt dışında trust ya da yed-i emin denilen kurumu Türkiye'ye getirmek. Klasik rehinde paraya çevirme yıllar sürebiliyor; burada süreç hızlanıyor, bu da şirketlerin daha düşük faizle borçlanmasını sağlıyor.", "En önemli cümle şu: temerrüt halinde teminat yöneticisi ihbar, ihtar, süre verme, mahkeme izni ya da açık artırma gibi hiçbir ön şart aramadan varlıkları satabilir. Tebliğ borçlanma araçları ve Kurulun uygun gördüğü diğer araçlar için geçerli; yani pay ya da varant değil, tahvil ve bono düşün.", "Teminatlı ihraç kural olarak isteğe bağlı, ama Kurul şirketin durumuna göre zorunlu tutabilir. Teminatlı ihraç için ayrı bir tavan alınır ve o tavandaki her ihraç teminatlı olmak zorunda. Varlıkların devri satıştan en geç bir iş günü önce tamamlanır ve bu durum satıştan önce Kamuyu Aydınlatma Platformunda duyurulur.", "Hangi varlıklar teminat olabilir? Nakit, devlet tahvilleri ve Hazine kira sertifikaları, Yıldız Pazar payları, bankaların özkaynağa sayılmayan borçlanma araçları, ilk talepte ödenen banka teminat mektupları, yatırım fonu payları, kıymetli madenler, varlığa ve ipoteğe dayalı menkul kıymetler, sigortalı taşınır rehni varlıkları ve sigortalı taşınmazlar. Projeye dayalı menkul kıymet bu listede yok, dikkat et.", "Varlıklar kural olarak Türkiye'de olmalı; Hazinenin döviz tahvilleri, devlet iç borçlanma senetleri ve Hazine kira sertifikaları bu kuralın istisnası. Taşınmazlarda iki ayrı değerleme raporu alınır ve düşük olan değer esas alınır. Bir varlık haczedilir ya da yok olursa şirket üç iş günü içinde aynı değerde yenisini koyar.", "Teminat varlıkları teminat yöneticisinin kendi malvarlığından ayrıdır; onun borçları için haczedilemez, iflas masasına girmez. Banka hesabı açarken bankanın onayı alınır, banka on beş iş günü içinde onay vermezse para başka bankaya taşınır. Teminat yöneticisinin masrafları teminattan karşılanamaz; zorunlu bir kesinti olursa şirket üç iş günü içinde farkı tamamlar.", "Teminat yönetim sözleşmesi tavanın tamamı için tek seferde ya da her tertip için ayrı ayrı yapılabilir. İhraçtan sonra yatırımcının alacağını etkileyecek bir değişiklik ancak borçlanma aracı sahipleri kurulunun kararıyla yapılabilir.", "Sözleşmenin feshinde üç beş üç kuralını ezberle. Teminat yöneticisi varlıkları sözleşmeye aykırı kullanırsa şirket bunu öğrendikten sonra üç iş günü içinde bildirir; teminat yöneticisi beş iş günü içinde düzeltmezse şirket üç iş günü içinde sözleşmeyi fesheder. Bağımsızlığı bozan bir durum otuz gün içinde giderilmezse sözleşme kendiliğinden sona erer. Her durumda şirket beş iş günü içinde yeni bir teminat yöneticisi bulur.", "Temerrütte süreler varlığa göre değişiyor. Döviz en geç ertesi iş günü Türk lirasına çevrilip ödenir. Varlığa dayalı menkul kıymetler vadelerinde tahsil edildikçe ödenir. Taşınmaz gibi değerleme gerektiren varlıklarda paraya çevirme işlemine en geç otuz beş gün içinde başlanır. Diğer varlıklar beş iş günü içinde paraya çevrilir.", "Para yetmezse oransal ödeme yapılır: satış tutarı bölü toplam yükümlülük, çarpı her bir tahvilin alacağı. Örneğin teminattan altmış milyon lira geldi, borç seksen milyon ise oran yüzde yetmiş beş; bin liralık tahvile yedi yüz elli lira ödenir.", "Teminat yöneticisi kim olabilir? Genel saklama yetkisi olan ve Kurulca onaylanıp ilan edilen yatırım kuruluşları. Bağımsızlık için: şirketle ilişkili taraf olamaz; tedavüldeki tutarın yüzde otuzu veya fazlası kadar halka arz aracılığı yapamaz ya da borç ilişkisi kuramaz; birbirlerine kefalet veya garanti veremezler. Birim yöneticisi Düzey üç lisanslı ve beş yıl deneyimli olmalı.", "Teminat raporu ihraçtan sonra her altı ayda bir ve temerrüt gibi hallerde on iş günü içinde hazırlanır, imzayı izleyen iş günü Kamuyu Aydınlatma Platformunda teminat yöneticisi tarafından açıklanır. Teminatın değeri yüzde yirmi beşten fazla düşerse ve sonra her ilave yüzde yirmilik düşüşte özel durum açıklaması gerekir.", "Kayıtlar tarafında teminat yöneticisi her ihraç için ayrı bir teminat defteri tutar. Defter, sözleşmeler ve kararlar on yıl saklanır. Teminat yöneticisinin unvanı da şirket tarafından ilk satıştan önce ticaret siciline tescil edilir; değişirse üç iş günü içinde.", "Özetleyelim: birincisi, temerrütte ön şartsız satış yetkisi. İkincisi, varlıklar satıştan bir iş günü önce devredilir, taşınmazda iki rapordan düşük olanı. Üçüncüsü, fesihte üç, beş, üç; bağımsızlıkta otuz gün; yeni yönetici için beş iş günü. Dördüncüsü, temerrütte döviz ertesi gün, diğerleri beş iş günü, değerlemeli varlıklar otuz beş gün. Beşincisi, yüzde otuz bağımsızlık sınırı ve on yıl saklama. Bununla kitabı bitirdin; şimdi sorulara geçebilirsin."]};
</script>
<script>
(function(){
const L="ABCDE";
const KEY="d1004-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2","#4F46E5","#BE185D","#15803D","#B45309","#0369A1","#9333EA","#0F766E","#C2410C","#1D4ED8"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("d1004"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){
  const s=S[si], col=HUE[si];
  const tab=st.tab[si]||"notlar";
  const f=st.tab["f"+si]||"tum";
  const x=secStats(si), kb=s.sorular.filter(q=>q.k).length;
  let h=`<div style="--c:${col};display:contents">
  <div class="crumb"><a href="#genel">Genel bakış</a> / Bölüm ${s.id}</div>
  <section class="hero"><div><span class="pill">Bölüm ${s.id} / ${S.length} · ${s.sorular.length} soru</span><h1>${esc(s.baslik)}</h1><p>${esc(s.ozet)}</p></div>${ring(x.c,x.n,col,"doğru")}</section>
  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,S.length>8?2:3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();
  const list=st.karma.list, x=statsOf(list,st.karma.ans);
  let h=`<div class="crumb"><a href="#genel">Genel bakış</a> / Karma deneme</div>
  <section class="hero" style="--c:#141A2B"><div><span class="pill">Tüm bölümler · ${list.length} soru</span><h1>Karma deneme</h1><p>Her bölümden en az ${S.length>8?"iki":"üç"} soru içeren rastgele set. Buradaki cevaplar bölüm skorlarını etkilemez.</p></div>${ring(x.c,list.length,"#0E8F7E","doğru")}</section>
  ${bar(x,`<button class="btn pri" data-newkarma="1">Yeni set oluştur</button>`)}<div class="qlist">`;
  const saved=st.ans; st.ans=st.karma.ans;
  list.forEach(([s,qi],n)=>{h+=qCard(s,qi,n+1,true)});
  st.ans=saved;
  return h+`</div>`;
}

function renderHome(){
  let tA=0,tC=0;S.forEach((s,i)=>{const x=secStats(i);tA+=x.a;tC+=x.c});
  let h=`<section class="hero"><div><span class="pill">SPL 1004 · Sermaye Piyasası Araçları 2</span><h1>Sermaye Piyasası Araçları 2 Sınav Defteri</h1>
  <p>İhraç, satış ve özel sermaye piyasası araçlarına ilişkin tebliğler için bölüm notları ve notlardan hazırlanmış özgün sorular.</p>
  <div class="row" style="margin-top:18px"><a class="btn pri" href="#b1">Bölüm 1'den başla</a><a class="btn" href="#karma">Karma deneme</a></div></div>${ring(tC,TOTAL,"#0E8F7E","toplam doğru")}</section>
  <div class="tiles"><div class="tile"><span>Yanıtlanan</span><b>${tA}<small style="font-size:14px;color:var(--muted)"> / ${TOTAL}</small></b></div><div class="tile"><span>Doğru</span><b style="color:var(--ok)">${tC}</b></div><div class="tile"><span>Başarı oranı</span><b>${tA?"%"+Math.round(tC/tA*100):"–"}</b></div></div>
  <div class="sec-h"><h2>Bölümler</h2><span class="stat">${TOTAL} soru</span></div>
  <div class="grid">`;
  S.forEach((s,i)=>{const x=secStats(i);const kb=s.sorular.filter(q=>q.k).length;h+=`<a class="card" href="#b${s.id}" style="--c:${HUE[i]}"><div class="top"><span class="no">Bölüm ${s.id}</span><span class="stat">${s.sorular.length} soru</span></div><span class="t">${esc(s.kisa)}</span><span class="d">${esc(s.ozet)}</span>${meter(x.a,x.c,x.n)}<span class="p"><span>${x.c}/${x.n} doğru</span><span>${x.a} yanıt</span></span></a>`});
  h+=`</div>
  <section class="facts"><h2>Sınav öncesi son bakış</h2><dl>
  <div><dt>Usulsüz halka arz cezası</dt><dd>2–5 yıl hapis, 5.000–10.000 gün adli para</dd></div>
  <div><dt>İzahname geçerliliği</dt><dd>İlk yayımdan itibaren 12 ay</dd></div>
  <div><dt>İhraç belgesi geçerliliği</dt><dd>Kurul karar tarihinden itibaren 1 yıl</dd></div>
  <div><dt>İzahname inceleme süresi</dt><dd>10 iş günü; ilk halka arzda 20 iş günü</dd></div>
  <div><dt>Fiyat aralığında tavan</dt><dd>Tabanın en fazla %20 fazlası</dd></div>
  <div><dt>Asgari tahsisat</dt><dd>Yurt içi bireysel %10, kurumsal %10</dd></div>
  <div><dt>İlk halka arzda borsada satış</dt><dd>Piyasa değeri 750 milyon TL ve altı</dd></div>
  <div><dt>VİDMK risk tutma</dt><dd>Nominalin %5&#x27;i, vade sonuna kadar</dd></div>
  <div><dt>TMK tedavül limiti</dt><dd>Aktif toplamının %10&#x27;u (yüksek notluda %20)</dd></div>
  <div><dt>Kira ve gayrimenkul sertifikası</dt><dd>Kurul ücretinde %50 indirim</dd></div>
  </dl></section>`;
  return h;
}

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b(\d+)$/.exec(r);
  if(m&&+m[1]>=1&&+m[1]<=S.length) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const PK="d1004-ses-v1";
let pref={rate:1,voice:"",follow:true,mode:"podcast"};
try{const r=localStorage.getItem(PK);if(r)pref=Object.assign(pref,JSON.parse(r))}catch(e){}
const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(pref))}catch(e){}};

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["VİDMK", "varlığa veya ipoteğe dayalı menkul kıymet"],["GKGMS", "genel kabul görmüş muhasebe standartları"],["SPAN", "sermaye piyasası aracı notu"],["VDMK", "varlığa dayalı menkul kıymet"],["İDMK", "ipoteğe dayalı menkul kıymet"],["İTMK", "ipotek teminatlı menkul kıymet"],["VTMK", "varlık teminatlı menkul kıymet"],["PDMK", "projeye dayalı menkul kıymet"],["BDDK", "Bankacılık Düzenleme ve Denetleme Kurumu"],["TCMB", "Türkiye Cumhuriyet Merkez Bankası"],["TOKİ", "Toplu Konut İdaresi"],["BİAŞ", "Borsa İstanbul Anonim Şirketi"],["BIST", "Borsa İstanbul"],["DSYO", "değişken sermayeli yatırım ortaklığı"],["DİBS", "devlet iç borçlanma senedi"],["ISIN", "uluslararası menkul kıymet tanımlama numarası"],["UFRS", "Uluslararası Finansal Raporlama Standartları"],["TFRS", "Türkiye Finansal Raporlama Standartları"],["IFAC", "Uluslararası Muhasebeciler Federasyonu"],["ISRS", "Uluslararası İlgili Hizmetler Standardı"],["TSPB", "Türkiye Sermaye Piyasaları Birliği"],["OECD", "Ekonomik İşbirliği ve Kalkınma Örgütü"],["SPK", "Sermaye Piyasası Kurulu"],["KAP", "Kamuyu Aydınlatma Platformu"],["MKK", "Merkezi Kayıt Kuruluşu"],["MKS", "Merkezi Kayıt Sistemi"],["İBD", "ihraççı bilgi dokümanı"],["VFF", "varlık finansmanı fonu"],["KFF", "konut finansmanı fonu"],["İFK", "ipotek finansmanı kuruluşu"],["KFK", "konut finansmanı kuruluşu"],["VYŞ", "varlık yönetim şirketi"],["TMK", "teminatlı menkul kıymet"],["VKŞ", "varlık kiralama şirketi"],["PFF", "proje finansman fonu"],["GYO", "gayrimenkul yatırım ortaklığı"],["GYF", "gayrimenkul yatırım fonu"],["PYŞ", "portföy yönetim şirketi"],["OKS", "otomatik katılım sistemi"],["SPF", "Sermaye Piyasası Faaliyetleri"],["ADR", "Amerikan depo sertifikası"],["EDR", "Avrupa depo sertifikası"],["GDR", "küresel depo sertifikası"],["SEC", "ABD Menkul Kıymetler ve Borsa Komisyonu"],["QIB", "nitelikli kurumsal alıcı"],["TMS", "Türkiye Muhasebe Standartları"],["KİT", "kamu iktisadi teşebbüsü"],["KÖİ", "kamu özel iş birliği"],["SPV", "özel amaçlı kuruluş"],["NAV", "net varlık değeri"],["VUK", "Vergi Usul Kanunu"],["TCK", "Türk Ceza Kanunu"],["RG", "Resmî Gazete"],["MK", "Medeni Kanun"],["TL", "Türk lirası"],["SPKn","Sermaye Piyasası Kanunu"],["TTSG","Türkiye Ticaret Sicili Gazetesi"],["TRİK","teminat, rehin, ipotek ve kefalet"],["YİB","yatırımcı ilişkileri bölümü"],["KYBF","Kurumsal Yönetim Bilgi Formu"],["URF","Uyum Raporu"],["KSS","kurumsal sosyal sorumluluk"],["NBD","net bugünkü değer"],["KGK","Kamu Gözetimi Kurumu"],["KYD","kurumsal yönetim derecelendirme"],["TTK","Türk Ticaret Kanunu"],["YK","yönetim kurulu"],["GK","genel kurul"],["KY","kurumsal yönetim"],["PD","piyasa değeri"],["FD","fiili dolaşımdaki"],["GM","genel müdür"],["SP","sermaye piyasası"],["ÇSY","çevresel, sosyal ve kurumsal yönetim"],["AB","Avrupa Birliği"],["ABD","Amerika Birleşik Devletleri"],["SOX","Sarbanes Oxley"]];
function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}
  t=t.replace(/(\p{Ll})[’'](\p{L})/gu,"$1$2").replace(/\s+/g," ");
  return t.trim();
}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;
}
function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){
  const vs=synth.getVoices();const tr=trVoices();
  return vs.find(v=>v.name===pref.voice)||tr[0]||null;
}
function fillVoices(){
  if(!synth)return;
  const vs=synth.getVoices();const tr=trVoices();const list=tr.length?tr:vs;
  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth){return}
  let si=curSi>=0?curSi:(qSi>=0?qSi:0);
  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}
  playing=true;speak();
}
function pause(){playing=false;utt=null;synth.cancel();ui()}
function stop(finished){playing=false;utt=null;if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}
  navByPlayer=false;ui();
});
window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
})();

</script>
