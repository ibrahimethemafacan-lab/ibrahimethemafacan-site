elerin araçları ile uluslararası kuruluş işlemlerinde Kurul ücreti binde sıfırdır."}, {"q": "Yabancı ortaklıkların pay dışındaki ihraçlarında aranan derecelendirme şartı hangisidir?", "o": ["Başvurudan önceki 6 ay içinde herhangi bir not", "Son 3 yılda en az AA notu", "Başvurudan önceki 1 yıl içinde yatırım yapılabilir seviyede uzun vadeli not", "Derecelendirme şartı yoktur", "Yalnız ulusal not"], "a": 2, "e": "Pay dışı ihraçlarda başvurudan önceki bir yıl içinde yatırım yapılabilir seviyede uzun vadeli not gerekir."}, {"q": "Yabancı sermaye piyasası araçlarının satışında temsilci atanması ile ilgili hangisi doğrudur?", "o": ["Her durumda isteğe bağlıdır", "Yalnız depo sertifikalı ihraçlarda zorunludur", "Yalnız nitelikli yatırımcıya satışta zorunludur", "Halka arzda zorunlu, tahsisli ve nitelikli yatırımcıya satışta isteğe bağlıdır", "Temsilci yurt dışında yerleşik olmalıdır"], "a": 3, "e": "Halka arzda temsilci atanması zorunludur; tahsisli ve nitelikli yatırımcıya satışta isteğe bağlıdır."}, {"q": "Yabancı sermaye piyasası araçlarında temsilcilik sözleşmesinin ihbarla sona erdirilebilmesi için asgari ihbar süresi nedir?", "o": ["15 gün", "30 gün", "45 gün", "90 gün", "60 gün"], "a": 4, "e": "Sözleşme 60 gün önceden ihbar edilmek şartıyla sona erdirilebilir."}, {"q": "Temsilcinin saklama kuruluşundaki araç ve depo sertifikası miktarlarını gösteren aylık bildirim formunu KAP'a gönderme süresi hangisidir?", "o": ["Ay sonunu izleyen bir hafta içinde", "Ay sonunu izleyen iş günü", "Ay sonunu izleyen 10 iş günü içinde", "Ay sonunu izleyen 15 gün içinde", "Üç ayda bir"], "a": 0, "e": "Bildirim formu ay sonunu izleyen bir hafta içinde KAP'a gönderilir."}, {"q": "Yabancı sermaye piyasası araçlarının halka arzında temsilcinin izahnameden sorumluluğu nasıldır?", "o": ["Hiç sorumlu değildir", "SPKn m.10'daki lider aracı kurum gibi, zarar ihraççıdan tazmin edilemezse kusuru oranında sorumludur", "İhraççıyla birlikte birinci derecede sorumludur", "Yalnız kasıtlı hallerde sorumludur", "Yalnız Kurula karşı sorumludur"], "a": 1, "e": "Temsilci, lider aracı kurum gibi ikincil ve kusur esaslı sorumludur."}, {"q": "Aşağıdakilerden hangisi yabancı sermaye piyasası aracı izahnamesi ekindeki beyanlar arasında yer almaz?", "o": ["Türkiye'deki sahiplerin yurt dışındakilerle eşit haklara sahip olduğu", "Uyuşmazlıklarda Türk hukuku ve Türk mahkemelerinin yetkili olduğu", "Aracın getirisinin garanti edildiği", "Aracın devrini kısıtlayan kayıt olmadığı", "Türkiye'de satışa kısıtlama olmadığı"], "a": 2, "e": "Getiri garantisi beyanı yoktur; diğerleri izahname ekindeki zorunlu beyanlardır."}, {"q": "TCMB'nin günlük kur ilan ettiği yabancı para üzerinden ihraç edilen yabancı araçlarda satış işlemleri ve ödemeler hangi esasla yapılır?", "o": ["Satış ve ödemeler yalnız döviz cinsinden", "Her ikisi yalnız TL", "Satış döviz, ödemeler TL", "Satış TL üzerinden; ödemeler aracın para biriminde veya TL olarak", "Yatırımcı serbestçe seçer"], "a": 3, "e": "Satış işlemleri TL üzerinden yapılır; anapara, faiz ve kâr payı ödemeleri aracın para biriminde veya TL olabilir."}, {"q": "Depo sertifikalarında yabancı paylara ilişkin oy hakkı ile ilgili hangisi doğrudur?", "o": ["Depocu kuruluş her durumda resen kullanır", "MKK kullanır", "Oy hakkı temsilciye geçer", "Oy hakkı yoktur", "Sertifika sahipleri talimat vermedikçe depocu kuruluş vekil sıfatıyla resen kullanamaz"], "a": 4, "e": "Talimat verilmedikçe depocu kuruluş oy hakkını vekil sıfatıyla resen kullanamaz."}, {"q": "Yabancı ortaklıkların Türkiye'deki finansal raporlamasıyla ilgili hangisi yanlıştır?", "o": ["Benzer ortaklıkların tablo ve dipnot formatlarına uymak zorundadırlar", "UFRS'ye uyum Kurulun kabul ettiği standartlara uyum sayılır", "Türkiye'de ilan edilecek tablolarda sunum para birimi TL olmalıdır", "Başka bir GKGMS kullanımı Kurul uygun görüşüne bağlıdır", "Özel durum açıklamalarının dili Türkçedir"], "a": 0, "e": "Yabancı ortaklıklar benzer ortaklıkların finansal tablo ve dipnot formatlarına uymak zorunda değildir."}, {"q": "Yabancı ortaklıkların Kurulun hangi düzenlemelerinden, Kurul gerekli görmedikçe, muaf olduğu belirtilmiştir?", "o": ["Özel durum açıklamaları", "Kâr dağıtımı ve kurumsal yönetim", "Finansal raporlama", "Bağımsız denetim", "İzahname"], "a": 1, "e": "Yabancı ortaklıklar kâr dağıtımı ve kurumsal yönetim düzenlemelerinden Kurulun gerekli gördüğü haller dışında muaftır."}, {"q": "Payları Türkiye'de satılacak yabancı yatırım fonunun net varlık değeri en az ne olmalıdır?", "o": ["1.000.000 Avro", "2.000.000 Avro", "10.000.000 Avro", "5.000.000 Avro", "50.000.000 Avro"], "a": 2, "e": "Fonun net varlık değeri en az 10 milyon Avro olmalıdır; satılacak payların cari değeri ise en az 2 milyon Avro."}, {"q": "Yabancı yatırım fonu paylarının Türkiye'de satılabilmesi için yurt dışında satılmaya başlanmasından itibaren en az ne kadar süre geçmiş olmalıdır?", "o": ["6 ay", "1 yıl", "2 yıl", "3 yıl", "5 yıl"], "a": 3, "e": "Payların yurt dışında satışa başlanmasından itibaren en az 3 yıl geçmiş olmalıdır."}, {"q": "Yabancı yatırım fonunun portföy sınırlamalarıyla ilgili hangisi yanlıştır?", "o": ["NAV'ın en az %80'i Türk ihraççılar ve Türk kamu borçlanma araçları dışındaki varlıklarda olmalıdır", "NAV'ın %10'undan fazlası aynı kurumun araçlarına yatırılamaz", "Kamu kurumlarının araçlarında aynı ihraççı sınırı %35'tir", "Fon tek başına bir ortaklıkta oy haklarının %10'undan fazlasına sahip olamaz", "NAV'ın en az %80'i Türk kamu borçlanma araçlarına yatırılmalıdır"], "a": 4, "e": "Tersine, NAV'ın en az %80'i Türk ihraççılar ve Türk kamu borçlanma araçları dışındaki varlıklara yatırılmalıdır."}, {"q": "Yabancı yatırım fonu temsilcisi olabilecek kuruluşlar hangisidir?", "o": ["Bankalar veya Türkiye'de yerleşik geniş yetkili aracı kurumlar", "Portföy yönetim şirketleri", "Yalnız kalkınma ve yatırım bankaları", "Yabancı fon yöneticisinin Türkiye şubesi", "Takasbank"], "a": 0, "e": "Fon temsilcisi bankalar veya Türkiye'de yerleşik geniş yetkili aracı kurumlar olabilir."}, {"q": "Fonun herhangi bir sebeple geri alım ödemesi yapamaması halinde temsilci payları en geç ne zaman geri almalıdır?", "o": ["Aynı gün", "Geri alım süresini izleyen en geç 2 iş günü içinde", "5 iş günü içinde", "10 iş günü içinde", "1 ay içinde"], "a": 1, "e": "Temsilci geri alım süresini izleyen en geç 2 iş günü içinde bedeli tam ve nakden ödeyerek payları geri alır."}, {"q": "Yabancı fon izahnamesinin onaylanmasında bir banka tarafından başvuru yapılmışsa hangi kurumun görüşü alınır?", "o": ["TCMB", "Hazine ve Maliye Bakanlığı", "BDDK", "MKK", "TSPB"], "a": 2, "e": "Başvuru bir banka tarafından yapılmışsa BDDK'nın görüşü alınır."}, {"q": "Yabancı yatırım fonu izahnamesi ve yatırımcı bilgi formu, izin yazısının tebellüğünü izleyen kaç iş günü içinde yayımlanır?", "o": ["5 iş günü", "6 iş günü", "15 iş günü", "10 iş günü", "20 iş günü"], "a": 3, "e": "10 iş günü içinde KAP'ta ve temsilcinin sitesinde yayımlanır; izahnamenin yayım yeri tescil ve ilan edilir."}, {"q": "Yabancı yatırım fonu paylarının tahsisli satışıyla ilgili hangisi doğrudur?", "o": ["Herkese tahsisli satış yapılabilir", "Tüm ön şartlar aynen aranır", "İzahname zorunludur", "Yatırımcı bilgi formu ilan edilmelidir", "Yalnız nitelikli yatırımcılara yapılır, izahname yerine ihraç belgesi hazırlanır ve bu fonlar ilan ve reklam veremez"], "a": 4, "e": "Tahsisli satış yalnız nitelikli yatırımcılara yapılır; ihraç belgesi hazırlanır; ilan ve reklam yasaktır; %80 şartı dışındaki ön şartlar aranmaz."}]}, {"id": 9, "kisa": "Projeye Dayalı Menkul K.", "baslik": "Projeye Dayalı Menkul Kıymetler Tebliği (III-61/B.1)", "ozet": "Proje finansman fonunun kuruluşu, PDMK ihracı ve ihraç tavanı, fon kurulu ve hizmet sağlayıcı, fon portföyü ve proje nitelikleri, ihraç gelirinin aktarımı, projenin gecikmesi ve fonun sona ermesi.", "notlar": "<h3>Yasal çerçeve ve tanımlar<\/h3>\n<ul>\n<li>On Birinci Kalkınma Planı (2019–2023) hedefi doğrultusunda <b>7222 sayılı Kanun<\/b> m.34 ile SPKn'ya <b>m.61/B<\/b> eklendi (25.02.2020 RG).<\/li>\n<li><b>III-61/B.1<\/b> Projeye Dayalı Menkul Kıymetler Tebliği: SPKn m.61/B ve m.130/3'e dayanır; <b>17.07.2021<\/b> RG'de yayımlanıp yürürlüğe girdi. 7 bölüm.<\/li>\n<li><b>Proje finansmanı:<\/b> uzun vadeli ve yoğun sermaye isteyen altyapı, enerji, sanayi veya teknoloji yatırımlarının proje finansman fonu yoluyla finansmanı. Projenin gelirleri ve diğer hakları fona <b>temlik<\/b> edilir.<\/li>\n<li><b>Proje finansman fonu (PFF):<\/b> PDMK karşılığı toplanan para ve/veya diğer varlıklarla, PDMK sahipleri hesabına, proje varlık ve haklarının gelirlerine dayalı portföyü işletmek için <b>yatırım kuruluşlarınca<\/b> inançlı mülkiyet esasına göre içtüzükle kurulan <b>tüzel kişiliği olmayan<\/b> malvarlığı.<\/li>\n<li>Gerekçe: büyük projelerin kredileri menkul kıymetleştirme için ideal; ürün <b>proje yüklenicisinin riskinden bağımsız<\/b> olur.<\/li>\n<li><b>Proje:<\/b> kamu hizmetlerine yönelik ulaşım, altyapı, enerji, sanayi, teknoloji, haberleşme veya sağlık gibi uzun vadeli, sermaye yoğun projeler.<\/li>\n<li><b>Proje finansmanına yönelik kredi:<\/b> bankaların ve geniş yetkili aracı kurumların projeler için kullandırdığı <b>teminatlı<\/b> krediler ve bunların yeniden finansmanı için kullandırdıkları teminatlı krediler.<\/li>\n<li>II-5.1 ve II-5.2 kıyasen uygulanır; fon <b>ihraççı<\/b> sayılır, ihraççı sorumluluklarını <b>fon kurulu<\/b> yerine getirir.<\/li>\n<\/ul>\n<h4>Dayanak varlıklar<\/h4>\n<ul>\n<li>Kaynak kuruluşlardan devralınacak; farklı kesimleri dahil <b>tek bir projenin<\/b> veya kesintisiz yürütülmesi için zorunlu ilişkili projenin ya da kaynak kuruluşun bağlı olduğu konsorsiyumun aynı nitelikteki projelerinin <b>gelir ve diğer hakları<\/b>; ve/veya<\/li>\n<li>Banka ve geniş yetkili aracı kurumların tek veya farklı projelerin finansmanı için kullandırdığı <b>kredilerden alacaklar<\/b>.<\/li>\n<\/ul>\n\n<h3>Fon<\/h3>\n<ul>\n<li><b>Türkiye'de<\/b> kurulur; süreli veya süresiz; PDMK ihracı dışında kurulamaz ve kullanılamaz.<\/li>\n<li>Sicil işlemleriyle sınırlı tüzel kişilik; tapuya tabi varlıklar fon adına tescil; işlemler kurucu ve fon kurulunu temsil eden birer yetkilinin <b>müşterek imzasıyla<\/b>.<\/li>\n<li><b>İçtüzük:<\/b> PDMK sahipleri, kurucu ve fon kurulu arasında inançlı mülkiyet ve vekalet akdine göre yönetim ve saklamayı konu alan <b>iltihaki<\/b> sözleşme. Asgari unsurlar: unvan ve süre, genel esaslar, tasfiye şekli, Kurulun belirlediği diğerleri. Değişiklik Kurul onayıyla, fon kurulunca tescil ve TTSG ilanı.<\/li>\n<li><b>Kurucular:<\/b> yalnız Kuruldan yatırım hizmeti izni almış <b>bankalar<\/b> ve <b>geniş yetkili aracı kurumlar<\/b>. Şartlar: gerekli izinler; <b>son 3 yıl<\/b> içinde 1 ay veya daha fazla faaliyet sınırlaması ya da durdurma olmaması; muaccel vergi borcu olmaması. <b>Dikkat:<\/b> VİDMK'da bu süre 1 yıldı.<\/li>\n<li><b>Unvan:<\/b> \"proje finansman fonu\" ibaresi zorunlu; kapsam dışı fon ve araçlar bu ifadeleri kullanamaz; yanıltıcı ve aşırı benzer unvan yasak.<\/li>\n<li><b>Malvarlığı:<\/b> kurucu, hizmet sağlayıcı ve kaynak kuruluştan ayrı; PDMK itfa edilene kadar haczedilemez, rehnedilemez, iflas masasına girmez, ihtiyati tedbir ve <b>ihtiyati haciz<\/b> konamaz.<\/li>\n<li>Fon yalnız <b>nakit yönetimi<\/b> amacıyla ve varlıklar toplamının <b>%1<\/b>'ini geçmeyecek tutarda borçlanabilir.<\/li>\n<\/ul>\n<h4>Kuruluş ve ihraç başvurusu<\/h4>\n<ul>\n<li>Başvuru Kurulca belirlenen formla (henüz yayımlanmadı) ve Tebliğ Ek-2 belgeleriyle.<\/li>\n<li>Eksiksiz belgelerden itibaren <b>20 iş günü<\/b> içinde sonuçlandırılır; eksiklik başvurudan itibaren 10 iş günü içinde bildirilir ve <b>20 iş günü<\/b> içinde giderilir.<\/li>\n<li>Onaylanan içtüzük, tebellüğü izleyen <b>6 iş günü<\/b> içinde tescil ve TTSG'de ilan edilir; kuruluş tamamlanır.<\/li>\n<li>Tescilden itibaren en geç <b>6 ay<\/b> içinde ihraç başvurusu (Ek-3); yapılmazsa içtüzük terkin edilir, belgeler 6 iş günü içinde Kurula. Makul gerekçeyle <b>bir defaya mahsus 6 ay<\/b> uzatılabilir. <b>Dikkat:<\/b> VİDMK'da uzatma 3 aydı.<\/li>\n<\/ul>\n\n<h3>PDMK ihracı<\/h3>\n<ul>\n<li>Yurt içinde halka arz, nitelikli yatırımcıya satış, birim nominali asgari <b>100.000 TL<\/b> ile tahsisli veya yurt dışında ihraç. Yurt içi ihraç <b>tek seferde<\/b> yapılır.<\/li>\n<li>Halka arzda borsada işlem ve borsaya başvuru zorunlu; <b>kredi derecelendirmesi<\/b> zorunlu ve gerektiğinde gözden geçirilir.<\/li>\n<li>İzahnamede TMS/TFRS'ye uygun denetlenmiş tablolar; 1 yıldan kısa faaliyette ara dönem; yeni veya hiç ihraç yapmamış fonda tablolar konmayabilir.<\/li>\n<li>İzahnamede belirtilmeyen varlıklar dayanak gösterilerek ihraç yapılamaz.<\/li>\n<\/ul>\n<h4>İhraç tavanı<\/h4>\n<ul>\n<li><b>Genel kural:<\/b> fizibilite etüdündeki proje maliyetinin <b>%75<\/b>'ini ve portföye alınacak teminatlı kredilerin izahname tarihindeki anapara ve tahakkuk etmiş faiz toplamını aşmamak üzere.<\/li>\n<li><b>Özkaynak şartı:<\/b> maliyetin en az <b>%25<\/b>'i kaynak kuruluşun özkaynağıyla; kaynak kuruluş özel amaçlı şirketse veya son 2 yılda faaliyete geçmişse kurucu ortaklarının özkaynağıyla karşılanır.<\/li>\n<li>İhalede uygulama sözleşmesindeki tutar fizibiliteden farklıysa <b>sözleşme tutarı<\/b> esas alınır.<\/li>\n<li>Mahalli idareler, KİT'ler, 3996 sayılı Yap-İşlet-Devret ve 6428 sayılı Sağlık KÖİ kapsamındaki özel amaçlı şirketler ve diğer KÖİ veya özelleştirme şirketlerinin kaynak kuruluş olduğu ihraçlar ile idarelerin <b>garanti ettiği<\/b> proje gelirlerine dayalı PDMK'da tavan maliyetin <b>%80<\/b>'ine kadar. Kaynak kuruluş kamu kurumuysa talep üzerine şartlardan muafiyet verilebilir.<\/li>\n<li><b>Ek ihraç tavanı:<\/b> izahnamede belirtilmişse, öngörülemeyen nedenlerle zaruri ilave kaynak ihtiyacı <b>ek fizibilite<\/b> ile tespit edilirse tavanın <b>%20<\/b>'sine kadar; kaynak kuruluş ek tavanın en az <b>%25<\/b>'i kadar özkaynak sağlar. Mevcut PDMK sahiplerine <b>15 iş günü<\/b> alım önceliği; satılamayanlar üçüncü kişilere.<\/li>\n<li><b>Erken itfa:<\/b> fonun veya PDMK sahiplerinin talebiyle kısmen veya tamamen; yurt içinde esaslar izahnamede, yurt dışında taraflarca serbestçe (ülke mevzuatı saklı).<\/li>\n<li>Ödemeler portföy nakit akımlarından; Kurul banka veya üçüncü kişi garantisi, satış şekli ve alıcı niteliği sınırlaması isteyebilir.<\/li>\n<li>Yurt içinde MKK'da kayden ihraç; yurt dışı ihraç bilgileri ve değişiklikleri <b>3 iş günü<\/b> içinde MKK'ya.<\/li>\n<li>Tavan kapsamındaki PDMK tamamen itfa edilmeden aynı fonla yeni tavan başvurusu yapılamaz; itfadan sonra içtüzük uyumlu hale getirilerek fon yeniden kullanılabilir.<\/li>\n<\/ul>\n<h4>Kurul ücreti<\/h4>\n<ul>\n<li>Kurucu veya kaynak kuruluş öder; ihraç değeri üzerinden (nominalden az olmamak üzere): vadesi <b>364 güne kadar on binde 5<\/b>; <b>364 günden uzun binde 1<\/b>. Yıl 365 gün. Ücret izahname veya ihraç belgesinin fona tesliminden önce ödenir.<\/li>\n<\/ul>\n\n<h3>Fonun işleyişi<\/h3>\n<ul>\n<li><b>Fon kurulu:<\/b> kurucu her fon için <b>en az 3 kişilik<\/b> kurulu yönetim kurulu kararıyla atar; en az 1 bağımsız ve en az 1 SPF Düzey 3 lisanslı üye; aynı kurucunun fonlarında aynı kişiler olabilir. Üye şartları: yükseköğrenim ve <b>5 yıl<\/b> tecrübe, iflas ve konkordato yok, sayılan suçlardan mahkûmiyet yok vb.<\/li>\n<li>Kurucu: kuruluş başvurusu, üyelerin belirlenmesi, içtüzük. Fon kurulu: içtüzük değişiklikleri ve ihraç belgeleri, portföy ve yönetim, temsil ve gözetim, hesaplar ve ödemeler, yatırımcı raporları, hizmet sağlayıcı gözetimi. Kararlar <b>noter onaylı<\/b> deftere.<\/li>\n<li><b>Fon operasyon sorumlusu:<\/b> kurucu şartlarını taşıyan banka veya geniş yetkili aracı kurum; hizmet sağlayıcının gözetimi ve değiştirilmesi dışındaki görevler için.<\/li>\n<li><b>İç kontrol:<\/b> fon kurulu kararıyla yazılı hale getirilir. Türev işlemi yapılacaksa risk yönetimi prosedürleri gerekir ve bunları oluşturup izleyecek <b>fon kurulu üyesinin<\/b> SPF Düzey 3 ve Türev Araçlar lisansı olmalı.<\/li>\n<li><b>Fon denetçisi:<\/b> operasyonda görev almayan, kurul üyesi niteliğinde, <b>SPF Düzey 3<\/b> lisanslı kişi; Türev lisansı varsa risk yönetimini de yürütebilir. Raporlar takvim yılını izleyen <b>3 ay<\/b> içinde fon kurulu ve kurucuya; PDMK tamamen itfa edildikten sonra en az <b>5 yıl<\/b> saklanır. Aykırılık veya geri ödeme güçlüğü raporu en kısa sürede kurula, tamamlanmasını izleyen <b>6 iş günü<\/b> içinde Kurula.<\/li>\n<li><b>Hizmet sağlayıcı:<\/b> günlük idare; kurucu, kaynak kuruluş veya kurucu niteliğinde kuruluş. Sözleşmede: tahsilat ve fon hesabına aktarım, idari işler, borçlu gözetimi, proje ilerleme yüzdeleri ve maliyet karşılaştırmasının <b>üç ayda bir<\/b> fon kuruluna raporlanması, vergi tahsili, donuk alacak takibi, proje gelirlerinin tahsili.<\/li>\n<li>Tahsil edilen tutarlar fon malvarlığıdır, haczedilemez ve derhal fon hesabına aktarılır. Hizmet sağlayıcı değişirse tüm kayıtlar ve nakit mahsup veya kesinti yapılmadan en geç <b>5 iş günü<\/b> içinde devredilir.<\/li>\n<li>Hizmet sağlayıcı faaliyetleri, KGK'nın İlgili Hizmetler Standardı <b>4400<\/b>'e göre yetkili bağımsız denetim kuruluşunca <b>yıllık<\/b> incelenir; rapor dönem sonunu izleyen <b>30 gün<\/b> içinde. <b>Dikkat:<\/b> VİDMK'da altı aylıktı.<\/li>\n<li>Finansal raporlama ve denetimde yatırım fonu düzenlemeleri; hesaplar Kurul denetimine tabi. Yetkililer şart yitirirse görevine son verilir; ayrılırsa sorumluluk yenisi atanana kadar sürer.<\/li>\n<\/ul>\n<h4>Kamuyu aydınlatma (KAP ve kurucunun sitesi)<\/h4>\n<ul>\n<li>İçtüzük ve değişiklikleri: tebellüğü izleyen <b>6 iş günü<\/b>. Görev değişiklikleri ve izin iptalleri: <b>6 iş günü<\/b>.<\/li>\n<li><b>Yatırımcı raporu:<\/b> üç aylık dönemler, dönem bitimini izleyen <b>6 iş günü<\/b>.<\/li>\n<li>Hizmet sağlayıcı inceleme bulguları ve derecelendirme notları: <b>6 iş günü<\/b>.<\/li>\n<li>Halka arzda fona ilişkin genel bilgiler KAP formuyla yayımlanır; değişiklikler en geç <b>2 iş günü<\/b> içinde güncellenir.<\/li>\n<li>Tahsisli veya borsada işlem görmeyen nitelikli yatırımcı satışlarında ilanlar MKK aracılığıyla iletilir ve sitede yayımlanır.<\/li>\n<\/ul>\n\n<h3>Fon portföyü<\/h3>\n<ul>\n<li>Alınabilecekler: proje kredilerinden alacaklar; projenin gelirleri ve diğer hakları; nakit değerlendirme araçları (vadeli mevduat, katılma hesabı, ters repo, para piyasası ve kısa vadeli borçlanma araçları fonları, bankaların ve Hazinenin kaynak kuruluş olduğu kira sertifikaları, DİBS, Takasbank para piyasası ve katılım bankası muadilleri); türev araçlar; Kurulca uygun görülenler.<\/li>\n<li>Krediler, proje hakları ve türevler sözleşmeyle mevcut teminatlarıyla devredilir; kredinin bir kısmına dayalı ihraçta fonun hakları krediyi veren kurumla aynı olacak şekilde tesis edilir.<\/li>\n<li><b>Proje şartları:<\/b> bağımsız finansal fizibilite (talep, nakit akımı, risk analizi) yeterli kuruluşa yaptırılmış ve değerlemesi yetkili veya teknik yeterli kuruluşa yaptırılmış; gerekli izin, ruhsat, lisans, etüt, çevresel ve kültürel değerlendirme tamam ve tespit edilmiş; proje <b>yurt içinde<\/b>.<\/li>\n<li><b>Kredi şartları:<\/b> banka kredileri <b>Birinci Grup<\/b>; geniş yetkili aracı kurum kredileri de aynı şartta. İpotekli taşınmaz Türkiye'de, zorunlu sigortalı, değeri BDDK veya SPK yetkili kuruluşça tespit edilmiş; ipotek <b>birinci derecede<\/b> kayıtlı (garameten saklı) ve kamu alacakları dışında bu derecede başka ipotek kurulamayacağına dair <b>şerh<\/b>.<\/li>\n<li>Kaynak kuruluş lehine olanlar dışında takyidat yok; itfaya kadar sigorta ve teminat korunur.<\/li>\n<li><b>Türev:<\/b> kur ve faiz riskinden korunma; borsada işlem veya yetkili karşı tarafın yatırım yapılabilir seviyenin <b>en yüksek ilk üç kademesinde<\/b> notu; birden fazla not varsa <b>en yüksek not<\/b> esas (TMK'da en yüksek ikinci not idi); haklar ve yükümlülükler kalan anapara nominalini aşamaz.<\/li>\n<li>Varlık devri ihraçtan sonra en geç <b>1 ay<\/b> içinde, varlık değeri toplam yükümlülükten az olmayacak şekilde; Kurul <b>bir defaya mahsus<\/b> uzatabilir. Değer: proje hakları için değerleme raporu, krediler için anapara ve tahakkuk etmiş faiz.<\/li>\n<li><b>Doğrudan aktarım:<\/b> nakit akımları kesintilerden sonra beklemeden PDMK sahiplerine. <b>Dolaylı aktarım:<\/b> fon kurulunun belirlediği vadelere kadar portföyde bekletilir.<\/li>\n<li>Sicile tescili zorunlu rehinler fon adına tescil edilir. Sigorta tazminatı ikame için kullanılmazsa gelir yazılır. Devirden önceki işlemlerden doğan yükümlülükler fondan karşılanmaz; sorumlu kaynak kuruluştur.<\/li>\n<li><b>Harcamalar:<\/b> üst sınır ve kalemler izahnamede; tescil-ilan, fon kurulu ve hizmet ücretleri, hizmet sağlayıcı, denetim ve derecelendirme, kalite artırma, türev maliyetleri, KAP ve MKK, yüklenim ve aracılık, borçlanma giderleri, kanuni ücretler, vergi ve sigorta. Piyasa rayici üstünde harcama yok; belgeye dayalı. Kurul uygun görürse izahname dışında veya sınırı aşan harcama yapılabilir.<\/li>\n<li><b>Kalite artırma:<\/b> sigorta, garanti, teminat mektubu; proje geliri tahsil edilinceye kadar teminat olarak varlık alınması; kurucu veya kaynak kuruluşun PDMK satın alması; niteliğini kaybeden kredilerin kaynak kuruluşça derhal değiştirilmesi.<\/li>\n<\/ul>\n\n<h3>Gecikme, gerçekleşmeme ve ihraç geliri<\/h3>\n<ul>\n<li><b>Gecikme:<\/b> anlaşılmasından itibaren <b>15 iş günü<\/b> içinde <b>kaynak kuruluş<\/b> fizibilite raporu hazırlatıp ilave süre için Kurula başvurur (gecikme sebepleri, tamamlanma düzeyi, süre, maliyet). Rapordaki yanlış bilgilerden kaynak kuruluş sorumlu. Gecikme, ek süre ve yeni ifa zamanı derhal KAP'ta ilan edilir.<\/li>\n<li><b>Gerçekleşmeme:<\/b> ek süre sonunda veya ek süre istenmemişse ifa zamanında gerçekleşmezse derhal KAP'ta ilan; fon kurulu kararıyla teminatlar <b>derhal nakde çevrilir<\/b>, ihraç geliri hesabında kalanla birlikte PDMK oranında dağıtılıp itfa edilir.<\/li>\n<li><b>İhraç geliri:<\/b> bankada özel hesapta toplanır, vekil özeniyle değerlendirilir; projelerde veya başvuru tarihi itibarıyla kullanılmış finansmanın geri ödenmesinde kullanılır.<\/li>\n<li><b>Proje gelirlerine dayalı ihraçta:<\/b> fon kurulu, maliyeti kaynak kuruluşa ait olmak üzere <b>altı aylık<\/b> ilerleme raporları hazırlatır; hazırlayan ile kaynak kuruluş <b>müteselsilen<\/b> sorumlu; sonuçlar imza tarihinde KAP'ta. Gelirin <b>%15<\/b>'i ihraçtan sonra, kalan <b>%85<\/b>'i ilerleme oranlarına göre kaynak kuruluşa aktarılır.<\/li>\n<li><b>Kredi alacaklarına dayalı ihraçta<\/b> gelir doğrudan kaynak kuruluşa aktarılabilir; karma portföyde oranlara göre.<\/li>\n<li>Projenin gerçekleşmeyeceği kesinleşirse hesaptaki tutar kaynak kuruluşa aktarılmaz, PDMK sahiplerine ödenir.<\/li>\n<li>Zorunlu defterler TTK, VUK ve Kanuna göre; her varlığa <b>dosya numarası<\/b>. Sözleşme, yazışma, rapor ve kararlar PDMK tamamen itfa edildikten sonra <b>10 yıl<\/b> saklanır (davalılar kesin hükme kadar).<\/li>\n<\/ul>\n<h4>Geri ödeme güçlüğü ve sona erme<\/h4>\n<ul>\n<li>Fon kurulunun görevini yapmaması sonucu güçlükte Kurul üyelerin değiştirilmesini isteyebilir; devam ederse fonu başka kurucuya devredebilir; garanti vermiş ilk kurucunun yükümlülüğü sürer. Kurucunun izni iptal edilirse fon başka kurucuya devredilebilir; yeni kurucuya fondan ödeme kararlaştırılabilir.<\/li>\n<li><b>Sona erme:<\/b> içtüzükteki sürenin dolması veya süresiz fonda tüm yükümlülükler ifa edilip başvurunun Kurulca kabulü. Sona erme tarihinden itibaren PDMK ihraç edilemez.<\/li>\n<\/ul>", "sorular": [{"q": "Proje finansman fonu ve projeye dayalı menkul kıymet düzenlemesi SPKn'nun hangi maddesiyle getirilmiştir?", "o": ["m.61/B", "m.57", "m.61", "m.31/B", "m.59"], "a": 0, "e": "7222 sayılı Kanunla SPKn'ya eklenen m.61/B proje finansmanı, PFF ve PDMK'yı düzenler; m.31/B teminat yönetimi, m.61 kira sertifikasıdır."}, {"q": "Proje finansman fonu ile ilgili hangisi yanlıştır?", "o": ["Tüzel kişiliği olmayan malvarlığıdır", "Varlıklar toplamının %10'una kadar serbestçe borçlanabilir", "Yatırım kuruluşlarınca inançlı mülkiyet esasına göre kurulur", "Türkiye'de kurulması zorunludur", "PDMK ihracı dışında kullanılamaz"], "a": 1, "e": "Fon yalnız nakit yönetimi amacıyla ve varlıklar toplamının %1'ini geçmeyecek tutarda borçlanabilir."}, {"q": "Proje finansman fonunun fon kurulu ile ilgili hangisi yanlıştır?", "o": ["Kurucunun yönetim kurulu kararıyla atanır", "En az 3 kişiden oluşur", "Aynı kurucunun kurduğu fonlarda fon kurulları aynı kişilerden oluşamaz", "En az bir üyenin bağımsız üye olması zorunludur", "En az bir üyenin SPF Düzey 3 lisansı olması zorunludur"], "a": 2, "e": "Aynı kurucu birden fazla fon kurarsa fon kurulları aynı kişilerden oluşabilir; diğer ifadeler doğrudur."}, {"q": "PFF kurucusunda aranan şartlarla ilgili hangisi doğrudur?", "o": ["Son 1 yılda 1 ay veya daha fazla faaliyet durdurma olmaması", "Asgari 1 milyar TL özkaynak", "Son 5 yılda hiçbir idari para cezası almamış olmak", "Son 3 yılda 1 ay veya daha fazla faaliyet sınırlama ya da durdurma kararı olmaması", "En az 10 yıllık faaliyet"], "a": 3, "e": "PFF kurucusunda son üç yıl içinde bir ay veya daha fazla sınırlama veya durdurma olmaması aranır."}, {"q": "PFF kuruluş izninden sonra içtüzüğün tescilinden itibaren PDMK ihraç başvurusu en geç ne kadar sürede yapılmalı ve bu süre en fazla ne kadar uzatılabilir?", "o": ["3 ay; 3 ay", "6 ay; 3 ay", "6 ay; uzatılamaz", "1 yıl; 6 ay", "6 ay; bir defaya mahsus 6 ay"], "a": 4, "e": "Başvuru 6 ay içinde yapılmalı; makul gerekçeyle bir defaya mahsus 6 ay uzatılabilir."}, {"q": "Fizibilite etüdüne göre proje maliyeti 1 milyar TL olan bir özel sektör projesinde, genel kurala göre PDMK ihraç tavanı en fazla ne olabilir (kredi sınırı aşılmadığı varsayılırsa)?", "o": ["750 milyon TL", "500 milyon TL", "250 milyon TL", "800 milyon TL", "1 milyar TL"], "a": 0, "e": "Genel kurala göre tavan proje maliyetinin %75'idir: 750 milyon TL; kalan en az %25 özkaynakla karşılanır."}, {"q": "Yap-İşlet-Devret modeli kapsamındaki özel amaçlı şirketin kaynak kuruluş olduğu PDMK ihracında ihraç tavanı maliyetin yüzde kaçına kadar belirlenebilir?", "o": ["%50", "%80", "%75", "%70", "%90"], "a": 1, "e": "Mahalli idareler, KİT'ler, YİD ve KÖİ şirketleri ile idarece garanti edilen gelirlere dayalı ihraçlarda tavan maliyetin %80'ine kadar belirlenebilir."}, {"q": "PDMK'da ek ihraç tavanı ile ilgili hangisi doğrudur?", "o": ["Tavanın %50'sine kadar, özkaynak şartı olmadan verilir", "Tavanın %10'una kadar ve yalnız halka arzda", "Tavanın %20'sine kadar verilir; kaynak kuruluş ek tavanın en az %25'i kadar özkaynak sağlar ve mevcut PDMK sahiplerine 15 iş günü alım hakkı tanınır", "Ek tavan verilemez", "Tavanın %25'ine kadar ve yeni yatırımcılara öncelikli"], "a": 2, "e": "Ek ihraç tavanı %20'ye kadar; %25 özkaynak ve mevcut sahiplere 15 iş günü öncelik hakkı vardır."}, {"q": "Projede ihale yapılmış ve uygulama sözleşmesindeki tutar fizibilite etüdünden farklıysa ihraç tavanında hangisi esas alınır?", "o": ["Fizibilite etüdündeki tutar", "Düşük olan", "İkisinin ortalaması", "Uygulama sözleşmesindeki tutar", "Kurulun belirleyeceği tutar"], "a": 3, "e": "İhale sonucu imzalanan uygulama sözleşmesindeki tutar esas alınır."}, {"q": "Vadesi 300 gün olan PDMK ihracında Kurul ücreti oranı hangisidir?", "o": ["On binde 2,5", "Binde sıfır", "Binde 1", "Binde 2", "On binde 5"], "a": 4, "e": "Vadesi 364 güne kadar olanlar için on binde 5, daha uzun olanlar için binde 1'dir."}, {"q": "PDMK ihracıyla ilgili hangisi yanlıştır?", "o": ["İzahnamede belirtilmeyen varlıklar da dayanak gösterilebilir", "Yurt içi ihraç tek seferde yapılır", "Halka arzda kredi derecelendirmesi zorunludur", "Tahsisli ihraçta birim nominal en az 100.000 TL olmalıdır", "Yurt içinde MKK'da kayden ihraç zorunludur"], "a": 0, "e": "İzahname veya ihraç belgesinde belirtilen varlıklardan başka varlıklar dayanak gösterilerek PDMK ihraç edilemez."}, {"q": "PFF'de türev işlemlere taraf olunacaksa risk yönetim prosedürlerini oluşturup izleyecek kişide hangi şart aranır?", "o": ["Fon denetçisinin SPF Düzey 2 lisansı", "Fon kurulu üyesinin SPF Düzey 3 ve Türev Araçlar lisanslarına sahip olması", "Hizmet sağlayıcının BDDK izni", "Ayrı bir birimin bağımsız denetçi olması", "Herhangi bir lisans aranmaz"], "a": 1, "e": "PDMK Tebliğine göre bu görevi yapacak fon kurulu üyesi SPF Düzey 3 ve Türev Araçlar lisanslarına sahip olmalıdır."}, {"q": "PFF'de hizmet sağlayıcının faaliyetlerinin bağımsız denetim kuruluşunca incelenme sıklığı hangisidir?", "o": ["Aylık", "Üç aylık", "Yıllık", "Altı aylık", "İki yılda bir"], "a": 2, "e": "PDMK'da inceleme yıllık hesap dönemleri itibarıyla yapılır ve rapor 30 gün içinde iletilir; VİDMK'da altı aylıktır."}, {"q": "Hizmet sağlayıcıyla sözleşmenin sona ermesi halinde kayıt ve nakitlerin fon kuruluna veya yeni hizmet sağlayıcıya devri en geç ne kadar sürede yapılır?", "o": ["Derhal", "3 iş günü", "10 iş günü", "5 iş günü", "30 gün"], "a": 3, "e": "Hizmet sağlayıcı kayıtları ve nakdi mahsup veya kesinti yapmaksızın en geç 5 iş günü içinde devreder."}, {"q": "PFF portföyüne alınacak ipotekli kredilerde ipotekle ilgili aranan şart hangisidir?", "o": ["İpoteğin herhangi bir derecede olması", "İpotek şartı aranmaz", "İpoteğin yalnız ikinci derecede olması", "İpoteğin yurt dışındaki taşınmazda olabilmesi", "İpoteğin birinci derecede kayıtlı olması ve bu derecede kamu alacakları dışında başka ipotek kurulamayacağına dair şerh"], "a": 4, "e": "İpotek birinci derecede kayıtlı olmalı (garameten tesis saklı) ve sicile gerekli şerh konmalıdır."}, {"q": "PFF portföyüne dahil edilecek türev aracın karşı tarafının birden fazla derecelendirme notu varsa hangisi esas alınır?", "o": ["En yüksek not", "En yüksek ikinci not", "En düşük not", "Notların ortalaması", "Son verilen not"], "a": 0, "e": "PDMK Tebliğinde birden fazla not varsa en yüksek not esas alınır."}, {"q": "Fon portföyündeki varlıklardan elde edilen nakit akımlarının kesintilerden sonra beklemeksizin PDMK sahiplerine aktarıldığı yönetim usulü hangisidir?", "o": ["Dolaylı aktarım", "Doğrudan aktarım", "Havuz usulü", "Birikimli usul", "Tertip usulü"], "a": 1, "e": "Doğrudan aktarımda nakit portföyde bekletilmeden aktarılır; dolaylı aktarımda belirlenen vadelere kadar bekletilebilir."}, {"q": "Proje gelirlerinin dayanak olduğu PDMK ihracında ihraç gelirinin kaynak kuruluşa aktarımı nasıl yapılır?", "o": ["Tamamı ihraçtan hemen sonra", "%25 ihraç sonrası, %65 ilerlemeye göre, %10 sonda", "%15 ihraç sonrası, %85 ilerleme raporlarındaki oranlarda", "%50 ihraç sonrası, %50 proje bitiminde", "Hiç aktarılmaz"], "a": 2, "e": "Gelirin %15'i ihraçtan sonra, kalan %85'i ilerleme raporlarındaki oranlara göre aktarılır; kredi alacaklarına dayalı ihraçta doğrudan aktarılabilir."}, {"q": "Proje gelirlerine dayalı PDMK'da ilerleme raporları hangi sıklıkla hazırlatılır ve maliyeti kim karşılar?", "o": ["Üç aylık; fon", "Aylık; yatırımcılar", "Yıllık; kurucu", "Altı aylık; kaynak kuruluş", "Altı aylık; fon"], "a": 3, "e": "Fon kurulu altı aylık dönemler itibarıyla, maliyeti kaynak kuruluşa ait olmak üzere ilerleme raporları hazırlatır."}, {"q": "Projenin gecikeceğinin anlaşılmasından itibaren fizibilite raporunu kim, ne kadar sürede hazırlatıp Kurula başvurur?", "o": ["Fon kurulu – 5 iş günü", "Fon denetçisi – 20 iş günü", "Kurucu – 30 gün", "Hizmet sağlayıcı – 10 iş günü", "Kaynak kuruluş – 15 iş günü"], "a": 4, "e": "Kaynak kuruluş 15 iş günü içinde fizibilite raporu hazırlatıp ilave süre için Kurula başvurur."}, {"q": "PFF'de fonun taraf olduğu sözleşme, yazışma, rapor ve fon kurulu kararlarının saklama süresi hangisidir?", "o": ["İtfadan itibaren 10 yıl", "İtfadan itibaren 5 yıl", "PDMK itfasına kadar", "Düzenlemeden itibaren 3 yıl", "Süresiz"], "a": 0, "e": "Bu belgeler PDMK'nın tamamen itfasından itibaren 10 yıl saklanır."}, {"q": "PFF yatırımcı raporu ile ilgili hangisi doğrudur?", "o": ["Aylık hazırlanır, 3 iş günü içinde ilan edilir", "Üç aylık dönemlerle hazırlanır, dönem sonunu izleyen 6 iş günü içinde KAP'ta ve kurucunun sitesinde ilan edilir", "Altı aylık hazırlanır, 10 iş günü içinde", "Yıllık hazırlanır", "Yalnızca Kurula gönderilir"], "a": 1, "e": "Yatırımcı raporu takvim yılına göre üç aylık dönemler itibarıyla 6 iş günü içinde ilan edilir."}, {"q": "Halka arz edilen PDMK'da KAP'taki fon genel bilgilerinde değişiklik olursa güncelleme en geç ne zaman yapılmalıdır?", "o": ["Aynı gün", "6 iş günü içinde", "2 iş günü içinde", "10 iş günü içinde", "Ay sonunda"], "a": 2, "e": "KAP'taki genel bilgiler değişirse en geç iki iş günü içinde güncellenir."}]}, {"id": 10, "kisa": "Teminatlı İhraç (II-31/B.1)", "baslik": "Sermaye Piyasası Araçlarının Teminatlı İhracına İlişkin Usul ve Esaslar Hakkında Tebliğ (II-31/B.1)", "ozet": "Teminat yöneticisi kurumu, teminata konu varlıklar ve nitelikleri, teminat yönetim sözleşmesi, temerrütte hızlı paraya çevirme ve oransal ödeme, teminat yöneticisinin bağımsızlığı, teminat raporu ve özel durum açıklamaları.", "notlar": "<h3>Yasal çerçeve<\/h3>\n<ul>\n<li><b>7222 sayılı Kanun<\/b> m.29 ile SPKn'ya <b>m.31/B<\/b> (Teminat yönetim sözleşmesi ve teminat yöneticisi) eklendi; 25.02.2020 RG.<\/li>\n<li>m.31/B'ye göre Kurulca belirlenecek araçlar, yükümlülüklerin vadesinde yerine getirilmesi için Kurulun uygun göreceği varlıklarla teminat altına alınabilir; varlıkların <b>mülkiyeti<\/b> teminaten, genel saklama yetkili yatırım kuruluşu niteliğindeki <b>teminat yöneticisine<\/b> devredilebilir veya onun lehine <b>sınırlı ayni hak<\/b> kurulabilir.<\/li>\n<li><b>Temerrütte<\/b> veya kanun ya da sözleşmedeki diğer sebeplerde teminat yöneticisi; <b>ihbar, ihtar, süre verme, adli veya idari izin, açık artırma<\/b> gibi hiçbir ön şartı yerine getirmeden varlıkları satıp bedeli yatırımcılara paylaştırabilir.<\/li>\n<li>Amaç: yurt dışında yaygın <b>trust, yed-i emin<\/b> kurumunu getirmek. Klasik rehinde paraya çevirme uzun sürer; yeni sistemle hızlı tahsil, ihraççılar için daha kolay ve <b>düşük faizli<\/b> borçlanma.<\/li>\n<li><b>II-31/B.1<\/b> Tebliğ: <b>17.07.2021<\/b> RG'de yayımlanıp yürürlüğe girdi (PDMK Tebliği ile aynı gün).<\/li>\n<li>Kapsamdaki araçlar: Borçlanma Araçları Tebliği'ndeki <b>borçlanma araçları<\/b> (niteliği itibarıyla borçlanma aracı sayılanlar dahil) ve Kurulca uygun görülen diğerleri. Hüküm olmayan hallerde Kurulun diğer düzenlemeleri ve genel hükümler kıyasen uygulanır.<\/li>\n<\/ul>\n\n<h3>Genel esaslar<\/h3>\n<ul>\n<li>Teminata konu varlıkların sevk, idare, korunma ve muhafazası için teminat yöneticisine <b>mülkiyet devri<\/b> veya onun lehine <b>sınırlı ayni hak<\/b>.<\/li>\n<li>Teminatlı ihraç kural olarak <b>ihraççının isteğine<\/b> bağlıdır; Kurul ihraççının türü, mali durumu, ihraç tutarı veya araç türüne göre teminatı <b>zorunlu<\/b> tutabilir.<\/li>\n<li>Teminat tutarına sınırlayıcı belirleme yoktur; Kurul devir tarihindeki teminat değerinin ödeme yükümlülüklerine <b>eşit veya yüksek<\/b> olmasını isteyebilir.<\/li>\n<li>Devir veya ayni hak işlemleri tamamlanmadan satışa başlanamaz; işlemler en geç satıştan <b>bir iş günü önce<\/b> tamamlanır ve tamamlandığı satıştan önce <b>KAP<\/b>'ta ilan edilir.<\/li>\n<li>Tahsisli veya borsada işlem görmeyecek nitelikli yatırımcı satışlarında ilanlar <b>MKK aracılığıyla<\/b> iletilir ve ihraççının sitesinde yayımlanır.<\/li>\n<li>Teminatlı ihraç için Kuruldan ayrı bir <b>ihraç tavanı<\/b> alınır; bu tavan kapsamındaki ihraçların teminatlı olması <b>zorunludur<\/b>. Yetkili organ kararlarında Borçlanma Araçları Tebliği m.5 kıyasen uygulanır ve teminatlı ihraç olduğu açıkça yazılır.<\/li>\n<\/ul>\n\n<h3>Teminata konu varlıklar<\/h3>\n<ol>\n<li>Nakit (TL ve konvertibl döviz).<\/li>\n<li>VİDMK Tebliği m.16 niteliklerini taşıyan, m.15/1'de sayılan varlıklar.<\/li>\n<li>Hazine ve Maliye Bakanlığının döviz cinsinden tahvilleri, <b>DİBS<\/b>, Hazine VKŞ kira sertifikaları.<\/li>\n<li>BİAŞ <b>Yıldız Pazar<\/b>'da işlem gören paylar.<\/li>\n<li>Bankaların ihraç ettiği, <b>özkaynak hesabına dahil edilenler hariç<\/b> borçlanma araçları.<\/li>\n<li>Kısıtlamasız, <b>ilk talepte derhal ödeme<\/b> taahhüdü içeren banka teminat mektupları.<\/li>\n<li>Yatırım fonu katılma payları.<\/li>\n<li>Borsada işlem gören standart kıymetli madenler.<\/li>\n<li>İpoteğe ve varlığa dayalı menkul kıymetler.<\/li>\n<li>Sigortalanmak şartıyla <b>6750 sayılı<\/b> Ticari İşlemlerde Taşınır Rehni Kanunu m.5/1'deki varlıklar: alacaklar, kazanç ve iratlar, sicile tabi olmayan lisans ve ruhsatlar, kira gelirleri, kiracılık hakkı, makine-teçhizat ve menkul işletme tesisatı, ticari işletme veya esnaf işletmesi.<\/li>\n<li>Sigortalanmak şartıyla MK m.704'teki <b>taşınmazlar<\/b>.<\/li>\n<li>Bu varlıklar üzerindeki <b>sınırlı ayni haklar<\/b>.<\/li>\n<li>Kurulca uygun görülen diğer varlıklar.<\/li>\n<\/ol>\n<ul>\n<li><b>Dikkat:<\/b> listede PDMK yok; VDMK ve İDMK var.<\/li>\n<li>Kurul; varlıkların <b>çeşitlendirilmesini veya değiştirilmesini<\/b> isteyebilir, hangi oranda teminat kabul edileceğini belirleyebilir, düzenli veya arızi yeniden değerleme isteyebilir.<\/li>\n<\/ul>\n<h4>Nitelikler<\/h4>\n<ul>\n<li>Hazine döviz tahvilleri, DİBS ve Hazine kira sertifikaları <b>hariç<\/b>, varlıklar <b>Türkiye'de<\/b> olmalı; alacaksa borçlusu Türkiye'de yerleşik olmalı.<\/li>\n<li>Devri veya ayni hak tesisini kısıtlayan yükümlülük bulunmamalı.<\/li>\n<li><b>Değerleme gerekenler:<\/b> 6750 kapsamındaki varlıklar, taşınmazlar ve sınırlı ayni haklar; değer devir veya hak tesisinden <b>önce<\/b> Kurul düzenlemelerine göre belirlenir.<\/li>\n<li><b>Taşınmazlarda<\/b> <b>iki farklı<\/b> değerleme şirketinden rapor alınır, <b>düşük olan<\/b> esas alınır. Üzerinde sınırlı ayni hak olan taşınmaz, bu hak yükünden arta kalan değer kadar dikkate alınır.<\/li>\n<li>Dönemsel gelirler, sözleşmede aksi yoksa teminat değerine eklenir.<\/li>\n<li><b>Değiştirme:<\/b> varlık teminat yöneticisinin borçları dışındaki bir nedenle haczedilir, mahkeme kararı veya kanunla mülkiyetten çıkar, tedbir uygulanır veya yok olursa ihraççı veya ilgili üçüncü kişi <b>3 iş günü<\/b> içinde aynı değerde yeni varlık devreder veya hak tesis eder.<\/li>\n<\/ul>\n<h4>Koruma<\/h4>\n<ul>\n<li>Varlıklar yalnız ödeme yükümlülüklerinin teminatı amacıyla devredilir. Teminat yöneticisinin malvarlığından <b>ayrıdır<\/b>; onun borçları için kamu alacakları dahil haczedilemez, rehnedilemez, iflas masasına girmez, ihtiyati tedbir ve haciz konamaz. Teminat olduğu ilgili sicilin <b>beyanlar hanesine<\/b> kaydedilir.<\/li>\n<li>Banka, MKK ve finansal kuruluşlardaki teminat varlıkları ayrı hesaplarda izlenir; hesaplar sözleşme gereği açıldığı tanımlanır, amacı dışında kullanılamaz, teminat gösterilemez, blokaj ve rehin konamaz.<\/li>\n<li>Banka hesabı açılırken bankaya yazılı bilgi verilip <b>onay<\/b> alınır; banka <b>15 iş günü<\/b> içinde onay vermezse tutar başka bankaya aktarılır.<\/li>\n<li>Teminat yöneticisinin koruma, muhafaza, idare ve satış giderleri (vergi dahil) teminat varlıklarından <b>karşılanamaz<\/b>; özel düzenlemeler nedeniyle kesinti zorunluysa ihraççı <b>3 iş günü<\/b> içinde tamamlar.<\/li>\n<\/ul>\n\n<h3>Teminat yönetim sözleşmesi<\/h3>\n<ul>\n<li>İhraççı ile teminat yöneticisi arasında; varlıkların devri veya hak tesisi ile teminat yöneticisinin koruma, idare ve gerektiğinde paraya çevirerek ödeme; ihraççı yükümlülüğünü yerine getirirse varlıkların iadesi veya hakkın kaldırılması taahhütlerini içeren <b>yazılı<\/b> sözleşme.<\/li>\n<li><b>Asgari içerik:<\/b> hangi ihraç için yapıldığı; ödeme yükümlülüğünün ne olduğu ve nasıl yerine getirileceği; temerrüt dışında teminattan tahsil halleri ve teminat yöneticisinin derhal bilgilendirilmesi; zilyetliğin hangi tarafta kalacağı ve kullanım; zilyet üçüncü kişiyse bilgi-belge paylaşımı; olağan ve olağandışı giderler, vergi ve değerleme masraflarını kimin karşılayacağı; hak ve yükümlülükler ile ücret; görev devri; varlıkların niteliklerini sağladığı; vade içi değerleme.<\/li>\n<li>Sözleşme ihraç tavanı başvurusu belgeleriyle Kurula iletilir. Tavanın tamamı için <b>tek seferde<\/b> veya tertipler için <b>ayrı ayrı<\/b> yapılabilir.<\/li>\n<li>Tek sözleşmede varlıklar her tertip için oran ve tutar olarak <b>ayrıştırılır<\/b>. Yurt içinde halka arz edilmeksizin ihraçta tavanın tamamı için tek sözleşme başvuruda iletilmişse her tertip için Kurula ayrıca başvuru gerekmez.<\/li>\n<li>Tertip bazında sözleşmede başvuruda <b>taslak<\/b> sunulur, her tertip öncesinde tertip ihraç belgesi başvurusuyla <b>imzalı<\/b> sözleşme iletilir; aynı varlık birden fazla tertibe özgülenirse oran ve tutar yazılır.<\/li>\n<li>İhraçtan sonra yatırımcıların tam ve zamanında tahsilini etkileyecek değişiklikler <b>borçlanma aracı sahipleri kurulu<\/b> kararıyla yapılabilir.<\/li>\n<\/ul>\n<h4>Sona erme<\/h4>\n<ul>\n<li>Olağan sona erme: araçların itfası veya teminatların paraya çevrilip ödemelerin tamamlanması.<\/li>\n<li><b>Uygunsuz kullanım:<\/b> varlıklar sözleşmeye uygun saklanmaz, idare edilmez veya amaç dışı kullanılırsa: ihraççı öğrendiği tarihten itibaren <b>3 iş günü<\/b> içinde bildirir → teminat yöneticisi <b>5 iş günü<\/b> içinde uygunluğu sağlamazsa → bu sürenin sonundan itibaren <b>3 iş günü<\/b> içinde ihraççı sözleşmeyi <b>fesheder<\/b>. Kurul değerleme isteyebilir.<\/li>\n<li>Amaç dışı kullanımı Kurul tespit ederse sözleşmenin sona erdirilmesini isteyebilir.<\/li>\n<li>Teminat yöneticisinin faaliyet izninin iptali, faaliyetinin durdurulması veya <b>genel saklama yetkisinin iptali<\/b>nde o tarihte sona erer.<\/li>\n<li><b>Bağımsızlığı zedeleyen<\/b> hal <b>30 gün<\/b> içinde giderilmezse sona erer.<\/li>\n<li>Olağan sona erme dışındaki hallerde ihraççı <b>5 iş günü<\/b> içinde yeni teminat yöneticisiyle sözleşme yapıp Kurul onayına sunar; tüm haklar yenisine devredilir; devir tamamlanana kadar eskisinin görev ve sorumlulukları sürer.<\/li>\n<\/ul>\n\n<h3>Temerrüt<\/h3>\n<ul>\n<li>Anapara, faiz ve benzeri ödemelerin izahnamedeki sürede yapılmaması <b>temerrüttür<\/b>; sözleşmede temerrütle aynı sonucu doğuran başka haller de belirlenebilir.<\/li>\n<li>Teminat yöneticisi hiçbir ön şart aramadan varlıkları satıp bedeli paylaştırır. Yalnız yükümlülükleri karşılayacak kadarı paraya çevrilir.<\/li>\n<\/ul>\n<table><tr><th>Varlık<\/th><th>İşlem<\/th><\/tr>\n<tr><td>Konvertibl döviz<\/td><td>En geç <b>izleyen iş günü<\/b> TL'ye çevrilip ödenir<\/td><\/tr>\n<tr><td>VİDMK Tebliği m.15/1 varlıkları<\/td><td><b>Vadelerinde tahsil edildikçe<\/b> ödenir<\/td><\/tr>\n<tr><td>Değerleme gerekenler (taşınır rehni varlıkları, taşınmazlar, sınırlı ayni haklar)<\/td><td>Değerleme dahil paraya çevirmeye en geç <b>35 gün<\/b> içinde <b>başlanır<\/b><\/td><\/tr>\n<tr><td>Diğer varlıklar<\/td><td><b>5 iş günü<\/b> içinde paraya çevrilip ödenir<\/td><\/tr>\n<\/table>\n<ul>\n<li>Elde edilen tutar yetmezse <b>oransal ödeme<\/b>: (teminatların satış tutarı / ihraççının ödeme yükümlülükleri) × birim aracın sağladığı alacak.<\/li>\n<li>Ödemeler <b>MKK aracılığıyla<\/b> yapılabilir (sözleşmede yazılır).<\/li>\n<\/ul>\n\n<h3>Tarafların hak ve yükümlülükleri<\/h3>\n<ul>\n<li><b>İhraççı:<\/b> varlıkları devretmek veya hak tesis etmek. Dönemsel ödemeleri yaparsa ödenen veya itfa edilen kısım oranında, satılamayan araç varsa o kısım oranında varlığın <b>iadesini<\/b> isteyebilir (izahnameye uygunluk ve yeterli teminatın kalması şartıyla).<\/li>\n<li>Teminat yöneticisinin unvanı, hangi ihraç için atandığı ve yetkileri <b>ilk satıştan önce<\/b>; sonradan değişirse imzadan itibaren <b>3 iş günü<\/b> içinde ihraççının merkezinin ticaret siciline tescil ve TTSG'de ilan edilir.<\/li>\n<li><b>Teminat yöneticisi:<\/b> sevk ve idare, koruma, hukuki yollara başvurma, temerrütte paraya çevirme ve paylaştırma, artan değeri teminat verene iade, itfada varlıkları iade; tapu, araç sicili, taşınır rehin sicili işlemlerini <b>kendi adına ve yatırımcılar hesabına<\/b> yapar.<\/li>\n<li>Devralırken niteliklerini kontrol eder; sonradan niteliksiz anlaşılan varlıkların değiştirilmesini ister, en geç <b>5 iş günü<\/b> içinde değiştirilir.<\/li>\n<li>Yatırımcı menfaatini gözeterek iyi niyet, sadakat ve özenle çalışır. Sözleşme izin veriyorsa görevlerini devredebilir; devralanla ayrı sözleşme yapar, kontrol eder. Devir veya zilyetliğin başkasında kalması <b>sorumluluğunu kaldırmaz<\/b>; sorumluluğu azaltan sözleşmeler <b>geçersizdir<\/b>.<\/li>\n<\/ul>\n\n<h3>Teminat yöneticisi<\/h3>\n<ul>\n<li><b>Genel saklama yetkisine<\/b> sahip yatırım kuruluşlarından Kurulca onaylanıp ilan edilenler.<\/li>\n<li><b>Bağımsızlık:<\/b> ihraççıyla <b>ilişkili taraf olamaz<\/b>. Sözleşme süresince teminat yöneticisi (ve yönetim kontrolündeki ortağı) ile ihraççı (ve yönetim kontrolündeki ortağı) arasında, araçların tedavüldeki nominalinin <b>%30<\/b>'u veya fazlası tutarında <b>halka arza aracılık<\/b> hizmeti sağlanamaz ve <b>borç ilişkisi<\/b> kurulamaz. Karşılıklı rehin, ipotek, kefalet, garanti verilemez. Teminat yöneticisi, ortakları, YK üyeleri ve genel müdürü bu işleri yapan üçüncü kişilerin <b>%20<\/b> ve üzeri oy hakkı sağlayan ortağı veya imza yetkilisi olamaz.<\/li>\n<li>Edindiği bilgilerin gizliliğini sağlar; yatırım danışmanlığı, portföy yönetimi gibi hizmetlerde menfaat için kullanamaz.<\/li>\n<li><b>Organizasyon:<\/b> <b>SPF Düzey 3<\/b> lisanslı ve finansal piyasalarda en az <b>5 yıl<\/b> deneyimli birim yöneticisi ile yeterli personel; bilgi paylaşımını engelleyen kurumsal yapı, iş akışları ve iç kontrol.<\/li>\n<li>Personel şartları: yükseköğrenim; iflas ve konkordato olmaması; izni iptal edilmiş kuruluşta sorumluluk olmaması; Kanundaki suçlardan mahkûmiyet olmaması; TCK m.53 süreleri geçse de sayılan suçlardan mahkûmiyet olmaması; bankacılık ve 6415 sayılı Kanun suçlarından (affa uğrasa dahi) mahkûm olmaması.<\/li>\n<\/ul>\n\n<h3>Kamuyu aydınlatma ve kayıtlar<\/h3>\n<ul>\n<li><b>Teminat raporu<\/b> (Ek-1 örneğine uygun), şu hallerde <b>10 iş günü<\/b> içinde hazırlanır: ihraçtan sonraki her <b>altı aylık<\/b> dönem; temerrüt veya eşdeğer hal; paraya çevirme işleminin sonuçlanması; Kurulun istediği haller. Makul gerekçeyle ek süre verilebilir.<\/li>\n<li>Altı aylık raporda varlıkların nitelikleri, muhafaza ve idare, giderler ve gelirler; paraya çevirme raporunda süreç, tahsilat, yükümlülüğün ne kadarının karşılandığı, alıcının nasıl belirlendiği, değerleme bilgileri.<\/li>\n<li>Raporun doğruluğundan <b>teminat yöneticisi<\/b> sorumlu; rapor imzalandığı tarihi izleyen <b>iş günü<\/b> teminat yöneticisince <b>KAP<\/b>'ta açıklanır (tahsisli ve nitelikli satışta MKK ve ihraççının sitesi).<\/li>\n<li><b>Teminat yöneticisinin özel durum açıklaması:<\/b> sözleşme değişikliği; bağımsızlığı zedeleyen hal ve nasıl giderileceği; değerleme gerektirmeyen teminatların devir tarihindeki değerinde <b>%25'i aşan<\/b> azalma ve sonrasında her <b>ilave %20<\/b> azalma; ödemenin teminattan karşılanması gündeme geldiğinde (değerleme kuruluşlarıyla anlaşma ve sonuçlar, paraya çevirme ve paylaştırma, karşı tarafın ilişkili taraf olup olmadığı); yükümlülük yerine getirilince teminatın iadesi; temerrüt; Kurulun gerekli gördüğü haller.<\/li>\n<li>Teminat yöneticisi yükümlülüklerini yerine getirmezse <b>ihraççı<\/b> özel durum açıklaması yapar.<\/li>\n<li><b>Teminat defteri:<\/b> teminat yöneticisi tutar; <b>her ihraç için ayrı<\/b> defter; elektronik tutulabilir. Kredi, kiralama, ticari alacak, teminat, nakit, menkul kıymet, taşınmaz, taşınır, kıymetli maden ve sınırlı ayni hak bilgileri yer alır.<\/li>\n<li><b>Saklama:<\/b> defter, sözleşmeler, yazışmalar ve organ kararları düzenlenmeden itibaren TTK m.82 uyarınca <b>10 yıl<\/b>. Devralınan varlıklara ilişkin belgeler düzenlenmeden itibaren <b>5 yıldan az olmamak<\/b> üzere itfaya, temerrütte ödeme süreci tamamlanana kadar.<\/li>\n<\/ul>", "sorular": [{"q": "Teminat yönetim sözleşmesi ve teminat yöneticisi SPKn'nun hangi maddesinde düzenlenmiştir?", "o": ["m.31/B", "m.31", "m.59", "m.61/B", "m.63"], "a": 0, "e": "7222 sayılı Kanunla eklenen SPKn m.31/B teminat yönetim sözleşmesi ve teminat yöneticisini düzenler."}, {"q": "II-31/B.1 Tebliği'ne göre teminat tutarıyla ilgili hangisi doğrudur?", "o": ["Teminat değeri ihraç tutarının en az %150'si olmalıdır", "Tebliğde sınırlayıcı bir belirleme yoktur; Kurul, devir tarihindeki teminat değerinin ödeme yükümlülüklerine eşit veya yüksek olmasını isteyebilir", "Teminat değeri ihraç tutarının en az %120'si olmalıdır", "Teminat tutarını teminat yöneticisi belirler ve Kurul müdahale edemez", "Teminat değeri ihraç tutarının yarısını aşamaz"], "a": 1, "e": "Tebliğ teminat tutarı için sınır koymamıştır; Kurul teminat varlıkların devir tarihindeki değerinin, ödeme yükümlülüklerinin aynı tarihteki tutarına eşit veya yüksek olmasını isteyebilir."}, {"q": "Temerrüt halinde teminat yöneticisinin teminatları paraya çevirmesiyle ilgili hangisi doğrudur?", "o": ["Önce ihraççıya noter ihtarı göndermelidir", "Mahkeme izni alması gerekir", "İhbar, ihtar, süre verme, izin veya açık artırma gibi bir ön şart olmaksızın satıp bedeli paylaştırabilir", "Açık artırma zorunludur", "Kurul onayı olmadan satamaz"], "a": 2, "e": "m.31/B teminat yöneticisine herhangi bir ön şart aramadan satış ve paylaştırma yetkisi verir."}, {"q": "Teminatlı ihraçta teminata konu varlıkların devri veya ayni hak tesisi işlemleri en geç ne zaman tamamlanmalıdır?", "o": ["Satıştan sonraki ilk iş günü", "Satıştan 5 iş günü önce", "İzahname onayından önce", "Satışa başlanmadan bir iş günü önce", "İtfadan önce"], "a": 3, "e": "İşlemler en geç satışa başlanmadan bir iş günü önce tamamlanır ve satıştan önce KAP'ta ilan edilir."}, {"q": "Teminatlı ihraçla ilgili hangisi doğrudur?", "o": ["Teminatlı ihraç her durumda zorunludur", "Teminatlı tavan içinde teminatsız ihraç da yapılabilir", "Teminat tutarı ihraç tutarının en az iki katı olmalıdır", "Teminatlı ihraç için ayrı tavan alınmaz", "Teminatlı ihraç kural olarak ihraççının isteğine bağlıdır; Kurul belirli hallerde zorunlu tutabilir"], "a": 4, "e": "Teminatlı ihraç kural olarak ihtiyaridir; Kurul ihraççının türü, mali durumu gibi kriterlerle zorunlu kılabilir. Teminatlı tavandaki ihraçların teminatlı olması zorunludur."}, {"q": "II-31/B.1 Tebliği'ne göre aşağıdakilerden hangisi teminata konu varlık olarak gösterilebilir?", "o": ["Borsa İstanbul Yıldız Pazar'da işlem gören paylar", "Borsa İstanbul Ana Pazar'da işlem gören paylar", "Bankaların özkaynak hesaplamasına dahil edilecek nitelikteki borçlanma araçları", "Ödemesi şarta bağlanmış banka teminat mektupları", "Borsada işlem görmeyen kıymetli madenler"], "a": 0, "e": "Paylardan yalnız Yıldız Pazar'da işlem görenler sayılmıştır; banka teminat mektubu kısıtlamasız ve ilk talepte ödemeli olmalı, kıymetli madenler borsada işlem gören standart madenler olmalı, bankaların özkaynağa dahil borçlanma araçları ise hariç tutulmuştur."}, {"q": "Bankaların ihraç ettiği borçlanma araçlarından hangileri teminat olarak kabul edilmez?", "o": ["Kısa vadeli bonolar", "Özkaynak hesaplamasına dahil edilecek nitelikteki borçlanma araçları", "Döviz cinsinden tahviller", "Halka arz edilen tahviller", "Değişken faizli tahviller"], "a": 1, "e": "Bankaların özkaynak hesabına dahil edilecek nitelikteki borçlanma araçları teminat olamaz."}, {"q": "Teminat olarak gösterilecek bir taşınmazın değeri nasıl belirlenir?", "o": ["Tek değerleme raporundaki değer", "İki farklı değerleme şirketinin raporlarından yüksek olanı", "İki farklı değerleme şirketinin raporlarından düşük olanı", "Tapu değeri", "İki raporun ortalaması"], "a": 2, "e": "Taşınmazlar için iki farklı değerleme şirketinden rapor alınır ve düşük olan esas alınır."}, {"q": "Teminata konu bir varlığın teminat yöneticisinin borçları dışındaki bir nedenle haczedilmesi halinde ihraççı yeni varlığı en geç kaç iş günü içinde devretmelidir?", "o": ["1 iş günü", "10 iş günü", "5 iş günü", "3 iş günü", "15 iş günü"], "a": 3, "e": "Aynı değerde yeni varlıkların 3 iş günü içinde devredilmesi veya üzerinde hak tesis edilmesi zorunludur."}, {"q": "Teminat yöneticisinin teminat varlıkları için açtırdığı banka hesabına banka kaç iş günü içinde onay vermezse tutar başka bankaya aktarılır?", "o": ["3 iş günü", "5 iş günü", "10 iş günü", "30 gün", "15 iş günü"], "a": 4, "e": "Banka 15 iş günü içinde onay vermezse teminat yöneticisi tutarı başka bankaya aktarmak zorundadır."}, {"q": "Teminat yöneticisinin teminat varlıklarını korumak ve satmak için yaptığı giderlerle ilgili hangisi doğrudur?", "o": ["Teminat varlıklarından karşılanamaz; zorunlu kesinti olursa ihraççı 3 iş günü içinde tamamlar", "Yatırımcılardan tahsil edilir", "Teminat varlıklarından karşılanır", "Kurul öder", "MKK öder"], "a": 0, "e": "Bu giderler teminat varlıklarından karşılanamaz; özel düzenleme gereği kesinti yapılırsa ihraççı 3 iş günü içinde karşılar."}, {"q": "İhraçtan sonra teminat yönetim sözleşmesinde yatırımcıların alacaklarını tam ve zamanında almalarını etkileyecek değişiklikler hangi organın kararıyla yapılabilir?", "o": ["İhraççının yönetim kurulu", "Borçlanma aracı sahipleri kurulu", "Teminat yöneticisi", "Kurul", "MKK"], "a": 1, "e": "Bu tür değişiklikler borçlanma aracı sahipleri kurulunca karara bağlanmalıdır."}, {"q": "Teminat yöneticisinin varlıkları sözleşmeye aykırı kullanması halinde fesih sürecindeki süreler hangi sırayla doğrudur?", "o": ["Bildirim 5 iş günü, düzeltme 3 iş günü, fesih 5 iş günü", "Bildirim 3 iş günü, düzeltme 5 iş günü, fesih 3 iş günü", "Bildirim 10 gün, düzeltme 10 gün, fesih 10 gün", "Bildirim 1 iş günü, düzeltme 3 iş günü, fesih 1 iş günü", "Bildirim 3 iş günü, düzeltme 10 iş günü, fesih 5 iş günü"], "a": 1, "e": "İhraççı öğrendiğinden itibaren 3 iş günü içinde bildirir; teminat yöneticisi 5 iş günü içinde düzeltmezse ihraççı izleyen 3 iş günü içinde fesheder.", "k": 1}, {"q": "Teminat yöneticisinin bağımsızlığını zedeleyen hal ne kadar süre içinde giderilmezse teminat yönetim sözleşmesi sona erer?", "o": ["5 iş günü", "15 gün", "30 gün", "60 gün", "90 gün"], "a": 2, "e": "Bağımsızlığı zedeleyen durum 30 gün içinde giderilmezse sözleşme sona erer."}, {"q": "Teminat yönetim sözleşmesinin olağan sona erme dışındaki bir nedenle sona ermesi halinde ihraççı yeni teminat yöneticisiyle sözleşmeyi en geç ne zaman yapıp Kurul onayına sunmalıdır?", "o": ["3 iş günü", "15 iş günü", "10 iş günü", "5 iş günü", "30 gün"], "a": 3, "e": "İhraççı sona ermeden itibaren 5 iş günü içinde yeni sözleşme yapıp Kurul onayına sunar; devre kadar eski yöneticinin görevi sürer."}, {"q": "Temerrüt halinde teminata konu varlık konvertibl döviz ise yatırımcılara ödeme nasıl yapılır?", "o": ["Döviz olarak aynı gün", "Vadesinde", "5 iş günü içinde döviz olarak", "35 gün içinde", "En geç izleyen iş günü TL'ye çevrilerek"], "a": 4, "e": "Konvertibl döviz en geç izleyen iş günü TL'ye çevrilerek yatırımcılara ödenir."}, {"q": "Temerrüt halinde değerleme gerektiren teminat varlıklarının (taşınmaz, taşınır rehni varlıkları) paraya çevrilmesi işlemlerine en geç ne zaman başlanır?", "o": ["35 gün içinde", "15 gün içinde", "30 gün içinde", "5 iş günü içinde", "60 gün içinde"], "a": 0, "e": "Değerleme dahil paraya çevirme işlemlerine en geç 35 gün içinde başlanır; diğer varlıklar 5 iş günü içinde paraya çevrilir."}, {"q": "Teminatların satış tutarı 60 milyon TL, ihraççının toplam ödeme yükümlülüğü 80 milyon TL ise birim başına 1.000 TL alacak sağlayan bir tahvile ne kadar ödeme yapılır?", "o": ["600 TL", "750 TL", "800 TL", "1.000 TL", "1.333 TL"], "a": 1, "e": "Oransal ödeme = (60 / 80) x 1.000 = 750 TL."}, {"q": "Teminat yöneticisi olabilecek kuruluşlar hangisidir?", "o": ["Tüm bankalar", "Bağımsız denetim kuruluşları", "Genel saklama yetkisine sahip yatırım kuruluşlarından Kurulca onaylanıp ilan edilenler", "Portföy yönetim şirketleri", "Derecelendirme kuruluşları"], "a": 2, "e": "Teminat yöneticisi genel saklama yetkili yatırım kuruluşlarından Kurulca onaylanıp ilan edilenlerdir."}, {"q": "Teminat yöneticisinin bağımsızlığına ilişkin hangisi yanlıştır?", "o": ["İhraççıyla ilişkili taraf olamaz", "Tedavüldeki nominalin %30'u veya fazlası tutarında ihraççıyla borç ilişkisi kuramaz", "İhraççı lehine kefalet veya garanti veremez", "İhraççının halka arzına sınırsız tutarda aracılık edebilir", "Edindiği bilgileri portföy yönetiminde menfaat için kullanamaz"], "a": 3, "e": "Tedavüldeki nominalin %30'u veya fazlası tutarında halka arza aracılık hizmeti sağlanamaz."}, {"q": "Teminat yöneticisi bünyesindeki birim yöneticisinde aranan şart hangisidir?", "o": ["SPF Düzey 1 lisansı ve 2 yıl deneyim", "Hukuk fakültesi mezuniyeti", "Türev Araçlar lisansı ve 3 yıl deneyim", "Bağımsız denetçi belgesi", "SPF Düzey 3 lisansı ve finansal piyasalarda en az 5 yıl deneyim"], "a": 4, "e": "Birim yöneticisi SPF Düzey 3 lisanslı ve finansal piyasalarda en az beş yıllık deneyimli olmalıdır."}, {"q": "Teminat raporu ile ilgili hangisi doğrudur?", "o": ["İhraçtan sonraki her altı aylık dönem için 10 iş günü içinde hazırlanır ve imzayı izleyen iş günü teminat yöneticisince KAP'ta açıklanır", "Yıllık hazırlanır ve ihraççı açıklar", "Aylık hazırlanır", "Yalnız temerrütte hazırlanır", "Bağımsız denetim kuruluşunca hazırlanır"], "a": 0, "e": "Teminat raporu altı aylık dönemler ve temerrüt gibi hallerde 10 iş günü içinde hazırlanır; imzayı izleyen iş günü KAP'ta açıklanır."}, {"q": "Değerleme gerektirmeyen teminat varlıklarının değerinde ne kadarlık azalma teminat yöneticisinin özel durum açıklaması yapmasını gerektirir?", "o": ["%10'u aşan azalma ve sonrasında her %10", "%25'i aşan azalma ve sonrasında her ilave %20", "%20'yi aşan azalma ve sonrasında her %25", "%50'yi aşan azalma", "Her türlü azalma"], "a": 1, "e": "Devir tarihindeki değerde %25'i aşan azalmada ve sonrasında her ilave %20'lik azalmada açıklama yapılır."}, {"q": "Teminat yöneticisinin teminat defteri ve sözleşmeleri saklama süresi hangisidir?", "o": ["5 yıl", "8 yıl", "10 yıl", "İtfaya kadar", "Süresiz"], "a": 2, "e": "Teminat defteri, sözleşmeler, yazışmalar ve organ kararları TTK m.82 uyarınca düzenlenmeden itibaren 10 yıl saklanır."}, {"q": "Teminat yöneticisinin ticaret siciline tescili ile ilgili hangisi doğrudur?", "o": ["Teminat yöneticisi kendi sicilinde tescil ettirir", "MKK tescil eder", "Tescil gerekmez", "İhraççı ilk satıştan önce; değişiklikte imzadan itibaren 3 iş günü içinde kendi merkezinin siciline tescil ve TTSG'de ilan ettirir", "Kurul tescil eder"], "a": 3, "e": "Unvan, ihraç ve yetkiler ihraççı tarafından ilk satıştan önce, değişiklikte 3 iş günü içinde ihraççının merkezindeki sicile tescil ve ilan edilir."}]}];
const P={"1": ["Merhaba, Sermaye Piyasası Araçları iki dersinin ilk bölümündeyiz: İzahname ve İhraç Belgesi Tebliği. Bu bölümde bol bol süre var; iş günleri, aylar, yıllar birbirine karışıyor. O yüzden sana her süreyi bir yere bağlayarak anlatacağım.", "Önce kapsam. Tebliğ, sermaye piyasası araçlarının ihracında ya da borsada işlem görmesinde hazırlanacak izahname ve ihraç belgesini düzenler. Yatırım kuruluşu varantı ve sertifikası da bu Tebliğe tabidir. Ama yatırım fonu payları, emeklilik fonu payları ve değişken sermayeli yatırım ortaklığı payları kapsam dışında. Kamu idareleri, Merkez Bankası ihraçları ve Hazine ve Maliye Bakanlığının koşulsuz garanti verdiği araçlar da muaf; bunlar için ihtiyari belge hazırlansa bile Kurul onaylamaz.", "İzahname, yatırımcının bilinçli karar verebilmesi için ihraççı ve araç hakkında her şeyi anlatan kamuyu aydınlatma belgesidir. Halka arz ya da borsada işlem görme için izahname zorunlu; halka arz edilmeksizin satışta değil. Halka arz genel bir çağrıdır, ihraç ise hem halka arzı hem halka arz edilmeksizin satışı kapsadığı için daha geniş bir kavramdır. Onaysız izahnameyle halka arz yapmak usulsüz halka arz suçudur; cezası iki yıldan beş yıla kadar hapis ve beş binden on bin güne kadar adli para cezası.", "Muafiyetlere gelelim. Dört temel hal var: yatırımcı başına en az iki yüz elli bin liralık alım, birim nominali en az iki yüz elli bin lira olan araç, yalnız nitelikli yatırımcılar arasında işlem ve duyuru metni ilan edilen birleşme ve bölünme. Bu iki yüz elli bin liralık sınır her yıl yeniden değerlenebiliyor; iki bin yirmi altı yılı için dokuz milyon beş yüz bin lira olarak açıklandı. Toplam satış bedeline dayalı muafiyet ise ihraççının talebiyle verilir ama payların ilk halka arzında uygulanmaz, bunu unutma.", "Bir de borsada işlem gören niteliğe dönüştürülen paylar var. Bunların halka arzında, nominal değerin aynı gruptaki borsada işlem gören payların toplamına oranı on iki ay içinde yüzde onun altında kalıyorsa izahname gerekmez. Ayrıca nitelikli yatırımcıya satış, tahsisli satış, bedelsiz pay, pay bölünmesi gibi durumlarda zaten izahname hazırlanmaz. Ama dikkat: bu şekilde çıkmış araçlar sonradan halka arz edilirse izahname zorunlu hale gelir.", "İzahname türleri üç tane: tek belgeden oluşan, birden fazla belgeden oluşan ve arz programı izahnamesi. Birden fazla belgede ihraççı bilgi dokümanı, sermaye piyasası aracı notu ve özet var. İhraççı bilgi dokümanı şirketi anlatır, araç notu aracı anlatır, özet ise ikisinden kısa ve anlaşılır bir derleme yapar. Özette mutlaka iki uyarı olur: özet bir giriştir, karar izahnamenin bütününe göre verilmeli; ve özet diğer kısımlarla birlikte okunduğunda yanıltıcıysa hukuki sorumluluk doğar.", "Arz programı izahnamesi sadece bankalar için ve sadece ortaklık hakkı vermeyen araçlar için, ihtiyari olarak hazırlanır. Program en fazla beş yıllık süreyi kapsar. Mükerrer ihraç demek, on iki ay içinde en az iki kez ihraç demek. Program genel kurulda ayrı gündem maddesiyle onaylanır ve nisaplarda Türk Ticaret Kanununun dört yüz on sekizinci maddesi uygulanır. Her ihraçtan önce de arz programı sirküleri onaylatılır.", "Finansal tablolarda ana kural şu: ortaklık hakkı veren araçlarda son üç yıl, vermeyen araçlarda son iki yıl. İlk halka arzda ise dönem dönem ara tablolar istenir. Ocak başından on beş Şubata kadar dokuz aylık, on beş Mayısa kadar ara tablo yok, on beş Ağustosa kadar üç aylık, on beş Kasıma kadar altı aylık, yıl sonuna kadar dokuz aylık. Diğer halka arzlarda ise sadece iki kırılım var: on beş Şubat ile on beş Ağustos arası ara tablo gerekmez, onun dışında altı aylık eklenir.", "İzahnamede değişiklik gerekirse ihraççı Kurula derhal yazılı bildirir, Kurul değişikliği yedi iş günü içinde onaylar. Değişiklikten önce talepte bulunan yatırımcı, yayımdan itibaren iki iş günü içinde talebini geri alabilir. İzahname ilk yayım tarihinden itibaren on iki ay geçerlidir; birden fazla belgede bu süre ihraççı bilgi dokümanının ilk yayımıyla başlar.", "İlan sürelerini bir arada tut. Onaya sunulan taslak izahname başvurudan itibaren beş iş günü içinde ilan edilir. Onaylı izahnamenin nerede yayımlandığı ilandan itibaren on iş günü içinde ticaret siciline tescil edilir, ama satışa başlamak için bu tescil şart değil. İnternet sitesindeki izahname en az beş yıl korunur. İzahnamenin geçerlilik tarihi, şirket Kamuyu Aydınlatma Platformu üyesiyse oradaki ilan tarihidir.", "İhraç belgesine geçelim. Halka arz edilmeksizin ihraçta, yurt dışı ihraçta ve izahnamesiz diğer ihraçlarda ihraç belgesi zorunludur. Geçerlilik süresi Kurul karar tarihinden itibaren bir yıl. İzahnamede on iki ay ilk yayımdan başlıyordu, ihraç belgesinde Kurul kararından başlıyor; bu ayrımı sınavda sorarlar. İhraç belgesi ticaret siciline tescil edilmez, teslimden itibaren on beş iş günü içinde ilan edilir. Yurt içinde halka arz edilmeksizin satışta, düzenleme öngörüyorsa her tertip için Kurula değil Merkezi Kayıt Kuruluşuna başvurulup Kurul ücreti dekontu ibraz edilir.", "Tasarruf sahiplerine satış duyurusu, sermaye artırımlarında hak kullanımından sonra kalan payların halka arzı için hazırlanır. Kalan payların nominali yüz elli bin liranın ya da yüzde birin altındaysa Kurul onayı almadan özel durum açıklamasıyla yetinilebilir. Duyuru, hak kullanım süresinin bitiminden sonra aynı gün ilan edilir.", "Onay sürecinde inceleme süresi on iş günü, payların ilk halka arzında yirmi iş günü. Eksik belge varsa yirmi iş günü içinde tamamlanması istenir ve süreler baştan başlar. Kurul süre içinde karar vermezse bu ne onay ne ret demektir. Onaylanan izahname yirmi iş günü içinde teslim alınmazsa ya da teslimden sonra on beş iş günü içinde ilan edilmezse yeniden onay gerekir. Ve unutma: Kurul onayı bilgilerin doğruluğunu tekeffül etmez, reklamda bu şekilde kullanılamaz.", "Sorumlulukta ilk sırada ihraççı var. Zarar ihraççıdan karşılanamazsa halka arz eden, lider yetkili kuruluş, varsa garantör ve yönetim kurulu üyeleri kusurlarına göre sorumlu olur. Kamuyu aydınlatma belgelerini imzalayanlar müteselsilen sorumludur; kast veya ağır ihmali olmadığını ispatlayan kurtulur. Sorumluluğu hafifleten anlaşmalar geçersizdir. Bağımsız denetim, derecelendirme ve değerleme kuruluşları da kendi raporlarından sorumludur.", "Reklamlarda üç kuralı aklında tut. Fiyat yazılıyorsa Kurulun ve borsanın fiyata onay vermediği vurgulanır. Yatırım kararının izahnameye bakılarak verilmesi gerektiği uyarısı zorunludur. İzahname yayımlanmadan önce yapılan reklam ise yalnızca sektör, şirketin konumu ve ürünleri hakkında olabilir.", "Özetleyelim: birincisi, izahname on iki ay, ihraç belgesi Kurul kararından itibaren bir yıl geçerli. İkincisi, inceleme on iş günü, ilk halka arzda yirmi iş günü. Üçüncüsü, taslak beş, tescil on, ihraç belgesi ilanı on beş iş günü. Dördüncüsü, ortaklık hakkı verende üç yıl, vermeyende iki yıl finansal tablo. Beşincisi, yatırımcı değişiklikten sonra iki iş günü içinde talebini geri alabilir. Şimdi sorulara geçebilirsin."], "2": ["Merhaba, ikinci bölümdeyiz: Sermaye Piyasası Araçlarının Satışı Tebliği. İzahname neyin anlatılacağını düzenliyordu; bu Tebliğ ise satışın nasıl yapılacağını, kime ne kadar dağıtılacağını düzenliyor. Bol oran ve süre var, ama mantığını kurarsan kolay.", "Tebliğ iki bin on üç Haziranında yayımlandı ve bir ay sonra yürürlüğe girdi. İçindeki tutarlar her yıl Hazine ve Maliye Bakanlığının ilan ettiği yeniden değerleme katsayısına göre güncellenebiliyor. Kapsam dışında kalanları hatırla: yatırım fonları, emeklilik fonları, değişken sermayeli yatırım ortaklıkları ve halka açık olmayan ortaklıkların halka arz edilmeksizin satışı.", "Kavramlarda ihraççı ile halka arz edeni karıştırma. İhraççı aracı çıkaran tüzel kişidir; halka arz eden ise elindeki mevcut payları satan gerçek ya da tüzel kişidir. Yetkili kuruluş da halka arza aracılık etmeye yetkili aracı kurumlar ile yatırım ve kalkınma bankalarıdır.", "Satış şekilleri iki tane: halka arz ve halka arz edilmeksizin satış. Halka arzda yatırımcı nakit yerine bazı varlıklarını bloke ettirerek de talepte bulunabilir; örneğin Borsa İstanbul otuz endeksindeki paylar, para piyasası fonları, devlet tahvili, döviz, mevduat ya da kira sertifikası. Kurumsal yatırımcı ise ödenmeme riskini yetkili kuruluş üstlenirse parayı talep toplama bittikten sonra da ödeyebilir.", "Halka arz edilmeksizin satışın en önemli sayısı yüz elli. Tahsisli satılan bir aracı aynı anda elinde tutan yatırımcı sayısı yüz elliyi geçmemeli. Kontrol günlük yapılır, müşterek hesap sahipleri ayrı ayrı sayılır, nitelikli yatırımcılar ise hiç sayılmaz. Sınır aşılırsa Merkezi Kayıt Kuruluşu bunu ihraççıya ve Kurula bildirir, ihraççı da yirmi iş günü içinde izahname için Kurula ve borsaya başvurur. Nitelikli yatırımcılara satışta ise sayı sınırı hiç yok.", "Satış yöntemlerine gelelim. Talep toplama üç türlü: sabit fiyatla, fiyat teklifi alarak ve fiyat aralığıyla. En sık kullanılan sabit fiyat. Fiyat aralığında tavan fiyat tabanın yüzde yirmi fazlasını geçemez; taban yirmi beş liraysa tavan en çok otuz lira olur. Bunların yanında talep toplanmaksızın satış ve borsada satış yöntemleri var. Borsada satışın esaslarını borsa belirler.", "Talep toplama bazı durumlarda zorunlu. Payları borsada işlem görmeyen halka açık bir ortaklık; defter değeri nominalin en az iki katıysa, son yıl kâr etmişse ve aktif toplamı yirmi milyon lirayı aşıyorsa, artırımdan kalan payları talep toplayarak satmak zorunda. Payları borsada işlem gören ortaklıkta ise işlem sırası olan gruptaki kalan paylar borsada satılır. Ve kalan paylar hiçbir zaman nominal değerin altında satılamaz.", "Satışa başlama süresi: izahname ve fiyat tespit raporundan hangisi daha geç yayımlandıysa onu izleyen üçüncü gün. Ama araçları zaten borsada işlem gören ihraççılar için bu süre takip eden iş günü olarak uygulanır; Cuma ilan edersen Pazartesi satışa çıkarsın. Yalnız payların ilk halka arzında yine üç gün kuralı geçerli.", "Fiyat revizyonu sadece aşağı yönlü yapılabilir ve izahname değişikliği gerektirmez. Satış başlamadan önce revize edilirse açıklamayı izleyen ikinci gün satışa çıkılır; satış sırasında revize edilirse süreye en az iki iş günü eklenir. Halka arzın satış süresi ise en az iki, en fazla yirmi iş günü. Borsada talep toplama ile satışta bu süre iki ila üç iş günü.", "Tahsisata geçelim. Yurt içi bireysel yatırımcıya en az yüzde on, yurt içi kurumsal yatırımcıya en az yüzde on ayrılması zorunlu. Gruplar arasında kaydırma yapılabilir ama hiçbir grubun payı izahnamedeki tutarın yüzde yirmisinden fazla azaltılamaz. Yani izahnamede yüzde elli olan grup en az yüzde kırka iner. Kurul isterse asgari oranları sıfıra kadar indirebilir ya da bir kat artırabilir.", "Dağıtımda iki yöntem var. Eşit dağıtımda toplam tutar talep eden kişi sayısına bölünür, o tutarın altındaki talepler tamamen karşılanır, kalan yine bölünür ve böyle devam eder. Oransal dağıtımda ise arzın talebe oranı bulunur ve herkesin talebi bu oranla çarpılır. Fiyat teklifi yönteminde satış fiyatı, birikimli olarak en çok aracın satılabildiği fiyattır. Bir yatırımcı birden fazla talep verdiyse sadece en yüksek miktarlı talebi dikkate alınır.", "Dağıtım sonrası takvim şöyle: yetkili kuruluş listeyi iki iş günü içinde ihraççıya verir, ihraççı iki iş günü içinde onaylar, karşılanamayan taleplerin parası da onaylı listenin teslimini izleyen iş günü iade edilir. Satış sonuçlarında nominalin yüzde beşinden fazlasını alanlar iki iş günü içinde açıklanır. Kayıtlar beş yıl saklanır.", "İki bin yirmi dört Eylülünde çıkan İlke Kararı ilk halka arzlar için çok önemli. Halka arz büyüklüğü yedi yüz elli milyon lira ve altındaysa borsada satış zorunlu. Daha büyük halka arzlarda bireysellere eşit dağıtım yapılır. Kurumsal grupta tahsisatın en az yarısı yatırım ve emeklilik fonlarına gider, tek bir kurumsala yüzde birden fazla verilemez. Yüksek talepli yatırımcı grubuna en fazla yüzde on ayrılabilir.", "Aynı kararın satış kısıtlarını da ezberle. Halka arzdan pay alan yatırımcı doksan gün boyunca payları borsa dışında satamaz, virmanlayamaz. Mevcut ortaklar ise izahname onayından itibaren yüz seksen gün boyunca borsada bile satamaz. İçsel bilgiye ulaşabilecek kişiler ve yakınları sadece yurt içi bireysel gruptan talepte bulunabilir.", "Son olarak teşvikler. Belirli gruplara Kurul izniyle farklı fiyat uygulanabilir ama fark yüzde yirmiyi aşamaz ve aynı grup içinde farklı fiyat olmaz. Halka arzdan toplanan fonu sonradan azaltacak bir teşvik verilemez. Talep tutarı da halka arz sürerken açıklanamaz, ancak süre bittikten sonra açıklanabilir.", "Özetleyelim: birincisi, tahsisli satışta yüz elli kişi sınırı. İkincisi, fiyat aralığında tavan tabanın yüzde yirmi fazlası. Üçüncüsü, satış süresi iki ila yirmi iş günü. Dördüncüsü, bireysel ve kurumsala en az yüzde on, kaydırmada en fazla yüzde yirmi azaltma. Beşincisi, yedi yüz elli milyon liraya kadar borsada satış, doksan ve yüz seksen günlük satış kısıtları. Şimdi sorulara geçebilirsin."], "3": ["Merhaba, varlık finansmanı bölümündeyiz. Bu bölüm iki parçadan oluşuyor: önce konut finansmanının kavramsal çerçevesi, sonra varlığa veya ipoteğe dayalı menkul kıymetler tebliği. Kavramsal kısımda tanım ve sınıflandırma, tebliğ kısmında ise süreler ve oranlar soruluyor.", "Tarihle başlayalım. İlk düzenleme bin dokuz yüz doksan iki yılında eski Sermaye Piyasası Kanununa eklenen on üç A maddesiyle geldi. Asıl sıçrama iki bin yedide beş bin beş yüz seksen iki sayılı Konut Finansmanı Kanunuyla oldu. İki bin on dörtte de bugünkü iki tebliğ çıktı: varlığa veya ipoteğe dayalı menkul kıymetler tebliği ve teminatlı menkul kıymetler tebliği.", "En önemli ayrım Avrupa modeli ile Amerika modeli arasında. Avrupa modeli bilanço içidir; ipotek teminatlı ve varlık teminatlı menkul kıymetler, yani covered bond'lar buraya girer ve riskler ihraççının bilançosunda kalır. Amerika modeli bilanço dışıdır; ipoteğe dayalı ve varlığa dayalı menkul kıymetler buraya girer, varlıklar özel amaçlı bir kuruluşa devredilir ve riskler yatırımcıya geçer. Akılda tutmak için: teminatlı kelimesi geçiyorsa bilanço içi, dayalı kelimesi geçiyorsa bilanço dışı.", "Konut finansman yöntemleri dört tane. Dolaysız yöntem ve sözleşme yönteminde finansal aracı yok. Mevduat finansmanında bankalar topladıkları mevduatı konut kredisine çevirir ve bu, kurumsal sistemlerde en yaygın yöntemdir. İpotek bankası yönteminde ise kaynak sermaye piyasasından menkul kıymet ihracıyla bulunur.", "İpoteği de iyi bil. Taşınmaz üzerinde kurulan, sınırlı ayni bir haktır ve resmi yazılı şekilde kurulur. Başkasının borcu için de verilebilir. Fer'i bir haktır, yani alacak ortadan kalkarsa ipotek de düşer. Alacaklı borç ödenmezse taşınmazı sattırabilir ama mülkiyeti kendine geçiremez; bunu sözleşmeyle bile kararlaştıramaz. Bir de derece sırası var: birinci derece ödenmeden ikinci derece ödenmez.", "Menkul kıymetleştirme üç adımdır: alacakları seç, özel amaçlı kuruluşa devret, o kuruluş menkul kıymet ihraç etsin. Avantajları likidite, düşük maliyetli fon ve riskin devri; dezavantajları ise kredi riski, vade uyumsuzluğu, erken ödeme sorunu ve kredi stokunun aşırı büyümesi.", "Tebliğe geçelim. Varlığa dayalı menkul kıymeti varlık finansmanı fonu, ipoteğe dayalı menkul kıymeti konut finansmanı fonu çıkarır. İpotek finansmanı kuruluşu ise fon kurmadan da ihraç yapabilir. Bu fonlar inançlı mülkiyet esasına göre kurulan, tüzel kişiliği olmayan malvarlıklarıdır. Ama iki bin yirmi yılındaki değişiklikle tapu ve sicil işlemleriyle sınırlı olarak tüzel kişiliği varmış gibi kabul ediliyorlar. Fon Türkiye'de kurulmak zorunda ve başka amaçla kullanılamaz.", "Kurucular: bankalar, finansal kiralama şirketleri, finansman şirketleri, varlık yönetim şirketleri, ipotek finansmanı kuruluşları ve geniş yetkili aracı kurumlar. Portföy yönetim şirketi bu listede yok, dikkat et. Banka, kiralama, finansman ve varlık yönetim şirketleri kurucu olacaksa Bankacılık Düzenleme ve Denetleme Kurumunun uygun görüşü alınır. Kiralama, finansman ve varlık yönetim şirketlerinin fonları sadece kendi aktiflerindeki varlıkları devralabilir.", "Fon malvarlığı kurucunun ve kaynak kuruluşun malvarlığından ayrıdır. Haczedilemez, ihtiyati tedbir konamaz, iflas masasına girmez. Bu sayede yatırımcı kaynak kuruluşun iflas riskinden korunur.", "Başvuru sürelerine bak. Kuruluş izni ayrı alınırsa içtüzüğün tescilinden itibaren altı ay içinde ihraç başvurusu yapılmalı; bu süre bir defaya mahsus üç ay uzatılabilir. Kurul başvuruyu yirmi iş günü içinde sonuçlandırır. Onaylanan içtüzük altı iş günü içinde tescil edilir; tescil belgeleri ve sözleşmeler de on iş günü içinde Kurula gönderilir.", "İhraç tarafında sayılar şöyle: tahsisli ihraçta birim nominal en az yüz bin lira. Varlık yönetim şirketlerinin kaynak olduğu varlığa dayalı menkul kıymetler sadece yurt dışında satılabilir. Halka arzda ihraç tek seferde, izahname tek belge ve her tertip için kredi derecelendirmesi zorunlu. Halka arz edilmeksizin ihraçta tavan, kaynak kuruluşun aktif toplamının iki katı; ipotek finansmanı kuruluşları için bu sınır yok.", "Fon kurulu üç kişidir ve kurucunun yönetim kurulu kararıyla atanır. En az biri bağımsız, en az biri Sermaye Piyasası Faaliyetleri Düzey üç lisanslı olmalı. Üyelerde en az beş yıl tecrübe aranır. Fon kurulu kararları noter onaylı defterde tutulur. Kurul isterse bir operasyon sorumlusu atayabilir; bu da bir banka ya da geniş yetkili aracı kurum olur.", "Hizmet sağlayıcı portföyün günlük idaresini yapar; tahsilatlar ona değil fona aittir ve hemen fonun hesabına aktarılır. Faaliyetleri altı aylık dönemlerle bağımsız denetimden geçer, rapor otuz gün içinde fon kuruluna verilir. Fon denetçisi ise yıllık raporunu takvim yılını izleyen üç ay içinde sunar ve raporlar beş yıl saklanır.", "Risk tutma kuralı çok sorulur. Kaynak kuruluş ya da kurucu, ihraç edilen tutarın yüzde beşini alıp vade sonuna kadar tutar. Notlar farklıysa en düşük kaliteli tertipten tutulur. Kurul bu oranı yüzde ona kadar artırabilir. Kamuyu aydınlatmada ise neredeyse her şey altı iş günü: içtüzük, görev değişiklikleri, derecelendirme notları ve üç ayda bir hazırlanan yatırımcı raporu.", "Portföyde varlık finansmanı fonu tüketici ve ticari krediler, kiralama alacakları, TOKİ alacakları ve teminatlı menkul kıymetler alabilir. Konut finansmanı fonu ipotekli konut alacaklarına odaklanır ve ayrıca faiz ile kur riskinden korunmak için türev araç alabilir. Portföy ihraçtan sonra en geç bir ay içinde oluşturulur, uygun olmayan varlıklar on gün içinde değiştirilir.", "Özetleyelim: birincisi, teminatlı bilanço içi, dayalı bilanço dışı. İkincisi, kurucular arasında portföy yönetim şirketi yok. Üçüncüsü, tahsisli ihraçta yüz bin lira, tavan aktiflerin iki katı. Dördüncüsü, fon kurulu üç kişi, beş yıl tecrübe. Beşincisi, risk tutma yüzde beş, en fazla yüzde on. Altıncısı, ilanlarda altı iş günü, yatırımcı raporu üç ayda bir. Şimdi sorulara geçebilirsin."], "4": ["Merhaba, teminatlı menkul kıymetler bölümündeyiz. Önceki bölümde varlıklar bir fona devrediliyor ve bilançodan çıkıyordu. Burada ise varlıklar ihraççının bilançosunda kalıyor, ama özel bir defterde ayrılıp yatırımcıya teminat oluyor. Bu farkı kafana yerleştirirsen bölümün geri kalanı kolay.", "Teminatlı menkul kıymet, ihraççının genel yükümlülüğü olan ve teminat varlıklar karşılık gösterilerek çıkarılan bir borçlanma aracıdır. İki türü var: ipotek teminatlı ve varlık teminatlı. Genel yükümlülük demek şu: teminat yetmezse yatırımcı ihraççının diğer mallarına da başvurabilir. Hatta teminat tahsilatını beklemek zorunda bile değil.", "Kimler ihraç edebilir? Varlık teminatlı olanı bankalar, ipotek finansmanı kuruluşları, finansal kiralama, faktoring ve finansman şirketleri, gayrimenkul yatırım ortaklıkları ve yetkili kamu kurumları çıkarabilir. İpotek teminatlı olanı ise sadece konut finansmanı kuruluşları ve ipotek finansmanı kuruluşları çıkarabilir. Gayrimenkul yatırım ortaklığını ipotek teminatlı tarafında görürsen yanlış.", "İhraç yetkisi esas sözleşmeyle yönetim kuruluna devredilebilir. Satış halka arz, nitelikli yatırımcıya satış ya da birim nominali en az yüz b
