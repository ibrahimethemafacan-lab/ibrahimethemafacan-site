>Tarihçe ve yasal çerçeve<\/h3>\n<ul>\n<li>Anayasa'da konut finansmanına doğrudan hüküm yoktur; dayanak <b>Anayasa m.57<\/b> (konut hakkı).<\/li>\n<li><b>1992:<\/b> 3794 sayılı Kanunla mülga 2499 sayılı SPKn'ya eklenen <b>13/A<\/b> ile ilk VDMK düzenlemesi; ihraççılar bilançolarındaki alacak ve duran varlıkları karşılık göstererek VDMK çıkarabildi.<\/li>\n<li><b>2007:<\/b> <b>5582 sayılı<\/b> Konut Finansmanı Kanunu (06.03.2007 RG). Sistemin adı <b>Konut Finansmanı Sistemi<\/b>. İcra İflas, Tüketicinin Korunması, Toplu Konut, Finansal Kiralama ve vergi kanunlarında da değişiklik yaptı (proje aşamasındaki konutlar, değişken faiz, vergi istisnaları, sözleşme öncesi bilgi formu, erken ödeme ücreti, ipoteğin hızlı paraya çevrilmesi).<\/li>\n<li>5582 ile mülga SPKn'ya eklenenler: <b>13/A<\/b> ipotek teminatlı menkul kıymet (İTMK), <b>13/B<\/b> varlık teminatlı menkul kıymet (VTMK), <b>38/A–38/B<\/b> konut finansmanı fonu (KFF), <b>38/C<\/b> varlık finansmanı fonu (VFF), <b>39/A<\/b> ipotek finansmanı kuruluşları (İFK), <b>46/C<\/b> İFK'ların tedrici tasfiyesi.<\/li>\n<li>6362 sayılı SPKn'da düzenleme <b>m.57–61<\/b>'e taşındı (Konut ve Varlık Finansmanı ile İpotek Finansmanı Kuruluşları).<\/li>\n<li><b>2014:<\/b> <b>III-58.1<\/b> Varlığa veya İpoteğe Dayalı Menkul Kıymetler Tebliği (09.01.2014; Seri III No:34 ve 35'i kaldırdı) ve <b>III-59.1<\/b> Teminatlı Menkul Kıymetler Tebliği (Seri III No:33 ve 38'i kaldırdı).<\/li>\n<\/ul>\n<table><tr><th>Avrupa modeli (bilanço içi, covered bond)<\/th><th>ABD modeli (bilanço dışı, menkul kıymetleştirme)<\/th><\/tr>\n<tr><td>İpotek teminatlı menkul kıymet (İTMK, mortgage covered bond)<\/td><td>İpoteğe dayalı menkul kıymet (İDMK, mortgage backed securities)<\/td><\/tr>\n<tr><td>Varlık teminatlı menkul kıymet (VTMK, asset covered bond)<\/td><td>Varlığa dayalı menkul kıymet (VDMK, asset backed securities)<\/td><\/tr>\n<tr><td>Riskler ihraççının bilançosunda kalır<\/td><td>Riskler yatırımcıya geçer; özel amaçlı kuruluş (SPV): VFF ve KFF<\/td><\/tr>\n<\/table>\n\n<h3>Konut finansmanı kavramları<\/h3>\n<ul>\n<li><b>Konut finansmanı (SPKn m.57):<\/b> konut edinmek için tüketiciye kredi; konutun finansal kiralama ile kiralanması; sahip olunan konut teminatıyla kredi; bu kredilerin yeniden finansmanı için kredi.<\/li>\n<li><b>Varlık finansmanı:<\/b> konut finansmanı dahil Kurulca uygun görülen varlıklara dayalı araç ihracı.<\/li>\n<\/ul>\n<table><tr><th>Konut finansman yöntemi<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Dolaysız yöntem<\/td><td>Kurumsal sistemin olmadığı yerlerde birikim ve akraba-arkadaş fonu; <b>aracı yok<\/b>.<\/td><\/tr>\n<tr><td>Sözleşme yöntemi<\/td><td>Piyasa altı getiriyle birikim, sonra piyasa altı maliyetle kredi hakkı; <b>aracı yok<\/b>.<\/td><\/tr>\n<tr><td>Mevduat finansmanı<\/td><td>Bankalar mevduatı konut kredisine çevirir; kurumsal sistemlerde <b>en yaygın<\/b> yöntem.<\/td><\/tr>\n<tr><td>İpotek bankası yöntemi<\/td><td>Gelişmiş ülkeler; kaynak menkul kıymet ihracıyla sermaye piyasasından; etkin ikinci el piyasa gerekir.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>İpotekli konut finansmanı (mortgage):<\/b> konut üzerinde ipotekle uzun vadeli (20–30 yıl) kredi; alacakların sermaye piyasası aracılığıyla finanse edilmesi. Uzun vadenin nedeni ipotektir.<\/li>\n<li>Tahvil ihracında geri ödeme tamamen ihraççının mali gücüne bağlıdır; genellikle derecelendirme notu daha yüksek olduğundan ipotek teminatlı menkul kıymet tercih edilir. Krediler havuzlanamıyorsa tahvil alternatif olabilir.<\/li>\n<li>İTMK <b>bilanço içi<\/b>, İDMK <b>bilanço dışı<\/b> menkul kıymetleştirmedir. Sistemin temeli iki işlem: <b>ipotek tesisi<\/b> ve <b>menkul kıymetleştirme<\/b>.<\/li>\n<\/ul>\n<h4>İpotek<\/h4>\n<ul>\n<li>Ayni teminat: taşınırda <b>rehin<\/b>, taşınmazda <b>ipotek<\/b>; şahsi teminat kural olarak <b>kefalet<\/b>.<\/li>\n<li><b>MK m.850:<\/b> ipotek taşınmaz rehni türüdür; var olan veya doğması kesin ya da muhtemel alacak için tapuya tescille kurulan, alacak ödenmezse taşınmazı sattırma yetkisi veren <b>sınırlı ayni hak<\/b>. <b>Resmi yazılı şekilde<\/b> kurulur.<\/li>\n<li>Mülkiyet değişikliğinden etkilenmez; başkasının borcu için de verilebilir (taşınmaz sahibinin borçlu olması gerekmez).<\/li>\n<li>Alacaklı mülkiyeti kendine geçiremez; aksi sözleşmeyle kararlaştırılamaz. <b>Fer'i<\/b> haktır: alacak sona ererse ipotek de hükümsüz kalır, alacak devrinde kendiliğinden geçer. Tescilden sonra asıl alacak <b>zamanaşımına uğramaz<\/b> (MK m.864).<\/li>\n<li><b>Öncelik:<\/b> derece sırasına göre; birinci derece ödenmeden sonraki dereceler ödenmez.<\/li>\n<\/ul>\n<h4>Menkul kıymetleştirme<\/h4>\n<ul>\n<li>Alacakların nakit akımları karşılığında borçlanma senedi ihracı. Üç işlem: alacakların <b>seçimi<\/b> → <b>özel amaçlı kuruluşa devri<\/b> → bu kuruluşun <b>menkul kıymet ihracı<\/b>.<\/li>\n<li><b>Avantajlar:<\/b> bilançodaki varlıklara likidite; zayıf kredibiliteli şirketlere fon imkânı; geri ödenmeme riski devredilir, yatırımcı şirket iflas riskini üstlenmez; yatırımcıya alternatif ürün; finansman maliyeti azalır; düşük maliyetli fon.<\/li>\n<li><b>Dezavantajlar:<\/b> kredi riski ve vade uyumsuzluğu; erken ödemede portföy sorunu; daha fazla teminat veya alacak devri istenmesi; riskli alacakların bilançoda kalması; daha fazla borçlanma; kredi stokunun aşırı artması.<\/li>\n<\/ul>\n<h4>İpotek piyasaları<\/h4>\n<ul>\n<li><b>Birincil:<\/b> kredi verenle kullanıcı karşılaşır. <b>İkincil:<\/b> kredilerin veya bunlara dayalı menkul kıymetlerin alım satımı; ikincil piyasa kuruluşları tüketiciyle doğrudan karşılaşmaz.<\/li>\n<li><b>Bilanço içi:<\/b> temerrüt ve erken ödeme riski ihraççıda kalır; risk ihraççının kredi riskiyle ilişkili. Avrupa'da yaygın (ipotek bankacılığı). İTMK'da ihraççının mali durumu bozulsa bile kredi geri ödemeleri ve ipotek önce İTMK sahiplerine gider; bu yüzden daha düşük faizle fon sağlanır.<\/li>\n<li><b>Bilanço dışı:<\/b> likidite, kredi, temerrüt, erken ödeme riskleri yatırımcıya geçer; ABD'de yaygın. Kredi kuruluşu sermaye yeterliliği açısından serbest sermayeye kavuşur.<\/li>\n<\/ul>\n\n<h3>III-58.1 Tebliği: genel esaslar<\/h3>\n<ul>\n<li>Dayanak SPKn m.58–60, m.128/1-(e), m.130/3; 09.01.2014 RG. 2018, 2020 ve 2021'de değiştirildi.<\/li>\n<li><b>VDMK:<\/b> VFF'nin veya İFK'nın devralacağı varlıklar karşılık gösterilerek ihraç edilir. <b>İDMK:<\/b> KFF'nin veya İFK'nın devralacağı varlıklar karşılık gösterilerek ihraç edilir.<\/li>\n<li><b>VFF ve KFF:<\/b> VDMK veya İDMK karşılığı toplanan paralarla, yatırımcılar hesabına <b>inançlı mülkiyet<\/b> esasına göre fon içtüzüğüyle kurulan, <b>tüzel kişiliği olmayan<\/b> malvarlığı.<\/li>\n<li>Tebliğ kapsamı dışındaki fonlar ve araçlar bu adları veya eşdeğerlerini kullanamaz.<\/li>\n<li>Hüküm olmayan hallerde II-5.1 ve II-5.2 kıyasen uygulanır; ihraç fonca yapılıyorsa fon <b>ihraççı<\/b> sayılır, ihraççı sorumluluklarını <b>fon kurulu<\/b> yerine getirir.<\/li>\n<li>Fon <b>Türkiye'de<\/b> kurulmak zorundadır; süreli veya süresiz kurulabilir; VİDMK ihracı dışında amaçla kurulamaz.<\/li>\n<li>7222 sayılı Kanunla (2020) fon, <b>sicil işlemleriyle sınırlı olarak<\/b> tüzel kişiliği haiz sayılır; tapuya tabi varlıklar fon adına tescil edilir; işlemler kurucu ve fon kurulunu temsil eden birer yetkilinin <b>müşterek imzasıyla<\/b> yapılır.<\/li>\n<li><b>İçtüzük:<\/b> portföyün inançlı mülkiyetle saklanmasını ve vekalet akdine göre yönetimini konu alan iltihaki sözleşme; standardı Kurulca belirlenir. Asgari unsurlar: unvan ve süre, genel esaslar, tasfiye şekli, Kurulca belirlenen diğer unsurlar. Değişiklik Kurul onayından sonra fon kurulunca tescil ve TTSG'de ilan edilir.<\/li>\n<\/ul>\n<h4>Kurucular<\/h4>\n<ul>\n<li>Kurucu olabilecekler: <b>bankalar, finansal kiralama şirketleri, finansman şirketleri, varlık yönetim şirketleri (VYŞ), İFK ve geniş yetkili aracı kurumlar<\/b>.<\/li>\n<li>Şartlar: özel mevzuat kriterleri; son 1 yılda <b>1 ay veya daha fazla<\/b> faaliyet sınırlaması ya da durdurma kararı olmaması; <b>muaccel vergi borcu<\/b> olmaması.<\/li>\n<li>Kurucu banka, finansal kiralama, finansman şirketi veya VYŞ ise <b>BDDK uygun görüşü<\/b> alınır.<\/li>\n<li>Fon ihracında VDMK için VFF, İDMK için KFF kurulması zorunlu.<\/li>\n<li><b>Dikkat:<\/b> Finansal kiralama, finansman şirketleri ve VYŞ'lerin fonları yalnız <b>kendi aktiflerindeki<\/b> varlıkları devralabilir. Banka, İFK ve geniş yetkili aracı kurumun fonları diğer kaynak kuruluşların varlıklarını da devralabilir veya banka ve İFK'nın teminatlı menkul kıymetlerini alarak VDMK ihraç edebilir.<\/li>\n<li>Unvan: aynı kurucunun fonları ayrıştırılabilir olmalı; aşırı benzer, yanıltıcı, üstünlük ima eden unvan olamaz.<\/li>\n<\/ul>\n<h4>Fon malvarlığı<\/h4>\n<ul>\n<li>Kurucu, hizmet sağlayıcı ve kaynak kuruluş malvarlığından <b>ayrıdır<\/b>; VİDMK itfa edilene kadar başka amaçla tasarruf edilemez, kamu alacakları dahil <b>haczedilemez<\/b>, ihtiyati tedbir konamaz, <b>iflas masasına girmez<\/b>; yönetimleri kamuya devredilse bile.<\/li>\n<li>Fon hesabına ve içtüzükte hüküm varsa kredi, türev ve benzeri işlemler dışında teminat gösterilemez, rehnedilemez.<\/li>\n<\/ul>\n\n<h3>Kuruluş ve ihraç başvurusu<\/h3>\n<ul>\n<li>Kuruluş izni ve izahname veya ihraç belgesi başvurusu kural olarak <b>birlikte<\/b> yapılır ve değerlendirilir; kurucu isterse ayrı yapılabilir.<\/li>\n<li>Ayrı başvuruda içtüzüğün tescilinden itibaren en geç <b>6 ay<\/b> içinde ihraç başvurusu yapılır; yapılmazsa içtüzük terkin edilir ve belgeler <b>6 iş günü<\/b> içinde Kurula gönderilir. Makul gerekçeyle <b>bir defaya mahsus 3 ay<\/b> uzatılabilir.<\/li>\n<li>İnceleme: eksiksiz belgelerden itibaren <b>20 iş günü<\/b>. Eksiklik başvurudan itibaren 10 iş günü içinde bildirilir; süre belgeler tamamlanınca işlemeye başlar.<\/li>\n<li>Onaylanan içtüzük, kararın tebellüğünü izleyen <b>6 iş günü<\/b> içinde kurucunun merkezinin ticaret siciline tescil ve TTSG'de ilan edilir; tescille kuruluş tamamlanır.<\/li>\n<li>Tescil belgeleri ve sözleşmeler tescili izleyen <b>10 iş günü<\/b> içinde Kurula gönderilir; onaylı izahname veya ihraç belgesi bundan sonra verilir.<\/li>\n<\/ul>\n\n<h3>VİDMK ihracı<\/h3>\n<ul>\n<li>Halka arz, nitelikli yatırımcıya satış veya birim nominali asgari <b>100.000 TL<\/b> olmak kaydıyla tahsisli ihraç. <b>VYŞ'lerin kaynak kuruluş olduğu VDMK yalnız yurt dışında<\/b> satılabilir.<\/li>\n<li>Halka arzda ihraç <b>tek seferde<\/b> ve izahname <b>tek belge<\/b> olmalı; borsada işlem görmesi için borsaya da başvurulur; her tertip için <b>kredi derecelendirmesi<\/b> zorunlu.<\/li>\n<li>İzahnamede fonun veya İFK'nın TMS'ye uygun denetimden geçmiş tabloları; 1 yıldan kısa faaliyette ara dönem; yeni kurulmuş veya hiç ihraç yapmamış fonda tablolara yer verilmeyebilir.<\/li>\n<li><b>Halka arz edilmeksizin veya yurt dışı ihraçta<\/b> ihraç tavanı verilir; tertipler halinde satılabilir; tavan için birden fazla fon kurulabilir.<\/li>\n<li><b>İhraç tavanı:<\/b> kaynak kuruluşun son yıllık tablolarındaki aktif toplamının <b>2 katını<\/b> aşamaz. Birden fazla kaynak kuruluşta: kurucunun aktif toplamının 2 katı veya kaynak kuruluşların devrettikleri varlıklarla orantılı aktif toplamlarının 2 katından <b>yüksek olanı<\/b>. İFK ve İFK'nın kurduğu fonlarda bu limit <b>uygulanmaz<\/b>.<\/li>\n<li>Kurul satışın yalnız nitelikli yatırımcıya yapılmasını veya yurt içi yerleşik banka ya da üçüncü tüzel kişi garantisini isteyebilir.<\/li>\n<li>MKK'da kayden ihraç; Borçlanma Araçları Tebliği kıyasen. Tavan kapsamındaki VİDMK tamamen itfa edilmeden aynı fonla yeni tavan başvurusu yapılamaz; itfa edilen fon içtüzük uyumlu hale getirilerek yeniden kullanılabilir.<\/li>\n<li><b>Farklı tertip kriterleri:<\/b> varlıkların vadesi, anapara ve faiz ödeme zamanları, getiri türü, ödeme öncelikleri, tasfiye hakları, kredi riski, Kurulca uygun görülen diğerleri.<\/li>\n<li>Yatırımcı ödemeleri fon portföyündeki varlıkların nakit akımlarından karşılanır; ihraç öncesinde kurucu veya kurucu niteliğindeki tüzel kişi garanti, sigorta şirketi sigorta teminatı verebilir.<\/li>\n<li>İFK'nın fon kurmadan ihracında kurucu ve fon hükümleri İFK'ya, fon kurulu hükümleri İFK yönetim kuruluna kıyasen uygulanır.<\/li>\n<\/ul>\n\n<h3>Fonun işleyişi<\/h3>\n<h4>Fon kurulu<\/h4>\n<ul>\n<li>Kurucu her fon için <b>3 kişilik<\/b> fon kurulunu <b>yönetim kurulu kararıyla<\/b> atar. En az <b>1 bağımsız üye<\/b> (kurumsal yönetim nitelikleri) ve en az <b>1 SPF Düzey 3 lisanslı<\/b> üye zorunlu. Aynı kurucunun fonlarında kurullar aynı kişilerden oluşabilir.<\/li>\n<li>Üye şartları: yükseköğrenim, sermaye piyasası veya bankacılıkta en az <b>5 yıl<\/b> tecrübe; iflas, konkordato, iflas ertelemesi olmaması; izni iptal edilmiş kuruluşta sorumluluğu olmaması; Kanundaki suçlardan mahkûmiyet olmaması; 35 sayılı KHK'ya göre tasfiye kararı olmaması; TCK m.53 süreleri geçse bile kasıtlı suçtan 5 yıl veya fazla hapis ya da sayılan suçlardan (zimmet, rüşvet, dolandırıcılık, aklama vb.) mahkûmiyet olmaması; Bankacılık Kanunu ve 6415 sayılı Kanun suçlarından hükümlü olmaması.<\/li>\n<li>Kurucu: başvuru, üyelerin belirlenmesi, içtüzüğün hazırlanması. Fon kurulu: içtüzük değişiklikleri ve ihraç belgeleri, portföyün oluşturulması ve değerlenmesi, kayıtlar, banka hesapları ve ödemeler, yatırımcı raporları, hizmet sağlayıcının gözetimi ve gerekirse değiştirilmesi, temsil ve yönetim gözetimi.<\/li>\n<li>Kararlar <b>noter onaylı karar defterine<\/b> yazılır.<\/li>\n<li><b>Fon operasyon sorumlusu:<\/b> fon kurulu, hizmet sağlayıcının gözetimi ve değiştirilmesi dışındaki görevleri için atayabilir; kurucu şartlarını taşıyan <b>banka veya geniş yetkili aracı kurum<\/b> olabilir.<\/li>\n<\/ul>\n<h4>İç kontrol ve fon denetçisi<\/h4>\n<ul>\n<li>İç kontrol; mevzuata uygunluk, hizmet sağlayıcı gözetimi, ödemelerin kontrolü, varlıkların yönetimi ve ayrı muhafazası gibi asgari unsurları içerir.<\/li>\n<li>Türev işlemlere taraf olacak <b>KFF<\/b>'de ek risk yönetimi prosedürleri gerekir; bunlar <b>SPF Düzey 3 ve Türev Araçlar<\/b> lisanslı ayrı bir birim personelince oluşturulur.<\/li>\n<li><b>Fon denetçisi:<\/b> fon kurulunca atanır; operasyonda fiilen görev almayan, fon kurulu üyesi niteliklerini taşıyan, <b>SPF Düzey 3<\/b> lisanslı kişi. Türev Araçlar lisansı da varsa risk yönetimi görevini de yürütebilir.<\/li>\n<li>Denetçi raporları takvim yılını izleyen <b>3 ay<\/b> içinde fon kuruluna sunulur, en az <b>5 yıl<\/b> saklanır. Aykırılık veya geri ödeme güçlüğü tespitinde rapor en kısa sürede fon kuruluna, tamamlanmasını izleyen <b>6 iş günü<\/b> içinde Kurula gönderilir.<\/li>\n<li>Fon kurulu, denetçi, operasyon sorumlusu ve hizmet sağlayıcı sır saklamakla yükümlüdür.<\/li>\n<\/ul>\n<h4>Hizmet sağlayıcı<\/h4>\n<ul>\n<li>Portföy varlıklarının <b>günlük idaresi<\/b>ni yapar. Kurucu, kaynak kuruluş veya kurucu niteliğindeki kuruluş olabilir. Görevler fon kurulu ile yazılı hizmet sözleşmesiyle belirlenir.<\/li>\n<li>Sözleşmede asgari: ödemelerin tahsili ve fon hesabına aktarımı; sigorta, vergi gibi idari işlemler; borçlu gözetimi ve ihtarlar; nakit akımlarının <b>aylık<\/b> raporlanması; gerekiyorsa vergi tahsilatı; donuk alacak takibi.<\/li>\n<li>Tahsil edilen tutarlar fon malvarlığıdır; ivedilikle fon adına açılan hesaba aktarılır. Yükümlülük ihlali veya izin iptalinde sözleşme fon kurulunca sona erdirilir; tüm kayıtlar ve nakit <b>mahsup veya kesinti yapılmadan<\/b> devredilir.<\/li>\n<li>Faaliyetleri, ISRS 4400 standardına göre yetkili bağımsız denetim kuruluşunca <b>6 aylık<\/b> dönemler itibarıyla incelenir; rapor dönem bitimini izleyen <b>30 gün<\/b> içinde fon kurulu ve kurucuya iletilir. Kurul kararıyla (20.02.2020) VİDMK tedavüldeyken her 6 aylık dönemde ve itfa tarihinde yapılır.<\/li>\n<\/ul>\n<h4>Risk tutma<\/h4>\n<ul>\n<li>Kaynak kuruluş veya kurucu, VİDMK nominalinin <b>%5'ini<\/b> satın alıp <b>vade sonuna kadar<\/b> tutar.<\/li>\n<li>Tertiplerde: not yoksa veya notlar aynıysa her tertipten eşit ya da oransal; notlar farklıysa <b>en düşük kredi kaliteli<\/b> tertip veya tertiplerden.<\/li>\n<li>Kurul varlık türüne göre oranı farklılaştırabilir; kaynak kuruluş veya kurucu bazında <b>%10'u geçmemek<\/b> üzere artırabilir. Yükümlülük kaynak kuruluş ile kurucu arasında paylaşılabilir; birden fazla kaynak kuruluşta kendi devrettiği varlıklarla ilişkili tertiplerle sınırlı.<\/li>\n<\/ul>\n<ul>\n<li>Finansal raporlama ve bağımsız denetimde <b>yatırım fonları<\/b> düzenlemeleri uygulanır. Fon, kurucu, kaynak kuruluş, operasyon sorumlusu ve hizmet sağlayıcının fona ilişkin hesapları Kurul denetimine tabidir (bankacılık mevzuatı saklı).<\/li>\n<li>Yetkililer şartları yitirirse görevlerine derhal son verilir; görevden ayrılırsa sorumlulukları yeni atamaya kadar sürer.<\/li>\n<\/ul>\n<h4>Kamuyu aydınlatma (hepsi KAP ve kurucunun sitesi, 6 iş günü)<\/h4>\n<ul>\n<li>İçtüzük ve değişiklikleri: Kurul onayının tebellüğünü izleyen <b>6 iş günü<\/b>.<\/li>\n<li>Görevden ayrılma, şart yitirme, kurucu veya hizmet sağlayıcının izin iptali: olayı izleyen 6 iş günü.<\/li>\n<li><b>Yatırımcı raporu:<\/b> takvim yılına göre <b>üçer aylık<\/b> dönemler; anapara ödemeleri, birikimli ödenen ve kalan anapara; dönem bitimini izleyen 6 iş günü.<\/li>\n<li>Hizmet sağlayıcı inceleme raporu bulguları ve kredi derecelendirme notları: 6 iş günü.<\/li>\n<li>Tahsisli veya nitelikli yatırımcıya satışta ilanlar <b>MKK aracılığıyla<\/b> elektronik iletilir ve sitede yayımlanır; yayım bilgisi 6 iş günü içinde Kurula. TTSG ilan bilgisi de 6 iş günü içinde Kurula. Doğruluk ve güncellikten kurucu sorumludur.<\/li>\n<\/ul>\n\n<h3>Fon portföyü<\/h3>\n<ul>\n<li>Varlıklar sözleşmeyle devralınır, tüm haklar fona geçer; teminatlı menkul kıymet alımında ayrıca devir sözleşmesi aranmaz.<\/li>\n<\/ul>\n<table><tr><th>VFF portföyü<\/th><th>KFF portföyü<\/th><\/tr>\n<tr><td>Banka ve finansman şirketlerinin tüketici ve ticari kredi alacakları; finansal kiralama alacakları; TOKİ'nin gayrimenkul satışından taksitli alacakları; finansal kuruluş dışı AŞ'lerin faturalı satıştan senede veya teminata bağlı ticari alacakları; teminatlı menkul kıymetler; VYŞ'lerin bankalardan devraldığı kredi alacakları; nakit benzerleri; yedek hesap varlıkları; Kurulca uygun görülenler<\/td><td>Bankaların ve finansman şirketlerinin ipotekli konut finansmanı alacakları (ipoteksizse Kurulca uygun başka teminatla); konut finansmanından doğan finansal kiralama alacakları; ipotekli ticari kredi ve alacaklar; TOKİ'nin konut satışından alacakları; nakit benzerleri; yedek hesap varlıkları; <b>türev araçlar<\/b>; Kurulca uygun görülenler<\/td><\/tr>\n<\/table>\n<ul>\n<li>Nakit benzerleri: <b>3 aydan kısa<\/b> vadeli mevduat, katılım hesabı, ters repo, para piyasası fonları, kısa vadeli borçlanma araçları fonları, Takasbank para piyasası.<\/li>\n<li><b>Varlık nitelikleri (devir tarihinde):<\/b> banka kredileri <b>Birinci Grup<\/b> (standart nitelikli) alacak; finansman şirketi kredileri ve kiralama alacakları için <b>özel karşılık ayrılmamış<\/b>; ipotekli taşınmaz <b>Türkiye'de<\/b>, zorunlu sigortaları yapılmış, piyasa değeri BDDK veya Kurul listesindeki değerleme kuruluşunca tespit edilmiş; deniz, hava, kara taşıtı ticari kredilerinde tekne-makine, gövde ve kasko sigortası (sözleşme süresince); yurt içi teminatlı menkul kıymetler MKK'da fon hesabında; VYŞ kredileri bağlı tüm haklarla devredilmiş.<\/li>\n<li><b>KFF türev araçları:<\/b> yalnız faiz ve kur riskinden korunma; borsada işlem görmeli veya karşı taraf yetkili banka, kredi kuruluşu, sigorta şirketi ya da merkezi takas kuruluşu olup yatırım yapılabilir seviyenin <b>en yüksek ilk üç kademesine<\/b> denk uzun vadeli nota sahip olmalı. Haklar riske maruz varlıkların, yükümlülükler riske maruz İDMK'nın kalan anapara nominalini aşamaz.<\/li>\n<li>Portföy ihraçtan sonra en geç <b>1 ay<\/b> içinde, varlık değeri toplam yükümlülükten az olmayacak şekilde oluşturulur. VYŞ kaynaklı ihraçta alacak portföyü bir bütün olarak <b>gerçeğe uygun değerden<\/b> devredilir. Tüm ödemeler fon adına açılan hesaptan.<\/li>\n<li><b>Harcamalar:<\/b> toplam gider üst sınırı ve kalemler izahnamede yazılmalı; tescil-ilan, fon kurulu ve hizmet ücretleri, hizmet sağlayıcı, bağımsız denetim, derecelendirme, kalite artırma giderleri, yüklenim ve aracılık komisyonları, yedek hesap kesintileri, kanuni ücretler, vergiler, türev maliyetleri. Piyasa rayici üzerinde harcama yapılamaz; belgeye dayalı olmalı.<\/li>\n<li><b>Kalite artırma:<\/b> sigorta, garanti, teminat mektubu; farklı haklı tertipler; yükümlülüğü aşan kısmın yedek hesaba aktarılması; kurucu veya kaynak kuruluşun tertiplerden alım yapması (risk tutma saklı); Kurulca uygun görülen diğerleri.<\/li>\n<li>TTK, VUK ve Kanuna göre zorunlu defterler; her varlığa <b>dosya numarası<\/b>; dosyada borçlu, para birimi, anapara, vade, faiz, ödeme planı, sigorta, teminat gibi bilgiler ve varlığın fona aidiyeti.<\/li>\n<li>Sözleşme, yazışma, rapor ve kararlar düzenlenmeden itibaren <b>5 yıldan az olmamak<\/b> üzere VİDMK itfasına kadar saklanır; davaya konu olanlar kesin hükme kadar. Elektronik kopyalar kurucu veya hizmet sağlayıcıda.<\/li>\n<li><b>Varlık değişimi:<\/b> önceden fon kurulu kararı şart. Nitelikleri taşımayan varlıklar kaynak kuruluşça en geç <b>10 gün<\/b> içinde uygunlarıyla değiştirilir; garanti verilmesi veya işletilmesinde izahnamedeki esaslarla çıkarılabilir.<\/li>\n<\/ul>\n\n<h3>Geri ödeme güçlüğü ve sona erme<\/h3>\n<ul>\n<li>Fon kurulunun görevini yapmaması sonucu geri ödeme güçlüğünde Kurul kurucudan <b>fon kurulu üyelerinin değiştirilmesini<\/b> isteyebilir; devam ederse fonun <b>başka kurucuya devrine<\/b> karar verebilir. İlk kurucunun garantisi varsa garanti yükümlülüğü sürer.<\/li>\n<li>Kurucunun izni iptal edilirse veya şartları yitirirse Kurul fonun başka kurucuya devrine karar verebilir; yeni kurucuya fondan ödeme yapılmasına karar verebilir.<\/li>\n<li><b>Sona erme:<\/b> içtüzükteki sürenin dolması; süresiz fonda tüm yükümlülükler ifa edilip fon kurulunun belgelerle Kurula başvurması. Sona erme kararından sonra VİDMK ihraç edilemez.<\/li>\n<\/ul>", "sorular": [{"q": "Türkiye'de konut finansmanı amacıyla verilen kredilere dayalı VDMK ihracına ilişkin ilk yasal düzenleme hangi yılda yapılmıştır?", "o": ["1992", "1982", "2001", "2007", "2014"], "a": 0, "e": "1992'de 3794 sayılı Kanunla mülga SPKn'ya eklenen 13/A maddesiyle ilk düzenleme yapılmıştır."}, {"q": "Avrupa modelinde kullanılan ve covered bond olarak bilinen araç hangisidir?", "o": ["Varlığa dayalı menkul kıymet", "İpotek teminatlı menkul kıymet", "İpoteğe dayalı menkul kıymet", "Gayrimenkul sertifikası", "Kira sertifikası"], "a": 1, "e": "İTMK ve VTMK bilanço içi Avrupa modeli araçlarıdır; İDMK ve VDMK ABD modelidir."}, {"q": "Konut finansman yöntemlerinden hangisi kurumsal sistemler içinde en yaygın olarak kullanılan yöntemdir?", "o": ["Dolaysız yöntem", "Sözleşme yöntemi", "Mevduat finansmanı yöntemi", "İpotek bankası yöntemi", "Kooperatif yöntemi"], "a": 2, "e": "Mevduata dayalı yöntem kurumsal sistemlerde en yaygın kullanılan yöntemdir."}, {"q": "Aşağıdaki konut finansman yöntemlerinden hangisinde finansal aracıya ihtiyaç duyulmaz?", "o": ["Mevduat finansmanı", "İpotek bankası", "Menkul kıymetleştirme", "Sözleşme yöntemi", "İpotek teminatlı menkul kıymet ihracı"], "a": 3, "e": "Dolaysız yöntem ile sözleşme yönteminde finansal aracı kullanılmaz."}, {"q": "İpotekle ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Sınırlı ayni haktır", "Başkasının borcu için de verilebilir", "Resmi yazılı şekilde kurulur", "Fer'i bir haktır", "Alacaklı, borç ödenmezse taşınmazın mülkiyetini kendine geçirmeyi sözleşmeyle kararlaştırabilir"], "a": 4, "e": "Mülkiyetin alacaklıya geçirilmesi sözleşmeyle de kararlaştırılamaz; alacaklı yalnız satış isteyebilir."}, {"q": "Menkul kıymetleştirme sürecindeki işlemlerin doğru sırası hangisidir?", "o": ["İhraç → seçim → devir", "Devir → seçim → ihraç", "Seçim → devir → ihraç", "Seçim → ihraç → devir", "Devir → ihraç → seçim"], "a": 2, "e": "Önce alacaklar seçilir, sonra özel amaçlı kuruluşa devredilir, son olarak bu kuruluş menkul kıymet ihraç eder.", "k": 1}, {"q": "Bilanço içi sistemlerle ilgili hangisi doğrudur?", "o": ["Riskler ihraççı kuruluşun bilançosunda kalır", "ABD'de yaygın olan sistemdir", "Krediler bir özel amaçlı kuruluşa satılır", "Temerrüt ve erken ödeme riskleri yatırımcıya devredilir", "VDMK bu sistemin tipik aracıdır"], "a": 0, "e": "Bilanço içi sistemde riskler ihraççıda kalır; Avrupa'da yaygındır ve tipik araçları İTMK ile VTMK'dır."}, {"q": "VFF ve KFF ile ilgili hangisi yanlıştır?", "o": ["İnançlı mülkiyet esasına göre kurulur", "VİDMK ihracı dışında başka amaçlarla da kullanılabilir", "Türkiye'de kurulması zorunludur", "Süreli veya süresiz kurulabilir", "Tüzel kişiliği olmayan malvarlığıdır"], "a": 1, "e": "Fon VİDMK ihracı amacı dışında kurulamaz ve kullanılamaz."}, {"q": "VİDMK Tebliği'ne göre fon kurucusunun banka, finansal kiralama şirketi, finansman şirketi veya varlık yönetim şirketi olması halinde hangi kurumun uygun görüşü alınır?", "o": ["TCMB", "Hazine ve Maliye Bakanlığı", "BDDK", "Türkiye Sermaye Piyasaları Birliği", "MKK"], "a": 2, "e": "Bu kurucuların düzenleme ve denetleme mercii BDDK olduğundan fon kuruluşunda BDDK'nın uygun görüşü alınır."}, {"q": "Hangi kurucuların kurduğu fonlar yalnızca kurucunun kendi aktiflerindeki varlıkları devralarak VİDMK ihraç edebilir?", "o": ["Bankalar", "İpotek finansmanı kuruluşları", "Geniş yetkili aracı kurumlar", "Finansal kiralama şirketleri", "Bankalar ve aracı kurumlar"], "a": 3, "e": "Finansal kiralama şirketleri, finansman şirketleri ve VYŞ'lerin fonları yalnız kendi aktiflerindeki varlıkları devralabilir."}, {"q": "Fon kuruluş izni ayrı alındığında, içtüzüğün tescilinden itibaren VİDMK ihraç başvurusu en geç ne kadar sürede yapılmalıdır?", "o": ["1 ay", "3 ay", "1 yıl", "9 ay", "6 ay"], "a": 4, "e": "Başvuru 6 ay içinde yapılmalıdır; makul gerekçeyle bir defaya mahsus 3 ay uzatılabilir."}, {"q": "Kurulca onaylanan fon içtüzüğü, Kurul kararının tebellüğünü izleyen kaç iş günü içinde ticaret siciline tescil ettirilir?", "o": ["6 iş günü", "3 iş günü", "10 iş günü", "15 iş günü", "20 iş günü"], "a": 0, "e": "İçtüzük tebellüğü izleyen 6 iş günü içinde tescil ve ilan edilir."}, {"q": "VİDMK'nın tahsisli olarak ihraç edilebilmesi için birim nominal değerin asgari tutarı nedir?", "o": ["10.000 TL", "100.000 TL", "50.000 TL", "250.000 TL", "1.000.000 TL"], "a": 1, "e": "Tahsisli ihraçta birim nominal asgari 100.000 TL olmalıdır."}, {"q": "Varlık yönetim şirketlerinin kaynak kuruluş olduğu VDMK'lar nasıl satılabilir?", "o": ["Yalnızca halka arz yoluyla", "Yalnızca nitelikli yatırımcılara yurt içinde", "Yalnızca yurt dışında", "Yalnızca tahsisli olarak yurt içinde", "Herhangi bir kısıt olmadan"], "a": 2, "e": "VYŞ'lerin kaynak kuruluş olduğu VDMK'lar yalnızca yurt dışında satılabilir."}, {"q": "Tek kaynak kuruluşlu, halka arz edilmeksizin yapılacak VİDMK ihracında kaynak kuruluşun son yıllık aktif toplamı 400 milyon TL ise ihraç tavanı en fazla ne olabilir?", "o": ["200 milyon TL", "400 milyon TL", "600 milyon TL", "800 milyon TL", "1,2 milyar TL"], "a": 3, "e": "İhraç tavanı kaynak kuruluşun aktif toplamının 2 katını aşamaz: 400 x 2 = 800 milyon TL."}, {"q": "Halka arz suretiyle VİDMK ihracıyla ilgili hangisi yanlıştır?", "o": ["İhraç tek seferde yapılmalıdır", "İzahname tek belgeden oluşmalıdır", "Borsaya da başvurulmalıdır", "Her tertip için kredi derecelendirmesi zorunludur", "İzahname birden fazla belge şeklinde hazırlanmalıdır"], "a": 4, "e": "Halka arzda izahnamenin tek belgeden oluşması zorunludur."}, {"q": "Fon kurulu ile ilgili hangisi doğrudur?", "o": ["3 kişiden oluşur, kurucunun yönetim kurulu kararıyla atanır, en az biri bağımsız ve en az biri SPF Düzey 3 lisanslıdır", "5 kişiden oluşur ve genel kurulca seçilir", "Tüm üyelerin Türev Araçlar lisansı olmalıdır", "Aynı kurucunun fonlarında kurullar farklı kişilerden oluşmak zorundadır", "Kararlar karar defterine yazılmaz"], "a": 0, "e": "Fon kurulu 3 kişidir; en az bir bağımsız ve bir SPF Düzey 3 lisanslı üye zorunludur; kararlar noter onaylı deftere yazılır."}, {"q": "Fon kurulu üyelerinde aranan asgari mesleki tecrübe süresi nedir?", "o": ["2 yıl", "5 yıl", "3 yıl", "7 yıl", "10 yıl"], "a": 1, "e": "Sermaye piyasası veya bankacılık alanında en az 5 yıllık tecrübe aranır."}, {"q": "Fon operasyon sorumlusu hangi kuruluşlar arasından atanabilir?", "o": ["Portföy yönetim şirketi veya bağımsız denetim kuruluşu", "Yalnızca kurucunun kendisi", "Kurucu şartlarını taşıyan banka veya geniş yetkili aracı kurum", "Derecelendirme kuruluşu", "Merkezi Kayıt Kuruluşu"], "a": 2, "e": "Fon operasyon sorumlusu, kurucu şartlarını sağlayan bir banka veya geniş yetkili aracı kurum olabilir."}, {"q": "Hizmet sağlayıcının faaliyetleri ve fon varlıklarının mevcudiyeti bağımsız denetim kuruluşunca hangi dönemler itibarıyla incelenir?", "o": ["Aylık", "Üç aylık", "Yıllık", "Altı aylık", "İki yıllık"], "a": 3, "e": "İnceleme 6 aylık hesap dönemleri itibarıyla yapılır; rapor 30 gün içinde fon kurulu ve kurucuya iletilir."}, {"q": "VİDMK'da risk tutma yükümlülüğü ile ilgili hangisi doğrudur?", "o": ["Farklı notlu tertiplerde en yüksek notlu tertipten tutulur", "Yatırımcılar nominalin %5'ini tutar", "Oran %10'dur ve değiştirilemez", "Yükümlülük paylaşılamaz", "Kaynak kuruluş veya kurucu nominalin %5'ini vade sonuna kadar tutar; Kurul bunu %10'a kadar artırabilir"], "a": 4, "e": "Oran %5'tir; Kurul %10'u geçmemek üzere artırabilir; farklı notlarda en düşük kredi kaliteli tertipten tutulur."}, {"q": "VİDMK fonlarında yatırımcı raporu hangi sıklıkla hazırlanıp ilan edilir?", "o": ["Üç aylık", "Aylık", "Altı aylık", "Yıllık", "Her ödeme tarihinde"], "a": 0, "e": "Yatırımcı raporu takvim yılına göre üçer aylık dönemler itibarıyla, dönem bitimini izleyen 6 iş günü içinde ilan edilir."}, {"q": "Aşağıdakilerden hangisi yalnızca KFF portföyüne alınabilen bir varlıktır?", "o": ["TOKİ alacakları", "Türev araçlardan kaynaklanan haklar ve yükümlülükler", "Teminatlı menkul kıymetler", "Ters repo", "Yedek hesap varlıkları"], "a": 1, "e": "Türev araçlar faiz ve kur riskinden korunma amacıyla KFF portföyüne dahil edilebilir; VFF listesinde yer almaz."}, {"q": "Fon portföyü VİDMK ihraç tarihinden itibaren en geç ne kadar sürede oluşturulmalıdır?", "o": ["10 gün", "3 ay", "1 ay", "6 ay", "1 yıl"], "a": 2, "e": "Portföy ihraçtan sonra en geç 1 ay içinde, varlık değeri toplam yükümlülükten az olmayacak şekilde oluşturulur."}, {"q": "Tebliğ'deki niteliklere uymadığı halde fona devredilmiş varlıklar kaynak kuruluşça en geç kaç gün içinde uygun varlıklarla değiştirilmelidir?", "o": ["3 gün", "5 gün", "15 gün", "10 gün", "30 gün"], "a": 3, "e": "Kaynak kuruluş bu varlıkları en geç 10 gün içinde değiştirmek zorundadır."}]}, {"id": 4, "kisa": "Teminatlı Menkul Kıymetler", "baslik": "Teminatlı Menkul Kıymetler Tebliği (III-59.1): İTMK ve VTMK", "ozet": "İhraççının genel yükümlülüğü olan TMK'ların ihraççıları, tedavül limiti, teminat varlıklar ve teminat defteri, teminat uyum ilkeleri ve stres testi, teminat sorumlusu, tedbirler ve kamuyu aydınlatma.", "notlar": "<h3>Genel<\/h3>\n<ul>\n<li><b>III-59.1<\/b>: SPKn m.59, 60 ve 130'a dayanır; 21.01.2014 RG'de yayımlanıp yürürlüğe girdi; 2014, 2015, 2018 ve 2020'de değiştirildi. <b>7 bölüm<\/b>dür (genel hükümler, TMK ve ihraç, teminat varlıklar-defter-hizmet sağlayıcı-nakit yöneticisi, teminat uyum ilkeleri, teminat sorumlusu, tedbirler, son hükümler).<\/li>\n<li><b>Teminatlı menkul kıymet (TMK):<\/b> ihraççının <b>genel yükümlülüğü<\/b> niteliğinde olan ve teminat varlıklar karşılık gösterilerek ihraç edilen <b>borçlanma aracı<\/b> niteliğinde araç. İki türü: <b>İTMK<\/b> (ipotek teminatlı) ve <b>VTMK<\/b> (varlık teminatlı).<\/li>\n<li><b>Dikkat:<\/b> VDMK ve İDMK'dan farkı: TMK'da varlıklar ihraççının bilançosunda kalır ve ihraççı yatırımcıya karşı genel olarak da borçludur (bilanço içi, covered bond).<\/li>\n<\/ul>\n\n<h3>Kimler ihraç edebilir<\/h3>\n<table><tr><th>VTMK<\/th><th>İTMK<\/th><\/tr>\n<tr><td>Bankalar, İFK'lar, finansal kiralama şirketleri, faktoring şirketleri, finansman şirketleri, <b>GYO<\/b>'lar, kendi kanunlarıyla menkul kıymet ihracına yetkili kamu kurum ve kuruluşları, nitelikleri Kurulca belirlenecek diğer kuruluşlar<\/td><td>Yalnız <b>konut finansmanı kuruluşları (KFK)<\/b> ve <b>İFK<\/b>'lar. KFK: konut finansmanında doğrudan tüketiciye kredi veren veya finansal kiralama yapan bankalar ile BDDK'nın uygun gördüğü finansal kiralama ve finansman şirketleri. Yani pratikte konut finansmanı yapan bankalar, kiralama ve finansman şirketleri ile İFK'lar.<\/td><\/tr>\n<\/table>\n\n<h3>İhraç<\/h3>\n<ul>\n<li>SPKn <b>m.31<\/b>'e göre TMK ihraç yetkisi esas sözleşmeyle <b>yönetim kuruluna<\/b> devredilebilir; borçlanma aracı ihraç yetkisi devredilmiş YK'lar TMK yetkisine de sahip sayılır. Ancak yetkili organ kararında VTMK mı İTMK mı olduğu, azami tutar ve satış şekli açıkça yazılmalı.<\/li>\n<li>İhraç türleri: <b>halka arz<\/b>, <b>nitelikli yatırımcıya satış<\/b>, birim nominali <b>100.000 TL<\/b>'den az olmamak kaydıyla <b>tahsisli<\/b> satış. Yurt dışı ihraçta asgari nominal şartı yok.<\/li>\n<li>Halka arzda borsada işlem görmesi ve borsaya başvuru <b>zorunlu<\/b>.<\/li>\n<li>Teminat varlıklar, satılamayan veya itfa ya da erken itfa edilen TMK oranında azaltılabilir. Teminat uyum ilkeleri ihlal edilmişse uyum yeniden sağlanana kadar <b>yeni tertip ihraç edilemez<\/b>.<\/li>\n<li>Kurul ihraççıdan şunları isteyebilir: yükümlülüklerin yurt içi yerleşik banka veya üçüncü tüzel kişi garantisi ya da sigorta teminatı; hizmet sağlayıcı veya nakit yöneticisi görevlendirilmesi; teminat varlıkların bir banka veya İFK nezdinde muhafazası; satışın yalnız nitelikli yatırımcıya yapılması.<\/li>\n<li>Tebliğde olmayan hususlarda <b>borçlanma araçları<\/b> düzenlemeleri (II-31.1) uygulanır; kayden ihraç ve hak izlemesinde de Borçlanma Araçları Tebliği kıyasen uygulanır.<\/li>\n<\/ul>\n<h4>Tedavül limiti<\/h4>\n<ul>\n<li>Herhangi bir anda tedavüldeki TMK nominali, ihraççının bağımsız denetimden geçmiş son yıllık tablolarındaki <b>aktif toplamının %10'unu<\/b> aşamaz.<\/li>\n<li><b>İFK<\/b> ihraçlarında limit <b>uygulanmaz<\/b>.<\/li>\n<li>Yatırım yapılabilir seviyenin <b>en yüksek ilk üç kademesine<\/b> denk uzun vadeli notu olan bankalar, 5411'deki finansal kuruluşlar ile finansal kiralama, faktoring ve finansman şirketlerinde limit <b>%100 artırılır<\/b> (yani aktiflerin %20'si).<\/li>\n<\/ul>\n<h4>Başvuru ve tertipler<\/h4>\n<ul>\n<li>Halka arz için izahname, yurt içinde halka arz edilmeksizin veya yurt dışı satış için ihraç belgesi onayı istenir.<\/li>\n<li><b>Teminat defteri<\/b>: halka arzda <b>izahname başvurusundan önce<\/b>, halka arz edilmeksizin veya yurt dışı ihraçta <b>ihraç belgesi alınmadan önce<\/b> oluşturulmalı.<\/li>\n<li>Türev araçlar tutar ve vade kesinleştikten sonra deftere kaydedilebilir; başvuruda planlanan türevler hakkında Kurula bilgi verilir.<\/li>\n<li>Tertipler halinde satış mümkün. Halka arzda her tertip için Kurul onayı; yurt dışında her ihraçtan önce tertip ihraç belgesi onayı; <b>yurt içinde halka arz edilmeksizin<\/b> ihraçta her tertipten önce yalnız <b>MKK<\/b>'ya başvurulur.<\/li>\n<li>Kurul, ihraççıların TMK'ya ilişkin hesap ve işlemlerini denetleyebilir.<\/li>\n<\/ul>\n\n<h3>Teminat varlıklar<\/h3>\n<table><tr><th>VTMK teminatı olabilecekler<\/th><th>İTMK teminatı olabilecekler<\/th><\/tr>\n<tr><td>Banka ve finansman şirketlerinin tüketici ve ticari kredi alacakları; finansal kiralama alacakları ve <b>sigortalanmış faktoring<\/b> alacakları; TOKİ'nin taşınmaz satışından taksitli alacakları; GYO'ların portföy gayrimenkullerinin satışı veya satış vaadinden teminatlı alacakları ve <b>kira alacakları<\/b>; Hazine ve Maliye Bakanlığının borçlusu olduğu proje bazlı uzun vadeli döviz krediler; ikame varlıklar; Kurulca belirlenen diğerleri<\/td><td>Bankaların ve finansman şirketlerinin ipotekli konut finansmanı alacakları; konut finansmanından doğan finansal kiralama alacakları; ipotekli ticari kredi ve alacaklar; yalnız <b>İFK<\/b> ihraçlarında TOKİ'nin konut satışından alacakları; ikame varlıklar; Kurulca belirlenen diğerleri. İpoteksiz konut finansmanı alacağı Kurulca uygun başka teminatla bağlanmışsa kullanılabilir.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>İkame varlıklar:<\/b> nakit, TCMB likidite senetleri, devlet iç ve dış borçlanma senetleri, Hazinenin VKŞ'lerinin kira sertifikaları, 4749 sayılı Kanunla Hazine kefaletli menkul kıymetler, <b>OECD<\/b> üyesi ülke merkezi yönetim ve merkez bankalarının veya bunların kefaletli menkul kıymetleri, Kurulca ilan edilen diğerleri. <b>Dikkat:<\/b> bankadaki mevduat ikame varlık listesinde yer almaz.<\/li>\n<li><b>Nitelikler:<\/b> banka kredileri deftere kayıt tarihinde <b>Birinci Grup<\/b> (standart) kredi; finansman şirketi kredileri ve kiralama alacakları için <b>özel karşılık ayrılmamış<\/b>; ipotekli taşınmaz Türkiye'de, piyasa değeri BDDK veya Kurul listesindeki değerleme kuruluşunca tespit edilmiş, zorunlu sigortaları yapılmış; deniz, hava ve kara taşıtı ticari kredilerinde tekne-makine, gövde ve kasko sigortası.<\/li>\n<li>Ticari kredi: mal ve hizmet üretimi, taşıt dahil ticari taşınır ve taşınmaz finansmanı, işletme sermayesi kredileri ile tüzel kişilere kullandırılan krediler.<\/li>\n<\/ul>\n<h4>Türev araçlar<\/h4>\n<ul>\n<li>Toplam yükümlülüklerin karşılanması veya <b>durasyon açığının<\/b> giderilmesi için faiz veya kur riskine karşı forward, futures, opsiyon ve swap deftere kaydedilebilir.<\/li>\n<li>Şartlar: borsada işlem görmesi veya karşı tarafın yetkili banka, kredi kuruluşu, sigorta şirketi, merkezi takas veya uluslararası finans kuruluşu olup <b>yatırım yapılabilir<\/b> seviyede uluslararası uzun vadeli nota sahip olması; karşı tarafın TMK itfa edilene kadar ihraççının iflası dahil sözleşmeyi <b>tek taraflı feshedememesi<\/b>; karşı tarafın deftere kayda onayı; netleştirmenin defterdeki türevler ve diğer işlemler için <b>ayrı ayrı<\/b> yapılması.<\/li>\n<li>Not değerlendirmesi: Türkiye'de yerleşiklerde <b>ulusal not<\/b>; yatırım yapılabilir seviyenin en alt sınırındakilerde görünüm en az <b>durağan<\/b>; birden fazla not varsa <b>en yüksek ikinci not<\/b>.<\/li>\n<li>Tek taraflı fesih hükmü (Kurul uygun görüşüyle) eklenebilecek haller: ihraççının yükümlülüklerini yerine getirememesi ve teminatların yetmemesi; imkansızlık, hukuka aykırılık veya önemli mevzuat değişikliği; TMK'nın erken itfası; türevin deftere kaydedilmemesi veya çıkarılması.<\/li>\n<li>Değerleme yalnız karşı taraf kotasyonuna dayanamaz; güncel piyasa fiyatı veya kabul görmüş model; doğrulama bağımsız üçüncü kişi ya da teminat yönetiminden bağımsız iç birim tarafından.<\/li>\n<\/ul>\n<h4>Teminat defteri<\/h4>\n<ul>\n<li>Teminat varlıkları ve türev hak-yükümlülüklerini ihraççının diğer malvarlığından ayrıştırmak için yazılı veya elektronik kayıt sistemi; günlük takibi sağlayan ayrı hesaplar veya ayırt edici altyapı.<\/li>\n<li>İş akışları <b>yönetim kurulu<\/b> veya yetkilendirdiği birim veya kişilerce onaylanır. Kurul defterin ayrıca başka bir kuruluşta tutulmasını zorunlu kılabilir.<\/li>\n<li>Uyuşmazlıklarda <b>defter kayıtları esas<\/b> alınır.<\/li>\n<li>Elektronik defter güncellendiği her gün <b>MKK<\/b>'ya iletilir; günlük ve geriye dönük manuel müdahalesiz altyapı kurulup teminat sorumlusunca teyit edilmişse bildirim zorunluluğu yoktur.<\/li>\n<\/ul>\n<h4>İdare ve koruma<\/h4>\n<ul>\n<li>İdareden <b>ihraççı<\/b> sorumludur: defteri tutma, tahsilat, uyum kontrolü, TMK sahiplerine ödemeler, sigorta ve vergi gibi idari işler.<\/li>\n<li>TMK itfa edilene kadar teminat varlıklar (ihraççının yönetimi kamuya devredilse bile) teminat amacı dışında tasarruf edilemez, rehnedilemez, teminat gösterilemez, kamu alacakları dahil <b>haczedilemez<\/b>, <b>iflas masasına girmez<\/b>, ihtiyati tedbir konamaz.<\/li>\n<li>Tahsil edilen nakit, uyum ihlali yoksa ve ihraççı yükümlülüklerini yerine getiriyorsa <b>serbestçe<\/b> kullanılabilir.<\/li>\n<li>Niteliğini kaybeden veya baştan niteliksiz varlıklar nitelikli olanlarla değiştirilir; değiştirilmeden çıkarma ancak uyum ihlali yoksa mümkün. <b>İTMK<\/b>'da uyum ihlali yoksa bu varlıklar defterde kalabilir.<\/li>\n<li>Kredi kalitesi için yeni varlık eklenebilir veya değiştirilebilir. İhlal ve ödeme güçlüğünde tahsilatları ayrı hesaba aktaracak tedbirler sözleşmelerle alınır ve izahnamede yazılır. Sigorta yükümlülüklerinin süre boyunca yerine getirildiğini ihraççı izler.<\/li>\n<li><b>Dışarıdan hizmet:<\/b> sorumluluk ihraççıda kalmak üzere varlık idaresi <b>hizmet sağlayıcıya<\/b>, nakit yönetimi <b>nakit yöneticisine<\/b> devredilebilir; ikisi de <b>banka veya İFK<\/b>'dır. Uzmanlaşmış diğer kuruluşlardan kısmi hizmet de alınabilir; satıştan önce Kurula bildirilir ve izahnamede açıklanır. Hizmet alınan kuruluşun teknik donanım, altyapı, mali güç, tecrübe, bilgi birikimi ve insan kaynağı incelenir.<\/li>\n<\/ul>\n\n<h3>Teminat uyum ilkeleri<\/h3>\n<table><tr><th>İlke<\/th><th>Kural<\/th><\/tr>\n<tr><td>Nominal değer uyumu<\/td><td>Teminat varlıkların nominali TMK nominalinden <b>az olamaz<\/b>. Kredilerde bakiye anapara, iskontolu araçta ihraç fiyatı, primli araçta nominal; <b>türevlerin sözleşme değeri dahil edilmez<\/b>.<\/td><\/tr>\n<tr><td>Nakit akımı uyumu<\/td><td>Hesaplamayı izleyen <b>1 yıl<\/b> içinde teminatlardan beklenen faiz ve getiri toplamı, aynı dönemde yükümlülüklerden beklenen benzer ödemelerden az olamaz.<\/td><\/tr>\n<tr><td>Net bugünkü değer uyumu<\/td><td><b>VTMK:<\/b> teminat NBD'si, yükümlülüklerin NBD'sinden Tebliğ Ek-4'teki varlık türüne göre oranlardan az olmamak üzere ihraççının belirlediği oranda fazla; karma defterde ağırlıklı ortalama. <b>İTMK:<\/b> ihraççının başlangıçta belirlediği ve <b>%2'den az olmayan<\/b> oranda fazla.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Teminat fazlası deftere kaydedilir. İTMK'da zorunlu teminat fazlası <b>ikame varlıklardan<\/b> oluşur ve bu, ikamelere ilişkin %15 sınırında dikkate alınmaz. NBD'ler TMS'ye göre belirlenir.<\/li>\n<\/ul>\n<h4>İTMK özel hükümleri<\/h4>\n<ul>\n<li>Uyum hesaplarında dikkate alınmayanlar: teminat niteliğini kaybeden krediler; konut finansmanı kredilerinde kredinin teminat değerinin <b>%80<\/b>'ini aşan kısmı; ipotekli ticari kredilerde teminat değerinin <b>%50<\/b>'sini aşan kısmı.<\/li>\n<li>%80 ve %50 sınırları teminat değerindeki değişikliklere göre <b>en az yılda bir<\/b> gözden geçirilir; en son değer esas. Kabul görmüş taşınmaz fiyat endeksi varsa kullanılır; fiyatlar düşerse taşınmaz değeri ortalama değişim kadar azalmış sayılır; ortalamadan belirgin düşüş emaresinde yeni değerleme zorunlu.<\/li>\n<li>NBD; beklenen nakit akımları, tahmini erken ödeme oranları ve erken ödeme ücretleriyle hesaplanır; yöntemler teminat sorumlusuna ve Kurula bildirilir.<\/li>\n<li>Deniz ve hava taşıtı dışındaki ipotekli ticari kredilerin NBD'si toplam teminat NBD'sinin <b>%15<\/b>'ini; <b>ikame varlıkların<\/b> NBD'si de toplamın <b>%15<\/b>'ini aşamaz.<\/li>\n<li>Uyum, defterdeki her değişiklikte ve <b>en az ayda bir<\/b> kontrol edilir. İhraççı ilave uyum ilkeleri ve yaptırımlar belirleyebilir; bunlar teminat sorumlusu sözleşmesinde düzenlenir.<\/li>\n<\/ul>\n<h4>Stres testi<\/h4>\n<ul>\n<li>NBD uyumunun faiz ve kur değişimlerine duyarlılığını ölçer. <b>VTMK<\/b>'da TMK ile teminatların para birimi veya faiz türü (sabit ya da değişken) farklıysa; <b>İTMK<\/b>'da <b>her durumda<\/b> zorunlu. Zorunlu ihraçlarda <b>en az ayda bir<\/b> yapılır.<\/li>\n<li>İTMK'da tüm senaryolarda belirlenen teminat fazlası (asgari %2) sağlanmalı; VTMK'da tüm senaryolarda Ek-4 oranları sağlanmalı.<\/li>\n<li>Nakit akımları <b>swap<\/b> oranlarından elde edilen getiri eğrileriyle iskonto edilir; vadeye uygun oran yoksa türetilir; son vadeyi aşanlarda son vadenin oranı. Değişken faizlilerde mevcut faizin vade boyunca değişmeyeceği varsayılır. Erken ödeme oranları faiz farkı ve geçmiş istatistiklerle tahmin edilir.<\/li>\n<li><b>Faiz şoku:<\/b> TL için <b>±300 baz puan<\/b>, yabancı para için <b>±150 baz puan<\/b> paralel kaydırma; negatif faiz sıfır sayılır.<\/li>\n<li><b>Kur şoku:<\/b> TCMB gösterge döviz alış kuru <b>±%30<\/b>.<\/li>\n<li>İkame varlıklar ve türevler TMS'ye göre değerlenir.<\/li>\n<\/ul>\n<h4>Uyum ihlali<\/h4>\n<ul>\n<li>İhraççı tespit ederse ivedilikle teminat sorumlusuna bildirir; tespitten itibaren <b>1 ay<\/b> içinde varlıkların yapılandırılması, TMK'ların geri alınması vb. ile uyum yeniden sağlanır ve teminat sorumlusunca teyit edilir.<\/li>\n<li>İhlal süresince tahsilatlar <b>ayrı hesapta<\/b> biriktirilir ve yalnız bu sürede muaccel olan yükümlülüklerde kullanılır. Uyum sağlanırsa ayrı hesaptaki nakit ihraççıya döner; sağlanmazsa teminat sorumlusu ihraççıya bildirir.<\/li>\n<\/ul>\n\n<h3>Teminat sorumlusu<\/h3>\n<ul>\n<li>Teminat defteri ve varlıkları kontrol eden, sermaye piyasasında <b>bilgi sistemleri bağımsız denetimi<\/b> yapmaya yetkili bağımsız denetim kuruluşu.<\/li>\n<li>İhraçtan <b>önce<\/b> yazılı sözleşmeyle belirlenir; ihraççının <b>yönetim kurulu<\/b> seçebilir. <b>Dikkat:<\/b> ihraççının finansal tablolarını denetleyen kuruluş ve onunla aynı yabancı denetim ağına hukuken bağlı Türkiye'deki kuruluşlar seçilemez.<\/li>\n<li>Sözleşme haklı gerekçeler yazılı olarak Kurula iletilip Kurul uygun görüşü alınarak sona erdirilebilir; bilgiler yeni sorumluya devredilmek üzere ihraççıya teslim edilir.<\/li>\n<li>Kurul nitelik kaybeden veya ihmali olan teminat sorumlusunun değiştirilmesini isteyebilir veya <b>resen<\/b> değiştirebilir.<\/li>\n<li><b>ISRS 4400<\/b> standardına uyar; görevini başkasına devredemez.<\/li>\n<\/ul>\n<h4>Görevleri<\/h4>\n<ol>\n<li>Teminat defterinin oluşturulup oluşturulmadığını ve uyum ilkelerini incelemek (halka arzda başvuru tarihi itibarıyla, diğerlerinde defter oluşturulduktan sonra).<\/li>\n<li>Elektronik defterde bilgi işlem sistemindeki çapraz kontrol, otomasyon ve yetkilendirmeleri incelemek, raporu ihraççıya vermek, örneğini Kurula göndermek.<\/li>\n<li>Deftere ekleme, çıkarma ve değişiklik kayıtlarının doğruluğunu kredi dokümanlarıyla teyit etmek.<\/li>\n<li>Uyum ilkelerine uygunluğu ve stres testlerinin doğruluğunu incelemek.<\/li>\n<li><b>Teminat uyum raporu:<\/b> halka arzda en az <b>üç aylık<\/b>, halka arz edilmeksizin veya yurt dışı ihraçta en az <b>altı aylık<\/b> dönemler itibarıyla; dönem bitimini izleyen <b>20 iş günü<\/b> içinde ihraççıya.<\/li>\n<li>İhlalde 1 ay içinde uyumun sağlanıp sağlanmadığını ve ayrı hesap kullanımını kontrol etmek.<\/li>\n<li>Ödeme güçlüğünde 1 ay içinde ayrı hesabı, kullanımı ve teminatların yeterliliğini kontrol etmek.<\/li>\n<\/ol>\n<ul>\n<li>Teminat varlıkların kalan ortalama birim anaparası <b>20.000 TL'den düşük<\/b> veya sayısı <b>500'den fazla<\/b> ise ilk üç incelemede en az <b>%95 güvenilirlikle<\/b> örneklem kullanılır.<\/li>\n<li>Kurul varlıkların defterden çıkarılmasını teminat sorumlusunun onayına bağlayabilir. Mevcut defterle yeni tavan başvurusunda önceki rapor ve beyanlar varsa ilk iki görev aranmaz (Kurul isteyebilir).<\/li>\n<li><b>Yetkiler:<\/b> ihraççıdan her türlü bilgi-belge, kayıt inceleme, çalışanlardan bilgi; bağımsız denetim, değerleme, derecelendirme kuruluşları ile sicil müdürlüklerinden bilgi. Engellenirse <b>derhal Kurula<\/b> bildirir.<\/li>\n<\/ul>\n\n<h3>Tedbirler<\/h3>\n<ul>\n<li><b>Ödeme güçlüğü:<\/b> ihraççı yükümlülüklerini kısmen veya tamamen yerine getiremezse teminat sorumlusuna bildirir; o tarihten itibaren tahsilatlar ayrı hesapta biriktirilir, yalnız muaccel yükümlülüklerde kullanılır. Teminat sorumlusu 1 ay içinde bunu ve teminatların yeterliliğini tespit edip ihraççıya bildirir. Şartlar sağlanmazsa teminat borçlularına, <b>ihraççı nezdinde olmayan ve ihraççıya ait olmayan<\/b> hesaba ödeme yapmaları için yazı gönderilir veya Kurulca uygun muadil tedbir alınır.<\/li>\n<li>Alacağı teminatlarla karşılanmayan TMK sahipleri ve koruma sözleşmelerinin karşı tarafları, teminat tahsilatını <b>beklemeksizin<\/b> ihraççının diğer malvarlığına başvurabilir.<\/li>\n<li><b>İdareci atanması:<\/b> ihraççının yönetiminin kamuya devri, faaliyet izninin kaldırılması veya <b>iflası<\/b> hallerinde Kurul; ihraççı niteliğindeki başka banka veya İFK'yı, teminat sorumlusunu, başka bir bağımsız denetim kuruluşunu veya uzmanlaşmış bir kuruluşu idareci atayabilir. İdareci yükümlülükleri <b>üstlenmeden<\/b> teminatları idare eder.<\/li>\n<li>Gelir önce TMK sahiplerine ve koruma sözleşmesi karşı taraflarına ödenir; Yatırımcı Tazmin Merkezine hizmet ödemesi idareciye yapılır.<\/li>\n<li>İdareci varlıkları aktif yönetebilir, satabilir, yeni varlık alabilir, kredi kullanabilir, repo yapabilir. Kurul uygun görüşüyle varlık ve yükümlülükleri başka banka veya İFK'ya devredebilir; devralan mülkiyeti edinir ve ödemelerden sorumlu olur; yükümlülükler tam karşılandıktan sonra artan varlıklar devralana aittir.<\/li>\n<li>Devredilemez ve gelir yetmezse idareci ödemelerden sorumlu değildir. TMK sahiplerinin menfaatine gerekirse <b>erken itfayı Kurula önerebilir<\/b>; Kurul uygun görürse varlıkları nakde çevirip erken itfayı yürütür.<\/li>\n<\/ul>\n\n<h3>Kamuyu aydınlatma<\/h3>\n<ul>\n<li>Teminat uyum raporu ve teminat sorumlusu bildirimleri: ihraççıya iletildiği <b>gün<\/b> ihraççının sitesinde ve KAP'ta.<\/li>\n<li><b>Yatırımcı raporu:<\/b> <b>üç aylık<\/b> dönemler itibarıyla teminatlardan tahsilatlar ve TMK sahiplerine ödemeler; dönem bitimini izleyen <b>6 iş günü<\/b> içinde.<\/li>\n<li>Ödeme yükümlülüğünün yerine getirilememesi: durumun ortaya çıktığı <b>tarihte<\/b> ilan.<\/li>\n<li>Halka arz edilmeksizin ihraçta ilanlar <b>MKK aracılığıyla<\/b> iletilir ve sitede yayımlanır; yayım bilgisi 6 iş günü içinde Kurula. Yurt dışı ihraçta yöntem serbest.<\/li>\n<\/ul>", "sorular": [{"q": "Teminatlı menkul kıymetin temel niteliği hangisidir?", "o": ["İhraççının genel yükümlülüğü olan ve teminat varlıklar karşılık gösterilerek ihraç edilen borçlanma aracıdır", "Teminat varlıkların bilanço dışına çıkarıldığı ortaklık payıdır", "Bir fon tarafından inançlı mülkiyetle ihraç edilen menkul kıymettir", "Yalnızca kamu tarafından ihraç edilebilen bonodur", "Projeye dayalı gelir paylaşım aracıdır"], "a": 0, "e": "TMK ihraççının genel yükü aliye Bakanlığınca kurulan varlık kiralama şirketlerinin ihraç ettiği kira sertifikaları, TMK ihracında teminat defterine hangi varlık grubu içinde kaydedilebilir?", "o": ["Hazine alacakları", "TOKİ alacakları", "Yedek hesap varlıkları", "İkame varlıklar", "GYO alacakları"], "a": 3, "e": "Nakit, TCMB likidite senetleri, devlet iç ve dış borçlanma senetleri, Hazine VKŞ'lerinin kira sertifikaları ve OECD ülkelerinin kamu menkul kıymetleri ikame varlıklar arasında sayılır."}, {"q": "Aşağıdakilerden hangisi VTMK ihracına teminat olabilir ancak İTMK listesinde yer almaz?", "o": ["İpotekli konut finansmanı alacakları", "İkame varlıklar", "İpotekli ticari krediler", "GYO'ların kira sözleşmelerinden kaynaklanan alacakları", "Konut finansal kiralama alacakları"], "a": 3, "e": "GYO alacakları VTMK teminat varlıkları arasındadır; İTMK listesinde yoktur."}, {"q": "TMK'da teminat defterine kaydedilecek türev aracın karşı tarafının birden fazla derecelendirme notu varsa hangi not esas alınır?", "o": ["En yüksek not", "En düşük not", "En son verilen not", "Notların ortalaması", "En yüksek ikinci not"], "a": 4, "e": "Birden fazla not varsa en yüksek ikinci not esas alınır."}, {"q": "Teminat defterinin tutulmasına ilişkin iş akışlarını kim onaylar?", "o": ["İhraççının yönetim kurulu veya yetkilendirdiği birim ya da kişiler", "Kurul", "Teminat sorumlusu", "MKK", "Genel kurul"], "a": 0, "e": "İş akışları ihraççının yönetim kurulu veya yetkilendirdiği birim veya kişilerce onaylanır."}, {"q": "TMK teminat uyum ilkeleri arasında aşağıdakilerden hangisi yer almaz?", "o": ["Nominal değer uyumu", "Vade uyumu", "Net bugünkü değer uyumu", "Nakit akımı uyumu", "Hiçbiri, hepsi uyum ilkesidir"], "a": 1, "e": "Üç uyum ilkesi nominal değer, nakit akımı ve net bugünkü değer uyumudur."}, {"q": "Nominal değer uyumu hesaplamasıyla ilgili hangisi yanlıştır?", "o": ["Kredilerde bakiye anapara dikkate alınır", "İskontolu borçlanma araçlarında ihraç fiyatı dikkate alınır", "Türev araçların sözleşme değeri dahil edilir", "Primli borçlanma araçlarında nominal değer dikkate alınır", "Teminat nominali TMK nominalinden az olamaz"], "a": 2, "e": "Türev araçların sözleşme değeri nominal değer uyumu hesaplamasına dahil edilmez."}, {"q": "İTMK ihraçlarında net bugünkü değer uyumu için teminat fazlası oranı en az yüzde kaç olmalıdır?", "o": ["%1", "%10", "%5", "%2", "%15"], "a": 3, "e": "İTMK'da teminatların NBD'si yükümlülüklerin NBD'sinden en az %2 fazla olmalıdır."}, {"q": "İTMK teminat uyum hesaplamalarında konut finansmanı kredilerinin teminat değerinin yüzde kaçını aşan kısmı dikkate alınmaz?", "o": ["%50", "%60", "%75", "%90", "%80"], "a": 4, "e": "Konut finansmanı kredilerinde teminat değerinin %80'ini aşan kısım, ipotekli ticari kredilerde %50'sini aşan kısım dikkate alınmaz."}, {"q": "İTMK ihraçlarında ikame varlıkların net bugünkü değeri, teminat varlıkların toplam net bugünkü değerinin yüzde kaçını aşamaz?", "o": ["%15", "%10", "%5", "%20", "%25"], "a": 0, "e": "İkame varlıklar için sınır %15'tir; zorunlu teminat fazlası bu sınırda dikkate alınmaz."}, {"q": "TMK stres testinde TL ve yabancı para faiz oranlarına uygulanan paralel şoklar hangisidir?", "o": ["TL ±150 bp, YP ±300 bp", "TL ±300 bp, YP ±150 bp", "TL ±200 bp, YP ±100 bp", "TL ±500 bp, YP ±250 bp", "Her ikisi ±300 bp"], "a": 1, "e": "TL faizleri 300, yabancı para faizleri 150 baz puan artırılıp azaltılır."}, {"q": "TMK stres testinde döviz kuruna uygulanan şok hangisidir?", "o": ["±%10", "±%15", "±%30", "±%20", "±%50"], "a": 2, "e": "TCMB gösterge döviz alış kuru %30 artırılıp azaltılır."}, {"q": "Stres testi zorunluluğu ile ilgili hangisi doğrudur?", "o": ["VTMK'da her durumda zorunludur", "İTMK'da yalnız para birimleri farklıysa zorunludur", "Hiçbir durumda zorunlu değildir", "İTMK'da her durumda, VTMK'da para birimi veya faiz türü farklıysa zorunludur", "Yılda bir kez yapılır"], "a": 3, "e": "İTMK'da stres testi her durumda zorunludur; VTMK'da para birimi veya faiz türü farkı varsa zorunludur. Zorunlu ihraçlarda en az ayda bir yapılır."}, {"q": "Teminat uyum ilkelerinin ihlali tespit edildiğinde uyum en geç ne kadar sürede yeniden sağlanmalıdır?", "o": ["10 gün", "20 iş günü", "6 ay", "3 ay", "1 ay"], "a": 4, "e": "Uyum ihlalin tespitinden itibaren 1 ay içinde yeniden sağlanmalı ve teminat sorumlusunca teyit edilmelidir."}, {"q": "Teminat sorumlusu ile ilgili hangisi yanlıştır?", "o": ["İhraççının finansal tablolarını denetleyen kuruluş teminat sorumlusu olarak seçilebilir", "TMK ihracından önce yazılı sözleşmeyle belirlenir", "Bilgi sistemleri bağımsız denetimine yetkili bir bağımsız denetim kuruluşudur", "Kurul teminat sorumlusunu resen değiştirebilir", "Görevlerini başkasına devredemez"], "a": 0, "e": "İhraççının finansal tablolarını denetleyen kuruluş ve hukuken bağlantılı kuruluşlar teminat sorumlusu olamaz."}, {"q": "Halka arz edilen TMK'larda teminat uyum raporu en az hangi dönemler itibarıyla hazırlanır ve ne zaman ihraççıya iletilir?", "o": ["Aylık; 10 iş günü", "Üç aylık; dönem bitimini izleyen 20 iş günü", "Altı aylık; 30 gün", "Yıllık; 3 ay", "Üç aylık; 6 iş günü"], "a": 1, "e": "Halka arzda en az üç aylık, diğer ihraçlarda en az altı aylık dönemler itibarıyla; dönem bitimini izleyen 20 iş günü içinde ihraççıya iletilir."}, {"q": "Teminat sorumlusunun incelemelerinde örneklem kullanılabilmesi için hangi koşul geçerlidir?", "o": ["Varlık sayısının 100'den fazla olması", "Varlıkların tamamının konut kredisi olması", "Kalan ortalama birim anaparanın 20.000 TL'den düşük veya varlık sayısının 500'den fazla olması", "İhracın yurt dışında yapılması", "Kurulun izin vermesi"], "a": 2, "e": "Bu durumda incelemeler en az %95 güvenilirlik düzeyiyle hesaplanan örneklem üzerinden yapılır."}, {"q": "Aşağıdakilerden hangisi Kurulun TMK ihraççısı için idareci atayabileceği hallerden biri değildir?", "o": ["İhraççının iflası", "İhraççının faaliyet izninin kaldırılması", "İhraççının yönetiminin kamu kurumlarına devredilmesi", "İhraççının kredi notunun düşmesi", "Hepsi idareci atama nedenidir"], "a": 3, "e": "İdareci atama halleri yönetimin kamuya devri, faaliyet izninin kaldırılması ve iflastır."}, {"q": "TMK'da ihraççının ödeme yükümlülüğünü yerine getirememesi halinde hangisi doğrudur?", "o": ["TMK sahipleri yalnızca teminat varlıklara başvurabilir", "İdareci tüm yükümlülükleri üstlenir", "Teminat varlıklar ihraççının iflas masasına girer", "Tahsilatlar ihraççının serbest hesabına aktarılır", "TMK sahipleri teminat tahsilatını beklemeksizin ihraççının diğer malvarlığına başvurabilir"], "a": 4, "e": "Alacağı karşılanmayan TMK sahipleri teminat tahsilatını beklemeksizin ihraççının diğer malvarlığına başvurabilir; bu, genel yükümlülük niteliğinin sonucudur."}]}, {"id": 5, "kisa": "Kira Sertifikaları", "baslik": "Faizsiz Finans Araçları ve Kira Sertifikaları Tebliği (III-61.1)", "ozet": "Faizsiz finansın yasakları ve temel unsurları, İslami finansman yöntemleri ve sukuk yapıları; kira sertifikası türleri, ihraç sınırları, Kurul ücreti, varlık kiralama şirketlerinin kuruluşu, yönetimi ve yatırımcı raporu.", "notlar": "<h3>Faizsiz finansın temelleri<\/h3>\n<ul>\n<li>Faizsiz finans, hesapların faiz getirisine dayanmadığı araçlarla işler. Paranın zaman değerini <b>toptan reddetmez<\/b>; ancak kapital faiz veya reel faiz şeklindeki zaman değerine izin vermez. Bir malın <b>peşin ve vadeli fiyatının farklı olması<\/b> caizdir.<\/li>\n<li>İslam kuralları üç başlık: <b>akideye<\/b> ilişkin (iman ve inanç), <b>şer'i<\/b> (hukuk) kurallar, <b>ahlak<\/b> kuralları. Hukuk kuralları ikiye ayrılır: <b>ibadat<\/b> (ibadetler) ve <b>muamelat<\/b> (ilişkiler: sosyal, siyasi, ekonomik). Faizsiz finansa ilişkin kurallar <b>muamelat<\/b> altındadır.<\/li>\n<li>Sözleşmelere ilişkin <b>4 yasak ve 2 temel unsur<\/b> vardır.<\/li>\n<\/ul>\n<table><tr><th>Yasak<\/th><th>Anlamı<\/th><\/tr>\n<tr><td><b>Riba<\/b> (faiz)<\/td><td>Vadede anaparaya ek olarak, kesin ve önceden belirlenmiş orana göre tutar ödenemez; borç verenin risk almadan getiri elde etmesi yasaktır. Ek ödemenin az veya çok olması fark etmez. Fon sağlayıcı aynı zamanda yatırımcıdır.<\/td><\/tr>\n<tr><td><b>Gharar fahiş<\/b><\/td><td>Sözleşmenin esaslı (sine qua non) unsurunda önemli derecede belirsizlik (ör. kiralananın, kira tutarının, süresinin veya ödeme tarihinin belirsizliği).<\/td><\/tr>\n<tr><td><b>Haram<\/b><\/td><td>Sözleşme konusu yasal olmalı; faiz, alkol gibi konular üzerine sözleşme ve yatırım yapılamaz.<\/td><\/tr>\n<tr><td><b>Maysir<\/b> (spekülasyon)<\/td><td>Konu spekülatif ve kumar niteliğinde olamaz; özellikle kader birliği içermeyen işlemler için söz konusu.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Temel unsurlar:<\/b> (1) <b>Varlığa dayalı finansman<\/b>: ortak olmadan fon sağlanıyorsa sözleşme içsel değeri olan mal veya hak üzerinden kurulmalı; reel ekonomi ön planda, para ticaretin konusu değildir. (2) <b>Kâr-zarar ortaklığı<\/b>: sermaye ve emek birleşirse taraflar katkıları oranında kâra ve zarara katılır.<\/li>\n<\/ul>\n<h4>İslami finansman yöntemleri<\/h4>\n<ul>\n<li><b>Karşılıksız:<\/b> zekât (İslam'ın beş şartından biri; belli zenginlik düzeyindekilerin malının bir kısmı), sadaka (gönüllü, miktar ve zaman serbest), adak, kefaret, vakıf (malın toplum yararına tahsisiyle sürekli gelir), <b>karz-ı hasen<\/b> (faizsiz ödünç; aynı miktar geri alınır).<\/li>\n<\/ul>\n<table><tr><th>Karşılıklı yöntem<\/th><th>Özü<\/th><\/tr>\n<tr><td><b>Mudaraba<\/b> (emek-sermaye ortaklığı)<\/td><td>Bir taraf sermaye (rabb-al-mal), diğeri emek (mudarib). Kâr önceden belirlenen oranda paylaşılır; sabit kazanç yok; <b>zararın tamamını sermayedar<\/b> karşılar (girişimcinin ihmali, kötü niyeti yoksa).<\/td><\/tr>\n<tr><td><b>Muşaraka<\/b> (kâr-zarar ortaklığı)<\/td><td>İki veya daha fazla taraf ortak sermaye koyar; kâr önceden belirlenen oranda, <b>zarar sermaye payları oranında<\/b>.<\/td><\/tr>\n<tr><td><b>Murabaha<\/b> (maliyet artı kâr)<\/td><td>Bir tür <b>satış<\/b> sözleşmesi: mal peşin alınıp vadeli satılır; dayanak varlığın likiditesinin yüksek olması esastır.<\/td><\/tr>\n<tr><td><b>İcara<\/b> (kiralama)<\/td><td>Finansal kiralamaya benzer, orta ve uzun vadeli; bedel ve süre belli.<\/td><\/tr>\n<tr><td><b>İstisna<\/b> (siparişle mal yaptırma)<\/td><td>İleride ortaya çıkacak veya inşa edilecek bir şeyin satışı; sünnet ve icmayla meşru.<\/td><\/tr>\n<tr><td><b>Selem<\/b> (ileriye dönük alım)<\/td><td>Özellikle tarımda; <b>bedel peşin, ürün vadeli<\/b>. Miktar, özellik, teslim yeri ve zamanı belirtilir; kural olarak <b>misli<\/b> mallar; döviz, altın, gümüş ve çek-poliçe gibi para benzerleri olamaz.<\/td><\/tr>\n<\/table>\n<h4>İslami finans endüstrisi<\/h4>\n<ul>\n<li>Üç kol: <b>bankacılık<\/b> (öncü), <b>takaful<\/b> (İslami sigorta), <b>İslami sermaye piyasası<\/b>.<\/li>\n<li>İlk İslami banka <b>1963 Mısır<\/b> (Mit Gharm); ilk İslami sigorta şirketi <b>1979 Sudan<\/b>; ilk İslami bono <b>1983 Malezya hükümeti<\/b>.<\/li>\n<li>Sukuk, İslami bankacılıktan sonra en büyük paya sahip araçtır. Uygunluk; kurumların bağımsız danışma kurulları veya düzenleyicilerin şeriat kurullarınca verilir.<\/li>\n<\/ul>\n<h4>Sukuk yapıları<\/h4>\n<ul>\n<li><b>Sahipliğe veya inançlı mülkiyete dayalı:<\/b> varlık önceden anlaşılan fiyattan VKŞ'ye satılır, VKŞ fiyata eşit sertifika ihraç eder, fon kullanıcısı varlığı kiralar, kira dağıtılır, vade sonunda varlık geri satılır. Uluslararası uygulamada bakım-onarımdan VKŞ sorumlu; ülkemizde sözleşmeyle kiracıya bırakılır.<\/li>\n<li><b>Alım-satıma dayalı:<\/b> emtia önceden anlaşılan kârla vadeli satılır, fon kullanıcısı emtiayı borsada peşin satarak finansman sağlar; sertifikalar <b>alacak hakkı<\/b> gösterir.<\/li>\n<li><b>Ortaklığa dayalı:<\/b> mudaraba (emek-sermaye) veya muşaraka (kâr-zarar); adi ortaklık veya ticaret şirketi olarak kurulabilir.<\/li>\n<li><b>Eser sözleşmesine dayalı (istisna sukuk):<\/b> genelde büyük altyapı projeleri.<\/li>\n<li><b>Hibrit:<\/b> birden fazla varlık havuzu; hangi tür ağırlıktaysa ona göre adlandırılır (ör. %51 inançlı mülkiyet + %49 alım-satım = inançlı mülkiyete dayalı).<\/li>\n<\/ul>\n\n<h3>Mevzuat gelişimi<\/h3>\n<ul>\n<li>Seri III No:27 Kâr ve Zarar Ortaklığı Belgeleri Tebliği (<b>2003<\/b>) → Seri III No:43 Kira Sertifikaları ve VKŞ Tebliği (<b>2010<\/b>) → <b>III-61.1<\/b> Kira Sertifikaları Tebliği (<b>07.06.2013<\/b>) → III-61.1.a değişikliği (2016).<\/li>\n<li>Dayanak SPKn <b>m.61<\/b> ve m.130/3. Tebliğ 4 bölüm.<\/li>\n<li>III-61.1'in yenilikleri: varlık tanımı varlık ve hakları kapsayacak şekilde genişledi; <b>6 tür<\/b> kira sertifikası; niteliği itibarıyla kira sertifikası sayılan yeni araçlara imkân; VKŞ yönetim kuruluna <b>bağımsız üye<\/b> zorunluluğu; VKŞ'nin başka şirketler için de ihraç yapabilmesi; aynı anda birden fazla ihraç ve her sertifika bazında ayrı izleme; ortaklık ve eser sözleşmesine dayalılarda <b>rehin<\/b>, yönetim sözleşmesi ve alım-satıma dayalılarda kaynak kuruluşların sınırlandırılması.<\/li>\n<li>VKŞ ve fon kullanıcılarının işlemleri Kurul denetimine tabidir (bankacılık mevzuatı saklı). <b>Dikkat:<\/b> 4749 sayılı Kanun <b>m.7/A<\/b> kapsamında Hazinenin ihraç ettiği kira sertifikaları ve kurduğu VKŞ'ler Tebliğe tabi değildir.<\/li>\n<\/ul>\n\n<h3>Tanımlar<\/h3>\n<ul>\n<li><b>Kira sertifikası:<\/b> her türlü varlık ve hakkın finansmanı için <b>VKŞ<\/b> tarafından ihraç edilen ve sahiplerine bu varlık veya haktan elde edilen gelirlerden payları oranında hak veren menkul kıymet.<\/li>\n<li><b>Varlık kiralama şirketi (VKŞ):<\/b> SPKn m.61 çerçevesinde <b>münhasıran<\/b> kira sertifikası ihracı için <b>anonim şirket<\/b> olarak kurulan sermaye piyasası kurumu.<\/li>\n<li><b>Varlık:<\/b> haklar dışındaki her türlü varlık.<\/li>\n<li><b>Kaynak kuruluş:<\/b> sahipliğe dayalıda varlığı VKŞ'ye devreden sermaye şirketi veya tacir adi ortaklığı; yönetim sözleşmesine dayalıda varlığını VKŞ adına yöneten şirket.<\/li>\n<li><b>Ortak girişim:<\/b> proje veya iktisadi faaliyetin finansmanı için kurulan sermaye şirketi veya adi ortaklık. <b>Girişimci:<\/b> ortak girişimi yöneten. <b>Yüklenici:<\/b> eser sözleşmesinde eseri meydana getiren.<\/li>\n<li><b>Fon kullanıcısı:<\/b> sahiplik ve yönetim sözleşmesinde kaynak kuruluş; alım-satımda VKŞ'nin vadeli sattığı varlığı alan (kurucu niteliğindeki) şirket; ortaklıkta girişimci ve VKŞ dışı ortaklar; eser sözleşmesinde eseri satın alan veya yüklenici.<\/li>\n<li>Tebliğ kapsamı dışındaki araçlar ve şirketler kira sertifikası veya VKŞ adını kullanamaz.<\/li>\n<\/ul>\n\n<h3>Kira sertifikası türleri<\/h3>\n<table><tr><th>Tür<\/th><th>Esas<\/th><th>Önemli kural<\/th><\/tr>\n<tr><td>Sahipliğe dayalı<\/td><td>Kaynak kuruluştan devralınan varlığın kiralanması veya VKŞ adına yönetimi<\/td><td>Devir sözleşmesi, gerekli tescil, VKŞ'nin temerrütte doğrudan tasarruf yetkisi. İhraç tutarı gerçeğe uygun değerin <b>%90<\/b>'ını aşamaz. Gayrimenkulde kaynak kuruluş isterse <b>geri alım hakkı tapuya şerh<\/b> zorunlu. Varlık üzerinde üçüncü kişi lehine hak, haciz veya tedbir olmamalı.<\/td><\/tr>\n<tr><td>Yönetim sözleşmesine dayalı<\/td><td>Kaynak kuruluşun varlığı <b>mülkiyet devredilmeden<\/b> VKŞ lehine yönetilir, gelir VKŞ'ye aktarılır<\/td><td>VKŞ'nin geliri veya hesaplama esası sözleşmede düzenlenmeli.<\/td><\/tr>\n<tr><td>Alım-satıma dayalı<\/td><td>VKŞ varlığı alır, VKŞ kurabilecek şirketlere vadeli satar<\/td><td>VKŞ en geç fonların hesaba geçtiği günü izleyen <b>iş günü<\/b> spot piyasadan alıp maliyet üstü vadeli satmalı; olmazsa fonlar en geç hesaba geçişi izleyen <b>2. iş günü<\/b> iade edilir. Varlık BİAŞ veya diğer <b>likit piyasalarda<\/b> alınıp satılmalı.<\/td><\/tr>\n<tr><td>Ortaklığa dayalı<\/td><td>VKŞ'nin ortak girişime ortak olması<\/td><td>İhraç tutarı gerçeğe uygun değerin <b>%90<\/b>'ı. Ortak girişim veya diğer ortakların malvarlığı üzerinde ihraç tutarı kadar VKŞ lehine <b>rehin<\/b> zorunlu.<\/td><\/tr>\n<tr><td>Eser sözleşmesine dayalı<\/td><td>VKŞ iş sahibi sıfatıyla eser sözleşmesine taraf olur<\/td><td>İhraç tutarı gerçeğe uygun değerin <b>%90<\/b>'ı. Eser bedeli peşin ödenirse yükleniciden VKŞ lehine menkul-gayrimenkul rehni veya benzeri teminat zorunlu. Vade bitiminde satış bedelinin tamamı tahsil edilip ödenmeli.<\/td><\/tr>\n<tr><td>Hibrit<\/td><td>Türlerin birlikte kullanımı<\/td><td>Ağırlıktaki türe göre adlandırılır.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Ortaklığa dayalıda<\/b> yalnız VKŞ sermaye koyuyorsa: yönetim girişimci veya atadığı kişide; kâr paylaşım oranı veya girişimcinin sabit vekâlet ücreti sözleşmede; zararda VKŞ koyduğu <b>sermaye ile sınırlı<\/b> katlanır (girişimcinin kötü niyeti ve hukuka aykırılığı hariç). VKŞ nakit, diğerleri emek ve ticari itibar dışında sermaye koyuyorsa: zarara ortaklar sermaye payları oranında ve koydukları sermayeyle sınırlı katlanır.<\/li>\n<li>Girişimcinin kötü niyetle verdiği zararda önce sözleşmedeki teminatlar, yetmezse VKŞ lehine rehin paraya çevrilir. Gayrimenkul rehninde sertifika adedi tapuda rehinler hanesine yazılır.<\/li>\n<li>Eser sözleşmesine dayalıda VKŞ eseri önce kiralayıp veya kiralamadan satabilir; hizmet, kat veya arsa karşılığı inşaat gibi sözleşmeler de yapılabilir.<\/li>\n<\/ul>\n\n<h3>Genel esaslar ve ihraç<\/h3>\n<ul>\n<li>İtfaya kadar VKŞ portföyündeki varlık ve haklar (yönetim kamuya devredilse bile) teminat amacı dışında tasarruf edilemez, rehnedilemez, haczedilemez, iflas masasına girmez, ihtiyati tedbir konamaz.<\/li>\n<li>Sertifika sahipleri gelirlerden payları oranında hak sahibidir; gerekirse vade sonunda varlık kaynak kuruluşa veya üçüncü kişiye satılıp bedel dağıtılır.<\/li>\n<li>Fon kullanıcısının ödememesi halinde yatırımcıyı koruyacak tedbirler başvuru aşamasında sözleşmelerle düzenlenmiş olmalıdır.<\/li>\n<li>Başvuruda Tebliğ ekleri; tavan içinde tertipler; halka arzda her tertip için Kurula onay başvurusu; <b>halka arz edilmeksizin satışta her satıştan önce tertip ihraç belgesi onayı<\/b> için Kurula başvurulur.<\/li>\n<li>Halka arz edilenler borsada işlem görür; borsaya başvuru zorunlu.<\/li>\n<li>Kurul; yurt içi yerleşik banka veya üçüncü kişi garantisi, yurt içi satışın yalnız nitelikli yatırımcıya yapılması veya sertifika, VKŞ ya da fon kullanıcısının <b>derecelendirilmesini<\/b> isteyebilir.<\/li>\n<li>İhraç: halka arz veya halka arz edilmeksizin (tahsisli ya da nitelikli yatırımcıya). Yurt içi ihraçta <b>MKK'da kayden ihraç zorunlu<\/b>. Yurt dışında da kural kayden ihraç (toplu hesap mümkün); Kurul talep üzerine muafiyet verebilir; bu durumda ihraç bilgileri ihraçtan sonra <b>3 iş günü<\/b> içinde, değişiklikler 3 iş günü içinde MKK'ya iletilir.<\/li>\n<\/ul>\n<h4>Kurul ücreti (ihraç değeri üzerinden, nominalden az olmamak üzere)<\/h4>\n<table><tr><th>Vade<\/th><th>Tebliğ oranı<\/th><th>%50 indirimli uygulama<\/th><\/tr>\n<tr><td>180 güne kadar<\/td><td>On binde 2,5<\/td><td>On binde 1,25<\/td><\/tr>\n<tr><td>181–364 gün<\/td><td>On binde 3,5<\/td><td>On binde 1,75<\/td><\/tr>\n<tr><td>365–730 gün<\/td><td>On binde 5<\/td><td>On binde 2,5<\/td><\/tr>\n<tr><td>730 günden uzun<\/td><td>Binde 1<\/td><td>Binde 0,5<\/td><\/tr>\n<\/table>\n<ul>\n<li>Bir yıl <b>365 gün<\/b>. Kurul 24.06.2016 duyurusuyla kira sertifikası Kurul ücretlerinde <b>%50 indirim<\/b> yaptı.<\/li>\n<\/ul>\n<h4>Değerleme raporu zorunluluğu<\/h4>\n<ul>\n<li>Sahipliğe dayalıda varlığın VKŞ'ye devrinde ve VKŞ'den kaynak kuruluşa veya üçüncü kişiye devrinde.<\/li>\n<li>Ortaklığa dayalıda proje değerinin belirlenmesinde ve diğer ortakların nakit dışı varlık koymasında.<\/li>\n<li>Eser sözleşmesine dayalıda eser bedelinin tespitinde ve satış sözleşmesinden önce.<\/li>\n<li>Uluslararası değerleme standartlarına göre.<\/li>\n<\/ul>\n\n<h3>Varlık kiralama şirketleri<\/h3>\n<h4>Kurucular<\/h4>\n<ul>\n<li>(a) Bankalar; (b) portföy aracılığı, genel saklama veya aracılık yüklenimi yapan <b>aracı kurumlar<\/b>; (c) <b>İFK<\/b>'lar; (ç) payları borsada işlem gören <b>GYO<\/b>'lar; (d) kurumsal yönetim düzenlemelerinde <b>birinci ve ikinci grupta<\/b> yer alan halka açık ortaklıklar; (e) ihraç para birimi cinsinden <b>yatırım yapılabilir<\/b> uzun vadeli notu olan ortaklıklar (ulusal not esas); (f) sermayesinin <b>%51 veya fazlası<\/b> doğrudan Hazine ve Maliye Bakanlığına ait ortaklıklar.<\/li>\n<li><b>Dikkat:<\/b> (ç), (d), (e) ve (f)'deki kurucular yalnız <b>kendilerinin fon kullanıcısı olduğu<\/b> ihraçlar için VKŞ kurabilir; bu esas sözleşmede yazılır.<\/li>\n<\/ul>\n<h4>Esas sözleşme ve pay devirleri<\/h4>\n<ul>\n<li>Esas sözleşme için Kurul <b>uygun görüşü<\/b> şart.<\/li>\n<li><b>Kurul iznine tabi:<\/b> birleşme, bölünme ve esas sözleşme değişiklikleri; bir kişinin doğrudan veya dolaylı <b>%10<\/b> veya fazlasını edinerek ortak olması veya payının <b>%10, %20, %33, %50<\/b> eşiklerini aşması ya da altına düşmesi; <b>yönetim veya oy imtiyazlı<\/b> payların her devri.<\/li>\n<li>Bu eşiklere ulaşmayan veya arasında kalan devirler devri izleyen <b>15 gün<\/b> içinde Kurula bildirilir.<\/li>\n<\/ul>\n<h4>Faaliyet sınırları<\/h4>\n<ul>\n<li>Esas sözleşmedeki faaliyetler dışında ticari faaliyet yok; izin verilenler dışında üçüncü kişiler lehine ayni hak kuramaz; <b>kredi kullanamaz, borçlanamaz<\/b>.<\/li>\n<li>Esas sözleşme onayından itibaren <b>1 yıl<\/b> içinde ihraç başvurusu yapmayan VKŞ, sürenin dolmasını izleyen <b>1 ay<\/b> içinde başvurmalı, faaliyet konusunu değiştirmeli veya infisah kararı alıp tasfiyeye girmeli.<\/li>\n<\/ul>\n<h4>Kayıt düzeni ve yönetim<\/h4>\n<ul>\n<li>Her tertibin varlık, gelir ve giderleri <b>sertifika bazında ayrı<\/b> izlenir; finansal durum tablosunda tertip bazında, likidite esasına göre ve <b>itfası en yakın tertip en üstte<\/b> raporlanır.<\/li>\n<li>Fon kullanıcılarıyla gerekli sözleşmeler zorunlu; izahname, finansal raporlama ve kamuyu aydınlatmada Kurulun diğer düzenlemeleri uygulanır.<\/li>\n<li>Yönetim kurulu en az <b>3 kişi<\/b>; en az <b>1 bağımsız<\/b> üye ve en az <b>1 SPF Düzey 3<\/b> lisanslı üye. Üyelerde yükseköğrenim, sermaye piyasası veya bankacılıkta en az <b>5 yıl<\/b> tecrübe, itibar, iflas ve konkordato olmaması.<\/li>\n<li>Fon kullanıcısı ile VKŞ kurucusu <b>aynıysa<\/b>, varlıkların satılması veya rehinli varlıkların paraya çevrilmesi gibi önemli işlemler <b>bağımsız üyelerin olumlu oyuna<\/b> bağlıdır; sorumluluk yönetim kurulundadır.<\/li>\n<li>Yönetim kurulu tahsilat ve sertifika sahiplerine ödemeden sorumludur. Yalnız ihraç ve faaliyet için gerekli, emsallerine uygun harcamalar yapılabilir.<\/li>\n<\/ul>\n<h4>Tasfiye<\/h4>\n<ul>\n<li>Hukuka aykırı faaliyet, mali durumun bozulduğunun kamuya açık tablolardan tespiti veya iflas ya da tedrici tasfiye kararında Kurul SPKn <b>m.96, 97, 98<\/b> tedbirlerini alabilir; tedrici tasfiyede yatırım kuruluşları hükümleri kıyasen uygulanır.<\/li>\n<li>Her tertibin varlıkları satılıp sertifika sahiplerine ödenmeden VKŞ <b>isteğe bağlı tasfiye edilemez<\/b>. Hak sahipleri tasfiyeye girilen gün itibarıyla <b>MKK kayıtlarına<\/b> göre belirlenir.<\/li>\n<\/ul>\n<h4>Yatırımcı raporu<\/h4>\n<ul>\n<li>İtfaya kadar <b>üç aylık<\/b> dönemler itibarıyla <b>VKŞ yönetim kurulu<\/b> hazırlar: tahakkuk eden gelirler, tahsilatlar, sertifika sahiplerine ödemeler.<\/li>\n<li>Dönem bitimini izleyen <b>5 iş günü<\/b> içinde: halka arzda <b>KAP<\/b>'ta yayımlanır; halka arz edilmeksizin ihraçta Kurula ve sertifika sahiplerine iletilir.<\/li>\n<li><b>Dikkat:<\/b> VİDMK ve TMK yatırımcı raporlarında süre 6 iş günü, kira sertifikasında 5 iş günüdür.<\/li>\n<\/ul>", "sorular": [{"q": "Faizsiz finans sisteminde genel kabul gören yasaklar arasında aşağıdakilerden hangisi yer almaz?", "o": ["Murabaha", "Gharar fahiş", "Maysir", "Haram konu", "Riba"], "a": 0, "e": "Murabaha bir yasak değil, maliyet artı kâr marjlı satış yöntemidir. Dört yasak riba, gharar, haram ve maysirdir."}, {"q": "Faizsiz finansa ilişkin kurallar İslam hukuku kuralları içinde hangi başlık altında yer alır?", "o": ["İbadat", "Muamelat", "Akideye ilişkin kurallar", "Ahlak kuralları", "Takaful"], "a": 1, "e": "Finans sistemine ilişkin kurallar ilişkiler hakkındaki kurallar, yani muamelat altındadır."}, {"q": "Bir kira sözleşmesinde kira süresinin belirlenmemiş olması hangi yasağın ihlaline örnektir?", "o": ["Riba", "Maysir", "Gharar fahiş", "Haram", "Karz-ı hasen"], "a": 2, "e": "Sözleşmenin esaslı unsurunda önemli derecede belirsizlik gharar fahiş yasağına girer."}, {"q": "Bir tarafın sermaye, diğer tarafın emek koyduğu ve zarar halinde zararın tamamının sermayedar tarafından karşılandığı yöntem hangisidir?", "o": ["Muşaraka", "Murabaha", "İcara", "Mudaraba", "Selem"], "a": 3, "e": "Mudaraba emek-sermaye ortaklığıdır; girişimcinin kusuru yoksa zararın tamamını sermayedar karşılar."}, {"q": "Bedelin peşin, ürünün vadeli olduğu ve özellikle tarım sektöründe kullanılan yöntem hangisidir?", "o": ["İstisna", "Muşaraka", "Murabaha", "İcara", "Selem"], "a": 4, "e": "Selem ileriye dönük satın almadır; bedel peşin, ürün vadelidir ve kural olarak misli mallar konu olabilir."}, {"q": "Aşağıdakilerden hangisi selem sözleşmesine konu olamaz?", "o": ["Altın", "Pamuk", "Buğday", "Arpa", "Mısır"], "a": 0, "e": "Döviz, altın, gümüş ve para benzeri çek ile poliçe seleme konu olamaz."}, {"q": "İlk İslami banka, ilk İslami sigorta şirketi ve ilk İslami bono ile ilgili eşleştirmelerden hangisi doğrudur?", "o": ["1963 Mısır – 1979 Sudan – 1983 Malezya", "1975 Dubai – 1979 Sudan – 1983 Malezya", "1963 Mısır – 1983 Malezya – 1979 Sudan", "1979 Sudan – 1963 Mısır – 1983 Malezya", "1963 Malezya – 1979 Mısır – 1983 Sudan"], "a": 0, "e": "İlk İslami banka 1963'te Mısır'da, ilk takaful şirketi 1979'da Sudan'da, ilk İslami bono 1983'te Malezya hükümetince çıkarıldı.", "k": 1}, {"q": "Varlık havuzunun %51'i inançlı mülkiyete, %49'u alım-satıma dayanan hibrit bir kira sertifikası nasıl adlandırılır?", "o": ["Alım-satıma dayalı", "İnançlı mülkiyete dayalı", "Hibrit kira sertifikası", "Ortaklığa dayalı", "Eser sözleşmesine dayalı"], "a": 1, "e": "Hibrit ihraçlarda ağırlıktaki varlık türüne göre adlandırma yapılır."}, {"q": "Aşağıdaki kira sertifikalarından hangisi III-61.1 Tebliği'ne tabi değildir?", "o": ["Bir bankanın kurduğu VKŞ'nin ihracı", "GYO'nun kurduğu VKŞ'nin ihracı", "4749 sayılı Kanun m.7/A kapsamında Hazinenin ihracı", "İFK'nın kurduğu VKŞ'nin ihracı", "Aracı kurumun kurduğu VKŞ'nin ihracı"], "a": 2, "e": "4749 sayılı Kanun m.7/A kapsamındaki Hazine ihraçları ve bu kapsamdaki VKŞ'ler Tebliğe tabi değildir."}, {"q": "Varlık kiralama şirketi ile ilgili hangisi yanlıştır?", "o": ["Anonim şirket olarak kurulur", "Münhasıran kira sertifikası ihracı amacıyla kurulur", "Bir sermaye piyasası kurumudur", "Faaliyetleri için banka kredisi kullanabilir", "Aynı anda birden fazla kira sertifikası ihracı yapabilir"], "a": 3, "e": "VKŞ her ne ad altında olursa olsun kredi kullanamaz ve borçlanamaz."}, {"q": "Varlığın mülkiyeti devredilmeksizin VKŞ lehine yönetilmesi ve elde edilen gelirin VKŞ'ye aktarılması esasına dayanan kira sertifikası hangisidir?", "o": ["Sahipliğe dayalı", "Eser sözleşmesine dayalı", "Alım-satıma dayalı", "Ortaklığa dayalı", "Yönetim sözleşmesine dayalı"], "a": 4, "e": "Yönetim sözleşmesine dayalı ihraçta mülkiyet devredilmez; VKŞ'nin geliri sözleşmede düzenlenir."}, {"q": "Sahipliğe dayalı kira sertifikasında ihraca dayanak varlığın gerçeğe uygun değeri 200 milyon TL ise ihraç tutarı en fazla ne olabilir?", "o": ["180 milyon TL", "150 milyon TL", "100 milyon TL", "200 milyon TL", "220 milyon TL"], "a": 0, "e": "İhraç tutarı değerleme raporundaki gerçeğe uygun değerin %90'ını aşamaz: 200 x 0,90 = 180 milyon TL."}, {"q": "Alım-satıma dayalı kira sertifikası ihracında VKŞ, fonların hesabına aktarıldığı günü izleyen iş günü varlığı alıp vadeli satamazsa toplanan fonlar en geç ne zaman iade edilir?", "o": ["Aynı gün", "Hesaba aktarılmayı izleyen ikinci iş günü", "5 iş günü içinde", "10 iş günü içinde", "1 ay içinde"], "a": 1, "e": "Fonlar en geç VKŞ hesabına aktarılmalarını izleyen ikinci iş günü yatırımcılara iade edilir."}, {"q": "Hangi kira sertifikası türünde ortak girişimin veya diğer ortakların malvarlığı üzerinde ihraç tutarı kadar VKŞ lehine rehin kurulması zorunludur?", "o": ["Sahipliğe dayalı", "Yönetim sözleşmesine dayalı", "Ortaklığa dayalı", "Alım-satıma dayalı", "Hiçbirinde"], "a": 2, "e": "Ortaklığa dayalı ihraçlarda sertifika sahipleri yararına VKŞ lehine rehin kurulması zorunludur."}, {"q": "Yalnız VKŞ'nin sermaye koyduğu ortaklığa dayalı kira sertifikası ihracında ortak girişim zarar ederse VKŞ zarara nasıl katlanır?", "o": ["Zararın tamamına sınırsız katlanır", "Zararın yarısına katlanır", "Zarara hiç katlanmaz", "Koyduğu sermaye ile sınırlı olarak katlanır", "Girişimci ile eşit katlanır"], "a": 3, "e": "Girişimcinin kötü niyeti veya hukuka aykırı eylemi yoksa VKŞ zarara koyduğu sermaye ile sınırlı katlanır."}, {"q": "Vadesi 500 gün olan kira sertifikası ihracında Tebliğ'de öngörülen Kurul ücreti oranı hangisidir?", "o": ["On binde 2,5", "On binde 3,5", "Binde 2", "Binde 1", "On binde 5"], "a": 4, "e": "Vadesi 365–730 gün arasında olanlar için oran on binde 5'tir; 2016 duyurusuyla %50 indirim uygulanmaktadır."}, {"q": "Aşağıdakilerden hangisi VKŞ kurucusu olamaz?", "o": ["Payları borsada işlem görmeyen ve notu olmayan halka kapalı bir anonim şirket", "İpotek finansmanı kuruluşları", "Payları borsada işlem gören GYO'lar", "Sermayesinin %51'i doğrudan Hazine ve Maliye Bakanlığına ait ortaklıklar", "Bankalar"], "a": 0, "e": "Notu olmayan, kurumsal yönetimde birinci veya ikinci grupta yer almayan halka kapalı bir şirket kurucu listesinde yer almaz."}, {"q": "Hangi VKŞ kurucuları yalnızca kendilerinin fon kullanıcısı olduğu ihraçlar için VKŞ kurabilir?", "o": ["Bankalar", "Payları borsada işlem gören GYO'lar", "İpotek finansmanı kuruluşları", "Aracı kurumlar", "Bankalar ve aracı kurumlar"], "a": 1, "e": "GYO'lar, birinci ve ikinci gruptaki halka açık ortaklıklar, yatırım yapılabilir notlu ortaklıklar ve Hazinenin %51 ortak olduğu şirketler yalnız kendi ihraçları için VKŞ kurabilir."}, {"q": "Bir kişinin VKŞ sermayesindeki payının aşağıdaki eşiklerden hangisini aşması Kurul iznine tabi değildir?", "o": ["%10", "%20", "%25", "%33", "%50"]
