<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.opts2 select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}

<script>
const S=[{"id": 1, "kisa": "İzahname ve İhraç Belgesi", "baslik": "İzahname ve İhraç Belgesi Tebliği (II-5.1)", "ozet": "Halka arzda izahname, halka arz edilmeksizin ve yurt dışı ihraçta ihraç belgesi; muafiyetler, izahname türleri, finansal tablo dönemleri, onay ve ilan süreleri ile sorumluluk rejimi.", "notlar": "<h3>Dayanak ve kapsam<\/h3>\n<ul>\n<li><b>II-5.1 sayılı İzahname ve İhraç Belgesi Tebliği<\/b>: SPKn m.4, 5, 6, 7, 11 ve 33'e dayanır; 22.06.2013 tarihli RG'de yayımlandı, yayımından <b>bir ay sonra<\/b> (22.07.2013) yürürlüğe girdi.<\/li>\n<li>Konusu: izahname ve ihraç belgesinin hazırlanması, onayı, kamuya duyurulması; ilan ve reklam esasları. Tebliğ 6 bölümdür.<\/li>\n<li>Yatırım kuruluşu varant ve sertifikalarının ihracı ve borsada işlem görmesi de bu Tebliğe <b>tabidir<\/b>.<\/li>\n<\/ul>\n<h4>Tebliğe tabi olmayanlar<\/h4>\n<ul>\n<li><b>Yatırım fonu katılma payları, emeklilik yatırım fonu payları ve değişken sermayeli yatırım ortaklığı (DSYO) payları<\/b>: bu araçları ihraç edecek kuruluşlara ilişkin Kurul düzenlemeleri uygulanır.<\/li>\n<li><b>Muaf kurumlar:<\/b> genel bütçe kapsamındaki kamu idareleri, özel bütçeli idareler ve <b>TCMB<\/b> tarafından ihraç edilen araçlar; <b>Hazine ve Maliye Bakanlığınca koşulsuz ve geri dönülemez şekilde garanti edilen<\/b> araçlar; yatırım kuruluşu varant ve sertifikaları hariç SPKn m.3/(u)'daki <b>türev araçlar<\/b>.<\/li>\n<li>Bunlar için ihtiyari izahname/ihraç belgesi hazırlansa bile Kurulca <b>onaylanmaz<\/b> ve onaylanmadığı belgede açıkça yazılır.<\/li>\n<\/ul>\n\n<h3>İzahname: tanım ve zorunluluk<\/h3>\n<ul>\n<li><b>İzahname<\/b>: ihraççının ve varsa garantörün finansal durumu, performansı, beklentileri, faaliyetleri ile aracın özellikleri, hak ve riskleri hakkında yatırımcının bilinçli değerlendirme yapmasını sağlayacak tüm bilgileri içeren kamuyu aydınlatma belgesi. İki ana unsur: <b>ihraççı (ve garantör) bilgisi<\/b> ve <b>araç bilgisi<\/b>.<\/li>\n<li><b>Halka arz<\/b> veya <b>borsada işlem görme<\/b> için izahname hazırlanması ve Kurulca onaylanması zorunludur. Halka arz edilmeksizin satışta izahname gerekmez.<\/li>\n<li><b>Halka arz<\/b>: her türlü yoldan yapılan genel çağrı ve bu çağrı devamında satış. <b>İhraç<\/b> ise halka arz edilerek veya edilmeksizin satışı kapsadığından halka arzdan <b>daha geniş<\/b>tir.<\/li>\n<li>Araca ilişkin Kurul düzenlemesi yoksa da, hak, yükümlülük, riskler ve ihraççı bilgileri izahnamede yer almak kaydıyla onay verilebilir.<\/li>\n<li><b>Usulsüz halka arz suçu (SPKn m.109/1):<\/b> onaylı izahname yayımlamadan halka arz edenlere <b>2–5 yıl hapis<\/b> ve <b>5.000–10.000 gün adli para cezası<\/b>.<\/li>\n<\/ul>\n\n<h3>İzahname hazırlamaktan muafiyet (Tebliğ m.6)<\/h3>\n<ol>\n<li><b>Yüksek tutarlı yatırımcı:<\/b> her halka arz için ayrı ayrı, yatırımcı başına en az 250.000 TL'lik araç alanlara yönelik halka arz.<\/li>\n<li><b>Yüksek nominal değer:<\/b> birim nominal değeri en az 250.000 TL olan araçların halka arzı.<\/li>\n<li><b>Nitelikli yatırımcı:<\/b> nitelikli yatırımcılara satılmak üzere ihraç edilen araçların borsada yalnız nitelikli yatırımcılar arasında işlem görmesi.<\/li>\n<li><b>Birleşme ve bölünme:<\/b> Kurulca örneği belirlenen <b>duyuru metni<\/b> ilan edilmek şartıyla; birleşme, devir, bölünme, aktifin bir kısmının ayni sermaye konması veya pay değişimi nedeniyle çıkarılan araçların borsada işlem görmesi.<\/li>\n<\/ol>\n<ul>\n<li>250.000 TL sınırı her yıl Kurul kararıyla <b>yeniden değerleme oranında<\/b> artırılabilir, Kurul Bülteni ile duyurulur. 31.12.2025 tarihli 2025/68 sayılı Bülten ile <b>2026 yılı için 9.500.000 TL<\/b>.<\/li>\n<li><b>Toplam satış bedeli muafiyeti:<\/b> payların <b>ilk halka arzı hariç<\/b>, halka arzın toplam satış bedeli Kurulca belirlenen sınırın altındaysa, standart duyuru metni ilanı şartıyla ve <b>ihraççının talebiyle<\/b> Kurul muafiyet verebilir. Sınır <b>12 aylık<\/b> ihraçların toplamıyla hesaplanır; <b>bedelsiz paylar dikkate alınmaz<\/b>. Dikkat: kitap bu sınır için aynı sayfada hem 9.500.000 TL'yi hem de 2025 yılı tutarı olarak 112.500.000 TL'yi veriyor; kaynak kendi içinde tutarsız.<\/li>\n<li><b>Borsada işlem gören niteliğe dönüştürme:<\/b> dönüştürülen payların halka arzında, nominal değerin borsada işlem gören aynı grup payların toplam nominaline oranı <b>%10'dan düşükse<\/b> (12 aylık toplam) halka arz eden izahnameden muaftır.<\/li>\n<li>Birleşme ve bölünmede bedelin tam ve nakden ödenmesi kuralının istisnası söz konusudur; alıcılar belli kişiler olduğundan halka arz yoktur.<\/li>\n<\/ul>\n\n<h3>İzahname hazırlanması gerekmeyen durumlar<\/h3>\n<ul>\n<li>Yalnız <b>nitelikli yatırımcılara satış<\/b>; <b>tahsisli satış<\/b>.<\/li>\n<li>Sermayeyi değiştirmeyen kupür, tertip, <b>pay birleştirme veya bölünmesi<\/b>.<\/li>\n<li>Duyuru metni ilanı şartıyla birleşme, devir, bölünme, ayni sermaye, pay değişimi nedeniyle araç çıkarılması.<\/li>\n<li>Kâr payının pay olarak dağıtımı dahil <b>bedelsiz pay<\/b> çıkarılması.<\/li>\n<li><b>Pay alım teklifinde<\/b> bedelin sermaye piyasası aracı olarak ödenmesi.<\/li>\n<li>İzahname önceden yayımlanmış ve paylar borsada işlem gören paylarla aynı grupta olmak kaydıyla <b>dönüştürme, değiştirme<\/b> veya hakların kullanımıyla pay ihracı.<\/li>\n<li><b>Dikkat:<\/b> Muafiyetle veya izahnamesiz çıkarılmış araçlar sonradan halka arz edilerek yeniden satılırsa izahname <b>zorunludur<\/b>. Tek istisna: birim nominali en az 250.000 TL olan araçların halka arzı.<\/li>\n<\/ul>\n\n<h3>İzahname türleri<\/h3>\n<table><tr><th>Tür<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Tek belgeden oluşan<\/td><td>İhraççı bilgisi, araç bilgisi ve özet aynı dokümanda. Birden fazla belge zorunlu olmayan her durumda kullanılabilir.<\/td><\/tr>\n<tr><td>Birden fazla belgeden oluşan<\/td><td><b>İhraççı Bilgi Dokümanı (İBD)<\/b> + <b>Sermaye Piyasası Aracı Notu (SPAN)<\/b> + <b>Özet<\/b>. İBD ile SPAN birbirini tekrar etmez. Hangi durumda zorunlu olduğu düzenlemelerde yazılıdır.<\/td><\/tr>\n<tr><td>Arz programı izahnamesi<\/td><td>Yalnız <b>bankalar<\/b>, ortaklık hakkı vermeyen araçların (YK varant ve sertifikası dahil) <b>mükerrer<\/b> ihracında, <b>ihtiyari<\/b>.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>İBD:<\/b> ihraççı ve garantörün sermayesi, yönetimi, faaliyetleri, finansal durumu, kârlılığı, sorumlu kişiler. <b>SPAN:<\/b> aracın özellikleri, hak ve riskleri, halka arz ve borsa bilgileri. <b>Özet:<\/b> ikisinden yararlanılarak kısa, açık, anlaşılır temel bilgiler.<\/li>\n<li>Halka arz sonra yapılacaksa önce İBD onaylanır; SPAN ve özet Kurula gönderilene kadar İBD'nin güncellenmesi gerekmez. Geçerli İBD'si olan ihraççı her halka arzdan önce SPAN ve özeti onaylatır; İBD'de değişiklik gerekirse o da onaya sunulur.<\/li>\n<li>Sadece İBD'si onaylanmış halka açık olmayan ihraççıdan, SPAN ve özet başvurusuna kadar, Kanundan kaynaklanan yükümlülükler istenemez.<\/li>\n<li><b>İhraç tavanı:<\/b> ortaklık hakkı vermeyen araçların birden fazla seferde halka arzında İBD veya arz programı izahnamesinde geçerlilik süresi boyunca ihraç tavanı yazılır; her tertip başvurusunda tavanın ne kadarının satıldığı belirtilir. Tavan kapsamındaki araçlar halka arz edilmeksizin de satılabilir; izahnamede belirtilmişse ayrıca ihraç belgesi gerekmez. Bu durumda İBD veya izahname onayı ihraç belgesi onayı hükmündedir ve <b>1 yıllık satış süresi ilanla başlar<\/b>.<\/li>\n<li><b>Özet<\/b>te iki uyarı zorunlu: özet izahnameye giriş olarak okunmalı ve yatırım kararı izahnamenin bütününe göre verilmeli; izahnamenin diğer kısımlarıyla okunduğunda özet yanıltıcı, hatalı veya tutarsızsa ilgililerin hukuki sorumluluğu vardır.<\/li>\n<li>Sermaye artırımında yeni pay alma hakkı bilgileri: tek belgede ilgili kısımda, birden fazla belgede <b>SPAN<\/b>'da.<\/li>\n<\/ul>\n<h4>Arz programı<\/h4>\n<ul>\n<li>Benzer türde ortaklık hakkı vermeyen araçların <b>azami 5 yıllık<\/b> süre içinde mükerrer ihracına izin veren plan.<\/li>\n<li><b>Mükerrer<\/b>: <b>12 ay içinde en az 2 kez<\/b> ihraç.<\/li>\n<li>Pay ve benzeri <b>ortaklık hakkı veren<\/b> araçlar için düzenlenemez.<\/li>\n<li>İhraççı <b>genel kurulunda ayrı gündem maddesiyle<\/b> onaylanmalı; nisaplarda <b>TTK m.418<\/b> uygulanır. İçerik: araç türü, ihraç tavanı, tahmini takvim, süre.<\/li>\n<li>Her ihraçtan önce <b>arz programı sirküleri<\/b> hazırlanır ve satıştan önce Kurulca onaylanır.<\/li>\n<li>Araçların <b>tamamı halka arz edilmeksizin<\/b> ihraç edilecekse arz programı izahnamesi hazırlanmaz; program ihraççının internet sitesinde ve KAP üyesiyse KAP'ta ilan edilir.<\/li>\n<\/ul>\n\n<h3>Hazırlama esasları<\/h3>\n<ul>\n<li>Nitelikler: ayrıntılı, Kurul standartlarına uygun, tam ve güncel, anlaşılabilir, istenen ek bilgileri içeren, gerektiğinde belgeye dayalı.<\/li>\n<li>Garanti varsa garantör ve garantinin niteliği yazılır; sorumlu gerçek kişilerin isim ve görevleri, tüzel kişilerin unvan, merkez ve iletişim bilgileri açıkça belirtilir.<\/li>\n<li><b>İmza:<\/b> ihraççı, varsa halka arz eden ve <b>yetkili kuruluş<\/b>; konsorsiyumda <b>lider ve varsa eş liderler<\/b>. Geçerlilik süresinde yetkili kuruluş değişirse belge yeni kuruluşça imzalanıp aynı şekilde ilan edilir; tekrar onaya sunulmaz, yayım yeri ticaret siciline tescil ve TTSG'de ilan edilir.<\/li>\n<li>Bağımsız denetimden veya sınırlı incelemeden geçmiş tablolara dayalı veri esastır. Denetlenmemiş veri verilecekse: denetlenmiş tablolarla tutarlı olmalı; denetlenmiş veriden <b>daha dikkat çekici sunulamaz<\/b>; terimleri ve hazırlanma esasları belirtilmeli; geçmiş, tahmini veya proforma olduğu yazılmalı; denetimden geçmediği vurgulanmalı.<\/li>\n<li>İzahname standartları Kurulca belirlenir ve internet sitesinde yayımlanır; standardı olmayan araç için en uygun standart kullanılır.<\/li>\n<li>Pay halka arzı için hazırlanmış İBD, geçerlilik süresinde borçlanma aracı halka arzında da kullanılabilir (SPAN ve özet borçlanma aracı standartlarına göre).<\/li>\n<\/ul>\n<h4>Atıf yoluyla bilgi<\/h4>\n<ul>\n<li>Daha önce Kurul, Borsa internet sitesi veya KAP'ta duyurulan <b>en güncel<\/b> bilgilere atıf yapılabilir: finansal tablolar ve denetim raporları, onaylı izahnameler, esas sözleşme, özel durum açıklamaları, birleşme ve bölünme duyuru metinleri, faaliyet raporları, kurumsal yönetim uyum raporları, derecelendirme ve değerleme raporları, bağımsız taraflarca hazırlanmış Kurulca uygun görülen diğer belgeler.<\/li>\n<li><b>Dikkat:<\/b> Özette izahname dışındaki bilgiye <b>atıf yapılamaz<\/b>; kaynakların özette dipnotla belirtilmesi atıf sayılmaz.<\/li>\n<\/ul>\n<h4>Bilgiye yer verilmemesi<\/h4>\n<ul>\n<li>Kesin fiyat, fiyat aralığı, faiz veya iskonto oranı yazılamıyorsa bunların hangi kriterlere göre belirleneceği yazılır.<\/li>\n<li>Kurul, ihraççının talebiyle bilginin yer almamasına izin verebilir: açıklanması <b>kamu yararına aykırı<\/b> ise; bilinçli değerlendirmeyi engellememek kaydıyla ihraççıyı <b>önemli zarara<\/b> uğratacaksa; bilgi <b>önemsiz<\/b>, ulaşmak maliyetli ve güçse ve mali durumu etkilemiyorsa.<\/li>\n<\/ul>\n\n<h3>İzahnamede yer alacak finansal tablolar<\/h3>\n<ul>\n<li><b>Ortaklık hakkı veren<\/b> araçlar: denetimden geçmiş <b>son 3 yıl<\/b> + varsa ara dönem. <b>Ortaklık hakkı vermeyen<\/b> araçlar (YK varant ve sertifikası dahil): <b>son 2 yıl<\/b> + varsa ara dönem.<\/li>\n<li>Tabloları KAP'ta düzenli yayımlama yükümlülüğü olan ihraççı tabloları izahnameye koymak zorunda değildir; ilan bilgisi ve tarihi yazılır.<\/li>\n<li>Bankalar, varlık yönetim şirketleri (5411), sigorta şirketleri (5684) ve finansal kiralama, faktoring, finansman ve tasarruf finansman şirketleri (6361) kendi özel düzenlemelerine göre hazırlanan tablo ve denetim raporlarını kullanır.<\/li>\n<li>Birleşme veya bölünmeyle kurulanlarda ortaklığın <b>kuruluş tarihi<\/b> esas alınır.<\/li>\n<li>Satış döneminin tespitinde satışa sunulan <b>ilk gün<\/b> esas; paylarda varsa <b>yeni pay alma hakkı kullanımının başladığı tarih<\/b>.<\/li>\n<\/ul>\n<table><tr><th>Satış dönemi<\/th><th>Halka açık olmayan ortaklık, ilk halka arz (özel bağımsız denetim)<\/th><\/tr>\n<tr><td>1 Ocak – 15 Şubat<\/td><td>Son 3 yıl (veya önceki 3 yıl) + 9 aylık ara dönem<\/td><\/tr>\n<tr><td>16 Şubat – 15 Mayıs<\/td><td>Son 3 yıl<\/td><\/tr>\n<tr><td>16 Mayıs – 15 Ağustos<\/td><td>Son 3 yıl + 3 aylık<\/td><\/tr>\n<tr><td>16 Ağustos – 15 Kasım<\/td><td>Son 3 yıl + 6 aylık<\/td><\/tr>\n<tr><td>16 Kasım – 31 Aralık<\/td><td>Son 3 yıl + 9 aylık<\/td><\/tr>\n<\/table>\n<table><tr><th>Satış dönemi<\/th><th>Ortaklık hakkı veren (ilk halka arz dışı)<\/th><th>Ortaklık hakkı vermeyen<\/th><\/tr>\n<tr><td>1 Ocak – 15 Şubat<\/td><td>Son 3 yıl (veya önceki 3 yıl) + 6 aylık<\/td><td>Son 2 yıl (veya önceki 2 yıl) + 6 aylık<\/td><\/tr>\n<tr><td>16 Şubat – 15 Ağustos<\/td><td>Son 3 yıl<\/td><td>Son 2 yıl<\/td><\/tr>\n<tr><td>16 Ağustos – 31 Aralık<\/td><td>Son 3 yıl + 6 aylık<\/td><td>Son 2 yıl + 6 aylık<\/td><\/tr>\n<\/table>\n<ul>\n<li>Satış, dönem bitişinden itibaren <b>15 günü geçmeden<\/b> sonraki döneme denk gelirse sonraki dönemin denetlenmiş tabloları izahnameye <b>ek<\/b> olarak verilir; içeriğin güncellenmesi zorunlu değildir.<\/li>\n<li>Zorunlu olmayan ara dönem tablolar hazırlanıp denetlenmişse ihtiyari olarak konabilir. Dönemler 1 Ocak–31 Aralık hesap dönemine göredir; özel hesap dönemlilerde uyarlanır.<\/li>\n<li><b>İlk halka arzda<\/b> borsada işlem başlangıcı itibarıyla açıklama tarihi geçmiş ama izahnamede olmayan ara dönem tablolar, faaliyet raporu ve sorumluluk beyanları, işlem başlangıcını izleyen <b>3. haftanın son işlem günü<\/b> sonuna kadar KAP'a gönderilir.<\/li>\n<li>İBD önceden onaylanmışsa ilk halka arzdan önce yeni tablo zorunlu hale gelirse İBD güncellenir; sonraki halka arzlarda yeni tablolar KAP'ta ilan edilmişse güncelleme gerekmez.<\/li>\n<li>Kurul kararı (08.02.2024, 9/221): 2024 yılı için 1 Ocak–15 Şubat dönemi <b>1 Mart 2024<\/b>'e uzatıldı. Enflasyon muhasebesi: izahnamelerde 31.12.2023 yıllık tablolarından başlayarak enflasyon muhasebesi uygulanmış tablolar yer alır.<\/li>\n<\/ul>\n\n<h3>Değişiklik, geçerlilik, tescil ve ilan<\/h3>\n<ul>\n<li>Satıştan önce veya satış süresinde yatırım kararını etkileyecek değişiklik ya da yeni husus çıkarsa ihraççı veya halka arz eden <b>derhal yazılı<\/b> olarak Kurula bildirir. Satış süreci ihraççı, halka arz eden veya yetkili kuruluşlarca durdurulabilir; durdurulmazsa Kurul durdurabilir.<\/li>\n<li>Değişen kısımlar bildirimden itibaren <b>7 iş günü<\/b> içinde Kurulca onaylanır ve derhal ilan edilir; eski ve yeni hâl karşılaştırması ile tek metin hâli de yayımlanır. Özet de değişirse değişen kısım daha dikkat çekici sunulur.<\/li>\n<li>Değişiklikten önce talepte bulunanlar ek ve değişikliklerin yayımından itibaren <b>2 iş günü<\/b> içinde taleplerini geri alabilir; bu süre izahnamede yazılarak uzatılabilir.<\/li>\n<li><b>Geçerlilik:<\/b> güncelliği korunmak kaydıyla ilk yayım tarihinden itibaren <b>12 ay<\/b>. Sonra izahnamenin tümü yeniden onaylanmalı. Birden fazla belgede süre <b>İBD'nin ilk yayımıyla<\/b> başlar; SPAN ve özetin geçerliliği İBD'ninkini geçemez. Arz programı izahnamesi için aynı esaslar geçerlidir. İBD'de değişiklik gerekmiyorsa Kurula yazılı beyan verilir.<\/li>\n<li><b>Taslak ilanı:<\/b> Onaya sunulan izahname Kurula başvurudan itibaren <b>5 iş günü<\/b> içinde ihraççının internet sitesinde, KAP üyesiyse KAP'ta ve varsa yetkili kuruluşun sitesinde ilan edilir; başında henüz onaylanmadığı açıkça yazılır.<\/li>\n<li><b>Onaylı izahnamenin ilan yerleri:<\/b> ihraççının internet sitesi, KAP (üyeyse), varsa yetkili kuruluşun sitesi; basın yayın organları <b>ihtiyari<\/b>. Kurul yurt dışı dahil başka yerlerde ilanı zorunlu tutabilir.<\/li>\n<li>Geçerlilik tarihi: KAP üyesiyse <b>KAP'ta ilan<\/b> tarihi, değilse internet sitesinde ilan tarihi.<\/li>\n<li>Siteye konan izahname onaylandığı şekliyle <b>asgari 5 yıl<\/b> korunur; vadeli araçlarda bu yükümlülük aracın vadesiyle sınırlıdır.<\/li>\n<li>KAP ilanı ile <b>eş zamanlı<\/b> ilan: kira sertifikasında kaynak kuruluş veya varlık kiralama şirketinin, VDMK'da fon kurucusunun, piyasa yapıcılı araçlarda piyasa yapıcısının sitesinde.<\/li>\n<li>İzahnamenin nerede yayımlandığı ilandan itibaren <b>10 iş günü<\/b> içinde ticaret siciline tescil ve TTSG'de ilan edilir. <b>Dikkat:<\/b> satışa başlamak için bu tescil şart değildir.<\/li>\n<li>Elektronik yayımda talep eden yatırımcıya basılı nüsha <b>bedelsiz<\/b> verilir.<\/li>\n<li>Borsada işlem görmesi zorunlu araçlarda Kurula izahname başvurusuyla birlikte borsaya da başvurulur (örneğin borçlanma araçları için Kesin Alım Satım Pazarı).<\/li>\n<\/ul>\n\n<h3>İhraç belgesi<\/h3>\n<ul>\n<li><b>Zorunlu olduğu haller:<\/b> halka arz edilmeksizin ihraç; yurt dışında ihraç; duyuru metni hazırlananlar hariç izahnamesiz her türlü ihraç.<\/li>\n<li><b>Tertip ihraç belgesi:<\/b> onaylı ihraç belgesi kapsamında farklı zamanlarda satılan kısma (tertip) ilişkin nitelik ve satış şartlarını içeren belge.<\/li>\n<li>Kurulca açıklanmış standartlar arasında borçlanma aracı, VDMK, VDMK tertip, teminatlı menkul kıymet, YK varantı ve sertifikası ile tertip, borsa ve borsa dışı şirketlerin bedelsiz sermaye artırımı ihraç belgeleri vardır.<\/li>\n<li>Ortaklık hakkı vermeyen araçlar yurt içinde halka arz edilmeksizin satılacaksa veya yurt dışında ihraç edilecekse önce <b>1 yıl<\/b> içinde satılması planlanan tutarı kapsayan, ihraç tavanlı ihraç belgesi onaylatılır.<\/li>\n<li><b>Geçerlilik: Kurul karar tarihinden itibaren 1 yıl.<\/b> (İzahnamede 12 ay ilk yayım tarihinden başlar; karıştırma.)<\/li>\n<li><b>Yurt içi, halka arz edilmeksizin:<\/b> her tertip için ayrı tertip ihraç belgesi hazırlanıp satıştan önce onaylanır; ancak düzenlemelerde öngörülmüşse Kurula ayrıca başvurulmaz, her tertipten önce <b>MKK<\/b>'ya başvurulup Kurul ücreti dekontu ibraz edilir ve satış tamamlanır.<\/li>\n<li><b>Yurt dışı:<\/b> her tertip için ayrı tertip ihraç belgesi, satıştan önce Kurul onayı. Aynı anda satılan farklı özellikteki her araç için ayrı tertip ihraç belgesi.<\/li>\n<li><b>İlan:<\/b> ihraç belgesi ve tertip ihraç belgesi <b>ticaret siciline tescil edilmez<\/b>; teslim alınmasından itibaren <b>15 iş günü<\/b> içinde ihraççının sitesinde, KAP'ta (üyeyse) ve varsa yetkili kuruluşun sitesinde ilan edilir; basın ihtiyari.<\/li>\n<\/ul>\n\n<h3>Tasarruf sahiplerine satış duyurusu<\/h3>\n<ul>\n<li>Sermaye artırımı ve mevcut payların satışıyla halka açılacak ortaklıklar ile halka açık ortaklıkların artırımlarında, yeni pay alma hakkı sonrası kalan payların veya hak kullandırılmıyorsa halka arz edilecek payların satışı için hazırlanır ve Kurulca onaylanır.<\/li>\n<li><b>İstisna:<\/b> Halka açık ortaklığın artırımında hak kullanımı sonrası kalan payların nominali <b>150.000 TL<\/b>'nin veya satışa sunulan payların nominalinin <b>%1<\/b>'inin altındaysa, Kurul onayı alınmadan özel durum açıklamasıyla yetinilebilir.<\/li>\n<li>İlan: yeni pay alma süresinin bitiminden veya hak kullandırılmıyorsa izahnamenin ilanından sonra <b>aynı gün<\/b>; yerler izahnameyle aynı. Değişikliklerde izahname değişiklik hükümleri uygulanır.<\/li>\n<\/ul>\n\n<h3>Onay süreci<\/h3>\n<ul>\n<li>İnceleme süresi: eksiksiz başvurudan itibaren <b>10 iş günü<\/b>; <b>payların ilk halka arzında 20 iş günü<\/b>.<\/li>\n<li>Eksik bilgi veya belge varsa başvurudan itibaren 10 iş günü içinde bildirilir ve <b>20 iş günü<\/b> içinde giderilmesi istenir; süreler eksikler tamamlanınca <b>baştan başlar<\/b>. Makul sebeple talep üzerine <b>20 iş gününe kadar<\/b> ek süre verilebilir.<\/li>\n<li>Başvuru basılı ve elektronik ortamda yapılır; aynı olduklarına dair yazılı beyan verilir.<\/li>\n<li><b>İşlemden kaldırma:<\/b> yeterli incelemeye imkân vermeyecek derecede eksik hazırlanma; gerekli bilgi ve belgelerin hiç veya eksik iletilmemesi; eksiklerin verilen sürede tamamlanmaması.<\/li>\n<li><b>Dikkat:<\/b> Sürelerde karar alınmaması onay ya da ret anlamına <b>gelmez<\/b>.<\/li>\n<li>Onay: bilgiler tutarlı, anlaşılabilir ve standartlara göre eksiksizse verilir; Kurul ilave bilgi isteyebilir. Onay, bilgilerin doğruluğunun Kurulca <b>tekeffülü değildir<\/b>, reklam amacıyla kullanılamaz, tavsiye sayılmaz; aksi kanaati uyandıran ifade kullanılamaz.<\/li>\n<li>Onaydan sonra <b>20 iş günü<\/b> içinde teslim alınmazsa veya teslimden sonra <b>15 iş günü<\/b> içinde ilan edilmezse yeniden onay gerekir.<\/li>\n<li>Olumsuz karar gerekçesiyle yazılı bildirilir.<\/li>\n<\/ul>\n\n<h3>Sorumluluk<\/h3>\n<ul>\n<li>SPKn <b>m.10<\/b> izahnameden sorumlular, <b>m.32<\/b> kamuyu aydınlatma belgelerinden sorumluluk, <b>m.63<\/b> bağımsız denetim, derecelendirme ve değerleme kuruluşlarının sorumluluğu.<\/li>\n<li>İzahnamedeki yanlış, yanıltıcı, eksik bilgiden doğan zarardan önce <b>ihraççı<\/b> sorumludur. Zarar ihraççıdan tazmin edilemez veya edilemeyeceği açıksa <b>halka arz edenler, lider yetkili kuruluşlar, varsa garantör ve ihraççının yönetim kurulu üyeleri<\/b> kusurlarına ve durumun gereklerine göre zararlar kendilerine yükletilebildiği ölçüde sorumludur.<\/li>\n<li>Yalnız özete dayanarak sorumluluk yüklenemez; özetin diğer kısımlarla okunduğunda yanıltıcı, hatalı veya tutarsız olması hali hariç.<\/li>\n<li>m.32: belgeleri imzalayanlar ve adına imzalanan tüzel kişiler <b>müteselsilen<\/b> sorumludur. Bilgisi olmadığını ve eksikliğin kast veya ağır ihmalinden kaynaklanmadığını ispatlayan sorumlu olmaz. Sorumluluğu hafifleten veya kaldıran anlaşmalar <b>geçersizdir<\/b>.<\/li>\n<li><b>İlliyet bağı karinesi:<\/b> izahnamenin geçerlilik süresi boyunca (diğer belgelerde açıklamadan hemen sonra) alınan veya satılan araçlar gerçek bilgi ortaya çıktıktan hemen sonra borsada satılır veya alınır ve zarar doğarsa illiyet bağı kurulmuş sayılır.<\/li>\n<li>İhraççı, halka arz eden ve yetkili kuruluşlar yapay piyasa yaratılmaması için önlem almaktan; içsel bilgiye erişenler bilginin izahnameyle açıklanmasına kadar gizliliğinden sorumludur.<\/li>\n<li>Bağımsız denetim kuruluşları görev kapsamıyla sınırlı olarak raporu imzalayanlarla birlikte sorumludur.<\/li>\n<\/ul>\n\n<h3>Tanıtım ve reklam<\/h3>\n<ul>\n<li>Sözlü beyanlar dahil tanıtım ve reklamlar yanlış, yanıltıcı, temelsiz, abartılı veya eksik olamaz; izahnameyle tutarlı olmalıdır.<\/li>\n<li>Fiyata yer verilirse fiyatın belirlenmesinde <b>Kurulun veya borsanın takdir ya da onayının bulunmadığı<\/b> vurgulanır; metinler reklam olduğu kolayca anlaşılacak şekilde oluşturulur.<\/li>\n<li>Yatırım kararının izahnamenin incelenmesiyle verilmesi gerektiği uyarısı <b>zorunludur<\/b>.<\/li>\n<li>Başvurudan sonra ama izahname yayımından önce reklam yalnızca <b>sektör, sektördeki konum, faaliyet konusu ve mal ya da hizmetler<\/b> hakkında olabilir; izahnamenin henüz onaylanmadığı veya nerede ilan edileceği uyarısı konur. Yayımdan sonra izahnamenin temin yerleri ve KAP dahil ilan edildiği siteler belirtilir.<\/li>\n<li>Yalnız nitelikli yatırımcılara satışta nitelikli yatırımcı tanımı ve satışın yalnız onlara yapılacağı belirtilir.<\/li>\n<li>Yurt dışı dahil belirli yatırımcı grubuna verilen bilgiler izahnamede de yer almalı; bilgi eşitsizliği yaratılamaz.<\/li>\n<\/ul>", "sorular": [{"q": "İzahname ve İhraç Belgesi Tebliği'ne göre aşağıdaki araçlardan hangisinin ihracı Tebliğ hükümlerine tabidir?", "o": ["Yatırım kuruluşu varantları", "Emeklilik yatırım fonu payları", "Yatırım fonu katılma payları", "TCMB tarafından ihraç edilen araçlar", "Değişken sermayeli yatırım ortaklığı payları"], "a": 0, "e": "Yatırım kuruluşu varant ve sertifikaları açıkça Tebliğe tabidir. Fon payları, DSYO payları ve TCMB ihraçları kapsam dışındadır."}, {"q": "Onaylı izahname yayımlamaksızın sermaye piyasası aracını halka arz eden kişiye SPKn m.109 uyarınca öngörülen hapis cezası hangisidir?", "o": ["6 aydan 2 yıla kadar", "2 yıldan 5 yıla kadar", "1 yıldan 3 yıla kadar", "3 yıldan 8 yıla kadar", "5 yıldan 10 yıla kadar"], "a": 1, "e": "Usulsüz halka arz suçunun cezası 2–5 yıl hapis ve 5.000–10.000 gün adli para cezasıdır."}, {"q": "Aşağıdakilerden hangisi izahname hazırlama yükümlülüğünden muafiyet hallerinden biri değildir?", "o": ["Yatırımcı başına belirlenen asgari tutarın üzerinde araç alanlara yönelik halka arz", "Birim nominal değeri belirlenen asgari tutarın üzerinde olan araçların halka arzı", "Payların ilk halka arzında toplam satış bedelinin düşük olması", "Duyuru metni ilanı şartıyla birleşme nedeniyle çıkarılan payların borsada işlem görmesi", "Nitelikli yatırımcılara satılan araçların borsada yalnız nitelikli yatırımcılar arasında işlem görmesi"], "a": 2, "e": "Toplam satış bedeline dayalı muafiyet payların ilk halka arzında uygulanmaz."}, {"q": "Tebliğde 250.000 TL olarak belirlenen izahname muafiyet tutarı, 31.12.2025 tarihli ve 2025/68 sayılı Kurul Bülteni ile 2026 yılı için kaç TL olarak belirlenmiştir?", "o": ["1.000.000 TL", "4.750.000 TL", "12.500.000 TL", "9.500.000 TL", "112.500.000 TL"], "a": 3, "e": "Kitaba göre 250.000 TL'lik sınır yeniden değerleme ile güncellenmiş ve 2026 yılı için 9.500.000 TL olarak açıklanmıştır."}, {"q": "Borsada işlem gören niteliğe dönüştürülen payların halka arzında izahname muafiyeti için, bu payların nominalinin aynı gruptaki borsada işlem gören payların toplam nominaline oranı 12 aylık dönemde hangi sınırın altında olmalıdır?", "o": ["%1", "%5", "%25", "%20", "%10"], "a": 4, "e": "Oran %10'dan düşükse halka arz eden izahname hazırlamaktan muaftır."}, {"q": "Birden fazla belgeden oluşan izahnamenin bileşenleri hangi seçenekte doğru verilmiştir?", "o": ["İhraççı bilgi dokümanı, sermaye piyasası aracı notu, özet", "İhraç belgesi, tertip ihraç belgesi, özet", "Arz programı sirküleri, ihraççı bilgi dokümanı, duyuru metni", "Fiyat tespit raporu, sermaye piyasası aracı notu, özet", "İhraççı bilgi dokümanı, tasarruf sahiplerine satış duyurusu, özet"], "a": 0, "e": "Birden fazla belgeden oluşan izahname İBD, SPAN ve özetten oluşur."}, {"q": "Arz programı izahnamesi ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Bankalar tarafından ihtiyari olarak hazırlanabilir", "Pay gibi ortaklık hakkı veren araçlar için de düzenlenebilir", "Mükerrer ihraç, 12 ay içinde en az 2 kez ihraç anlamına gelir", "Arz programı azami 5 yıllık süreyi kapsar", "İhraççı genel kurulunda ayrı gündem maddesiyle onaylanmalıdır"], "a": 1, "e": "Arz programı izahnamesi yalnızca ortaklık hakkı vermeyen araçlar için düzenlenebilir."}, {"q": "Arz programının genel kurulda onaylanmasında toplantı ve karar nisapları için hangi hüküm uygulanır?", "o": ["SPKn m.29", "TTK m.421", "TTK m.418", "SPKn m.18", "TTK m.479"], "a": 2, "e": "Arz programını onaylayacak genel kurul nisaplarında TTK m.418 uygulanır."}, {"q": "Ortaklık hakkı vermeyen bir aracın 20 Mart'ta başlayacak halka arzında izahnamede hangi finansal tablolar yer almalıdır?", "o": ["Son 3 yıllık tablolar", "Son 2 yıllık tablolar ve 6 aylık ara dönem", "Son 3 yıllık tablolar ve 3 aylık ara dönem", "Son 2 yıllık tablolar", "Son 1 yıllık tablolar"], "a": 3, "e": "Ortaklık hakkı vermeyen araçlarda 16 Şubat–15 Ağustos döneminde son 2 yıllık tablolar yeterlidir."}, {"q": "Halka açık olmayan bir ortaklığın paylarının 1 Haziran'da başlayacak ilk halka arzında izahnamede hangi tablolar bulunmalıdır?", "o": ["Son 3 yıllık tablolar", "Son 2 yıllık ve 3 aylık ara dönem tablolar", "Son 3 yıllık ve 6 aylık ara dönem tablolar", "Son 3 yıllık ve 9 aylık ara dönem tablolar", "Son 3 yıllık ve 3 aylık ara dönem tablolar"], "a": 4, "e": "İlk halka arzda 16 Mayıs–15 Ağustos döneminde son 3 yıl ve 3 aylık ara dönem tablolar gerekir."}, {"q": "İzahnamede yapılan değişikliklerin yayımlanmasından önce talepte bulunmuş yatırımcılar, değişikliklerin yayımından itibaren en az kaç iş günü içinde taleplerini geri alabilir?", "o": ["2 iş günü", "1 iş günü", "3 iş günü", "5 iş günü", "7 iş günü"], "a": 0, "e": "Geri alma süresi 2 iş günüdür; izahnamede belirtilerek uzatılabilir."}, {"q": "İzahnamenin değişen kısımları Kurula bildirim tarihinden itibaren kaç iş günü içinde onaylanır?", "o": ["2 iş günü", "7 iş günü", "5 iş günü", "10 iş günü", "15 iş günü"], "a": 1, "e": "Değişiklikler bildirimden itibaren 7 iş günü içinde Kurulca onaylanır ve derhal ilan edilir."}, {"q": "Onay için Kurula sunulan izahname taslağı, başvuru tarihinden itibaren kaç iş günü içinde ilan edilmelidir?", "o": ["Aynı gün", "2 iş günü", "5 iş günü", "10 iş günü", "15 iş günü"], "a": 2, "e": "Taslak izahname başvurudan itibaren 5 iş günü içinde, onaylanmadığı ibaresiyle ilan edilir."}, {"q": "İzahnamenin nerede yayımlandığı hususunun ticaret siciline tescili ile ilgili hangisi doğrudur?", "o": ["İlandan itibaren 5 iş günü içinde yapılır ve satış için şarttır", "Onaydan itibaren 20 iş günü içinde yapılır", "İlandan itibaren 15 iş günü içinde yapılır ve satış için şarttır", "İlandan itibaren 10 iş günü içinde yapılır, ancak satışa başlamak için şart değildir", "Hiçbir durumda tescil gerekmez"], "a": 3, "e": "Yayım yeri 10 iş günü içinde tescil ve TTSG'de ilan edilir; satışa başlamak için tescil gerekmez."}, {"q": "Onaylı izahnamenin (12 ay) ve ortaklık hakkı vermeyen araçlar için hazırlanan ihraç tavanlı ihraç belgesinin (1 yıl) geçerlilik süreleri sırasıyla hangi tarihten itibaren başlar?", "o": ["Kurul karar tarihi – ilk yayım tarihi", "Teslim tarihi – KAP ilan tarihi", "Başvuru tarihi – Kurul karar tarihi", "Ticaret siciline tescil tarihi – teslim tarihi", "İlk yayım tarihi – Kurul karar tarihi"], "a": 4, "e": "İzahname güncelliğini korumak kaydıyla ilk yayım tarihinden itibaren 12 ay; ihraç tavanlı ihraç belgesi ise onayına karar verilen Kurul karar tarihinden itibaren 1 yıl geçerlidir."}, {"q": "Kurulca onaylanmış ihraç belgesi ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Teslimden itibaren 15 iş günü içinde ihraççının sitesinde ve üyeyse KAP'ta ilan edilir", "Ticaret siciline tescil edilir ve TTSG'de ilan edilir", "Yalnızca basın yayın organlarında ilan edilir", "Teslimden itibaren 5 iş günü içinde ilan edilir", "İlan edilmesine gerek yoktur"], "a": 0, "e": "İhraç belgesi tescil edilmez; teslimden itibaren 15 iş günü içinde ilan edilir."}, {"q": "Halka açık bir ortaklığın sermaye artırımında hak kullanımından sonra kalan payların nominali hangi durumda Kurul onayı olmadan, özel durum açıklamasıyla yetinilerek tasarruf sahiplerine satış duyurusu yayımlanmayabilir?", "o": ["500.000 TL'nin veya %5'in altında", "150.000 TL'nin veya %1'in altında", "250.000 TL'nin veya %10'un altında", "1.000.000 TL'nin veya %2'nin altında", "100.000 TL'nin veya %3'ün altında"], "a": 1, "e": "Kalan payların nominali 150.000 TL'nin veya satışa sunulanların %1'inin altındaysa bu istisna uygulanır."}, {"q": "Payların ilk defa halka arzında izahname onay başvurusunun Kurulca inceleme süresi kaç iş günüdür?", "o": ["5 iş günü", "7 iş günü", "20 iş günü", "15 iş günü", "10 iş günü"], "a": 2, "e": "Genel süre 10 iş günü olmakla birlikte payların ilk halka arzında 20 iş günüdür."}, {"q": "Kurulca onaylanan izahnamenin onay tarihini izleyen kaç iş günü içinde teslim alınmaması halinde yeniden onay gerekir?", "o": ["5 iş günü", "10 iş günü", "15 iş günü", "20 iş günü", "30 iş günü"], "a": 3, "e": "20 iş günü içinde teslim alınmazsa veya teslimden sonra 15 iş günü içinde ilan edilmezse yeniden onay gerekir."}, {"q": "Kurulun mevzuattaki süreler içinde izahname başvurusu hakkında karar almamasının sonucu nedir?", "o": ["İzahname onaylanmış sayılır", "Başvuru reddedilmiş sayılır", "Başvuru işlemden kaldırılır", "Başvuru sahibi doğrudan satışa başlayabilir", "Onaylandığı veya onaylanmadığı anlamına gelmez"], "a": 4, "e": "Sürede karar alınmaması onay veya ret anlamına gelmez."}, {"q": "İzahnameye atıfta bulunulması ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Özette izahname dışındaki bilgilere atıf yapılabilir", "Atıf yapılan bilgi en güncel bilgi olmalıdır", "Faaliyet raporlarına atıf yapılabilir", "Daha önce KAP'ta duyurulan bilgilere atıf yapılabilir", "Bilginin kaynağı ve nasıl ulaşılacağı izahnamede belirtilmelidir"], "a": 0, "e": "Özette izahnamede yer alan bilgiler dışındaki bilgilere atıf yapılamaz."}, {"q": "SPKn m.32'ye göre kamuyu aydınlatma belgelerinden doğan sorumlulukla ilgili hangisi yanlıştır?", "o": ["Belgeleri imzalayanlar müteselsilen sorumludur", "Sorumluluğu hafifleten anlaşmalar geçerlidir", "Bilgisi olmadığını ve eksikliğin kast veya ağır ihmalinden kaynaklanmadığını ispatlayan sorumlu olmaz", "Belirli koşullarda belge ile zarar arasında illiyet bağı kurulmuş sayılır", "Belgeler adına imzalanan tüzel kişiler de sorumludur"], "a": 1, "e": "Sorumluluğu hafifleten veya kaldıran anlaşma, hüküm ve ifadeler geçersizdir."}, {"q": "İzahname başvurusundan sonra ancak izahnamenin yayımından önce yapılacak reklamlar hangi konuyla sınırlıdır?", "o": ["Halka arz fiyatı ve tahsisat oranları", "Beklenen temettü verimi", "İhraççının sektörü, sektördeki konumu, faaliyet konusu ve ürettiği mal ve hizmetler", "Talep toplama sonuçları", "Aracın getiri tahmini"], "a": 2, "e": "Bu dönemde reklamlar yalnız sektör, sektördeki konum, faaliyet konusu ve mal veya hizmetlerle ilgili olabilir."}]}, {"id": 2, "kisa": "SPA Satışı", "baslik": "Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)", "ozet": "Satış şekilleri, talep toplama ve borsada satış yöntemleri, satışa başlama ve satış süreleri, tahsisat ve dağıtım esasları, ilk halka arzlara ilişkin 2024 İlke Kararı ve halka arzda teşvikler.", "notlar": "<h3>Dayanak ve kapsam<\/h3>\n<ul>\n<li><b>II-5.2 sayılı Sermaye Piyasası Araçlarının Satışı Tebliği<\/b>: SPKn <b>m.5<\/b>'e dayanır; 28 Haziran 2013 tarihli RG'de yayımlandı, <b>bir ay sonra<\/b> (28 Temmuz 2013) yürürlüğe girdi. 6 bölümdür.<\/li>\n<li>Tebliğdeki tutarlar her yıl Hazine ve Maliye Bakanlığının ilan ettiği <b>yeniden değerleme katsayısı<\/b> dikkate alınarak Kurulca yeniden belirlenir ve Kurul Bülteni ile ilan edilir; Kurul yeniden değerlememe kararı da verebilir. 2026 tutarları 31.12.2025 tarihli 2025/68 sayılı Bülten ile açıklandı.<\/li>\n<li>Kapsam: fiyat, satış şekilleri ve yöntemleri, dağıtım ve teslim, halka arzda teşvikler ve özellikli durumlar.<\/li>\n<li><b>Kapsam dışı:<\/b> yatırım fonu ve emeklilik yatırım fonu katılma payları, DSYO payları; <b>halka açık olmayan<\/b> ortaklıkların mevcut paylarının veya artırımla çıkarılacak paylarının halka arz edilmeksizin satışı.<\/li>\n<li>Fiyat, satış ve dağıtım esasları ihraççı ve/veya halka arz eden tarafından veya bunların yazılı onayıyla yetkili kuruluş ya da konsorsiyum lideri veya eş liderce belirlenir.<\/li>\n<\/ul>\n<h4>Temel tanımlar<\/h4>\n<ul>\n<li><b>İhraççı:<\/b> aracı ihraç eden, ihraç için başvuran veya araçları halka arz edilen <b>tüzel kişi<\/b>.<\/li>\n<li><b>Halka arz eden:<\/b> sahip olduğu araçları halka arz etmek için başvuran <b>gerçek veya tüzel kişi<\/b> (örnek: mevcut paylarını satan ortaklar).<\/li>\n<li><b>Yetkili kuruluş:<\/b> halka arzda satışa aracılık etmek üzere yetkilendirilmiş aracı kurumlar ile yatırım ve kalkınma bankaları.<\/li>\n<li><b>Nitelikli yatırımcı:<\/b> yatırım kuruluşları düzenlemelerinde tanımlanan, talebe dayalı profesyonel kabul edilenler dahil <b>profesyonel müşteriler<\/b>.<\/li>\n<\/ul>\n\n<h3>Satış şekilleri<\/h3>\n<p>Halka arz yoluyla satış ve halka arz edilmeksizin satış (nitelikli yatırımcıya satış, tahsisli satış). Aksine hüküm yoksa birlikte kullanılabilir.<\/p>\n<h4>Halka arz yoluyla satış<\/h4>\n<ul>\n<li>Yatırımcı bedeli ihraç belgelerinde belirtilen sürede ilgili banka hesabına yatırır ve varsa talep formunu imzalar; güvenlik önlemi varsa form elektronik doldurulabilir.<\/li>\n<li><b>Kurumsal yatırımcılar<\/b>, ödenmeme riski yetkili kuruluşça üstlenilirse bedeli talep toplama süresinin bitiminden <b>sonra<\/b> da ödeyebilir.<\/li>\n<li><b>Blokaj yoluyla talep:<\/b> BIST 30 endeksindeki paylar, para piyasası fonları, kısa vadeli tahvil ve bono fonları, kamu borçlanma araçları, döviz, mevduat, borsada işlem gören özel sektör borçlanma araçları, kira sertifikaları ve Kurulca uygun görülen yüksek likiditeli varlıklar. Blokaj karşılığı ne kadar talep yapılabileceği izahnamede yazılır. Zararlardan yetkili kuruluş ile ihraççı ve/veya halka arz eden sorumludur.<\/li>\n<li>Kurul gerekçe göstererek satışın geçici veya sürekli durdurulmasına karar verirse satış <b>derhal<\/b> durdurulur (sebepler sınırlı sayılmamıştır).<\/li>\n<li><b>ISIN:<\/b> vade bitişi aynı gün olsa bile ihraç tarihindeki vadesi, faiz veya iskonto oranı ya da kullanılan ihraç tavanı farklı araçlara <b>aynı ISIN verilemez<\/b>.<\/li>\n<li>Özelleştirme kapsamındaki ortaklıkların halka arzında Kurul uygun görürse farklı süre ve ödeme esasları uygulanabilir.<\/li>\n<\/ul>\n<h4>Halka arz edilmeksizin satış<\/h4>\n<ul>\n<li><b>Tahsisli satış:<\/b> doğrudan yurt dışında ve/veya yurt içinde yerleşik kişilere borsa dışında tahsisli ya da borsada toptan satış.<\/li>\n<li>Yurt içinde halka arz edilmeksizin satışta içeriği Kurulca belirlenen beyan satıştan önce yatırımcıya imzalatılır. Tahsisli satış beyanı: riskler ve yatırımcının bunları anlayıp kabul ettiği. Nitelikli yatırımcı beyanı: ayrıca nitelikli yatırımcı olduğu.<\/li>\n<li>MKK nezdinde nitelikli yatırımcı olarak kaydı tutulanlardan beyan alınmaz; MKK üyesi kurum işlemden önce kaydı kontrol eder. Beyan yükümlülüğü <b>her tahsisli satış için ayrı<\/b>dır.<\/li>\n<li>Beyanlar alındığı tarihten itibaren <b>5 yıl<\/b> saklanır.<\/li>\n<li>Tahsisli satılan araçlar kural olarak <b>borsada işlem görmez<\/b> (borsada işlem gören nitelikte oluşturulan veya dönüştürülen artırım payları hariç; bunlar yatırımcı sayısı sınırı olmadan işlem görebilir).<\/li>\n<li><b>Yatırımcı sayısı:<\/b> belirli bir anda elinde bulunduranların sayısı <b>150<\/b>'yi geçmemeli (payların ikincil piyasa işlemleri hariç). Kontrol ISIN bazında, vade boyunca <b>günlük<\/b>; müşterek hesap sahipleri ayrı ayrı sayılır, yalnız gün sonu bakiyeli hesaplar dikkate alınır. Nitelikli yatırımcılar da alabilir ama <b>150 hesabında sayılmaz<\/b>.<\/li>\n<li>150 aşılırsa <b>MKK<\/b> derhal ihraççıya ve Kurula bildirir; ihraççı bildirimden itibaren <b>20 iş günü<\/b> içinde izahname onayı için Kurula ve aynı sürede borsaya başvurur.<\/li>\n<li><b>Nitelikli yatırımcıya satış:<\/b> yalnız bunlara çağrı yapılarak veya önceden belirlenerek; <b>yatırımcı sayısı sınırı yok<\/b>. Tüm tekli hesaplar nitelikli sayılır; müşterek hesapta <b>tüm<\/b> hesap sahipleri nitelikli olmalıdır.<\/li>\n<li>Nitelikli yatırımcı bilgisi beyan üzerine MKK üyesi kurumca <b>MKS<\/b>'ye kaydedilir; tek bir üyenin kaydı yeterlidir. Kurumsal yatırımcılar beyan aranmadan resen kaydedilir. Niteliği kaybeden yatırımcı bunu bir MKK üyesine bildirir, statüyü değiştirmek o üyenin yükümlülüğüdür. Profesyonel müşteri statüsünden çıkan nitelikli yatırımcılık özelliğini de kaybeder.<\/li>\n<\/ul>\n\n<h3>Satış yöntemleri<\/h3>\n<table><tr><th>Yöntem<\/th><th>Esas<\/th><\/tr>\n<tr><td>Sabit fiyatla talep toplama<\/td><td>Payda sabit fiyat; pay dışı araçta iskonto, kupon faizi gibi sabit kriter. <b>En sık kullanılan<\/b> yöntem.<\/td><\/tr>\n<tr><td>Fiyat teklifi alarak talep toplama<\/td><td>Payda asgari satış fiyatı belirlenir, üstündeki teklifler toplanır.<\/td><\/tr>\n<tr><td>Fiyat aralığı ile talep toplama<\/td><td>Taban ve tavan fiyat; <b>tavan, tabanın %20 fazlasını aşamaz<\/b>. Aralık içinde farklı fiyat adımları kullanılabilir.<\/td><\/tr>\n<tr><td>Talep toplanmaksızın satış<\/td><td>Payları borsada işlem görmeyen halka açık ortaklıkların (Tebliğde nitelikleri belirlenenler dışındakilerin) paylarının belirli fiyattan izahnamedeki usulle satışı; eşitsizlik yaratmayan usul zorunlu.<\/td><\/tr>\n<tr><td>Borsada satış<\/td><td>Esasları <b>borsa<\/b> belirler; birden fazla yöntem varsa ihraççı veya halka arz eden seçer.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Talep formu Tebliğ ekindeki formla düzenlenir; kimlik, miktar, fiyat, teslim şekli içerir. Yatırımcı <b>alt sınır<\/b> koyabilir. Kimlik tespiti formdan önce yapılır. Talep toplanması taleplerin karşılanacağı anlamına gelmez.<\/li>\n<li>İzahnamede aksi yoksa yatırımcı talep toplama süresi içinde talebini <b>değiştirebilir veya geri alabilir<\/b>.<\/li>\n<li>Talep toplamada yeterli talep gelmeyen paylar için talep toplanmaksızın satış hükümleri uygulanır.<\/li>\n<li><b>Talep toplama zorunluluğu:<\/b> payları borsada işlem görmeyen halka açık ortaklığın artırımında hak kullanımı sonrası kalan payların satışında; son yıl bilançosuna göre <b>defter değeri nominalin en az 2 katı<\/b>, son yılda <b>net dönem kârı<\/b> ve <b>aktif toplamı 20.000.000 TL'yi aşan<\/b> ortaklıklar talep toplama yöntemlerinden birini kullanmak zorundadır. Talep toplama ortaklık veya yetkili kuruluşça yapılabilir. Kalan tutarın nakit artırılacak sermayeye oranı <b>%10 ve altındaysa<\/b> başvuru üzerine Kurul bu yöntemleri uygulatmayabilir. Kurul gerekirse talep toplamayı zorunlu tutabilir veya kaldırabilir.<\/li>\n<li><b>Borsada satış zorunluluğu:<\/b> payları borsada işlem gören ortaklıkların <b>işlem sırası bulunan<\/b> gruba ait artırımlarında hak kullanımı sonrası kalan paylar borsada satılır. İşlem sırası <b>olmayan<\/b> grupta zorunlu değildir; borsada satılmazsa en az, işlem gören payların borsada halka arz süresinin <b>son iki işlem gününde<\/b> birincil piyasada oluşan günlük ağırlıklı ortalama fiyatların ağırlıklı ortalamasından satılır. Birincil piyasa açılmamışsa veya işlem yoksa hak kullanımının son günü ikincil piyasa ağırlıklı ortalaması; o gün de işlem yoksa son işlem günündeki ağırlıklı ortalama esas alınır.<\/li>\n<li>Hak kullanımından sonra kalan paylar <b>nominal değerin altında satılamaz<\/b> (nominal altı ihraç düzenlemeleri saklı).<\/li>\n<\/ul>\n\n<h3>Satış fiyatı<\/h3>\n<ul>\n<li>Bedelli artırımda yeni pay alma hakkı kullanım fiyatını ortaklığın <b>yetkili organı<\/b> belirler; piyasa fiyatı veya defter değeri nominalin üzerindeyse Kurul nominalin üzerinde bir fiyat isteyebilir.<\/li>\n<li>Halka arz edilmeksizin artırımda fiyat pay ihracı düzenlemelerine göre; pay dışı araçların halka arz edilmeksizin ihracında piyasa koşulları, ortaklık ve ortakların menfaati dikkate alınır.<\/li>\n<li>Kesinleşmemiş fiyat, nominal değer, faiz veya getiri aralığı halka arzın bitimini izleyen <b>1 iş günü<\/b> içinde özel durum açıklamasıyla duyurulur.<\/li>\n<\/ul>\n\n<h3>Satışa başlama<\/h3>\n<ul>\n<li>Halka arza en erken izahname ve <b>fiyat tespit raporunun<\/b> yayımını izleyen <b>3. gün<\/b> başlanabilir; farklı günlerde yayımlanırlarsa <b>daha geç<\/b> yayımlanan esas alınır. Birden fazla belgede SPAN ve özetin yayım tarihi esastır.<\/li>\n<li>Tasarruf sahiplerine satış duyurusu ve arz programı sirküleri de satıştan önce ayrıca ilan edilir.<\/li>\n<li>Fiyat bilgisi izahnamede yoksa ve fiyat tespit raporu zorunlu değilse, bilgilerin özel durum açıklamasını izleyen <b>3. gün<\/b> başlanabilir. Talep üzerine Kurul bu süreyi kısaltabilir.<\/li>\n<li>Araçları <b>borsada işlem gören<\/b> ihraççılar için süre <b>takip eden iş günü<\/b> olarak uygulanır (cuma ilanı, pazartesi satış). <b>Dikkat:<\/b> payların <b>ilk<\/b> halka arzında yine 3 gün.<\/li>\n<li><b>Fiyat revizyonu:<\/b> fiyat, aralık veya faiz/iskonto oranı izahname değişikliği gerekmeden özel durum açıklamasıyla <b>yalnız aşağı yönlü<\/b> revize edilebilir. Satıştan önce revizede halka arza en erken açıklamayı izleyen <b>2. gün<\/b> başlanır; satış sırasında revizede süreye en az <b>2 iş günü<\/b> eklenir.<\/li>\n<li>Tasarruf sahiplerine satış duyurusu veya arz programı sirkülerine konu satışlar ilanı izleyen <b>10 iş günü<\/b> içinde; artırımlarda kalan payların satışı hak kullanımının bitiminden itibaren <b>10 iş günü<\/b> içinde başlar.<\/li>\n<li>Halka arz edilmeksizin artırımda satışa ihraç belgesinin ilanını izleyen <b>10 iş günü<\/b> içinde başlanması zorunlu; pay dışı araçlarda ihraç veya tertip ihraç belgesinin ilanını izleyen <b>iş günü<\/b> başlanabilir.<\/li>\n<\/ul>\n\n<h3>Satış süreleri<\/h3>\n<ul>\n<li>Halka arzda satış süresi <b>en az 2, en fazla 20 iş günü<\/b>; ihraççı veya halka arz eden serbestçe belirler. Kurul makul gerekçe ve talep üzerine uzatabilir; yeni tarihler derhal özel durum açıklamasıyla ilan edilir.<\/li>\n<li>Talep toplamada yeterli talep gelse bile süre sonuna kadar talep toplanır.<\/li>\n<li>Borsada satışta talep toplanmaksızın satış <b>2 iş günü<\/b>; araçların tamamı daha önce satılırsa satış <b>sona erdirilir<\/b>. Borsada talep toplama ile satışta süre <b>en az 2, en fazla 3 iş günü<\/b> ve süre sonuna kadar devam edilir.<\/li>\n<li>Halka arz edilmeksizin artırım paylarının satışı <b>azami 10 iş günü<\/b> içinde tamamlanır.<\/li>\n<\/ul>\n\n<h3>Tahsisat<\/h3>\n<ul>\n<li>Yatırımcı grupları ve tahsisat oranları izahnamede ayrıntılı yazılır. Asgari ve azami talep sınırları konulabilir ama ilişkili kişilere menfaat sağlamak için kullanılamaz. Gruptan başvuran, nitelik belgelerini talep formuna ekler.<\/li>\n<li><b>Zorunlu asgari tahsisat:<\/b> nominalin en az <b>%10'u yurt içi bireysel<\/b>, en az <b>%10'u yurt içi kurumsal<\/b> yatırımcılara.<\/li>\n<li><b>Kurumsal yatırımcı:<\/b> talebe dayalı profesyonel kabul edilenler dışındaki profesyonel müşteriler. <b>Bireysel:<\/b> bunun dışındaki gerçek ve tüzel kişiler.<\/li>\n<li>Asgari tahsisat kuralı borsada satış, talep toplanmaksızın satış, niteliği belirlenmiş ortaklık artırımları ve ek satışa konu araçlar için <b>uygulanmaz<\/b>.<\/li>\n<li><b>Kaydırma:<\/b> esasları izahnamede açıklanmışsa, asgari %10'ları azaltmamak üzere oranlar arasında kaydırma yapılabilir; ancak hiçbir grubun izahnamedeki tutarı <b>%20'den fazla azaltılamaz<\/b>. Bir grupta yeterli talep yoksa karşılanamayan kısım diğer gruplara aktarılabilir ve asgari oran sınırları uygulanmaz.<\/li>\n<li>Kurul asgari tahsisat oranlarını <b>sıfıra kadar indirebilir veya bir kata kadar artırabilir<\/b>.<\/li>\n<li>Hiçbir gruba dahil olamayan talepler yetkili kuruluşun onayıyla uygun gruba alınır.<\/li>\n<li><b>Hesap örneği:<\/b> izahnamede %50 bireysel, %40 kurumsal, %10 yurt dışı; tüm gruplarda fazla talep varsa yurt dışına kaydırmada bireysel en fazla %50'den %40'a (yüzde 20 azaltma), kurumsal %40'tan %32'ye iner; yurt dışı en fazla %28 olur.<\/li>\n<\/ul>\n\n<h3>Dağıtım<\/h3>\n<ul>\n<li>Grup içinde <b>eşit ve adil<\/b> davranma; hangi yetkili kuruluşa talep verildiğine bakılmaz. Nitelikli ve kurumsal grupta farklı ilkeler izahnamede belirlenebilir. Çalışanlar ayrı grupsa bireysellerle aynı dağıtım ilkelerine tabidir.<\/li>\n<li>Konsorsiyumda üyeler talep listelerini lidere iletir, lider konsolide edip dağıtır; kayıtların konsolidasyonundan lider veya eş lider sorumludur.<\/li>\n<li><b>Sabit fiyat ve fiyat aralığı yönteminde:<\/b> talep arzdan azsa tüm talepler karşılanır. Fazlaysa: grup tahsisatı hariç toplam tutar talep eden <b>yatırımcı sayısına<\/b> bölünür, bu tutar ve altındaki talepler karşılanır; kalan tutar talebi karşılanamayanlar sayısına bölünerek tekrarlanır; alt sınırın altında kalan yatırımcı listeden çıkarılır; küsurat tama iblağ edilip ihraççının uygun gördüğü şekilde dağıtılır (<b>eşit dağıtım<\/b>).<\/li>\n<li>İstenirse <b>oransal dağıtım:<\/b> gruba tahsis edilen miktar / gruba gelen toplam talep = karşılama oranı; her talep bu oranla çarpılır.<\/li>\n<li>Tüm bireysellere satış öncesinde asgari dağıtım tutarı belirlenebilir; yetmezse izlenecek yol izahnamede yazılır.<\/li>\n<li><b>Fiyat teklifi yönteminde:<\/b> teklifler en yüksekten en düşüğe birikimli tabloya dökülür; <b>birikimli en çok aracın satılabildiği fiyat<\/b> satış fiyatıdır. Bu fiyatı karşılayan teklifler dikkate alınır; fazla talepte en yüksek fiyatlıdan başlanır; satış fiyatında birden fazla karşılanamayan talep varsa talep miktarıyla orantılı dağıtılır.<\/li>\n<li><b>Mükerrer talep:<\/b> yalnız <b>en yüksek miktarlı<\/b> talep dikkate alınır. Talepler arzdan azsa ve izahnamede yazılıysa en yüksek ikinci talep de dikkate alınabilir. Oransal dağıtımda bu hüküm uygulanmaz. Sorumluluk yetkili kuruluş veya konsorsiyum liderinde.<\/li>\n<\/ul>\n<h4>Dağıtım listesi, iade, teslim<\/h4>\n<ul>\n<li>Talep toplama bitimini izleyen <b>2 iş günü<\/b> içinde yetkili kuruluş veya lider dağıtım listesini ihraççıya verir (yurt dışı taleplerde tarih-saat gerekmez).<\/li>\n<li>İhraççı veya halka arz eden listeyi teslimden itibaren <b>2 iş günü<\/b> içinde onaylayıp geri verir.<\/li>\n<li>Karşılanamayan taleplerin bedel iadesi onaylı listenin teslim alınmasını izleyen <b>iş günü<\/b>; konsorsiyumda lider aynı gün üyelere bildirir, üyeler izleyen iş günü iade eder.<\/li>\n<li>Teslim yükümlülüğü yetkili kuruluşta, konsorsiyumda <b>liderde<\/b>. Kayden teslim MKK'da hak sahibi adına açılmış hesaplarda; Kurul toplu hesap tutulmasına da karar verebilir. MKK hesabına aktarımla satış tamamlanır.<\/li>\n<\/ul>\n\n<h3>Satış sonuçları<\/h3>\n<ul>\n<li>Tüm talep listesi ve satış sonuçları satış süresinin sonundan itibaren <b>5 yıl<\/b> basılı ve elektronik saklanır; ilişkili kişilere satış tablosu ayrıca tutulur. Kurul veya borsa isterse gönderilir; <b>payların ilk halka arzında<\/b> (talep listesi hariç) istenmeden Kurula gönderilir.<\/li>\n<li>İlan ve reklamların örnekleri satış süresinin bitimini izleyen <b>10 iş günü<\/b> içinde Kurula gönderilir.<\/li>\n<li>İlk halka arz ve pay dışı araç halka arzlarında yetkili kuruluş; dağıtım sonuçlarını, ek satış ve kaydırma sonuçlarını ve nominalin <b>%5'inden fazlasını<\/b> alanları dağıtım listesinin kesinleştiği günü izleyen <b>2 iş günü<\/b> içinde açıklar. Artırımlarda ayrıca ilişkili tarafların alımları orana bakılmaksızın açıklanır. İdari sorumluluğu bulunan kişilerin alımları da %5'e bağlı olmadan açıklanır.<\/li>\n<\/ul>\n\n<h3>İlk halka arzlara ilişkin İlke Kararı (i-SPK.128.23, 19.09.2024)<\/h3>\n<ul>\n<li>Halka arz edilen payların piyasa değeri <b>750.000.000 TL ve altı<\/b>ysa <b>borsada satış<\/b> zorunlu.<\/li>\n<li>750 milyon TL üzeri ve borsa dışında talep toplanıyorsa: yurt içi bireysellere <b>eşit dağıtım<\/b>.<\/li>\n<li><b>Yüksek talepli yatırımcı grubu<\/b> (kurumsal dışı): izahnamede tanımlanırsa halka arzın <b>%10'una kadar<\/b> tahsisat; eşit veya oransal dağıtım. Oransalda talebin tamamı kadar nakit veya <b>%120<\/b>'si oranında BIST 30 payı teminatı; yatırımcı başına talep gruba tahsis edilen tutarın <b>dörtte birini<\/b> geçemez.<\/li>\n<li>Yurt içi kurumsalda yeterli talep varsa tahsisatın en az <b>%50<\/b>'si yatırım fonları, emeklilik fonları ve OKS fonlarına; kurumsal yatırımcı başına dağıtım halka arzın <b>%1<\/b>'ini aşamaz; bir PYŞ'nin kurucusu veya yöneticisi olduğu fonlar için sınır <b>%3<\/b>. PYŞ'ler ve ilişkili tüzel kişilerin kendi hesabına dağıtım halka arzın <b>%2<\/b>'sini geçemez.<\/li>\n<li>Kurumsal grupta sayılmayanlar: bireysel portföy yöneticiliği müşterileri adına iletilen talepler, gayrimenkul ve girişim sermayesi yatırım fonları, unvanında serbest veya özel geçen fonlar ve III-39.1 m.31/1-(d) kapsamındakiler.<\/li>\n<li>İçsel bilgiye ulaşabilecek kişiler ile eşleri ve birinci derece kan ve sıhri hısımları yalnız <b>yurt içi bireysel<\/b> gruptan talepte bulunabilir.<\/li>\n<li>Bir gruba tahsis edilen tutarı karşılayacak talep gelmişse o gruptan <b>başka gruplara kaydırma yapılamaz<\/b>; yetersiz talepte kalan serbestçe aktarılır.<\/li>\n<li>Talep formu tarih, saat ve müteselsil sıra numarasıyla düzenlenir; dağıtım listesi talep bazında, talep numarası, form çeşidi, teminat tutarı ve türüyle hazırlanır.<\/li>\n<li>Yurt dışı grupta dolanma amaçlı dağıtımdan ihraççı ve yetkili kuruluş sorumlu; Kurula taahhütname verilir.<\/li>\n<li>Kurumsalların kendi portföyü için aldığı paylar bireysel hesaplara aktarılamaz.<\/li>\n<li><b>Satış kısıtı:<\/b> dağıtımdan pay alan yatırımcı, paylar hesabına geçtikten sonra <b>90 gün<\/b> borsa dışında satamaz, virmanlayamaz, özel emir veya toptan satışa konu edemez. Mevcut ortakların payları için kısıt izahname onay tarihinden itibaren <b>180 gün<\/b> ve <b>borsada satışı da kapsar<\/b>.<\/li>\n<\/ul>\n\n<h3>Yetkili kuruluşlar ve teşvikler<\/h3>\n<ul>\n<li>Halka arz yetkili kuruluş veya konsorsiyum aracılığıyla yapılır; anapara ve faiz ödemesi gibi yükümlülükler de yetkili kuruluşlar vasıtasıyla yerine getirilir. Konsorsiyumda en az bir lider; birden fazla eş lider olabilir.<\/li>\n<li>Halka arz sürerken talep tutarı açıklanamaz. Lider veya eş liderler halka arz fiyatı ve üstündeki fiyatlardan gelen talebi, yanıltıcı olmamak kaydıyla <b>süre bittikten sonra<\/b> açıklayabilir; açıklama seçilmiş bazı tahsisat gruplarına ilişkin olamaz.<\/li>\n<li><b>Teşvik:<\/b> ilk ve ikincil halka arzlarda belirli gruplara nakdi veya gayri nakdi teşvik Kurul izniyle verilebilir; ilişkili kişilere menfaat sağlamamalı ve sağlıklı fiyat oluşumunu engellememeli.<\/li>\n<li><b>Farklı fiyat:<\/b> Kurulca uygun görülürse gruplara farklı fiyat; fark <b>%20<\/b>'yi aşamaz, aynı grup içinde farklı fiyat uygulanamaz. Mevcut paylar da satılıyorsa iskontolu paylar önce halka arz edenlerin paylarından karşılanır. İskonto nedeniyle fondaki olası azalma izahnamede yazılır.<\/li>\n<li>Ortaklığın halka arzdan topladığı fonun satıştan <b>sonra azalması<\/b> sonucunu doğuran teşvik verilemez; fiyat istikrarı işlemleri ve geri alımlar bu kapsamda sayılmaz.<\/li>\n<\/ul>", "sorular": [{"q": "Sermaye Piyasası Araçlarının Satışı Tebliği'nde yer alan tutarların yeniden belirlenmesinde hangisi dikkate alınır?", "o": ["Hazine ve Maliye Bakanlığınca ilan edilen yeniden değerleme katsayısı", "TÜİK tarafından açıklanan TÜFE", "TCMB politika faizi", "Asgari ücret artış oranı", "Borsa İstanbul endeks getirisi"], "a": 0, "e": "Tutarlar her yıl Hazine ve Maliye Bakanlığınca ilan edilen yeniden değerleme katsayısı dikkate alınarak Kurulca belirlenir."}, {"q": "Aşağıdakilerden hangisi Satış Tebliği kapsamı dışındadır?", "o": ["Halka açık ortaklığın bedelli sermaye artırımı", "Halka açık olmayan ortaklığın paylarının halka arz edilmeksizin satışı", "Borçlanma aracının halka arzı", "Payların ilk halka arzı", "Ortakların mevcut paylarının halka arzı"], "a": 1, "e": "Halka açık olmayan ortaklıkların paylarının halka arz edilmeksizin satışı Tebliğ kapsamı dışındadır."}, {"q": "Tahsisli olarak satılan sermaye piyasası araçlarını belirli bir anda elinde bulunduran yatırımcı sayısı kural olarak kaç kişiyi geçmemelidir?", "o": ["50", "99", "150", "250", "500"], "a": 2, "e": "Sınır 150 yatırımcıdır; hesaplamada nitelikli yatırımcılar dikkate alınmaz."}, {"q": "Tahsisli satılan araçlarda 150 kişilik sınırın aşıldığı bildirilen ihraççı, bildirimden itibaren hangi süre içinde izahname onayı için Kurula başvurmalıdır?", "o": ["5 iş günü", "10 iş günü", "15 iş günü", "20 iş günü", "30 gün"], "a": 3, "e": "İhraççı 20 iş günü içinde Kurula izahname onayı için, aynı sürede borsaya başvurur."}, {"q": "Tahsisli satışta yatırımcı sayısı kontrolüyle ilgili hangisi yanlıştır?", "o": ["Kontrol ISIN kodu bazında yapılır", "Kontrol vade boyunca günlük yapılır", "Nitelikli yatırımcılar sayıma dahil edilmez", "Yalnızca gün sonu bakiyesi olan hesaplar dikkate alınır", "Müşterek hesap sahipleri tek kişi sayılır"], "a": 4, "e": "Müşterek hesap sahibi kişiler ayrı ayrı dikkate alınır."}, {"q": "Fiyat aralığı ile talep toplama yönteminde taban fiyat 25 TL ise tavan fiyat en fazla kaç TL olabilir?", "o": ["30,00 TL", "28,75 TL", "27,50 TL", "31,25 TL", "37,50 TL"], "a": 0, "e": "Tavan fiyat tabanın %20 fazlasını aşamaz: 25 x 1,20 = 30 TL."}, {"q": "Sermaye piyasası araçlarının satışında en sık kullanılan yöntem hangisidir?", "o": ["Fiyat teklifi alarak talep toplama", "Sabit fiyatla talep toplama", "Fiyat aralığı ile talep toplama", "Talep toplanmaksızın satış", "Tahsisli satış"], "a": 1, "e": "Kitap sabit fiyatla talep toplamayı en sık kullanılan yöntem olarak belirtir."}, {"q": "Payları borsada işlem görmeyen halka açık bir ortaklığın artırımında kalan payların satışında talep toplama zorunluluğu için aşağıdaki koşullardan hangisi aranmaz?", "o": ["Defter değerinin nominalin en az 2 katı olması", "Son yılda net dönem kârı elde edilmesi", "Ortaklığın en az 3 yıldır faaliyette olması", "Son yıl bilançosunun Kurul standartlarına uygun hazırlanması", "Aktif toplamının 20.000.000 TL'yi aşması"], "a": 2, "e": "Faaliyet süresi koşulu yoktur; diğerleri zorunluluğun koşullarıdır."}, {"q": "Payları borsada işlem gören bir ortaklığın borsada işlem sırası bulunan grubuna ilişkin artırımda hak kullanımından sonra kalan payların satışında hangi yöntem zorunludur?", "o": ["Sabit fiyatla talep toplama", "Fiyat teklifi alarak talep toplama", "Talep toplanmaksızın satış", "Borsada satış", "Tahsisli satış"], "a": 3, "e": "İşlem sırası bulunan grup paylarında kalan payların borsada satışı zorunludur."}, {"q": "Payların ilk halka arzı dışında, araçları borsada işlem gören ihraççının izahnamesi Cuma günü ilan edilmişse satışa en erken ne zaman başlanabilir?", "o": ["Aynı Cuma", "Cumartesi", "Çarşamba", "Salı", "Pazartesi"], "a": 4, "e": "Borsada işlem gören ihraççılarda 3 günlük süre takip eden iş günü olarak uygulanır; Cuma ilanında Pazartesi başlanabilir."}, {"q": "Halka arz fiyatının satış süresi içinde revize edilmesiyle ilgili hangisi doğrudur?", "o": ["Halka arz süresine en az 2 iş günü eklenir", "Revize için izahname değişikliği zorunludur", "Fiyat yukarı yönlü revize edilebilir", "Satış derhal iptal edilir", "Süreye 5 iş günü eklenir"], "a": 0, "e": "Fiyat yalnız aşağı yönlü revize edilebilir; süre içinde revizyonda süreye asgari 2 iş günü eklenir."}, {"q": "Halka arz yoluyla satış süresi hangi aralıkta belirlenebilir?", "o": ["1–10 iş günü", "2–20 iş günü", "2–15 iş günü", "3–30 iş günü", "5–20 iş günü"], "a": 1, "e": "Halka arzda satış süresi 2 iş gününden az, 20 iş gününden fazla olamaz."}, {"q": "Borsada satış yönteminde satışın talep toplama suretiyle yapılması halinde talep toplama süresi ne kadardır?", "o": ["Tam 2 iş günü", "En az 3, en fazla 5 iş günü", "En az 2, en fazla 3 iş günü", "En fazla 10 iş günü", "En az 2, en fazla 20 iş günü"], "a": 2, "e": "Borsada talep toplama ile satışta süre en az 2, en fazla 3 iş günüdür."}, {"q": "Halka arzda yurt içi bireysel ve yurt içi kurumsal yatırımcılara yapılması zorunlu asgari tahsisat oranları hangisidir?", "o": ["%5 ve %5", "%25 ve %25", "%20 ve %10", "%10 ve %10", "%10 ve %20"], "a": 3, "e": "Nominalin en az %10'u yurt içi bireysele, en az %10'u yurt içi kurumsala tahsis edilir."}, {"q": "İzahnamede yurt içi bireysel yatırımcılara %60 tahsisat ayrılmıştır. Tüm gruplarda fazla talep varken bu gruptan kaydırma yapılırsa grubun payı en az yüzde kaça düşebilir?", "o": ["%40", "%45", "%54", "%50", "%48"], "a": 4, "e": "Bir grubun tutarı en fazla %20 azaltılabilir: 60 x 0,80 = %48."}, {"q": "Kurulun asgari tahsisat oranlarına ilişkin yetkisi hangisidir?", "o": ["Sıfıra kadar indirebilir veya bir kata kadar artırabilir", "Yüzde beşe kadar indirebilir", "Yalnızca artırabilir", "Değiştiremez", "İki katına kadar artırabilir ama indiremez"], "a": 0, "e": "Kurul asgari tahsisat oranlarını sıfıra kadar indirebilir veya bir kata kadar artırabilir."}, {"q": "Fiyat teklifi alarak talep toplama yönteminde satış fiyatı nasıl belirlenir?", "o": ["En yüksek teklif satış fiyatıdır", "Birikimli olarak en çok aracın satılabildiği fiyat satış fiyatıdır", "Tekliflerin aritmetik ortalaması alınır", "Asgari satış fiyatı her zaman satış fiyatıdır", "Konsorsiyum lideri serbestçe belirler"], "a": 1, "e": "Teklifler birikimli tabloya dökülür ve birikimli en çok aracın satılabildiği fiyat satış fiyatı olur."}, {"q": "Mükerrer talepte bulunan yatırımcıların taleplerinden hangisi kural olarak dağıtımda dikkate alınır?", "o": ["İlk talep", "Son talep", "En yüksek miktarlı talep", "Tüm taleplerin toplamı", "En düşük miktarlı talep"], "a": 2, "e": "Kural olarak yalnızca en yüksek miktarlı talep dikkate alınır."}, {"q": "Dağıtım listesinin yetkili kuruluşça ihraççıya verilmesi ve ihraççının listeyi onaylaması için öngörülen süreler hangisidir?", "o": ["1 iş günü ve 1 iş günü", "5 iş günü ve 3 iş günü", "3 iş günü ve 2 iş günü", "2 iş günü ve 2 iş günü", "2 iş günü ve 5 iş günü"], "a": 3, "e": "Liste talep toplamanın bitimini izleyen 2 iş günü içinde verilir; ihraççı da 2 iş günü içinde onaylar."}, {"q": "Payların ilk halka arzında satış sonuçları açıklamasında, nominal değerin yüzde kaçından fazlasını satın alanlar ayrıca açıklanır?", "o": ["%1", "%3", "%20", "%10", "%5"], "a": 4, "e": "Halka arz edilen nominalin %5'inden fazlasını alanlar 2 iş günü içinde açıklanır."}, {"q": "19.09.2024 tarihli İlke Kararına göre hangi büyüklükteki ilk halka arzlarda borsada satış yöntemi zorunludur?", "o": ["Piyasa değeri 750 milyon TL ve altı", "Piyasa değeri 500 milyon TL ve altı", "Piyasa değeri 250 milyon TL ve altı", "Piyasa değeri 1 milyar TL ve altı", "Tüm ilk halka arzlarda"], "a": 0, "e": "Halka arz edilen payların piyasa değeri 750.000.000 TL ve altıysa borsada satış zorunludur."}, {"q": "İlke Kararına göre ilk halka arzda dağıtımdan pay alan yatırımcılar payları hesaplarına geçtikten sonra kaç gün boyunca borsa dışında satamaz?", "o": ["30 gün", "90 gün", "60 gün", "180 gün", "365 gün"], "a": 1, "e": "Yatırımcılar için kısıt 90 gündür; mevcut ortaklar için 180 gündür ve borsada satışı da kapsar."}, {"q": "İlke Kararına göre yurt içi kurumsal grupta tek bir kurumsal yatırımcıya dağıtılacak pay tutarı, kural olarak halka arz tutarının yüzde kaçını aşamaz?", "o": ["%3", "%2", "%1", "%5", "%10"], "a": 2, "e": "Kurumsal yatırımcı başına sınır %1'dir; bir PYŞ'nin yönettiği fonlar için %3, PYŞ'lerin kendi hesabı için %2'dir."}, {"q": "Halka arzda belirli yatırımcı gruplarına farklı fiyat uygulanmasıyla ilgili hangisi doğrudur?", "o": ["Fiyatlar arasındaki fark %10'u aşamaz", "Aynı grup içinde farklı fiyat uygulanabilir", "Kurul izni gerekmez", "Fiyat farkı %20'yi aşamaz ve aynı grup içinde farklı fiyat uygulanamaz", "İskontolu paylar önce yeni ihraç edilen paylardan karşılanır"], "a": 3, "e": "Fark %20'yi aşamaz, aynı grup içinde farklı fiyat uygulanamaz; iskontolu paylar önce mevcut paylardan karşılanır."}]}, {"id": 3, "kisa": "VDMK ve İDMK", "baslik": "Varlık Finansmanı: Kavramsal Çerçeve ve Varlığa veya İpoteğe Dayalı Menkul Kıymetler (III-58.1)", "ozet": "Konut finansmanı sistemleri, ipotek ve menkul kıymetleştirme, bilanço içi ve dışı modeller; VFF ve KFF'nin kuruluşu, VDMK ve İDMK ihracı, fon kurulu, hizmet sağlayıcı, risk tutma ve fon portföyü kuralları.", "notlar": "<h3
