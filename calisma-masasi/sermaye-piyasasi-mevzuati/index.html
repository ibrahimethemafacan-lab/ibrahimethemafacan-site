lduğunda ihraççı gerekli güncellemeyi en geç ne zaman yapar?", "o": ["Derhal", "5 iş günü içinde", "2 iş günü içinde", "Ertesi iş günü", "10 gün içinde"], "a": 2, "e": "Genel bilgilerdeki değişiklikler en geç iki iş günü içinde güncellenir; %5 ortaklık tablosu ise MKK tarafından derhal güncellenir."}, {"q": "Aşağıdakilerden hangisi bilgilendirme politikasında asgari olarak yer alması gereken hususlardan biri değildir?", "o": ["Haber ve söylentilerin takibi ve açıklama esasları", "İdari sorumluluğu bulunan kişilerin belirlenme esasları", "Özel durumların gizliliği için alınan tedbirler", "Geleceğe yönelik değerlendirmelerin açıklanma esasları", "Yıllık kâr payı dağıtım oranı"], "a": 4, "e": "Asgari içerik: sunumlara erişim, söylentilerin takibi, idari sorumluların belirlenmesi, gizlilik tedbirleri ve geleceğe yönelik değerlendirme esaslarıdır."}, {"q": "Pay dışındaki SPA'yı halka arz eden ihraççılara ilişkin açıklama yükümlülüklerinden derecelendirme notlarına ilişkin bent hangi ihraççılara uygulanmaz?", "o": ["Bankalar", "Kamu iktisadi teşebbüsleri ve mahalli idareler", "Yabancı ihraççılar", "Varlık kiralama şirketleri", "Payları borsada işlem gören ortaklıklar"], "a": 1, "e": "Özelleştirme kapsamındakiler dahil KİT'ler ve mahalli idareler ile ilgili kuruluşların ihraç ettiği araçlar için derecelendirme bendi uygulanmaz."}, {"q": "SPA'ları borsada işlem görmeyen bir ihraççı özel durum açıklamasını nereye yapar?", "o": ["KAP'a", "Türkiye Ticaret Sicili Gazetesine", "Yalnızca kendi internet sitesine", "Sermaye Piyasası Kuruluna gönderir; açıklama Kurul internet sitesinde duyurulur", "Borsaya"], "a": 3, "e": "Borsada işlem görmeyen ihraççılar ve işlem görmeyen kira sertifikalarının fon kullanıcıları açıklamaları Kurula gönderir."}, {"q": "SPA'ları borsada işlem gören ihraççılar özel durum açıklamalarını internet sitelerinde ne zamana kadar ilan etmeli ve ne kadar süre tutmalıdır?", "o": ["En geç açıklamayı izleyen iş günü içinde ilan, 5 yıl süreyle", "En geç 5 iş günü içinde ilan, 5 yıl süreyle", "Derhal ilan, 10 yıl süreyle", "En geç 2 iş günü içinde ilan, 3 yıl süreyle", "En geç izleyen iş günü içinde ilan, 1 yıl süreyle"], "a": 0, "e": "Borsada işlem görenler en geç izleyen iş günü içinde ilan eder ve beş yıl tutar; KAP'a bağlantı vermek yeterlidir. İşlem görmeyenlerde ilan süresi 5 iş günüdür."}, {"q": "Özel durum açıklamalarının özellikleri hakkında hangisi yanlıştır?", "o": ["Henüz kesinleşmemiş durumlar belirsizlik belirtilerek açıklanır", "Etkileri tutar olarak ifade edilebiliyorsa tutara yer verilir", "Faaliyetlerin pazarlanması ve reklamı amacıyla kullanılabilir", "Kamuyu aydınlatma prosedürleri yönetim kurulunca belirlenir", "Açıklamaların dili Türkçedir"], "a": 2, "e": "İhraççılar özel durum açıklamalarını faaliyetlerinin pazarlanması ve reklamı amacıyla kullanamaz."}]}, {"id": 6, "kisa": "Kurumsal Yönetim (II-17.1)", "baslik": "Kurumsal Yönetim Tebliği (II-17.1) ve Kurumsal Yönetim İlkeleri", "ozet": "Kurumsal yönetimin tanımı, ana ilkeleri ve yaklaşımlar, TTK'nın kurumsal yönetim hükümleri, Tebliğin kapsamı ve grupları, zorunlu ilkeler ve istisnalar, uyum raporları, ilişkili taraf işlemleri, yatırımcı ilişkileri, teminat-rehin-ipotek ve SPK kurumsal yönetim ilkeleri.", "notlar": "<h3>Kavram ve ana ilkeler<\/h3>\n<ul>\n<li>Öncü çalışmalar <b>OECD<\/b>'ye aittir; bilimsel temel <b>Berle ve Means<\/b>'in 1932 tarihli \"Modern Şirket ve Özel Mülkiyet\" kitabıdır: mülkiyet ile kontrolün aynı elde olmasının tehlikeleri ve ayrılması gereği; ABD'de sermayenin küçük hissedarlara dağıldığı, kontrolün profesyonel yöneticilerde olduğu.<\/li>\n<li><b>OECD tanımı:<\/b> şirket yönetimi, yönetim kurulu, hissedarlar ve diğer menfaat sahipleri arasındaki ilişkiler bütünü. Dar anlamda: şirket yönetimi ile hissedarlar ve menfaat sahipleri arasındaki ilişkileri düzenleyen kurallar. Geniş anlamda: <b>iyi şirket yönetimi<\/b> için gerekli kurallar bütünü.<\/li>\n<li>Diğer tanımlar: Shleifer ve Vishny (finansman sağlayanların getiri temini), Monks ve Minow (hissedar, üst yönetim ve YK ilişkisi), Cadbury Komitesi (şirketlerin yönetim ve denetim sistemi), Salacuse (üç güç merkezi: YK, üst yönetim, hissedarlar).<\/li>\n<li><b>Menfaat sahipleri:<\/b> şirket faaliyetleriyle doğrudan/dolaylı ilişkili, olumlu veya olumsuz dışsallık elde eden kişi ve kurumlar. Çalışanlar <b>şirket içi<\/b>, müşteriler <b>şirket dışı<\/b> menfaat sahibidir.<\/li>\n<\/ul>\n<table>\n<tr><th>Ana ilke<\/th><th>Anlamı<\/th><\/tr>\n<tr><td>Adillik<\/td><td>Azınlık ve yabancılar dahil tüm hak sahiplerine eşit davranma; hakların korunması ve ihlalde telafi imkanı<\/td><\/tr>\n<tr><td>Şeffaflık<\/td><td>Ticari sır ve açıklanmamış bilgiler hariç finansal ve finansal olmayan bilgilerin zamanında, doğru, eksiksiz, anlaşılır, düşük maliyetle erişilebilir açıklanması; faaliyet <b>öncesi, süreci ve sonrasını<\/b> kapsar<\/td><\/tr>\n<tr><td>Hesap verebilirlik<\/td><td>YK üyelerinin şirket tüzel kişiliğine ve pay sahiplerine hesap verme zorunluluğu; yalnızca <b>faaliyet sonrasını<\/b> kapsar<\/td><\/tr>\n<tr><td>Sorumluluk<\/td><td>Şirket adına yapılan faaliyetlerin mevzuata, esas sözleşmeye, iç düzenlemelere, toplumsal ve etik değerlere uygunluğu ve denetlenmesi<\/td><\/tr>\n<\/table>\n<h3>Yaklaşımlar ve sistemler<\/h3>\n<ul>\n<li><b>Shleifer ve Vishny (1997):<\/b> birinci yaklaşım, yatırımcı haklarının yöneticilerce gasp edilmesinin hukukla önlenmesi (dağılmış mülkiyet; ABD ve İngiltere). İkinci yaklaşım, <b>hakim ortağın<\/b> ağırlıklı olduğu yapı; denetim zafiyetini giderir ama hakim ortak ile yönetimin küçük hissedarlar aleyhine işbirliği riskini doğurur. En iyi sistem, büyük ve küçük yatırımcıların haklarını hukuken en iyi koruyan sistemdir.<\/li>\n<li><b>Goyer:<\/b> Anglo-Sakson ve Kıta Avrupası sistemleri.<\/li>\n<\/ul>\n<table>\n<tr><th>Anglo-Sakson<\/th><th>Kıta Avrupası<\/th><\/tr>\n<tr><td>Çok ortaklı (dağılmış) mülkiyet<\/td><td>Hakim ortak ağırlıklı yapı<\/td><\/tr>\n<tr><td>Ana hissedarlar bireysel emeklilik ve yatırım fonları<\/td><td>Ana ortaklar bankalar veya finans dışı kuruluşlar<\/td><\/tr>\n<tr><td>Şeffaf ve gelişmiş sermaye piyasaları<\/td><td>Az şeffaf, gelişmemiş sermaye piyasaları<\/td><\/tr>\n<tr><td>Piyasalar şirketleri kontrol eder<\/td><td>Yönetimin onaylamadığı satın almalar yok<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Reed (2002):<\/b> gelişmekte olan ülkelerde aile hakimiyeti ve devlet bankası borcu ile Anglo-Amerikan modelini karşılaştırdı. <b>Gilson (2000):<\/b> Japonya'da Keiretsu, Kore'de Chaebol, Avrupa'da holding yapıları.<\/li>\n<li>TTK hazırlanırken AB'nin 2003 Aksiyon Planı'ndan yararlanıldı; TTK'nın kurumsal yönetim hükümleri genel olarak <b>Anglo-Sakson<\/b> sistemi çerçevesindedir. TTK gerekçesine göre hareket İngiltere'de <b>1992 Cadbury Raporu<\/b> ile başladı; dört taşıyıcı kolon: <b>şeffaflık, adillik, hesap verilebilirlik, sorumluluk<\/b>.<\/li>\n<\/ul>\n<h3>TTK'nın kurumsal yönetim hükümleri<\/h3>\n<ul>\n<li>Pay sahibi hakları: tek başına kullanılan <b>kişisel haklar<\/b> ve <b>azınlık hakları<\/b>. Azınlık: sermayenin en az <b>%10<\/b>'u; halka açık şirketlerde en az <b>%5<\/b>'i (yirmide bir).<\/li>\n<\/ul>\n<table>\n<tr><th>TTK maddesi<\/th><th>Kural<\/th><\/tr>\n<tr><td>m.336<\/td><td>Kuruluş belgeleri sicil dosyasına konur, şirketçe <b>5 yıl<\/b> saklanır<\/td><\/tr>\n<tr><td>m.357, 391<\/td><td>Eşit işlem; aykırı YK kararları butlan<\/td><\/tr>\n<tr><td>m.359<\/td><td>Tüzel kişi YK üyesi olursa adına yalnız <b>bir gerçek kişi<\/b> tescil ve ilan edilir; sadece o kişi oy kullanır<\/td><\/tr>\n<tr><td>m.360<\/td><td>Esas sözleşmeyle belirli gruplara ve azlığa YK'da temsil hakkı<\/td><\/tr>\n<tr><td>m.399<\/td><td>Denetçinin azli davası: YK veya sermayenin %10'u (halka açıkta esas/çıkarılmış sermayenin %5'i); seçimin TTSG ilanından itibaren <b>3 hafta<\/b> içinde; azlık için karşı oy, tutanak ve en az <b>3 aylık<\/b> pay sahipliği<\/td><\/tr>\n<tr><td>m.407<\/td><td>Murahhas üyeler ve en az <b>bir<\/b> YK üyesi GK'da hazır bulunur; denetçi de hazır bulunur<\/td><\/tr>\n<tr><td>m.410, 411<\/td><td>YK toplanamazsa mahkeme izniyle tek pay sahibi GK'yı çağırabilir (karar kesin); sermayenin onda biri (halka açıkta yirmide biri) çağrı ve gündem isteyebilir<\/td><\/tr>\n<tr><td>m.420<\/td><td>Onda bir (halka açıkta yirmide bir) isterse finansal tabloların müzakeresi GK kararı aranmaksızın <b>1 ay<\/b> ertelenir<\/td><\/tr>\n<tr><td>m.421<\/td><td>Bilanço zararını kapatma yükümlülüğü ve merkezin yurt dışına taşınması: sermayenin tamamının <b>oybirliği<\/b><\/td><\/tr>\n<tr><td>m.425, 432<\/td><td>Temsilcinin pay sahibi olmasını öngören esas sözleşme hükümleri geçersiz<\/td><\/tr>\n<tr><td>m.434<\/td><td>Oy, payların itibari değeriyle orantılı; her pay sahibinin en az bir oyu var<\/td><\/tr>\n<tr><td>m.436<\/td><td>Oydan yoksunluk: kişisel işlerde ve ibra kararlarında<\/td><\/tr>\n<tr><td>m.437<\/td><td>Finansal tablolar, faaliyet raporu ve kâr dağıtım önerisi GK'dan en az <b>15 gün<\/b> önce incelemeye açılır; bilgi alma hakkı kaldırılamaz, sınırlandırılamaz<\/td><\/tr>\n<tr><td>m.438, 439<\/td><td>Özel denetim: GK reddederse onda bir (halka açıkta yirmide bir) veya itibari değeri en az <b>1 milyon TL<\/b> olan paylar <b>3 ay<\/b> içinde mahkemeden ister<\/td><\/tr>\n<tr><td>m.479<\/td><td>Bir paya en çok <b>15 oy<\/b> hakkı tanınabilir<\/td><\/tr>\n<tr><td>m.531<\/td><td>Haklı sebeple fesih: onda bir (halka açıkta yirmide bir)<\/td><\/tr>\n<tr><td>m.559<\/td><td>Kuruluş ve artırım sorumlulukları tescilden itibaren <b>4 yıl<\/b> geçmedikçe sulh ve ibra edilemez; sonra GK onayı gerekir ve onda bir (halka açıkta yirmide bir) karşı çıkarsa onaylanmaz<\/td><\/tr>\n<tr><td>m.514<\/td><td>YK finansal tabloları ve faaliyet raporunu bilanço gününü izleyen hesap döneminin ilk <b>3 ayı<\/b> içinde hazırlar<\/td><\/tr>\n<tr><td>m.361<\/td><td>YK üyelerinin verebileceği zarar sermayenin <b>%25<\/b>'ini aşan bedelle sigortalanırsa duyurulur ve uyum değerlendirmesinde dikkate alınır<\/td><\/tr>\n<tr><td>m.362<\/td><td>YK üyeleri en çok <b>3 yıl<\/b> için seçilir<\/td><\/tr>\n<tr><td>m.378<\/td><td>Payları borsada işlem gören şirkette <b>riskin erken saptanması<\/b> komitesi zorunlu; diğerlerinde denetçi yazılı bildirirse kurulur, ilk raporunu <b>1 ay<\/b> sonunda verir; YK'ya <b>2 ayda bir<\/b> rapor<\/td><\/tr>\n<tr><td>m.393<\/td><td>YK üyesi kendisi, eşi, alt-üst soyu veya <b>3. dereceye kadar<\/b> kan ve kayın hısımının menfaat çatışmasında müzakereye katılamaz<\/td><\/tr>\n<tr><td>m.396<\/td><td>Rekabet yasağı: GK izni olmadan<\/td><\/tr>\n<tr><td>m.473–475<\/td><td>Sermaye azaltımı: <b>7'şer gün<\/b> arayla <b>3<\/b> ilan; alacaklılar son ilandan itibaren <b>2 ay<\/b> içinde başvurur; aksi halde <b>2 yıl<\/b> içinde iptal davası<\/td><\/tr>\n<tr><td>m.513<\/td><td>İflasta YK üyeleri son <b>3 yılda<\/b> aldıkları uygun ücreti aşan paraları iade eder<\/td><\/tr>\n<tr><td>m.541<\/td><td>Tasfiyede alacaklılara birer hafta arayla <b>3<\/b> ilan<\/td><\/tr>\n<tr><td>m.1524, 1527, 1529<\/td><td>İnternet sitesi zorunluluğu; elektronik GK ve YK; halka açık şirketlerde kurumsal yönetim ilkelerini <b>SPK<\/b> belirler<\/td><\/tr>\n<\/table>\n<h3>SPKn m.17 ve Tebliğin kapsamı<\/h3>\n<ul>\n<li>SPKn m.17: ilkeler, uyum raporları, derecelendirme ve bağımsız üyelik esaslarını Kurul belirler; ilişkili taraf işlemlerinde bağımsız üye çoğunluğu onayı, onay yoksa KAP açıklaması ve GK; GK'da <b>toplantı nisabı aranmaz<\/b>, oy hakkı bulunanların <b>basit çoğunluğu<\/b> ile karar alınır. Yükümlülükler MKK'nın elektronik ortamıyla da yerine getirilebilir; halka açık bankalarda <b>BDDK<\/b>'nın uygun görüşü alınır.<\/li>\n<li>II-17.1 sayılı Tebliğ <b>3.1.2014<\/b> tarih ve 28871 sayılı Resmi Gazete'de yayımlandı. Üç başlık: kurumsal yönetim ilkeleri, ilişkili taraf işlemleri, diğer hükümler.<\/li>\n<li><b>Kapsam:<\/b> payları Borsa İstanbul'un Ulusal Pazar, İkinci Ulusal Pazar veya Kurumsal Ürünler Pazarı'nda (bugünkü adlarıyla Yıldız, Ana ve Alt Pazar) işlem gören halka açık ortaklıklar ve bu pazarlarda işlem görmek için başvuranlar. 32 Sayılı Karara göre <b>dışarıda yerleşik<\/b> ortaklıklar kapsam dışıdır.<\/li>\n<\/ul>\n<h3>Gruplandırma<\/h3>\n<ul>\n<li>Ortaklıklar sistemik önemlerine göre <b>piyasa değeri<\/b> ve <b>fiili dolaşımdaki payların piyasa değeri<\/b>ne göre 3 gruba ayrılır. <b>Mart, Haziran, Eylül, Aralık<\/b> son işlem günlerindeki ikinci seans kapanış fiyatları ve fiili dolaşım oranlarının ortalaması alınır; farklı pay gruplarının tamamı dikkate alınır.<\/li>\n<li>Hesaplama her yıl <b>Ocak<\/b> ayında Kurulca yapılır, liste <b>Kurul Bülteni<\/b>'nde ilan edilir. Eşikler yeniden değerlemeye tabi değildir.<\/li>\n<\/ul>\n<table>\n<tr><th>Grup<\/th><th>Kitaptaki eşik<\/th><\/tr>\n<tr><td>Birinci<\/td><td>Piyasa değeri ortalaması <b>3 milyar TL<\/b> ve fiili dolaşımdaki payların piyasa değeri ortalaması <b>750 milyon TL<\/b> üzerinde<\/td><\/tr>\n<tr><td>İkinci<\/td><td>Birinci grup dışında; piyasa değeri ortalaması <b>1 milyar TL<\/b> ve fiili dolaşım piyasa değeri <b>250 milyon TL<\/b> üzerinde<\/td><\/tr>\n<tr><td>Üçüncü<\/td><td>Diğer ortaklıklar<\/td><\/tr>\n<\/table>\n<ul>\n<li>Üst gruba çıkan ortaklık, hesaplamanın ait olduğu yılı <b>izleyen yıldan<\/b> itibaren yeni gruba tabi olur; uyum, ilan edilen Kurul kararını izleyen <b>ilk genel kurul<\/b> itibarıyla sağlanır. Alt gruba düşmek tabi olunan ilkeleri değiştirmez.<\/li>\n<li>İlk kez halka arz için başvuranlar liste ilan edilene kadar <b>üçüncü grup<\/b> yükümlülüklerine tabidir; payların işlem görmesinden sonraki ilk genel kurula kadar uyum sağlar.<\/li>\n<li><b>Tüm gruplar için zorunlu ilkeler:<\/b> 1.3.1, 1.3.5, 1.3.6, 1.3.9, 4.2.6, 4.3.1–4.3.6, 4.3.7 (üçüncü fıkra hariç), 4.3.8 (ikinci fıkra hariç), 4.5.1–4.5.4, 4.5.9–4.5.13, 4.6.2, 4.6.3. <b>Birinci grup<\/b> ayrıca 4.3.7'nin üçüncü ve 4.3.8'in ikinci fıkrasına uyar.<\/li>\n<\/ul>\n<h3>İstisnalar<\/h3>\n<ol>\n<li>Üçüncü gruptaki ortaklıklar ile sermayesinin en az <b>%51<\/b>'ine eşit olarak sahip, birbirinden bağımsız ve kontrolü sözleşmeyle eşit paylaşan iki kişiden oluşan iş ortaklıklarında (bankalar hariç), Kurul uygun görürse 4.3.4'teki bağımsız üye sayısı kriteri uygulanmaz; <b>2 bağımsız üye<\/b> yeterlidir.<\/li>\n<li>Kamu hizmeti lisansı/imtiyazı kullanan veya kamu kurumlarının imtiyazlı pay sahibi olduğu ortaklıklarda, Kurul uygun görürse 4.3.6'nın (ç) ve (g) bentleri aranmaz ve 4.3.7 uygulanmaz.<\/li>\n<li><b>Bankalar:<\/b> bağımsız üye sayısı <b>üçten az olmamak<\/b> kaydıyla bankanın takdirindedir; denetim komitesi üyeleri bağımsız üye sayılır ve onlarda 4.3.6 nitelikleri aranmaz. Denetim komitesinde olmayan bağımsız üyeler için, tamamı komitedeyse en az biri için nitelikler aranır.<\/li>\n<li><b>Yatırım ortaklıkları<\/b> 1.3.9 işlemlerini bağımsız üye çoğunluğu onayı olmasa da GK onayı aramadan yapabilir; ancak muhalefet gerekçesi KAP'ta açıklanır ve ilk GK'da ortaklara bilgi verilir.<\/li>\n<li>Haklı gerekçeyle, Kurulun uygun görüşüyle <b>en fazla 1 yıl<\/b> süreyle bağımsızlık kriterlerinden birini sağlamayan kişi bağımsız üye seçilebilir; uyulmayan kriter gerekçesiyle KAP'ta açıklanır.<\/li>\n<\/ol>\n<h3>Uyuma aykırılıkta tedbirler<\/h3>\n<ul>\n<li>Süresinde uyulmazsa Kurul uyumu sağlayacak kararları alır ve işlemleri <b>resen<\/b> yapar. Süre verilmemiş olsa bile teminattan muaf ihtiyati tedbir isteyebilir, dava açabilir; mahkemeye sunulan talebe bir <b>uyum önerisi<\/b> eklenir.<\/li>\n<li>Yeterli üye olmasına rağmen YK veya GK gerekli işlemi yapmazsa Kurul <b>30 gün<\/b> süre verir; süre sonunda bağımsızlık kriterini sağlayan gerekli sayıda bağımsız üyeyi <b>resen atar<\/b>. Yeni YK, Kurulun uygun görüşüyle esas sözleşmeyi değiştirip tescil ve ilan ettirir.<\/li>\n<\/ul>\n<h3>Uyum raporlaması ve sürdürülebilirlik<\/h3>\n<ul>\n<li>Zorunlu ilkeler uygulanır, diğerleri için \"<b>uygula, uygulamıyorsan açıkla<\/b>\". Tebliğ m.8: faaliyet raporunda ilkelerin uygulanıp uygulanmadığı, gerekçe, çıkar çatışmaları ve değişiklik planı açıklanır.<\/li>\n<li>SPK'nın <b>10.01.2019<\/b> tarih ve 2/49 sayılı kararıyla raporlama KAP'ta iki şablonla yapılır: <b>Kurumsal Yönetim Uyum Raporu (URF)<\/b> gönüllü ilkelere uyum için; <b>Kurumsal Yönetim Bilgi Formu (KYBF)<\/b> mevcut uygulamalar hakkında bilgi için. Faaliyet raporundaki anlatı bölümü ve uyum beyanı devam eder. Holdingler şablonları yalnız kendi tüzel kişilikleri için doldurur.<\/li>\n<li>URF yanıtları: <b>evet, kısmen, hayır, ilgisiz, muaf<\/b>. \"Kısmen\" veya \"hayır\" yanıtlarında açıklama <b>zorunludur<\/b>. \"İlgisiz\": şarta bağlı ilkede şartın oluşmaması; \"muaf\": Tebliğ istisnası.<\/li>\n<li>Şablonlar yıllık finansal raporların bildirim süresi içinde ve her halde GK'dan en az <b>3 hafta<\/b> önce KAP'ta doldurulur. Dönem içi önemli değişiklikler özel durum düzenlemeleri çerçevesinde güncelleme şablonuyla açıklanır.<\/li>\n<li><b>Sürdürülebilirlik:<\/b> 2/10/2020 tarih ve 31262 sayılı RG değişikliğiyle faaliyet raporlarında sürdürülebilirlik ilkelerine uyum açıklanır; uygulama <b>gönüllüdür<\/b>. 23.06.2022 tarih ve 34/977 sayılı kararla uyum raporu yıllık raporların bildirim süresi içinde ve GK'dan en az <b>3 hafta<\/b> önce KAP'ta açıklanır.<\/li>\n<li><b>Yeşil/Sürdürülebilir Borçlanma Aracı ve Kira Sertifikası Rehberi:<\/b> 24/02/2022 tarih ve 10/296 sayılı ilke kararı. Fon yalnız yeşil projelerin finansman veya yeniden finansmanında kullanılır; çerçeve belgesi için <b>ikinci taraf görüşü<\/b>; ihraççı <b>yılda bir<\/b> ve fonun tamamı kullanıldıktan sonra fon kullanım ve etki raporlarını KAP'ta ve sitesinde açıklar; tamamı kullanıldıktan sonra doğrulama görüşü alınır.<\/li>\n<\/ul>\n<h3>İlişkili taraf işlemleri (Tebliğ)<\/h3>\n<ul>\n<li><b>Kapsam:<\/b> payları borsada işlem gören ortaklıklar ve bağlı ortaklıkları. İşlemden önce esasları belirleyen <b>YK kararı<\/b> alınır.<\/li>\n<li><b>Yaygın ve süreklilik arz etmeyen işlemler:<\/b> işlem tutarının; son tablolara göre <b>varlık toplamına<\/b>, son yıllık <b>hasılata<\/b> veya YK kararından önceki <b>6 aylık<\/b> ağırlıklı ortalama fiyatlarla hesaplanan <b>şirket değerine<\/b> oranı (satışlarda net defter değeri yüksekse o esas alınır):<\/li>\n<\/ul>\n<table>\n<tr><th>Oran<\/th><th>Sonuç<\/th><\/tr>\n<tr><td><b>%5'ten fazla<\/b><\/td><td>İşlem öncesi Kurulca belirlenen kuruluşa <b>değerleme<\/b> yaptırılır (konu pay ve devir borsada ise rapor aranmaz)<\/td><\/tr>\n<tr><td><b>%10'dan fazla<\/b><\/td><td>Değerlemeye ek olarak YK kararında <b>bağımsız üyelerin çoğunluğunun onayı<\/b>; ilişkili taraf YK üyeleri oy kullanamaz. Onay yoksa KAP'ta açıklanır ve işlem GK'ya sunulur; GK'da taraflar ve ilişkililer oy kullanamaz, toplantı nisabı aranmaz, basit çoğunlukla karar alınır<\/td><\/tr>\n<\/table>\n<ul>\n<li>Hasılatın %5'ine isabet eden tutar özkaynakların <b>binde birinden<\/b> düşükse hasılat oranı uygulanmaz. Bankalarda hasılat, ana faaliyetlerden elde edilen <b>faiz geliri<\/b>dir. Oran negatif veya anlamsız yüksekse dikkate alınmaz ve KAP'ta açıklanır. Kiralamada indirgenmiş nakit akışıyla bulunan net bugünkü değer esas alınır.<\/li>\n<li>Karar verilince ilişkiler, işlemin niteliği, değerleme varsayımları ve sonuçlarının özeti ve sonuçlara uyulmadıysa gerekçesi KAP'ta açıklanır. Kurul oranlardan bağımsız olarak değerleme isteyebilir.<\/li>\n<li><b>Yaygın ve süreklilik arz eden işlemler:<\/b> kapsam ve şartlar YK kararıyla belirlenir; bir hesap dönemindeki tutarın alışlarda <b>satışların maliyetine<\/b>, satışlarda <b>hasılata<\/b> oranı <b>%10<\/b>'u aşacaksa YK işlemlerin piyasa koşullarıyla karşılaştırıldığı bir <b>rapor<\/b> hazırlar ve tamamını veya sonucunu KAP'ta açıklar. Aynı nitelikteki işlemler toplu değerlendirilir. Bağımsız üye çoğunluğu onaylamazsa muhalefet gerekçesi KAP'ta açıklanır.<\/li>\n<li><b>İstisnalar:<\/b> temettü, rüçhan hakkı kullanımı, yönetici mali hakları; yatırım ortaklıklarının ilişkili taraflarından aldığı portföy yönetimi, yatırım danışmanlığı ve aracılık hizmetleri; bankaların ve finansal kuruluşların olağan faaliyetleri.<\/li>\n<\/ul>\n<h3>Yatırımcı ilişkileri bölümü<\/h3>\n<ul>\n<li>Genel müdür, genel müdür yardımcısı veya muadili idari sorumluya <b>doğrudan bağlı<\/b> çalışır; faaliyetleri hakkında YK'ya <b>yılda en az bir<\/b> rapor sunar.<\/li>\n<li>Bölüm yöneticisi <b>SPF İleri Düzey<\/b> ve <b>Kurumsal Yönetim Derecelendirme Uzmanlığı<\/b> lisanslarına sahip olur, MKYO'lar hariç <b>tam zamanlı<\/b> yönetici olarak çalışır ve <b>kurumsal yönetim komitesi<\/b> üyesi olur. Yönetici ve en az bir çalışanın iletişim bilgileri KAP'ta yayımlanır.<\/li>\n<li>Yönetici ayrılırsa <b>30 gün<\/b> içinde yenisi görevlendirilir.<\/li>\n<li><b>Üçüncü grup istisnası:<\/b> lisanslardan herhangi biri veya yalnız <b>SPF Temel Düzey<\/b> lisansı yeterlidir. Görevler birden çok birimce de yürütülebilir; en çok görevden sorumlu yönetici bölüm yöneticisi sayılır.<\/li>\n<li>İlke kararı 17.4 (27.02.2015): uygun lisanslı bir kişi grup şirketleri içinde <b>ikinci grupta en fazla 5<\/b> şirkette veya grup şartı aranmaksızın <b>üçüncü grupta en fazla 5<\/b> şirkette bölüm yöneticisi olabilir.<\/li>\n<li>Görevleri: yazışma kayıtlarının tutulması; pay sahiplerinin yazılı bilgi taleplerinin yanıtlanması; GK dokümanlarının hazırlanması; mevzuat yükümlülüklerinin izlenmesi.<\/li>\n<li>İlk kez halka arz olanlar bu yükümlülükleri işlem görmeye başlamadan itibaren <b>6 ay<\/b> içinde yerine getirir.<\/li>\n<\/ul>\n<h3>Teminat, rehin, ipotek ve kefalet (TRİK)<\/h3>\n<ul>\n<li>Payları borsada işlem gören ortaklıklar ve bağlı ortaklıkları; kendi tüzel kişilikleri, tam konsolide ettikleri ortaklıklar ve <b>olağan ticari faaliyet<\/b> amacıyla üçüncü kişiler lehine verilenler dışında TRİK veremez. Doğrudan iştirak ve iş ortaklıkları lehine <b>katılım payı oranında<\/b> verilebilir.<\/li>\n<li>İlke kararı 17.5 (27.01.2016): fon temin eden grup şirketi lehine aktarılan fonla sınırlı TRİK ve halka kapalı bağlı ortaklıkların halka açık ana ortaklık lehine TRİK vermesi aykırılık oluşturmaz.<\/li>\n<li>Olağan ticari faaliyet amacıyla üçüncü kişiler lehine TRİK kararlarında <b>bağımsız üyelerin çoğunluğunun onayı<\/b> aranır; onay yoksa muhalefet gerekçesi KAP'ta açıklanır. Üçüncü kişiler lehine TRİK ve elde edilen gelirler olağan GK'da <b>ayrı gündem maddesi<\/b> olur.<\/li>\n<li>İlk halka arz olanlar aykırı TRİK'leri, işlem görmeye başladıkları yılı izleyen <b>dördüncü yılın sonuna<\/b> kadar sıfıra indirir. Yatırım ortaklıkları, bankalar ve finansal kuruluşlar bu maddeye tabi değildir.<\/li>\n<\/ul>\n<h3>SPK kurumsal yönetim ilkeleri (öne çıkanlar)<\/h3>\n<h4>Pay sahipleri<\/h4>\n<ul>\n<li><b>1.3.1:<\/b> GK ilanıyla birlikte, ilan ve toplantı günleri hariç en az <b>3 hafta<\/b> önce internet sitesi ve KAP'ta: toplam pay ve oy hakları, imtiyazlar; önemli yönetim/faaliyet değişiklikleri; YK seçimi varsa adayların özgeçmişi, son <b>10 yılda<\/b> yürüttüğü görevler, bağımsızlık durumu; reddedilen gündem önerileri ve gerekçeleri; esas sözleşme değişikliğinin eski ve yeni hali.<\/li>\n<li>Gündemde \"diğer\", \"çeşitli\" ibarelerinden kaçınılır. Toplantı, esas sözleşmede yer almak kaydıyla pay sahiplerinin çoğunlukta olduğu yerde yapılır.<\/li>\n<li><b>1.3.5:<\/b> GK'da cevaplanamayan sorular en geç <b>15 gün<\/b> içinde yazılı cevaplanır; tüm soru ve cevaplar GK'dan sonraki <b>30 gün<\/b> içinde internet sitesinde duyurulur.<\/li>\n<li><b>1.3.6:<\/b> kontrol sahibi pay sahipleri, YK üyeleri, idari sorumlular ve eş ile <b>ikinci dereceye kadar<\/b> kan ve sıhri hısımlarının çıkar çatışması yaratan işlemleri ayrı gündem maddesi olur.<\/li>\n<li><b>1.3.9 Önemli işlemler:<\/b> varlık/hizmet alım-satımı ve yükümlülük transferinde oran <b>%10<\/b>'u aşarsa veya bir faaliyet durdurulursa YK kararının icrası için bağımsız üyelerin çoğunluğunun onayı gerekir; oybirliği yoksa karar ve muhalefet şerhi KAP'ta açıklanır; onay yoksa GK'ya gider. Hasılatın %10'u özkaynakların <b>binde ikisinden<\/b> düşükse hasılat oranı uygulanmaz.<\/li>\n<li>Bağış politikası GK onayına sunulur; GK'lar söz hakkı olmaksızın medya dahil kamuya açık yapılabilir. Oy hakkında imtiyazdan kaçınılır. Karşılıklı iştirak hakimiyet getiriyorsa zorunlu haller dışında oy kullanılmaz.<\/li>\n<li><b>1.5.2:<\/b> azlık hakları esas sözleşmeyle sermayenin <b>yirmide birinden<\/b> daha düşük orana sahiplere de tanınabilir. Kâr dağıtım politikası GK onayına sunulur; kâr dağıtılmayacaksa nedenleri gündemde açıklanır.<\/li>\n<\/ul>\n<h4>Kamuyu aydınlatma ve menfaat sahipleri<\/h4>\n<ul>\n<li>İnternet sitesinde en az son <b>5 yıllık<\/b> bilgiler bulunur. Dolaylı ve karşılıklı iştiraklerden arındırılmış olarak <b>%5'ten yüksek<\/b> paya sahip gerçek kişi pay sahipleri en az <b>6 ayda bir<\/b> güncellenerek açıklanır.<\/li>\n<li>Özel durum ve dipnotlar hariç finansal tablo bildirimleri <b>İngilizce<\/b> olarak da eş anlı KAP'ta açıklanır.<\/li>\n<li>Faaliyet raporunda: YK üyelerinin şirket dışı görevleri ve bağımsızlık beyanları, komiteler, YK toplantı sayısı ve katılım, önemli mevzuat değişiklikleri, önemli davalar, danışmanlık ve derecelendirme kurumlarıyla çıkar çatışmaları, <b>%5'i aşan<\/b> karşılıklı iştirakler, sosyal sorumluluk faaliyetleri.<\/li>\n<li>Menfaat sahipleri: çalışanlar, alacaklılar, müşteriler, tedarikçiler, sendikalar, sivil toplum kuruluşları. Çalışanlara yönelik <b>tazminat politikası<\/b> internet sitesinde açıklanır; etik dışı işlemler kurumsal yönetim veya denetim komitesine iletilebilir. İnsan kaynaklarında eşit fırsat, <b>halefiyet planlaması<\/b>, yazılı alım kriterleri, ayrımcılık yasağı, pay edindirme planları.<\/li>\n<\/ul>\n<h4>Yönetim kurulu<\/h4>\n<ul>\n<li>Risk yönetimi ve iç kontrol sistemleri <b>yılda en az bir<\/b> kez gözden geçirilir. YK başkanı ile icra başkanı/genel müdürün yetkileri ayrıştırılır; kimse tek başına sınırsız yetkiyle donatılmaz. <b>4.2.6:<\/b> başkan ve genel müdür aynı kişiyse gerekçesiyle KAP'ta açıklanır.<\/li>\n<li><b>4.2.8:<\/b> YK üyelerinin kusurlarıyla verebileceği zarar sermayenin <b>%25<\/b>'ini aşan bedelle sigortalanır ve KAP'ta açıklanır.<\/li>\n<li><b>4.3.1:<\/b> YK en az <b>5 üye<\/b>. <b>4.3.2:<\/b> üyelerin çoğunluğu <b>icrada görevli olmayan<\/b> üyedir. <b>4.3.4:<\/b> bağımsız üye sayısı toplamın <b>üçte birinden<\/b> az olamaz; küsurat <b>izleyen tam sayıya<\/b> yuvarlanır; her durumda en az <b>2<\/b>. <b>4.3.5:<\/b> görev süresi <b>3 yıla kadar<\/b>, tekrar seçilebilir.<\/li>\n<\/ul>\n<p><b>4.3.6 Bağımsızlık kriterleri (hepsi aranır):<\/b><\/p>\n<ul>\n<li>Son <b>5 yılda<\/b> şirket, kontrol ettiği/önemli etki sahibi olduğu ortaklıklar ve kontrol sahibi ortaklarla kendisi, eşi ve ikinci dereceye kadar hısımları arasında önemli yöneticilik istihdamı, sermaye/oy/imtiyazlı payların <b>%5'inden fazlasına<\/b> sahiplik veya önemli ticari ilişki olmaması.<\/li>\n<li>Son <b>5 yılda<\/b> şirketin denetim, derecelendirme, danışmanlık dahil önemli hizmet/ürün aldığı veya sattığı şirketlerde ortak (<b>%5 ve üzeri<\/b>), önemli yönetici veya YK üyesi olmaması.<\/li>\n<li>Mesleki eğitim, bilgi ve tecrübe; üniversite öğretim üyeliği hariç kamuda <b>tam zamanlı<\/b> çalışmama; Gelir Vergisi Kanununa göre <b>Türkiye'de yerleşik<\/b> olma; güçlü etik standart; yeterli zaman ayırma.<\/li>\n<li>Şirketin YK'sında son <b>10 yıl<\/b> içinde <b>6 yıldan fazla<\/b> üyelik yapmamış olma.<\/li>\n<li>Şirketin veya kontrol sahibi ortakların kontrolündeki şirketlerin <b>üçten fazlasında<\/b> ve toplamda borsada işlem gören şirketlerin <b>beşten fazlasında<\/b> bağımsız üye olmama.<\/li>\n<li>Tüzel kişi YK üyesi adına tescil ve ilan edilmemiş olma.<\/li>\n<\/ul>\n<ul>\n<li><b>Aday süreci:<\/b> aday gösterme komitesi değerlendirir ve raporlar; aday bağımsızlık beyanını aday gösterildiği sırada komiteye verir; YK listeyi GK'dan en az <b>60 gün<\/b> önce Kurula gönderir; Kurul varsa olumsuz görüşünü <b>30 gün<\/b> içinde bildirir; olumsuz görüş alan aday GK'ya sunulamaz. Liste en geç GK ilanıyla KAP'ta açıklanır.<\/li>\n<li><b>4.3.8 Bağımsızlığın kaybı:<\/b> durum derhal YK'ya ve Kurula iletilir, KAP'ta açıklanır; üye ilke olarak <b>istifa eder<\/b>. YK boşalmadan itibaren <b>30 gün<\/b> içinde aday listesini Kurula gönderir, Kurul olumsuz görüşünü <b>20 gün<\/b> içinde bildirir; seçilenler ilk GK'ya kadar görev yapar. İstifa ve görev yapamama halinde de geçerlidir.<\/li>\n<li><b>4.3.9:<\/b> kadın üye oranı için <b>%25'ten az olmamak<\/b> kaydıyla hedef oran ve zaman belirlenir. <b>4.3.10:<\/b> denetim komitesi üyelerinden en az biri denetim/muhasebe ve finans alanında <b>5 yıllık<\/b> tecrübeye sahip olmalıdır.<\/li>\n<li>Her YK üyesinin <b>bir oy<\/b> hakkı vardır; elektronik YK toplantısı imkanı sağlanır; muhalif üye karşı oy gerekçesini karar zaptına geçirir.<\/li>\n<\/ul>\n<h4>Komiteler<\/h4>\n<ul>\n<li><b>4.5.1:<\/b> denetimden sorumlu komite, riskin erken saptanması komitesi, kurumsal yönetim komitesi, aday gösterme komitesi, ücret komitesi (denetim, riskin erken saptanması ve ücret komiteleri için <b>bankalar hariç<\/b>). Ayrı aday gösterme ve ücret komitesi kurulamazsa bu görevleri <b>kurumsal yönetim komitesi<\/b> yürütür.<\/li>\n<li><b>4.5.3:<\/b> en az <b>2 üye<\/b>; iki üyeliyse ikisi de, fazlaysa çoğunluğu icrada görevli olmayan üye; komite başkanları <b>bağımsız üyeler<\/b> arasından seçilir; <b>denetim komitesinin tüm üyeleri bağımsız<\/b>. YK üyesi olmayan uzmanlar denetim komitesi dışındaki komitelerde üye olabilir.<\/li>\n<li><b>4.5.4:<\/b> icra başkanı/genel müdür komitelerde <b>görev alamaz<\/b>. Bir üyenin birden fazla komitede görev almamasına özen gösterilir. Bağımsız uzman görüşü bedeli şirketçe karşılanır.<\/li>\n<li><b>Denetim komitesi:<\/b> muhasebe sistemi, finansal bilgilerin açıklanması, bağımsız denetim ve iç kontrolü gözetir; bağımsız denetim kuruluşu ve hizmetleri komitece belirlenip YK onayına sunulur; en az <b>3 ayda bir<\/b>, yılda en az <b>4 kez<\/b> toplanır.<\/li>\n<li><b>Riskin erken saptanması komitesi:<\/b> risk yönetim sistemlerini <b>yılda en az bir<\/b> kez gözden geçirir. <b>Kurumsal yönetim komitesi<\/b> ilkelere uyumu izler ve yatırımcı ilişkileri bölümünü gözetir. <b>Aday gösterme komitesi<\/b> YK ve idari sorumlu adaylarını belirler, YK yapısını değerlendirir. <b>Ücret komitesi<\/b> ücretlendirme ilkelerini belirler ve önerilerde bulunur.<\/li>\n<\/ul>\n<h4>Mali haklar<\/h4>\n<ul>\n<li>Ücretlendirme esasları yazılı hale getirilir ve GK'da <b>ayrı gündem maddesiyle<\/b> pay sahiplerinin bilgisine sunulur; ücret politikası internet sitesinde yer alır.<\/li>\n<li><b>4.6.3:<\/b> bağımsız üyelerin ücretinde <b>kâr payı, pay opsiyonu veya performansa dayalı ödeme<\/b> kullanılamaz; ücret bağımsızlığı koruyacak düzeyde olmalıdır.<\/li>\n<li>Şirket YK üyelerine ve idari sorumlulara <b>borç veremez, kredi kullandıramaz<\/b>, kefalet veremez; ancak bireysel kredi veren kuruluşlar herkese uyguladıkları şartlarla kredi verebilir. Ücretler faaliyet raporunda <b>kişi bazında<\/b> açıklanır.<\/li>\n<\/ul>", "sorular": [{"q": "Kurumsal yönetimin ana ilkelerinden hangisi yalnızca faaliyet sonrasını kapsar?", "o": ["Şeffaflık", "Hesap verebilirlik", "Adillik", "Sorumluluk", "Eşitlik"], "a": 1, "e": "Şeffaflık faaliyet öncesi, süreci ve sonrasını kapsarken hesap verebilirlik yalnızca faaliyet sonrasını kapsar."}, {"q": "Kıta Avrupası kurumsal yönetim sisteminin özellikleri arasında hangisi yer almaz?", "o": ["Hakim ortağın ağırlıklı olması", "Bankaların veya finans dışı kuruluşların ana ortak olması", "Sermaye piyasalarında şeffaflığın az olması", "Ana hissedarların bireysel emeklilik ve yatırım fonları olması", "Yönetimin onaylamadığı satın almaların olmaması"], "a": 3, "e": "Emeklilik ve yatırım fonlarının ana hissedar olması Anglo-Sakson sistemine özgüdür."}, {"q": "TTK'ya göre halka açık anonim şirketlerde azınlık haklarını kullanabilmek için sermayenin en az ne kadarına sahip olmak gerekir?", "o": ["Yirmide biri", "Onda biri", "Dörtte biri", "Üçte biri", "Yüzde biri"], "a": 0, "e": "Halka kapalı şirketlerde onda bir, halka açık şirketlerde yirmide bir (%5) azınlık oranıdır."}, {"q": "TTK m.437'ye göre finansal tablolar ve yıllık faaliyet raporu genel kurul toplantısından en az kaç gün önce pay sahiplerinin incelemesine hazır bulundurulur?", "o": ["7", "21", "15", "30", "10"], "a": 2, "e": "Bu belgeler toplantıdan en az on beş gün önce merkez ve şubelerde hazır bulundurulur."}, {"q": "TTK'ya göre bir paya en çok kaç oy hakkı tanınabilir?", "o": ["5", "10", "20", "25", "15"], "a": 4, "e": "TTK m.479: bir paya en çok on beş oy hakkı tanınabilir."}, {"q": "TTK m.378'e göre riskin erken saptanması komitesinin kurulması hangi şirketler için zorunludur?", "o": ["Tüm anonim şirketler", "Pay senetleri borsada işlem gören şirketler", "Yalnızca bankalar", "Sermayesi 1 milyon TL'yi aşan şirketler", "Yalnızca holding şirketleri"], "a": 1, "e": "Borsada işlem gören şirketlerde zorunludur; diğerlerinde denetçi yazılı bildirirse kurulur ve komite YK'ya iki ayda bir rapor verir."}, {"q": "II-17.1 sayılı Tebliğ'e göre ortaklıkların gruplandırılmasında hangi aylara ait veriler kullanılır?", "o": ["Yalnızca Aralık ayının son işlem günü", "Ocak ve Temmuz aylarının ilk işlem günleri", "Her ayın son işlem günü", "Mart, Haziran, Eylül ve Aralık aylarının son işlem günleri", "Haziran ve Aralık aylarının son işlem günleri"], "a": 3, "e": "Bu dört ayın son işlem günlerindeki ikinci seans kapanış fiyatları ve fiili dolaşım oranlarının ortalaması esas alınır; hesaplama Ocak'ta yapılır."}, {"q": "Kitapta yer alan eşiklere göre birinci gruba dahil olmak için piyasa değeri ortalaması ve fiili dolaşımdaki payların piyasa değeri ortalaması hangi tutarları aşmalıdır?", "o": ["3 milyar TL ve 750 milyon TL", "1 milyar TL ve 250 milyon TL", "5 milyar TL ve 1 milyar TL", "3 milyar TL ve 1 milyar TL", "750 milyon TL ve 250 milyon TL"], "a": 0, "e": "Birinci grup 3 milyar TL ve 750 milyon TL, ikinci grup 1 milyar TL ve 250 milyon TL eşiklerini kullanır."}, {"q": "Paylarını ilk kez halka arz etmek için Kurula başvuran bir ortaklık, gruplara ilişkin liste ilan edilene kadar hangi grubun yükümlülüklerine tabidir?", "o": ["Birinci grup", "İkinci grup", "Üçüncü grup", "Hiçbir grubun", "Kurulun belirleyeceği grup"], "a": 2, "e": "Bu ortaklıklar liste ilan edilene kadar üçüncü grup yükümlülüklerine tabidir."}, {"q": "Bankalarda bağımsız yönetim kurulu üyesi sayısı ile ilgili hangisi doğrudur?", "o": ["Toplam üye sayısının üçte biri olmalıdır", "En az iki olmalıdır", "Bankalarda bağımsız üye aranmaz", "BDDK tarafından belirlenir", "Üçten az olmamak kaydıyla bankanın takdirindedir"], "a": 4, "e": "Bankalarda bağımsız üye sayısı üçten az olmamak kaydıyla bankanın ihtiyarındadır; denetim komitesi üyeleri bağımsız üye kabul edilir."}, {"q": "Zorunlu kurumsal yönetim ilkelerine uyum için gerekli işlemleri yapmayan ortaklığa Kurul ne kadar süre verir ve süre sonunda ne yapabilir?", "o": ["60 gün verir; şirketin işlemlerini durdurur", "30 gün verir; gerekli sayıda bağımsız üyeyi resen atar", "15 gün verir; idari para cezası verir", "3 ay verir; şirketi borsadan çıkarır", "1 yıl verir; yönetim kurulunu görevden alır"], "a": 1, "e": "Kurul 30 gün süre verir; uyum sağlanmazsa bağımsızlık kriterini sağlayan gerekli sayıda bağımsız üyeyi resen atar."}, {"q": "URF şablonunda hangi yanıtların verilmesi halinde açıklama yapılması zorunludur?", "o": ["Evet veya kısmen", "İlgisiz veya muaf", "Yalnızca muaf", "Kısmen veya hayır", "Yalnızca evet"], "a": 3, "e": "Kısmen veya hayır yanıtlarında tavsiye edilen uygulamadan nasıl ayrıldığının açıklanması zorunludur."}, {"q": "Bir ilişkili taraf işleminde işlem tutarının şirketin varlık toplamına oranı %7'dir. Tebliğ'e göre ne gerekir?", "o": ["Değerleme yaptırılması; bağımsız üye onayı aranmaz", "Hem değerleme hem bağımsız üye çoğunluğunun onayı", "Yalnızca genel kurul onayı", "Hiçbir ek yükümlülük doğmaz", "Yalnızca bağımsız üye onayı"], "a": 0, "e": "%5'i aşan işlemlerde değerleme zorunludur; bağımsız üye çoğunluğu onayı %10'u aşan işlemlerde aranır."}, {"q": "İlişkili taraf işlemlerinde bağımsız üye çoğunluğu onaylamadığı için işlemin sunulduğu genel kurulda hangi kural geçerlidir?", "o": ["Sermayenin dörtte birinin varlığı gerekir", "Katılanların üçte iki çoğunluğu gerekir", "Toplantı nisabı aranmaz, oy hakkı bulunanların basit çoğunluğu ile karar alınır; taraflar oy kullanamaz", "Tüm pay sahipleri oy kullanabilir", "Oybirliği gerekir"], "a": 2, "e": "SPKn m.17/3 ve Tebliğ: işlemin tarafları ve ilişkililer oy kullanamaz, toplantı nisabı aranmaz, basit çoğunlukla karar alınır."}, {"q": "Yaygın ve süreklilik arz eden ilişkili taraf alış işlemlerinde hangi oranın %10'u aşması halinde yönetim kurulu rapor hazırlar?", "o": ["İşlem tutarının özkaynaklara oranı", "İşlem tutarının piyasa değerine oranı", "İşlem tutarının net kâra oranı", "İşlem tutarının dönen varlıklara oranı", "Bir hesap dönemindeki işlem tutarının satışların maliyetine oranı"], "a": 4, "e": "Alışlarda satışların maliyetine, satışlarda hasılata oran %10'u aşacaksa rapor hazırlanır ve KAP'ta açıklanır."}, {"q": "Yatırımcı ilişkileri bölümü yöneticisi görevinden ayrılırsa yeni yönetici ne kadar sürede görevlendirilmelidir?", "o": ["15 gün", "30 gün", "60 gün", "3 ay", "6 ay"], "a": 1, "e": "Bölüm yöneticisinin ayrılması halinde 30 gün içinde yeni bir kişi görevlendirilir."}, {"q": "Üçüncü grupta yer alan bir ortaklığın yatırımcı ilişkileri bölümü yöneticisi için hangi lisans tek başına yeterlidir?", "o": ["Türev Araçlar Lisansı", "Gayrimenkul Değerleme Lisansı", "Kredi Derecelendirme Lisansı", "Sermaye Piyasası Faaliyetleri Temel Düzey Lisansı", "Hiçbir lisans aranmaz"], "a": 3, "e": "Üçüncü gruptakilerde İleri Düzey veya Kurumsal Yönetim Derecelendirme lisansından biri ya da yalnızca Temel Düzey lisansı yeterlidir."}, {"q": "Payları ilk kez borsada işlem görmeye başlayan bir ortaklık, Tebliğ'e aykırı mevcut teminat, rehin, ipotek ve kefaletlerini ne zamana kadar sıfıra indirmelidir?", "o": ["İşlem görmeye başladığı yılı izleyen dördüncü yılın sonuna kadar", "İşlem görmeye başladığı tarihten itibaren 6 ay içinde", "İlk genel kurula kadar", "İzleyen yılın sonuna kadar", "İşlem görmeye başladığı yılı izleyen ikinci yılın sonuna kadar"], "a": 0, "e": "Aykırı TRİK'ler işlem görmeye başlanan yılı izleyen dördüncü yılın sonuna kadar sıfır düzeyine indirilmelidir."}, {"q": "Kurumsal yönetim ilkelerine göre genel kurulda sorulan ancak hemen cevaplanamayan sorular en geç ne kadar sürede yazılı olarak cevaplanır?", "o": ["7 gün", "30 gün", "15 gün", "10 gün", "3 hafta"], "a": 2, "e": "İlke 1.3.5: en geç 15 gün içinde yazılı cevap; tüm soru ve cevaplar GK'dan sonra 30 gün içinde internet sitesinde duyurulur."}, {"q": "İlke 1.3.9 kapsamındaki önemli işlemlerde hasılata dayalı oran hangi durumda uygulanabilir kabul edilmez?", "o": ["Hasılat bir önceki yıla göre azalmışsa", "Şirket zarar etmişse", "Hasılatın %5'i özkaynakların yüzde birinden düşükse", "İşlem yurt dışında yapılmışsa", "Hasılatın %10'una isabet eden tutar toplam özkaynakların binde ikisinden düşükse"], "a": 4, "e": "1.3.9'da hasılatın %10'u özkaynakların binde ikisinden düşükse hasılat oranı uygulanmaz; ilişkili taraf maddesinde bu ölçüt %5 ve binde birdir."}, {"q": "Yönetim kurulu 8 üyeden oluşan ve istisnaya tabi olmayan bir ortaklıkta en az kaç bağımsız üye bulunmalıdır?", "o": ["2", "3", "4", "1", "5"], "a": 1, "e": "8/3 = 2,67; küsurat izleyen tam sayıya yuvarlanır, en az 3 bağımsız üye gerekir."}, {"q": "Aşağıdakilerden hangisi bağımsız yönetim kurulu üyeliği kriterlerine aykırıdır?", "o": ["Üniversitede tam zamanlı öğretim üyesi olmak", "Toplam 3 borsa şirketinde bağımsız üye olmak", "Şirketin sermayesinde %3 paya sahip olmak", "Şirketin yönetim kurulunda son 10 yıl içinde 7 yıl üyelik yapmış olmak", "Gelir Vergisi Kanununa göre Türkiye'de yerleşik olmak"], "a": 3, "e": "Son on yılda altı yıldan fazla YK üyeliği bağımsızlığı ortadan kaldırır; üniversite öğretim üyeliği istisnadır, %5'i aşmayan pay sahipliği engel değildir."}, {"q": "Bağımsız üye aday listesi ile ilgili süreler hakkında hangisi doğrudur?", "o": ["Liste genel kuruldan en az 60 gün önce Kurula gönderilir; Kurul olumsuz görüşünü 30 gün içinde bildirir", "Liste genel kuruldan en az 30 gün önce gönderilir; Kurul 15 gün içinde görüş bildirir", "Liste genel kuruldan en az 21 gün önce gönderilir; Kurul 20 gün içinde görüş bildirir", "Liste genel kurul ilanıyla gönderilir; Kurul görüş bildirmez", "Liste genel kuruldan en az 90 gün önce gönderilir; Kurul 60 gün içinde görüş bildirir"], "a": 0, "e": "4.3.7: liste GK'dan en az 60 gün önce Kurula gönderilir, Kurul olumsuz görüşünü 30 gün içinde bildirir. Bağımsızlığın kaybında ise 30 gün ve 20 gün süreleri uygulanır."}, {"q": "Kurumsal yönetim ilkelerine göre yönetim kurulu bünyesindeki komiteler hakkında hangisi yanlıştır?", "o": ["Komiteler en az iki üyeden oluşur", "Komite başkanları bağımsız üyeler arasından seçilir", "İcra başkanı veya genel müdür denetim komitesi dışındaki komitelerde görev alabilir", "Denetimden sorumlu komitenin tüm üyeleri bağımsız olmalıdır", "Denetimden sorumlu komite yılda en az dört kez toplanır"], "a": 2, "e": "İlke 4.5.4: icra başkanı/genel müdür hiçbir komitede görev alamaz."}, {"q": "Bağımsız yönetim kurulu üyelerinin ücretlendirilmesinde hangisi kullanılabilir?", "o": ["Kâr payı", "Pay opsiyonları", "Şirket performansına dayalı ödeme planı", "Satış primine bağlı ikramiye", "Bağımsızlıklarını koruyacak düzeyde sabit ücret"], "a": 4, "e": "İlke 4.6.3: bağımsız üyelerde kâr payı, pay opsiyonu veya performansa dayalı ödeme kullanılamaz; ücret bağımsızlığı koruyacak düzeyde olmalıdır."}]}, {"id": 7, "kisa": "GYO", "baslik": "Gayrimenkul Yatırım Ortaklıkları (III-48.1)", "ozet": "GYO ve altyapı GYO'nun kuruluş şartları, halka arz süreleri, portföy sınırları, yasak işler ve değerleme kuralları.", "notlar": "<h3>Tanım ve iki GYO türü<\/h3>\n<ul>\n<li><b>GYO:<\/b> gayrimenkul, gayrimenkul projesi, gayrimenkule dayalı hak, altyapı yatırım ve hizmetleri, sermaye piyasası araçları, Takasbank para piyasası ve ters repo, TL vadeli mevduat/katılma hesabı, döviz vadeli-vadesiz mevduat/özel cari-katılma hesabı, iştirakler ve Kurulca belirlenecek diğer varlıklardan oluşan portföyü işletmek amacıyla pay ihraç etmek üzere kurulan sermaye piyasası kurumu (SPKn m.48 çerçevesinde).<\/li>\n<li>İki yapı vardır: (1) gayrimenkul, gayrimenkule dayalı hak ve projelere yatırım yapan GYO'lar; (2) <b>münhasıran altyapı yatırım ve hizmetlerinden<\/b> oluşan portföyü işleten GYO'lar (altyapı GYO). Altyapı GYO'nun yalnız bu faaliyet için kurulması/dönüşmesi ve esas sözleşmede buna hüküm bulunması zorunludur.<\/li>\n<li><b>Altyapı şirketi:<\/b> 3996 sayılı Yap-İşlet-Devret Kanunu kapsamındaki şirket, diğer kamu-özel işbirliği veya özelleştirme modellerinde altyapı hizmeti yürüten şirket ya da kamu idarelerinin altyapı hizmetleri için kurulan şirket.<\/li>\n<li><b>Karşılıklı kısıt:<\/b> Altyapı GYO, altyapıyla ilişkisiz gayrimenkul/proje/haklara yatırım yapamaz. Diğer GYO'lar, ana faaliyetlerine bağlı ve arızi nitelikte olanlar dışında altyapı yatırımlarına yatırım yapamaz.<\/li>\n<li>Belirli bir alan, proje, gayrimenkul veya altyapı yatırımı için kurulan GYO'larda aktif toplamın <b>en az %75'i<\/b> bu faaliyetten oluşur ve unvanda buna ilişkin ifade yer alır.<\/li>\n<li>\"Aktif toplam\" aksi belirtilmedikçe <b>konsolide olmayan/bireysel<\/b> finansal tablolardaki aktif toplamdır.<\/li>\n<\/ul>\n\n<h3>Kuruluş ve dönüşüm şartları<\/h3>\n<p>GYO olarak kurulmak ya da mevcut anonim ortaklığın esas sözleşmesini değiştirerek GYO'ya dönüşmek mümkündür. Altyapı GYO'ya <b>yalnızca altyapı şirketleri<\/b> dönüşebilir ve esas sözleşmede aktifin asgari %75'inin altyapıdan oluşacağı yazılır.<\/p>\n<ul>\n<li><b>Kayıtlı sermayeli<\/b> anonim ortaklık olmak (ya da kayıtlı sisteme geçmek için başvurmak).<\/li>\n<li><b>Asgari sermaye:<\/b> kuruluşta başlangıç sermayesi; dönüşümde ödenmiş/çıkarılmış sermaye ve özsermayenin her biri <b>1.000.000.000 TL<\/b>; altyapı GYO'da <b>1.500.000.000 TL<\/b>.<\/li>\n<li><b>Nakit şartı:<\/b> sermaye 2 milyar TL'den azsa payların <b>en az %10'u<\/b>; 2 milyar TL ve üzerindeyse sermayenin <b>200 milyon TL<\/b>'lik (altyapı GYO'da <b>150 milyon TL<\/b>) kısmı nakit karşılığı çıkarılmış ve tamamı ödenmiş olmalı. Dönüşümde, son bağımsız denetimli bireysel tablolarda dönen varlıklardaki nakit ve nakit benzerleri ile finansal yatırımların toplamı bu tutara ulaşması da yeterli.<\/li>\n<li>Unvanda <b>\"Gayrimenkul Yatırım Ortaklığı\"<\/b> ibaresi.<\/li>\n<li>Genel müdürün en geç tescil tarihinde atanmış olması; altyapı GYO'da tescili izleyen <b>altı ay<\/b> içinde.<\/li>\n<li>Başlangıç/çıkarılmış sermayenin <b>%25'inin halka arz edileceğinin<\/b> (altyapı GYO'da halka arz veya nitelikli yatırımcıya satış) Kurula taahhüt edilmesi.<\/li>\n<li>Sermayenin son <b>iki yıl<\/b> içinde varlıkların rayiç değere taşınmasından doğan fonlardan artırılmamış olması.<\/li>\n<li><b>Nitelikli yatırımcı<\/b> (GYO Tebliği): talebe dayalı profesyoneller dahil profesyonel müşteriler; finansal varlıkları toplamı <b>1.000.000 TL<\/b>'yi aşan gerçek kişiler ile aracı kurum, banka, PYŞ, KYK, emeklilik fonu, sigorta, ipotek finansman, varlık yönetim şirketleri ve yurt dışı muadilleri.<\/li>\n<li>Diğer yatırım ortaklıklarının ve halka açık ortaklıkların dönüşümünde portföy uyumu, esas sözleşme değişikliğinin tescilinden itibaren en geç <b>altı ay<\/b> içinde sağlanır; sağlanamazsa GYO olarak faaliyet hakkı kalkar ve <b>üç ay<\/b> içinde esas sözleşme değişikliği için Kurula başvurulur.<\/li>\n<li><b>Kamu ortaklı altyapı GYO:<\/b> kamu kurumu niteliğindeki tüzel kişi ortak sermayeye en az <b>%20<\/b> iştirak ediyorsa başlangıç sermayesi <b>70.000.000 TL<\/b> uygulanır (halka arz/nitelikli satış sonrası çıkarılmış sermaye en az 1,5 milyar TL'ye ulaşmalı) ve 150 milyon TL nakit şartı aranmaz. Kurucu nitelikleri kamu tüzel kişisinde aranmaz.<\/li>\n<\/ul>\n\n<h3>Kurucu ve ortakların nitelikleri<\/h3>\n<ul>\n<li>Müflis olmamak, konkordato ilan etmemiş, iflasın ertelenmesi kararı verilmemiş olmak; faaliyet izni Kurulca iptal edilmiş kuruluşlarda sorumlu olmamak; Kanunda yazılı suçlardan kesinleşmiş mahkumiyeti bulunmamak; kendisi veya ortağı olduğu kuruluşlar hakkında tasfiye kararı olmamak.<\/li>\n<li>TCK m.53'teki süreler geçmiş olsa bile kasten işlenen bir suçtan <b>beş yıl veya daha fazla<\/b> hapis cezası ya da zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat, bilişim suçları, kara para aklama, kaçakçılık, vergi kaçakçılığı gibi suçlardan mahkum olmamak.<\/li>\n<li>(e) Gerekli kaynağı muvazaadan ari ve kendi faaliyetlerinden sağlamak, taahhüt edilen sermayeyi karşılayacak <b>mali güç<\/b>; (f) dürüstlük ve itibar; (g) muaccel vergi borcu olmamak; (ğ) 6415 sayılı Terörün Finansmanı Kanunu suçlarından mahkum olmamak; (h) SPKn m.101/1-a uyarınca işlem yasaklı olmamak.<\/li>\n<li>İflas/konkordato ve izin iptali şartları, ilgili kararın kesinleşmesinden itibaren <b>on yıl<\/b> geçmişse dikkate alınmaz.<\/li>\n<li>Dönüşümde mevcut ortaklar; dolaylı olarak <b>%20 ve üzeri<\/b> pay sahibi nihai gerçek kişiler ile imtiyazla yönetim kontrolünü sağlayanlar; halka açık ortaklık dönüşümünde yönetim kontrolünü sağlayan ortaklar: <b>(e) bendi (mali güç) hariç<\/b> şartları taşımalıdır.<\/li>\n<li>Kurucu banka ise yalnızca muaccel vergi borcu olmadığını belgelemesi yeterlidir; bankaların pay sahipliğinde <b>BDDK<\/b>'nın uygun görüşü alınır.<\/li>\n<\/ul>\n\n<h3>Kuruluş işlemleri, ayni sermaye ve halka arz<\/h3>\n<ul>\n<li>Kurul izninin tebliğinden itibaren en geç <b>30 gün<\/b> içinde kuruluşun tescili; dönüşümde genel kurul 30 gün içinde yapılır ve karar genel kurulu izleyen <b>15 gün<\/b> içinde tescil edilir. Tescil ve TTSG ilanına ilişkin belgeler ilanı izleyen <b>altı iş günü<\/b> içinde Kurula gönderilir.<\/li>\n<li><b>Ayni sermaye:<\/b> yalnızca üzerinde ipotek veya değeri doğrudan ve önemli ölçüde etkileyen takyidat bulunmayan gayrimenkul ve gayrimenkule dayalı ayni haklar. TTK değerlemesine ek olarak Tebliğe göre değerleme raporu hazırlatılır; <b>düşük olan değer<\/b> esas alınır. Ayni sermaye artırımı kararı <b>yalnızca genel kurulda<\/b> alınır. Gayrimenkuller tüzel kişilik kazanma/artırımın tescilinden itibaren <b>10 iş günü<\/b> içinde tapuda ortaklık adına tescil edilir.<\/li>\n<li><b>Halka arz başvurusu:<\/b> tescili izleyen <b>üç ay<\/b> içinde mekan, donanım, personel ve genel müdür taahhütleri yerine getirilip çıkarılmış sermayenin <b>asgari %25'i<\/b> için izahname onayı istenir. Halka arz sonrası çıkarılmış sermayenin en az %25'i <b>halka açık pay<\/b> (MKK'da borsada işlem görebilir pay) olmalıdır.<\/li>\n<li>Başvurmayan veya başvurusu onaylanmayan ortaklığın GYO hakkı kalkar; <b>üç ay<\/b> içinde esas sözleşmeyi değiştirip kayıtlı sermaye sisteminden çıkmak için başvurmazsa <b>sona ermiş sayılır<\/b>.<\/li>\n<li><b>Kotasyon:<\/b> satış süresinin bitiminden itibaren <b>15 gün<\/b> içinde kota alınma belgesi için Kurula, belgeyi izleyen <b>15 gün<\/b> içinde BİAŞ'a başvurulur.<\/li>\n<\/ul>\n\n<h3>Altyapı GYO'ya özel süreler<\/h3>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><\/tr>\n<tr><td>Organizasyon ve portföy uyumu<\/td><td>Tescili izleyen <b>iki yıl<\/b> içinde<\/td><\/tr>\n<tr><td>Halka arz başvurusu<\/td><td>Çıkarılmış sermaye 3 milyar TL'den azsa organizasyon süresinin bitiminden itibaren <b>iki yıl<\/b>; 3 milyar TL ve üzeriyse <b>dört yıl<\/b> içinde, sermayenin asgari %25'i için<\/td><\/tr>\n<tr><td>Yalnız nitelikli yatırımcıya satış zorunluluğu<\/td><td>İşletme döneminden önceki yatırımlar ve/veya işletme dönemine geçmiş altyapı şirket ve projeleri aktifin <b>%60'ından az<\/b> ise paylar sadece nitelikli yatırımcıya satılabilir<\/td><\/tr>\n<tr><td>Nitelikli yatırımcıya satış<\/td><td>Esas sözleşmede hüküm varsa mümkün; satış sonrası sermayenin %25'i için ihraç belgesi; izahname ve satış duyurusu gerekmez; paylar nama yazılı ve MKK'da kaydi; sonra da yalnız nitelikli yatırımcıya devredilebilir; tanıtım amaçlı reklam yapılamaz<\/td><\/tr>\n<tr><td>Portföy şartı<\/td><td>Satıştan önce portföy aranmaz; ilk sermaye artırımı veya satışı izleyen <b>birinci yılın sonundan<\/b> itibaren %75 şartı sağlanır<\/td><\/tr>\n<\/table>\n<ul>\n<li>Altyapı GYO, halka arz/nitelikli satıştan önce sermaye artırımı yapabilir. Yalnızca üretim lisansı veya benzeri imtiyaz kapsamında faaliyet gösterenlerde %75 ve %25/%10 oranları aranmaz.<\/li>\n<li>Kurumsal Yönetim Tebliği'nin teminat-rehin-ipotek-kefalet hükümleri uygulanır; uyum süresi tescille başlar.<\/li>\n<\/ul>\n\n<h3>Paylar, imtiyaz ve pay devri<\/h3>\n<ul>\n<li>Paylar nama veya hamiline yazılı olabilir; borsada işlem gören nama yazılı paylarda TTK m.414/1 uygulanmaz.<\/li>\n<li>Yalnızca <b>yönetim kuruluna aday gösterme imtiyazı<\/b> veren pay ihraç edilebilir (TTK m.360 uygulanmaz). Halka açıldıktan sonra aday gösterme dahil hiçbir imtiyaz yaratılamaz.<\/li>\n<li>Üst üste <b>beş yıl<\/b> dönem zararı eden halka açık GYO'da imtiyazlar Kurul kararıyla kalkar (konsolide tablo esas; kamuya ait imtiyazlı paylarda uygulanmaz).<\/li>\n<li><b>Halka arz/nitelikli satış öncesi:<\/b> sermayenin <b>%10 ve fazlası<\/b>nı temsil eden payların devri ile oran aranmaksızın imtiyazlı pay devri <b>Kurul iznine<\/b> tabidir. %10'dan az edinimlerde yeni ortak belgelerini <b>10 iş günü<\/b> içinde Kurula iletir.<\/li>\n<li><b>Sonrası:<\/b> yönetim kontrolünü sağlayan imtiyazlı pay devri Kurul iznine tabi; imtiyazsız paylarla kontrol elde edilirse belgeler 10 iş günü içinde verilir. Şartları kaybeden kontrol sahibi payları <b>üç ay<\/b> içinde elden çıkarır. İmtiyazlı payı devralan, pay alım teklifini karşılayacak mali gücü belgelemelidir.<\/li>\n<\/ul>\n\n<h3>Yönetim kurulu, genel müdür, personel<\/h3>\n<ul>\n<li>YK üyeleri (e) bendi dışındaki kurucu şartlarını taşır; <b>çoğunluğu<\/b> dört yıllık yükseköğrenim mezunu ve gayrimenkul, altyapı, hukuk, inşaat, bankacılık, finans gibi alanlarda <b>en az üç yıl<\/b> tecrübeli olmalıdır.<\/li>\n<li><b>Genel müdür:<\/b> dört yıllık yükseköğrenim, <b>en az beş yıl<\/b> tecrübe, münhasıran ve tam zamanlı. Başka kurumlarda icrai olmayan YK üyeliği yapabilir. Son <b>12 ay<\/b> içinde <b>altı aydan fazla<\/b> vekalet edilemez.<\/li>\n<li>Dikkat: Yalnızca gayrimenkul alım satımıyla uğraşmak tecrübe sayılmaz.<\/li>\n<li>YK üyesi ve genel müdür atamaları <b>10 iş günü<\/b> içinde SPL'ye (genel müdür ayrıca Kurula) bildirilir; komite personeli değişiklikleri de 10 iş günü içinde SPL'ye.<\/li>\n<li>Komitelerde yalnız dört yıllık mezun üyeler görev alabilir. Bağımsız olmayan YK üyesi durumu gerekçesiyle bildirir ve toplantı tutanağına işletir (TTK m.393 saklı).<\/li>\n<li>Aktif toplamın <b>%75'ini aşmayan<\/b> varlıkların toptan satışında TTK m.408/2-f ve SPKn m.23 uygulanmaz.<\/li>\n<\/ul>\n\n<h3>Yatırım faaliyetleri<\/h3>\n<ul>\n<li>Her türlü gayrimenkulü alım satım kârı veya kira geliri için alabilir, satabilir, kiralayabilir. Binalar için <b>yapı kullanma izni<\/b> ve <b>kat mülkiyeti<\/b> şarttır (sadece kira amaçlı kullanımda yapı kullanma izni ve tapudaki niteliğin uygunluğu yeterli).<\/li>\n<li>Portföye ancak ipoteksiz ve önemli takyidat şerhi olmayan gayrimenkuller alınır. Kendi arsalarında, hasılat paylaşımı/kat karşılığı sözleşmesi yaptığı arsalarda proje geliştirebilir; üst hakkı tesisiyle yatırım yapabilir.<\/li>\n<li><b>İpotekli arsa:<\/b> mülkiyeti ortaklığa ait olmayan ipotekli arsada proje için ipotek bedeli arsa değerinin <b>%50'sini<\/b>, toplam ipotek bedelleri aktifin <b>%10'unu<\/b> geçemez.<\/li>\n<li>Yurt dışı gayrimenkullere (mülkiyet edinmek kaydıyla) ve yabancı sermaye piyasası araçlarına yatırım yapabilir. Tapuya tescil şartıyla yalnız <b>intifa, devre mülk ve üst hakkı<\/b> tesis ettirilebilir.<\/li>\n<li><b>Ödünç verme:<\/b> SPA piyasa değerinin en fazla <b>%50'si<\/b>, en fazla <b>90 iş günü<\/b>, en az <b>%100<\/b> nakit/kamu borçlanma aracı teminatı Takasbank'ta bloke; teminat <b>%80'in<\/b> altına düşerse tamamlatılır; sözleşmede ortaklık lehine tek taraflı fesih hükmü zorunlu.<\/li>\n<li>Hiçbir şirkette sermaye veya oy haklarının <b>%5'inden<\/b> fazlasına sahip olamaz; tek ihraççının para ve SPA'ları aktifin <b>%10'unu<\/b> aşamaz.<\/li>\n<li>Altın, kıymetli maden, emtia ve bunlara dayalı vadeli işleme yatırım yapamaz. Fon payları ve türevler hariç borsada/teşkilatlanmış piyasada işlem görmeyen SPA'ya yatırım yapamaz; alım satım borsa kanalıyla yapılır.<\/li>\n<li>Açığa satış, kredili işlem, ödünç alma yasak; korunma amacını aşan türev işlemi yasak.<\/li>\n<li>Vergi-harç hariç alım-satımda varlık değerinin <b>%3'ünü<\/b> aşan komisyon ödeyemez (yurt dışında yerleşik yabancılara satışlarda uygulanmaz).<\/li>\n<li>Metruk, ekonomik ömrünü tamamlamış, gelir getirmeyen veya riskli yapı şerhli yapılar değerleme raporu ve Kurula beyanla <b>arsa<\/b> olarak portföye alınabilir.<\/li>\n<li>Altyapı GYO: fizibilite ve değerleme zorunlu; kamu-özel işbirliği ve kamu altyapı yatırımlarına yatırım yapabilir; <b>yurt dışı altyapı yatırımı yapamaz<\/b>.<\/li>\n<\/ul>\n\n<h3>GYO'ların yapamayacakları<\/h3>\n<ul>\n<li>Mevduat veya katılım fonu toplayamaz; Tebliğ dışı ticari, sınai, zirai faaliyette bulunamaz.<\/li>\n<li>İnşaat işlerini <b>kendileri üstlenemez<\/b>, bunun için personel ve ekipman edinemez (proje kontrol personeli hariç).<\/li>\n<li>Otel, hastane, AVM, iş merkezi, konut sitesi, süpermarket gibi gayrimenkulleri ticari maksatla <b>işletemez<\/b>.<\/li>\n<li>Kendi portföyü dışında başkalarına proje geliştirme, proje kontrol, mali fizibilite hizmeti veremez (kamu projeleri istisnası var).<\/li>\n<li><b>Kredi veremez<\/b>; %100 bağlı ortaklıkları dışındaki ilişkili taraflarına mal/hizmet satışına dayanmayan borç veremez; belgesiz ve rayiçten bariz farklı harcama yapamaz; sürekli kısa vadeli gayrimenkul alım satımı yapamaz.<\/li>\n<\/ul>\n\n<h3>Portföy sınırlamaları<\/h3>\n<table>\n<tr><th>Sınır<\/th><th>Diğer GYO<\/th><th>Altyapı GYO<\/th><\/tr>\n<tr><td>Gayrimenkul, proje, hak, GYF payı ve %100 iştirak edilen gayrimenkul şirketleri (asgari)<\/td><td>Aktifin <b>en az %51'i<\/b><\/td><td>Altyapı varlıkları <b>en az %75<\/b><\/td><\/tr>\n<tr><td>Para ve SPA ile iştirakler (azami)<\/td><td>En fazla <b>%49<\/b><\/td><td>En fazla <b>%25<\/b><\/td><\/tr>\n<tr><td>Yatırım amaçlı mevduat/katılma hesabı (azami)<\/td><td colspan=\"2\">Aktifin en fazla <b>%10'u<\/b><\/td><\/tr>\n<tr><td>Yabancı gayrimenkul, yabancı SPA ve yurt dışı gayrimenkul şirketleri<\/td><td>En fazla <b>%49<\/b><\/td><td>Yurt dışı altyapıya yatırım yasak<\/td><\/tr>\n<tr><td>Beş yıl üzerinde proje geliştirilmeyen arsa-arazi<\/td><td colspan=\"2\">Aktifin en fazla <b>%20'si<\/b><\/td><\/tr>\n<tr><td>İşletmeci şirket iştiraki<\/td><td colspan=\"2\">Aktifin en fazla <b>%10'u<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Hakediş/taksitli ödemelere karşılık gelen nakit fazlası, tablonun hazırlandığı yıl ve izleyen <b>iki yıl<\/b> içindeki planlı harcamalar kadar asgari oran hesabında gayrimenkul gibi dikkate alınabilir (planlar önceden Kurula bildirilir, değişikliği Kurul iznine tabi).<\/li>\n<li>Asgari oran sağlanamazsa talep üzerine Kurul <b>bir yıl<\/b> süre verebilir; sonra da sağlanamazsa <b>üç ay<\/b> içinde esas sözleşme değişikliği başvurusu; yapılmazsa TTK m.529/1-b,c uyarınca sona ermiş sayılır.<\/li>\n<li>Altyapı GYO'da %75 oranı yatırımın tamamlanması, imtiyaz süresinin dolması gibi nedenlerle sağlanamazsa <b>iki yıl<\/b> süre verilebilir; bu imkan son <b>beş yıl<\/b>da en fazla <b>bir kez<\/b> kullanılır.<\/li>\n<\/ul>\n\n<h3>Portföy yönetimi, iştirak, sigorta, borçlanma<\/h3>\n<ul>\n<li>GYO portföyünü yeterli personelle <b>kendisi yönetir<\/b>; danışmanlık dışarıdan alınabilir. Danışman şirket ile işletmeci şirket sıfatı aynı kişide birleşemez.<\/li>\n<li>Para ve SPA kısmı aktifin <b>%10'unu<\/b> aşarsa: lisanslı yeterli portföy yöneticisi istihdam eder veya PYŞ'den portföy yönetimi/yatırım danışmanlığı alır. SPA'lar <b>Takasbank<\/b>'ta saklanır.<\/li>\n<li><b>Tapuya şerh:<\/b> alım, önalım, geri alım hakları, satış vaadi ve kat karşılığı sözleşmeler, rehinli alacaklarda serbest dereceye ilerleme hakları ve ortaklığın kiracı olduğu kira sözleşmeleri şerh edilir (TOKİ, İller Bankası, belediyeler ve bağlı şirketleri karşı tarafsa zorunlu değil).<\/li>\n<li><b>İştirak edilebilecekler:<\/b> işletmeci şirketler, diğer GYO'lar, YİD şirketleri, faaliyet konusu yalnız gayrimenkul olan yurt dışı şirketler/özel amaçlı şirketler, aktifinin devamlı olarak <b>en az %75'i<\/b> gayrimenkul olan Türkiye'deki şirketler, yol-su-elektrik gibi zorunlu hizmet şirketleri. İlke kararıyla asansör, jeneratör, ısıtma-soğutma gibi teknoloji yoğun alanlarda faaliyet gösteren Türkiye'deki şirketlere de bağlı ortaklık yoluyla ortak olunabilir.<\/li>\n<li>Arsa, arazi, haklar, inşaatına başlanmamış projeler ve SPA hariç tüm varlıklar rayiç değerle <b>sigortalanır<\/b>; altyapı GYO'da sigorta ihtiyaridir.<\/li>\n<li>İpotek ve rehin yalnızca kat karşılığı/hasılat paylaşımı projelerinde arsa sahibi lehine teminat, kendi finansmanı ve %100 bağlı ortaklıklar lehine verilebilir; üçüncü kişiler lehine verilemez (esas sözleşmede yer alır).<\/li>\n<li><b>Borçlanma sınırı:<\/b> bireysel tablolardaki özsermayenin <b>beş katı<\/b> kadar kredi (finansal kiralama borçları ve gayrinakdi krediler dahil). Borçlanma aracı ihraç limitinden bu krediler düşülür. Gayrimenkul sertifikası ve VTMK ihraç edebilir. Altyapı GYO için Kurul sınırı artırabilir.<\/li>\n<li>İnşaat işleri sözleşmeyle <b>müteahhitlere<\/b> yaptırılır; müteahhit seçimi ve sözleşme koşulları YK onayına tabidir. İnşaat malzemesi ortaklıkça alınıp müteahhide verilebilir (tedarikçi ilişkili taraf olmamalı, münhasıran malzeme üreten ilişkili taraf hariç).<\/li>\n<li>Münhasıran bir proje için adi ortaklık kurulabilir; bu iştirak sayılmaz.<\/li>\n<\/ul>\n\n<h3>Değerleme ve ekspertiz değeri<\/h3>\n<ul>\n<li><b>Değerleme gerektiren işlemler:<\/b> portföye alma/çıkarma, kiraya verme, kiraya vermek üzere kiralama, kira sözleşmesi yenileme, ipotek kabulü, proje inşaatına başlama, hesap döneminin son <b>üç ayında<\/b> değeri tespit edilmemiş varlıkların yıl sonu değerlemesi, nitelik değişikliği, ayni sermaye, yapı kayıt belgesi.<\/li>\n<li>Yıl sonu değerlemesi en geç ilgili yılın son günü tamamlanır. Değerleme bitişi ile rapor tarihi arası <b>beş iş günü<\/b>, raporun teslimi rapor tarihinden itibaren <b>iki iş günü<\/b> içinde.<\/li>\n<li>Değerleme kuruluşu: Kurulca listeye alınmış ve bağımsız. Hesap döneminin bitiminden itibaren <b>bir ay<\/b> içinde her varlık için bir kuruluş ve yıl içinde alınacak varlıklar için <b>en fazla iki<\/b> kuruluş YK kararıyla belirlenir ve kamuya açıklanır; değişiklik Kurul onayıyla.<\/li>\n<li>Aynı varlık için aynı kuruluştan üst üste <b>en fazla üç yıl<\/b> hizmet alınır; tekrar için <b>en az iki yıl<\/b> beklenir.<\/li>\n<li><b>Ekspertiz değeri:<\/b> alımda ekspertizden yüksek, satış ve kiralamada ekspertizin <b>%95'inden düşük<\/b> değer esas alınırsa özel durum açıklaması yapılır ve ilk genel kurulda bilgi verilir.<\/li>\n<li>Ekspertiz kira bedelinin altında gelir elde edilen gayrimenkuller hesap dönemini izleyen <b>birinci ayın sonuna<\/b> kadar açıklanır. Uzun süreli kiralamada kira ekspertiz değeri <b>beş yıllık<\/b> dönemlerle tespit edilir; kira ekspertizin %95'inin altında kalırsa açıklanır.<\/li>\n<\/ul>\n\n<h3>Raporlama, açıklama ve statüden çıkış<\/h3>\n<ul>\n<li>Faaliyet raporunda ayrıca değerleme raporu özetleri, son üç aylık gelişmeler, projelerin tamamlanma oranları, kiradaki varlıklar ve portföy sınırlamaları kontrolü yer alır; rapor <b>en az on yıl<\/b> saklanır.<\/li>\n<li>Değerleme raporları teslimden itibaren <b>üç iş günü<\/b> içinde Kurula gönderilir ve KAP'ta (ekleri hariç) ilan edilir.<\/li>\n<li>Aktifin <b>%2'sini geçen<\/b> alım, satım, kiralama işlemi en geç işlemi izleyen <b>ilk iş günü<\/b>; %2'yi geçmeyenler toplu olarak hesap dönemini izleyen <b>10 iş günü<\/b> içinde KAP'ta açıklanır.<\/li>\n<li>Asgari oran sağlanamazsa gerekçe ve düzeltme planı yıl sonu tablolarının açıklanmasını izleyen <b>3 iş günü<\/b> içinde açıklanır.<\/li>\n<li>Ortaklık değeri yalnızca Kurul düzenlemesine göre hazırlanan raporla birlikte açıklanabilir.<\/li>\n<li>İlanlar yanıltıcı, abartılı veya portföyle örtüşmeyen görsel içeremez. GYO dışında hiçbir kuruluş unvanında \"GYO\" ibaresi kullanamaz.<\/li>\n<li><b>Statüden çıkış (halka açık GYO):<\/b> olumlu oy verenler dışındaki ortaklara, özel durum açıklamasından önceki <b>30 günlük<\/b> ve <b>altı aylık<\/b> ağırlıklı ortalama fiyatlardan yüksek olanla <b>pay alım teklifi<\/b> zorunlu; YK gerekçeli rapor hazırlayıp başvurudan önce KAP'ta ilan eder. Kurul izninden itibaren <b>üç ay<\/b> içinde genel kurulda karar alınmazsa izin geçersizleşir. <b>Ayrılma hakkı doğmaz.<\/b><\/li>\n<li>Dönüşüm ve çıkışta %10 ve üzeri pay sahipleri ve kontrol sahipleri, tescilden itibaren <b>bir yıl<\/b> boyunca tescil günündeki ikinci seans kapanış fiyatının altında borsada satış yapamaz.<\/li>\n<li>Süreli kurulan GYO'da süre uzatımı istenmezse veya altyapı GYO'nun lisansı iptal, sözleşmesi feshedilirse faaliyet hakkı kalkar; <b>üç ay<\/b> içinde esas sözleşme değişikliği başvurusu yapılır.<\/li>\n<li>GYO'lar halka arz veya nitelikli satıştan önce <b>nakit kâr payı dağıtamaz<\/b>. Esas sözleşme değişikliklerinde Kurulun uygun görüşü zorunludur.<\/li>\n<\/ul>", "sorular": [{"q": "GYO Tebliği'ne göre altyapı GYO dışındaki bir GYO'nun kuruluşunda başlangıç sermayesi en az ne kadar olmalıdır?", "o": ["300.000.000 TL", "1.000.000.000 TL", "1.500.000.000 TL", "2.000.000.000 TL", "75.000.000 TL"], "a": 1, "e": "Kuruluşta başlangıç sermayesi, dönüşümde ödenmiş sermaye ve özsermayenin her biri 1 milyar TL'den az olamaz; 1,5 milyar TL altyapı GYO için aranır."}, {"q": "Münhasıran altyapı yatırım ve hizmetlerinden oluşan portföyü işletecek bir GYO'ya hangi şirketler dönüşebilir?", "o": ["Yalnızca halka açık ortaklıklar", "Yalnızca bankalar", "Yalnızca diğer GYO'lar", "Her türlü anonim ortaklık", "Yalnızca altyapı şirketleri"], "a": 4, "e": "Altyapı GYO'ya yalnızca altyapı şirketleri dönüşebilir."}, {"q": "Sermayesi 2 milyar TL'nin altında olan bir GYO'nun kuruluşunda paylarının en az ne kadarı nakit karşılığı çıkarılmış olmalıdır?", "o": ["%5", "%25", "%10", "%49", "%51"], "a": 2, "e": "Sermaye 2 milyar TL'den azsa payların en az %10'u, 2 milyar TL ve üzerindeyse 200 milyon TL'lik kısmı nakit karşılığı çıkarılır."}, {"q": "GYO olarak kurulan bir ortaklık, halka arz başvurusunu kuruluşun tescilinden itibaren hangi süre içinde ve sermayesinin en az ne kadarı için yapmalıdır?", "o": ["Üç ay içinde, %25", "Bir ay içinde, %10", "Altı ay içinde, %25", "Üç ay içinde, %49", "Bir yıl içinde, %51"], "a": 0, "e": "Tescili izleyen üç ay içinde çıkarılmış sermayenin asgari %25'i için izahname onayı istenir."}, {"q": "Aşağıdakilerden hangisi GYO'ların yapabileceği işlerden biridir?", "o": ["İnşaat işlerini kendi personeliyle üstlenmek", "Portföyündeki oteli ticari maksatla işletmek", "Kredi vermek", "Yurt dışındaki gayrimenkullere mülkiyet edinmek kaydıyla yatırım yapmak", "Sürekli olarak kısa vadeli gayrimenkul alım satımı yapmak"], "a": 3, "e": "Mülkiyet edinmek kaydıyla yurt dışı gayrimenkullere yatırım serbesttir; diğer şıklar GYO'ların yapamayacağı işlerdir."}, {"q": "Altyapı GYO dışındaki bir GYO, aktif toplamının en az ne kadarını gayrimenkul, gayrimenkul projesi ve gayrimenkule dayalı haklar gibi varlıklara yatırmak zorundadır?", "o": ["%25", "%51", "%49", "%75", "%80"], "a": 1, "e": "Asgari oran %51'dir; altyapı GYO'da altyapı varlıkları en az %75 olmalıdır."}, {"q": "GYO'ların bir şirketin sermaye veya oy haklarında sahip olabileceği azami oran ile tek bir ihraççının para ve sermaye piyasası araçlarına yatırım sınırı sırasıyla hangisidir?", "o": ["%5 ve aktifin %25'i", "%10 ve aktifin %5'i", "%10 ve aktifin %20'si", "%20 ve aktifin %10'u", "%5 ve aktifin %10'u"], "a": 4, "e": "Hiçbir şirkette sermaye veya oy haklarının %5'inden fazlasına sahip olunamaz; tek ihraççının araçları aktifin %10'unu aşamaz."}, {"q": "GYO'ların kredi kullanım sınırı nasıl belirlenir?", "o": ["Aktif toplamın %50'si", "Özsermayenin yarısı", "Bireysel tablolardaki özsermayenin beş katı", "Özsermayenin iki katı", "Çıkarılmış sermayenin üç katı"], "a": 2, "e": "GYO'lar özsermayelerinin beş katı kadar kredi kullanabilir; finansal kiralama borçları ve gayrinakdi krediler de hesaba katılır."}, {"q": "Bir GYO, değerleme hizmeti gereken bir varlık için aynı gayrimenkul değerleme kuruluşundan üst üste en fazla kaç yıl hizmet alabilir ve tekrar hizmet alabilmesi için en az kaç yıl geçmelidir?", "o": ["Üç yıl, iki yıl", "İki yıl, bir yıl", "Beş yıl, iki yıl", "Üç yıl, üç yıl", "Dört yıl, bir yıl"], "a": 0, "e": "Aynı kuruluştan en fazla üç yıl üst üste hizmet alınır; tekrar için en az iki yıl beklenir."}, {"q": "GYO portföyündeki bir gayrimenkulün, ekspertiz değerinin yüzde kaçından düşük bir bedelle satılması halinde özel durum açıklaması yapılması ve ilk genel kurulda bilgi verilmesi gerekir?", "o": ["%80", "%85", "%90", "%95", "%100"], "a": 3, "e": "Satış ve kiralamada ekspertiz değerinin %95'inden düşük değer esas alınırsa kamuya açıklanır ve genel kurulda bilgi verilir."}, {"q": "Aşağıdakilerden hangisi GYO'ların imtiyazlı pay ihracına ilişkin doğru bir ifadedir?", "o": ["Kâr payında imtiyaz tanıyan pay ihraç edilebilir", "Yalnızca yönetim kuruluna aday gösterme imtiyazı veren pay ihraç edilebilir", "Halka açılma sonrasında aday gösterme imtiyazı yaratılabilir", "Oy hakkında imtiyaz serbesttir", "Hiçbir şekilde imtiyazlı pay ihraç edilemez"], "a": 1, "e": "GYO'lar yalnızca YK üyeliğine aday gösterme imtiyazı veren pay ihraç edebilir; halka açıldıktan sonra hiçbir imtiyaz yaratılamaz."}, {"q": "GYO genel müdürü için aranan asgari mesleki tecrübe süresi ve genel müdürlüğe vekaletle ilgili sınır hangisidir?", "o": ["Üç yıl; 12 ayda en fazla üç ay vekalet", "On yıl; 12 ayda en fazla altı ay vekalet", "Yedi yıl; 12 ayda en fazla üç ay vekalet", "Beş yıl; 12 ayda en fazla üç ay vekalet", "Beş yıl; 12 ayda en fazla altı ay vekalet"], "a": 4, "e": "GYO genel müdürü en az beş yıl tecrübeli olmalıdır; son 12 ayda altı aydan fazla vekalet edilemez."}, {"q": "Halka arz veya nitelikli yatırımcıya satıştan önce bir GYO'da sermayenin hangi oranı ve üzerini temsil eden payların devri Kurul iznine tabidir?", "o": ["%5", "%20", "%10", "%25", "%33"], "a": 2, "e": "Satıştan önce %10 ve üzeri pay devirleri ile oran aranmaksızın imtiyazlı pay devirleri Kurul iznine tabidir."}, {"q": "GYO'lar, mülkiyeti kendilerine ait olmayan ipotekli bir arsada proje geliştirmek isterse ipotek bedeli arsa değerinin en fazla ne kadarı olabilir?", "o": ["%50", "%25", "%30", "%10", "%75"], "a": 0, "e": "İpotek bedeli arsa değerinin %50'sini, bu tür arsaların toplam ipotek bedelleri ise aktifin %10'unu geçemez."}, {"q": "GYO'lar portföylerindeki sermaye piyasası araçlarını ödünç verirken hangi kural geçerlidir?", "o": ["Piyasa değerinin en fazla %75'i, en fazla 30 iş günü", "Piyasa değerinin en fazla %25'i, en fazla 60 iş günü", "Piyasa değerinin tamamı, süre sınırı yok", "Piyasa değerinin en fazla %50'si, en fazla 90 iş günü", "Ödünç verme yasaktır"], "a": 3, "e": "Ödünç verme piyasa değerinin en fazla %50'si için, en fazla 90 iş günü ve en az %100 teminatla yapılabilir."}, {"q": "Aktif toplamının %2'sini geçen bir gayrimenkul alımını yapan GYO bu işlemi KAP'ta ne zaman açıklamalıdır?", "o": ["İşlemi izleyen 10 iş günü içinde", "İşlemi izleyen ilk iş günü içinde", "Hesap dönemi sonunda toplu olarak", "Yıllık faaliyet raporunda", "Üç ay içinde"], "a": 1, "e": "%2'yi geçen işlemler en geç işlemi izleyen ilk iş günü; geçmeyenler toplu olarak dönem sonunu izleyen 10 iş günü içinde açıklanır."}, {"q": "Halka açık bir GYO'nun GYO statüsünden çıkmasıyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Olumlu oy vermeyen ortaklara pay alım teklifi yapılması zorunludur", "Yönetim kurulu gerekçeli bir rapor hazırlayıp KAP'ta ilan eder", "Kurul izninden itibaren üç ay içinde genel kurulda karar alınmazsa izin geçersiz olur", "%10 ve üzeri pay sahipleri bir yıl boyunca tescil günü kapanış fiyatının altında borsada satış yapamaz", "Bu işlemler nedeniyle ortaklara ayrılma hakkı doğar"], "a": 4, "e": "Statüden çıkış işlemlerinde ayrılma hakkı doğmaz; diğer ifadeler doğrudur."}, {"q": "Portföyünde beş yıl geçmesine rağmen üzerinde proje geliştirilmeyen arsa ve araziler GYO aktif toplamının en fazla ne kadarı olabilir?", "o": ["%10", "%15", "%20", "%25", "%49"], "a": 2, "e": "Alımından itibaren beş yıl geçmesine rağmen proje geliştirilmeyen arsa ve araziler aktifin %20'sini aşamaz."}]}, {"id": 8, "kisa": "MKYO ve DSYO", "baslik": "Menkul Kıymet Yatırım Ortaklıkları (III-48.5)", "ozet": "Sabit sermayeli MKYO'nun lider sermayedar, halka arz ve portföy kuralları ile değişken sermayeli ortaklığın (DSYO) işleyişi.", "notlar": "<h3>Tebliğin yapısı<\/h3>\n<p>III-48.5 sayılı Tebliğ iki ayrı ortaklık türünü ayrı ayrı düzenler: <b>sabit sermayeli MKYO<\/b> (kayıtlı sermayeli, payları borsada işlem gören klasik yatırım ortaklığı) ve <b>değişken sermayeli MKYO (DSYO)<\/b> (sermayesi her an net aktif değerine eşit, fon gibi çalışan ortaklık). Sabit sermayeli MKYO'nun statüden çıkışı yalnızca DSYO'ya dönüşüm yoluyla mümkündür.<\/p>\n\n<h3>Sabit sermayeli MKYO: tanım ve portföy varlıkları<\/h3>\n<ul>\n<li>Aşağıdaki varlıklardan oluşan portföyü işletmek için <b>anonim ortaklık<\/b> şeklinde ve <b>kayıtlı sermaye<\/b> esasına göre kurulan, SPKn m.48 sınırları içinde faaliyet gösteren sermaye piyasası kurumu.<\/li>\n<li>Portföye alınabilecekler: Türkiye'deki ihraççıların payları (özelleştirme kapsamındakiler dahil), özel sektör ve kamu borçlanma araçları; 32 sayılı Karar çerçevesinde alınabilen yabancı borçlanma araçları ve paylar; <b>12 aydan uzun vadeli olmamak<\/b> üzere vadeli mevduat ve katılma hesabı; <b>borsada işlem görmek kaydıyla<\/b> altın ve kıymetli madenler ile bunlara dayalı SPA; yatırım fonu katılma payları; repo ve ters repo; kira ve gayrimenkul sertifikaları; varant ve yatırım kuruluşu sertifikaları; Takasbank para piyasası; türev işlem nakit teminat ve primleri; Kurulca uygun görülen özel tasarlanmış yabancı yatırım araçları ve ikraz iştirak senetleri.<\/li>\n<li>Başlıca faaliyetleri: portföyü oluşturmak ve işletmek, çeşitlendirme ile riski dağıtmak, piyasaları izlemek ve önlem almak, portföy değerini korumaya yönelik araştırma yapmak.<\/li>\n<\/ul>\n\n<h3>Sabit sermayeli MKYO kuruluş şartları<\/h3>\n<ul>\n<li>Kayıtlı sermayeli anonim ortaklık olmak.<\/li>\n<li>Kurucuların, çıkarılmış sermayenin <b>asgari %49'unun<\/b> halka arz edileceğini Kurula taahhüt etmesi.<\/li>\n<li>Kuruluş sermayesi <b>300 milyon TL<\/b>'den az olmamak.<\/li>\n<li>Paylar <b>nakit karşılığı<\/b> çıkarılır, bedeller kuruluşta <b>tam ve nakden<\/b> ödenir (ayni sermaye yok).<\/li>\n<li>Unvanda <b>\"Menkul Kıymet Yatırım Ortaklığı\"<\/b> ibaresi.<\/li>\n<li>Kuruculardan en az birinin <b>lider sermayedar<\/b> olması.<\/li>\n<li>Genel müdür ve YK üyelerinin belirlenmiş olması; Kurulca yetkilendirilmiş bir <b>portföy saklama kuruluşunun<\/b> belirlenmiş olması.<\/li>\n<li>Kurucu nitelikleri GYO'dakiyle aynı mantıktadır (iflas/konkordato yok, ağır suç mahkumiyeti yok, mali güç, dürüstlük ve itibar, muaccel vergi borcu yok, terör finansmanı mahkumiyeti yok, işlem yasağı yok); iflas ve izin iptali şartları kararın kesinleşmesinden <b>10 yıl<\/b> sonra aranmaz. Dolaylı <b>%20 ve üzeri<\/b> pay sahibi nihai gerçek kişilerde mali güç dışındaki şartlar aranır. Banka kurucuda BDDK uygun görüşü yeterlidir.<\/li>\n<\/ul>\n\n<h3>Lider sermayedar<\/h3>\n<ul>\n<li>Halka arz sonrası edinimler hariç, tek başına veya birlikte sermayenin <b>asgari %25'ine<\/b> sahip ortak veya ortaklar. Halka arz sermaye artırımıyla yapılırsa oran halka arz öncesi sermayeye göre hesaplanır.<\/li>\n<li>Unvanında ismi veya bağlantı izlenimi veren ibare kullanılan kişinin lider sermayedar olması zorunludur.<\/li>\n<li><b>Gerçek kişi:<\/b> menkul ve gayrimenkul varlıklarının rayiç değeri en az <b>150 milyon TL<\/b>; birden fazla gerçek kişi lider sermayedarsa toplam en az <b>300 milyon TL<\/b>.<\/li>\n<li><b>Tüzel kişi:<\/b> en az <b>üç yıllık<\/b> faaliyet geçmişi; bağımsız denetimden geçmiş tablolar; özsermaye kurulacak MKYO'nun çıkarılmış sermayesinin en az <b>iki katı<\/b>, aktif toplam en az <b>üç katı<\/b> (tavan: özsermaye için <b>1.500 milyon TL<\/b>, aktif toplam için <b>3.000 milyon TL<\/b>).<\/li>\n<li>Kamu kurumlarında ve kamu yararına çalışan tüzel kişilerde mali yeterlilik şartları aranmayabilir.<\/li>\n<li>Lider sermayedarın asgari oranı temsil eden payları, halka arzda satış süresinin bitiminden itibaren <b>iki yıl<\/b> boyunca devredilemez; sonra devralanlarda lider sermayedar şartları aranmaz.<\/li>\n<\/ul>\n\n<h3>Kuruluş işlemleri, halka arz, paylar<\/h3>\n<ul>\n<li>Kurul uygun görürse Bakanlığa başvurulur; esas sözleşme Kurul izninden itibaren <b>30 gün<\/b> içinde tescil edilir; TTSG nüshası ilanı izleyen <b>altı iş günü<\/b> içinde Kurula gönderilir.<\/li>\n<li>Tescili izleyen <b>üç ay<\/b> içinde organizasyon kurulur, genel müdür atanır ve çıkarılmış sermayenin <b>asgari %49'u<\/b> için halka arz başvurusu yapılır. Başvuru olmazsa faaliyet hakkı kalkar; <b>üç ay<\/b> içinde esas sözleşme değiştirilmezse sona ermiş sayılır.<\/li>\n<li>Halka arz sonrasında da çıkarılmış sermayenin <b>asgari %49'u<\/b> halka açık pay niteliğinde olmalıdır.<\/li>\n<li>Dikkat: Sabit sermayeli MKYO <b>halka arz öncesinde sermaye artırımı yapamaz<\/b>.<\/li>\n<li><b>Bedelli sermaye artırımı<\/b> ancak karar açıklamasından önceki <b>30 günlük<\/b> ağırlıklı ortalama fiyatların ortalamasına göre borsa fiyatı <b>1 TL'nin üzerindeyse<\/b> yapılabilir. Aksi halde: imtiyazlar kaldırılmak şartıyla nominal değerin altında pay ihracı veya önceki 30 günlük ortalama pay başına net aktif değer ve nominal değerden aşağı olmayan fiyatla <b>tahsisli<\/b> artırım. Tahsisli payları alanlar <b>bir yıl<\/b> borsada satamaz.<\/li>\n<li>Kotasyon: satış süresinin bitiminden itibaren <b>15 gün<\/b> içinde Kurula, belgeyi izleyen <b>15 gün<\/b> içinde BİAŞ'a.<\/li>\n<li>Paylar nama veya hamiline yazılı olabilir. Sabit sermayeli MKYO <b>hiçbir imtiyaz<\/b> veren menkul kıymet ihraç edemez (GYO'dan farkı: GYO'da aday gösterme imtiyazı serbest). Eski imtiyazlar artırılamaz; üst üste <b>beş yıl<\/b> zarar edende oy ve YK'da temsil imtiyazları Kurul kararıyla kalkar.<\/li>\n<li>Pay devri: halka arz öncesi <b>%10 ve üzeri<\/b> devir ile her imtiyazlı pay devri Kurul iznine tabi; %10'dan azında belgeler <b>10 iş günü<\/b> içinde. Halka arz sonrası kontrol sağlayan imtiyazlı pay devri Kurul izninde; şartları kaybeden kontrol sahibi <b>üç ay<\/b> içinde payları elden çıkarır. Aykırı devirler pay defterine kaydedilmez.<\/li>\n<\/ul>\n\n<h3>Yönetim, genel müdür ve iç sistemler<\/h3>\n<table>\n<tr><th>Konu<\/th><th>Sabit sermayeli MKYO<\/th><th>GYO (karşılaştırma)<\/th><\/tr>\n<tr><td>YK çoğunluğunun tecrübesi<\/td><td>Dört yıllık mezun, finansal piyasalarda <b>en az beş yıl<\/b><\/td><td>Dört yıllık mezun, ilgili alanlarda en az üç yıl<\/td><\/tr>\n<tr><td>Genel müdür tecrübesi<\/td><td>Finansal piyasalarda <b>en az yedi yıl<\/b> + <b>SPF Düzey 3<\/b> lisansı<\/td><td>En az beş yıl<\/td><\/tr>\n<tr><td>Genel müdüre vekalet<\/td><td>12 ayda <b>üç aydan<\/b> fazla olamaz<\/td><td>12 ayda altı aydan fazla olamaz<\/td><\/tr>\n<\/table>\n<ul>\n<li>Genel müdürün portföy yöneticisi olarak da çalışması tam zamanlılığa aykırı sayılmaz. Atamalar <b>10 iş günü<\/b> içinde Kurula ve SPL'ye bildirilir.<\/li>\n<li><b>Portföy yönetimi:<\/b> en az bir portföy yöneticisi istihdam ederek kendisi yönetebilir veya Kurul onayıyla PYŞ'den hizmet alabilir. Kendisi yönetiyorsa lisanslı ve <b>en az üç yıl<\/b> tecrübeli en az bir portföy yöneticisi, yazılı karar prosedürü ve belgelerin <b>en az beş yıl<\/b> saklanması gerekir. PYŞ sözleşmesi <b>altı iş günü<\/b> içinde Kurula gönderilir ve KAP'ta açıklanır.<\/li>\n<li>Dışarıdan alınan hizmetler ve personel için yıllık komisyon ve ücretler toplamı, günlük ortalama net aktif değerin <b>%2'sini<\/b> geçemez.<\/li>\n<li><b>İç kontrol:<\/b> politikalar YK kararıyla yürürlüğe girer; raporlar <b>aylık<\/b> YK'ya sunulur; icracı birimi olmayan bir YK üyesi iç kontrolden sorumludur; en az bir iç kontrol personeli (en az <b>üç yıl<\/b> tecrübe ve lisans).<\/li>\n<li><b>Risk yönetimi:<\/b> birim portföy yönetiminden bağımsız; personelde <b>SPF Düzey 3 ve Türev Araçlar<\/b> lisansı (esas sözleşmede türev yapılmayacağı yazıyorsa türev lisansı aranmaz). Limit aşımı aynı gün yöneticiye, riskler günlük yöneticiye ve <b>haftalık<\/b> YK'ya raporlanır.<\/li>\n<li><b>Teftiş birimi:<\/b> doğrudan YK'ya bağlı; aynı gruptaki <b>en fazla iki<\/b> MKYO'da yarı zamanlı müfettiş çalıştırılabilir; yıllık raporlar hesap dönemini izleyen <b>üç ay<\/b> içinde YK'ya sunulur ve <b>en az beş yıl<\/b> saklanır; olağandışı durum raporu aynı gün Kurula gönderilir.<\/li>\n<\/ul>\n\n<h3>Yapamayacakları ve portföy sınırlamaları<\/h3>\n<ul>\n<li>Ödünç para veremez, mevduat toplayamaz, ticari-sınai-zirai faaliyette bulunamaz, <b>aracılık yapamaz<\/b>, açığa satış ve kredili işlem yapamaz.<\/li>\n<li>Portföyü rehin veremez; ancak kredi temini için portföyün <b>%10'unu<\/b> teminat gösterebilir. Gerekenden fazla nakit ve taşınır/taşınmaz tutamaz.<\/li>\n<li>Rayiç değerin üstünde alım, altında satış yapamaz.<\/li>\n<\/ul>\n<table>\n<tr><th>Sınırlama (net aktif değere göre)<\/th><th>Oran<\/th><\/tr>\n<tr><td>Tek ihraççının para ve SPA ile bunlara dayalı türevler<\/td><td>En fazla <b>%10<\/b> (ipotek ve varlık teminatlı menkul kıymetlerde <b>%25<\/b>)<\/td><\/tr>\n<tr><td>%5'ten fazla yatırım yapılan ihraççıların toplamı<\/td><td>En fazla <b>%40<\/b><\/td><\/tr>\n<tr><td>Aynı grup şirketleri<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Bir ihraççının tedavüldeki borçlanma araçları<\/td><td>İhraç miktarının en fazla <b>%10'u<\/b><\/td><\/tr>\n<tr><td>TCMB, Hazine ve Maliye Bakanlığı, ipotek finansman kuruluşu ihraçları<\/td><td>Bu sınırlar yok; tek varlık en fazla <b>%35<\/b><\/td><\/tr>\n<tr><td>Varlık kiralama şirketleri<\/td><td>%10 yerine <b>%25<\/b>; %40
