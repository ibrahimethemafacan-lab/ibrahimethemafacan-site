<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.opts2 select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}

<script>
const S=[{"id": 1, "kisa": "SPKn: Araçlar ve İhraç", "baslik": "SPKn I: Sermaye Piyasası, Araçlar, İhraç ve Kamuyu Aydınlatma", "ozet": "Sermaye piyasasının işlevleri ve unsurları, mevzuat hiyerarşisi, SPKn'nin uygulama alanı, sermaye piyasası araçları, kaydi sistem, teminatlar, ihraç ve halka arz, izahname sorumluluğu, pay ve borçlanma aracı ihracı.", "notlar": "<h3>Sermaye piyasası kavramı<\/h3>\n<ul>\n<li><b>Sermaye piyasası:<\/b> orta ve uzun vadeli ödünç verilebilir fonların, sermaye piyasası araçlarının (SPA) alım satımı yoluyla tasarruf sahiplerinden fon talep edenlere aktarıldığı ve iki kesim arasında <b>doğrudan finansman köprüsü<\/b> kurulan piyasa. Para piyasası ile birlikte finans piyasasının bir alt türüdür.<\/li>\n<li><b>Finans piyasasının 5 fonksiyonu:<\/b> reel piyasaya kaynak sağlamak, sermaye birikimi oluşturmak, likidite temin etmek, riskleri dağıtmak/aktarmak, mülkiyeti tabana yaymak. Riskleri dönüştürmek, mülkiyeti tabana yaymak ve likidite sağlamak para piyasasından çok sermaye piyasasına özgüdür.<\/li>\n<li><b>Birincil piyasa:<\/b> SPA'nın ihraççı tarafından ilk kez çıkarılıp satıldığı piyasa. Reel piyasaya kaynak, risk dağıtımı, mülkiyetin tabana yayılması ve sermaye birikimi esasen burada gerçekleşir.<\/li>\n<li><b>İkincil piyasa:<\/b> daha önce ihraç edilmiş SPA'nın yatırımcılar arasında el değiştirdiği piyasa. İhraççıya fon akışı sağlamaz; üç fonksiyonu vardır: <b>likidite<\/b>, <b>fiyat belirleme<\/b> (birincil piyasa fiyatı ikincil piyasa fiyatına bakılarak belirlenir), <b>vade belirleme<\/b>.<\/li>\n<li><b>Spot piyasa:<\/b> işlemin ardından mal/kıymet ve bedel el değiştirir (ör. Borsa İstanbul Pay Piyasası, Tahvil ve Bono Piyasası). <b>Vadeli piyasa:<\/b> ileri tarihte teslim için bugünden alım satım; forward, swap, futures ve opsiyonu kapsar.<\/li>\n<\/ul>\n<h3>Sermaye piyasasının 5 unsuru<\/h3>\n<ol>\n<li><b>Fon talep edenler (ihraççılar).<\/b> SPKn m.3/1-h: kitle fonlaması platformları aracılığıyla para toplayanlar hariç; SPA ihraç eden, ihraç için Kurula başvuran veya SPA'sı halka arz edilen <b>tüzel kişiler<\/b> ve SPKn'ye tabi <b>yatırım fonları<\/b>.<\/li>\n<li><b>Fon arz edenler (yatırımcılar):<\/b> bireysel, kurumsal, nitelikli. Kurul, korumayı farklılaştırmak için yatırımcıları sınıflandırabilir (SPKn m.45/4).<\/li>\n<li><b>Sermaye piyasası araçları:<\/b> satışla fon talep eden ile fon arz eden arasında doğrudan hukuki ilişki kurulur: aracın niteliğine göre <b>ortaklık<\/b> ya da <b>borç-alacak<\/b> ilişkisi.<\/li>\n<li><b>Yardımcı kuruluşlar:<\/b> SPKn m.35 bunları \"sermaye piyasası kurumları\" olarak sayar.<\/li>\n<li><b>Borsalar ve teşkilatlanmış diğer piyasalar.<\/b><\/li>\n<\/ol>\n<ul>\n<li>Dikkat: Yatırım fonları dışında tüzel kişiliği olmayanlar, gerçek kişiler ve <b>donatma iştiraki<\/b> SPA ihraç edemez.<\/li>\n<li><b>Kurumsal yatırımcı:<\/b> mesleki faaliyet olarak başkalarından topladığı fonları SPA'ya yatırıp getiriyi dağıtan kurum; kolektif yatırım kuruluşları tipik örnektir.<\/li>\n<li><b>Nitelikli yatırımcı:<\/b> II-5.2 Satış Tebliği m.4/1-m: Kurulun yatırım kuruluşlarına ilişkin düzenlemelerinde tanımlanan, talebe dayalı profesyonel kabul edilenler dahil <b>profesyonel müşteriler<\/b>. Kurumsal yatırımcılar ile portföyü belirli tutarı aşan bireyselleri kapsar.<\/li>\n<li><b>Borsa:<\/b> kotasyondaki menkul kıymetlerin kurallara göre alım satımını sağlayan, oluşan fiyatları ilana yetkili, tüzel kişiliği olan kurum; kamu kurumu ya da anonim şirket olabilir. Fonksiyonları: <b>likidite sağlama<\/b> (en önemlisi), <b>ekonomik gösterge<\/b>, <b>itibar sağlama<\/b> (kotasyon kriterleri), <b>piyasa düzenleme<\/b> (öz düzenleyici).<\/li>\n<\/ul>\n<h3>Düzenlemeler ve hiyerarşi<\/h3>\n<ol>\n<li>6362 sayılı SPKn<\/li>\n<li>Kurul düzenlemeleri: yönetmelik, tebliğ, ilke kararı<\/li>\n<li>Diğer sermaye piyasası düzenlemeleri: 32 Sayılı Karar, borsa mevzuatı, Ticaret Bakanlığının elektronik genel kurul düzenlemeleri<\/li>\n<li>Genel hükümler: TMK, Borçlar Kanunu, TTK, TCK, HMK, CMK, İYUK<\/li>\n<\/ol>\n<ul>\n<li><b>SPKn m.2/2:<\/b> genel hükümler ancak SPKn ve ikincil mevzuatında hüküm yoksa uygulanır. Başka kanundaki bir sermaye piyasası hükmünün uygulanması için hem SP mevzuatında hüküm bulunmaması hem de o özel kanunda SPKn'nin uygulanmayacağının belirtilmesi gerekir. Böylece SPKn ve ikincil düzenlemelere <b>birincil mevzuat<\/b> statüsü verilmiştir.<\/li>\n<li>SPKn bir <b>çerçeve kanundur<\/b>; piyasa düzenleyici metin olmasının 3 sonucu: (1) çerçeve kanun niteliği, detayın Kurula bırakılması, (2) uygulamanın ve piyasaya etkinin sürekli izlenmesi, (3) Kurula geniş yaptırım yetkisi.<\/li>\n<li><b>Kurulun iki temel işlevi:<\/b> ikincil düzenleme yapmak ve başvuruları sonuçlandırmak; tedbir uygulamak, idari para cezası vermek (m.103 vd.) ve suçları (m.106 vd.) Cumhuriyet Başsavcılıklarına bildirmek.<\/li>\n<li>Düzenlemeler her aşamada <b>ihraççı, yatırımcı ve piyasa işlemi<\/b> üçlüsü gözetilerek hazırlanmalıdır.<\/li>\n<\/ul>\n<h3>SPKn'nin hazırlanmasında belirleyici faktörler<\/h3>\n<ul>\n<li><b>6102 sayılı TTK<\/b>'nın 1/7/2012'de yürürlüğe girmesi: pay sahibi haklarını güçlendirdi (bilgi alma, bireysel özel denetim, yeni azlık hakları, haklı sebeple fesih, elektronik genel kurul vb.). TTK, SP mevzuatını saklı tutan hükümler (m.332/4, 344/2, 460/7, 499/5, 506/2, 507/3, 528/1) ve Kurula yetki veren hükümler (kendi payları m.379/5, kayden izlenen paylarda GK katılımı m.417/5, kurumsal yönetim m.1529) içerir.<\/li>\n<li><b>AB müktesebatına uyum:<\/b> 17 Aralık 2004 zirvesi kararıyla 3 Ekim 2005'te Lüksemburg'da katılım müzakereleri başladı.<\/li>\n<li><b>Piyasanın ihtiyaçları:<\/b> 2499 sayılı mülga SPKn 1981'de yürürlüğe girmiş; 1992'deki kamuyu aydınlatma sistemine geçiş ve 1999 sonundaki ikincil piyasa değişiklikleri dışında esaslı değişiklik görmemişti.<\/li>\n<\/ul>\n<h3>Uygulama alanı ve istisnalar (SPKn m.136)<\/h3>\n<ul>\n<li><b>TCMB:<\/b> TCMB'ye, işlemlerine, bünyesindeki piyasalara ve nezdindeki ödeme, menkul kıymet transferi ve mutabakat sistemlerine SPKn <b>uygulanmaz<\/b>; tek istisna SPA'yı konu alan teminat sözleşmelerine ilişkin <b>m.47<\/b>'dir. TCMB kurumsal yönetim ilkelerine, borsa düzenlemelerine ve yatırımcı tazmin sistemine de tabi değildir.<\/li>\n<li><b>TCMB, Hazine ve Maliye Bakanlığı ve 4749 sayılı Kanuna göre kurulan varlık kiralama şirketleri<\/b>nin ihraçlarına SPKn'nin ihraç ve kamuyu aydınlatma bölümleri uygulanmaz: izahname hazırlama ve Kurul onayı zorunlu değildir; <b>m.31<\/b> borçlanma limitleri de uygulanmaz.<\/li>\n<li><b>Bankalar:<\/b> SPA'yı halka arz eden ve SP faaliyetinde bulunan bankalar bunlarla sınırlı olarak SPKn'ye tabidir. SPKn, <b>ortak sayısı bakımından<\/b> bankalara uygulanmaz. Halka açık bankalarda kurumsal yönetim ilkeleri <b>BDDK görüşü<\/b> alınarak uygulanır (m.17/5). Bankalar hakkında tazmin kararı için <b>BDDK'nın uygun görüşü<\/b> zorunludur (m.82/2); mevduat/katılım fonu niteliğindeki yükümlülükler yatırımcı tazmini sonucu doğurmaz. Bankalar kuruluş, gözetim, muhasebe, bağımsız denetim standartları, temettü dağıtımı ve yeniden değerleme değer artış fonunun kullanımı bakımından kendi mevzuatına tabidir.<\/li>\n<li><b>Sigorta şirketleri:<\/b> kuruluş, gözetim, muhasebe ve bağımsız denetim standartlarında kendi özel kanunlarına tabidir.<\/li>\n<\/ul>\n<h3>Sermaye piyasası araçları<\/h3>\n<ul>\n<li>SPKn SPA'yı tanımlamaz; türlerini ve kapsam dışını sayar. <b>Finansal araç<\/b> daha geniş bir kavramdır. Ödeme aracı olan <b>kambiyo senetleri<\/b> SPA değildir.<\/li>\n<li>SPA üst kavramdır: <b>menkul kıymetler<\/b>, <b>türev araçlar<\/b>, <b>diğer SPA<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Tür<\/th><th>İçerik<\/th><\/tr>\n<tr><td>Menkul kıymetler<\/td><td>(1) Pay, pay benzeri kıymetler ve bunlara ilişkin depo sertifikaları; (2) borçlanma araçları ve depo sertifikaları; (3) menkul kıymetleştirilmiş varlık ve gelirlere dayalı borçlanma araçları ve depo sertifikaları<\/td><\/tr>\n<tr><td>Türev araçlar<\/td><td>(i) Menkul kıymetleri alma, satma veya değiştirme hakkı verenler; (ii) değeri menkul kıymet, döviz, faiz, kıymetli maden/taş, mal fiyatı, Kurulca uygun görülen istatistikler, kredi riski transferi, enerji fiyatı, iklim değişkeni gibi ölçümlere veya bunlardan oluşan endekse bağlı olanlar ve bunların türevleri; (iii) döviz, kıymetli maden ve Kurulca belirlenen varlıklarda <b>kaldıraçlı işlemler<\/b><\/td><\/tr>\n<tr><td>Diğer SPA<\/td><td>Yatırım sözleşmeleri dahil Kurulca belirlenenler; ör. yatırım fonu katılma payı, gayrimenkul sertifikası, kira sertifikası<\/td><\/tr>\n<\/table>\n<ul>\n<li>Menkul kıymet niteliği, aracın sağladığı <b>hakka<\/b> göre belirlenir: ortaklık veya alacaklılık hakkı veriyorsa menkul kıymettir. Aracın Kurulca düzenlenmiş olması gerekmez.<\/li>\n<li>Dikkat: <b>Varant<\/b> menkul kıymet değil, <b>türev araçtır<\/b>.<\/li>\n<li>Menkul kıymetler dayandıkları modele göre ikiye ayrılır: <b>doğrudan işletme finansmanına dayanan<\/b> (ortaklık hakkı veren pay ve pay benzerleri ile alacaklılık hakkı veren tahvil vb.) ve <b>menkul kıymetleştirmeye dayanan<\/b>.<\/li>\n<li><b>Pay benzeri kıymet:<\/b> payın haklarının bir kısmını içeren ama sermayede karşılığı olmayan katılma intifa senedi, kâr-zarar ortaklığı belgesi. <b>Depo sertifikası<\/b> ayrı kategori değildir; yurt dışı ihraççının kıymetini temsil eder, ayrı hak vermez.<\/li>\n<li><b>Yapılandırılmış finansman:<\/b> likit olmayan varlıklar havuzlanır, nakit akışından yatırımcıya ödeme yapılır. Örnekler: MBS (ipoteğe dayalı), ABS (varlığa dayalı), covered bond (ipotek/varlık teminatlı), CDO, CDS. Menkul kıymetleştirmede alacaklar <b>özel amaçlı kuruma (SPV)<\/b> devredilir. Dayanak varlığı alma/satma hakkı veren yapılandırılmış ürünler m.3/1-u ile türevin özel türüdür, menkul kıymet değildir.<\/li>\n<li><b>Türevin 4 genel özelliği:<\/b> bir veya birden çok temele ve farazi miktara sahip olma; piyasa faktörlerine benzer tepki veren ürünlere ilişkin olma; çok küçük başlangıç teminatı; net sona erdirme (teslimatlı veya teslimatsız).<\/li>\n<\/ul>\n<h3>Kaydi sistem ve MKK<\/h3>\n<ul>\n<li>Kurulun belirlediği SPA ve bunlara ilişkin haklar <b>MKK<\/b> tarafından elektronik ortamda ihraççılar, aracı kuruluşlar ve hak sahipleri bazında izlenir; haklar senede bağlanmaz, fiziki teslim yoktur. Üçüncü kişilere karşı ileri sürmede <b>MKK'ya bildirim tarihi<\/b> esastır.<\/li>\n<li>Hangi aracın ne zaman kaydi sisteme alınacağına <b>Kurul<\/b> karar verir. Kaydi araçlar nama veya hamiline olmalarına bakılmaksızın <b>isme açılmış hesaplarda<\/b> izlenir; Kurul belirli araçlarda toplu hesap tutulmasına karar verebilir.<\/li>\n<li>MKK: özel hukuk tüzel kişiliği, anonim ortaklık, kamu hizmeti yürütür, Kurulun gözetim ve denetimindedir. MKK, üyeler ve takas-saklama kurumları yanlış kayıttan doğan zararlardan <b>kusurları oranında<\/b> sorumludur.<\/li>\n<li><b>Kaydın niteliği (m.13):<\/b> <b>açıklayıcı<\/b> kayıt; kurucu etki yoktur, kaydın aksi ispat edilebilir, kayda güvenerek iyiniyetle iktisap söz konusu değildir. Tek istisna m.13/5: haklar üçüncü kişilere ileri sürülürken <b>MKK'daki kayıt tarihi<\/b> esas alınır.<\/li>\n<\/ul>\n<h3>Teminat sözleşmeleri ve teminat yöneticisi<\/h3>\n<ul>\n<li>SPKn'de teminatlar 4 şekilde düzenlenir: SP kurumlarının Kurul/borsalara yatırdığı teminatlar; takas-saklama kuruluşlarının aldığı teminatlar; teminat konusu SPA olan sözleşmeler (<b>m.47<\/b>); SPA yükümlülüklerinin teminat altına alınması (<b>m.31/B<\/b>).<\/li>\n<li><b>m.47 kapsamı:<\/b> MKK'da <b>kayden izlenen<\/b> SPA'yı konu alan tüm teminat sözleşmeleri; taraflar ve dayanak ilişki (ticari iş dahil) önemli değildir. Cumhurbaşkanı m.137/1 ile kayden izlenmeyen SPA'yı da kapsama alabilir. Kambiyo senedi, nakit ve alacak hakkı kapsam dışıdır.<\/li>\n<li>Sözleşme <b>yazılı<\/b> yapılır; yazılılık <b>geçerlilik şartıdır<\/b>.<\/li>\n<li>İki tür: mülkiyetin teminat alana <b>geçtiği<\/b> ve teminat verende <b>kaldığı<\/b> sözleşmeler. Sözleşmede hüküm yoksa mülkiyet geçmemiş sayılır.<\/li>\n<li>Ortak hükümler: sona ermede teminatın kendisinin veya <b>eşdeğerinin<\/b> iadesi; temerrütte resen satış veya alacağa mahsup. Mülkiyet geçen türde sözleşmede aksine hüküm olmaması, mülkiyet verende kalan türde ise yetkinin sözleşmede <b>açıkça<\/b> tanınması gerekir (m.47/4). Resen satış için ihbar, süre, izin, açık artırma gibi ön şart yoktur; iki kısıt: alacağın <b>vade tarihindeki değer<\/b> esas alınır ve alacağı aşan kısım teminat verene iade edilir.<\/li>\n<li>Yeniden yapılandırma veya tasfiye kararları teminatı etkilemez; karardan sonra <b>aynı gün<\/b> yapılan işlemler de teminat alan iyiniyetliyse geçerlidir.<\/li>\n<li><b>Teminat yöneticisi (m.31/B):<\/b> genel saklama yetkisine sahip yatırım kuruluşu. Teminat varlıklarının mülkiyeti ona devredilir veya lehine sınırlı ayni hak kurulur; devir ilgili sicilde <b>beyanlar hanesine<\/b> kaydedilir. İhraçtan önce ihraççı ile <b>yazılı teminat yönetim sözleşmesi<\/b> yapılır. Unvanı, atandığı ihraç ve yetkileri ihraççı tarafından merkezin bulunduğu yer ticaret siciline tescil ve TTSG'de ilan edilir.<\/li>\n<li>Temerrütte ön şart aramaksızın varlıkları satıp bedeli yatırımcılara paylaştırabilir. Teminat varlıkları yöneticinin malvarlığından <b>ayrıdır<\/b>; kamu alacağı için bile haczedilemez, rehnedilemez, iflas masasına girmez. Sorumluluğunu hafifleten anlaşmalar <b>geçersizdir<\/b>. Varlıkları amaç dışı kullanan teminat yöneticisine TCK m.155/2'ye göre verilecek ceza <b>5 yıldan az olamaz<\/b>.<\/li>\n<\/ul>\n<h3>İhraç ve halka arz<\/h3>\n<ul>\n<li><b>İhraç (m.3/1-ğ):<\/b> SPA'nın ihraççılar tarafından çıkarılıp halka arz edilerek veya edilmeksizin satışı.<\/li>\n<li><b>Halka arz (m.3/1-f):<\/b> SPA'nın satın alınması için her türlü yoldan yapılan genel çağrı ve bu çağrı devamında gerçekleştirilen satış. Çağrının ardından satış da gerçekleşmelidir.<\/li>\n<li>Fark: muhatap kitle <b>belirsiz<\/b> ise halka arz, <b>belirli<\/b> ise halka arz edilmeksizin ihraç.<\/li>\n<li>Yatırımcı esas olarak bilgilendirilerek korunur: <b>tam, zamanında, doğru<\/b>. \"Kamuyu aydınlatma\" SPKn'de tanımlanmamıştır.<\/li>\n<\/ul>\n<table>\n<tr><th>İhraç şekli<\/th><th>Kamuyu aydınlatma belgesi<\/th><\/tr>\n<tr><td>Halka arz<\/td><td><b>İzahname<\/b> (en geniş kapsamlı)<\/td><\/tr>\n<tr><td>Halka arz edilmeksizin<\/td><td><b>İhraç belgesi<\/b> (daha dar kapsamlı)<\/td><\/tr>\n<tr><td>Kitle fonlaması (7061 sayılı Kanun, 28.11.2017)<\/td><td>İzahname veya ihraç belgesi yükümlülüğü yok<\/td><\/tr>\n<\/table>\n<h3>Finansal raporlar ve bağımsız denetim<\/h3>\n<ul>\n<li>Finansal raporlar <b>Türkiye Muhasebe Standartları<\/b> çerçevesinde Kurul düzenlemelerine uygun; zamanında, tam ve doğru hazırlanır (m.14/1). TMS'yi <b>KGK<\/b> yayımlar (TTK m.88). İlgili tebliğler: II-14.1 (finansal raporlama), II-14.2 (yatırım fonları).<\/li>\n<li><b>m.14/4:<\/b> Kurul bağımsız denetim yükümlülüğü getirebilir: halka arzda, borsada işlem görme başvurusunda, önemli nitelikteki işlemlerde (m.23), faaliyetleri ve finansal durumu önemli ölçüde etkileyen olaylarda.<\/li>\n<li>Bağımsız denetim kuruluşlarını <b>KGK<\/b> yetkilendirir; SPKn kapsamında çalışacaklar için ilave şartları <b>Kurul<\/b> belirler ve listeyi ilan eder.<\/li>\n<li>Bağımsız denetim kuruluşları, görevleriyle sınırlı olarak, mevzuata uygun denetlenmeyen tablolar nedeniyle doğan zarardan <b>raporu imzalayanlarla birlikte<\/b> sorumludur; derecelendirme ve değerleme kuruluşları raporlarındaki yanlış, yanıltıcı, eksik bilgiden sorumludur.<\/li>\n<li>Yatırım kuruluşu veya kolektif yatırım kuruluşunu denetleyen bağımsız denetçi şu halleri Kurula <b>derhal<\/b> bildirir: yetkilendirme ve faaliyet şartlarının ihlali; faaliyetlerin sürekliliğini engelleyebilecek durumlar; <b>olumsuz görüş<\/b> veya görüş bildirmekten kaçınmayı gerektiren durumlar.<\/li>\n<\/ul>\n<h3>İzahname ve ihraç belgesi<\/h3>\n<ul>\n<li><b>İzahname (m.3/1-j):<\/b> ihraççı ve varsa garantörün finansal durumu, performansı, beklentileri, faaliyetleri ile aracın özellikleri, hak ve riskleri hakkında yatırımcının bilinçli değerlendirme yapmasını sağlayacak tüm bilgileri içeren belge.<\/li>\n<li><b>m.4/1:<\/b> halka arz veya <b>borsada işlem görme<\/b> için izahname hazırlanması ve Kurulca onaylanması zorunludur.<\/li>\n<li>İzahname bir veya birden fazla belge olabilir; kısa, açık ve anlaşılır bir <b>özet<\/b> bölümü içerir. Birden fazla belgeden oluşuyorsa her belge ayrıca onaylanır.<\/li>\n<li><b>m.11/1:<\/b> halka arz edilmeksizin ihraçta <b>ihraç belgesi<\/b> hazırlanır ve m.6 esaslarına göre Kurulca onaylanır.<\/li>\n<li>6362 ile <b>Kurul kaydı sistemi kaldırıldı<\/b>, AB'ye uygun <b>izahname onayı<\/b> sistemine geçildi; ilk kez izahnameye geçerlilik süresi getirildi.<\/li>\n<li>Onay şartı (m.6/1): bilgilerin <b>tutarlı, anlaşılabilir ve standartlara göre eksiksiz<\/b> olması. Onay bir izin değildir; bilgilerin doğruluğunun Kurulca tekeffülü veya araca ilişkin <b>tavsiye<\/b> anlamına gelmez.<\/li>\n<li>İzahnamenin TTSG'de ilanı gerekmez; yalnızca <b>nerede yayımlandığı<\/b> ticaret siciline tescil ve TTSG'de ilan edilir. Kurul esaslarına göre onaydan önce de ilan edilebilir. İlan ve reklamlar izahname ile tutarlı olmalıdır.<\/li>\n<li>Satış öncesinde veya satış süresinde yatırım kararını etkileyecek değişiklik çıkarsa Kurula <b>derhal<\/b> bildirilir; değişiklikler bildirimden itibaren <b>7 iş günü<\/b> içinde onaylanıp yayımlanır. Önceden talepte bulunan yatırımcı, değişikliklerin yayımından itibaren <b>2 iş günü<\/b> içinde talebini geri alabilir.<\/li>\n<li>İlk yayımdan itibaren <b>12 ay<\/b> boyunca yapılacak ihraçlarda yalnızca ek ve değişikliklerin onayı ve ilanı yeterlidir; süre geçince izahnamenin tamamı yeniden onaylanır.<\/li>\n<\/ul>\n<h3>Kamuyu aydınlatma belgelerinden sorumluluk<\/h3>\n<ul>\n<li><b>İzahname sorumluluğu (m.10):<\/b> hukuki sorumluluktur; zarar izahnamedeki <b>yanlış, yanıltıcı veya eksik<\/b> bilgiden doğmalıdır. Önce <b>ihraççı<\/b> sorumludur. İhraççıdan tazmin edilemez veya edilemeyeceği açıkça belli olursa: halka arz edenler, ihraca aracılık eden lider aracı kurum, varsa garantör ve ihraççının yönetim kurulu üyeleri kusurlarına ve durumun gereklerine göre sorumludur.<\/li>\n<li>İzahnamedeki raporları hazırlayanlar (bağımsız denetim, derecelendirme, değerleme) kendi raporlarındaki bilgilerden sorumludur.<\/li>\n<li><b>m.32:<\/b> izahname, pay alım teklifi bilgi formu, özel durum açıklaması, birleşme/bölünme duyuru metinleri, borsada işlem görme duyurusu, finansal raporlar gibi belgeleri imzalayanlar zarardan <b>müteselsilen<\/b> sorumludur.<\/li>\n<li>Kurtulma: yanlışlıktan <b>bilgisi olmadığını<\/b> ve bunun <b>kast veya ağır ihmalinden<\/b> kaynaklanmadığını ispatlayan sorumlu olmaz.<\/li>\n<li><b>İlliyet karinesi:<\/b> izahnamenin geçerlilik süresi boyunca, diğer belgelerin ise açıklanmasından hemen sonra, ilk halka arzdan veya borsada alınan/satılan aracın gerçeğe uygun bilginin ortaya çıkmasından hemen sonra borsada satılması/alınması sonucu zarar doğarsa illiyet bağı kurulmuş sayılır.<\/li>\n<li><b>Tazmin talebinin reddi:<\/b> alım satım belgeye dayanmıyorsa; yanlışlık bilinerek işlem yapıldıysa; düzeltme yatırım kararından önce ilan edildiyse; bilgi doğru olsaydı da zarar doğacak idiyse.<\/li>\n<li><b>Özet:<\/b> II-5.1 m.13/11 ve 25/3'e göre yalnızca özete dayanarak sorumluluk yüklenemez; özet ancak izahnamenin <b>diğer kısımları ile birlikte okunduğunda<\/b> yanıltıcı, hatalı veya tutarsızsa sorumluluk doğurur.<\/li>\n<li><b>Finansal tablolar (m.14/2):<\/b> Kurul düzenlemelerine uygun hazırlanmasından, sunulmasından, gerçeğe uygunluğundan ve doğruluğundan ihraççı ile kusurlarına ve durumun gereklerine göre yönetim kurulu üyeleri sorumludur. Yönetim kurulu tabloların kabulü için <b>ayrı karar<\/b> alır; sorumlu YK üyeleri ve hazırlayan yöneticiler kamuya gerçeğe uygunluk <b>beyanı<\/b> verir.<\/li>\n<\/ul>\n<h3>Pay ihracının genel esasları<\/h3>\n<ul>\n<li><b>Tam ve nakden ödeme ilkesi:<\/b> ihraç olunan payların bedeli tam ve nakden ödenir; halka kapalı şirketlerdeki taksitli ödeme (<b>apel<\/b>) sistemi kabul edilmez.<\/li>\n<li>İstisna: Kurul, birleşme, bölünme, hisse değişimi ve benzeri yapılandırmalardaki sermaye artırımları gibi nakden ödemenin zorunlu olmadığı halleri belirler.<\/li>\n<li>Piyasa fiyatı veya defter değeri <b>nominalin üzerindeyse<\/b> Kurul, payların ve yeni pay alma haklarının <b>primli<\/b> satılmasını/kullanılmasını isteyebilir. <b>Nominalin altındaysa<\/b> payların nominal değerin altında ihracına izin verebilir (m.12/2).<\/li>\n<li>Satış ayrıntıları II-5.2 Satış Tebliği'ndedir. Kurul, halka satışta kolaylaştırıcı ve koruyucu tedbirleri ihraççı, halka arz eden, satışı yapan ve borsadan isteyebilir.<\/li>\n<\/ul>\n<h3>Borçlanma araçları ve borçlanma aracı sahipleri kurulu<\/h3>\n<ul>\n<li><b>m.31:<\/b> ihraç edilebilecek borçlanma araçlarının toplam tutarı Kurulun belirlediği limiti aşamaz; Kurul ihracın, aracın ve ihraççının niteliğine göre farklı limit koyabilir. 233 sayılı KHK saklıdır; 5302 sayılı Kanun m.51 ve 5393 sayılı Kanun m.68 limitleri hariç diğer kanunlardaki ihraç limitleri uygulanmaz.<\/li>\n<li>İhraç yetkisi esas sözleşmeyle yönetim kuruluna <b>süreli veya süresiz<\/b> devredilebilir.<\/li>\n<li>Ödeme yapılmazsa MKK'nın hak sahiplerine verdiği belge, İİK m.68/1'deki belgelerden sayılır.<\/li>\n<li><b>Borçlanma aracı sahipleri kurulu (m.31/A):<\/b> tedavüldeki araçların sahipleri bu kurulu oluşturur; her tertip ayrı kurul oluşturabilir. Toplantıya çağrı ve karar esasları izahname/ihraç belgesinde belirlenir.<\/li>\n<li>Karar nisabı: daha ağır nisap öngörülmemişse, ilgili tertibin (veya tüm araçların) <b>nominal tutarının asgari yarısını<\/b> temsil edenlerin olumlu oyu. Bu kararlar olumsuz oy verenleri de bağlar. Temsilci atanabilir.<\/li>\n<li>Temerrütten sonra hüküm ve şartlar değiştirilirse başlatılan takipler <b>durur<\/b>, ihtiyati tedbir ve haciz uygulanmaz, zamanaşımı ve hak düşürücü süreler işlemez; borç ifa edilince duran takipler düşer.<\/li>\n<\/ul>", "sorular": [{"q": "İkincil piyasanın fonksiyonları arasında aşağıdakilerden hangisi yer almaz?", "o": ["Likidite sağlamak", "İhraççıya doğrudan fon akışı sağlamak", "Fiyat belirlemeye katkı", "Vade belirlemeye katkı", "Yatırımcının aracını nakde çevirebilmesi"], "a": 1, "e": "İkincil piyasa ihraççıya fon akışı sağlamaz; üç fonksiyonu likidite, fiyat belirleme ve vade belirlemedir."}, {"q": "SPKn m.3/1-h'deki ihraççı tanımına göre aşağıdakilerden hangisi sermaye piyasası aracı ihraç edebilir?", "o": ["Gerçek kişi tacir", "Donatma iştiraki", "Adi ortaklık", "SPKn'ye tabi bir yatırım fonu", "Kitle fonlaması platformu aracılığıyla para toplayan girişim"], "a": 3, "e": "İhraççı tüzel kişiler ve SPKn'ye tabi yatırım fonlarıdır. Gerçek kişi ve donatma iştiraki ihraç edemez; kitle fonlamasıyla para toplayanlar tanım dışıdır."}, {"q": "SPKn m.2/2'ye göre genel hükümlerin sermaye piyasasında uygulanabilmesi için hangi koşul aranır?", "o": ["SPKn ve ikincil mevzuatta o konuda hüküm bulunmaması", "Kurulun yazılı izni", "Konunun TTK'da düzenlenmiş olması", "Uyuşmazlığın borsada çıkması", "Cumhurbaşkanı kararı"], "a": 0, "e": "Genel hükümler, SPKn ve ona dayanan ikincil düzenlemelerde hüküm bulunmayan hallerde uygulanır; bu SPKn'ye birincil mevzuat statüsü verir."}, {"q": "TCMB'ye ve işlemlerine SPKn hükümlerinin uygulanmaması kuralının istisnası olan hüküm hangisidir?", "o": ["Kurumsal yönetime ilişkin m.17", "Yatırımcı tazminine ilişkin hükümler", "SPA'yı konu alan teminat sözleşmelerine ilişkin m.47", "Borçlanma limitine ilişkin m.31", "Özel durum açıklamalarına ilişkin hükümler"], "a": 2, "e": "SPKn m.136/1'e göre TCMB'ye SPKn uygulanmaz; tek istisna m.47'deki teminat sözleşmeleri hükmüdür."}, {"q": "Hazine ve Maliye Bakanlığının yapacağı borçlanma aracı ihraçları için aşağıdakilerden hangisi doğrudur?", "o": ["İzahname Kurulca onaylanmalıdır", "İhraç belgesi zorunludur", "m.31 limitlerine uyulmalıdır", "Yalnızca nitelikli yatırımcılara satılabilir", "İzahname hazırlanması ve Kurul onayı zorunlu değildir"], "a": 4, "e": "TCMB, Hazine ve Maliye Bakanlığı ve 4749 sayılı Kanuna göre kurulan VKŞ ihraçlarına SPKn'nin ihraç ve kamuyu aydınlatma bölümleri ile m.31 limitleri uygulanmaz."}, {"q": "Sermaye piyasası faaliyetinde bulunan bir banka hakkında yatırımcıları tazmin kararı alınabilmesi için ne gerekir?", "o": ["TCMB'nin onayı", "BDDK'nın uygun görüşü", "Hazine ve Maliye Bakanlığının izni", "Bankanın iflasına karar verilmesi", "TSPB'nin talebi"], "a": 1, "e": "SPKn m.82/2'ye göre bankalar hakkında tazmin kararı için BDDK'dan uygun görüş alınması zorunludur."}, {"q": "Aşağıdakilerden hangisi menkul kıymet değil, türev araç niteliğindedir?", "o": ["Katılma intifa senedi", "Pay", "Kâr-zarar ortaklığı belgesi", "Varant", "Borçlanma aracı"], "a": 3, "e": "Varant menkul kıymet değil türev araçtır. Katılma intifa senedi ve kâr-zarar ortaklığı belgesi pay benzeri menkul kıymettir."}, {"q": "Aşağıdakilerden hangisi SPKn'ye göre \"diğer sermaye piyasası araçları\" grubunda örnek gösterilir?", "o": ["Kira sertifikası", "Varlığa dayalı menkul kıymet", "Kaldıraçlı işlem", "Katılma intifa senedi", "Depo sertifikası"], "a": 0, "e": "Yatırım fonu katılma payı, gayrimenkul sertifikası ve kira sertifikası diğer SPA'ya örnektir; kaldıraçlı işlemler türev araçtır."}, {"q": "MKK kayıtlarının hukuki niteliği hakkında hangisi doğrudur?", "o": ["Kurucu niteliktedir; kayıt olmadan hak doğmaz", "Kayda güvenerek iyiniyetle iktisap mümkündür", "Açıklayıcı niteliktedir; ancak üçüncü kişilere karşı ileri sürmede MKK'daki kayıt tarihi esas alınır", "Kaydın aksi ispat edilemez", "Kayıtlar yalnızca ihraççı bazında tutulur"], "a": 2, "e": "m.13'te açıklayıcı kayıt sistemi benimsenmiştir; tek istisna m.13/5: üçüncü kişilere ileri sürmede MKK kayıt tarihi esastır."}, {"q": "SPKn m.47 kapsamındaki teminat sözleşmeleri hakkında hangisi yanlıştır?", "o": ["Konusu kayden izlenen SPA'dır", "Tarafların gerçek veya tüzel kişi olması önemli değildir", "Sözleşmede hüküm yoksa mülkiyet teminat alana geçmemiş sayılır", "Teminat alan veya veren hakkındaki tasfiye kararı teminatı etkilemez", "Sözlü olarak da geçerli şekilde kurulabilir"], "a": 4, "e": "Bu sözleşmeler yazılı yapılır ve yazılı şekil geçerlilik şartıdır."}, {"q": "Mülkiyetin teminat verende kaldığı teminat sözleşmesinde teminat alanın teminatı resen satabilmesi için ne gerekir?", "o": ["Mahkemeden izin alınması", "Bu yetkinin sözleşmede açıkça tanınmış olması", "Teminat verene ihtar çekilip süre verilmesi", "Açık artırma yapılması", "Kurulun onayı"], "a": 1, "e": "m.47/4: mülkiyet verende kalan türde satış veya mahsup yetkisinin sözleşmede açıkça tanınması gerekir; ihbar, süre, izin gibi ön şartlar aranmaz."}, {"q": "Teminat konusu varlıkları tasarruf amacı dışında kullanan teminat yöneticisine TCK m.155/2'ye göre verilecek hapis cezası en az ne olabilir?", "o": ["2 yıl", "3 yıl", "1 yıl", "5 yıl", "6 ay"], "a": 3, "e": "SPKn'ye göre bu halde hükmedilecek ceza beş yıldan az olamaz."}, {"q": "Halka arzı halka arz edilmeksizin ihraçtan ayıran temel ölçüt nedir?", "o": ["Muhatap yatırımcı kitlesinin belirli veya belirsiz olması", "Satılan aracın türü", "İhraç tutarı", "İhraççının halka açık olup olmaması", "Satışın borsada yapılıp yapılmaması"], "a": 0, "e": "Her ikisinde de satış vardır; fark, muhatap kitlenin belirsiz (halka arz) ya da belirli olmasıdır."}, {"q": "İzahnamenin Kurulca onaylanması hakkında hangisi doğrudur?", "o": ["Araca yatırım tavsiyesi niteliği taşır", "Bilgilerin Kurulca teyit edildiğini gösterir", "Bilgilerin doğruluğunun Kurulca tekeffülü anlamına gelmez", "İzahnamenin TTSG'de tam metin ilanını zorunlu kılar", "Birden fazla belgeden oluşan izahnamede tek onay yeterlidir"], "a": 2, "e": "m.6/1: onay, doğruluğun tekeffülü veya tavsiye değildir. Yalnız nerede yayımlandığı tescil ve ilan edilir; her belge ayrı onaylanır."}, {"q": "Satış süresi içinde izahnamede değişiklik yapılması gerektiğinde, değişiklikler bildirim tarihinden itibaren kaç iş günü içinde onaylanıp yayımlanır?", "o": ["2", "5", "10", "12", "7"], "a": 4, "e": "Değişiklikler bildirimden itibaren 7 iş günü içinde onaylanır ve yayımlanır; yatırımcı yayımdan itibaren 2 iş günü içinde talebini geri alabilir."}, {"q": "İzahnamenin ilk yayımından itibaren hangi süre boyunca yapılacak ihraçlarda yalnızca ek ve değişikliklerin onaylanması yeterlidir?", "o": ["6 ay", "12 ay", "24 ay", "3 ay", "18 ay"], "a": 1, "e": "İlk yayımdan itibaren on iki ay boyunca ek ve değişikliklerin onayı ve ilanı yeterlidir; sonrasında tamamı onaylanır."}, {"q": "İzahnamedeki yanlış bilgiden doğan zarar ihraççıdan tazmin edilemezse aşağıdakilerden hangisi m.10 uyarınca sorumlu tutulabilecekler arasında sayılmaz?", "o": ["Halka arz edenler", "İhraca aracılık eden lider aracı kurum", "Varsa garantör", "Kurul", "İhraççının yönetim kurulu üyeleri"], "a": 3, "e": "İkincil sorumlular halka arz edenler, lider aracı kurum, garantör ve YK üyeleridir; Kurulun onayı tekeffül anlamına gelmez."}, {"q": "Kamuyu aydınlatma belgesindeki yanlışlıktan doğan tazminat talebi aşağıdaki hallerden hangisinde reddedilmez?", "o": ["Yatırımcı alımı belgenin geçerlilik süresi içinde ve belgeye dayanarak yapmışsa", "Alım belgeye dayanmıyorsa", "Yanlışlık bilinerek alım yapıldıysa", "Düzeltme yatırım kararından önce ilan edildiyse", "Bilgi doğru olsaydı da zarar doğacak idiyse"], "a": 0, "e": "Sayılan dört red halinden hiçbiri yoksa ve belgeye dayanılmışsa talep reddedilmez."}, {"q": "I. Pay bedellerinin tam ve nakden ödenmesi zorunludur. II. Birleşme ve bölünmedeki sermaye artırımlarında Kurul nakden ödeme zorunluluğu olmayan halleri belirleyebilir. III. Piyasa fiyatı nominalin altındaysa Kurul nominalin altında ihraca izin verebilir. Hangileri doğrudur?", "o": ["Yalnız I", "I ve II", "I ve III", "II ve III", "I, II ve III"], "a": 4, "e": "Üçü de doğrudur: tam ve nakden ödeme ilkesi, yapılandırma istisnası ve m.12/2'deki nominal altı ihraç imkanı.", "k": 1}, {"q": "Borçlanma aracı sahipleri kurulunda daha ağır bir nisap öngörülmemişse karar için hangi çoğunluk aranır?", "o": ["Toplantıya katılanların üçte ikisi", "Nominal tutarın dörtte üçü", "Toplantıya katılanların salt çoğunluğu", "Oybirliği", "İlgili araçların nominal tutarının asgari yarısını temsil edenlerin olumlu oyu"], "a": 4, "e": "m.31/A: nominal bedeller toplamının asgari yarısını temsil eden araç sahiplerinin olumlu oyu şarttır; karar olumsuz oy verenleri de bağlar."}, {"q": "Borçlanma aracı ihraç yetkisi yönetim kuruluna nasıl devredilebilir?", "o": ["Yalnızca genel kurul kararıyla ve en çok 5 yıl için", "Esas sözleşme ile süreli veya süresiz", "Yalnızca Kurul izniyle", "Devredilemez", "Yalnızca 1 yıl süreyle"], "a": 1, "e": "Borçlanma aracı ihraç yetkisi esas sözleşmeyle yönetim kuruluna süreli veya süresiz devredilebilir."}]}, {"id": 2, "kisa": "SPKn: Halka Açık Ortaklık", "baslik": "SPKn II: İhraççılar ve Halka Açık Ortaklıklar", "ozet": "Halka açık ortaklık ve halka açık sayılma, kayıtlı sermaye, kâr payı ve avans, örtülü kazanç aktarımı, ilişkili taraf işlemleri, yönetim kontrolü ve pay alım teklifi, önemli nitelikteki işlemler ve ayrılma hakkı, çıkarma-satma hakkı, genel kurul, imtiyaz, kendi paylarını iktisap ve muafiyetler.", "notlar": "<h3>İhraççı, halka arz eden, halka açık ortaklık<\/h3>\n<ul>\n<li><b>İhraççı (m.3/1-h):<\/b> kitle fonlamasıyla para toplayanlar hariç; SPA ihraç eden, ihraç için Kurula başvuran veya SPA'sı halka arz edilen tüzel kişiler ve SPKn'ye tabi yatırım fonları. Bir anonim şirket halka arz için <b>Kurula başvurmakla<\/b> ihraççı sıfatı kazanır.<\/li>\n<li><b>Halka arz eden (m.3/1-g):<\/b> sahip olduğu SPA'yı halka arz etmek üzere Kurula başvuran <b>gerçek veya tüzel kişi<\/b>. Halka arz eden ihraççı sıfatını kazanmaz; halka arz edilen ortaklık ihraççı olur.<\/li>\n<li><b>Halka açık ortaklık (m.3/1-e):<\/b> kitle fonlamasıyla para toplayanlar hariç; payları halka arz edilmiş veya halka arz edilmiş sayılan <b>anonim ortaklık<\/b>. Halka açık ortaklık her zaman anonim ortaklıktır.<\/li>\n<li>Dikkat: İhraççı kavramı \"sermaye piyasası aracı\"na, halka açık ortaklık kavramı \"<b>pay<\/b>\"a dayanır. Payları halka arz edilmemiş bir şirket borçlanma aracı ihraç ederek ihraççı olabilir ama halka açık ortaklık olmaz. Halka açık ortaklık, ihraççıdan daha dar bir kavramdır.<\/li>\n<li>Payların halka arzı VII-128.1 Pay Tebliği ve II-5.2 Satış Tebliği'nde düzenlenir; bunlardan farklı yolla yapılan halka arz usulsüzdür, tedbir ve suç duyurusuna yol açabilir.<\/li>\n<\/ul>\n<h3>Halka arz edilmiş sayılma (m.16)<\/h3>\n<ul>\n<li>Payları <b>borsada işlem gören<\/b> ortaklıklar ile pay sahibi sayısı <b>500'ü aşan<\/b> anonim ortaklıkların payları halka arz olunmuş sayılır.<\/li>\n<li>Borsada işlem görmeyen halka açık sayılan ortaklık, statüyü kazandıktan sonra en geç <b>2 yıl<\/b> içinde payları için borsaya başvurmak zorundadır; aksi halde Kurul, ortaklığın talebini aramaksızın payların borsada işlem görmesi veya statüden çıkarma kararını alır.<\/li>\n<li>Borsada işlem görmek istemeyen ortaklıklar (m.33): pay sahibi tam sayısının en az <b>üçte ikisinin<\/b> olumlu oyu veya toplam oyların <b>dörtte üçü<\/b> ile alınan genel kurul kararıyla Kanun kapsamından çıkabilir. Olumlu oy vermeyenlere <b>ayrılma hakkı<\/b> tanınır. Kurul, resen statüden çıkarılacak ortaklıkların hakim ortaklarına <b>pay alım teklifi<\/b> zorunluluğu getirebilir.<\/li>\n<li><b>Kooperatif kontrolündeki şirketler<\/b> (7061 ile eklendi, 7159 ile değişti): pay sahibi sayısı en az 500 olan kooperatiflerin veya ortak kooperatiflerinin pay sahibi sayısı tek başına ya da toplam en az 500 olan kooperatif birliği/merkez birliklerinin yönetim kontrolündeki ve yıllık en az <b>50 milyon TL<\/b> satış hasılatı yapmış AO'ların payları halka arz olunmuş sayılır. Bunların <b>borsaya başvurma zorunluluğu yoktur<\/b>.<\/li>\n<\/ul>\n<h3>Kayıtlı sermaye sistemi<\/h3>\n<ul>\n<li><b>Kayıtlı sermaye (m.3/1-l):<\/b> esas sözleşmede hüküm bulunmak kaydıyla yönetim kurulu kararıyla, TTK'nın sermaye artırımı hükümlerine tabi olmaksızın pay çıkarılabilecek azami miktarı gösteren, tescil ve ilan edilmiş sermaye. <b>Çıkarılmış sermaye (m.3/1-d):<\/b> kayıtlı sermayeli ortaklığın satışı yapılmış paylarını temsil eden sermaye.<\/li>\n<li>2499 döneminde yalnız halka açık ortaklıklara özgüydü; TTK ile halka kapalı şirketlere de açıldı. Halka açık ortaklıklar ve halka arz için başvuranlar sisteme <b>Kurul izniyle<\/b> geçer; daha önce TTK'ya göre geçmiş olanlar için ayrıca izin aranmaz.<\/li>\n<li>YK'ya yetki genel kurulca en çok <b>5 yıl<\/b> için verilir; azami 5 yıllık dönemlerle GK kararıyla uzatılabilir.<\/li>\n<li>İmtiyazlı paylar varsa bu kapsamdaki esas sözleşme değişikliği kararları imtiyazlı pay sahipleri özel kurulunca onaylanır; ancak <b>tavan dahilindeki<\/b> sermaye artırımlarında ayrıca özel kurul kararı aranmaz.<\/li>\n<li>YK'nın şu konularda karar alabilmesi için esas sözleşmeyle yetkili kılınması şarttır: imtiyazlı pay çıkarma; nominal değerin üzerinde veya altında pay çıkarma; yeni pay alma haklarını sınırlama; imtiyazlı pay sahiplerinin haklarını kısıtlama. Yeni pay alma hakkını kısıtlama yetkisi <b>eşitsizlik<\/b> yaratacak şekilde kullanılamaz.<\/li>\n<li>Bu YK kararlarına karşı YK üyeleri veya hakları ihlal edilen pay sahipleri, kararın ilanından itibaren <b>30 gün<\/b> içinde merkezin bulunduğu yer ticaret mahkemesinde iptal davası açabilir.<\/li>\n<li>Paya değiştirilebilir tahvil veya paya dönüştürülebilir türev çıkarılırsa, verilecek paylar ile çıkarılmış sermayenin toplamı <b>kayıtlı sermayeyi aşamaz<\/b>.<\/li>\n<\/ul>\n<h3>Kâr payı ve kâr payı avansı (m.19)<\/h3>\n<ul>\n<li>2499 döneminde Kurulun belirlediği asgari oranda dağıtım zorunluydu. 6362'de halka açık ortaklıklar kârlarını <b>genel kurulun belirlediği kâr dağıtım politikası<\/b> çerçevesinde dağıtır; dağıtım zorunluluğu veya Kurul oranı yoktur. Kurul benzer nitelikteki ortaklıklar için farklı esaslar belirleyebilir.<\/li>\n<li>Kanuni yedek akçeler ve esas sözleşmedeki pay sahibi kâr payı ayrılmadıkça başka yedek akçe ayrılamaz, kâr ertesi yıla aktarılamaz; intifa senedi sahiplerine, YK üyelerine ve çalışanlara kârdan pay dağıtılamaz.<\/li>\n<li>Kâr payı, dağıtım tarihindeki mevcut payların tümüne, ihraç ve iktisap tarihlerine bakılmaksızın <b>eşit<\/b> dağıtılır. Bedelsiz paylar artırım tarihindeki mevcut paylara dağıtılır.<\/li>\n<li>Bağış yapılması veya pay sahibi dışındakilere kârdan pay dağıtılması için <b>esas sözleşmede hüküm<\/b> şarttır; bağış sınırını <b>genel kurul<\/b> belirler; yıl içinde yapılan bağışlar dağıtılabilir kâr matrahına eklenir.<\/li>\n<li><b>Kâr payı avansı:<\/b> bir hesap döneminde verilecek toplam avans, bir önceki yıl dönem kârının <b>yarısını<\/b> aşamaz. Önceki avanslar mahsup edilmeden ilave avans veya kâr payı dağıtılamaz.<\/li>\n<li>Ara dönem tablolarının gerçeği yansıtmaması nedeniyle hatalı avanstan doğan zarardan YK üyeleri ve (raporlarıyla sınırlı) bağımsız denetçiler; ortaklığa, pay sahiplerine, alacaklılara ve avansın kararlaştırıldığı veya ödendiği dönemde pay iktisap edenlere karşı sorumludur.<\/li>\n<\/ul>\n<h3>Örtülü kazanç aktarımı (m.21)<\/h3>\n<ul>\n<li><b>Kapsam:<\/b> halka açık ortaklıklar ve kolektif yatırım kuruluşları ile bunların iştirak ve bağlı ortaklıkları.<\/li>\n<li><b>Aktif eylemle (m.21/1):<\/b> yönetim, denetim veya sermaye bakımından doğrudan/dolaylı ilişkili kişilerle emsallere uygunluk, piyasa teamülleri, basiret ve dürüstlük ilkelerine aykırı fiyat, ücret, bedel veya şartlar içeren işlemler ya da işlem hacmi üretme yoluyla kârı/malvarlığını azaltmak veya artmasını engellemek.<\/li>\n<li><b>Pasif/ihmali davranışla (m.21/2):<\/b> basiretli tacir olarak yapılması beklenen faaliyetleri yapmayarak ilişkili kişilerin kârını/malvarlığını artırmak.<\/li>\n<li>Kurul tespit ederse ortaklık, Kurulun belirlediği süre içinde aktarılan tutarın <b>kanuni faiziyle<\/b> iadesini talep eder; karşı taraf iade etmek zorundadır. Tedbirler ile hukuki, cezai, idari yaptırımlar ayrıca uygulanır.<\/li>\n<li>İlişkili taraf işlemlerinin emsallere uygunluğunu gösteren belgeler en az <b>8 yıl<\/b> saklanır.<\/li>\n<li>Dikkat: Aktif örtülü kazanç <b>suç<\/b> (m.110, güveni kötüye kullanma), pasif örtülü kazanç <b>idari para cezası<\/b> (m.103/6) yaptırımına tabidir.<\/li>\n<\/ul>\n<h3>İlişkili taraf işlemleri (Kanun düzeyi)<\/h3>\n<ul>\n<li>Uygulama şartları: halka açık ortaklık; esasları Kurulca belirlenen nitelik ve nicelikte işlem; karşı taraf ilişkili taraf; işlem için YK kararı; bu kararda <b>bağımsız YK üyelerinin çoğunluğunun onayı<\/b>.<\/li>\n<li>Bağımsız üye onayı alınamazsa: durum yeterli bilgiyle kamuya duyurulur ve işlem için <b>genel kurul kararı<\/b> alınır; GK'da işlemin tarafları ve ilişkili kişiler <b>oy kullanamaz<\/b>.<\/li>\n<li>Bu esaslara uyulmadan alınan YK ve GK kararları <b>geçerli sayılmaz<\/b>; malvarlığı/sermaye azalırsa Kurul m.92 yetkilerini kullanır.<\/li>\n<\/ul>\n<h3>Kurumsal yönetim ilkeleri (Kanun düzeyi)<\/h3>\n<ul>\n<li>Kurumsal yönetim ilk kez 6362 ile etraflı düzenlendi. Kurulun yetkileri: ilkeleri belirlemek; uyum raporlarının içeriği; yayımlanması; uyumun derecelendirilmesi; bağımsız YK üyeliği esasları. Bunlar <b>II-17.1 Kurumsal Yönetim Tebliği<\/b>'nde düzenlendi.<\/li>\n<li>Yetkiler haksız rekabete yol açmadan, eşit koşullardaki şirketlere eşit kural ilkesiyle kullanılır.<\/li>\n<li>Kurul, <b>payları borsada işlem gören<\/b> halka açık ortaklıkları ilkelere kısmen veya tamamen uymaya zorlayabilir; süresinde uyulmazsa kararları alıp işlemleri <b>resen<\/b> yapabilir; süre vermemiş olsa bile her türlü teminattan muaf olarak ihtiyati tedbir isteyebilir, dava açabilir, uyumu sağlayacak karar alınmasını isteyebilir.<\/li>\n<\/ul>\n<h3>Yönetim kontrolü ve pay alım teklifi<\/h3>\n<ul>\n<li>TTK m.408/2'ye göre YK üyelerini seçme yetkisi genel kurulundur, devredilemez. Halka açık ortaklıklarda katılım düşük olduğundan toplantı nisapları ve azlık oranları düşürülmüştür.<\/li>\n<li>Pay alım teklifi <b>gönüllü<\/b> (m.25/1) veya <b>zorunlu<\/b> olabilir. Kurulun yasakladığı teklife dayanılarak yapılan işlemler <b>geçersizdir<\/b>.<\/li>\n<li>Zorunlu teklif, yönetim kontrolünü sağlayan payların/oy haklarının iktisabının <b>kamuya açıklandığı tarihte<\/b> pay sahibi olan diğer ortakların paylarına yönelir.<\/li>\n<li><b>Yönetim kontrolü (m.26/2):<\/b> oy haklarının <b>%50'sinden fazlasına<\/b> tek başına veya birlikte hareket edenlerle doğrudan ya da dolaylı sahip olmak; veya oranı aşmasa bile YK üye sayısının <b>salt çoğunluğunu<\/b> seçme ya da aday gösterme hakkı veren imtiyazlı paylara sahip olmak.<\/li>\n<li>Kurul, yatırım ortaklıklarının niteliğini değiştiren veya yitirten esas sözleşme değişikliklerine izin vermek için pay alım teklifi zorunluluğu getirebilir.<\/li>\n<li><b>Yaptırımlar:<\/b> süresinde teklif yapılmazsa oy hakları <b>donar<\/b> ve bu paylar genel kurul nisabında dikkate alınmaz (m.26/6); teklife konu payların <b>toplam bedeline kadar<\/b> idari para cezası (m.103/3).<\/li>\n<\/ul>\n<h3>Önemli nitelikteki işlemler ve ayrılma hakkı (m.23)<\/h3>\n<ul>\n<li>Birleşme ve bölünmeye taraf olma, tür değiştirme, imtiyaz öngörme veya mevcut imtiyazların kapsamını/konusunu değiştirme gibi ortaklığın yapısına ilişkin temel işlemler. Liste <b>sınırlı sayıda değildir<\/b>.<\/li>\n<li>Kurul düzenlemesiyle: nakit sermaye artırımında elde edilecek fonun <b>mevcut sermayeyi aşması<\/b> ve ilişkili taraflara nakit dışı varlık devrinden doğan borçların ödenmesinde kullanılması da önemli nitelikteki işlemdir. Ayrıntı: <b>II-23.3<\/b> Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği.<\/li>\n<li>Kurallara uyulmadan yapılan işlemlerde, Kurul kararının tebliğinden itibaren <b>30 gün<\/b> içinde eski durum sağlanmazsa Kurul idari para cezası verebilir ve TTK'nın GK kararlarının iptali hükümleri çerçevesinde dava açabilir.<\/li>\n<li><b>Ayrılma hakkı:<\/b> önemli nitelikteki işleme ilişkin GK'ya katılıp <b>olumsuz oy<\/b> kullanan ve <b>muhalefet şerhini<\/b> tutanağa geçiren pay sahibi, paylarını <b>adil bedelle<\/b> ortaklığa satarak ayrılabilir. Hak, işlemin kamuya açıklandığı tarihte sahip olunan paylar için kullanılır. Kurul, payların ortaklıkça alınmadan önce diğer pay sahiplerine veya yatırımcılara önerilmesini düzenleyebilir.<\/li>\n<li>Pay sahibinin GK'ya katılması haksız engellenmişse, davet usulüne uygun yapılmamışsa veya gündem usulüne uygun ilan edilmemişse olumsuz oy ve şerh şartı aranmaz.<\/li>\n<\/ul>\n<h3>Ortaklıktan çıkarma ve satma hakkı (m.27)<\/h3>\n<ul>\n<li>Pay alım teklifi sonucunda veya başka şekilde (birlikte hareket dahil) oy haklarının Kurulca belirlenen orana veya fazlasına ulaşılırsa: hakim taraf için <b>çıkarma hakkı<\/b> (azınlık paylarının iptali ve yeni payların kendisine satılmasını talep), azınlık için <b>satma hakkı<\/b> (paylarının adil bedelle satın alınmasını talep) doğar.<\/li>\n<li>II-27.3 m.4/1: oy haklarının <b>%98<\/b>'ine ulaşılması veya bu konumdayken ek pay alımıyla oranın aşılması.<\/li>\n<li>Dikkat: Çıkarma ve satma hakkı için önceden <b>pay alım teklifi yapılmış olması şart değildir<\/b>.<\/li>\n<\/ul>\n<h3>Genel kurul<\/h3>\n<ul>\n<li>Çağrı: esas sözleşmedeki şekilde, ortaklığın internet sitesi, <b>KAP<\/b> ve Kurulun belirlediği yerlerde ilanla; ilan ve toplantı günleri hariç toplantıdan en az <b>3 hafta önce<\/b>.<\/li>\n<li>Nisap: merkezin yurt dışına taşınması ve bilanço zararlarının kapatılması için yükümlülük/ikincil yükümlülük kararları hariç, daha ağır nisap yoksa <b>TTK m.418<\/b>: sermayenin en az <b>dörtte biri<\/b> ile toplanır, ikinci toplantıda nisap aranmaz; kararlar hazır oyların çoğunluğuyla alınır.<\/li>\n<li>Kurulun görüşülmesini veya duyurulmasını istediği konular, gündeme bağlılık aranmaksızın gündeme alınır. Azlığın gündeme madde ekletme hakkı, karar taslaklarının görüşülmesini de kapsar.<\/li>\n<li><b>Özel nisap:<\/b> yeni pay alma haklarının kısıtlanması, kayıtlı sermayede YK'ya kısıtlama yetkisi verilmesi, sermayenin azaltılması ve önemli nitelikteki işlemler için toplantı nisabı aranmaksızın GK'ya katılan oy hakkı olan payların <b>üçte ikisinin<\/b> olumlu oyu gerekir. Sermayeyi temsil eden oy hakkı olan payların <b>en az yarısı<\/b> hazırsa katılanların <b>çoğunluğu<\/b> yeterlidir. Esas sözleşme daha ağır nisap koyabilir; hafifleten hükümler geçersizdir. TTK m.436/1 uyarınca taraf olan ortaklar oy kullanamaz.<\/li>\n<li>Kayden izlenen paylarda GK'ya, YK'nın MKK'dan aldığı pay sahipleri listesine göre hazırlanan <b>hazır bulunanlar listesindeki<\/b> kişiler kimlik göstererek katılır. Katılım ve oy hakkı payların depo edilmesi şartına bağlanamaz (\"<b>genel kurul blokajı<\/b>\" kaldırıldı). Elektronik katılım MKK sistemi üzerinden olur.<\/li>\n<li>Esas sözleşme değişikliği için <b>Kurulun uygun görüşü<\/b> zorunludur (m.33/2).<\/li>\n<\/ul>\n<h3>İmtiyazlı paylar, kendi paylarını iktisap, muafiyetler<\/h3>\n<ul>\n<li>İlk halka arzda mevcut tüm imtiyazlar şeffaf ve anlaşılır biçimde kamuya duyurulur.<\/li>\n<li><b>Üst üste 5 yıl zarar<\/b> eden ortaklıkta, yapılacak ilk GK'da oy hakkına ve YK'da temsile ilişkin imtiyazlar Kurul kararıyla kaldırılır.<\/li>\n<li><b>Kendi paylarını iktisap (m.22):<\/b> halka açık ortaklık, Kurul şartlarıyla kendi paylarını satın alabilir ve <b>rehin<\/b> alabilir. Konsolide bilançoya dahil ortaklıkların alımları da aynı hükümlere tabidir. Geri alım bedeli kadar <b>yedek akçe<\/b> ayrılır ve özkaynaklarda <b>kısıtlanmış yedek<\/b> olarak sınıflandırılır.<\/li>\n<li><b>Muafiyetler:<\/b> Kurul ihraçları; büyüklük, yatırımcı kitlesi, garantiler, bilgiler, borsada işlem görme veya satış yöntemine göre kısmen ya da tamamen muaf tutabilir. İhraççılar ve halka açık ortaklıklar <b>500'den fazla ortağı olsa bile<\/b> bilanço ve sermaye büyüklüğü, faaliyetin devamlılığı, ortaklığın belirli kişilerle sınırlı olması, sermaye dağılımı gibi şartlarla resen veya talep üzerine muaf tutulabilir ya da Kanun kapsamından çıkarılabilir.<\/li>\n<\/ul>", "sorular": [{"q": "SPKn'ye göre halka açık ortaklık ile ihraççı kavramları hakkında hangisi doğrudur?", "o": ["İkisi aynı kapsamdadır", "Halka açık ortaklık ihraççıdan daha geniş bir kavramdır", "Halka açık ortaklık pay kavramını, ihraççı sermaye piyasası aracı kavramını esas alır", "Limited şirketler de halka açık ortaklık olabilir", "Halka arz eden gerçek kişi ihraççı sıfatı kazanır"], "a": 2, "e": "Halka açık ortaklık daha dar bir kavramdır, payı esas alır ve her zaman anonim ortaklıktır; halka arz eden ihraççı sıfatı kazanmaz."}, {"q": "Payları borsada işlem görmeyen bir anonim ortaklığın halka açık sayılması için pay sahibi sayısı en az ne olmalıdır?", "o": ["250'yi aşmalıdır", "100'ü aşmalıdır", "1.000'i aşmalıdır", "300'ü aşmalıdır", "500'ü aşmalıdır"], "a": 4, "e": "SPKn m.16: pay sahibi sayısı beş yüzü aşan anonim ortaklıkların payları halka arz olunmuş sayılır."}, {"q": "Pay sahibi sayısı nedeniyle halka açık sayılan ve payları borsada işlem görmeyen ortaklık, statüyü kazandıktan sonra en geç ne kadar süre içinde borsaya başvurmalıdır?", "o": ["1 yıl", "2 yıl", "6 ay", "3 yıl", "5 yıl"], "a": 1, "e": "En geç iki yıl içinde başvurmazsa Kurul, ortaklığın talebini aramaksızın borsada işlem görme veya statüden çıkarma kararı alır."}, {"q": "Halka açık sayılan bir ortaklığın SPKn m.33 uyarınca Kanun kapsamından çıkması için gereken genel kurul kararı hangisidir?", "o": ["Toplantıya katılanların salt çoğunluğu", "Sermayenin dörtte birinin olumlu oyu", "Oybirliği", "Pay sahibi tam sayısının en az üçte ikisinin olumlu oyu veya toplam oyların dörtte üçü", "Toplam oyların üçte ikisi ve Kurul izni"], "a": 3, "e": "Kapsamdan çıkma kararı pay sahibi tam sayısının en az 2/3'ü veya toplam oyların 3/4'ü ile alınır; olumlu oy vermeyenlere ayrılma hakkı tanınır."}, {"q": "Kooperatif birlikleri kontrolündeki anonim ortaklıkların halka açık sayılması için aranan yıllık asgari satış hasılatı nedir?", "o": ["50 milyon TL", "10 milyon TL", "25 milyon TL", "100 milyon TL", "500 milyon TL"], "a": 0, "e": "Yıllık en az elli milyon TL satış hasılatı yapmış olmak gerekir; bu ortaklıkların borsaya başvurma zorunluluğu yoktur."}, {"q": "Kayıtlı sermaye sisteminde yönetim kuruluna verilen sermaye artırma yetkisi hakkında hangisi doğrudur?", "o": ["Süresiz verilebilir", "En çok 3 yıl için verilir, uzatılamaz", "Genel kurulca en çok 5 yıl için verilir, 5 yıllık dönemlerle uzatılabilir", "Kurul tarafından verilir", "En çok 10 yıl için verilir"], "a": 2, "e": "Yetki genel kurulca en çok beş yıl süreyle verilir; azami beş yıllık dönemler itibarıyla uzatılabilir."}, {"q": "Kayıtlı sermaye sisteminde yönetim kurulunun yeni pay alma haklarını kısıtlama kararına karşı iptal davası hangi süre içinde açılabilir?", "o": ["Karar tarihinden itibaren 3 ay", "Kararın ilanından itibaren 1 yıl", "Karar tarihinden itibaren 15 gün", "Kararın ilanından itibaren 60 gün", "Kararın ilanından itibaren 30 gün"], "a": 4, "e": "YK üyeleri veya hakları ihlal edilen pay sahipleri kararın ilanından itibaren otuz gün içinde ticaret mahkemesinde iptal davası açabilir."}, {"q": "Halka açık ortaklıklarda kâr dağıtımına ilişkin hangisi doğrudur?", "o": ["Kurul asgari bir dağıtım oranı belirler ve bu oranın altında dağıtım yapılamaz", "Kâr payı, dağıtım tarihindeki mevcut payların tümüne ihraç ve iktisap tarihine bakılmaksızın eşit dağıtılır", "Bağış için esas sözleşmede hüküm aranmaz", "Bağış sınırını yönetim kurulu belirler", "Yıl içindeki bağışlar dağıtılabilir kâr matrahından düşülür"], "a": 1, "e": "6362'de dağıtım zorunluluğu ve Kurul oranı yoktur; bağış için esas sözleşme hükmü şarttır, sınırı genel kurul belirler, bağışlar matraha eklenir."}, {"q": "Bir halka açık ortaklığın geçen yıl dönem kârı 80 milyon TL'dir. Bu hesap döneminde dağıtabileceği toplam kâr payı avansı en fazla ne kadardır?", "o": ["20 milyon TL", "80 milyon TL", "60 milyon TL", "40 milyon TL", "16 milyon TL"], "a": 3, "e": "Bir hesap dönemindeki toplam avans, önceki yıl dönem kârının yarısını aşamaz: 80 / 2 = 40 milyon TL."}, {"q": "Halka açık ortaklıklar, ilişkili taraf işlemlerinin emsallere uygunluğunu gösteren belgeleri en az ne kadar süre saklamalıdır?", "o": ["8 yıl", "5 yıl", "10 yıl", "3 yıl", "Süresiz"], "a": 0, "e": "SPKn m.21/3: tevsik edici bilgi ve belgeler en az sekiz yıl saklanır."}, {"q": "Pasif/ihmali davranışla gerçekleştirilen örtülü kazanç aktarımının SPKn'deki yaptırımı nedir?", "o": ["Güveni kötüye kullanma suçu", "Bilgi suistimali suçu", "İdari para cezası", "Yalnızca hukuki iade", "Faaliyet izninin iptali"], "a": 2, "e": "Aktif örtülü kazanç m.110'da suç olarak, pasif/ihmali olan ise m.103/6'da idari para cezası olarak düzenlenmiştir."}, {"q": "İlişkili taraf işlemine ait YK kararında bağımsız üyelerin çoğunluğunun onayı alınamazsa ne olur?", "o": ["İşlem kesin olarak yapılamaz", "Kurul izni ile işlem yapılır", "Bağımsız üyeler görevden alınır", "İşlem yönetim kurulunun oybirliği ile yapılabilir", "Durum kamuya duyurulur ve işlem için genel kurul kararı alınır; tarafların ve ilişkili kişilerin oy hakkı yoktur"], "a": 4, "e": "Onay alınamazsa işlem yeterli bilgiyle kamuya duyurulur ve genel kurula götürülür; işlemin tarafları ile ilişkili kişiler oy kullanamaz."}, {"q": "SPKn m.26/2'ye göre aşağıdakilerden hangisi yönetim kontrolünün elde edildiğini gösterir?", "o": ["Sermayenin %25'ine sahip olmak", "Oy haklarının %50'sinden fazlasına doğrudan veya dolaylı sahip olmak", "Oy haklarının %33'üne sahip olmak", "Yönetim kuruluna bir üye seçtirme imtiyazına sahip olmak", "Sermayenin %10'una sahip olup genel müdürü atamak"], "a": 1, "e": "Oy haklarının yarısından fazlası veya YK üye sayısının salt çoğunluğunu seçme/aday gösterme imtiyazı yönetim kontrolünü sağlar."}, {"q": "Zorunlu pay alım teklifinde bulunmayanlar hakkında hangisi SPKn'de öngörülen bir yaptırım değildir?", "o": ["Oy haklarının donması", "Paylarının genel kurul nisabında dikkate alınmaması", "Teklif konusu payların toplam bedeline kadar idari para cezası", "Paylarının Kurul kararıyla iptal edilmesi", "Oy haklarının teklif yapılıncaya kadar kullanılamaması"], "a": 3, "e": "Öngörülenler oy haklarının donması (nisapta dikkate alınmama) ve toplam bedele kadar idari para cezasıdır; payların iptali öngörülmemiştir."}, {"q": "Önemli nitelikteki işlemlerde ayrılma hakkı kullanabilmek için kural olarak hangi şart aranır?", "o": ["Genel kurula katılıp olumsuz oy kullanmak ve muhalefet şerhini tutanağa geçirtmek", "Sermayenin en az %5'ine sahip olmak", "İşlemden önce Kurula başvurmak", "Paylarını borsada satmış olmak", "Genel kurula katılmamış olmak"], "a": 0, "e": "Olumsuz oy ve muhalefet şerhi şarttır; haksız engelleme, usulsüz davet veya gündemin usulsüz ilanı halinde bu şart aranmaz."}, {"q": "Önemli nitelikteki işlemlerle ilgili Kurul kararının tebliğinden itibaren kaç gün içinde işlem öncesi durum sağlanmazsa Kurul idari para cezası verebilir?", "o": ["15", "60", "30", "90", "10"], "a": 2, "e": "Kurul kararının tebliğinden itibaren otuz gün içinde eski durum sağlanmazsa idari para cezası ve iptal davası gündeme gelir."}, {"q": "II-27.3 sayılı Tebliğ'e göre ortaklıktan çıkarma ve satma hakları kural olarak hangi oranda doğar?", "o": ["Oy haklarının %95'ine ulaşılması", "Oy haklarının %90'ına ulaşılması", "Sermayenin %67'sine ulaşılması", "Oy haklarının %75'ine ulaşılması", "Oy haklarının %98'ine ulaşılması"], "a": 4, "e": "Tebliğ m.4/1: oy haklarının %98'ine ulaşılması veya bu konumda iken ek pay alınarak oranın aşılması gerekir; öncesinde pay alım teklifi şart değildir."}, {"q": "Halka açık ortaklık genel kurul toplantı ilanı, ilan ve toplantı günleri hariç toplantıdan en az ne kadar önce yapılmalıdır?", "o": ["2 hafta", "3 hafta", "15 gün", "1 ay", "10 gün"], "a": 1, "e": "Çağrı internet sitesi, KAP ve Kurulun belirlediği yerlerde, ilan ve toplantı günleri hariç en az üç hafta önce yapılır."}, {"q": "Sermaye azaltımına ilişkin genel kurulda, oy hakkı olan payların %40'ı hazırdır ve esas sözleşmede ağırlaştırıcı hüküm yoktur. Karar için hangi çoğunluk gerekir?", "o": ["Toplantıya katılanların salt çoğunluğu", "Sermayenin dörtte üçü", "Sermayenin yarısı", "Toplantıya katılan oy hakkı olan payların üçte ikisi", "Oybirliği"], "a": 3, "e": "Sermayenin yarısından azı hazır olduğundan, toplantı nisabı aranmaksızın katılan payların 2/3'ünün olumlu oyu gerekir; yarısı hazır olsaydı çoğunluk yeterdi."}, {"q": "Halka açık ortaklıklarda genel kurula katılım hakkı hakkında hangisi yanlıştır?", "o": ["Katılım, payların bir kuruluş nezdinde depo edilmesi şartına bağlanabilir", "Kayden izlenen paylarda hazır bulunanlar listesi MKK'dan sağlanan listeye göre oluşturulur", "Listede adı olanlar kimlik göstererek katılır", "Elektronik katılım MKK sistemi üzerinden yapılır", "Esas sözleşme değişikliği için Kurulun uygun görüşü gerekir"], "a": 0, "e": "Katılma ve oy hakkı depo şartına bağlanamaz; böylece genel kurul blokajı uygulaması kaldırılmıştır."}, {"q": "Üst üste kaç yıl zarar eden halka açık ortaklıkta oy hakkına ve YK'da temsile ilişkin imtiyazlar Kurul kararıyla kaldırılır?", "o": ["3", "2", "5", "4", "10"], "a": 2, "e": "Üst üste beş yıl zarar eden ortaklıklarda ilk genel kurulda bu imtiyazlar Kurul kararıyla kaldırılır."}, {"q": "Halka açık ortaklığın geri aldığı kendi payları için hangisi doğrudur?", "o": ["Geri alınan paylar derhal itfa edilmek zorundadır", "Ortaklık kendi paylarını rehin olarak kabul edemez", "Bağlı ortaklıkların ana ortaklık paylarını alması serbesttir", "Geri alım bedeli kadar sermaye azaltılır", "Geri alım bedeli kadar yedek akçe ayrılır ve kısıtlanmış yedek olarak sınıflandırılır"], "a": 4, "e": "Geri alım bedeli kadar yedek akçe ayrılır; konsolide bilançoya dahil ortaklıkların alımları da aynı kurallara tabidir; rehin almak da mümkündür."}]}, {"id": 3, "kisa": "SPKn: Faaliyet ve Kurumlar", "baslik": "SPKn III: Sermaye Piyasası Faaliyetleri, Kurumları ve Yatırımcı Tazmin Merkezi", "ozet": "Yatırım hizmetleri ve yan hizmetler, kitle fonlaması ve kripto varlık hizmet sağlayıcıları, yatırım kuruluşları, kolektif yatırım kuruluşları ve portföy saklama, finansal altyapı kuruluşları, borsalar, öz düzenleyici kurumlar ve Yatırımcı Tazmin Merkezi.", "notlar": "<h3>Faaliyet bazlı düzenleme<\/h3>\n<ul>\n<li>6362, AB mevzuatı ve kriz sonrası yaklaşımla <b>kurum bazlı<\/b> değil <b>faaliyet bazlı<\/b> düzenlemeyi benimsedi: \"bir faaliyeti hangi kuruluş yapabilir\" sorusu esastır. Kurul, her hizmeti araç veya faaliyet bazında ayrı kuruluşlara yaptırabilir.<\/li>\n<li>SP faaliyetleri 3 kısımdır: (1) SP kurumlarının SPKn kapsamındaki faaliyetleri, (2) yatırım hizmet ve faaliyetleri, (3) yan hizmetler.<\/li>\n<\/ul>\n<h3>Yatırım hizmet ve faaliyetleri (m.37)<\/h3>\n<ol>\n<li>Emirlerin alınması ve iletilmesi (<b>emir iletimine aracılık<\/b>)<\/li>\n<li>Emirlerin müşteri adına ve hesabına veya kendi adına müşteri hesabına gerçekleştirilmesi (<b>işlem aracılığı<\/b>)<\/li>\n<li>Kendi hesabından alım satım (<b>portföy aracılığı<\/b>)<\/li>\n<li><b>Portföy yöneticiliği<\/b><\/li>\n<li><b>Yatırım danışmanlığı<\/b><\/li>\n<li>Halka arzda <b>yüklenimde bulunarak<\/b> satışa aracılık<\/li>\n<li>Halka arzda <b>yüklenimde bulunmaksızın<\/b> satışa aracılık<\/li>\n<li><b>Çok taraflı alım satım sistemleri<\/b> ve borsa dışı teşkilatlanmış pazar yerlerinin işletilmesi<\/li>\n<li>SPA'nın müşteri namına <b>saklanması ve yönetimi<\/b>, portföy saklanması<\/li>\n<li>Kurulca belirlenecek diğer hizmetler<\/li>\n<\/ol>\n<p>Esaslar: <b>III-37.1<\/b> Yatırım Hizmetleri, Faaliyetleri ve Yan Hizmetler Tebliği.<\/p>\n<h3>Yan hizmetler (m.38)<\/h3>\n<ul>\n<li>Sermaye piyasaları ile ilgili danışmanlık; proje finansmanı dahil Kurulca belirlenecek hizmetlerde kambiyo mevzuatı saklı kalmak kaydıyla kredi veya ödünç verilmesi ve döviz hizmetleri; SPA işlemleriyle ilgili yatırım araştırması, finansal analiz veya genel tavsiye; aracılık yükleniminin yürütülmesiyle ilgili hizmetler; borçlanma veya başka yollarla finansman sağlanmasında aracılık; <b>servet yönetimi ve finansal planlama<\/b>; Kurulca belirlenecek diğer hizmetler.<\/li>\n<li>Yan hizmetler için <b>ayrıca izin alınması gerekmez<\/b>; sunmak zorunlu değildir. Dikkat: Münhasıran yan hizmet yapmak için yatırım kuruluşu <b>kurulamaz<\/b>.<\/li>\n<\/ul>\n<h3>Kitle fonlaması (7061 sayılı Kanun)<\/h3>\n<ul>\n<li><b>Tanım:<\/b> bir projenin veya girişim şirketinin ihtiyaç duyduğu fonu sağlamak amacıyla, Kurul esasları dahilinde ve SPKn'nin <b>yatırımcı tazmini hükümlerine tabi olmaksızın<\/b> kitle fonlama platformları aracılığıyla halktan para toplanması.<\/li>\n<li>Diğer kanunların yardım ve bağış toplama hükümleri saklı kalmak kaydıyla, yalnız Kurulca faaliyet izni verilen platformlar aracılığıyla yapılır. Platform: elektronik ortamda hizmet veren aracı. Kurul, kitle fonlamasının <b>ortaklığa<\/b> veya <b>borçlanmaya<\/b> dayalı yapılmasına ilişkin belirleme yapabilir; borçlanmaya dayalı kitle fonlamasına <b>bankacılık mevzuatı uygulanmaz<\/b>.<\/li>\n<li>Platformlar ne halka açık ortaklık ne ihraççıdır; izahname/ihraç belgesi yükümlülüğü yoktur; yatırım hizmeti ve yan hizmet sayılmaz; borsa, piyasa işleticisi ve teşkilatlanmış pazar yeri hükümlerine tabi değildir.<\/li>\n<li>Platform, para toplayanlar ve fon sağlayanlar arasındaki ilişkiler <b>genel hükümlere<\/b> tabidir. Bilgi formunu imzalayanlar yanlış, yanıltıcı, eksik bilgiden <b>müteselsilen<\/b> sorumludur.<\/li>\n<\/ul>\n<h3>Kripto varlık hizmet sağlayıcıları (7518 sayılı Kanun)<\/h3>\n<ul>\n<li>7518 sayılı Kanun <b>02.07.2024<\/b> tarih ve 32590 sayılı Resmi Gazete'de yayımlandı. Kripto varlıkların alım satımı, takası, transferi, saklanması ve özel anahtarların saklanması/yönetiminden birinin düzenli olarak icra edildiği her ortam SPKn kapsamına alındı.<\/li>\n<li><b>Kripto varlık:<\/b> dağıtık defter veya benzeri teknolojiyle elektronik olarak oluşturulup saklanabilen, dijital ağlar üzerinden dağıtılan, değer veya hak ifade eden gayri maddi varlık. <b>Cüzdan:<\/b> kripto varlıkların veya anahtarların çevrim içi/dışı depolanmasını sağlayan yazılım, donanım, sistem. <b>Platform:<\/b> alım satım, ilk satış/dağıtım, takas, transfer ve saklama işlemlerinden birinin yapıldığı kuruluş. <b>Kripto varlık hizmet sağlayıcı (KVHS):<\/b> platformlar, kripto varlık saklama hizmeti sağlayan kuruluşlar ve Kurulca belirlenen diğerleri.<\/li>\n<li>KVHS'nin kurulması ve faaliyete başlaması <b>Kurul iznine<\/b> tabidir; yalnızca Kurulca belirlenen faaliyetleri yapar. <b>Pay devirlerinde Kurul izni<\/b> zorunludur; aykırı devirler pay defterine kaydolunmaz, yapılan kayıtlar hükümsüzdür.<\/li>\n<li>İzin için bilgi sistemleri ve teknolojik altyapıda <b>TÜBİTAK<\/b>'ın belirlediği kriterlere uygunluk aranır.<\/li>\n<li>Kurul, SPA'nın MKK yerine <b>kripto varlık olarak ihracına<\/b> ve KVHS ortamında izlenmesine ilişkin esaslar belirleyebilir; bu durumda o ortamdaki kayıtlar esas alınır. Kurul, bu kayıtlarla MKK arasında entegrasyonu zorunlu tutabilir.<\/li>\n<\/ul>\n<h3>Yatırım hizmetlerinin yürütülmesi<\/h3>\n<ul>\n<li>SP kurumlarının SPKn kapsamındaki faaliyetleri (ör. merkezi takas, veri depolama, ipotek finansmanı) <b>sermaye piyasası faaliyeti<\/b> sayılır; SPKn kapsamı dışındaki faaliyetleri sayılmaz.<\/li>\n<li>Kurul yatırımcıları sınıflandırabilir (m.45). Yatırım kuruluşları iç kontrol birimleri ve şikayet takip sistemleri kurar.<\/li>\n<li><b>İzin zorunluluğu (m.39/1):<\/b> yatırım hizmetinin düzenli uğraşı, ticari veya mesleki faaliyet olarak yapılması Kurul iznine bağlıdır; izinsiz faaliyette suç duyurusu yapılabilir. Yatırım ortaklıkları, portföy yönetim şirketleri ve borsaların yaptıkları saklı kalmak üzere bu hizmetleri yalnızca <b>yatırım kuruluşları<\/b> yapabilir.<\/li>\n<li><b>Yatırım kuruluşu (m.3/1-v):<\/b> aracı kurumlar, <b>bankalar<\/b> ve yatırım hizmeti için kuruluş ve faaliyet esasları Kurulca belirlenen diğer SP kurumları. 2499'daki \"aracı kuruluş\" kavramının karşılığıdır, kapsamı daha geniştir.<\/li>\n<li><b>Aracı kurum:<\/b> m.37/1'in (a), (b), (c), (e) ve (f) bentlerindeki, yani alım satım aracılığı ve halka arz aracılığına ilişkin hizmetleri münhasıran yapmak üzere yetkilendirilen yatırım kuruluşu.<\/li>\n<\/ul>\n<table>\n<tr><th>Bankalar<\/th><th>Yatırım ve kalkınma
