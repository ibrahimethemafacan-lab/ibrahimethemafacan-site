den yüksekse menkul kıymetleri teslim edip yeni pay oluşturur ve borsada satar (<b>creation<\/b>). Bu sayede MKYO'lardaki iskonto sorunu BYF'lerde yaşanmaz.<\/li>\n<li>SPKn m.101/1-a uyarınca borsada işlem yasağı olanlar bu süre boyunca birincil piyasa işlemlerine de taraf olamaz.<\/li>\n<li>Her payın iki değeri vardır: <b>birim pay değeri<\/b> (BYF toplam değeri / dolaşımdaki pay sayısı; kurucunun sorumluluğunda) ve <b>işlem fiyatı<\/b> (BİAŞ'ta oluşan fiyat). Payların itibari değeri yoktur; MKK'da hak sahibi bazında izlenir. BYF <b>temettü dağıtabilir<\/b>.<\/li>\n<li>BYF'ler endeks fonlarına göre daha düşük yönetim ücretli ve her aracı kurumdan alınabilir olmalarıyla cazip bir endeks yatırım aracıdır.<\/li>\n<\/ul>\n\n<h3>Takip farkı ve takip hatası<\/h3>\n<ul>\n<li><b>Takip farkı (TD) = RP − RB<\/b>: fonun yıllık getirisi ile endeksin yıllık getirisi arasındaki fark.<\/li>\n<li><b>Takip hatası (TE)<\/b>: fon getirisi ile endeks getirisi arasındaki farkın <b>değişkenliği<\/b>; TE = karekök[ Σ(RP − RB)² / (N − 1) ], N hesaplamaya konu gün sayısı.<\/li>\n<li>Hesaplamada endeksin para birimi esas alınabilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Ne zaman<\/th><th>Ne açıklanır<\/th><\/tr>\n<tr><td>Her ay sonu itibarıyla, izleyen ayın <b>ilk iş günü<\/b><\/td><td>Son bir yıllık takip farkı ve takip hatası; önemli artışta gerekçesi<\/td><\/tr>\n<tr><td>Her yılın <b>son iş günü<\/b><\/td><td>Gelecek yıl için normal piyasa koşullarında tahmini takip hatası<\/td><\/tr>\n<tr><td>Her yıl <b>Ocak ayının son iş gününe<\/b> kadar<\/td><td>Önceki yılın tahmini ve gerçekleşen takip hatası, takip farkı; önemli sapmanın gerekçesi<\/td><\/tr>\n<\/table>\n\n<h3>Endeks takip stratejileri<\/h3>\n<ul>\n<li>(1) Fon toplam değerinin en az <b>%80'ini<\/b> devamlı olarak yalnız endeks kapsamındaki varlıklara yatırmak: <b>tam kopyalama<\/b> (tüm bileşenler endeks ağırlıklarıyla) veya <b>örnekleme<\/b> (endeksle korelasyonu en yüksek bileşenler; optimizasyon yöntemi).<\/li>\n<li>(2) En az <b>%80'ini<\/b> aynı endeksi takip eden <b>yabancı borsalardaki BYF<\/b> paylarına yatırmak: portföyde en az <b>dört<\/b> yabancı BYF bulunur, her biri en fazla <b>%30<\/b>.<\/li>\n<li>(3) Endeks kapsamında olması zorunlu olmayan varlıklara yatırım yaparak takip (dolaylı takip; <b>swap<\/b> kullanımı). Swap karşı taraf riski fon toplam değerinin en fazla <b>%10'u<\/b>; swaplar her işlem günü değerlenir. Unvanda takip stratejisini belirten ibare zorunludur.<\/li>\n<\/ul>\n<table>\n<tr><th>Takip edilen endeks<\/th><th>Asgari sayı<\/th><th>Tek varlık azami ağırlığı<\/th><\/tr>\n<tr><td>Pay endeksi<\/td><td>En az <b>altı<\/b> pay<\/td><td><b>%30<\/b><\/td><\/tr>\n<tr><td>Kamu borçlanma araçları endeksi<\/td><td>-<\/td><td><b>%35<\/b><\/td><\/tr>\n<tr><td>Özel sektör borçlanma araçları endeksi<\/td><td>En az <b>altı<\/b> araç<\/td><td><b>%35<\/b><\/td><\/tr>\n<tr><td>Gayrimenkul sertifikası veya özel sektör kira sertifikası endeksi<\/td><td>En az <b>dört<\/b><\/td><td><b>%35<\/b><\/td><\/tr>\n<\/table>\n\n<h3>Unvan ve içtüzük<\/h3>\n<ul>\n<li>Unvan stratejiye uygun olmalı; takip edilen endeks veya endeks yapıcı ile ilgili ifadelere yer verilebilir. Yabancı araçlara en az <b>%80<\/b> yatıranlarda <b>\"Yabancı\"<\/b> zorunlu; döviz ve altın bulunmayanlarda <b>\"(TL)\"<\/b>; tamamı faizsiz araçlardan oluşanlar <b>\"katılım fonu\"<\/b> ibaresi kullanabilir.<\/li>\n<li>İçtüzük; katılma payı sahipleri ile kurucu, saklayıcı ve yönetici arasında iltihaki sözleşmedir. Asgari unsurlar arasında <b>asgari işlem birimi<\/b>, yetkilendirilmiş katılımcının unvanı, endeks ve endeks yapıcı bilgisi, birincil ve ikincil piyasa esasları, yönetim ücreti ve toplam gider oranı bulunur.<\/li>\n<\/ul>\n\n<h3>Kuruluş, izahname, halka arz<\/h3>\n<ul>\n<li>Kuruluş izni ve izahname onayı <b>birlikte<\/b> değerlendirilir; kurucunun <b>ilk BYF'si<\/b> ise ayrı ayrı değerlendirilir.<\/li>\n<li>Başvurular belgelerin eksiksiz sunulmasından itibaren <b>iki ay<\/b> içinde karara bağlanır; içtüzük kararın tebliğinden itibaren <b>altı iş günü<\/b> içinde tescil ve TTSG ile KAP'ta ilan edilir.<\/li>\n<li>Birlikte değerlendirmede izahname, tescil belgeleri ve faaliyet sözleşmeleri Kurula gönderildikten sonra verilir; bu belgeler tescilden itibaren <b>10 iş günü<\/b> içinde gönderilir.<\/li>\n<li>Ayrı değerlendirmede izahname başvurusu tescilden itibaren en geç <b>üç ay<\/b> içinde (bir defaya mahsus üç ay uzatma); izahname <b>20 iş günü<\/b> içinde incelenir.<\/li>\n<li>İzahname ve yatırımcı bilgi formu izin yazısının tebliğinden itibaren <b>10 iş günü<\/b> içinde KAP'ta ve internet sitesinde yayımlanır; onay kararından itibaren <b>20 iş günü<\/b> içinde teslim alınmazsa yeniden onay gerekir. Belgelerin dili <b>Türkçe<\/b> olmalıdır.<\/li>\n<li>İzahname değişiklikleri bildirimden itibaren <b>yedi iş günü<\/b> içinde onaylanır; daha önce talepte bulunan yatırımcılar değişikliğin yayımından itibaren <b>iki iş günü<\/b> içinde taleplerini geri alabilir.<\/li>\n<li>İzahnamedeki yanlış bilgilerden kurucu sorumludur; tazmin edilemezse halka arza aracılık eden lider yetkili kuruluş ve kurucunun YK üyeleri kusurlarına göre sorumludur.<\/li>\n<li>Portföy; kurucunun <b>avans<\/b> koyması ve/veya payların nakit karşılığı <b>halka arzı<\/b> ile oluşturulur. Avans tescilden (ayrı değerlendirmede izahname izninin tebliğinden) itibaren <b>10 iş günü<\/b> içinde tamamlanır.<\/li>\n<li><b>Asgari tutar:<\/b> Tebliğ hükmünde avans veya ilk halka arz tutarı en az <b>6.000.000 TL<\/b>; faaliyet süresince son üç aylık ortalama fon toplam değeri <b>3.000.000 TL<\/b>'nin altına düşemez. Dikkat: Kitabın giriş özetinde güncel tutarlar <b>50.000.000 TL<\/b> ve <b>25.000.000 TL<\/b> olarak geçer; Kurul bu tutarları her yıl yeniden belirleyip <b>Kurul Bülteni<\/b> ile ilan eder.<\/li>\n<li>Asgari değerin altına düşülürse Kurul bir defaya mahsus <b>bir aylık<\/b> ek süre verebilir; sonra da sağlanamazsa fonun tasfiyesi veya başka bir yatırım fonu türüne dönüşümü istenir.<\/li>\n<li>Halka arz izahnamenin ilanından itibaren en geç <b>beş iş günü<\/b> içinde başlar; süresi <b>iki iş gününden az, 30 iş gününden fazla<\/b> olamaz.<\/li>\n<li>İlk halka arzda asgari fon tutarına ulaşılması için <b>aracılık yüklenimi<\/b> sözleşmesi zorunludur (konsorsiyumla da olabilir).<\/li>\n<li>Halka arz bitiminden itibaren <b>10 iş günü<\/b> içinde BİAŞ'a işlem başvurusu; avansla kurulanlarda izahname izninden itibaren <b>15 iş günü<\/b> içinde. Paylar BİAŞ <b>Yapılandırılmış Ürünler ve Fon Pazarı<\/b>'nda işlem görür.<\/li>\n<\/ul>\n\n<h3>Portföy sınırlamaları<\/h3>\n<ul>\n<li>Paylar, borçlanma araçları, yabancı araçlar, kıymetli madenler, yabancı BYF'ler, kira ve gayrimenkul sertifikaları, varant ve sertifikalar ancak <b>borsada işlem görüyorsa<\/b> alınabilir (ilk ihraçlar hariç). Aynı endeksi takip eden yabancı BYF'lerin ihracı için Kurul onayı aranmaz.<\/li>\n<li>Varant ve yatırım kuruluşu sertifikaları toplam <b>%10<\/b>, tek ihraççı <b>%5<\/b>.<\/li>\n<li>Mevduat/katılma hesabı (12 aya kadar) toplam <b>%10<\/b>, tek banka <b>%3<\/b>; katılım BYF'lerinde <b>%20<\/b> ve <b>%10<\/b>.<\/li>\n<li>Ters repo ve Takasbank para piyasası toplam <b>%20<\/b>; borsa dışı ters repo <b>%10<\/b>; repo varlıkların rayiç değerinin <b>%10'u<\/b>. Borsa dışı repo bilgileri sözleşmeyi izleyen iş günü KAP'ta açıklanır ve <b>beş yıl<\/b> saklanır.<\/li>\n<li>Kredi ve borçlanma amaçlı Takasbank işlemleri fon toplam değerinin <b>%10'unu<\/b> geçemez; kredi bilgileri Kurula bildirilir.<\/li>\n<li>Endeks kapsamındaki varlıklar endeksin hesaplama yöntemiyle uyumlu, diğerleri yatırım fonu finansal raporlama esaslarıyla değerlenir.<\/li>\n<\/ul>\n\n<h3>Özel durum açıklamaları ve ortak hükümler<\/h3>\n<ul>\n<li>Özel durum olarak açıklananlar: endeksin veya bileşenlerinin değişmesi; kurucu, yönetici, saklayıcı veya yetkilendirilmiş katılımcının değişmesi; birincil ve ikincil piyasa esaslarının değişmesi veya durdurulması; asgari işlem biriminin değişmesi; son üç aylık ortalama toplam değerin asgari tutarın altına düşmesi; strateji, değerleme veya saklama esaslarının değişmesi; borsa dışı repo bilgileri; kredi kullanımı; kurucu YK üyeleri ve fon müdürü değişiklikleri; ücret ve gider değişiklikleri; <b>endeks lisans ücretleri<\/b>; sona erme, devir, birleşme süreçleri; yabancı borsada işlem görmeye başlama veya kottan çıkma.<\/li>\n<li>Tebliğde hüküm olmayan konularda yatırım fonu ve portföy saklama düzenlemeleri uygulanır.<\/li>\n<li>Toplam gider üst sınırında unvanında <b>\"endeks\"<\/b> ibaresi olan fonların sınırı uygulanır (yıllık %2,19).<\/li>\n<li>Dikkat: BYF'lerin <b>performans sunum raporu hazırlaması zorunlu değildir<\/b>.<\/li>\n<\/ul>", "sorular": [{"q": "BYF'leri yatırım fonlarından ve MKYO'lardan ayıran özelliklerle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["BYF'lerde birincil piyasa işlemleri sayesinde işlem fiyatı birim pay değerine çok yakındır", "BYF'ler aktif yönetilir", "BYF'lerin tüzel kişiliği vardır", "BYF'lerin ikincil piyasası yoktur", "MKYO'ların tüzel kişiliği yoktur"], "a": 0, "e": "BYF pasif yönetilir, tüzel kişiliği yoktur; birincil piyasa ve arbitraj sayesinde işlem fiyatı birim pay değerine yakın kalır. MKYO'nun tüzel kişiliği vardır."}, {"q": "BYF'lerin kuruluşuyla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Şemsiye fon şeklinde kurulmaları zorunludur", "Tüzel kişiliğe sahiptirler", "Kurucuları aracı kurumlar olabilir", "Şemsiye fon şeklinde kurulamazlar", "Aktif yönetim stratejisi izlerler"], "a": 3, "e": "Yatırım fonlarından farklı olarak BYF'ler şemsiye fon şeklinde kurulamaz; kurucusu yalnız PYŞ olabilir."}, {"q": "BYF'lerde \"yetkilendirilmiş katılımcı\" hangisidir?", "o": ["Portföy saklayıcısı", "Pay oluşturma ve geri alım işlemlerine aracılık eden, kurucuyla sözleşmeli ve işlem/portföy aracılığı izinli aracı kurum", "Kurucu PYŞ", "Endeks yapıcı", "Borsa İstanbul"], "a": 1, "e": "Yetkilendirilmiş katılımcı, kurucuyla sözleşme imzalamış, işlem veya portföy aracılığı izni olan aracı kurumdur."}, {"q": "Bir BYF'nin birim pay değeri borsadaki işlem fiyatından yüksekse yatırımcı nasıl arbitraj yapabilir?", "o": ["Yeni pay oluşturup borsada satarak", "Açığa satış yaparak", "Borsadan pay alıp elde tutarak", "Kurucudan avans alarak", "BYF payını iade edip karşılığı menkul kıymetleri alarak ve bunları borsada satarak"], "a": 4, "e": "Birim pay değeri işlem fiyatından yüksekse payı iade edip (redemption) menkul kıymetleri alarak borsada satmak kâr sağlar."}, {"q": "Takip hatası (tracking error) nasıl tanımlanır?", "o": ["Fonun yıllık getirisi ile endeksin yıllık getirisi arasındaki fark", "Fonun yönetim ücreti", "Fon getirisi ile endeks getirisi arasındaki farkın değişkenliği", "İşlem fiyatı ile birim pay değeri arasındaki fark", "Endeks bileşenlerinin sayısı"], "a": 2, "e": "Takip farkı yıllık getiriler arasındaki farktır; takip hatası bu farkın değişkenliğidir."}, {"q": "Bir BYF'nin yıllık getirisi %18, takip ettiği endeksin yıllık getirisi %20 ise takip farkı nedir?", "o": ["-%2", "+%2", "%38", "%0,9", "%1,1"], "a": 0, "e": "TD = RP - RB = %18 - %20 = -%2."}, {"q": "Takip farkı ve takip hatası ile ilgili aylık açıklama ne zaman yapılır?", "o": ["Her ayın son iş günü", "Yılın son iş günü", "Her çeyrek sonunu izleyen 10 iş günü içinde", "Takip eden ayın ilk iş günü", "Ocak ayının son iş günü"], "a": 3, "e": "Her ay sonu itibarıyla son bir yıllık takip farkı ve hatası, izleyen ayın ilk iş günü açıklanır."}, {"q": "Fon toplam değerinin en az %80'ini aynı endeksi takip eden yabancı BYF'lere yatıran bir BYF için hangi kural geçerlidir?", "o": ["En az iki yabancı BYF, her biri en fazla %50", "En az dört yabancı BYF, her biri en fazla %30", "En az altı yabancı BYF, her biri en fazla %20", "Tek bir yabancı BYF yeterlidir", "En az üç yabancı BYF, her biri en fazla %35"], "a": 1, "e": "Portföyde en az dört yabancı BYF bulunmalı ve her birinin ağırlığı %30'u geçmemelidir."}, {"q": "Swap sözleşmelerine dayalı BYF'lerde swap karşı taraf riski fon toplam değerinin en fazla ne kadarı olabilir?", "o": ["%5", "%50", "%20", "%30", "%10"], "a": 4, "e": "Swap sözleşmeleri nedeniyle maruz kalınan karşı taraf riski hiçbir surette %10'u aşamaz."}, {"q": "Pay endeksini takip eden ve endeks varlıklarına doğrudan yatırım yapan BYF'lerde endeks ve fon portföyü için kural nedir?", "o": ["En az dört pay, her biri en fazla %35", "En az on pay, her biri en fazla %10", "En az altı pay, her biri en fazla %30", "En az üç pay, her biri en fazla %50", "Sınır yoktur"], "a": 2, "e": "Pay endeksi ve bunu takip eden fon portföyü en az altı paydan oluşmalı, her birinin ağırlığı %30'u geçmemelidir."}, {"q": "Endeks varlıklarının tamamının endeks ağırlıklarıyla portföye alındığı takip yöntemi hangisidir?", "o": ["Tam kopyalama", "Optimizasyon", "Örnekleme", "Swap yöntemi", "Dolaylı takip"], "a": 0, "e": "Tam kopyalamada bileşenler endeksteki ağırlıklarıyla portföye alınır; örnekleme (optimizasyon) yönteminde yalnız korelasyonu yüksek bileşenler seçilir."}, {"q": "BYF kuruluş izni ile izahname onayı başvurularıyla ilgili hangisi doğrudur?", "o": ["Her durumda ayrı değerlendirilir", "İzahname onayı gerekmez", "Her durumda birlikte değerlendirilir", "Kural olarak birlikte değerlendirilir; kurucunun ilk BYF'si ise ayrı ayrı değerlendirilir", "Kuruluş izni Borsa İstanbul tarafından verilir"], "a": 3, "e": "Birlikte değerlendirme esastır; ancak kurucunun ilk fonuysa başvurular ayrı ayrı değerlendirilir."}, {"q": "BYF paylarının halka arzıyla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Halka arz izahnamenin ilanından itibaren en geç bir ay içinde başlar", "Halka arz süresi iki iş gününden az, 30 iş gününden fazla olamaz", "Aracılık yüklenimi ihtiyaridir", "Halka arz süresi uzatılamaz", "Paylar Pay Piyasası Yıldız Pazar'da işlem görür"], "a": 1, "e": "Halka arz ilan sonrası en geç beş iş günü içinde başlar ve süresi 2-30 iş günüdür; aracılık yüklenimi zorunludur; paylar Yapılandırılmış Ürünler ve Fon Pazarı'nda işlem görür."}, {"q": "Son üç aylık ortalama fon toplam değeri asgari tutarın altına düşen BYF için hangi süreç işler?", "o": ["Fon derhal tasfiye edilir", "Herhangi bir yaptırım yoktur", "Kurucu altı ay içinde sermaye artırır", "Fon otomatik olarak şemsiye fona dönüşür", "Kurul bir defaya mahsus bir aylık ek süre verebilir; sonra da sağlanamazsa tasfiye veya başka fon türüne dönüşüm istenir"], "a": 4, "e": "Kurul bir defaya mahsus bir ay ek süre verebilir; sonunda da sağlanamazsa tasfiye veya yatırım fonuna dönüşüm talep edilir."}, {"q": "BYF portföyüne alınan ve endeks kapsamındaki varlıklar nasıl değerlenir?", "o": ["Kurucunun serbestçe belirlediği yöntemle", "Yalnızca maliyet bedeliyle", "Endeksin hesaplanma yöntemiyle uyumlu, izahnamede açıklanan esaslara göre", "Bağımsız değerleme kuruluşunca yılda bir kez", "Borsa kapanış fiyatının %95'iyle"], "a": 2, "e": "Endeks kapsamındaki varlıklar endeksin hesaplama yöntemiyle uyumlu olarak değerlenir; diğer varlıklar yatırım fonu finansal raporlama esaslarına göre."}, {"q": "BYF'lerle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Performans sunum raporu hazırlamaları zorunludur", "Swap sözleşmeleri portföye dahil edilebilir", "TCMB'nin kur ilan ettiği yabancı paralar portföye alınabilir", "Temettü dağıtabilirler", "Toplam gider sınırında endeks fonlarına ilişkin sınır uygulanır"], "a": 0, "e": "BYF'lerin performans sunum raporu hazırlaması zorunlu değildir."}, {"q": "BYF'lerde mevduat ve katılma hesaplarına ilişkin sınırlar \"katılım fonu\" ibaresi taşıyan BYF'lerde nasıl uygulanır?", "o": ["Toplam %10, tek banka %3", "Toplam %30, tek banka %15", "Toplam %25, tek banka %10", "Toplam %20, tek banka %10", "Sınır yoktur"], "a": 3, "e": "Genel sınır %10 ve %3'tür; katılım BYF'lerinde %20 ve %10 uygulanır."}]}, {"id": 12, "kisa": "Gayrimenkul Yatırım Fonları", "baslik": "Gayrimenkul Yatırım Fonları (III-52.3)", "ozet": "Nitelikli yatırımcıya yönelik GYF'nin yapısı, ihraç belgesi, ayni işlemler, asgari büyüklük, yatırım sınırları, proje GYF'leri ve değerleme.", "notlar": "<h3>Genel çerçeve<\/h3>\n<ul>\n<li>GYF'ler ilk kez <b>6362 sayılı SPKn<\/b> ile hukuki altyapıya kavuştu; III-52.3 sayılı Tebliğ <b>03.01.2014<\/b>'te yayımlandı. Amaç gayrimenkullerin menkul kıymetleştirilmesi, büyük gayrimenkullere likidite kazandırılması ve yatırımcılarla gayrimenkul sahiplerinin buluşturulması.<\/li>\n<li><b>GYF:<\/b> nitelikli yatırımcılardan katılma payı karşılığında toplanan para, gayrimenkul, kamu kaynaklı projelerdeki bağımsız bölümler veya gayrimenkule dayalı haklarla, inançlı mülkiyet esasına göre portföy işletmek amacıyla PYŞ, gayrimenkul PYŞ veya gayrimenkul ve girişim sermayesi PYŞ'lerince içtüzükle <b>süreli veya süresiz<\/b> kurulan, tüzel kişiliği olmayan malvarlığı.<\/li>\n<li>Dikkat: GYF; tapuya tescil, değişiklik, terkin ve düzeltme gibi <b>sicil işlemleri<\/b> ile ortak olacağı anonim ortaklıkların kuruluş, sermaye artırımı ve pay devri gibi <b>ticaret sicili işlemleriyle sınırlı olarak<\/b> tüzel kişiliği haiz sayılır.<\/li>\n<li>Belirli bir gayrimenkul veya sektör için ya da amacında sınırlama olmadan kurulabilir. Katılım finans ilkelerine uygunluk ihraç belgesinde belirtilirse unvanda <b>\"katılım\"<\/b> kullanılabilir.<\/li>\n<li>Katılma payları <b>yalnızca nitelikli yatırımcılara<\/b> satılabilir.<\/li>\n<\/ul>\n\n<h3>Portföy varlıkları<\/h3>\n<table>\n<tr><th>Gayrimenkul yatırımları<\/th><th>Diğer yatırımlar<\/th><\/tr>\n<tr><td>Gayrimenkuller; gayrimenkule dayalı haklar; TOKİ, İller Bankası, belediyeler ve bağlı şirketlerinin inşaat ruhsatlı projelerindeki bağımsız bölümler; <b>GYO<\/b>'ların ihraç ettiği SPA; aktifinin devamlı olarak en az <b>%75'i<\/b> yurtiçi gayrimenkul olan AO payları; gayrimenkul sertifikaları ve <b>TOKİ'nin fon kullanıcısı olduğu<\/b> kira sertifikaları; diğer GYF payları; gayrimenkulün vadeli satışından alacaklar; gayrimenkul yatırımlarından doğan <b>KDV alacakları<\/b><\/td><td>Paylar ve borçlanma araçları; yabancı araçlar; vadeli mevduat ve katılma hesabı; yatırım fonu payları; repo-ters repo, vaad sözleşmeleri, kıymetli madenler; kira sertifikaları; varant ve sertifikalar; Takasbank ve organize para piyasası; türev teminat ve primleri; özel tasarlanmış yabancı araçlar<\/td><\/tr>\n<\/table>\n\n<h3>Malvarlığı, dokümanlar, yönetim<\/h3>\n<ul>\n<li>Fon malvarlığı kurucunun, saklayıcının ve portföy yöneticisinin malvarlığından ayrıdır. Kredi, finansman, <b>koruma amaçlı<\/b> türev ve benzeri işlemler dışında teminat gösterilemez, rehnedilemez; haczedilemez, iflas masasına girmez; mahsup yasağı vardır.<\/li>\n<li><b>Bilgilendirme dokümanları:<\/b> içtüzük ve <b>ihraç belgesi<\/b>. Dikkat: GYF paylarının ihracında <b>izahname düzenlenmez<\/b>; ihraç belgesi ticaret siciline tescil edilmez.<\/li>\n<li>Kurucu, yatırımcılarla ilişkilerde hüküm olmayan hallerde TBK m.502-514 (vekalet) kıyasen uygulanır. Kurucu portföy yönetimini başka bir PYŞ'den alabilir; sorumluluğu devam eder. Birden fazla portföy yöneticisiyle sözleşme yapılabilir.<\/li>\n<li><b>Yatırım komitesi<\/b> üyeleri aldıkları kararlarla sınırlı olarak gayrimenkul portföyünün yönetiminden sorumludur.<\/li>\n<li>PYŞ Tebliği m.33 ilkelerine uyulur; ancak değerleme gerektiren işlemlerde \"rayiç değerin üstünde alım, altında satım yasağı\" uygulanmaz. Portföy yöneticisinin lehine sağladığı komisyon veya menfaat, öğrenildiği tarihten itibaren <b>10 iş günü<\/b> içinde yatırımcılara bildirilir.<\/li>\n<li>Gayrimenkuller tapuda <b>fon adına<\/b> tescil edilir; tapu ve ticaret sicili işlemleri kurucu ile saklayıcıyı temsilen birer yetkilinin <b>müşterek imzasıyla<\/b> yapılır (en az ikinci derece imza yetkisi).<\/li>\n<li>Fonu kurucunun YK'sı temsil eder; kuruluş, pay ihracı, tasfiye, yönetim ücreti artışı ve yatırım kararını etkileyen işlemler <b>YK kararıyla<\/b> yapılır.<\/li>\n<li><b>Organizasyon:<\/b> kurucunun YK'sından en az biri gayrimenkul yatırımlarında (alım satım hariç) <b>en az beş yıl<\/b> tecrübeli; yatırım komitesinde bu YK üyesi, <b>genel müdür<\/b> ve tam veya yarı zamanlı bir <b>gayrimenkul değerleme uzmanı<\/b> bulunur. Uzman şartı, değerleme lisanslı ve en az <b>üç yıl<\/b> tecrübeli bir YK üyesiyle de sağlanabilir. Komite üyelerin çoğunluğuyla toplanır, oyların çoğunluğuyla karar alır.<\/li>\n<li>Risk yönetimi gayrimenkule ilişkin <b>finansman ve likidite riskini<\/b> de kapsar.<\/li>\n<\/ul>\n\n<h3>Kuruluş ve pay ihracı<\/h3>\n<ul>\n<li>Kuruluş için saklama sözleşmesi ve içtüzük onayı gerekir; başvuru <b>iki ay<\/b> içinde karara bağlanır; içtüzük tebliğden itibaren <b>altı iş günü<\/b> içinde tescil ve TTSG'de ilan edilir.<\/li>\n<li>Pay ihracı başvurusu, gerekli mekan, donanım ve personelle, içtüzük tescilinden itibaren en geç <b>altı ay<\/b> içinde yapılır (bir defaya mahsus altı ay uzatma); yapılmazsa içtüzük terkin edilir.<\/li>\n<li>Şemsiye fon da kurulabilir; her fon için ayrı ihraç belgesi; ilk fon başvurusu içtüzük tescilinden itibaren <b>6 ay<\/b> içinde.<\/li>\n<li>İhraç belgesi <b>20 iş günü<\/b> içinde incelenir; eksik belge bildirimi <b>10 iş günü<\/b> içinde.<\/li>\n<li>Satış başlangıç tarihi onaylı ihraç belgesinin teslim alınmasından itibaren <b>bir yılı<\/b> geçemez; satışa başlanmayan fonun tasfiyesi için <b>altı iş günü<\/b> içinde Kurula başvurulur.<\/li>\n<li>Kurucunun ilk fonu dışındaki fonlarda kuruluş ve ihraç başvuruları <b>birlikte<\/b>; ilk fonda <b>ayrı ayrı<\/b> değerlendirilir.<\/li>\n<li>Satıştan önce kurucu ve portföy yöneticisi payları kendi portföyüne alabilir ve gerekçeli YK kararıyla fona <b>borç verebilir<\/b>.<\/li>\n<li>Aynı fonda farklı haklar için <b>pay grupları<\/b> oluşturulabilir. Satıştan önce asgari unsurları içeren <b>fon ihraç sözleşmesi<\/b> imzalanır (borsadan alanlar hariç); ispat yükünü yatırımcıya yükleyen veya kurucu lehine olağanüstü haklar tanıyan hüküm konulamaz.<\/li>\n<li>Yatırım kararını etkileyen içtüzük ve ihraç belgesi değişiklikleri yürürlükten <b>en az 30 gün önce<\/b> yatırımcılara bildirilir; bu sürede payını iade etmek isteyen olursa yürürlük ilk iade tarihine ertelenir. Tüm pay sahipleri önceden onaylarsa 30 günlük süre aranmaz. Etkilemeyen değişiklikler yıl sonunu izleyen <b>altı iş günü<\/b> içinde toplu olarak Kurula bildirilir.<\/li>\n<\/ul>\n\n<h3>Pay değeri, alım satım ve devir<\/h3>\n<ul>\n<li>Payların itibari değeri yoktur. Birim pay değerinin <b>en az yılda bir kez<\/b> hesaplanması ve bildirilmesi esastır (yatırım fonlarında günlük, serbest fonlarda ayda bir).<\/li>\n<li>Pay bedeli <b>nakden<\/b> veya gayrimenkul ve haklarının fon adına tescili ya da proje bağımsız bölümlerinin devriyle <b>ayni olarak<\/b> ödenebilir; iade de nakit veya gayrimenkul devriyle yapılabilir. Ayni işlemlerde mevcut tüm pay sahiplerinin mutabakatı alınır, saklayıcı teyit eder, belgeler fon süresi ve <b>5 yıl<\/b> saklanır.<\/li>\n<li>Ayni işlemde değerleme raporu hazırlatılır; yatırımcıdan fona devredilenlerin rapor masrafı fondan karşılanamaz. Satışta esas değer raporun <b>üstünde<\/b> olamaz, iadede <b>altında<\/b> olamaz. İpotekli veya devri kısıtlı gayrimenkul pay karşılığında fona devredilemez.<\/li>\n<li>Pazarlama ve dağıtım kurucu veya sözleşmeli yetkili kuruluşlarca yapılır; nitelikli yatırımcı belgeleri fon süresince ve <b>en az beş yıl<\/b> saklanır.<\/li>\n<li>Paylar <b>nitelikli yatırımcılar arasında devredilebilir<\/b>; kurucu onayı ve belgeler gerekir; ihraç sözleşmesiyle devir kurucu/yönetici onayına bağlanabilir veya tamamen sınırlandırılabilir. Paylar MKK'da izlenir.<\/li>\n<li>Giriş-çıkış komisyonu uygulanabilir ve <b>fona gelir<\/b> yazılır. Süreli fonlarda iade yalnızca fon süresi sonunda olabilir.<\/li>\n<li>Kurucu iade için likiditeden sorumludur; içtüzükte hüküm varsa likidite yokluğunda geri alımı erteleyebilir, derhal Kurula bilgi verir; erteleme <b>bir yılı<\/b> aşamaz.<\/li>\n<li>Türkiye'de yerleşik yabancılar ve yurt dışında yerleşikler için pay grubu oluşturularak TCMB kurlarıyla döviz üzerinden işlem yapılabilir. İhraç sözleşmesinde esasları yer almak kaydıyla birim pay değerinden <b>farklı fiyatla<\/b> alım satım yapılabilir.<\/li>\n<\/ul>\n\n<h3>Asgari portföy büyüklüğü ve sınırlamalar<\/h3>\n<ul>\n<li>Satışa başlanmasından itibaren en geç <b>bir yıl<\/b> içinde fon portföy değeri en az <b>200.000.000 TL<\/b>'ye ulaşmalıdır (Kurul her yıl yeniden belirleyebilir). Ulaşmazsa yatırımlara son verilir ve en geç <b>altı ay<\/b> içinde tasfiye izni istenir.<\/li>\n<li>Fon toplam değerinin <b>en az %80'i<\/b> gayrimenkul yatırımlarından oluşur. Aktifinin en az %75'i yurtiçi gayrimenkul olan AO paylarına en fazla <b>%20<\/b> yatırılabilir. Uyum hesap dönemi sonundaki tabloya göre aranır.<\/li>\n<li>İçtüzükte hüküm varsa <b>ipotekli<\/b> veya takyidatlı gayrimenkuller alınabilir; ancak bunların değeri fon toplam değerinin <b>%30'unu<\/b> aşamaz (kredi teminatı için tesis edilen rehinler bu hesaba girmez).<\/li>\n<li>Arızi uyumsuzlukta hesap dönemi sonundan itibaren <b>bir yıl<\/b> süre verilebilir; sonunda da sağlanamazsa en geç <b>iki yıl<\/b> içinde tasfiye izni istenir. Gayrimenkul satışı gibi nedenlerle uyumsuzlukta <b>iki yıl<\/b> süre verilebilir; bu imkan son <b>beş yılda en fazla bir kez<\/b> kullanılır.<\/li>\n<\/ul>\n<table>\n<tr><th>Yapabilir<\/th><th>Yapamaz<\/th><\/tr>\n<tr><td>Her türlü gayrimenkulü alım satım kârı veya kira için almak, satmak, kiralamak; satış vaadi<\/td><td>Gayrimenkul projelerine yatırım (kamu kaynaklı ruhsatlı projelerdeki bağımsız bölümler ve proje GYF'leri hariç)<\/td><\/tr>\n<tr><td>Yapı kullanma izni ve kat mülkiyeti olan yapıları almak (yalnız kira amaçlı yapılarda yapı kullanma izni yeterli; yapı kayıt belgesi de yeterli)<\/td><td>İnşaat işlerini kendisi üstlenmek; başkalarına proje geliştirme hizmeti vermek<\/td><\/tr>\n<tr><td>Başkasının gayrimenkulü üzerinde fon lehine <b>üst hakkı ve devre mülk<\/b> tesis etmek ve devretmek<\/td><td>Otel, AVM, hastane gibi yerleri ticari maksatla <b>işletmek<\/b><\/td><\/tr>\n<tr><td>Fon gayrimenkulü üzerinde başkaları lehine üst hakkı ve devre mülk tesis etmek<\/td><td>Sürekli kısa vadeli alım satım; devri kısıtlı varlık almak; altın dışı emtiaya yatırım<\/td><\/tr>\n<tr><td>Koruma amaçlı türev kullanmak<\/td><td>Açığa satış, kredili işlem, ödünç alma; korunmayı aşan türev; türev açık pozisyonu <b>%20'yi<\/b> aşamaz<\/td><\/tr>\n<tr><td>-<\/td><td><b>Yurt dışında<\/b> gayrimenkul alım, satım ve kiralama<\/td><\/tr>\n<\/table>\n\n<h3>Proje GYF'leri<\/h3>\n<ul>\n<li>Bağımsız bölüm toplam brüt alanının <b>yarısından fazlası konut<\/b> olan projelere yatırım için kurulur; unvanda <b>\"proje gayrimenkul yatırım fonu\"<\/b> zorunlu.<\/li>\n<li>Portföy yalnız proje geliştirilecek arsalar, gayrimenkul projeleri ve sayılan para ve sermaye piyasası araçlarından oluşur; %80 sınırı uygulanmaz. Nakit yalnız kısa vadeli veya para piyasası fonları, ters repo, Hazine VKŞ kira sertifikaları, kamu borçlanma araçları, mevduat ve katılma hesaplarında değerlendirilir.<\/li>\n<li>Fon adına tescil edilen arsalarda en geç <b>3 yıl<\/b> içinde inşaata başlamak için tüm yasal gereklilikler tamamlanmalıdır. Hasılat paylaşımı hakları ipotek, garanti veya kefaletle teminatlandırılır (kamu bankaları, TMSF, TOKİ, İller Bankası, belediyeler karşı tarafsa aranmaz).<\/li>\n<li>Projeler bina tamamlama sigortası, teminat mektubu, hakediş sistemi gibi yöntemlerden <b>en az biriyle<\/b> teminatlandırılır; inşaat işleri müteahhitlere yaptırılır.<\/li>\n<\/ul>\n\n<h3>İşletme, inşaat, kredi ve değerleme<\/h3>\n<ul>\n<li>Alım, önalım, geri alım hakları, satış vaadi sözleşmeleri ve rehinli alacakların serbest dereceye ilerleme hakları <b>tapuya şerh<\/b> edilir (TOKİ, İller Bankası, belediyeler karşı tarafsa zorunlu değil).<\/li>\n<li>İşletme hizmetleri <b>işletmeci şirketlerden<\/b> alınır; kira amaçlı gayrimenkullerde güvenlik ve temizlik gibi temel hizmetler ancak kurucu ile işletmeci şirket arasında sözleşmeyle verilebilir.<\/li>\n<li>İnşaat işleri müteahhitlerle sözleşmeyle yaptırılır; müteahhit <b>A veya B grubu<\/b> müteahhitlik yetki belgesine sahip olmalıdır; seçim ve sözleşme koşulları kurucu YK'sınca onaylanır.<\/li>\n<li><b>Kredi:<\/b> fon toplam değerinin en fazla <b>%50'si<\/b> kadar kredi veya faizsiz finansman; bilgiler hesap dönemini izleyen <b>30 gün<\/b> içinde yatırımcılara bildirilir. Repo veya borçlanma amaçlı Takasbank işlemleri varlıkların rayiç değerinin <b>%10'una<\/b> kadar.<\/li>\n<li>Portföy yönetim ücreti sabit tutar veya oran olarak belirlenebilir. İhraç sözleşmesinde hüküm varsa <b>performans ücreti<\/b> alınabilir; yatırımcıdan yazılı beyan alınır ve tasfiyeden sonra <b>5 yıl<\/b> saklanır. Yatırımcılardan doğrudan tahsilde bilgiler <b>15 gün<\/b> içinde bildirilir. Performans ücreti pay sahiplerine tahakkuk ettirilen fonlar <b>borsada işlem göremez<\/b>.<\/li>\n<li>Fon kâr dağıtabilir.<\/li>\n<li>Değerleme gerektiren işlemler GYO'dakine benzer; yıl sonu değerlemesi yılın son günü tamamlanır; rapor <b>beş iş günü<\/b> içinde tarihlenir, <b>iki iş günü<\/b> içinde teslim edilir, <b>en az 10 yıl<\/b> saklanır. İşlemden önceki <b>üç ay<\/b> içinde hazırlanmış rapor varsa yenisi ihtiyaridir.<\/li>\n<li>Değerlemeden yüksek alım veya düşük satış ve kiralama yapılırsa yatırımcılara aynı yıl içinde bildirilir.<\/li>\n<li>Değerleme kuruluşu Kurul listesinde ve bağımsız olmalı (kurucunun %10 ve üzeri ortakları, aday gösterme imtiyazlı ortakları, kurucu, bunların %10'dan fazla pay sahibi olduğu şirketler ve ilişkili taraflardan). Yıl sonunu izleyen <b>bir ay<\/b> içinde belirlenir; aynı kuruluştan üst üste <b>en fazla üç yıl<\/b>, ara <b>en az iki yıl<\/b>.<\/li>\n<li>Gayrimenkul yatırım bilgileri yatırımdan itibaren <b>15 gün<\/b> içinde yatırımcılara bildirilir; değerleme raporları <b>10 iş günü<\/b> içinde saklayıcıya gönderilir.<\/li>\n<\/ul>\n\n<h3>Diğer hükümler<\/h3>\n<ul>\n<li><b>Kurul ücreti:<\/b> üçer aylık dönemlerin son iş gününde fon toplam değerinin <b>yüz binde beşi<\/b>; kurucu hesaplar, saklayıcı onaylar, izleyen <b>on iş günü<\/b> içinde Kurul hesabına yatırılır.<\/li>\n<li>GYF için KAP sayfası oluşturulur; ticari sır niteliğindeki bilgiler gizlenebilir. Yatırım fonlarındaki toplam gider üst sınırı hükümleri uygulanmaz.<\/li>\n<li>Dikkat: GYF <b>başka bir fonla birleştirilemez ve başka fona dönüştürülemez<\/b>.<\/li>\n<li>Tanıtımlarda nitelikli yatırımcı tanımına ve satışın yalnız bunlara yapılacağına yer verilir. İlişkili fonlara giriş-çıkış komisyonu ödenmez. Sona erme ve tasfiyede yatırım fonu hükümleri kıyasen uygulanır.<\/li>\n<\/ul>", "sorular": [{"q": "Gayrimenkul yatırım fonlarının katılma payları kimlere satılabilir?", "o": ["Herkese", "Yalnızca nitelikli yatırımcılara", "Yalnızca kurumsal yatırımcılara", "Yalnızca yabancı yatırımcılara", "Yalnızca bankalara"], "a": 1, "e": "GYF katılma payları sadece nitelikli yatırımcılara satılabilir."}, {"q": "GYF'nin tüzel kişiliğiyle ilgili hangisi doğrudur?", "o": ["Tam tüzel kişiliğe sahiptir", "Hiçbir durumda tüzel kişilik sayılmaz", "Kurucunun tüzel kişiliğini kullanır", "Yalnızca vergi işlemlerinde tüzel kişidir", "Tapu sicili işlemleri ve ortak olacağı AO'ların ticaret sicili işlemleriyle sınırlı olarak tüzel kişiliği haiz sayılır"], "a": 4, "e": "GYF tüzel kişiliği olmayan malvarlığıdır, ancak tapu ve ortak olacağı AO'ların ticaret sicili işlemleriyle sınırlı olarak tüzel kişiliği haiz sayılır."}, {"q": "GYF'lerin bilgilendirme dokümanları nelerden oluşur?", "o": ["İzahname ve yatırımcı bilgi formu", "Esas sözleşme ve izahname", "İçtüzük ve ihraç belgesi", "Yalnızca izahname", "İçtüzük, izahname ve yatırımcı bilgi formu"], "a": 2, "e": "GYF dokümanları içtüzük ve ihraç belgesidir; ayrıca izahname düzenlenmez."}, {"q": "GYF portföy değerinin, payların satışına başlanmasından itibaren bir yıl içinde ulaşması gereken asgari büyüklük nedir?", "o": ["200.000.000 TL", "75.000.000 TL", "100.000.000 TL", "50.000.000 TL", "300.000.000 TL"], "a": 0, "e": "Bir yıl içinde fon portföy değeri en az 200 milyon TL'ye ulaşmalıdır; ulaşmazsa altı ay içinde tasfiye izni istenir."}, {"q": "GYF toplam değerinin en az ne kadarı gayrimenkul yatırımlarından oluşmalıdır?", "o": ["%51", "%60", "%75", "%80", "%90"], "a": 3, "e": "Fon toplam değerinin en az %80'i gayrimenkul yatırımlarından oluşmalıdır."}, {"q": "İçtüzükte hüküm bulunması şartıyla GYF portföyüne alınabilen ipotekli veya takyidatlı gayrimenkullerin değeri fon toplam değerinin en fazla ne kadarı olabilir?", "o": ["%10", "%30", "%25", "%20", "%50"], "a": 1, "e": "İpotekli veya değeri etkileyecek takyidatlı gayrimenkullerin değeri %30'u aşamaz."}, {"q": "GYF'lerin kullanabileceği kredi veya faizsiz finansman sınırı nedir?", "o": ["Fon toplam değerinin %10'u", "Fon toplam değerinin %20'si", "Kredi kullanamazlar", "Özsermayenin beş katı", "Fon toplam değerinin %50'si"], "a": 4, "e": "GYF'ler fon toplam değerinin azami %50'si oranında kredi veya faizsiz finansman kullanabilir."}, {"q": "Aşağıdakilerden hangisi GYF kurucusu ve portföy yöneticisinin yapamayacağı işlemlerdendir?", "o": ["Kira geliri için gayrimenkul satın almak", "Başkasına ait gayrimenkul üzerinde fon lehine üst hakkı tesis etmek", "Yurt dışında gayrimenkul alım, satım ve kiralama faaliyetinde bulunmak", "Koruma amaçlı türev işlem yapmak", "Gayrimenkulü kiraya vermek"], "a": 2, "e": "GYF'ler yurt dışında gayrimenkul alım, satım ve kiralama faaliyetinde bulunamaz."}, {"q": "GYF birim pay değerinin hesaplanma ve bildirilme sıklığı en az ne olmalıdır?", "o": ["Yılda bir", "Haftalık", "Aylık", "Günlük", "Üç ayda bir"], "a": 0, "e": "GYF birim pay değerinin en az yılda bir kere hesaplanması ve nitelikli yatırımcılara bildirilmesi esastır."}, {"q": "GYF'lerde ayni pay satışıyla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Değerleme raporu gerekmez", "Değerleme masrafı her durumda fondan karşılanır", "İpotekli gayrimenkul de pay karşılığı fona devredilebilir", "Satışta esas alınacak değer değerleme raporundaki değerden fazla olamaz", "Mevcut pay sahiplerinin mutabakatı aranmaz"], "a": 3, "e": "Satışta raporun üstünde, iadede altında değer esas alınamaz; ipotekli gayrimenkul devredilemez; mutabakat zorunludur; yatırımcıdan devirde rapor masrafı fondan karşılanamaz."}, {"q": "Proje gayrimenkul yatırım fonu kurulabilmesi için yatırım yapılacak projelerin hangi şartı taşıması gerekir?", "o": ["Tamamının ticari olması", "Bağımsız bölüm toplam brüt alanının yarısından fazlasının konut olması", "Kamuya ait arsada olması", "Yalnızca otel projesi olması", "Yurt dışında olması"], "a": 1, "e": "Proje GYF'leri bağımsız bölüm toplam brüt alanının yarısından fazlası konut olan projelere yatırım için kurulur."}, {"q": "Proje GYF'lerinde fon adına tescil edilen arsalar üzerinde inşaata başlanabilmesi için yasal gerekliliklerin en geç ne kadar sürede yerine getirilmesi gerekir?", "o": ["Bir yıl", "İki yıl", "Süre sınırı yoktur", "Beş yıl", "Üç yıl"], "a": 4, "e": "Arsalar üzerinde en geç 3 yıl içinde inşaata başlanması için tüm yasal gereklilikler tamamlanmalıdır."}, {"q": "GYF'lerin gayrimenkul projelerinde inşaat işlerini yapacak müteahhitte aranan şart nedir?", "o": ["Herhangi bir müteahhitlik belgesi yeterlidir", "Yalnızca halka açık şirket olmak", "A veya B grubu müteahhitlik yetki belgesi", "Kurucunun ilişkili tarafı olmak", "C grubu belge"], "a": 2, "e": "Müteahhidin A veya B grubu müteahhitlik yetki belgesine sahip olması gerekir; seçim kurucu YK'sınca onaylanır."}, {"q": "GYF'lerde Kurul ücreti nasıl hesaplanır?", "o": ["Üçer aylık dönem sonlarında fon toplam değerinin yüz binde beşi", "Yıllık fon toplam değerinin binde biri", "Aylık yönetim ücretinin %10'u", "Her pay satışında sabit ücret", "Kurul ücreti alınmaz"], "a": 0, "e": "Üçer aylık dönemlerin son iş gününde fon toplam değerinin yüz binde beşi hesaplanır ve izleyen on iş günü içinde yatırılır."}, {"q": "GYF'lerle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Süreli veya süresiz kurulabilir", "Performans ücreti alınabilir", "Farklı pay grupları oluşturulabilir", "Başka bir fonla birleştirilebilir veya başka bir fona dönüştürülebilir", "Kâr dağıtabilir"], "a": 3, "e": "GYF'ler başka bir fonla birleştirilemez ve başka bir fona dönüştürülemez."}, {"q": "GYF kurucusunun yatırım komitesinde asgari olarak bulunması gerekenler hangileridir?", "o": ["Yalnızca genel müdür", "Gayrimenkul yatırımlarında beş yıl tecrübeli YK üyesi, genel müdür ve gayrimenkul değerleme uzmanı", "Üç portföy yöneticisi", "Bağımsız denetçi ve hukuk müşaviri", "Fon müdürü ve iç kontrol elemanı"], "a": 1, "e": "Komitede asgari olarak beş yıl tecrübeli YK üyesi, genel müdür ve gayrimenkul değerleme uzmanı bulunur."}, {"q": "Satış başlangıç tarihi, onaylı ihraç belgesinin kurucu tarafından teslim alınmasından itibaren en fazla ne kadar olabilir?", "o": ["Üç ay", "Altı ay", "Süre yoktur", "İki yıl", "Bir yıl"], "a": 4, "e": "Satış başlangıç tarihi bir yılı geçemez; satışa başlanmazsa altı iş günü içinde tasfiye için başvurulur."}]}, {"id": 13, "kisa": "GSYF ve GSYO", "baslik": "Girişim Sermayesi Yatırım Fonları (III-52.4) ve Ortaklıkları (III-48.3)", "ozet": "GSYF'de kaynak taahhüdü, girişim şirketi ve yatırım sınırları; GSYO'da kuruluş, lider sermayedar, halka arz takvimi, portföy ve borç sınırları; fon ve ortaklık karşılaştırmaları.", "notlar": "<h3>GSYF: tanım ve genel yapı<\/h3>\n<ul>\n<li>III-52.4 sayılı Tebliğ, Lüksemburg, Hollanda, Guernsey gibi başarılı uluslararası örneklerle uyumlu bir yapı getirmiştir.<\/li>\n<li><b>GSYF:<\/b> nitelikli yatırımcılardan katılma payı karşılığında toplanan para veya <b>iştirak paylarıyla<\/b>, inançlı mülkiyet esasına göre portföy işletmek için PYŞ, GS PYŞ veya GYF+GSYF PYŞ'lerince içtüzükle <b>süreli olarak<\/b> kurulan, tüzel kişiliği olmayan malvarlığı. Süre içtüzükte ve ihraç belgesinde yer alır.<\/li>\n<li>Dikkat: GYF süreli veya süresiz kurulabilir; <b>GSYF yalnızca süreli<\/b> kurulur.<\/li>\n<li>GSYF, resmi sicil işlemleri ile ortağı olacağı <b>limited ve anonim<\/b> şirketlerin kuruluş, sermaye artırımı ve pay devri gibi ticaret sicili işlemleriyle sınırlı olarak tüzel kişiliği haiz sayılır. Bu işlemler kurucu ve saklayıcıyı temsilen birer yetkilinin <b>müşterek imzasıyla<\/b> yapılır.<\/li>\n<li>Katılma payları <b>yalnızca nitelikli yatırımcılara<\/b> satılır; ihraç için ihraç belgesi onaylanır, <b>izahname düzenlenmez<\/b>. Katılım finans ilkelerine uyanlar unvanda \"katılım\" kullanabilir.<\/li>\n<li>Portföyde GS yatırımlarının yanı sıra paylar, borçlanma araçları, mevduat, fon payları, repo, varant, kira ve gayrimenkul sertifikaları, ipoteğe ve varlığa dayalı menkul kıymetler, <b>yurt dışında yerleşik ve borsada işlem görmeyen gelişme potansiyelli şirketler<\/b>, kıymetli madenler yer alabilir.<\/li>\n<li>Malvarlığı kurucu, saklayıcı ve portföy yöneticisinden ayrıdır; kredi, finansman ve koruma amaçlı türev dışında teminat ve rehin yasağı; haciz, iflas ve mahsup koruması vardır.<\/li>\n<\/ul>\n\n<h3>GSYF: dokümanlar, yönetim, organizasyon<\/h3>\n<ul>\n<li>Dokümanlar: <b>içtüzük<\/b> (iltihaki sözleşme) ve <b>ihraç belgesi<\/b>. Yatırım kararını etkileyen değişiklikler yürürlükten <b>en az 30 gün önce<\/b> bildirilir; iade isteyen olursa yürürlük ertelenir. İhraç belgesi değişiklikleri <b>Kurul onayı aranmaksızın<\/b> kurucu tarafından yapılır.<\/li>\n<li>Süre içinde iade edilebilen fonlarda payların <b>%65'inden fazlası<\/b>nın, yalnız süre sonunda iade edilebilenlerde <b>tüm<\/b> pay sahiplerinin yazılı onayı varsa 30 günlük bekleme uygulanmaz (süre sonunda iade edilenlerde fondan çıkış hakkı tanınır).<\/li>\n<li>Kurucu ile yatırımcı ilişkilerinde boşlukta TBK m.502-514 kıyasen uygulanır. <b>Yatırımcı sözleşmesi:<\/b> içtüzük ve ihraç belgesinde olmayan hususları düzenleyen ihtiyari sözleşme; bunlara aykırı hüküm içeremez.<\/li>\n<li>GS yatırımlarının yönetiminde \"rayiç değerin üstünde alım, altında satım yasağı\" <b>uygulanmaz<\/b>.<\/li>\n<li>Fonu kurucunun YK'sı temsil eder; GS portföyünün temsili YK kararıyla <b>yatırım komitesine<\/b> devredilebilir; girişim şirketlerindeki ortaklık haklarını kullanmak için kurucu personeli olmayan üçüncü kişiler de <b>vekil<\/b> olarak belirlenebilir. Kuruluş, ihraç, tasfiye, ücret artışı YK kararıyla yapılır.<\/li>\n<li><b>Organizasyon:<\/b> YK'dan en az biri GS yatırımlarında <b>en az beş yıl<\/b> tecrübeli; yatırım komitesinde bu üye, <b>genel müdür<\/b> ve dört yıllık mezun, GS'de en az beş yıl tecrübeli bir personel. Komite kararları karar defterine yazılır ve fon süresi + <b>en az beş yıl<\/b> saklanır.<\/li>\n<li>Kuruluş için saklama sözleşmesi ve içtüzük onayı; içtüzük <b>altı iş günü<\/b> içinde tescil. Pay ihracı başvurusu içtüzük tescilinden itibaren en geç <b>altı ay<\/b> içinde (bir defaya mahsus altı ay uzatma). Satış başlangıcı ihraç belgesinin tesliminden itibaren <b>bir yılı<\/b> geçemez.<\/li>\n<li><b>Fon sepeti GSYF:<\/b> en az <b>%80'i<\/b> ihraç belgesi onaylı GSYF'lerden oluşur; unvanda \"Fon sepeti\"; başka fon sepeti fonuna yatırım yapamaz.<\/li>\n<\/ul>\n\n<h3>GSYF: paylar, kaynak taahhüdü<\/h3>\n<ul>\n<li>Pay bedeli nakit veya <b>iştirak paylarının<\/b> (girişim şirketi payları) fona devriyle ödenebilir; bu durumda satıştan önce Kurulca uygun görülen kuruluşa değerleme yaptırılır. Satışta raporun üstünde, iadede altında değer esas alınamaz; rapor masrafı fondan karşılanamaz.<\/li>\n<li>Birim pay değeri <b>en az yılda bir<\/b> hesaplanır. Giriş-çıkış komisyonu <b>fona gelir<\/b> yazılır. Likidite yoksa geri alım <b>en fazla bir yıl<\/b> ertelenebilir. Paylar MKK'da izlenir; nitelikli yatırımcılar arasında devredilebilir, devir bedeli serbesttir (sözleşmede aksi yoksa).<\/li>\n<li>Pazarlama kuruluşu nitelikli yatırımcı belgelerini fon süresince ve <b>en az beş yıl<\/b> saklar; tanıtımlarda nitelikli yatırımcı tanımına yer verilir.<\/li>\n<li><b>Kaynak taahhüdü:<\/b> yatırımcıların bir defada veya farklı tarihlerde ödemek üzere verdiği taahhüt. Toplam asgari <b>75.000.000 TL<\/b>. Satışa başlanmasından itibaren en geç <b>bir yıl<\/b> içinde tahsil edilir; tahsilden sonra ihraç belgesindeki sürede, her durumda <b>en fazla iki yıl<\/b> içinde yatırıma yönlendirilir. İki yıllık süre sonunda asgari tutara ulaşılmazsa en geç <b>altı ay<\/b> içinde tasfiye izni istenir.<\/li>\n<\/ul>\n\n<h3>Girişim şirketi ve girişim sermayesi yatırımı (GSYF)<\/h3>\n<ul>\n<li><b>Girişim şirketi:<\/b> büyüme ve katma değer potansiyeli olan, finansal veya kurumsal destekle amacına ulaşabilecek şirket. Türkiye'de kurulu olmalı veya yurt dışında kurulu ise varlıklarının en az <b>%51'i<\/b> Türkiye'deki bağlı ortaklık ve iştiraklerden oluşmalıdır.<\/li>\n<li>Yalnız <b>anonim ve limited<\/b> şirketlere yatırım yapılır; yurt içindeki limited şirket ilk yatırımdan itibaren <b>bir yıl<\/b> içinde anonim şirkete dönüşmelidir (yurt dışı şirketlerde şekil şartı yok).<\/li>\n<li>Aktif toplamının en az <b>%40'ı<\/b> gayrimenkul olan şirketler ve esas faaliyeti <b>müteahhitlik<\/b> olan şirketler girişim şirketi sayılmaz (teknoparklar, kuluçka ve Ar-Ge merkezleri gibi yapılar Sanayi ve Teknoloji Bakanlığı uygun görüşüyle istisna).<\/li>\n<li><b>GS yatırımı sayılanlar:<\/b> doğrudan veya özel amaçlı şirketler ve yurt dışı KYK'lar aracılığıyla ortaklık; borsada işlem görmeyen girişim şirketlerinin borçlanma araçları ve kira sertifikaları; riski anapara ile sınırlı yurt dışı KYK'lar; <b>GSYO<\/b> araçları; diğer GSYF payları; halka açık girişim şirketlerinin borsada işlem görmeyen payları; <b>mezzanine<\/b> (borç ve sermaye karması) finansman (vade, faiz ve paya dönüşüm koşullarını içeren sözleşmeyle); girişim şirketlerine kredilere dayalı varlığa dayalı menkul kıymetler; pay alım avansları ve vadeli satış alacakları; pay alım opsiyon primleri; ileride ortak olma hakkı veren sözleşmeler.<\/li>\n<li>Halka açılan girişim şirketinin fonda kalan payları (borsada işlem görmeye başladıktan sonra alınanlar hariç) GS yatırımı sayılmaya devam eder.<\/li>\n<li>Girişim şirketlerinin fonlara tahsisli borçlanma aracı ihracında: tavan ve tedavüldekiler toplamı <b>5 milyon TL<\/b>'nin altındaysa VUK'a göre mali müşavir raporlu tablolar yeterli; ihraç limiti aktif toplamının <b>beş katı<\/b>; paya dönüştürülebilir tahvillerde dönüştürme oranı serbest; bu araçlar yalnız diğer GSYF, GSYO ve yabancı yatırımcılara satılabilir.<\/li>\n<li>Ortaklık hakkı veren yatırımlar <b>pay sahipliği sözleşmesiyle<\/b> yapılır (tag along, drag along, önalım, temettü politikası gibi hükümler içerebilir). Şirketin tamamı alınıyor veya kontrol sağlanıyorsa pay devri sözleşmesi yeterlidir.<\/li>\n<\/ul>\n\n<h3>GSYF: yatırım sınırlamaları<\/h3>\n<table>\n<tr><th>Sınırlama<\/th><th>Oran<\/th><\/tr>\n<tr><td>GS yatırımları (asgari)<\/td><td>Fon toplam değerinin en az <b>%80'i<\/b>; yoğunlaşma sınırı yok, tek yatırım olabilir<\/td><\/tr>\n<tr><td>Bir hesap döneminde KOBİ'lere doğrudan yatırım %10'u geçerse<\/td><td>Asgari oran <b>%51<\/b> uygulanır<\/td><\/tr>\n<tr><td>Diğer GSYF'lere yatırım<\/td><td>En fazla <b>%25<\/b> (fon sepeti fonlarında uygulanmaz)<\/td><\/tr>\n<tr><td>GS yatırımı yapan özel amaçlı şirketler<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Yatırımcıların kontrolündeki şirketler ve ilişkili tarafları<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Yurt dışındaki borsada işlem görmeyen şirketler (GS yatırımı sayılmaz)<\/td><td>En fazla <b>%15<\/b>; yurt dışı yerleşiklerin pay sahipliği %20-30 ise <b>%30<\/b>, %30-50 ise <b>%50<\/b>, %50-80 ise <b>%80<\/b>, %80 ve üzeri ise <b>%100<\/b><\/td><\/tr>\n<tr><td>Türev (yalnız döviz, faiz, piyasa riskinden korunma)<\/td><td>Açık pozisyon en fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Kredi veya faizsiz finansman<\/td><td>En fazla <b>%50<\/b><\/td><\/tr>\n<tr><td>Repo<\/td><td>Varlıkların rayiç değerinin <b>%10'u<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Açığa satış, kredili işlem, ödünç alma yasaktır. Dikkat: GSYF'ler türeve <b>yatırım amacıyla<\/b> giremez, yalnız korunma amaçlı.<\/li>\n<li>Uyum hesap dönemi sonu toplam değer tablosuyla saklayıcı tarafından kontrol edilir (tablo en geç dönem sonunu izleyen <b>üçüncü ay<\/b> sonuna kadar). Arızi aykırılıklarda yeni yatırım yapılmamak şartıyla azami sınırlara uyum aranmaz; asgari sınır için <b>en fazla bir yıl<\/b> süre; sonunda da sağlanamazsa en geç <b>iki yıl<\/b> içinde tasfiye izni.<\/li>\n<li>Yurt dışı yerleşik sahipliğine göre sınır aşımında saklayıcı dönem sonundan itibaren <b>10 iş günü<\/b> içinde kurucuya ve Kurula bildirir; kurucu <b>10 iş günü<\/b> içinde süre talep eder.<\/li>\n<\/ul>\n\n<h3>GSYF: değerleme, ücretler, raporlama<\/h3>\n<ul>\n<li>GS yatırımları en az hesap dönemi sonunda değerlenir. <b>Kapalı fonlarda<\/b> (yalnız kaynak taahhüdü verenlerin katıldığı, süre dolmadan iade olmayan) yatırım komitesi raporuna dayalı YK kararıyla veya değerleme kuruluşu raporuyla.<\/li>\n<li>Diğer fonlarda değerleme kuruluşu raporu: şirkete yatırım <b>25 milyon TL'den az<\/b> ise her <b>üçüncü<\/b>, <b>25-50 milyon TL<\/b> ise her <b>ikinci<\/b>, <b>50 milyon TL'den fazla<\/b> ise <b>her<\/b> hesap dönemi sonunda; aradaki dönemlerde komite raporuyla da olabilir. Dönem sonundan önceki <b>üç ay<\/b> içindeki rapor kullanılabilir. Dayanak belgeler fon süresi + <b>beş yıl<\/b> saklanır.<\/li>\n<li>Kuruluş ve portföy oluşturma danışmanlık giderleri ihraç sözleşmesinde yer almak şartıyla fondan karşılanabilir. Yönetim ücreti sabit tutar veya portföy değeri, toplam değer, aktif toplam ya da <b>taahhüt tutarının<\/b> oranı olabilir.<\/li>\n<li>Performans ücreti ihraç sözleşmesinde hüküm varsa alınabilir; yatırımcıdan yazılı beyan, <b>5 yıl<\/b> saklama. Pay sahiplerine tahakkuk ettirilen fonlar borsada işlem göremez. Performans ücretine konu tutar üzerinden ayrıca <b>imtiyazlı kâr payı<\/b> ödenemez.<\/li>\n<li>Fon kâr dağıtabilir. <b>6 aylık ve yıllık<\/b> finansal tablo hazırlanır. GS yatırım bilgileri yatırımdan itibaren <b>15 gün<\/b> içinde yatırımcılara bildirilir; kredi bilgileri dönem sonunu izleyen <b>30 gün<\/b> içinde.<\/li>\n<li>KAP sayfası zorunlu; ticari sırlar gizlenebilir; yatırım fonlarının KAP ilan yükümlülükleri uygulanmaz. Sona erme ve tasfiyede yatırım fonu hükümleri kıyasen uygulanır.<\/li>\n<\/ul>\n\n<h3>Fon türleri karşılaştırması<\/h3>\n<table>\n<tr><th>Konu<\/th><th>Yatırım fonu<\/th><th>BYF<\/th><th>GYF<\/th><th>GSYF<\/th><\/tr>\n<tr><td>Yatırımcı<\/td><td>Herkes (serbest fon hariç)<\/td><td>Borsada herkes<\/td><td>Yalnız nitelikli<\/td><td>Yalnız nitelikli<\/td><\/tr>\n<tr><td>Bilgilendirme belgesi<\/td><td>İzahname + YBF<\/td><td>İzahname + YBF<\/td><td>İhraç belgesi<\/td><td>İhraç belgesi<\/td><\/tr>\n<tr><td>Şemsiye fon<\/td><td>Zorunlu<\/td><td>Kurulamaz<\/td><td>Mümkün<\/td><td>Mümkün<\/td><\/tr>\n<tr><td>Süre<\/td><td>Süreli veya süresiz<\/td><td>-<\/td><td>Süreli veya süresiz<\/td><td><b>Yalnız süreli<\/b><\/td><\/tr>\n<tr><td>Asgari yatırım oranı<\/td><td>Türüne göre<\/td><td>%80 endeks varlıkları<\/td><td>%80 gayrimenkul<\/td><td>%80 GS yatırımı (KOBİ halinde %51)<\/td><\/tr>\n<tr><td>Asgari büyüklük<\/td><td>-<\/td><td>Avans/halka arz ve ortalama değer şartı<\/td><td>Bir yılda 200 milyon TL portföy<\/td><td>75 milyon TL kaynak taahhüdü<\/td><\/tr>\n<tr><td>Fiyat hesaplama<\/td><td>Günlük<\/td><td>Sürekli (dakika altı)<\/td><td>Yılda en az bir<\/td><td>Yılda en az bir<\/td><\/tr>\n<tr><td>Kredi sınırı<\/td><td>%10<\/td><td>%10<\/td><td>%50<\/td><td>%50<\/td><\/tr>\n<tr><td>Sınırlı tüzel kişilik<\/td><td>Yok<\/td><td>Yok<\/td><td>Tapu ve ticaret sicili işlemleri<\/td><td>Resmi sicil ve ticaret sicili işlemleri<\/td><\/tr>\n<\/table>\n\n<h3>GSYO: tanım ve kuruluş<\/h3>\n<ul>\n<li><b>GSYO:<\/b> GS yatırımları, SPA ve diğer varlıklardan oluşan portföyü işletmek için pay ihraç etmek üzere kurulan veya dönüşen, <b>kayıtlı sermaye sistemine tabi anonim ortaklık<\/b> olan sermaye piyasası kurumu. Aktif toplam bireysel tablolara göre hesaplanır.<\/li>\n<li>Tebliğ; nitelikli yatırımcıya satan GSYO'larla uluslararası <b>\"private equity\"<\/b> modelini, <b>mezzanine<\/b> finansmanı ve KOBİ'ler lehine teminat imkanını getirmiştir.<\/li>\n<li><b>Kuruluş/dönüşüm şartları:<\/b> kayıtlı sermayeli AO; başlangıç veya ödenmiş sermaye ve özsermayenin her biri en az <b>300.000.000 TL<\/b>; payların <b>nakit<\/b> karşılığı çıkarılıp tam ödenmesi; unvanda <b>\"Girişim Sermayesi Yatırım Ortaklığı\"<\/b>; sermayenin <b>%25'inin<\/b> halka arz edileceğinin veya nitelikli yatırımcıya satılacağının taahhüdü; kurucu veya ortaklardan en az birinin <b>lider sermayedar<\/b> olması. Kurucu şartları kamu kurumlarında aranmaz. Sonraki tüm esas sözleşme değişiklikleri Kurulun uygun görüşüne tabidir.<\/li>\n<li>Başvuruda yatırım yapılacak sektörler, strateji, <b>çıkış süresi hedefleri<\/b>, sermaye artırım ve halka arz planlarını içeren <b>fizibilite etüdü<\/b> sunulur. Tescil Kurul izninden itibaren <b>30 gün<\/b> içinde; dönüşümde genel kurul 30 gün içinde, tescil genel kuruldan itibaren <b>15 gün<\/b> içinde; belgeler ilanı izleyen <b>altı iş günü<\/b> içinde Kurula.<\/li>\n<li>İlke kararı: dönüşüm ve halka arz başvurularında bireysel ve konsolide tablolar bağımsız denetimden geçer; aktifin <b>%20'sinin üzerindeki<\/b> iştirakler ve kontrol edilen şirketlerin tabloları da denetlenir ve bunlar TTK m.376/2 (sermaye kaybı) kapsamında olmamalıdır.<\/li>\n<li>Kuruluş veya dönüşümden itibaren <b>altı ay<\/b> içinde mekan, donanım, personel ve genel müdür atandığı belgelenir. Para ve SPA kısmı (mevduat hariç) aktifin <b>%10'unu<\/b> aşarsa lisanslı portföy yöneticisi istihdam edilir veya PYŞ'den hizmet alınır.<\/li>\n<li>Diğer ortaklıkların dönüşümünde portföy uyumu tescilden itibaren <b>altı ay<\/b> içinde; sağlanamazsa <b>üç ay<\/b> içinde esas sözleşme değişikliği başvurusu.<\/li>\n<\/ul>\n\n<h3>GSYO lider sermayedarı<\/h3>\n<ul>\n<li>İmtiyazlı pay yoksa tek başına veya birlikte <b>yönetim kontrolünü<\/b> sağlayan paylara; imtiyazlı pay varsa kontrol sağlayan imtiyazlı payların çoğunluğu dahil sermayenin <b>asgari %25'ine<\/b> sahip ortak.<\/li>\n<li><b>Gerçek kişi:<\/b> hukuk, bankacılık, finans, girişimcilik, işletmecilik, sanayi ve ticaret gibi alanlarda <b>en az beş yıl<\/b> tecrübe; varlıkların rayiç değeri en az <b>90 milyon TL<\/b> (birden fazla gerçek kişide toplam <b>180 milyon TL<\/b>).<\/li>\n<li><b>Tüzel kişi:<\/b> en az <b>üç yıl<\/b> faaliyet; özsermaye sermayenin <b>iki katı<\/b>, aktif toplam <b>üç katı<\/b> (tavan özsermaye <b>900 milyon TL<\/b>, aktif <b>1.800 milyon TL<\/b>).<\/li>\n<li>Lider sermayedarın payları asgari halka açıklık oranındaki payların satış süresi bitiminden itibaren <b>iki yıl<\/b> devredilemez.<\/li>\n<li>Dikkat: Yalnız nitelikli yatırımcıya satan GSYO'larda <b>lider sermayedar zorunlu değildir<\/b>.<\/li>\n<\/ul>\n\n<h3>GSYO halka arz ve nitelikli yatırımcıya satış<\/h3>\n<ul>\n<li>Tescilden itibaren <b>18 ay<\/b> içinde en az <b>bir GS yatırımı<\/b>; <b>üç yıl<\/b> içinde GS portföyünü oluşturup çıkarılmış sermayenin <b>asgari %25'i<\/b> için halka arz başvurusu. Sonrasında da sermayenin en az %25'i sürekli halka açık pay olmalıdır. Aksi halde faaliyet hakkı kalkar; <b>üç ay<\/b> içinde esas sözleşme değiştirilmezse TTK m.529 uyarınca sona ermiş sayılır.<\/li>\n<li><b>Yalnız nitelikli yatırımcıya satan GSYO:<\/b> esas sözleşmede hüküm gerekir; asgari sermaye <b>90.000.000 TL<\/b>; 18 ayda bir yatırım, üç yılda artırım sonrası sermayenin %25'i için ihraç belgesi başvurusu; izahname ve satış duyurusu gerekmez; paylar nama yazılı ve MKK'da kaydi; sonra da yalnız nitelikli yatırımcıya devredilir; portföy şartı ilk artırım/satışı izleyen <b>birinci yıl sonundan<\/b> itibaren aranır; ara tabloların denetimi ve ilanı gerekmez; toplam gider oranı sınırı uygulanmaz; yalnız aday gösterme ve <b>kâr payı imtiyazlı<\/b> pay ihraç edebilir.<\/li>\n<li>Halka arz öncesinde nakit kâr dağıtmamak şartıyla sermaye artırımı yapılabilir; Kurul ücreti tüm payların nominal değeri üzerinden alınır.<\/li>\n<li>Kotasyon: satış bitiminden itibaren <b>15 gün<\/b> içinde Kurula, belgeden itibaren <b>15 gün<\/b> içinde Borsaya.<\/li>\n<li>Paylar nama veya hamiline. Halka arz eden GSYO yalnızca <b>YK üye sayısının salt çoğunluğunu aday gösterme<\/b> imtiyazlı pay ihraç edebilir (TTK m.360 uygulanmaz); halka açıldıktan sonra hiçbir imtiyaz yaratılamaz. Üst üste <b>beş yıl<\/b> zarar edende imtiyazlar Kurul kararıyla kalkar.<\/li>\n<li>Pay devri kuralları GYO ile aynıdır: satış öncesi <b>%10 ve üzeri<\/b> ve her imtiyazlı pay devri Kurul iznine; %10 altında belgeler <b>10 iş günü<\/b> içinde; şartları kaybeden kontrol sahibi <b>üç ay<\/b> içinde payları elden çıkarır.<\/li>\n<\/ul>\n\n<h3>GSYO yönetimi ve faaliyetleri<\/h3>\n<ul>\n<li>YK çoğunluğu dört yıllık mezun ve ilgili alanlarda <b>en az üç yıl<\/b> tecrübeli; komitelerde yalnız dört yıllık mezunlar. Atamalar <b>10 iş günü<\/b> içinde SPL'ye.<\/li>\n<li><b>Genel müdür:<\/b> dört yıllık mezun, ilgili alanlarda <b>en az beş yıl<\/b> tecrübe; son 12 ayda <b>altı aydan<\/b> fazla vekalet edilemez; portföydeki girişim şirketlerinde <b>icrai görev alabilir<\/b>.<\/li>\n<li>Yapabilecekleri: GS yatırımları; çeşitlendirme için borsada işlem gören SPA, borsada ters repo, Takasbank para piyasası, fon payları ve mevduat (fon payları hariç alım satım borsadan); girişim şirketlerinin yönetimine katılmak ve onlara danışmanlık vermek; GS danışmanlık şirketlerine ve PYŞ'lere ortak olmak; BİAŞ <b>Gelişen İşletmeler Piyasası<\/b>nda piyasa danışmanlığı.<\/li>\n<li>Üçüncü kişiler lehine teminat, kefalet, rehin, ipotek yasaktır; istisnalar: <b>KOBİ<\/b> niteliğindeki girişim şirketleri lehine teminat ve ipotek; girişim şirketindeki payların o şirkete yatırımın finansmanında rehin verilmesi. Portföydeki girişim şirketlerine yalnız işletme sermayesi için kısa vadeli finansman sağlanabilir (GS yatırımı sayılmaz).<\/li>\n<li>Girişim şirketi: Türkiye'de kurulu veya kurulacak, gelişme potansiyelli ve kaynak ihtiyacı olan şirket; yalnız AO ve limited (limited bir yılda AO'ya dönüşür).<\/li>\n<\/ul>\n\n<h3>GSYO portföy sınırlamaları<\/h3>\n<table>\n<tr><th>Sınırlama (aktif toplama göre)<\/th><th>Oran<\/th><\/tr>\n<tr><td>GS yatırımları (asgari)<\/td><td>En az <b>%51<\/b> (KOBİ'lere doğrudan yatırım %5'i geçerse <b>%35<\/b>)<\/td><\/tr>\n<tr><td>Kontrol sahibi ortaklar, YK üyeleri ve genel müdürün kontrolündeki şirketler<\/td><td>Yatırım <b>yapılamaz<\/b> (ilişkisiz taraflarla eş anlı yatırım hariç)<\/td><\/tr>\n<tr><td>Çeşitlendirme amaçlı yatırımlarda tek ihraççı<\/td><td>En fazla <b>%10<\/b><\/td><\/tr>\n<tr><td>Danışmanlık şirketleri ve PYŞ iştirakleri<\/td><td>En fazla <b>%10<\/b><\/td><\/tr>\n<tr><td>KOBİ'ler lehine rehin, teminat, ipotek<\/td><td>Toplam en fazla <b>%10<\/b>; tek şirkette yatırım tutarının en fazla <b>%25'i<\/b><\/td><\/tr>\n<tr><td>Yurt dışı KYK'lar<\/td><td>En fazla <b>%49<\/b>; ilgili kuruluşun sermayesinin en fazla <b>%20'si<\/b><\/td><\/tr>\n<tr><td>Halka açık girişim şirketlerinin borsada işlem görmeyen payları<\/td><td>En fazla <b>%25<\/b><\/td><\/tr>\n<tr><td>Mezzanine (karma) finansman<\/td><td>En fazla <b>%25<\/b><\/td><\/tr>\n<tr><td>TL ve döviz mevduat ve katılma hesabı<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Türev<\/td><td>Yalnız korunma amaçlı, esas sözleşmede hüküm varsa<\/td><\/tr>\n<\/table>\n<ul>\n<li>Uyum yıl sonu bireysel aktif toplamına göre aranır. Halka açılan girişim şirketinin kalan payları GS yatırımı sayılır ve %25 sınırlarında dikkate alınmaz (ilke kararı).<\/li>\n<li>Arızi nedenlerle %51'in altına düşülürse <b>bir yıl<\/b>; <b>tam çıkış<\/b> nedeniyle düşülürse <b>iki yıl<\/b> süre (son beş yılda bir kez); diğer sınırlar için bir yıl. Sonunda da uyum yoksa <b>üç ay<\/b> içinde esas sözleşme değişikliği başvurusu.<\/li>\n<li>Ortaklık hakkı veren yatırımlar <b>pay sahipliği sözleşmesiyle<\/b>; mezzanine için ayrı sözleşme zorunlu.<\/li>\n<li>PYŞ'ye ödenecek <b>performans ücreti<\/b>, çıkış tutarı ile maliyet arasındaki fark (kâr payı ve faiz dahil) üzerinden hesaplanan tutarın <b>%20'sini<\/b> geçemez.<\/li>\n<li><b>Toplam gider oranı:<\/b> performans ücreti hariç dışarıdan hizmet ücretleri aktif toplamın <b>%2,5'ini<\/b> aşamaz.<\/li>\n<li>Para ve SPA'lar <b>Takasbank<\/b>'ta saklanır.<\/li>\n<li><b>Finansal borç sınırı:<\/b> kısa vadeli borçlar özsermayenin <b>yarısını<\/b>, bir yıl ve daha uzun vadeli borçlar özsermayenin <b>iki katını<\/b> aşamaz (vade ihraç tarihine göre).<\/li>\n<\/ul>\n\n<h3>GSYO kamuyu aydınlatma ve statüden çıkış<\/h3>\n<ul>\n<li>Kurula <b>altı iş günü<\/b> içinde: TTSG nüshası, halka arz sonuçları, yatırım ve çıkış YK kararları, pay sahipliği ve devir sözleşmeleri, KOBİ teminat belgeleri, AO'ya dönüşüm bilgileri, danışmanlık ve PYŞ sözleşmeleri.<\/li>\n<li>KAP'ta <b>iki iş günü<\/b> içinde: girişim şirketindeki pay ve oy oranları, bir varlıkta veya tablo kaleminde <b>%10 ve üzeri<\/b> değişiklik, değerleme raporları, yatırım ve çıkış kararları, ilişkili taraflara ödenen ücretler, PYŞ sözleşme bilgileri.<\/li>\n<li>Birliğe <b>10 iş günü<\/b> içinde: murahhas üye kararları, iletişim bilgileri, bağımsız denetçi, adres ve imza sirküleri, dava ve takipler, ilan gazeteleri. Birlik aykırılığı <b>üç iş günü<\/b> içinde Kurula bildirir.<\/li>\n<li><b>Statüden çıkış:<\/b> 30 günlük ve altı aylık ağırlıklı ortalama fiyatlardan yüksek olanla pay alım teklifi; YK raporu; %10 ve üzeri pay sahipleri ile kontrol sahipleri tescilden itibaren <b>bir yıl<\/b> tescil günü ikinci seans kapanış fiyatının altında satış yapamaz; Kurul izninden itibaren <b>üç ay<\/b> içinde genel kurul kararı; <b>ayrılma hakkı doğmaz<\/b>. Borsada işlem görmeyen GSYO'larda SPKn m.24/4 uygulanır.<\/li>\n<li>GSYO dışında hiçbir kuruluş unvanında \"GSYO\" veya aynı anlama gelen ibare kullanamaz.<\/li>\n<\/ul>\n\n<h3>Yatırım ortaklıkları karşılaştırması<\/h3>\n<table>\n<tr><th>Konu<\/th><th>GYO<\/th><th>Sabit sermayeli MKYO<\/th><th>GSYO<\/th><\/tr>\n<tr><td>Asgari sermaye<\/td><td>1 milyar TL (altyapı 1,5 milyar)<\/td><td>300 milyon TL<\/td><td>300 milyon TL (yalnız nitelikli satışta 90 milyon)<\/td><\/tr>\n<tr><td>Nakit şartı<\/td><td>%10 veya 200 milyon TL; ayni sermaye mümkün<\/td><td>Tamamı nakit<\/td><td>Tamamı nakit<\/td><\/tr>\n<tr><td>Halka arz oranı<\/td><td>%25<\/td><td><b>%49<\/b><\/td><td>%25<\/td><\/tr>\n<tr><td>Halka arz başvuru süresi<\/td><td>3 ay<\/td><td>3 ay<\/td><td>18 ayda ilk yatırım, 3 yılda başvuru<\/td><\/tr>\n<tr><td>Lider sermayedar<\/td><td>Yok<\/td><td>Zorunlu (%25)<\/td><td>Zorunlu (nitelikli satanlar hariç)<\/td><\/tr>\n<tr><td>İmtiyaz<\/td><td>Yalnız aday gösterme<\/td><td>Hiçbiri<\/td><td>YK'nın salt çoğunluğunu aday gösterme<\/td><\/tr>\n<tr><td>Asgari portföy oranı<\/td><td>%51 (altyapı %75)<\/td><td>Portföy türüne göre<\/td><td>%51<\/td><\/tr>\n<tr><td>Genel müdür tecrübesi<\/td><td>5 yıl<\/td><td>7 yıl + Düzey 3<\/td><td>5 yıl<\/td><\/tr>\n<tr><td>Genel müdüre vekalet (12 ayda)<\/td><td>6 ay<\/td><td>3 ay<\/td><td>6 ay<\/td><\/tr>\n<tr><td>Borçlanma<\/td><td>Özsermayenin 5 katı kredi<\/td><td>Özkaynağın %20'si<\/td><td>Kısa vade özsermayenin yarısı, uzun vade 2 katı<\/td><\/tr>\n<tr><td>Dışarıdan hizmet gideri<\/td><td>-<\/td><td>Ortalama NAD'ın %2'si<\/td><td>Aktif toplamın %2,5'i<\/td><\/tr>\n<\/table>", "sorular": [{"q": "Girişim sermayesi yatırım fonlarının süresiyle ilgili hangisi doğrudur?", "o": ["Yalnızca süresiz kurulur", "Süreli veya süresiz kurulabilir", "Yalnızca süreli kurulur", "Süresi en fazla beş yıldır", "Süresi Kurul tarafından belirlenir"], "a": 2, "e": "GSYF içtüzükle süreli olarak kurulur; süreye içtüzük ve ihraç belgesinde yer verilir. GYF ise süreli veya süresiz kurulabilir."}, {"q": "GSYF'de nitelikli yatırımcılardan alınacak toplam kaynak taahhüdünün asgari tutarı nedir?", "o": ["75.000.000 TL", "50.000.000 TL", "25.000.000 TL", "200.000.000 TL", "300.000.000 TL"], "a": 0, "e": "Toplam kaynak taahhüdü asgari 75 milyon TL'dir ve ihraç belgesinde yer alır."}, {"q": "GSYF toplam değerinin en az ne kadarı girişim sermayesi yatırımlarından oluşmalıdır?", "o": ["%51", "%60", "%75", "%80", "%90"], "a": 3, "e": "Asgari oran %80'dir; bir hesap döneminde KOBİ'lere doğrudan yatırımlar %10'u geçerse %51 uygulanır."}, {"q": "Bir hesap döneminde KOBİ niteliğindeki girişim şirketlerine doğrudan yatırımları fon toplam değerinin %10'unu geçen bir GSYF için asgari girişim sermayesi yatırım oranı kaç olur?", "o": [  "o": ["Her hesap dönemi sonunda", "Her ikinci hesap dönemi sonunda", "Her üçüncü hesap dönemi sonunda", "Yalnız çıkışta", "Hiçbir zaman"], "a": 1, "e": "25 milyon TL'den az ise her üçüncü, 25-50 milyon TL arası her ikinci, 50 milyon TL'den fazla ise her hesap dönemi sonunda rapor gerekir."}, {"q": "GSYF'lerde portföy yönetim ücreti hangi esasa göre belirlenemez?", "o": ["Sabit tutar", "Fon portföy değerinin oranı", "Fon toplam değerinin oranı", "Yatırımcıların taahhüt tutarının oranı", "Kurucu YK üyelerinin maaşlarının oranı"], "a": 4, "e": "Yönetim ücreti sabit tutar veya portföy değeri, toplam değer, aktif toplam ya da taahhüt tutarının belli bir oranı olarak belirlenebilir."}, {"q": "GSYO kuruluşunda başlangıç sermayesi en az ne kadar olmalıdır (yalnız nitelikli yatırımcıya satış yapmayan GSYO için)?", "o": ["90.000.000 TL", "150.000.000 TL", "300.000.000 TL", "1.000.000.000 TL", "75.000.000 TL"], "a": 2, "e": "GSYO'da asgari sermaye 300 milyon TL'dir; yalnız nitelikli yatırımcıya satan GSYO'larda 90 milyon TL."}, {"q": "GSYO olarak kurulan bir ortaklık, tescilden itibaren en geç ne zaman asgari bir girişim sermayesi yatırımı yapmalıdır?", "o": ["18 ay", "Altı ay", "12 ay", "Üç ay", "Üç yıl"], "a": 0, "e": "Tescilden itibaren 18 ay içinde en az bir GS yatırımı, üç yıl içinde portföyün oluşturulması ve halka arz başvurusu gerekir."}, {"q": "GSYO'larda gerçek kişi lider sermayedarın sahip olması gereken asgari varlık değeri ve tecrübe hangisidir?", "o": ["150 milyon TL ve üç yıl", "90 milyon TL ve üç yıl", "300 milyon TL ve yedi yıl", "90 milyon TL ve beş yıl", "180 milyon TL ve beş yıl"], "a": 3, "e": "Gerçek kişi lider sermayedarın varlıkları en az 90 milyon TL (birden fazla ise toplam 180 milyon TL) olmalı ve en az beş yıl tecrübesi bulunmalıdır."}, {"q": "Aşağıdakilerden hangisi yalnızca nitelikli yatırımcıya pay satan GSYO'lar için doğrudur?", "o": ["Lider sermayedar zorunludur", "Lider sermayedar zorunlu değildir ve asgari sermaye 90 milyon TL'dir", "Asgari sermaye 300 milyon TL'dir", "İzahname hazırlanması zorunludur", "Paylar hamiline yazılı olabilir"], "a": 1, "e": "Bu GSYO'larda lider sermayedar hükümleri uygulanmaz, asgari sermaye 90 milyon TL'dir, izahname gerekmez ve paylar nama yazılıdır."}, {"q": "GSYO'ların girişim sermayesi yatırımlarına ayırması gereken asgari oran (aktif toplama göre) nedir?", "o": ["%25", "%35", "%49", "%80", "%51"], "a": 4, "e": "GSYO'lar aktif toplamın en az %51'ini GS yatırımlarına yatırmak zorundadır."}, {"q": "GSYO'ların yurt dışı kolektif yatırım kuruluşlarına yatırım sınırı hangisidir?", "o": ["Aktifin %10'u ve kuruluş sermayesinin %5'i", "Aktifin %25'i ve kuruluş sermayesinin %10'u", "Aktifin %49'u ve kuruluş sermayesinin %20'si", "Aktifin %51'i", "Sınır yoktur"], "a": 2, "e": "Yurt dışı KYK'lara aktifin en fazla %49'u yatırılabilir ve yatırım ilgili kuruluşun sermayesinin %20'sini aşamaz."}, {"q": "GSYO'larda finansal borç sınırı hangisidir?", "o": ["Kısa vadeli borçlar özsermayenin yarısını, uzun vadeli borçlar özsermayenin iki katını aşamaz", "Toplam borçlar özsermayenin beş katını aşamaz", "Borçlar aktif toplamın %20'sini aşamaz", "Kısa vadeli borçlar özsermayenin iki katını aşamaz", "Borçlanma yasaktır"], "a": 0, "e": "Kısa vadeli finansal borçlar özsermayenin yarısını, bir yıl ve daha uzun vadeli borçlar iki katını aşamaz."}, {"q": "GSYO'larca dışarıdan alınan hizmetler için ödenen ücretlerin toplamı (performans ücreti hariç) aktif toplamın en fazla ne kadarı olabilir?", "o": ["%1", "%2", "%5", "%2,5", "%10"], "a": 3, "e": "Toplam gider oranı son yıllık bireysel tablolardaki aktif toplamın %2,5'ini aşamaz."}, {"q": "GSYO'ların portföy yönetim şirketlerine ödeyeceği performans ücretiyle ilgili hangisi doğrudur?", "o": ["Sınır yoktur", "Çıkış tutarı ile maliyet arasındaki fark üzerinden hesaplanan tutarın %20'sini geçemez", "Aktif toplamın %2'sini geçemez", "Performans ücreti ödenemez", "Yalnızca kâr payları üzerinden ödenebilir"], "a": 1, "e": "GS yatırımlarına ilişkin performans ücreti, çıkış tutarı ile maliyet farkı (kâr payı ve faizler dahil) üzerinden hesaplanan tutarın %20'sini geçemez."}, {"q": "Halka arz eden GSYO'ların ihraç edebileceği imtiyazlı pay hangisidir?", "o": ["Kâr payı imtiyazlı pay", "Oy hakkı imtiyazlı pay", "Hiçbir imtiyazlı pay", "Tasfiye payı imtiyazlı pay", "YK üye sayısının salt çoğunluğunu aday gösterme imtiyazı veren pay"], "a": 4, "e": "Halka arz eden GSYO'lar yalnız YK üye sayısının salt çoğunluğunu aday gösterme imtiyazı veren pay ihraç edebilir."}, {"q": "Aşağıdaki karşılaştırmalardan hangisi yanlıştır?", "o": ["GYO'da halka arz oranı %25, MKYO'da %49'dur", "MKYO genel müdürüne 12 ayda en fazla üç ay vekalet edilebilir", "GYO'larda lider sermayedar zorunludur", "GSYO'da asgari GS yatırım oranı %51'dir", "GSYF'de kredi sınırı fon toplam değerinin %50'sidir"], "a": 2, "e": "Lider sermayedar MKYO ve GSYO'da aranır; GYO'larda böyle bir şart yoktur."}]}, {"id": 14, "kisa": "TSPB Meslek Kuralları", "baslik": "TSPB Üyelerinin Meslek Kuralları ve Disiplin Yönetmeliği", "ozet": "TSPB'nin yapısı, üyelerin genel ilkeleri, müşteri, rakip ve çalışanlarla ilişkiler, reklam kuralları; disiplin cezaları, soruşturma süreleri ve zamanaşımı.", "notlar": "<h3>Üç düzenleme ve hukuki dayanak<\/h3>\n<table>\n<tr><th>Düzenleme<\/th><th>Neyi düzenler<\/th><\/tr>\n<tr><td>Meslek Kuralları<\/td><td>TSPB üyelerinin sermaye piyasası faaliyetlerinde uyacağı temel kurallar ve ilkeler<\/td><\/tr>\n<tr><td>Etik İlkeler (SPEK)<\/td><td>Sermaye piyasası çalışanlarının mesleki faaliyetlerinde uyacağı etik davranış standartları<\/td><\/tr>\n<tr><td>Disiplin Yönetmeliği<\/td><td>Meslek kuralları ve etik ilkelere uyulmamasında uygulanacak yaptırımlar<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>TSPB:<\/b> SPKn <b>m.37<\/b> uyarınca yatırım hizmet ve faaliyetinde bulunmaya yetkili kuruluşlar ile Kurulca uygun görülen sermaye piyasası kurumlarının üye olduğu <b>kamu kurumu niteliğinde meslek kuruluşu<\/b>.<\/li>\n<li><b>Üyeler:<\/b> aracı kurumlar, bankalar, menkul kıymet, girişim sermayesi ve gayrimenkul yatırım ortaklıkları ile portföy yönetim şirketleri. Üyeler Statüye ve Birlik kararlarına uymakla yükümlüdür (SPKn m.75/6).<\/li>\n<li>Birlik, SPKn <b>m.74/2-b<\/b> uyarınca meslek kurallarını oluşturmakla görevli ve yetkilidir. Meslek kurallarını <b>Birlik Yönetim Kurulu hazırlar<\/b>, <b>Birlik Genel Kurulu onaylar<\/b>. Üyeler her zaman Birlik YK'ya öneri getirebilir.<\/li>\n<li>Birliğin amacı: üyelerin müşterek ihtiyaçlarını karşılamak, mesleki faaliyetleri kolaylaştırmak, piyasanın gelişmesine katkı, dürüstlük ve güveni hakim kılmak için meslek disiplini ve ahlakını korumak, haksız rekabeti önlemek.<\/li>\n<li>Kurallara uymayan üyelere Statü m.24 uyarınca <b>uyarı, kınama, idari para cezası, üyelikten geçici çıkarma, üyelikten sürekli çıkarma<\/b> uygulanır.<\/li>\n<\/ul>\n\n<h3>Üyelerin uyacağı genel ilkeler<\/h3>\n<ol>\n<li><b>Dürüst ve adil davranma:<\/b> müşteri çıkarları ve piyasa bütünlüğü gözetilir; doğru beyana dayalı hareket edilir.<\/li>\n<li><b>Bağımsızlık ve tarafsızlık:<\/b> bağımsızlığa gölge düşürecek teklif ve talepte bulunulmaz; <b>aynı koşullara sahip her müşteriye eşit<\/b> davranılır.<\/li>\n<li><b>Mesleki özen ve titizlik:<\/b> dikkatli ve basiretli davranma; teknik bilgi birikimi; gelişmeleri takip.<\/li>\n<li><b>Saydamlık:<\/b> tüm taraflar ve kamu kurumları tam, doğru, hızlı ve eşit bilgilendirilir.<\/li>\n<li><b>Kaynakları etkin kullanma:<\/b> maddi, teknolojik ve beşeri kaynaklar etkin ve verimli kullanılır.<\/li>\n<li><b>Rekabet ve toplumsal yararı gözetme:<\/b> haksız rekabetten kaçınma; toplumsal yarar ve çevreye saygı; sosyal ve kültürel etkinliklere destek.<\/li>\n<li><b>Suç gelirlerinin aklanmasıyla mücadele:<\/b> şüpheli işlemlerin belirlenmesi, kurumlarla işbirliği, çalışanlara eğitim.<\/li>\n<\/ol>\n\n<h3>Müşterilerle ilişkiler<\/h3>\n<ul>\n<li><b>Müşteriyi tanıma:<\/b> iş ilişkisinden önce kimlik bilgileri alınır, yazılı sözleşme yapılır; mali durum, yatırım amacı, süre, risk-getiri tercihi öğrenilir, <b>standart testler<\/b> yapılır ve güncel tutulur. Ürün uygun değilse veya müşteri bilgi vermezse müşteri <b>uyarılır<\/b>.<\/li>\n<li><b>Talimatlara uyma:<\/b> çerçeve sözleşme sınırlarında, testleri dikkate alarak; talimatlar kesin, açık ve anlaşılır olmalı. Müşteri varlıkları üzerinde yetkisiz tasarruf yapılamaz.<\/li>\n<li><b>Bilgi verme:<\/b> iki aşamada: <b>hizmet öncesi<\/b> ve <b>hizmet sırasında<\/b>. Kesin bilgi ile yoruma dayalı bilgi ayrılır, kaynak gösterilir; abartılı ve getiri garantisi içeren ifade kullanılmaz. Kamuya açık olmayan bilgiyle hiçbir yatırımcı grubuna avantaj sağlanmaz.<\/li>\n<li><b>Müşteri menfaatleri:<\/b> sadakat ve özen borcu; müşteri aleyhine sözleşme hükmü konulamaz; müşterinin bilgisizliğinden yararlanılamaz; tarifeli ücretler aşılamaz; işlem güvenliği için teknik ve hukuki önlem alınır.<\/li>\n<li><b>Çıkar çatışması:<\/b> üye-müşteri ve <b>müşteri-müşteri<\/b> arasında olabilir. Önlenemiyorsa önce müşteri menfaati gözetilir ve müşteriye bildirilir; müşteriler arasında adil ve tarafsız davranılır.<\/li>\n<li><b>Sır saklama:<\/b> müşteri bilgileri kanunen yetkili merciler dışında açıklanmaz ve kullanılmaz.<\/li>\n<li><b>Müşteri şikayetleri:<\/b> nedenleri araştırılır, haklı şikayetlerin tekrarı önlenir, çalışanlar bilgilendirilir.<\/li>\n<\/ul>\n\n<h3>İlan, reklam ve promosyon<\/h3>\n<ul>\n<li>Aldatıcı, küçük düşürücü, bilgi ve deneyim eksikliğini istismar edici olmamalı.<\/li>\n<li><b>\"En iyi, en güvenilir, en sağlam, en az, en düşük, en çok tercih edilen, en çok kazandıran\"<\/b> gibi sübjektif ve abartılı ifadeler kullanılmaz.<\/li>\n<li>Mutlak getiri veya zarara karşı garanti taahhüdü verilmez. Diğer üyeleri kötüleyen veya bir üyenin daha güvenli olduğu izlenimini yaratan ifade kullanılmaz.<\/li>\n<li>Ödüllere reklamlarda yer verilebilir; ancak ödülün kaynağı açıkça belirtilir. Sayısal veriler yetkili makamlarca yayımlanmış veya onaylanmış olmalı, diğerlerinde kaynak gösterilir.<\/li>\n<li>Aktif pazarlamayla müşteri getirenlere, getirdikleri müşterinin geliri üzerinden <b>pay veren<\/b> kampanyalar düzenlenmez.<\/li>\n<li>İade kampanyalarında müşterinin ödediği komisyondan fazla iade yapılmaz; kampanya süresince komisyon oranları müşteri aleyhine değiştirilmez; promosyon maliyetleri müşteri hesaplarına yansıtılmaz.<\/li>\n<\/ul>\n\n<h3>Diğer üyelerle ilişkiler ve haksız rekabet<\/h3>\n<ul>\n<li>Dayanışma; Birlik bilgi bankasına sır kapsamında olmayan verilerin süresinde sağlanması.<\/li>\n<li>Diğer üyeleri yanlış, yanıltıcı veya kötüleyici beyanlarla kötülemek yasaktır; her kurum bir <b>itibar müessesesidir<\/b>.<\/li>\n<li>Kamuya açıklanmamış bilgiyle işlem yapılmaz; piyasa dolandırıcılığı ve piyasa bozucu eylemlerde bulunulmaz.<\/li>\n<li>Tarifeler basiretli tacir olarak belirlenir; tarife dışı ücret alınmaz.<\/li>\n<li>Diğer üyenin faaliyetini kesintiye uğratacak şekilde <b>ekip halinde personel transferi<\/b> yapılmaz. Yeni işe başlayan personelin eski işyerinin müşterileriyle irtibatı <b>en az bir ay<\/b> engellenir.<\/li>\n<\/ul>\n\n<h3>Çalışanlarla ilişkiler<\/h3>\n<ul>\n<li><b>Mesleki yeterlilik:<\/b> görevin gerektirdiği eğitim ve deneyim; gerekli lisansa sahip olmak ve etik ilkelere uymak yeterliliğin sağlanması anlamına gelir.<\/li>\n<li><b>Mesleki özen:<\/b> dikkatli ve basiretli bir çalışanın aynı koşullarda göstereceği dikkat; üyeler iç kontrol sistemi kurar. Yeni personel hakkında <b>sicil tutmakla yetkili kuruluştan<\/b> bilgi alınır.<\/li>\n<li><b>Kariyer gelişimi:<\/b> terfide bilgi, yetenek ve başarı kadar meslek kurallarına bağlılık da ölçüttür.<\/li>\n<li><b>Çalışanların müşterilerle ilişkileri:<\/b> müşteriyle borç-alacak, kefalet, müşterek hesap ilişkisine girilmez (<b>birinci derece akrabalar hariç<\/b>); teamül üstü hediye alınmaz; konumdan kişisel çıkar sağlanmaz; <b>portföy yönetimi dışında<\/b> müşteriden emir verme, para çekme, virman gibi işlemler için vekaletname alınamaz.<\/li>\n<li>Üyeler çalışanların kuruma borçlanması ve kendi hesaplarına işlem yapması konusunda imtiyaz tanımayan kurallar koyar. Başka üyenin çalışanı hesap açarsa öğrenildiği tarihten itibaren <b>en fazla bir hafta<\/b> içinde diğer üyeye yazılı bildirilir.<\/li>\n<li>Üyeler kurum içi etik kuralları belirler ve denetler; çalışanlardan kuralları okuyup anladıklarına dair <b>imzalı taahhütname<\/b> alır. Asgari hükümleri Birlik belirler.<\/li>\n<li>Birlik ve kamu kurumlarına bilgi ve belgeler doğru, eksiksiz ve zamanında verilir.<\/li>\n<\/ul>\n\n<h3>TSPB Disiplin Yönetmeliği: cezalar<\/h3>\n<p>Dayanak: SPKn <b>m.74/2-d<\/b>, Statü m.7/1-d ve m.24/3. Kapsam: Birlik üyesi aracı kurumlar, bankalar, PYŞ'ler ve <b>payları borsada işlem gören<\/b> yatırım ortaklıkları.<\/p>\n<table>\n<tr><th>Ceza<\/th><th>Tanım<\/th><th>Gerektiren haller<\/th><\/tr>\n<tr><td><b>Uyarı<\/b> (en hafif)<\/td><td>Daha dikkatli davranması gerektiğinin yazıyla bildirilmesi<\/td><td>Birlik düzenlemelerinde <b>kayıtsız ve dikkatsiz<\/b> davranmak; üyelik görevlerine kayıtsızlık; müşteri talimatlarına kayıtsızlık; Birliğin itibarını zedeleyici <b>söz<\/b>; müşteri sırlarının güvenliğinde özensizlik; ihmalkar davranışlar<\/td><\/tr>\n<tr><td><b>Kınama<\/b><\/td><td>Kusurlu olduğunun yazıyla bildirilmesi<\/td><td>Düzenlemeleri <b>kusurlu veya kasıtlı<\/b> yerine getirmemek; talimatları kasten yerine getirmemek; itibarı zedeleyici yayın ve açıklama; çıkar çatışmasında adil olmamak; yetersiz iç denetim nedeniyle suiistimal; diğer üyeler hakkında asılsız ihbar; Birlik incelemesini engellemek<\/td><\/tr>\n<tr><td><b>Geçici çıkarma<\/b><\/td><td><b>Altı ayı aşmamak<\/b> üzere üyelik haklarından mahrumiyet<\/td><td>SPKn <b>m.106, 107 ve 109<\/b>'daki sermaye piyasası suçlarını işlemek veya bunları işleyenlere kasıtlı ortam hazırlamak<\/td><\/tr>\n<tr><td><b>Sürekli çıkarma<\/b> (en ağır)<\/td><td>Üyelik sıfatının sona erdirilmesi<\/td><td>SPKn <b>m.110<\/b>: <b>güveni kötüye kullanma ve sahtecilik<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Geçici ve sürekli çıkarmada suçun ve üyeyle doğrudan bağlantının <b>ilk derece mahkemesi kararıyla<\/b> sabit olması gerekir.<\/li>\n<li><b>Tekerrür:<\/b> uyarı alan üye silinme süresi içinde aynı cezayı gerektiren fiil işlerse <b>kınama<\/b>; geçici çıkarma alan aynı fiili tekrarlarsa <b>sürekli çıkarma<\/b> verilir.<\/li>\n<li>Bir fiil birden fazla maddeyi ihlal ederse <b>ağır olan<\/b> ceza verilir; YK birkaç cezayı birlikte verebilir; gerektiğinde <b>bir derece ağır veya hafif<\/b> ceza uygulanabilir.<\/li>\n<li>Silinme süresi içinde <b>iki defa<\/b> ceza gerektiren fiil işleyen üyenin sonraki her fiili için ceza <b>bir derece ağırlaştırılır<\/b> (geçici ve sürekli çıkarmada uygulanmaz).<\/li>\n<li>Geçici ve sürekli çıkarma kesinleşirse en çok <b>beş iş günü<\/b> içinde SPK'ya bildirilir.<\/li>\n<\/ul>\n\n<h3>Disiplin Komitesi ve soruşturma<\/h3>\n<ul>\n<li><b>Komite:<\/b> Birlik Genel Kurulunca <b>iki yıl<\/b> için seçilen <b>beş üye<\/b>; kendi aralarında başkan ve başkan vekili seçer. En az <b>üç üyeyle<\/b> toplanır, karar için en az <b>üç olumlu oy<\/b> gerekir; <b>çekimser oy kullanılamaz<\/b>; kararlar gerekçeli; karşı oy da gerekçeli. Kendileriyle ilgili kararlara katılamazlar. Raportör: <b>Hukuk İşleri Müdürü<\/b>.<\/li>\n<li>YK, ihbar, şikayet veya resen dosyayı Komiteye havale eder; Komite en geç <b>on iş günü<\/b> içinde işlemlere başlar. İhbar edenin kimliği yasal zorunluluk dışında saklı tutulur.<\/li>\n<li><b>Yazılı savunma<\/b> istenmesi zorunludur; süre tebliğden itibaren <b>on iş günü<\/b> (geçerli mazeret veya mücbir sebepte <b>yirmi iş günü<\/b>). Süresinde savunma vermeyen hakkından vazgeçmiş sayılır.<\/li>\n<li>Komite raporu savunma süreleri hariç en geç <b>altmış iş günü<\/b> içinde düzenler ve YK Başkanına bildirir. YK eksik görürse en fazla <b>yirmi iş günü<\/b> içinde tamamlatır.<\/li>\n<li>YK Komite kararını aynen veya gerekçeli olarak farklı kabul edebilir. Karar <b>beş iş günü<\/b> içinde iadeli taahhütlü mektupla veya elden tebliğ edilir.<\/li>\n<li><b>İtiraz:<\/b> tebliğden itibaren <b>on iş günü<\/b> içinde <b>SPK<\/b> nezdinde; dilekçe Birlik YK Başkanlığına verilir.<\/li>\n<li>Kararlar itiraz edilmezse süre sonunda, itiraz edilirse SPK kararının tebliğiyle kesinleşir. Çıkarma cezalarının uygulanması için YK en fazla <b>on iş günü<\/b> ek süre verebilir.<\/li>\n<li>Ceza kovuşturması disiplin soruşturmasını engellemez. Dikkat: SPK aynı fiil için SPKn m.103/1 uyarınca idari para cezası verdiyse <b>Birlik ayrıca idari para cezası veremez<\/b>.<\/li>\n<\/ul>\n\n<h3>Zamanaşımı, sicil ve idari para cezası<\/h3>\n<table>\n<tr><th>Konu<\/th><th>Süre<\/th><\/tr>\n<tr><td>Soruşturma zamanaşımı<\/td><td>Fiilden itibaren <b>bir yıl<\/b> geçmemiş olmalı<\/td><\/tr>\n<tr><td>Ceza zamanaşımı<\/td><td>Kesinleşen karar <b>iki yıl<\/b> içinde uygulanmazsa<\/td><\/tr>\n<tr><td>Belgelerin saklanması<\/td><td><b>Beş yıl<\/b><\/td><\/tr>\n<tr><td>Sicilden silinme<\/td><td>Kesinleşmeden itibaren <b>beşinci yılın sonunda<\/b><\/td><\/tr>\n<tr><td>Tekerrüre esas alınmama<\/td><td>Kesinleşmeden itibaren <b>bir yıl<\/b> içinde yeni fiil işlenmezse<\/td><\/tr>\n<\/table>\n<ul>\n<li>Fiil aynı zamanda ceza kovuşturması gerektiriyor ve o mevzuatta daha uzun zamanaşımı varsa, uzun olan esas alınır.<\/li>\n<li>Sicil bilgileri SPK, borsalar, teşkilatlanmış piyasalar ve Birlikçe uygun görülenlere açıktır.<\/li>\n<li><b>İdari para cezası:<\/b> Statüye ve Birlik düzenlemelerine uymayan üyelere SPKn <b>m.103/5<\/b> uyarınca verilir; tutarı Komite raporuna göre YK belirler; usulde SPKn <b>m.105<\/b> uygulanır.<\/li>\n<\/ul>", "sorular": [{"q": "TSPB'nin hukuki niteliği ve dayanağı hangisidir?", "o": ["Özel hukuk tüzel kişisi bir vakıf", "Ticaret Kanunu'na tabi dernek", "SPK'nın bir dairesi", "SPKn m.37 uyarınca kurulan kamu kurumu niteliğinde meslek kuruluşu", "Borsa İstanbul'un iştiraki"], "a": 3, "e": "TSPB, SPKn m.37 uyarınca yetkili kuruluşların üye olduğu kamu kurumu niteliğinde bir meslek kuruluşudur."}, {"q": "TSPB meslek kurallarını kim hazır
