bankaları<\/th><\/tr>\n<tr><td>Emir alma ve iletme; işlem aracılığı; portföy aracılığı; saklama ve portföy saklama; Kurulca belirlenecek diğer hizmetler<\/td><td>Bunlara ek olarak portföy yöneticiliği, yatırım danışmanlığı, yüklenimli ve yüklenimsiz halka arz aracılığı<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: Yatırım ve kalkınma bankaları her türlü yatırım hizmetini yapabilir; <b>mevduat ve katılım bankaları halka arz aracılığı yapamaz<\/b>.<\/li>\n<li>İzin verilenlere yaptıkları hizmetleri gösteren <b>yetki belgesi<\/b> verilir; bir belgeyle birden fazla hizmete izin verilebilir. Yan hizmetler ayrıca yetki belgesine tabi değildir. Kurul araç bazında izin verebilir ve kuruluşları hizmet türü ve sermayeye göre gruplandırabilir.<\/li>\n<li><b>Yetki belgesinin iptali:<\/b> açık feragat veya izin tarihinden itibaren <b>2 yıl<\/b> faaliyette bulunulmaması; yanlış/yanıltıcı beyan veya hukuka aykırı yolla izin alınması; izin şartlarının kaybedildiğinin tespitinden itibaren <b>3 ay<\/b> içinde yeniden sağlanamaması.<\/li>\n<li>Tüm izinleri iptal edilenler sona erme kararı almak veya en geç <b>3 ay<\/b> içinde unvan ve faaliyet konusu dahil esas sözleşmelerini değiştirmek zorundadır.<\/li>\n<\/ul>\n<h3>Sermaye piyasası kurumları (m.35)<\/h3>\n<p>Yatırım kuruluşları; kolektif yatırım kuruluşları; SP'de faaliyet gösterecek bağımsız denetim, değerleme ve derecelendirme kuruluşları; portföy yönetim şirketleri; ipotek finansmanı kuruluşları; konut ve varlık finansmanı fonları; varlık kiralama şirketleri; merkezi takas kuruluşları; merkezi saklama kuruluşları; veri depolama kuruluşları; Kurulca belirlenen diğerleri.<\/p>\n<p><b>4 kategori:<\/b> yatırım kuruluşları; kolektif yatırım kuruluşları; finansal altyapı kuruluşları (merkezi takas ve saklama); diğer kuruluşlar (bağımsız denetim, değerleme, derecelendirme).<\/p>\n<p><b>Aracı kurum kuruluş şartları (m.43/1):<\/b> anonim ortaklık; payların tamamı <b>nama<\/b> yazılı; paylar <b>nakit<\/b> karşılığı çıkarılmış; sermaye Kurulun belirlediği tutardan az değil; esas sözleşme mevzuata uygun; kurucular gerekli şartları taşıyor; ortaklık yapısı şeffaf ve açık. Dönüşüm ve esas sözleşme değişikliğinde Kurulun <b>uygun görüşü<\/b>, pay devirlerinde Kurulun <b>izni<\/b> gerekir (m.44/3); aykırı devirler pay defterine kaydolunmaz.<\/p>\n<h3>Kolektif yatırım kuruluşları (KYK)<\/h3>\n<ul>\n<li>Halktan toplanan sermaye ile SPA, gayrimenkul, kıymetli maden gibi varlıklardan oluşan portföyü işletir. <b>Şirket esası<\/b> yatırım ortaklıklarını, <b>sözleşme esası<\/b> yatırım fonlarını doğurmuştur. SPKn m.3/1-m'de KYK yatırım fonları ve yatırım ortaklıklarıdır; m.48–56 PYŞ ve saklama kuruluşlarını da düzenler.<\/li>\n<li><b>Kapalı uçlu:<\/b> sermaye belirli, paylar kural olarak geri alınmaz. <b>Açık uçlu:<\/b> sermaye değişken, sınırsız pay ihracı ve geri alım; sermaye portföy değerine eşit. <b>Yarı açık uçlu:<\/b> sermaye belirli ama paylar geri alınabilir; yeni ihraç için esas sözleşme/içtüzük değişikliği gerekir.<\/li>\n<li><b>3 temel unsur:<\/b> halktan toplanan sermayeyle portföy; riskin dağıtılması ilkesiyle yatırım; uzmanlarca yönetim.<\/li>\n<li><b>4 ilke:<\/b> riskin dağıtılması; profesyonel yönetim; müşterek sermaye (portföyün halktan toplanan sermayeyle oluşturulması); malvarlığının korunması. Portföy varlıkları ayrı bir kurumda saklanır ve kurucu/yöneticinin alacaklıları bunlara başvuramaz; m.53/2: fon malvarlığı rehnedilemez, haczedilemez, teminat gösterilemez.<\/li>\n<\/ul>\n<h4>Yatırım ortaklıkları<\/h4>\n<ul>\n<li>SPA, gayrimenkul, girişim sermayesi ve Kurulca belirlenen varlıklardan oluşan portföyü işletmek için paylarını ihraç etmek üzere kurulan <b>sabit veya değişken sermayeli<\/b> anonim ortaklıklar. Türleri: menkul kıymet, gayrimenkul, girişim sermayesi yatırım ortaklıkları.<\/li>\n<li><b>Kuruluş izni şartları:<\/b> <b>kayıtlı sermayeli<\/b> AO; başlangıç sermayesi Kurul tutarından az değil; paylar nakit karşılığı ve kuruluşta tam ve nakden ödenmiş; unvanda \"<b>Yatırım Ortaklığı<\/b>\" ibaresi; esas sözleşme uygun; portföy saklama kuruluşu belirlenmiş; diğer şartlar. Değişken sermayeli olanlara ilişkin hükümler saklıdır.<\/li>\n<li>Esas sözleşmede hüküm ve Kurul onayıyla bir PYŞ'den hizmet alabilir.<\/li>\n<li>GYO'ların kuruluş ve sermaye artırımında Kurulca uygun görülen varlıklar <b>ayni sermaye<\/b> olarak konulabilir; ayni sermaye karşılığı paylar halka arz edilebilir.<\/li>\n<\/ul>\n<h4>Değişken sermayeli yatırım ortaklıkları (DSYO)<\/h4>\n<ul>\n<li>AB UCITS Direktifi çerçevesinde fon ile yatırım ortaklığı modelinin bileşimi; özellikle gayrimenkul gibi tüzel kişiliği olmayan fonların zorlandığı alanlarda faaliyet gösterebilir.<\/li>\n<li>Sermayesi her zaman <b>net aktif değere<\/b> eşittir (varlıklar eksi borçlar).<\/li>\n<li>TTK'nın esas sermaye, asgari sermaye, esas sözleşmenin asgari içeriği, ayni sermaye, nominal değer, kendi payları, sermaye artırım/azaltım, pay defteri kısıtlamaları, kâr dağıtımı, yedek akçe ve tasfiye hükümlerine tabi değildir.<\/li>\n<li>Paylar: <b>yatırımcı payları<\/b> ve nama yazılı olması zorunlu <b>kurucu payları<\/b>. Payların <b>itibari değeri yoktur<\/b>. Kurucu paylarının devri ve itfası Kurul iznine tabidir. Dikkat: Yatırımcı payları <b>idari hak vermez<\/b>.<\/li>\n<li>DSYO, pay sahibinin talebi üzerine payları itfa edip bedelini ödemekle yükümlüdür; itfa esasları esas sözleşmede gösterilir.<\/li>\n<\/ul>\n<h4>Yatırım fonları<\/h4>\n<ul>\n<li>Yalnızca <b>portföy yönetim şirketleri<\/b> kurabilir. Yarı açık uçlu yapıdan tedavül limiti olmayan <b>tam açık uçlu<\/b> yapıya geçildi; içtüzüğün <b>noter onayı<\/b> zorunluluğu kaldırıldı.<\/li>\n<li><b>Tanım:<\/b> katılma payı karşılığı toplanan para veya varlıklarla, tasarruf sahipleri hesabına <b>inançlı mülkiyet<\/b> esaslarına göre portföy işletmek amacıyla PYŞ tarafından içtüzükle kurulan, <b>tüzel kişiliği olmayan<\/b> malvarlığı.<\/li>\n<li>Kuruluş izni için kurucunun yetkili bir saklama kuruluşuyla anlaşması ve içtüzüğün Kurulca onaylanması gerekir; başvurular eksiksiz belgelerden itibaren <b>2 ay<\/b> içinde karara bağlanır.<\/li>\n<li>Fon; tapu ve resmi sicil işlemleri ile ortağı olacağı şirketlerin ticaret sicili işlemleriyle sınırlı olarak <b>tüzel kişiliği haiz sayılır<\/b>. Taşınmazlar tapuya <b>fon adına<\/b> tescil edilir; işlemler PYŞ ve saklama kuruluşunu temsilen birer yetkilinin <b>müşterek imzasıyla<\/b> yapılır.<\/li>\n<li>Fon malvarlığı PYŞ ve saklayıcının malvarlığından ayrıdır. Fon hesabına ve içtüzükte hüküm bulunmak şartıyla kredi, türev, açığa satış ve benzeri işlemler dışında teminat gösterilemez ve rehnedilemez. Yönetim kamuya devredilse bile başka amaçla tasarruf edilemez; kamu alacağı için bile haczedilemez, ihtiyati tedbir konulamaz, iflas masasına girmez.<\/li>\n<li>PYŞ'nin üçüncü kişilere borçları ile fonun aynı kişilerden alacakları <b>mahsup edilemez<\/b>.<\/li>\n<\/ul>\n<h4>Portföy yönetim şirketleri ve portföy saklama<\/h4>\n<ul>\n<li><b>PYŞ:<\/b> ana faaliyet konusu yatırım fonlarının kurulması ve yönetimi olan anonim ortaklık; kuruluş ve faaliyet Kurul iznine tabi. Başvurular eksiksiz belgelerden itibaren <b>6 ay<\/b> içinde karara bağlanır. PYŞ'nin yatırdığı teminatlar rehnedilemez, haczedilemez, devredilemez.<\/li>\n<li>KYK portföyündeki varlıklar, KYK adına açılan <b>ayrı saklama hesabında<\/b> saklayıcıya teslim edilir. Saklama hizmeti; katılma payı/DSYO payı ihraç ve itfasının, birim pay değeri hesaplamasının, talimatların, edim bedellerinin aktarımının, gelir kullanımının ve portföy işlemlerinin mevzuat, içtüzük veya esas sözleşmeye uygunluğunun sağlanmasını içerir.<\/li>\n<li>Saklayıcı, yükümlülüklerini yerine getirmemesinden doğan zararlardan fonlarda PYŞ ve katılma payı sahiplerine, ortaklıklarda ortaklığa karşı sorumludur. PYŞ/yatırım ortaklığı saklayıcıdan, saklayıcı da PYŞ/yatırım ortaklığından zararın giderilmesini <b>talep etmekle yükümlüdür<\/b>; pay sahiplerinin dava hakkı saklıdır.<\/li>\n<li>Saklayıcı varlıkları başka bir saklayıcıda <b>alt saklamaya<\/b> verebilir; bu halde hepsi <b>müteselsilen<\/b> sorumludur. Kurul, varlıkların merkezi saklama/takas kuruluşunda KYK adına hesaplarda izlenmesini zorunlu tutabilir.<\/li>\n<li>Dikkat: Saklayıcı ile PYŞ <b>aynı tüzel kişi olamaz<\/b>; birbirinden bağımsız ve yalnız katılma payı sahiplerinin menfaatine hareket ederler. Saklayıcının ve fona aracılık eden yatırım kuruluşunun yöneticileri PYŞ'de ortak, yönetici veya temsilci olamaz; PYŞ'nin ortak ve yöneticileri saklayıcıda yönetici veya temsilci olamaz.<\/li>\n<\/ul>\n<h3>Finansal altyapı kuruluşları<\/h3>\n<ul>\n<li><b>Merkezi takas kuruluşu:<\/b> borsa ve teşkilatlanmış pazarlarda işlem gören SPA'nın teslimi, bedel ödemesi ve teminat yükümlülükleriyle ilgili işlemleri yürüten AO. Kuruluşuna <b>Kurulun teklifi üzerine ilgili Bakan<\/b>, faaliyete geçmesine <b>Kurul<\/b> izin verir. <b>Takasbank<\/b>, Geçici m.8/1 uyarınca izin aranmaksızın merkezi takas kuruluşu olarak faaliyet gösterir. Kurul düzenleme, gözetim ve denetim merciidir.<\/li>\n<li>Kurul, takas hizmeti verilecek borsaları (borsaların uygun görüşünü alarak) belirler; uygun görürse merkezi takas kuruluşu, TCMB tarafından oluşturulanlar hariç diğer piyasaların takasını da yapabilir. Borsa dışı işlemlerin merkezi takasta yapılmasını zorunlu tutabilir.<\/li>\n<li><b>Merkezi karşı taraf (MKT):<\/b> alıcıya karşı satıcı, satıcıya karşı alıcı rolü; Kurul piyasa veya araç bazında zorunlu tutabilir; temerrüt riskini azaltır. Yeterli sermaye ve iç sistemler zorunludur; iç denetim birimleri risk yönetimi ve bilgi işlem altyapısını en az <b>6 aylık<\/b> dönemlerle kontrol edip Kurula bildirir. Alınan teminatlar ve hesap sahiplerinin varlıkları kuruluşun malvarlığından ayrı izlenir.<\/li>\n<li><b>Takas kesinliği:<\/b> takas talimat ve işlemleri ile ödeme işlemleri, üyenin faaliyetinin durdurulması veya tasfiyesi dahil, <b>geri alınamaz ve iptal edilemez<\/b>. Konkordato, iflas veya takip süreçleri merkezi takas kuruluşunun teminat üzerindeki haklarını sınırlandıramaz.<\/li>\n<li><b>Merkezi saklama kuruluşu:<\/b> kuruluşuna <b>Kurulun uygun görüşü üzerine ilgili Bakan<\/b>, faaliyetine Kurul izin verir. Kurul, belirli araçların bir veya birden fazla merkezi saklama kuruluşunda saklanmasını zorunlu tutabilir. Kaydileştirilen SPA'nın merkezi saklama kuruluşu <b>MKK<\/b>'dır.<\/li>\n<li>MKK'nın ek görevleri: kurumsal yönetime uyum için şirketler ile ortakları/yatırımcıları arasında elektronik iletişim platformu; SP verilerini tek noktada toplayan veri bankası; Kurulun verdiği diğer görevler.<\/li>\n<li><b>Veri depolama kuruluşları:<\/b> sistemik riskin gözetimi için Kurul işlem bilgilerinin kendisine veya yetkilendireceği veri depolama kuruluşuna bildirilmesini isteyebilir; bildirimle yükümlüler <b>gizlilik ve sır saklama<\/b> hükümlerini ileri süremez. Bilgilerin kamu kurumları dahil üçüncü kişilerle paylaşımı <b>Kurul onayına<\/b> tabidir.<\/li>\n<\/ul>\n<h3>Borsalar ve teşkilatlanmış pazar yerleri<\/h3>\n<ul>\n<li>Borsa ve piyasa işleticisinin kuruluşuna <b>Kurulun uygun görüşü üzerine Cumhurbaşkanı<\/b> karar verir; faaliyete geçme <b>Kurul iznine<\/b> bağlıdır. Borsalar kamu tüzel kişisi değil, <b>özel hukuk tüzel kişisidir<\/b>.<\/li>\n<li><b>Borsa (m.3/1-ç):<\/b> anonim şirket şeklinde kurulan; SPA, kambiyo, kıymetli maden ve taşlar ile Kurulca uygun görülen kıymetlerin serbest rekabet altında alınıp satılmasını sağlayan ve fiyatları tespit ve ilan eden, kendisi veya piyasa işleticisi tarafından işletilen sistemler ve pazar yerleri. <b>Piyasa işleticisi (m.3/1-r):<\/b> borsayı veya piyasalarını yöneten/işleten anonim ortaklık.<\/li>\n<li>Kotta kalma şartları düzenli gözden geçirilir. Borsa veya piyasa işleticisi işlemleri durdurabilir veya kottan çıkarabilir; bu durum <b>derhal Kurula bildirilir ve kamuya açıklanır<\/b>. Kurulun durdurma ve kottan çıkarma yetkisi saklıdır.<\/li>\n<li><b>Kuruluş şartları:<\/b> anonim şirket; payların tamamı nama yazılı; nakit karşılığı; sermaye Kurul tutarından az değil; kurucular ve önemli etkiye sahip ortaklar şartları taşıyor; esas sözleşme uygun. İzin verilirken yurt içi ve yurt dışı piyasaların genel durumu ve sistemik risk dikkate alınır.<\/li>\n<li>Borsanın piyasa işleticisiyle anlaşması <b>Kurul onayı olmaksızın hüküm ifade etmez<\/b>. Borsalar, kurallarının <b>ağır ihmal ve kasıtla<\/b> ihlalinde Kurula bildirimde bulunur. Bütçe ve kadrolarını kendileri belirler; kamu idaresine ilişkin mevzuata tabi tutulamazlar.<\/li>\n<li><b>Borsa uyuşmazlıkları:<\/b> emir iletimi/eşleştirme ve yükümlülüklerin zamanında yerine getirilmesine ilişkin uyuşmazlıklarda esasları <b>borsa yönetim kurulu<\/b> belirler. Uyuşmazlık tutarı m.84/5'teki azami tazmin tutarını aşarsa taraflar <b>Kurul nezdinde itiraz<\/b> edebilir.<\/li>\n<li>Kotasyon, işlem, emir eşleştirme, disiplin, uyuşmazlık, borsa gelirleri, çıkar çatışması ve gözetim gibi konular borsanın hazırlayıp <b>Kurulun onayladığı yönetmeliklerle<\/b> belirlenir. Alternatif işlem sistemleri ve çok taraflı platformlar Kurul yönetmelikleriyle düzenlenir; Kurul bunların gözetim ve denetim merciidir.<\/li>\n<\/ul>\n<h3>Öz düzenleyici kurumlar<\/h3>\n<ul>\n<li>SPKn iki öz düzenleyici kurum düzenler: <b>Türkiye Sermaye Piyasaları Birliği (TSPB)<\/b> ve <b>Türkiye Değerleme Uzmanları Birliği (TDUB)<\/b>. Denetim mercii <b>Kurul<\/b>dur. Eski TSPAKB, sadece aracı kurumların değil tüm SP kurumlarının meslek örgütü olacak şekilde TSPB'ye dönüştürüldü.<\/li>\n<li>TSPB'ye üyelik başvurusu zorunlu olanlar: yatırım kuruluşları, Kurulca uygun görülen SP kurumları, <b>kitle fonlama platformları<\/b> ve <b>kripto varlık hizmet sağlayıcıları<\/b>. TSPB tüzel kişiliği olan kamu kurumu niteliğinde meslek kuruluşudur.<\/li>\n<li>TSPB görevleri: araştırma; meslek kuralları; haksız rekabeti önleme; Kurulca belirlenen konularda düzenleme ve denetim; disiplin cezası; ulusal/uluslararası temsil; üyeleri bilgilendirme; üyeler arası uyuşmazlıklar için <b>tahkim<\/b> altyapısı.<\/li>\n<li>Zorunlu organlar: <b>genel kurul, yönetim kurulu, denetleme kurulu<\/b>.<\/li>\n<li>Kurul her iki birliği <b>her yıl<\/b> denetler; denetim raporunun bir örneği en geç izleyen yılın <b>6. ayı sonuna<\/b> kadar ilgili Bakanlığa gönderilir. İlgili Bakan, Kuruldan tedbir isteyebilir ve birliğin işlem ve hesaplarını denetleyebilir.<\/li>\n<li>TDUB'a üyelik başvurusu zorunlu olanlar: gayrimenkul değerleme uzmanlığı lisansı sahipleri ve değerleme kuruluşları. TDUB ayrıca <b>eğitim ve sertifika<\/b> verir, değerleme standartlarını oluşturur.<\/li>\n<\/ul>\n<h3>Yatırımcı Tazmin Merkezi (YTM)<\/h3>\n<ul>\n<li>YTM <b>kamu tüzel kişiliğini<\/b> haizdir; Kurul tarafından idare ve temsil edilir.<\/li>\n<li><b>Tazmin kararı:<\/b> Kurul, yatırım kuruluşunun SP faaliyetinden kaynaklanan nakit ödeme veya SPA teslim yükümlülüğünü yerine getiremediğini ya da kısa sürede getiremeyeceğini tespit ederse alır. Dikkat: Kuruluş hakkında <b>tedrici tasfiye veya iflas kararı şart değildir<\/b>.<\/li>\n<li>Kapsam 2499'da yalnız <b>hisse senedi<\/b> teslimiydi; artık <b>tüm SPA<\/b>'yı kapsar. Tazmin yalnızca yatırım kuruluşlarının SP faaliyetinden doğan zararlara yöneliktir. Yatırım kuruluşlarının YTM'ye katılması <b>zorunludur<\/b>; giriş, yıllık ve ek aidat esasları yönetmelikle belirlenir.<\/li>\n<li>YTM malvarlığı amacı dışında kullanılamaz, kamu alacağı için bile haczedilemez; işlemleri <b>harçtan<\/b>, kağıtları <b>damga vergisinden<\/b> müstesnadır.<\/li>\n<li><b>Gelirler:<\/b> giriş aidatları; yıllık ve ek aidatlar; Kanun kapsamında verilen <b>idari para cezalarının %50'si<\/b>; YTM malvarlığının getirisi.<\/li>\n<li><b>m.83/4:<\/b> hesap sahibinin son talep, işlem veya yazılı talimatından itibaren <b>10 yıl<\/b> içinde talep edilmeyen emanet ve alacaklar YTM'ye emaneten devredilir. Bedelsiz pay ve kâr payı alma dışındaki pay sahipliği hakları iadeye kadar <b>donar<\/b>. 15.04.2021 tarihli 7316 sayılı Kanundan önce YTM'ye gelir kaydedilen tutarlar iade edilmez.<\/li>\n<li><b>Kapsam dışı zararlar:<\/b> yatırım danışmanlığından veya piyasa fiyat hareketlerinden doğan zararlar; m.106–107 suçlarından veya suç gelirlerini aklamadan mahkum olanların bu eylemlerle ilgili alacakları. Bu suçlardan suç duyurusunda bulunulanlara ödemeler soruşturmanın başlamasından kararın kesinleşmesine kadar durur.<\/li>\n<li><b>Tazmin edilmeyenler:<\/b> (a) tazmin kararı verilen kuruluşun YK üyeleri, yöneticileri, şahsen sorumlu ortakları, <b>%5 veya daha fazla<\/b> paya sahip ortakları, denetim kurulu üyeleri, gruptaki benzer konumdakiler, bunların eşi ve <b>ikinci dereceye kadar<\/b> kan ve kayın hısımları ve adlarına hareket edenler; (b) aynı gruptaki diğer şirketler; (c) (a) bendindekilerin <b>%25 veya daha fazla<\/b> paya sahip olduğu şirketler; (d) kuruluşun mali sıkıntısında sorumluluğu bulunan veya menfaat sağlayan kişiler.<\/li>\n<\/ul>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><\/tr>\n<tr><td>Azami tazmin<\/td><td>Her yatırımcıya <b>100.000 TL<\/b>; her yıl yeniden değerleme oranında artırılır. Kurulun teklifiyle Cumhurbaşkanı <b>5 katına<\/b> kadar artırabilir. Sınır, hesap sayısı, türü ve para birimine bakılmaksızın aynı kuruluştaki tüm talepleri kapsar.<\/td><\/tr>\n<tr><td>Devir<\/td><td>Azami tutarı aşan kısmın ödenmesi için alacak başkasına devredilmişse devralana ödeme yapılmaz.<\/td><\/tr>\n<tr><td>Başvuru<\/td><td>YTM'ye <b>yazılı<\/b>; hak, tazmin kararının ilanından itibaren <b>1 yıl<\/b> sonra zamanaşımına uğrar. YTM resen ödeme yapmaz.<\/td><\/tr>\n<tr><td>Ödeme süresi<\/td><td>Hak sahipleri belirlendikten sonra kural olarak <b>3 ay<\/b> içinde<\/td><\/tr>\n<tr><td>Hesaplama<\/td><td>Saklanan SPA öncelikle hak sahiplerine <b>ayni<\/b> dağıtılır; mahsuplar dikkate alınır.<\/td><\/tr>\n<tr><td>Halefiyet<\/td><td>YTM ödediği tutar kadar yatırımcılara halef olur; süreç Kurulca YTM bildirimiyle kapatılır.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Tedrici tasfiye:<\/b> Kurul, bankalar hariç, tazmin sürecinin kapanması kararıyla birlikte tedrici tasfiye kararı verebilir; işlemleri <b>YTM<\/b> yürütür. Ödemeler durur, malvarlığı üzerinde yalnız YTM tasarruf eder, kanuni organların yetkilerini YTM kullanır. Tasfiye kapatılıncaya kadar <b>iflas kararı verilemez<\/b>.<\/li>\n<li><b>Ödeme sırası:<\/b> (1) müşteri alacakları (tamamı karşılanamazsa garameten); (2) kamu alacakları, garameten; (3) YTM'nin tazmin ödemeleri ve tasfiye giderlerinden doğan alacakları, garameten; (4) diğer alacaklar. Bir sonraki gruba geçmek için öncekinin tamamı ödenmelidir.<\/li>\n<li>Kurul, YTM'nin başvurusu üzerine tasfiyeyi kapatır. Aktifler yetmezse YTM, <b>Kurulun uygun görüşüyle<\/b> iflas isteyebilir.<\/li>\n<li>Kitle fonlaması, yatırımcı tazmini hükümlerine tabi değildir.<\/li>\n<\/ul>", "sorular": [{"q": "Aşağıdakilerden hangisi SPKn m.37'de sayılan yatırım hizmet ve faaliyetlerinden biri değildir?", "o": ["Portföy yöneticiliği", "Yatırım danışmanlığı", "Çok taraflı alım satım sistemlerinin işletilmesi", "Servet yönetimi ve finansal planlama", "Halka arzda yüklenimde bulunmaksızın satışa aracılık"], "a": 3, "e": "Servet yönetimi ve finansal planlama m.38'deki yan hizmetlerdendir."}, {"q": "Yan hizmetler hakkında hangisi doğrudur?", "o": ["Ayrıca izin alınmasını gerektirmez", "Yalnızca yan hizmet sunmak üzere yatırım kuruluşu kurulabilir", "Yatırım kuruluşlarının sunması zorunludur", "Her biri için ayrı yetki belgesi alınır", "Kitle fonlama platformları yan hizmet sunar sayılır"], "a": 0, "e": "Yan hizmetler için ayrıca izin gerekmez ve sunmak isteğe bağlıdır; münhasıran yan hizmet için yatırım kuruluşu kurulamaz."}, {"q": "Kitle fonlaması hakkında hangisi yanlıştır?", "o": ["Borçlanmaya dayalı kitle fonlamasına bankacılık mevzuatı uygulanmaz", "İzahname veya ihraç belgesi yükümlülüğü yoktur", "Kitle fonlaması platformları ihraççı statüsündedir", "Yatırımcı tazmini hükümlerine tabi değildir", "Bilgi formunu imzalayanlar müteselsilen sorumludur"], "a": 2, "e": "Platformlar ne halka açık ortaklık ne de ihraççı statüsündedir."}, {"q": "7518 sayılı Kanun ile getirilen kripto varlık hizmet sağlayıcıları düzenlemesine göre hangisi doğrudur?", "o": ["Faaliyete başlamak için yalnızca TÜBİTAK izni yeterlidir", "Pay devirleri serbesttir, yalnızca bildirim yapılır", "SPA'nın kripto varlık olarak ihracı yasaktır", "TSPB'ye üyelik isteğe bağlıdır", "Pay devirlerinde Kurul izni zorunludur"], "a": 4, "e": "KVHS kuruluşu ve pay devirleri Kurul iznine tabidir; TÜBİTAK kriterlerine uygunluk izin şartıdır; TSPB'ye başvuru zorunludur."}, {"q": "SPKn m.3/1-v'ye göre aşağıdakilerden hangisi yatırım kuruluşu tanımına girer?", "o": ["Portföy yönetim şirketleri", "Bankalar", "Yatırım ortaklıkları", "Borsalar", "Kitle fonlama platformları"], "a": 1, "e": "Yatırım kuruluşu; aracı kurumlar, bankalar ve esasları Kurulca belirlenen diğer SP kurumlarıdır."}, {"q": "Mevduat bankaları aşağıdaki yatırım hizmetlerinden hangisini yürütemez?", "o": ["Emirlerin alınması ve iletilmesi", "İşlem aracılığı", "Portföy aracılığı", "Halka arzda yüklenimde bulunarak satışa aracılık", "SPA'nın saklanması"], "a": 3, "e": "Halka arz aracılığı, portföy yöneticiliği ve yatırım danışmanlığı ancak yatırım ve kalkınma bankalarınca yapılabilir."}, {"q": "Kurul, yetki belgesini hangi durumda iptal edebilir?", "o": ["İzin tarihinden itibaren 2 yıl faaliyette bulunulmamışsa", "İzin tarihinden itibaren 6 ay faaliyette bulunulmamışsa", "Şartların kaybı tespitinden itibaren 1 ay içinde yeniden sağlanamamışsa", "Yan hizmet sunulmamışsa", "Kurumun genel müdürü değişmişse"], "a": 0, "e": "İptal halleri: açık feragat veya 2 yıl faaliyetsizlik, yanıltıcı beyanla izin, şartların kaybının tespitinden itibaren 3 ay içinde yeniden sağlanamaması."}, {"q": "Aracı kurumların kuruluşu için aşağıdakilerden hangisi aranmaz?", "o": ["Anonim ortaklık olması", "Paylarının nakit karşılığı çıkarılması", "Paylarının hamiline yazılı olması", "Ortaklık yapısının şeffaf olması", "Sermayenin Kurulun belirlediği tutardan az olmaması"], "a": 2, "e": "Payların tamamının nama yazılı olması gerekir."}, {"q": "Sermayesi her zaman net aktif değerine eşit olan, yatırımcı paylarının idari hak vermediği kolektif yatırım kuruluşu hangisidir?", "o": ["Menkul kıymet yatırım ortaklığı", "Gayrimenkul yatırım ortaklığı", "Girişim sermayesi yatırım fonu", "Konut finansmanı fonu", "Değişken sermayeli yatırım ortaklığı"], "a": 4, "e": "DSYO'nun sermayesi daima net aktif değere eşittir; payları yatırımcı ve kurucu paylarından oluşur, yatırımcı payları idari hak vermez."}, {"q": "Yatırım ortaklıklarının kuruluş şartlarına ilişkin hangisi yanlıştır?", "o": ["Unvanlarında \"Yatırım Ortaklığı\" ibaresi bulunmalıdır", "Esas sermaye sisteminde kurulmaları zorunludur", "Pay bedelleri kuruluşta tam ve nakden ödenmelidir", "Portföy saklama kuruluşu belirlenmiş olmalıdır", "Başlangıç sermayesi Kurulun belirlediği tutardan az olmamalıdır"], "a": 1, "e": "Yatırım ortaklıkları kayıtlı sermayeli anonim ortaklık şeklinde kurulur."}, {"q": "Yatırım fonu kuruluş başvuruları, gerekli belgelerin eksiksiz sunulmasından itibaren ne kadar sürede karara bağlanır?", "o": ["1 ay", "6 ay", "3 ay", "2 ay", "30 iş günü"], "a": 3, "e": "Yatırım fonu başvuruları 2 ayda, PYŞ kuruluş başvuruları 6 ayda karara bağlanır."}, {"q": "Yatırım fonlarına ilişkin hangisi doğrudur?", "o": ["Fon adına tapu işlemleri PYŞ ve saklama kuruluşunu temsilen birer yetkilinin müşterek imzasıyla yapılır", "Fon her konuda tüzel kişiliğe sahiptir", "Fon içtüzüğü noter onayından geçmelidir", "Bankalar da yatırım fonu kurabilir", "PYŞ'nin üçüncü kişilere borçları fonun alacaklarıyla mahsup edilebilir"], "a": 0, "e": "Fon yalnız sicil işlemleriyle sınırlı tüzel kişi sayılır; noter onayı kaldırılmış, fonu yalnız PYŞ kurar, mahsup yasaktır."}, {"q": "Portföy saklama hizmetine ilişkin hangisi yanlıştır?", "o": ["Saklayıcı varlıkları alt saklamaya verirse saklayıcılar müteselsilen sorumludur", "PYŞ, saklayıcıdan zararın giderilmesini talep etmekle yükümlüdür", "Portföy yönetim şirketi kendi fonlarına saklama hizmeti verebilir", "Saklayıcı ve PYŞ birbirinden bağımsız hareket eder", "Varlıklar KYK adına açılan ayrı hesapta saklanır"], "a": 2, "e": "Saklayıcı ile PYŞ aynı tüzel kişi olamaz."}, {"q": "Merkezi takas kuruluşlarının kuruluş ve faaliyete geçme izinleri hakkında hangisi doğrudur?", "o": ["Her ikisine de Cumhurbaşkanı karar verir", "Kuruluşa Kurul, faaliyete Bakan izin verir", "Her ikisine Kurul izin verir", "Kuruluşa TCMB izin verir", "Kuruluşa Kurulun teklifi üzerine ilgili Bakan, faaliyete geçmeye Kurul izin verir"], "a": 4, "e": "Merkezi takas kuruluşunda kuruluş Kurulun teklifi üzerine Bakan iznine, faaliyete geçiş Kurul iznine bağlıdır. Borsalarda kuruluşa Cumhurbaşkanı karar verir."}, {"q": "Takas kesinliği kavramı neyi ifade eder?", "o": ["Takasın T+2'de yapılması zorunluluğu", "Takas ve ödeme işlemlerinin üyenin tasfiyesi halinde bile geri alınamaması ve iptal edilememesi", "Takas kuruluşunun iflas edememesi", "Borsa dışı işlemlerin takas edilememesi", "Takas teminatlarının haczedilebilmesi"], "a": 1, "e": "Takas talimatları ve ödeme işlemleri, üyenin faaliyetinin durdurulması veya tasfiyesi dahil geri alınamaz ve iptal edilemez."}, {"q": "Borsaların kuruluşuna kim karar verir?", "o": ["Kurulun teklifi üzerine ilgili Bakan", "Yalnız Kurul", "TBMM", "Kurulun uygun görüşü üzerine Cumhurbaşkanı", "Ticaret Bakanlığı"], "a": 3, "e": "Borsa ve piyasa işleticilerinin kuruluşuna Kurulun uygun görüşü üzerine Cumhurbaşkanı karar verir; faaliyete geçme Kurul iznine bağlıdır."}, {"q": "Borsada çıkan bir uyuşmazlıkta borsa yönetim kurulu kararına karşı taraflar hangi durumda Kurul nezdinde itiraz edebilir?", "o": ["Uyuşmazlık tutarı SPKn m.84/5'teki azami tazmin tutarını aşıyorsa", "Her durumda", "Uyuşmazlık bir bankayla ilgiliyse", "Karar oybirliğiyle alınmamışsa", "Hiçbir durumda itiraz edilemez"], "a": 0, "e": "Tutar, yatırımcı tazmininde ödenecek azami tutarı aşarsa Kurul nezdinde itiraz yolu açıktır."}, {"q": "Türkiye Sermaye Piyasaları Birliği'nin zorunlu organları hangileridir?", "o": ["Genel kurul ve yönetim kurulu", "Yönetim kurulu, disiplin kurulu ve tahkim kurulu", "Genel kurul, yönetim kurulu ve denetleme kurulu", "Genel kurul, yönetim kurulu ve etik kurulu", "Yönetim kurulu ve denetleme kurulu"], "a": 2, "e": "Birliğin zorunlu organları genel kurul, yönetim kurulu ve denetleme kuruludur."}, {"q": "Kurulun TSPB'ye ilişkin yıllık denetim raporunun bir örneği en geç ne zamana kadar ilgili Bakanlığa gönderilir?", "o": ["İzleyen yılın 3. ayı sonuna kadar", "Denetimi izleyen 30 gün içinde", "İzleyen yılın sonuna kadar", "Denetimi izleyen 15 gün içinde", "İzleyen yılın 6. ayı sonuna kadar"], "a": 4, "e": "Kurul birliği her yıl denetler; rapor örneği en geç izleyen yılın altıncı ayı sonuna kadar ilgili Bakanlığa gönderilir."}, {"q": "Yatırımcı Tazmin Merkezi'nin gelirleri arasında hangisi yer almaz?", "o": ["Giriş aidatları", "Kurulun tüm idari para cezası gelirleri", "Yıllık ve ek aidatlar", "YTM malvarlığının getirisi", "SPKn kapsamında verilen idari para cezalarının %50'si"], "a": 1, "e": "YTM'ye idari para cezalarının tamamı değil, %50'si gelir yazılır."}, {"q": "Yatırımcı tazmini kararı verilebilmesi için aşağıdakilerden hangisi gereklidir?", "o": ["Kuruluş hakkında iflas kararı verilmesi", "Tedrici tasfiye kararı verilmesi", "Yatırımcıların piyasa fiyatı nedeniyle zarar etmesi", "Yatırım kuruluşunun nakit ödeme veya SPA teslim yükümlülüğünü yerine getiremediğinin veya kısa sürede getiremeyeceğinin tespiti", "Kuruluşun yatırım danışmanlığı faaliyetinden zarar doğması"], "a": 3, "e": "Yükümlülüklerin yerine getirilememesinin tespiti gerekli ve yeterlidir; iflas veya tedrici tasfiye şart değildir."}, {"q": "Bir yatırımcının aynı aracı kurumda iki ayrı hesabı vardır ve toplam zararı 160.000 TL'dir. Azami tutar artırılmamışsa (100.000 TL) YTM'nin bu yatırımcıya ödeyeceği azami tutar nedir?", "o": ["100.000 TL", "160.000 TL", "200.000 TL", "80.000 TL", "50.000 TL"], "a": 0, "e": "Azami tutar hesap sayısına bakılmaksızın aynı kuruluştaki tüm talepleri kapsar; bu varsayımla en fazla 100.000 TL ödenir."}, {"q": "Tazmin kararı verilen yatırım kuruluşunda %5 paya sahip ortağın kardeşinin zararı için hangisi doğrudur?", "o": ["Tam olarak tazmin edilir", "Yarısı tazmin edilir", "Tazmin edilmez", "Kurul izniyle tazmin edilir", "Ancak 1 yıl sonra tazmin edilir"], "a": 2, "e": "%5 veya daha fazla paya sahip ortakların eşi ve ikinci dereceye kadar kan ve kayın hısımları tazmin edilmez; kardeş ikinci derece kan hısımıdır."}, {"q": "Yatırımcıların tazmin talebinde bulunma hakkı ne zaman zamanaşımına uğrar?", "o": ["Tazmin kararından itibaren 3 ay sonra", "Zararın öğrenilmesinden itibaren 2 yıl sonra", "Tazmin kararının ilanından itibaren 10 yıl sonra", "Zamanaşımına uğramaz", "Tazmin kararının ilanından itibaren 1 yıl sonra"], "a": 4, "e": "Talepler YTM'ye yazılı yapılır; hak, ilandan itibaren bir yıl sonra zamanaşımına uğrar. YTM ödemeleri kural olarak 3 ay içinde yapar."}, {"q": "Tedrici tasfiyede aktiflerden yapılacak ödemelerin sırası hangisidir?", "o": ["Kamu alacakları, müşteri alacakları, YTM alacakları, diğer alacaklar", "Müşteri alacakları, kamu alacakları, YTM alacakları, diğer alacaklar", "YTM alacakları, müşteri alacakları, kamu alacakları, diğer alacaklar", "Müşteri alacakları, YTM alacakları, kamu alacakları, diğer alacaklar", "Kamu alacakları, YTM alacakları, müşteri alacakları, diğer alacaklar"], "a": 1, "e": "Önce müşteri alacakları, sonra kamu alacakları garameten, sonra YTM alacakları garameten, en son diğer alacaklar ödenir."}]}, {"id": 4, "kisa": "SPKn: Tedbir ve Yaptırım", "baslik": "SPKn IV: Denetim, Tedbirler, Sermaye Piyasası Suçları ve İdari Para Cezaları", "ozet": "Kurulun denetim yetkisi, kanuna aykırı ihraç, izahnameye aykırılık, malvarlığını azaltıcı işlemler, mali bozulma ve izinsiz faaliyette tedbirler; bilgi suistimali, piyasa dolandırıcılığı ve diğer suçlar; idari para cezaları.", "notlar": "<h3>Denetim<\/h3>\n<ul>\n<li>Kurul; SPKn hükümlerinin, diğer kanunların SP hükümlerinin ve her türlü SP faaliyet ve işleminin uygulanmasını denetler. Denetim, <b>önemlilik ve öncelik<\/b> ilkeleri ile risk değerlendirmesine dayalı programla yürütülür.<\/li>\n<li><b>Yetkiler (m.89/1):<\/b> vergi kayıtları dahil tüm defter, belge ve elektronik kayıtları ile bilgi sistemlerini incelemek, erişim istemek, örnek almak, işlem ve hesapları denetlemek, yazılı/sözlü bilgi almak, tutanak düzenlemek. İlgililer bu istekleri yerine getirmek ve tutanakları imzalamakla yükümlüdür.<\/li>\n<li>Bilgi istenenler SPKn veya özel kanunlardaki <b>gizlilik ve sır saklama<\/b> hükümlerini ileri sürerek bilgi vermekten kaçınamaz.<\/li>\n<li>İncelemeye konu kişiler ve bilgi istenen kamu kurumları dahil herkes, <b>incelemenin varlığını ve niteliğini sır olarak saklar<\/b> (m.90/2).<\/li>\n<\/ul>\n<h3>Tedbirler<\/h3>\n<p>Genel anlayış: önce hukuka aykırılığı basit usullerle eski hale getirmek ve hak kaybını telafi etmek; sonra tasfiye ve iflasa kadar giden aşamalı tedbirler.<\/p>\n<h4>Kanuna aykırı ihraç (m.91)<\/h4>\n<ul>\n<li>Kanun burada \"halka arz\" değil \"<b>ihraç<\/b>\" kavramını kullanır. Kanuna aykırı ihraç veya teşebbüs tespitinde Kurul, <b>her türlü harç ve teminattan muaf<\/b> olarak her türlü tedbiri alabilir; satılan kısmın karşılığı ve satılacak araçlar için ihtiyati tedbir ve ihtiyati haciz isteyebilir.<\/li>\n<li>Yenilik: toplanan paraların iadesi prosedürü. İhraç yapandan sonuçları ortadan kaldırması ve varlıkları hak sahiplerine iade etmesi istenir.<\/li>\n<\/ul>\n<table>\n<tr><th>Aşama<\/th><th>Süre ve işlem<\/th><\/tr>\n<tr><td>İhbar ve ilan<\/td><td>Muhatap, ihbar tarihinden itibaren en geç <b>30 gün<\/b> içinde para topladığı kişileri ve tutarları Kurulun belirlediği vasıtalarla ilan eder ve Kurula iletir.<\/td><\/tr>\n<tr><td>İtiraz<\/td><td>İlanı izleyen <b>3 ay<\/b> içinde kendisinden para toplananlar ortaklık merkezinin bulunduğu yer <b>asliye hukuk<\/b> mahkemesine itiraz edebilir; liste kesinleşince iade yapılır.<\/td><\/tr>\n<tr><td>Kurulun davası<\/td><td>Kurulun ihbarından itibaren <b>1 yıl<\/b> içinde sonuçlar tamamen ortadan kaldırılmazsa Kurul iade veya ortaklığın tasfiyesi için dava açabilir.<\/td><\/tr>\n<\/table>\n<h4>İzahnamedeki taahhüt ve açıklamalara aykırılık<\/h4>\n<ul>\n<li>Kurul aykırılığın belirlediği sürede giderilmesini isteyebilir; makul ekonomik/finansal gerekçe sunulamazsa harç ve teminattan muaf ihtiyati tedbir ve haciz isteyebilir.<\/li>\n<li>Fonun izahnameye aykırı kullanıldığı işlemlerin iptali ve varlıkların iadesi için Kurul, tespitten itibaren <b>3 ay<\/b> ve her halde izahname onayından itibaren <b>2 yıl<\/b> içinde dava açabilir.<\/li>\n<\/ul>\n<h4>Hukuka aykırı ve malvarlığını azaltıcı işlemler<\/h4>\n<ul>\n<li>Bu tedbirler yalnız örtülü kazanç hallerine özgü değildir; iki durum çoğu zaman örtüşse de aynı değildir.<\/li>\n<li>Kurul, TTK hükümleri saklı kalmak üzere aykırılıkların giderilmesini isteyebilir ve durumu ilgili mercilere iletebilir.<\/li>\n<li><b>Dava:<\/b> hukuka aykırılığın Kurulca tespitinden itibaren <b>3 ay<\/b> ve her halde işlemin vukuundan itibaren <b>3 yıl<\/b> içinde iptal davası; <b>5 yıl<\/b> içinde butlan veya yokluğun tespiti davası.<\/li>\n<li><b>Yönetimsel tedbirler<\/b> (mevcudiyet ilk derece mahkemesince tespit edilirse veya bu karar beklenmeksizin Kurulun talebiyle mahkeme karar verirse): sorumluların imza yetkisini kaldırmak; suç duyurusu yapılmışsa yargılama sonuçlanıncaya kadar görevden almak; ilk genel kurula kadar yerlerine yenilerini atamak.<\/li>\n<li><b>Örtülü kazançta ek olarak:<\/b> denetim sonuçlarının ortaklara duyurulmasını istemek ve Kurulca belirlenen tutarın süresinde iadesi için dava açmak.<\/li>\n<li><b>Kayıtlı sermayede:<\/b> yönetim kurulu kararlarına karşı normalde iptal davası öngörülmemiştir; kayıtlı sermaye sisteminde ise dava mümkündür ve Kurul da YK kararlarının iptali ve icrasının geri bırakılması için dava açabilir.<\/li>\n<\/ul>\n<h4>Sermaye piyasası kurumlarının hukuka aykırı faaliyetleri<\/h4>\n<ul>\n<li>Kurul: aykırılıkların belirlediği sürede giderilmesini; kanuna, amaç ve ilkelere uygunluğun sağlanmasını istemek; faaliyetleri sınırlandırmak veya geçici durdurmak; yetkileri tamamen veya kısmen iptal etmek; diğer tedbirleri almak.<\/li>\n<li><b>Yönetici ve çalışanlar:<\/b> lisanslarını geçici veya sürekli iptal etmek; suç duyurusu kararından itibaren yargılama sonuçlanıncaya kadar imza yetkilerini sınırlandırmak/kaldırmak; sorumluluğu mahkeme kararıyla tespit edilen YK üyelerini görevden alıp ilk GK'ya kadar yenilerini atamak.<\/li>\n<li>Kitle fonlama platformlarına bu hükümler <b>kıyasen<\/b> uygulanır.<\/li>\n<\/ul>\n<h4>Mali durumun bozulması<\/h4>\n<ul>\n<li>Sermaye yeterliliği sağlanamaz, nakit ödeme veya teslim yükümlülükleri yerine getirilemez ya da mali yapı ciddi zayıflarsa Kurul: <b>3 ayı geçmemek<\/b> üzere süre vererek mali yapının güçlendirilmesini istemek; süre vermeksizin faaliyeti geçici durdurmak; yetkileri kaldırmak; yatırımcıları tazmin kararı vermek; yöneticilere tedbir uygulamak; <b>tedrici tasfiye<\/b> kararı vermek; tasfiye sonrası veya doğrudan <b>iflas<\/b> istemek; diğer tedbirleri almakla yetkilidir.<\/li>\n<li>İflas veya tedrici tasfiye halinde, mali bozulmada sorumluluğu tespit edilmiş olmak kaydıyla Kurul şu kişilerin <b>şahsen iflasını<\/b> isteyebilir: doğrudan/dolaylı <b>%10'dan fazla<\/b> paya sahip ortaklar; görevde olan veya ayrılmış YK üyeleri ve imzaya yetkili yöneticiler; PYŞ yöneticileri; konut ve varlık finansmanı fonlarının fon kurulu üyeleri.<\/li>\n<\/ul>\n<h4>İzinsiz faaliyet ve kripto varlık<\/h4>\n<ul>\n<li>Kurul faaliyetin durdurulması için her türlü tedbiri alabilir; sonuçların iptali ve varlıkların iadesi için dava açabilir. İzinsiz faaliyette bulunanlar ile sorumlu ortak ve yöneticilere, zararın kesinleşmesi şartı aranmaksızın m.96/2 yaptırımları da uygulanabilir.<\/li>\n<li>İnternet yoluyla izinsiz faaliyette <b>içeriğin çıkarılması ve/veya erişimin engellenmesine<\/b> Kurul karar verir; karar uygulanmak üzere <b>Erişim Sağlayıcıları Birliği<\/b>'ne gönderilir. İzinsiz kitle fonlaması ve Türkiye'de yerleşiklere internetten yurt dışında <b>kaldıraçlı işlem<\/b> yaptırılması için de aynı yol işler.<\/li>\n<li>KVHS'lerin aykırılıklarında m.96, izinsiz KVHS faaliyetinde m.99, ilan ve reklamlarda m.100 tedbirleri uygulanır. Yurt dışı platformların Türkiye'de yerleşiklere yönelik faaliyeti izinsiz sayılır; Türkiye'de <b>iş yeri açılması<\/b>, <b>Türkçe internet sitesi<\/b> veya doğrudan/aracılı <b>tanıtım ve pazarlama<\/b> yapılmasından biri varsa faaliyet Türkiye'ye yönelik kabul edilir.<\/li>\n<\/ul>\n<h4>Piyasa bozucu eylem, bilgi suistimali ve dolandırıcılık incelemeleri<\/h4>\n<ul>\n<li>Makul şüphe bulunan kişiler ve ilgili araçlar için Kurul: borsalarda geçici/sürekli <b>işlem yasağı<\/b>; takas yöntemlerini değiştirme; kredili alım, açığa satış, ödünç işlemlerine sınır; teminat yükümlülüğü; farklı pazarda işlem görme; piyasa verilerinin dağıtımını sınırlama; <b>işlem/pozisyon limiti<\/b> dahil her türlü tedbiri alabilir. İnternette erişim engeli kararı da verebilir.<\/li>\n<li>Yatırım kuruluşları ve Kurulca belirlenen kurumlar, bu suçlara ilişkin şüpheyi <b>gecikmeksizin<\/b> Kurula bildirir. Bildirimde bulunanlar mahkeme, savcılık ve <b>MASAK<\/b> dışında işleme taraf olanlar dahil kimseye bilgi veremez.<\/li>\n<\/ul>\n<h3>Yaptırımların genel düzeni<\/h3>\n<ul>\n<li>Yaptırımlar iki türlüdür: Kurulun <b>tedbirleri<\/b> ve asıl yaptırımlar olan <b>suç duyurusu<\/b> ile <b>idari para cezası<\/b>.<\/li>\n<li>SPKn'deki suç tipleri: bilgi suistimali; piyasa dolandırıcılığı; usulsüz halka arz ve izinsiz faaliyet; izinsiz KVHS faaliyeti; güveni kötüye kullanma ve sahtecilik; KVHS'de zimmet; bilgi ve belge vermeme ve denetimin engellenmesi; yasal defter, kayıt ve finansal tablolarda usulsüzlük; sır saklama yükümlülüğünü ihlal.<\/li>\n<li>Soruşturma, Kurulun Cumhuriyet Başsavcılığına <b>yazılı başvurusuna<\/b> bağlıdır; bu başvuru <b>muhakeme şartıdır<\/b>. İddianamenin kabulüyle Kurul <b>katılan<\/b> sıfatını kazanır.<\/li>\n<\/ul>\n<h3>Suçlar ve cezalar<\/h3>\n<table>\n<tr><th>Suç<\/th><th>Ceza<\/th><\/tr>\n<tr><td>Bilgi suistimali (m.106)<\/td><td><b>3–5 yıl hapis veya<\/b> adli para cezası; adli para cezası menfaatin <b>2 katından<\/b> az olamaz<\/td><\/tr>\n<tr><td>İşleme dayalı piyasa dolandırıcılığı (m.107/1)<\/td><td>3–5 yıl hapis <b>ve<\/b> 5.000–10.000 gün adli para; adli para menfaatten az olamaz<\/td><\/tr>\n<tr><td>Bilgiye dayalı piyasa dolandırıcılığı (m.107/2)<\/td><td>3–5 yıl hapis ve 5.000 güne kadar adli para (menfaat sağlanmış olmalı)<\/td><\/tr>\n<tr><td>Usulsüz halka arz (m.109/1)<\/td><td>2–5 yıl hapis ve 5.000–10.000 gün<\/td><\/tr>\n<tr><td>İzinsiz SP faaliyeti (m.109/2)<\/td><td>2–5 yıl hapis ve 5.000–10.000 gün; usulsüz halka arz da işlenirse yalnız bu suçtan ceza verilir ve ceza <b>yarı oranında artırılır<\/b><\/td><\/tr>\n<tr><td>İzinsiz KVHS faaliyeti (m.109/A)<\/td><td>3–5 yıl hapis ve 5.000–10.000 gün<\/td><\/tr>\n<tr><td>Güveni kötüye kullanma, nitelikli hal (m.110/1)<\/td><td>TCK m.155/2; ceza <b>3 yıldan az olamaz<\/b><\/td><\/tr>\n<tr><td>Sahtecilik (m.110/2)<\/td><td>2–5 yıl hapis ve 5.000–10.000 gün; TCK belgede sahtecilik mahkumiyet sonuçları uygulanır<\/td><\/tr>\n<tr><td>KVHS'de zimmet (m.110/A)<\/td><td>8–14 yıl hapis ve 5.000 güne kadar; hileli zimmette 14–20 yıl ve 20.000 güne kadar (zararın 3 katından az olamaz); izni kaldırılan KVHS'nin kontrolündeki gerçek kişi ortaklar için 12–22 yıl ve 20.000 güne kadar (zararın 3 katından az olamaz)<\/td><\/tr>\n<tr><td>Bilgi ve belge vermeme (m.111/a)<\/td><td>1–3 yıl hapis<\/td><\/tr>\n<tr><td>Denetimin engellenmesi (m.111/b)<\/td><td>6 ay–2 yıl hapis<\/td><\/tr>\n<tr><td>Defterleri usulüne uygun tutmama / saklamama (m.112/1, kasten)<\/td><td>6 ay–2 yıl hapis ve 5.000 güne kadar<\/td><\/tr>\n<tr><td>Sır saklama yükümlülüğünü ihlal (m.113)<\/td><td>1–3 yıl hapis ve 5.000 güne kadar<\/td><\/tr>\n<\/table>\n<h4>Bilgi suistimali (m.106)<\/h4>\n<ul>\n<li>\"İçeriden öğrenenlerin ticareti\"nin yeni adı. Henüz kamuya duyurulmamış ve fiyatı, değeri veya yatırımcı kararlarını etkileyebilecek bilgiye dayanarak <b>emir veren, değiştiren veya iptal eden<\/b> ve böylece menfaat temin eden kişiler.<\/li>\n<li>Failler: ihraççının veya bağlı/hakim ortaklıklarının yöneticileri; bu ortaklıklarda pay sahibi olması nedeniyle bilgiye sahip olanlar; iş, meslek ve görevi nedeniyle bilgiye sahip olanlar; bilgiyi suç işleyerek elde edenler; bilginin niteliğini bilen veya bilmesi gerekenler.<\/li>\n<li>Ceza alternatiftir (hapis <b>veya<\/b> adli para) ve adli para doğrudan menfaate bağlanmıştır: \"ekonomik suça ekonomik ceza\".<\/li>\n<\/ul>\n<h4>Piyasa dolandırıcılığı (m.107)<\/h4>\n<ul>\n<li><b>İşleme dayalı:<\/b> fiyat, fiyat değişimi, arz ve talep hakkında yanlış/yanıltıcı izlenim uyandırmak amacıyla alım satım yapmak, emir vermek, iptal etmek, değiştirmek veya hesap hareketi gerçekleştirmek.<\/li>\n<li><b>Bilgiye dayalı:<\/b> fiyatı, değeri veya kararları etkilemek amacıyla yalan, yanlış, yanıltıcı bilgi vermek, söylenti çıkarmak, haber vermek, yorum yapmak, rapor hazırlamak veya bunları yaymak ve böylece menfaat sağlamak.<\/li>\n<li><b>Etkin pişmanlık:<\/b> menfaatin <b>2 katını<\/b> Hazineye ödeyen; <b>soruşturma başlamadan önce<\/b> öderse ceza verilmez; soruşturma başladıktan sonra öderse ceza <b>yarı<\/b> oranında; kovuşturmada hükümden önce öderse <b>üçte bir<\/b> oranında indirilir.<\/li>\n<\/ul>\n<h4>Bilgi suistimali ve piyasa dolandırıcılığı sayılmayan haller (m.108)<\/h4>\n<ul>\n<li>TCMB veya yetkili resmi kurumların para, kur, kamu borç yönetimi politikaları veya finansal istikrar amacıyla işlemleri.<\/li>\n<li>Kurul düzenlemelerine göre <b>geri alım programları<\/b>, çalışanlara pay edindirme programları, ihraççı veya bağlı ortaklık çalışanlarına pay tahsisi.<\/li>\n<li>Kurulun <b>fiyat istikrarını sağlayıcı işlemler<\/b> ve <b>piyasa yapıcılığı<\/b> düzenlemelerine uygun, fiyatı önceden belirlenmiş süre için desteklemeye yönelik işlemler.<\/li>\n<\/ul>\n<h4>Diğer suçlar<\/h4>\n<ul>\n<li><b>Usulsüz halka arz (m.109/1):<\/b> onaylı izahname yayımlamadan halka arz etmek veya onaylı ihraç belgesi olmadan SPA satmak. <b>İzinsiz faaliyet (m.109/2):<\/b> ör. m.39/1'e aykırı olarak izinsiz yatırım hizmeti.<\/li>\n<li><b>Güveni kötüye kullanmanın nitelikli hali (m.110/1):<\/b> (a) yatırım kuruluşuna, fon kuruluna veya teminat sorumlularına tevdi edilen SPA, nakit ve kıymetleri kendi veya başkası yararına satmak, kullanmak, rehnetmek, gizlemek, inkar etmek; (b) ilişkili kişilerle emsallerden bariz farklı fiyat uygulayarak veya örtülü işlemlerle halka açık ortaklığın kârını/malvarlığını azaltmak; (c) HAO ve KYK'nın ilişkili kişilerle emsale aykırı işlem veya işlem hacmi üretme yoluyla kârını azaltması. Bunlar <b>aktif<\/b> örtülü kazanç aktarımıdır; pasif olan <b>m.103/6<\/b> ile idari para cezasına tabidir.<\/li>\n<li><b>Örtülü kazançta etkin pişmanlık (m.110/3):<\/b> aktarılan tutarı ortaklığa iade etmenin yanında bunun <b>2 katını<\/b> Hazineye ödemek; soruşturmadan önce ceza yok, soruşturmada yarı, kovuşturmada hükümden önce üçte bir indirim.<\/li>\n<li><b>Sahtecilik (m.110/2):<\/b> yatırım kuruluşu, konut/varlık finansmanı fon kurulu ve teminat sorumluları bünyesindeki kayıtları bozan, yok eden, değiştiren veya erişilmez kılanlar.<\/li>\n<li><b>İzni kaldırılan KVHS'de zimmet:<\/b> kontrol sahibi gerçek kişi ortakların kaynakları kendi menfaatine kullanması zimmet sayılır; zarar müteselsilen ödettirilir. Soruşturma Kurulun yazılı bildirimi üzerine veya gecikmede sakınca varsa resen yapılır, Kurul katılan olur. <b>m.110/B:<\/b> zimmet sayılan işlemleri yapan yöneticiler ve kontrol sahibi ortakların, Kurulun talebiyle doğrudan <b>şahsen iflasına<\/b> karar verilebilir.<\/li>\n<li><b>m.112/2:<\/b> finansal tabloları gerçeğe aykırı düzenleyen, gerçeğe aykırı hesap açan, muhasebe hilesi yapan, yanlış bağımsız denetim veya değerleme raporu düzenleyen/düzenlettiren sorumlu YK üyeleri ve yöneticiler <b>TCK<\/b> hükümlerine göre cezalandırılır; özel belgede sahtecilikte belgenin <b>kullanılmış olması şartı aranmaz<\/b> ve yatırım kuruluşları TCK m.244'te banka veya kredi kurumu sayılır. Bu suçlar <b>kasten<\/b> işlenmelidir.<\/li>\n<\/ul>\n<h3>İdari para cezaları (m.103–104)<\/h3>\n<ul>\n<li><b>m.103/1:<\/b> Kurul düzenlemelerine, standartlarına, formlarına ve genel/özel kararlarına aykırılık: <b>20.000 TL'den 250.000 TL'ye<\/b> kadar. Menfaat temin edilmişse ceza menfaatin <b>2 katından<\/b> az olamaz.<\/li>\n<li><b>Tüzel kişilere:<\/b> aykırılığın ağırlığı ve mağdur sayısına göre, asgari tutarın altına inmemek üzere son bağımsız denetimden geçmiş yıllık tablolardaki <b>brüt satış hasılatının %1'i<\/b> ile <b>vergi öncesi kârın %20'sinden yüksek olanına<\/b> kadar.<\/li>\n<li>Aykırılığı yapan bir özel hukuk tüzel kişisinin organı, temsilcisi veya onun faaliyeti çerçevesinde görev üstlenen kişiyse <b>tüzel kişiye de<\/b> ceza verilir; aykırılık tüzel kişinin zararına sonuç doğurmuşsa tüzel kişiye ceza verilmez.<\/li>\n<li><b>Tekrar:<\/b> bir kabahat idari yaptırım kararı verilinceye kadar birden çok işlenirse tek ceza verilir ve <b>2 kat<\/b> artırılır; menfaat veya zarar varsa ceza bunun <b>3 katından<\/b> az olamaz.<\/li>\n<li><b>m.103/3:<\/b> süresinde (ve varsa ek sürede) pay alım teklifi yapılmazsa teklife konu payların <b>toplam bedeline kadar<\/b>.<\/li>\n<li><b>m.103/4:<\/b> HAO yönetim kurulu üyeleri ve yöneticilerinin, Kurulca belirlenen zaman diliminde ortaklığın SPA'sının alım satımından elde ettikleri kazancı Kurulca belirlenen sürede ortaklığa iade etmemesi; yükümlülüğü <b>30 gün<\/b> içinde yerine getirmeyenlere menfaatin <b>2 katı<\/b> tutarında ceza.<\/li>\n<li><b>m.103/6:<\/b> <b>pasif<\/b> örtülü kazanç aktarımı: ilgili tüzel kişiye 20.000–250.000 TL; menfaatin 2 katından az olamaz.<\/li>\n<li><b>m.103/7:<\/b> istenen bilgi, belge, kayıtları süresinde hiç/istenen şekilde vermemek veya eksik, gerçeğe aykırı vermek; görevlilerin işini engellemek veya zorlaştırmak.<\/li>\n<li><b>m.103/8:<\/b> Kurula gerçeğe aykırı bilgi vererek gereksiz yere m.88 denetimine yol açmak: <b>1.000–25.000 TL<\/b>.<\/li>\n<li><b>m.104 Piyasa bozucu eylemler:<\/b> makul ekonomik/finansal gerekçeyle açıklanamayan, piyasaların güven, açıklık ve istikrarını bozan ve <b>suç oluşturmayan<\/b> eylemler: menfaatin 2 katından az olmamak üzere <b>20.000–500.000 TL<\/b>.<\/li>\n<li><b>Menfaat hesabı:<\/b> komisyon, vergi, kredi faizi, danışmanlık ücreti gibi maliyetler <b>dikkate alınmaz<\/b>; menfaatin nakde çevrilip çevrilmediğine bakılmaz.<\/li>\n<\/ul>", "sorular": [{"q": "Kurulun denetim kapsamında bilgi istediği bir banka, bankacılık mevzuatındaki sır saklama hükümlerini gerekçe göstererek bilgi vermekten kaçınabilir mi?", "o": ["Evet, BDDK izni yoksa kaçınabilir", "Evet, müşteri onayı yoksa kaçınabilir", "Yalnızca mahkeme kararı varsa bilgi verir", "Yalnızca vergi kayıtlarını vermekten kaçınabilir", "Hayır, gizlilik ve sır saklama hükümleri ileri sürülemez"], "a": 4, "e": "Bilgi istenen kişiler SPKn veya özel kanunlardaki gizlilik ve sır saklama hükümlerini ileri sürerek bilgi vermekten imtina edemez."}, {"q": "Kanuna aykırı ihraç halinde para toplayan muhatap, Kurulun ihbarından itibaren en geç kaç gün içinde para topladığı kişileri ve tutarları ilan edip Kurula iletmelidir?", "o": ["15", "30", "60", "90", "10"], "a": 1, "e": "Muhatap ihbar tarihinden itibaren en geç otuz gün içinde ilan eder; ilanı izleyen 3 ay içinde itiraz edilebilir."}, {"q": "Kanuna aykırı ihraçta, kendisinden para toplanan kişiler ilan edilen listeye nereye itiraz eder?", "o": ["Sermaye Piyasası Kuruluna", "Asliye ticaret mahkemesine", "İdare mahkemesine", "Ortaklık merkezinin bulunduğu yer asliye hukuk mahkemesine", "Tüketici hakem heyetine"], "a": 3, "e": "İlanı izleyen üç ay içinde ortaklığın bulunduğu yer asliye hukuk mahkemesine itiraz edilebilir."}, {"q": "İhraçtan elde edilen fonun izahnameye aykırı kullanıldığı işlemlerin iptali için Kurul hangi süre içinde dava açabilir?", "o": ["Tespitten itibaren 3 ay ve her halde izahname onayından itibaren 2 yıl", "Tespitten itibaren 1 yıl ve her halde 5 yıl", "Tespitten itibaren 30 gün", "İşlem tarihinden itibaren 3 yıl", "Süre sınırı yoktur"], "a": 0, "e": "Kurul tespitten itibaren üç ay ve her halde izahnamenin onay tarihinden itibaren iki yıl içinde iptal davası açabilir."}, {"q": "İhraççıların malvarlığını azaltıcı hukuka aykırı işlemlerinde Kurulun butlan veya yokluğun tespiti davası için öngörülen azami süre nedir?", "o": ["İşlemin vukuundan itibaren 3 yıl", "Tespitten itibaren 3 ay", "İşlemin vukuundan itibaren 5 yıl", "İşlemin vukuundan itibaren 2 yıl", "İşlemin vukuundan itibaren 10 yıl"], "a": 2, "e": "İptal davası tespitten itibaren 3 ay ve her halde vukudan itibaren 3 yıl; butlan veya yokluk tespiti davası 5 yıl içinde açılır."}, {"q": "Mali durumu bozulan bir sermaye piyasası kurumuna Kurul, mali yapısını güçlendirmesi için en fazla ne kadar süre verebilir?", "o": ["6 ay", "1 ay", "1 yıl", "45 gün", "3 ay"], "a": 4, "e": "Kurul üç ayı geçmemek üzere uygun bir süre verebilir veya süre vermeksizin faaliyetleri geçici olarak durdurabilir."}, {"q": "Tedrici tasfiyeye giren bir sermaye piyasası kurumunda, mali bozulmada sorumluluğu tespit edilen aşağıdaki kişilerden hangisinin şahsen iflası istenemez?", "o": ["Görevden ayrılmış yönetim kurulu üyesi", "Kurumda %8 payı olan ortak", "İmzaya yetkili yönetici", "Kurumda %15 payı olan ortak", "Varlık finansmanı fonunun fon kurulu üyesi"], "a": 1, "e": "Ortaklar için eşik doğrudan veya dolaylı %10'dan fazla paydır; %8 payı olan ortak kapsam dışındadır."}, {"q": "İnternet üzerinden izinsiz sermaye piyasası faaliyeti tespit edildiğinde erişim engeli kararını kim verir?", "o": ["Sulh ceza hakimliği", "Bilgi Teknolojileri ve İletişim Kurumu", "Erişim Sağlayıcıları Birliği", "Sermaye Piyasası Kurulu", "Cumhuriyet savcılığı"], "a": 3, "e": "İçeriğin çıkarılmasına ve/veya erişimin engellenmesine Kurul karar verir; karar uygulanmak üzere Erişim Sağlayıcıları Birliğine gönderilir."}, {"q": "Yurt dışı bir kripto platformunun faaliyetinin Türkiye'de yerleşiklere yönelik kabul edilmesi için aşağıdakilerden hangisi tek başına yeterli değildir?", "o": ["Platformun yabancı para birimi ile işlem yapması", "Türkiye'de iş yeri açılması", "Türkçe internet sitesi oluşturulması", "Türkiye'de tanıtım ve pazarlama faaliyeti yapılması", "Türkiye'de yerleşik kişiler aracılığıyla pazarlama yapılması"], "a": 0, "e": "Kanunda sayılan haller iş yeri açılması, Türkçe site ve doğrudan veya aracılı tanıtım-pazarlamadır."}, {"q": "Bilgi suistimali şüphesini Kurula bildiren yatırım kuruluşu bu bildirime ilişkin bilgiyi aşağıdakilerden hangisine verebilir?", "o": ["İşleme taraf olan müşteriye", "Bağımsız denetim kuruluşuna", "Mali Suçları Araştırma Kurulu Başkanlığına", "Kendi ana ortaklığına", "Basına"], "a": 2, "e": "Bildirimde bulunanlar mahkeme, savcılık ve MASAK dışında işleme taraf olanlar dahil kimseye bilgi veremez."}, {"q": "SPKn'de tanımlanan suçlardan dolayı soruşturma yapılması hakkında hangisi doğrudur?", "o": ["Savcılık her durumda resen soruşturma başlatır", "Kurulun başvurusu yalnızca idari para cezaları için gerekir", "Kurul hiçbir aşamada katılan olamaz", "Başvuru yatırımcılar tarafından yapılır", "Kurulun Cumhuriyet Başsavcılığına yazılı başvurusu muhakeme şartıdır"], "a": 4, "e": "Soruşturma Kurulun yazılı başvurusuna bağlıdır; iddianamenin kabulüyle Kurul katılan sıfatını kazanır."}, {"q": "Bilgi suistimali suçunun cezası nedir?", "o": ["2 yıldan 5 yıla kadar hapis ve 5.000 günden 10.000 güne kadar adli para cezası", "3 yıldan 5 yıla kadar hapis veya adli para cezası; adli para cezası menfaatin iki katından az olamaz", "3 yıldan 5 yıla kadar hapis ve 5.000 güne kadar adli para cezası", "1 yıldan 3 yıla kadar hapis", "6 aydan 2 yıla kadar hapis"], "a": 1, "e": "m.106: üç yıldan beş yıla kadar hapis veya adli para cezası; ceza alternatif düzenlenmiştir."}, {"q": "İşleme dayalı piyasa dolandırıcılığının cezası hakkında hangisi doğrudur?", "o": ["3–5 yıl hapis veya adli para cezası", "2–5 yıl hapis ve 5.000 güne kadar adli para", "1–3 yıl hapis", "3–5 yıl hapis ve 5.000–10.000 gün adli para; adli para menfaatten az olamaz", "8–14 yıl hapis"], "a": 3, "e": "m.107/1: üç-beş yıl hapis ve beş bin-on bin gün adli para; adli para menfaatten az olamaz."}, {"q": "Piyasa dolandırıcılığı failinin elde ettiği menfaatin iki katını soruşturma başladıktan sonra Hazineye ödemesi halinde ne olur?", "o": ["Verilecek ceza yarı oranında indirilir", "Cezaya hükmolunmaz", "Ceza üçte bir oranında indirilir", "Ceza dörtte bir oranında indirilir", "Hiçbir indirim yapılmaz"], "a": 0, "e": "Soruşturmadan önce ödemede ceza yok; soruşturma başladıktan sonra yarı; kovuşturmada hükümden önce üçte bir indirim."}, {"q": "Aşağıdakilerden hangisi bilgi suistimali veya piyasa dolandırıcılığı sayılmaz?", "o": ["Henüz açıklanmamış bilgiye dayanarak emir iptal etmek", "Yanıltıcı izlenim yaratmak için emir değiştirmek", "Kurul düzenlemelerine uygun geri alım programı kapsamında yapılan alımlar", "Fiyatı etkilemek için söylenti yayıp menfaat sağlamak", "Görevi gereği öğrendiği içsel bilgiyle alım yapmak"], "a": 2, "e": "m.108: geri alım programları, pay edindirme, fiyat istikrarı ve piyasa yapıcılığı ile resmi kurumların politika işlemleri suç sayılmaz."}, {"q": "Hem izinsiz sermaye piyasası faaliyetinde bulunup hem de bu kapsamda usulsüz halka arz yapan kişiye nasıl ceza verilir?", "o": ["İki suçtan ayrı ayrı ceza verilir", "Yalnız usulsüz halka arzdan ceza verilir", "Yalnız idari para cezası verilir", "Cezalar toplanıp üçte bir indirilir", "Yalnız izinsiz faaliyet suçundan ceza verilir ve ceza yarı oranında artırılır"], "a": 4, "e": "m.109/2: bu halde sadece izinsiz faaliyet suçundan cezaya hükmedilir ve ceza yarı oranında artırılır."}, {"q": "SPKn m.110/1 kapsamında güveni kötüye kullanma suçunun nitelikli halinde verilecek ceza en az ne olabilir?", "o": ["1 yıl", "3 yıl", "2 yıl", "5 yıl", "6 ay"], "a": 1, "e": "TCK m.155/2'deki alt sınırdan farklı olarak ceza üç yıldan az olamaz."}, {"q": "Kripto varlık hizmet sağlayıcıda zimmet suçunun temel hali için öngörülen hapis cezası nedir?", "o": ["3–5 yıl", "14–20 yıl", "12–22 yıl", "8–14 yıl", "2–5 yıl"], "a": 3, "e": "m.110/A: sekiz yıldan on dört yıla kadar hapis ve beş bin güne kadar adli para; hileli halde 14–20 yıl."}, {"q": "Kurulca istenen bilgi ve belgeleri vermeyenlere ve denetimi engelleyenlere SPKn m.111'de öngörülen cezalar sırasıyla nedir?", "o": ["1–3 yıl hapis; 6 ay–2 yıl hapis", "6 ay–2 yıl hapis; 1–3 yıl hapis", "2–5 yıl hapis; 1–3 yıl hapis", "Yalnızca idari para cezası; 1–3 yıl hapis", "1–3 yıl hapis; 2–5 yıl hapis"], "a": 0, "e": "Bilgi ve belge vermeme 1–3 yıl, denetimin engellenmesi 6 ay–2 yıl hapis gerektirir."}, {"q": "Kurulun incelemesine ilişkin istenen bilgi veya belgeleri başkalarına açıklayan kişiye verilecek ceza hangisidir?", "o": ["6 ay–2 yıl hapis", "Yalnızca idari para cezası", "1–3 yıl hapis ve 5.000 güne kadar adli para", "3–5 yıl hapis", "2–5 yıl hapis ve 10.000 güne kadar adli para"], "a": 2, "e": "m.113: sır saklama yükümlülüğünü ihlal bir yıldan üç yıla kadar hapis ve beş bin güne kadar adli para cezası gerektirir."}, {"q": "SPKn m.103/1'e göre Kurul düzenlemelerine aykırılık nedeniyle bir gerçek kişiye verilecek idari para cezasının Kanundaki tutar aralığı nedir?", "o": ["1.000 TL – 25.000 TL", "20.000 TL – 500.000 TL", "10.000 TL – 100.000 TL", "50.000 TL – 1.000.000 TL", "20.000 TL – 250.000 TL"], "a": 4, "e": "m.103/1: yirmi bin TL'den iki yüz elli bin TL'ye kadar; menfaat varsa menfaatin iki katından az olamaz."}, {"q": "Bir şirketin son bağımsız denetimden geçmiş tablolarında brüt satış hasılatı 500 milyon TL, vergi öncesi kârı 40 milyon TL'dir. m.103/1'e göre bu tüzel kişiye verilebilecek idari para cezasının üst sınırı nedir?", "o": ["5 milyon TL", "8 milyon TL", "40 milyon TL", "250.000 TL", "13 milyon TL"], "a": 1, "e": "Hasılatın %1'i 5 milyon TL, vergi öncesi kârın %20'si 8 milyon TL'dir; yüksek olan 8 milyon TL üst sınırdır."}, {"q": "Bir kabahat, idari yaptırım kararı verilinceye kadar birden çok kez işlenmiş ve menfaat elde edilmemişse nasıl ceza verilir?", "o": ["Her fiil için ayrı ceza verilir", "Tek ceza verilir ve yarı oranında artırılır", "Tek ceza verilir, artırım yapılmaz", "Tek idari para cezası verilir ve iki kat artırılır", "Ceza üç katına çıkarılır"], "a": 3, "e": "Tek ceza verilir ve iki kat artırılır; menfaat veya zarar varsa ceza bunun üç katından az olamaz."}, {"q": "Halka açık ortaklık yöneticilerinin ortaklık paylarındaki kısa vadeli işlemlerden elde ettikleri kazancı ortaklığa iade yükümlülüğünü kaç gün içinde yerine getirmemeleri halinde menfaatin iki katı idari para cezası verilir?", "o": ["30", "15", "60", "90", "10"], "a": 0, "e": "Bu yükümlülüğü otuz gün içinde yerine getirmeyenlere elde ettikleri menfaatin iki katı tutarında ceza verilir."}, {"q": "Piyasa bozucu eylemler için SPKn m.104'te öngörülen yaptırım nedir?", "o": ["3–5 yıl hapis", "20.000–250.000 TL idari para cezası", "Menfaatin iki katından az olmamak üzere 20.000 TL'den 500.000 TL'ye kadar idari para cezası", "1.000–25.000 TL idari para cezası", "Menfaatin üç katı adli para cezası"], "a": 2, "e": "Suç oluşturmayan piyasa bozucu eylemlerde 20.000–500.000 TL arası, menfaatin iki katından az olmayan idari para cezası verilir."}]}, {"id": 5, "kisa": "Özel Durumlar (II-15.1)", "baslik": "Özel Durumlar Tebliği (II-15.1)", "ozet": "İçsel ve sürekli bilgi, kapsam, içsel bilgilerin açıklanması ve ertelenmesi, erişim listesi, haber ve söylentiler, idari sorumlu ve ana ortak işlemleri, sermaye yapısı eşikleri, oy hakkı hesabı, bilgilendirme politikası ve açıklamaların şekli ve süreleri.", "notlar": "<h3>Amaç ve temel kavramlar<\/h3>\n<ul>\n<li><b>Amaç:<\/b> yatırımcıların zamanında, tam ve doğru bilgilendirilmesiyle piyasanın güvenilir, şeffaf, etkin, istikrarlı, adil ve rekabetçi işlemesi için SPA'nın değerini, fiyatını veya yatırım kararlarını etkileyebilecek bilgi, olay ve gelişmelerin açıklanma esaslarını düzenlemek.<\/li>\n<li><b>Özel durum:<\/b> SPA'nın değerini, fiyatını veya yatırım kararlarını etkileyebilecek <b>içsel<\/b> veya <b>sürekli<\/b> bilgiler.<\/li>\n<li><b>İçsel bilgi:<\/b> bu nitelikte ve <b>henüz kamuya açıklanmamış<\/b> bilgi, olay ve gelişmeler. <b>Sürekli bilgi:<\/b> içsel bilgi tanımı dışında kalan tüm bilgi, olay ve gelişmeler.<\/li>\n<li>Açıklama, bilgiye hızlı erişimi sağlayacak ve <b>eşit işlem<\/b> ilkesine aykırı olmayacak biçimde yapılır; yanlış, yanıltıcı, temelsiz, abartılı veya eksik olamaz. Özel durumu bilenler, kamuya duyuruluncaya kadar gizliliği korumakla yükümlüdür.<\/li>\n<li>Kurul açıklamalara yol göstermek için bir <b>rehber<\/b> hazırlamıştır ve gerekirse ihraççı veya ilgili taraflardan açıklama isteyebilir.<\/li>\n<\/ul>\n<h3>Tebliğin getirdiği başlıca yenilikler<\/h3>\n<ul>\n<li>İçsel bilgiyi ihraççının bilgisi dışında öğrenen, toplam oy hakları veya sermayede <b>%10 veya daha fazla<\/b> paya ya da bu orana bakılmaksızın YK üyesi seçme/aday gösterme imtiyazlı payların <b>%10 veya fazlasına<\/b> sahip kişilerin açıklama yapması.<\/li>\n<li>Ana ortaklık ve bağlı ortaklıkların faaliyetlerinde önemli değişiklik olursa ihraççının açıklama yapması.<\/li>\n<li>Eskiden yalnız ihraççıya tanınan <b>erteleme hakkının<\/b> bu kişilere de tanınması.<\/li>\n<li>Önemli haber ve söylentiler hakkında, <b>şirket kaynaklı olup olmadığına bakılmaksızın<\/b> ihraççının açıklama yapması.<\/li>\n<li><b>Geleceğe yönelik değerlendirmeler<\/b> ilk kez düzenlendi; açıklanması <b>zorunlu değildir<\/b>.<\/li>\n<li>İdari sorumluluğu bulunan kişiler, yakın ilişkilileri ve ana ortağın işlemlerinin açıklanması; KAP'taki <b>%5<\/b> ortaklık tablosunun MKK'ca güncellenmesi; pay dışındaki SPA'yı halka arz edenlerin yükümlülükleri; içsel bilgi erişim listesinin <b>MKK<\/b>'da saklanması; önceki açıklamaların sürekli güncellenmesi.<\/li>\n<\/ul>\n<table>\n<tr><th>Geleceğe yönelik değerlendirme açıklanacaksa<\/th><\/tr>\n<tr><td>Yönetim kurulu kararı veya yetki verilmişse yetkili kişinin <b>yazılı onayı<\/b><\/td><\/tr>\n<tr><td>Yılda en fazla <b>dört<\/b> defa açıklama<\/td><\/tr>\n<tr><td>Önceki açıklamalar ile gerçekleşmeler arasında önemli farklılık varsa <b>nedenlerinin<\/b> açıklanması<\/td><\/tr>\n<\/table>\n<h3>Kapsam<\/h3>\n<ul>\n<li><b>Tabi olanlar:<\/b> işlem sırası geçici kapatılmış olanlar ve halka açık statüsü nedeniyle payları borsanın belirlediği platformda işlem görenler dahil ihraççılar ve ilgili taraflar; pay dışındaki SPA'yı yurt içinde halka arz eden ve payları borsada işlem görmeyen ihraççılar (ilgili aracın <b>itfa tarihine kadar<\/b>); yurt içinde halka arz edilmeksizin SPA ihraç eden payları borsada işlem görmeyen ihraççılar, payları <b>Nitelikli Yatırımcı İşlem Pazarı<\/b>'nda işlem görenler ve yurt içi kira sertifikası ihraçlarında fon kullanıcıları (ikinci ve üçüncü bölümler hariç).<\/li>\n<li><b>Tabi olmayanlar:<\/b> yurt dışında SPA ihraç eden <b>halka açık olmayan<\/b> ortaklıklar.<\/li>\n<\/ul>\n<h3>İçsel bilgilerin açıklanması<\/h3>\n<ul>\n<li>İçsel bilgiler ve bunlara ilişkin önceki açıklamalardaki değişiklikler ortaya çıktığında veya öğrenildiğinde <b>ihraççı<\/b> açıklar.<\/li>\n<li>İçsel bilgiyi ihraççının bilgisi dışında öğrenen <b>%10'luk pay/imtiyaz sahipleri<\/b> açıklamayı kendileri yapar (ilgili kişiler).<\/li>\n<li>İçsel bilgi, ihraççı veya onun adına hareket eden kişi tarafından işin olağan ifası sırasında <b>üçüncü kişilere açıklanırsa<\/b> ihraççı kamuya açıklar. Ancak bilgiyi alan kişi kanun, esas sözleşme veya sözleşme gereği <b>gizlilik yükümlülüğü<\/b> altındaysa bu hüküm uygulanmaz.<\/li>\n<li>Ana ortaklık veya bağlı ortaklıkların faaliyetlerinde, finansal yapısında veya yönetim/sermaye ilişkilerinde ortaya çıkan değişiklik ihraççıda önemli değişiklik yaratıyorsa ihraççı açıklar.<\/li>\n<\/ul>\n<h3>Erteleme ve gizlilik<\/h3>\n<ul>\n<li>İhraççı, <b>sorumluluğu kendisine ait<\/b> olmak üzere, meşru çıkarlarının zarar görmemesi için açıklamayı erteleyebilir. Şartlar: yatırımcıları <b>yanıltmaması<\/b> ve <b>gizliliği sağlayabilmesi<\/b>.<\/li>\n<li>Erteleme sebepleri ortadan kalkar kalkmaz açıklama yapılır; açıklamada <b>erteleme kararı ve sebepleri<\/b> belirtilir. Kurul gerekirse sebeplerin yerinde olup olmadığını inceler. Ertelenen bilgiye konu olay <b>gerçekleşmezse açıklama yapılmayabilir<\/b>.<\/li>\n<li>Gizlilik için ihraççı: listede olmayanların erişimini önleyen etkin düzenlemeler yapar; erişimi olanların yükümlülükleri kabul etmesini ve yaptırımlardan haberdar olmasını sağlar; gizlilik sağlanamazsa bilgiyi açıklar.<\/li>\n<\/ul>\n<h3>İçsel bilgilere erişimi olanlar listesi<\/h3>\n<ul>\n<li>İhraççıya bağlı çalışan ve içsel bilgiye <b>düzenli erişimi<\/b> olanlar MKK'ya bildirilir; değişiklikte en geç <b>2 iş günü<\/b> içinde güncellenir. Liste ihraççı bazında <b>MKK<\/b>'da saklanır, talep üzerine Kurula ve ilgili borsaya gönderilir.<\/li>\n<li><b>İdari sorumluluğu bulunan kişiler<\/b> aynı zamanda erişimi olan kişi kabul edilir.<\/li>\n<li>Güncelleme halleri: bir kişinin listede olma sebebi değişirse; listeye yeni kişi eklenmesi gerekirse; listedeki kişinin erişimi kalkarsa.<\/li>\n<\/ul>\n<h3>Olağan dışı hareketler ve söylentiler<\/h3>\n<ul>\n<li><b>Olağan dışı fiyat ve miktar hareketleri:<\/b> olağan koşullarla açıklanamayan değişimlerde ihraççı <b>ilgili borsanın talebi üzerine<\/b> açıklama yapar; açıklanmamış özel durum olup olmadığını belirtir, varsa hepsine yer verir. Erteleme hükümleri saklıdır.<\/li>\n<li><b>Haber ve söylentiler:<\/b> önemli olup basın-yayında veya diğer yollarla ilk kez duyurulan ya da önceki açıklamalardan farklı içerikteki haber ve söylentiler hakkında ihraççı, bunların <b>doğru veya yeterli<\/b> olup olmadığını açıklar.<\/li>\n<li>Söylenti, ertelenen bir bilgiye ilişkinse erteleme sebeplerinin <b>ortadan kalktığı kabul edilir<\/b> ve açıklama yapılır.<\/li>\n<li>Dikkat: Kamuya açıklanmış bilgilere dayalı <b>yorum, analiz, değerlendirme ve tahminler<\/b> ile geleceğe yönelik değerlendirmeler bu yükümlülüğün <b>dışındadır<\/b>.<\/li>\n<\/ul>\n<h3>İdari sorumlu kişiler ve ana ortak işlemleri<\/h3>\n<ul>\n<li>İdari sorumluluğu bulunan kişiler, bunlarla yakından ilişkili kişiler ve ihraççının gerçek veya tüzel kişi <b>ana ortağı<\/b>nın paylar ve paylara dayalı SPA'daki tüm işlemleri <b>işlemi yapan tarafından<\/b> açıklanır.<\/li>\n<li>Bunların her biri hesabına yapılan işlemlerin toplamı bir <b>takvim yılı<\/b> içinde Kurulun belirlediği tutara (kitapta 2025 için <b>112.000.000 TL<\/b>) ulaşmadıkça açıklama yapılmaz. Toplam, her birinin tüm işlemleri toplanarak bulunur.<\/li>\n<li>Halka arz edilen paylar dışındaki SPA'daki işlemler için de aynı tutar eşiği uygulanır.<\/li>\n<li>Eşiği aşan işlemden itibaren başlanır ve <b>sonraki tüm işlemler<\/b> açıklanır.<\/li>\n<\/ul>\n<h3>Sürekli bilgiler: sermaye yapısı ve yönetim kontrolü<\/h3>\n<ul>\n<li>Bir kişi veya birlikte hareket edenler doğrudan/dolaylı olarak payları borsada işlem gören ihraççının sermayesinde veya oy haklarında <b>%5, %10, %15, %20, %25, %33, %50, %67 veya %95<\/b>'e ulaşır ya da altına düşerse bu kişiler açıklar.<\/li>\n<li>Bir kurucuya ait yatırım fonlarının toplam payı aynı eşiklere ulaşır veya altına düşerse açıklamayı <b>kurucu<\/b> yapar.<\/li>\n<li>Halka arz suretiyle borsada işlem gören <b>halka açık olmayan<\/b> ortaklıklarda yalnız <b>%25, %50 ve %67<\/b> esas alınır.<\/li>\n<li>Hesaplamada <b>donmuş oy hakları dahil<\/b> tüm oy hakları dikkate alınır; farklı pay grupları ayrı ayrı hesaplanır.<\/li>\n<li>Dikkat: Eşik, kişinin <b>doğrudan<\/b> sermaye payıyla aşılıyorsa açıklamayı <b>MKK<\/b> yapar. Birlikte hareket, dolaylı sahiplik veya oy hakkı yoluyla aşılıyorsa yükümlülük ilgili kişiye aittir.<\/li>\n<li>Paylar depo edilmişse açıklamayı <b>depo sertifikası sahipleri<\/b> yapar.<\/li>\n<\/ul>\n<h4>Oy haklarının hesaplanmasında dikkate alınanlar<\/h4>\n<ul>\n<li>Ortak yönetim politikası için yazılı sözleşme yapılan üçüncü kişilerin oy hakları.<\/li>\n<li>Oy haklarının geçici devri için yazılı sözleşme yapılan üçüncü kişilerin oy hakları.<\/li>\n<li>Teminat olarak verilmiş paylardan, oy hakkı teminat alana ait olan ve kullanma niyeti açıklananlar.<\/li>\n<li>Kişinin hayatta olması veya tüzel kişiliğin sürmesi şartına bağlı <b>intifa hakkından<\/b> doğan oy hakları.<\/li>\n<li>Kontrol edilen işletmenin elinde bulundurduğu veya kullanabileceği oy hakları.<\/li>\n<li>Tevdi edilen ve aksine talimat yoksa kendi iradesiyle kullanılabilecek oy hakları.<\/li>\n<li>Başkasına ait olup kişinin kendi adına ve hak sahibi hesabına kullanabildiği oy hakları; üçüncü kişilerin kişi hesabına kendi adına tuttuğu oy hakları.<\/li>\n<li>Aksine talimat yoksa <b>vekil<\/b> olarak kendi iradesiyle kullanılabilecek oy hakları.<\/li>\n<\/ul>\n<p><b>Kontrol edilen işletme:<\/b> oy haklarının çoğunluğunun elde bulunduğu; YK üyelerinin salt çoğunluğunu atama/azletme imtiyazı olan; diğer pay sahipleriyle sözleşme uyarınca oy çoğunluğunun tek başına kontrol edildiği; ya da üzerinde kontrol yetkisi bulunan veya fiilen kullanılan işletme.<\/p>\n<ul>\n<li><b>Paya dayalı SPA:<\/b> borsada işlem gören payı edinme hakkı veren araçlarla eşiklere ulaşılır, aşılır veya altına düşülürse işlemi yapan açıklar; hesaplamada elde tutulan oy hakları da dikkate alınır.<\/li>\n<li>Sermaye yapısı açıklaması: yükümlünün adı/unvanı; birlikte hareket edenler; dolaylı iştirak zinciri; ihraççının unvanı; işlem tarihi, nominal değer ve tutar; işlem öncesi ve sonrası oranlar.<\/li>\n<li>Paya dayalı SPA açıklaması: dayanak payın ihraççısı; edinme veya elden çıkarma tarihi; oy hakkı oranı; dolaylı sahiplik bilgisi; hakkın kullanım süresi; vade/itfa tarihi.<\/li>\n<li>Yükümlülük birden fazla kişideyse açıklama işlemi yapanlardan biri veya <b>ihraççı<\/b> tarafından yapılabilir; ama eksik/hatalı açıklamadan herkesin sorumluluğu devam eder.<\/li>\n<\/ul>\n<h3>Genel bilgiler ve bilgilendirme politikası<\/h3>\n<ul>\n<li>İhraççıya ilişkin genel bilgiler KAP'taki form ile yayımlanır; değişiklik olursa ihraççı en geç <b>2 iş günü<\/b> içinde günceller.<\/li>\n<li>Doğrudan <b>%5 veya fazla<\/b> paya/oy hakkına sahip kişileri gösteren tablo değişiklikte <b>MKK<\/b> tarafından <b>derhal<\/b> güncellenir.<\/li>\n<li>Farklı pay gruplarına bağlı haklardaki değişiklikler KAP'ta açıklanır, oy hakkı değişiklikleri MKK'ya bildirilir.<\/li>\n<li><b>Bilgilendirme politikası:<\/b> payları borsada işlem gören ihraççılar oluşturur ve kamuya duyurur. Asgari içerik: yatırımcı/basın toplantısı sunumlarına nasıl ulaşılacağı; basın ve internetteki haber ve söylentilerin takibi ve açıklama esasları; idari sorumluluğu bulunan kişilerin belirlenme esasları; özel durumların gizliliği için tedbirler; geleceğe yönelik değerlendirmelerin açıklanma esasları.<\/li>\n<\/ul>\n<h3>Genel kurul, sermaye artırımı ve borçlanma aracı ihraççıları<\/h3>\n<ul>\n<li>Payları borsada işlem görenler açıklar: GK tarih, saat, yer ve gündemine ilişkin YK kararı; GK'ya katılım ve toplam oy hakları bilgisi; kâr dağıtım kararı; GK tutanağı ve hazır bulunanlar listesi; GK yapılamazsa gerekçesi ve yeni tarih; yeni pay ihracı YK kararı, rüçhan hakkı kullanımı, iptal ve değiştirme işlemleri.<\/li>\n<li><b>Pay dışındaki SPA'yı halka arz edenler<\/b> ayrıca açıklar: ihraç tavanı için yetkili organ kararı; her tertip için ihracın gerçekleşmesi ve anapara, faiz veya kupon <b>temerrüdü<\/b>; yatırımcı haklarını etkileyen koşul değişiklikleri; dönüştürme/değiştirme haklarının kullanımı; <b>derecelendirme notları<\/b> ve değişiklikleri; garanti ve teminatlar; kâr dağıtımı; GK gündemi ve tutanağı; sermaye artırımı/azaltımı, birleşme, bölünme, tür değiştirme kararları; ilişkili taraflardan geri alımlar.<\/li>\n<li>KİT'ler (özelleştirme kapsamındakiler dahil) ve mahalli idareler için <b>derecelendirme notu<\/b> bendi uygulanmaz. Yabancı ihraççılar GK sonuçlarında kendi ülke kurallarına uyar.<\/li>\n<li><b>Fon kullanıcıları, nitelikli yatırımcıya veya tahsisli satılan ve payları borsada işlem görmeyen ihraççılar ile Nitelikli Yatırımcı İşlem Pazarı ortaklıkları:<\/b> genel bilgiler (tahsisli satış yapanlar ve fon kullanıcıları hariç) KAP'ta yayımlanır, değişiklik en geç 2 iş günü içinde güncellenir. Benzer açıklama listesine ek olarak finansal durumda yükümlülükleri olumsuz etkileyebilecek gelişmeler de açıklanır. NYİP ortaklıkları ayrıca II-15.2 m.5'teki bazı konuları açıklar. Sermaye yapısında eşikler: <b>%25, %50, %67<\/b>.<\/li>\n<\/ul>\n<h3>Açıklamaların şekli ve süreleri<\/h3>\n<ul>\n<li><b>Dil:<\/b> Türkçe. Kurul gerekli görürse işlem görülen pazar, kurumsal yönetim grubu veya başka bir kritere göre başka dillerde de açıklama isteyebilir.<\/li>\n<li><b>Yer:<\/b> SPA'sı borsada işlem görenler ve borsada işlem gören kira sertifikalarının fon kullanıcıları açıklamaları <b>KAP<\/b>'ta yapar. İşlem görmeyenler açıklamayı <b>Kurula gönderir<\/b>; Kurul internet sitesinde duyurulur ve Kurul basında ilan isteyebilir.<\/li>\n<li>Aksi belirtilmedikçe açıklamalar <b>derhal<\/b> yapılır. Açıklamada Tebliğe uygunluk, bilgilerin tam yansıtıldığı, kayıtlara uygunluk, gerekli çabanın gösterildiği ve sorumluluk <b>beyan<\/b> edilir.<\/li>\n<li><b>Sermaye yapısı açıklamaları:<\/b> Tebliğ ekindeki formla, en geç işlemi izleyen <b>üçüncü iş günü saat 09.00<\/b>'a kadar.<\/li>\n<li>İhraççı dışındaki kişilerin açıklamaları kimlik doğrulanarak <b>KAP işleticisine<\/b> derhal gönderilir.<\/li>\n<li>Açıklamadan önce ihraççı, işlemlerin geçici durdurulmasını <b>borsadan<\/b> talep edebilir.<\/li>\n<li>Önceki açıklamalardaki gelişmeler sürekli <b>güncellenir<\/b>.<\/li>\n<\/ul>\n<h3>Açıklamaların kapsam ve özellikleri<\/h3>\n<ul>\n<li>Açıklamalar yatırımcıya yardımcı olacak ölçüde <b>zamanında, doğru, tam, dolaysız, anlaşılabilir ve yeterli<\/b> olmalı; gerekiyorsa karşı taraf belirtilmeli; etki tutar olarak ifade edilebiliyorsa tutara yer verilmelidir.<\/li>\n<li>Henüz kesinleşmemiş özel durumlar <b>belirsizlik belirtilerek<\/b> açıklanır; çözüm için öngörülen tarih ve koşullar yazılır; o tarihte çözülüp çözülmediği açıklanır. Erteleme hükümleri saklıdır.<\/li>\n<li>Özel durum açıklamaları faaliyetlerin <b>pazarlanması ve reklamı<\/b> amacıyla kullanılamaz.<\/li>\n<li>Kamuyu aydınlatma prosedürlerini ihraççının <b>yönetim kurulu<\/b> belirler.<\/li>\n<li><b>İnternet sitesi:<\/b> SPA'sı borsada işlem görenler açıklamaları en geç açıklamayı izleyen <b>iş günü<\/b> içinde KAP'ta belirtilen sitelerinde ilan eder ve <b>5 yıl<\/b> tutar; KAP'a bağlantı vermek yeterlidir. İşlem görmeyenler varsa sitelerinde en geç <b>5 iş günü<\/b> içinde ilan eder ve 5 yıl tutar; birden çok site varsa tescilli sitede zorunlu, diğerlerinde ihtiyaridir.<\/li>\n<li>TTK m.1524 kapsamında sitede ilan edilmişse internet sitesinde ilan ve saklama yükümlülüğü yerine getirilmiş sayılır.<\/li>\n<li>Yurt dışı borsada da işlem gören ihraççı oraya Tebliğ kapsamı dışında bir açıklama yaparsa, aynı açıklamayı Tebliğe uygun olarak burada da yapmak zorundadır.<\/li>\n<\/ul>", "sorular": [{"q": "Özel Durumlar Tebliği'ne göre sürekli bilgi nedir?", "o": ["İçsel bilgi tanımı dışında kalan tüm bilgi, olay ve gelişmeler", "Henüz kamuya açıklanmamış ve fiyatı etkileyebilecek bilgiler", "Yalnızca finansal tablolar", "Yalnızca sermaye yapısı değişiklikleri", "Yalnızca geleceğe yönelik değerlendirmeler"], "a": 0, "e": "Henüz açıklanmamış ve fiyatı etkileyebilecek bilgi içsel bilgidir; bunun dışındaki tüm bilgi, olay ve gelişmeler sürekli bilgidir."}, {"q": "İçsel bilgiyi ihraççının bilgisi dışında öğrenen aşağıdaki kişilerden hangisi bu bilgiyi kendisi açıklamakla yükümlüdür?", "o": ["Sermayede %3 paya sahip ortak", "Şirketin müşterisi", "Sermayede %10 paya sahip ortak", "Şirketi takip eden analist", "Şirketin tedarikçisi"], "a": 2, "e": "Toplam oy hakları veya sermayede %10 ya da daha fazla paya veya YK seçme/aday gösterme imtiyazlı payların %10'una sahip kişiler açıklama yapar."}, {"q": "Geleceğe yönelik değerlendirmelerin kamuya açıklanmasına ilişkin hangisi yanlıştır?", "o": ["Yılda en fazla dört kez açıklanabilir", "Yönetim kurulu kararı veya yetkili kişinin yazılı onayı gerekir", "Gerçekleşmelerle önemli fark varsa nedenleri açıklanır", "İlk kez bu Tebliğ ile düzenlenmiştir", "Açıklanması zorunludur"], "a": 4, "e": "Geleceğe yönelik değerlendirmelerin açıklanması zorunlu değildir; açıklanırsa sayılan şartlara uyulur."}, {"q": "Aşağıdakilerden hangisi Özel Durumlar Tebliği yükümlülüklerine tabi değildir?", "o": ["Payları Nitelikli Yatırımcı İşlem Pazarında işlem gören ortaklık", "Yurt dışında SPA ihraç eden halka açık olmayan ortaklık", "Yurt içinde borçlanma aracını halka arz eden, payları borsada işlem görmeyen ihraççı", "İşlem sırası geçici kapatılmış ihraççı", "Yurt içinde kira sertifikası ihracında fon kullanıcısı"], "a": 1, "e": "Tebliğ yükümlülüklerine tabi olmayanlar yurt dışında SPA ihraç eden halka açık olmayan ortaklıklardır."}, {"q": "İçsel bilginin, ihraççı adına hareket eden kişi tarafından işin olağan ifası sırasında gizlilik yükümlülüğü bulunan avukata açıklanması halinde ne olur?", "o": ["İhraççı derhal kamuya açıklama yapar", "Avukat kamuya açıklama yapar", "Kurul açıklama yapar", "Kamuya açıklama yükümlülüğü doğmaz", "Borsa işlemleri otomatik durdurur"], "a": 3, "e": "Üçüncü kişiye açıklanan içsel bilgi kamuya açıklanır; ancak alıcı yasal veya sözleşmesel gizlilik yükümlülüğü altındaysa bu hüküm uygulanmaz."}, {"q": "İçsel bilgilerin açıklanmasının ertelenmesi hakkında hangisi yanlıştır?", "o": ["Erteleme için önceden Kurul onayı alınır", "Erteleme sorumluluğu ihraççıya aittir", "Erteleme yatırımcıları yanıltmamalıdır", "Sebepler ortadan kalkınca açıklama yapılır ve erteleme kararı ile sebepleri belirtilir", "Konu olay gerçekleşmezse açıklama yapılmayabilir"], "a": 0, "e": "Erteleme için Kurul onayı gerekmez; Kurul gerekli görürse erteleme sebeplerinin yerinde olup olmadığını sonradan inceleyebilir."}, {"q": "İçsel bilgilere erişimi olan kişiler listesindeki değişiklikler en geç ne kadar sürede güncellenir?", "o": ["Derhal", "5 iş günü", "2 iş günü", "1 hafta", "Ertesi iş günü saat 09.00"], "a": 2, "e": "Düzenli erişimi olanlar MKK'ya bildirilir ve değişiklikte en geç iki iş günü içinde güncelleme yapılır."}, {"q": "İçsel bilgilere erişimi olan kişiler listesi kim tarafından saklanır?", "o": ["İhraççının yatırımcı ilişkileri bölümü", "Kurul", "Borsa İstanbul", "Takasbank", "MKK"], "a": 4, "e": "Liste ihraççılar bazında MKK tarafından saklanır ve talep üzerine Kurula ve ilgili borsaya gönderilir."}, {"q": "Olağan dışı fiyat ve miktar hareketlerinde ihraççının açıklama yapması hangi koşula bağlıdır?", "o": ["Kurulun yazılı talimatına", "İlgili borsanın talebine", "Yönetim kurulunun kararına", "Hareketin üç gün sürmesine", "Fiyatın %10'dan fazla değişmesine"], "a": 1, "e": "İhraççılar, olağan koşullarla açıklanamayan fiyat ve hacim değişimlerinde ilgili borsanın talebi üzerine açıklama yapar."}, {"q": "Haber ve söylentilerin doğrulanması yükümlülüğü hakkında hangisi doğrudur?", "o": ["Yalnızca şirket kaynaklı söylentiler için açıklama yapılır", "Ertelenen bilgiye ilişkin söylenti varsa erteleme devam eder", "Söylentiler ancak Kurul talep ederse açıklanır", "Kamuya açıklanmış bilgilere dayanan analiz ve tahminler yükümlülük kapsamı dışındadır", "Geleceğe yönelik değerlendirmeler de doğrulanmalıdır"], "a": 3, "e": "Söylentiler şirket kaynaklı olup olmadığına bakılmaksızın açıklanır; ertelenen bilgiye ilişkinse erteleme sebepleri kalkmış sayılır. Yorum, analiz ve tahminler kapsam dışıdır."}, {"q": "Bir ihraççının yönetim kurulu üyesinin bir takvim yılı içindeki pay işlemlerinin toplamı Kurulca belirlenen tutarın altında kalırsa ne olur?", "o": ["Açıklama yapılmaz", "Her işlem ertesi gün açıklanır", "İhraççı açıklama yapar", "MKK açıklama yapar", "Yıl sonunda toplu açıklama zorunludur"], "a": 0, "e": "İşlemlerin toplamı takvim yılı içinde Kurulun belirlediği tutara ulaşmadıkça açıklama yapılmaz; eşiği aşan işlemden itibaren tüm işlemler açıklanır."}, {"q": "Payları borsada işlem gören halka açık bir ortaklıkta aşağıdaki oranlardan hangisi sermaye yapısı açıklama eşiklerinden biri değildir?", "o": ["%5", "%33", "%30", "%67", "%95"], "a": 2, "e": "Eşikler %5, %10, %15, %20, %25, %33, %50, %67 ve %95'tir; %30 bunlar arasında değildir."}, {"q": "Payları halka arz suretiyle borsada işlem gören ancak halka açık olmayan ortaklıklarda sermaye yapısı açıklamalarında hangi oranlar esas alınır?", "o": ["%5'ten %95'e kadar tüm eşikler", "Yalnız %50", "Yalnız %10 ve %50", "%5, %10 ve %25", "Yalnız %25, %50 ve %67"], "a": 4, "e": "Bu ortaklıklarda sayılan oranlardan yalnızca %25, %50 ve %67 esas alınır."}, {"q": "Bir gerçek kişi, payları borsada işlem gören bir ihraççının sermayesinde doğrudan sahip olduğu paylarla %5 eşiğini aşmıştır. Açıklamayı kim yapar?", "o": ["Gerçek kişi", "MKK", "İhraççı", "Aracı kurum", "Kurul"], "a": 1, "e": "Doğrudan sermaye payıyla eşik aşılırsa açıklamayı MKK yapar; birlikte hareket, dolaylı sahiplik veya oy hakkına bağlı aşımlarda yükümlülük ilgili kişidedir."}, {"q": "Sermaye yapısı eşiklerinin hesaplanmasında oy haklarına ilişkin hangisi doğrudur?", "o": ["Donmuş oy hakları hesaba katılmaz", "Farklı pay grupları toplu olarak tek hesapta değerlendirilir", "Vekaleten kullanılan oy hakları hiçbir durumda dikkate alınmaz", "Oy hakkının donduğu durumlar dahil paya bağlı tüm oy hakları dikkate alınır", "Teminat olarak verilen paylardan doğan oy hakları dikkate alınmaz"], "a": 3, "e": "Donmuş oy hakları dahil tüm oy hakları dikkate alınır; hesaplama farklı pay grupları için ayrı ayrı yapılır."}, {"q": "Sermaye yapısı değişikliklerine ilişkin açıklamalar en geç ne zamana kadar yapılmalıdır?", "o": ["İşlemi izleyen üçüncü iş günü saat 09.00'a kadar", "İşlemi izleyen ilk iş günü saat 09.00'a kadar", "Derhal", "İşlemi izleyen beşinci iş günü sonuna kadar", "İşlemi izleyen ikinci iş günü sonuna kadar"], "a": 0, "e": "Bu açıklamalar Tebliğ ekindeki form kullanılarak en geç işlemi izleyen üçüncü iş günü saat 09.00'a kadar yapılır."}, {"q": "KAP'ta yayımlanan ihraççıya ilişkin genel bilgilerde değişiklik o
