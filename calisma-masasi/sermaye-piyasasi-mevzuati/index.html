re portföy işletmek için kurulur. Kurucusu ve yöneticisi yalnızca portföy yönetim şirketi olabilir, varlıklar ise portföy saklayıcısında durur. Fon malvarlığı kurucunun malvarlığından ayrıdır ve kamu alacakları için bile haczedilemez.", "Şemsiye fon kavramı çok önemli. Şemsiye fon, tek bir içtüzük altında ihraç edilen bütün fonları kapsar. Borsa yatırım fonu, gayrimenkul yatırım fonu ve girişim sermayesi fonu dışındaki tüm yatırım fonlarının şemsiye fon şeklinde kurulması zorunludur. Şemsiyenin altındaki her fon için ayrı izahname ve yatırımcı bilgi formu hazırlanır.", "Şemsiye fon türlerini sayalım: borçlanma araçları, hisse senedi, kıymetli madenler, fon sepeti, para piyasası, katılım, değişken, serbest, garantili ve koruma amaçlı. Garantili ile koruma amaçlı farkı şu: garantili fonda bir garantör vardır, koruma amaçlı fonda ise koruma yalnızca en iyi gayret esasıyla hedeflenir. Serbest fonlar ise yalnızca nitelikli yatırımcıya satılır.", "Para piyasası fonunu ayrıca ezberle: varlıkların vadesi en fazla yüz seksen dört gün, ağırlıklı ortalama vade en fazla kırk beş gün. Hisse senedi yoğun fon ise portföyünün en az yüzde sekseni borsada işlem gören paylardan oluşan fondur, ama menkul kıymet yatırım ortaklığı payları bu orana dahil değildir.", "Unvan kurallarında birkaç püf noktası var. Yabancı araçlara en az yüzde seksen yatıran fonlarda Yabancı ibaresi zorunlu. Döviz cinsi araçlarda Döviz ibaresi, döviz ve altın taşımayan fonlarda lira ibaresi kullanılır. Gelecek, performans, getiri, küresel, global gibi subjektif ifadeler yasak. Belirli kişilere tahsisli fonlarda özel ibaresi unvanın en sonunda yer alır.", "Kuruluş sürecinde süreler şöyle: kuruluş başvurusu iki ay içinde karara bağlanır, içtüzük altı iş günü içinde tescil edilir. İlk fon için başvuru tescilden itibaren üç ay içinde yapılmalı. İzahname yirmi iş günü içinde incelenir ve onaydan sonra on iş günü içinde Kamuyu Aydınlatma Platformunda yayımlanır. İzahname onayı Kurulun bilgileri garanti ettiği anlamına gelmez.", "Yatırımcı bilgi formu en fazla iki sayfa ve on iki punto olmalı. İçinde fonun tanıtımı, yatırım politikası, geçmiş performans, toplam gider oranı ve risk profili yer alır. Bu formun değişikliği için Kurul onayı gerekmez, sadece altı iş günü önceden Kurula bildirilir.", "Fiyatlamaya gelelim. Katılma paylarının itibari değeri yoktur, birim pay değeri fon toplam değerinin pay sayısına bölünmesiyle bulunur. Kural ileri fiyatlamadır: emir, verildikten sonraki ilk hesaplanan fiyattan gerçekleşir. Ancak para piyasası ve kısa vadeli borçlanma araçları fonlarında en son ilan edilen fiyat kullanılır.", "Şimdi portföy sınırları. Temel üçlü yüzde on, yüzde kırk, yüzde yirmi: tek ihraççıya en fazla yüzde on, yüzde beşi aşanların toplamı en fazla yüzde kırk, aynı gruba en fazla yüzde yirmi. Devlet kaynaklı ihraçlarda ve Türkiye Varlık Fonu'nda bu sınırlar yok ama tek varlık yüzde otuz beşi aşamaz. Varlık kiralama şirketlerinde yüzde on yüzde yirmi beşe, grup sınırı yüzde otuz beşe çıkar.", "Diğer sınırlar: mevduat toplamda yüzde on, tek bankada yüzde üç; katılım fonlarında bu oranlar yüzde yirmi beş ve yüzde on. Fon payları toplamda yüzde yirmi, tek fonda yüzde on; yerli borsa yatırım fonları toplam sınıra girmez ama tek borsa yatırım fonu yüzde yirmiyi aşamaz. Repo, kredi ve borsa dışı ters repo için sınır yüzde on, Takasbank para piyasası için yüzde yirmi.", "İki yasağı aklında tut: fon açığa satış ve kredili işlem yapamaz, ödünç alma ise yalnızca serbest fonlara serbesttir. Sınırlar fiyat hareketi gibi pasif nedenlerle aşılırsa otuz gün içinde uyum sağlanır. Endeks fonlarında fon ile endeks arasındaki korelasyon en az yüzde doksan olmalıdır.", "Özel fon türlerine geçelim. Serbest fonlar genel sınırlara tabi değil, pay fiyatı en az ayda bir hesaplanır ve değişiklik duyuruları otuz gün önce yapılır. Fon sepeti fonlarında tek fon yüzde yirmiyi aşamaz, başka fon sepeti fonuna yatırım yapılamaz ve yatırım yapılan fonun paylarının en fazla yüzde yirmi beşi alınabilir.", "Garantili ve koruma amaçlı fonların vadesi en az altı aydır ve fiyatları ayda en az iki kez hesaplanır. Garanti fona aittir, koşula bağlanamaz ve garantörün cayma hakkı yoktur. Garantör derecelendirme notuna sahip bir banka ya da yurt dışında yerleşik banka veya sigorta şirketi olabilir.", "Gider oranlarını yıllık rakamlarla hatırla: para piyasası yüzde bir virgül altmış beş, koruma, garantili, kıymetli maden ve endeks fonları yüzde iki virgül on dokuz, kısa vadeli borçlanma araçları yüzde iki virgül elli altı, diğer fonlar yüzde üç virgül altmış beş, fon sepeti yüzde dört virgül otuz sekiz. Aşım olursa fazla tutar beş iş günü içinde fona iade edilir.", "Türkiye Elektronik Fon Dağıtım Platformu, yani TEFAS, iki bin on beş yılının dokuz Ocak tarihinde işlemlere başladı. Özel fonlar, gayrimenkul ve girişim sermayesi fonları ile garantili ve koruma amaçlı fonlar platformda işlem görmez. Dağıtım kuruluşuna verilen genel komisyon yönetim ücretinin yüzde otuz beşi, özel anlaşmalarda en fazla yüzde altmış beşidir.", "Özetleyelim: bir, borsa yatırım fonu, gayrimenkul yatırım fonu ve girişim sermayesi yatırım fonu dışındaki fonlar şemsiye fon olmak zorunda. İki, para piyasası fonunda yüz seksen dört gün ve kırk beş gün. Üç, portföyde yüzde on, kırk ve yirmi üçlüsü. Dört, ödünç alma yalnızca serbest fonda. Beş, gider oranlarında en düşük para piyasası, en yüksek fon sepeti. Hazırsan sorulara geçelim."], "11": ["Merhaba, borsa yatırım fonları bölümündeyiz. Borsa yatırım fonu, hukuken bir yatırım fonu ama payları borsada işlem gördüğü için menkul kıymet yatırım ortaklığına da benziyor. Yani iki dünyanın karışımı. Bu bölümde farkları ve borsa yatırım fonuna özgü kavramları öğreneceğiz.", "Tanımla başlayalım. Borsa yatırım fonu, payları Borsa İstanbul'da işlem gören, portföyün kompozisyonunu yansıtan varlıklar ya da sadece nakit teslim edilerek pay oluşturulabilen ve iade karşılığında bu varlıkların veya nakdin alınabildiği, tüzel kişiliği olmayan bir malvarlığıdır. Kurucusu yalnızca portföy yönetim şirketi olabilir ve mutlaka Kurulca uygun görülen bir endeksi takip eder.", "Karşılaştırmayı iyi öğren. Tüzel kişilik yalnızca menkul kıymet yatırım ortaklığında var; yatırım fonunda ve borsa yatırım fonunda yok. Yönetim tarzında yatırım fonu ve menkul kıymet yatırım ortaklığı aktif, borsa yatırım fonu pasif. Yatırım fonunun ikincil piyasası yok, borsa yatırım fonu ve menkul kıymet yatırım ortaklığı borsada işlem görür. İskonto ve prim meselesinde menkul kıymet yatırım ortaklığı arz talebe göre iskontolu ya da primli işlem görebilir, borsa yatırım fonunda ise birincil piyasa sayesinde fiyat birim pay değerine çok yakın kalır.", "Peki birincil piyasa nedir? Yetkilendirilmiş katılımcı ile portföy saklayıcısı arasında yeni pay oluşturma ve geri alım işlemleridir. Yetkilendirilmiş katılımcı, kurucuyla sözleşme yapmış, işlem veya portföy aracılığı izni olan bir aracı kurumdur. Bu işlemler asgari işlem birimi denilen büyük paketlerle yapılır, örneğin elli bin pay. Bu yüzden birincil piyasada genellikle nitelikli yatırımcılar yer alır.", "Arbitraj mantığını kafanda canlandır. Birim pay değeri borsa fiyatından yüksekse, ucuz olan borsa yatırım fonu payını iade edip karşılığındaki hisseleri alır ve satarsın. Borsa fiyatı birim pay değerinden yüksekse, hisseleri teslim edip yeni pay oluşturur ve pahalı olan borsa yatırım fonu payını borsada satarsın. Bu mekanizma fiyatı birim pay değerine yaklaştırır ve menkul kıymet yatırım ortaklıklarındaki iskonto sorununu ortadan kaldırır.", "Her borsa yatırım fonu payının iki değeri vardır: kurucunun hesapladığı birim pay değeri ve borsada oluşan işlem fiyatı. Birim pay değeri çok sık, genellikle bir dakikanın altında aralıklarla hesaplanıp yayınlanır. Payların itibari değeri yoktur ve borsa yatırım fonu temettü dağıtabilir.", "Borsa yatırım fonunun başarısı takip farkı ve takip hatası ile ölçülür. Takip farkı, fonun yıllık getirisi eksi endeksin yıllık getirisidir. Mesela fon yüzde on sekiz, endeks yüzde yirmi kazandıysa takip farkı eksi iki puandır. Takip hatası ise bu farkın değişkenliğidir. Eskiden aranan yüzde doksan korelasyon şartı borsa yatırım fonları için kaldırıldı, yerine bu iki ölçüt geldi.", "Açıklama takvimi de sorulabilir. Her ay sonu itibarıyla son bir yıllık takip farkı ve hatası izleyen ayın ilk iş günü açıklanır. Yılın son iş günü gelecek yılın tahmini takip hatası açıklanır. Ocak ayının son iş gününe kadar da geçen yılın tahmini ve gerçekleşen değerleri karşılaştırılır.", "Endeks takibinin üç yolu var. Birincisi fonun en az yüzde sekseniyle doğrudan endeks varlıklarına yatırım; bu tam kopyalama ya da örnekleme yoluyla olur. İkincisi en az yüzde sekseniyle aynı endeksi izleyen yabancı borsa yatırım fonlarına yatırım; burada en az dört yabancı borsa yatırım fonu ve her biri en fazla yüzde otuz şartı var. Üçüncüsü endeks dışı varlıklarla ve swap kullanarak dolaylı takip; swap karşı taraf riski en fazla yüzde on.", "Endeks yapısına ilişkin sınırlar şöyle: pay endekslerinde en az altı pay ve her biri en fazla yüzde otuz. Kamu borçlanma araçları endekslerinde her biri en fazla yüzde otuz beş. Özel sektör borçlanma araçlarında en az altı araç ve her biri yüzde otuz beş. Gayrimenkul ve kira sertifikası endekslerinde en az dört araç ve yine yüzde otuz beş.", "Bir yapısal kural daha: yatırım fonları şemsiye fon olmak zorundayken borsa yatırım fonları şemsiye fon şeklinde kurulamaz. Ayrıca yatırım fonlarından farklı olarak yabancı paralar ve swap sözleşmeleri borsa yatırım fonu portföyüne alınabilir.", "Kuruluş sürecinde kuruluş izni ve izahname onayı kural olarak birlikte değerlendirilir; ama kurucunun ilk borsa yatırım fonu ise ayrı ayrı. Başvurular iki ay içinde sonuçlanır, içtüzük altı iş günü içinde tescil edilir. Ayrı değerlendirmede izahname başvurusu tescilden itibaren üç ay içinde yapılır.", "Portföy kurucunun avans koymasıyla ya da halka arzla oluşturulur. Tebliğ metninde asgari avans veya halka arz tutarı altı milyon lira, faaliyet süresince son üç ayın ortalama fon değeri en az üç milyon lira olarak geçiyor; kitabın giriş özetinde ise güncel tutarlar elli milyon ve yirmi beş milyon lira olarak veriliyor. Önemli olan, Kurulun bu tutarları her yıl yeniden belirleyip Kurul Bülteni ile ilan etmesi. Asgari değerin altına düşülürse Kurul bir defaya mahsus bir ay ek süre verir, sonra tasfiye ya da dönüşüm gelir.", "Halka arz izahnamenin ilanından itibaren en geç beş iş günü içinde başlar ve süresi iki ile otuz iş günü arasındadır. İlk halka arzda aracılık yüklenimi zorunludur. Halka arzdan sonra on iş günü içinde borsaya başvurulur ve paylar Yapılandırılmış Ürünler ve Fon Pazarı'nda işlem görür.", "Portföy sınırları tanıdık: varant ve sertifikalar yüzde on, tek ihraççı yüzde beş; mevduat yüzde on ve tek banka yüzde üç; ters repo ve Takasbank toplamda yüzde yirmi; kredi en fazla yüzde on. Gider sınırında endeks fonlarının sınırı uygulanır ve borsa yatırım fonlarının performans sunum raporu hazırlaması zorunlu değildir.", "Özetleyelim: bir, borsa yatırım fonu pasif yönetilir, tüzel kişiliği yoktur ve şemsiye fon olamaz. İki, birincil piyasa ve arbitraj fiyatı birim pay değerine yakın tutar. Üç, takip farkı getiri farkı, takip hatası farkın değişkenliğidir. Dört, yabancı borsa yatırım fonu ile takipte en az dört fon ve yüzde otuz, swapta yüzde on karşı taraf sınırı. Beş, halka arz iki ile otuz iş günü ve aracılık yüklenimi zorunlu. Haydi sorulara."], "12": ["Merhaba, gayrimenkul yatırım fonları bölümündeyiz. Gayrimenkul yatırım fonları ülkemizde ilk kez altı bin üç yüz altmış iki sayılı Kanunla hukuki altyapıya kavuştu ve Tebliğ iki bin on dört yılının başında yayımlandı. Amaç, gayrimenkulleri menkul kıymetleştirmek ve büyük gayrimenkullere likidite kazandırmak.", "İlk ve en önemli kural: gayrimenkul yatırım fonu payları yalnızca nitelikli yatırımcılara satılır. Fon tüzel kişiliği olmayan bir malvarlığıdır ama tapu işlemleri ile ortak olacağı anonim ortaklıkların ticaret sicili işlemleriyle sınırlı olarak tüzel kişiliği haiz sayılır. Yani tapuda gayrimenkul doğrudan fon adına tescil edilir.", "Gayrimenkul yatırım fonu süreli veya süresiz kurulabilir. Bu küçük detay, girişim sermayesi fonlarıyla karşılaştırmada önem kazanacak; çünkü onlar yalnızca süreli kurulur. Kurucu, portföy yönetim şirketi, gayrimenkul portföy yönetim şirketi ya da gayrimenkul ve girişim sermayesi portföy yönetim şirketi olabilir.", "Dokümanlarda fark var: gayrimenkul yatırım fonunda izahname yok, içtüzük ve ihraç belgesi var. İhraç belgesi ticaret siciline tescil edilmez. Satıştan önce yatırımcılarla fon ihraç sözleşmesi imzalanır ve bu sözleşmede yatırımcı aleyhine olağanüstü hak veya ispat yükü kaydı olamaz.", "Organizasyonda kurucunun yönetim kurulunda gayrimenkul yatırımlarında en az beş yıl tecrübeli bir üye olmalı. Yatırım komitesinde bu üye, genel müdür ve bir gayrimenkul değerleme uzmanı bulunur. Komite üyelerin çoğunluğuyla toplanır ve oyların çoğunluğuyla karar alır.", "Süreler şöyle: kuruluş başvurusu iki ay içinde karara bağlanır, içtüzük altı iş günü içinde tescil edilir. Pay ihracı başvurusu tescilden itibaren altı ay içinde yapılmalı, bir defaya mahsus altı ay uzatılabilir. İhraç belgesi yirmi iş günü içinde incelenir. Satış başlangıcı ise ihraç belgesinin tesliminden itibaren bir yılı geçemez.", "En önemli sayılardan biri asgari büyüklük: satışa başladıktan sonra bir yıl içinde fon portföyü en az iki yüz milyon liraya ulaşmalı. Ulaşamazsa yatırımlar durdurulur ve altı ay içinde tasfiye izni istenir.", "Gayrimenkul yatırım fonunun ilginç bir özelliği ayni işlemler. Pay bedeli gayrimenkulün fon adına tescil edilmesiyle ödenebilir, iade de gayrimenkul devriyle yapılabilir. Bu durumda değerleme raporu hazırlanır; satışta rapor değerinin üstüne, iadede altına çıkılamaz. İpotekli ya da devri kısıtlı gayrimenkul pay karşılığında fona devredilemez ve mevcut tüm pay sahiplerinin mutabakatı alınır.", "Fiyatlama sıklığı burada çok düşük: birim pay değeri en az yılda bir kez hesaplanır. Kıyaslarsak yatırım fonlarında günlük, serbest fonlarda ayda bir, gayrimenkul yatırım fonu ve girişim sermayesi yatırım fonunda yılda bir. Ayrıca ihraç sözleşmesinde esasları yazılıysa birim pay değerinden farklı bir fiyatla alım satım yapılabilir.", "Kurucu iade talepleri için likiditeden sorumludur. Likidite yoksa ve satış yatırımcıların zararına olacaksa, içtüzükte hüküm varsa geri alım ertelenebilir; ancak erteleme bir yılı aşamaz ve Kurula hemen bilgi verilir.", "Portföy sınırlarına gelelim. Fon toplam değerinin en az yüzde sekseni gayrimenkul yatırımlarından oluşur. Aktifinin en az yüzde yetmiş beşi yurtiçi gayrimenkul olan anonim ortaklıkların paylarına en fazla yüzde yirmi yatırılabilir. İpotekli gayrimenkuller içtüzükte hüküm varsa alınabilir ama en fazla yüzde otuz.", "Yapılamayacaklar listesi gayrimenkul yatırım ortaklığını hatırlatır: gayrimenkul projelerine yatırım yok, inşaatı kendisi yapamaz, oteli veya alışveriş merkezini işletemez, sürekli kısa vadeli alım satım yapamaz. Gayrimenkul yatırım fonuna özgü önemli bir yasak da yurt dışında gayrimenkul alım, satım ve kiralama yapamamasıdır. Türev yalnızca korunma amaçlı ve açık pozisyon yüzde yirmiyi aşamaz.", "Proje gayrimenkul yatırım fonlarını ayrı öğren. Bağımsız bölüm alanının yarısından fazlası konut olan projelere yatırım için kurulur ve unvanında proje gayrimenkul yatırım fonu ifadesi bulunur. Yüzde seksen kuralı uygulanmaz. Fon adına tescil edilen arsalarda üç yıl içinde inşaata başlanabilecek hale gelinmesi gerekir. Projeler bina tamamlama sigortası, teminat mektubu ya da hakediş sistemi gibi yöntemlerden en az biriyle teminatlandırılır.", "Kredi tarafında gayrimenkul yatırım fonları cömert: fon toplam değerinin yüzde ellisine kadar kredi veya faizsiz finansman kullanabilir. İnşaat işleri A veya B grubu belgeli müteahhitlere yaptırılır. Performans ücreti ihraç sözleşmesinde hüküm varsa alınabilir; ama pay sahiplerine tahakkuk ettirilen fonlar borsada işlem göremez.", "Değerleme kuralları gayrimenkul yatırım ortaklığı ile neredeyse aynı: değerleme kuruluşu her yıl sonunu izleyen bir ay içinde belirlenir, aynı kuruluştan üst üste en fazla üç yıl, sonra en az iki yıl ara. Rapor beş iş günü içinde tarihlenir, iki iş günü içinde teslim edilir ve en az on yıl saklanır.", "Son iki kural: Kurul ücreti üçer aylık dönemlerde fon toplam değerinin yüz binde beşi, ve gayrimenkul yatırım fonu başka fonla birleştirilemez ya da başka fona dönüştürülemez.", "Özetleyelim: bir, yalnızca nitelikli yatırımcı ve izahname yerine ihraç belgesi. İki, bir yılda iki yüz milyon lira asgari portföy. Üç, en az yüzde seksen gayrimenkul, ipotekli varlık en fazla yüzde otuz. Dört, kredi sınırı yüzde elli ve yurt dışında gayrimenkul işlemi yok. Beş, fiyat yılda en az bir kez ve birleşme ya da dönüşüm yasak. Şimdi sorulara."], "13": ["Merhaba, girişim sermayesi bölümündeyiz. Bu bölümde iki kurumu birlikte ele alıyoruz: girişim sermayesi yatırım fonu ve girişim sermayesi yatırım ortaklığı. Biri fon, diğeri anonim ortaklık; ikisinin ortak noktası gelişme potansiyeli olan şirketlere yatırım yapmak.", "Girişim sermayesi yatırım fonu ile başlayalım. Girişim sermayesi yatırım fonu, nitelikli yatırımcılardan toplanan para ya da iştirak paylarıyla kurulan, tüzel kişiliği olmayan bir malvarlığıdır. Yalnızca süreli kurulur; gayrimenkul yatırım fonunun süresiz de kurulabildiğini hatırla. Ticaret sicili işlemleriyle sınırlı olarak tüzel kişiliği varmış gibi sayılır ve payları yalnızca nitelikli yatırımcılara satılır, izahname yerine ihraç belgesi düzenlenir.", "Kaynak taahhüdü girişim sermayesi yatırım fonunun kalbidir. Yatırımcılar bir defada ya da farklı tarihlerde ödemek üzere taahhüt verir. Toplam taahhüt en az yetmiş beş milyon lira olmalı. Satışa başlanmasından itibaren bir yıl içinde tahsil edilir ve en fazla iki yıl içinde yatırıma yönlendirilir. Asgari tutara ulaşılmazsa altı ay içinde tasfiye izni istenir.", "Girişim şirketi kimdir? Büyüme ve katma değer potansiyeli olan, destekle amacına ulaşabilecek şirket. Türkiye'de kurulu olmalı ya da yurt dışındaysa varlıklarının en az yüzde elli biri Türkiye'deki iştiraklerden oluşmalı. Yalnızca anonim ve limited şirketlere yatırım yapılır ve yurt içindeki limited şirket bir yıl içinde anonim şirkete dönüşür. Aktifinin en az yüzde kırkı gayrimenkul olan şirketler ve müteahhitlik şirketleri girişim şirketi sayılmaz.", "Girişim sermayesi yatırımı çok geniş tanımlanmış: doğrudan ortaklık, borsada işlem görmeyen girişim şirketlerinin borçlanma araçları, borç ve sermaye karması mezzanine finansman, diğer girişim sermayesi yatırım fonu payları, girişim sermayesi yatırım ortaklığı araçları, pay alım opsiyonu primleri bunlardan bazıları. Ortaklık hakkı veren yatırımlar pay sahipliği sözleşmesiyle yapılır; şirketin tamamı alınıyorsa pay devri sözleşmesi yeter.", "Girişim sermayesi yatırım fonunun yatırım sınırları: fon değerinin en az yüzde sekseni girişim sermayesi yatırımı olmalı ve yoğunlaşma sınırı yoktur, tek yatırım bile olabilir. Küçük ve orta büyüklükteki işletmelere, yani KOBİ'lere doğrudan yatırımlar bir dönemde yüzde onu geçerse asgari oran yüzde elli bire düşer. Diğer girişim sermayesi yatırım fonlarına en fazla yüzde yirmi beş, yatırımcıların kontrolündeki şirketlere en fazla yüzde yirmi yatırılabilir.", "Yurt dışındaki borsada işlem görmeyen şirketler için kademeli bir tablo var. Temel sınır yüzde on beş. Yurt dışı yerleşiklerin pay sahipliği yüzde yirmi ile otuz arasındaysa sınır yüzde otuz, otuz ile elli arasında yüzde elli, elli ile seksen arasında yüzde seksen, seksen ve üzerinde yüzde yüz olur. Bu yatırımlar girişim sermayesi yatırımı sayılmaz.", "Diğer kurallar: girişim sermayesi yatırım fonu türeve yalnızca korunma amacıyla girer ve açık pozisyon yüzde yirmiyi aşamaz. Kredi sınırı yüzde elli, repo sınırı yüzde on. Birim pay değeri yılda en az bir kez hesaplanır. Değerlemede yatırım tutarı yirmi beş milyonun altındaysa her üçüncü, yirmi beş ile elli milyon arasında her ikinci, elli milyonun üzerindeyse her hesap döneminde değerleme kuruluşu raporu gerekir.", "Şimdi girişim sermayesi yatırım ortaklığına geçelim. Girişim sermayesi yatırım ortaklığı kayıtlı sermaye sistemine tabi bir anonim ortaklıktır. Kuruluş sermayesi en az üç yüz milyon lira, paylar tamamen nakit karşılığı çıkarılır ve sermayenin yüzde yirmi beşinin halka arz edileceği ya da nitelikli yatırımcıya satılacağı taahhüt edilir. Başvuruda yatırım stratejisini ve çıkış hedeflerini anlatan bir fizibilite etüdü sunulur.", "Girişim sermayesi yatırım ortaklığında lider sermayedar zorunludur. İmtiyazlı pay yoksa yönetim kontrolünü sağlayan, varsa sermayenin en az yüzde yirmi beşine sahip ortaktır. Gerçek kişi lider sermayedarın en az beş yıl tecrübesi ve en az doksan milyon lira varlığı olmalı; birden fazla gerçek kişide toplam yüz seksen milyon. Tüzel kişide üç yıl geçmiş, özsermaye iki kat ve aktif üç kat şartları var. Menkul kıymet yatırım ortaklığındaki yüz elli milyon ile girişim sermayesi yatırım ortaklığındaki doksan milyonu karıştırma.", "Girişim sermayesi yatırım ortaklığının halka arz takvimi diğer ortaklıklardan uzundur, çünkü önce yatırım yapması gerekir. Tescilden itibaren on sekiz ay içinde en az bir girişim sermayesi yatırımı, üç yıl içinde de portföyü oluşturup sermayenin yüzde yirmi beşi için halka arz başvurusu. Halka arzdan sonra da en az yüzde yirmi beş sürekli halka açık kalır.", "Yalnızca nitelikli yatırımcıya satan girişim sermayesi yatırım ortaklıkları uluslararası private equity modeline benzer ve birçok esneklik tanınır. Asgari sermaye doksan milyon lira, lider sermayedar şartı yok, izahname yok, paylar nama yazılı. Portföy sınırlarının çoğu uygulanmaz; asgari oran ilk satıştan sonraki birinci yılın sonundan itibaren aranır. Ayrıca kâr payı imtiyazlı pay da ihraç edebilirler.", "Girişim sermayesi yatırım ortaklığının yönetiminde yönetim kurulu çoğunluğu üç yıl, genel müdür beş yıl tecrübeli olmalı. Genel müdüre on iki ayda altı aydan fazla vekalet edilemez ve genel müdür portföydeki girişim şirketlerinde icrai görev alabilir. Halka arz eden girişim sermayesi yatırım ortaklığı yalnızca yönetim kurulunun salt çoğunluğunu aday gösterme imtiyazlı pay ihraç edebilir.", "Girişim sermayesi yatırım ortaklığının portföy sınırları: aktifin en az yüzde elli biri girişim sermayesi yatırımı; KOBİ'lere doğrudan yatırımlar yüzde beşi geçerse bu oran yüzde otuz beşe iner. Yurt dışı kolektif yatırım kuruluşlarına en fazla yüzde kırk dokuz, mezzanine finansmana ve halka açık girişim şirketlerinin borsada işlem görmeyen paylarına en fazla yüzde yirmi beş, mevduata en fazla yüzde yirmi. Kontrol sahibi ortakların ve yöneticilerin kontrolündeki şirketlere ise hiç yatırım yapılamaz.", "Girişim sermayesi yatırım ortaklıkları KOBİ lehine teminat ve ipotek verebilir ama toplamda aktifin yüzde onunu ve tek şirkette yatırımın yüzde yirmi beşini aşamaz. Borç sınırı iki parçalı: kısa vadeli borçlar özsermayenin yarısını, uzun vadeli borçlar iki katını aşamaz. Dışarıdan hizmet giderleri aktifin yüzde iki buçuğunu, portföy yönetim şirketine ödenecek performans ücreti çıkış kazancının yüzde yirmisini geçemez.", "Statüden çıkış kuralları gayrimenkul yatırım ortaklığı ile aynı mantıkta: pay alım teklifi, yönetim kurulu raporu, büyük ortaklara bir yıllık satış yasağı ve ayrılma hakkının doğmaması. Portföy sınırına aykırılıkta arızi durumlarda bir yıl, tam çıkış nedeniyle iki yıl süre verilebilir.", "Özetleyelim: bir, girişim sermayesi yatırım fonu yalnız süreli kurulur ve yetmiş beş milyon lira kaynak taahhüdü ister. İki, girişim sermayesi yatırım fonunda en az yüzde seksen, KOBİ ağırlığında yüzde elli bir; girişim sermayesi yatırım ortaklığında en az yüzde elli bir. Üç, girişim sermayesi yatırım ortaklığı üç yüz milyon sermaye, nitelikli satışta doksan milyon. Dört, girişim sermayesi yatırım ortaklığında on sekiz ayda ilk yatırım, üç yılda halka arz başvurusu. Beş, girişim sermayesi yatırım ortaklığı borç sınırı kısa vadede özsermayenin yarısı, uzun vadede iki katı. Haydi sorulara."], "14": ["Merhaba, Türkiye Sermaye Piyasaları Birliği meslek kuralları ve disiplin yönetmeliği bölümündeyiz. Bu bölümde iki şey öğreneceğiz: üyelerin uyması gereken kurallar ve uymazlarsa uygulanacak cezalar.", "Önce Birlik. Türkiye Sermaye Piyasaları Birliği, Sermaye Piyasası Kanunu'nun otuz yedinci maddesine göre kurulmuş, kamu kurumu niteliğinde bir meslek kuruluşudur. Üyeleri aracı kurumlar, bankalar, menkul kıymet, girişim sermayesi ve gayrimenkul yatırım ortaklıkları ile portföy yönetim şirketleridir. Meslek kurallarını Birlik Yönetim Kurulu hazırlar, Birlik Genel Kurulu onaylar.", "Üyelerin uyacağı yedi genel ilke var: dürüst ve adil davranma, bağımsızlık ve tarafsızlık, mesleki özen ve titizlik, saydamlık, kaynakları etkin kullanma, rekabet ve toplumsal yararı gözetme, son olarak da suç gelirlerinin aklanmasıyla mücadele. Bağımsızlık ilkesinde önemli bir cümle var: aynı koşullara sahip her müşteriye eşit davranılır.", "Müşteri ilişkilerinde ilk adım müşteriyi tanımaktır. Kimlik bilgileri alınır, yazılı sözleşme yapılır, standart testlerle risk ve getiri tercihleri öğrenilir. Ürün müşteriye uygun değilse ya da müşteri bilgi vermezse müşteri uyarılır. Bilgi verme de iki aşamalıdır: hizmet öncesinde ve hizmet sırasında.", "Çıkar çatışmalarında bilmen gereken, çatışmanın sadece üye ile müşteri arasında değil, müşteriler arasında da olabileceğidir. Önlenemiyorsa önce müşterinin menfaati gözetilir ve müşteriye bildirilir. Müşteriler arasındaysa adil ve tarafsız davranılır.", "Reklam kuralları sınavın sevdiği yerdir. En iyi, en güvenilir, en sağlam, en çok kazandıran gibi abartılı ifadeler yasak. Mutlak getiri garantisi yasak. Diğer üyeleri kötülemek yasak. Ödüllere reklamda yer verilebilir ama kaynağı açıkça belirtilmeli. Müşteri getirene getirdiği müşterinin geliri üzerinden pay veren kampanya ve ödenen komisyondan fazla iade yapan kampanya da yasak.", "Haksız rekabet kurallarında iki somut kural var. Birincisi, diğer üyenin faaliyetini aksatacak şekilde ekip halinde personel transferi yapılamaz. İkincisi, yeni işe başlayan personelin eski işyerinin müşterileriyle irtibatı en az bir ay engellenir.", "Çalışanlarla ilişkilerde de dikkat edilecekler var. Çalışan müşteriyle borç alacak, kefalet ya da müşterek hesap ilişkisine giremez; bunun tek istisnası birinci derece akrabalardır. Teamülün üzerinde hediye alamaz ve portföy yönetimi dışında müşteriden emir verme veya para çekme vekaletnamesi alamaz. Başka bir üyenin çalışanı hesap açarsa bu durum en fazla bir hafta içinde diğer üyeye bildirilir.", "Üyeler kendi kurum içi etik kurallarını belirler ve çalışanlardan bu kuralları okuyup anladıklarına dair imzalı taahhütname alır. Yeni personel hakkında sicil tutmakla yetkili kuruluştan bilgi alınır.", "Şimdi disiplin yönetmeliğine geçelim. Yönetmelik aracı kurumlara, bankalara, portföy yönetim şirketlerine ve payları borsada işlem gören yatırım ortaklıklarına uygulanır. Dört disiplin cezası var: uyarı, kınama, geçici çıkarma ve sürekli çıkarma. Bunlara ayrıca idari para cezası eklenir.", "Uyarı ile kınamayı ayırmanın kolay yolu fiilin niteliğidir. Kayıtsızlık ve dikkatsizlik uyarı gerektirir; kusurlu veya kasıtlı davranış kınama gerektirir. Asılsız ihbar, Birlik incelemesini engellemek ve yetersiz iç denetim nedeniyle suiistimale yol açmak kınama sebebidir.", "Çıkarma cezaları suçlara bağlıdır. Geçici çıkarma en fazla altı ay sürer ve Kanunun yüz altı, yüz yedi ve yüz dokuzuncu maddelerindeki suçlarda uygulanır. Sürekli çıkarma en ağır cezadır ve yüz onuncu maddedeki güveni kötüye kullanma ve sahtecilik suçlarında verilir. Her iki durumda da suçun ilk derece mahkemesi kararıyla sabit olması gerekir.", "Tekerrür kuralı şöyle: uyarı alan üye silinme süresi içinde aynı fiili işlerse kınama alır; geçici çıkarma alan aynı fiili işlerse sürekli çıkarılır. Bir fiil birden fazla maddeyi ihlal ederse ağır olan ceza verilir.", "Disiplin Komitesi beş üyeden oluşur ve Genel Kurulca iki yıl için seçilir. En az üç üyeyle toplanır, karar için en az üç olumlu oy gerekir ve çekimser oy kullanılamaz. Raportörü Hukuk İşleri Müdürüdür.", "Soruşturma süreleri çok sorulur. Komite dosya kendisine havale edildikten sonra on iş günü içinde işe başlar. Savunma süresi on iş günü, mazeret varsa yirmi iş günü. Rapor savunma süreleri hariç altmış iş günü içinde hazırlanır. Karar beş iş günü içinde tebliğ edilir ve itiraz on iş günü içinde Sermaye Piyasası Kurulu nezdinde yapılır.", "Zamanaşımında soruşturma için bir yıl, ceza için iki yıl. Sicil kayıtları beşinci yılın sonunda silinir; bir yıl içinde yeni fiil işlenmezse önceki cezalar tekerrüre esas alınmaz. Son bir kural: Sermaye Piyasası Kurulu aynı fiil için idari para cezası verdiyse Birlik ayrıca idari para cezası veremez.", "Özetleyelim: bir, kuralları Yönetim Kurulu hazırlar, Genel Kurul onaylar. İki, yeni personelin eski müşterilerle irtibatı en az bir ay engellenir. Üç, cezalar uyarı, kınama, en fazla altı aylık geçici çıkarma ve sürekli çıkarma. Dört, savunma on iş günü, itiraz on iş günü içinde Sermaye Piyasası Kuruluna. Beş, soruşturma zamanaşımı bir yıl, ceza zamanaşımı iki yıl, sicil beş yılda silinir. Şimdi sorulara geçebilirsin."], "15": ["Merhaba, sermaye piyasası çalışanları etik ilkeleri ve davranış kuralları bölümündeyiz. Kısaca SPEK diyeceğiz. Bu bölüm sayıdan çok mantıkla çözülen sorular getirir; o yüzden sana kuralları örneklerle anlatacağım.", "Önce iki kavramı ayıralım. Etik ilkeler kişiliği ve onun gelişimini hedef alan soyut kavramlardır. Davranış kuralları ise mesleğin nasıl yapılacağını gösteren somut, öğretici ve sınırlayıcı yönlendirmelerdir. İki bin sekiz krizinden sonra finans piyasasının temeline dördüncü E olarak etik yerleştirildi.", "Altı etik ilke var: temel ilke; bağımsızlık, dürüstlük ve adillik; özen ve titizlik; sürekli gelişim; sır saklama; etik düşünme. Kârlılık gibi bir ilke görürsen o listede yok. Etik düşünme, mevzuatı ve kurumsal değerleri gözeterek özgür iradeyle bağımsız kanaat kullanmak ve başkalarını da etik davranmaya teşvik etmek demek.", "Davranış kurallarının ilki mevzuatın bilinmesi. Çalışan mevzuatı yetkin şekilde iş yapacak kadar bilmeli, uzman olması gerekmez. Mevzuatlar çelişirse daha katı olan uygulanır. Kurumda aykırılık görürse önce uyarır, devam ederse ilişkisini keser ve gerekirse Sermaye Piyasası Kuruluna, Mali Suçları Araştırma Kuruluna ya da Birliğe bildirir. Uyum birimine danışmış olmak sorumluluğu kaldırmaz.", "Bağımsızlık ve tarafsızlık kuralı hediyeler konusunda netleşir. Lüks davetler, pahalı biletler, halka arzda öncelik gibi teklifler reddedilmeli; mütevazı hediyeler kabul edilebilir. Müşteri memnuniyetinden doğan bir menfaat söz konusuysa işveren önceden bilgilendirilir. İlginç bir örnek: başka konaklama imkanı olmayan bir saha ziyaretinde şirketin otel masrafını karşılaması kurala aykırı değildir.", "Gerçekdışı gösterim üç şekilde olur: gerçeğe aykırı beyan, bir verinin ihmal edilmesi ve yanıltıcı ifade. Başkasının verisini kaynak göstermeden kullanmak intihaldir. Getiri garantisi vermek de bu kuralın ihlalidir.", "Piyasanın dürüst işleyişi başlığında içsel bilgi önemli. Bilgi kamuya yayılana kadar içseldir; Kamuyu Aydınlatma Platformunda yayımlanan bilgi yayılmış sayılır ama küçük bir gruba yapılan kapalı sunum sayılmayabilir. Kaynağa güven azaldıkça içsel olma ihtimali azalır. Kendi analizinle ulaştığın öngörü içsel bilgi değildir. Ve dikkat: bilginin fiyata yansıyıp yansımadığı önemli değil, fiyatı etkileyebilecek nitelikte olması yeterli.", "Piyasa bozucu eylemler suç kadar ağır değildir ama idari para cezası gerektirir. Tipik örnek sürekli bir lotluk emir girmektir. Kendinden kendine aynı fiyattan işlem emir yoluyla, televizyonda al deyip ertesi gün satmak ise iletişim yoluyla piyasa bozucu eylemdir. İçsel bilgiyi bir arkadaşa söylemek, o kişi işlem yapmasa bile piyasa bozucu eylem sayılır.", "Müşterilere karşı görevlerin başında sadakat, sağduyu ve özen gelir. Müşteri çıkarı işverenin ve çalışanın çıkarının üstündedir. Ölçüt, çalışanın aynı işlemi kendi hesabına yaparken göstereceği özendir. Fon yönetiminde sadakat borcu fonun kurucusuna değil, katılma payı sahiplerinedir. En iyi gerçekleştirmede amaç en ucuz değil, en uygun işlemdir.", "Adil davranmayı eşit davranmakla karıştırma. Adil davranma, aynı nitelikteki müşterilere aynı koşullarda davranmak demektir. Araştırma sonucunu öğle yemeğinde bir müşteriye önceden anlatmak ya da halka arz dağıtımında yakın müşterilere ve kendine öncelik vermek bu kuralın ihlalidir.", "Uygunluk kuralında testler yaşayan bir yapıdır, bir kere yapılıp bırakılmaz. Örneğin müşteriye miras kalırsa test güncellenmelidir. Ürün uygun değilse müşteri yazılı uyarılır; ısrar ederse çalışan hizmet verip vermemekte serbesttir. Ancak portföy yönetimi ve yatırım danışmanlığında uygun olmayan hizmet müşteri istese bile verilemez.", "Performans sunumunda geçmiş getiri geleceğin göstergesi gibi sunulmaz, tüm portföyler toplu gösterilmez ve karşılaştırma ölçütü stratejiye uygun seçilir. Gizlilik kuralı müşteri ilişkisi bittikten sonra da sürer; iyi niyetli bir bağış kampanyası bile müşteri listesini paylaşmayı haklı kılmaz. Şüpheli işlem bildirimi ise gizliliğin istisnasıdır.", "İşverene karşı görevlerde dört başlık var: bizzat çalışma, özen ve sadakat; talimatlara uyma; menfaatlerin bildirilmesi; yöneticilerin sorumlulukları. İşi işverenden habersiz başkasına yaptıramazsın, ayrılırken müşteri listesini götüremezsin. Ancak işveren bilerek mevzuatı ihlal ediyorsa ona karşı çıkmak sadakat borcunun istisnasıdır, çünkü piyasa güveni işverene karşı borçlardan önce gelir.", "Menfaat konusunda kural net: hizmet nedeniyle üçüncü kişiden hediye veya menfaat almadan önce işverene bildirip yazılı izin alırsın; e-posta da yeterli. Yöneticiler ise astlarının ihlallerini önlemek için makul gayret gösterir; görev devretse bile sorumluluğu sürer ve gerekirse kusursuzluğunu kanıtlaması gerekir.", "Kayıtlar konusunda bir incelik: çalışanın ürettiği notların mülkiyeti çalışana, ticari kullanım hakkı işverene aittir. Yani notlarını yanında götürebilir ama başka işyerinde ticari amaçla kullanamaz.", "Son başlık çıkar çatışması. Çatışmanın doğmama ihtimali yoktur, önemli olan doğru yönetmektir. Önlenemiyorsa tam, açık ve anlaşılır biçimde açıklanır. İşlemlerde öncelik sırası önce müşteri, sonra işveren, en son çalışanın kendisidir. Üçüncü taraflardan sağlanan komisyon yasak değildir, açıklanması yeterlidir.", "Özetleyelim: bir, altı etik ilke ve dördüncü E olarak etik. İki, mevzuat çelişkisinde daha katı olan uygulanır. Üç, içsel bilgide önemli olan fiyatı etkileyebilme niteliği. Dört, adil davranma eşit davranma değildir; en iyi gerçekleştirme en ucuz değil en uygundur. Beş, öncelik sırası müşteri, işveren, çalışan. Hazırsan sorulara geçelim."]};
</script>
<script>
(function(){
const L="ABCDE";
const KEY="d1002-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2","#4F46E5","#BE185D","#15803D","#B45309","#0369A1","#9333EA","#0F766E","#C2410C","#1D4ED8"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("d1002"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){

  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,S.length>8?2:3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();

  <section class="hero" style="--c:#141A2B"><div><span class="pill">Tüm bölümler · ${list.length} soru</span><h1>Karma deneme</h1><p>Her bölümden en az ${S.length>8?"iki":"üç"} soru içeren rastgele set. Buradaki cevaplar bölüm skorlarını etkilemez.</p></div>${ring(x.c,list.length,"#0E8F7E","doğru")}</section>
  ${bar(x,`<button class="btn pri" data-newkarma="1">Yeni set oluştur</button>`)}<div class="qlist">`;

}

  <div class="tiles"><div class="tile"><span>Yanıtlanan</span><b>${tA}<small style="font-size:14px;color:var(--muted)"> / ${TOTAL}</small></b></div><div class="tile"><span>Doğru</span><b style="color:var(--ok)">${tC}</b></div><div class="tile"><span>Başarı oranı</span><b>${tA?"%"+Math.round(tC/tA*100):"–"}</b></div></div>
  <div class="sec-h"><h2>Bölümler</h2><span class="stat">${TOTAL} soru</span></div>

  S.forEach((s,i)=>{const x=secStats(i);const kb=s.sorular.filter(q=>q.k).length;h+=`<a class="card" href="#b${s.id}" style="--c:${HUE[i]}"><div class="top"><span class="no">Bölüm ${s.id}</span><span class="stat">${s.sorular.length} soru</span></div><span class="t">${esc(s.kisa)}</span><span class="d">${esc(s.ozet)}</span>${meter(x.a,x.c,x.n)}<span class="p"><span>${x.c}/${x.n} doğru</span><span>${x.a} yanıt</span></span></a>`});

  <div><dt>İzahname değişikliği</dt><dd>7 iş günü onay, 2 iş günü talep geri alma</dd></div>
  <div><dt>Sermaye yapısı açıklaması</dt><dd>İşlemi izleyen 3. iş günü saat 09.00&#x27;a kadar</dd></div>
  <div><dt>İlişkili taraf işlemi</dt><dd>%5 değerleme, %10 bağımsız üye onayı</dd></div>

  <div><dt>GYO asgari sermaye</dt><dd>1 milyar TL (altyapı GYO 1,5 milyar TL)</dd></div>

  <div><dt>Fon ihraççı sınırları</dt><dd>Tek ihraççı %10, grup %20, %5&#x27;i aşanlar toplamı %40</dd></div>
  <div><dt>Asgari yatırım oranı</dt><dd>GYF ve GSYF %80; GYO ve GSYO %51</dd></div>
  <div><dt>TSPB disiplin zamanaşımı</dt><dd>Soruşturma 1 yıl, ceza 2 yıl; sicil 5. yıl sonunda silinir</dd></div>
  </dl></section>`;
  return h;
}

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b(\d+)$/.exec(r);
  if(m&&+m[1]>=1&&+m[1]<=S.length) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const PK="d1002-ses-v1";

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["TÜBİTAK", "Türkiye Bilimsel ve Teknolojik Araştırma Kurumu"],["MASAK", "Mali Suçları Araştırma Kurulu"],["UCITS", "Avrupa Birliği kolektif yatırım kuruluşları direktifi"],["TEFAS", "Türkiye Elektronik Fon Dağıtım Platformu"],["SPKn", "Sermaye Piyasası Kanunu"],["TTSG", "Türkiye Ticaret Sicili Gazetesi"],["TCMB", "Türkiye Cumhuriyet Merkez Bankası"],["BDDK", "Bankacılık Düzenleme ve Denetleme Kurumu"],["DSYO", "değişken sermayeli yatırım ortaklığı"],["MKYO", "menkul kıymet yatırım ortaklığı"],["KVHS", "kripto varlık hizmet sağlayıcı"],["TSPB", "Türkiye Sermaye Piyasaları Birliği"],["TDUB", "Türkiye Değerleme Uzmanları Birliği"],["KYBF", "Kurumsal Yönetim Bilgi Formu"],["TRİK", "teminat, rehin, ipotek ve kefalet"],["NYİP", "Nitelikli Yatırımcı İşlem Pazarı"],["OECD", "Ekonomik İşbirliği ve Kalkınma Örgütü"],["GSYF", "girişim sermayesi yatırım fonu"],["GSYO", "girişim sermayesi yatırım ortaklığı"],["SPEK", "Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları"],["BİAŞ", "Borsa İstanbul"],["KOBİ", "küçük ve orta büyüklükteki işletme"],["TOKİ", "Toplu Konut İdaresi"],["TMSF", "Tasarruf Mevduatı Sigorta Fonu"],["VTMK", "varlık teminatlı menkul kıymet"],["TÜFE", "tüketici fiyat endeksi"],["SPK", "Sermaye Piyasası Kurulu"],["SPA", "sermaye piyasası araçları"],["KAP", "Kamuyu Aydınlatma Platformu"],["MKK", "Merkezi Kayıt Kuruluşu"],["YTM", "Yatırımcı Tazmin Merkezi"],["TTK", "Türk Ticaret Kanunu"],["KGK", "Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu"],["TMS", "Türkiye Muhasebe Standartları"],["TCK", "Türk Ceza Kanunu"],["İİK", "İcra ve İflas Kanunu"],["PYŞ", "portföy yönetim şirketi"],["KYK", "kolektif yatırım kuruluşu"],["GYO", "gayrimenkul yatırım ortaklığı"],["MKT", "merkezi karşı taraf"],["URF", "Kurumsal Yönetim Uyum Raporu"],["HAO", "halka açık ortaklık"],["KİT", "kamu iktisadi teşebbüsü"],["VKŞ", "varlık kiralama şirketi"],["SPF", "Sermaye Piyasası Faaliyetleri"],["SPV", "özel amaçlı kurum"],["MBS", "ipoteğe dayalı menkul kıymet"],["ABS", "varlığa dayalı menkul kıymet"],["CDO", "teminatlandırılmış borç yükümlülüğü"],["CDS", "kredi temerrüt swabı"],["GYF", "gayrimenkul yatırım fonu"],["BYF", "borsa yatırım fonu"],["NAD", "net aktif değer"],["YBF", "yatırımcı bilgi formu"],["SPL", "Sermaye Piyasası Lisanslama Sicil ve Eğitim Kuruluşu"],["YİD", "yap-işlet-devret"],["TBK", "Türk Borçlar Kanunu"],["AVM", "alışveriş merkezi"],["GMY", "genel müdür yardımcısı"],["KDV", "katma değer vergisi"],["KHK", "kanun hükmünde kararname"],["VUK", "Vergi Usul Kanunu"],["SP", "sermaye piyasası"],["YK", "yönetim kurulu"],["GK", "genel kurul"],["AO", "anonim ortaklık"],["RG", "Resmi Gazete"],["AB", "Avrupa Birliği"],["TD", "takip farkı"],["TE", "takip hatası"],["GS", "girişim sermayesi"],["MK", "menkul kıymet"],["TL", "Türk lirası"],["RP", "fonun getirisi"],["RB", "endeksin getirisi"],["SPKn","Sermaye Piyasası Kanunu"],["TTSG","Türkiye Ticaret Sicili Gazetesi"],["TRİK","teminat, rehin, ipotek ve kefalet"],["YİB","yatırımcı ilişkileri bölümü"],["KYBF","Kurumsal Yönetim Bilgi Formu"],["URF","Uyum Raporu"],["KSS","kurumsal sosyal sorumluluk"],["NBD","net bugünkü değer"],["KGK","Kamu Gözetimi Kurumu"],["KYD","kurumsal yönetim derecelendirme"],["TTK","Türk Ticaret Kanunu"],["YK","yönetim kurulu"],["GK","genel kurul"],["KY","kurumsal yönetim"],["PD","piyasa değeri"],["FD","fiili dolaşımdaki"],["GM","genel müdür"],["SP","sermaye piyasası"],["ÇSY","çevresel, sosyal ve kurumsal yönetim"],["AB","Avrupa Birliği"],["ABD","Amerika Birleşik Devletleri"],["SOX","Sarbanes Oxley"]];
function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}
  t=t.replace(/(\p{Ll})[’'](\p{L})/gu,"$1$2").replace(/\s+/g," ");
  return t.trim();
}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;
}
function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){
  const vs=synth.getVoices();const tr=trVoices();
  return vs.find(v=>v.name===pref.voice)||tr[0]||null;
}
function fillVoices(){
  if(!synth)return;
  const vs=synth.getVoices();const tr=trVoices();const list=tr.length?tr:vs;
  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth){return}
  let si=curSi>=0?curSi:(qSi>=0?qSi:0);
  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}
  playing=true;speak();
}
function pause(){playing=false;utt=null;synth.cancel();ui()}
function stop(finished){playing=false;utt=null;if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}
  navByPlayer=false;ui();
});
window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
})();

</script>
