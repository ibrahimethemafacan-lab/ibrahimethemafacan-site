 sınırı uygulanmaz; 4749 sayılı Kanunla kurulan VKŞ'lerde sınır yok<\/td><\/tr>\n<tr><td>Bir ihraççının sermaye veya oy hakları<\/td><td>En fazla <b>%10<\/b><\/td><\/tr>\n<tr><td>Hizmet alınan PYŞ'nin hakim ortaklarıyla ilişkili ihraççılar<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>İlişkili aracı kurum ve bankaların aracılık ettiği halka arzlar<\/td><td>İhraç miktarının en fazla <b>%10'u<\/b>, NAD'ın en fazla <b>%5'i<\/b><\/td><\/tr>\n<tr><td>Varant ve yatırım kuruluşu sertifikaları<\/td><td>Toplam <b>%10<\/b>, tek ihraççı <b>%5<\/b><\/td><\/tr>\n<tr><td>Mevduat ve katılma hesabı (en fazla 12 ay vadeli)<\/td><td>Toplam <b>%10<\/b>, tek banka <b>%3<\/b><\/td><\/tr>\n<tr><td>İmtiyazlı ortaklar, %10'dan fazla pay sahipleri ve yöneticilerin %20'den fazla sahip olduğu şirketler<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Borsada işlem gören altın ve kıymetli madenler<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Yatırım fonu katılma payları<\/td><td>Toplam <b>%20<\/b>, tek fon <b>%5<\/b>; giriş-çıkış komisyonu ödenmez<\/td><\/tr>\n<tr><td>Takasbank para piyasası<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Repo (portföydeki repoya konu varlıkların rayiç değeri)<\/td><td>En fazla <b>%10<\/b><\/td><\/tr>\n<tr><td>Borsa dışı ters repo<\/td><td>En fazla <b>%10<\/b> (karşı tarafın derecelendirme notu şart)<\/td><\/tr>\n<tr><td>SPA ödünç verme<\/td><td>Piyasa değerinin en fazla <b>%50'si<\/b>, en fazla <b>90 iş günü<\/b>, en az <b>%100<\/b> teminat<\/td><\/tr>\n<tr><td>Kıymetli maden ödünç verme<\/td><td>Piyasa değerinin en fazla <b>%75'i<\/b><\/td><\/tr>\n<tr><td>Türevlerden açık pozisyon<\/td><td>Net aktif değeri aşamaz<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: Sabit sermayeli MKYO diğer sabit sermayeli MKYO paylarına <b>yatırım yapamaz<\/b>.<\/li>\n<li>Borsada işlem gören varlıklar borsadan alınıp satılır; ilk ihraçlar ve borsada işlem gören dış borçlanma araçlarının borsa dışı satışı istisnadır. Borsa dışı repo/ters repo bilgileri sözleşmeyi izleyen iş günü KAP'ta açıklanır ve <b>beş yıl<\/b> saklanır.<\/li>\n<li>Türev kullanılıyorsa tüm portföy yöneticilerinde Düzey 3 ve Türev Araçlar lisansı şarttır.<\/li>\n<li>Fiyat hareketi, kâr payı veya rüçhan kullanımı nedeniyle sınır aşılırsa <b>30 gün<\/b> içinde uyum sağlanır (Kurul uzatabilir).<\/li>\n<li><b>Borçlanma:<\/b> kısa süreli nakit ihtiyacı için son yıllık tablolardaki özkaynağın <b>%20'sine<\/b> kadar kredi veya aynı sınırda bono.<\/li>\n<\/ul>\n\n<h3>Raporlama, kamuyu aydınlatma, kâr payı<\/h3>\n<ul>\n<li>Performans sunum raporu Ocak-Haziran ve Ocak-Aralık dönemleri için hazırlanır; dönem bitiminden itibaren <b>bir ay<\/b> içinde bağımsız denetimden geçirilir ve internet sitesi ile KAP'ta açıklanır.<\/li>\n<li><b>Haftalık rapor<\/b> (portföy değeri ve net varlık değeri tabloları) dönemi izleyen ilk iş günü KAP'ta; paylar ay içinde sektörel, ay sonunda detaylı gösterilir.<\/li>\n<li>Aracı kurum komisyonları ve yıllık komisyon/ücret oranı her üç aylık dönemi izleyen <b>10 iş günü<\/b> içinde; çalışanlara aylık ücret dışı prim ve ikramiyeler ödemeyi izleyen <b>üç iş günü<\/b> içinde açıklanır.<\/li>\n<li>Pay fiyatı, pay başına net aktif değerin <b>2 katını<\/b> aşarsa, durum ortadan kalkana kadar sektörel portföy tabloları her iş günü KAP'ta yayımlanır.<\/li>\n<li>YK bilgilendirme politikası hazırlar, genel kurulda sunar ve KAP'ta açıklar.<\/li>\n<li><b>Kâr payı:<\/b> net dağıtılabilir kârın <b>en az %20'si<\/b> birinci kâr payı olarak <b>nakden<\/b> dağıtılır. Net dönem ve geçmiş yıl zararları özsermaye kalemleriyle mahsup edilir.<\/li>\n<li>Kendi paylarını geri alma Kurulun geri alım düzenlemelerine göre yapılabilir.<\/li>\n<\/ul>\n\n<h3>DSYO'ya dönüşüm (statüden çıkış)<\/h3>\n<ul>\n<li>Olumlu oy verenler dışındaki ortaklara; özel durum açıklamasından önceki <b>30 günlük<\/b> ve <b>altı aylık<\/b> düzeltilmiş ağırlıklı ortalama fiyatlar ile altı aylık dönemin düzeltilmiş pay başına net aktif değer ortalamasından <b>en yüksek olanla<\/b> pay alım teklifi zorunludur.<\/li>\n<li>YK gerekçe ve projeksiyon raporu hazırlar, en geç Kurula başvuru tarihinde KAP'ta ilan eder. Kurul izninden itibaren <b>üç ay<\/b> içinde genel kurul kararı alınmazsa izin geçersiz. TTSG nüshası <b>altı iş günü<\/b> içinde Kurula. <b>Ayrılma hakkı doğmaz.<\/b><\/li>\n<\/ul>\n\n<h3>Değişken sermayeli MKYO (DSYO)<\/h3>\n<ul>\n<li><b>Sermayesi her zaman net aktif değerine eşit<\/b> anonim ortaklık; portföy varlıkları sabit sermayeli ile aynı listededir.<\/li>\n<li>Portföy, sermaye piyasasında <b>en az üç yıl<\/b> tecrübeli portföy yöneticilerince yönetilir ve portföy saklama kuruluşunda saklanır. Portföy, kredi, türev ve benzeri işlemler dışında teminat gösterilemez ve rehnedilemez; portföyün borç ve alacakları birbirine mahsup edilemez.<\/li>\n<li>Dikkat: DSYO portföy yönetim hizmetini Kurul onayıyla <b>bir PYŞ'den almak zorundadır<\/b>; tüm hizmetleri dışarıdan alıyorsa genel müdür istihdam etmeyebilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Kuruluş şartı<\/th><th>Sabit sermayeli MKYO<\/th><th>DSYO<\/th><\/tr>\n<tr><td>Şirket yapısı<\/td><td>Kayıtlı sermayeli AO<\/td><td>AO (sermayesi NAD'a eşit)<\/td><\/tr>\n<tr><td>Asgari sermaye<\/td><td><b>300 milyon TL<\/b><\/td><td>Başlangıç sermayesi <b>30 milyon TL<\/b>; yatırımcı payı ihracıyla NAD'ı en az <b>60 milyon TL<\/b>'ye çıkarma taahhüdü<\/td><\/tr>\n<tr><td>Halka arz<\/td><td>Sermayenin <b>%49'u<\/b> zorunlu<\/td><td>Yatırımcı payları halka arz, belirli yatırımcı kitlesine tahsis veya nitelikli yatırımcıya satış<\/td><\/tr>\n<tr><td>Lider sermayedar<\/td><td>Zorunlu<\/td><td>Yok<\/td><\/tr>\n<tr><td>Unvan<\/td><td>\"Menkul Kıymet Yatırım Ortaklığı\"<\/td><td>Aynı; işletme adı kullanılırsa portföy türü ve <b>\"DSYO\"<\/b> kısaltması<\/td><\/tr>\n<\/table>\n<ul>\n<li>Yatırımcı payı ihracı için izahname ve yatırımcı bilgi formu, kuruluş tescilinden itibaren <b>30 gün<\/b> içinde Kurula sunulur. Tahsisli veya nitelikli satışta izahname yerine <b>ihraç belgesi<\/b>; yatırımcı bilgi formu ihtiyari.<\/li>\n<li>DSYO paylarının <b>itibari değeri yoktur<\/b>. Pay başına NAD = (portföy değeri + hazır değerler + alacaklar + diğer aktifler − borçlar) / (yatırımcı + kurucu pay sayısı); günlük hesaplanır, aynı gün iki fiyat açıklanabilir.<\/li>\n<li>Para piyasası ve kısa vadeli borçlanma araçları portföyleri dışında emirler emrin verilmesinden sonraki <b>ilk hesaplamada<\/b> bulunacak fiyattan; bu iki portföyde <b>en son ilan edilen<\/b> fiyattan gerçekleşir.<\/li>\n<li>Kâr payı dağıtılabilir; TTK yedek akçe hükümleri uygulanmaz.<\/li>\n<\/ul>\n<table>\n<tr><th>Pay türü<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Kurucu payı<\/td><td><b>Nama yazılı<\/b> olmak zorunda; kâr payı, tasfiye payı, genel kurula katılma ve oy (her pay bir oy), bilgi alma, özel denetim, iptal davası ve azlık hakları<\/td><\/tr>\n<tr><td>Yatırımcı payı<\/td><td>Nama veya hamiline; <b>yalnızca kâr payı ve tasfiyeden pay alma<\/b> hakkı; genel kurula katılma ve oy yok<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: Kurucu ve yatırımcı paylarında <b>yeni pay alma hakkı yoktur<\/b>.<\/li>\n<li>Kurucu payları sermaye taahhüdünü yerine getirenlere tahsis edilir; yatırımcı payı ihracından önce kurucu payı devri <b>oran aranmaksızın<\/b> Kurul iznine; sonrasında yönetim kontrolü sağlayan devir Kurul iznine tabidir. Sonradan kurucu payı Kurul izni ve genel kurul kararıyla ihraç edilebilir.<\/li>\n<li>Kurucu payı itfası diğer kurucuların onayıyla, itfa sonrası kurucu pay tutarı başlangıç sermayesinin altına düşmemek kaydıyla, itfa tarihindeki pay başına NAD'dan yapılır.<\/li>\n<li>DSYO, talep üzerine yatırımcı paylarını <b>itfa etmekle yükümlüdür<\/b>; alım satım günlük esastır, yatırım kuruluşları ve PYŞ'ler aracılığıyla yapılır. Giriş-çıkış komisyonu uygulanabilir; ilişkili fonların paylarında giriş-çıkış komisyonu ödenmez.<\/li>\n<li>Yönetim ücreti, pazarlama ücreti ve giriş-çıkış komisyonuyla farklı <b>pay grupları<\/b> oluşturulabilir.<\/li>\n<li>YK çoğunluğu dört yıllık mezun; <b>en az birinin<\/b> finansal piyasalar veya işletmecilikte <b>en az beş yıl<\/b> tecrübesi olmalı.<\/li>\n<\/ul>\n\n<h3>DSYO portföy türleri ve sınırları<\/h3>\n<table>\n<tr><th>Portföy türü<\/th><th>Kural<\/th><\/tr>\n<tr><td>Borçlanma araçları<\/td><td>NAD'ın en az <b>%80'i<\/b> devamlı olarak yerli/yabancı borçlanma araçlarında<\/td><\/tr>\n<tr><td>Hisse senedi<\/td><td>En az <b>%80'i<\/b> devamlı olarak paylarda<\/td><\/tr>\n<tr><td>Kıymetli madenler<\/td><td>En az <b>%80'i<\/b> borsada işlem gören altın ve kıymetli madenler ile bunlara dayalı SPA'da<\/td><\/tr>\n<tr><td>Para piyasası<\/td><td>Tamamı vadesine en fazla <b>184 gün<\/b> kalmış araçlarda; ağırlıklı ortalama vade en fazla <b>45 gün<\/b><\/td><\/tr>\n<tr><td>Katılım<\/td><td>Tamamı faize dayalı olmayan araçlarda<\/td><\/tr>\n<tr><td>Dengeli<\/td><td>En az iki varlık türü, her biri en az <b>%20<\/b><\/td><\/tr>\n<tr><td>Değişken<\/td><td>Diğer türlere girmeyenler<\/td><\/tr>\n<tr><td>Serbest<\/td><td>Payları <b>yalnızca nitelikli yatırımcılara<\/b> satılan; genel sınırlamalara tabi değil<\/td><\/tr>\n<\/table>\n<ul>\n<li>Vade ifadesi kullanılırsa aylık ağırlıklı ortalama vade: <b>25-90 gün<\/b> kısa, <b>91-730 gün<\/b> orta, <b>730 günden fazla<\/b> uzun vadeli. Kısa vadeli ve para piyasası portföylerine vadesi hesaplanamayan varlık alınamaz; orta ve uzun vadelilerde en fazla <b>%20<\/b>.<\/li>\n<li>Sınırlar büyük ölçüde sabit sermayeli ile aynıdır (%10 tek ihraççı, %40, %20 grup, %10 borçlanma aracı ihraç payı, %35 kamu, %25 VKŞ, varant %10/%5, mevduat %10/%3, Takasbank para piyasası %20).<\/li>\n<li>Yatırım fonu, BYF ve diğer sabit/değişken sermayeli ortaklık paylarının toplamı NAD'ın en fazla <b>%20'si<\/b> (sabit sermayeliden farklı olarak diğer ortaklıklara yatırım mümkün).<\/li>\n<li>Repo: varlık rayiç değerinin <b>%10'u<\/b>; kredi ve borçlanma amaçlı Takasbank işlemi: NAD'ın <b>%10'u<\/b>; borsa dışı ters repo <b>%10<\/b>. NAD'ın en az %80'ini yabancı araçlara yatıran DSYO yurt dışında borsa dışı repo yapabilir.<\/li>\n<li>Tahsisli DSYO'da payların tahsis edildiği şirketlerin araçları tek şirket <b>%5<\/b>, toplam <b>%25<\/b>'i aşamaz. \"Endeks\" portföyü endeks getirisinden önemli ölçüde sapmamalıdır.<\/li>\n<li>Serbest portföylerde satış personeli yeterli bilgi ve deneyime sahip olmalı; yöneticilerde Düzey 3 ve Türev lisansı aranır. Yabancı fon payları için ilgili otorite izni gerekir.<\/li>\n<li>DSYO ve PYŞ, Kurulca öngörülen bilgileri her yıl <b>Ocak<\/b> ayında, değişiklikleri <b>altı iş günü<\/b> içinde saklama kuruluşuna bildirir. Olağanüstü durumlarda değerleme esaslarına YK karar verebilir.<\/li>\n<li>Derecelendirme notu arandığında <b>yatırım yapılabilir seviye<\/b> not gerekir.<\/li>\n<\/ul>\n\n<h3>MKYO performans ilke kararı<\/h3>\n<ul>\n<li><b>Nispi getiri<\/b> = pay başına NAD'daki yüzde değişim − karşılaştırma ölçütü veya eşik değer getirisi.<\/li>\n<li>Karşılaştırma ölçütü Kurul izniyle ve uygulamaya girişten en az <b>on iş günü<\/b> önce KAP'ta duyurularak değiştirilebilir. PYŞ'den hizmet alınması, PYŞ değişikliği veya yönetimin ortaklık bünyesine alınması <b>Kurul iznine<\/b> tabidir.<\/li>\n<li>Yıllık nispi getiri <b>negatifse<\/b> performans <b>\"yetersiz\"<\/b> sayılır ve performans raporuyla eş anlı açıklanır.<\/li>\n<li>Üst üste <b>iki yıl<\/b> yetersizse: aynı PYŞ yönetiyorsa PYŞ değiştirilir veya yönetim bünyeye alınır; ortaklık kendisi yönetiyorsa PYŞ'den hizmet alınır. Başvuru en geç izleyen <b>Şubat<\/b> ayında yapılır.<\/li>\n<li>Değiştirilen PYŞ'den, yetersiz sayılan son yılı izleyen <b>2 yıl<\/b> geçmeden tekrar hizmet alınamaz. Değerlendirmede yılın son iş günündeki PYŞ esas alınır.<\/li>\n<li>Portföy PYŞ'den alınıyorsa çalışanlara aylık ücret, YK üyelerine huzur hakkı dışında prim ve ikramiye ödenemez. Ortaklık kendisi yönetiyorsa \"yetersiz\" yıllar için bu ödemeler yapılamaz; yapıldıysa geri alınır veya ücretlerden mahsup edilir.<\/li>\n<li>İlk performans hesaplama dönemi <b>2021<\/b> yılıdır.<\/li>\n<\/ul>\n\n<h3>DSYO'nun sona ermesi<\/h3>\n<ul>\n<li>Esas sözleşmedeki sürenin dolması; süresizse Kurulun uygun görüşüyle <b>altı ay<\/b> sonrası için fesih ihbarı; kuruluş şartlarının kaybı; iflas veya tasfiye; devamının yatırımcıların yararına olmadığının Kurulca tespiti.<\/li>\n<\/ul>", "sorular": [{"q": "Sabit sermayeli bir MKYO'nun kuruluş sermayesi en az ne kadar olmalıdır?", "o": ["30 milyon TL", "60 milyon TL", "300 milyon TL", "150 milyon TL", "1 milyar TL"], "a": 2, "e": "Sabit sermayeli MKYO'nun kuruluş sermayesi 300 milyon TL'den az olamaz."}, {"q": "Sabit sermayeli MKYO'larda halka arz edilmesi taahhüt edilen ve sonrasında sürekli halka açık kalması gereken asgari oran nedir?", "o": ["%49", "%25", "%35", "%10", "%51"], "a": 0, "e": "Kurucular çıkarılmış sermayenin asgari %49'unun halka arz edileceğini taahhüt eder; halka arz sonrasında da bu oran korunur."}, {"q": "MKYO Tebliği'ne göre lider sermayedar nasıl tanımlanır?", "o": ["Sermayenin en az %10'una sahip ortak", "Sermayenin en az %51'ine sahip ortak", "Yönetim kurulunun çoğunluğunu belirleyen ortak", "Halka arz sonrası edinimler hariç sermayenin asgari %25'ine sahip ortak veya ortaklar", "Ortaklığın genel müdürü"], "a": 3, "e": "Lider sermayedar, halka arz sonrası edinimler hariç tek başına veya birlikte sermayenin asgari %25'ine sahip ortak veya ortaklardır."}, {"q": "Gerçek kişi lider sermayedarın menkul ve gayrimenkul varlıklarının rayiç değeri en az ne kadar olmalıdır?", "o": ["90 milyon TL", "150 milyon TL", "180 milyon TL", "300 milyon TL", "1.500 milyon TL"], "a": 1, "e": "Tek gerçek kişi lider sermayedarda en az 150 milyon TL, birden fazla gerçek kişide toplam en az 300 milyon TL aranır."}, {"q": "Sabit sermayeli MKYO genel müdürü için aranan şartlardan hangisi doğrudur?", "o": ["Finansal piyasalarda en az beş yıl tecrübe", "Genel müdür portföy yöneticisi olamaz", "Türev Araçlar lisansı ve üç yıl tecrübe", "Dört yıllık mezuniyet şartı aranmaz", "Finansal piyasalarda en az yedi yıl tecrübe ve SPF Düzey 3 lisansı"], "a": 4, "e": "Genel müdür en az yedi yıl finansal piyasa tecrübesine ve SPF Düzey 3 lisansına sahip olmalıdır; portföy yöneticisi olarak da görev yapabilir."}, {"q": "Sabit sermayeli MKYO'larda tek bir ihraççının para ve sermaye piyasası araçlarına yatırılabilecek azami oran (net aktif değere göre) nedir?", "o": ["%5", "%20", "%10", "%25", "%40"], "a": 2, "e": "NAD'ın %10'undan fazlası tek bir ihraççının araçlarına ve bunlara dayalı türevlere yatırılamaz."}, {"q": "Sabit sermayeli MKYO'ların borçlanma sınırı aşağıdakilerden hangisidir?", "o": ["Özkaynak tutarının %20'si", "Özsermayenin beş katı", "Net aktif değerin %50'si", "Özsermayenin iki katı", "Borçlanma yasaktır"], "a": 0, "e": "Kısa süreli nakit ihtiyacı için son yıllık tablolardaki özkaynağın %20'sine kadar kredi kullanılabilir veya bono ihraç edilebilir."}, {"q": "Sabit sermayeli MKYO'lar için aşağıdakilerden hangisi doğrudur?", "o": ["Halka arzdan önce sermaye artırımı yapabilirler", "Yönetim kuruluna aday gösterme imtiyazlı pay ihraç edebilirler", "Aracılık faaliyetinde bulunabilirler", "Diğer sabit sermayeli MKYO'ların paylarına yatırım yapamazlar", "Kuruluşta ayni sermaye konulabilir"], "a": 3, "e": "Sabit sermayeli MKYO diğer sabit sermayeli MKYO paylarına yatırım yapamaz; halka arz öncesi artırım, imtiyaz ihracı, aracılık ve ayni sermaye yasaktır."}, {"q": "Sabit sermayeli MKYO'ların net dağıtılabilir kârlarından birinci kâr payı olarak nakden dağıtması zorunlu asgari oran nedir?", "o": ["%5", "%20", "%10", "%25", "%50"], "a": 1, "e": "Net dağıtılabilir kârın en az %20'si birinci kâr payı olarak nakden dağıtılır."}, {"q": "Sabit sermayeli MKYO paylarının borsa fiyatı pay başına net aktif değerin kaç katını aşarsa, durum ortadan kalkana kadar sektörel portföy tabloları her iş günü KAP'ta yayımlanır?", "o": ["1,5 katı", "10 katı", "3 katı", "5 katı", "2 katı"], "a": 4, "e": "Ağırlıklı ortalama fiyat pay başına NAD'ın 2 katını aşarsa tablolar her iş günü yayımlanır."}, {"q": "Değişken sermayeli MKYO'nun (DSYO) kuruluşunda başlangıç sermayesi ve kurucuların taahhüt etmesi gereken net aktif değer tutarı sırasıyla hangisidir?", "o": ["300 milyon TL ve 600 milyon TL", "60 milyon TL ve 300 milyon TL", "30 milyon TL ve 60 milyon TL", "10 milyon TL ve 30 milyon TL", "75 milyon TL ve 150 milyon TL"], "a": 2, "e": "Başlangıç sermayesi en az 30 milyon TL'dir; kurucular yatırımcı payı ihracıyla NAD'ı en az 60 milyon TL'ye çıkarmayı taahhüt eder."}, {"q": "DSYO'larda yatırımcı paylarının sahibine tanıdığı haklar hangisinde doğru verilmiştir?", "o": ["Yalnızca kâr payı ve tasfiyeden pay alma hakkı", "Genel kurula katılma ve oy hakkı", "Yeni pay alma hakkı", "Özel denetim isteme hakkı", "Azlık hakları"], "a": 0, "e": "Yatırımcı payları yalnız kâr payı ve tasfiye payı hakkı tanır; genel kurul ve oy hakları kurucu paylarındadır; yeni pay alma hakkı hiçbir payda yoktur."}, {"q": "DSYO kurucu paylarıyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Nama yazılı olmak zorundadır", "Her kurucu payı genel kurulda bir oy hakkı verir", "Yatırımcı paylarının ihracından önce devri oran aranmaksızın Kurul iznine tabidir", "Kurucu paylarının yeni pay alma hakkı vardır", "İtfa fiyatı itfa tarihindeki pay başına net aktif değerdir"], "a": 3, "e": "Kurucu ve yatırımcı paylarının yeni pay alma hakkı bulunmamaktadır."}, {"q": "DSYO'larda para piyasası portföyü için aşağıdaki vade koşullarından hangisi doğrudur?", "o": ["Varlıkların vadesi en fazla 90 gün, ortalama vade en fazla 30 gün", "Varlıkların vadesi en fazla 184 gün, ağırlıklı ortalama vade en fazla 45 gün", "Varlıkların vadesi en fazla 365 gün, ortalama vade en fazla 90 gün", "Vade sınırı yoktur", "Varlıkların vadesi en fazla 730 gün"], "a": 1, "e": "Para piyasası portföyü tamamen vadesine en fazla 184 gün kalmış araçlardan oluşur ve ağırlıklı ortalama vadesi en fazla 45 gündür."}, {"q": "DSYO'nun borçlanma araçları portföyünün aylık ağırlıklı ortalama vadesi 120 gün ise esas sözleşmede portföyü tanımlarken hangi ifade kullanılır?", "o": ["Kısa vadeli", "Vade ifadesi kullanılamaz", "Uzun vadeli", "Para piyasası", "Orta vadeli"], "a": 4, "e": "25-90 gün kısa, 91-730 gün orta, 730 günden fazla uzun vadelidir; 120 gün orta vadeye girer."}, {"q": "MKYO performans ilke kararına göre bir MKYO'nun portföy yönetim performansı hangi durumda \"yetersiz\" kabul edilir?", "o": ["Yıllık getiri enflasyonun altında kalırsa", "Üst üste iki yıl zarar edilirse", "Yıllık nispi getiri negatif olursa", "Karşılaştırma ölçütünü %5'ten fazla geçemezse", "Pay fiyatı NAD'ın altında işlem görürse"], "a": 2, "e": "Yıllık performans sunum raporunda nispi getirinin negatif olması performansın yetersiz sayılması için yeterlidir."}, {"q": "Üst üste iki yıl performansı yetersiz sayılan ve portföyü aynı PYŞ tarafından yönetilen MKYO için öngörülen tedbir hangisidir?", "o": ["PYŞ'nin değiştirilmesi veya yönetimin şartlar sağlanırsa ortaklık bünyesine alınması", "Ortaklığın tasfiyesi", "Genel müdürün görevden alınması", "Payların borsada işlem görmesinin durdurulması", "Lider sermayedarın paylarını satması"], "a": 0, "e": "Aynı PYŞ yönetiyorsa PYŞ değiştirilir veya şartlar sağlanırsa yönetim bünyeye alınır; başvuru izleyen Şubat ayında yapılır."}, {"q": "Sabit sermayeli MKYO'nun statüden çıkışı hangi yolla mümkündür?", "o": ["Esas sözleşme değişikliğiyle sıradan anonim ortaklığa dönüşerek", "GYO'ya dönüşerek", "Tasfiye kararıyla", "Yalnızca değişken sermayeli ortaklığa dönüşüm yoluyla", "Kurul kararıyla doğrudan"], "a": 3, "e": "Sabit sermayeli ortaklık statüsünden çıkış sadece değişken sermayeli ortaklığa dönüşüm suretiyle mümkündür."}]}, {"id": 9, "kisa": "Portföy Yönetim Şirketleri", "baslik": "Portföy Yönetim Şirketleri ve Faaliyetleri (III-55.1)", "ozet": "PYŞ'lerin kuruluş ve faaliyet izni, personel şartları, sermaye yeterliliği, ortaklık değişiklikleri, yapamayacakları ve teminatlar.", "notlar": "<h3>Tanım ve faaliyet alanı<\/h3>\n<ul>\n<li><b>Portföy yönetim şirketi (PYŞ):<\/b> ana faaliyet konusu <b>yatırım fonlarının kurulması ve yönetimi<\/b> olan, anonim ortaklık şeklinde kurulan sermaye piyasası kurumu. Yatırım ortaklıklarının, emeklilik yatırım fonlarının (4632 sayılı Kanun) ve yurt dışı muadil KYK'ların portföy yönetimi de ana faaliyet konusudur.<\/li>\n<li><b>Kolektif yatırım kuruluşu:<\/b> SPKn kapsamındaki yatırım fonları ve yatırım ortaklıkları.<\/li>\n<li><b>Kolektif portföy yöneticiliği:<\/b> portföy yönetim sözleşmesi çerçevesinde müşteri portföylerinin her bir müşteri adına maddi menfaat sağlamak üzere <b>vekil sıfatıyla<\/b> yönetilmesi. Kapsamı UCITS'e paraleldir: portföy yönetimi, hukuki işlemler ve muhasebe, müşteri ilişkileri, değerleme ve pay fiyatı hesaplama, mevzuata uygunluğun izlenmesi, gelir-gider dağıtımı, katılma payı ihracı ve geri alımı.<\/li>\n<li>Dikkat: Fon portföyleri ile portföy yönetimini dışarıdan alan yatırım ortaklıklarının portföyleri <b>münhasıran PYŞ'lerce<\/b> yönetilir.<\/li>\n<li>Kolektif portföy yöneticiliği yetkisi olan PYŞ, <b>bireysel portföy yöneticiliği<\/b> de yapabilir. Yetki belgesiyle yatırım danışmanlığı ve Kurul izniyle fon payı pazarlama-dağıtımı yapabilir.<\/li>\n<li><b>Özel amaçlı PYŞ türleri:<\/b> münhasıran yurt dışında yerleşiklere pazarlanacak yabancı KYK kurmak ve yurt dışındakilere portföy yönetimi sunmak; münhasıran GSYF; münhasıran GYF; GYF ve GSYF birlikte.<\/li>\n<\/ul>\n\n<h3>Yan hizmetler (yetki belgesi yok, bildirim var)<\/h3>\n<table>\n<tr><th>Yan hizmet<\/th><th>Şart<\/th><\/tr>\n<tr><td>Yatırım araştırması, finansal analiz, genel tavsiye<\/td><td>Her PYŞ<\/td><\/tr>\n<tr><td>Sermaye piyasalarıyla ilgili danışmanlık<\/td><td>Sermaye yeterliliği tablosundaki (c) kademesi özsermaye<\/td><\/tr>\n<tr><td>Danışmanlık + <b>servet yönetimi ve finansal planlama<\/b><\/td><td>(ç) kademesi özsermaye<\/td><\/tr>\n<\/table>\n<ul>\n<li>Yan hizmetler faaliyet izni başvurusunda veya sonradan Kurula bildirilir; bildirimden itibaren <b>20 iş günü<\/b> içinde Kurul aksi görüş bildirmezse yürütülebilir.<\/li>\n<li><b>Temsil ve ilzam:<\/b> kurucusu olduğu fonları YK temsil eder; murahhas üyeye veya müdüre devredebilir. Ancak fonun <b>kuruluşu, pay ihracı, dönüşümü, tasfiyesi, yönetim ücreti artışı<\/b> ve yatırımcı kararlarını etkileyecek işlemler mutlaka <b>YK kararıyla<\/b> yapılır.<\/li>\n<\/ul>\n\n<h3>Kuruluş şartları<\/h3>\n<ul>\n<li>Kayıtlı sermaye sistemine tabi <b>anonim ortaklık<\/b>; payların tamamı <b>nama yazılı<\/b> ve <b>nakit karşılığı<\/b>.<\/li>\n<li><b>Başlangıç sermayesi en az 75.000.000 TL.<\/b><\/li>\n<li>Kurucu ortak şartları (10 madde): müflis/konkordato olmamak; izni iptal edilen kuruluşta sorumlu olmamak; Kanunda yazılı suçlardan mahkumiyet olmamak; 35 sayılı KHK'ya göre tasfiye kararı olmamak; ağır suçlardan mahkum olmamak; terör finansmanı suçlarından mahkum olmamak; işlem yasaklı olmamak; muaccel vergi borcu olmamak; dürüstlük ve itibar; <b>mali güç<\/b>. (1) ve (2) bentleri kararın kesinleşmesinden <b>on yıl<\/b> sonra aranmaz.<\/li>\n<li>Ortaklık yapısı şeffaf ve açık olmalı.<\/li>\n<li><b>Önemli etkiye sahip ortak:<\/b> sermaye veya oy haklarının dolaylı olarak <b>%5 veya fazlası<\/b>na ya da YK üyelerinin salt çoğunluğunu seçme/aday gösterme imtiyazına sahip olan. Bunlarda (1)-(9) bentleri (mali güç hariç) aranır.<\/li>\n<li>Kurucu veya önemli etkiye sahip ortak banka ise muaccel vergi borcu olmadığını belgelemesi ve <b>BDDK<\/b> uygun görüşü yeterlidir.<\/li>\n<li>Unvanda <b>\"portföy yönetimi\"<\/b> ibaresi zorunlu; münhasıran GSYF/GYF için kurulanlarda \"girişim sermayesi portföy yönetim şirketi\" veya \"gayrimenkul portföy yönetim şirketi\". İşletme adı Kurul izniyle kullanılır; ilan ve yazışmalarda ticaret unvanıyla birlikte yazılır.<\/li>\n<li>Kuruluş başvurusu belgelerin eksiksiz sunulmasından itibaren <b>altı ay<\/b> içinde karara bağlanır; uygun görülürse Ticaret Bakanlığına başvurulur. Tüzel kişi kurucuların bağımsız denetimli tabloları varsa noter onaylı beyanname gerekmez.<\/li>\n<\/ul>\n\n<h3>Faaliyet izni<\/h3>\n<ul>\n<li>Kuruluş izninin tebliğinden itibaren en geç <b>üç ay<\/b> içinde faaliyet izni ve yetki belgesi için başvurulur; aksi halde kuruluş izni iptal edilir. Makul gerekçeyle <b>bir defaya mahsus üç ay<\/b> uzatılabilir.<\/li>\n<li>Faaliyet izni şartları: kuruluş şartlarını korumak; sermaye yeterliliği; varsa teminatların Takasbank'ta bloke edilmesi; portföy saklayıcısıyla sözleşme; yönetici ve personel şartları; yeterli sayıda portföy yöneticisi; <b>araştırma birimi<\/b>; muhasebe ve bilgi işlem organizasyonu (münhasıran bu görev için bir personel); <b>genel müdürün atanmış olması<\/b>; çıkar çatışması, iç kontrol, risk yönetimi, teftiş, <b>fon hizmet birimi<\/b> ve dışarıdan hizmet alım yapısı.<\/li>\n<li>İhtisas personelinin görev tanımları yazılı hale getirilir, YK kararına bağlanır ve imza karşılığı teslim edilir. <b>İhtisas personeli:<\/b> araştırma uzmanı, fon müdürü, iç kontrol elemanı, müfettiş, portföy yöneticisi, risk yönetim personeli ve yatırım danışmanı.<\/li>\n<li>Kurucusu olduğu fonun portföy yönetimi başka bir PYŞ'den alınabilir; sözleşme <b>altı iş günü<\/b> içinde Kurula; yabancı yöneticiyle sözleşmede yetki belgesi ve sözleşme yürürlükten en geç <b>15 iş günü önce<\/b> Kurula gönderilir. Dikkat: Hizmet dışarıdan alınsa da PYŞ'nin <b>sorumluluğu devam eder<\/b>.<\/li>\n<li>Portföy saklayıcısı ve fona aracılık eden yatırım kuruluşunun yöneticileri PYŞ'de ortak, yönetici veya temsilci olamaz; tersi de geçerlidir.<\/li>\n<li>Yetki belgesinden önce harç yatırılır; Kurul bildiriminden itibaren <b>bir ay<\/b> içinde makbuz iletilmezse faaliyet izni iptal edilir.<\/li>\n<li>Faaliyet şartlarından biri kaybedilirse <b>üç iş günü<\/b> içinde Kurula bildirilir.<\/li>\n<\/ul>\n\n<h3>Faaliyetleri sınırlı PYŞ'ler<\/h3>\n<ul>\n<li>Münhasıran yabancı KYK, GSYF, GYF veya GYF+GSYF için kurulan şirketlerde başlangıç sermayesi ve asgari özsermaye tutarları <b>yarısı<\/b> olarak uygulanır. Sermaye yeterliliği tabloları ayda bir, dönemi izleyen <b>beş iş günü<\/b> içinde gönderilir.<\/li>\n<li>Bilgi sistemleri, araştırma, risk yönetimi ve fon hizmet birimi hizmetlerini dışarıdan alabilir. Tam zamanlı bir <b>muhasebe sorumlusu<\/b> istihdam edilir.<\/li>\n<li><b>Gayrimenkul PYŞ:<\/b> bireysel portföy yöneticiliği, yatırım danışmanlığı, başka fonların pazarlaması ve yan hizmetler <b>yapamaz<\/b>. YK'dan en az biri gayrimenkul yatırımlarında <b>en az beş yıl<\/b> tecrübeli; genel müdür <b>Düzey 3<\/b> lisanslı veya beş yıl tecrübeli. Lisanslı gayrimenkul değerleme uzmanı, bu YK üyesi ve genel müdürden oluşan <b>en az üç kişilik yatırım komitesi<\/b>. Para ve SPA kısmı için en az bir portföy yöneticisi veya dışarıdan hizmet (yalnız likidite amaçlı yatırımda aranmaz).<\/li>\n<li><b>Girişim sermayesi PYŞ:<\/b> aynı faaliyet yasakları; YK'dan biri GS yatırımlarında beş yıl tecrübeli; genel müdür Düzey 3 veya beş yıl GS tecrübesi; dört yıllık mezun, beş yıl GS tecrübeli bir kişi + YK üyesi + genel müdürden oluşan <b>en az üç kişilik<\/b> yatırım komitesi. Genel müdür, fon portföyündeki şirketlerde sınırlı olarak icrai görev alabilir.<\/li>\n<li>Münhasıran yabancı KYK için kurulan PYŞ yurt dışında yerleşiklere danışmanlık, portföy yönetimi ve yan hizmet verebilir; YK'dan biri ve genel müdür finansal piyasalarda <b>en az beş yıl<\/b> tecrübeli olmalıdır.<\/li>\n<\/ul>\n\n<h3>Çıkar çatışması, iç kontrol, risk yönetimi, teftiş<\/h3>\n<ul>\n<li>Çıkar çatışmasını en aza indiren örgütsel yapı; yazılı ve YK kararına bağlanmış <b>çıkar çatışması politikası<\/b>; kaçınılmaz çatışmada adil muamele ve bilgilendirme; şikayet prosedürü.<\/li>\n<li><b>İç kontrol:<\/b> politikalar YK kararıyla yürürlüğe girer; raporlar <b>aylık<\/b> YK'ya; icracı birimi olmayan bir YK üyesi iç kontrolden sorumlu; en az bir iç kontrol elemanı (en az <b>üç yıl<\/b> tecrübe + lisans, başka görev üstlenemez). İlk iki sermaye kademesindeki şirketlerde iç kontrol görevini müfettiş de yapabilir.<\/li>\n<li><b>Risk yönetimi:<\/b> birim portföy yönetiminden bağımsız; personelde <b>Düzey 3 ve Türev Araçlar<\/b> lisansı; en az bir kişi münhasıran bu işle sorumlu. GSYF/GYF yönetenlerde finansman ve likidite riski de kapsanır. Limit aşımı aynı gün; riskler günlük yöneticiye, <b>haftalık<\/b> YK'ya raporlanır.<\/li>\n<li><b>Teftiş birimi:<\/b> doğrudan YK'ya bağlı; YK yetkisini iç kontrolden sorumlu üyeye veya denetim komitesine devredebilir. Raporlar hesap dönemini izleyen <b>üç ay<\/b> içinde YK'ya, <b>en az beş yıl<\/b> saklanır; olağandışı durum raporu aynı gün Kurula.<\/li>\n<li><b>Fon hizmet birimi:<\/b> fon muhasebesi, nakit mutabakatı, alım-satım emirlerinin kontrolü, gün sonu raporları, mizan, bilanço, gelir-gider tablosu. Bünyesinde fon müdürü bulunur. Dikkat: <b>Fon müdürü portföy yöneticiliği yapamaz<\/b>; ayrılırsa <b>altı iş günü<\/b> içinde yenisi belirlenip Kurula bildirilir.<\/li>\n<\/ul>\n\n<h3>Merkez dışı örgütler<\/h3>\n<ul>\n<li>Acente, şube ve irtibat bürosu. Acentelik banka ve aracı kurumlarla tesis edilir; acente tanıtım, tahsil-tediye, doküman iletme ve sözleşme imzalatmayla sınırlıdır. Acente işlemlerinden hukuki sorumluluk PYŞ ile acentenin <b>müteselsil<\/b> sorumluluğudur; bunu hafifleten kayıt konulamaz. Acentelik Birliğe bildirilir.<\/li>\n<li><b>İrtibat bürosu<\/b> sorumlusu en az <b>iki yıllık ön lisans<\/b> mezunu ve <b>SPF Düzey 1<\/b> lisanslı olmalıdır.<\/li>\n<li>Merkez dışı örgüt açmak için noter onaylı YK kararıyla Kurul izni alınır; şube ve bürodan doğan hukuki ve cezai sorumluluk PYŞ'ye aittir.<\/li>\n<\/ul>\n\n<h3>Yapamayacakları ve acil durum planı<\/h3>\n<ul>\n<li><b>Aracılık faaliyetinde bulunamaz.<\/b><\/li>\n<li>Kendi mali taahhüdünü içeren evrak çıkaramaz, ödünç para veremez; kısa süreli nakit ihtiyacı ve teslim karşılığı ödeme kapsamı dışında kredi alamaz.<\/li>\n<li>Ticari, sınai, zirai faaliyette bulunamaz; gerekenden fazla taşınmaz edinemez; mevduat toplayamaz.<\/li>\n<li>Sermayesinin <b>%10'undan<\/b> fazlasına sahip ortaklarının ve yöneticilerinin ayrı ayrı veya birlikte <b>%25'inden<\/b> fazlasına sahip olduğu ortaklıklarda <b>pay sahibi olamaz<\/b>.<\/li>\n<li><b>Acil ve beklenmedik durum planı<\/b> zorunludur ve <b>yıllık<\/b> gözden geçirilir. Elektronik yedekler <b>beş yıl<\/b> saklanır. Plan YK onaylı; en az <b>genel müdür yardımcısı<\/b> düzeyinde bir sorumlu ve bir yedek atanır; iletişim bilgileri Kurul, MKK ve Takasbank'a bildirilir. Müşterilere sözleşme sırasında ve internet sitesinden bilgi verilir.<\/li>\n<\/ul>\n\n<h3>İzin iptali ve faaliyetin durdurulması<\/h3>\n<ul>\n<li>Nedenler: mevzuata aykırılık; mali yapının zayıflaması; kaybedilen şartların tebliğden itibaren <b>üç ay<\/b> içinde giderilmemesi; eksik teminatın <b>üç ay<\/b> içinde yatırılmaması; izinden açıkça feragat veya izin tarihinden itibaren <b>iki yıl<\/b> faaliyetsizlik; yanıltıcı beyanla izin alınması.<\/li>\n<li>Kendi isteğiyle faaliyetini <b>bir yıldan fazla<\/b> durduran şirketin izni iptal edilebilir.<\/li>\n<li><b>İki yıl içinde aynı faaliyeti iki kez<\/b> geçici durdurulan şirkete üçüncüde aynı müeyyide uygulanmaz, yetki belgesi iptal edilir.<\/li>\n<li>Geçici durdurmada azami <b>bir yıl<\/b> süre verilir; bir yıl daha uzatılabilir; sonunda faaliyete geçmezse tüm izinler iptal edilir.<\/li>\n<li>İzni iptal edilen şirket <b>üç ay<\/b> içinde unvan ve amaç maddesini değiştirir; değişiklik TTSG ilanını izleyen <b>altı iş günü<\/b> içinde Kurula gönderilir. Fonlar ve portföyler Kurulun uygun göreceği başka PYŞ'ye devredilir.<\/li>\n<\/ul>\n\n<h3>Dışarıdan hizmet alımı<\/h3>\n<ul>\n<li>Fon hizmet birimi ve bilgi sistemleri hizmetleri Kurul izniyle yatırım kuruluşlarından ve uzman kuruluşlardan alınabilir. Karar alma gücü ve sorumluluk PYŞ'de kalır; hizmet sözleşmeyle yürütülür.<\/li>\n<li>PYŞ, sağlayıcının yeterliliğini tespit eder; riskler acil durum planında yer alır. Dışarıdan alım, mevzuattan doğan sorumluluğu kaldırmaz. Yurt dışı sağlayıcıda Kurulun bilgi alma ve denetimine engel olmamalıdır.<\/li>\n<\/ul>\n\n<h3>Yönetici ve personel şartları<\/h3>\n<table>\n<tr><th>Görev<\/th><th>Tecrübe<\/th><th>Lisans<\/th><\/tr>\n<tr><td>Genel müdür ve genel müdür yardımcıları<\/td><td>Finansal piyasalarda <b>en az yedi yıl<\/b><\/td><td><b>SPF Düzey 3<\/b><\/td><\/tr>\n<tr><td>YK (en az <b>üç<\/b> kişi)<\/td><td><b>Çoğunluğu<\/b> finansal piyasalarda en az yedi yıl<\/td><td><b>En az biri<\/b> Düzey 3 + Türev Araçlar<\/td><\/tr>\n<tr><td>Fon müdürü<\/td><td>Sermaye piyasasında <b>en az yedi yıl<\/b><\/td><td><b>SPF Düzey 2<\/b><\/td><\/tr>\n<tr><td>İhtisas personeli ve birim yöneticileri<\/td><td>-<\/td><td>İlgili lisans<\/td><\/tr>\n<tr><td>Portföy yöneticisi yardımcısı<\/td><td>En fazla <b>üç yıl<\/b> çalışabilir (portföy yöneticisi lisanslarını alırsa <b>beş yıla<\/b> kadar)<\/td><td><b>SPF Düzey 1<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>YK başkan ve üyeleri ile genel müdür (1)-(9) bentlerini; genel müdür yardımcısı, ihtisas personeli ve birim yöneticileri (1)-(7) bentlerini taşır. Yöneticiler ve fon müdürü <b>dört yıllık lisans<\/b> mezunu olmalıdır.<\/li>\n<li>Genel müdür tam zamanlı ve münhasırdır; ancak şirkette <b>portföy yöneticisi<\/b> olabilir ve grup şirketleri, borsalar, takas ve saklama kuruluşlarında icrai olmayan YK üyeliği yapabilir.<\/li>\n<li>Genel müdür ayrılırsa <b>15 iş günü<\/b> içinde yeni aday Kurula bildirilir; <b>15 iş günü<\/b> içinde olumsuz görüş yoksa atanır ve <b>10 iş günü<\/b> içinde Birliğe bildirilir. Genel müdürlüğe bir yılda <b>üç aydan<\/b> fazla vekalet edilemez.<\/li>\n<li><b>Portföy yöneticisi sayısı<\/b> sermaye kademelerine göre sırasıyla en az <b>üç, dört, beş ve altı<\/b>. Hesapta kurucusu olduğu GYF ve GSYF portföyleri düşülür.<\/li>\n<li>Portföy yöneticileri ve fon müdürü tam zamanlı ve münhasıran çalışır.<\/li>\n<li><b>Mesleki özen:<\/b> dikkatli ve basiretli bir kişinin aynı koşullarda göstereceği dikkat. <b>Bağımsızlık:<\/b> PYŞ, portföy yöneticileri ve müfettişler bağımsız olmak zorundadır. <b>Sır saklama:<\/b> kamuyu aydınlatma, yetkili idari inceleme ve suç teşkil eden durumlara ilişkin bilgi verilmesi sır kapsamında değildir.<\/li>\n<\/ul>\n\n<h3>Ortaklık yapısı değişiklikleri<\/h3>\n<ul>\n<li>Esas sözleşme değişiklikleri <b>Kurul iznine<\/b> tabidir.<\/li>\n<li>Sermayenin <b>%10'u<\/b> veya fazlasını edinerek ortak olmak; bir ortağın payının <b>%10, %20, %33 veya %50'yi<\/b> aşması ya da bunların altına düşmesi <b>Kurul iznine<\/b> tabidir. Tüzel kişi ortaklardaki dolaylı değişiklikler için de aynı eşikler geçerlidir.<\/li>\n<li>Yönetime katılmada imtiyazlı veya intifa hakkı tanınan payların devri oran aranmaksızın Kurul iznine tabidir (bu payların çoğunluğuna sahip mevcut ortakların edinimi bildirimle yetinir).<\/li>\n<li>Eşik altındaki veya eşikler arasındaki devirler devri izleyen <b>10 iş günü<\/b> içinde Kurula bildirilir.<\/li>\n<li><b>Bir kişiye ait sayılanlar:<\/b> gerçek kişi + eşi + velayetindeki çocuklar + sınırsız sorumlu oldukları veya YK başkanı/üyesi/GM/GMY oldukları ortaklıklar; tüzel kişinin doğrudan/dolaylı <b>%25 veya fazlası<\/b>na iştirak ettiği ortaklıklar (kamu tüzel kişileri hariç); birlikte hareket edenler. Aykırı devirler pay defterine kaydedilmez.<\/li>\n<\/ul>\n\n<h3>Bildirimler<\/h3>\n<table>\n<tr><th>Nereye<\/th><th>Ne<\/th><th>Süre<\/th><\/tr>\n<tr><td>SPL<\/td><td>Ortak, yönetici ve personel şartlarındaki değişiklikler; personel giriş-çıkışları<\/td><td><b>10 iş günü<\/b><\/td><\/tr>\n<tr><td>Birlik (TSPB)<\/td><td>Murahhas üye kararları, iletişim bilgileri, bağımsız denetim kuruluşu, merkez ve şube adresleri, imza sirküleri, dava ve takipler, ilan gazeteleri<\/td><td><b>10 iş günü<\/b><\/td><\/tr>\n<tr><td>Kurul<\/td><td>Birlik/SPL tespit ettiği aykırılıklar<\/td><td><b>Üç iş günü<\/b><\/td><\/tr>\n<tr><td>Kurul<\/td><td>Genel müdür ve müfettişin ayrılma nedenleri<\/td><td>Aynı esaslarla<\/td><\/tr>\n<\/table>\n<ul>\n<li>Yetki belgeleri, şube izinleri, faaliyet durdurma ve iptaller derhal internet sitesi ve KAP'ta ilan edilir; şube izinleri <b>10 iş günü<\/b> içinde ticaret siciline tescil edilir.<\/li>\n<\/ul>\n\n<h3>Sermaye yeterliliği<\/h3>\n<table>\n<tr><th>Yönetilen portföy büyüklüğü<\/th><th>Asgari özsermaye<\/th><th>Asgari portföy yöneticisi<\/th><\/tr>\n<tr><td>2,4 milyar TL'ye kadar (a)<\/td><td><b>75.000.000 TL<\/b><\/td><td>3<\/td><\/tr>\n<tr><td>2,4 - 9,6 milyar TL (b)<\/td><td><b>97.500.000 TL<\/b><\/td><td>4<\/td><\/tr>\n<tr><td>9,6 - 90 milyar TL (c)<\/td><td><b>120.000.000 TL<\/b><\/td><td>5<\/td><\/tr>\n<tr><td>90 milyar TL'yi aşan (ç)<\/td><td><b>240.000.000 TL<\/b><\/td><td>6<\/td><\/tr>\n<\/table>\n<ul>\n<li>Portföy büyüklüğü son <b>üç ayın<\/b> tablolarının aritmetik ortalamasıdır. <b>180 milyar TL<\/b>'yi aşan tutarın <b>%0,02'si<\/b> kadar ilave özsermaye gerekir; özsermaye <b>480 milyon TL<\/b>'yi aşarsa ilave şart aranmaz.<\/li>\n<li><b>Hesaba dahil:<\/b> bireysel portföyler, yatırım ortaklıkları, emeklilik fonları ve kurucusu olduğu fonlar. <b>Dahil değil:<\/b> yalnız yöneticisi olduğu fonlar, alt portföy yöneticiliği yapılan portföyler, şirketin kendi portföyü.<\/li>\n<li><b>Alt portföy yöneticiliği:<\/b> başka bir PYŞ'nin veya yurt dışı kuruluşun portföyünün bir kısmının, onun müşterileriyle doğrudan sözleşme yapılmadan yönetilmesi.<\/li>\n<li>PYŞ aracı kurumların sermaye yeterliliği hükümlerine de tabidir. <b>Asgari ödenmiş sermaye 30.000.000 TL<\/b>'den az olamaz.<\/li>\n<li>Tablolar <b>15 günde bir<\/b>, dönemi izleyen <b>üç iş günü<\/b> içinde Kurula gönderilir.<\/li>\n<li>Asgari özsermaye şartı kuruluş tescilinden itibaren <b>iki yıl<\/b> boyunca <b>yarı oranda<\/b> uygulanır. Aykırılık sermaye artırımıyla tespitten itibaren <b>bir ay<\/b> içinde giderilir.<\/li>\n<li>Tutarlar her yıl Kurulca yeniden belirlenebilir; uyum ilgili yılın <b>altıncı ayı sonuna<\/b> kadar sağlanır.<\/li>\n<\/ul>\n\n<h3>Müşteri ilişkileri ve iştirakler<\/h3>\n<ul>\n<li>Müşteriye portföy varlıklarının nominal ve rayiç değerleri, hareketleri ile tahsil edilen ücretleri (ilişkili taraf ayrımıyla) gösteren <b>ekstre ve form<\/b> gönderilir; esas yöntem <b>iadeli taahhütlü<\/b>; müşterinin yazılı talebiyle elektronik. Müşterinin aksi yazılı talebi varsa gönderilmez.<\/li>\n<li><b>İştirak:<\/b> borsada işlem görmeyen paylara sahip olmak, %10 pay/oy veya YK temsil hakkı, ya da payların bir yıldan uzun elde tutulması. İştirakler toplamı <b>özsermayenin %25'ini<\/b> aşamaz (bedelsiz paylar ve fon çıkışı gerektirmeyen değer artışları hariç). Sermaye piyasası kurumları, sigorta, emeklilik, leasing, faktoring, finansman, varlık yönetim, varlık kiralama şirketlerine <b>sınırsız<\/b> iştirak edilebilir.<\/li>\n<li>5549 sayılı Kanun uyarınca hesap açmadan önce kimlik tespiti; müşterek hesapta her hak sahibi için ayrı.<\/li>\n<\/ul>\n\n<h3>Kolektif portföy yöneticiliği ilkeleri<\/h3>\n<ul>\n<li>İhraççı veya yatırım kuruluşundan lehine komisyon, iskonto gibi menfaat sağlıyorsa <b>KAP'ta açıklar<\/b>.<\/li>\n<li>Rayiç değerin üstünde alım, altında satım yapılamaz (borsa dışında: alımda en düşük, satımda en yüksek fiyat).<\/li>\n<li>Portföy varlıkları üzerinde kendi veya üçüncü kişiler lehine hukuki tasarrufta bulunamaz; yazılı talimat olmadan başkasına devredemez.<\/li>\n<li>Kendi nakdini, çıkar çatışması yaratmamak kaydıyla aynı araçlarda değerlendirebilir. Birden fazla portföy arasında birini kayıran işlem yapamaz.<\/li>\n<li>Yatırım kararlarına dayanak araştırma ve raporlar <b>en az beş yıl<\/b> saklanır.<\/li>\n<li>Belirli bir getiri <b>garanti edemez<\/b>; garantili ve koruma amaçlı fonlarda izahnamenin ötesinde açıklama yapamaz.<\/li>\n<li>Çatışmada müşteri lehine davranır; gereksiz alım-satım (churning) yapamaz; araştırma sonuçlarını müşteriden önce kullanamaz; pay işlemlerinde aracı kurumun <b>müşteri numarasıyla<\/b> işlem yapmasını sağlar.<\/li>\n<li><b>Portföy yönetim sözleşmesi:<\/b> kurucusu olduğu fonlar hariç yazılı sözleşme zorunlu; <b>inançlı devir<\/b> esasına dayanır; müteselsil sıra numaralı, en az <b>iki nüsha<\/b>. Sözleşmedeki portföy yöneticisi değişirse müşteriye derhal bildirilir; müşteri yeni yöneticiyi uygun görmezse sözleşmeyi <b>tek taraflı feshedebilir<\/b>. PYŞ, yöneticilerinin aykırı işlemlerinden müşteriye karşı <b>doğrudan<\/b> sorumludur.<\/li>\n<li>Müşteri varlıkları portföy saklayıcısında saklanır; PYŞ saklama ihlalinden doğan zararı saklayıcıdan talep etmekle yükümlüdür.<\/li>\n<li>Yetki verilirse faiz, temettü tahsili, yeni pay alma ve oy hakları kullanılabilir.<\/li>\n<li>Fon payı pazarlama ve dağıtımı için Kurul izni, esas sözleşmede hüküm ve uygun altyapı gerekir; başka PYŞ fonları için sözleşme zorunludur. Talimatlar ancak sözleşme imzalanan kişilerden kabul edilir.<\/li>\n<li>Reklam ve ilanlarda yanıltıcı, abartılı ifadeler kullanılamaz; portföy büyüklüğü ve müşteri sayısı gibi veriler yalnızca kamu kurumları veya meslek örgütü kaynağı gösterilerek kullanılır. İlan örnekleri <b>beş yıl<\/b> saklanır.<\/li>\n<\/ul>\n\n<h3>Teminatlar<\/h3>\n<ul>\n<li>Kurul, mali durum gerektirirse PYŞ'lerden belirli tutar veya oranda teminatı belirli süre için Kurul adına <b>Takasbank<\/b>'ta bloke ettirebilir.<\/li>\n<li>Teminat türleri: nakit, kamu borçlanma aracı, 4749 sayılı Kanunla ihraç edilen kira sertifikası, PYŞ ile ilişkisiz Türkiye'deki bir bankanın teminat mektubu, PYŞ'nin <b>kurucusu olmadığı<\/b> para piyasası fonu payları.<\/li>\n<li>Teminatlar başka amaçla kullanılamaz, devredilemez, kamu alacağı için bile <b>haczedilemez<\/b>, rehnedilemez, iflas masasına girmez.<\/li>\n<li>Takasbank teminatları <b>aylık<\/b> izler; ilk yatırma veya tamamlama <b>beş iş günü<\/b> içinde yapılmazsa Kurula bildirir; yıl sonunu izleyen <b>20 iş günü<\/b> içinde rapor verir.<\/li>\n<li>Geçici durdurulan şirketin teminatı, yeniden faaliyete geçip kesintisiz <b>en az bir yıl<\/b> çalışmasından sonra serbest bırakılır.<\/li>\n<li>İzni iptal edilen ve iflas etmeyen şirket: denetim/şikayet yokluğu, Borsa, Takasbank, MKK, Birlik ve Kurula borç olmaması ve unvan değişikliği şartlarıyla başvurur.<\/li>\n<li>İflas edenlerde teminat iflas tasfiyesine kadar tutulur; aciz vesikalı alacaklılar için en az iki gazetede ve <b>beş iş günü<\/b> KAP'ta ilan; ilanı izleyen <b>üçüncü ayın<\/b> sonuna kadar başvuranlara garameten ödeme; kalan bakiye <b>altıncı ayın<\/b> sonunda iflas dairesine.<\/li>\n<\/ul>", "sorular": [{"q": "Bir portföy yönetim şirketinin kuruluşunda başlangıç sermayesi en az ne kadar olmalıdır?", "o": ["30.000.000 TL", "50.000.000 TL", "97.500.000 TL", "75.000.000 TL", "120.000.000 TL"], "a": 3, "e": "PYŞ'nin başlangıç sermayesi en az 75 milyon TL'dir; 30 milyon TL ise asgari ödenmiş sermaye tutarıdır."}, {"q": "PYŞ'lerde \"önemli etkiye sahip ortak\" kavramı hangi eşikle tanımlanır?", "o": ["Doğrudan %10 veya fazla pay", "Dolaylı olarak sermaye veya oy haklarının %5 veya fazlası ya da YK'nın salt çoğunluğunu seçme imtiyazı", "%20 veya fazla pay", "%25 veya fazla pay", "%50'den fazla pay"], "a": 1, "e": "Önemli etkiye sahip ortak dolaylı %5 veya fazla paya ya da YK üyelerinin salt çoğunluğunu seçme/aday gösterme imtiyazına sahip ortaktır."}, {"q": "PYŞ, kuruluş izninin tebliğinden itibaren faaliyet izni için en geç ne kadar sürede başvurmalıdır?", "o": ["Bir ay", "İki ay", "Bir yıl", "Altı ay", "Üç ay"], "a": 4, "e": "Kuruluş izninin tebliğinden itibaren en geç üç ay içinde başvurulur; makul gerekçeyle bir defaya mahsus üç ay uzatılabilir."}, {"q": "Yönetilen portföy büyüklüğü 5 milyar TL olan bir PYŞ'nin sahip olması gereken asgari özsermaye ve istihdam etmesi gereken asgari portföy yöneticisi sayısı hangisidir?", "o": ["75.000.000 TL ve 3", "120.000.000 TL ve 5", "97.500.000 TL ve 4", "240.000.000 TL ve 6", "97.500.000 TL ve 3"], "a": 2, "e": "2,4-9,6 milyar TL aralığında asgari özsermaye 97,5 milyon TL ve asgari portföy yöneticisi sayısı dörttür."}, {"q": "PYŞ'nin asgari özsermaye hesaplamasına esas yönetilen portföy büyüklüğüne aşağıdakilerden hangisi dahil edilmez?", "o": ["Sadece yöneticisi olduğu fonların portföyleri", "Yatırım ortaklıklarının portföyleri", "Emeklilik yatırım fonlarının portföyleri", "Kurucusu olduğu fonların portföyleri", "Bireysel portföy yöneticiliği hizmeti verilen kişilerin portföyleri"], "a": 0, "e": "Yalnız yöneticisi olunan fonlar, alt portföy yöneticiliği yapılan portföyler ve şirketin kendi portföyü hesaba dahil edilmez."}, {"q": "PYŞ genel müdürü için aranan tecrübe ve lisans şartı hangisidir?", "o": ["Beş yıl ve SPF Düzey 2", "Üç yıl ve Türev Araçlar lisansı", "Yedi yıl ve SPF Düzey 2", "Yedi yıl ve SPF Düzey 3", "On yıl ve SPF Düzey 3"], "a": 3, "e": "Genel müdür ve yardımcıları finansal piyasalarda en az yedi yıl tecrübeye ve SPF Düzey 3 lisansına sahip olmalıdır."}, {"q": "PYŞ'lerde fon müdürü ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["SPF Düzey 3 lisansı aranır", "En az yedi yıl sermaye piyasası tecrübesi ve SPF Düzey 2 lisansı aranır", "Portföy yöneticiliği de yapabilir", "Ayrılması halinde 30 gün içinde yenisi atanır", "Dört yıllık lisans şartı aranmaz"], "a": 1, "e": "Fon müdürü yedi yıl tecrübe ve Düzey 2 lisansı ister, portföy yöneticiliği yapamaz, ayrılırsa altı iş günü içinde yenisi belirlenir."}, {"q": "Portföy yöneticisi yardımcısı olarak çalışan bir kişinin sahip olması gereken lisans ve bu görevde azami çalışma süresi hangisidir?", "o": ["SPF Düzey 1; en fazla on yıl", "SPF Düzey 2; en fazla iki yıl", "SPF Düzey 3; süre sınırı yok", "Lisans aranmaz; en fazla bir yıl", "SPF Düzey 1; en fazla üç yıl (lisanslarını tamamlarsa beş yıla kadar)"], "a": 4, "e": "Yardımcı personel Düzey 1 lisansına sahip olmalı; en fazla üç yıl çalışabilir, portföy yöneticiliği lisanslarını alırsa süre beş yıla uzar."}, {"q": "Bir ortağın PYŞ'deki payının aşağıdaki eşiklerden hangisini aşması Kurul iznine tabi değildir?", "o": ["%10", "%20", "%25", "%33", "%50"], "a": 2, "e": "Kurul iznine tabi eşikler %10, %20, %33 ve %50'dir; %25 bu eşikler arasında yer almaz."}, {"q": "PYŞ'lerin yapamayacağı işlerle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Sermayesinin %10'undan fazlasına sahip ortaklarının ortaklıklarına sınırsız yatırım yapabilir", "Ödünç para verme işlemi yapamaz", "Kısa süreli nakit ihtiyacını karşılamak için kredi alabilir", "Aracılık faaliyetinde bulunamaz", "Mevduat toplayamaz"], "a": 0, "e": "PYŞ, sermayesinin %10'undan fazlasına sahip ortakların ve yöneticilerinin %25'ten fazlasına sahip olduğu ortaklıklarda pay sahibi olamaz."}, {"q": "PYŞ'lerin iştirak sınırı ile ilgili hangisi doğrudur?", "o": ["İştirakler özsermayenin %10'unu aşamaz", "İştirakler aktif toplamın %50'sini aşamaz", "Hiçbir şirkete iştirak edemez", "İştirakler özsermayenin %25'ini aşamaz; sigorta ve faktoring gibi finansal kuruluşlara sınırsız iştirak edilebilir", "Yalnızca diğer PYŞ'lere iştirak edebilir"], "a": 3, "e": "İştirak toplamı özsermayenin %25'ini aşamaz; sermaye piyasası kurumları, sigorta, leasing, faktoring gibi finansal kuruluşlara sınırsız iştirak edilebilir."}, {"q": "Kurulun PYŞ'nin faaliyet iznini iptal edebileceği hallerden biri olarak, izin tarihinden itibaren ne kadar süre faaliyette bulunulmaması sayılmıştır?", "o": ["Altı ay", "İki yıl", "Bir yıl", "Üç yıl", "Beş yıl"], "a": 1, "e": "Faaliyet izninin verildiği tarihten itibaren iki yıl faaliyette bulunulmaması iptal nedenidir."}, {"q": "İki yıl içinde aynı faaliyeti iki kez geçici olarak durdurulan PYŞ'ye üçüncü kez aynı durum söz konusu olursa ne olur?", "o": ["Yeniden geçici durdurma uygulanır", "İdari para cezası verilir", "Yönetim kurulu görevden alınır", "Süre bir yıl uzatılır", "İlgili faaliyet iznini içeren yetki belgesi iptal edilir"], "a": 4, "e": "Üçüncü kez aynı müeyyide uygulanmaz, ilgili yetki belgesi iptal edilir."}, {"q": "PYŞ'nin sermaye yeterliliği tabloları hangi sıklıkla ve hangi sürede Kurula gönderilir?", "o": ["Ayda bir, beş iş günü içinde", "Haftada bir, ilk iş günü", "15 günde bir, dönemi izleyen üç iş günü içinde", "Üç ayda bir, on iş günü içinde", "Yılda bir, 30 gün içinde"], "a": 2, "e": "Tablolar 15 günde bir, dönemi izleyen üç iş günü içinde gönderilir (faaliyetleri sınırlı PYŞ'lerde ayda bir, beş iş günü)."}, {"q": "Portföy yönetim sözleşmesiyle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Sözleşme inançlı devir esasına dayanır ve en az iki nüsha düzenlenir", "Kurucusu olduğu fonlar için de yazılı sözleşme zorunludur", "Portföy yöneticisi değişirse müşteri sözleşmeyi feshedemez", "PYŞ yöneticilerinin işlemlerinden yalnızca dolaylı sorumludur", "Sözleşmede PYŞ lehine olağanüstü haklar tanınabilir"], "a": 0, "e": "Sözleşme inançlı devir esasına göre yönetimi içerir, en az iki nüsha düzenlenir; yönetici değişikliğinde müşteri tek taraflı feshedebilir; PYŞ doğrudan sorumludur."}, {"q": "Kurulun mali durum gerektirdiğinde PYŞ'lerden isteyebileceği teminat olarak aşağıdakilerden hangisi kabul edilmez?", "o": ["Nakit", "Kamu borçlanma aracı", "PYŞ ile ilişkisi olmayan Türkiye'deki bankanın teminat mektubu", "PYŞ'nin kurucusu olduğu para piyasası fonu payları", "4749 sayılı Kanunla ihraç edilen kira sertifikası"], "a": 3, "e": "Para piyasası fonu payları ancak PYŞ'nin kurucusu olmadığı fonlara ait olursa teminat olabilir."}, {"q": "Gayrimenkul portföy yönetim şirketleri için aşağıdakilerden hangisi doğrudur?", "o": ["Bireysel portföy yöneticiliği yapabilir", "Değerleme uzmanı, ilgili YK üyesi ve genel müdürden oluşan en az üç kişilik yatırım komitesi zorunludur", "Yatırım danışmanlığı yapabilir", "Başka PYŞ'lerin fonlarının pazarlamasını yapabilir", "Genel müdür için hiçbir lisans veya tecrübe aranmaz"], "a": 1, "e": "Gayrimenkul PYŞ'de en az üç kişilik yatırım komitesi zorunludur; bireysel portföy yöneticiliği, danışmanlık, başka fonların pazarlaması ve yan hizmetler yasaktır."}, {"q": "Acil ve beklenmedik durum planı ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Yönetim kurulunca onaylanır", "Yıllık olarak gözden geçirilir", "Elektronik kayıt yedekleri beş yıl saklanır", "Uygulamadan sorumlu kişi en az genel müdür yardımcısı düzeyinde olmalıdır", "Müşterilere bu konuda bilgi verilmesi gerekmez"], "a": 4, "e": "Müşterilere iş sürekliliği hakkında sözleşme sırasında ve internet sitesinden bilgi verilmesi zorunludur."}]}, {"id": 10, "kisa": "Yatırım Fonları", "baslik": "Yatırım Fonları (III-52.1)", "ozet": "Şemsiye fon yapısı, fon türleri ve unvan kuralları, pay ihracı ve alım satımı, portföy sınırları, özel fon türleri, gider oranları ve TEFAS.", "notlar": "<h3>Temel kavramlar<\/h3>\n<ul>\n<li>III-52.1 sayılı Tebliğ; BYF, GYF ve GSYF dışındaki yatırım fonlarını düzenler. Kurucu, yönetici ve portföy saklayıcısının fona ilişkin tüm hesap ve işlemleri Kurul denetimindedir.<\/li>\n<li><b>Yatırım fonu:<\/b> tasarruf sahiplerinden katılma payı karşılığında toplanan para veya varlıklarla, onlar hesabına <b>inançlı mülkiyet<\/b> esasına göre portföy işletmek amacıyla PYŞ'lerce <b>içtüzükle<\/b> kurulan, <b>tüzel kişiliği olmayan<\/b> malvarlığı.<\/li>\n<li><b>Fon:<\/b> katılma payları bir şemsiye fona bağlı olarak ihraç edilen yatırım fonu. <b>Şemsiye fon:<\/b> katılma payları <b>tek bir içtüzük<\/b> kapsamında ihraç edilen tüm fonları kapsayan yapı.<\/li>\n<li><b>Fon toplam değeri:<\/b> fon portföy değeri + diğer varlıklar ve alacaklar − borçlar.<\/li>\n<li>Kurucu ve yönetici <b>münhasıran PYŞ<\/b>; varlıklar portföy saklayıcısında saklanır. Azami fon tutarı uygulaması kaldırıldı, <b>açık uçlu<\/b> yapıya geçildi. Faizsiz ürün tercih edenler için <b>katılım fonu<\/b> türü tanımlandı.<\/li>\n<li>Dikkat: BYF, GYF ve GSYF dışındaki tüm yatırım fonlarının <b>şemsiye fon şeklinde<\/b> kurulması zorunludur.<\/li>\n<\/ul>\n\n<h3>Şemsiye fon yapısı ve fon malvarlığı<\/h3>\n<ul>\n<li>Şemsiye fon, MKYO ile aynı varlık listesinden oluşan portföyü işletir (paylar, borçlanma araçları, yabancı araçlar, <b>12 aydan uzun olmayan<\/b> mevduat/katılma hesabı ve mevduat sertifikası, borsada işlem gören kıymetli madenler, fon payları, repo-ters repo, kira ve gayrimenkul sertifikaları, varant ve sertifikalar, Takasbank ve yurtiçi organize para piyasası, türev teminat ve primleri vb.).<\/li>\n<li>Her fon için ayrı <b>izahname ve yatırımcı bilgi formu<\/b>. Her fonun varlık ve yükümlülükleri ayrıdır. Şemsiye fonun kuruluş giderleri ve fonların ihraç giderleri hariç ortak giderler fon büyüklüklerine göre oransal paylaştırılır. Şemsiye fon tasfiye edilir veya devredilirse bağlı fonlar da tasfiye edilir veya devredilir.<\/li>\n<li>Fon malvarlığı kurucunun ve saklayıcının malvarlığından <b>ayrıdır<\/b>.<\/li>\n<li>Portföy, sermaye piyasasında <b>en az beş yıl<\/b> tecrübeli portföy yöneticilerince yönetilir (DSYO'da üç yıl).<\/li>\n<li>Fon malvarlığı; kredi, türev, <b>açığa satış<\/b> ve benzeri fon işlemleri dışında teminat gösterilemez ve rehnedilemez. Kurucunun veya saklayıcının yönetimi kamuya devredilse dahi başka amaçla kullanılamaz, kamu alacakları için bile <b>haczedilemez<\/b>, ihtiyati tedbir konulamaz, iflas masasına girmez. Kurucunun borçlarıyla fonun alacakları mahsup edilemez.<\/li>\n<li><b>İçtüzük:<\/b> katılma payı sahipleri ile kurucu, saklayıcı ve varsa yönetici arasında; portföyün inançlı mülkiyetle işletilmesini, saklanmasını, <b>vekalet akdi<\/b> hükümlerine göre yönetimini düzenleyen genel işlem şartları içeren <b>iltihaki sözleşme<\/b>. Standardı Kurulca belirlenir.<\/li>\n<li>Kurucu fonun temsili, yönetimi ve denetiminden sorumludur; portföy yöneticiliği dahil dışarıdan hizmet alınması sorumluluğunu kaldırmaz.<\/li>\n<\/ul>\n\n<h3>Şemsiye fon türleri<\/h3>\n<table>\n<tr><th>Tür<\/th><th>Kural<\/th><\/tr>\n<tr><td>Borçlanma araçları<\/td><td>Fon toplam değerinin en az <b>%80'i<\/b> devamlı olarak borçlanma araçlarında<\/td><\/tr>\n<tr><td>Hisse senedi<\/td><td>Yerli/yabancı paylara yatıran fonlar<\/td><\/tr>\n<tr><td>Kıymetli madenler<\/td><td>Borsada işlem gören altın ve kıymetli madenler ile bunlara dayalı araçlar<\/td><\/tr>\n<tr><td>Fon sepeti<\/td><td>Diğer fonların ve BYF'lerin paylarından oluşan fonlar<\/td><\/tr>\n<tr><td>Para piyasası<\/td><td>Tamamı vadesine en fazla <b>184 gün<\/b> kalmış likit araçlar; ağırlıklı ortalama vade en fazla <b>45 gün<\/b><\/td><\/tr>\n<tr><td>Katılım<\/td><td>Tamamı kira sertifikası, katılma hesabı, pay, altın gibi faizsiz araçlar<\/td><\/tr>\n<tr><td>Değişken<\/td><td>Diğer türlere girmeyenler<\/td><\/tr>\n<tr><td>Serbest<\/td><td>Payları <b>yalnızca nitelikli yatırımcılara<\/b> satılan<\/td><\/tr>\n<tr><td>Garantili<\/td><td>Başlangıç yatırımının bir kısmı, tamamı veya üzerinde getiri, <b>garantörün garantisine<\/b> dayanılarak taahhüt edilir<\/td><\/tr>\n<tr><td>Koruma amaçlı<\/td><td>Koruma <b>en iyi gayret<\/b> esasıyla amaçlanır (garanti yok)<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Hisse senedi yoğun fon:<\/b> portföy değerinin en az <b>%80'i<\/b> devamlı olarak BİAŞ'ta işlem gören paylardan (<b>MKYO payları hariç<\/b>) oluşan ve hisse senedi veya serbest şemsiye fona bağlı fon. Pay/endeks vadeli işlem teminatları, opsiyon primleri, pay varantları ve pay endeksini takip eden BYF payları %80'e dahildir. Şartlar günlük sağlanmazsa yükümlülüklerden kurucu ve saklayıcı <b>müteselsilen<\/b> sorumludur. Unvanın sonunda \"(Hisse Senedi Yoğun Fon)\" yer alır.<\/li>\n<\/ul>\n\n<h3>Fon unvanı<\/h3>\n<ul>\n<li>Yatırım stratejisine uygun olmalı, yanıltıcı ve üstünlük ima eden ifade içermemeli. Asgari: zorunlu ibareler, şemsiye fon türü ve kurucunun unvanı; buna ek olarak <b>en fazla bir ibare<\/b>. \"Gelecek, performans, getiri, küresel, odak, global\" gibi subjektif ifadeler ve TEFAS fonlarında dağıtıcı kurum ibaresi kullanılamaz.<\/li>\n<li>Endeks varlıklarından oluşan fonlarda <b>\"Endeks\"<\/b>; iştiraklerin araçlarından oluşanlarda <b>\"İştirak\"<\/b>; belirli yatırımcılara tahsislilerde en sonda <b>\"Özel\"<\/b> (uluslararası anlaşmayla belirli ülke vatandaşlarına satışı kısıtlı fonlar özel sayılmaz).<\/li>\n<li>Yabancı araçlara en az <b>%80<\/b> yatıranlarda <b>\"Yabancı\"<\/b> zorunlu. Bu ibare olmayan hisse ve borçlanma araçları fonlarında yabancı araçlar en fazla <b>%20<\/b> olabilir.<\/li>\n<li>En az %80'i <b>döviz cinsinden<\/b> (yerli ve yabancı ihraççı) araçlardan oluşanlarda <b>\"(Döviz)\"<\/b>; %80 yalnız yabancı ihraççılarla sağlanacaksa \"(Döviz)\" yerine \"Yabancı\". Döviz, altın ve kıymetli maden bulunmayan fonlarda <b>\"(TL)\"<\/b>.<\/li>\n<li>Vade ibaresi unvanın <b>en başında<\/b> yer alır (örnek: Orta Vadeli Özel Sektör Borçlanma Araçları Fonu). Aynı varlık grubunda iki araç her biri en az <b>%40<\/b> ise iki ibare birlikte kullanılabilir (örnek: Altın ve Gümüş Fonu).<\/li>\n<li>Garantili ve koruma amaçlı fonların unvanında koruma/garanti oranı yer alır (örnek: %102 Anapara Koruma Amaçlı Fon).<\/li>\n<\/ul>\n\n<h3>Kuruluş ve pay ihracı<\/h3>\n<ul>\n<li>Kurucu taslak içtüzük ve başvuru formuyla başvurur; saklama sözleşmesinin yeni şemsiye fonu da kapsaması gerekir. Başvuru belgelerin eksiksiz sunulmasından itibaren <b>iki ay<\/b> içinde karara bağlanır.<\/li>\n<li>Onaylanan içtüzük, kararın tebliğinden itibaren <b>altı iş günü<\/b> içinde ticaret siciline tescil edilir ve TTSG ile KAP'ta ilan edilir.<\/li>\n<li>Katılma payları halka arz edilir veya belirli kişilere tahsisli ya da nitelikli yatırımcılara satılır. İlk fonun ihraç başvurusu içtüzük tescilinden itibaren en geç <b>üç ay<\/b> içinde yapılır; yapılmazsa içtüzük terkin ettirilir (belgeler <b>altı iş günü<\/b> içinde Kurula). Süre makul gerekçeyle bir defaya mahsus <b>üç ay<\/b> uzatılabilir.<\/li>\n<li>İzahname <b>20 iş günü<\/b> içinde incelenir; eksik belge varsa başvurudan itibaren <b>10 iş günü<\/b> içinde bildirilir ve 20 günlük süre eksiklerin tamamlanmasından itibaren başlar. Onay, Kurulun bilgilerin doğruluğunu tekeffülü veya tavsiye anlamına gelmez.<\/li>\n<li>İzahname ve yatırımcı bilgi formu izin yazısının tebliğinden itibaren <b>10 iş günü<\/b> içinde KAP'ta ve kurucunun internet sitesinde yayımlanır; ticaret siciline tescil edilmez, yalnız nerede yayımlandığı tescil ve ilan edilir.<\/li>\n<li>Toplanan para <b>izleyen iş günü<\/b> izahnamedeki varlıklara yatırılır; garantili ve koruma amaçlı fonlarda talep toplamanın bitiminden itibaren <b>iki iş günü<\/b>.<\/li>\n<li><b>Yatırımcı bilgi formu:<\/b> fonu tanıtıcı bilgi, yatırım amacı ve portföy dağılımı, geçmiş performans veya senaryo analizi, ücret ve toplam gider oranı, risk-getiri profili, alım satım esasları. <b>Azami iki sayfa, 12 punto.<\/b> Kurucu formun doğruluğundan sorumludur. Serbest fonlarda ihtiyari; ancak TEFAS'taki serbest fonlarda zorunludur ve bunlar aylık portföy dağılım raporunu izleyen ayın <b>altı iş günü<\/b> içinde KAP'ta ilan eder.<\/li>\n<\/ul>\n\n<h3>Doküman değişiklikleri<\/h3>\n<ul>\n<li>Yatırımcı kararını etkileyen içtüzük ve izahname değişikliklerinde duyuru izin yazısının tebliğini izleyen iş günü KAP'ta ve internet sitesinde ilan edilir; yürürlük tarihi <b>en az 10 iş günü<\/b> sonra olmalıdır.<\/li>\n<li>Yatırımcı bilgi formu değişikliklerinde Kurul onayı aranmaz; değişiklik <b>altı iş günü önce<\/b> Kurula bildirilir ve izleyen iş günü KAP'ta ilan edilir.<\/li>\n<li>Dönüşüm ve birleşmede Kurul onaylı duyuru izin yazısını izleyen <b>altı iş günü<\/b> içinde ilan edilir ve yürürlük yayımdan itibaren <b>en az 30 gün<\/b> sonradır. Masraflar kurucuya aittir, fona yansıtılmaz.<\/li>\n<\/ul>\n\n<h3>Katılma payı değeri ve alım satımı<\/h3>\n<ul>\n<li><b>Katılma payı:<\/b> fona katılımı gösteren, kayden izlenen SPA; <b>itibari değeri yoktur<\/b>. Birim pay değeri = fon toplam değeri / pay sayısı; alım satıma esas fiyattır. Günlük hesaplama ve ilan esastır; aynı gün iki fiyat açıklanabilir.<\/li>\n<li>Para piyasası ve kısa vadeli borçlanma araçları fonları dışında emirler <b>ileri fiyatla<\/b> (emirden sonraki ilk hesaplanan fiyat); bu iki türde <b>en son ilan edilen<\/b> fiyatla gerçekleşir.<\/li>\n<li>Olağanüstü durumlarda Kurulun uygun görmesiyle fiyat hesaplanmayabilir ve alım satım durdurulabilir. Fon <b>temettü dağıtabilir<\/b>.<\/li>\n<li>Alımda bedel tam ve nakden ödenir. En az %80'i altına yatıran fonlarda Kurul onayıyla <b>altın<\/b> da kullanılabilir. Yabancı veya döviz fonlarında Kurul onayıyla TCMB kurlarıyla döviz üzerinden işlem yapılabilir.<\/li>\n<li>Giriş-çıkış komisyonu uygulanabilir; kurucu/yönetici ile ilişkili fonların portföye alınmasında giriş-çıkış komisyonu ödenmez.<\/li>\n<li>İzahnamede hüküm ve Borsa uygun görürse paylar borsada işlem görebilir. Kurucu fon paylarını kendi portföyüne alabilir ve satıştan önce fona <b>avans<\/b> verebilir.<\/li>\n<li>Yönetim ücretinin bölünmesi veya giriş-çıkış komisyonuyla aynı fon içinde farklı <b>pay grupları<\/b> oluşturulabilir.<\/li>\n<\/ul>\n\n<h3>Portföy sınırlamaları<\/h3>\n<table>\n<tr><th>Sınır (fon toplam değerine göre)<\/th><th>Oran<\/th><\/tr>\n<tr><td>Tek ihraççı (+ türevleri)<\/td><td>En fazla <b>%10<\/b> (ipotek ve varlık teminatlı MK'da %25)<\/td><\/tr>\n<tr><td>%5'i aşan ihraççıların toplamı<\/td><td>En fazla <b>%40<\/b><\/td><\/tr>\n<tr><td>Aynı grup<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Bir ihraççının tedavüldeki borçlanma araçları<\/td><td>En fazla <b>%10'u<\/b><\/td><\/tr>\n<tr><td>TCMB, Hazine ve Maliye Bakanlığı, ipotek finansman kuruluşu, <b>Türkiye Varlık Fonu<\/b><\/td><td>Bu sınırlar yok; tek varlık en fazla <b>%35<\/b><\/td><\/tr>\n<tr><td>Varlık kiralama şirketleri<\/td><td>%10 → <b>%25<\/b>; %40 yok; grup %20 → <b>%35<\/b>; 4749 sayılı Kanunla kurulan VKŞ'lerde sınır yok<\/td><\/tr>\n<tr><td>İpoteğe dayalı ve varlığa dayalı menkul kıymetler (konut ve varlık finansmanı fonları)<\/td><td>a-b-c sınırları yok; her biri en fazla <b>%35<\/b>; alımda yatırım yapılabilir seviyenin <b>ilk üç kademesinde<\/b> not<\/td><\/tr>\n<tr><td>Bir ihraççının sermaye veya oy hakları<\/td><td>Tek fon <b>%10<\/b>; aynı kurucunun aynı yöneticideki fonları toplam <b>%20<\/b><\/td><\/tr>\n<tr><td>Yöneticinin hakim ortaklarıyla ilişkili ihraççılar<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>Varant ve sertifikalar<\/td><td>Toplam <b>%10<\/b>, tek ihraççı <b>%5<\/b><\/td><\/tr>\n<tr><td>Mevduat/katılma hesabı (en fazla 12 ay)<\/td><td>Toplam <b>%10<\/b>, tek banka <b>%3<\/b>; katılım fonlarında <b>%25<\/b> ve <b>%10<\/b><\/td><\/tr>\n<tr><td>Kurucunun grup şirketlerinin aracılık ettiği halka arzlar<\/td><td>İhraç miktarının <b>%10'u<\/b>, fonun <b>%5'i<\/b><\/td><\/tr>\n<tr><td>Fon payları, MKYO payları, yabancı BYF ve yabancı fonlar<\/td><td>Toplam en fazla <b>%20<\/b>; tek fon <b>%10<\/b>; Türkiye'deki BYF'ler toplam sınıra tabi değil, tek BYF <b>%20<\/b><\/td><\/tr>\n<tr><td>Repo (repoya konu varlıkların rayiç değeri)<\/td><td><b>%10<\/b><\/td><\/tr>\n<tr><td>Kredi ve borçlanma amaçlı Takasbank işlemleri<\/td><td>Fon değerinin <b>%10'u<\/b> (kredi bilgileri KAP'ta açıklanır)<\/td><\/tr>\n<tr><td>Borsa dışı ters repo<\/td><td><b>%10<\/b><\/td><\/tr>\n<tr><td>Takasbank ve organize para piyasası<\/td><td>En fazla <b>%20<\/b><\/td><\/tr>\n<tr><td>SPA ödünç verme<\/td><td>Piyasa değerinin <b>%50'si<\/b>; en az %100 teminat<\/td><\/tr>\n<tr><td>Kıymetli maden ödünç verme<\/td><td>Piyasa değerinin <b>%75'i<\/b><\/td><\/tr>\n<tr><td>Türevlerden açık pozisyon<\/td><td>Fon toplam değerini aşamaz<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: Fon <b>açığa satış ve kredili işlem yapamaz<\/b>; <b>ödünç alma<\/b> yalnızca <b>serbest fonlarda<\/b> mümkündür.<\/li>\n<li>Türev kullanan fonlarda tüm portföy yöneticilerinde <b>ileri düzey (Düzey 3)<\/b> ve <b>Türev Araçlar<\/b> lisansı zorunludur.<\/li>\n<li>Borsa dışı sözleşmeler: stratejiye uygun, karşı taraf yatırım yapılabilir notlu, objektif koşullu ve adil fiyatlı, fiyat açıklama dönemlerinde gerçeğe uygun değerle nakde çevrilebilir olmalıdır.<\/li>\n<li>Vade ibaresi için aylık ağırlıklı ortalama vade: <b>25-90 gün<\/b> kısa, <b>91-730<\/b> orta, <b>730'dan fazla<\/b> uzun. Orta ve uzun vadelilerde vadesi hesaplanamayan varlık en fazla <b>%20<\/b>.<\/li>\n<li>Vade hesabı: iskontolu araçta itfaya kalan süre; sabit kuponluda <b>Macaulay duration<\/b>; değişken faizlide ilk/sonraki kupona kalan süre; TÜFE'ye endekslide anaparanın itfasına kalan süre.<\/li>\n<li>Pasif sınır aşımı (fiyat, temettü, rüçhan) <b>30 gün<\/b> içinde giderilir; Kurul uzatabilir; başvurulmazsa dönüşüm veya tasfiye istenebilir.<\/li>\n<li>Tahsisli fonlarda yatırımcı şirketlerin araçları tek şirket <b>%5<\/b>, toplam <b>%25<\/b>. Endeks fonlarında endeks ile birim pay değeri arasında korelasyon <b>en az %90<\/b>; altına düşerse izleyen ayın ilk <b>altı iş günü<\/b> içinde Kurula bildirilir. Sektör fonlarında %10 sınırı <b>%20<\/b> uygulanır.<\/li>\n<\/ul>\n\n<h3>Serbest, fon sepeti, garantili ve koruma amaçlı fonlar<\/h3>\n<ul>\n<li><b>Serbest fon:<\/b> genel portföy sınırlamalarına tabi değil, KAP'taki strateji ve limitlerle yatırım yapar; swap da kullanabilir; toplam gider sınırı uygulanmaz. Pay fiyatı <b>en az ayda bir<\/b> hesaplanır. Satıcı kuruluş nitelikli yatırımcı belgelerini tutar. Yöneticilerde ileri düzey ve türev lisansı. İzahnamede yalnız unvan-tür-süre, taraflar ve harcama esasları yer alır; stratejide değişiklik duyurusu yürürlükten <b>en az 30 gün önce<\/b> KAP'ta. Karşılaştırma ölçütü (dönüşüm hariç) yalnız izleyen hesap döneminden itibaren değiştirilebilir.<\/li>\n<li><b>Fon sepeti:<\/b> tek fon veya BYF en fazla <b>%20<\/b>; başka fon sepeti fonuna yatırım yapılamaz; yatırım yapılan fonun pay sayısının en fazla <b>%25'i<\/b>; serbest fon payları en fazla <b>%10<\/b>; alt fonlara ödenen ücretler toplam gider oranına dahil.<\/li>\n<li><b>Garantili ve koruma amaçlı:<\/b> asgari vade <b>altı ay<\/b>. Koruma stratejisi kamu borçlanma aracı, ters repo, kira sertifikası, banka borçlanma aracı, ipotekli MK veya notlu özel sektör araçlarına dayanır. Doğrudan maliyetler (vergi hariç) korunan tutarı azaltamaz; garanti tüm yatırımcılar için aynı; vade içinde strateji ve tür değişmez.<\/li>\n<li><b>Garantör:<\/b> derecelendirme notu olan banka veya (mevzuat saklı) yurt dışı banka ve sigorta şirketi. Garanti sözleşmesi ilk talepte fona ödeme içerir; lehdar yatırımcılardır; garanti fona aittir, koşula bağlanamaz, <b>cayılamaz<\/b>; sözleşme değişikliği Kurul uygun görüşüne tabidir.<\/li>\n<li>Bu fonlarda pay fiyatı <b>en az ayda iki kez<\/b>; yöneticilerde ileri düzey ve türev lisansı. Koruma amaçlı fonlarda türev (opsiyon alımı hariç) yalnız riskten korunma için; borsa dışı türev karşı taraf riski <b>%20<\/b>; borsa dışı sözleşme belgeleri <b>10 iş günü<\/b> içinde Kurula. Özel sektör araçlarına yatıranlarda yatırımcıdan formu okuduğuna dair talimat alınır.<\/li>\n<\/ul>\n\n<h3>Sona erme, devir, birleşme<\/h3>\n<ul>\n<li>Sona erme: süre dolması; süresizse Kurul görüşüyle <b>altı ay<\/b> sonrası için fesih ihbarı; kurucunun faaliyet şartlarını kaybetmesi; kurucunun iflası, tasfiyesi veya mali zayıflığı; fonun devamının yatırımcı yararına olmadığının Kurulca tespiti.<\/li>\n<li>Fesih ihbarından sonra yeni pay ihraç edilemez; tasfiye anından itibaren pay ihraç edilemez ve geri alınamaz. Altı ay sonunda iade edilmemiş paylar talimat beklenmeden satılır ve nemalandırılır. Tasfiyede yalnız katılma payı sahiplerine ödeme yapılır.<\/li>\n<li>Kurucu iflas ederse Kurul fonu başka PYŞ'ye <b>tasfiye amacıyla<\/b> devreder; saklayıcı zayıflarsa kurucu varlıkları başka saklayıcıya devreder. Diğer devirler Kurul uygun görüşüyle; masraflar fona yansıtılamaz; devir öncesi yükümlülüklerden iki kurucu <b>müteselsilen<\/b> sorumludur.<\/li>\n<li><b>Birleşmede değiştirme oranı<\/b> = bünyesinde birleşilen fonun birim pay değeri / sona eren fonun birim pay değeri. Sona eren fonun pay sayısı bu orana bölünerek yeni pay sayısı bulunur; küsurat nakden ödenir.<\/li>\n<\/ul>\n\n<h3>Bilgi verme, derecelendirme, giderler ve TEFAS<\/h3>\n<ul>\n<li>Kurucu ve yönetici, ilişkili ihraççı bilgilerini her yıl <b>Ocak<\/b> ayında, değişiklikleri <b>altı iş günü<\/b> içinde saklayıcıya yazılı bildirir. Olağanüstü durumlarda değerleme esaslarına kurucu YK'sı karar verebilir.<\/li>\n<li>Derecelendirme: yatırım yapılabilir seviye not; Türkiye'deki kuruluşlar için <b>ulusal<\/b> not, yurt dışındakiler için ihraççı notu; en alt yatırım seviyesindekilerde görünüm en az <b>durağan<\/b>; not değişikliği <b>iki iş günü<\/b> içinde KAP'ta.<\/li>\n<li>Toplam gider oranı aşılırsa aşan tutar dönemi izleyen <b>beş iş günü<\/b> içinde fona iade edilir; kurucu ve saklayıcı sorumludur.<\/li>\n<\/ul>\n<table>\n<tr><th>Fon türü<\/th><th>Günlük azami<\/th><th>Yıllık azami<\/th><\/tr>\n<tr><td>Para piyasası<\/td><td>Yüz binde 4,5<\/td><td><b>%1,65<\/b><\/td><\/tr>\n<tr><td>Koruma amaçlı, garantili, kıymetli maden, endeks<\/td><td>Yüz binde 6<\/td><td><b>%2,19<\/b><\/td><\/tr>\n<tr><td>Kısa vadeli borçlanma araçları, kısa vadeli kira sertifikaları katılım<\/td><td>Yüz binde 7<\/td><td><b>%2,56<\/b><\/td><\/tr>\n<tr><td>Fon sepeti<\/td><td>Yüz binde 12<\/td><td><b>%4,38<\/b><\/td><\/tr>\n<tr><td>Diğer fonlar<\/td><td>Yüz binde 10<\/td><td><b>%3,65<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li><b>TEFAS<\/b> işlemleri <b>9 Ocak 2015<\/b>'te başladı. Kural olarak fonların platforma üye olması zorunludur (PYŞ'nin kendi müşterileriyle kendi fonlarındaki işlemleri hariç).<\/li>\n<li>Platformda işlem görmeyenler: <b>özel fon, GYF, GSYF, garantili ve koruma amaçlı fonlar<\/b>. İsteğe bağlı: para piyasası, para piyasası katılım, kısa vadeli tahvil-bono, kısa vadeli kira sertifikası katılım ve serbest fonlar (serbest fonlar burada da yalnız nitelikli yatırımcıya; MKK'da nitelikli yatırımcı kontrolü yapılır).<\/li>\n<li>Dağıtım kuruluşuna genel komisyon <b>yönetim ücretinin %35'i<\/b> (sabit); ikili özel anlaşmada en fazla <b>%65'i<\/b>. Yatırımcıdan dokümanlar dışında ücret alınamaz.<\/li>\n<\/ul>", "sorular": [{"q": "Yatırım Fonları Tebliği'ne göre yatırım fonunun hukuki niteliği hangisidir?", "o": ["Kayıtlı sermayeli anonim ortaklık", "Vakıf", "Limited şirket", "Kooperatif", "Tüzel kişiliği olmayan malvarlığı"], "a": 4, "e": "Yatırım fonu, inançlı mülkiyet esasına göre PYŞ'lerce içtüzükle kurulan tüzel kişiliği olmayan malvarlığıdır."}, {"q": "Aşağıdaki fonlardan hangisinin şemsiye fon şeklinde kurulması zorunludur?", "o": ["Borsa yatırım fonu", "Gayrimenkul yatırım fonu", "Hisse senedi fonu", "Girişim sermayesi yatırım fonu", "Hiçbiri"], "a": 2, "e": "BYF, GYF ve GSYF dışındaki yatırım fonlarının şemsiye fon şeklinde kurulması zorunludur."}, {"q": "Hisse senedi yoğun fon olarak kabul edilebilmek için fon portföy değerinin en az %80'inin devamlı olarak hangi varlıklardan oluşması gerekir?", "o": ["MKYO payları hariç BİAŞ'ta işlem gören ihraççı payları", "Yerli ve yabancı tüm paylar", "Yabancı borsalardaki paylar", "Kamu borçlanma araçları", "Fon payları"], "a": 0, "e": "Hisse senedi yoğun fonlarda en az %80 devamlı olarak MKYO payları hariç BİAŞ'ta işlem gören ihraççı paylarından oluşur."}, {"q": "Para piyasası şemsiye fonuna bağlı fonların portföyü için doğru olan hangisidir?", "o": ["En az %80'i mevduattan oluşur", "Varlıkların vadesi en fazla 365 gün", "Ağırlıklı ortalama vade en fazla 90 gün", "Varlıkların vadesine en fazla 184 gün kalmış olmalı, ağırlıklı ortalama vade en fazla 45 gün", "Vade sınırı yoktur"], "a": 3, "e": "Portföyün tamamı vadesine en fazla 184 gün kalmış likit araçlardan oluşur ve günlük ağırlıklı ortalama vade en fazla 45 gündür."}, {"q": "Yabancı para ve sermaye piyasası araçlarına toplam değerinin en az %80'i oranında yatırım yapan fonun unvanında hangi ibare zorunludur?", "o": ["Döviz", "Yabancı", "Global", "Uluslararası", "Küresel"], "a": 1, "e": "Yabancı araçlara en az %80 yatıran fonların unvanında \"Yabancı\" ibaresi zorunludur; \"global, küresel\" gibi subjektif ifadeler yasaktır."}, {"q": "Bir şemsiye fona bağlı ilk fonun katılma payı ihracı başvurusu içtüzüğün tescilinden itibaren en geç ne kadar sürede yapılmalıdır?", "o": ["Bir ay", "İki ay", "Bir yıl", "Altı ay", "Üç ay"], "a": 4, "e": "İlk fon başvurusu tescilden itibaren en geç üç ay içinde yapılır; bir defaya mahsus üç ay uzatılabilir."}, {"q": "Yatırımcı bilgi formuyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Azami iki sayfa ve 12 punto olarak hazırlanır", "Fonun toplam gider oranını içerir", "Değişiklikleri için Kurul onayı gerekir", "Kurucu formdaki yanlış bilgilerden sorumludur", "Serbest fonlarda düzenlenmesi kural olarak ihtiyaridir"], "a": 2, "e": "Yatırımcı bilgi formu değişikliklerinde Kurul onayı aranmaz; altı iş günü önce Kurula bildirilir ve izleyen iş günü ilan edilir."}, {"q": "Para piyasası ve kısa vadeli borçlanma araçları fonları dışındaki fonlarda katılma payı alım satım emirleri hangi fiyattan gerçekleştirilir?", "o": ["Emrin verilmesini takip eden ilk hesaplamada bulunacak fiyattan", "En son ilan edilen birim pay fiyatından", "Borsada oluşan fiyattan", "Bir önceki günün kapanış fiyatından", "Kurucunun belirlediği sabit fiyattan"], "a": 0, "e": "Bu fonlarda ileri fiyatlama uygulanır; para piyasası ve kısa vadeli borçlanma araçları fonlarında en son ilan edilen fiyat esastır."}, {"q": "Bir yatırım fonunun tek bir ihraççının para ve sermaye piyasası araçlarına yatırabileceği azami oran nedir?", "o": ["%5", "%25", "%20", "%10", "%35"], "a": 3, "e": "Fon toplam değerinin %10'undan fazlası tek bir ihraççının araçlarına yatırılamaz."}, {"q": "TCMB, Hazine ve Maliye Bakanlığı, ipotek finansman kuruluşları ve Türkiye Varlık Fonu ihraçlarında ihraççı sınırları uygulanmaz; ancak bu kapsamda tek bir varlığa yatırım fon toplam değerinin en fazla ne kadarı olabilir?", "o": ["%10", "%35", "%25", "%20", "%50"], "a": 1, "e": "Bu ihraççılarda genel sınırlar uygulanmaz, ancak tek bir varlığa yatırım %35'i aşamaz."}, {"q": "Katılım fonlarında mevduat/katılma hesabına ilişkin sınırlar nasıl uygulanır?", "o": ["Toplam %10, tek banka %3", "Toplam %50, tek banka %20", "Toplam %20, tek banka %5", "Sınır yoktur", "Toplam %25, tek banka %10"], "a": 4, "e": "Genel kural %10 ve %3 iken katılım fonlarında %25 ve %10 uygulanır."}, {"q": "Bir yatırım fonunun fon payları, MKYO payları, yabancı BYF ve yabancı fonlara yatırımının toplam sınırı ile tek fon sınırı hangisidir?", "o": ["%10 ve %5", "%30 ve %10", "%20 ve %10", "%20 ve %5", "%50 ve %20"], "a": 2, "e": "Toplam %20, tek fon %10; Türkiye'deki BYF'ler toplam sınıra tabi değildir, tek BYF için sınır %20'dir."}, {"q": "Yatırım fonlarında ödünç alma işlemi hangi fonlar tarafından yapılabilir?", "o": ["Yalnızca serbest fonlar", "Tüm fonlar", "Yalnızca hisse senedi fonları", "Yalnızca para piyasası fonları", "Hiçbir fon"], "a": 0, "e": "Ödünç alma işlemleri sadece serbest fonlar tarafından gerçekleştirilebilir."}, {"q": "Garantili ve koruma amaçlı fonlarla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Asgari vadeleri üç aydır", "Pay fiyatı en az ayda bir hesaplanır", "Garantör garantiden cayabilir", "Asgari vade altı aydır ve pay fiyatı en az ayda iki kez hesaplanır", "Koruma amaçlı fonlarda garantör zorunludur"], "a": 3, "e": "Bu fonların asgari vadesi altı aydır, pay fiyatı ayda en az iki kez hesaplanır; garantiden cayılamaz ve koruma amaçlı fonlarda garantör yoktur."}, {"q": "Fon sepeti fonlarıyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Tek bir fonun değeri fon sepeti fonu değerinin %20'sini aşamaz", "Yatırım yapılan fonun pay sayısının %50'sine kadar alınabilir", "Serbest fon payları fon değerinin %10'unu geçemez", "Başka fon sepeti fonlarına yatırım yapılamaz", "Alt fonlara ödenen ücretler toplam gider oranına dahil edilir"], "a": 1, "e": "Portföye alınan payların sayısı yatırım yapılan fonun pay sayısının %25'ini aşamaz."}, {"q": "Fon sepeti fonları için yıllık azami fon toplam gider oranı nedir?", "o": ["%1,65", "%2,19", "%2,56", "%3,65", "%4,38"], "a": 4, "e": "Fon sepeti fonlarında günlük yüz binde 12, yıllık %4,38'dir; diğer fonlarda %3,65'tir."}, {"q": "Aşağıdaki fonlardan hangisinin katılma payları TEFAS'ta işlem görmez?", "o": ["Hisse senedi fonu", "Değişken fon", "Garantili fon", "Borçlanma araçları fonu", "Kıymetli madenler fonu"], "a": 2, "e": "Özel fon, GYF, GSYF, garantili ve koruma amaçlı fonlar Platformda işlem görmez."}, {"q": "TEFAS'ta katılma payı satışını gerçekleştiren dağıtım kuruluşuna ödenecek genel komisyon oranı nedir?", "o": ["Yönetim ücretinin %35'i", "Yönetim ücretinin %25'i", "Yönetim ücretinin %10'u", "Yönetim ücretinin %50'si", "Yönetim ücretinin %65'i"], "a": 0, "e": "Genel komisyon sabit olarak yönetim ücretinin %35'idir; ikili özel anlaşmalarda azami %65'e çıkabilir."}, {"q": "Bir fonun birim pay değeri 2 TL, bünyesinde birleşeceği fonun birim pay değeri 4 TL'dir. Sona eren fonda 1.000 payı olan yatırımcının hesabına kaç pay aktarılır?", "o": ["250", "2.000", "1.000", "500", "4.000"], "a": 3, "e": "Değiştirme oranı = 4 / 2 = 2; sona eren fondaki 1.000 pay 2'ye bölünür ve 500 pay aktarılır."}]}, {"id": 11, "kisa": "Borsa Yatırım Fonları", "baslik": "Borsa Yatırım Fonları (III-52.2)", "ozet": "BYF'nin yapısı, birincil piyasa ve arbitraj, takip farkı ve hatası, endeks takip stratejileri, kuruluş ve halka arz süreci, portföy sınırları.", "notlar": "<h3>Tanım ve temel yapı<\/h3>\n<ul>\n<li><b>BYF:<\/b> katılma payları <b>BİAŞ'ta işlem gören<\/b>, portföy kompozisyonunu yansıtan varlıkların veya yalnız nakdin teslimiyle pay oluşturulabilen ya da pay iadesi karşılığında bu varlıkların veya nakdin alınabildiği; inançlı mülkiyet esasına göre PYŞ'lerce içtüzükle kurulan, <b>tüzel kişiliği olmayan<\/b> malvarlığı.<\/li>\n<li>BYF'ler Kurulca uygun görülen <b>bir endeksi takip etmek<\/b> üzere kurulur; temel strateji endeks performansını yansıtmaktır (pasif yönetim).<\/li>\n<li>Kurucu yalnızca <b>PYŞ<\/b> olabilir; varlıklar SPKn m.56 kapsamındaki portföy saklayıcısında saklanır. İçtüzüğün notere onaylatılması uygulaması kaldırılmıştır.<\/li>\n<li>Dikkat: Yatırım fonlarından farklı olarak BYF'ler <b>şemsiye fon şeklinde kurulamaz<\/b>.<\/li>\n<li>Yatırım fonlarından farklı olarak TCMB'nin günlük kur ilan ettiği <b>yabancı paralar<\/b> ve <b>swap sözleşmeleri<\/b> de portföye alınabilir. Birincil piyasa işlemlerinin yalnızca <b>nakit karşılığı<\/b> da yapılabilmesine imkan tanınmıştır.<\/li>\n<li>Eski düzenlemedeki \"birim pay değeri ile endeks arasında en az %90 korelasyon\" şartı BYF'ler için kaldırılmış; yerine <b>takip farkı<\/b> ve <b>takip hatası<\/b> getirilmiştir.<\/li>\n<\/ul>\n\n<h3>Yatırım fonu, BYF ve MKYO karşılaştırması<\/h3>\n<table>\n<tr><th>Özellik<\/th><th>Yatırım fonu<\/th><th>BYF<\/th><th>MKYO<\/th><\/tr>\n<tr><td>Tüzel kişilik<\/td><td>Yok<\/td><td>Yok<\/td><td><b>Var<\/b><\/td><\/tr>\n<tr><td>Yönetim tarzı<\/td><td>Aktif<\/td><td><b>Pasif<\/b><\/td><td>Aktif<\/td><\/tr>\n<tr><td>Birincil piyasa<\/td><td>Tüm yatırımcılara açık, nakit, her iş günü<\/td><td>Büyük ölçüde nitelikli yatırımcılar; ayni ve/veya nakdi; her iş günü<\/td><td>Tüm yatırımcılara açık, nakdi, yalnızca sermaye artırımlarında<\/td><\/tr>\n<tr><td>İkincil piyasa<\/td><td>Yok<\/td><td>Borsada, herkese açık<\/td><td>Borsada, herkese açık<\/td><\/tr>\n<tr><td>Fiyat<\/td><td>Kurucunun hesapladığı fiyat<\/td><td>Borsada oluşan işlem fiyatı + kurucunun hesapladığı birim pay değeri<\/td><td>Borsada oluşan işlem fiyatı<\/td><\/tr>\n<tr><td>İskonto/prim<\/td><td>Söz konusu değil<\/td><td>Birincil piyasa sayesinde işlem fiyatı birim pay değerine çok yakın<\/td><td>Arz-talebe göre iskontolu veya primli işlem mümkün<\/td><\/tr>\n<\/table>\n\n<h3>Birincil piyasa, arbitraj ve fiyatlar<\/h3>\n<ul>\n<li>BYF'yi MKYO'dan ayıran en önemli özellik belirli büyüklükte <b>birincil piyasa işlemi<\/b> yapılabilmesidir. Birim pay değeri çok kısa aralıklarla (genellikle bir dakikanın altında) hesaplanıp yayımlanır.<\/li>\n<li><b>Birincil piyasa:<\/b> yetkilendirilmiş katılımcı ile portföy saklayıcısı arasında yeni pay oluşturma ve mevcut payların geri alımı. <b>İkincil piyasa:<\/b> payların BİAŞ'ta alım satımı.<\/li>\n<li><b>Yetkilendirilmiş katılımcı:<\/b> pay oluşturma ve geri alıma aracılık eden, kurucuyla sözleşme imzalamış, işlem aracılığı veya portföy aracılığı izni almış <b>aracı kurum<\/b>.<\/li>\n<li>Birincil işlemler <b>asgari işlem birimi<\/b> (örneğin 50.000 pay) ve katları halinde yapılır; bu yüzden BYF'ler genellikle nitelikli yatırımcılarca tercih edilir. Asgari işlem birimini kurucu belirler ve dokümanlarda yer verir.<\/li>\n<li><b>Arbitraj:<\/b> birim pay değeri işlem fiyatından yüksekse yatırımcı payı iade edip karşılığı menkul kıymetleri alır ve borsada satar (<b>redemption<\/b>). İşlem fiyatı birim pay değerin
