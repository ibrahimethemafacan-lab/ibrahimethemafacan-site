lar ve kim onaylar?", "o": ["SPK hazırlar, Bakanlık onaylar", "Birlik Yönetim Kurulu hazırlar, Birlik Genel Kurulu onaylar", "Birlik Genel Kurulu hazırlar, SPK onaylar", "Disiplin Komitesi hazırlar, Yönetim Kurulu onaylar", "Üyeler hazırlar, Borsa onaylar"], "a": 1, "e": "Meslek kuralları Birlik Yönetim Kurulunca hazırlanır ve Birlik Genel Kurulunca onaylanarak yürürlüğe girer."}, {"q": "Aşağıdakilerden hangisi TSPB'nin üyeleri arasında sayılmaz?", "o": ["Aracı kurumlar", "Bankalar", "Portföy yönetim şirketleri", "Gayrimenkul yatırım ortaklıkları", "Halka açık sanayi şirketleri"], "a": 4, "e": "Üyeler aracı kurumlar, bankalar, MKYO, GSYO, GYO'lar ve portföy yönetim şirketleridir."}, {"q": "Meslek kurallarına göre çıkar çatışmalarıyla ilgili hangisi doğrudur?", "o": ["Yalnızca üye ile müşteri arasında ortaya çıkabilir", "Çıkar çatışması müşteriye bildirilmez", "Müşteriler arasında da ortaya çıkabilir; önlenemiyorsa öncelikle müşteri menfaati gözetilir ve müşteriye bildirilir", "Üyenin menfaati önceliklidir", "Çıkar çatışması varsa işlem iptal edilir"], "a": 2, "e": "Çıkar çatışması üye-müşteri ve müşteri-müşteri arasında olabilir; önlenemiyorsa müşteri menfaati önce gelir ve müşteriye bildirilir."}, {"q": "Aşağıdaki promosyon ve reklam uygulamalarından hangisi meslek kurallarına uygundur?", "o": ["Ödülün kaynağını açıkça belirterek üyeye verilen ödüle reklamda yer vermek", "Mutlak getiri garantisi vermek", "\"En güvenilir aracı kurum\" ifadesi kullanmak", "Müşteri getirene müşterinin geliri üzerinden pay veren kampanya yapmak", "Ödenen komisyondan fazla iade yapan kampanya düzenlemek"], "a": 0, "e": "Ödüllere kaynağı açıkça belirtilerek reklamda yer verilebilir; diğer uygulamalar yasaktır."}, {"q": "Yeni işe başlayan personelin en son çalıştığı üyenin müşterileriyle irtibat kurması en az ne kadar süre engellenmelidir?", "o": ["Bir hafta", "15 gün", "Üç ay", "Bir ay", "Altı ay"], "a": 3, "e": "Üyeler yeni personelin eski işyerinin müşterileriyle irtibatını en az bir ay engelleyici önlemler alır."}, {"q": "Üye çalışanlarının müşterilerle ilişkileri konusunda aşağıdakilerden hangisi meslek kurallarına aykırı değildir?", "o": ["Müşteriyle müşterek hesap açtırmak", "Birinci derece akrabası olan müşteriyle müşterek hesap açtırmak", "Teamül üzeri hediye almak", "Portföy yönetimi dışında müşteriden emir verme vekaletnamesi almak", "Konumunu kullanarak kişisel çıkar sağlamak"], "a": 1, "e": "Borç-alacak, kefalet ve müşterek hesap yasağının istisnası birinci dereceden akrabalardır."}, {"q": "Başka bir üyenin çalışanı kendi kurumunda hesap açtırırsa, bu durum öğrenildikten sonra en fazla ne kadar sürede diğer üyeye yazılı bildirilir?", "o": ["Aynı gün", "Bildirim gerekmez", "15 gün", "Bir ay", "Bir hafta"], "a": 4, "e": "Öğrenildiği tarihten itibaren en fazla bir hafta içinde, hesabın açıldığı zaman da belirtilerek bildirilir."}, {"q": "TSPB Disiplin Yönetmeliği'ne göre en hafif disiplin cezası hangisidir?", "o": ["Kınama", "İdari para cezası", "Uyarı", "Geçici çıkarma", "Sürekli çıkarma"], "a": 2, "e": "Ceza sıralaması uyarı, kınama, geçici çıkarma ve sürekli çıkarmadır; en hafifi uyarıdır."}, {"q": "Birlik üyeliğinden geçici çıkarma cezasının azami süresi nedir?", "o": ["Altı ay", "Üç ay", "Bir ay", "Bir yıl", "İki yıl"], "a": 0, "e": "Geçici çıkarma altı ayı aşmamak üzere geçici bir süre için üyelik haklarından mahrumiyettir."}, {"q": "Birlik üyeliğinden sürekli çıkarma cezasını gerektiren fiil hangisidir?", "o": ["Müşteri talimatlarına kayıtsız kalmak", "Birlik incelemesini engellemek", "Asılsız ihbarda bulunmak", "SPKn m.110'daki güveni kötüye kullanma ve sahtecilik suçlarını işlemek", "Müşteri sırlarının güvenliğinde özensizlik"], "a": 3, "e": "Sürekli çıkarma SPKn m.110'daki güveni kötüye kullanma ve sahtecilik suçları için uygulanır; ilk derece mahkemesi kararıyla sabit olmalıdır."}, {"q": "Uyarı cezası alan bir üye, sicilden silinme süresi içinde aynı cezayı gerektiren yeni bir fiil işlerse hangi ceza verilir?", "o": ["Yeniden uyarı", "Kınama", "Geçici çıkarma", "Sürekli çıkarma", "İdari para cezası"], "a": 1, "e": "Uyarı sonrası aynı cezayı gerektiren yeni fiilde kınama cezası verilir."}, {"q": "Disiplin Komitesi ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Genel Kurulca iki yıl için seçilen beş üyeden oluşur", "En az üç üyeyle toplanır", "Karar için en az üç olumlu oy gerekir", "Raportörü Hukuk İşleri Müdürüdür", "Üyeler çekimser oy kullanabilir"], "a": 4, "e": "Disiplin Komitesinde çekimser oy kullanılamaz; karşı oy da gerekçeli olmalıdır."}, {"q": "Disiplin soruşturmasında üyeye savunma için verilen süre (geçerli mazeret yoksa) nedir?", "o": ["Beş iş günü", "Yirmi iş günü", "On iş günü", "Otuz gün", "Altmış iş günü"], "a": 2, "e": "Savunma süresi tebliğden itibaren on iş günüdür; geçerli mazeret veya mücbir sebepte yirmi iş günü."}, {"q": "Disiplin kararlarına karşı itiraz nereye ve ne kadar sürede yapılır?", "o": ["SPK nezdinde, tebliğden itibaren on iş günü içinde", "Birlik Genel Kuruluna, 30 gün içinde", "İdare mahkemesine, 60 gün içinde", "Disiplin Komitesine, beş iş günü içinde", "Borsa İstanbul'a, 15 gün içinde"], "a": 0, "e": "İtiraz tebliğden itibaren on iş günü içinde SPK nezdinde yapılır; dilekçe Birlik YK Başkanlığına verilir."}, {"q": "Disiplin soruşturmasına başlanabilmesi için fiilin işlendiği tarihten itibaren en fazla ne kadar süre geçmiş olmalıdır?", "o": ["Altı ay", "Beş yıl", "İki yıl", "Bir yıl", "Süre sınırı yoktur"], "a": 3, "e": "Soruşturma zamanaşımı bir yıl, ceza zamanaşımı iki yıldır; ceza kovuşturmasında daha uzun süre varsa o esas alınır."}, {"q": "Disiplin cezalarının sicil kayıtları ne zaman silinir?", "o": ["Kesinleşmeden itibaren birinci yılın sonunda", "Beşinci yılın sonunda", "Üçüncü yılın sonunda", "Onuncu yılın sonunda", "Silinmez"], "a": 1, "e": "Sicil kayıtları kararın kesinleşmesinden başlayarak beşinci yılın sonunda silinir."}, {"q": "Bir Birlik üyesinin bir fiili nedeniyle SPK tarafından SPKn m.103/1 uyarınca idari para cezası verilmişse, Birlik aynı fiil için ne yapabilir?", "o": ["Ayrıca idari para cezası verebilir", "Üyeliği otomatik olarak sona erdirir", "Cezayı iki katına çıkarabilir", "SPK cezasını iptal edebilir", "İdari para cezası veremez"], "a": 4, "e": "Aynı fiil için hem SPK hem Birlik tarafından idari para cezası verilmesi mümkün değildir; disiplin soruşturması ise yürütülebilir."}]}, {"id": 15, "kisa": "Etik İlkeler (SPEK)", "baslik": "Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları", "ozet": "Altı etik ilke ve davranış kuralları: mevzuat, bağımsızlık, içsel bilgi, piyasa bozucu eylemler, uygunluk, adil davranma, işverene karşı görevler ve çıkar çatışması.", "notlar": "<h3>Etik ilke ve davranış kuralı<\/h3>\n<ul>\n<li><b>Etik ilkeler:<\/b> bir meslekte çalışanlara veya mesleğin örgütsel davranışlarına rehberlik eden, ahlaki kuralları içeren, kişiyi derin düşünerek eyleme geçme veya geçmeme sürecine yönelten yazılı ve açıklayıcı ilkeler (<b>meslek etiği<\/b>). Kişiliği ve gelişimini hedef alan <b>soyut<\/b> kavramlardır.<\/li>\n<li><b>Davranış kuralları:<\/b> mesleğin nasıl yapılacağına dair yol gösterici, öğretici ve <b>sınırlayıcı<\/b>, basiretli kişinin nasıl davranacağını idealize eden <b>somut<\/b> yönlendirmeler.<\/li>\n<li>2008 krizi, ekonomik çıkarı başka kaygı gözetmeden en çoklamanın etkinlik sağlamadığını, krizi tetiklediğini gösterdi. Bu nedenle finans piyasasının temeline <b>dördüncü \"E\" olarak Etik<\/b> yerleştirildi.<\/li>\n<li>Uluslararası kabul görmüş ilkeler gözetilerek <b>\"Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları\" (SPEK)<\/b> hazırlandı; amacı çalışanın yöneticilerine, astlarına, müşterilerine ve piyasaya karşı sorumluluklarını belirlemesine destek olmaktır.<\/li>\n<\/ul>\n\n<h3>Altı TSPB etik ilkesi<\/h3>\n<table>\n<tr><th>İlke<\/th><th>Özü<\/th><\/tr>\n<tr><td>1. Temel ilke<\/td><td>Kamuoyu, müşteriler, işveren, iş arkadaşları ve diğer katılımcılarla bağımsız, dürüst, adil, yetkin, özenli, güncel bilgiye dayalı, saygılı ve etik hareket<\/td><\/tr>\n<tr><td>2. Bağımsızlık, dürüstlük ve adillik<\/td><td>Piyasanın onurunu ve müşteri çıkarlarını kişisel çıkarın üstünde tutmak; müşteri ayrımı yapmadan her müşteriye eşit davranmak<\/td><\/tr>\n<tr><td>3. Özen ve titizlik<\/td><td>Dikkatli ve basiretli bir kişinin aynı koşullarda göstereceği dikkat ve gayret<\/td><\/tr>\n<tr><td>4. Sürekli gelişim<\/td><td>Bilgi ve becerileri güncel tutmak<\/td><\/tr>\n<tr><td>5. Sır saklama<\/td><td>Kurum ve müşteri sırlarını açıklamamak ve kullanmamak<\/td><\/tr>\n<tr><td>6. Etik düşünme<\/td><td>Mevzuat ve kurumsal değerleri gözeterek özgür iradeye dayalı bağımsız kanaat kullanmak; başkalarını da etik davranmaya teşvik etmek<\/td><\/tr>\n<\/table>\n\n<h3>Davranış kuralları haritası<\/h3>\n<table>\n<tr><th>Ana başlık<\/th><th>Alt kurallar<\/th><\/tr>\n<tr><td>Mesleki uzmanlık<\/td><td>Mevzuatın bilinmesi; bağımsızlık ve tarafsızlık; gerçekdışı gösterim; mesleki uzmanlığa uygun olmayan davranış<\/td><\/tr>\n<tr><td>Piyasanın dürüst işleyişi<\/td><td>İçsel bilgilerin kullanımı; piyasa dolandırıcılığı; piyasa bozucu eylemler<\/td><\/tr>\n<tr><td>Müşterilere karşı görevler<\/td><td>Sadakat, sağduyu ve özen; adil davranma; uygunluk; performans sunumu; gizliliğin korunması<\/td><\/tr>\n<tr><td>İşverene karşı görevler<\/td><td>Bizzat çalışma, özen ve sadakat; düzenleme ve talimatlara uyma; menfaatlerin bildirilmesi; yöneticilerin sorumlulukları<\/td><\/tr>\n<tr><td>Faaliyetlerin sunumu<\/td><td>Özenli ve basiretli olma; müşterilerle iletişim; kayıtların tutulması ve saklanması<\/td><\/tr>\n<tr><td>Çıkar çatışması<\/td><td>Çatışmaların açıklanması; işlemlerin öncelik sırası; faaliyetlerden doğan çıkarların açıklanması<\/td><\/tr>\n<tr><td>Mesleğe karşı sorumluluk<\/td><td>Güven ve itibara gölge düşürecek her davranıştan kaçınmak<\/td><\/tr>\n<\/table>\n\n<h3>Mesleki uzmanlık kuralları<\/h3>\n<ul>\n<li><b>Mevzuatın bilinmesi:<\/b> çalışan mevzuatı ve kurum içi düzenlemeleri bilmeli, güncel tutmalı ve uymalıdır. Dikkat: mevzuatlar çelişirse veya bir ülkede düzenleme yoksa <b>daha katı olan<\/b> düzenlemeye göre hareket edilir. Bu kural uzman olmayı değil, faaliyeti yetkin yapacak düzeyde bilmeyi gerektirir. Hiçbir mevzuatta yasaklanmamış ama yatırımcıya zarar verecek eylem de yapılmamalıdır.<\/li>\n<li>Kurumda veya müşteride aykırılık fark edilirse önce ilgililer uyarılır, devam ederse ilişki kesilir; gerektiğinde <b>SPK, MASAK ve/veya TSPB<\/b>'ye bildirilir. Uyum birimine danışmak sorumluluğu kaldırmaz. Çelişkili durumlarda uyum birimi veya hukuk bölümünden destek alınır.<\/li>\n<li><b>Bağımsızlık ve tarafsızlık:<\/b> bağımsızlığa gölge düşürecek hediye, menfaat sağlanmaz, teklif ve talepte bulunulmaz. Lüks eğlence daveti, pahalı bilet, başka iş vaadi, halka arzda öncelik gibi teklifler reddedilmelidir. <b>Mütevazı hediyeler<\/b> kabul edilebilir. Müşteri memnuniyetiyle verilecek menfaatlerde işveren <b>önceden<\/b>, mümkün değilse ilk fırsatta bilgilendirilir. Örnek: alternatif konaklama olmayan iş seyahatinde şirketin konaklamayı karşılaması aykırılık değildir.<\/li>\n<li><b>Gerçekdışı gösterim:<\/b> gerçeğe aykırı beyan, verinin ihmal edilmesi veya yanıltıcı ifade. Başkalarının verileri kaynak gösterilmeden kullanılırsa <b>intihal<\/b> olur. Getiri taahhüdü (örneğin \"%X kazandıracağını garanti ederim\") yasaktır. Emir iletimine aracılık eden bankanın \"her türlü hizmeti sağlarız\" demesi gerçekdışıdır.<\/li>\n<li><b>Mesleki uzmanlığa uygun olmayan davranış:<\/b> mevzuata aykırı olmasa bile dürüstlüğü, itibarı veya yetkinliği zedeleyen her davranış (örnek: öğle yemeğinde aşırı alkol alıp yatırım tavsiyesi vermek).<\/li>\n<\/ul>\n\n<h3>Piyasanın dürüst işleyişi<\/h3>\n<ul>\n<li><b>İçsel bilgi:<\/b> değeri, fiyatı veya yatırım kararlarını etkileyebilecek, henüz kamuya açıklanmamış bilgi. Değerlendirme ölçütleri: içerik ve önem, <b>kaynağın güvenilirliği<\/b> (kaynağa güven azaldıkça içsel olma ihtimali azalır), fiyat etkisinin belirsizliği (belirsizlik arttıkça önem azalır), kamuya açıklanma durumu.<\/li>\n<li>Bilgi piyasaya yayılana kadar içseldir; KAP'ta veya basın bülteniyle yayımlanan bilgi yayılmış sayılır; küçük bir analist grubuna kapalı sunum yayılmış sayılmaz.<\/li>\n<li>Dikkat: Kişisel analiz ve araştırmayla ulaşılan öngörüler içsel bilgi değildir; ancak dayanak belgeler saklanmalıdır. Kural, bilginin fiyata <b>yansıyıp yansımadığına değil<\/b>, fiyatı etkileyebilecek nitelikte olup olmadığına bakar.<\/li>\n<li><b>Piyasa dolandırıcılığı:<\/b> işlem bazlı veya bilgi bazlı olabilir; SPKn'de suçtur; fark edilince SPK'ya bildirim yükümlülüğü vardır.<\/li>\n<li><b>Piyasa bozucu eylemler:<\/b> makul ekonomik gerekçesi olmayan, piyasanın güven ve istikrarını bozan eylemler; hapis gerektirecek boyutta değildir, <b>idari para cezası<\/b> gerektirir. Tipik örnek: derinliği göremeyen yatırımcıya aktif işlem varmış gibi sürekli <b>bir lotluk emir<\/b> girmek. Sınıflar: içsel ve sürekli bilgilere dayalı; emir ve işlemler yoluyla; iletişim ve haberleşme yoluyla; müşteri emrinden önce kendi çıkarına işlem; diğer.<\/li>\n<li>Piyasa bozucu eylemde içsel bilginin kullanılıp kullanılmaması önemli değildir (bilgiyi aktarmak yeter). Kendinden kendine aynı fiyattan işlem emir/işlem yoluyla; televizyonda \"al\" deyip ertesi gün satmak iletişim yoluyla piyasa bozucu eylemdir.<\/li>\n<\/ul>\n\n<h3>Müşterilere karşı görevler<\/h3>\n<ul>\n<li><b>Sadakat, sağduyu ve özen:<\/b> müşteri çıkarı işveren ve kişisel çıkarın üstündedir. Ölçüt: çalışanın aynı işlemi kendi hesabına yaparken göstereceği özen. Başlangıç noktası müşteriyi tanıma: kimlik tespiti, <b>profesyonel/genel müşteri<\/b> sınıflandırması, testler.<\/li>\n<li>Kolektif yatırım kuruluşlarında sadakat borcu fonun kurucusuna değil <b>katılma payı sahiplerine<\/b> karşıdır.<\/li>\n<li><b>En iyi şekilde gerçekleştirme:<\/b> fiyat, maliyet, hız, takas, saklama, karşı taraf tercihlerine göre müşteri için en iyi sonuç; müşteri belirli piyasa talimatı verdiyse en iyi gerçekleştirme sağlanmış sayılır. Dikkat: amaç <b>\"en ucuz\" değil \"en uygun\"<\/b> işlemdir.<\/li>\n<li><b>Adil davranma:<\/b> müşterilere \"eşit\" değil, <b>aynı nitelikteki müşterilere aynı koşullarda<\/b> davranmak demektir; farklılaşma fayda/maliyetten doğabilir. Araştırma sonucunu bir müşteriye önceden anlatmak veya halka arz dağıtımında yakın müşterilere ve kendine öncelik vermek aykırıdır.<\/li>\n<li><b>Uygunluk:<\/b> standart testler kullanılır ve düzenli güncellenir (yaşayan bir yapıdır, örneğin miras gibi servet değişikliği testi değiştirir); değişkenler arasındaki korelasyon gözetilir; hesap kısıtlarının dışına çıkılmaz. Ürün uygun değilse müşteri <b>yazılı uyarılır<\/b> ve birebir genel yatırım tavsiyesi verilmez; müşteri ısrar ederse çalışan hizmet verip vermemekte serbesttir. Dikkat: <b>portföy yönetimi ve yatırım danışmanlığında<\/b> test sonucuna uygun olmayan hizmet müşteri istese bile sunulamaz.<\/li>\n<li><b>Performans sunumu:<\/b> tam, doğru, kesin, anlaşılır ve gösterge verilerle karşılaştırmalı. Ölçek farkıyla yanıltıcı grafik yok; geçmiş getiri gelecek ölçütü yapılmaz; getiri taahhüdü yok. Tüm portföylerin getirisini toplu göstermek ve %80 hisse fonuna mevduat faizini ölçüt yapmak aykırıdır.<\/li>\n<li><b>Gizlilik:<\/b> istisnalar: yasadışı eylemlerle ilgili bilgi, mevzuat gereği açıklama zorunluluğu, müşterinin izni. Müşteri izin verse bile çıkarlarını zedeleyecekse gizli tutmak tercih edilmeli. Kural ilişki bittikten sonra da geçerlidir; şüpheli işlem bildirimi istisnadır. İyi niyetli bağış amacıyla müşteri listesi vermek de aykırıdır. Büyük müşteri emrinden önce kendi hesabına işlem hem piyasa bozucu eylem hem gizlilik ihlalidir.<\/li>\n<\/ul>\n\n<h3>İşverene karşı görevler<\/h3>\n<ul>\n<li><b>Bizzat çalışma:<\/b> iş işverenden habersiz başkasına devredilemez. <b>Özen:<\/b> müşteri veri tabanı, yazılım, ticari sır ve itibar gibi kurum varlıkları korunur. <b>Sadakat:<\/b> mevzuata aykırı olmadıkça iş sözleşmesinden doğan yükümlülüklere uyulur; ücret karşılığı üçüncü kişiye hizmet ve çıkar çatışması yaratan işlem yapılmaz. <b>Öncelik:<\/b> müşteri çıkarı her zaman işveren ve kişisel çıkarın üstündedir.<\/li>\n<li>Ayrılırken ticari sırları kullanmak, gizli bilgileri açmak, müşterilere pazarlama yapmak, müşteri listesi ve dokümanları almak sadakat ihlalidir. Ancak ayrılmadan önce iş aramak veya rakip iş başlatmaya hazırlanmak (sadakati ihlal etmeden) mümkündür.<\/li>\n<li>Dikkat: işveren bilerek mevzuata aykırı davranıyorsa talimata karşı çıkmak veya usulsüzlük kayıtlarını korumak <b>sadakat kuralının istisnasıdır<\/b> (amaç kişisel çıkar değil piyasa güveni olmalı). Piyasaya güven işverene borçların önündedir.<\/li>\n<li><b>Düzenleme ve talimatlara uyma:<\/b> kanuna ve genel ahlaka uygun kurum içi kurallara uyulur; örneğin kardeşi adına hesap açıp iç sınırlamayı aşmak aykırıdır.<\/li>\n<li><b>Menfaatlerin bildirilmesi:<\/b> hizmet nedeniyle üçüncü kişilerden hediye, menfaat, ücret kabul etmeden önce işverene bildirip <b>yazılı izin<\/b> (e-posta da olabilir) alınır.<\/li>\n<li><b>Yöneticilerin sorumlulukları:<\/b> gözetimindekilerin ihlallerini önlemek ve tespit etmek için makul gayret; süreçleri yazılı hale getirip duyurmak. Görev devri sorumluluğu kaldırmaz; gerekli çaba gösterildiyse ihlal yöneticinin kural ihlali sayılmaz ama <b>kusursuzluğunu kanıtlaması<\/b> gerekir. Satış raporunu dağıtımdan önce arkadaşlarla paylaşmak ihlaldir; kuralın imzalı duyurusunu yapan uyum yöneticisi görevini tamamlamıştır.<\/li>\n<\/ul>\n\n<h3>Faaliyetlerin sunumu<\/h3>\n<ul>\n<li><b>Özenli ve basiretli olma:<\/b> analiz ve tavsiye yeterli araştırmaya dayanmalı; üçüncü taraf çalışmalarının kaynağı, güvenilirliği, varsayımları, güncelliği ve tarafsızlığı sorgulanmalı. Sosyal medyadaki yorumu kendi analizi gibi aktarmak hem bu kuralı hem gerçekdışı gösterim kuralını ihlal eder. Borsadaki daha iyi fiyat yerine banka portföyünden satış en iyi gerçekleştirme ilkesine aykırıdır.<\/li>\n<li><b>Müşterilerle iletişim:<\/b> temel değişkenleri ve süreçleri açıklamak, önemli değişiklikleri en kısa sürede bildirmek, kısıt ve riskleri bildirmek, <b>gerçek veri ile teorik/tahmini veri<\/b> arasındaki farkı belirtmek; diğer kurumları kötülememek. Müşterinin irrasyonel davranışlarında (maliyet düşürmek için düşen hisseyi almak gibi) doğru yönlendirme yapılır. Anapara korumalı fonda anaparanın kesin alınacağını söylemek aykırıdır.<\/li>\n<li><b>Kayıtların tutulması:<\/b> analiz, çalışma notu ve görüşme notları makul süre saklanır. Çalışanın ürettiği kayıtların <b>mülkiyeti çalışana<\/b>, ticari kullanım hakkı <b>işverene<\/b> aittir; ayrılırken notlarını götürebilir ama başka işyerinde ticari amaçla kullanamaz.<\/li>\n<\/ul>\n\n<h3>Çıkar çatışması<\/h3>\n<ul>\n<li>Çıkar çatışmasının doğmama ihtimali yoktur; mevzuat önceden bilgilendirme, risk bildirim formu, uygun organizasyon ve çatışma politikası ister. Çalışan önleyebiliyorsa önler, önleyemiyorsa <b>tam, açık, fark edilebilir, anlaşılır<\/b> ve kalıcı biçimde müşteriye ve işverene açıklar.<\/li>\n<li>Tipik çatışmalar: kişisel pozisyon; ihraç aracılığı; portföy aracılığı (müşteriye karşı pozisyon); halka arz (büyük müşteri talepleri); değerleme/derecelendirme (hizmet verilen ve ücret ödeyen aynı); araştırma raporu; portföy yönetimi (yönetilen senedi kişisel portföye almak); sadakat ve gelir.<\/li>\n<li><b>İşlemlerin öncelik sırası:<\/b> <b>önce müşteri, sonra işveren, en son çalışanın kendisi<\/b>. Mevzuat çalışanın portföy tutmasını yasaklamaz; müşteri veya işverene zarar yoksa, şahsi kazanç sağlanmıyorsa ve işlem mevzuata uygunsa etik dışı durum yoktur (örnek: acil ihtiyaç için daha önce alım tavsiye edilen hisseyi satmak).<\/li>\n<li><b>Faaliyetten doğan çıkarların açıklanması:<\/b> üçüncü taraflardan sağlanan veya ödenen ücret, komisyon, iskonto <b>yasak değildir<\/b>; işverene ve müşterilere bildirilmesi yeterlidir (örnek: satış üzerinden %10 prim veya grup aracı kurumdan ücretsiz araştırma hizmeti).<\/li>\n<li><b>Mesleğe karşı sorumluluk:<\/b> piyasa güven ve itibar üzerine kuruludur; mevzuat ve ürünler ne kadar iyi olursa olsun onları uygulayacak çalışan etik değilse piyasa etkin işleyemez.<\/li>\n<\/ul>", "sorular": [{"q": "Etik ilkeler ile davranış kuralları arasındaki farkla ilgili hangisi doğrudur?", "o": ["Etik ilkeler somut, davranış kuralları soyuttur", "Etik ilkeler yalnızca yaptırım içerir", "İkisi aynı anlama gelir", "Davranış kuralları yalnızca yöneticiler için geçerlidir", "Etik ilkeler kişiliği hedef alan soyut kavramlar, davranış kuralları mesleğin uygulamasına yönelik somut yönlendirmelerdir"], "a": 4, "e": "Etik ilkeler kişiliği hedef alan soyut kavramları, davranış kuralları ise mesleğe yönelik somut yönlendirmeleri içerir."}, {"q": "2008 krizinden sonra finans piyasasının temeline \"dördüncü E\" olarak yerleştirilen kavram hangisidir?", "o": ["Etkinlik", "Ekonomi", "Etik", "Esneklik", "Eşitlik"], "a": 2, "e": "Krizin ardından finans piyasasının temel işlevlerinin temeline dördüncü E olarak Etik yerleştirilmiştir."}, {"q": "Aşağıdakilerden hangisi TSPB'nin altı etik ilkesinden biri değildir?", "o": ["Kârlılık", "Sır saklama", "Etik düşünme", "Sürekli gelişim", "Özen ve titizlik"], "a": 0, "e": "İlkeler: temel ilke; bağımsızlık, dürüstlük ve adillik; özen ve titizlik; sürekli gelişim; sır saklama; etik düşünme."}, {"q": "Türk mevzuatı ile hizmet sunulan yabancı ülke mevzuatı çelişirse sermaye piyasası çalışanı nasıl davranmalıdır?", "o": ["Türk mevzuatına uyar", "Yabancı ülke mevzuatına uyar", "Müşterinin tercihine göre davranır", "Daha katı olan düzenlemeye uyar", "Daha esnek olan düzenlemeye uyar"], "a": 3, "e": "Mevzuatlar çeliştiğinde veya düzenleme bulunmadığında daha katı olan düzenlemeye göre hareket edilir."}, {"q": "Bir çalışan kurumunda mevzuata aykırı işlem yapıldığını fark eder, uyardığı halde işlem devam ederse ne yapmalıdır?", "o": ["Sessiz kalmalıdır", "İşlemle ilişkisini kesmeli, gerektiğinde SPK, MASAK ve/veya TSPB'ye bildirmelidir", "Kurumdan habersiz işlemi kendisi düzeltmelidir", "Yalnızca müşteriyi aramalıdır", "Basına açıklama yapmalıdır"], "a": 1, "e": "Önce ilgililer uyarılır, devam ederse ilişki kesilir ve gerektiğinde SPK, MASAK ve/veya TSPB'ye bildirim yapılır."}, {"q": "Bir bilginin içsel bilgi olup olmadığının değerlendirilmesiyle ilgili hangisi yanlıştır?", "o": ["Kaynağa güven azaldıkça içsel olma ihtimali azalır", "Fiyat etkisinin belirsizliği arttıkça bilginin önem düzeyi azalır", "KAP'ta yayımlanan bilgi yayılmış sayılır", "Küçük bir analist grubuna yapılan kapalı sunumdaki bilgi kamuya yayılmış sayılmayabilir", "Kişisel analizle ulaşılan öngörüler içsel bilgidir"], "a": 4, "e": "Kişisel analiz ve araştırmaya dayalı öngörüler içsel bilgi kapsamında değildir; ancak dayanak belgeler saklanmalıdır."}, {"q": "Derinliği göremeyen yatırımcılara aktif işlem varmış izlenimi vermek için sürekli bir lotluk emir girmek hangi kapsamda değerlendirilir?", "o": ["İçsel bilgi kullanımı", "Gerçekdışı gösterim", "Piyasa bozucu eylem", "Uygunluk ihlali", "Serbest piyasa işlemi"], "a": 2, "e": "Bu tip işlemler fiyat eğilimini saptıracak boyutta olmasa da piyasanın etkinliğini bozduğundan piyasa bozucu eylem sayılır ve idari para cezasıyla cezalandırılır."}, {"q": "Bir analistin televizyonda bir hisse için \"al\" tavsiyesi verip ertesi gün portföyündeki aynı hisseleri satması nasıl nitelendirilir?", "o": ["İletişim ve haberleşme yoluyla piyasa bozucu eylem", "Emir ve işlemler yoluyla piyasa bozucu eylem", "İzin verilen bir işlem", "Yalnızca uygunluk ihlali", "Kayıtların saklanması ihlali"], "a": 0, "e": "Bu davranış iletişim ve haberleşme yoluyla yapılan piyasa bozucu eylemdir ve davranış kuralının ihlalidir."}, {"q": "Sadakat, sağduyu ve özen kuralı bakımından en iyi şekilde gerçekleştirme yükümlülüğü neyi ifade eder?", "o": ["İşlemin her durumda en ucuz şekilde yapılmasını", "İşlemin kurumun portföyünden yapılmasını", "İşlemin en hızlı şekilde yapılmasını", "İşlemin müşterinin tercih ve hedeflerine göre en uygun sonucu verecek şekilde yapılmasını", "İşlemin yalnızca borsada yapılmasını"], "a": 3, "e": "Amaç en ucuz değil, müşterinin risk, getiri, kısıt ve hedeflerine en uygun sonuçtur."}, {"q": "\"Adil davranma\" davranış kuralı neyi ifade eder?", "o": ["Tüm müşterilere tamamen eşit davranmayı", "Aynı nitelik ve niceliklere sahip müşterilere aynı koşullarda davranmayı", "Büyük müşterilere öncelik vermeyi", "Yalnızca bireysel müşterileri korumayı", "Müşterilere sunulan hizmetlerin hiç farklılaşmamasını"], "a": 1, "e": "Adil davranma eşit davranma değildir; aynı nitelikteki müşterilere aynı koşullarda davranmaktır."}, {"q": "Uygunluk testi sonucunda ürünün uygun olmadığı anlaşıldığı halde müşteri işlem yapmakta ısrar ederse hangisi doğrudur?", "o": ["Çalışan her durumda hizmet vermek zorundadır", "Müşterinin hesabı kapatılır", "Müşteri uyarılmadan işlem yapılır", "Test yeniden yapılarak sonuç değiştirilir", "Portföy yöneticiliği ve yatırım danışmanlığı dışında çalışan hizmet verip vermemekte serbesttir; portföy yönetimi ve danışmanlıkta uygun olmayan hizmet sunulamaz"], "a": 4, "e": "Müşteri yazılı uyarılır; ısrar ederse çalışan serbesttir; ancak portföy yönetimi ve yatırım danışmanlığında test sonucuna uygun olmayan hizmet sunulamaz."}, {"q": "Performans sunumu davranış kuralına göre aşağıdakilerden hangisi uygundur?", "o": ["Geçmiş yılın getirisini bu yılın beklentisi olarak sunmak", "Tüm portföylerin getirisini toplu olarak göstermek", "Performansı gösterge verilerle karşılaştırmalı, tam ve anlaşılır sunmak", "%80'i paylardan oluşan fona mevduat faizini karşılaştırma ölçütü yapmak", "Ölçek farkıyla grafikleri büyütmek"], "a": 2, "e": "Performans tam, doğru, kesin, anlaşılır ve gösterge verilerle karşılaştırmalı sunulmalıdır; diğer şıklar aykırıdır."}, {"q": "Gizliliğin korunması kuralının istisnası olan durum hangisidir?", "o": ["Mevzuat gereği şüpheli işlem bildirimi yapılması", "İyi niyetli bir bağış kampanyası için müşteri listesinin paylaşılması", "Eşin ticari faaliyeti için müşteri bilgisinin verilmesi", "Müşteri ilişkisi bittikten sonra bilgilerin paylaşılması", "Arkadaşa yardım amacıyla bilgi verilmesi"], "a": 0, "e": "Şüpheli işlem bildirimleri gizlilik kuralının istisnasıdır; kural müşteri ilişkisi bitse de sürer ve iyi niyet istisna oluşturmaz."}, {"q": "Sermaye piyasası çalışanının işverenine karşı sadakat borcunun istisnası hangi durumda söz konusu olabilir?", "o": ["Daha yüksek maaşlı iş teklifi alındığında", "Kişisel yatırım yaparken", "Müşteri listesini yeni işyerine götürürken", "İşverenin bilerek mevzuata aykırı faaliyetinde piyasa güvenini koruma amacıyla talimata karşı çıkıldığında", "İşverenin ticari sırlarını kullanırken"], "a": 3, "e": "İşveren bilerek mevzuata aykırı davranıyorsa, kişisel çıkar değil piyasa güveni amaçlanmak şartıyla talimata karşı çıkmak sadakat kuralının istisnasıdır."}, {"q": "Çalışanın hizmeti nedeniyle üçüncü kişilerden menfaat kabul etmesiyle ilgili kural hangisidir?", "o": ["Hiçbir koşulda kabul edemez", "Kabul etmeden önce işverenine bildirip yazılı izin almalıdır", "Yalnızca müşteriye bildirmesi yeterlidir", "Tutar küçükse izin gerekmez", "Kabul ettikten bir yıl sonra bildirir"], "a": 1, "e": "İşverenin yazılı izni olmadan menfaat kabul edilmez; yazılı izin e-posta şeklinde de olabilir."}, {"q": "Çalışanın iş sırasında ürettiği kayıtların mülkiyeti ve kullanım hakkı ile ilgili hangisi doğrudur?", "o": ["Mülkiyet ve kullanım hakkı işverene aittir", "Kayıtlar kamuya açıktır", "Mülkiyet ve kullanım hakkı çalışana aittir", "Mülkiyet müşteriye aittir", "Mülkiyet çalışana, ticari kullanım hakkı işverene aittir"], "a": 4, "e": "Kayıtların mülkiyeti çalışana aittir; ancak ticari amaçla kullanım hakkı kuruma aittir, başka işyerinde ticari amaçla kullanılamaz."}, {"q": "Çıkar çatışması davranış kurallarına göre işlemlerin öncelik sırası hangisidir?", "o": ["Çalışan, işveren, müşteri", "İşveren, müşteri, çalışan", "Müşteri, işveren, çalışan", "Müşteri, çalışan, işveren", "İşveren, çalışan, müşteri"], "a": 2, "e": "Önce müşterilerin, sonra işverenin işlemlerine, en son çalışanın kendi işlemlerine öncelik verilir."}, {"q": "Üçüncü taraflardan sağlanan komisyon veya ücretlerle ilgili davranış kuralı hangisidir?", "o": ["Yasak değildir; işverene ve müşterilere açıklanması yeterlidir", "Kesinlikle yasaktır", "Yalnızca SPK'ya bildirilir", "Yalnızca yıllık raporda açıklanır", "Yalnızca tutarı küçükse serbesttir"], "a": 0, "e": "Kural menfaat sağlanmasını yasaklamaz; işveren ve müşterilere açıklanması yeterlidir."}]}];
const P={"1": ["Merhaba, Sermaye Piyasası Kanunu'nun ilk bölümündeyiz. Bugün sermaye piyasasının ne olduğunu, araçları, ihraç sürecini ve kamuyu aydınlatma belgelerinden doğan sorumluluğu konuşacağız. Bu bölüm sınavda hem tanım hem de süre soruları olarak sık geliyor.", "Önce tanım. Sermaye piyasası, orta ve uzun vadeli fonların sermaye piyasası araçları yoluyla tasarruf sahiplerinden fon talep edenlere aktarıldığı piyasadır. Anahtar kelime doğrudan finansmandır. Para piyasası ile birlikte finans piyasasının alt türüdür. Finans piyasasının beş fonksiyonu var: reel piyasaya kaynak, sermaye birikimi, likidite, risklerin dağıtılması ve mülkiyetin tabana yayılması.", "Birincil ve ikincil piyasayı karıştırma. Birincil piyasada araç ilk kez satılır ve ihraççıya fon gider. İkincil piyasada araç yatırımcılar arasında el değiştirir, ihraççıya fon gitmez. İkincil piyasanın üç işlevi var: likidite, fiyat belirleme ve vade belirleme. Bunu üçlü olarak ezberle.", "Sermaye piyasasının beş unsuru: fon talep edenler yani ihraççılar, fon arz edenler yani yatırımcılar, sermaye piyasası araçları, yardımcı kuruluşlar ve borsalar. İhraççı tanımında tüzel kişiler ve Kanuna tabi yatırım fonları var. Gerçek kişiler ve donatma iştiraki ihraç yapamaz. Kitle fonlamasıyla para toplayanlar da ihraççı sayılmaz.", "Mevzuat hiyerarşisinde en üstte Sermaye Piyasası Kanunu var, sonra Kurulun yönetmelik, tebliğ ve ilke kararları, sonra otuz iki sayılı Karar ve borsa mevzuatı gibi diğer düzenlemeler, en altta genel hükümler. Genel hükümler ancak Kanunda ve ikincil mevzuatta hüküm yoksa uygulanır. Kanun bir çerçeve kanundur, detayı Kurula bırakır.", "Kanunun uygulanmadığı yerler sınavın sevdiği konulardandır. Merkez Bankasına ve işlemlerine Kanun uygulanmaz, tek istisna teminat sözleşmelerini düzenleyen kırk yedinci maddedir. Merkez Bankası, Hazine ve Maliye Bakanlığı ve kamu varlık kiralama şirketlerinin ihraçlarında izahname ve Kurul onayı gerekmez, otuz birinci maddedeki borçlanma limitleri de uygulanmaz.", "Bankalar için şunu hatırla: Kanun, ortak sayısı bakımından bankalara uygulanmaz. Halka açık bankalarda kurumsal yönetim ilkeleri Bankacılık Düzenleme ve Denetleme Kurumunun görüşüyle uygulanır. Bir banka hakkında yatırımcı tazmin kararı için de yine o kurumun uygun görüşü şarttır. Mevduat ise yatırımcı tazmini kapsamında değildir.", "Araçlara geçelim. Sermaye piyasası aracı üst kavramdır ve üçe ayrılır: menkul kıymetler, türev araçlar ve diğer araçlar. Menkul kıymeti belirleyen şey sağladığı haktır: ortaklık ya da alacaklılık. Varant ise menkul kıymet değil, türev araçtır. Bu tuzak sık çıkar. Kira sertifikası, gayrimenkul sertifikası ve katılma payı diğer araçlara örnektir.", "Kaydi sistemde haklar senede bağlanmaz, Merkezi Kayıt Kuruluşunda izlenir. Hangi aracın kaydileşeceğine Kurul karar verir. Kayıt açıklayıcıdır, yani kaydın aksi ispat edilebilir ve kayda güvenerek iyiniyetli iktisap olmaz. Tek istisna şu: hakkı üçüncü kişilere ileri sürerken Merkezi Kayıt Kuruluşundaki kayıt tarihi esas alınır.", "Teminat sözleşmelerinde iki kritik bilgi var. Birincisi yazılı şekil geçerlilik şartıdır. İkincisi, sözleşmede hüküm yoksa mülkiyet teminat alana geçmemiş sayılır. Mülkiyet verende kalıyorsa, teminat alanın satma yetkisi sözleşmede açıkça tanınmalıdır. Satışta alacağın vade tarihindeki değeri esas alınır, artan kısım teminat verene iade edilir.", "Teminat yöneticisi genel saklama yetkisine sahip bir yatırım kuruluşudur ve ihraçtan önce yazılı teminat yönetim sözleşmesi ile yetkilendirilir. Teminattaki varlıklar onun malvarlığından ayrıdır, kamu alacağı için bile haczedilemez. Varlıkları amaç dışı kullanırsa verilecek ceza beş yıldan az olamaz.", "Şimdi ihraç. İhraç, aracın halka arz edilerek ya da edilmeksizin satışıdır. Halka arz ise genel bir çağrı ve onun devamındaki satıştır. Aradaki fark muhatap kitlenin belirli ya da belirsiz olmasıdır. Halka arzda izahname, halka arz edilmeksizin ihraçta ihraç belgesi hazırlanır. Kitle fonlamasında ikisi de gerekmez.", "İzahname onayı bir izin değildir, Kurul bilgilerin doğruluğunu garanti etmez ve bu bir yatırım tavsiyesi de değildir. Onay için bilgiler tutarlı, anlaşılabilir ve eksiksiz olmalıdır. Satış sürecinde değişiklik olursa Kurula derhal bildirilir, yedi iş günü içinde onaylanıp yayımlanır, yatırımcı da iki iş günü içinde talebini geri alabilir. Yedi ve iki, bunu aklında tut.", "İzahname on iki ay boyunca kullanılabilir. Bu sürede yeni ihraçlarda sadece ek ve değişikliklerin onayı yeterlidir. Süre dolunca izahnamenin tamamı yeniden onaylanır.", "Sorumluluk tarafında önce ihraççı sorumludur. İhraççıdan tazmin edilemezse halka arz edenler, lider aracı kurum, varsa garantör ve yönetim kurulu üyeleri kusurlarına göre devreye girer. Diğer kamuyu aydınlatma belgelerini imzalayanlar müteselsilen sorumludur. Bilgisi olmadığını ve kast ya da ağır ihmali bulunmadığını ispatlayan kişi sorumluluktan kurtulur. Özetten ise ancak diğer kısımlarla birlikte okunduğunda yanıltıcıysa sorumluluk doğar.", "Pay ihracında tam ve nakden ödeme ilkesi geçerlidir, taksitli ödeme yani apel yoktur. Birleşme ve bölünme gibi yapılandırmalarda Kurul istisna tanıyabilir. Piyasa fiyatı nominalin üstündeyse primli satış istenebilir, altındaysa nominalin altında ihraca izin verilebilir.", "Borçlanma araçlarında toplam tutar Kurulun limitini aşamaz. İhraç yetkisi esas sözleşmeyle yönetim kuruluna süreli ya da süresiz devredilebilir. Borçlanma aracı sahipleri kurulunda karar için nominal tutarın en az yarısını temsil edenlerin olumlu oyu gerekir ve bu karar olumsuz oy verenleri de bağlar.", "Özetleyelim. Bir: ikincil piyasa likidite, fiyat ve vade belirler ama ihraççıya fon sağlamaz. İki: Merkez Bankasına Kanun uygulanmaz, istisna teminat sözleşmeleridir. Üç: varant türev araçtır. Dört: Merkezi Kayıt Kuruluşu kaydı açıklayıcıdır, üçüncü kişilere karşı kayıt tarihi esastır. Beş: izahname değişikliğinde yedi iş günü ve iki iş günü, izahname geçerliliği on iki ay. Altı: borçlanma aracı sahipleri kurulunda nominalin en az yarısı."], "2": ["Merhaba, Sermaye Piyasası Kanunu'nun ikinci bölümündeyiz: ihraççılar ve halka açık ortaklıklar. Burada sınavın çok sevdiği oranlar var: yüzde elli, üçte iki, dörtte üç, yüzde doksan sekiz. Sırayla gidelim.", "İhraççı ile halka açık ortaklık farklı şeyler. İhraççı herhangi bir sermaye piyasası aracını esas alır, halka açık ortaklık ise payı esas alır. Yani tahvil ihraç eden bir şirket ihraççıdır ama halka açık ortaklık değildir. Halka açık ortaklık her zaman anonim ortaklıktır. Bir de halka arz eden var: elindeki payları satmak için başvuran kişi. O ihraççı sıfatı kazanmaz.", "Halka açık sayılma kuralı: payları borsada işlem gören ortaklıklar ile pay sahibi sayısı beş yüzü aşan anonim ortaklıklar halka açık sayılır. Borsada işlem görmüyorsa iki yıl içinde borsaya başvurmalıdır. Başvurmazsa Kurul talep aramadan karar verir.", "Borsaya girmek istemeyen ortaklık, pay sahibi tam sayısının üçte ikisi ya da toplam oyların dörtte üçü ile Kanun kapsamından çıkabilir. Olumlu oy vermeyenlere ayrılma hakkı doğar. Bir de kooperatif kontrolündeki şirketler var: yıllık en az elli milyon lira satış yapanlar halka açık sayılır ama borsaya başvurmak zorunda değildir.", "Kayıtlı sermaye sisteminde yönetim kurulu, tavana kadar genel kurula gitmeden sermaye artırabilir. Yetki en çok beş yıl için verilir ve beşer yıllık dönemlerle uzatılabilir. İmtiyazlı pay çıkarma, primli ya da iskontolu pay çıkarma ve yeni pay alma hakkını kısıtlama için esas sözleşmede yetki olmalıdır. Bu kararlara karşı ilandan itibaren otuz gün içinde iptal davası açılabilir.", "Kâr dağıtımında eski Kanundaki asgari oran zorunluluğu kalktı. Şimdi genel kurulun belirlediği kâr dağıtım politikası esastır. Kâr payı, dağıtım tarihindeki tüm paylara eşit dağıtılır. Bağış için esas sözleşmede hüküm şarttır, sınırı genel kurul koyar ve bağışlar dağıtılabilir kâr matrahına eklenir.", "Kâr payı avansı kuralı basit bir hesap sorusu olarak gelir: bir dönemdeki toplam avans, önceki yılın dönem kârının yarısını aşamaz. Önceki yıl kâr yüz milyonsa avans en fazla elli milyondur.", "Örtülü kazanç aktarımında iki yol var. Aktif yolda ilişkili tarafla emsale aykırı işlem yapılır. Pasif yolda ise yapılması gereken yapılmaz ve ilişkili tarafın kârı artar. Aktif olan suçtur, pasif olan idari para cezasıdır. Tespit halinde aktarılan tutar kanuni faiziyle iade istenir. Belgeler en az sekiz yıl saklanır.", "İlişkili taraf işlemlerinde yönetim kurulu kararı alınır ve bağımsız üyelerin çoğunluğunun onayı aranır. Onay yoksa durum kamuya açıklanır ve işlem genel kurula gider. Genel kurulda işlemin tarafları ve ilişkili kişiler oy kullanamaz. Bu kurala uymayan kararlar geçerli sayılmaz.", "Yönetim kontrolü iki şekilde elde edilir. Ya oy haklarının yüzde ellisinden fazlasına sahip olursun, ya da yönetim kurulu üyelerinin salt çoğunluğunu seçme hakkı veren imtiyazlı paylara. Kontrolü elde eden, diğer ortaklara zorunlu pay alım teklifi yapar. Yapmazsa oy hakları donar ve teklif konusu payların toplam bedeline kadar idari para cezası verilir.", "Önemli nitelikteki işlemler birleşme, bölünme, tür değiştirme ve imtiyaz düzenlemeleri gibi işlemlerdir ve liste sınırlı değildir. Muhalif ortak ayrılma hakkını kullanabilir: genel kurula katılır, olumsuz oy verir, muhalefet şerhini tutanağa yazdırır ve paylarını adil bedelle ortaklığa satar. Haksız yere toplantıya alınmadıysa bu şartlar aranmaz.", "Çıkarma ve satma hakkında rakam yüzde doksan sekiz. Bir taraf oy haklarının yüzde doksan sekizine ulaşırsa azınlığı çıkarabilir, azınlık da paylarını ona satabilir. Burada tuzak şu: önceden pay alım teklifi yapılmış olması şart değildir.", "Genel kurula geçelim. İlan internet sitesi ve Kamuyu Aydınlatma Platformunda en az üç hafta önce yapılır. Toplantı nisabı kural olarak sermayenin dörtte biridir, ikinci toplantıda nisap aranmaz. Yeni pay alma hakkının kısıtlanması, sermaye azaltımı ve önemli nitelikteki işlemlerde ise katılan oyların üçte ikisi gerekir. Sermayenin yarısı hazırsa çoğunluk yeterlidir.", "Genel kurul blokajı kaldırıldı, yani katılım payların depo edilmesine bağlanamaz. Katılım, Merkezi Kayıt Kuruluşundan alınan listeye göre olur. Esas sözleşme değişikliği için de Kurulun uygun görüşü gerekir.", "İmtiyazlarda iki kural var. İlk halka arzda tüm imtiyazlar kamuya açıklanır. Üst üste beş yıl zarar eden ortaklıkta oy ve yönetimde temsil imtiyazları Kurul kararıyla kaldırılır. Kendi paylarını geri alan ortaklık, geri alım bedeli kadar kısıtlanmış yedek akçe ayırır.", "Özetleyelim. Bir: beş yüzü aşan pay sahibi halka açıklık getirir, borsaya başvuru için iki yıl vardır. İki: kayıtlı sermaye yetkisi en çok beş yıldır. Üç: kâr payı avansı önceki yıl kârının yarısını aşamaz. Dört: yönetim kontrolü yüzde ellinin üzeridir, teklif yapılmazsa oy hakları donar. Beş: çıkarma ve satma hakkı yüzde doksan sekizde doğar. Altı: özel nisapta üçte iki, sermayenin yarısı hazırsa çoğunluk."], "3": ["Merhaba, Sermaye Piyasası Kanunu'nun üçüncü bölümündeyiz: faaliyetler, kurumlar ve Yatırımcı Tazmin Merkezi. Bu bölümde çok sayıda kurum var, o yüzden her birini bir anahtar kelimeyle eşleştirmeye çalışacağız.", "Önce yaklaşım: yeni Kanun kurum bazlı değil faaliyet bazlı düzenleme yapar. Yani soru, bir kurumun ne yapabileceği değil, bir faaliyeti kimin yapabileceğidir. Yatırım hizmetleri on maddede sayılır: emir iletimi, işlem aracılığı, portföy aracılığı, portföy yöneticiliği, yatırım danışmanlığı, yüklenimli ve yüklenimsiz halka arz aracılığı, çok taraflı alım satım sistemleri, saklama ve Kurulun belirleyeceği diğerleri.", "Yan hizmetler farklıdır: danışmanlık, kredi ve döviz hizmetleri, finansal analiz, finansman sağlamada aracılık ve servet yönetimi gibi. Yan hizmet için ayrıca izin gerekmez. Ama sadece yan hizmet yapmak için yatırım kuruluşu kurulamaz. Servet yönetimini yatırım hizmeti şıkkında görürsen dikkat et, o bir yan hizmettir.", "Kitle fonlaması bir projenin ya da girişim şirketinin fonunu halktan platform aracılığıyla toplamaktır. Platformlar ihraççı da değildir, halka açık ortaklık da. İzahname gerekmez, yatırımcı tazmini kapsamında değildir, borçlanmaya dayalı kitle fonlamasına bankacılık mevzuatı uygulanmaz. Bilgi formunu imzalayanlar ise müteselsilen sorumludur.", "Kripto varlık hizmet sağlayıcıları iki bin yirmi dört yılında yedi bin beş yüz on sekiz sayılı Kanunla Kurulun denetimine alındı. Kuruluş, faaliyet ve pay devirleri Kurul iznine tabidir. Bilgi sistemleri için Türkiye Bilimsel ve Teknolojik Araştırma Kurumunun kriterlerine uygunluk aranır.", "Yatırım kuruluşu kavramı aracı kurumları, bankaları ve Kurulca belirlenen diğer kurumları kapsar. Bankaların hepsi emir iletimi, işlem ve portföy aracılığı ile saklama yapabilir. Ama portföy yöneticiliği, yatırım danışmanlığı ve halka arz aracılığını sadece yatırım ve kalkınma bankaları yapar. Mevduat ve katılım bankaları halka arz aracılığı yapamaz.", "Yetki belgesi iptal halleri sayılarla gelir: izinden itibaren iki yıl faaliyette bulunmamak, ya da şartların kaybedildiğinin tespitinden itibaren üç ay içinde şartları yeniden sağlayamamak. Tüm izinleri iptal edilen kurum da üç ay içinde ya sona erme kararı alır ya da esas sözleşmesini değiştirir.", "Kolektif yatırım kuruluşlarında iki model var. Şirket modeli yatırım ortaklığını, sözleşme modeli yatırım fonunu doğurur. Dört ilkeyi hatırla: riskin dağıtılması, profesyonel yönetim, müşterek sermaye ve malvarlığının korunması. Yatırım ortaklıkları kayıtlı sermayeli anonim ortaklık olarak kurulur ve unvanlarında yatırım ortaklığı ibaresi bulunur.", "Değişken sermayeli yatırım ortaklığında sermaye her zaman net aktif değere eşittir. Paylar yatırımcı payları ve nama yazılı kurucu paylarıdır. Payların itibari değeri yoktur ve yatırımcı payları idari hak vermez. Bu üç bilgi tipik bir doğru yanlış sorusu olur.", "Yatırım fonunu sadece portföy yönetim şirketi kurar, fonun tüzel kişiliği yoktur ve inançlı mülkiyet esasına göre işler. Fon başvurusu iki ayda, portföy yönetim şirketi başvurusu altı ayda sonuçlanır. Fon sadece tapu ve sicil işlemlerinde tüzel kişi sayılır ve bu işlemler portföy yönetim şirketi ile saklayıcının birer yetkilisinin müşterek imzasıyla yapılır.", "Saklama kuruluşu ile portföy yönetim şirketi aynı tüzel kişi olamaz. Saklayıcı alt saklamaya verirse saklayıcılar müteselsilen sorumludur. Taraflar birbirinden zarar talep etmekle yükümlüdür, yatırımcıların dava hakkı da saklıdır.", "Altyapı kuruluşlarında kim izin verir sorusu sık gelir. Merkezi takas kuruluşunun kuruluşuna Kurulun teklifiyle Bakan, faaliyetine Kurul izin verir. Takasbank ise izin aranmaksızın faaliyet gösterir. Borsaların kuruluşuna Kurulun uygun görüşüyle Cumhurbaşkanı karar verir. Takas kesinliği, takas işlemlerinin tasfiye halinde bile geri alınamaması demektir.", "Borsalar artık özel hukuk tüzel kişisidir. İşlemleri durdurur ya da kottan çıkarırlarsa bunu derhal Kurula bildirir ve kamuya açıklarlar. Piyasa işleticisiyle yaptıkları anlaşma Kurul onayı olmadan hüküm doğurmaz. Uyuşmazlık tutarı azami tazmin tutarını aşarsa Kurula itiraz edilebilir.", "Öz düzenleyici kurumlar iki tanedir: Türkiye Sermaye Piyasaları Birliği ve Türkiye Değerleme Uzmanları Birliği. Kurul ikisini de her yıl denetler ve rapor örneği izleyen yılın altıncı ayı sonuna kadar Bakanlığa gider. Sermaye Piyasaları Birliğine kitle fonlama platformları ve kripto varlık hizmet sağlayıcıları da üye olmak zorundadır.", "Yatırımcı Tazmin Merkezine gelelim. Kamu tüzel kişisidir ve Kurul tarafından idare edilir. Tazmin kararı için iflas ya da tedrici tasfiye şart değildir; kuruluşun yükümlülüğünü yerine getirememesi yeterlidir. Gelirleri arasında idari para cezalarının yüzde ellisi vardır. On yıl talep edilmeyen emanetler de Merkeze emaneten devredilir.", "Azami tazmin yüz bin liradır ve yeniden değerleme oranında artar; Cumhurbaşkanı beş katına kadar çıkarabilir. Bu sınır aynı kuruluştaki tüm hesaplar için tektir. Başvuru ilandan itibaren bir yıl içinde yazılı yapılır, ödeme kural olarak üç ay içinde yapılır. Kuruluşun yöneticileri, yüzde beş ve üzeri ortakları ve onların ikinci dereceye kadar yakınları tazmin edilmez.", "Tedrici tasfiyede ödeme sırası şöyle: önce müşteri alacakları, sonra kamu alacakları, sonra Yatırımcı Tazmin Merkezinin alacakları, en son diğer alacaklar. Tasfiye sürerken iflas kararı verilemez.", "Özetleyelim. Bir: servet yönetimi yan hizmettir ve yan hizmet için ayrıca izin gerekmez. İki: halka arz aracılığını sadece yatırım ve kalkınma bankaları yapabilir. Üç: fon başvurusu iki ay, portföy yönetim şirketi başvurusu altı ay. Dört: borsa kuruluşu Cumhurbaşkanı, takas kuruluşu Bakan kararıyla olur. Beş: azami tazmin yüz bin lira, zamanaşımı bir yıl, ödeme üç ay. Altı: idari para cezalarının yarısı Yatırımcı Tazmin Merkezine gelir yazılır."], "4": ["Merhaba, Sermaye Piyasası Kanunu'nun dördüncü ve son bölümündeyiz: denetim, tedbirler, suçlar ve idari para cezaları. Bu bölüm tamamen sayı ezberi gibi görünür ama mantığını kurarsan kolaylaşır. Önce tedbir, sonra suç, sonra para cezası.", "Denetimde Kurulun yetkisi çok geniştir: vergi kayıtları dahil her türlü defter ve elektronik kayda erişebilir. Bilgi istenen kişi, kendi özel kanunundaki sır saklama hükmünü gerekçe gösteremez. Ayrıca incelemeye konu olan herkes incelemenin varlığını sır olarak saklamak zorundadır.", "Kanuna aykırı ihraçta paraların iadesi için bir takvim var. Muhatap otuz gün içinde kimden ne kadar para topladığını ilan eder. İlandan sonra üç ay içinde itiraz edilebilir ve itiraz asliye hukuk mahkemesine yapılır. İhbardan itibaren bir yıl içinde sonuçlar ortadan kaldırılmazsa Kurul dava açar. Otuz gün, üç ay, bir yıl.", "İzahnameye aykırı fon kullanımında Kurul, tespitten itibaren üç ay ve her halde onaydan itibaren iki yıl içinde dava açabilir. Malvarlığını azaltıcı işlemlerde ise iptal davası tespitten itibaren üç ay ve işlemden itibaren üç yıl içinde, butlan ya da yokluk davası beş yıl içinde açılır.", "Kurumların mali durumu bozulursa Kurul üç ayı geçmemek üzere süre verir ya da faaliyeti doğrudan durdurur. Gerekirse tedrici tasfiye ve iflas ister. Sorumluluğu tespit edilen yüzde ondan fazla paya sahip ortakların, yönetim kurulu üyelerinin ve imzaya yetkili yöneticilerin şahsen iflasını da isteyebilir.", "İnternetten yapılan izinsiz faaliyette erişim engelleme kararını Kurul verir, kararı uygulamak üzere Erişim Sağlayıcıları Birliğine gönderir. Yurt dışı bir kripto platformu Türkiye'de iş yeri açarsa, Türkçe site kurarsa ya da burada tanıtım yaparsa, faaliyeti Türkiye'ye yönelik sayılır ve izinsiz kabul edilir.", "Suçlarda önemli bir usul kuralı var: soruşturma için Kurulun Cumhuriyet Başsavcılığına yazılı başvurusu gerekir. Bu bir muhakeme şartıdır. İddianame kabul edilince Kurul davada katılan olur.", "Bilgi suistimali, eski adıyla içeriden öğrenenlerin ticareti. Henüz açıklanmamış bilgiye dayanarak emir veren, değiştiren ya da iptal eden kişi cezalandırılır. Ceza üç ile beş yıl hapis veya adli para cezasıdır. Burada bağlaç veya, yani alternatiftir. Adli para cezası da menfaatin iki katından az olamaz.", "Piyasa dolandırıcılığında ise bağlaç ve. İşleme dayalı türde üç ile beş yıl hapis ve beş bin ile on bin gün adli para cezası vardır. Bilgiye dayalı türde yine üç ile beş yıl hapis, adli para cezası beş bin güne kadardır. Etkin pişmanlık için menfaatin iki katı Hazineye ödenir: soruşturmadan önce öderse ceza yok, soruşturmada öderse yarı indirim, kovuşturmada öderse üçte bir indirim.", "Bazı işlemler suç sayılmaz: Merkez Bankasının para ve kur politikası işlemleri, Kurul düzenlemelerine uygun geri alım programları, çalışanlara pay edindirme ve fiyat istikrarı ile piyasa yapıcılığı işlemleri.", "Usulsüz halka arz ve izinsiz faaliyet için ceza iki ile beş yıl hapis ve beş bin ile on bin gün adli paradır. İkisi birlikte işlenirse sadece izinsiz faaliyetten ceza verilir ve ceza yarı oranında artırılır. İzinsiz kripto varlık hizmet sağlayıcılığı ise üç ile beş yıl hapis gerektirir.", "Güveni kötüye kullanmanın nitelikli halinde ceza üç yıldan az olamaz. Aktif örtülü kazanç aktarımı bu suçun kapsamındadır. Pasif örtülü kazanç ise idari para cezasıyla karşılanır. Kripto zimmet suçu en ağır cezalardan biridir: temel halde sekiz ile on dört yıl hapis.", "Diğer suçlar için kısa liste: bilgi ve belge vermeme bir ile üç yıl, denetimi engelleme altı ay ile iki yıl, defterleri usulüne uygun tutmama altı ay ile iki yıl, sır saklama yükümlülüğünü ihlal ise bir ile üç yıl hapis.", "İdari para cezasının Kanundaki tutarı yirmi bin ile iki yüz elli bin lira arasıdır. Menfaat elde edilmişse ceza menfaatin iki katından az olamaz. Tüzel kişilere ise hasılatın yüzde biri ile vergi öncesi kârın yüzde yirmisinden hangisi yüksekse o tutara kadar ceza verilebilir.", "Bir hesap yapalım. Hasılat beş yüz milyon, vergi öncesi kâr kırk milyon olsun. Hasılatın yüzde biri beş milyon, kârın yüzde yirmisi sekiz milyon eder. Yüksek olan sekiz milyon, yani üst sınır sekiz milyon liradır.", "Kabahat karar verilinceye kadar tekrarlanırsa tek ceza verilir ve iki kat artırılır, menfaat varsa ceza menfaatin üç katından az olamaz. Pay alım teklifi yapmayanlara teklif konusu payların toplam bedeline kadar ceza verilir. Piyasa bozucu eylemlerde aralık yirmi bin ile beş yüz bin liradır. Gereksiz denetime yol açanlara ise bin ile yirmi beş bin lira ceza verilir.", "Özetleyelim. Bir: kanuna aykırı ihraçta otuz gün, üç ay, bir yıl. İki: soruşturma Kurulun yazılı başvurusuna bağlıdır. Üç: bilgi suistimalinde üç ile beş yıl hapis veya adli para, piyasa dolandırıcılığında üç ile beş yıl hapis ve adli para. Dört: etkin pişmanlıkta iki kat ödeme; ceza yok, yarı indirim, üçte bir indirim. Beş: idari para cezası yirmi bin ile iki yüz elli bin lira, tüzel kişide hasılatın yüzde biri ya da kârın yüzde yirmisi. Altı: piyasa bozucu eylemde üst sınır beş yüz bin lira."], "5": ["Merhaba, Özel Durumlar Tebliği bölümündeyiz. Bu tebliğ kamuyu aydınlatmanın kalbidir ve sınavda en çok süre ve oran soruları çıkar: iki iş günü, üçüncü iş günü saat dokuz, yüzde beşten yüzde doksan beşe eşikler gibi.", "Önce iki kavram. İçsel bilgi, fiyatı ya da yatırım kararını etkileyebilecek ve henüz kamuya açıklanmamış bilgidir. Sürekli bilgi ise içsel bilgi dışında kalan her şeydir. Özel durum bu ikisinin toplamıdır. Açıklamalar eşit işlem ilkesine uygun, yanıltıcı olmayan ve abartısız biçimde yapılır.", "Tebliğin yeniliklerinden biri yüzde on kuralıdır. İçsel bilgiyi şirketin bilgisi dışında öğrenen, oy haklarında ya da sermayede yüzde on veya üzeri paya sahip kişi bu bilgiyi kendisi açıklar. Erteleme hakkı da artık sadece ihraççıya değil bu kişilere de tanınmıştır.", "Geleceğe yönelik değerlendirmeleri açıklamak zorunlu değildir. Ama açıklayacaksan üç kural var: yönetim kurulu kararı ya da yetkili kişinin yazılı onayı, yılda en fazla dört açıklama ve önemli sapma varsa nedenlerinin açıklanması.", "Kapsama gelelim. Tebliğe tabi olmayan tek grup şudur: yurt dışında sermaye piyasası aracı ihraç eden ve halka açık olmayan ortaklıklar. İşlem sırası geçici kapatılmış şirketler ve borçlanma aracını yurt içinde halka arz eden şirketler ise kapsamdadır.", "İçsel bilgi, işin olağan akışında üçüncü bir kişiye verilirse ihraççı bunu kamuya açıklar. Ama bilgiyi alan kişinin gizlilik yükümlülüğü varsa, örneğin sözleşmeyle bağlı bir danışmansa, açıklama gerekmez.", "Erteleme ihraççının kendi sorumluluğundadır ve Kurul onayı gerekmez. İki şart vardır: yatırımcıyı yanıltmamak ve gizliliği sağlayabilmek. Sebep ortadan kalkınca açıklama yapılır ve erteleme kararı ile gerekçesi de yazılır. Olay hiç gerçekleşmezse açıklama yapılmayabilir. Gizlilik sağlanamazsa da bilgi açıklanır.", "İçsel bilgilere erişimi olanların listesi Merkezi Kayıt Kuruluşunda tutulur. Değişiklik olduğunda en geç iki iş günü içinde güncellenir. İdari sorumluluğu bulunan kişiler otomatik olarak bu listede kabul edilir.", "Olağan dışı fiyat ve hacim hareketlerinde ihraççı borsanın talebi üzerine açıklama yapar. Haber ve söylentilerde ise talep beklemez; söylenti şirketten çıkmış olsun olmasın doğru ya da yeterli olup olmadığını açıklar. Söylenti ertelenmiş bir bilgiyle ilgiliyse erteleme bitmiş sayılır. Analist yorumları ve tahminler ise bu yükümlülüğün dışındadır.", "İdari sorumluluğu bulunan kişiler ve ana ortağın işlemlerinde bir eşik var. Bir takvim yılında her birinin işlemleri toplamı Kurulun belirlediği tutara ulaşmadıkça açıklama yapılmaz. Kitapta iki bin yirmi beş için yüz on iki milyon lira olarak geçiyor. Eşik aşıldıktan sonraki tüm işlemler açıklanır.", "Sermaye yapısı eşiklerini sırayla ezberle: yüzde beş, on, on beş, yirmi, yirmi beş, otuz üç, elli, altmış yedi ve doksan beş. Halka açık olmayan ama halka arzla borsada işlem gören şirketlerde sadece yirmi beş, elli ve altmış yedi kullanılır. Donmuş oy hakları da hesaba katılır.", "Burada çok sorulan bir tuzak var: kişi eşiği doğrudan sahip olduğu paylarla aşarsa açıklamayı Merkezi Kayıt Kuruluşu yapar. Birlikte hareket, dolaylı sahiplik ya da oy hakkı yoluyla aşarsa açıklamayı kişinin kendisi yapar. Yatırım fonlarında açıklamayı kurucu yapar.", "Oy hakkı hesabına başkalarının oyları da girebilir: ortak politika için yazılı sözleşme yapılanlar, oy hakkı geçici devredilenler, teminattaki paylar, intifa hakları, kontrol edilen işletmeler ve aksine talimat yoksa vekaleten kullanılan oylar.", "Süreler önemli. Sermaye yapısı açıklamaları en geç işlemi izleyen üçüncü iş günü saat dokuza kadar yapılır. Genel bilgilerdeki değişiklikler ise iki iş günü içinde güncellenir. Yüzde beş ve üzeri ortakları gösteren tabloyu Merkezi Kayıt Kuruluşu derhal günceller.", "Bilgilendirme politikasının beş asgari unsuru var: sunumlara nasıl ulaşılacağı, söylentilerin takibi, idari sorumlu kişilerin belirlenme esası, gizlilik tedbirleri ve geleceğe yönelik değerlendirme esasları.", "Açıklamalar Türkçe yapılır, Kurul isterse başka dillerde de istenebilir. Borsada işlem gören şirketler Kamuyu Aydınlatma Platformunu kullanır, işlem görmeyenler ise açıklamayı Kurula gönderir. Açıklamalar reklam amacıyla kullanılamaz. Borsada işlem gören şirket açıklamayı ertesi iş günü kendi sitesine koyar ve beş yıl tutar; işlem görmeyen şirket için bu süre beş iş günüdür.", "Özetleyelim. Bir: içsel bilgi henüz açıklanmamış bilgi, sürekli bilgi geri kalan her şeydir. İki: yüzde on sahipleri öğrendikleri içsel bilgiyi kendileri açıklar. Üç: erteleme ihraççının sorumluluğundadır, Kurul onayı gerekmez. Dört: erişim listesi ve genel bilgiler iki iş gününde güncellenir. Beş: sermaye yapısı eşikleri beşten doksan beşe, doğrudan pay aşımında açıklamayı Merkezi Kayıt Kuruluşu yapar. Altı: sermaye yapısı açıklaması üçüncü iş günü saat dokuza kadar yapılır."], "6": ["Merhaba, Kurumsal Yönetim Tebliği bölümündeyiz. Bu bölüm geniş: kavramlar, Türk Ticaret Kanunu hükümleri, tebliğin kapsamı ve sınavın en sevdiği yer olan yönetim kurulu ilkeleri. Sayılar çok, ama gruplayarak gidersek kolay.", "Kurumsal yönetimin bilimsel temeli Berle ve Means'in bin dokuz yüz otuz iki tarihli kitabıdır: mülkiyet ile kontrolün ayrılması meselesi. Dört ana ilke var: adillik, şeffaflık, hesap verebilirlik ve sorumluluk. Farkı ezberle: şeffaflık faaliyetin öncesini, sürecini ve sonrasını kapsar, hesap verebilirlik ise sadece sonrasını.", "Sistemleri karşılaştıralım. Anglo-Sakson sistemde mülkiyet dağınıktır, ana hissedarlar emeklilik ve yatırım fonlarıdır, piyasa şeffaftır ve piyasalar şirketleri kontrol eder. Kıta Avrupasında hakim ortak vardır, ana ortaklar bankalardır ve piyasa daha az şeffaftır. Türk Ticaret Kanunu kurumsal yönetimde genel olarak Anglo-Sakson çizgisindedir.", "Türk Ticaret Kanunu tarafında azınlık oranı onda birdir, halka açık şirketlerde yirmide bir. Bu oran gündem isteme, finansal tabloların görüşülmesini bir ay erteletme, özel denetim ve haklı sebeple fesih için kullanılır. Özel denetimde alternatif olarak bir milyon lira itibari değer de yeterlidir.", "Birkaç sayıyı daha aklında tut: finansal tablolar genel kuruldan on beş gün önce incelemeye açılır. Bir paya en çok on beş oy tanınabilir. Yönetim kurulu üyeleri en çok üç yıl için seçilir. Borsada işlem gören şirkette riskin erken saptanması komitesi zorunludur ve yönetim kuruluna iki ayda bir rapor verir.", "Tebliğ iki bin on dört Ocak'ında yayımlandı. Kapsamı Yıldız, Ana ve Alt Pazar'da işlem gören halka açık ortaklıklardır. Şirketler piyasa değeri ve fiili dolaşımdaki payların piyasa değerine göre üç gruba ayrılır. Mart, Haziran, Eylül ve Aralık sonu verilerinin ortalaması alınır, hesap her yıl Ocak'ta yapılır. Kitaptaki eşikler birinci grup için üç milyar ve yedi yüz elli milyon, ikinci grup için bir milyar ve iki yüz elli milyon liradır.", "Yeni halka arz olan şirket, liste ilan edilene kadar üçüncü gruptadır. Üst gruba çıkan şirket izleyen yıldan itibaren yeni kurallara uyar. Bankalarda bağımsız üye sayısı üçten az olamaz ve denetim komitesi üyeleri bağımsız sayılır. Haklı gerekçeyle bir kriteri sağlamayan kişi de en fazla bir yıllığına bağımsız üye seçilebilir.", "Şirket zorunlu ilkelere uymazsa Kurul otuz gün süre verir. Süre sonunda gerekli sayıda bağımsız üyeyi kendisi atar. Uyum raporlamasında URF ve KYBF adlı iki şablon kullanılır. URF'de kısmen veya hayır cevabı verirsen açıklama yapmak zorundasın. Şablonlar genel kuruldan en az üç hafta önce doldurulur.", "İlişkili taraf işlemlerinde iki eşik var: yüzde beş ve yüzde on. Oran yüzde beşi aşarsa değerleme yaptırılır. Yüzde onu aşarsa ayrıca bağımsız üyelerin çoğunluğunun onayı gerekir. Onay yoksa işlem genel kurula gider; orada toplantı nisabı aranmaz, basit çoğunlukla karar alınır ve taraflar oy kullanamaz. Süreklilik arz eden işlemlerde yüzde onu aşan durumda yönetim kurulu bir rapor hazırlar.", "Yatırımcı ilişkileri bölümü genel müdüre bağlı çalışır ve yılda en az bir kez yönetim kuruluna rapor verir. Yöneticisinde ileri düzey ve kurumsal yönetim derecelendirme lisansları aranır, üçüncü grupta temel düzey lisans da yeterlidir. Yönetici ayrılırsa otuz gün içinde yenisi atanır.", "Teminat, rehin, ipotek ve kefalette şirket kendisi, tam konsolide ettiği şirketler ve olağan ticari faaliyet için verebilir. Yeni halka arz olan şirket aykırı teminatları dördüncü yılın sonuna kadar sıfırlar. Bankalar ve yatırım ortaklıkları bu kurala tabi değildir.", "İlkelere gelelim. Genel kurul belgeleri üç hafta önce yayımlanır. Genel kurulda cevaplanamayan sorular on beş gün içinde yazılı cevaplanır, tüm sorular otuz gün içinde siteye konur. Önemli işlemlerde oran yüzde onu aşarsa bağımsız üye onayı gerekir. İnternet sitesinde son beş yılın bilgileri bulunur.", "Yönetim kurulu en az beş üyedir ve çoğunluğu icrada görevli olmayan üyelerden oluşur. Bağımsız üye sayısı üçte birden az olamaz, küsurat yukarı yuvarlanır ve en az iki bağımsız üye olur. Sekiz kişilik bir kurulda sekizin üçte biri iki virgül altmış yedi eder, yani üç bağımsız üye gerekir. Görev süresi üç yıla kadardır.", "Bağımsızlık kriterlerinde sayılar: son beş yılda önemli ilişki yok, yüzde beşten fazla pay yok, son on yılda altı yıldan fazla yönetim kurulu üyeliği yok, gruptan üçten fazla ve toplamda beşten fazla borsa şirketinde bağımsız üyelik yok. Üniversite öğretim üyeliği ise engel değildir.", "Aday listesi genel kuruldan altmış gün önce Kurula gönderilir, Kurul otuz gün içinde olumsuz görüş bildirebilir. Bağımsızlık kaybedilirse üye kural olarak istifa eder; yönetim kurulu otuz gün içinde yeni listeyi gönderir, Kurul yirmi gün içinde görüş bildirir. Kadın üye hedefi yüzde yirmi beşten az olamaz. Denetim komitesinde en az bir üyenin beş yıllık tecrübesi olmalıdır.", "Komiteler en az iki üyelidir, başkanları bağımsız üyelerdir ve denetim komitesinin bütün üyeleri bağımsızdır. Genel müdür hiçbir komitede yer alamaz. Denetim komitesi üç ayda bir, yılda en az dört kez toplanır. Bağımsız üyelere kâr payı, opsiyon ya da performansa dayalı ödeme yapılamaz. Şirket yöneticilerine kredi de veremez.", "Özetleyelim. Bir: şeffaflık her aşamayı, hesap verebilirlik sadece sonrasını kapsar. İki: halka açık şirketlerde azınlık yirmide birdir. Üç: ilişkili tarafta yüzde beş değerleme, yüzde on bağımsız üye onayı. Dört: yönetim kurulu en az beş üye, bağımsızlar en az üçte bir ve en az iki. Beş: aday listesi altmış gün önce, Kurul görüşü otuz gün. Altı: denetim komitesi tamamen bağımsız ve yılda en az dört toplantı."], "7": ["Merhaba, Kolektif Yatırım Kuruluşları serisinin ilk bölümündeyiz: gayrimenkul yatırım ortaklıkları. Bu bölüm sayılarla dolu, o yüzden sana önemli rakamları gruplayarak anlatacağım.", "Önce yapıyı netleştirelim. Tebliğde iki tür gayrimenkul yatırım ortaklığı var. Birincisi klasik gayrimenkul yatırım ortaklığı: gayrimenkule, gayrimenkul projesine ve gayrimenkule dayalı haklara yatırım yapar. İkincisi münhasıran altyapı yatırım ve hizmetlerinden oluşan portföyü işleten altyapı gayrimenkul yatırım ortaklığı. Bu iki tür birbirinin alanına giremez; klasik gayrimenkul yatırım ortaklığı arızi olanlar dışında altyapıya, altyapı gayrimenkul yatırım ortaklığı da altyapıyla ilgisiz gayrimenkule yatırım yapamaz. Bir de şunu unutma: altyapı gayrimenkul yatırım ortaklığına yalnızca altyapı şirketleri dönüşebilir.", "Sermaye şartına geçelim. Klasik gayrimenkul yatırım ortaklığında başlangıç sermayesi en az bir milyar lira, altyapı gayrimenkul yatırım ortaklığında bir buçuk milyar lira. Nakit şartı da şöyle: sermaye iki milyar liranın altındaysa payların en az yüzde onu, iki milyar ve üzerindeyse sermayenin iki yüz milyon liralık kısmı nakit karşılığı çıkarılmalı. Altyapı gayrimenkul yatırım ortaklığında bu tutar yüz elli milyon lira.", "Gayrimenkul yatırım ortaklığının ayni sermaye kabul edebilmesi önemli bir ayrım noktası. Yalnızca ipoteksiz ve değerini önemli ölçüde etkileyen takyidat şerhi olmayan gayrimenkuller ayni sermaye olarak konulabilir. Değer tespitinde Türk Ticaret Kanunu değerlemesi ile Tebliğe göre yapılan değerlemeden düşük olan esas alınır. Ayni sermaye artırımı kararını ise yalnızca genel kurul alabilir.", "Halka arz takvimi sınavın favorisi. Klasik gayrimenkul yatırım ortaklığı tescilden itibaren üç ay içinde, çıkarılmış sermayesinin en az yüzde yirmi beşi için halka arz başvurusu yapmalı. Başvurmazsa gayrimenkul yatırım ortaklığı olma hakkı kalkar ve üç ay içinde esas sözleşmesini değiştirmezse sona ermiş sayılır. Altyapı gayrimenkul yatırım ortaklığında süreler uzun: iki yıl içinde organizasyon ve portföy uyumu, ardından sermaye üç milyar liranın altındaysa iki yıl, üzerindeyse dört yıl içinde halka arz başvurusu.", "Altyapı gayrimenkul yatırım ortaklığında bir incelik daha var. İşletme dönemine geçmemiş yatırımlar ağırlıktaysa, yani işletme dönemindeki altyapı şirket ve projeleri aktifin yüzde altmışından azsa, paylar yalnızca nitelikli yatırımcılara satılabilir. Nitelikli yatırımcıya satışta izahname gerekmez, paylar nama yazılı olur ve tanıtım amaçlı reklam yapılamaz.", "Kuruculara gelince, şartlar diğer kurumlardaki tanıdık liste: iflas etmemiş olmak, ağır suçlardan mahkum olmamak, mali güç, dürüstlük, muaccel vergi borcu olmaması. Dolaylı olarak yüzde yirmi ve üzeri pay sahibi gerçek kişilerde mali güç şartı hariç diğerleri aranır. İflas ve izin iptaline ilişkin engeller kesinleşmeden itibaren on yıl sonra dikkate alınmaz.", "İmtiyaz konusunu iyi ayır. Gayrimenkul yatırım ortaklığı yalnızca yönetim kuruluna aday gösterme imtiyazı olan pay ihraç edebilir ve halka açıldıktan sonra hiçbir imtiyaz yaratılamaz. Üst üste beş yıl zarar eden halka açık gayrimenkul yatırım ortaklığında imtiyazlar Kurul kararıyla kalkar.", "Yönetim tarafında yönetim kurulu üyelerinin çoğunluğu dört yıllık mezun ve ilgili alanlarda en az üç yıl tecrübeli olmalı. Genel müdür ise en az beş yıl tecrübeli, tam zamanlı çalışır ve son on iki ayda altı aydan fazla vekalet edilemez. Bir püf noktası: yalnızca gayrimenkul alım satımıyla uğraşmak tecrübe sayılmaz.", "Portföy sınırlarına geçelim. Klasik gayrimenkul yatırım ortaklığı aktifinin en az yüzde elli birini gayrimenkul ve benzeri varlıklara yatırır; para ve sermaye piyasası araçları ile iştirakler en fazla yüzde kırk dokuz olabilir. Altyapı gayrimenkul yatırım ortaklığında bu oranlar yüzde yetmiş beş ve yüzde yirmi beş. Mevduat ve katılma hesabı en fazla yüzde on, beş yıldır üzerinde proje geliştirilmeyen arsalar en fazla yüzde yirmi, işletmeci şirket iştiraki en fazla yüzde on.", "Yatırım kısıtlarında aklında kalması gereken iki sayı daha var: gayrimenkul yatırım ortaklığı hiçbir şirkette yüzde beşten fazla sermaye veya oy hakkına sahip olamaz ve tek ihraççının araçları aktifin yüzde onunu aşamaz. Ayrıca altın, kıymetli maden ve emtiaya yatırım yapamaz; açığa satış ve ödünç alma yasaktır. Komisyon ödemesi de varlık değerinin yüzde üçünü aşamaz.", "Gayrimenkul yatırım ortaklıklarının yapamayacakları listesini mantıkla hatırla: gayrimenkul yatırım ortaklığı bir yatırım aracıdır, işletmeci değildir. Bu yüzden inşaatı kendisi yapamaz, oteli veya alışveriş merkezini ticari maksatla işletemez, başkalarına proje geliştirme hizmeti veremez, kredi veremez, sürekli kısa vadeli alım satım yapamaz. İnşaat işleri mutlaka müteahhide yaptırılır.", "Borçlanmada gayrimenkul yatırım ortaklıkları özsermayelerinin beş katına kadar kredi kullanabilir. İpotek ve rehin konusunda kural sıkıdır: üçüncü kişiler lehine verilemez; yalnızca kat karşılığı projelerde arsa sahibine, kendi finansmanı için ve yüzde yüz bağlı ortaklıkları lehine verilebilir.", "Değerleme kuralları da çok soruluyor. Değerleme kuruluşu her yıl hesap dönemini izleyen bir ay içinde yönetim kurulu kararıyla belirlenir. Aynı varlık için aynı kuruluştan en fazla üç yıl üst üste hizmet alınır, tekrar için iki yıl beklenir. Satış ve kiralamada ekspertiz değerinin yüzde doksan beşinin altına inilirse bu durum kamuya açıklanır ve genel kurulda bilgi verilir.", "Kamuyu aydınlatmada eşik yüzde iki. Aktifin yüzde ikisini geçen alım, satım veya kiralama işlemi ilk iş günü içinde Kamuyu Aydınlatma Platformunda açıklanır; altında kalanlar dönem sonunu izleyen on iş günü içinde toplu olarak. Değerleme raporları ise teslimden itibaren üç iş günü içinde ilan edilir.", "Son olarak statüden çıkış. Halka açık gayrimenkul yatırım ortaklığı çıkmak isterse olumlu oy vermeyen ortaklara otuz günlük ve altı aylık ortalamalardan yüksek olanla pay alım teklifi yapılır. Bu süreçte ayrılma hakkı doğmaz ve büyük ortaklar bir yıl boyunca tescil günü fiyatının altında satış yapamaz.", "Özetleyelim: bir, klasik gayrimenkul yatırım ortaklığı bir milyar, altyapı gayrimenkul yatırım ortaklığı bir buçuk milyar lira sermaye ister. İki, halka arz üç ay içinde ve en az yüzde yirmi beş. Üç, aktifin en az yüzde elli biri gayrimenkul, bir şirkette en fazla yüzde beş pay. Dört, kredi sınırı özsermayenin beş katı. Beş, değerleme kuruluşu üç yıl kuralı ve yüzde doksan beş eşiği. Hazırsan sorulara geçebilirsin."], "8": ["Merhaba, menkul kıymet yatırım ortaklıkları bölümündeyiz. Bu Tebliğ iki farklı kurumu birlikte düzenliyor: sabit sermayeli menkul kıymet yatırım ortaklığı ve değişken sermayeli ortaklık. İkisini karıştırmamak sınavın anahtarı.", "Sabit sermayeli menkul kıymet yatırım ortaklığı, kayıtlı sermayeli bir anonim ortaklıktır ve payları borsada işlem görür. Kuruluş şartlarının yıldızı iki sayı: kuruluş sermayesi en az üç yüz milyon lira ve çıkarılmış sermayenin en az yüzde kırk dokuzunun halka arzı. Yüzde kırk dokuzu gayrimenkul yatırım ortaklığındaki yüzde yirmi beşle karıştırma; menkul kıymet yatırım ortaklığında halka açıklık çok daha yüksek tutuluyor.", "Paylar nakit karşılığı çıkarılır, ayni sermaye yok. Unvanda Menkul Kıymet Yatırım Ortaklığı ibaresi bulunur ve kurucular arasında en az bir lider sermayedar olmalıdır. Ayrıca kuruluşta bir portföy saklama kuruluşu belirlenmiş olmalı.", "Lider sermayedarı tanıyalım. Halka arz sonrası edinimler hariç sermayenin en az yüzde yirmi beşine sahip ortak ya da ortaklardır. Gerçek kişiyse varlıkları en az yüz elli milyon lira, birden fazla gerçek kişiyse toplam üç yüz milyon lira olmalı. Tüzel kişiyse en az üç yıllık geçmiş, özsermaye sermayenin iki katı ve aktif toplam üç katı aranır. Lider sermayedar payları halka arzdan sonra iki yıl devredilemez.", "Halka arz süresi üç ay: tescilden itibaren üç ay içinde organizasyon kurulur, genel müdür atanır ve yüzde kırk dokuz için başvuru yapılır. Dikkat et, sabit sermayeli menkul kıymet yatırım ortaklığı halka arzdan önce sermaye artırımı yapamaz ve hiçbir imtiyazlı pay ihraç edemez.", "Yönetim kadrosunda menkul kıymet yatırım ortaklığı, gayrimenkul yatırım ortaklığından daha sıkı. Yönetim kurulunun çoğunluğu finansal piyasalarda en az beş yıl tecrübeli olmalı. Genel müdür en az yedi yıl tecrübe ve Sermaye Piyasası Faaliyetleri Düzey 3 lisansı ister. Vekalet sınırı da kısa: on iki ayda en fazla üç ay. Gayrimenkul yatırım ortaklığında bu süre altı aydı, ikisini karıştırma.", "Portföy yönetimini menkul kıymet yatırım ortaklığı kendisi yapabilir, en az bir portföy yöneticisi istihdam etmek kaydıyla; ya da Kurul onayıyla bir portföy yönetim şirketinden hizmet alabilir. Dışarıdan alınan hizmetlerin yıllık maliyeti ortalama net aktif değerin yüzde ikisini geçemez. Risk yönetimi personelinde Düzey 3 ve Türev Araçlar lisansı aranır.", "Portföy sınırlarında yatırım fonlarındakine çok benzeyen bir set var. Tek ihraççı yüzde on, yüzde beşi aşan ihraççıların toplamı yüzde kırk, aynı grup yüzde yirmi. Devlet ihraçlarında bu sınırlar uygulanmaz ama tek varlık yüzde otuz beşi aşamaz. Varlık kiralama şirketlerinde yüzde on yerine yüzde yirmi beş uygulanır.", "Diğer önemli sınırlar şöyle: bir ihraççının sermaye veya oy haklarında en fazla yüzde on; mevduat toplamda yüzde on, tek bankada yüzde üç; altın ve kıymetli madenler yüzde yirmi; fon payları toplam yüzde yirmi, tek fon yüzde beş; Takasbank para piyasası yüzde yirmi. Bir de yasak: sabit sermayeli menkul kıymet yatırım ortaklığı başka sabit sermayeli menkul kıymet yatırım ortaklığına yatırım yapamaz.", "Borçlanma sınırı çok düşük: özkaynağın yüzde yirmisine kadar kredi ya da bono. Gayrimenkul yatırım ortaklığında özsermayenin beş katıydı; aradaki farkı aklında tut. Kâr dağıtımında ise net dağıtılabilir kârın en az yüzde yirmisi nakden dağıtılmak zorunda.", "Bir de fiyat ile net aktif değer ilişkisi var. Pay fiyatı pay başına net aktif değerin iki katını aşarsa, portföy tabloları durum düzelene kadar her iş günü Kamuyu Aydınlatma Platformunda yayımlanır. Haftalık raporlar ise dönemi izleyen ilk iş günü ilan edilir.", "Şimdi değişken sermayeli ortaklığa geçelim. Değişken sermayeli ortaklığın sermayesi her zaman net aktif değerine eşittir; yani fon gibi çalışan bir ortaklıktır. Başlangıç sermayesi en az otuz milyon lira, kurucular net aktif değeri altmış milyon liraya çıkarmayı taahhüt eder. Değişken sermayeli ortaklık portföy yönetimini mutlaka bir portföy yönetim şirketinden almak zorundadır.", "Değişken sermayeli ortaklıkta iki tür pay var. Kurucu payları nama yazılıdır, oy hakkı ve genel kurula katılma gibi bütün ortaklık haklarını verir. Yatırımcı payları ise yalnızca kâr payı ve tasfiye payı hakkı verir, oy yoktur. İkisinde de yeni pay alma hakkı yoktur. Payların itibari değeri bulunmaz ve fiyat pay başına net aktif değerdir.", "Değişken sermayeli ortaklık portföy türleri yatırım fonlarıyla aynı mantıkta. Borçlanma araçları, hisse ve kıymetli maden portföylerinde en az yüzde seksen; para piyasası portföyünde varlıkların vadesi en fazla yüz seksen dört gün, ortalama vade en fazla kırk beş gün. Vade ifadesi kullanılırsa yirmi beş ile doksan gün kısa, doksan bir ile yedi yüz otuz gün orta, daha fazlası uzun vadelidir.", "Son olarak performans ilke kararı. Yıllık nispi getiri negatifse performans yetersiz sayılır. Üst üste iki yıl yetersizlikte portföy yönetim şirketi değiştirilir ya da ortaklık kendisi yönetiyorsa dışarıdan hizmet alınır. Değiştirilen şirketten iki yıl geçmeden tekrar hizmet alınamaz.", "Özetleyelim: bir, sabit sermayeli menkul kıymet yatırım ortaklığı üç yüz milyon lira ve yüzde kırk dokuz halka arz. İki, lider sermayedar yüzde yirmi beş, gerçek kişide yüz elli milyon. Üç, genel müdür yedi yıl ve Düzey 3, vekalet üç ay. Dört, borçlanma özkaynağın yüzde yirmisi, kâr payı en az yüzde yirmi. Beş, değişken sermayeli ortaklık otuz milyon başlangıç, altmış milyon taahhüt ve yatırımcı payında oy yok. Hadi sorulara."], "9": ["Merhaba, portföy yönetim şirketleri bölümündeyiz. Bu bölümde hem kuruluş ve personel şartlarını hem de sermaye yeterliliği tablosunu öğreneceğiz. Tablo sınavda neredeyse her dönem karşına çıkıyor, o yüzden ona özellikle zaman ayıracağız.", "Önce tanım. Portföy yönetim şirketi, ana faaliyet konusu yatırım fonlarının kurulması ve yönetimi olan bir anonim ortaklıktır. Yatırım ortaklıklarının ve emeklilik fonlarının portföylerini yönetmek de ana faaliyet kapsamında. En önemli kural şu: yatırım fonu portföyleri ile portföy yönetimini dışarıdan alan yatırım ortaklıklarının portföyleri yalnızca portföy yönetim şirketlerince yönetilebilir.", "Bazı şirketler özel amaçla kurulabilir: yalnızca girişim sermayesi fonu, yalnızca gayrimenkul fonu, ikisi birlikte ya da yurt dışında yerleşiklere yönelik yabancı fonlar için. Bu faaliyetleri sınırlı şirketlerde başlangıç sermayesi ve özsermaye tutarları yarı oranında uygulanır.", "Kuruluş şartları: kayıtlı sermayeli anonim ortaklık, payların tamamı nama yazılı ve nakit karşılığı, başlangıç sermayesi en az yetmiş beş milyon lira. Unvanda portföy yönetimi ibaresi zorunlu. Önemli etkiye sahip ortak kavramına dikkat: dolaylı olarak yüzde beş ve üzeri pay ya da yönetim kurulunun çoğunluğunu seçme imtiyazı.", "Süreler şöyle: kuruluş başvurusu altı ay içinde karara bağlanır. Kuruluş izninden sonra üç ay içinde faaliyet izni için başvurulmalı, bu süre bir defaya mahsus üç ay uzatılabilir. Faaliyet izni için araştırma birimi, fon hizmet birimi, iç kontrol, risk yönetimi ve teftiş yapısının kurulmuş ve genel müdürün atanmış olması gerekir.", "Personel şartlarını bir tablo gibi düşün. Genel müdür ve yardımcıları yedi yıl tecrübe ve Düzey 3 lisansı. Yönetim kurulu en az üç kişi, çoğunluğu yedi yıl tecrübeli, en az biri Düzey 3 ve Türev Araçlar lisanslı. Fon müdürü yedi yıl tecrübe ve Düzey 2 lisansı. Portföy yöneticisi yardımcısı Düzey 1 lisansıyla en fazla üç yıl çalışabilir, gerekli lisansları alırsa beş yıla kadar.", "Fon müdürü konusunda iki tuzak var. Birincisi, fon müdürü portföy yöneticiliği yapamaz. İkincisi, fon müdürü ayrılırsa altı iş günü içinde yenisi belirlenip Kurula bildirilir. Genel müdür ayrılırsa ise on beş iş günü içinde yeni aday Kurula bildirilir ve Kurul on beş iş günü içinde itiraz etmezse atama yapılır. Genel müdürlüğe bir yılda üç aydan fazla vekalet edilemez.", "Şimdi sermaye yeterliliği tablosu. Yönetilen portföy iki virgül dört milyar liraya kadarsa asgari özsermaye yetmiş beş milyon, iki virgül dört ile dokuz virgül altı milyar arası doksan yedi buçuk milyon, dokuz virgül altı ile doksan milyar arası yüz yirmi milyon, doksan milyarı aşarsa iki yüz kırk milyon lira. Portföy yöneticisi sayısı da bu dört kademeye göre üç, dört, beş ve altı.", "Tablonun ince ayrıntıları da önemli. Portföy büyüklüğü son üç ayın ortalamasıdır. Yüz seksen milyar lirayı aşan kısım için yüzde sıfır virgül sıfır iki ek özsermaye gerekir, ama özsermaye dört yüz seksen milyonu aşarsa ek şart aranmaz. Hesaba bireysel portföyler, yatırım ortaklıkları, emeklilik fonları ve kurucusu olunan fonlar girer; sadece yöneticisi olunan fonlar ve şirketin kendi portföyü girmez. Asgari ödenmiş sermaye ise otuz milyon lira.", "Ortaklık değişikliklerinde eşikleri ezberle: yüzde on, yirmi, otuz üç ve elli. Bu eşikleri aşan veya altına düşüren pay devirleri Kurul iznine tabidir. Eşiklerin altında kalan devirler on iş günü içinde Kurula bildirilir. Yönetimde imtiyazlı payların devri ise oran aranmaksızın izne tabidir.", "Portföy yönetim şirketinin yapamayacakları: aracılık yapamaz, ödünç para veremez, kısa süreli nakit ihtiyacı dışında kredi alamaz, mevduat toplayamaz. Ayrıca yüzde on üzeri ortaklarının ve yöneticilerinin yüzde yirmi beşten fazlasına sahip olduğu şirketlere ortak olamaz. İştirakleri özsermayenin yüzde yirmi beşini aşamaz, ancak finansal kuruluşlara sınırsız iştirak edebilir.", "İzin iptali ve durdurma kuralları da sorulur. İki yıl faaliyetsizlik iptal nedenidir. Kendi isteğiyle bir yıldan fazla faaliyetini durduran şirketin izni iptal edilebilir. İki yıl içinde iki kez geçici durdurulan şirkete üçüncüde aynı ceza verilmez, doğrudan yetki belgesi iptal edilir. Geçici durdurma en fazla bir yıl, bir yıl daha uzatılabilir.", "Kolektif portföy yöneticiliği ilkelerinde müşteri her şeyin önündedir. Rayiç değerin üstünde alım ve altında satım yapılamaz, getiri garantisi verilemez, gereksiz alım satım yapılamaz, araştırma sonuçları müşteriden önce kullanılamaz. Yatırım kararlarına dayanak raporlar en az beş yıl saklanır.", "Portföy yönetim sözleşmesi inançlı devir esasına dayanır ve en az iki nüsha düzenlenir. Sözleşmedeki portföy yöneticisi değişirse müşteri bunu uygun görmezse sözleşmeyi tek taraflı feshedebilir. Şirket, yöneticilerinin hatalı işlemlerinden müşteriye karşı doğrudan sorumludur.", "Son olarak teminatlar. Kurul gerekirse portföy yönetim şirketlerinden Takasbank'ta teminat bloke ettirebilir. Teminat nakit, kamu borçlanma aracı, ilişkisiz bir bankanın teminat mektubu ya da şirketin kurucusu olmadığı para piyasası fonu payları olabilir. Bu teminatlar haczedilemez ve iflas masasına girmez.", "Özetleyelim: bir, başlangıç sermayesi yetmiş beş milyon, asgari ödenmiş sermaye otuz milyon. İki, sermaye yeterliliği tablosunda dört kademe ve üç, dört, beş, altı portföy yöneticisi. Üç, genel müdür yedi yıl ve Düzey 3, fon müdürü yedi yıl ve Düzey 2. Dört, Kurul izni eşikleri yüzde on, yirmi, otuz üç ve elli. Beş, iki yıl faaliyetsizlik iptal sebebi. Şimdi soruları çözme zamanı."], "10": ["Merhaba, yatırım fonları bölümündeyiz. Bu Tebliğ sınavda çok soru getiren, sınır ve oranlarla dolu bir düzenleme. Ben sana önce yapıyı, sonra oranları, en sonda da özel fon türlerini anlatacağım.", "Yatırım fonu tüzel kişiliği olmayan bir malvarlığıdır. Tasarruf sahiplerinden katılma payı karşılığında toplanan parayla, inançlı mülkiyet esasına gö
