1:[
"Merhaba, Sınav Defteri'ne hoş geldin. Bugün ilk bölümle, yani işletme yönetimiyle başlıyoruz. Bu bölüm sınavda genelde tanım ve sınıflandırma soruları olarak karşına çıkıyor. O yüzden sana listeleri akılda kalacak şekilde anlatmaya çalışacağım.",
"Önce işletmenin fonksiyonları. Dört tane temel fonksiyon var: yönetim, üretim, pazarlama ve finansman. Bunlara bir de dört destek fonksiyonu ekleniyor: insan kaynakları, muhasebe, araştırma geliştirme ve halkla ilişkiler. Yani toplam sekiz. Sınavda satın alma, tasarım ya da kalite fonksiyonu diye bir şık görürsen, bil ki bunlar listede yok. Sınavda bu tür sorular sık çıkıyor.",
"Şimdi sık karıştırılan üç kavrama geçelim: verimlilik, etkinlik ve etkililik. Verimlilik basit: çıktının fiziki miktarını girdinin fiziki miktarına bölüyorsun. Etkinlik ise önceden belirlenen programa ne kadar ulaştığını gösteriyor. Etkililik de gerçekleşen çıktının planlanan çıktıya oranı.",
"Burada Peter Drucker'ın meşhur cümlesini aklında tut: etkinlik doğru işi yapmaktır, verimlilik işi doğru yapmaktır. Yani etkinlik doğru işi seçmekle, verimlilik ise o işi doğru biçimde yapmakla ilgili.",
"Bir de ekonomiklik ilkesi var. Toplam satış tutarını üretimin maliyet giderlerine bölüyorsun. Sonuç birden büyükse işletme başarılı, birden küçükse ekonomik değil. Mesela satış yüz yirmi, maliyet yüz ise oran bir virgül iki, yani işletme başarılı.",
"Gelelim yönetim düşüncesinin tarihine. Sıra şöyle: erken klasikler, klasik, neoklasik, modern ve postmodern. Klasik dönemin üç büyük ismi var ve her birini bir ülkeyle eşleştirirsen kolay hatırlarsın. Amerika'da Taylor ve bilimsel yönetim; Taylor'ın aracı zaman etüdüdür. Fransa'da Fayol ve yönetim süreci yaklaşımı. Almanya'da Max Weber ve bürokrasi.",
"Fayol'u biraz daha açalım çünkü sınavda sevilen bir konu. Fayol yönetimi ilk kez bir süreç olarak gördü: planlama, örgütleme, emir komuta, koordinasyon ve denetim. On dört ilkesini de üçe ayırıyor: yapısal ilkeler, süreç ilkeleri ve sonuçlarla ilgili ilkeler. Sonuçlarla ilgili olanlar dört tane: düzen, personelin devamlılığı, inisiyatif ve birlik beraberlik.",
"Klasik yaklaşımın en büyük eleştirisi, insanı makinenin bir parçası gibi görmesiydi. İnsanın sosyal ve psikolojik yanı tamamen yok sayıldı. İşte bu boşluğu neoklasik yaklaşım doldurdu. Bunun güzel bir özeti var: klasik yönetim insansız organizasyonlar, neoklasik yönetim ise organizasyonsuz insanlar anlayışına dayanır.",
"Neoklasik dönemin en ünlü çalışması Hawthorne araştırmaları. Bin dokuz yüz yirmi dört ile bin dokuz yüz otuz arasında, Western Electric şirketinde, Elton Mayo başkanlığında yapıldı. İlk deneyler ışıkla ilgiliydi ve ilginç bir şekilde aydınlatma ile verimlilik arasında hiçbir ilişki bulunamadı. Ama bu çalışma grup kavramını ve resmi olmayan grupların önemini ortaya çıkardı.",
"McGregor'un X ve Y teorisi de buradan. X teorisinde insan tembeldir, sorumluluktan kaçar, zorlanması gerekir. Y teorisinde ise çalışmak oyun kadar doğaldır ve insan kendini kontrol eder. Likert'in dört sistemini de sırayla hatırla: istismarcı otokratik, iyiliksever otokratik, katılımcı ve demokratik.",
"Modern yönetim düşüncesinde üç yaklaşım var. Sistem yaklaşımı organizasyonu çevresiyle etkileşen açık bir sistem olarak görür. Durumsallık yaklaşımı ise çok net bir şey söyler: her durum için geçerli tek bir en iyi yol yoktur. Dinamik yönetimin örneği de toplam kalite yönetimidir.",
"Şimdi yönetim işlevlerine geçelim: planlama, organizasyon, yürütme ve kontrol. Planlamada en önemli araçlardan biri kurumsal karne, yani Balanced Scorecard. Kaplan ve Norton'a ait ve dört boyutu var: finansal, müşteri, operasyonel ve öğrenme gelişme. Sınavda kalite boyutu diye bir şık görürsen, o yanlış.",
"Organizasyon tarafında bölümlendirme sistemlerini bil: fonksiyon, ürün, bölge, müşteri, zaman, süreç ve makine, karma ve matriks. Matriks yapının en belirgin özelliği ikili komuta zinciridir. Strateji temelli bölümlendirme diye bir şey yok.",
"Modern organizasyon yapıları da beş tane: şebeke, yığışım, hibrid, yalın ve öğrenen organizasyon. Şebekenin dengeli türünde her zaman tek bir lider işletme vardır. Yalın organizasyon Toyota'dan gelir ve sıfır hiyerarşiyi esas alır. Öğrenen örgüte giden yol da şöyle sıralanır: bilen, anlayan, düşünen ve sonunda öğrenen örgüt.",
"Yürütme işlevinde iletişim kanallarına dikkat et. Resmi iletişim kanalları dört tanedir: dikey, yatay, çapraz ve dışa dönük. Çapraz iletişime diyagonal iletişim de denir. Motivasyonda ise Herzberg önemli: işin içeriğiyle ilgili güdüleyiciler bir yanda, ücret ve çalışma koşulları gibi hijyen etmenleri diğer yanda. Hijyen etmenleri yoksa memnuniyetsizlik doğar ama varlıkları tek başına motive etmez.",
"Son olarak kontrol. Kontrol süreci dört adımdır: standartları belirle, sonuçları ölç, karşılaştır ve düzeltici önlem al. Kontrol esnek ve tarafsız olmalıdır. Sınavda değişen koşullara göre değişmemeli ya da taraflı yapılmalı gibi ifadeler görürsen onları ele.",
"Bu bölümü özetleyelim: sekiz fonksiyon, Drucker'ın doğru iş cümlesi, klasik dönemin üç ülkesi, insansız ve organizasyonsuz ayrımı, kurumsal karnenin dört boyutu ve dört resmi iletişim kanalı. Bunları bilirsen bu bölümün sorularının çoğunu rahatça çözersin. Şimdi istersen sorulara geçebilirsin."
],
2:[
"Merhaba, ikinci bölümdeyiz: kurumsal yönetimin temel kavramları. Bu bölüm, sınavın geri kalanının temelini oluşturuyor. Burada öğrendiğin dört ilke ve yönetim kurulu kavramları, Tebliğ ve derecelendirme bölümlerinde tekrar tekrar karşına çıkacak.",
"Her şey bin dokuz yüz otuz iki yılında Berle ve Means'in yazdığı Modern Şirket ve Özel Mülkiyet kitabıyla başlıyor. Söyledikleri şu: büyük şirketlerde sermaye çok sayıda küçük hissedara dağılmış, ama kontrol profesyonel yöneticilerin elinde. Yani mülkiyet ile kontrol birbirinden ayrılmış.",
"Konunun dünya gündemine oturması ise skandallarla oldu. Amerika'da Enron ve WorldCom, İtalya'da Parmalat, Hollanda'da Ahold ve Çin'de Yanguangxia. Bu skandalları ülkeleriyle eşleştirerek hatırlaman yeterli, ayrıntılara birazdan geleceğim.",
"Kurumsal yönetimin tek bir tanımı yok, ama sınavda tanımın kime ait olduğu sorulabiliyor. Birkaç tanesini anahtar kelimeyle eşleştirelim. Shleifer ve Vishny: finansman sağlayanların uygun getiri elde etmesi. Cadbury raporu: şirketlerin yönetimine ve denetimine ilişkin sistem. Claessens: dar anlamda, halka açık şirketlerde hisse yatırımlarını düzenleyen kurallar. Salacuse ise üç güç merkezinden bahseder: yönetim kurulu, üst yöneticiler ve hissedarlar.",
"Şimdi bu bölümün kalbine geliyoruz: dört temel ilke. Adillik, şeffaflık, hesap verebilirlik ve sorumluluk. Bunları hiç unutmaman lazım. Sınavda rekabetçi büyüme gibi beşinci bir ilke görürsen o yanlış.",
"Bu dört ilkede sık sorulan bir incelik var: zaman boyutu. Şeffaflık faaliyetin öncesini, sürecini ve sonrasını kapsar. Hesap verebilirlik ise yalnızca faaliyet sonrasını kapsar. Bunu şöyle düşün: hesap ancak iş bittikten sonra verilir.",
"Adillik, azınlık ve yabancı ortaklar dahil bütün hak sahiplerine eşit davranmak demek. Sorumluluk ise şirketin yaptığı her şeyin mevzuata, esas sözleşmeye ve etik değerlere uygun olması.",
"Şimdi mülkiyet yapısına göre iki yaklaşımı anlatayım. Birincisi dağılmış mülkiyet, yani Anglo Sakson modeli; Amerika ve İngiltere'de görülür. Çok sayıda küçük hissedar var ve yöneticileri denetleyecek güçleri yok. Burada ortaya çıkan soruna vekil maliyeti, yani agency cost denir: yönetici, hissedarın değil kendi çıkarının peşine düşebilir.",
"İkincisi hakim ortaklı yapı. Kıta Avrupası ve gelişmekte olan ülkelerde yaygın. Burada büyük ortak yönetimi iyi denetler, ama başka bir risk doğar: büyük ortak, yönetimle birlikte küçük hissedarların aleyhine hareket edebilir. Kısacası birinci modelde sorun yönetici ile hissedar arasında, ikincisinde büyük ortak ile küçük ortak arasında.",
"Şirket grupları için de üç isim bil: Japonya'da Keiretsu, Kore'de Chaebol, Avrupa'da holding. Bu karşılaştırmayı Gilson yapmıştır.",
"Yönetim kurulu, kurumsal yönetimin odak noktasıdır. En önemli niteliği bağımsızlıktır. Burada çok sık sorulan bir cümle var: her bağımsız üye icracı olmayan üyedir, ama her icracı olmayan üye bağımsız değildir. Bağımsız olmak için ayrıca bağımsızlık kriterlerini sağlaman gerekir.",
"Avrupa'daki yönetim kurulu yapıları da önemli. Tek kademeli yapıda icracı ve icracı olmayan üyeler aynı kuruldadır; sekiz ülke bunu zorunlu tutar. İki kademeli yapıda icra kurulu ve denetim kurulu ayrıdır ve icra kurulunu üst kurul seçer; yedi ülke bunu zorunlu tutar. Sekiz tek, yedi iki diye aklında tutabilirsin. İskandinav modelinde ise kurul küçüktür, ortalama altı kişidir ve yönetim kurulu başkanı ile genel müdür her zaman farklı kişilerdir.",
"İç kontrolün beş bileşenini de say: kontrol ortamı, risk değerlemesi, kontrol faaliyetleri, bilgi ve iletişim, ve gözetim. Stratejik planlama gibi bir şık görürsen o listede yok.",
"Skandallara kısaca dönelim. Enron'da denetçi Arthur Andersen hem denetim hem danışmanlık yaptığı için bağımsızlığını kaybetti. WorldCom giderlerini sermaye yatırımı gibi gösterdi. Parmalat'ta Cayman Adaları'ndaki Bonlat iştirakinin banka hesabındaki üç virgül doksan beş milyar euro aslında hiç yoktu.",
"Son olarak iyi kurumsal yönetimin faydaları: dış finansmana erişim, daha düşük sermaye maliyeti, daha yüksek verimlilik ve şirket değeri, marka değeri ve krizlere karşı dayanıklılık. İtalya'daki STAR endeksinde kurumsal yatırımcı oranının yüzde elli dörtten yüzde seksen sekize çıkması bu faydanın klasik örneğidir.",
"Özetle bu bölümden mutlaka aklında kalması gerekenler: dört ilke ve zaman boyutları, vekil maliyeti, bağımsız ile icracı olmayan arasındaki fark ve sekiz tek, yedi iki kademeli kural. Hazırsan sorulara geçebilirsin."
],
3:[
"Merhaba, üçüncü bölüm: kurumsal yönetimin dünyadaki gelişimi. Bu bölüm tarih ve isim ağırlıklı. O yüzden sana bir zaman çizelgesi gibi anlatacağım.",
"Önce temel karşıtlığı kuralım. Amerika katı kanunlarla gitti; en önemli örneği Sarbanes Oxley Kanunu. Avrupa ise esnek bir yol seçti: uygula, uygulamıyorsan açıkla. İngilizcesi comply or explain. Bu ayrım sınavda çok sorulur.",
"Sarbanes Oxley, kısaca SOX, Temmuz iki bin ikide çıktı. Enron ve WorldCom skandallarının doğrudan sonucudur. Sekiz önlemini kabaca hatırlaman yeterli: kamu gözetimi muhasebe kurulu kuruldu, denetim komiteleri düzenlendi, denetçilerin danışmanlık yapması yasaklandı, ihbar mekanizması yani whistleblowing yasal hale geldi, yöneticilerin şirketten borç alması yasaklandı, genel müdür ve finans müdürüne raporların doğruluğu konusunda sorumluluk yüklendi, ve cezalar ağırlaştırıldı.",
"New York Borsası'nın kurumsal yönetim kuralları da şirket kılavuzunun üç yüz üç A bölümünde. Bu numarayı hatırla.",
"İngiltere ise kurumsal yönetimin anavatanı sayılır. Sıra şöyle: bin dokuz yüz doksan ikide Cadbury Raporu, iki bin üçte Combined Code. Yine iki bin üçte iki rapor daha var: Higgs raporu icracı olmayan üyelerle, Smith raporu ise denetim komitesiyle ilgili. Higgs için icracı olmayan, Smith için denetim diye eşleştir.",
"İngiltere'nin iki bin on dört kodunun beş başlığı var: liderlik, etkinlik, hesap verebilirlik, ücretlendirme ve hissedarlarla ilişkiler. Sürdürülebilirlik bu beş başlık arasında yok.",
"Avrupa Birliği tarafında birkaç önemli adım var. İki bin yedide hissedar hakları direktifi çıktı. Nisan iki bin on dört tavsiye kararıyla şirketler, hangi koda uyduklarını ve uymadıkları maddelerin nedenini açıklamaya başladı. İki bin on yedide de bu direktifi değiştiren yeni bir direktif geldi; en önemli yeniliği, şirketlerin pay sahiplerinin kimliğini bilme hakkını kabul etmesiydi.",
"Şimdi en çok sorulan kısma geliyoruz: G yirmi ve OECD kurumsal yönetim ilkeleri. Tarihleri sırayla söylüyorum: bin dokuz yüz doksan sekizde çalışma grubu kuruldu, bin dokuz yüz doksan dokuzda ilkeler onaylandı, iki bin dörtte revize edildi. İki bin on beşte ise Ankara'da, Eylül ayında yapılan G yirmi toplantısında G yirmi ve OECD ilkeleri olarak kabul edildi.",
"Bu ilkeler bağlayıcı değildir ve iyi kurumsal yönetimin tek bir modeli olmadığını kabul eder. Altı bölümden oluşur: kurumsal yönetim çerçevesinin temelleri, pay sahiplerinin hakları, kurumsal yatırımcılar ve piyasalar, menfaat sahipleri, kamuyu aydınlatma ve yönetim kurulunun sorumlulukları. Bunlardan kurumsal yatırımcılar bölümü iki bin on beşte tamamen yeni eklenmiştir.",
"Sürdürülebilirlik tarafında da bir zaman çizelgesi var. Bin dokuz yüz yetmiş ikide Roma Kulübü'nün Büyümenin Sınırları raporu ve Stockholm konferansı. Bin dokuz yüz sekseninde sürdürülebilir kalkınma kavramı ilk kez tanımlandı. Bin dokuz yüz seksen yedide Brundtland raporu meşhur tanımı yaptı: gelecek kuşakların ihtiyaçlarından ödün vermeden bugünün ihtiyaçlarını karşılamak.",
"Ardından bin dokuz yüz doksan ikide Rio zirvesi, bin dokuz yüz doksan yedide GRI, yani Küresel Raporlama Girişimi, iki binde BM Küresel İlkeler Sözleşmesi ve iki bin beşte Sorumlu Yatırım Prensipleri geldi. Küresel İlkeler Sözleşmesi'nin dört alanı var: insan hakları, çalışma koşulları, çevre ve yolsuzlukla mücadele.",
"Son olarak entegre raporlama. Finansal ve finansal olmayan bilgiyi tek raporda birleştirip stratejiyle ilişkilendirir. Kökeni Güney Afrika'dır; King raporları oradan çıktı. İki bin onda Johannesburg Borsası entegre raporu zorunlu tutan ilk borsa oldu. Uluslararası çerçeveyi ise IIRC Aralık iki bin on üçte yayımladı.",
"Bu bölümün özeti: Amerika kanun, Avrupa uygula ya da açıkla. SOX iki bin iki. Cadbury doksan iki. G yirmi ilkeleri iki bin on beş, Ankara. Brundtland seksen yedi. Entegre raporlamada ilk ülke Güney Afrika. Bu tarihleri bilirsen bu bölüm senin için kolay."
],
4:[
"Merhaba, dördüncü bölüm: Türk Ticaret Kanunu'nun kurumsal yönetimle ilgili hükümleri. Bu bölüm madde numarası ve oran ağırlıklı. Hepsini ezberlemeye çalışma; sınavda çıkan sayılar belli, ben sana onları anlatacağım.",
"Önce arka plan. Kanun hazırlanırken Avrupa Birliği'nin şirketler hukuku çalışmalarından yararlanıldı. Bu yüzden kurumsal yönetim hükümleri genel olarak Anglo Sakson sistemine dayanır. Kanunun gerekçesinde kurumsal yönetimin dört taşıyıcı kolonu sayılır: şeffaflık, adillik, hesap verilebilirlik ve sorumluluk. İkinci bölümdeki dört ilkenin aynısı.",
"Şimdi bu bölümün en önemli sayısı: azınlık oranı. Normal anonim şirkette azınlık sermayenin yüzde onu, yani onda biridir. Halka açık şirkette ise yüzde beş, yani yirmide biridir. Bu iki oran kanunun pek çok maddesinde tekrar eder: genel kurulu toplantıya çağırma, finansal tabloların görüşülmesini erteleme, özel denetim isteme, haklı sebeple fesih. Hepsinde onda bir, halka açıkta yirmide bir.",
"Bilgi alma hakkıyla devam edelim. Finansal tablolar, faaliyet raporu ve kâr dağıtım önerisi genel kuruldan en az on beş gün önce pay sahiplerinin incelemesine açılır. Ve bu hak esas sözleşmeyle ya da herhangi bir organ kararıyla kaldırılamaz, sınırlandırılamaz.",
"Özel denetimde süreç şöyle: önce genel kuruldan istenir. Genel kurul reddederse, halka açık şirkette sermayenin yirmide biri ya da itibari değeri en az bir milyon lira olan pay sahipleri, üç ay içinde mahkemeye gidip özel denetçi atanmasını isteyebilir.",
"Oy hakkıyla ilgili iki sayı bil. Bir paya en çok on beş oy hakkı tanınabilir. Ve her pay sahibi, tek bir payı olsa bile en az bir oy hakkına sahiptir. Bir de şu: temsilcinin mutlaka pay sahibi olmasını şart koşan esas sözleşme hükmü geçersizdir.",
"İki yaptırım kavramını karıştırma. Eşit işlem ilkesine aykırı yönetim kurulu kararları butlan yaptırımına tabidir. Sermayenin korunması ilkesini gözetmeyen kararlar ise batıldır.",
"Oybirliği gereken iki karar var: bilanço zararlarını kapatmak için ortaklara yükümlülük getirmek ve şirket merkezini yurt dışına taşımak. Bunlarda sermayenin tamamının oybirliği aranır.",
"Şimdi yönetim kuruluna geçelim. Yönetim kurulu üyeleri en çok üç yıl için seçilir. Bir tüzel kişi üye seçilirse onun adına yalnızca bir gerçek kişi tescil edilir. Halka açık şirkette azlığa tanınan yönetim kurulunda temsil hakkı, üye sayısının yarısını aşamaz.",
"Yönetim kurulu üyeleri için üç yasak var. Genel kurul izni olmadan şirketle işlem yapamaz. Genel kurul izni olmadan şirketle rekabet edemez. Ve pay sahibi olmayan üyeler şirkete nakit borçlanamaz. Bir de müzakereye katılma yasağı var: üye, kendisinin, eşinin, alt ve üst soyunun ya da üçüncü dereceye kadar kan ve kayın hısımlarının çıkarıyla şirketin çıkarı çatışıyorsa o görüşmeye katılamaz.",
"Riskin erken saptanması komitesi de önemli. Payları borsada işlem gören şirketlerde kurulması zorunludur. Komite yönetim kuruluna iki ayda bir rapor verir. Sigorta konusunda ise sayı yüzde yirmi beş: yönetim kurulu üyelerinin verebileceği zarar sermayenin yüzde yirmi beşini aşan bir bedelle sigortalanırsa bu duyurulur ve kurumsal yönetim değerlendirmesinde dikkate alınır.",
"Sorumluluk hukukunda yeni bir kavram var: farklılaştırılmış teselsül. Eski kanundaki mutlak teselsül yerine geldi. Her sorumlu, kendi kusuru oranında zarardan sorumlu olur. Bu, icracı ve icracı olmayan üye ayrımının sorumluluğa yansımasıdır.",
"Sık sorulan konulardan biri genel kurulun devredilemez yetkileri. Esas sözleşme değişikliği, yönetim kurulu seçimi, şirketin feshi ve önemli miktarda varlığın toptan satışı genel kurulun yetkisidir. Ama borca batıklık durumunda mahkemeye bildirim yönetim kurulunun devredilemez görevidir. Bu ayrımı mutlaka hatırla.",
"Son olarak kanunun bin beş yüz yirmi dokuzuncu maddesi. Halka açık şirketlerde kurumsal yönetim ilkelerini ve derecelendirme kurallarını Sermaye Piyasası Kurulu belirler. Bu, beşinci bölümdeki Tebliğ'in kanuni köprüsüdür.",
"Özet: onda bir ve yirmide bir, on beş gün, on beş oy, üç yıl, iki ayda bir rapor ve yüzde yirmi beş sigorta. Bu altı sayıyı bilmek bu bölümün yarısını çözmek demek."
],
5:[
"Merhaba, beşinci bölüm: Kurumsal Yönetim Tebliği, yani iki tire on yedi nokta bir. Bu bölüm sınavın en ağır bölümü, çünkü sayı ve süre çok. Ben sana hikâye gibi anlatacağım: önce kim kapsamda, sonra hangi ilkeler zorunlu, sonra yönetim kurulu, ve en son ilişkili taraf işlemleri.",
"Tebliğ üç Ocak iki bin on dörtte yayımlandı. Dayanağı Sermaye Piyasası Kanunu'nun on yedinci maddesidir. Kapsamda olanlar, payları Borsa İstanbul'un Yıldız Pazar, Ana Pazar ve Alt Pazar'ında işlem gören halka açık şirketlerdir.",
"Şirketler üç gruba ayrılır ve ölçüt iki tanedir: piyasa değeri ve fiili dolaşımdaki payların piyasa değeri. Aktif büyüklüğü ya da satış hasılatı değil. Hesap Mart, Haziran, Eylül ve Aralık aylarının son işlem günlerinin ortalamasıyla yapılır, Kurul da her yıl Ocak ayında grupları ilan eder.",
"Güncel tutarlar iki bin yirmi beş Ocak kararıyla belirlendi. Birinci grup için piyasa değeri on iki milyar lira, fiili dolaşım değeri üç milyar lira üzerinde olmalı. İkinci grup için altı milyar ve bir buçuk milyar. Gerisi üçüncü grup.",
"Şimdi yönetim kurulunun yapısı. Yönetim kurulu en az beş üyeden oluşur ve üyelerin çoğunluğu icrada görevli olmayan üyelerdir. Bağımsız üye sayısı toplam üye sayısının üçte birinden az olamaz, küsurat yukarı yuvarlanır ve her durumda en az iki bağımsız üye olur. Örnek verelim: yedi kişilik kurulda yedinin üçte biri iki virgül üç üç eder, yukarı yuvarlarsın, yani üç bağımsız üye gerekir.",
"Bağımsız üyenin görev süresi üç yıla kadardır ve tekrar seçilebilir. Bağımsızlık kriterlerinden en çok sorulanları şunlar: son beş yılda şirkette önemli bir yönetici görevi olmamak, yüzde beşten fazla paya sahip olmamak, son on yılda altı yıldan fazla yönetim kurulu üyeliği yapmamış olmak, ve toplamda beşten fazla borsa şirketinde bağımsız üye olmamak.",
"Bağımsız üye seçim sürecinin süreleri de soruluyor. Yönetim kurulu aday listesini genel kuruldan en az altmış gün önce Kurul'a gönderir, Kurul da olumsuz görüşünü otuz gün içinde bildirir. Bir bağımsız üye bağımsızlığını kaybederse istifa eder; yeni aday listesi otuz gün içinde Kurul'a gider, Kurul yirmi gün içinde cevap verir. Altmış otuz ve otuz yirmi diye aklında tut.",
"Kadın üye için hedef oran en az yüzde yirmi beştir. Yönetim kurulu başkanı ile genel müdür aynı kişiyse bu durum gerekçesiyle kamuya açıklanır.",
"Komitelere geçelim. Beş komite var: denetimden sorumlu komite, riskin erken saptanması komitesi, kurumsal yönetim komitesi, aday gösterme komitesi ve ücret komitesi. Aday gösterme ve ücret komitesi ayrı kurulamazsa bu işleri kurumsal yönetim komitesi yapar. Komiteler en az iki üyeden oluşur, başkanları bağımsız üyedir, denetim komitesinin ise bütün üyeleri bağımsızdır. Genel müdür hiçbir komitede görev alamaz.",
"Denetim komitesi en az üç ayda bir, yılda en az dört kez toplanır ve görevi muhasebe sistemi, bağımsız denetim ve iç kontrolün gözetimidir. Ücret komitesi ücretlendirmeyi, aday gösterme komitesi aday saptamayı, riskin erken saptanması komitesi riskleri, kurumsal yönetim komitesi de ilkelere uyumu izler. Sınavda bu görevler sık sık karıştırılarak sorulur.",
"Bağımsız üyelerin ücretinde bir yasak var: kâr payı, pay opsiyonu ya da performansa dayalı ödeme kullanılamaz. Ayrıca şirket hiçbir yönetim kurulu üyesine borç ya da kredi veremez.",
"Şimdi ilişkili taraf işlemleri. Önce yaygın ve süreklilik arz etmeyen işlemler. İşlem tutarının ilgili baza oranı yüzde beşi aşacaksa değerleme yaptırılır. Yüzde onu aşacaksa buna ek olarak bağımsız üyelerin çoğunluğunun onayı gerekir. Onay çıkmazsa durum KAP'ta açıklanır ve işlem genel kurula gider; orada işlemin tarafları oy kullanamaz ve toplantı nisabı aranmaz.",
"Yaygın ve süreklilik arz eden işlem ise bir yılda en az iki kez yapılan aynı nitelikteki işlemdir. Burada eşik yüzde ondur ve aşılırsa yönetim kurulu, işlemin piyasa koşullarına uygunluğunu gösteren bir rapor hazırlar ve KAP'ta açıklar.",
"Yatırımcı ilişkileri bölümünde de birkaç kural var. Yöneticisi Sermaye Piyasası Faaliyetleri Düzey üç ve Kurumsal Yönetim Derecelendirme lisansına sahip olmalı. Üçüncü gruptaki şirketlerde bunlardan biri, hatta yalnızca Düzey iki bile yeterli. Yönetici ayrılırsa otuz gün içinde yenisi atanır. Bölüm, yönetim kuruluna yılda en az bir kez rapor verir.",
"Genel kurulla ilgili zorunlu ilkeler de var. Genel kurul ilanı en az üç hafta önce yapılır. Genel kurulda cevaplanamayan sorular en geç on beş gün içinde yazılı cevaplanır ve bütün sorular ile cevaplar otuz gün içinde internet sitesinde yayımlanır.",
"Uyum raporları da önemli. Şirketler uygula ya da açıkla esasına göre raporlar ve bunu KAP'ta iki şablonla yaparlar: Uyum Raporu ve Kurumsal Yönetim Bilgi Formu. Uyum raporundaki cevaplar evet, kısmen, hayır, ilgisiz ve muaftır. Bu şablonlar genel kuruldan en az üç hafta önce doldurulur.",
"Son olarak teminat, rehin, ipotek ve kefalet. Şirket bunları yalnızca kendi lehine, tam konsolide ettiği ortaklıklar lehine ve olağan ticari faaliyeti için üçüncü kişiler lehine verebilir. Yeni halka açılan şirketler aykırı olanları dört yıl içinde sıfırlamak zorundadır.",
"Bu bölümün özeti: en az beş üye, üçte bir bağımsız ama en az iki, altmış otuz ve otuz yirmi, yüzde beş değerleme yüzde on bağımsız onayı, ve denetim komitesinin tamamı bağımsız. Bu bölüm uzun, o yüzden notları da mutlaka bir kez okumanı öneririm."
],
6:[
"Merhaba, altıncı bölüm: derecelendirme Tebliği, yani Seri sekiz, numara elli bir. Bu bölüm derecelendirme kuruluşlarının kurallarını anlatıyor ve sayıları oldukça net.",
"Tebliğ on iki Temmuz iki bin yedide yayımlandı. Dayanağı Sermaye Piyasası Kanunu'ndaki derecelendirme kuruluşlarına ilişkin hükümlerdir: altmış ikinci madde faaliyet esaslarını, altmış üçüncü madde sorumluluğu düzenler.",
"Derecelendirme iki türlüdür: kredi derecelendirmesi ve kurumsal yönetim ilkelerine uyum derecelendirmesi. Aralarındaki farkı şöyle düşün: kredi derecelendirmesi geleceğe dönük bir görüştür, borcun vadesinde ödenip ödenmeyeceğini tahmin eder. Kurumsal yönetim uyum derecelendirmesi ise ağırlıklı olarak geçmiş verilere bakar. Kuruluşlar bu iki faaliyet için ayrı ayrı yetkilendirilir.",
"Peki neden mevzuatta kurumsal yönetim derecelendirmesi değil de kurumsal yönetim ilkelerine uyum derecelendirmesi deniyor? Çünkü dünyada herkesin kabul ettiği tek bir ilke seti yok. Bu derecelendirme özellikle Sermaye Piyasası Kurulu'nun ilkelerine uyumu ölçer.",
"Kurul zorunlu tutmadıkça bu derecelendirme isteğe bağlıdır. İki şekilde yapılabilir: talebe bağlı ya da talebe bağlı olmadan. Talebe bağlı olmayan derecelendirmede üç kural var: notu açıklamadan önce şirkete bilgi verilir, çalışma birbirini izleyen üç hesap dönemi sürdürülür ve not en fazla altı ayda bir gözden geçirilir. Üç dönem, altı ay.",
"Talebe bağlı derecelendirmede ise kuruluş ile şirket sözleşme imzalar ve bu sözleşme Kurul'a gönderilir.",
"Kadro kuralları da sık soruluyor. Her çalışmada en az iki derecelendirme uzmanı ve en az üç komite üyesi görev alır. Uzman olmak için dört yıllık lisans, en az üç yıl deneyim ve lisans belgesi gerekir. Komite üyesi olmak için aynı şartlar ve en az beş yıl deneyim. Yani iki uzman, üç komite üyesi; üç yıl ve beş yıl.",
"Önemli bir ayrıntı: notu uzman değil, derecelendirme komitesi belirler. Uzman sadece çalışmasını komiteye sunar.",
"Kuruluşun yapması gerekenler: sistematik bir metodoloji, yazılı bir iç kontrol sistemi, ahlaki davranış kuralları yönergesi ve bunları denetleyen bir kontrolör. Ayrıca mesleki sorumluluk sigortası yaptırmak ve resmi bir internet sitesi kurmak zorunlu.",
"Bağımsızlıkla ilgili kural çok katıdır. Kurulun, kuruluşun, müşterinin ya da ilgili tarafların bağımsızlığın zedelendiğine dair tereddüdü oluşursa, bağımsızlık ortadan kalkmış kabul edilir. Kanıt aranmaz, tereddüt yeterlidir.",
"Birkaç yasak daha: kuruluşlar reklam yapamaz ve iş öneremez. Notun açıklanmasından kaçınmak için çalışmaya son veremez. Mevzuata aykırılıktan doğan zararlardan kuruluş, uzmanlar ve komite üyeleri birlikte, yani müteselsilen sorumludur. Çalışma belgeleri en az on yıl saklanır.",
"Kurul hangi durumlarda ceza verir ya da kuruluşu listeden çıkarır? Başvuru koşulları kaybedilirse, ilkelere uyulmazsa, bildirimler yapılmazsa ve kesintisiz beş yıl hiç derecelendirme yapılmazsa. Sınavda iki yıl gibi şıklarla yanıltılabilirsin; doğrusu beş yıl.",
"Ve en çok sorulan konu: ağırlıklar. İki bin beşteki eski ağırlıklar pay sahipleri yüzde yirmi beş, kamuyu aydınlatma yüzde otuz beş, menfaat sahipleri yüzde on beş, yönetim kurulu yüzde yirmi beşti. İki bin on üçte değişti ve bugün geçerli olan şu: pay sahipleri yüzde yirmi beş, kamuyu aydınlatma yüzde yirmi beş, menfaat sahipleri yüzde on beş, yönetim kurulu yüzde otuz beş. Kısaca yirmi beş, yirmi beş, on beş, otuz beş.",
"Aynı karara göre bir ilkenin asgari şartları yerine getirilmişse o ilkeden en fazla yüzde seksen beş puan verilir. Şirket asgari şartların üzerine çıkmışsa puan tam puana yaklaştırılabilir.",
"Özet: kredi geleceğe, uyum geçmişe bakar. Üç dönem, altı ay. İki uzman, üç komite üyesi. On yıl saklama, beş yıl faaliyetsizlik. Ve yirmi beş, yirmi beş, on beş, otuz beş."
],
7:[
"Merhaba, son bölümdeyiz: kurumsal yönetim ilkelerine uyum derecelendirmesi. Bir önceki bölümde kuralları gördük, bu bölümde süreci baştan sona yaşayacağız. Bir şirketin not alma yolculuğu gibi düşün.",
"Önce bir tarih: Sermaye Piyasası Kurulu'nun kurumsal yönetim ilkeleri ilk kez dört Temmuz iki bin üçte yayımlandı. O zaman uygulamak zorunlu değildi.",
"Yolculuk şirketin talebiyle başlar. Derecelendirme kuruluşu talebi kendi etik kurallarına göre değerlendirir, uygun bulursa iki nüsha bir hizmet sözleşmesi hazırlanır. Burada çok önemli bir sayı var: kuruluş, sözleşme tutarının en az iki katı tutarında mali mesuliyet sigortası yaptırır. Bu poliçe yoksa sözleşme hükümsüzdür.",
"Sözleşme, ekleri ve sigorta poliçesi altı iş günü içinde Kurul'a bildirilir. Şirketin borsada işlem gören aracı varsa şirket de KAP'ta açıklama yapar. Bir de dikkat et: çalışmayı yürütecek uzman ve analistler ücret görüşmelerine katılamaz.",
"Sonra inceleme süreci başlar. Şirket özel bir şifreyle girdiği soru setini doldurur, belgeleri gönderir, gerekirse şirket ziyaret edilir ve yöneticilerle görüşülür. Uzman raporunu derecelendirme komitesine sunar. Komite en az üç kişidir ve nihai kararı uzmanın önerisiyle komite verir.",
"Not nasıl açıklanır? Şirketin borsada işlem gören bir aracı varsa, notun oluştuğu günü takip eden ilk iş günü sabah saat dokuza kadar Kurul'a, kamuoyuna ve şirkete aynı anda bildirilir. Not bir yıl geçerlidir ve yılın sonunda güncellenmesi gerekir.",
"Metodolojide notun yanına kısaltmalar yazılır: bankalar için BNK, halka kapalı şirketler için PRIV. Ana başlık ağırlıkları önceki bölümde konuştuğumuz gibi yirmi beş, yirmi beş, on beş, otuz beş. Alt başlık ağırlıklarını ise derecelendirme kuruluşu kendisi belirler.",
"Notlar beş tanedir: bir genel not ve dört ana bölüm notu. Notlar birle on arasında verilir, virgülden sonra iki hane yazılır ve tam sayıya yuvarlanmaz.",
"Bir hesap örneği yapalım, çünkü sınavda gelebilir. Pay sahipleri sekiz, kamuyu aydınlatma dokuz, menfaat sahipleri on, yönetim kurulu yedi olsun. Sekiz çarpı sıfır virgül yirmi beş, iki eder. Dokuz çarpı sıfır virgül yirmi beş, iki virgül yirmi beş. On çarpı sıfır virgül on beş, bir buçuk. Yedi çarpı sıfır virgül otuz beş, iki virgül kırk beş. Topladığında genel not sekiz virgül yirmi olur.",
"Şimdi Borsa İstanbul Kurumsal Yönetim Endeksi. Hesaplanmaya otuz bir Ağustos iki bin yedide başladı. Endekse girmek için genel not on üzerinden en az sekiz, her ana başlık notu en az yedi olmalı. Sekiz ve yedi. Not şirketin talebiyle verilmiş olmalı ve her yıl yenilenmeli.",
"Not KAP'ta yayımlandıktan sonraki iş günü şirket endekse girer. Normal bir günde saat on altı otuzdan sonra yayımlanan bildirim ertesi iş günü yayımlanmış sayılır. Not geçerliyken sözleşme biterse, şirkete en fazla üç ay süre tanınır.",
"Son olarak sürdürülebilirlik endeksleri. İlk küresel endeksleri Dow Jones bin dokuz yüz doksan dokuzda, FTSE iki bin birde kurdu. Borsa İstanbul Sürdürülebilirlik Endeksi dört Kasım iki bin on dörtten beri hesaplanıyor ve iki bin yirmi birden beri Refinitiv'in notlarını kullanıyor.",
"Endekse girme şartları şöyle: genel not en az elli, her ana başlık en az kırk ve kategori notlarından en az sekizi yirmi altı veya üzeri. Bir de iki bin yirmi iki Kasım'da başlayan Sürdürülebilirlik yirmi beş endeksi var: orada şartlar yetmiş, altmış ve elli; bu şartı sağlayanlar arasından işlem hacmi ve piyasa değeri en yüksek yirmi beş pay seçilir.",
"Bu bölümün ve tüm defterin özeti: sigorta iki kat, bildirim altı iş günü, komite en az üç kişi, not bir yıl geçerli, endeks için sekiz ve yedi, sürdürülebilirlik için elli, kırk, yirmi altı. Böylece yedi bölümün hepsini bitirdik. Şimdi karma denemeyle kendini test etme zamanı. Sınavında başarılar dilerim."
]

<script>
(function(){
const L="ABCDE";
const KEY="ky-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("ky"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){
  const s=S[si], col=HUE[si];
  const tab=st.tab[si]||"notlar";
  const f=st.tab["f"+si]||"tum";
  const x=secStats(si), kb=s.sorular.filter(q=>q.k).length;
  let h=`<div style="--c:${col};display:contents">
  <div class="crumb"><a href="#genel">Genel bakış</a> / Bölüm ${s.id}</div>
  <section class="hero"><div><span class="pill">Bölüm ${s.id} / 7 · ${s.sorular.length} soru</span><h1>${esc(s.baslik)}</h1><p>${esc(s.ozet)}</p></div>${ring(x.c,x.n,col,"doğru")}</section>
  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();
  const list=st.karma.list, x=statsOf(list,st.karma.ans);
  let h=`<div class="crumb"><a href="#genel">Genel bakış</a> / Karma deneme</div>
  <section class="hero" style="--c:#141A2B"><div><span class="pill">Tüm bölümler · 25 soru</span><h1>Karma deneme</h1><p>Her bölümden en az üç soru içeren rastgele set. Buradaki cevaplar bölüm skorlarını etkilemez.</p></div>${ring(x.c,25,"#0E8F7E","doğru")}</section>
  ${bar(x,`<button class="btn pri" data-newkarma="1">Yeni set oluştur</button>`)}<div class="qlist">`;
  const saved=st.ans; st.ans=st.karma.ans;
  list.forEach(([s,qi],n)=>{h+=qCard(s,qi,n+1,true)});
  st.ans=saved;
  return h+`</div>`;
}

function renderHome(){
  let tA=0,tC=0;S.forEach((s,i)=>{const x=secStats(i);tA+=x.a;tC+=x.c});
  let h=`<section class="hero"><div><span class="pill">SPK Lisanslama · Kurumsal Yönetim</span><h1>Kurumsal Yönetim Sınav Defteri</h1>
  <p>Sınavın yedi alt konusu için bölüm notları ve notlardan hazırlanmış özgün sorular.</p>
  <div class="row" style="margin-top:18px"><a class="btn pri" href="#b1">Bölüm 1'den başla</a><a class="btn" href="#karma">Karma deneme</a></div></div>${ring(tC,TOTAL,"#0E8F7E","toplam doğru")}</section>
  <div class="tiles"><div class="tile"><span>Yanıtlanan</span><b>${tA}<small style="font-size:14px;color:var(--muted)"> / ${TOTAL}</small></b></div><div class="tile"><span>Doğru</span><b style="color:var(--ok)">${tC}</b></div><div class="tile"><span>Başarı oranı</span><b>${tA?"%"+Math.round(tC/tA*100):"–"}</b></div></div>
  <div class="sec-h"><h2>Bölümler</h2><span class="stat">${TOTAL} soru</span></div>
  <div class="grid">`;
  S.forEach((s,i)=>{const x=secStats(i);const kb=s.sorular.filter(q=>q.k).length;h+=`<a class="card" href="#b${s.id}" style="--c:${HUE[i]}"><div class="top"><span class="no">Bölüm ${s.id}</span><span class="stat">${s.sorular.length} soru</span></div><span class="t">${esc(s.kisa)}</span><span class="d">${esc(s.ozet)}</span>${meter(x.a,x.c,x.n)}<span class="p"><span>${x.c}/${x.n} doğru</span><span>${x.a} yanıt</span></span></a>`});
  h+=`</div>
  <section class="facts"><h2>Sınav öncesi son bakış</h2><dl>
  <div><dt>Uyum notu ağırlıkları (PS / KA / MS / YK)</dt><dd>25 / 25 / 15 / 35</dd></div>
  <div><dt>Asgari unsurda ilke başına tavan puan</dt><dd>%85</dd></div>
  <div><dt>BIST KY Endeksi asgari not (genel / ana başlık)</dt><dd>8 / 7</dd></div>
  <div><dt>Bağımsız üye sayısı</dt><dd>≥ 1/3, en az 2</dd></div>
  <div><dt>YK asgari üye sayısı</dt><dd>5</dd></div>
  <div><dt>İlişkili taraf: değerleme / bağımsız onayı</dt><dd>%5 / %10</dd></div>
  <div><dt>Bağımsız aday listesi Kurul'a</dt><dd>GK'dan 60 gün önce</dd></div>
  <div><dt>TTK azınlık (halka açık)</dt><dd>%10 (%5)</dd></div>
  <div><dt>Bir paya en çok oy</dt><dd>15</dd></div>
  <div><dt>KY uyum çalışması: uzman / komite</dt><dd>en az 2 / 3</dd></div>
  </dl></section>`;
  return h;
}

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b([1-7])$/.exec(r);
  if(m) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const PK="ky-ses-v1";
let pref={rate:1,voice:"",follow:true,mode:"podcast"};
try{const r=localStorage.getItem(PK);if(r)pref=Object.assign(pref,JSON.parse(r))}catch(e){}
const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(pref))}catch(e){}};

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["SPKn","Sermaye Piyasası Kanunu"],["TTSG","Türkiye Ticaret Sicili Gazetesi"],["TRİK","teminat, rehin, ipotek ve kefalet"],["YİB","yatırımcı ilişkileri bölümü"],["KYBF","Kurumsal Yönetim Bilgi Formu"],["URF","Uyum Raporu"],["KSS","kurumsal sosyal sorumluluk"],["NBD","net bugünkü değer"],["KGK","Kamu Gözetimi Kurumu"],["KYD","kurumsal yönetim derecelendirme"],["TTK","Türk Ticaret Kanunu"],["YK","yönetim kurulu"],["GK","genel kurul"],["KY","kurumsal yönetim"],["PD","piyasa değeri"],["FD","fiili dolaşımdaki"],["GM","genel müdür"],["SP","sermaye piyasası"],["ÇSY","çevresel, sosyal ve kurumsal yönetim"],["AB","Avrupa Birliği"],["ABD","Amerika Birleşik Devletleri"],["SOX","Sarbanes Oxley"]];
function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}
  t=t.replace(/(\p{Ll})[’'](\p{L})/gu,"$1$2").replace(/\s+/g," ");
  return t.trim();
}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;
}
function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){
  const vs=synth.getVoices();const tr=trVoices();
  return vs.find(v=>v.name===pref.voice)||tr[0]||null;
}
function fillVoices(){
  if(!synth)return;
  const vs=synth.getVoices();const tr=trVoices();const list=tr.length?tr:vs;
  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth){return}
  let si=curSi>=0?curSi:(qSi>=0?qSi:0);
  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}
  playing=true;speak();
}
function pause(){playing=false;utt=null;synth.cancel();ui()}
function stop(finished){playing=false;utt=null;if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}
  navByPlayer=false;ui();
});
window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
})();

</script>

</body></html>
