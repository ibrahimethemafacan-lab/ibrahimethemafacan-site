<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F5F7FB; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.opts2 select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}
.opts2 .rates{display:inline-flex;background:var(--line2);border-radius:9px;padding:2px}
.opts2 .rates button{border:0;background:transparent;padding:4px 8px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.opts2 .rates button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,26,43,.12)}
.opts2 label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.panel .warn{font-size:12.5px;color:#8A5A00;background:var(--book-soft);border-radius:10px;padding:8px 10px}
@media (max-width:900px){.fab-btn .lbl{display:none}.fab-btn{padding:10px}}
@media (prefers-reduced-motion:reduce){.fab-btn.live .disc{animation:none}}
#pFollowL[hidden]{display:none}
.mode{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:3px}
.mode button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.mode button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}
.panel .now{font-size:14px;line-height:1.55}

</style>

<div class="app">
  <aside class="rail">

<p><b>Organizasyonun 12 ilkesi:</b> amaç birliği, yönetim alanı (kontrol alanı = bir üste bağlı ast sayısı), yönetim birliği, komuta birliği (her ast tek üstten emir alır), yetki-sorumluluk açıklığı ve dengesi, haberleşme kanalı ve şekli, <b>ayrılık gözetme</b> (üst yönetim rutinden uzak tutulur), personel dağılımında denge, kaynak dağılımında denge, merkezcil-merkezkaç denge, iş bölümü ve uzmanlık, gelişme yeteneği.</p>

<p><b>Modern organizasyon yapıları:</b></p>
<ul>
<li><b>Şebeke:</b> bağımsız, aralarında hiyerarşi olmayan işletmelerin uzun süreli işbirliği. Türleri: <i>dahili</i> (her ünite kâr merkezi, piyasa fiyatı), <i>dengeli</i> (<b>tek bir lider işletme</b>), <i>dinamik</i> (hızlı ve düzensiz rekabet).</li>
<li><b>Yığışım:</b> farklı disiplinlerden kişiler; hiyerarşi yerine uzmanlık ve bilgi; başarısı liderliğin kalitesine bağlı.</li>
<li><b>Hibrid-melez:</b> ürün ve fonksiyon ya da ürün ve coğrafyayı birlikte barındıran çok odaklı yapı.</li>
<li><b>Yalın:</b> Toyota üretim sistemi; temel faktörler <b>iş üniteleri</b> ve <b>sıfır hiyerarşi</b> (orta kademe devre dışı).</li>
<li><b>Öğrenen:</b> gelişim sırası <b>bilen → anlayan → düşünen → öğrenen</b> örgüt. Bilen örgüt örneği McDonald's.</li>

<p><b>Değişim yönetimi:</b> Değişimin 8 adımı: ivedilik duygusu, rehberlik koalisyonu, vizyon yaratmak, vizyonu iletmek, harekete geçirme yetisi, kısa vadeli kazanımlar, iyileştirmeleri pekiştirmek, kurumsallaştırmak.<br>
<b>Değişimin genel amaçları:</b> örgütün devamlılığı, büyüme ve gelişme, iç-dış çevreye istikrarlı uyum, üyelerin tutum ve davranışlarını değiştirmek. <b>Özel amaçlar:</b> etkinlik, verimlilik ve motivasyonu artırmak, iletişimi güçlendirmek, yönetimi demokratikleştirmek.<br>
<b>Türler:</b> planlı-plansız, makro-mikro, proaktif-reaktif, aktif (çevreyi değiştirir)-pasif (çevreye uyar), ani-zamana yayılmış, evrimci-devrimci.</p>

<h3>Yürütme (yöneltme) işlevi</h3>
<p>Yönetimin çekirdeği ve dinamik yönü. Araçları: <b>yetki, iletişim, liderlik, motivasyon</b>.</p>
<ul>
<li><b>Yetki</b> göreve ve mevkiye bağlıdır, kişiye özgü değildir; <b>güç</b> kişiye özgü bir yetenektir.</li>
<li><b>İletişim unsurları:</b> kaynak, mesaj, alıcı. <b>Formel kanallar (4):</b> dikey (aşağı ve yukarı), yatay, çapraz (diyagonal), dışa dönük. Bunların dışında informel iletişim.</li>
<li><b>Liderlik yaklaşımları:</b> ayırt edici (lider doğulur), stil (1940 sonrası, liderlik öğretilebilir), durumlara göre, yeni liderlik (karizma ve vizyon).</li>
<li><b>Yönetici ve lider:</b> yönetici işleri doğru yapar, lider doğru işi yapar; yönetici yetki, lider güç sahibidir; her lider yönetici olabilir ama her yönetici lider olamaz.</li>
</ul>
<table class="t"><tr><th>Motivasyon teorisi</th><th>Özü</th></tr>
<tr><td>Maslow</td><td>5 basamak: fizyolojik → güvenlik → sosyal → saygınlık → kendini gerçekleştirme.</td></tr>

<tr><td>McClelland</td><td>Başarı, güç ve bağlanma ihtiyacı.</td></tr>
<tr><td>Vroom beklenti</td><td>Güdülenme = davranışın amaca ulaştıracağı beklentisi × amaca verilen önem.</td></tr>
</table>

<h3>Kontrol (denetim) işlevi</h3>
<ul>
<li><b>İlkeler:</b> amaç ve planlara yönelik; değişen koşullara uyacak esneklikte; en az maliyetli; faaliyet kapsamında; <b>tarafsız</b>; düzeltici önlem alınmalı.</li>
<li><b>Süreç (4):</b> standartların belirlenmesi → sonuçların ölçülmesi → karşılaştırma → düzeltici tedbirler.</li>
<li><b>Bilgi yönetimi</b> bilgi teknolojileri yönetimi demek değildir; insan kaynağı ve kurum kültürü gerekir. Kurumsal hafıza kişilerden bağımsızdır.</li>
</ul>

<h3>Yönetim kuralları ve etik değerler</h3>
<p>OECD'ye göre şirketlerde sorumlu yönetim, şirket ile içinde faaliyet gösterdiği toplum arasındaki uyumu gösterir. Etik değer başlıkları: <b>sorumluluk</b> (kanunlara, müşterilere, çalışanlara, tedarikçilere, rakiplere karşı ve sosyal sorumluluk), <b>gizlilik</b>, <b>çıkar çatışması</b> (rakip şirkette ikinci iş kabul edilemez), <b>varlıkların kullanımı</b>, <b>muhasebe ve finansal raporlama standartlarına uyum</b> (KGK mevzuatı), <b>güvenli çalışma</b>, <b>takım çalışması</b>, <b>verimlilik</b>.</p>

id:2,
kisa:"Temel Kavramlar",
baslik:"Kurumsal Yönetim ile İlgili Temel Kavramlar ve Yaklaşımlar",
ozet:"Tanımlar, dört temel ilke, mülkiyet yapısına göre yaklaşımlar, yönetim kurulu, iç kontrol ve skandallar.",
notlar:`
<h3>Kavramın doğuşu</h3>
<ul>
<li><b>Berle ve Means (1932) – "The Modern Corporation and Private Property":</b> mülkiyet ile kontrolün aynı elde bulunmasının tehlikelerine dikkat çekti, iki fonksiyonun ayrılması gereğini vurguladı. Sermaye küçük hissedarlara dağılmış, kontrol profesyonel yöneticilerde.</li>
<li>Skandallar konuyu gündeme taşıdı: <b>Enron ve WorldCom</b> (ABD), <b>Parmalat</b> (İtalya), <b>Ahold</b> (Hollanda), <b>Yanguangxia</b> (Çin).</li>
<li>Yaklaşık 50 ülke kurumsal yönetim kodu, ilkesi ya da kuralı yayımladı. Terminoloji (model, uygulama, mekanizma, sistem) farklı olduğu için tanımda tam görüş birliği yoktur.</li>
</ul>

<h3>Tanımlar (kimin, ne dediği)</h3>
<table class="t"><tr><th>Kaynak</th><th>Tanımın özü</th></tr>
<tr><td>Shleifer ve Vishny (1997)</td><td>Şirketlere finansman sağlayanların uygun bir getiriyi temin etmelerine ilişkin ilkeleri inceler.</td></tr>
<tr><td>Monks ve Minow (1995)</td><td>Performans ve yönün belirlenmesinde hissedarlar, üst yönetim ve yönetim kurulu arasındaki ilişki.</td></tr>
<tr><td>Ira Millstein (Yale)</td><td>Üst yönetimin gözetildiği, şirket kârı ile hissedar çıkarlarının korunduğu mekanizma.</td></tr>
<tr><td>Stijn Claessens</td><td>Dar anlamda: halka açık şirketlerde hisse senedi yatırımlarını düzenleyen sermaye piyasası kuralları.</td></tr>
<tr><td>Cadbury Komitesi (İngiltere)</td><td>Şirketlerin yönetimine ve denetimine ilişkin sistem.</td></tr>
<tr><td>Salacuse (2002)</td><td>Yönetim güçle ilgilidir. Üç güç merkezi: <b>yönetim kurulu, üst düzey yöneticiler, hissedarlar</b>.</td></tr>
<tr><td>OECD (2004)</td><td>Yönetim, yönetim kurulu, hissedarlar ve diğer menfaat sahipleri arasındaki ilişkiler dizisi; yasal, düzenleyici ve kurumsal faktörlere dayanır.</td></tr>
<tr><td>Dünya Bankası</td><td>Beşeri ve mali sermayeyi çekmeye, etkin çalışmaya ve uzun dönemde ortaklara değer yaratmaya imkân tanıyan kanun, yönetmelik, kod ve uygulamalar.</td></tr>
<tr><td>ICC (2004) "Corporate Governance Worldwide"</td><td>Hissedar haklarının güvencesi, rekabetin güçlendirilmesi, sermayeye erişimde doğru stratejiler.</td></tr>
<tr><td>Kübra Şehirli (1999, SPK Yeterlik Etüdü)</td><td>Pay sahipleri dahil tüm menfaat sahiplerinin haklarını koruyan bir yönetim felsefesi.</td></tr>
<tr><td>TÜSİAD (2002)</td><td>Geniş anlamda her kurumun yönetiminin düzenlenmesi; dar anlamda Dünya Bankası tanımı.</td></tr>
<tr><td>Ülgen ve Mirze (2004)</td><td>Üst yönetimin (söz sahipleri) kendini "hak sahibi" gören pay sahipleri, çalışanlar, tedarikçi, müşteri ve toplumla ilişkileri.</td></tr>
</table>
<p><b>Dar anlamda kurumsal yönetim:</b> şirket yönetimi ile hissedarlar (shareholders) ve menfaat sahipleri (stakeholders) arasındaki ilişkileri düzenleyen kurallar bütünü.</p>
<p><b>Menfaat sahipleri:</b> şirket faaliyetleriyle doğrudan veya dolaylı ilişkisi olan ve pozitif/negatif dışsallık elde eden kişi ve kurumlar. En geniş anlamda ana sahip ve yöneticiler, yönetim kurulu, hissedarlar, kurumsal yatırımcılar, yabancı ortaklar, çalışanlar, müşteriler, rakipler, tedarikçiler, toplum ve devlet.</p>

<h3>Dört temel ilke</h3>
<table class="t"><tr><th>İlke</th><th>Anlamı</th><th>Kapsadığı zaman</th></tr>
<tr><td>Adillik (fairness)</td><td>Azınlık ve yabancı ortaklar dahil bütün hak sahiplerine eşit davranma; ihlalde telafi imkânı.</td><td>–</td></tr>
<tr><td>Hesap verebilirlik (accountability)</td><td>Yönetim kurulunun anonim şirket tüzel kişiliğine ve pay sahiplerine hesap verme zorunluluğu.</td><td><mark>Yalnız faaliyet sonrası</mark></td></tr>
<tr><td>Şeffaflık (transparency)</td><td>Ticari sır ve henüz açıklanmamış bilgiler hariç, finansal ve finansal olmayan bilgilerin zamanında, doğru, eksiksiz, anlaşılır, düşük maliyetle erişilebilir açıklanması.</td><td><mark>Öncesi, süreci ve sonrası</mark></td></tr>
<tr><td>Sorumluluk (responsibility)</td><td>Faaliyetlerin mevzuata, esas sözleşmeye, şirket içi düzenlemelere, toplumsal ve etik değerlere uygunluğu ve denetlenmesi.</td><td>–</td></tr>
</table>

<h3>Mülkiyet yapısına göre yaklaşımlar</h3>
<p>Genel ayrım: (1) öncelikle hissedar haklarının korunması, (2) hissedarlarla birlikte diğer menfaat sahiplerinin haklarının da gözetilmesi.</p>
<table class="t"><tr><th></th><th>Dağılmış mülkiyet (Anglo-Sakson)</th><th>Hakim ortak</th></tr>
<tr><td>Ülkeler</td><td>ABD, İngiltere</td><td>Kıta Avrupası, gelişmekte olan ülkeler</td></tr>
<tr><td>Yapı</td><td>Çok sayıda küçük hissedar, kontrol profesyonel yöneticilerde</td><td>Büyük hissedar yönetimi belirler ve denetler</td></tr>
<tr><td>Temel sorun</td><td>Küçük hissedarın denetim gücü yok; <b>vekil maliyeti (agency cost)</b></td><td>Büyük hissedarın yönetimle küçük hissedar aleyhine işbirliği</td></tr>
</table>
<ul>
<li><b>Shleifer ve Vishny:</b> en iyi sistemi söylemek mümkün değildir; en iyi sistem büyük ve küçük yatırımcıların haklarını hukuken en iyi koruyandır.</li>
<li><b>Goyer (2002–2003):</b> Anglo-Sakson sistemde emeklilik ve yatırım fonları ana hissedar, piyasalar şeffaf ve gelişmiş, piyasa şirketleri kontrol eder. Kıta Avrupasında hakim ortak, bankalar veya finans dışı kuruluşlar ana ortak, şeffaflık az, yönetimin onaylamadığı satın almalar yok.</li>
<li><b>Reed (2002):</b> Hindistan, Güney Kore, Brezilya, Meksika, Nijerya, Güney Afrika gibi aile kontrollü, devlet bankası borcuyla finanse edilen sistemleri Anglo-Amerikan modelle karşılaştırdı.</li>
<li><b>Gilson (2000):</b> şekilde veya işlevde yakınsama. Gruplar: Japonya <b>Keiretsu</b>, Kore <b>Chaebol</b>, Avrupa holding.</li>
</ul>

<h3>Yönetim kurulu</h3>
<ul>
<li>Kurumsal yönetimin <b>odak noktası</b>; en üst stratejik karar, yürütme ve temsil organı.</li>
<li>Sorumlu olduğu alanlar: performansın gözetimi, stratejiler, risk yönetimi, üst yönetimin değerlendirilmesi, hissedarlarla etkin iletişim. Temel görevi sürdürülebilirlik.</li>
<li>Yalnız hakim ortağı değil tüm çıkar gruplarını temsil eder; en önemli niteliği <b>bağımsızlık</b>tır.</li>
<li><mark>Her bağımsız üye icracı olmayan üyedir; her icracı olmayan üye bağımsız değildir.</mark> İcracı olmayan üye ancak bağımsızlık kriterlerini sağlarsa bağımsızdır.</li>
</ul>
<h4>Avrupa'da yönetim kurulu yapıları</h4>
<table class="t"><tr><th>Yapı</th><th>Özellik</th></tr>
<tr><td>Tek kademeli</td><td>İcracı ve icracı olmayan üyeler aynı kurulda; genel kurulca seçilir. <b>8 AB ülkesi zorunlu</b> tutar. Avantajı hızlı karar ve eş zamanlı bilgi.</td></tr>
<tr><td>İki kademeli</td><td><i>Management Board</i> (icra kurulu, icracı üyeler) ve <i>Supervisory Board</i> (üst kurul, icracı olmayan bağımsızlar). Üst kurul üyeleri icra kurulunda yer alamaz; <b>icra kurulunu üst kurul seçer</b>. <b>7 ülke zorunlu</b> tutar. Avantajı başkan ve CEO rollerinin kesin ayrılması.</td></tr>
<tr><td>İskandinav</td><td>Küçük (ortalama 6 kişi), kadın üye oranı görece yüksek, ağırlıkla icracı olmayan üyeler, başkan ve CEO her zaman ayrı kişi, çalışan temsilcisi hakkı.</td></tr>
</table>
<p>Tablo: ortalama üye sayısı en yüksek Almanya (17,0), en düşük Finlandiya (7,5). Kadın üye oranı en yüksek Norveç (%39).</p>

<h4>Yönetim kurulu öz değerlendirmesi</h4>
<p>Mesafeli durulma nedenleri: üyelerin rahatsızlığı, günlük yoğunluk, kriter eksikliği, kurulun fiilen etkin olmaması, hakim ortak/başkan/CEO'nun olumsuz sonuç endişesi. Başarı koşulları: amaç anlatılmalı, gizlilik esas, başkan ve CEO rol almalı, her yıl düzenli, benchmark kriterleri, başkanın kapsamlı raporu, metodolojinin geliştirilmesi.</p>
<p><b>Heidrick & Struggles (2014):</b> AB'de halka açık şirketlerin <mark>%70'i her yıl</mark>, %8'i iki yılda bir, %6'sı üç yılda bir veya daha seyrek değerlendirme yapar; %16'sı hiç yapmaz.</p>

<h3>İç denetim, iç kontrol, risk yönetimi</h3>
<ul>
<li><b>İç denetim:</b> faaliyetlere değer katmayı amaçlayan bağımsız ve objektif <b>güvence ve danışmanlık</b> faaliyeti; risk yönetimi, iç kontrol ve kurumsal yönetim süreçlerinin etkinliğini değerlendirir.</li>
<li><b>İç kontrol:</b> faaliyetlerin etkinliği, mali raporların güvenilirliği ve mevzuata uyumu temin eden süreç. <b>5 bileşen:</b> kontrol ortamı, risk değerlemesi, kontrol faaliyetleri, bilgi ve iletişim, gözetim.</li>
<li><b>Risk yönetimi:</b> bu beş unsura ek olarak işletmenin amacının belirlenmesini, hedefleri etkileyecek iç ve dış unsurların tespitini ve riske verilecek tepkinin belirlenmesini gerektirir.</li>
</ul>

<h3>İyi kurumsal yönetimin faydaları</h3>
<ol>
<li><b>Dış finansmana erişim:</b> İtalya'da 2001'de kurulan STAR endeksinde kurumsal yatırımcı oranı 2001'de %54 iken 2011'de <b>%88</b>.</li>
<li><b>Sermaye maliyetinin düşmesi.</b></li>
<li><b>Operasyonel verimlilik:</b> Bruno ve Claessens (2010) bağımsız YK ve komitelerle performans arasında anlamlı ilişki buldu.</li>
<li><b>Şirket değeri ve hisse performansı:</b> 2003–2013'te FTSE Italia STAR +%40, Mid Cap −%7, genel endeks −%28.</li>
<li><b>Marka değeri ve iyi isim.</b></li>
<li><b>Kriz ve batma skandallarının önlenmesi.</b></li>
</ol>

<h3>Skandal kutuları</h3>
<table class="t"><tr><th>Şirket</th><th>Akılda kalacaklar</th></tr>
<tr><td>WorldCom (ABD)</td><td>Bernie Ebbers, LDDS. 1997'de MCI'yi 37 milyar $'a aldı. Sprint için 129 milyar $ teklif veto edildi. <b>Giderleri sermaye yatırımı gibi göstererek</b> geliri 3,9 milyar $ yüksek gösterdi; CFO Scott Sullivan ve David Myers kovuldu; 17.000 çalışan çıkarıldı. 41 milyar $ borçla Haziran 2002'de konkordato; 3,3 milyar $ ek usulsüzlük. Ebbers 2005'te 25 yıl hapis.</td></tr>
<tr><td>Enron (ABD)</td><td>1985'te boru hattı şirketi; Fortune 500'de 7. sıra. Ekim 2001'de net kâr 544 milyon $, özsermaye 1,2 milyar $ düzeltildi; hisse 80 $ → 0,20 $; Aralık 2001 iflas. Denetçi Arthur Andersen: denetimden 25, danışmanlıktan 27, toplam 52 milyon $; yaklaşık 16 yıllık ilişki; zararlar özel amaçlı şirketlere aktarıldı.</td></tr>
<tr><td>Parmalat (İtalya)</td><td>1961'de süt aile şirketi. 13 kişilik YK: 5 icracı olmayan, 8 icracı, yalnız 3 bağımsız (biri kredi aldığı bankanın eski başkanı). 1990'da Milano borsasına kote. 500 milyon € bono ödenemedi; Cayman'daki iştirak <b>Bonlat</b>'ın Bank of America hesabındaki 3,95 milyar € 19 Aralık 2003'te yok çıktı. Grant Thornton, Deloitte; S&P skandaldan hemen önce yüksek not verdi. Borç 14,8 milyar €; YK Başkanı Calisto Tanzi hapse girdi.</td></tr>
<tr><td>Royal Ahold (Hollanda)</td><td>2003'te muhasebe yanlışlıkları; 2001 kârı fazla gösterildi; hisseler üçte iki değer kaybetti. 2004'te 8 milyon € tazminat; Mayıs 2006'da yöneticilere ertelenmiş hapis. Yeni CEO'nun "iyileşme yol haritası" ile güven geri kazanıldı.</td></tr>
</table>

notlar:`
<p>Kurumsal yönetim terimi yaygın olarak <b>1980'lerde</b> kullanılmaya başlandı; 2000'lerdeki skandallarla gündemin merkezine oturdu.</p>

<h3>Skandal kutuları</h3>
<table class="t"><tr><th>Olay</th><th>Akılda kalacaklar</th></tr>
<tr><td>Volkswagen</td><td>Kyoto Protokolü 1997'de imzalandı, 2005'te yürürlüğe girdi; 15 AB ülkesi CO2'yi %8 azaltmayı taahhüt etti → dizele kayış (2010'da %60). ABD Çevre Ajansı testlerinde VW araçlarında azot oksit emisyon farkı <b>35 katına</b> kadar çıktı; testi algılayan yazılım. Martin Winterkorn ayrıldı, yerine Hinrich Woebcken geldi. ABD Adalet Bakanlığı 18 milyar $ ceza öngördü; Almanya'da 278 yatırımcı 3,7 milyar $ dava açtı.</td></tr>
<tr><td>Mannesmann–Vodafone</td><td>Vodafone 2000'de Mannesmann'ı devraldı; yöneticilere şüpheli ödemeler. Deutsche Bank'tan <b>Josef Ackermann</b> icracı olmayan YK üyesiydi. Zarar 75 milyon $ (eski CEO Klaus Esser'e 15 milyon $ dahil). İngiltere Milli Sigorta Fonu Chris Gent'in 15 milyon $ primine itiraz etti.</td></tr>
</table>

<h3>ABD ve Sarbanes-Oxley (SOX)</h3>
<ul>
<li>WorldCom'un Temmuz 2002'de iflası, Enron ve Parmalat. WorldCom ve Enron'un ilk yıl ABD ekonomisine zararı 37–42 milyar $.</li>
<li><b>SOX Temmuz 2002</b>'de çıktı; 1934 Securities Exchange Act'ten sonra en önemli finansal mevzuat. SEC'e kayıtlı her şirket (ABD'de kote yabancılar dahil) kapsamda; ilk halinde ABD'li ve ABD'li olmayan şirket ayrımı yok.</li>
</ul>
<p><b>SOX'un 8 temel önlemi:</b></p>
<ol>
<li>Kamu Gözetimi Muhasebe Kurulu (PCAOB) kuruldu.</li>
<li>Denetim komiteleri, üyelerinin bağımsızlığı ve denetçiyi belirleme sorumluluğu düzenlendi.</li>
<li>Denetçilerin denetim dışı hizmet vermesi yasaklandı; yanlış yönlendirmeye cezai hüküm.</li>
<li><b>Whistleblowing</b> (muhbirlik) yasal olarak kabul edildi; ihbar zorunlu, ihbar eden korunur. (Enron ve WorldCom orta kademe muhasebecilerin ihbarıyla ortaya çıktı.)</li>
<li>Yöneticilerin şirketten kişisel borç alması yasaklandı.</li>
<li>CEO ve CFO'ya finansal raporların doğruluğu konusunda sorumluluk yüklendi.</li>
<li>Denetçi suiistimaline ağır cezalar.</li>
<li>Hesap suiistimallerinden YK üyeleri sorumlu; hak ve menfaatlerine el konulabilir.</li>
</ol>
<p><b>New York Borsası:</b> standartlar "Company Manual" <b>303A</b> bölümünde. 303A.11'e göre yabancı şirketler ABD uygulamalarından farklı olan uygulamalarını faaliyet raporu ve İngilizce web sitesinde açıklar.</p>

<h3>Avrupa Birliği</h3>
<div class="key">ABD'de katı kanunlar (SOX), AB'de <b>"Uygula, uygulamıyorsan açıkla – Comply or Explain"</b> prensibi egemendir.</div>
<table class="t"><tr><th>Ülke</th><th>Düzenleme</th></tr>
<tr><td>İngiltere</td><td><b>1992 Cadbury Raporu</b> · 2003 Combined Code · 2003 <b>Higgs Raporu</b> (icracı olmayan üyeler) · 2003 <b>Smith Raporu</b> (denetim komitesi) · 2014 FRC Kurumsal Yönetim Kodu: <i>Liderlik, Etkinlik, Hesap Verebilirlik, Ücretlendirme, Hissedarlarla İlişkiler</i> · 2017 başında inceleme · Temmuz 2018 yeni kod · 2012 Stewardship Code</td></tr>
<tr><td>Almanya</td><td>Cromme Commission Code (2001), German Corporate Governance Code (2007)</td></tr>
<tr><td>Fransa</td><td>Bouton Raporu (2003), Recommendations sur le gouvernement d'entreprise (2004), AFEP-MEDEF Kodu (2008)</td></tr>
</table>
<p><b>AB Komisyonu kronolojisi:</b></p>
<ul>
<li>2003: "Şirketler Hukukunun Modernleştirilmesi ve Kurumsal Yönetim Uygulamalarının Geliştirilmesi" faaliyet planı.</li>
<li>2005: Avrupa Kurumsal Yönetim Forumu kuruldu.</li>
<li>2007: Hissedar hakları direktifi (2007/36/EC). Bağımsız/icracı olmayan üyeler ve ücretlerle ilgili iki tavsiye kararı (2005/162/EC, 2004/913/EC).</li>
<li>2010: finans kuruluşlarının kurumsal yönetimine dair yeşil kitap; 2011: CRD IV ile finans kuruluşlarına daha katı kurallar; 2011: kurumsal yönetim çerçevesi üzerine ikinci yeşil kitap.</li>
<li><b>Aralık 2012 "Şirketler Hukuku ve Kurumsal Yönetim Faaliyet Planı":</b> (i) <b>şeffaflığın artırılması</b> (YK çeşitlilik politikası, KY raporlaması, hisselerin kimde olduğu, kurumsal yatırımcı şeffaflığı), (ii) <b>hissedarların teşviki</b> (ücretlerin takibi, ilişkili işlemler, vekaleten oy ve proxy advisors, acting in concert ayrımı, çalışan hissedarlığı), (iii) <b>şirketlerin büyüme ve rekabetinin desteklenmesi</b>.</li>
<li>26 Haziran 2013 direktifi: halka açık şirketler faaliyet raporunda kurumsal yönetim uyum beyanı yayımlar.</li>
<li><b>Nisan 2014 tavsiye kararı (2014/208/EU):</b> hangi koda uyulduğu açıklanır; uyulmayan maddelerin nedeni ve alternatif uygulama ayrıntılı açıklanır.</li>
<li><b>Paris Borsası CAC40 Kurumsal Yönetim Endeksi (24 Mart 2017):</b> 4 kriter: YK sorumlulukları ve performansı; iç denetim ve bağımsız dış denetim; pay sahiplerinin hakları; yönetici ücretleri.</li>
<li><b>2017/828 Direktifi</b> (2007/36'yı değiştirir, 20.05.2017): ortaklıkların pay sahiplerinin kimliğini bilme hakkı; aracı kuruluşlara bilgi aktarma ve hak kullanımını kolaylaştırma görevi; elektronik oyda teyit; kurumsal yatırımcı ve varlık yöneticilerine uygula veya açıkla esaslı açıklama; mali haklar politikasının genel kurulda onayı ve mali haklar raporu; ilişkili tarafla önemli işlemlerin açıklanması ve onayı. Olağan işletme konusu içinde ve piyasa koşullarındaki işlemlere uygulanmaz.</li>
</ul>

<h3>G20/OECD Kurumsal Yönetim İlkeleri</h3>
<table class="t"><tr><th>Tarih</th><th>Gelişme</th></tr>
<tr><td>1998</td><td>OECD bağlayıcı olmayan ilkeler için çalışma grubu kurdu.</td></tr>
<tr><td>1999</td><td>OECD Bakanlar Kurulu ilkeleri onayladı.</td></tr>
<tr><td>2002 / 2004</td><td>Gözden geçirme; 2004'te revize ilkeler.</td></tr>
<tr><td>8 Temmuz 2015</td><td>OECD Konseyi kabul etti.</td></tr>
<tr><td>4–5 Eylül 2015</td><td><b>Ankara</b>'da G20 Bakanlar ve Merkez Bankası Başkanları toplantısında G20/OECD İlkeleri olarak kabul.</td></tr>
<tr><td>15–16 Kasım 2015</td><td>G20 Liderler Zirvesinde kabul.</td></tr>
</table>
<ul>
<li>Ekonomik etkinlik, sürdürülebilir büyüme ve finansal istikrarı destekler; payları borsada işlem gören şirketlere odaklanır. <b>Bağlayıcı değildir; iyi kurumsal yönetimin tek bir modeli yoktur.</b></li>
<li>Finansal İstikrar Kurulu'nun "Sağlıklı Finansal Sistemler için Temel Standartları"ndan biri; Dünya Bankası ROSC değerlendirmelerinin temeli.</li>
</ul>
<p><b>Altı bölüm:</b></p>
<ol>
<li>Etkin kurumsal yönetim çerçevesi için temellerin sağlanması (yeni: denetim ve yaptırımın kalitesi, borsaların rolü).</li>
<li>Pay sahiplerinin hakları, adil muamele ve temel ortaklık işlevleri (yeni: genel kurulda bilgi teknolojisi, ilişkili taraf onayı, ücret kararlarına katılım).</li>
<li><b>Kurumsal yatırımcılar, pay senedi piyasaları ve diğer aracılar — tamamen yeni bölüm.</b></li>
<li>Kurumsal yönetimde menfaat sahiplerinin rolü.</li>
<li>Kamuyu aydınlatma ve şeffaflık (yeni: gönüllü finansal olmayan bilgi).</li>
<li>Yönetim kurulunun sorumlulukları (yeni: risk ve vergi planlaması, iç denetim; YK eğitimi ve değerlendirmesi; ücret, denetim ve risk komiteleri).</li>
</ol>

<h3>Sürdürülebilirlik</h3>
<p><b>Sürdürülebilirlik raporlaması (GRI, 2006):</b> sürdürülebilir kalkınma hedefine doğru kurumsal performansı ölçme, açıklama ve iç-dış menfaat sahiplerine karşı sorumlu olma uygulaması. ÇSY = ESG (çevresel, sosyal, kurumsal yönetim).</p>
<table class="t"><tr><th>Yıl</th><th>Gelişme</th></tr>
<tr><td>1972</td><td>Roma Kulübü "Büyümenin Sınırları" raporu; BM Stockholm İnsani Çevre Konferansı, UNEP kuruldu.</td></tr>
<tr><td>1980</td><td>IUCN'nin UNEP için hazırladığı Dünya Koruma Stratejisinde sürdürülebilir kalkınma <b>ilk kez</b> tanımlandı.</td></tr>
<tr><td>1987</td><td><b>Brundtland Raporu</b> (Ortak Geleceğimiz): gelecek kuşakların ihtiyaçlarını karşılama olanağından ödün vermeden bugünün ihtiyaçlarını karşılayan kalkınma.</td></tr>
<tr><td>1992</td><td>Rio Çevre ve Kalkınma Zirvesi; 27 maddelik bildirge; iklim, biyoçeşitlilik ve çölleşme sözleşmeleri.</td></tr>
<tr><td>1997</td><td><b>GRI</b> kuruldu (UNEP + CERES); ilk rehber 2000; G4 revizyonu 2013; en yaygın standart.</td></tr>
<tr><td>2000</td><td><b>UN Global Compact</b>: insan hakları, çalışma koşulları, çevre, yolsuzlukla mücadele alanlarında 10 ilke.</td></tr>
<tr><td>2005</td><td><b>UN PRI</b>: 12 ülkeden 20 büyük kurumsal yatırımcı; Nisan 2017'de 1700'den fazla imzacı (~70 trilyon $).</td></tr>
<tr><td>2009</td><td>BM Sürdürülebilir Borsalar Girişimi (UN SSE).</td></tr>
<tr><td>Şubat 2019</td><td>IOSCO danışma raporu: en büyük engel, kabul görmüş sürdürülebilir finans standartlarının olmaması; ÇSY risk unsuru olarak ele alınmalı.</td></tr>
</table>
<p>181 ABD CEO'sunun Business Roundtable bildirisi: şirketler tüm menfaat sahipleri için değer yaratmalı.</p>
<p><b>Raporlama çerçeveleri:</b> GRI, UN Global Compact, <b>SA8000</b> (menfaat sahibi hakları, sağlık-güvenlik, disiplin, ayrımcılık, çalışma saatleri, ücret konularında asgari şartlar), <b>SASB</b> (sektöre özgü, finansal etki). ÇSY raporlamasında 400'den fazla standart var; finansal raporlamadaki gibi bağımsız denetim yok, bu da güvenilirliği etkiler.</p>
<p><b>Faydaları:</b> uzun vadeli sermaye ve uygun finansman, çalışan motivasyonu, yönetim sistemlerinin gelişmesi, etkin risk yönetimi, yeni iş fırsatı ve inovasyon, sürekli iyileştirme, marka değeri ve itibar, paydaş şeffaflığı, faaliyet lisansını sürdürme, finansal değer, paydaş ilişkileri.</p>

<h3>Entegre raporlama</h3>
<ul>
<li>Finansal ve finansal olmayan bilgiyi tek raporda birleştirip bunları birbirleriyle ve stratejiyle ilişkilendirir; değer yaratmayı gösterir.</li>
<li>Amaçları: bilgi kalitesini artırmak; bütüncül ve verimli raporlama; geniş sermaye tabanı (finans, üretilmiş, fikri, insan, sosyal-ilişkisel, doğal) için hesap verebilirlik; kısa, orta ve uzun vadeli değer yaratma.</li>

notlar:`
<h3>Arka plan</h3>
<ul>
<li>TTK komisyon çalışmalarında AB'nin 2003 "Şirketler Hukukunun Modernleştirilmesi ve AB İçinde Kurumsal Yönetimin Güçlendirilmesine İlişkin Aksiyon Planı" ve "Avrupa Şirketler Hukuku için Modern Hukuk Düzenleme Çerçevesi"nden yararlanıldı (Tekinalp, 2008). Bu nedenle kurumsal yönetim bölümleri genel olarak <b>Anglo-Sakson</b> hukuk sistemi çerçevesindedir.</li>
<li>Genel gerekçe: dinamik İngiltere'de <b>1992 Cadbury Raporu</b> ile başladı. Temeller: şeffaflık, iyi ve hesabı verilebilir yönetim, etkili iç ve dış denetim.</li>
<li><b>Dört taşıyıcı kolon:</b> şeffaflık, adillik, hesap verilebilirlik, sorumluluk. Şeffaflık şirketi "camdan cep" olarak görmenin ötesinde bir anlayıştır; yeni aracı internet ve web sitesidir. Adillik geniş kapsamlı eşit işlem ilkesiyle örtüşür ve 1920'lerin "işletmenin kendisi için var olduğu" teorisini hatırlatır.</li>
<li>Tartışılan öneriler: YK'nın icracı (executive) ve icracı olmayan (non-executive) üyelere ayrılması ve sorumluluklarının farklılaşması; riskin erken teşhisi, denetim ve atamalar komitelerinin yürütme yetkisi olmayan üyelere bağlı çalışması; pay sahipliği haklarının güçlendirilmesi; YK ücretlerinin denetimi; finansal tabloların bağımsız denetimi.</li>
<li>"Pay sahiplerinin değeri" maksimizasyonu kuramı, toplumsal eğilimle (paragraf 89) çelişir.</li>
</ul>

<h3>Pay sahipleri</h3>
<p>Haklar ikiye ayrılır: her pay sahibinin tek başına kullandığı <b>kişisel haklar</b> ve belirli sermaye oranına sahip olanların kullandığı <b>azınlık hakları</b>.</p>
<div class="key"><b>Azınlık oranı:</b> sermayenin en az <mark>%10'u (1/10)</mark>; halka açık anonim şirketlerde en az <mark>%5'i (1/20)</mark>.</div>
<table class="t"><tr><th>Madde</th><th>Konu ve kural</th></tr>
<tr><td>193</td><td>Birleşme, bölünme, tür değiştirmeye katılan herkes kusurlarıyla verdikleri zarardan şirketlere, ortaklara ve alacaklılara karşı sorumludur.</td></tr>
<tr><td>336</td><td>Kuruluş belgeleri sicil dosyasına konur, birer nüshası şirketçe <b>5 yıl</b> saklanır.</td></tr>
<tr><td>353, 530</td><td>Fesih davası: anonim şirketin butlanına veya yokluğuna karar verilemez; kuruluşta kanuna aykırılıkla menfaatler önemli ölçüde tehlikeye düşmüşse YK, Ticaret Bakanlığı, alacaklı veya pay sahibinin istemiyle asliye ticaret mahkemesi feshe karar verir. Organ eksikliğinde mahkeme önce süre verir.</td></tr>
<tr><td>357, 391</td><td><b>Eşit işlem ilkesi:</b> eşit şartlarda eşit işlem; aykırı YK kararları <b>butlan</b> yaptırımına tabidir.</td></tr>
<tr><td>358</td><td>Pay sahiplerinin şirkete borçlanma yasağı: vadesi gelmiş sermaye borcu ödenmedikçe ve kâr, serbest yedeklerle geçmiş yıl zararlarını karşılamadıkça borçlanamaz.</td></tr>
<tr><td>360</td><td>Esas sözleşmede öngörülerek pay gruplarına ve azlığa YK'da temsil hakkı tanınabilir.</td></tr>
<tr><td>391, 447</td><td>Sermayenin korunması ilkesini gözetmeyen YK ve GK kararları <b>batıl</b>dır.</td></tr>
<tr><td>141, 200, 438, 466/1</td><td>Hakların genişletilmesi: birleşmede ayrılma akçesi, bağlı şirketler hakkında bilgi alma, özel denetim, şarta bağlı sermaye artırımında koruma.</td></tr>
<tr><td>192, 202, 399/6, 537</td><td>Yeni dava hakları: birleşme/bölünme/tür değiştirmenin iptali, hakimiyetin hukuka aykırı kullanılması, denetçi atanmasını mahkemeden isteme, tasfiye memurlarının görevden alınması.</td></tr>
<tr><td>399</td><td><b>Denetçinin azli:</b> YK veya %10 (halka açıkta %5) pay sahipleri ister; dava seçimin TTSG'de ilanından itibaren <b>3 hafta</b> içinde; azlık genel kurulda karşı oy vermiş, tutanağa geçirtmiş ve en az <b>3 aydır</b> pay sahibi olmalı.</td></tr>
<tr><td>407</td><td>Pay sahipleri haklarını genel kurulda kullanır. <b>Murahhas üyeler ve en az bir YK üyesinin</b> genel kurulda hazır bulunması şarttır; denetçi de hazır bulunur.</td></tr>
<tr><td>408</td><td>Genel kurulun devredilemez görev ve yetkileri (denetçi seçimi ve görevden alınması vb.).</td></tr>
<tr><td>410, 411</td><td>YK toplanamıyorsa mahkeme izniyle <b>tek bir pay sahibi</b> genel kurulu çağırabilir (karar kesindir). 1/10 (halka açıkta 1/20) pay sahipleri gerekçe ve gündemle genel kurulu toplantıya çağırma veya gündeme madde koyma isteyebilir.</td></tr>
<tr><td>419</td><td>YK genel kurulun çalışma esaslarını içeren <b>iç yönerge</b> hazırlar, GK onayıyla yürürlüğe girer.</td></tr>
<tr><td>420</td><td>Finansal tabloların müzakeresi 1/10 (halka açıkta 1/20) istemiyle, GK kararına gerek olmadan <b>toplantı başkanının kararıyla bir ay</b> sonraya bırakılır.</td></tr>
<tr><td>421</td><td>Bilanço zararlarının kapatılması için yükümlülük/ikincil yükümlülük ve <b>şirket merkezinin yurt dışına taşınması</b> kararları sermayenin tamamının <b>oybirliğiyle</b> alınır.</td></tr>
<tr><td>425, 432</td><td>Temsil: pay sahibi olan veya olmayan temsilci; temsilcinin pay sahibi olmasını öngören esas sözleşme hükmü <b>geçersizdir</b>.</td></tr>
<tr><td>434</td><td>Oy, payların toplam itibari değeriyle orantılı; tek payı olanın da en az bir oyu vardır. Halka açık olmayanlarda birikimli oyu Ticaret Bakanlığı tebliğle düzenleyebilir.</td></tr>
<tr><td>436</td><td>Oydan yoksunluk: kendisi, eşi, alt-üstsoyu vb. ile şirket arasındaki kişisel işlerde oy kullanılamaz; YK üyeleri ve imza yetkilileri kendi ibralarında oy kullanamaz.</td></tr>
<tr><td>437</td><td><b>Bilgi alma ve inceleme:</b> finansal tablolar, faaliyet raporu, denetleme raporları ve kâr dağıtım önerisi GK'dan <b>en az 15 gün önce</b> incelemeye hazır tutulur. Esas sözleşme veya organ kararıyla <b>kaldırılamaz, sınırlandırılamaz</b>.</td></tr>
<tr><td>438, 439</td><td><b>Özel denetim:</b> her pay sahibi bilgi alma hakkını kullanmışsa GK'dan isteyebilir. GK reddederse 1/10 (halka açıkta 1/20) <b>veya itibari değeri en az 1 milyon TL</b> olan pay sahipleri <b>3 ay</b> içinde mahkemeden özel denetçi isteyebilir.</td></tr>
<tr><td>461</td><td>Rüçhan hakkı: yeni payları mevcut pay oranında alma hakkı.</td></tr>
<tr><td>479</td><td><b>Oyda imtiyaz:</b> bir paya en çok <mark>15 oy</mark> hakkı tanınabilir.</td></tr>
<tr><td>507</td><td>Kâr payı ve tasfiye payı hakkı: payı oranında.</td></tr>
<tr><td>531</td><td>Haklı sebeple fesih: 1/10 (halka açıkta 1/20) pay sahipleri mahkemeden isteyebilir.</td></tr>
<tr><td>559</td><td>Kuruluş ve sermaye artırımından doğan sorumluluklar tescilden itibaren <b>4 yıl</b> geçmedikçe sulh ve ibrayla kaldırılamaz; sonra da GK onayı gerekir ve 1/10 (halka açıkta 1/20) karşı çıkarsa onaylanmaz.</td></tr>
<tr><td>1527</td><td>Genel kurul ve YK toplantılarının elektronik ortamda yapılabilmesi.</td></tr>
</table>
<p><b>Tamamlayıcı bilgi (TTK 408/2):</b> genel kurulun devredilemez yetkileri arasında esas sözleşmenin değiştirilmesi, YK üyelerinin seçimi ve haklarının belirlenmesi, denetçinin seçimi, finansal tablolar ve kârın kullanımı, kanuni istisnalar dışında şirketin feshi ve <b>önemli miktarda şirket varlığının toptan satışı</b> yer alır. <b>Borca batıklık durumunda mahkemeye bildirim</b> ise yönetim kurulunun devredilemez görevidir (TTK 375).</p>

<h3>Kamuyu aydınlatma ve şeffaflık</h3>
<ul>
<li><b>397, 398:</b> finansal tablolar KGK'nın uluslararası standartlarla uyumlu <b>Türkiye Denetim Standartlarına</b> göre denetlenir; faaliyet raporundaki finansal bilgilerin tutarlılığı da denetim kapsamındadır.</li>
<li><b>514–516:</b> YK, finansal tabloları ve yıllık faaliyet raporunu bilanço gününü izleyen hesap döneminin <b>ilk üç ayı</b> içinde hazırlayıp genel kurula sunar. Tablolar Türkiye Muhasebe Standartlarına göre tam, anlaşılır, karşılaştırılabilir, şeffaf ve güvenilir çıkarılır.</li>
<li>Faaliyet raporu ayrıca: (a) faaliyet yılından sonraki özel önemli olaylar, (b) Ar-Ge çalışmaları, (c) YK üyeleri ve üst düzey yöneticilere ödenen ücret, prim, ikramiye, ödenek, yolculuk, konaklama, temsil giderleri, sigortalar vb. mali menfaatleri içerir.</li>
<li><b>1524:</b> denetime tabi sermaye şirketleri için internet sitesi zorunluluğu.</li>
</ul>

<h3>Menfaat sahipleri</h3>
<table class="t"><tr><th>Madde</th><th>Kural</th></tr>
<tr><td>202</td><td>Hakimiyetin hukuka aykırı kullanılması: kayıp o yıl denkleştirilmezse alacaklılar, şirket iflas etmemiş olsa bile zararın şirkete ödenmesini isteyebilir.</td></tr>
<tr><td>206</td><td>Tam hakimiyette talimatlarla oluşan kayıp denkleştirilmezse zarara uğrayan alacaklılar hakim şirkete ve sorumlu YK üyelerine dava açabilir.</td></tr>
<tr><td>209</td><td>Güvenden doğan sorumluluk: topluluk itibarının uyandırdığı güvenden hakim şirket sorumludur.</td></tr>

notlar:`
<h3>Yasal dayanak: SPKn madde 17</h3>
<ul>
<li>(1) KY ilkeleri, uyum raporları, uyum derecelendirmesi ve bağımsız YK üyeliği esaslarını <b>Kurul</b> belirler; haksız rekabete yol açmadan, eşit koşullara eşit kural.</li>
<li>(2) Kurul, ilkelere kısmen veya tamamen uymayı zorunlu tutabilir; süresinde uyulmazsa resen işlem yapabilir; <b>her türlü teminattan muaf</b> ihtiyati tedbir ve dava açabilir.</li>
<li>(3) <b>İlişkili taraf işlemleri:</b> işlemden önce YK kararı; uygulanması için <b>bağımsız üyelerin çoğunluğunun onayı</b>; onay yoksa KAP'ta duyuru ve genel kurul onayı. GK'da işlemin tarafları ve ilişkili kişiler oy kullanamaz, <b>toplantı nisabı aranmaz</b>, oy hakkı bulunanların <b>basit çoğunluğu</b> ile karar alınır; aykırı kararlar geçersizdir.</li>
<li>(4) Yükümlülükler MKK'nın elektronik ortamı ile de yerine getirilebilir. (5) Halka açık bankalar için BDDK'nın uygun görüşü alınır.</li>
</ul>
<p>Tebliğ <mark>03.01.2014 tarih ve 28871 sayılı Resmi Gazete</mark>'de yayımlandı. Üç temel bölüm: kurumsal yönetim ilkeleri, ilişkili taraf işlemleri, diğer hükümler.</p>

<h3>Kapsam ve gruplar</h3>
<ul>
<li>KY ilkeleri yalnız payları Borsa İstanbul'un <b>Yıldız Pazar, Ana Pazar ve Alt Pazar</b>'ında (eski adlarıyla Ulusal Pazar, İkinci Ulusal Pazar, Kurumsal Ürünler Pazarı) işlem gören halka açık ortaklıklara uygulanır; bu pazarlarda işlem görmek için başvuranlar da kapsamdadır.</li>
<li>32 sayılı Karara göre <b>dışarıda yerleşik</b> ortaklıklar kapsam dışıdır.</li>
<li>Fiili dolaşımı %5'in altına düştüğü için Piyasa Öncesi İşlem Platformuna alınanların yükümlülükleri aynen devam eder. Alt Pazar ortaklıkları İkinci Bölüm hükümleri ile md. 11'e (yatırımcı ilişkileri) tabidir.</li>
</ul>
<p><b>Gruplandırma ölçütü:</b> <mark>piyasa değeri</mark> ve <mark>fiili dolaşımdaki payların piyasa değeri</mark>. Mart, Haziran, Eylül ve Aralık aylarının son işlem günü kapanış fiyatları ve fiili dolaşım oranlarının ortalaması esas alınır. Hesaplama her yıl <b>Ocak</b> ayında Kurulca yapılır, liste Kurul Bülteninde ilan edilir. Farklı pay gruplarının tamamı dikkate alınır.</p>
<table class="t"><tr><th>Grup</th><th>Tebliğdeki tutar</th><th>16.01.2025 tarih 3/76 sayılı Kurul kararıyla uygulanan</th></tr>
<tr><td>Birinci</td><td>PD ort. &gt; 3 milyar TL ve FD PD ort. &gt; 750 milyon TL</td><td><mark>PD ort. &gt; 12 milyar TL ve FD PD ort. &gt; 3 milyar TL</mark></td></tr>
<tr><td>İkinci</td><td>PD ort. &gt; 1 milyar TL ve FD PD ort. &gt; 250 milyon TL</td><td><mark>PD ort. &gt; 6 milyar TL ve FD PD ort. &gt; 1,5 milyar TL</mark></td></tr>
<tr><td>Üçüncü</td><td colspan="2">Birinci ve ikinci grup dışındakiler</td></tr>
</table>
<ul>
<li>Üst gruba çıkan ortaklık, hesaplamanın ait olduğu yılı <b>takip eden yıldan itibaren</b> yeni gruba tabi olur; uyum, ilan sonrası <b>ilk genel kurul</b> tarihi itibarıyla sağlanır. Alt gruba düşmek tabi olunan ilkelerde değişiklik gerektirmez.</li>
<li>İlk kez halka arz için başvuranlar liste ilan edilene kadar <b>üçüncü grup</b> yükümlülüklerine tabidir; payların işlem görmesinden sonraki ilk genel kurulda uyum zorunlu.</li>
</ul>

<h3>Zorunlu ilkeler</h3>
<div class="key"><b>Tüm gruplar:</b> 1.3.1, 1.3.5, 1.3.6, 1.3.9 · 4.2.6 · 4.3.1–4.3.6, 4.3.7 (üçüncü fıkra hariç), 4.3.8 (ikinci fıkra hariç) · 4.5.1–4.5.4, 4.5.9–4.5.13 · 4.6.2, 4.6.3.<br><b>Birinci grup ek olarak:</b> 4.3.7'nin üçüncü fıkrası ve 4.3.8'in ikinci fıkrası.<br>Adaylar Ek'teki ilkelerle birlikte Tebliğin tamamından sorumludur.</div>

<h3>İstisnalar</h3>
<ol type="a">
<li><b>Bağımsız üye sayısı (4.3.4):</b> üçüncü grupta, Kurul uygun görürse, sermayesinin en az %51'i birbirinden bağımsız iki kişi arasında eşit paylaşılan ve yönetim kontrolünü sözleşmeyle eşit paylaşan (bankalar hariç) iş ortaklıklarında uygulanmaz; <b>iki bağımsız üye yeterlidir</b>.</li>
<li><b>Kamu lisansı/imtiyazı olan veya kamunun imtiyazlı pay sahibi olduğu ortaklıklar:</b> Kurul uygun görürse 4.3.6'nın (ç) kamuda tam zamanlı çalışmama ve (g) son 10 yılda 6 yıldan fazla üyelik yapmamış olma kriterleri aranmaz; 4.3.7 (60 gün önce Kurul görüşü) uygulanmaz.</li>
<li><b>Bankalar:</b> bağımsız üye sayısı <b>üçten az olmamak</b> kaydıyla bankanın ihtiyarındadır. Denetim komitesi üyeleri bağımsız üye kabul edilir, 4.3.6 nitelikleri aranmaz, 4.3.7 ve 4.3.8 uygulanmaz. Denetim komitesinde olmayan bağımsızlarda (tamamı komitedeyse en az birinde) kriterler aranır.</li>
<li><b>Yatırım ortaklıkları:</b> 1.3.9 işlemleri bağımsızların çoğunluğu onaylamasa da GK onayı olmadan yapılabilir; muhalefet gerekçesi KAP'ta açıklanır ve ilk GK'da bilgi verilir.</li>
<li><b>Haklı gerekçe:</b> Kurul uygun görüşüyle <b>azami bir yıl</b>, kriterleri sağlamayan kişi bağımsız üye seçilebilir; uyulmayan kriter gerekçesiyle KAP'ta açıklanır.</li>
</ol>

<h3>Aykırılık halinde tedbirler</h3>
<p>Kurul uyum için gerekli kararları alıp resen işlem yapabilir; teminattan muaf ihtiyati tedbir ve dava açabilir (talebe uyum önerisi eklenir). Yeterli üye olmasına rağmen YK veya GK gereğini yapmazsa Kurul <b>30 gün süre</b> verir; yapılmazsa gerekli sayıda bağımsız üyeyi <b>resen atar</b>. Yeni YK, Kurul uygun görüşüyle esas sözleşmeyi değiştirip tescil ettirir.</p>

<h3>Uyum raporları</h3>
<ul>
<li>Zorunlu olmayan ilkeler için <b>"uygula, uygulamıyorsan açıkla"</b>. Faaliyet raporunda: uygulanıp uygulanmadığı, gerekçe, uymamaktan doğan çıkar çatışmaları, gelecekte değişiklik planı.</li>
<li>10.01.2019 tarih 2/49 sayılı karar: KAP'ta iki şablon. <b>URF</b> (Kurumsal Yönetim Uyum Raporu) gönüllü ilkelere uyumu; <b>KYBF</b> (Kurumsal Yönetim Bilgi Formu) mevcut uygulamaları raporlar. Faaliyet raporunda ayrıca anlatı formatında KY bölümü ve uyum beyanı bulunur.</li>
<li>URF yanıtları: <b>Evet</b> (eksiksiz uyum), <b>Kısmen</b>, <b>Hayır</b>, <b>İlgisiz</b> (şartı gerçekleşmemiş, örn. kâr dağıtılmışsa 1.6.3), <b>Muaf</b> (istisna kapsamında). Kısmen veya Hayır ise açıklama <b>zorunlu</b>.</li>
<li>Holdingler yalnız kendi tüzel kişilik verileriyle doldurur. Şablonlar Türkçe ve İngilizce hazırlanmış olup Türkçe raporlama zorunludur.</li>
<li>Süre: finansal raporların bildirim süresi içinde ve her halükarda <mark>genel kuruldan en az üç hafta önce</mark> KAP'ta. Faaliyet raporunda yer verilmezse KAP adresleri belirtilir. Dönem içi değişiklikler KAP güncelleme şablonlarıyla açıklanır.</li>
<li><b>Sürdürülebilirlik:</b> 02.10.2020 tarih 31262 sayılı RG değişikliği; uygulama <b>gönüllü</b>, uyum çerçevesine göre açıklama. 23.06.2022 tarih 34/977 sayılı kararla sürdürülebilirlik uyum raporu da GK'dan en az 3 hafta önce KAP'ta.</li>
</ul>
<p><b>Yeşil / Sürdürülebilir Borçlanma Aracı ve Kira Sertifikası Rehberi</b> (24.02.2022, 10/296; i-SPK 128.18): proje seçimi, fonun kullanımı, fonun yönetimi ve raporlama. Fon münhasıran yeşil projelere; çerçeve belgesi için <b>ikinci taraf görüşü</b>; ihraçtan itibaren <b>yılda bir</b> ve fon tamamen kullanıldıktan sonra fon kullanım ve etki raporu; fon kullanım raporuna doğrulama görüşü. Mavi borçlanma araçları, VDMK/İTMK, gayrimenkul sertifikası da şartları taşırsa yeşil/sürdürülebilir temalı sayılabilir.</p>

<h3>İlişkili taraf işlemleri</h3>
<p>Kapsam: payları Borsada işlem gören ortaklıklar ve bağlı ortaklıkları. Tanımlar TMS'ye göre. <b>Yaygın ve süreklilik arz eden işlem:</b> bir hesap döneminde <b>en az iki defa</b> yapılan aynı nitelikteki işlem.</p>
<table class="t"><tr><th></th><th>Yaygın ve süreklilik arz ETMEYEN</th><th>Yaygın ve süreklilik arz EDEN</th></tr>
<tr><td>Her durumda</td><td>İşlemden önce esasları belirleyen YK kararı</td><td>Kapsam ve şartlar için YK kararı; önemli değişiklikte yeniden karar</td></tr>
<tr><td>Oran tabanı</td><td>Varlık toplamı, son yıllık hasılat veya 6 aylık ortalama fiyattan şirket değeri</td><td>Alışta satışların maliyeti; satışta hasılat</td></tr>
<tr><td>Eşik 1</td><td><mark>%5'ten fazla</mark> → Kurulca belirlenen kuruluşa <b>değerleme</b> (pay Borsada devredilirse aranmaz)</td><td><mark>%10'dan fazla</mark> → YK <b>raporu</b>; tamamı veya sonucu KAP'ta</td></tr>
<tr><td>Eşik 2</td><td><mark>%10'dan fazla</mark> → ayrıca <b>bağımsız üyelerin çoğunluğu onayı</b>; ilişkili YK üyeleri oy kullanamaz; onay yoksa KAP + GK onayı (nisap aranmaz, basit çoğunluk)</td><td>Bağımsızların çoğunluğu onaylamazsa muhalefet gerekçesi KAP'ta</td></tr>
<tr><td>İstisna</td><td>Yatırım ortaklıklarının ilişkili taraftan aldığı portföy yönetimi, yatırım danışmanlığı, aracılık; banka ve finansal kuruluşların olağan faaliyetleri</td><td>Temettü, rüçhan hakkı, yönetici mali hakları; MKYO, GYO, GSYO'ların portföy yönetimi vb. hizmetleri; banka ve finansal kuruluşların olağan faaliyetleri</td></tr>
</table>
<ul>
<li>Hasılatın %5'i, toplam özkaynakların <b>binde birinden</b> düşükse hasılat oranı uygulanmaz. Bankalarda hasılat = ana faaliyet faiz geliri. Kiralamada NBD esas alınır. Anlamsız oran dikkate alınmaz ve KAP'ta açıklanır.</li>
<li>KAP açıklaması: tarafların ilişkisi, işlemin niteliği, değerleme varsayımları ve sonuçlarının özeti, değerleme sonucuna uyulmadıysa gerekçesi.</li>
<li>Kurul, oranlara bağlı kalmaksızın ilişkili veya ilişkili olmayan taraf işlemlerinde değerleme isteyebilir.</li>
<li>Rapor asgari içeriği: taraf şirketlerin bilgisi, ilişkinin niteliği, sözleşmenin tarihi ve önemli unsurları, piyasa koşullarına uygunluk kriterleri ve değerlendirmesi.</li>
</ul>
<div class="key"><b>Karıştırma:</b> İlke 1.3.9 ilişkili taraf şartı aramadan önemli varlık/hizmet alım-satımlarında <b>%10</b> eşiğinde ve bir faaliyetin durdurulmasında bağımsızların çoğunluğu onayını arar; oybirliği yoksa imzalı karar ve muhalefet şerhi KAP'ta. Burada hasılatın %10'u özkaynakların <b>binde ikisinden</b> düşükse hasılat oranı uygulanmaz.</div>

<h3>Yatırımcı ilişkileri bölümü</h3>
<ul>
<li>Yıldız, Ana ve Alt Pazar ortaklıklarında <b>zorunlu</b>. Genel müdür, genel müdür yardımcısı veya muadil yöneticiye <b>doğrudan bağlı</b>.</li>
<li>Faaliyetleriyle ilgili <b>yılda en az bir</b> kez YK'ya rapor.</li>
<li>Yönetici ve en az bir çalışanın adı ve iletişim bilgileri KAP'ta.</li>
<li>Yönetici <b>SPF Düzey 3 ve Kurumsal Yönetim Derecelendirme Lisansı</b>'na sahip; tam zamanlı (MKYO hariç); <b>kurumsal yönetim komitesi üyesi</b>. Ayrılırsa <b>30 gün</b> içinde yenisi.</li>
<li>Üçüncü grup istisnası: Düzey 3 veya KYD lisansından <b>herhangi biri</b> ya da sadece <b>Düzey 2</b> yeterli. Görev kamuya açıklanarak birden çok birimce yürütülebilir; en çok görevi üstlenen yönetici bölüm yöneticisi sayılır.</li>
<li>27.02.2015, 5/225: aynı kişi grup şirketleri içinde <b>ikinci gruptaki en fazla beş</b> şirkette veya grup şartı aranmaksızın <b>üçüncü gruptaki en fazla beş</b> şirkette yönetici olabilir.</li>
<li>Görevler: yazışma ve kayıtları tutmak; yazılı bilgi taleplerini yanıtlamak; genel kurul dokümanları ve usulüne uygunluk; KY ve kamuyu aydınlatma dahil SP mevzuatı yükümlülüklerini gözetmek.</li>
<li>Halka arz edenler bu yükümlülükleri işlem görmeye başlamadan itibaren <b>altı ay</b> içinde yerine getirir.</li>
</ul>

<h3>Teminat, rehin, ipotek ve kefalet (TRİK)</h3>
<ul>
<li>Verilebilecek TRİK: <b>kendi tüzel kişiliği</b> lehine; <b>tam konsolidasyona dahil</b> ortaklıklar lehine; <b>olağan ticari faaliyet</b> için üçüncü kişiler lehine. Doğrudan katılınan iştirak ve iş ortaklıkları lehine <b>sermaye payı oranında</b>.</li>
<li>27.01.2016, 3/73: fon temin eden grup şirketi lehine aktarılan fonla sınırlı TRİK ve halka kapalı bağlı ortaklığın halka açık ana ortaklık lehine TRİK'i yasağa aykırı değildir.</li>
<li>Olağan ticari faaliyet için üçüncü kişi lehine TRİK kararlarında <b>bağımsızların çoğunluğu onayı</b>; ilişkili YK üyeleri oy kullanamaz; onay yoksa muhalefet gerekçesi KAP'ta.</li>
<li>Üçüncü kişiler lehine TRİK ve elde edilen gelirler olağan GK gündeminde <b>ayrı madde</b>.</li>
<li>Halka arz edenler aykırı TRİK'leri işlem görmeye başlanan yılı takip eden <b>dördüncü yılın sonuna</b> kadar sıfırlar.</li>
<li>Yatırım ortaklıkları, bankalar ve finansal kuruluşlara 12. madde uygulanmaz.</li>
</ul>

id:6,
kisa:"Derecelendirme Tebliği",
baslik:"Sermaye Piyasasında Derecelendirme Faaliyeti ve Derecelendirme Kuruluşlarına İlişkin Esaslar Tebliği (Seri: VIII, No: 51)",
ozet:"SPKn'deki dayanak, Tebliğ'in yapısı, kredi ve KY uyum derecelendirmesi, kuruluş ve personel şartları, kamuya açıklama, sorumluluk ve ağırlıklar.",
notlar:`
<h3>Yasal dayanak</h3>
<ul>
<li>6362 sayılı SPKn <b>md. 35</b>: derecelendirme kuruluşları sermaye piyasası kurumlarındandır. Derecelendirme ancak SPKn ve Kurul düzenlemeleri çerçevesinde yapılır.</li>
<li>Özel hükümler SPKn Altıncı Bölüm "Bağımsız Denetim, Derecelendirme ve Değerleme Kuruluşları": <b>md. 62 Faaliyet Esasları</b>, <b>md. 63 Sorumluluk</b>.</li>
<li><b>md. 128:</b> Kurul derecelendirme şartlarını belirler ve şartları taşıyanları listeler halinde ilan eder.</li>
<li>Kurul; güvenli ve bağımsız faaliyet, kalite güvence sistemleri ve uluslararası standartlara uyum için düzenleme, gözetim ve denetim yapar; kuruluşları yetkilendirir, personeli lisanslar.</li>
</ul>
<p>Tebliğ: <mark>12/7/2007 tarih ve 26580 sayılı Resmi Gazete</mark>, Seri: VIII, No: 51. (Önceki düzenleme 2003 tarihli mülga Seri: VIII, No: 40.)</p>

<h3>Tebliğin yapısı</h3>
<table class="t"><tr><th>Bölüm</th><th>Maddeler</th></tr>
<tr><td>1. Amaç, Kapsam, Dayanak, Tanımlar</td><td>1–3</td></tr>
<tr><td>2. Faaliyetin kapsamı ve kuruluşlar</td><td>4 kapsam · 5 kredi derecelendirmesi · 6 KY ilkelerine uyum derecelendirmesi · 7 faaliyette bulunabilecek kuruluşlar · 8 Kurulca kabul edilen uluslararası kuruluşlar</td></tr>
<tr><td>3. Yetkilendirme ve listeye alma</td><td>9 başvuru koşulları · 10 ortak, yönetici, kontrolör, çalışanlar · 11 Kurul incelemesi ve yetkilendirme</td></tr>
<tr><td>4. Sözleşmeler</td><td>12 derecelendirme sözleşmesi · 13 bilgi paylaşımı sözleşmesi</td></tr>
<tr><td>5. İlke ve esaslar</td><td>14 genel · 15 faaliyet ilkeleri · 16 not · 17 izleme ve güncelleme · <b>18 tarafsızlık</b> · <b>19 bağımsızlık ve çıkar çatışması</b> · <b>20 bağımsızlığın ortadan kalkması</b> · 21 kamuya açıklama ve şeffaflık · 22 gizlilik · 23 ahlaki davranış kuralları · <b>24 reklam yasağı</b></td></tr>
<tr><td>6. Diğer hükümler</td><td>25 finansal tablo ve bağımsız denetim · 26 Kurula bildirim · 27 sorumluluk · 28 gözetim ve denetim · 29 idari para cezası ve listeden çıkarma · 30–32</td></tr>
</table>

<h3>İki faaliyet: tanım ve fark</h3>
<table class="t"><tr><th></th><th>Kredi derecelendirmesi</th><th>KY ilkelerine uyum derecelendirmesi</th></tr>
<tr><td>Tanım</td><td>İşletmelerin risk durumu ve ödeyebilirliği ya da borçluluğu temsil eden araçların anapara, faiz vb. yükümlülüklerinin vadelerinde karşılanabilirliğinin bağımsız, tarafsız ve adil değerlendirilip sınıflandırılması</td><td>İşletmelerin <b>Kurulca yayımlanan</b> KY İlkelerine uyumunun bağımsız, tarafsız ve adil değerlendirilip sınıflandırılması</td></tr>
<tr><td>Zaman yönü</td><td><b>Geleceğe dönük</b> görüş</td><td>Yoğunlukla <b>geçmiş verilere</b> bakarak</td></tr>
</table>
<ul>
<li>Uluslararası genel kabul görmüş tek bir KY ilkeler seti yoktur (UFRS gibi). Bu yüzden mevzuatta "kurumsal yönetim derecelendirmesi" değil <b>"kurumsal yönetim ilkelerine uyum derecelendirmesi"</b> ifadesi kullanılır.</li>
<li>Kuruluşlar iki faaliyet için Kurulca <b>ayrı ayrı yetkilendirilir</b>.</li>
<li>Metodoloji serbesttir (tüm ilkeleri kapsamak şartıyla), Kurul yalnız sistematik olup olmadığını kontrol eder.</li>
<li>Kurulca zorunlu tutulmadıkça KY uyum derecelendirmesi <b>ihtiyaridir</b>.</li>
</ul>

<h3>Talebe bağlı ve talebe bağlı olmayan derecelendirme</h3>
<table class="t"><tr><th>Talebe bağlı olmayan</th><th>Talebe bağlı</th></tr>
<tr><td>
<ul>
<li>Kamuya açıklamadan önce işletmeye bilgi verilir; işletmenin değerlendirmeleri titizlikle dikkate alınır.</li>
<li>Birbirini izleyen <mark>3 hesap dönemi</mark> devam edilir.</li>
<li>Not <mark>en fazla 6 aylık</mark> dönemlerle gözden geçirilip açıklanır.</li>
<li>Sağlanan veya öngörülen ücret ve menfaatler notla birlikte açıklanır.</li>
</ul></td>
<td><ul><li>Derecelendirme kuruluşu ile müşteri sözleşme imzalar; sözleşme <b>Kurula gönderilir</b>.</li></ul></td></tr>
</table>

<h3>Kuruluşlar ve personel</h3>
<ul>
<li>KY uyum derecelendirmesini Türkiye'de kurulmuş ve Kurulca yetkilendirilmiş kuruluşlar ve/veya Kurulca tanınmış uluslararası kuruluşlar yapabilir.</li>
<li>Uluslararası kuruluşlar Türkiye'de yerleşik gerçek veya tüzel kişi <b>temsilci</b> atar. Tüzel kişi temsilci <b>bilgi toplama dışında</b> derecelendirme faaliyetinde bulunamaz.</li>
<li>Bağlı ortaklık, iştirak veya bilgi paylaşımı sözleşmesiyle çalışmak isteyenler yetkilendirilirse Tebliğe tabi olur.</li>
<li>Yeterli organizasyon, mekan, teknik donanım, belge ve kayıt düzeni.</li>
<li>Her çalışmada <mark>en az 2 derecelendirme uzmanı</mark> ve <mark>en az 3 komite üyesi</mark>. Not uzmanların çalışması komiteye sunularak oluşur.</li>
<li><b>Uzman:</b> 4 yıllık lisans; sayılan alanlarda uzman, öğretim görevlisi/üyesi veya yönetici olarak <b>en az 3 yıl</b> deneyim; KY derecelendirme lisansı. <b>Komite üyesi:</b> aynı şartlar ve <b>en az 5 yıl</b> deneyim.</li>
<li>Komite şartlarını taşıyan uzman, uzman olmadığı çalışmada komite üyesi olabilir; komite üyesi de üye olmadığı çalışmada uzman olabilir.</li>
<li>Sistematik metodoloji, yazılı <b>iç kontrol sistemi</b> ve <b>ahlaki davranış kuralları yönergesi</b>. Bunların uygulanmasını denetlemek için bir <b>kontrolör</b> görevlendirilir.</li>
<li>Uluslararası kuruluşla bilgi paylaşımı sözleşmesi örneği Kurula gönderilir; o kuruluşun <b>metodolojisine uyulur ve aynı semboller kullanılır</b>.</li>
<li><b>Mesleki sorumluluk sigortası</b> zorunludur.</li>
</ul>

<h3>Faaliyet esasları</h3>
<ul>
<li>Açıklanan metodolojiye uygun, tüm bilgilerle çalışma; yazılı rehber; belge ve kayıt düzeni; devamlılık ve tarafsızlığı sağlayan ekip; yeterli kaynak; Kurul muhasebe standartlarına göre hazırlanmış ve <b>bağımsız denetimden geçmiş</b> finansal bilgiler.</li>
<li>Not uzman tarafından değil, <b>derecelendirme komitesi</b> tarafından belirlenir.</li>
<li>Not kamuya açıklandıktan sonra da koşullar oluşursa güncellenir, düzenli aralıklarla gözden geçirilir (sıklık Tebliğde belirtilmemiştir).</li>
<li>Notun açıklanmasından kaçınmak amacıyla <b>çalışmaya son verilemez</b>.</li>
<li>Kurulun, kuruluşun, müşterinin veya ilgili tarafların bağımsızlığın zedelendiğine dair <b>tereddüdü oluşursa bağımsızlık ortadan kalkmış kabul edilir</b>; Kurula ivedilikle bilgi verilir.</li>
</ul>

<h3>Kamuya açıklama ve diğer yükümlülükler</h3>
<ul>
<li>Notlar, güncelleme zamanı ve değişiklikler kamuya <b>ücretsiz</b> açıklanır; metodoloji, süreç ve varsayımlar da açıklanır (her not grubunun ne ifade ettiği dahil).</li>
<li>Not veya değişikliği açıklamadan önce <b>müşteri bilgilendirilir</b>.</li>
<li>Önemli işlem, süreç, metodoloji ve uygulama değişiklikleri <b>uygulamaya konmadan önce</b> kamuya açıklanır.</li>
<li>Resmi <b>internet sitesi</b> kurmak zorunlu.</li>
<li>Gizlilik ve sır saklama yükümlülüğü; dolaylı veya dolaysız <b>reklam yasağı</b>, iş önerilemez.</li>
<li>Mevzuata aykırılıktan doğan zararlardan kuruluş, ilgili uzmanlar ve komite üyeleri <b>müteselsilen</b> sorumludur.</li>
<li>Kurulun gözetim ve denetimine tabi; raporlar ve çalışma belgeleri <mark>en az 10 yıl</mark> saklanır.</li>
</ul>

kisa:"Uyum Derecelendirmesi",
baslik:"Kurumsal Yönetim İlkelerine Uyum Derecelendirmesi",
ozet:"Derecelendirme süreci, metodoloji ve alt başlıklar, notların hesaplanması, BIST Kurumsal Yönetim ve Sürdürülebilirlik endeksleri.",
notlar:`
<p>KY İlkeleri ilk olarak <mark>04.07.2003</mark>'te Kurulca onaylanıp duyuruldu; başta zorunlu değildi. Teşvik için: uyum raporu formatları ve zorunluluğu, ilkelerin bir kısmının zorunlu hale getirilmesi, uyum derecelendirmesi, Borsada KY endeksi; son dönemde sürdürülebilirlik endeksi.</p>

<h3>Derecelendirme süreci</h3>
<h4>1. Sürecin başlaması</h4>
<ul>
<li>Şirket yönetiminin talebi derecelendirme kuruluşuna ulaşır; kuruluş YK'sının kabul ettiği <b>"Etik İlke ve Kurallar Yönetmeliği"</b> çerçevesinde değerlendirilir.</li>
<li>Hukuken süreç, kuruluşça <b>iki nüsha</b> düzenlenen hizmet sözleşmesi ve eklerinin imzalanmasıyla başlar.</li>
<li><b>Mali mesuliyet sigorta poliçesi:</b> sözleşme tutarının <mark>iki katından az olmamak</mark> üzere; sözleşmenin ayrılmaz parçası; poliçesiz sözleşme <b>hükümsüz</b>.</li>
<li>Kuruluş sözleşme, ekler ve poliçe suretini <mark>6 iş günü</mark> içinde Kurula yazılı bildirir. Şirketin SP araçları işlem görüyorsa şirket KAP açıklaması yapar.</li>
<li>Uzman ve analist ataması <b>Derecelendirmeden Sorumlu Genel Müdür Yardımcısı</b>nın görüşüyle yapılır. Görevli uzman ve analistler sözleşme ve <b>ücret görüşmelerine katılamaz</b>.</li>
<li>İlk toplantı: süreçlerin, metodolojinin, notların ve hak-yükümlülüklerin tanıtılması.</li>
</ul>
<h4>2. İnceleme süreci</h4>
<ul>
<li>(a) Özel şifreyle girilen internet sitesindeki <b>soru seti</b> ve belge talebi; alışveriş elektronik ortamda (altyapı yoksa yazılı). Gerekirse şirket ziyareti; kuruluş veri tabanı ve şirket sitesi de kullanılır. Bilgiler zamanında verilmezse fesih şartları sözleşmede yer alır.</li>
<li>(b) Analiz, kuruluşa özel derecelendirme programıyla yapılır; ardından yönetici ve ortaklarla toplantılar (due diligence); konularda mutabakat.</li>
<li>(c) Uzman raporunu <b>Kurumsal Yönetim Uyum Derecelendirme Komitesi</b>ne sunar. Komite <mark>asgari üç kişi</mark>; gerekirse Danışma Kurulu görüşü alınır. <b>Nihai karar uzmanın önerisiyle komite</b> tarafından verilir; imzalanıp karar defterine işlenir.</li>
</ul>
<h4>3. Notun açıklanması</h4>
<ul>
<li>Şirketin SP araçları <b>Borsada işlem görüyorsa</b>: notun oluştuğu günü takip eden ilk iş günü <mark>sabah 09.00'a kadar</mark> düzenleyici kuruluşlara, kamuoyuna ve şirkete <b>eş zamanlı</b>; şirket de eş zamanlı KAP açıklaması yapar.</li>
<li>Borsada işlem gören aracı <b>yoksa</b>: en geç oluştuğu günü izleyen ilk iş günü düzenleyicilere ve şirkete eş zamanlı, ardından kamuoyuna.</li>
<li>Sözleşme not oluşmadan sona ererse durum gerekçesiyle <b>aynı gün</b> bildirilir ve duyurulur.</li>
</ul>
<h4>4. İzleme ve güncelleme</h4>
<p>Not <mark>bir yıl</mark> geçerlidir; yıl sonunda güncellenmelidir. Bu sürede uzman ve analist şirketi takip eder.</p>

<h3>Metodoloji</h3>
<ul>
<li>İki ana kategori: <b>halka açık şirketler</b> ve <b>diğerleri</b>. Her birinde reel sektör, bankalar, banka dışı finansal kuruluşlar ve sigorta şirketleri için ayrı metodoloji. Notun yanında kısaltma: <b>BNK</b> (banka), <b>PRIV</b> (halka kapalı).</li>
<li>Ana başlık ağırlıkları Kurulca belirlenmiştir: <b>Pay Sahipleri %25 · Kamuyu Aydınlatma %25 · Menfaat Sahipleri %15 · Yönetim Kurulu %35</b>. Alt başlık ağırlıkları şirketlerin (derecelendirme kuruluşlarının) iradesindedir.</li>
<li>Temel SPK İlkeleridir; ilkeler değiştikçe güncellenir. Kuruluşlar önemli buldukları veya uluslararası konuları ekleyebilir. Metodoloji ve güncellemeler Kurula bildirilir; subjektif değil objektif kriterler esas alınır.</li>
</ul>
<table class="t"><tr><th>Ana başlık</th><th>Alt başlıklar ve dikkat edilen noktalar</th></tr>
<tr><td>Pay Sahipleri</td><td>1. Pay sahipliği haklarının kullanımının kolaylaştırılması (YİB'in varlığı, yılda en az bir rapor, yöneticinin nitelikleri) · 2. Bilgi alma ve inceleme (bilgilendirme politikası, özel denetimi zorlaştırıcı uygulama) · 3. Genel kurul (ilan en az 3 hafta önce; derecelendirme temsilcileri GK'ya katılıp gözlem yapar) · 4. Oy hakkı (imtiyazlar) · 5. Azlık hakları (1/20'den düşük orana tanınması iyi uygulama) · 6. Kâr payı hakkı (politika, öneri içeriği, geçmiş dağıtım oranları) · 7. Payların devri (kısıtlayıcı hüküm olumsuz)</td></tr>
<tr><td>Kamuyu Aydınlatma ve Şeffaflık</td><td>1. Kurumsal internet sitesi (%5'ten yüksek paya sahip gerçek kişilerin gösterilmesi, güncellik) · 2. Faaliyet raporu (uygula-açıkla beyanı); ayrıca alınan cezalar</td></tr>
<tr><td>Menfaat Sahipleri</td><td>1. Şirket politikası (tazminat politikası, ihbar mekanizması) · 2. Yönetime katılım modelleri · 3. İK politikası (genel ortalamanın üzerinde dava olumsuz, <b>sendika varlığı olumlu</b>) · 4. Müşteri ve tedarikçilerle ilişkiler · 5. Etik kurallar ve sosyal sorumluluk (yolsuzlukla mücadele, çevre)</td></tr>
<tr><td>Yönetim Kurulu</td><td>1. İşlevi · 2. Faaliyet esasları (risk ve iç kontrol yılda en az bir gözden geçirme; başkan-GM aynı kişiyse KAP; %25 sigorta) · 3. Yapısı (<b>en az 5 üye yeterli</b>; çoğunluk icracı olmayan; bağımsızlar 1/3, en az 2; kadın üye hedefi %25) · 4. Toplantılar · 5. Komiteler (en az 2 üye; denetim komitesinin tamamı, diğerlerinin başkanları bağımsız; GM görev almaz) · 6. Mali haklar (kişi bazında açıklama; bağımsızlara performans ödemesi yok; borç verme yasağı; hediye kabulü olumsuz)</td></tr>
</table>

<h3>Notlar ve hesaplama</h3>
<ul>
<li>Beş not: <b>genel uyum notu</b> ve <b>dört ana bölüm notu</b>.</li>
<li>Genel not = Pay Sahipleri × <b>0,25</b> + Kamuyu Aydınlatma × <b>0,25</b> + Menfaat Sahipleri × <b>0,15</b> + Yönetim Kurulu × <b>0,35</b>.</li>
<li>Notlar <mark>1 ile 10 arasında</mark>, virgülden sonra <b>iki hane</b>, tam sayıya <b>yuvarlanmadan</b> verilir. Dört ana bölümde yaklaşık <b>100</b> kural ve uygulama değerlendirilir; bu yüzden rapor da okunmalıdır.</li>
<li>Kuruluş, gerekçeleri içeren raporu kamuya açıklar. <b>Halka açık şirkette zorunlu</b>; halka açık olmayanda şirket isterse.</li>
</ul>
<table class="t"><tr><th colspan="3">Örnek: Coca-Cola İçecek A.Ş. (SAHA, 3 Temmuz 2017, not 9,45 teyit)</th></tr>
<tr><th>Ana başlık</th><th>Ağırlık</th><th>Not</th></tr>
<tr><td>Pay sahipleri</td><td>%25</td><td>88,36</td></tr>
<tr><td>Kamuyu aydınlatma ve şeffaflık</td><td>%25</td><td>98,55</td></tr>
<tr><td>Menfaat sahipleri</td><td>%15</td><td>99,48</td></tr>
<tr><td>Yönetim kurulu</td><td>%35</td><td>93,92</td></tr>
<tr><td><b>Toplam</b></td><td>%100</td><td><b>94,52</b></td></tr>
</table>

<h3>BIST Kurumsal Yönetim Endeksi</h3>
<ul>
<li>Temel kurallar 2005'te belirlendi. Amaç: KY uyum notu yüksek şirketlerin fiyat ve getiri performansını ölçmek. Faaliyet ilk kez mülga Seri: VIII, No: 40 (2003) ile tanımlandı; 1–10 arası, iki haneli ve tama iblağ edilmeyen not esası VIII-51'de (2007) korundu.</li>
<li>Hesaplama <mark>31.08.2007</mark>'de başladı; başlangıç değeri <mark>480,8217</mark>.</li>
<li>Kriterler: Yıldız, Ana veya Alt Pazar'da işlem görmek; KY notu <b>10 üzerinden en az 8</b>, her ana başlık <b>en az 7</b>; not <b>talep üzerine</b> verilmiş ve <b>yıllık yenilenmiş</b>; birden fazla not varsa <b>en son alınan</b>.</li>
<li>Not KAP'ta yayımlandığı günü takip eden iş günü endekse alınır. KAP'ta yarım günlerde 12:00'den, diğer günlerde <b>16:30'dan sonra</b> yayımlanan bildirim bir sonraki iş günü yayımlanmış sayılır.</li>
<li>Çıkarılma (ilgili bildirimin KAP'ta yayımlandığı gün): yeni notun asgariden düşük olması, sözleşmenin sona ermesi, kuruluşun listeden çıkarılması, bağımsızlığının ortadan kalkması. Not 1 yıl içinde yenilenmez veya sözleşme yenileme bildirimi süre bitimine kadar yapılmazsa takip eden iş günü çıkarılır.</li>
<li>Not geçerliyken sözleşme sona ererse KAP duyurusuyla, notun geçerlilik süresini aşmamak üzere <b>üç aya kadar</b> süre verilir.</li>
<li>Endeksteki şirketi endeks dışı bir şirket devralırsa, payların dağıtımına başlandığı gün endeksten çıkarılır.</li>
</ul>

<h3>Sürdürülebilirlik endeksleri</h3>
<ul>
<li>İlk küresel endeksler: <b>Dow Jones (1999)</b> ve <b>FTSE (2001)</b>. Gelişmekte olanlarda öncü: Güney Afrika (2004), Brezilya (2005); 2008'den itibaren Çin, Endonezya, Hindistan, Hong Kong, Kore, Meksika, Mısır.</li>
<li><b>Kurumsal sürdürülebilirlik:</b> uzun vadeli değer için ekonomik, çevresel ve sosyal faktörlerin KY ilkeleriyle birlikte faaliyet ve karar mekanizmalarına uyarlanması ve risklerin yönetilmesi.</li>
<li><b>BIST Sürdürülebilirlik Endeksi</b> <mark>4 Kasım 2014</mark>'ten beri hesaplanıyor. 2021 değerlemelerinden itibaren <b>Refinitiv</b> notları; yalnız kamuya açık bilgiler; maliyeti Borsa İstanbul karşılar; Yıldız, Ana ve Alt Pazar'dan gönüllü şirketler.</li>
</ul>
<table class="t"><tr><th>Endeks</th><th>Genel not</th><th>Her ana başlık</th><th>Kategori notları</th><th>Ek şart</th></tr>
<tr><td>BIST Sürdürülebilirlik</td><td>≥ 50</td><td>≥ 40</td><td>en az 8'i ≥ 26</td><td>–</td></tr>
<tr><td>BIST Sürdürülebilirlik 25 (21 Kasım 2022)</td><td>≥ 70</td><td>≥ 60</td><td>en az 8'i ≥ 50</td><td>İşlem hacmi ve piyasa değeri en yüksek 25 pay</td></tr>
</table>
<p>Beklenen katkılar: rekabet avantajı, yeni yatırım ürünleri (fon, BYF, yapılandırılmış ürün), uygun finansman, yerel ve küresel karşılaştırma, şeffaflık ve itibar artışı, sorumlu yatırım fonlarının teşviki.</p>
