 2,20 TL; 1,18 → 2,36 TL; vade sonu 1,95 → son kupon 3,90 TL ve anapara 195 TL.<\/li>\n<li>Gecikmeli endeksleme, enflasyon düşerken yatırımcı lehine, yükselirken aleyhine çalışabilir.<\/li>\n<\/ul>\n<h3>DİBS ihraç yöntemleri<\/h3>\n<ol>\n<li><b>İhale:<\/b> duyuruyla başlar; teklifler <b>TCMB<\/b>'ye verilir (bankalar, aracı kurumlar, özel finans kurumları, bireyler). Teklifler yüksek fiyattan düşüğe (düşük faizden yükseğe) sıralanır, liste TCMB'ce Hazine'ye gönderilir. <b>Çoklu fiyat:<\/b> herkes kendi teklif fiyatından alır. <b>Tek fiyat:<\/b> kazananların hepsi Hazine'nin belirlediği (kazanan en düşük teklif) fiyattan alır, getirileri aynıdır. İhaleyle bono ve tahvil iskontolu ve kuponlu satılabilir. <b>Rekabetçi olmayan teklif (ROT)<\/b> yalnız kamu kurumları ve piyasa yapıcılarca verilebilir.<\/li>\n<li><b>TAP:<\/b> ilk kez <b>Ekim 1988<\/b>; Hazine senetleri TCMB'ye depolar, mülkiyet satılana kadar Hazine'dedir; TCMB yalnız aracı ve depolayıcıdır; her gün belirlenen fiyattan satış. Piyasa yapıcılığına geçildikten sonra <b>yalnız piyasa yapıcı bankalar<\/b> katılır.<\/li>\n<li><b>Doğrudan satış:<\/b> <b>1996<\/b>'dan beri; kime ve ne kadar satılacağı baştan bellidir (kamu kurumları, bankalar, finansal kuruluşlar). Daha önce ihraç edilmiş senet de satılabilir; fiyata işlemiş faiz eklenir.<\/li>\n<li><b>Halka arz:<\/b> <b>1994 krizi<\/b> sonrası önem kazandı; şartları Hazine belirler; aracılığı yalnız <b>piyasa yapıcı bankalar<\/b> yapar ve Hazine'nin belirlediği oranda komisyon alır.<\/li>\n<\/ol>\n<h3>DİBS piyasa yapıcılığı<\/h3>\n<ul>\n<li>4749 sayılı Kanun tanımı: DİBS ihalelerinde ve ikincil piyasada etkinliği artırmak için önceden belirlenen kriterlere göre seçilmiş <b>banka<\/b>. Sözleşmeler her yıl Hazine ile yapılır.<\/li>\n<li><b>Yükümlülükler:<\/b> ihalelerde belli miktarda alım (borç çevirme riskini azaltır); BAP'ta belirli senetler için <b>alım-satım kotasyonu<\/b>; Bakanlığın istediği araştırma, rapor ve verileri sağlamak.<\/li>\n<li><b>Ayrıcalıklar:<\/b> ihalelere teminatsız katılım; rekabetçi olmayan teklif; ihale sonrası teklif; Hazine'nin para piyasası nakit işlemlerinin karşı tarafı olmak; TAP satışlarına yalnız onlar katılır; halka arza yalnız onlar aracılık eder; geri alım ve değişim ihalelerine yalnız onlar katılır. TCMB'deki <b>DİBS Ödünç İşlemleri Piyasası<\/b>'na taraf olabilirler.<\/li>\n<\/ul>\n", "sorular": [{"q": "Türkiye'de yerel para cinsinden risksiz faiz oranının pratikteki karşılığı olarak kabul edilen araç hangisidir?", "o": ["TL cinsi Devlet İç Borçlanma Senetleri", "Hazine eurotahvilleri", "Bankaların vadeli mevduat faizleri", "Özel sektör finansman bonoları", "TCMB politika faizi"], "a": 0, "e": "Türkiye'de Hazine ve Maliye Bakanlığınca ihraç edilen TL cinsi DİBS risksiz faizin pratikteki karşılığıdır; küresel referans ABD Hazine tahvilleridir."}, {"q": "Beş yıllık bir yatırım projesinin değerlendirilmesinde risksiz faiz olarak hangisinin kullanılması uygundur?", "o": ["Gecelik TLREF", "Vadesine beş yıl kalmış devlet tahvili getirisi", "Üç ay vadeli hazine bonosu getirisi", "On yıllık ABD Hazine tahvili getirisi", "Bir yıllık mevduat faizi"], "a": 1, "e": "Risksiz faiz seçiminde vade uyumu şarttır; beş yıllık proje için vadesine beş yıl kalmış devlet tahvili getirisi kullanılır."}, {"q": "Moody's ölçeğinde yatırım yapılabilir seviyenin en alt notu hangisidir?", "o": ["A3", "Ba1", "Baa3", "BBB-", "Ba3"], "a": 2, "e": "Moody's'te yatırım yapılabilir seviye Aaa ile Baa3 arasındadır; Ba1 spekülatif seviyenin en üstüdür. BBB- S&P/Fitch notasyonudur."}, {"q": "Çalışma notuna göre BBB notlu varlıkların tarihsel temerrüt olasılığı yüzde 0,45, BB notlu varlıklarınki yüzde 1,96'dır. Bu veriden çıkarılacak en doğru sonuç hangisidir?", "o": ["Riskler kademeler arasında doğrusal artar", "BB yatırım yapılabilir kategoridedir", "Ulusal ölçek notları uluslararası notlardan yüksek olamaz", "Yatırım yapılabilir seviyenin altına inişte temerrüt olasılığı yaklaşık 4 kat sıçrar", "BBB notu temerrüt anlamına gelir"], "a": 3, "e": "BBB'den BB'ye geçişte temerrüt olasılığı yaklaşık 4 kat artar; risk katlanarak artar ve bu yüzden yatırım yapılabilir eşik kritik kabul edilir."}, {"q": "Borçlanma aracını derecelendiren kuruluş, nota esas teşkil eden bilgileri vade boyunca en az ne sıklıkla gözden geçirmelidir?", "o": ["Ayda bir", "Üç ayda bir", "Altı ayda bir", "Yalnız ihraçta", "Yılda bir"], "a": 4, "e": "Derecelendirme kuruluşu nota esas bilgileri vade boyunca yılda en az bir kez ve gerektiren durumlarda gözden geçirmelidir."}, {"q": "Kredi temerrüt takası (CDS) ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Hukuken bir sigorta sözleşmesidir", "Tezgahüstü işlem gören iki taraflı bir türevdir", "Koruma alıcısı kredi olayı olmadıkça düzenli prim öder", "En likit vade genellikle beş yıldır", "Gelişmiş ülkelerin borçlanma araçları için de işlem görür"], "a": 0, "e": "CDS işlevsel olarak sigortaya benzese de hukuken ve düzenleyici açıdan sigorta sözleşmesi değildir."}, {"q": "Beş yıllık ABD Hazine tahvilinin getirisi yüzde 4,20'dir. Aynı vadeli bir Türkiye Hazinesi dolar cinsi eurotahvili UST +275 baz puan getiri farkıyla fiyatlanmaktadır. Bu eurotahvilin getirisi yüzde kaçtır?", "o": ["%4,475", "%6,95", "%6,75", "%31,70", "%7,45"], "a": 1, "e": "275 baz puan %2,75'tir; 4,20 + 2,75 = %6,95. %31,70 baz puanı yüzde sanmanın, %4,475 ise 275 baz puanı %0,275 almanın sonucudur. Getiri farkını ülkenin kredi notu, CDS primleri ve likidite belirler."}, {"q": "Diğer koşullar aynıyken opsiyonsuz, geri çağırma (call) opsiyonlu ve geri satma (put) opsiyonlu tahvillerin kuponları için doğru sıralama hangisidir?", "o": ["Put > Opsiyonsuz > Call", "Opsiyonsuz > Call > Put", "Call > Opsiyonsuz > Put", "Call = Put > Opsiyonsuz", "Put > Call > Opsiyonsuz"], "a": 2, "e": "Call hakkı ihraççıdadır, yatırımcı yeniden yatırım riskine karşı yüksek kupon ister; put hakkı yatırımcıdadır, yatırımcı düşük kupona razı olur."}, {"q": "Geri satma (put) opsiyonlu tahvil ihraççı açısından hangi riski doğurur?", "o": ["Yeniden yatırım riski", "Kur riski", "Enflasyon riski", "Yeniden finansman riski", "Takas riski"], "a": 3, "e": "Faizler yükselince yatırımcı tahvili iade eder; ihraççı zor koşullarda anapara ödemek zorunda kalır, bu da yeniden finansman riskidir."}, {"q": "Eurotahvillerle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Yalnız Avrupa'da ve euro cinsinden ihraç edilir", "Kuponlarında kaynakta vergi kesintisi esastır", "Takas çoğunlukla T+0 valörlüdür", "Hazine USD eurotahvillerinde Gerçek/Gerçek gün sayımı kullanılır", "Euroclear ve Clearstream nezdinde elektronik olarak saklanır"], "a": 4, "e": "Eurotahviller Euroclear ve Clearstream'de saklanır. Euro ifadesi uluslararası yapıyı anlatır; kuponlar çoğunlukla brüt ödenir; takas genelde T+2, Hazine USD ihraçlarında gün sayımı 30/360'tır."}, {"q": "Nominali 100.000 USD, yıllık kuponu yüzde 6 olan bir Hazine eurotahvilinin son kupon tarihi 10 Mart, takas tarihi 22 Haziran'dır. 30/360 yöntemine göre işlemiş faiz kaç USD'dir?", "o": ["1.700,00 USD", "1.676,71 USD", "1.716,67 USD", "3.400,00 USD", "1.733,33 USD"], "a": 0, "e": "30/360'ta Mart 20 + Nisan 30 + Mayıs 30 + Haziran 22 = 102 gün; 100.000 x 0,06 x 102/360 = 1.700 USD. 1.676,71 yılı 365 almanın sonucudur."}, {"q": "Hazine tarafından ihraç edilen euro cinsi eurotahvillerde kupon ödemeleri çoğunlukla hangi sıklıkta yapılır?", "o": ["Ayda bir", "Yılda bir", "Üç ayda bir", "Altı ayda bir", "Vade sonunda tek seferde"], "a": 1, "e": "Hazine'nin USD cinsi eurotahvillerinde kupon genellikle altı ayda bir, euro cinsi ihraçlarda çoğunlukla yılda bir ödenir."}, {"q": "STRIP işlemine tabi tutulmuş bir devlet tahvilinden ayrıştırılan kupon ödemesi Borsa İstanbul'da hangi harf koduyla izlenir ve nasıl fiyatlanır?", "o": ["T kodu; kuponlu tahvil gibi", "A kodu; değişken faizli araç gibi", "K kodu; kuponsuz (iskontolu) araç gibi", "K kodu; kuponlu tahvil gibi", "S kodu; pay gibi"], "a": 2, "e": "T tahvilin bütünü, A ayrıştırılmış anapara, K ayrıştırılmış kupondur; her parça kuponsuz araç gibi kendi vadesine göre fiyatlanır ve yeniden yatırım riski taşımaz."}, {"q": "Vadesine bir yıl kalan DİBS'lerin getirisi yüzde 42, on yıl kalanlarınki yüzde 27'dir. Bu getiri eğrisi için hangisi doğrudur?", "o": ["Normal eğimli eğridir, güçlü büyüme beklentisini gösterir", "Yatay eğridir", "Ters eğimli eğri kesin olarak resesyon olacağını kanıtlar", "Ters eğimli eğridir, genellikle sıkı para politikası dönemlerinde görülür ve resesyon için öncü göstergedir", "Eğri özel sektör tahvillerinden oluşturulur"], "a": 3, "e": "Kısa vadeli faizlerin uzun vadelilerden yüksek olduğu ters eğri genellikle sıkı para politikasında görülür; güçlü öncü göstergedir ama tek başına kesin sonuç değildir."}, {"q": "TLREF hesaplamasında aykırı değerleri temizlemek için ne yapılır?", "o": ["En düşük ve en yüksek yüzde 10'luk hacim dilimleri atılır", "Yalnız en yüksek yüzde 20 atılır", "Medyan faiz kullanılır", "Panel bankaların beyanlarının ortalaması alınır", "En düşük ve en yüksek yüzde 15'lik hacim dilimleri atılır, kalan yüzde 70 kullanılır"], "a": 4, "e": "TLREF'te işlemler faize göre sıralanır, hacmin en düşük ve en yüksek yüzde 15'i atılır, kalan yüzde 70'in hacim ağırlıklı ortalaması alınır. Yüzde 10 kuralı TLREFK'ya aittir."}, {"q": "TLREFK ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Taahhütlü İşlemler Pazarı verilerine dayanır ve hesaplama kalan yüzde 80'lik dilim üzerinden yapılır", "Repo-Ters Repo Pazarı'ndaki DİBS teminatlı işlemlere dayanır", "TCMB tarafından hesaplanır", "Panel bankaların beyanına dayanan ileriye dönük bir orandır", "Hiçbir koşulda TLREF'ten yararlanmaz"], "a": 0, "e": "TLREFK, katılım bankalarının faizsiz Taahhütlü İşlemler Pazarı verilerinden hesaplanır; uçlardan yüzde 10'lar atılır, hacim yetersizse TLREF ile ağırlıklandırılır."}, {"q": "BIST TLREF Endeksi'nin bir önceki iş günündeki değeri 3.000'dir. İlgili gün için açıklanan yıllık TLREF yüzde 24'tür ve gün bir iş günüdür. Endeksin yeni değeri yaklaşık kaçtır?", "o": ["3.000,66", "3.001,97", "3.002,00", "3.005,92", "3.720,00"], "a": 1, "e": "Endeks = 3.000 x (1 + 0,24 x 1/365) = 3.001,97. Hafta sonu geçişinde g = 3 alınırdı; 3.720 yıllık oranın tamamını eklemenin sonucudur."}, {"q": "TLREF'e endeksli, yıllık yüzde 3,50 ek getirili bir tahvilin 92 günlük kupon döneminde T-1 kuralına göre başlangıç endeksi 6.400, bitiş endeksi 6.720'dir. 100 TL nominal başına kupon ödemesi yaklaşık kaç TL'dir?", "o": ["5,00 TL", "8,50 TL", "5,88 TL", "5,93 TL", "6,72 TL"], "a": 2, "e": "Endeks getirisi 6.720/6.400 - 1 = %5; dönemsel ek getiri 3,50 x 92/365 = %0,8822; toplam %5,8822, yani 5,88 TL. 8,50 TL yıllık spreadin dönemselleştirilmeden eklenmesidir."}, {"q": "TLREF'e endeksli tahvillerde uygulanan T-1 kuralı neyi ifade eder?", "o": ["Kuponun ihraçtan bir gün önce ödenmesini", "Takasın bir gün önce yapılmasını", "Yatırımcının bir gün önce bildirim yapmasını", "Hesaplamada kupon tarihlerinden bir iş günü önceki endeks değerlerinin kullanılmasını", "Ek getirinin bir gün eksik hesaplanmasını"], "a": 3, "e": "Operasyonel hazırlık için hesaplamada kupon tarihlerinin bir iş günü öncesine ait TLREF Endeksi değerleri kullanılır."}, {"q": "Dönemsel reel faizi yüzde 1,5 olan TÜFE'ye endeksli bir devlet tahvilinde ilgili kupon için endeks katsayısı 1,24'tür. 100 TL nominal başına kupon kaç TL'dir?", "o": ["1,50 TL", "2,40 TL", "24,00 TL", "1,24 TL", "1,86 TL"], "a": 4, "e": "Kupon = Nominal x Endeks katsayısı x Dönemsel reel faiz = 100 x 1,24 x 0,015 = 1,86 TL."}, {"q": "TÜFE'ye endeksli devlet tahvilleriyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Anapara her koşulda nominal değer olan 100 TL olarak ödenir", "Kupon hesabında TÜFE iki ay gecikmeli kullanılır", "Anapara da endeks katsayısıyla güncellenir", "Deflasyon olsa da anapara nominal değerin altında ödenmez", "Reel getiri ihraç anında sabitlenir"], "a": 0, "e": "Anapara nominal değer çarpı endeks katsayısı olarak ödenir; yalnız deflasyon halinde 100 TL'nin altına inmez. Katsayı 1,80 ise anapara 180 TL'dir."}, {"q": "DİBS ihalesinde kesme fiyatının üzerinde teklif veren A 92,20, B 92,10, C 92,05 fiyat teklif etmiş, kazanan en düşük fiyat 92,05 olmuştur. Tek fiyat yöntemi uygulanırsa A hangi fiyattan alır?", "o": ["92,20", "92,05", "92,10", "Teklif fiyatlarının ortalamasından", "Nominal değer olan 100'den"], "a": 1, "e": "Tek fiyat ihalesinde kazananların hepsi Hazine'nin belirlediği, kazanan en düşük teklif fiyatından alır. Çoklu fiyatta A kendi teklifi olan 92,20'den alırdı."}, {"q": "Hazine'nin senetleri Merkez Bankası'na depoladığı, mülkiyetin satılana kadar Hazine'de kaldığı ve ilk kez Ekim 1988'de kullanılan ihraç yöntemi hangisidir?", "o": ["Çoklu fiyat ihalesi", "Doğrudan satış", "TAP yöntemi", "Halka arz", "Tek fiyat ihalesi"], "a": 2, "e": "TAP yönteminde Hazine senetleri TCMB'ye depolar, TCMB yalnız aracı ve depolayıcıdır; piyasa yapıcılığına geçildikten sonra yalnız piyasa yapıcı bankalar katılır."}, {"q": "Aşağıdakilerden hangisi DİBS piyasa yapıcılarının ayrıcalıklarından biri değildir?", "o": ["İhalelere teminatsız katılabilmek", "Rekabetçi olmayan teklif verebilmek", "Geri alım ve değişim ihalelerine katılabilmek", "BAP'ta belirli senetler için alım-satım kotasyonu vermek", "Halka arz yoluyla DİBS ihracına aracılık edebilmek"], "a": 3, "e": "Belirli senetler için kotasyon vermek piyasa yapıcının ayrıcalığı değil yükümlülüğüdür."}]}, {"id": 9, "kisa": "Fonlar: Kavram ve Limitler", "baslik": "Yatırım Fonları: Kavramsal Çerçeve, Portföy Sınırlamaları, Likit Fonlar ve Borçlanma Araçları Fonları", "ozet": "Kolektif yatırım, yatırım fonunun tanımı ve ilkeleri, portföy saklama, tek ihraççı ve 5/40 kuralı gibi yoğunlaşma limitleri, para piyasası ve kısa vadeli fonlar, borçlanma araçları fonları ve yan hesap.", "notlar": "\n<h3>Kolektif yatırımın yeri<\/h3>\n<ul>\n<li>Bireysel yatırımcının seçenekleri: aracı kurum üzerinden doğrudan pay veya borçlanma aracı almak (komisyon öder), türev araçlar (uzmanlık ister; anaparadan fazlası kaybedilebilir), yatırım danışmanlığı veya <b>bireysel portföy yönetimi<\/b> (asgari portföy büyüklüğü gerekir, ayrıca yönetim ücreti).<\/li>\n<li><b>Kolektif yatırım:<\/b> küçük tutarlı fonların bir araya getirilip önceden belirlenen kurallara göre yönetilmesi. Dört faydası: (i) <b>profesyonel yönetim<\/b>, (ii) <b>ölçek ekonomisiyle düşük maliyet<\/b>, (iii) <b>riskin uygun yönetimi<\/b>, (iv) portföyden <b>ödünç verme<\/b> gibi ek kazanç. Ayrıca GYO gibi likit olmayan varlıklara yatırım yapanların payları yatırımcıya likidite sağlar.<\/li>\n<li>Süreç: (i) strateji belirleme, (ii) fon toplayıp ortak portföy oluşturma, (iii) stratejiye uygun yatırım, (iv) varlıkların hukuki güvenliği ve getirilerin tahsili, (v) katılımcı giriş-çıkışları.<\/li>\n<li><b>SPKn m.3/1-m:<\/b> kolektif yatırım kuruluşları = <b>yatırım fonları<\/b> ve <b>yatırım ortaklıkları<\/b> (sabit ve değişken sermayeli). SPKn m.48-56 ayrıca portföy yönetim şirketlerini ve portföy saklama kuruluşlarını düzenler; bunlar tanıma dahil olmasa da sürecin parçasıdır.<\/li>\n<li><b>Portföy yönetim şirketi (PYŞ):<\/b> fon kurma yetkisine sahip; sürecin (i), (ii), (iii) basamaklarının baş aktörü; menkul kıymet yatırım ortaklıklarına da portföy yönetimi hizmeti verebilir. <b>Saklayıcı<\/b> PYŞ ile birlikte (iv) ve (v) basamaklarında görev alır.<\/li>\n<li>Tüzel kişilikli yapı → <b>yatırım ortaklığı<\/b>; tüzel kişiliksiz, PYŞ'nin kurucu olduğu ilişki → <b>yatırım fonu<\/b>.<\/li>\n<\/ul>\n<h3>Portföy saklama<\/h3>\n<ul>\n<li>SPKn m.56: kolektif yatırım kuruluşu varlıkları adlarına açılmış ayrı saklama hesabında saklanmak üzere saklayıcıya teslim edilir; kuruluşları belirleme yetkisi Kuruldadır.<\/li>\n<li>III-56.1 Tebliğ m.6: <b>Takasbank<\/b> ile Kurulca yetkilendirilen <b>banka ve aracı kurumlar<\/b>, Kuruldan izin almak koşuluyla saklama hizmeti verebilir.<\/li>\n<li>Temel ilke <b>malvarlığı ayrılığı<\/b>: saklayıcı fon varlıklarını kendi hesaplarında tutamaz, kendi aktifleriyle ilişkilendiremez.<\/li>\n<li>Gözetim görevleri: pay ihraç ve itfasının mevzuata ve içtüzüğe uygunluğu, birim pay değerinin doğru hesaplanması, gelirlerin uygun kullanımı, yönetici talimatlarının (strateji, portföy sınırları, kaldıraç) uygunluğu, nakit akışlarının izlenmesi.<\/li>\n<li>Aykırılıkta saklayıcı önce kurucu/yöneticiyi <b>ivedilikle<\/b> bilgilendirir; aykırılık önemliyse veya süresinde giderilmezse <b>SPK'ya bildirir<\/b>.<\/li>\n<\/ul>\n<h3>Yatırım fonu (SPKn m.52)<\/h3>\n<ul>\n<li>Tasarruf sahiplerinden katılma payı karşılığı toplanan para ve varlıklarla, tasarruf sahipleri hesabına, <b>inançlı mülkiyet<\/b> esaslarına göre, Kurulca belirlenen varlıklardan oluşan portföyü işletmek amacıyla, <b>PYŞ'ler tarafından fon içtüzüğüyle<\/b> kurulan, <b>tüzel kişiliği bulunmayan<\/b> mal varlığı.<\/li>\n<li>Katılma payı fon portföyüne ortaklığı gösterir; pay sahiplerinin aksine <b>idari haklar yoktur<\/b>.<\/li>\n<li>Kuruluş izni için: kurucunun Kurulca yetkilendirilmiş bir saklayıcıyla <b>anlaşmış olması<\/b> ve <b>içtüzüğün Kurulca onaylanması<\/b>. İçtüzük, anonim ortaklıktaki esas sözleşmenin yerini alır.<\/li>\n<li>PYŞ, fonu temsil eder, yönetir veya yönetimini denetler; fon varlıkları üzerinde <b>kendi adına ve fon hesabına<\/b> tasarruf eder.<\/li>\n<li><b>SPKn m.52/5:<\/b> fon, tapu ve diğer resmi sicil işlemleri ile ortağı olacağı limited ve anonim şirketlerin ticaret sicili işlemleriyle <b>sınırlı olarak tüzel kişiliği haiz sayılır<\/b>. Bu işlemler PYŞ ve saklayıcı yetkililerinin <b>müşterek imzasıyla<\/b> yapılır.<\/li>\n<\/ul>\n<h3>Temel ilkeler<\/h3>\n<ul>\n<li><b>Riskin dağıtılması<\/b>, <b>profesyonel yönetim<\/b>, <b>portföy yatırımları<\/b> (alım-satım farkı, kâr payı, faiz gibi gelirler), <b>inançlı mülkiyet<\/b> (tasarruf sahipleri işlem yetkisini içtüzükle kurucuya verir).<\/li>\n<li><b>Mal varlığının korunması:<\/b> fon mal varlığı PYŞ ve saklayıcının mal varlığından ayrıdır. SPKn m.53: fon hesabına olması ve içtüzükte hüküm bulunması şartıyla kredi, türev, açığa satış ve benzeri işlemler dışında <b>teminat gösterilemez, rehnedilemez<\/b>; PYŞ veya saklayıcının yönetimi kamuya devredilse bile başka amaçla tasarruf edilemez, kamu alacakları dahil <b>haczedilemez<\/b>, <b>ihtiyati tedbir<\/b> konulamaz, <b>iflas masasına<\/b> dahil edilemez.<\/li>\n<li>GYF ve GSYF bu modülün değil, \"Geniş Kapsamlı Sermaye Piyasası Mevzuatı\" modülünün konusudur.<\/li>\n<\/ul>\n<h3>Portföy sınırlamaları (III-52.1 Tebliğ m.17)<\/h3>\n<ul>\n<li><b>Tek ihraççı limiti:<\/b> fon toplam değerinin en fazla <b>%10<\/b>'u bir ihraççının para ve sermaye piyasası araçlarına ve bunlara dayalı türevlere. Türev içeren fonlarda türev pozisyon riskleri de (netleştirme esaslarıyla) hesaba katılır.<\/li>\n<li><b>5/40 kuralı:<\/b> fon toplam değerinin <b>%5'inden fazla<\/b> yatırım yapılan ihraççıların toplamı <b>%40'ı<\/b> aşamaz.<\/li>\n<li><b>Aynı grup limiti (m.17/1-c):<\/b> TFRS'ye göre aynı gruba dahil ihraççılara en fazla <b>%20<\/b>.<\/li>\n<li><b>Tedavül limiti (m.17/1-ç):<\/b> bir ihraççının tedavüldeki borçlanma araçları toplam nominalinin en fazla <b>%10<\/b>'u bir fona alınabilir.<\/li>\n<li><b>Sermaye/oy sınırı (m.17/2):<\/b> bir fon bir ihraççının sermayesinin veya oy haklarının <b>%10<\/b>'undan fazlasına sahip olamaz; aynı PYŞ'nin yönettiği ve tek kurucuya ait tüm fonlar birlikte <b>%20<\/b>'yi aşamaz (fonun pasif yatırımcı niteliği korunur).<\/li>\n<li><b>Serbest fonlar<\/b> bu sınırlamalardan genel olarak muaftır.<\/li>\n<li>Dikkat: Örnek 5/40 testi: beş şirkete %8'er (%40) yatırım yapılmışken altıncı bir şirketi %7'ye çıkarmak %47'ye yol açar ve yasaktır.<\/li>\n<\/ul>\n<table>\n<tr><th>Varlık / ihraççı<\/th><th>Özel limit<\/th><\/tr>\n<tr><td>TCMB, T.C. Hazinesi, Türkiye Varlık Fonu, ipotek finansmanı kuruluşları<\/td><td>Genel sınırlar uygulanmaz; tek tertibe en fazla <b>%35<\/b> (m.17/1-d)<\/td><\/tr>\n<tr><td>İpotek/varlık teminatlı menkul kıymet (İTMK/VTMK)<\/td><td>Tek ihraççı <b>%25<\/b>; 5/40 uygulanmaz (m.17/1-a)<\/td><\/tr>\n<tr><td>Varlık kiralama şirketi ihraçları<\/td><td>Tek ihraççı <b>%25<\/b>, aynı grup <b>%35<\/b>; 5/40 uygulanmaz (m.17/1-e)<\/td><\/tr>\n<tr><td>Konut/varlık finansmanı fonlarınca ihraç edilen VDMK/İDMK<\/td><td>Tek ihraççı, aynı grup ve 5/40 uygulanmaz; her fon ayrı ihraççı; tek tertip <b>%35<\/b><\/td><\/tr>\n<tr><td>Mevduat / katılma hesabı<\/td><td>Toplam en fazla <b>%10<\/b>, tek banka <b>%3<\/b> (katılım fonlarında %25 ve %10) (m.17/5)<\/td><\/tr>\n<tr><td>Bankaların sermaye benzeri borçlanma araçları<\/td><td>Yalnız borsada işlem görenler; toplam <b>%10<\/b>, tek ihraççı <b>%5<\/b> (Rehber 4.1.8)<\/td><\/tr>\n<\/table>\n<h3>Para piyasası fonları (PPF) ve kısa vadeli borçlanma araçları fonları (KVBAF)<\/h3>\n<ul>\n<li>Ortak ayırıcı özellik: <b>en son ilan edilen birim pay fiyatı<\/b> ile işlem, yani <b>geri fiyat<\/b> (known pricing); piyasa koşulları elverdiğinde <b>aynı gün valörlü (T+0)<\/b> işlem.<\/li>\n<li>Vadesi belirsiz varlıklar (vadesiz borçlanma araçları, erken itfa opsiyonlu yapılandırılmış ürünler) PPF ve KVBAF'ye <b>alınamaz<\/b>; orta ve uzun vadeli borçlanma araçları fonlarında portföyün <b>%20<\/b>'sine kadar izin vardır. Bankaların ilave ana sermaye (AT1) araçları da PPF ve KVBAF'ye alınamaz.<\/li>\n<li>Ters repo: BAP Repo-Ters Repo Pazarı'nda fon toplam değerinin <b>%100<\/b>'üne kadar; <b>Pay Senedi Repo Pazarı<\/b>'nda en fazla <b>%25<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Kriter<\/th><th>PPF<\/th><th>KVBAF<\/th><\/tr>\n<tr><td>Ağırlıklı ortalama vade<\/td><td>En fazla <b>45 gün<\/b><\/td><td><b>25-90 gün<\/b><\/td><\/tr>\n<tr><td>Tekil varlık vadesi<\/td><td>En fazla <b>184 gün<\/b><\/td><td>Sınır yok (ortalama vadeye uymak koşuluyla)<\/td><\/tr>\n<tr><td>Vadesi belirsiz varlık<\/td><td>Yasak<\/td><td>Yasak<\/td><\/tr>\n<tr><td>Asgari DİBS<\/td><td><b>%10<\/b> (unvanında katılım olanlar hariç; Rehber 4.9)<\/td><td>Zorunluluk yok<\/td><\/tr>\n<tr><td>Toplam mevduat/katılma hesabı<\/td><td>En fazla <b>%50<\/b><\/td><td>En fazla %10 (genel kural)<\/td><\/tr>\n<tr><td>Tek banka<\/td><td>En fazla <b>%6<\/b><\/td><td>En fazla %3 (genel kural)<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>TEFAS:<\/b> genel kural tüm fonların TEFAS'ta işlem görmesidir (Rehber 6.8); PPF, KVBAF ve katılım karşılıkları <b>istisna<\/b>dır, kurucu tercihine bırakılmıştır.<\/li>\n<li><b>Yatırımcı blokajı<\/b> PPF ve KVBAF'te uygulanmaz (Rehber 6.7).<\/li>\n<li><b>Otomatik alım-satım<\/b> (Rehber 6.11): izahnamede yer almak kaydıyla, para çekme, kart ödemesi, para yatırma gibi durumlarda ayrı talimat olmadan pay alınıp satılabilir; dağıtıcı kendi portföyünü geçici olarak kullanabilir.<\/li>\n<li><b>Mevduat ile karşılaştırma:<\/b> mevduatta getiri vade başında sabit ve kesindir, vade bozulursa faiz çoğunlukla kaybedilir, doğrudan maliyet yoktur. PPF'de sabit getiri taahhüdü yoktur, vade beklemeden getiri kaybetmeden satılabilir (\"vadesiz likit mevduat alternatifi\"), günlük yönetim ücreti kesilir, faiz artışlarına daha hızlı uyum sağlar.<\/li>\n<\/ul>\n<h3>Borçlanma araçları fonları<\/h3>\n<ul>\n<li>Getiri faiz + sermaye kazancı/kaybından oluşur; faiz düşünce fon değeri artar.<\/li>\n<li>Şemsiye (Tebliğ m.6/1-a): fon toplam değerinin <b>en az %80<\/b>'i devamlı olarak kamu veya özel sektör borçlanma araçlarına (tahvil, bono, kira sertifikası).<\/li>\n<\/ul>\n<table>\n<tr><th>Unvan<\/th><th>Ağırlıklı ortalama vade<\/th><th>Faiz riski<\/th><\/tr>\n<tr><td>Kısa vadeli<\/td><td>25-90 gün (m.20/1-a)<\/td><td>Düşük<\/td><\/tr>\n<tr><td>Orta vadeli<\/td><td>91-730 gün (m.20/1-b)<\/td><td>Orta<\/td><\/tr>\n<tr><td>Uzun vadeli<\/td><td>730 günden fazla (m.20/1-c)<\/td><td>Yüksek<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Kamu borçlanma araçları fonu:<\/b> ağırlıklı DİBS; kredi riski ihmal edilebilir, ana risk <b>faiz riski<\/b>.<\/li>\n<li><b>Özel sektör borçlanma araçları fonu:<\/b> faiz riski + <b>kredi (spread) riski<\/b> + daha sığ piyasa nedeniyle <b>likidite riski<\/b>.<\/li>\n<li><b>Eurobond fonu:<\/b> döviz cinsi, ihraççı T.C. Hazinesi veya Türk şirketleri; unvanda \"(Döviz)\" olur ama ihraççı yerli olduğundan <b>\"Yabancı\" ibaresi olmaz<\/b>. Belirleyiciler: <b>döviz kuru, Türkiye CDS'i, küresel faizler<\/b>. FED faiz artırırsa kur ve CDS sabit olsa bile fiyat düşebilir.<\/li>\n<li><b>Yabancı borçlanma araçları fonu:<\/b> \"Yabancı\" ibaresi için fon toplam değerinin <b>en az %80<\/b>'i yabancı ihraççı varlıklarında olmalı (Tebliğ m.7); yabancı kamu borçlanma araçlarına <b>%35<\/b>'e kadar (Rehber 4.1.5). Türkiye CDS'inden etkilenmez; kur ve global faizler belirleyicidir.<\/li>\n<\/ul>\n<h3>Yan hesap (side pocket, Rehber 12.4)<\/h3>\n<ul>\n<li>İki koşul birlikte: özel sektör borçlanma aracı veya kira sertifikası için temerrüt nedeniyle <b>%100 karşılık<\/b> ayrılmış olması <b>ve<\/b> varlık değerinin fon toplam değerinin <b>%5'ini aşması<\/b>.<\/li>\n<li>Sorunlu varlık <b>Takasbank<\/b> nezdinde açılan izole yan hesaba aktarılır; yalnız karşılık tarihinde fonda olan yatırımcılarla ilişkilendirilir. Sonradan girenler riski taşımaz; sonraki tahsilat mevcut portföye değil, yan hesaptaki yatırımcılara aktarılır.<\/li>\n<li>Operasyonel giderler fondan değil <b>kurucudan<\/b> karşılanır.<\/li>\n<li>Örnek: 150 milyonluk fonda 9 milyonluk temerrütteki tahvil (%6) koşulu sağlar; 6 milyonluk (%4) sağlamaz.<\/li>\n<\/ul>\n", "sorular": [{"q": "SPKn m.3/1-m'ye göre kolektif yatırım kuruluşları hangileridir?", "o": ["Yatırım fonları ve yatırım ortaklıkları", "Portföy yönetim şirketleri ve saklayıcılar", "Aracı kurumlar ve bankalar", "Yatırım fonları ve portföy yönetim şirketleri", "Yatırım ortaklıkları ve Takasbank"], "a": 0, "e": "Kanun kolektif yatırım kuruluşlarını yatırım fonları ve yatırım ortaklıkları olarak belirler; PYŞ ve saklayıcılar süreçte yer alsa da tanıma dahil değildir."}, {"q": "Kolektif yatırım sürecinde portföy saklama kuruluşları hangi basamaklarda görev alır?", "o": ["Strateji belirleme ve fon toplama", "Varlıkların hukuki güvenliği, getirilerin tahsili ile katılımcı giriş-çıkışları", "Fon toplama ve yatırıma yönlendirme", "Yalnız strateji belirleme", "Yatırım ortaklığı kuruluşu"], "a": 1, "e": "PYŞ ilk üç basamağın (strateji, fon toplama, yatırım) baş aktörüdür; saklayıcılar PYŞ ile birlikte dördüncü ve beşinci basamaklarda görev alır."}, {"q": "Portföy saklayıcısı, görevini yaparken önemli nitelikte bir mevzuat aykırılığı tespit ederse ne yapmalıdır?", "o": ["Doğrudan fonu tasfiye eder", "Yalnız yatırımcılara duyurur", "Kurucu veya yöneticiyi ivedilikle bilgilendirir; önemli ise veya süresinde giderilmezse SPK'ya bildirir", "Yalnız iç denetim raporuna yazar", "Borsa İstanbul'a bildirir"], "a": 2, "e": "Saklayıcı aykırılığı önce kurucu veya yöneticiye ivedilikle bildirir; aykırılık önemliyse veya verilen sürede giderilmezse konuyu Kurula bildirir."}, {"q": "Yatırım fonlarıyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Tüzel kişiliği bulunmayan bir mal varlığıdır", "PYŞ'ler tarafından içtüzükle kurulur", "İnançlı mülkiyet esasına dayanır", "Katılma payı sahiplerinin fon yönetimine katılma gibi idari hakları vardır", "Kuruluş izni için içtüzüğün Kurulca onaylanması gerekir"], "a": 3, "e": "Katılma payı sahiplerinin, ortaklık pay sahiplerinden farklı olarak fon yönetimine katılma gibi idari hakları yoktur."}, {"q": "SPKn m.52/5 uyarınca yatırım fonunun tüzel kişiliği haiz sayıldığı işlemlerde imza yetkisi kime aittir?", "o": ["Yalnız portföy yönetim şirketine", "Yalnız saklayıcıya", "SPK'ya", "Fon yatırımcılarının çoğunluğuna", "PYŞ ile portföy saklama kuruluşu yetkililerinin müşterek imzasına"], "a": 4, "e": "Tapu, ticaret sicili ve diğer resmi sicillerde fon adına işlemler PYŞ ile saklayıcı yetkililerinin müşterek imzasıyla yapılır."}, {"q": "SPKn m.53 kapsamında fon mal varlığıyla ilgili hangisi doğrudur?", "o": ["Fon hesabına ve içtüzükte hüküm bulunmak şartıyla türev işlemleri için teminat gösterilebilir", "Kamu alacakları için haczedilebilir", "PYŞ iflas ederse iflas masasına girer", "Saklayıcının borçları için rehnedilebilir", "Üzerine ihtiyati tedbir konulabilir"], "a": 0, "e": "Fon mal varlığı kredi, türev, açığa satış gibi fon hesabına yapılan işlemler dışında teminat gösterilemez; haczedilemez, tedbir konulamaz, iflas masasına girmez."}, {"q": "100 milyon TL büyüklüğündeki bir hisse senedi fonunda A, B, C, D ve E şirketlerinin her birinin ağırlığı yüzde 8, F şirketinin ağırlığı yüzde 4'tür. Yönetici F'nin ağırlığını yüzde 7'ye çıkarmak istemektedir. Bu işlem için hangisi doğrudur?", "o": ["Tek ihraççı limiti yüzde 10 olduğundan mümkündür", "5/40 kuralı nedeniyle mümkün değildir, çünkü yüzde 5'i aşanların toplamı yüzde 47 olur", "Aynı grup limiti nedeniyle mümkün değildir", "Tedavül limiti nedeniyle mümkün değildir", "Hisse senedi fonları portföy sınırlamalarından muaftır"], "a": 1, "e": "Yüzde 5'ten fazla yatırım yapılan ihraççıların toplamı yüzde 40'ı aşamaz; F yüzde 7'ye çıkınca toplam 40 + 7 = yüzde 47 olur."}, {"q": "Bir borçlanma araçları fonu aynı holdinge bağlı üç şirketin tahvillerine sırasıyla yüzde 8, yüzde 7 ve yüzde 6 oranında yatırım yapmıştır. Bu durum hangi kurala aykırıdır?", "o": ["Tek ihraççı limitine", "5/40 kuralına", "Aynı grup limitine", "Tedavül limitine", "Hiçbir kurala aykırı değildir"], "a": 2, "e": "Aynı gruba dahil ihraççılara en fazla yüzde 20 yatırılabilir; toplam yüzde 21'dir. Her biri tek başına yüzde 10'un altındadır."}, {"q": "Bir fon, bir şirketin tedavüldeki 80 milyon TL nominal tutarlı tahvil tertibinin 9 milyon TL'lik kısmını satın almıştır. Tedavül limiti açısından durum nedir?", "o": ["Uygundur, oran yüzde 9'dur", "Uygundur, sınır yüzde 20'dir", "Aykırıdır, sınır yüzde 5'tir", "Aykırıdır, oran yaklaşık yüzde 11,25 olup sınır yüzde 10'dur", "Tedavül limiti yalnız pay senetlerinde uygulanır"], "a": 3, "e": "Bir ihraççının tedavüldeki borçlanma araçlarının en fazla yüzde 10'u bir fona alınabilir; 9/80 = yüzde 11,25 sınırı aşar."}, {"q": "Aynı PYŞ tarafından yönetilen ve tek bir kurucuya ait fonların tamamı bir ihraççının sermayesinin veya oy haklarının en fazla yüzde kaçına sahip olabilir?", "o": ["%5", "%10", "%25", "%35", "%20"], "a": 4, "e": "Tek fon için sınır yüzde 10, aynı kurucunun ve PYŞ'nin tüm fonları için toplu sınır yüzde 20'dir."}, {"q": "Varlık kiralama şirketlerinin ihraç ettiği sermaye piyasası araçlarına yatırımda uygulanan özel limitler hangisidir?", "o": ["Tek ihraççı yüzde 25, aynı grup yüzde 35; 5/40 uygulanmaz", "Tek ihraççı yüzde 10, aynı grup yüzde 20", "Hiçbir limit uygulanmaz", "Tek tertip yüzde 35", "Tek ihraççı yüzde 5, toplam yüzde 10"], "a": 0, "e": "Varlık kiralama şirketi ihraçlarında tek ihraççı limiti yüzde 25, aynı grup limiti yüzde 35'tir ve 5/40 kuralı uygulanmaz."}, {"q": "T.C. Hazinesi tarafından ihraç edilen araçlara yatırımda bir fon için geçerli kural hangisidir?", "o": ["Tek ihraççı limiti yüzde 10 aynen uygulanır", "Genel sınırlar uygulanmaz ancak tek bir tertibe yatırım fon toplam değerinin yüzde 35'ini aşamaz", "Tek tertibe sınırsız yatırım yapılabilir", "Yalnız yüzde 25'e kadar yatırım yapılabilir", "5/40 kuralı uygulanır"], "a": 1, "e": "TCMB, Hazine, Türkiye Varlık Fonu ve ipotek finansmanı kuruluşları için genel sınırlar uygulanmaz; ancak tek tertip yüzde 35'i aşamaz."}, {"q": "Bir para piyasası fonu ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Portföyün ağırlıklı ortalama vadesi en fazla 90 gün olabilir", "Portföyüne vadesi belirsiz varlıkların yüzde 20'sine kadar alabilir", "Tek bir varlığın vadesi en fazla 184 gün olabilir", "Asgari DİBS zorunluluğu yoktur", "Tek bankada en fazla yüzde 3 mevduat tutabilir"], "a": 2, "e": "PPF'de ağırlıklı ortalama vade en fazla 45 gün, tekil varlık vadesi en fazla 184 gündür; vadesi belirsiz varlık yasaktır; yüzde 10 DİBS zorunluluğu vardır; tek banka sınırı yüzde 6'dır."}, {"q": "Bir yönetici vadesine 200 gün kalmış bir finansman bonosunu portföye almak istemektedir. Bu bono hangi fona alınabilir?", "o": ["Yalnız para piyasası fonuna", "Her ikisine de", "Hiçbirine", "Yalnız kısa vadeli borçlanma araçları fonuna (ortalama vade 25-90 gün aralığında kalmak koşuluyla)", "Yalnız katılım para piyasası fonuna"], "a": 3, "e": "PPF'de tekil varlık vadesi en fazla 184 gündür; KVBAF'de tekil vade sınırı yoktur, yalnız ağırlıklı ortalama vade 25-90 gün olmalıdır."}, {"q": "Bir yönetici hem PPF'sinin hem KVBAF'sinin yüzde 5'ini aynı bankada mevduat olarak tutmak istemektedir. Hangisi doğrudur?", "o": ["Her iki fon için de uygundur", "PPF için aykırı, KVBAF için uygundur", "Her iki fon için de aykırıdır", "Mevduat bu fonlarda yasaktır", "PPF için uygundur (tek banka sınırı yüzde 6), KVBAF için aykırıdır (sınır yüzde 3)"], "a": 4, "e": "PPF'de toplam mevduat yüzde 50, tek banka yüzde 6; KVBAF'de genel kural gereği toplam yüzde 10, tek banka yüzde 3'tür."}, {"q": "PPF ve KVBAF'lerin Borsa İstanbul Pay Senedi Repo Pazarı'nda yapabileceği ters repo işlemleri fon toplam değerinin en fazla yüzde kaçı olabilir?", "o": ["%25", "%10", "%20", "%50", "%100"], "a": 0, "e": "DİBS teminatlı Repo-Ters Repo Pazarı'nda yüzde 100'e kadar ters repo yapılabilir; teminatı pay olan Pay Senedi Repo Pazarı'nda sınır yüzde 25'tir."}, {"q": "Aşağıdakilerden hangisi para piyasası fonlarına tanınan operasyonel istisnalardan biri değildir?", "o": ["TEFAS'ta işlem görme zorunluluğu olmaması", "Portföy sınırlamalarından tamamen muaf olması", "Yatırımcı blokajının uygulanmaması", "İzahnamede yer almak kaydıyla otomatik alım-satım yapılabilmesi", "Geri fiyat ile işlem yapılabilmesi"], "a": 1, "e": "PPF'ler portföy sınırlamalarına tabidir, hatta vade ve mevduat kuralları daha sıkıdır. Diğerleri PPF'lere özgü kolaylıklardır."}, {"q": "Ağırlıklı ortalama vadesi 400 gün olan bir borçlanma araçları fonunun unvanında hangi ifade yer almalıdır?", "o": ["Kısa vadeli", "Uzun vadeli", "Orta vadeli", "Para piyasası", "Değişken"], "a": 2, "e": "Ortalama vade 25-90 gün kısa, 91-730 gün orta, 730 günden fazlası uzun vadelidir; 400 gün orta vadelidir."}, {"q": "Bir fonun unvanında Yabancı ibaresinin yer alabilmesi için fon toplam değerinin en az ne kadarının yabancı ihraççılara ait varlıklardan oluşması gerekir?", "o": ["%35", "%51", "%60", "%80", "%100"], "a": 3, "e": "Tebliğ m.7 uyarınca Yabancı ibaresi için fon toplam değerinin en az yüzde 80'i yabancı ihraççı varlıklarından oluşmalıdır; yabancı kamu borçlanma araçlarına yüzde 35'e kadar yatırım istisnası ayrıca vardır."}, {"q": "Eurobond fonları için aşağıdakilerden hangisi doğrudur?", "o": ["Unvanlarında Yabancı ibaresi bulunur", "Türkiye CDS'inden etkilenmez", "Yalnız TL cinsi varlıklara yatırım yapar", "Küresel faiz değişimlerinden etkilenmez", "İhraççı yerli olduğundan unvanda Döviz ibaresi bulunur ama Yabancı ibaresi bulunmaz"], "a": 4, "e": "Eurobond fonları T.C. Hazinesi veya Türk şirketlerinin döviz cinsi tahvillerine yatırır; ihraççı yerli olduğundan Yabancı ibaresi kullanılmaz. Kur, Türkiye CDS'i ve küresel faizlerden etkilenir."}, {"q": "Toplam değeri 150 milyon TL olan bir borçlanma araçları fonunda, temerrüde düşmüş ve yüzde 100 karşılık ayrılmış bir özel sektör tahvilinin değeri karşılık öncesinde 9 milyon TL'dir. Yan hesap uygulaması için hangisi doğrudur?", "o": ["Oran yüzde 6 olduğundan ve yüzde 100 karşılık ayrıldığından koşullar sağlanmıştır", "Oran yüzde 5'in altında olduğundan koşullar sağlanmamıştır", "Yan hesap yalnız kamu borçlanma araçlarında uygulanır", "Yan hesap giderleri fondan karşılanır", "Yan hesaptan yapılacak tahsilat yeni yatırımcılara da dağıtılır"], "a": 0, "e": "Yüzde 100 karşılık ve varlık değerinin fon toplam değerinin yüzde 5'ini aşması gerekir; 9/150 = yüzde 6. Tahsilat yalnız o tarihte fonda olanlara gider, giderleri kurucu karşılar."}, {"q": "Yan hesap uygulamasıyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Sorunlu varlık Takasbank nezdinde açılan ayrı bir hesaba aktarılır", "Yan hesapla ilgili operasyonel giderler fon portföyünden karşılanır", "Varlık karşılık ayrıldığı tarihte fonda bulunan yatırımcılarla ilişkilendirilir", "Olaydan sonra fona giren yatırımcılar varlığın riskini taşımaz", "Düzenlemesi Yatırım Fonlarına İlişkin Rehber'in 12.4. maddesindedir"], "a": 1, "e": "Yatırımcı mağduriyetini önlemek için yan hesapla ilgili tüm operasyonel harcamalar fon portföyünden değil kurucu tarafından karşılanır."}]}, {"id": 10, "kisa": "Fon Türleri", "baslik": "Fon Türlerinin Özellikleri: Hisse, Endeks, Sektör, Değişken, Fon Sepeti, Katılım, Serbest ve Kâr Payı Dağıtan Fonlar", "ozet": "Hisse senedi ve hisse senedi yoğun fonlar, endeks fon ve BYF farkı, iştirak ve sektör fonları, işlem sırası kapatılan paylar, değişken ve karma fonlar, fon sepeti, katılım ve serbest fonlar ile düzenli kâr payı dağıtan fonlar.", "notlar": "\n<h3>Hisse senedi fonları ve hisse senedi yoğun fonlar<\/h3>\n<ul>\n<li><b>Hisse senedi fonu:<\/b> fon toplam değerinin <b>en az %80<\/b>'i devamlı olarak yerli veya yabancı ihraççı paylarına.<\/li>\n<li><b>Hisse senedi yoğun fon:<\/b> fon portföy değerinin <b>en az %80<\/b>'i, <b>menkul kıymet yatırım ortaklıkları payları hariç<\/b>, <b>Borsa İstanbul'da işlem gören<\/b> ihraççı paylarından oluşmalı. Hesapta pay ve pay endekslerine dayalı vadeli işlemler, opsiyon primleri ve aracı kuruluş varantları da dikkate alınabilir. Unvanda \"(Hisse Senedi Yoğun Fon)\" ibaresi yer alır; vergi avantajının göstergesidir.<\/li>\n<\/ul>\n<h3>Endeks fonlar ve borsa yatırım fonları<\/h3>\n<ul>\n<li><b>Endeks fon<\/b> (Rehber 1.4): takip edilen endeks ve fon portföyü <b>en az 6 farklı ihraççı<\/b> payından oluşmalı; her hissenin ağırlığı en fazla <b>%30<\/b> (genel %10 limiti esnetilir; takip hatasını azaltır).<\/li>\n<li>Başarı ölçütü endeksle uyumdur: fon birim pay değeri ile endeks arasındaki <b>korelasyon en az %90<\/b> olmalıdır (Tebliğ m.23).<\/li>\n<\/ul>\n<table>\n<tr><th>Özellik<\/th><th>Endeks fon (klasik)<\/th><th>Borsa yatırım fonu (BYF)<\/th><\/tr>\n<tr><td>İşlem yeri<\/td><td>TEFAS, banka, aracı kurum<\/td><td>Borsa İstanbul Pay Piyasası<\/td><\/tr>\n<tr><td>Fiyat<\/td><td>Günde tek fiyat (kapanış verileriyle, ileri fiyat)<\/td><td>Seans boyu anlık fiyat<\/td><\/tr>\n<tr><td>Alım-satım<\/td><td>Talimatla, valör süresi var<\/td><td>Hisse gibi anlık; T+2<\/td><\/tr>\n<tr><td>Yönetim ücreti<\/td><td>Görece yüksek<\/td><td>Görece düşük<\/td><\/tr>\n<tr><td>İşlem maliyeti<\/td><td>Genellikle komisyonsuz<\/td><td>Aracı kurum komisyonu<\/td><\/tr>\n<tr><td>Fiyat-değer<\/td><td>Her zaman net aktif değer<\/td><td>Piyasa fiyatı; prim/iskonto olabilir<\/td><\/tr>\n<\/table>\n<h3>İştirak fonları ve sektör fonları<\/h3>\n<ul>\n<li><b>İştirak fonu:<\/b> belirli bir topluluğun iştiraklerine yatırım yapar; <b>aynı grup limiti (%20) ve 5/40 kuralından muaftır<\/b>, portföyün tamamı gruba yatırılabilir. Ancak <b>tek ihraççı limiti %10<\/b> geçerlidir; yani en az birden fazla grup şirketine yayılmak zorundadır.<\/li>\n<li>Dikkat: %10 sınırı yoğunlaşma riskini bertaraf etmez; grup şirketleri arasında korelasyon yüksektir (<b>grup riski<\/b>); ana şirketteki sorun tüm portföyü birlikte düşürebilir.<\/li>\n<li><b>Sektör fonu<\/b> (Rehber 2/c): unvanda sektör adı için fon toplam değerinin <b>en az %80<\/b>'i o sektördeki şirketlere. Tek şirket limiti <b>%20<\/b>'ye çıkarılmış; 5/40 ve grup sınırlamaları devre dışı. Sektörel yoğunlaşma, yüksek getiri potansiyeli ve yüksek volatilite.<\/li>\n<\/ul>\n<h3>İşlem sırası kapatılan payların değerlemesi (Rehber 5.1.1)<\/h3>\n<ul>\n<li>Kapanıştan sonraki <b>ilk 5 işlem günü<\/b>: makul gerekçe yoksa kapanış öncesi son işlem günü fiyatı kullanılır (bekleme süreci).<\/li>\n<li>Kapalılık <b>6. iş günü<\/b> de sürerse ihtiyatlılık ilkesi gereği karşılık ayrılır:<\/li>\n<\/ul>\n<table>\n<tr><th>Payın fondaki ağırlığı<\/th><th>Karşılık takvimi<\/th><\/tr>\n<tr><td>%1'e kadar<\/td><td><b>1 gün<\/b> içinde değer sıfırlanır<\/td><\/tr>\n<tr><td>%1 - %5<\/td><td><b>30 gün<\/b> boyunca her gün eşit tutarda<\/td><\/tr>\n<tr><td>%5'ten fazla<\/td><td><b>90 gün<\/b> boyunca her gün eşit tutarda<\/td><\/tr>\n<\/table>\n<ul>\n<li>Örnek: %3 ağırlıklı 1,8 milyon TL'lik pay → 30 günde, günde 60.000 TL karşılık.<\/li>\n<li>Pay yeniden işlem görürse karşılıklar yeniden değerlendirilir; değer artışları da <b>kademeli<\/b> yansıtılır.<\/li>\n<\/ul>\n<h3>Değişken fonlar ve karma fonlar<\/h3>\n<ul>\n<li><b>Değişken fon<\/b> (Tebliğ m.6/1-ç): portföy sınırlamaları itibarıyla diğer fon türlerinin tanımına girmeyen fon. Belirli bir varlık sınıfında asgari oran (ör. %80) yoktur; izahnamedeki strateji ve risk limitleri içinde bir varlığı %0'a indirip diğerini %100'e çıkarabilir.<\/li>\n<li>Sabit bir varlık endeksi başarıyı ölçmede yetersiz kalabileceğinden karşılaştırma ölçütü yerine <b>eşik değer (hurdle rate)<\/b> belirlenebilir: piyasadan bağımsız, fonun aşmayı hedeflediği asgari getiri (ör. BIST-KYD Repo, mevduat faizi veya TÜFE + ek getiri). Getiri taahhüdü değil, bir <b>alt sınır<\/b>dır.<\/li>\n<li><b>Karma fon<\/b> (Rehber 1.1): portföyün tamamı pay, borçlanma aracı, altın ve kıymetli maden gibi gruplardan oluşur; <b>en az iki grubun her biri en az %20<\/b>, bu iki grubun toplamı <b>en az %80<\/b> olmalıdır. Değişken fonun aksine yapısal çeşitlendirme zorunludur.<\/li>\n<li><b>Değişken şemsiye fon kotası<\/b> (Kurul kararları): her risk değeri grubundan en fazla bir fon olmak şartıyla, risk değerliler dahil en fazla <b>4 fon<\/b> ihraç edilebilir.<\/li>\n<li>Risk değerli fon unvanları: RD <b>1-2<\/b> \"Muhafazakar\" veya \"Temkinli\"; RD <b>3-4<\/b> \"Dengeli\"; RD <b>4-5<\/b> \"Atak\", \"Dinamik\" veya \"Büyüme\"; RD <b>5-7<\/b> \"Agresif\".<\/li>\n<\/ul>\n<h3>Fon sepeti fonları<\/h3>\n<ul>\n<li>Tek bir fona veya BYF'ye yatırım fon toplam değerinin en fazla <b>%20<\/b>'si.<\/li>\n<li>Başka bir <b>fon sepeti fonuna yatırım yapılamaz<\/b>.<\/li>\n<li>Bir fonun toplam katılma payı sayısının en fazla <b>%25<\/b>'i alınabilir.<\/li>\n<li>Mümkün olduğunca Kurulca onaylı izahnamesi olan fonlara yatırım esastır; <b>yabancı borsalarda işlem gören BYF'ler<\/b> bu kuralın dışındadır.<\/li>\n<li><b>Serbest fon<\/b> payları toplam değerin en fazla <b>%10<\/b>'u.<\/li>\n<li>Yatırım yapılan fonlara ödenen yönetim, giriş ve çıkış ücretleri fon sepeti fonunun gideri sayılır ve toplam gider oranına dahil edilir.<\/li>\n<li>Örnek: 300 milyon TL'lik fon sepeti fonunda tek fon sınırı 60 milyon, serbest fon sınırı 30 milyon TL.<\/li>\n<\/ul>\n<h3>Katılım fonları<\/h3>\n<ul>\n<li>Katılım şemsiye fonu; SPK düzenlemeleri yanında <b>faizsiz finans ilkelerine<\/b> (katılım standartlarına) uyum gerekir. Portföyün <b>tamamı<\/b> devamlı olarak kira sertifikası, katılma hesabı, ortaklık payı, altın ve kıymetli maden ile Kurulca uygun görülen faizsiz araçlardan oluşur.<\/li>\n<li>Vadeli mevduat, devlet tahvili, hazine bonosu, faizli repo alınamaz; yerine katılma hesabı, kira sertifikası, vaad sözleşmesi kullanılır. Faizsiz ilkelere uymayan faaliyetteki şirket payları portföy dışıdır.<\/li>\n<li>Pay seçimi (Rehber 1.6): uygunluğu onaylanmış endekslerin (Katılım 30, Katılım 50 gibi) havuzundan <b>veya<\/b> endeks dışı varlıkta <b>danışman/danışma kurulu onayıyla<\/b>. Onay şartı kira sertifikası, katılma hesabı, altın ve vaad sözleşmesi dışındaki tüm araçlar için geçerlidir. Danışmanın kimliği ve tecrübesi izahname ekinde veya KAP'ta açıklanır.<\/li>\n<li><b>Arındırma (purification):<\/b> faizsiz ilkelere uymayan cüzi gelirler fon malvarlığından veya fon yönetim ücretinden, danışma kurulunun icazetiyle arındırılır. Malvarlığından ödenecekse birim pay değerinde ani düşüş yaratmayacak tedbir alınır ve izahnamede belirtilir. Arındırma döneminin ardından <b>5 iş günü<\/b> içinde tutar ve aktarılan kurum KAP'ta açıklanır. Bağışlanan tutar <b>toplam gider oranına dahil edilmez<\/b>.<\/li>\n<li><b>Para piyasası katılım fonu<\/b> ve <b>kısa vadeli kira sertifikaları katılım fonu<\/b> (Rehber 1.5): konvansiyonel PPF (en fazla 45 gün) ve KVBAF (25-90 gün) vade sınırlarına kıyasen tabidir. PPF'deki <b>%10 DİBS zorunluluğu yoktur<\/b>. Banka hesaplarında toplam <b>%50<\/b>; tek bankada <b>%20<\/b> (konvansiyonelde %6), çünkü katılım bankası sayısı azdır.<\/li>\n<li>Nemalandırma (Rehber 6.6): uygun faizsiz araç yoksa yatırımcının parası nemalandırılmaz, nakit bekletilir.<\/li>\n<\/ul>\n<h3>Serbest fonlar<\/h3>\n<ul>\n<li>Tebliğ m.6/1-d: payları <b>yalnız nitelikli yatırımcılara<\/b> satılan fonlar. Dağıtıcı (TEFAS'ta da) yatırımcının MKK'da nitelikli olduğunu kontrol etmekle yükümlüdür.<\/li>\n<li><b>Yoğunlaşma serbestisi:<\/b> %10 tek ihraççı ve %20 grup limitleri uygulanmaz; izahnamede belirtmek kaydıyla portföyün tamamı tek varlığa yatırılabilir.<\/li>\n<li><b>Kaldıraç<\/b> (Rehber 7.9): genel sınırdan muaf; risk yönetim prosedüründe belirlenip KAP'ta ilan edilen limitler içinde. <b>Açığa satış<\/b> ve <b>kredili işlem<\/b> yapabilir.<\/li>\n<li><b>Opsiyon satıcısı<\/b> olabilir (Rehber 4.2.7/f); genel kural olarak diğer fonlara yasaktır.<\/li>\n<li>Borsa dışından emtiaya dayalı varlıklara erişim (Rehber 7.3/d). Ancak <b>borsa dışı hisse alım satımı<\/b> gibi temel yasaklar sürer; GYF ve GSYF'lere en fazla <b>%25<\/b>.<\/li>\n<li>Portföyün en az %80'i devamlı olarak BİAŞ'ta işlem gören paylarda (MKYO hariç) ise <b>hisse senedi yoğun fon<\/b> sayılır.<\/li>\n<li><b>Geri fiyat<\/b> (Rehber 4.3/b): izahnamede ilgili fon türünün esaslarına uyulacağı taahhüt edilir ve unvanda \"Para Piyasası\" veya \"Kısa Vadeli\" ibaresi yer alırsa uygulanabilir; bu durumda o fonların vade ve portföy sınırlamalarına uyulur.<\/li>\n<li>Fiyat açıklama sıklığı esnek (en az <b>ayda bir<\/b>); daha uzun iade süreleri ve ihbarlı çıkış kurgulanabilir.<\/li>\n<li>Rehber 12.5: BİST'te <b>özel emir<\/b> veya <b>Toptan Satışlar Pazarı<\/b> ortaklık payı işlemlerinde <b>alıcı olamaz<\/b>.<\/li>\n<li>TEFAS'ta işlem görmesi zorunlu değil, kurucunun tercihidir.<\/li>\n<\/ul>\n<table>\n<tr><th>Özellik<\/th><th>Standart fon<\/th><th>Serbest fon<\/th><\/tr>\n<tr><td>Yatırımcı<\/td><td>Herkese açık<\/td><td>Yalnız nitelikli yatırımcı<\/td><\/tr>\n<tr><td>Portföy limitleri<\/td><td>Tabi (ör. %10)<\/td><td>Tebliğ m.17-24 sınırlamalarından muaf<\/td><\/tr>\n<tr><td>Kaldıraç<\/td><td>Kaldıraç yaratan açık pozisyon fon toplam değerini aşamaz<\/td><td>Standart sınırdan muaf<\/td><\/tr>\n<tr><td>Açığa satış<\/td><td>Yasak<\/td><td>Serbest<\/td><\/tr>\n<tr><td>Opsiyon satıcılığı<\/td><td>Yasak<\/td><td>Serbest<\/td><\/tr>\n<tr><td>Fiyat sıklığı<\/td><td>Genellikle günlük<\/td><td>Esnek<\/td><\/tr>\n<tr><td>TEFAS<\/td><td>Zorunlu (istisnalar hariç)<\/td><td>Zorunlu değil<\/td><\/tr>\n<\/table>\n<h3>Düzenli nakit akışı sağlayan (kâr payı ödeyen) fonlar<\/h3>\n<ul>\n<li>Tebliğ fonların katılma payı sahiplerine <b>kâr payı dağıtmasına<\/b> imkan tanır; izahnamede belirtilir, unvanda genellikle \"Kar Payı Ödeyen\" ibaresi bulunur.<\/li>\n<li>Dağıtım fondan nakit çıkışıdır: ödeme günü fon toplam değeri ve birim pay fiyatı dağıtılan tutar kadar <b>düşer<\/b>; yatırımcının toplam varlığı değişmez. Örnek: 50 TL'lik payda 2,5 TL dağıtım → 47,5 TL.<\/li>\n<li>Pay satmadan harcanabilir gelir sağlar; bedeli <b>bileşik getiri etkisinin kaybı<\/b>dır.<\/li>\n<\/ul>\n", "sorular": [{"q": "Bir fonun hisse senedi yoğun fon sayılabilmesi için portföy değerinin en az yüzde kaçının hangi varlıklardan oluşması gerekir?", "o": ["%80'inin Borsa İstanbul'da işlem gören ihraççı paylarından (menkul kıymet yatırım ortaklıkları hariç)", "%51'inin herhangi bir borsadaki paylardan", "%80'inin yabancı paylardan", "%60'ının BIST 30 paylarından", "%90'ının devlet tahvillerinden"], "a": 0, "e": "Hisse senedi yoğun fonda portföyün en az yüzde 80'i MKYO payları hariç BİAŞ'ta işlem gören paylardan oluşur; pay dayanaklı türevler ve varantlar hesaba katılabilir."}, {"q": "Endeks fon unvanını taşıyabilmek için Rehber'e göre aranan koşullar hangisidir?", "o": ["En az 10 ihraççı, tek hisse en fazla yüzde 10", "En az 6 ihraççı, tek hisse en fazla yüzde 30", "En az 6 ihraççı, tek hisse en fazla yüzde 20", "En az 30 ihraççı, tek hisse en fazla yüzde 35", "En az 5 ihraççı, tek hisse en fazla yüzde 40"], "a": 1, "e": "Endeks ve fon portföyü en az altı farklı ihraççı payından oluşmalı ve her hissenin ağırlığı en fazla yüzde 30 olmalıdır."}, {"q": "Bir endeks fonun birim pay değeri ile takip ettiği endeks arasındaki korelasyon katsayısı en az ne olmalıdır?", "o": ["%70", "%80", "%90", "%85", "%95"], "a": 2, "e": "Tebliğ m.23 uyarınca korelasyon katsayısının en az yüzde 90 olması zorunludur."}, {"q": "Endeks fon ile borsa yatırım fonu (BYF) karşılaştırmasında aşağıdakilerden hangisi yanlıştır?", "o": ["Endeks fon her zaman net aktif değer üzerinden işlem görür", "BYF seans boyunca anlık fiyatla işlem görür", "BYF'de piyasa fiyatı ile net aktif değer arasında prim veya iskonto oluşabilir", "Endeks fonun yıllık yönetim ücreti BYF'ye göre genellikle daha düşüktür", "BYF yatırımcısı aracı kuruma işlem komisyonu öder"], "a": 3, "e": "Klasik endeks fonların yönetim ücreti TEFAS ve dağıtıcı yapısı nedeniyle genellikle daha yüksektir; BYF'lerde yönetim ücreti belirgin şekilde düşüktür ama işlem komisyonu ödenir."}, {"q": "Bir iştirak fonu portföyünün tamamını bağlı olduğu grubun şirketlerine yatırmıştır. Bu durumla ilgili hangisi doğrudur?", "o": ["Aynı grup limiti nedeniyle yasaktır", "Uygundur ve tek bir şirkete yüzde 100 yatırım yapılabilir", "Yalnız serbest fon ise uygundur", "Uygundur ancak yüzde 20 tek ihraççı sınırı vardır", "Uygundur; iştirak fonları aynı grup limiti ve 5/40 kuralından muaftır, ancak her şirket için yüzde 10 sınırı geçerlidir"], "a": 4, "e": "İştirak fonları yüzde 20 grup limiti ve 5/40 kuralından muaftır; tek ihraççı limiti yüzde 10 korunur, bu yüzden en az on şirkete yayılmak gerekir."}, {"q": "Sektör fonlarına ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Tek bir şirkete yatırım limiti yüzde 20'dir; 5/40 kuralı ve grup sınırlamaları uygulanmaz", "Unvanda sektör adı için portföyün en az yüzde 51'i o sektörde olmalıdır", "Tek şirket limiti yüzde 10'dur", "Sektör fonları yalnız nitelikli yatırımcıya satılır", "Sektör fonları çeşitlendirme ilkesine en sıkı uyan fonlardır"], "a": 0, "e": "Rehber 2/c'ye göre unvanda sektör ifadesi için yüzde 80 şartı vardır; tek şirket limiti yüzde 20'ye çıkarılmış, 5/40 ve grup sınırları devre dışı bırakılmıştır."}, {"q": "İşlem sırası Borsa İstanbul tarafından kapatılan bir pay, kapanıştan sonraki ilk beş işlem gününde fon fiyatına nasıl yansıtılır?", "o": ["Değeri derhal sıfırlanır", "Makul gerekçe yoksa kapanış öncesi son işlem günü fiyatı kullanılmaya devam edilir", "Yüzde 50 karşılık ayrılır", "Nominal değerle değerlenir", "Karşılaştırma ölçütü getirisiyle güncellenir"], "a": 1, "e": "İlk beş işlem günü bir bekleme sürecidir; aksi yönde gerekçe veya veri yoksa kapanış öncesi son fiyat baz alınır. Karşılık altıncı iş gününden itibaren başlar."}, {"q": "Bir fonun net aktif değerinin yüzde 3'ünü oluşturan 1,8 milyon TL değerindeki payın işlem sırası kapalılığı altıncı iş gününe ulaşmıştır. Her gün ayrılacak karşılık kaç TL'dir?", "o": ["1.800.000 TL", "20.000 TL", "60.000 TL", "36.000 TL", "90.000 TL"], "a": 2, "e": "Ağırlık yüzde 1 ile yüzde 5 arasında olduğundan karşılık 30 gün boyunca eşit ayrılır: 1.800.000 / 30 = 60.000 TL. 20.000 TL 90 günlük takvimin yanlış uygulanmasıdır."}, {"q": "İşlem sırası kapalılığı altıncı iş gününe ulaşan payın fondaki ağırlığı yüzde 0,8 ise karşılık nasıl ayrılır?", "o": ["30 günde eşit tutarlarla", "90 günde eşit tutarlarla", "Karşılık ayrılmaz", "1 gün içinde ayrılarak değer sıfırlanır", "180 günde eşit tutarlarla"], "a": 3, "e": "Ağırlık yüzde 1'e kadarsa karşılık bir gün içinde ayrılır ve pay değeri sıfırlanır."}, {"q": "Değişken fonlarla ilgili hangisi doğrudur?", "o": ["Portföyün en az yüzde 80'ini paylarda tutmak zorundadır", "En az iki varlık grubunun her birinde yüzde 20 tutmak zorundadır", "Karşılaştırma ölçütü yerine eşik değer belirlemesi yasaktır", "Yalnız nitelikli yatırımcıya satılır", "Belirli bir varlık sınıfında asgari yatırım zorunluluğu yoktur; yönetici bir varlığın ağırlığını sıfıra indirebilir"], "a": 4, "e": "Değişken fon diğer fon türlerinin tanımına girmeyen esnek fondur; asgari oran yoktur. İki grupta yüzde 20 şartı karma fonlara aittir."}, {"q": "Bir fonun karma fon sayılabilmesi için portföy yapısı nasıl olmalıdır?", "o": ["En az iki varlık grubunun her biri en az yüzde 20, bu ikisinin toplamı en az yüzde 80", "En az üç varlık grubu, her biri en az yüzde 30", "Tek bir varlık grubunda en az yüzde 80", "Her varlık grubunda en fazla yüzde 50", "Pay ve tahvil eşit ağırlıkta"], "a": 0, "e": "Rehber 1.1'e göre en az iki grubun her biri en az yüzde 20 olmalı ve bu iki grubun toplamı en az yüzde 80 olmalıdır."}, {"q": "Bir portföy yönetim şirketi değişken şemsiye fon altında en fazla kaç fon ihraç edebilir?", "o": ["2", "4", "3", "7", "Sınırsız"], "a": 1, "e": "Her risk değeri grubundan en fazla bir fon olmak şartıyla, risk değerliler dahil en fazla dört fon ihraç edilebilir."}, {"q": "Risk değeri 3-4 aralığında olan değişken fonların unvanında hangi ifade kullanılır?", "o": ["Muhafazakar", "Temkinli", "Dengeli", "Atak", "Agresif"], "a": 2, "e": "1-2 Muhafazakar veya Temkinli, 3-4 Dengeli, 4-5 Atak, Dinamik veya Büyüme, 5-7 Agresif unvanlarını taşır."}, {"q": "Toplam değeri 300 milyon TL olan bir fon sepeti fonu tek bir hisse senedi fonuna 70 milyon TL, bir serbest fona 25 milyon TL yatırım yapmak istemektedir. Hangisi doğrudur?", "o": ["Her iki yatırım da uygundur", "Hisse fonu yatırımı uygundur, serbest fon yatırımı aşar", "Her ikisi de sınırları aşar", "Hisse fonu yatırımı yüzde 20 sınırını (60 milyon) aşar, serbest fon yatırımı yüzde 10 sınırının (30 milyon) içindedir", "Fon sepeti fonları serbest fona yatırım yapamaz"], "a": 3, "e": "Tek fona en fazla yüzde 20 (60 milyon TL), serbest fonlara en fazla yüzde 10 (30 milyon TL) yatırılabilir; 70 milyon aşar, 25 milyon uygundur."}, {"q": "Fon sepeti fonlarına ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Başka bir fon sepeti fonuna yatırım yapamaz", "Bir fonun toplam katılma payı sayısının en fazla yüzde 25'ini alabilir", "Yatırım yapılan fonlara ödenen giriş ve çıkış ücretleri toplam gider oranına dahil edilir", "Yabancı borsalarda işlem gören BYF'ler izahname kuralının dışındadır", "Tek bir BYF'ye yatırım sınırı yüzde 35'tir"], "a": 4, "e": "Tek bir fona veya BYF'ye yatırım sınırı yüzde 20'dir."}, {"q": "Katılım fonlarındaki arındırma işlemiyle ilgili hangisi doğrudur?", "o": ["Arındırma tutarı ve aktarılan kurum, dönemi izleyen 5 iş günü içinde KAP'ta açıklanır", "Arındırılan tutar toplam gider oranına dahil edilir", "Arındırma için SPK onayı gerekir", "Arındırma yalnız yönetim ücretinden yapılabilir", "Arındırma yıllık olarak yapılmak zorundadır"], "a": 0, "e": "Tutar danışma kurulu icazetiyle fon malvarlığından veya yönetim ücretinden karşılanır, 5 iş günü içinde KAP'ta açıklanır ve toplam gider oranına dahil edilmez."}, {"q": "Bir para piyasası katılım fonu fon toplam değerinin yüzde 18'ini tek bir katılım bankasında katılma hesabı olarak tutmaktadır. Bu durum için hangisi doğrudur?", "o": ["Aykırıdır, tek banka sınırı yüzde 6'dır", "Uygundur, para piyasası katılım fonlarında tek banka sınırı yüzde 20'dir", "Aykırıdır, tek banka sınırı yüzde 10'dur", "Uygundur, sınır yoktur", "Aykırıdır, katılma hesabı bu fonlarda yasaktır"], "a": 1, "e": "Konvansiyonel PPF'de tek banka sınırı yüzde 6 iken para piyasası katılım fonlarında katılım bankası sayısının azlığı nedeniyle yüzde 20'dir; toplam sınır yüzde 50'dir."}, {"q": "Para piyasası katılım fonlarıyla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Portföyün en az yüzde 10'unu DİBS'te tutmak zorundadır", "Tekil varlık vadesi sınırı yoktur", "Konvansiyonel PPF vade sınırlarına kıyasen tabidir ve asgari DİBS zorunluluğundan muaftır", "Faizli repo yapabilir", "TEFAS'ta işlem görmesi zorunludur"], "a": 2, "e": "Rehber 4.9'daki yüzde 10 DİBS zorunluluğu unvanında katılım bulunan fonları kapsamaz; vade kuralları konvansiyonel PPF'ye kıyasen uygulanır."}, {"q": "Serbest fonlarla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Payları yalnız nitelikli yatırımcılara satılabilir", "Opsiyon satıcısı olabilir", "Tek ihraççı limiti yüzde 10 uygulanmaz", "Borsa İstanbul'da Toptan Satışlar Pazarı işlemlerinde alıcı taraf olabilir", "Gayrimenkul ve girişim sermayesi yatırım fonlarına en fazla yüzde 25 yatırım yapabilir"], "a": 3, "e": "Rehber 12.5 uyarınca serbest fonlar özel emir yoluyla veya Toptan Satışlar Pazarı'nda gerçekleşen ortaklık payı işlemlerinde alıcı olamaz."}, {"q": "Bir serbest fonun geri fiyat yöntemini uygulayabilmesi için hangi şart aranır?", "o": ["Fonun TEFAS'ta işlem görmesi", "Fon büyüklüğünün belli bir tutarı aşması", "Yalnız hisse senedine yatırım yapması", "SPK'dan ayrıca izin alınması", "Unvanında Para Piyasası veya Kısa Vadeli ibaresi bulunması ve izahnamede ilgili fon türünün esaslarına uyulacağının taahhüt edilmesi"], "a": 4, "e": "Rehber 4.3/b'ye göre serbest fon, unvanında bu ibareler bulunur ve izahnamede o fon türünün yönetim esaslarına uyulacağı taahhüt edilirse geri fiyat uygulayabilir; vade ve portföy sınırlarına da uyar."}, {"q": "Birim pay değeri 50 TL olan kâr payı ödeyen bir fon pay başına 2,5 TL nakit dağıtmıştır. Dağıtım günü piyasada fiyat değişimi olmadığı varsayılırsa birim pay değeri ne olur?", "o": ["47,50 TL", "50,00 TL", "52,50 TL", "48,75 TL", "45,00 TL"], "a": 0, "e": "Dağıtım fondan nakit çıkışıdır; birim pay değeri dağıtılan tutar kadar azalır: 50 - 2,5 = 47,50 TL. Yatırımcının toplam varlığı değişmez."}, {"q": "Kâr payı ödeyen fonların büyüme odaklı fonlara göre yatırımcı açısından fırsat maliyeti nedir?", "o": ["Vergi avantajının kaybı", "Bileşik getiri etkisinin kısmen kaybı", "Likidite kaybı", "Daha yüksek yönetim ücreti zorunluluğu", "Payların satılamaması"], "a": 1, "e": "Nakdin düzenli olarak fondan çıkması, kârın fonda kalarak yaratacağı bileşik büyüme potansiyelinden kısmen feragat edilmesi demektir."}]}, {"id": 11, "kisa": "Fon Fiyatı, Ücret ve Risk", "baslik": "Yatırım Fonlarında Fiyatlama, Operasyon, Ücretlendirme, Performans Ücreti ve Risk Değeri", "ozet": "İleri ve geri fiyat, emir saati ve valör, nemalandırma, ödeme yöntemleri ve TEFAS, azami fon toplam gider oranları ve iade, karşılaştırma ölçütü ve eşik değer, performans ücreti ile fon risk değerinin hesaplanması.", "notlar": "\n<h3>İleri fiyat ve geri fiyat<\/h3>\n<ul>\n<li><b>İleri fiyat:<\/b> PPF ve KVBAF <b>dışındaki<\/b> tüm menkul kıymet yatırım fonlarında (hisse, borçlanma araçları, değişken, kıymetli maden vb.) zorunlu. Emir, verilmesini takip eden <b>ilk hesaplamada<\/b> bulunacak fiyattan gerçekleşir; yatırımcı emri verirken fiyatı bilmez. Gün içi fiyat hareketlerinden doğan arbitrajı önler.<\/li>\n<li><b>Geri fiyat:<\/b> PPF ve KVBAF'te; unvanında \"Para Piyasası\" veya \"Kısa Vadeli\" bulunan ve buna uygun yönetilen serbest fonlarda da kullanılabilir. Emir en son ilan edilmiş, bilinen fiyattan gerçekleşir; aynı gün valörlü (T+0) yönetim mümkündür.<\/li>\n<li>Bilgilendirme dokümanlarında belirtilmek koşuluyla PPF ve KVBAF'te alım ve satım <b>farklı birim pay fiyatlarından<\/b> gerçekleştirilebilir.<\/li>\n<\/ul>\n<h3>Emir iletim saati ve valör<\/h3>\n<ul>\n<li>Kritik eşik saati (cut-off) <b>izahnamede<\/b> belirlenir; <b>13:30<\/b> piyasa standardıdır ama fona göre değişebilir.<\/li>\n<li>Saatten önce verilen emir <b>T günü<\/b> emri sayılır, T günü kapanış fiyatından gerçekleşir. Saatten sonra verilen emir <b>bir sonraki iş günü (T+1)<\/b> verilmiş kabul edilir.<\/li>\n<li><b>Valör:<\/b> işlemin fiyata bağlandığı tarihin üzerine eklenen takas süresi.<\/li>\n<li>Kitap örneği: satım valörü T+2, Pazartesi 14:00 emir → Salı emri sayılır, Salı fiyatı, nakit <b>Perşembe<\/b>.<\/li>\n<li>Örnek: Perşembe 14:00 satım, T+2 → Cuma fiyatı; nakit Cuma + 2 iş günü = <b>Salı<\/b>.<\/li>\n<\/ul>\n<h3>Nemalandırma (Rehber 6.6)<\/h3>\n<ul>\n<li>İleri fiyatlı fonlarda alım bedeli, işlem gerçekleşene kadar <b>yatırımcı lehine değerlendirilmek zorundadır<\/b>.<\/li>\n<li>Faizsiz/katılım fonu tercih eden yatırımcıda yalnız <b>uygun faizsiz araç varsa<\/b> nemalandırılır; yoksa nemalandırılmaz.<\/li>\n<li>Operasyonel altyapı uygunsa yatırımcının <b>yazılı talebiyle<\/b> nemalandırma yapılmayabilir.<\/li>\n<\/ul>\n<h3>Ödeme yöntemleri<\/h3>\n<ul>\n<li>Alım satım Kurulca yetkilendirilmiş PYŞ'ler veya aracı kurumlar aracılığıyla; alımda birim pay değerinin tam olarak <b>nakden<\/b> ödenmesi esastır. Yatırım kuruluşları <b>kredi kartıyla<\/b> fon alımı imkanı sunabilir. Satımda fonun <b>nakit ödeme<\/b> yükümlülüğü vardır.<\/li>\n<li>Paylar <b>küsuratlı<\/b> ihraç edilip geri alınabilir; teminat ve virman işlemlerinde tam sayı esastır.<\/li>\n<li>Fon toplam değerinin <b>en az %80<\/b>'ini yabancı para ve sermaye piyasası araçlarına yatıran ve unvanında \"(Döviz)\" bulunan fonlarda, pay grubu oluşturularak TCMB'nin kur ilan ettiği <b>yabancı paralarla<\/b> da alım satım yapılabilir.<\/li>\n<li>Unvanında \"altın\" bulunan fonlarda <b>Kurul onayıyla<\/b> altınla alım satım: yatırımcının bankada <b>altın yatırım hesabı<\/b> olmalı; birim pay değeri TL ve ilgili saflıktaki altın cinsinden ilan edilir; portföye borsada işlem gören varlıklar borsa kanalıyla alınır (Tebliğ m.19/1); esaslar izahnamede yer alır.<\/li>\n<\/ul>\n<h3>TEFAS<\/h3>\n<ul>\n<li><b>Takasbank<\/b> tarafından işletilir. Genel kural: fonların platforma üye olması ve paylarının TEFAS'ta alınıp satılması zorunludur.<\/li>\n<li>Zorunlu olmayanlar (kurucu talebiyle kote edilebilir): <b>PPF, KVBAF, bunların katılım esaslıları ve serbest fonlar<\/b>.<\/li>\n<li>TEFAS'ta <b>işlem göremeyenler:<\/b> özel fon, gayrimenkul yatırım fonları, girişim sermayesi yatırım fonları, garantili fon ve koruma amaçlı fonlar.<\/li>\n<li>Emir iletiminde yatırım kuruluşlarının merkez, şube ve internet şubeleri, PYŞ'lerin merkez ve şubeleri kullanılır; <b>ATM ve mobil uygulamalar<\/b> üzerinden de emir iletilebilir.<\/li>\n<\/ul>\n<h3>Ücretlendirme ve azami gider oranları<\/h3>\n<ul>\n<li><b>Fon yönetim ücreti<\/b> en büyük kesinti kalemidir; aktif büyüklük üzerinden günlük alınır, fon zarar etse de tahsil edilir. Yönetim ücreti + denetim, saklama, kurul kayıt, noter, ilan giderleri = <b>fon toplam gideri<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Fon türü<\/th><th>Günlük<\/th><th>Yıllık azami<\/th><\/tr>\n<tr><td>Para piyasası fonları<\/td><td>Yüzbinde 4,5<\/td><td>%1,65<\/td><\/tr>\n<tr><td>Koruma amaçlı ve garantili, kıymetli maden fonları, unvanında endeks olan fonlar<\/td><td>Yüzbinde 6<\/td><td>%2,19<\/td><\/tr>\n<tr><td>Kısa vadeli borçlanma araçları ve kısa vadeli kira sertifikaları katılım fonları<\/td><td>Yüzbinde 7<\/td><td>%2,56<\/td><\/tr>\n<tr><td>Fon sepeti fonları<\/td><td>Yüzbinde 12<\/td><td>%4,38<\/td><\/tr>\n<tr><td>Diğer fonlar (ör. hisse senedi fonu)<\/td><td>Yüzbinde 10<\/td><td>%3,65<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Serbest şemsiye fonlar<\/b> azami gider sınırlamasından <b>muaftır<\/b> (Tebliğ m.25).<\/li>\n<li>Kontrol: <b>3, 6, 9 ve 12 aylık<\/b> dönemlerin son iş günü itibarıyla, dönem günlük ortalama fon toplam değeri esas alınarak kurucu kontrol eder. Aşım varsa aşan tutar dönemi izleyen <b>5 iş günü<\/b> içinde fona iade edilir; bundan <b>kurucu ve portföy saklayıcısı<\/b> sorumludur. İade tutarı yıl içindeki sonraki dönem hesaplarında giderlerden düşülür.<\/li>\n<li>Limit içinde kalınsa bile fondan yapılabilecek harcamalar dışında gider tahakkuk ettirilemez. İlk ihraç veya tasfiye halinde kontroller satışta olunan günler dikkate alınarak yapılır.<\/li>\n<li>Azami oran, gerçekleşen oran, iade tutarı ve gider dağılımı dönem bitimini izleyen <b>6 iş günü<\/b> içinde KAP'ta ilan edilir.<\/li>\n<li>Yönetim ücreti (günlük ve yıllık) kurucunun internet sitesinde ve KAP'ta ilan edilir.<\/li>\n<li><b>Giriş-çıkış komisyonu<\/b> izahname ve yatırımcı bilgi formunda şartları belirtilerek uygulanabilir; ancak kurucu, yönetici ve bunlarla ilişkili olanların kurduğu veya yönettiği fonların payları portföye alınırsa bu fonlara giriş-çıkış komisyonu <b>ödenemez<\/b>.<\/li>\n<li>Aracı kurum komisyon bilgileri (unvan, toplam komisyon, ortalama oran, işlem hacmi oranı) her üç aylık dönemi izleyen <b>10 iş günü<\/b> içinde, yıl başından kümülatif olarak KAP'ta açıklanır.<\/li>\n<\/ul>\n<h3>Karşılaştırma ölçütü ve eşik değer (VII-128.5 Tebliğ)<\/h3>\n<ul>\n<li>Her fon stratejisine uygun bir <b>karşılaştırma ölçütü<\/b> belirlemek zorundadır; getiri ölçütle birlikte raporlanır, nispi başarı ölçülür.<\/li>\n<li>Genel kabul görmüş yurt içi/yurt dışı endeksler veya Kurulca uygun görülen endeksler kullanılır. Portföy dağılımından bağımsız olarak <b>döviz, enflasyon gibi endeksler karşılaştırma ölçütü olamaz<\/b> (performans raporunda bilgi olarak verilebilir).<\/li>\n<li>Karma stratejide ağırlıklı ölçüt: K = Σ (ağırlık x endeks getirisi). Kitap örneği: %60 x %15 + %20 x %20 + %20 x %5 = <b>%14<\/b>.<\/li>\n<li>Aynı kategorideki tüm fonların ağırlıklı ortalama getirisi de ölçüt olabilir.<\/li>\n<li><b>20.06.2018 tarihli, 26/740 sayılı Kurul Kararı:<\/b> ölçütte pay endeksi varsa <b>pay fiyat endeksleri değil, pay getiri endeksleri<\/b> kullanılır.<\/li>\n<li><b>Eşik değer:<\/b> tutarlı bir endeks belirlenemeyen fonlarda kullanılır; varlıklardan bağımsız, sabit ve/veya değişken unsurlu olabilir (ör. en büyük beş bankanın 1 yıllık mevduat faizi ortalaması, ortalama + %1, döviz kuru değişimi, sabit getiri).<\/li>\n<li>Dönem başında belirlenen eşik değer, <b>gecelik TL referans faiz oranının<\/b> döneme denk gelen bileşik getirisinden düşükse, eşik değer olarak o bileşik getiri kullanılır.<\/li>\n<li><b>Serbest fonlar ve özel fonlar<\/b> için ölçüt veya eşik değer belirlemek <b>ihtiyaridir<\/b>.<\/li>\n<\/ul>\n<h3>Performans ücreti<\/h3>\n<ul>\n<li>Esaslar ve hesaplama örnekleri içtüzük ve kamuyu aydınlatma dokümanlarında yer almalıdır. Aksi belirlenmedikçe hesap dönemi aynı zamanda performans dönemidir. Dönem içinde iade edilen paylar için <b>iade tarihi<\/b> esas alınır; hesaplamalarda <b>ilk giren ilk çıkar<\/b> yöntemi uygulanır.<\/li>\n<li>Oran sabit veya değişken olabilir; yabancı kolektif yatırım kuruluşları, serbest fonlar ve özel fonlar hariç <b>nispi getiri üzerinden azami %20<\/b>.<\/li>\n<li><b>Nispi getiri<\/b> = portföyün vergi öncesi getirisi - karşılaştırma ölçütü (veya eşik değer) getirisi.<\/li>\n<li>Tahakkuk için iki şart: <b>nispi getiri pozitif<\/b> ve <b>yüksek iz değer aşılmış<\/b> olmalı. Fon pozitif getiri sağlasa bile ölçütün altında kaldıysa ücret alınamaz.<\/li>\n<li>Tahsilat yatırımcı hesabından nakit olarak; nakit yoksa katılma payları nakde çevrilerek.<\/li>\n<li>Örnek: fon %28, ölçüt %21 → nispi %7; azami ücret 0,07 x 0,20 = <b>%1,4<\/b>.<\/li>\n<li><b>Yüksek iz değer (high water mark):<\/b> fiyat daha önce ücret ödenen en yüksek seviyeyi geçmedikçe yeniden ücret alınamaz. İlk yüksek iz değer yatırımcının <b>alış fiyatı<\/b>dır; ücret alınan her dönem sonunda güncellenir; <b>her pay alım işlemi için ayrı ayrı<\/b> tespit edilir.<\/li>\n<\/ul>\n<h3>Fonun risk değeri<\/h3>\n<ul>\n<li>Yatırımcı bilgi formunun kritik unsuru; volatiliteye göre <b>1-7<\/b> arası.<\/li>\n<li>Volatilite hesabında <b>haftalık<\/b> getiriler esas alınır (garantili ve koruma amaçlı fonlarda <b>iki haftalık<\/b>); dönem <b>5 yıl<\/b>, T = 260 hafta.<\/li>\n<li>Adımlar: haftalık getirilerin ortalaması → sapmaların kareleri toplamı → <b>T-1<\/b>'e bölme (örneklem varyansı) → karekök (haftalık standart sapma) → <b>√52<\/b> ile çarpma (<b>zamanın karekökü kuralı<\/b>) = yıllık volatilite.<\/li>\n<li>Örnek: haftalık %1,8 x 7,211 ≈ %12,98 → RD 4.<\/li>\n<\/ul>\n<table>\n<tr><th>Risk değeri<\/th><th>Yıllık volatilite<\/th><\/tr>\n<tr><td>1<\/td><td>%0 - %2<\/td><\/tr>\n<tr><td>2<\/td><td>%2 - %5<\/td><\/tr>\n<tr><td>3<\/td><td>%5 - %10<\/td><\/tr>\n<tr><td>4<\/td><td>%10 - %15<\/td><\/tr>\n<tr><td>5<\/td><td>%15 - %20<\/td><\/tr>\n<tr><td>6<\/td><td>%20 - %30<\/td><\/tr>\n<tr><td>7<\/td><td>%30 ve üzeri<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Güncelleme:<\/b> son <b>4 ay<\/b> içinde haftalık hesaplanan risk değerleri mevcut değerden farklı kategoriyi gösteriyorsa güncelleme zorunludur; birden fazla kategori arasında değişmişse <b>en sık<\/b> yer alınan kategori esas alınır.<\/li>\n<li>Değişiklik <b>yatırım stratejisi değişikliğinden<\/b> kaynaklanıyorsa kurucu risk değerini bu değişikliği esas alarak yeniden belirler; piyasa dalgalanmasıyla olağan dışı değişiklikte güncelleme geciktirilmeden yapılır.<\/li>\n<li><b>Yetersiz veri:<\/b> 5 yıllık veri yoksa eksik dönem karşılaştırma ölçütünün getirileriyle tamamlanır; ölçütün de 5 yıllık verisi yoksa ölçüt volatilitesine dayalı <b>simülasyon getirileri<\/b> kullanılır.<\/li>\n<\/ul>\n", "sorular": [{"q": "İleri fiyat uygulaması hangi fonlarda zorunlu değildir?", "o": ["Para piyasası fonları ve kısa vadeli borçlanma araçları fonları", "Hisse senedi fonları", "Değişken fonlar", "Kıymetli madenler fonları", "Borçlanma araçları fonları"], "a": 0, "e": "İleri fiyat PPF ve KVBAF dışındaki tüm menkul kıymet yatırım fonlarında zorunludur; PPF ve KVBAF geri fiyatla çalışır."}, {"q": "Geri fiyat uygulamasıyla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Emir, verilmesini izleyen ilk hesaplamada bulunacak fiyattan gerçekleşir", "Emir, en son ilan edilmiş ve yatırımcının bildiği fiyattan gerçekleşir", "Yalnız hisse senedi fonlarında uygulanır", "Serbest fonlarda hiçbir koşulda uygulanamaz", "Yatırımcının nakdini ancak T+2 valörüyle almasına izin verir"], "a": 1, "e": "Geri fiyatta işlem son ilan edilmiş bilinen fiyattan yapılır ve aynı gün valörlü yönetim mümkündür; şartları sağlayan serbest fonlar da uygulayabilir."}, {"q": "Kritik emir saati 13:30, satım valörü T+2 olan ileri fiyatlı bir fonda yatırımcı Perşembe saat 14:00'te satış talimatı vermiştir. Resmi tatil olmadığına göre hangisi doğrudur?", "o": ["Perşembe fiyatından işlem görür, nakit Pazartesi geçer", "Cuma fiyatından işlem görür, nakit Pazartesi geçer", "Cuma fiyatından işlem görür, nakit Salı geçer", "Perşembe fiyatından işlem görür, nakit Cumartesi geçer", "Pazartesi fiyatından işlem görür, nakit Çarşamba geçer"], "a": 2, "e": "Saat aşıldığı için emir Cuma verilmiş sayılır ve Cuma fiyatından gerçekleşir; Cuma'ya iki iş günü eklenince nakit Salı günü hesaba geçer."}, {"q": "Kritik saat 13:30 olan ileri fiyatlı bir fona Salı 11:00'de verilen alım talimatı hangi günün fiyatından gerçekleşir?", "o": ["Pazartesi kapanış fiyatından", "Çarşamba günü hesaplanacak fiyattan", "Emir anındaki son ilan edilmiş fiyattan", "Salı günü hesaplanacak fiyattan", "Perşembe fiyatından"], "a": 3, "e": "Kritik saatten önce verilen emir T günü emri sayılır ve o gün piyasa kapandıktan sonra hesaplanan fiyattan gerçekleşir."}, {"q": "İleri fiyatlı fonlarda alım talimatı ile işlemin gerçekleşmesi arasında yatırımcıdan tahsil edilen tutarla ilgili kural nedir?", "o": ["Faizsiz bekletilir", "Kurucu lehine değerlendirilir", "Saklayıcıda bloke edilir ve gelir fona yazılır", "Yalnız 100.000 TL üzeri tutarlarda nemalandırılır", "Yatırımcı lehine nemalandırılmak zorundadır; katılım fonlarında uygun faizsiz araç yoksa nemalandırılmaz"], "a": 4, "e": "Rehber 6.6'ya göre bedel işlem gerçekleşene kadar yatırımcı lehine değerlendirilir; katılım fonlarında uygun faizsiz araç yoksa nemalandırılmaz, yazılı talep halinde de yapılmayabilir."}, {"q": "Fon katılma payı işlemleriyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Fon katılma payı satışında fon, ödemeyi kredi kartına iade şeklinde yapmak zorundadır", "Yatırım kuruluşları kredi kartıyla fon alımı imkanı sunabilir", "Paylar küsuratlı olarak ihraç edilip geri alınabilir", "Teminat ve virman işlemlerinde pay bütünlüğü esastır", "Unvanında altın bulunan fonlarda Kurul onayıyla altınla alım satım yapılabilir"], "a": 0, "e": "Katılma payı satışında fonun nakit ödeme yükümlülüğü vardır; kredi kartı yalnız alımda kullanılabilecek bir imkandır."}, {"q": "Aşağıdaki fonlardan hangisinin katılma payları TEFAS'ta işlem göremez?", "o": ["Para piyasası fonu", "Gayrimenkul yatırım fonu", "Kısa vadeli borçlanma araçları fonu", "Serbest fon", "Hisse senedi fonu"], "a": 1, "e": "Özel fon, GYF, GSYF, garantili ve koruma amaçlı fonlar TEFAS'ta işlem göremez; PPF, KVBAF ve serbest fonlar ise kurucu talebiyle kote edilebilir."}, {"q": "Para piyasası fonları için uygulanan yıllık azami fon toplam gider oranı yüzde kaçtır?", "o": ["%2,19", "%2,56", "%1,65", "%3,65", "%4,38"], "a": 2, "e": "PPF'lerde günlük yüzbinde 4,5, yıllık yüzde 1,65'tir. %2,56 kısa vadeli borçlanma araçları, %3,65 diğer fonlar, %4,38 fon sepeti fonlarıdır."}, {"q": "Fon sepeti fonları için azami fon toplam gider oranı günlük ve yıllık olarak hangisidir?", "o": ["Yüzbinde 4,5 ve %1,65", "Yüzbinde 6 ve %2,19", "Yüzbinde 7 ve %2,56", "Yüzbinde 12 ve %4,38", "Yüzbinde 10 ve %3,65"], "a": 3, "e": "Fon sepeti fonlarında sınır günlük yüzbinde 12, yıllık yüzde 4,38'dir."}, {"q": "Bir hisse senedi fonunda dönem sonu kontrolünde yıllıklandırılmış fon toplam gider oranının yüzde 3,90 olduğu görülmüştür. Hangisi doğrudur?", "o": ["Sınır yüzde 4,38 olduğundan sorun yoktur", "Aşan tutar yıl sonunda yatırımcılara nakden ödenir", "Yalnız SPK'ya bildirim yapılır", "Aşan tutar 30 gün içinde yönetim ücretinden mahsup edilir", "Yüzde 3,65 sınırı aşılmıştır; aşan tutar dönemi izleyen 5 iş günü içinde fona iade edilir, kurucu ve saklayıcı sorumludur"], "a": 4, "e": "Diğer fonlar kategorisindeki hisse senedi fonunda yıllık sınır yüzde 3,65'tir; aşan tutar 5 iş günü içinde fona iade edilir."}, {"q": "Fon toplam gider oranı ve varsa iade tutarı ile gider dağılımı, 3, 6, 9 ve 12 aylık dönemlerin bitimini izleyen kaç iş günü içinde KAP'ta ilan edilir?", "o": ["6 iş günü", "3 iş günü", "5 iş günü", "10 iş günü", "15 iş günü"], "a": 0, "e": "Gider oranı, iade tutarı ve dağılım dönem bitimini izleyen altı iş günü içinde KAP'ta ilan edilir; iade ise beş iş gününde yapılır."}, {"q": "Fon toplam gider oranı sınırlamalarından muaf olan fon türü hangisidir?", "o": ["Endeks fonlar", "Serbest şemsiye fonlar", "Fon sepeti fonları", "Para piyasası fonları", "Kıymetli madenler fonları"], "a": 1, "e": "Tebliğ m.25 uyarınca serbest şemsiye fonlar azami gider sınırlamalarından muaftır."}, {"q": "Bir fonun stratejisi portföyün yüzde 50'sini kısa vadeli tahvil, yüzde 30'unu orta vadeli tahvil, yüzde 20'sini paylarda tutmaktır. Dönemde ilgili endekslerin getirileri sırasıyla yüzde 18, yüzde 12 ve yüzde 30'dur. Ağırlıklı karşılaştırma ölçütü getirisi yüzde kaçtır?", "o": ["%20,0", "%16,4", "%18,6", "%19,8", "%15,0"], "a": 2, "e": "K = 0,50 x 0,18 + 0,30 x 0,12 + 0,20 x 0,30 = 0,09 + 0,036 + 0,06 = yüzde 18,6. Yüzde 20 basit ortalamadır."}, {"q": "Karşılaştırma ölçütü belirlenmesiyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Ölçütte pay endeksi varsa pay getiri endeksleri kullanılır", "Aynı kategorideki fonların ağırlıklı ortalama getirisi ölçüt olabilir", "Serbest fonlar için ölçüt belirlemek ihtiyaridir", "Portföy dağılımından bağımsız olarak döviz veya enflasyon endeksleri karşılaştırma ölçütü olarak kullanılabilir", "Karma stratejilerde endekslerin ağırlıklı ortalaması kullanılabilir"], "a": 3, "e": "Portföy dağılımından bağımsız olarak döviz, enflasyon gibi endeksler karşılaştırma ölçütü olarak kullanılamaz; yalnız performans raporunda bilgi olarak verilebilir."}, {"q": "Dönem başında belirlenen eşik değer, gecelik TL referans faiz oranının döneme denk gelen bileşik getirisinden düşükse ne yapılır?", "o": ["Eşik değer olduğu gibi kullanılır", "Performans ücreti alınması yasaklanır", "Eşik değer sıfır kabul edilir", "Karşılaştırma ölçütü olarak BIST 100 kullanılır", "Eşik değer olarak gecelik TL referans faiz oranının döneme denk gelen bileşik getirisi kullanılır"], "a": 4, "e": "Eşik değer bu bileşik getiriden düşükse eşik değer olarak gecelik TL referans faiz oranının döneme denk gelen bileşik getirisi esas alınır."}, {"q": "Bir değişken fon dönemde vergi öncesi yüzde 28 getiri sağlamış, karşılaştırma ölçütü yüzde 21 getiri sağlamıştır. İzahnamede performans ücretinin nispi getirinin azami oranı üzerinden alınacağı belirtilmişse alınabilecek performans ücreti oranı yüzde kaçtır?", "o": ["%1,4", "%5,6", "%7,0", "%4,2", "%2,8"], "a": 0, "e": "Nispi getiri 28 - 21 = yüzde 7; azami oran nispi getirinin yüzde 20'si: 0,07 x 0,20 = yüzde 1,4. %5,6 toplam getirinin yüzde 20'sidir ve yanlıştır."}, {"q": "Performans ücretinin tahakkuk ettirilebilmesi için hangi koşullar birlikte sağlanmalıdır?", "o": ["Fonun mutlak getirisinin pozitif olması ve fon büyüklüğünün artması", "Nispi getirinin pozitif olması ve yüksek iz değerin aşılması", "Fon getirisinin enflasyonu aşması", "Yatırımcıların yazılı onayı", "Fonun en az bir yıllık olması"], "a": 1, "e": "Performans ücreti için nispi getirinin pozitif olması ve yüksek iz değerin aşılması zorunludur."}, {"q": "Bir yatırımcı fon payını 100 TL'den almış, yönetici fiyat 150 TL'deyken performans ücreti almıştır. Fiyat sonra 120 TL'ye düşmüş, ardından 140 TL'ye yükselmiş ve fon bu dönemde ölçütünü aşmıştır. Yönetici şimdi performans ücreti alabilir mi?", "o": ["Evet, nispi getiri pozitif olduğu için", "Evet, fiyat alış fiyatı olan 100 TL'nin üzerinde olduğu için", "Hayır, fiyat yüksek iz değer olan 150 TL'yi aşmadığı için", "Hayır, performans ücreti yalnız serbest fonlarda alınabilir", "Evet, ancak oran yarıya iner"], "a": 2, "e": "Yüksek iz değer, ücret alınan dönem sonunda 150 TL'ye güncellenmiştir; 140 TL bu seviyenin altında olduğundan ücret alınamaz."}, {"q": "Yüksek iz değerle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Tüm yatırımcılar için fonun ilk ihraç fiyatıdır", "Her yıl başında sıfırlanır", "Yalnız karşılaştırma ölçütünün en yüksek değeridir", "Bir yatırımcı için ilk yüksek iz değer, katılma payını satın alma fiyatıdır ve her pay alım işlemi için ayrı tespit edilir", "Performans ücreti alınmasa da her ay güncellenir"], "a": 3, "e": "İlk yüksek iz değer yatırımcının alış fiyatıdır; ücret alınan her dönem sonunda güncellenir ve her pay alım işlemi için ayrı belirlenir."}, {"q": "Bir fonun haftalık getirilerinin standart sapması yüzde 1,8'dir. 52'nin karekökü 7,211 alınırsa fonun yıllık volatilitesi ve risk değeri nedir?", "o": ["%9,36 ve 3", "%12,98 ve 5", "%93,6 ve 7", "%2,5 ve 2", "%12,98 ve 4"], "a": 4, "e": "Yıllık volatilite = 1,8 x 7,211 = yüzde 12,98; yüzde 10-15 aralığı risk değeri 4'tür. %93,6 haftalığı 52 ile çarpmanın hatasıdır."}, {"q": "Haftalık getiri standart sapması yüzde 0,6 olan bir fonun risk değeri kaçtır?", "o": ["2", "1", "3", "4", "5"], "a": 0, "e": "0,6 x 7,211 = yaklaşık yüzde 4,33; yüzde 2-5 aralığı risk değeri 2'dir."}, {"q": "Fon risk değeri hesaplamasında kullanılan veri ve yöntemle ilgili hangisi yanlıştır?", "o": ["Genel kural olarak haftalık getiriler kullanılır", "Haftalık standart sapma 52 ile çarpılarak yıllıklandırılır", "Dönem beş yıldır", "Garantili ve koruma amaçlı fonlarda iki haftalık getiriler kullanılır", "Kareler toplamı gözlem sayısının bir eksiğine bölünür"], "a": 1, "e": "Yıllıklandırmada zamanın karekökü kuralı uygulanır; haftalık standart sapma 52 ile değil 52'nin karekökü ile çarpılır."}, {"q": "Risk değeri 3 olan bir fonun son dört ay içindeki haftalık hesaplamaları piyasa dalgalanması nedeniyle çoğunlukla risk değeri 4'ü göstermektedir. Hangisi doğrudur?", "o": ["Risk değeri değiştirilemez", "Bir yıl beklenmelidir", "Risk değeri güncellenmelidir; dört aylık dönemde en sık yer alınan kategori esas alınır", "Yalnız strateji değişirse güncelleme yapılır", "Risk değeri ortalama alınarak 3,5 olarak ilan edilir"], "a": 2, "e": "Son dört ayda hesaplanan değerler mevcut kategoriden farklıysa güncelleme zorunludur; birden fazla kategori varsa en sık yer alınan kategori esas alınır."}, {"q": "Beş yıllık getiri verisi bulunmayan yeni bir fonun risk değeri nasıl hesaplanır?", "o": ["Hesaplanmaz, 7 kabul edilir", "Yalnız mevcut verilerle hesaplanır", "Kurucunun beyanı esas alınır", "Eksik dönem karşılaştırma ölçütünün getirileriyle tamamlanır; ölçütün de verisi yoksa simülasyon getirileri kullanılır", "Aynı kategorideki fonların ortalaması kullanılır"], "a": 3, "e": "Eksik dönem ölçüt getirileriyle tamamlanır; ölçütün beş yıllık verisi yoksa ölçüt volatilitesine dayalı simülasyon getirileriyle beş yıllık seri oluşturulur."}]}, {"id": 12, "k
