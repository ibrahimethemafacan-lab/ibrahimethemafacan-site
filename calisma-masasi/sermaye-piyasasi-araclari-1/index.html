t çok net. Esas sözleşmede yönetim kurulunun yetkisi açıkça yazmıyorsa, yönetim kurulu tek başına karar alamaz.", "Kararda en az iki şey olmalı. Birincisi ihraç edilecek azami tutar. İkincisi satışın yurt içinde halka arzla mı, halka arz edilmeksizin mi, yoksa yurt dışında mı yapılacağı. Karardan sonra Kurula en geç bir yıl içinde başvurulur. Bu başvuru zorunluluğu yurt dışı ihraçlar için de geçerli.", "Gelelim ihraç limitine. Halka açık bir şirket özkaynağının beş katına kadar borçlanabilir. Halka açık olmayan şirket ise özkaynağının üç katına kadar. Hesapta konsolide tablolar varsa onlar esas alınır. Bir de ayrıcalık var. Yatırım yapılabilir seviyenin en yüksek ilk üç kademesinde not alan bankaların limiti yüzde yüz artırılır, yani ikiye katlanır.", "Hesap sorusu şöyle gelir. Halka açık bir şirketin özkaynağı sekiz yüz milyon lira olsun. Limit dört milyar liradır. Tedavülde altı yüz milyon liralık tahvil, tavan içinde henüz satılmamış dört yüz milyon liralık bono varsa ikisini de düşersin. Kalan limit üç milyar lira olur. Satılmamış kısmı düşmeyi unutma.", "Satış yöntemlerine geçelim. Halka arz bir yol, halka arz edilmeksizin satış diğer yol. Türkiye'de özel sektör en çok ikincisini seçiyor, çünkü daha hızlı ve ucuz. Halka arz edilmeksizin satışta izahname yerine ihraç belgesi hazırlanır. İhraç belgesi onaydan itibaren bir yıl geçerlidir. Hazine ise dört bin yedi yüz kırk dokuz sayılı Kanun gereği tavan onayından muaftır.", "Halka arz edilmeksizin satışın iki türü var. Nitelikli yatırımcıya satışta yatırımcı sayısı sınırı yoktur. Tahsisli satışta ise belirli bir anda yatırımcı sayısı yüz elliyi geçemez. Ama bu sayıya nitelikli yatırımcılar dahil edilmez. Yüz kırk beş bireysel artı kırk nitelikli yatırımcı varsa sınır aşılmamıştır. Sayı yüz elliyi aşarsa işlem halka arz sayılır, Merkezi Kayıt Kuruluşu durumu ihraççıya ve Kurula bildirir, ihraççı izahname hazırlar.", "Birkaç süreyi de aklına yaz. Yurt dışı ihraçlarda tutar, vade, faiz ve saklamacı bilgileri satıştan sonra üç iş günü içinde Merkezi Kayıt Kuruluşu'na bildirilir. Risk beyanları beş yıl saklanır. Kamuyu Aydınlatma Platformu'ndaki genel bilgi formu değişirse en geç iki iş gününde güncellenir.", "Kamuyu aydınlatmada şu ayrım çok önemli. Genel bilgi formunu halka arz edenler ve nitelikli yatırımcıya satanlar doldurur. Sadece tahsisli satış yapanlar bundan muaftır. Halka arz edilmeksizin satanlar içsel bilgi hükümlerinden de muaftır, yalnızca Tebliğin yirmi birinci maddesindeki olayları açıklarlar. Temerrüt, ihraç tavanı alınması, derecelendirme notu değişikliği bunlardan bazıları.", "Halka arz yapan ihraççının yükü daha ağırdır. Genel müdür değişikliğini, büyük varlık alımlarını, önemli davaları da açıklar. Pay sahipliği eşiklerinde de fark var. Nitelikli ya da tahsisli satış yapanlarda eşikler yüzde yirmi beş, elli ve altmış yedi. Halka arz yapanlarda ise yüzde beşten başlayıp yüzde doksan beşe kadar giden uzun bir liste var. Yüzde onu aşan bir pay, yalnızca halka arz ihraççısında bildirim doğurur.", "Şimdi Borçlanma Aracı Sahipleri Kurulu'na geçelim. Faiz, vade ya da anapara gibi asli şartlar değişecekse tertip kurulu kararı şarttır. İhraççının ve ilişkili tarafların elindeki tahviller nisaba katılmaz. Karar, tedavüldeki tutarın üçte iki çoğunluğuyla alınır ve üç iş günü içinde yönetim kurulunca onaylanmalıdır.", "Örnekle bakalım. Tedavül yüz yirmi milyon, ilişkili tarafın elinde on beş milyon olsun. Oy hakkı olan tutar yüz beş milyondur. Bunun üçte ikisi yetmiş milyon liradır. Diğer tertipler etkilenirse, toplam tutarın yüzde yirmisine sahip olanlar genel kurulu toplayabilir. Genel kurul üçte iki çoğunlukla reddederse karar yürürlüğe girmez. Temsilci seçmek içinse yarıdan fazla oy gerekir.", "Bu mekanizmanın en güçlü sonucu temerrütte ortaya çıkar. Yeniden yapılandırma kararı alındığı andan itibaren icra takipleri durur. İhtiyati tedbir ve haciz uygulanmaz, zamanaşımı işlemez. Yapılandırılmış borç ödenince duran takipler tamamen düşer. Böylece şirkete nefes alacak alan açılır.", "İkincil piyasa Borsa İstanbul'un Borçlanma Araçları Piyasası'dır. Burada doğrudan işlem yapabilenler yalnızca üye bankalar, aracı kurumlar ve Merkez Bankası'dır. Halka arz edilen özel sektör tahvilinin borsada işlem görmesi zorunludur. Nitelikli yatırımcıya ihraç edilen tahvil borsaya gelse bile nitelikli kısıtı devam eder. Nitelikli Yatırımcıya İhraç Pazarı ise yalnızca ilk satış penceresidir.", "Biraz da kavramlara bakalım. Sabit getirili demek, getirinin rakamının sabit olması demek değildir. Sabit olan, ödemeyi belirleyen formül ve takvimdir. Tahvil sahibi şirketin ortağı değil alacaklısıdır. Yönetime katılamaz ama tasfiyede pay sahiplerinden önce parasını alır.", "Şirket neden banka kredisi yerine tahvil seçer? Düşün ki bir fabrika üç yıl boyunca nakit üretmeyecek. Banka her ay anapara ister. Tahvilde ise çoğunlukla sadece kupon ödersin, anapara vade sonunda tek seferde ödenir. Buna balon ödeme denir. Ama komisyon, derecelendirme ücreti, Kurul ücreti, saklama ve borsa ücretleri gibi ek maliyetleri de hesaba katmak gerekir.", "Son olarak yapı taşları. Türkiye'de nominal değer standart olarak yüz liradır. Kupon her zaman nominal üzerinden hesaplanır. Yüzde on dört kuponlu, üç ayda bir ödemeli tahvili doksan iki liraya alsan da her dönem üç buçuk lira alırsın. Kuponlar genelde üç ya da altı ayda bir ödenir. Değişken kuponlu tahvilde kupon, referans orana sabit bir ek getiri eklenerek bulunur.", "Sermaye benzeri borçlanma araçlarını da unutma. Bunlar tasfiyede diğer tüm borçlanma araçlarından sonra, pay sahiplerinden önce gelir. Bu yüzden kuponları daha yüksektir. Tüketici fiyat endeksine endeksli anüite devlet tahvilleri ise genellikle otuz yıl vadeli ve üç ayda bir ödemelidir. Sigorta şirketlerinin yıllık gelir yükümlülükleri için çıkarılır.", "Toparlayalım. Birincisi, tahvil üç yüz altmış beş gün ve üzeri, bono otuz ile üç yüz altmış dört gün arası. İkincisi, ihraç limiti halka açıkta özkaynağın beş katı, değilse üç katı. Üçüncüsü, tahsisli satışta sınır yüz elli kişi ve nitelikli yatırımcılar sayılmaz. Dördüncüsü, borçlanma aracı sahipleri kurulunda karar üçte iki çoğunlukla alınır ve üç iş gününde onaylanır. Beşincisi, kupon her zaman nominal değer üzerinden hesaplanır."], "7": ["Merhaba, borçlanma araçlarının hesap ağırlıklı bölümündeyiz. Bugün tahvilin fiyatını ve getirisini konuşacağız. Temiz fiyat, kirli fiyat, kuponsuz bono, basit ve bileşik faiz, getiri ölçütleri, reel getiri ve mevduat eşleniği sırayla gelecek. Sonunda risk primleri ve durasyonla bitireceğiz.", "Önce şu durumu düşün. Bir tahvil iki kupon tarihi arasında el değiştiriyor. Satıcı tahvili bir süre tutmuş, o sürenin faizini hak etmiş. Alıcı da bu faizi satıcıya öder. Buna işlemiş faiz diyoruz. Ekranda gördüğün temiz fiyattır. Takasta ödediğin ise temiz fiyata işlemiş faizin eklendiği kirli fiyattır.", "Grafikte buna testere dişi denir. Temiz fiyat yatay giderken kirli fiyat her gün biraz yükselir. Kupon günü gelince dik bir şekilde temiz fiyata düşer. Analizde kirli fiyat kullanılsaydı bu mekanik iniş çıkış yanlış yorumlanırdı. Bu yüzden analizde temiz fiyat, takasta kirli fiyat kullanılır.", "İşlemiş faizi hesaplarken nominali kupon oranıyla ve gün sayısıyla çarpıp üç yüz altmış beşe bölüyorsun. Gün sayısında bir tuzak var. Son kupon günü sayılır ama takas günü sayılmaz. Mesela birinci Mart kupon tarihi, takas on beş Mayıs ise Mart'tan otuz bir, Nisan'dan otuz, Mayıs'tan on dört gün alırsın. Toplam yetmiş beş gün eder.", "Kuponsuz bonoda ise işlemiş faiz yoktur. Bu yüzden temiz fiyat ile kirli fiyat birbirine eşittir. Fiyatı bulmak için nominal değeri, bir artı basit faiz çarpı gün oranına bölersin. Vadesine yetmiş üç gün kalmış, yüzde otuz faizli bir bononun fiyatı yüz bölü bir virgül sıfır altıdır. Yani yaklaşık doksan dört virgül otuz dört lira.", "Burada sık yapılan hatayı söyleyeyim. Bazıları yüzden yüzde altıyı düşüp doksan dört lira buluyor. Bu yanlış, çünkü formül bir çıkarma değil bir bölme işlemidir. Sınavda doksan dört ile doksan dört virgül otuz dört yan yana şık olarak gelirse dikkat et.", "Şimdi basit ve bileşik faize geçelim. Basit faiz, dönemsel getiriyi yıldaki kupon sayısıyla çarpar. Bileşik faiz ise kuponların hemen yeniden yatırıldığını varsayar. Buna yeniden yatırım varsayımı denir. Yüzde yirmi dört basit faizli, üç ayda bir ödeyen bir bono düşün. Dönemsel getiri yüzde altıdır. Bir virgül sıfır altının dördüncü kuvvetinden bir çıkarırsan yaklaşık yüzde yirmi altı virgül yirmi beş bulursun.", "Kitaptaki tabloyu da hatırla. Basit faiz yüzde yirmi sabitken altı ayda bir ödemede efektif getiri yüzde yirmi bire çıkar. Üç ayda birde yüzde yirmi bir virgül elli beş olur. Ödeme sıklaştıkça efektif getiri artar. Bu yüzden tahvilleri karşılaştırırken bileşik faize bakmak gerekir.", "Getiri ölçütlerine gelelim. Nominal getiri, yıllık kuponun nominal değere oranıdır. Fiyattan hiç etkilenmez. Cari getiri ise yıllık kuponu güncel fiyata böler. Yüzde on beş kuponlu tahvil yüz yirmi liraysa cari getiri yüzde on iki buçuktur. Vadeye kadar getiri ise tüm nakit akışlarını fiyata eşitleyen iskonto oranıdır, yani iç verim oranıdır.", "Vadeye kadar getirinin iki varsayımı var. Tahvili vadeye kadar tutarsın ve kuponları aynı oranla yeniden yatırırsın. Faizler düşerse kuponları daha düşük oranla değerlendirirsin. Buna yeniden yatırım riski denir. Yüksek kuponlu, uzun vadeli tahvillerde bu risk büyüktür. Kuponsuz tahvilde ise hiç yoktur.", "Sıralamayı ezberlemenin kolay bir yolu var. İskontolu tahvili ucuza alırsın, vadede sermaye kazancı elde edersin. O yüzden vadeye kadar getiri en büyüktür, sonra cari getiri, en son nominal getiri gelir. Primli tahvilde sıralama tam tersidir. Fiyat yüz liraysa üçü birbirine eşittir.", "Şimdi enflasyona bakalım. Reel getiriyi bulmak için bir artı nominal getiriyi, bir artı enflasyona bölüp bir çıkarırsın. Buna Fisher denklemi denir. Nominal getiri yüzde altmış, enflasyon yüzde kırk beş olsun. Basit çıkarma yüzde on beş verir. Ama doğru cevap yaklaşık yüzde on virgül otuz dörttür. Yüksek enflasyonda basit çıkarma reel getiriyi olduğundan yüksek gösterir.", "Mevduat eşleniği de sevilen bir hesap. Önce aracın net getirisini bulursun, sonra bunu bir eksi mevduat stopajına bölersin. Stopajsız yüzde otuzluk bir bono, yüzde on yedi buçuk stopajlı mevduatla kıyaslanıyorsa sıfır virgül otuzu sıfır virgül sekiz yüz yirmi beşe bölersin. Sonuç yaklaşık yüzde otuz altı virgül otuz altıdır. Yani banka en az bu kadar brüt faiz vermeli.", "Baz puanı da unutma. Bir baz puan yüzde sıfır virgül sıfır birdir. Yüz baz puan yüzde bir eder. Getiri yüzde dört virgül yirmi beşten dört virgül seksene çıktıysa artış elli beş baz puandır.", "Fiyat neden nominalden sapar? Kupon piyasa faizinin altındaysa tahvil iskontolu işlem görür. Üstündeyse primli işlem görür. Eşitse başabaş olur. Yatırımcının istediği getirinin üç parçası vardır. Piyasa faizi, kredi risk primi ve likidite risk primi. Devlet tahvili yüzde yirmi sekiz, kredi primi yüzde üç, likidite primi yüzde bir buçuksa beklenen getiri yüzde otuz iki buçuktur.", "Likiditeyle ilgili güzel bir örnek gösterge tahvildir. Hazine'nin en son çıkardığı, iki ve on yıl gibi referans vadedeki tahviller çok işlem görür ve alış satış marjı dardır. Eski tahviller aynı kredi riskine sahip olsa da daha az işlem görür. Az işlem gören tahvil daha yüksek getiriyle, daha düşük fiyatla el değiştirir.", "Faizlerin nasıl değiştiğine kısaca bakalım. Kısa vadede belirleyici olan merkez bankasıdır. Uzun vadede ise enflasyon beklentisi, ülke risk primi ve küresel koşullar baskındır. Ülkenin kredi notu düşerse uzun vadeli faizler yükselir.", "Son konu durasyon. Durasyon, nakit akışlarının ağırlıklı ortalama vadesidir ve faiz duyarlılığını gösterir. Vade uzadıkça durasyon artar. Kupon yükseldikçe durasyon düşer. Faiz seviyesi yükseldikçe de durasyon kısalır. Düzeltilmiş durasyon, faizdeki yüzde birlik değişimin fiyatı yaklaşık yüzde kaç değiştireceğini söyler. Büyük faiz hareketlerinde buna konveksite eklenir.", "Toparlayalım. Birincisi, takasta kirli fiyat, analizde temiz fiyat kullanılır ve işlemiş faizde takas günü sayılmaz. İkincisi, kuponsuz bononun fiyatı nominalin bir artı faiz çarpı gün oranına bölünmesiyle bulunur. Üçüncüsü, iskontolu tahvilde vadeye kadar getiri en büyük, primlide en küçüktür. Dördüncüsü, reel getiri Fisher denklemiyle bölerek hesaplanır. Beşincisi, durasyon vadeyle artar, kupon ve faiz seviyesiyle azalır."], "8": ["Merhaba, borçlanma araçlarının son bölümündeyiz. Bugün risksiz faizden başlayıp kredi riskine, oradan erken itfa opsiyonlarına, eurotahvillere ve referans oranlara gideceğiz. En sonda Hazine'nin borçlanma yöntemlerini ve piyasa yapıcılığını konuşacağız. Konu geniş ama mantığı oturunca kolaylaşıyor.", "Önce risksiz faiz. Kredi riski almadan, vadeye kadar tutarak elde edeceğin getiriye risksiz faiz denir. Riskli her yatırım bunu aşmalıdır, yani risksiz faiz bir fırsat maliyetidir. Türkiye'de bunun karşılığı Türk lirası cinsi devlet iç borçlanma senetleridir. Dünyada ise Amerikan Hazine tahvilleri referanstır.", "Burada vade uyumu çok önemli. Üç aylık bir işlem için kısa vadeli bonoya, beş yıllık bir proje için vadesine beş yıl kalmış tahvile bakarsın. Aynı vade yoksa ara değer hesaplanır. Reel risksiz faizi ise doğrudan göremezsin. En iyi göstergesi enflasyona endeksli devlet tahvillerinin reel getirisidir.", "Kredi riskine geçelim. Yerel para cinsi devlet borcunda temerrüt riski sıfıra yakındır, çünkü devlet para basabilir. Ama aşırı para basmak enflasyon riskini artırır. Bu yüzden devlet tahvillerine risksiz değil, varsayılan risksiz demek daha doğrudur.", "Derecelendirmede iki büyük kategori var. Yatırım yapılabilir seviye ve spekülatif seviye. Standard and Poor's ölçeğinde en alttaki yatırım notu BBB eksidir. Moody's'te bunun karşılığı Baa üçtür. Kitaptaki çarpıcı veri şu. BBB notlularda tarihsel temerrüt olasılığı yüzde sıfır virgül kırk beş, BB notlularda yüzde bir virgül doksan altı. Yani bir kademede yaklaşık dört kat sıçrama var.", "Ulusal ölçek ile uluslararası ölçeği karıştırma. Sonunda tr eki olan notlar şirketi sadece Türkiye içindekilerle kıyaslar. Ulusal ölçekte en yüksek notu alan bir banka, uluslararası ölçekte ülke riski yüzünden daha düşük not alabilir. Derecelendirme kuruluşu notu vade boyunca yılda en az bir kez gözden geçirmelidir.", "Şimdi kredi temerrüt takası, yani CDS. Bu bir menkul kıymet değil, tezgahüstü işlem gören iki taraflı bir türevdir. Sigortaya benzer ama hukuken sigorta değildir. Koruma alıcısı düzenli prim öder. Kredi olayı olursa koruma satıcısı zararı karşılar. Beş yıllık CDS iki yüz baz puansa yıllık koruma maliyeti yaklaşık yüzde ikidir.", "Türkiye CDS'i, Hazine'nin döviz cinsi eurotahvillerini referans alır. Notlardan daha hızlı hareket eder ve çoğu zaman not değişikliklerinin önünden gider. Bir de ülke risk tavanı kavramı var. Bir ülkedeki şirket ne kadar güçlü olursa olsun, genellikle o ülkenin hazinesinden daha az riskli sayılmaz.", "Erken itfa opsiyonlarında mantık basit. Geri çağırma hakkı ihraççıdaysa yatırımcı yeniden yatırım riski taşır ve daha yüksek kupon ister. Geri satma hakkı yatırımcıdaysa ihraççı yeniden finansman riski taşır ve yatırımcı daha düşük kupona razı olur. Sıralamayı şöyle hatırla. Geri çağırmalı en yüksek, opsiyonsuz ortada, geri satmalı en düşük kuponu sunar.", "Eurotahvillere geçelim. Euro kelimesi burada Avrupa demek değil, uluslararası yapı demektir. Bu tahviller Euroclear ve Clearstream'de saklanır. Kuponlar çoğunlukla vergi kesilmeden brüt ödenir. Ama yatırımcı Türkiye'de yaşıyorsa beyan yoluyla vergi doğabilir. Hazine'nin dolar cinsi eurotahvillerinde kupon altı ayda bir, euro cinsilerde çoğunlukla yılda bir ödenir.", "Eurotahvillerde gün sayımı otuz bölü üç yüz altmıştır. Her ay otuz gün, yıl üç yüz altmış gün kabul edilir. On Mart'tan yirmi iki Haziran'a kadar Mart'tan yirmi, Nisan ve Mayıs'tan otuzar, Haziran'dan yirmi iki gün alırsın. Toplam yüz iki gün eder. Takas çoğunlukla iki iş günü sonradır. Fiyatlama ise Amerikan Hazine getirisinin üzerine ülke risk primi eklenerek yapılır.", "STRIP de kolay bir konu. Devlet tahvilinin kuponları ve anaparası ayrılıp ayrı ayrı alınıp satılır. Her parça kuponsuz bir bono gibi davranır ve yeniden yatırım riski taşımaz. Kodları şöyle aklında tut. T tümü, A anaparayı, K kuponu gösterir.", "Getiri eğrisine bakalım. Normalde vade uzadıkça faiz artar, buna pozitif eğim denir. Kısa vadeli faizler uzun vadelilerden yüksekse eğri ters dönmüştür. Bu genellikle merkez bankasının faizi sert artırdığı dönemlerde görülür ve yaklaşan bir durgunluğun öncü işareti sayılır. Ama tek başına kesin bir kanıt değildir.", "Referans oranlar sınavın gözdesidir. Eski sistemde bankalar tahmini borçlanma oranlarını beyan ediyordu. İki bin on iki manipülasyon vakalarından sonra gerçekleşmiş işlemlere dayanan oranlara geçildi. Türkiye'de bunun karşılığı Türk Lirası Gecelik Referans Faiz Oranı, kısa adıyla TLREF'tir. Borsa İstanbul hesaplar. Devlet tahvili teminatlı gecelik repo işlemlerine dayanır.", "TLREF'te işlemler faize göre sıralanır. Hacmin en düşük yüzde on beşi ile en yüksek yüzde on beşi atılır, kalan yüzde yetmiş üzerinden ortalama alınır. Katılım bankalarının oranında ise uçlardan yüzde onar atılır, kalan yüzde seksen kullanılır. Bu ikisini çok karıştırıyorlar, dikkat et.", "Gecelik oranlar dönemsel kupona endeks yardımıyla çevrilir. Endeks her gün bir önceki değerin, bir artı yıllık oran çarpı gün bölü üç yüz altmış beş ile çarpılmasıyla bulunur. Hafta sonu geçişinde gün sayısı üç alınır. Kupon hesabında kupon tarihlerinden bir iş günü önceki endeks değerleri kullanılır. Buna T eksi bir kuralı denir.", "Bir örnekle bitirelim. Başlangıç endeksi altı bin dört yüz, bitiş endeksi altı bin yedi yüz yirmi olsun. Endeks getirisi yüzde beştir. Yıllık yüzde üç buçuk ek getiri, doksan iki günlük döneme indirgenince yaklaşık yüzde sıfır virgül seksen sekiz eder. Toplam kupon yüz liralık tahvilde yaklaşık beş virgül seksen sekiz liradır.", "Enflasyona endeksli devlet tahvillerinde kupon, nominal çarpı endeks katsayısı çarpı dönemsel reel faizdir. Anapara da katsayıyla büyür. Enflasyon iki ay gecikmeli kullanılır. Deflasyon olsa bile anapara yüz liranın altında ödenmez. Katsayı bir virgül seksen ise vade sonunda anapara yüz seksen lira olur.", "Son olarak Hazine'nin dört ihraç yöntemi. İhalede teklifler Merkez Bankası'na verilir. Çoklu fiyatta herkes kendi teklifinden, tek fiyatta herkes kazanan en düşük fiyattan alır. TAP yönteminde senetler Merkez Bankası'na depolanır, ilk kez bin dokuz yüz seksen sekiz yılının Ekim ayında kullanılmıştır. Doğrudan satış bin dokuz yüz doksan altıdan beri vardır. Halka arza ise yalnızca piyasa yapıcı bankalar aracılık eder.", "Piyasa yapıcı bankaların ihalelerden alım yapma ve borsada kotasyon verme yükümlülüğü vardır. Buna karşılık ihalelere teminatsız katılırlar, rekabetçi olmayan teklif verebilirler, TAP satışlarına ve geri alım ihalelerine yalnızca onlar katılır. Kotasyon vermenin bir ayrıcalık değil, yükümlülük olduğunu unutma.", "Toparlayalım. Birincisi, risksiz faizde vade uyumu şarttır ve Türkiye'de karşılığı TL cinsi devlet tahvilleridir. İkincisi, geri çağırmalı tahvil en yüksek, geri satmalı en düşük kuponu sunar. Üçüncüsü, eurotahvilde gün sayımı otuz bölü üç yüz altmıştır. Dördüncüsü, TLREF'te uçlardan yüzde on beşer, katılım oranında yüzde onar atılır. Beşincisi, piyasa yapıcılar için kotasyon vermek bir yükümlülüktür."], "9": ["Merhaba, yatırım fonları bölümüne başlıyoruz. Bu ilk derste fonun ne olduğunu, kimlerin rol aldığını ve portföy sınırlamalarını konuşacağız. Sonra para piyasası fonlarına, borçlanma araçları fonlarına ve yan hesap uygulamasına geçeceğiz. Bu bölümde oranlar çok, o yüzden bol örnek vereceğim.", "Önce neden fon var, onu düşünelim. Bir yatırımcının parası tek başına küçük kalır. Fonda küçük paralar birleşir. Kitap bunun dört faydasını sayar. Profesyonel yönetim, ölçek ekonomisiyle düşük maliyet, riskin iyi yönetilmesi ve ödünç verme gibi ek kazanç imkanı. Bunlara ek olarak gayrimenkul gibi likit olmayan varlıklara bile likit bir pay üzerinden ulaşabilirsin.", "Sermaye Piyasası Kanunu kolektif yatırım kuruluşlarını iki tane sayar. Yatırım fonları ve yatırım ortaklıkları. Portföy yönetim şirketleri ve saklayıcılar süreçte yer alır ama bu tanıma girmez. Bunu sınavda sık soruyorlar. Ayrım şu. Tüzel kişiliği olan yapı yatırım ortaklığıdır. Tüzel kişiliği olmayan, portföy yönetim şirketinin kurucu olduğu yapı ise yatırım fonudur.", "Saklayıcı kim olabilir? Takasbank ile Kurulun yetkilendirdiği bankalar ve aracı kurumlar, Kuruldan izin alırsa saklama yapabilir. Temel ilke malvarlığı ayrılığıdır. Saklayıcı fonun varlığını kendi hesabında tutamaz. Bir aykırılık görürse önce kurucuyu hemen uyarır. Aykırılık önemliyse ya da düzeltilmezse Kurula bildirir.", "Şimdi yatırım fonunun tanımı. Tasarruf sahiplerinden toplanan parayla, inançlı mülkiyet esasına göre, portföy yönetim şirketleri tarafından içtüzükle kurulan, tüzel kişiliği olmayan mal varlığıdır. Katılma payı alan kişi fona ortak olur ama yönetime katılma gibi idari hakları yoktur. İçtüzük, anonim şirketteki esas sözleşmenin yerini tutar.", "Bir istisna var, dikkat et. Fonun tüzel kişiliği yoktur ama tapu ve ticaret sicili işlemlerinde tüzel kişiliği varmış gibi kabul edilir. Bu işlemler portföy yönetim şirketi ile saklayıcının müşterek imzasıyla yapılır. Fonun mal varlığı da çok korunaklıdır. Haczedilemez, rehnedilemez, iflas masasına girmez. Yalnızca fonun kendi kredi, türev ve açığa satış işlemleri için teminat gösterilebilir.", "Gelelim portföy sınırlarına. İlk kural tek ihraççı limitidir. Fon değerinin en fazla yüzde onu tek bir ihraççıya yatırılabilir. İkinci kural beş kırk kuralıdır. Yüzde beşten fazla yatırım yapılan ihraççıların toplamı yüzde kırkı geçemez.", "Bir örnekle bakalım. Beş şirkete yüzde sekizer yatırım yapılmış olsun. Toplam tam yüzde kırk. Yönetici altıncı bir şirketi yüzde dörtten yüzde yediye çıkarmak isterse, yüzde beşi aşanlar listesine bir şirket daha eklenir. Toplam yüzde kırk yedi olur ve bu yasaktır. Her biri tek başına yüzde onun altında olsa bile.", "Üçüncü kural aynı grup limitidir. Aynı gruba dahil şirketlere toplamda en fazla yüzde yirmi yatırılabilir. Dördüncüsü tedavül limitidir. Bir ihraççının tedavüldeki borçlanma araçlarının en fazla yüzde onu bir fona alınabilir. Seksen milyonluk bir tertipten dokuz milyon almak yüzde on bir virgül yirmi beş eder ve sınırı aşar.", "Bir de oy hakkı sınırı var. Bir fon bir şirketin sermayesinin veya oylarının yüzde onundan fazlasına sahip olamaz. Aynı portföy yönetim şirketinin yönettiği tüm fonlar birlikte ise yüzde yirmiyi aşamaz. Amaç fonun şirketi kontrol etmesini önlemek. Serbest fonlar bu sınırlardan genel olarak muaftır.", "Bazı varlıklarda limitler esner. Hazine ve Merkez Bankası ihraçlarında genel sınırlar uygulanmaz ama tek bir tertibe yüzde otuz beşten fazla yatırılamaz. Varlık kiralama şirketlerinde tek ihraççı yüzde yirmi beş, grup yüzde otuz beştir. Mevduatta ise genel kural toplam yüzde on, tek banka yüzde üçtür. Bankaların sermaye benzeri borçlanma araçlarında toplam yüzde on, tek ihraççı yüzde beştir.", "Şimdi para piyasası fonları. Bu fonlar geri fiyatla çalışır, yani son ilan edilen fiyattan işlem görürsün ve aynı gün paranı alabilirsin. Portföyün ağırlıklı ortalama vadesi en fazla kırk beş gün olabilir. Tek bir varlığın vadesi de en fazla yüz seksen dört gündür. Kısa vadeli borçlanma araçları fonlarında ise ortalama vade yirmi beş ile doksan gün arasında olmalı ama tek varlık için vade sınırı yoktur.", "Mevduat kuralını iyi öğren. Para piyasası fonu toplamda yüzde elliye kadar mevduat tutabilir ama tek bir bankada en fazla yüzde altı. Kısa vadeli fonda ise genel kural geçerlidir, yani toplam yüzde on, tek banka yüzde üç. Para piyasası fonunun ayrıca en az yüzde onunu devlet tahvilinde tutması gerekir. Adında katılım geçen fonlar bundan muaftır.", "Bu likit fonların birkaç ayrıcalığı daha var. Türkiye Elektronik Fon Alım Satım Platformu, yani TEFAS'ta işlem görmeleri zorunlu değildir. Yatırımcı blokajı uygulanmaz. İzahnamede yazıyorsa, mesela kartla ödeme yaptığında fon payın otomatik satılabilir. Repo pazarında yüzde yüze kadar ters repo yapabilirler. Ama pay senedi repo pazarında sınır yüzde yirmi beştir.", "Mevduat ile para piyasası fonunu karşılaştıralım. Mevduatta faiz baştan bellidir ama vadeyi bozarsan faizini kaybedersin. Fonda getiri taahhüdü yoktur ama istediğin gün getirini kaybetmeden çıkarsın. Fonda günlük yönetim ücreti kesilir. Faizler yükselirken fon yeni koşullara mevduattan daha hızlı uyum sağlar.", "Borçlanma araçları fonlarına geçelim. Bu fonlar varlıklarının en az yüzde seksenini borçlanma araçlarında tutar. Unvandaki vade ifadesi çok önemli. Ortalama vade yirmi beş ile doksan gün arasıysa kısa, doksan bir ile yedi yüz otuz gün arasıysa orta, yedi yüz otuz günden uzunsa uzun vadelidir. Vade uzadıkça faiz riski artar.", "Fon türlerini risklerine göre ayır. Kamu borçlanma fonunda ana risk faiz riskidir. Özel sektör fonunda buna kredi ve likidite riski eklenir. Eurobond fonları dövizle getiri sağlar ama ihraççı Türk olduğu için adında yabancı kelimesi geçmez. Bunlar kur, Türkiye risk primi ve küresel faizlere bağlıdır. Yabancı borçlanma fonunda ise varlıkların en az yüzde sekseni yabancı ihraççılara aittir.", "Son konu yan hesap. Bir özel sektör tahvili temerrüde düştü diyelim. İki koşul birlikte gerçekleşirse yan hesap açılır. Varlığa yüzde yüz karşılık ayrılmış olmalı ve değeri fonun yüzde beşini aşmalı. Yüz elli milyonluk fonda dokuz milyonluk tahvil yüzde altı eder, koşul sağlanır. Varlık Takasbank'ta ayrı bir hesaba alınır.", "Yan hesabın amacı adalettir. Varlık, karşılık ayrıldığı gün fonda olan yatırımcılarla ilişkilendirilir. Sonradan giren yatırımcı bu riski taşımaz, ileride tahsilat olursa ondan pay da almaz. Bu işlemlerin masrafını fon değil kurucu öder.", "Toparlayalım. Birincisi, kolektif yatırım kuruluşları yatırım fonları ve yatırım ortaklıklarıdır. İkincisi, tek ihraççı yüzde on, beş kırk kuralı, aynı grup yüzde yirmi ve tedavül yüzde on. Üçüncüsü, para piyasası fonunda ortalama vade kırk beş gün, tek varlık yüz seksen dört gün, tek banka yüzde altı. Dördüncüsü, kısa vadeli fonda ortalama vade yirmi beş ile doksan gün. Beşincisi, yan hesap için yüzde yüz karşılık ve yüzde beşi aşan değer gerekir."], "10": ["Merhaba, fon türleri dersindeyiz. Bugün hisse senedi fonlarından başlayıp endeks fonlara, sektör ve iştirak fonlarına, değişken ve karma fonlara geçeceğiz. Sonra fon sepeti, katılım ve serbest fonlarla bitireceğiz. Bu derste her fonun kendine özgü bir yüzdesi var, o yüzden sayılara odaklan.", "Hisse senedi fonu, varlıklarının en az yüzde seksenini paylarda tutan fondur. Hisse senedi yoğun fon ise daha dar bir tanımdır. Portföyün en az yüzde sekseni Borsa İstanbul'da işlem gören paylardan oluşmalı. Menkul kıymet yatırım ortaklıklarının payları bu hesaba girmez. Bu statü önemlidir, çünkü vergi avantajı getirir.", "Endeks fonlara geçelim. Normal fonda tek hisse sınırı yüzde ondur. Endeks fonda bu sınır yüzde otuza çıkar, çünkü fon endeksi kopyalamak zorundadır. Endeks ve fon en az altı farklı şirketten oluşmalıdır. Fon ile endeks arasındaki korelasyon da en az yüzde doksan olmalıdır.", "Endeks fon ile borsa yatırım fonu çok karıştırılır. Endeks fonu bankadan ya da TEFAS üzerinden alırsın. Saat kaçta talimat verirsen ver, günde tek bir fiyattan işlem görürsün. Borsa yatırım fonunu ise hisse gibi borsada, anlık fiyattan alırsın. Borsa yatırım fonunda yönetim ücreti daha düşüktür ama aracı kuruma komisyon ödersin. Fiyatı da net aktif değerden biraz sapabilir.", "İştirak fonları bir holdingin şirketlerine yatırım yapar. Bu fonlar aynı grup limitinden ve beş kırk kuralından muaftır. Yani portföyün tamamı aynı gruba gidebilir. Ama tek şirket sınırı olan yüzde on hâlâ geçerlidir. Burada dur bir saniye. Yüzde on kuralı riski tam dağıtmaz, çünkü grup şirketleri birlikte düşebilir. Buna grup riski denir.", "Sektör fonlarında ise tek şirket sınırı yüzde yirmiye çıkar. Unvanda sektör adı geçebilmesi için varlıkların en az yüzde seksenini o sektörde tutman gerekir. Beş kırk kuralı ve grup sınırları burada uygulanmaz. Sonuç olarak sektör fonu yüksek getiri potansiyeli ama yüksek oynaklık demektir.", "Şimdi sınavda çok çıkan bir konu. Bir hissenin işlem sırası kapanırsa ne olur? İlk beş işlem günü fon, kapanıştan önceki son fiyatı kullanmaya devam eder. Kapalılık altıncı güne sarkarsa karşılık ayrılmaya başlanır. Ağırlık yüzde bire kadarsa değer bir günde sıfırlanır. Yüzde bir ile beş arasındaysa otuz günde, yüzde beşin üzerindeyse doksan günde eşit parçalarla sıfırlanır.", "Bir örnek yapalım. Hisse fonun yüzde üçü ve değeri bir milyon sekiz yüz bin lira olsun. Ağırlık bir ile beş arasında, yani otuz günlük takvim işler. Her gün altmış bin lira karşılık ayrılır. Ağırlık yüzde sekiz olsaydı aynı hesabı doksan güne bölerdin.", "Değişken fonlara geçelim. Değişken fon, başka hiçbir fon türünün tanımına girmeyen esnek fondur. Asgari bir varlık oranı yoktur. Yönetici hisseleri tamamen satıp her şeyi tahvile geçirebilir. Bu yüzden sabit bir endeksle kıyaslamak anlamsız olabilir. Mevzuat bunun yerine eşik değer belirlemeye izin verir. Mesela mevduat faizi artı bir puan gibi.", "Karma fonu değişken fonla karıştırma. Karma fonda en az iki varlık grubunun her biri en az yüzde yirmi olmalı. Bu iki grubun toplamı da en az yüzde seksen olmalı. Yani karma fon her zaman çeşitlendirilmiş kalmak zorundadır. Değişken fon ise tek bir varlığa yüzde yüz gidebilir.", "Değişken şemsiye fon altında bir şirket en fazla dört fon çıkarabilir ve her risk grubundan yalnızca bir tane. Unvanlar risk değerine göre belirlenir. Bir ve iki muhafazakar ya da temkinli, üç ve dört dengeli, dört ve beş atak, dinamik ya da büyüme, beş ile yedi arası agresiftir.", "Fon sepeti fonları diğer fonlara yatırım yapar. Tek bir fona en fazla yüzde yirmi yatırılabilir. Başka bir fon sepeti fonuna hiç yatırım yapılamaz. Bir fonun toplam paylarının en fazla yüzde yirmi beşi alınabilir. Serbest fonlara ise toplamda en fazla yüzde on gidebilir. Üç yüz milyonluk bir fonda tek fon sınırı altmış milyon, serbest fon sınırı otuz milyon liradır.", "Katılım fonları faizsiz finans ilkelerine uymak zorundadır. Mevduat, devlet tahvili ve faizli repo yerine katılma hesabı, kira sertifikası ve vaad sözleşmesi kullanılır. Paylar ya onaylı katılım endekslerinden seçilir ya da bir danışman tarafından onaylanır.", "Arındırmayı iyi bil. Fona faizsiz ilkelere uymayan küçük bir gelir gelirse bu tutar arındırılır, genelde hayır kurumlarına aktarılır. Danışma kurulunun onayı gerekir. Arındırmadan sonraki beş iş günü içinde Kamuyu Aydınlatma Platformu'nda açıklanır. Bu tutar toplam gider oranına dahil edilmez.", "Para piyasası katılım fonlarında iki önemli fark var. Birincisi, yüzde on devlet tahvili zorunluluğu yoktur. İkincisi, tek bir bankada tutulabilecek tutar yüzde altı değil, yüzde yirmidir. Çünkü katılım bankası sayısı azdır. Toplam banka sınırı ise yine yüzde ellidir.", "Serbest fonlar en esnek fonlardır ama sadece nitelikli yatırımcıya satılır. Tek şirket ve grup sınırları uygulanmaz. Kaldıraç kullanabilir, açığa satış yapabilir, opsiyon satıcısı olabilir. Diğer fonlar opsiyon satıcısı olamaz, bunu unutma. Gayrimenkul ve girişim sermayesi fonlarına en fazla yüzde yirmi beş yatırım yapabilir. Borsada özel emirle ya da toptan satışlar pazarında pay alıcısı olamaz.", "Bir serbest fon geri fiyat da uygulayabilir. Bunun için unvanında para piyasası ya da kısa vadeli ibaresi bulunmalı ve o fonların kurallarına uymayı taahhüt etmelidir. Serbest fonlar fiyatlarını en az ayda bir açıklayabilir ve iade sürelerini uzun tutabilir.", "Son olarak kâr payı ödeyen fonlar. Fon nakit dağıttığında fonun değeri o kadar azalır. Elli liralık bir paya iki buçuk lira dağıtılırsa fiyat kırk yedi buçuk liraya iner. Senin toplam varlığın değişmez. Ama paranın bir kısmı fondan çıktığı için bileşik getiri etkisinden kısmen vazgeçmiş olursun.", "Toparlayalım. Birincisi, hisse senedi yoğun fonda Borsa İstanbul payları en az yüzde seksen olmalı. İkincisi, endeks fonda tek hisse yüzde otuz, sektör fonunda yüzde yirmi, iştirak fonunda yüzde on sınırı var. Üçüncüsü, kapanan payda karşılık bir, otuz ya da doksan günde ayrılır. Dördüncüsü, fon sepetinde tek fon yüzde yirmi, serbest fon yüzde on. Beşincisi, katılım para piyasası fonunda tek banka sınırı yüzde yirmidir."], "11": ["Merhaba, yatırım fonlarının operasyon ve ücret dersindeyiz. Bugün bir fon talimatının hangi fiyattan gerçekleştiğini, paranın hesaba ne zaman geçtiğini, fondan ne kadar gider kesilebileceğini konuşacağız. Sonra performans ücretine ve risk değerine geçeceğiz. Bu bölümde küçük hesaplar çok, kâğıt kalemi yanında tut.", "İki fiyatlama yöntemi var. İleri fiyatta talimatı verdiğinde fiyatı bilmezsin. İşlem, talimattan sonraki ilk hesaplanan fiyattan gerçekleşir. Para piyasası ve kısa vadeli borçlanma araçları fonları dışındaki tüm fonlarda bu zorunludur. Geri fiyatta ise son ilan edilen, bildiğin fiyattan işlem yaparsın. Para piyasası fonlarında böyledir ve aynı gün paranı alabilirsin.", "İleri fiyatlı fonda en kritik şey emir saatidir. Bu saat izahnamede yazar, piyasada genelde on üç otuzdur. Saatten önce verdiğin emir o günün emridir ve o günün kapanış fiyatından gerçekleşir. Saatten sonra verirsen emir ertesi iş günü verilmiş sayılır.", "Bir örnekle bakalım. Perşembe saat on dörtte satış emri verdin, valör iki iş günü. Emir Cuma emri sayılır, Cuma fiyatından gerçekleşir. Cuma'ya iki iş günü eklersin. Hafta sonu sayılmaz, yani para Salı günü hesabına geçer. Sınavda hafta sonunu atlamayı unutan çok oluyor, sen unutma.", "Peki alım emri verdin, para fona girene kadar ne olur? Para boşta beklemez. Mevzuat bu paranın senin lehine değerlendirilmesini zorunlu tutar. Katılım fonlarında ise ancak uygun faizsiz bir araç varsa nemalandırılır. Ayrıca yazılı talep verirsen nemalandırma yapılmayabilir.", "Ödeme tarafında birkaç detay var. Fon alımında kredi kartı kullanılabilir. Fon satışında ise fon nakit öder. Paylar küsuratlı olabilir ama teminat ve virmanda tam sayı esastır. Döviz fonlarında yabancı parayla, adında altın geçen fonlarda Kurul onayıyla altınla alım satım yapılabilir. Altınla işlem için bankada altın hesabın olmalı.", "Türkiye Elektronik Fon Alım Satım Platformu, yani TEFAS'ı Takasbank işletir. Fonların burada işlem görmesi genel kuraldır. Para piyasası, kısa vadeli ve serbest fonlar için zorunlu değildir. Özel fon, gayrimenkul fonu, girişim sermayesi fonu, garantili ve koruma amaçlı fonlar ise TEFAS'ta hiç işlem göremez. Bu iki listeyi karıştırma.", "Şimdi giderler. En büyük kalem yönetim ücretidir ve fon zarar etse bile kesilir. Buna denetim, saklama gibi giderler eklenince fon toplam gideri oluşur. Yıllık tavanları ezberle. Para piyasası fonu yüzde bir virgül altmış beş. Kısa vadeli fonlar yüzde iki virgül elli altı. Endeks, kıymetli maden, garantili fonlar yüzde iki virgül on dokuz. Diğer fonlar yüzde üç virgül altmış beş. Fon sepeti fonu yüzde dört virgül otuz sekiz. Serbest fonlar bu sınırdan muaftır.", "Kontrol üç, altı, dokuz ve on iki aylık dönem sonlarında yapılır. Sınır aşılmışsa aşan tutar beş iş günü içinde fona iade edilir. Bundan kurucu ve saklayıcı sorumludur. Gider oranı ve iade bilgisi altı iş günü içinde Kamuyu Aydınlatma Platformu'nda ilan edilir. Aracı kurum komisyon bilgileri ise üç aylık dönemi izleyen on iş günü içinde açıklanır. Beş, altı ve on sayılarını yerli yerine koy.", "Giriş ve çıkış komisyonu uygulanabilir. Ama fon, kendi kurucusunun ya da onunla ilişkili şirketlerin fonlarına yatırım yaparsa bu fonlara giriş çıkış komisyonu ödeyemez.", "Performans ölçümüne geçelim. Her fon stratejisine uygun bir karşılaştırma ölçütü belirler. Karma bir fonda ölçüt, endekslerin ağırlıklı ortalamasıdır. Mesela yüzde elli kısa vade tahvil, yüzde otuz orta vade tahvil, yüzde yirmi pay düşün. Getiriler yüzde on sekiz, on iki ve otuz olsun. Ağırlıklarla çarpıp toplarsan yüzde on sekiz virgül altı bulursun.", "Ölçütle ilgili iki tuzak var. Pay endeksi kullanılıyorsa fiyat endeksi değil, getiri endeksi kullanılır. Döviz ya da enflasyon endeksi ise karşılaştırma ölçütü olamaz. Uygun bir endeks yoksa eşik değer belirlenir. Eşik değer gecelik referans faizin bileşik getirisinden düşükse, eşik değer olarak o bileşik getiri kullanılır.", "Performans ücreti toplam getiri üzerinden değil, nispi getiri üzerinden alınır. Nispi getiri, fonun getirisinden ölçütün getirisinin çıkarılmasıyla bulunur. Azami oran nispi getirinin yüzde yirmisidir. Fon yüzde yirmi sekiz, ölçüt yüzde yirmi bir getirdiyse nispi getiri yüzde yedidir. Ücret en fazla yüzde bir virgül dört olur.", "Bir de yüksek iz değer kuralı var. Fiyat, daha önce ücret alınan en yüksek seviyeyi geçmedikçe yeni ücret alınamaz. Diyelim ki ücret yüz elli liradan alındı, fiyat yüz yirmiye düştü, sonra yüz kırka çıktı. Fon ölçütü yense bile ücret alınamaz, çünkü yüz elli aşılmadı. İlk yüksek iz değer senin alış fiyatındır ve her alım için ayrı izlenir.", "Son konu risk değeri. Fonlar bir ile yedi arasında sınıflandırılır. Beş yıllık haftalık getiriler kullanılır. Garantili ve koruma amaçlı fonlarda iki haftalık getiriler kullanılır. Haftalık standart sapmayı bulduktan sonra elli ikinin karekökü ile çarparsın. Elli ikinin karekökü yaklaşık yedi virgül iki bir birdir. Elli ikiyle çarpmak çok yapılan bir hatadır.", "Tabloyu da şöyle aklında tut. Yüzde ikiye kadar bir, beşe kadar iki, ona kadar üç, on beşe kadar dört, yirmiye kadar beş, otuza kadar altı, otuz ve üzeri yedi. Haftalık sapma yüzde bir virgül sekizse yıllık volatilite yaklaşık yüzde on üç olur. Bu da risk değeri dört demektir.", "Risk değeri ne zaman güncellenir? Son dört aydaki haftalık hesaplar farklı bir kategoriyi gösteriyorsa güncelleme zorunludur. Birden fazla kategori varsa en sık görülen esas alınır. Değişiklik strateji değişikliğinden geliyorsa kurucu yeni stratejiye göre risk değerini belirler. Beş yıllık veri yoksa eksik kısım karşılaştırma ölçütünün getirileriyle tamamlanır.", "Toparlayalım. Birincisi, kritik saatten sonraki emir ertesi iş günü emri sayılır ve valör hafta sonunu atlar. İkincisi, yıllık gider tavanı diğer fonlarda yüzde üç virgül altmış beş, aşım beş iş gününde iade edilir. Üçüncüsü, performans ücreti nispi getirinin en fazla yüzde yirmisidir ve yüksek iz değer aşılmalıdır. Dördüncüsü, volatilite elli ikinin karekökü ile yıllıklandırılır. Beşincisi, risk değeri dört aylık gözleme göre güncellenir."], "12": ["Merhaba, türev araçlar dersine hoş geldin. Bugün Vadeli İşlem ve Opsiyon Piyasası, yani VİOP'un yapısını, vadeli işlem sözleşmelerini, teminat mekanizmasını, fiyatın nasıl oluştuğunu, opsiyonları ve varantları konuşacağız. Hesap soruları bu bölümde bol, o yüzden örneklerle ilerleyeceğim.", "Önce temel ayrım. Spot piyasada parayı öder malı hemen alırsın. Türev piyasada ödeme ve teslim ileri bir tarihte olur. Türev aracın kendi değeri yoktur, değerini bir dayanak varlıktan alır. Tezgahüstü piyasada taraflar her şeyi serbestçe belirler ama karşı taraf riski vardır. Organize piyasada ise her şey standarttır ve bir takas kurumu güvence verir.", "Forward ile futures özünde aynı şeydir. İkisi de ileride önceden belirlenmiş fiyattan işlem yapma yükümlülüğüdür. Fark şu. Forward bankayla yapılan özel bir sözleşmedir, günlük uzlaşı yoktur, hesaplaşma vade sonunda bir kerede olur. Futures borsada işlem görür ve kâr zarar her gün hesaba yansır.", "VİOP'un hikayesi iki bin beşte İzmir'de kurulan Vadeli İşlem ve Opsiyon Borsası ile başlar. Sonra bu borsa, İstanbul Menkul Kıymetler Borsası ve İstanbul Altın Borsası, Borsa İstanbul çatısında birleşti. Piyasanın güvencesi Takasbank'tır. Takasbank alıcıya karşı satıcı, satıcıya karşı alıcı olur. Buna merkezi karşı taraf denir. Aracı kurum batsa bile teminatın korunur.", "Vadeli işlemde uzun pozisyon yükseliş, kısa pozisyon düşüş beklentisidir. Spotta açığa satış zahmetlidir ama VİOP'ta kısa pozisyon açmak uzun pozisyon kadar kolaydır. Bu oyun sıfır toplamlıdır. Bir tarafın kârı diğerinin zararıdır. Dolar kırk bir liradan otuz dokuz buçuğa düşerse, beş sözleşmelik kısa pozisyon yedi bin beş yüz lira kazanır. Karşısındaki aynı tutarı kaybeder.", "Sözleşme kodunu okumayı öğren. Başta F alt çizgi vadeli işlemi gösterir. Ortada dayanak varlık, sonda dört rakamla ay ve yıl vardır. Mesela F alt çizgi THYAO on iki yirmi altı, Türk Hava Yolları payına dayalı, iki bin yirmi altı Aralık vadeli sözleşmedir. Vade, ayın son iş günüdür.", "Sözleşme büyüklüklerini ezberle. Pay sözleşmesi yüz pay, endeks sözleşmesi endeks çarpı on lira, dolar sözleşmesi bin dolardır. Gram altın bir gram, ons altın bir ons, gümüş on ons, bakır sıfır virgül bir tondur. Endeks on iki bin puansa bir sözleşme yüz yirmi bin lira eder.", "Açık pozisyonu da yorumlayabilmelisin. Yeni bir alıcı ile yeni bir satıcı eşleşirse açık pozisyon artar. Pozisyon kapatan iki taraf eşleşirse azalır. Biri çıkıp biri girerse değişmez. İşlem hacmi yüksekken açık pozisyonun düşmesi, insanların pozisyon kapattığını gösterir.", "Gelelim teminata. Vadelide tüm bedeli ödemezsin, bir başlangıç teminatı yatırırsın. Takasbank bunu fiyat değişim aralığı denen bir oranla hesaplar. Yüz elli liralık paydan sekiz sözleşme düşün. Pozisyon yüz yirmi bin liradır. Oran yüzde on ikiyse teminat on dört bin dört yüz lira olur. Teminatın belli bir kısmı, mesela yarısı, nakit Türk lirası olmalıdır.", "Kaldıraç, bir bölü teminat oranıdır. Yüzde on iki oranda kaldıraç yaklaşık sekiz virgül otuz üçtür. Fiyat yüzde dört artarsa teminatına göre yaklaşık yüzde otuz üç kazanırsın. Düşerse aynı oranda kaybedersin. Bir uyarı daha. Komisyon teminat üzerinden değil, pozisyonun tamamı üzerinden alınır.", "Teminat tamamlama çağrısını adım adım hesaplayalım. Aynı pozisyon için on sekiz bin lira yatırdın. Fiyat yüz elliden yüz otuz beşe düştü. Zarar on iki bin, kalan bakiye altı bin lira. Yeni teminat, yeni fiyat üzerinden on iki bin dokuz yüz altmış liradır. Aradaki fark olan altı bin dokuz yüz altmış lira için çağrı gelir. Ertesi iş günü saat on beşe kadar nakit yatırırsın ya da pozisyonu küçültürsün.", "Burada iki saat daha var. Fiziki teslimatlı döviz sözleşmelerinde ve yarım günlerde son saat on birdir. Olağanüstü durumlarda Takasbank gün içinde de çağrı yapabilir, o zaman açığı iki saatte kapatman gerekir. Gün içinde teminatın sürdürme seviyesinin altına inerse bekleyen emirlerin iptal edilir ve yeni pozisyon açamazsın.", "Teminatın nemalanması da sorulur. Takasbank yalnızca Türk lirası nakdi gecelik değerlendirir. Döviz, altın ya da hisse teminatı nemalanmaz. Paranın saat on beş kırkta hesapta olması gerekir. İşlemde kullanılan ve serbest bekleyen tüm nakit lira nemalanır. Nema istemiyorsan aracı kurumun üzerinden bildirebilirsin.", "Sözleşme türlerine bakalım. Endeks sözleşmeleri çift aylarda vadelenir, nakdi uzlaşılıdır ve akşam seansındadır. Pay sözleşmeleri fiziki teslimatlıdır. Vadede hisse gerçekten el değiştirir ve takas iki iş günü sonradır. Dolar sözleşmelerinde on altı aya kadar vade vardır. Esnek vadeli döviz sözleşmelerinde vade en fazla üç yüz altmış dört gündür. Gram altın akşam seansında değildir, gerçek kişiler de fiziki teslimatlı döviz sözleşmesine taraf olamaz.", "Vadeli fiyat nasıl oluşur? Spot fiyata faiz maliyetini eklersin, varsa varlığın getirisini çıkarırsın. Spot iki yüz elli, aylık faiz yüzde iki buçuk ve vade iki ay ise vadeli fiyat iki yüz altmış iki buçuk liradır. Vade yaklaştıkça faiz kısmı erir ve vade sonunda vadeli fiyat spota eşitlenir.", "Temettü varsa onu düşersin. Spot yüz elli, faiz maliyeti dört, temettü altı ise vadeli fiyat yüz kırk sekiz olur. Vadelinin spotun altında olması burada bir hata değildir. Vadeli alan kişi temettü almaz, fiyat bunu baştan yansıtır. Vadeli fiyat teorik değerden fazla saparsa arbitrajcı devreye girer. Pahalı olan vadeliyi satar, ucuz olan spotu alır.", "Opsiyonlara geçelim. Opsiyon alıcısı prim öder ve bir hak satın alır. Alım opsiyonu alma hakkı, satım opsiyonu satma hakkı verir. Satıcı ise yükümlülük altına girer. Alıcının kaybı ödediği primle sınırlıdır. Alım opsiyonu satıcısının zararı ise teorik olarak sınırsızdır. Amerikan tipi opsiyon vadeye kadar her an, Avrupa tipi sadece vadede kullanılır.", "Hesap örneği. Kullanım fiyatı altmış, primi dört olan alım opsiyonu aldın. Vadede fiyat yetmiş oldu. Opsiyonu kullanırsın, on lira kazanırsın, primi düşünce net kârın altı liradır. Kullanım fiyatı kırk beş, primi üç olan satım opsiyonunda fiyat kırk sekiz olursa opsiyonu kullanmazsın. Kaybın ödediğin üç liralık primdir.", "Kârda ve zararda opsiyonu karıştırma. Alım opsiyonunda kullanım fiyatı spotun altındaysa opsiyon kârdadır. Satım opsiyonunda ise kullanım fiyatı spotun üstündeyse kârdadır. Eşitse başabaştır. Volatilite ve vadeye kalan süre arttıkça hem alım hem satım opsiyonlarının primi artar. Faiz artışı ise alımı artırır, satımı azaltır.", "Son olarak varantlar. Varant, menkul kıymet haline getirilmiş bir opsiyondur. VİOP'ta değil Pay Piyasası'nda işlem görür. Özelliklerini ihraççı belirler. Her varantın tek bir ihraççısı vardır ve sen ihraççı olamazsın. Bu yüzden varant alırken teminat yatırmazsın, en fazla ödediğin primi kaybedersin.", "Toparlayalım. Birincisi, futures günlük uzlaşılıdır, forward değildir. İkincisi, kaldıraç bir bölü teminat oranıdır ve teminat çağrısı ertesi iş günü saat on beşe kadar karşılanır. Üçüncüsü, endeks sözleşmesi nakdi, pay sözleşmesi fiziki teslimatlıdır. Dördüncüsü, vadeli fiyat spot artı faiz eksi varlık getirisidir. Beşincisi, varantta yatırımcı ihraççı olamaz ve teminat yatırmaz."], "13": ["Merhaba, son bölümdeyiz. Bugün Gelir Vergisi Kanunu'nun geçici altmış yedinci maddesini konuşacağız. Hangi gelir kaynakta kesintiye tabi, matrah nasıl bulunur, zararlar nasıl mahsup edilir, oranlar ne ve ihtiyari beyan nasıl yapılır. Oran çok, ama mantığı kurunca kolaylaşıyor.", "Önce kapsam. Borsa hisselerinin alım satım kazançları, devlet ve özel sektör tahvilleri, mevduat, repo, katılım bankası kâr payları, vadeli işlem ve opsiyonlar, fonlar ve kira sertifikaları tevkifata tabidir. Darphane sertifikaları da listede. Burada dur bir saniye. Hisse senedi kâr payı bu listede yoktur. Kâr payı geçici altmış yedinin dışındadır.", "Kapsam dışı kalanları da bil. Yurt dışında ihraç edilen eurobondlar, tam mükellef kurumların bir yıldan fazla tuttuğu borsa hisseleri ve iki bin altı yılı başından önce ihraç ya da iktisap edilmiş kıymetler tevkifata tabi değildir. Bir de portföyünün en az yüzde elli biri borsa hissesi olan fonların bir yıldan fazla tutulan payları kapsam dışıdır. TEFAS'ta işlem görmeyen serbest fonlar bu istisnadan yararlanamaz.", "Tevkifatta kişinin kim olduğu önemli değildir. Gerçek ya da tüzel kişi, tam ya da dar mükellef fark etmez. Vergiden muaf biri bile kesintiye uğrar.", "Matrah basittir. Satış bedelinden alış bedelini çıkarırsın, komisyon ve banka sigorta muameleleri vergisini de hesaba katarsın. Başka hiçbir gider indirilmez. Aynı hisseyi farklı tarihlerde aldıysan ilk giren ilk çıkar yöntemi uygulanır. Kırk liradan beş yüz, elliden üç yüz adet aldın, elli beşten altı yüz adet sattın diyelim. Önce kırklıkların hepsi, sonra ellilikten yüz adet satılmış sayılır.", "Kur konusu çok sorulur. Yabancı para cinsinden ihraç edilen bir kıymette kur farkı matraha girmez. Ama dövize ya da altına endeksli kıymette alış ve satış bedellerinin işlem günündeki lira karşılıkları kullanılır. Bu ikisini karıştırma.", "Zarar mahsubu üç aylık dönemler halinde yapılır ve yalnızca aynı tür kıymetler arasında olur. Bir çeyrekte zarar ettiysen bunu bir sonraki çeyreğe taşıyabilirsin ama yılı aşamazsın. Yılın son çeyreğindeki zarar ertesi yıla geçmez. İlk çeyrekte otuz bin zarar, ikinci çeyrekte elli bin kâr varsa ikinci çeyrek matrahı yirmi bin olur.", "Aynı tür kıymetler dört gruptur. Sabit getirililer, değişken getirililer, diğerleri ve fonlarla yatırım ortaklıkları. Hisse endeksine dayalı vadeli işlem, hisse dayanaklı varant ve hisse senedi yoğun fon hisse senetleriyle aynı gruptadır. Dövize dayalı varant ise diğerler grubuna girer.", "Kâr paylarına geçelim. Tam mükellef şirketten aldığın kâr payının yarısı vergiden istisnadır. Kalan kısım iki bin yirmi beş için üç yüz otuz bin liralık beyan haddini aşarsa beyan edilir. Dağıtımda kesilen yüzde on beşin tamamını mahsup edebilirsin. Dokuz yüz bin lira kâr payında istisna dört yüz elli bindir, kalan dört yüz elli bin beyan edilir.", "Hisse alım satım kazancında gerçek kişiler için oran yüzde sıfırdır ve beyanname verilmez. Hisseye ve hisse endeksine dayalı vadeli işlemler, borsada işlem gören hisse varantları ve hisse senedi yoğun fonlar da yüzde sıfırdır. Tek istisna menkul kıymet yatırım ortaklıklarının hisseleridir, onlarda oran yüzde ondur. Gayrimenkul yatırım ortaklığı hisseleri ise yüzde sıfırdır.", "Vadeli işlemlerde kural kısa. Hisse ve hisse endeksine dayalı sözleşmelerde yüzde sıfır, döviz gibi diğer dayanaklarda yüzde on. Endeks sözleşmesinden seksen bin, dolar sözleşmesinden seksen bin kazandıysan yalnız dolar tarafından sekiz bin lira kesilir.", "Tahvillerde genel oran yüzde ondur. Ama Hazine'nin devlet tahvilleri ve bonoları için iki bin yirmi bir Aralık'ından iki bin yirmi altı Haziran sonuna kadar iktisap edilenlerde oran yüzde sıfırdır. Altına dayalı devlet tahvili ve darphane sertifikası da yüzde sıfırdır. Finansman bonosu ile bir yıldan kısa vadeli kira sertifikasında ise oran yüzde on beştir.", "Mevduatta güncel oranları öğren. İki bin yirmi beş Temmuz'unun dokuzundan itibaren vadesiz ve altı aya kadar vadeli hesaplarda yüzde on yedi buçuk, bir yıla kadar yüzde on beş, bir yıldan uzun vadede yüzde on uygulanır. Döviz tevdiat hesabında vade ayrımı olmadan yüzde yirmi beştir. Repoda ise oran yüzde on beştir.", "Fonlarda da tarih önemli. İki bin yirmi beş Şubat başından itibaren alınan fon paylarında oran yüzde on beş, aynı yılın Temmuz'unun dokuzundan itibaren alınanlarda yüzde on yedi buçuktur. Hisse senedi yoğun fonlarda oran yüzde sıfırdır. İki yıldan uzun tutulan gayrimenkul ve girişim sermayesi fonlarında da yüzde sıfırdır.", "Eurobondları ayrı tut. Bunlar geçici altmış yedinin dışındadır. Faiz geliri üç yüz otuz bin lirayı aşarsa beyan edilir. Alım satım kazancı ise ne kadar olursa olsun beyan edilir. Dar mükellefler eurobond için beyanname vermez.", "Dar mükellefler Türkiye'de yatırım yapmak için vergi kimlik numarası almalıdır. Çifte vergilendirmeyi önleme anlaşmasından yararlanmak için de mukimlik belgesi verirler. Bu işlerin adresi İstanbul'daki Boğaziçi Vergi Dairesi'dir.", "Son konu ihtiyari beyan. Farklı bankalarda kâr ve zararın varsa, kesilen fazla vergiyi geri almak için kullanırsın. Beyan, izleyen yılın Mart ayı içinde verilir. Süreyi kaçırırsan iade alamazsın. Yalnızca alım satım kazançları beyan edilir, faiz ve itfa gelirleri edilmez.", "Hesap örneği. Bir bankada aynı tür tahvillerden üç yüz bin kâr ettin ve otuz bin lira kesildi. Diğer bankada yüz yirmi bin zarar ettin. Net matrah yüz seksen bindir. Yüzde on ile vergi on sekiz bin olur. Otuz binden on sekiz bini çıkarınca on iki bin lira iade alırsın.", "İhtiyari beyandaki oranlar da sorulur. Hisse ve hisse dayalı türevler yüzde sıfır, hisse senedi yoğun fon yüzde sıfır, diğer fonlar yüzde on yedi buçuk. Finansman bonosu yüzde on beş, diğer kazançlar ise yüzde ondur.", "Toparlayalım. Birincisi, hisse kâr payı ve eurobond gelirleri geçici altmış yedinin dışındadır. İkincisi, matrah ilk giren ilk çıkar yöntemiyle bulunur ve yabancı para cinsinden ihraç edilen kıymette kur farkı dikkate alınmaz. Üçüncüsü, zarar yalnız aynı tür kıymetler arasında, yıl içinde ve çeyreklik olarak devreder. Dördüncüsü, hisse ve hisse endeksli türevler yüzde sıfır, döviz türevleri yüzde on, yeni alınan fonlar yüzde on yedi buçuk. Beşincisi, ihtiyari beyan Mart ayında verilir ve yalnız alım satım kazançlarını kapsar."]};
const AUD={"1": 18, "2": 18, "3": 18, "4": 19, "5": 19, "6": 20, "7": 19, "8": 21, "9": 20, "10": 19, "11": 18, "12": 21, "13": 20};
</script>
<script>
(function(){
const L="ABCDE";
const KEY="d1003-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2","#4F46E5","#BE185D","#15803D","#B45309","#0369A1","#9333EA","#0F766E","#C2410C","#1D4ED8"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("d1003"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){
  const s=S[si], col=HUE[si];
  const tab=st.tab[si]||"notlar";
  const f=st.tab["f"+si]||"tum";
  const x=secStats(si), kb=s.sorular.filter(q=>q.k).length;
  let h=`<div style="--c:${col};display:contents">
  <div class="crumb"><a href="#genel">Genel bakış</a> / Bölüm ${s.id}</div>
  <section class="hero"><div><span class="pill">Bölüm ${s.id} / ${S.length} · ${s.sorular.length} soru</span><h1>${esc(s.baslik)}</h1><p>${esc(s.ozet)}</p></div>${ring(x.c,x.n,col,"doğru")}</section>
  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,S.length>8?2:3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();
  const list=st.karma.list, x=statsOf(list,st.karma.ans);
  let h=`<div class="crumb"><a href="#genel">Genel bakış</a> / Karma deneme</div>
  <section class="hero" style="--c:#141A2B"><div><span class="pill">Tüm bölümler · ${list.length} soru</span><h1>Karma deneme</h1><p>Her bölümden en az ${S.length>8?"iki":"üç"} soru içeren rastgele set. Buradaki cevaplar bölüm skorlarını etkilemez.</p></div>${ring(x.c,list.length,"#0E8F7E","doğru")}</section>
  ${bar(x,`<button class="btn pri" data-newkarma="1">Yeni set oluştur</button>`)}<div class="qlist">`;
  const saved=st.ans; st.ans=st.karma.ans;
  list.forEach(([s,qi],n)=>{h+=qCard(s,qi,n+1,true)});
  st.ans=saved;
  return h+`</div>`;
}

function renderHome(){
  let tA=0,tC=0;S.forEach((s,i)=>{const x=secStats(i);tA+=x.a;tC+=x.c});
  let h=`<section class="hero"><div><span class="pill">SPL · Sermaye Piyasası Araçları 1</span><h1>Sermaye Piyasası Araçları 1 Sınav Defteri</h1>
  <p>Pay, borçlanma araçları, yatırım fonları, türev araçlar ve GVK geçici 67. madde için bölüm notları ve sorular.</p>
  <div class="row" style="margin-top:18px"><a class="btn pri" href="#b1">Bölüm 1'den başla</a><a class="btn" href="#karma">Karma deneme</a></div></div>${ring(tC,TOTAL,"#0E8F7E","toplam doğru")}</section>
  <div class="tiles"><div class="tile"><span>Yanıtlanan</span><b>${tA}<small style="font-size:14px;color:var(--muted)"> / ${TOTAL}</small></b></div><div class="tile"><span>Doğru</span><b style="color:var(--ok)">${tC}</b></div><div class="tile"><span>Başarı oranı</span><b>${tA?"%"+Math.round(tC/tA*100):"–"}</b></div></div>
  <div class="sec-h"><h2>Bölümler</h2><span class="stat">${TOTAL} soru</span></div>
  <div class="grid">`;
  S.forEach((s,i)=>{const x=secStats(i);const kb=s.sorular.filter(q=>q.k).length;h+=`<a class="card" href="#b${s.id}" style="--c:${HUE[i]}"><div class="top"><span class="no">Bölüm ${s.id}</span><span class="stat">${s.sorular.length} soru</span></div><span class="t">${esc(s.kisa)}</span><span class="d">${esc(s.ozet)}</span>${meter(x.a,x.c,x.n)}<span class="p"><span>${x.c}/${x.n} doğru</span><span>${x.a} yanıt</span></span></a>`});
  h+=`</div>
  <section class="facts"><h2>Sınav öncesi son bakış</h2><dl>
  <div><dt>Oyda imtiyaz üst sınırı</dt><dd>Bir paya en çok 15 oy</dd></div>
  <div><dt>Yetkili kuruluş yüklenimi</dt><dd>750 milyon TL altı tamamı; 1,5 milyar TL&#x27;ye kadar kademeli</dd></div>
  <div><dt>İlk halka arz sonrası kısıt</dt><dd>Dağıtımdan alan 90 gün, mevcut ortak 180 gün</dd></div>
  <div><dt>Rüçhan hakkı kullanım süresi</dt><dd>15–60 gün</dd></div>
  <div><dt>Pay geri alım sınırı</dt><dd>Sermayenin %10&#x27;u</dd></div>
  <div><dt>Tahsisli satış sınırı</dt><dd>150 yatırımcı (nitelikli hariç)</dd></div>
  <div><dt>Borçlanma aracı ihraç limiti</dt><dd>Halka açık özkaynak x5, değilse x3</dd></div>
  <div><dt>PPF vade sınırı</dt><dd>Ort. 45 gün, tek varlık 184 gün</dd></div>
  <div><dt>Fon portföy limitleri</dt><dd>Tek ihraççı %10, 5/40, grup %20</dd></div>
  <div><dt>Teminat tamamlama</dt><dd>Ertesi iş günü 15:00</dd></div>
  </dl></section>`;
  return h;
}

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b(\d+)$/.exec(r);
  if(m&&+m[1]>=1&&+m[1]<=S.length) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const AU=new Audio();AU.preload="auto";
const PK="d1003-ses-v1";

try{const r=localStorage.getItem(PK);if(r)pref=Object.assign(pref,JSON.parse(r))}catch(e){}
const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(pref))}catch(e){}};

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["TLREFK", "Türk Lirası Gecelik Katılım Referans Getiri Oranı"],["PD/DD", "piyasa değeri bölü defter değeri"],["EBDKS", "endekse bağlı devre kesici sistemi"],["TLREF", "Türk Lirası Gecelik Referans Faiz Oranı"],["KVBAF", "kısa vadeli borçlanma araçları fonu"],["TEFAS", "Türkiye Elektronik Fon Alım Satım Platformu"],["BIST", "Borsa İstanbul"],["BİAŞ", "Borsa İstanbul Anonim Şirketi"],["FDPD", "fiili dolaşımdaki payların piyasa değeri"],["TCMB", "Türkiye Cumhuriyet Merkez Bankası"],["DİBS", "devlet iç borçlanma senedi"],["VİOP", "Vadeli İşlem ve Opsiyon Piyasası"],["VBTS", "Volatilite Bazlı Tedbir Sistemi"],["SPAN", "sermaye piyasası aracı notu"],["FİSİ", "fiyat istikrarını sağlayıcı işlemler"],["TSPB", "Türkiye Sermaye Piyasaları Birliği"],["GSYF", "girişim sermayesi yatırım fonu"],["MKYO", "menkul kıymetler yatırım ortaklığı"],["PÖİP", "Piyasa Öncesi İşlem Platformu"],["YÜFP", "Yapılandırılmış Ürünler ve Fon Pazarı"],["BASK", "Borçlanma Aracı Sahipleri Kurulu"],["ISIN", "uluslararası menkul kıymet tanımlama numarası"],["ICMA", "Uluslararası Sermaye Piyasası Birliği"],["IBOR", "bankalararası teklif oranı"],["SOFR", "teminatlı gecelik finansman oranı"],["TÜFE", "tüketici fiyat endeksi"],["VDMK", "varlığa dayalı menkul kıymet"],["İDMK", "ipoteğe dayalı menkul kıymet"],["İTMK", "ipotek teminatlı menkul kıymet"],["VTMK", "varlık teminatlı menkul kıymet"],["TFRS", "Türkiye Finansal Raporlama Standartları"],["BSMV", "banka ve sigorta muameleleri vergisi"],["GVGT", "Gelir Vergisi Genel Tebliği"],["FIFO", "ilk giren ilk çıkar"],["SPK", "Sermaye Piyasası Kurulu"],["KAP", "Kamuyu Aydınlatma Platformu"],["MKK", "Merkezi Kayıt Kuruluşu"],["MKS", "Merkezi Kayıt Sistemi"],["SGK", "Sosyal Güvenlik Kurumu"],["HBK", "hisse başına kazanç"],["F/K", "fiyat bölü kazanç"],["FDO", "fiili dolaşım oranı"],["MKT", "merkezi karşı taraf"],["BYF", "borsa yatırım fonu"],["YFİ", "yüksek frekanslı işlemler"],["İBD", "ihraççı bilgi dokümanı"],["GİP", "Gelişen İşletmeler Piyasası"],["SFY", "sabit fiyat yöntemi"],["DFY", "değişken fiyat yöntemi"],["İKG", "iptale kadar geçerli"],["KİE", "kalanı iptal et"],["OKS", "otomatik katılım sistemi"],["PYŞ", "portföy yönetim şirketi"],["GYF", "gayrimenkul yatırım fonu"],["GVK", "Gelir Vergisi Kanunu"],["YİP", "Yakın İzleme Pazarı"],["GSP", "Girişim Sermayesi Pazarı"],["AOF", "ağırlıklı ortalama fiyat"],["BAP", "Borçlanma Araçları Piyasası"],["YTM", "vadeye kadar getiri"],["IRR", "iç verim oranı"],["CDS", "kredi temerrüt takası"],["OTC", "tezgahüstü"],["UST", "ABD Hazine tahvili"],["ROT", "rekabetçi olmayan teklif"],["PPF", "para piyasası fonu"],["GYO", "gayrimenkul yatırım ortaklığı"],["VKŞ", "varlık kiralama şirketi"],["PSR", "fiyat değişim aralığı"],["BKK", "Bakanlar Kurulu Kararı"],["VKN", "vergi kimlik numarası"],["AT1", "ilave ana sermaye"],["BT", "brüt takas"],["PD", "piyasa değeri"],["FD", "fiili dolaşımdaki"],["CK", "Cumhurbaşkanı Kararı"],["SPKn","Sermaye Piyasası Kanunu"],["TTSG","Türkiye Ticaret Sicili Gazetesi"],["TRİK","teminat, rehin, ipotek ve kefalet"],["YİB","yatırımcı ilişkileri bölümü"],["KYBF","Kurumsal Yönetim Bilgi Formu"],["URF","Uyum Raporu"],["KSS","kurumsal sosyal sorumluluk"],["NBD","net bugünkü değer"],["KGK","Kamu Gözetimi Kurumu"],["KYD","kurumsal yönetim derecelendirme"],["TTK","Türk Ticaret Kanunu"],["YK","yönetim kurulu"],["GK","genel kurul"],["KY","kurumsal yönetim"],["PD","piyasa değeri"],["FD","fiili dolaşımdaki"],["GM","genel müdür"],["SP","sermaye piyasası"],["ÇSY","çevresel, sosyal ve kurumsal yönetim"],["AB","Avrupa Birliği"],["ABD","Amerika Birleşik Devletleri"],["SOX","Sarbanes Oxley"]];
function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}
  t=t.replace(/(\p{Ll})[’'](\p{L})/gu,"$1$2").replace(/\s+/g," ");
  return t.trim();
}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"&&typeof AUD!=="undefined"?"Bu bölümün podcast'i hazır bir kayıttır; oynat düğmesine bas, anlatılan paragrafı burada takip et.":pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];if(typeof AUD!=="undefined"&&AUD[si+1])P[si+1].forEach((par,k)=>items.push({el:-1,raw:par,say:par,src:"audio/b"+(si+1)+"-"+(k+1)+".mp3"}));else P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;
}
function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  {const au=pref.mode==="podcast"&&typeof AUD!=="undefined";$("pVoice").parentNode.hidden=au;if(au)$("pWarn").hidden=true;}
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){
  const vs=synth.getVoices();const tr=trVoices();
  return vs.find(v=>v.name===pref.voice)||tr[0]||null;
}
function fillVoices(){
  if(!synth)return;
  const vs=synth.getVoices();const tr=trVoices();const list=tr.length?tr:vs;
  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  if(items[idx].src){if(synth)synth.cancel();const tok={};utt=tok;AU.src=items[idx].src;AU.playbackRate=pref.rate;
    AU.onended=()=>{if(utt!==tok||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
    AU.onerror=()=>{if(utt!==tok)return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses dosyası yüklenemedi; bağlantını kontrol edip tekrar dene."};
    AU.play().catch(()=>{});ui();return}
  AU.pause();
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth&&typeof AUD==="undefined"){return}
  let si=curSi>=0?curSi:(qSi>=0?qSi:0);
  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}
  playing=true;speak();
}
function pause(){playing=false;utt=null;AU.pause();if(synth)synth.cancel();ui()}
function stop(finished){playing=false;utt=null;AU.pause();if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth&&typeof AUD==="undefined"){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing&&items[idx]&&items[idx].src){AU.playbackRate=pref.rate;ui()}else if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}
  navByPlayer=false;ui();
});
window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
})();

</script>
