<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}

<script>
const S=[{"id": 1, "kisa": "Pay ve Ortaklık Yapısı", "baslik": "Genel Çerçeve I: Anonim Şirket, Pay Türleri ve Pay Sahipliği Hakları", "ozet": "Anonim şirketin sorumluluk rejimi ve organları, payın hukuki niteliği, pay türleri, tedavüldeki ve fiili dolaşımdaki paylar, değer kavramları, kaydi sistem ve pay sahipliği hakları.", "notlar": "<h3>Anonim şirket: tanım ve sorumluluk<\/h3>\n<ul>\n<li><b>TTK m.329<\/b>: anonim şirket, <b>sermayesi belirli ve paylara bölünmüş<\/b>, borçlarından dolayı <b>yalnız malvarlığıyla sorumlu<\/b> şirkettir.<\/li>\n<li>Büyük ölçekli sermaye birikimine imkân verir ve <b>halka açılmaya elverişli tek sermaye şirketi türüdür<\/b>; bu yüzden sermaye piyasasının temel aktörüdür.<\/li>\n<li>Kurucu ve ortaklarından ayrı <b>tüzel kişiliği<\/b> vardır: hak ehliyeti, kendi adına gayrimenkul edinme, borçlanma, sözleşme yapma, davacı veya davalı olma.<\/li>\n<li>Pay sahipliği şirket malvarlığı üzerinde <b>doğrudan mülkiyet hakkı vermez<\/b>; yalnız şirkete karşı ortaklık hakları (kâr payı, oy vb.) sağlar.<\/li>\n<\/ul>\n<table>\n<tr><th>Taraf<\/th><th>Sorumluluk<\/th><\/tr>\n<tr><td>Anonim şirket<\/td><td>Alacaklılarına karşı <b>tüm malvarlığıyla sınırsız<\/b> sorumludur.<\/td><\/tr>\n<tr><td>Pay sahibi<\/td><td>Şirket borçlarından alacaklılara karşı sorumlu değildir. Tek borcu <b>taahhüt ettiği sermaye payı bedelini ödemektir<\/b>. Bu borcu tamamen ödemişse şirket iflas etse dahi şahsi malvarlığına başvurulamaz.<\/td><\/tr>\n<tr><td>Kamu borçları<\/td><td>Limited şirketin aksine, anonim şirkette pay sahibi (<b>YK üyesi değilse<\/b>) ödenmeyen vergi ve SGK primlerinden kişisel olarak sorumlu tutulamaz.<\/td><\/tr>\n<\/table>\n\n<h3>Teşkilat yapısı<\/h3>\n<ul>\n<li>İki <b>zorunlu organ<\/b>: <b>genel kurul<\/b> ve <b>yönetim kurulu<\/b>. Halka açık ortaklıklarda bunlara yardımcı komiteler ve dış denetim eşlik eder.<\/li>\n<li><b>Genel kurul<\/b>: en üst karar organı, tüm pay sahiplerini temsil eder; günlük yönetime karışmaz. Münhasır yetkileri: YK üyelerinin seçimi, ibrası, azli; finansal tabloların onayı ve kâr dağıtımı kararı; esas sözleşme değişikliği; bağımsız denetçinin seçimi; birleşme, bölünme, sona erme gibi önemli işlemler.<\/li>\n<li><b>Yönetim kurulu<\/b>: genel kurulca seçilen yönetim ve temsil organı. <b>Devredilemez görevleri<\/b>: muhasebe düzeninin kurulması, finansal denetim mekanizmalarının oluşturulması, yönetim teşkilatının belirlenmesi, <b>borca batıklık hâlinde mahkemeye bildirim<\/b>.<\/li>\n<li><b>İcracı üye<\/b>: günlük operasyonel yönetimde de görevli (tipik örnek: YK'da yer alan genel müdür). <b>İcracı olmayan üye<\/b>: günlük işe katılmaz; yönetimi denetler, strateji geliştirir. SPK Kurumsal Yönetim İlkelerine göre YK üyelerinin <b>çoğunluğu icracı olmayan<\/b> üyelerden oluşmalıdır.<\/li>\n<li><b>Bağımsız üye<\/b>: icracı olmayanların içinde özel statü; şirket, ortaklar veya ilişkili taraflarla kararını etkileyecek mali, idari, ticari bağı olmayan, <b>Türkiye'de yerleşik gerçek kişi<\/b>.<\/li>\n<li>Eski kanundaki <b>murakıplık (denetim kurulu) 6102 sayılı TTK ile kaldırıldı<\/b>. Denetim artık genel kurulca seçilen <b>bağımsız denetim kuruluşu<\/b> ve YK bünyesindeki komitelerle yürür (Denetim Komitesi, Riskin Erken Saptanması Komitesi, Kurumsal Yönetim Komitesi). Komiteler <b>organ değildir<\/b>.<\/li>\n<li>YK, bir <b>iç yönerge<\/b> ile yönetim yetkisini (devredilemez yetkiler hariç) kısmen veya tamamen murahhas üyelere ya da profesyonel yöneticilere devredebilir. Genel müdür hukuken zorunlu organ değil, YK'ya karşı sorumlu icra makamıdır.<\/li>\n<\/ul>\n\n<h3>Finansman: borçlanma ve özkaynak<\/h3>\n<table>\n<tr><th>Ölçüt<\/th><th>Borçlanma (yabancı kaynak)<\/th><th>Özkaynak (pay)<\/th><\/tr>\n<tr><td>Yatırımcının statüsü<\/td><td>Alacaklı<\/td><td>Ortak (pay sahibi)<\/td><\/tr>\n<tr><td>Vade<\/td><td>Önceden belirli<\/td><td>Yok; şirket var oldukça sürer<\/td><\/tr>\n<tr><td>Getiri<\/td><td>Faiz veya iskonto; bu oranla sınırlı<\/td><td>Kâr payı ve sermaye kazancı; garanti yok, potansiyel sınırsız<\/td><\/tr>\n<tr><td>Yönetime katılım<\/td><td>Oy hakkı yok<\/td><td>Oy hakkı var<\/td><\/tr>\n<tr><td>Tasfiye/iflasta sıra<\/td><td>Pay sahiplerinden önce<\/td><td>En sonda: <b>artık değer (residual)<\/b> hak sahibi<\/td><\/tr>\n<\/table>\n<ul>\n<li>Borçlanma aracı ihracı SPK onaylı <b>izahname veya ihraç belgesi<\/b> çerçevesinde yapılır (tahvil, finansman bonosu).<\/li>\n<li><b>Kıdem sırası<\/b>: devlet borçları, çalışan hakları ve borçlanma aracı sahipleri pay sahiplerinden önce ödenir. Bu nedenle pay sahipliği daha riskli, getiri potansiyeli daha yüksektir.<\/li>\n<\/ul>\n\n<h3>Genel olarak pay<\/h3>\n<ul>\n<li>Pay, anonim şirketler hukukunun <b>merkez kavramıdır<\/b>: hak ve yükümlülükler pay üzerinden belirlenir. Pay, sermayenin nominal değere göre bölünmüş parçasıdır.<\/li>\n<li><b>TTK m.476<\/b>: payın nominal (itibari) değeri <b>bir kuruştan az olamaz<\/b>; birer kuruş ve katları şeklinde yükseltilebilir. Borsada işlem gören ortaklıklarda genellikle <b>1 TL<\/b>'dir.<\/li>\n<li>Pay ortaklığa karşı <b>bölünmez<\/b>. Birden fazla sahibi varsa haklar <b>ortak bir temsilci<\/b> aracılığıyla kullanılır; temsilci atanmamışsa pay sahiplerinden birine yapılan tebligat diğerlerine de yapılmış sayılır.<\/li>\n<li>Senede bağlanan pay = <b>pay senedi (hisse senedi)<\/b>; kıymetli evraktır. Bir hisse senedi bir veya birden fazla payı temsil edebilir. <b>Küpür değeri = pay değeri × senedin temsil ettiği pay sayısı.<\/b> Örnek: sermaye 1 TL nominal değerli bir milyon paya bölünmüşse 1 TL'lik her senet sermayenin milyonda birine katılım hakkı verir.<\/li>\n<\/ul>\n\n<h3>Sermaye piyasası aracı olarak pay<\/h3>\n<ul>\n<li>6362 sayılı SPKn, AB direktiflerine uyum için <b>sermaye piyasası aracı<\/b> üst kavramını kullanır; altında <b>menkul kıymetler, türev araçlar ve diğer sermaye piyasası araçları<\/b> yer alır.<\/li>\n<li><b>SPKn m.3/1-(o)<\/b> menkul kıymet: <b>para, çek, poliçe ve bono hariç<\/b>; paylar, pay benzeri kıymetler ve bunlara ilişkin depo sertifikaları; borçlanma araçları veya menkul kıymetleştirilmiş varlık ve gelirlere dayalı borçlanma araçları ve bunlara ilişkin depo sertifikaları.<\/li>\n<li><b>Kanunda \"pay\" tanımlanmamıştır.<\/b> Tanım <b>VII-128.1 sayılı Pay Tebliği<\/b>'ndedir: ortaklığın sermayesini temsil eden ve sahibine ortaklık hakkı veren menkul kıymet.<\/li>\n<li>Her anonim ortaklık payı sermaye piyasası aracı sayılmaz. Uygulamada sermaye piyasası aracı niteliğindeki paylar: <b>borsada işlem gören<\/b> ortaklıkların payları ve <b>Kanun uyarınca halka açık kabul edilen<\/b> ortaklıkların payları.<\/li>\n<li>İlk halka arz için <b>izahnamenin<\/b>; halka açık ortaklığın ihracı ve/veya halka arzı için <b>izahname veya ihraç belgesinin<\/b> Kurulca onaylanması gerekir.<\/li>\n<li>Fiyatın doğru oluşması için fiyatı etkileyebilecek her bilginin <b>tam ve zamanında<\/b> piyasada olması gerekir; aksi hâlde bilgi asimetrisi doğar. Yüksek <b>tedavül kabiliyeti<\/b> (kolay devir) aracılık, borsa, takas-saklama ve kamusal denetimden oluşan kurumsal altyapıyı gerektirmiştir.<\/li>\n<\/ul>\n\n<h3>Pay türleri<\/h3>\n<h4>Adi ve imtiyazlı paylar<\/h4>\n<ul>\n<li>Esas sözleşmede aksine hüküm yoksa pay <b>adi pay<\/b>dır; adi paylar eşit hak verir.<\/li>\n<li><b>İmtiyaz<\/b> (TTK): kâr payı, tasfiye payı, rüçhan, oy gibi haklarda bazı paylara veya belirli grup oluşturan pay sahiplerine tanınan <b>üstün hak<\/b> ya da kanunda öngörülmemiş <b>yeni bir pay sahipliği hakkı<\/b>.<\/li>\n<li>İmtiyaz kural olarak <b>paya<\/b> tanınır, pay sahibine değil. Ancak belirli grup oluşturan pay sahiplerine ve azlığa <b>YK'da temsil hakkı<\/b> tanınabilir; YK'da temsil hakkı tanınan paylar imtiyazlı sayılır.<\/li>\n<li><b>Oyda imtiyaz<\/b>: eşit itibari değerdeki paylara farklı sayıda oy verilerek tanınır; istisnai hâller dışında bir paya <b>en çok 15 oy<\/b>.<\/li>\n<li>Dikkat: oyda imtiyaz <b>esas sözleşme değişikliği<\/b> ile <b>ibra ve sorumluluk davası açılması<\/b> kararlarında <b>kullanılamaz<\/b>. YK seçimi gibi adi kararlarda kullanılır.<\/li>\n<\/ul>\n<table>\n<tr><th>Kitaptaki örnek<\/th><th>Adet<\/th><th>Sermaye payı<\/th><th>Oy<\/th><th>Oy oranı<\/th><\/tr>\n<tr><td>Adi paylar<\/td><td>900.000<\/td><td>%90<\/td><td>900.000<\/td><td>%37,5<\/td><\/tr>\n<tr><td>İmtiyazlı paylar (15 oy)<\/td><td>100.000<\/td><td>%10<\/td><td>1.500.000<\/td><td>%62,5<\/td><\/tr>\n<tr><td>Toplam<\/td><td>1.000.000<\/td><td>%100<\/td><td>2.400.000<\/td><td>%100<\/td><\/tr>\n<\/table>\n<h4>Bedelli ve bedelsiz paylar<\/h4>\n<ul>\n<li><b>Bedelsiz pay<\/b>: iç kaynaklardan ve kâr payından yapılan artırımla çıkar; ortaktan bedel istenmez, şirkete dışarıdan fon girmez.<\/li>\n<li><b>Bedelli pay<\/b>: yeni fon için yapılan nakit artırımla çıkar; rüçhan hakkıyla mevcut ortaklara veya rüçhan kısıtlanarak yeni yatırımcılara satılabilir.<\/li>\n<li>Dikkat: nakit artırım olmasa da <b>birleşmede<\/b> devralan şirketin devrolan şirket ortaklarına malvarlığı karşılığında verdiği paylar da <b>bedelli<\/b> sayılır.<\/li>\n<\/ul>\n<h4>Primli ve primsiz paylar<\/h4>\n<ul>\n<li>Nominal değerle ihraç = <b>primsiz<\/b>; nominal değerin üstünde ihraç = <b>primli<\/b>. Olumlu fark muhasebede özkaynaklar altında <b>emisyon primi (pay ihraç primi)<\/b> olarak izlenir.<\/li>\n<li>Nakit artırımda rüçhan hakkı kullanımından sonra kalan paylar borsa birincil piyasasında <b>nominal değerin altında olmamak üzere piyasa fiyatından<\/b> satılmak zorunda olduğundan, borsa fiyatı nominalin üstündeki ortaklıklarda bu payların tamamına yakını primli satılır.<\/li>\n<li>Payları borsada işlem gören ortaklıklarda <b>nominal değerin altında<\/b> ihraç da mümkündür. Kayıtlı sermaye sisteminde primli ve nominal altı ihraç için <b>YK'ya yetki<\/b> verilebilir.<\/li>\n<\/ul>\n<h4>Kurucu ve intifa payları<\/h4>\n<ul>\n<li><b>İntifa payı<\/b>: genel kurulca esas sözleşme uyarınca veya değiştirilerek; bedeli kanuna uygun olarak yok edilen payların sahipleri, alacaklılar veya benzer sebeple şirketle ilgili olanlar lehine çıkarılır. Kuruluşta hizmeti geçenlere verilirse <b>kurucu (intifa) payı<\/b> adını alır.<\/li>\n<li>Dikkat: bunlara <b>pay sahipliği hakları verilemez<\/b> (oy, genel kurula katılma gibi). Verilebilecekler: <b>net kâra katılma<\/b>, <b>tasfiye sonucu kalan tutara katılma<\/b>, <b>yeni çıkarılacak payları alma<\/b> hakları.<\/li>\n<\/ul>\n<h4>Tedavüldeki paylar<\/h4>\n<ul>\n<li>İhraç edilmiş payların tamamı esas sermaye sisteminde <b>esas sermaye<\/b>, kayıtlı sermaye sisteminde <b>çıkarılmış sermaye<\/b>yi oluşturur.<\/li>\n<li>Halka açık ortaklıklarda geri alım <b>II-22.1 sayılı Geri Alınan Paylar Tebliği<\/b>'ne tabidir. Geri alınan paylar bilançoda özkaynaklardan <b>indirim kalemi<\/b> olarak izlenir ve <b>hakları donuk<\/b>tur.<\/li>\n<li>Tebliğ m.18: şirket veya bağlı ortaklık elindeki bu payların <b>oy hakları ve yönetimsel hakları dondurulur<\/b>; <b>kâr payı alma<\/b> ve <b>bedelsiz pay edinme<\/b> hakları <b>saklıdır<\/b>. Rüçhan hakları kullanılamaz; bu haklar ortaklıkça ilgili pazarda <b>satılarak nakde çevrilmek zorundadır<\/b>.<\/li><li>Dikkat: kitabın Pay Geri Alım Programları kısmı (3.5) bu payların <b>kâr payı ve rüçhan hariç<\/b> hak vermediğini söyler; kaynak rüçhan ve bedelsiz pay konusunda kendi içinde tutarsızdır. Her iki anlatımda ortak olan: <b>oy hakları donar<\/b> ve paylar <b>toplantı nisabında dikkate alınmaz<\/b>.<\/li>\n<li><b>Tedavüldeki paylar = Toplam sermaye − Geri alınan paylar.<\/b> Genel kurul karar nisapları ve yönetim kontrolü tedavüldeki paylara göre belirlenir.<\/li>\n<li>Finansal analizde de genellikle tedavüldeki paylar esas alınır; kâr daha az paya bölündüğü için <b>HBK yükselir<\/b>. Örnek: 190 milyon TL kâr, 100 milyon pay, 5 milyon geri alınmış: toplam paya göre HBK 1,90 TL, tedavüldeki paya göre 2,00 TL.<\/li>\n<li>Borsa İstanbul ve yerel veri sağlayıcılar genellikle <b>toplam sermaye<\/b>yi; bazı uluslararası platformlar <b>tedavüldeki pay sayısı<\/b>nı kullanır. Bu fark piyasa değerini, HBK'yı ve F/K, PD/DD çarpanlarını farklılaştırır; verinin brüt mü net mi olduğu teyit edilmelidir.<\/li>\n<\/ul>\n<h4>Fiili dolaşımdaki paylar<\/h4>\n<ul>\n<li>SPK'nın <b>23.07.2010 tarih ve 21/655 sayılı Kararı<\/b> ile tanımlanmıştır; borsada işlem gören şirketlerin <b>halka açıklık oranını<\/b> gösterir. Piyasada gerçekten işlem görebilen, serbest dolaşımdaki paylardır.<\/li>\n<li><b>Fiili dolaşıma dahil edilmeyenler<\/b>: kamu tüzel kişiliklerinin payları; kurucular, yakın aile üyeleri ve ilişkili kuruluşların payları; <b>sermayenin %10 ve üzerine<\/b> sahip gerçek veya tüzel kişi ortakların payları; YK üyeleri, üst düzey yöneticiler ve yakın aile üyelerinin payları; şirket sandık ve vakıflarının payları; teminat verilen, hukuken kısıtlı, alım satıma konu edilemeyen, yasaklı veya hacizli paylar.<\/li>\n<li>Dikkat: %10 eşiği, <b>30.10.2014 tarihli i-SPK.128.9<\/b> sayılı Kararla <b>%5'ten %10'a<\/b> yükseltilmiştir.<\/li>\n<li>Fiili dolaşımdaki pay miktarı genellikle tedavüldeki paylardan düşüktür. Endeks ağırlıklandırmasında, fiili piyasa değeri ve halka açıklık oranı hesabında esas alınır.<\/li>\n<li>Kitap örneği: 100 milyon pay; bireysel 25 milyon ve yatırım amaçlı fonlar 14 milyon dahil; hakim ortak, YK üyeleri, vakıf, hacizli paylar hariç. Fiili dolaşım oranı = 39/100 = <b>%39<\/b>.<\/li>\n<li><b>Toplam piyasa değeri = toplam pay sayısı × güncel fiyat<\/b> (toplam yerine tedavüldeki pay sayısı da kullanılabilir). <b>Fiili dolaşımdaki payların piyasa değeri<\/b> = yalnız FD paylar × fiyat; BIST pay endekslerinin ağırlıklandırmasında bu esas alınır. Piyasa değeri yüksek ama fiili dolaşım oranı düşük şirketin endeks etkisi sınırlıdır.<\/li>\n<\/ul>\n\n<h3>Değer kavramları<\/h3>\n<table>\n<tr><th>Değer<\/th><th>Anlamı<\/th><th>Kullanım<\/th><\/tr>\n<tr><td><b>Nominal (itibari)<\/b><\/td><td>Hukuki, şekli değer; genelde 1 TL. Piyasa fiyatından bağımsızdır.<\/td><td>Sermaye hesabı, sermaye artırımları, ticaret sicili kayıtları<\/td><\/tr>\n<tr><td><b>Defter<\/b><\/td><td>Özkaynak toplamı / toplam pay sayısı (varlıklar − borçlar). Marka değeri, müşteri potansiyeli gibi görünmeyen varlıkları tam içermeyebilir.<\/td><td>PD/DD analizi, mali analiz<\/td><\/tr>\n<tr><td><b>Tasfiye<\/b><\/td><td>Tüm varlıklar cari piyasa değerinden nakde çevrilip borçlar ödendikten sonra pay başına kalan tutar.<\/td><td>İflas, tasfiye, birleşme analizi; değerlemede <b>alt sınır (dip fiyat)<\/b> göstergesi<\/td><\/tr>\n<tr><td><b>Piyasa<\/b><\/td><td>Borsada arz-talebe göre oluşan anlık fiyat; toplamda güncel fiyat × toplam pay sayısı. \"Gerçek\" değeri yansıtmayabilir.<\/td><td>Piyasa büyüklüğü, endeks ağırlıkları<\/td><\/tr>\n<tr><td><b>İçsel<\/b><\/td><td>Gelecekteki nakit akışları, büyüme ve risklere göre hesaplanan \"olması gereken\" teorik değer.<\/td><td>Yatırım kararları, değerleme raporları<\/td><\/tr>\n<\/table>\n<ul>\n<li>Yatırımda amaç: içsel değeri piyasa fiyatının üzerinde olan payları bulmak. Defter değeri tarihi maliyete dayandığı için tasfiye değeri ayrıca önemlidir.<\/li>\n<\/ul>\n\n<h3>Kaydi sistem<\/h3>\n<ul>\n<li><b>SPKn m.13<\/b>: sermaye piyasası araçlarının <b>senede bağlanmaksızın elektronik ortamda kayden ihracı esastır<\/b>. Borsada işlem gören halka açık ortaklık paylarındaki mülkiyet ve diğer haklar <b>MKK<\/b> nezdinde hak sahibi bazında izlenir.<\/li>\n<li>Borsada işlem gören şirket payları için <b>fiziki senet basımı son bulmuştur<\/b>; devir zilyetliğin devriyle değil, MKK hesapları arasındaki kayıtlarla hüküm doğurur.<\/li>\n<li><b>Kaydileştirme zorunluluğu dışında bırakılanlar<\/b>: payları borsada işlem görmeyen ve <b>sadece ortak sayısı nedeniyle<\/b> halka açık sayılan ortaklıklar; <b>kooperatif veya kooperatif birliklerinin yönetim kontrolüne<\/b> sahip olduğu halka açık ortaklıklar.<\/li>\n<\/ul>\n\n<h3>Pay sahipliği hakları<\/h3>\n<table>\n<tr><th>Mali haklar<\/th><th>Yönetimsel (idari) haklar<\/th><\/tr>\n<tr><td><b>Kâr payı (temettü)<\/b>: dağıtılmasına karar verilen net kârdan pay oranında nakit veya pay olarak.<br><b>Yeni pay alma (rüçhan)<\/b>: bedelli artırımda yeni paylardan, üçüncü kişilerden önce, mevcut pay oranında alma; seyrelmeyi önler.<br><b>Bedelsiz pay alma<\/b>: geçmiş yıl kârları, yedekler gibi iç kaynaklardan artırımda bedelsiz pay.<br><b>Tasfiye bakiyesine katılma<\/b>: borçlar ve tasfiye giderleri sonrası kalandan pay.<br><b>Ayrılma hakkı<\/b>: birleşme, bölünme, tür değiştirme, önemli nitelikteki işlemlerde olumsuz oy verip muhalefet şerhini tutanağa geçirtenler paylarını şirkete satabilir.<br><b>Satma hakkı<\/b>: bir pay sahibi doğrudan veya dolaylı <b>oy haklarının en az %98'ine<\/b> ulaşırsa azınlık paylarını hakim ortağa satmayı talep edebilir.<\/td>\n<td><b>Genel kurula katılma ve oy<\/b>: olağan ve olağanüstü toplantılara fiziken veya elektronik ortamda katılıp YK seçimi, finansal tablo onayı, kâr dağıtımı, esas sözleşme değişikliği gibi konularda oy.<br><b>Bilgi alma ve inceleme<\/b>: finansal tablolar, faaliyet raporları, bağımsız denetim raporları ve özel durum açıklamalarını inceleme.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Halka açık şirketlerde sermayenin <b>%5<\/b>'ini temsil eden pay sahipleri <b>azınlık<\/b> sayılır: genel kurulu toplantıya çağırma, gündeme madde ekletme, özel denetçi isteme gibi geniş yetkileri vardır.<\/li>\n<\/ul>", "sorular": [{"q": "TTK m.329'daki anonim şirket tanımına göre anonim şirket borçlarından dolayı nasıl sorumludur?", "o": ["Ortaklarıyla birlikte müteselsilen", "Yalnız kendi malvarlığıyla", "Ortakların payları oranında şahsi malvarlıklarıyla", "Yalnız ödenmiş sermayesi tutarında", "Yönetim kurulu üyeleriyle birlikte sınırsız olarak"], "a": 1, "e": "TTK m.329: anonim şirket sermayesi belirli ve paylara bölünmüş, borçlarından dolayı yalnız malvarlığıyla sorumlu şirkettir."}, {"q": "Bir anonim şirket iflas etmiş ve alacaklılarına 35 milyon TL borcu kalmıştır. Sermayenin %8'ine sahip, taahhüt ettiği pay bedelini tamamen ödemiş ve yönetim kurulunda görevi olmayan ortak için hangisi doğrudur?", "o": ["Ortak, payı oranında 2,8 milyon TL'den şahsen sorumludur", "Ortak, kalan borcun tamamından müteselsilen sorumludur", "Ortak yalnız şirketin vergi borçlarından şahsen sorumludur", "Alacaklılar bu ortağın şahsi malvarlığına başvuramaz", "Ortak, borcun yarısından sorumlu olup kalanı kamu tarafından karşılanır"], "a": 3, "e": "Pay sahibinin şirkete tek borcu taahhüt ettiği sermaye payını ödemektir; ödemişse iflasta dahi şahsi malvarlığına gidilemez. YK üyesi olmayan pay sahibi vergi ve SGK borçlarından da kişisel sorumlu tutulamaz."}, {"q": "Aşağıdakilerden hangisi genel kurulun değil, yönetim kurulunun kanunen devredilemez görevleri arasındadır?", "o": ["Borca batıklık durumunda mahkemeye bildirimde bulunmak", "Bağımsız denetçiyi seçmek", "Esas sözleşmeyi değiştirmek", "Yönetim kurulu üyelerini ibra etmek", "Şirketin birleşmesine karar vermek"], "a": 0, "e": "Muhasebe düzeni, finansal denetim mekanizması, yönetim teşkilatı ve borca batıklıkta mahkemeye bildirim YK'nın devredilemez görevleridir; diğerleri genel kurulun münhasır yetkisidir."}, {"q": "6102 sayılı TTK ile kaldırılan ve yerini bağımsız denetim ile yönetim kurulu bünyesindeki komitelere bırakan organ hangisidir?", "o": ["Denetim komitesi", "Riskin erken saptanması komitesi", "Kurumsal yönetim komitesi", "Murahhas üyelik", "Murakıplık (denetim kurulu)"], "a": 4, "e": "Eski kanundaki murakıplık 6102 sayılı TTK ile kaldırılmıştır. Komiteler bugün de vardır ancak organ değildir."}, {"q": "SPK Kurumsal Yönetim İlkelerine göre yönetim kurulu yapısına ilişkin hangisi doğrudur?", "o": ["Üyelerin çoğunluğu icracı olmalıdır", "Genel müdür yönetim kurulunda yer alamaz", "Üyelerin çoğunluğu icracı olmayan kişilerden oluşmalıdır", "Bağımsız üyeler tüzel kişi de olabilir", "Bağımsız üyelerin yurt dışında yerleşik olması zorunludur"], "a": 2, "e": "Sağlıklı denetim için YK üyelerinin çoğunluğu icracı olmayanlardan oluşmalıdır. Bağımsız üyeler Türkiye'de yerleşik gerçek kişilerdir; genel müdürün YK'da olması icracı üyeliğin tipik örneğidir."}, {"q": "TTK m.476'ya göre bir payın nominal değeri en az ne olabilir?", "o": ["1 TL", "10 kuruş", "1 kuruş", "25 kuruş", "5 TL"], "a": 2, "e": "Nominal değer bir kuruştan az olamaz; birer kuruş ve katları şeklinde yükseltilebilir. Borsada işlem gören ortaklıklarda genellikle 1 TL'dir."}, {"q": "Bir şirketin sermayesi 700.000 adet adi pay ile her birine 15 oy hakkı tanınmış 100.000 adet imtiyazlı paydan oluşmaktadır. İmtiyazlı pay grubunun genel kuruldaki toplam oy içindeki payı yaklaşık yüzde kaçtır?", "o": ["%68,2", "%12,5", "%31,8", "%62,5", "%93,8"], "a": 0, "e": "Oy toplamı = 700.000 + 100.000 × 15 = 2.200.000. İmtiyazlı oy = 1.500.000; 1.500.000 / 2.200.000 ≈ %68,2. %12,5 sermaye payıdır, %31,8 adi payların oy oranıdır."}, {"q": "Oyda imtiyaz aşağıdaki genel kurul kararlarından hangisinde kullanılabilir?", "o": ["Esas sözleşme değişikliği", "Yönetim kurulu üyelerinin ibrası", "Sorumluluk davası açılması", "Yönetim kurulu üyelerinin seçimi", "Denetçilere karşı sorumluluk davası açılması kararı"], "a": 3, "e": "Oyda imtiyaz esas sözleşme değişikliği ile ibra ve sorumluluk davası açılması kararlarında kullanılamaz; YK seçimi gibi adi kararlarda kullanılır."}, {"q": "TTK'ya göre imtiyaza ilişkin hangisi yanlıştır?", "o": ["Oyda imtiyaz eşit itibari değerdeki paylara farklı sayıda oy verilerek tanınabilir", "İmtiyaz kural olarak paya değil pay sahibinin şahsına tanınır", "İstisnai hâller dışında bir paya en çok 15 oy hakkı tanınabilir", "Yönetim kurulunda temsil edilme hakkı tanınan paylar imtiyazlı sayılır", "Kanunda öngörülmemiş yeni bir pay sahipliği hakkı da imtiyaz olabilir"], "a": 1, "e": "İmtiyaz kural olarak pay sahibine değil paya tanınır. Diğer ifadeler kitapla uyumludur."}, {"q": "Kuruluşta hizmeti geçen iki kişiye kurucu intifa payı verilmiştir. TTK'ya göre bu kişilere aşağıdakilerden hangisi verilebilir?", "o": ["Genel kurulda oy kullanma hakkı", "Genel kurula katılma hakkı", "Yönetim kurulu üyesi seçme hakkı", "Gündeme madde ekletme hakkı", "Net kâra katılma hakkı"], "a": 4, "e": "Kurucu ve intifa payı sahiplerine pay sahipliği hakları verilemez; yalnız net kâra, tasfiye bakiyesine katılma ve yeni pay alma gibi ekonomik haklar verilebilir."}, {"q": "Halka açık bir ortaklık nakit sermaye artırımı yapmadan başka bir şirketi devralmış ve devrolan şirketin ortaklarına pay vermiştir. Bu paylar nasıl nitelendirilir?", "o": ["Bedelli pay", "Bedelsiz pay", "İntifa payı", "Kurucu payı", "İmtiyazlı pay"], "a": 0, "e": "Birleşmede devralan şirket, devraldığı malvarlığı karşılığında pay verdiği için bu paylar da bedelli pay sayılır."}, {"q": "Ortaklığın elindeki geri alınmış paylara ilişkin hangisi doğrudur?", "o": ["Oy hakları aynen kullanılır", "Tedavüldeki pay sayısına dahil edilir", "Oy ve yönetimsel hakları dondurulur; genel kurul toplantı nisabında dikkate alınmaz", "Nominal değerleri sermayenin %20'sine kadar çıkabilir", "Genel kurulda yönetim kurulu seçiminde kullanılır"], "a": 2, "e": "Geri alınan payların oy ve buna bağlı yönetimsel hakları donar, bu yüzden toplantı nisabında sayılmaz; tedavüldeki pay, toplam sermayeden geri alınanlar düşülerek bulunur. Geri alınan payların nominali sermayenin %10'unu aşamaz."}, {"q": "Toplam 250.000.000 adet payı bulunan bir şirket 25.000.000 adet payını geri almıştır. Yıllık net kâr 450.000.000 TL'dir. Tedavüldeki paylara göre hisse başına kazanç kaç TL'dir?", "o": ["1,80", "1,62", "2,20", "1,98", "2,00"], "a": 4, "e": "Tedavüldeki pay = 250 − 25 = 225 milyon. HBK = 450 / 225 = 2,00 TL. Toplam pay üzerinden hesaplansaydı 1,80 TL çıkardı."}, {"q": "Toplam 120 milyon payı olan bir şirkette dağılım şöyledir: hakim ortak 54 milyon, sermayenin %12,5'ine sahip başka bir kurumsal ortak 15 milyon, YK üyeleri 3 milyon, şirket vakfı 2 milyon, hacizli paylar 1 milyon, bireysel yatırımcılar 33 milyon, yatırım fonları 12 milyon. Fiili dolaşım oranı yüzde kaçtır?", "o": ["%50,0", "%37,5", "%40,0", "%27,5", "%62,5"], "a": 1, "e": "Sermayenin %10 ve üzerine sahip ortakların payları da fiili dolaşıma girmez. Dahil olanlar: 33 + 12 = 45 milyon. 45 / 120 = %37,5. %12,5'lik ortağı dahil eden %50 bulur."}, {"q": "Aşağıdaki paylardan hangisi fiili dolaşımdaki paylar kapsamında değerlendirilir?", "o": ["Şirket çalışanları vakfının elindeki paylar", "Teminat olarak verilmiş paylar", "Sermayenin %11'ine sahip tüzel kişi ortağın payları", "Sermayenin %4'üne sahip bir yatırım fonunun yatırım amaçlı tuttuğu paylar", "Üst düzey yöneticinin eşinin sahip olduğu paylar"], "a": 3, "e": "Vakıf, teminattaki, %10 ve üzeri ortak ile yöneticilerin yakın aile üyelerinin payları fiili dolaşım dışıdır. %10 altındaki yatırım amaçlı fon payları dahildir."}, {"q": "Fiili dolaşım hesabında dışarıda bırakılan ortak payları için uygulanan sermaye oranı eşiği hangisidir?", "o": ["%5 ve üzeri; daha önce %10 olarak uygulanmaktaydı", "%10 ve üzeri; daha önce %5 olarak uygulanmaktaydı", "%25 ve üzeri; hiç değiştirilmemiştir", "%10 ve üzeri; daha önce %20 olarak uygulanmaktaydı", "%50 ve üzeri; daha önce %25 olarak uygulanmaktaydı"], "a": 1, "e": "30.10.2014 tarihli i-SPK.128.9 sayılı Kararla daha önce %5 olan oran %10'a yükseltilmiştir."}, {"q": "Bir şirketin toplam pay sayısı 80 milyon, fiili dolaşım oranı %30 ve güncel pay fiyatı 15 TL'dir. Borsa İstanbul'un endeks ağırlıklandırmasında esas aldığı fiili dolaşımdaki payların piyasa değeri kaç TL'dir?", "o": ["1,2 milyar", "840 milyon", "24 milyon", "360 milyon", "450 milyon"], "a": 3, "e": "FD pay = 80 × %30 = 24 milyon adet. 24 milyon × 15 = 360 milyon TL. 1,2 milyar toplam piyasa değeridir; 840 milyon fiili dolaşım dışı kısmın değeridir."}, {"q": "Toplam varlıkları 1,5 milyar TL, toplam yükümlülükleri 900 milyon TL olan şirketin 60 milyon payı vardır ve pay fiyatı 25 TL'dir. Şirketin PD/DD oranı kaçtır?", "o": ["2,5", "1,0", "1,5", "0,4", "4,2"], "a": 0, "e": "Özkaynak = 1.500 − 900 = 600 milyon; defter değeri = 600 / 60 = 10 TL. PD/DD = 25 / 10 = 2,5. Varlıkları özkaynak sanmak 25 / 25 = 1,0 verir."}, {"q": "Şirketin tüm varlıklarının cari piyasa değerinden nakde çevrilip borçlar ödendikten sonra pay başına kalan tutarı ifade eden ve değerlemede çoğu zaman alt sınır kabul edilen değer hangisidir?", "o": ["Defter değeri", "Nominal değer", "İçsel değer", "Piyasa değeri", "Tasfiye değeri"], "a": 4, "e": "Tasfiye değeri iflas veya tasfiyede ortağın eline geçebilecek tutarı gösterir ve dip fiyat göstergesi sayılır."}, {"q": "Şirketin gelecekte yaratacağı nakit akışları, büyüme potansiyeli ve riskleri dikkate alınarak hesaplanan olması gereken değer hangisidir?", "o": ["Defter değeri", "Tasfiye değeri", "İçsel değer", "Nominal değer", "Piyasa değeri"], "a": 2, "e": "İçsel değer teorik ve olması gereken değerdir; yatırım kararında piyasa fiyatı ile karşılaştırılır."}, {"q": "Borsada işlem gören bir şirketten pay alan yatırımcı, payların fiziki senet olarak basılıp kendisine teslimini istemektedir. Hangisi doğrudur?", "o": ["Talep, Kurul onayıyla her zaman karşılanır", "Aracı kurum ücret karşılığında senet bastırmak zorundadır", "Talep karşılanamaz; SPKn m.13 uyarınca kayden ihraç esastır ve haklar MKK nezdinde izlenir", "Pay devri fiziki teslimle hüküm doğurduğundan senet basılmalıdır", "Talep yalnız nama yazılı paylar için karşılanır"], "a": 2, "e": "Borsada işlem gören şirket payları için fiziki basım sona ermiştir; devir MKK hesapları arasındaki kayıtlarla hüküm doğurur."}, {"q": "Aşağıdakilerden hangisi payların MKK nezdinde kayden izlenmesi zorunluluğunun kapsamı dışında bırakılmıştır?", "o": ["Payları borsada işlem görmeyen ve yalnız ortak sayısı nedeniyle halka açık sayılan ortaklıklar", "Payları Yıldız Pazar'da işlem gören ortaklıklar", "Payları Alt Pazar'da işlem gören ortaklıklar", "İlk halka arzını yeni tamamlamış ortaklıklar", "Payları Yakın İzleme Pazarı'nda işlem gören ortaklıklar"], "a": 0, "e": "Kurul, borsada işlem görmeyip yalnız ortak sayısı nedeniyle halka açık sayılanları ve kooperatiflerin yönetim kontrolündeki halka açık ortaklıkları kapsam dışı bırakmıştır."}, {"q": "SPKn m.3'teki menkul kıymet tanımının dışında bırakılan araç hangisidir?", "o": ["Pay", "Paylara ilişkin depo sertifikası", "Borçlanma aracı", "Çek", "Varlığa dayalı borçlanma aracı"], "a": 3, "e": "Menkul kıymet tanımı para, çek, poliçe ve bono hariç tutularak yapılmıştır."}, {"q": "Halka açık ortaklıklarda azınlık sayılan ve genel kurulu toplantıya çağırma, gündeme madde ekletme ve özel denetçi isteme yetkisine sahip pay sahiplerinin sermaye oranı hangisidir?", "o": ["%1", "%5", "%10", "%20", "%2"], "a": 1, "e": "Kitaba göre halka açık şirketlerde sermayenin %5'ini temsil eden pay sahipleri azınlık kabul edilir."}, {"q": "Bir payın birden fazla sahibi bulunmasına ilişkin hangisi doğrudur?", "o": ["Pay sahipleri sayısınca bölünür ve her biri ayrı oy kullanır", "En büyük paya sahip olan kişi tek başına tüm hakları kullanır", "Pay ortaklığa karşı geçersiz hâle gelir", "Tebligat ancak tüm sahiplere ayrı ayrı yapılırsa geçerlidir", "Haklar ortak bir temsilci aracılığıyla kullanılır; temsilci atanmamışsa birine yapılan tebligat diğerlerine de yapılmış sayılır"], "a": 4, "e": "Pay ortaklığa karşı bölünmez; ortak temsilci gerekir."}]}, {"id": 2, "kisa": "Getiri, Risk ve Endeksler", "baslik": "Genel Çerçeve II: Payın Getirisi ve Riskleri, Pay Piyasası Endeksleri, Algoritmik İşlemler", "ozet": "Temettü ve sermaye kazancı, sistematik ve sistematik olmayan riskler, davranışsal eğilimler, riskin düzenleyici çerçevesi, endeks hesaplama ile fiyat ve getiri endeksi ayrımı ve yüksek frekanslı işlemler.", "notlar": "<h3>Payın getirisi: nakit temettü<\/h3>\n<ul>\n<li>Halka açık şirkette kâr payı dağıtımı <b>II-19.1 sayılı Kâr Payı Tebliği<\/b>'ne tabidir; <b>YK'nın teklifi<\/b> üzerine <b>genel kurul<\/b> karar verir.<\/li>\n<li>İki şekil: <b>nakit kâr payı<\/b> ve <b>pay biçiminde kâr payı<\/b> (ek pay verilmesi). Analizde \"temettü\" denince ekonomik değeri somut olan nakit kâr payı kastedilir; pay biçiminde kâr payı nakit akışı yaratmadığı için ayrı değerlendirilir.<\/li>\n<li>Temettü politikası; sektörün olgunluğu, kârlılık, büyüme ve yatırım planları, nakit ihtiyacı, sermaye yeterliliği ve borçluluğa göre şekillenir. Olgun sektör şirketleri genellikle yüksek temettü verimine sahiptir; hızlı büyüyenler kârı yeniden yatırdığı için az veya hiç dağıtmayabilir.<\/li>\n<li>İstikrarlı temettü olumlu gösterge sayılır ama her istikrarlı ödeyicinin üstün finansal durumda olduğu söylenemez.<\/li>\n<li><b>Temettü verimi = Hisse başına temettü / Hisse fiyatı.<\/b> Kitap örneği: 0,50 TL / 25 TL = <b>%2<\/b>. Toplam yaklaşım da aynı sonucu verir: 10 milyon TL / (20 milyon pay × 25 TL) = %2; uygulamada temel yaklaşım hisse başına temettü / fiyat formülüdür.<\/li>\n<li>Yatırımcılar temettü verimini mevduat faizi, DİBS ve özel sektör tahvili gibi alternatif getirilerle kıyaslar.<\/li>\n<\/ul>\n\n<h3>Sermaye kazancı<\/h3>\n<ul>\n<li>Pay fiyatının alış fiyatının üzerine çıkmasıyla oluşan değer artışıdır. Örnek: 30 TL'den alınıp 50 TL'ye çıkan payda potansiyel kazanç 20 TL.<\/li>\n<li>Pay satılmadıkça kazanç <b>gerçekleşmemiş<\/b>tir; realize edilmesi için satış gerekir.<\/li>\n<li>Temettü ve bedelsiz sermaye artırımı fiyatı <b>nominal olarak düşürür<\/b> ama yatırımcının ekonomik kazancını azaltmaz: temettüde nakit alınır, bedelsizde pay adedi artar. Bu yüzden fiyat hareketi kurumsal eylemlerden arındırılarak değerlendirilmelidir.<\/li>\n<li>Temettü ve sermaye kazancı hisse yatırımının <b>iki temel getiri unsurudur<\/b>.<\/li>\n<\/ul>\n\n<h3>Risk ve türleri<\/h3>\n<ul>\n<li>Finans literatüründe risk, getirilerin <b>oynaklığı<\/b>, yani beklenen değerden sapma ihtimalidir; yatırımcı gözünde kayıp olasılığıdır.<\/li>\n<\/ul>\n<table>\n<tr><th><\/th><th>Sistematik risk<\/th><th>Sistematik olmayan risk<\/th><\/tr>\n<tr><td>Kaynağı<\/td><td>Tüm piyasayı etkileyen, yatırımcının kontrolü dışındaki etkenler<\/td><td>Şirkete veya sektöre özgü etkenler<\/td><\/tr>\n<tr><td>Çeşitlendirme<\/td><td><b>Ortadan kaldırılamaz<\/b><\/td><td>Etkin çeşitlendirmeyle <b>önemli ölçüde azaltılabilir<\/b>; düşük korelasyonlu varlıklar riski daha da düşürür<\/td><\/tr>\n<tr><td>Ölçüm<\/td><td><b>Beta katsayısı<\/b><\/td><td>Yatırımcının bilgi düzeyi, analiz yeteneği ve portföy yapısıyla ilişkili<\/td><\/tr>\n<tr><td>Türleri<\/td><td>Piyasa riski, faiz ve enflasyon riski, döviz kuru riski, politik risk<\/td><td>İhraççı (şirket) riski, sektörel risk, likidite riski<\/td><\/tr>\n<\/table>\n<h4>Sistematik risk türleri<\/h4>\n<ul>\n<li><b>Piyasa riski<\/b>: sistematik riskin en kapsamlı türü; ekonomik daralma, kriz veya ayı piyasasında sağlam şirketlerin payları bile düşebilir.<\/li>\n<li><b>Faiz riski<\/b>: Türkiye'de faizler esas olarak TCMB politika faizi ve beklentilerden etkilenir. Faiz artışı <b>iskonto oranını yükseltir<\/b>, gelecekteki nakit akışlarının bugünkü değerini düşürür, borçlanma maliyetini artırır ve sabit getirili araçları cazipleştirir; sonuçta pay değerini genellikle <b>düşürür<\/b>. Faizin gerilemesi tersine olumlu etki yapar. Küresel faizler de Türkiye'ye gelen sermayeyi etkiler.<\/li>\n<li><b>Enflasyon riski<\/b>: maliyetleri artırır, talebi zayıflatır, nakit akışlarının reel değerini düşürür; faiz beklentisi kanalıyla sermaye maliyetini de artırır. Faiz ve enflasyon riskleri birbirini besler.<\/li>\n<li><b>Döviz kuru riski<\/b>: kur artışı ithalata bağımlı sektörlerde maliyeti, döviz borcu yüksek şirketlerde kur farkı zararını artırır; ihracatçılar için olumlu olabilir. Yabancı yatırımcı açısından TL getirisinin dövize çevrilmesinde ortaya çıkar: Borsa İstanbul'da %10 getiri, aynı dönemde TL'nin dolar karşısında %10 değer kaybıyla sıfırlanabilir. Korunma: VİOP döviz kontratları, döviz geliri olan sektörler, <b>doğal korunma (natural hedge)<\/b>. Tamamen ortadan kaldırılamaz.<\/li>\n<li><b>Politik risk<\/b>: seçimler, ani politika ve vergi değişiklikleri, kamu borçlanma politikası, uluslararası gerilimler.<\/li>\n<\/ul>\n<h4>Sistematik olmayan risk türleri<\/h4>\n<ul>\n<li><b>İhraççı (şirket) riski<\/b>: mali yapı bozulması, kötü faaliyet sonuçları, iflas. KAP'taki özel durum açıklamaları ve düzenli raporlama bu riskin değerlendirilmesini sağlar. Kurumsal yönetim ilkelerine yüksek uyum genellikle daha düşük ihraççı riski demektir.<\/li>\n<li><b>Sektörel risk<\/b>: bir endüstrideki ekonomik, teknolojik, mevzuat değişiklikleri (enerji fiyatları, tedarik zinciri sorunları). Sistematik unsurlarla iç içe geçse de etkisi sınırlı sayıda şirkette yoğunlaştığı için <b>sistematik olmayan<\/b> risk sayılır.<\/li>\n<li><b>Likidite riski<\/b>: aracın kısa sürede ve makul fiyattan nakde çevrilememesi. Düşük hacimli, sığ paylarda (Alt Pazar, YİP, PÖİP) öne çıkar; alım-satım makası (spread) açılır. Pozisyon büyüklüğüyle de ilgilidir: fonlar gibi büyük yatırımcılar için daha belirgindir. Düşük likidite manipülasyona açıklığı artırır. Genellikle sistematik olmayan risktir ama genel düşüşlerde sistematik riskle iç içe geçebilir.<\/li>\n<\/ul>\n\n<h3>Davranışsal finans<\/h3>\n<p>Geleneksel teori yatırımcıyı rasyonel, fiyatları tüm bilgiyi yansıtır kabul eder; davranışsal finans duygusal tepki ve bilişsel önyargıları öne çıkarır. Bu eğilimler sosyal medya ve forumlardaki bilgi kirliliğiyle birleşince oynaklığı artırır.<\/p>\n<table>\n<tr><th>Eğilim<\/th><th>Tanım<\/th><th>Kitaptaki örnek<\/th><\/tr>\n<tr><td><b>Sürü davranışı (herding)<\/b><\/td><td>Kendi analizi yerine çoğunluğu taklit etmek; panik satışı veya aşırı alım<\/td><td>Ahmet Bey analizine rağmen iş arkadaşları ve sosyal medya etkisiyle halka arza katılır<\/td><\/tr>\n<tr><td><b>Aşırı güven (overconfidence)<\/b><\/td><td>Bilgi ve tahmin yeteneğini abartmak; riski küçümseme, sık işlem<\/td><td>Can Bey kazancı kendi yeteneğine bağlar, tüm sermayesini ve krediyi tek hisseye yatırır<\/td><\/tr>\n<tr><td><b>Kayıptan kaçınma (loss aversion)<\/b><\/td><td>Kaybın acısı aynı tutardaki kazancın hazzından büyük; kârdakini erken satma, zarardakini uzun taşıma<\/td><td>Zeynep Hanım kârlı enerji hissesini satar, zarardaki sanayi hissesini tutar<\/td><\/tr>\n<tr><td><b>Çapalama (anchoring)<\/b><\/td><td>İlk bilgiye (alış veya zirve fiyat) takılıp kalmak<\/td><td>Mehmet Bey 60 TL zirveyi referans alıp 45 TL'yi ucuz sanır<\/td><\/tr>\n<tr><td><b>Doğrulama yanlılığı (confirmation bias)<\/b><\/td><td>Yalnız görüşünü destekleyen bilgiyi dikkate almak<\/td><td>Selin Hanım nakit akışı uyarılarını görmezden gelir<\/td><\/tr>\n<tr><td><b>Temsil (representativeness)<\/b><\/td><td>Durumu zihindeki kalıba benzerliğine göre değerlendirmek; istatistiği göz ardı etmek<\/td><td>Kerem Bey küçük bir girişimi dev bir teknoloji markasına benzetir<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: sert değer kaybeden hisse \"ucuzladı, riski azaldı\" sanılır; oysa sert düşüş <b>oynaklığın ve riskin arttığını<\/b> gösterir. Düşen piyasada standart sapma yükselir; yatay seyreden hisseye göre sert düşen hisse daha risklidir.<\/li>\n<li>Halka arz sonrası <b>fiyat keşfi<\/b> sürecinde yüksek oynaklık olağandır; yalnız fiyatın düşmesi payın değerinin altında işlem gördüğünü kanıtlamaz.<\/li>\n<\/ul>\n\n<h3>Riskin düzenleyici çerçevesi<\/h3>\n<ul>\n<li>Aracı kurum hizmet öncesinde <b>Yatırımcı Bilgilendirme Formu<\/b> ile ürün ve hizmetler hakkında genel bilgi verir, <b>Risk Bildirim Formu<\/b> ile olası kayıplara karşı açıkça uyarır.<\/li>\n<li><b>Uygunluk testi<\/b>: bilgi ve tecrübe ile ürünün risk yapısının örtüşmesini ölçer; ürün uygun değilse kurum <b>yazılı uyarır<\/b>, yatırımcı talimat verirse işlem yapılabilir.<\/li>\n<li><b>Yerindelik testi<\/b>: yatırım danışmanlığı ve portföy yöneticiliği gibi nitelikli hizmetlerde finansal durum, risk algısı ve hedeflerle uyumsuz işleme <b>izin verilmez<\/b>; daha koruyucudur.<\/li>\n<li>Piyasa koruma mekanizmaları: <b>devre kesici<\/b>; <b>Volatilite Bazlı Tedbir Sistemi (VBTS)<\/b> kapsamında açığa satış yasağı, kredili işlem sınırı, brüt takas.<\/li>\n<li>Kurumsal altyapı: <b>Takasbank<\/b> teminatlandırma ve <b>merkezi karşı taraf (MKT)<\/b> hizmetiyle temerrüt riskini sınırlar; <b>MKK<\/b> kaydi yapıyla mülkiyet güvencesi, fiili dolaşım bildirimi, hak kullanım, temettü ve bedelsiz pay operasyonlarını yürütür; <b>Yatırımcı Tazmin Merkezi<\/b> aracı kurumun nakit veya menkul kıymet teslim yükümlülüğünü yerine getirememesinde belirli sınırlar içinde tazmin sağlar.<\/li>\n<\/ul>\n\n<h3>Pay piyasası endeksleri<\/h3>\n<ul>\n<li>Endeksleri <b>Borsa İstanbul<\/b> oluşturur. <b>BIST 100<\/b>: piyasa değeri ve işlem hacmi yüksek 100 şirket; Türkiye hisse piyasasının genel göstergesi. <b>BIST 30<\/b> ve <b>BIST 50<\/b> daha büyük ve likit şirketleri kapsar; BIST 30 <b>VİOP<\/b>'ta endeks vadeli ve opsiyon sözleşmelerinin dayanağıdır. Yıldız, Ana ve Alt Pazar'daki tüm şirketler için <b>BIST Tüm<\/b>.<\/li>\n<li>Sektörel (bankacılık, ulaştırma, teknoloji) ve tematik (BIST Sürdürülebilirlik, BIST Katılım 30, BIST Temettü 25) endeksler de yayımlanır.<\/li>\n<li>Temel pay endeksleri <b>fiili dolaşım piyasa değeri ağırlıklı<\/b> hesaplanır. Türkiye'deki temel fiyat endekslerinin tamamı piyasa değeri ağırlıklıdır. Dow Jones Industrial Average gibi bazı uluslararası endeksler ise <b>fiyat ağırlıklı<\/b>dır.<\/li>\n<li><b>Ağırlık sınırlamalı<\/b> endekslerde (ör. BIST 100 %10 veya %25 sınırlamalı) tek bir payın ağırlığına üst sınır konur; standart BIST 100'de böyle bir sınır yoktur.<\/li>\n<li><b>Bölen değeri (divisor)<\/b>: endekse pay eklenip çıkarılması, bedelli artırım, temettü, birleşme-bölünme gibi işlemlerin endeksi yapay olarak değiştirmesini önler; böylece endeks yalnız fiyat hareketlerinden etkilenir.<\/li>\n<li>Endeks bileşenleri <b>üç ayda bir<\/b> likidite ve piyasa değeri kriterlerine göre güncellenir.<\/li>\n<li><b>Endeks değeri = Fiili dolaşımdaki payların toplam piyasa değeri / Bölen değeri.<\/b> Kitap örneği: baz yıl 2020, piyasa değeri 100 milyar TL, başlangıç değeri 100, bölen 1 milyar. Bugün toplam 65 milyar TL ise endeks 65 (%35 kayıp); 130 milyar TL ise 130 (%30 artış).<\/li>\n<\/ul>\n<h4>Fiyat endeksi ve getiri endeksi<\/h4>\n<table>\n<tr><th>Özellik<\/th><th>Fiyat endeksi (ör. BIST 100)<\/th><th>Getiri endeksi (ör. BIST 100 Getiri)<\/th><\/tr>\n<tr><td>Temettü<\/td><td>Dahil edilmez<\/td><td>Yeniden yatırılmış varsayılır<\/td><\/tr>\n<tr><td>Temettü sonrası fiyat düşüşü<\/td><td>Endeksi düşürür<\/td><td>Etkilemez (telafi edilir)<\/td><\/tr>\n<tr><td>Bedelsiz sermaye artırımı<\/td><td>Etkisiz (piyasa değeri değişmez, bölen sabit)<\/td><td>Etkisiz<\/td><\/tr>\n<tr><td>Bedelli sermaye artırımı<\/td><td>Bölen ayarlanarak nötrlenir<\/td><td>Bölen ayarlanarak nötrlenir<\/td><\/tr>\n<tr><td>Uzun vadeli performans<\/td><td>Görece düşük; kısa vadeli yönü izlemek için<\/td><td>Daha yüksek; gerçek getiriyi ve uzun vadeli performansı ölçmede daha doğru<\/td><\/tr>\n<\/table>\n<ul>\n<li>Örnek: 50 TL'lik pay 5 TL temettü dağıtınca teorik fiyat 45 TL olur; fiyat endeksi düşüşü yansıtır, getiri endeksi nötrler. Temettü verimi yüksek sektörlerde iki endeks arasında zamanla büyük fark oluşur.<\/li>\n<li>Endeksler <b>ölçüt (benchmark)<\/b> görevi görür: portföy yöneticileri BIST 100 Getiri veya BIST 30 Getiri'yi kıstas alır; endeks bazlı <b>BYF<\/b>'ler tek işlemle tüm bileşenlere erişim sağlar.<\/li>\n<li>Gelişmekte olan piyasalarda endeks oynaklığı daha yüksektir: sınırlı derinlik, dalgalı yabancı portföy yatırımları, yüksek makroekonomik duyarlılık.<\/li>\n<\/ul>\n\n<h3>Algoritmik ve yüksek frekanslı işlemler (YFİ)<\/h3>\n<ul>\n<li><b>Algoritmik işlem<\/b>: kararların önceden tanımlı matematiksel modeller ve programlarla verilmesi; büyük emirleri parçalara bölüp zamana yaymak veya koşul oluşunca otomatik alım-satım gibi stratejiler.<\/li>\n<li><b>YFİ<\/b>: algoritmik işlemin en hızlı türü; <b>mikrosaniyelerle<\/b> ölçülen hız ve düşük gecikme. <b>Eş-yerleşim (kolokasyon)<\/b> ile sistemler borsaya fiziksel olarak en yakın noktaya konur; insan müdahalesi olmadan çok sayıda emir gönderip kısa sürede iptal edebilir, bu yüzden <b>emir/işlem oranı yüksektir<\/b>.<\/li>\n<li>Stratejiler: <b>piyasa yapıcılığı<\/b> (sürekli kotasyonla likidite), <b>istatistiksel arbitraj<\/b> (ilişkili araçlar arası fiyat uyumsuzluğu), <b>gecikme arbitrajı<\/b> (fiyat bilgisinin iletimindeki hız farkı).<\/li>\n<li>Faydaları: makasın daralması, daha etkin fiyat, düşük işlem maliyeti. Riskleri: benzer sinyallere eş zamanlı tepkiyle ani çöküşler, oynaklıkta emirlerin topluca çekilmesiyle likidite boşlukları, sahte arz-talep izlenimi veren yanıltıcı emirlerle bilgi asimetrisinin artması.<\/li>\n<\/ul>", "sorular": [{"q": "Payları 30 TL'den işlem gören bir şirket hisse başına 0,90 TL nakit temettü açıklamıştır. Temettü verimi yüzde kaçtır?", "o": ["%0,9", "%2,7", "%3,3", "%3,0", "%30,0"], "a": 3, "e": "Temettü verimi = hisse başına temettü / fiyat = 0,90 / 30 = %3."}, {"q": "40 milyon payı bulunan ve payları 20 TL'den işlem gören bir şirket toplam 16 milyon TL nakit temettü dağıtacaktır. Temettü verimi yüzde kaçtır?", "o": ["%2,0", "%0,4", "%4,0", "%2,5", "%0,8"], "a": 0, "e": "Hisse başına temettü = 16 / 40 = 0,40 TL; 0,40 / 20 = %2. Toplamdan da 16 / (40 × 20) = 16 / 800 = %2 bulunur."}, {"q": "Bir yatırımcı payı 42 TL'den almıştır; pay bugün 55 TL'dir ve yatırımcı henüz satış yapmamıştır. Bu durum için hangisi doğrudur?", "o": ["13 TL'lik gerçekleşmiş sermaye kazancı vardır", "55 TL'lik gerçekleşmemiş kazanç vardır", "Kazanç ancak temettü dağıtılırsa oluşur", "42 TL'lik realize edilmiş kazanç vardır", "13 TL'lik gerçekleşmemiş sermaye kazancı vardır"], "a": 4, "e": "Fiyat artışı 55 − 42 = 13 TL'dir; pay satılmadıkça kazanç gerçekleşmemiş niteliktedir."}, {"q": "Fiyatı 80 TL olan bir pay, hisse başına 4 TL nakit temettü dağıtmıştır. Hak kullanım günü teorik fiyat ve bu düşüşün yatırımcının ekonomik değerine etkisi hangisidir?", "o": ["76 TL; yatırımcı 4 TL zarar etmiştir", "84 TL; yatırımcı 4 TL kazanmıştır", "76 TL; ekonomik değer değişmez çünkü temettü nakit olarak alınır", "80 TL; temettü fiyatı etkilemez", "72 TL; yatırımcının değeri 8 TL azalır"], "a": 2, "e": "Fiyat brüt temettü kadar aşağı çekilir: 80 − 4 = 76. Yatırımcı temettüyü nakit aldığı için toplam varlık değişmez."}, {"q": "Aşağıdakilerden hangisi sistematik olmayan risk örneğidir?", "o": ["TCMB politika faizinin artırılması", "Enflasyonun yükselmesi", "Şirketin yönetim kalitesinde bozulma", "Küresel durgunluk", "Döviz kurlarında sert dalgalanma"], "a": 2, "e": "Yönetim kalitesi şirkete özgüdür. Faiz, enflasyon, küresel durgunluk ve kur tüm piyasayı etkileyen sistematik risklerdir."}, {"q": "Sistematik riske ilişkin hangisi doğrudur?", "o": ["Portföy ne kadar çeşitlendirilirse çeşitlendirilsin tamamen ortadan kaldırılamaz ve beta ile ölçülür", "Etkin çeşitlendirmeyle tamamen yok edilebilir", "Yalnız tek bir sektörü etkiler", "Standart sapma yerine korelasyon katsayısıyla ölçülür", "Yalnız düşük likiditeli paylarda görülür"], "a": 0, "e": "Sistematik risk çeşitlendirmeyle giderilemez; modern portföy teorisinde beta katsayısıyla ölçülür."}, {"q": "Kitaba göre sektörel risk hangi gruba dahil edilir ve neden?", "o": ["Sistematik risk; tüm piyasayı eşzamanlı etkilediği için", "Sistematik risk; beta ile ölçüldüğü için", "Politik risk; mevzuattan kaynaklandığı için", "Sistematik olmayan risk; etkisi sınırlı sayıda şirkette veya sektörde yoğunlaştığı için", "Piyasa riski; ayı piyasasında ortaya çıktığı için"], "a": 3, "e": "Sektörel risk sistematik unsurlarla iç içe geçse de etkisi belirli şirket ve sektörlerde yoğunlaştığından sistematik olmayan risk sayılır."}, {"q": "Piyasa faiz oranlarının artmasının pay değerlemesine etkisine ilişkin hangisi yanlıştır?", "o": ["Şirketlerin borçlanma maliyetini artırır", "İskonto oranını düşürerek gelecekteki nakit akışlarının bugünkü değerini artırır", "Sabit getirili araçları daha cazip hâle getirir", "Genellikle pay piyasa değerini düşürücü etki yapar", "İskonto oranının önemli bir bileşenini yükseltir"], "a": 1, "e": "Faiz artışı iskonto oranını yükseltir ve bugünkü değeri azaltır; yanlış olan iskonto oranını düşürdüğü ifadesidir."}, {"q": "Likidite riskine ilişkin hangisi yanlıştır?", "o": ["Alım-satım makasının genişlemesine yol açar", "Alt Pazar, YİP ve PÖİP'te işlem gören paylarda öne çıkar", "Düşük likidite manipülatif işlemlere açıklığı artırır", "Genel düşüş dönemlerinde sistematik riskle iç içe geçebilir", "Pozisyon büyüklüğünden bağımsızdır; fonlar ve bireysel yatırımcılar için aynı düzeydedir"], "a": 4, "e": "Likidite riski pozisyon büyüklüğüyle de ilişkilidir; büyük pozisyon taşıyan fonlar için daha belirgindir."}, {"q": "Bir yatırımcı uzun süredir izlediği hissenin 120 TL zirvesini aklında tutmaktadır. Kötü bilanço sonrası hisse 70 TL'ye düşünce temel verileri incelemeden 'eski seviyesine döner' diye alım yapar. Bu davranış hangi yanılgıdır?", "o": ["Çapalama", "Sürü davranışı", "Aşırı güven", "Temsil yanılgısı", "Kayıptan kaçınma"], "a": 0, "e": "Yatırımcı ilk gördüğü fiyatı değişmez referans (çapa) olarak alıp güncel içsel değeri göz ardı etmektedir."}, {"q": "Kendi analizinde halka arzı pahalı bulan yatırımcı, çevresindeki yoğun ilgi ve sosyal medyadaki yükseliş beklentisi yüzünden fırsatı kaçırma endişesiyle alım yapar. Bu davranış hangisidir?", "o": ["Çapalama", "Doğrulama yanlılığı", "Sürü davranışı", "Aşırı güven", "Temsil yanılgısı"], "a": 2, "e": "Kişisel analiz yerine çoğunluğun hareketini taklit etmek sürü davranışıdır (herding)."}, {"q": "Bir yatırımcı kârdaki hissesini kârı realize etmek için erkenden satarken, temel verileri bozulan zarardaki hissesini zararı kesinleştirmemek için taşımaya devam etmektedir. Bu davranış hangisidir?", "o": ["Aşırı güven", "Çapalama", "Sürü davranışı", "Temsil yanılgısı", "Kayıptan kaçınma"], "a": 4, "e": "Kaybın yarattığı rahatsızlığın aynı tutardaki kazancın memnuniyetinden büyük olması kayıptan kaçınmadır (loss aversion)."}, {"q": "Yeni halka arz edilen küçük bir girişimi yalnız sektör benzerliği nedeniyle dünyaca ünlü dev bir teknoloji şirketi gibi başarılı olacak sayan yatırımcının yanılgısı hangisidir?", "o": ["Doğrulama yanlılığı", "Temsil", "Kayıptan kaçınma", "Çapalama", "Sürü davranışı"], "a": 1, "e": "Bir varlığı zihindeki başarılı kalıba benzerliğine göre değerlendirip istatistiği göz ardı etmek temsil (representativeness) yanılgısıdır."}, {"q": "Finans teorisine göre kısa sürede sert değer kaybeden bir hisse için hangisi doğrudur?", "o": ["Ucuzladığı için riski azalmıştır", "Değerinin altında işlem gördüğü kesinleşmiştir", "Standart sapması düşmüştür", "Oynaklığı ve dolayısıyla riski artmıştır", "Yatay seyreden hisseye göre daha az risklidir"], "a": 3, "e": "Sert düşüş, panik satışı ve belirsizlik nedeniyle oynaklığın arttığını gösterir; ucuz görünmesi düşük risk anlamına gelmez."}, {"q": "Yatırım danışmanlığı ve portföy yöneticiliği gibi hizmetlerde, yatırımcının finansal durumu ve hedefleriyle uyumsuz işlemlere izin verilmemesini sağlayan mekanizma hangisidir?", "o": ["Uygunluk testi", "Yerindelik testi", "Risk Bildirim Formu", "Yatırımcı Bilgilendirme Formu", "Volatilite Bazlı Tedbir Sistemi"], "a": 1, "e": "Uygunluk testinde ürün uygun değilse yazılı uyarı yapılır ve talimatla işlem yapılabilir; yerindelik testi uyumsuz işleme izin vermez."}, {"q": "Aracı kurumun yatırımcıya karşı nakit veya menkul kıymet teslim yükümlülüğünü yerine getirememesi hâlinde belirli sınırlar içinde tazmin sağlayan kuruluş hangisidir?", "o": ["Takasbank", "Merkezi Kayıt Kuruluşu", "Borsa İstanbul", "Yatırımcı Tazmin Merkezi", "Türkiye Sermaye Piyasaları Birliği"], "a": 3, "e": "Yatırımcı Tazmin Merkezi bu durumda tazmin sağlar. Takasbank merkezi karşı taraf hizmeti verir, MKK kayıtları tutar."}, {"q": "Baz yılda fiili dolaşım piyasa değeri toplamı 80 milyar TL olan ve başlangıç değeri 100 kabul edilen bir endeksin bölen değeri sabittir. Bugün toplam fiili dolaşım piyasa değeri 140 milyar TL'dir. Endeks değeri ve baz yıla göre değişim hangisidir?", "o": ["175; %75 artış", "140; %40 artış", "175; %57 artış", "57; %43 düşüş", "1,75; %75 artış"], "a": 0, "e": "Bölen = 80 milyar / 100 = 800 milyon. Endeks = 140 milyar / 800 milyon = 175; artış (175 − 100) / 100 = %75."}, {"q": "Bölen değeri 1 milyar olan bir endekste yer alan üç şirketin fiili dolaşımdaki payları ve fiyatları şöyledir: A 500 milyon pay, 60 TL; B 400 milyon pay, 40 TL; C 800 milyon pay, 15 TL. Başlangıç değeri 100 ise endeks ve değişim hangisidir?", "o": ["58; %58 düşüş", "62; %38 düşüş", "115; %15 artış", "42; %58 düşüş", "58; %42 düşüş"], "a": 4, "e": "Piyasa değerleri: 30.000 + 16.000 + 12.000 = 58.000 milyon TL. Endeks = 58.000 / 1.000 = 58; değişim −%42."}, {"q": "Endeks ağırlığı yüksek bir şirketin payı 100 TL'den 10 TL temettü sonrası 90 TL'den açılmıştır. Bu düşüşün etkisine ilişkin hangisi doğrudur?", "o": ["Her iki endeksi de aynı oranda düşürür", "Getiri endeksini düşürür, fiyat endeksini etkilemez", "Fiyat endeksini düşürür, getiri endeksini etkilemez", "Bölen değeri ayarlandığı için hiçbir endeksi etkilemez", "Her iki endeksi de yükseltir"], "a": 2, "e": "Fiyat endeksi temettüyü dahil etmez; getiri endeksi temettüyü yeniden yatırılmış varsayıp düşüşü nötrler."}, {"q": "Bedelli ve bedelsiz sermaye artırımlarının fiyat ve getiri endekslerine etkisine ilişkin hangisi doğrudur?", "o": ["Her ikisi de endeksi yapay olarak düşürür", "Bedelsiz artırım bölen değeri ayarlanarak nötrlenir, bedelli artırım etkisizdir", "Bedelsiz artırım piyasa değerini değiştirmediği için etkisizdir; bedelli artırımın etkisi bölen değeriyle nötrlenir", "Bedelli artırım yalnız getiri endeksini etkiler", "Her ikisi de yalnız fiyat endeksinde dikkate alınır"], "a": 2, "e": "Kitaptaki tabloya göre bedelsiz artırım her iki endekste etkisizdir; bedelli artırım bölen ayarlanarak nötrlenir."}, {"q": "Borsa İstanbul pay endekslerine ilişkin hangisi yanlıştır?", "o": ["Türkiye'deki temel fiyat endeksleri fiyat ağırlıklı yöntemle hesaplanır", "Temel endeksler fiili dolaşım piyasa değeri ağırlıklıdır", "Endeks bileşenleri üç ayda bir güncellenir", "BIST 30, VİOP'ta endeks sözleşmelerinin dayanağıdır", "Ağırlık sınırlamalı endekslerde tek bir payın ağırlığına üst sınır konur"], "a": 0, "e": "Türkiye'deki temel fiyat endekslerinin tamamı piyasa değeri ağırlıklıdır; fiyat ağırlıklı yönteme örnek Dow Jones Industrial Average'dır."}, {"q": "Uzun vadeli yatırım performansını ölçmek ve fon performansına kıstas olarak kullanmak için daha doğru referans hangisidir?", "o": ["BIST 100 fiyat endeksi", "BIST Tüm fiyat endeksi", "Dow Jones Industrial Average", "BIST 100 Getiri endeksi", "BIST 30 fiyat endeksi"], "a": 3, "e": "Getiri endeksleri fiyat artışı ile temettü toplamından oluşan gerçek getiriyi yansıtır; portföy yöneticileri BIST 100 Getiri veya BIST 30 Getiri'yi kıstas alır."}, {"q": "Yüksek frekanslı işlemleri diğer algoritmik işlemlerden ayıran temel özellik ve bunu sağlayan uygulama hangisidir?", "o": ["Büyük emirleri gün boyuna yaymak; orta nokta emri", "Mikrosaniyelerle ölçülen hız; eş-yerleşim (kolokasyon)", "Düşük emir/işlem oranı; kotasyon emri", "İnsan onaylı emir iletimi; AOF emri", "Yalnız kapanış seansında işlem; dengeleyici emir"], "a": 1, "e": "YFİ'nin farkı hız ve düşük gecikmedir; kolokasyonla sistemler borsaya fiziksel olarak en yakın noktaya konur. Emir/işlem oranı yüksektir."}, {"q": "İlişkili finansal araçlar arasındaki fiyat uyumsuzluklarını hedefleyen yüksek frekanslı işlem stratejisi hangisidir?", "o": ["Gecikme arbitrajı", "Piyasa yapıcılığı", "Doğal korunma", "Ağırlık sınırlaması", "İstatistiksel arbitraj"], "a": 4, "e": "Piyasa yapıcılığı sürekli kotasyonla likidite sağlar; gecikme arbitrajı bilgi iletimindeki hız farkından yararlanır."}]}, {"id": 3, "kisa": "Pay İhracı Düzenlemeleri", "baslik": "Pay İhracına İlişkin Temel Düzenlemeler: İzahname, Pay Tebliği ve Satış Tebliği", "ozet": "İzahname ve ihraç belgesi esasları, ilk halka arz şartları, yüklenim ve satış kısıtları, fiyat istikrarı, ek pay ve raporlar, tahsisli ve nitelikli satış, talep toplama ve dağıtım yöntemleri ile 2024 tarihli ilke kararı.", "notlar": "<h3>Üç temel düzenleme<\/h3>\n<table>\n<tr><th>Düzenleme<\/th><th>Konusu<\/th><\/tr>\n<tr><td><b>II-5.1 İzahname ve İhraç Belgesi Tebliği<\/b><\/td><td>İhraçta kamuyu aydınlatma belgeleri<\/td><\/tr>\n<tr><td><b>VII-128.1 Pay Tebliği<\/b><\/td><td>Payların ilk ve ikincil ihracına özel hükümler<\/td><\/tr>\n<tr><td><b>II-5.2 Sermaye Piyasası Araçlarının Satışı Tebliği<\/b><\/td><td>Satış yöntemleri, dağıtım, teslim. Borsada satışta ayrıca <b>Borsa Pay Piyasası Prosedürü<\/b><\/td><\/tr>\n<\/table>\n\n<h3>İzahname<\/h3>\n<ul>\n<li><b>Tanım<\/b>: ihraççının ve varsa garantörün finansal durumu, performansı, beklentileri, faaliyetleri ile aracın özellikleri, hak ve riskleri hakkında bilinçli değerlendirme için gereken tüm bilgileri içeren kamuyu aydınlatma belgesi. İki unsur: ihraççıya/garantöre ilişkin bilgiler ve araca ilişkin bilgiler.<\/li>\n<li><b>Halka arz<\/b> veya <b>borsada işlem görme<\/b> için izahnamenin hazırlanması ve Kurulca onaylanması zorunludur. Halka arz: her türlü yoldan yapılan genel çağrı ve devamındaki satış.<\/li>\n<li>Halka arz edilmeksizin ihraçta (tahsisli, nitelikli yatırımcıya satış) izahname değil <b>ihraç belgesi<\/b> hazırlanır ve onaylatılır.<\/li>\n<li>Onaylı izahname yayımlamadan halka arz Kanun'da <b>suçtur<\/b>: hapis ve adli para cezası.<\/li>\n<\/ul>\n<h4>İzahname muafiyetleri<\/h4>\n<ul>\n<li>Her halka arz için ayrı ayrı, yatırımcı başına <b>en az 9.500.000 TL<\/b>'lik alım yapan yatırımcılara yönelik halka arz (2026 tutarı).<\/li>\n<li>Birim nominal değeri <b>en az 9.500.000 TL<\/b> olan araçların halka arzı (2026 tutarı).<\/li>\n<li>Nitelikli yatırımcılara satılmak üzere ihraç edilen araçların borsada nitelikli yatırımcılar arasında işlem görmesi.<\/li>\n<li>Belirli birleşme, devir, bölünme, ayni sermaye veya pay değişiminde, Kurulca belirlenen <b>duyuru metni<\/b> ilan edilmek şartıyla çıkarılan araçların borsada işlem görmesi.<\/li>\n<li><b>Payların ilk halka arzı hariç<\/b>, toplam satış bedeli <b>142.500.000 TL<\/b>'nin (2026) altındaki halka arzlarda ihraççının <b>talebi üzerine<\/b> Kurul muafiyet verebilir.<\/li>\n<li>Bu tutarlar her yıl Kurul kararıyla <b>yeniden değerleme oranında<\/b> artırılabilir.<\/li>\n<\/ul>\n<h4>İzahname gerekmeyen durumlar<\/h4>\n<ul>\n<li>Yalnız nitelikli yatırımcıya satış; tahsisli satış; <b>kâr payının pay olarak dağıtımı dahil bedelsiz pay<\/b> çıkarılması; şartlı birleşme ve bölünme (duyuru metni ilanıyla).<\/li>\n<li>Dikkat: muafiyetle veya izahnamesiz ihraç edilen araçlar <b>sonradan halka arz edilirse izahname zorunludur<\/b>.<\/li>\n<\/ul>\n<h4>İzahname türleri<\/h4>\n<ul>\n<li><b>Tek belge<\/b>: ihraççı ve araç bilgileri ile özet aynı dokümanda.<\/li>\n<li><b>Birden fazla belge<\/b>: <b>İhraççı Bilgi Dokümanı (İBD)<\/b> (sermaye, yönetim, faaliyetler, finansal durum, kârlılık, yönetim ve denetimden sorumlular); <b>Sermaye Piyasası Aracı Notu (SPAN)<\/b> (aracın özellikleri, hakları, riskleri, halka arz ve borsada işlem görme bilgileri); <b>Özet<\/b> (temel özellikler ve riskler, kısa, açık, karşılaştırılabilir).<\/li>\n<li>Özette ayrıca: özetin izahnameye giriş olarak okunması ve kararın izahnamenin bütününe göre verilmesi gerektiği; izahnamenin diğer kısımlarıyla birlikte okunduğunda yanıltıcı, hatalı veya tutarsızsa hukuki sorumluluk doğacağı uyarıları yer alır.<\/li>\n<li>Sermaye artırımlarında <b>yeni pay alma haklarının kullanımına ilişkin bilgiler<\/b>: tek belgede ilgili kısımda, çoklu belgede <b>SPAN<\/b>'da.<\/li>\n<li>Çoklu belgede <b>İBD önce onaylanabilir<\/b>. Onaylı ve geçerli İBD'si olan ihraççı sonraki halka arzlarda yalnız <b>SPAN ve özet<\/b> hazırlar.<\/li>\n<\/ul>\n<h4>Hazırlama ve içerik<\/h4>\n<ul>\n<li>Tam, güncel, Kurul standartlarına uygun, kolay analiz edilebilir olmalı. Garanti varsa garantör ve garantinin niteliği yazılır.<\/li>\n<li>İzahnameyi <b>ihraççı<\/b>, varsa <b>halka arz eden<\/b> ve <b>yetkili kuruluş<\/b> imzalar; sorumlu gerçek kişilerin isim, görev ve iletişim bilgileri belirtilir.<\/li>\n<li>Finansal tablolar bağımsız denetim ve/veya sınırlı incelemeden geçmiş olmalı. Ortaklık hakkı veren araçlarda <b>son üç yıl<\/b> ve varsa ara dönem tabloları yer alır.<\/li>\n<li>Kurul, Borsa internet sitesi veya KAP'ta daha önce açıklanmış bilgiye <b>atıf<\/b> yapılabilir (kaynak ve erişim yolu belirtilerek). <b>Özette izahnamede olmayan bilgiye atıf yapılamaz.<\/b><\/li>\n<li>Bilginin kamu yararına aykırı olması, ihraççıya önemli zarar vermesi veya önemsiz olması hâlinde ihraççının talebiyle Kurul o bilginin <b>yer almamasına izin verebilir<\/b>.<\/li>\n<\/ul>\n<h4>Değişiklik, geçerlilik, ilan<\/h4>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><\/tr>\n<tr><td>Satıştan önce veya satış sırasında önemli değişiklik<\/td><td><b>Derhal<\/b> Kurula bildirilir<\/td><\/tr>\n<tr><td>Talep geri alma hakkı<\/td><td>Ek ve değişikliklerin yayımından itibaren <b>2 iş günü<\/b>; izahnamede belirtilerek ihraççı daha uzun belirleyebilir<\/td><\/tr>\n<tr><td>Geçerlilik<\/td><td>Güncel tutulmak kaydıyla ilk yayımdan itibaren <b>12 ay<\/b>; sonrası için izahnamenin tümü yeniden onaylanır<\/td><\/tr>\n<tr><td>İlan<\/td><td>Onaylı izahname teslim alınmasından itibaren <b>15 iş günü<\/b> içinde ihraççının ve varsa yetkili kuruluşun internet sitesinde, KAP üyeliği varsa KAP'ta<\/td><\/tr>\n<tr><td>Tescil<\/td><td>Nerede yayımlandığı, ilandan itibaren <b>10 iş günü<\/b> içinde ticaret siciline tescil ve TTSG'de ilan. Satışa başlamak için bu tescil <b>gerekmez<\/b><\/td><\/tr>\n<tr><td>Basılı nüsha<\/td><td>Elektronik yayında talep edene <b>bedelsiz<\/b> verilir<\/td><\/tr>\n<tr><td>Kurul inceleme süresi<\/td><td>Başvurudan itibaren <b>10 iş günü<\/b>; payların <b>ilk halka arzında 20 iş günü<\/b> (izahname ve ihraç belgesi)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: onay, bilgilerin doğruluğunun Kurulca <b>tekeffülü değildir<\/b>; reklam amacıyla kullanılamaz, yatırım tavsiyesi sayılmaz.<\/li>\n<\/ul>\n\n<h3>İhraç belgesi ve satış duyurusu<\/h3>\n<ul>\n<li><b>İhraç belgesi zorunlu<\/b>: halka arz edilmeksizin ihraç; <b>yurt dışı ihraçlar<\/b>; duyuru metni hazırlananlar hariç izahnamesiz her türlü ihraç.<\/li>\n<li>Onaylı ihraç belgesi veya tertip ihraç belgesi <b>ticaret siciline tescil edilmez<\/b>; teslimden itibaren <b>15 iş günü<\/b> içinde internet sitelerinde ve KAP'ta ilan edilir.<\/li>\n<li><b>Tasarruf sahiplerine satış duyurusu<\/b>: halka açılmada ve halka açık ortaklık artırımlarında rüçhan sonrası kalan paylar veya rüçhan kullandırılmayan halka arzlar için hazırlanıp Kurulca onaylanır; rüçhan süresi bitiminden veya izahname ilanından sonra KAP ve internet sitelerinde <b>aynı gün<\/b> ilan edilir.<\/li>\n<\/ul>\n\n<h3>Sorumluluk ve reklam<\/h3>\n<ul>\n<li>Yanlış, yanıltıcı, eksik bilgiden doğan zarardan <b>birincil sorumlu ihraççıdır<\/b>. Zarar ihraççıdan tazmin edilemez veya edilemeyeceği açıksa: <b>halka arz edenler, lider yetkili kuruluş, varsa garantör ve ihraççının YK üyeleri<\/b> kusurlarına ve durumun gereklerine göre sorumludur.<\/li>\n<li>Bağımsız denetim, derecelendirme ve değerleme kuruluşları gibi rapor hazırlayanlar kendi raporlarındaki bilgilerden sorumludur.<\/li>\n<li>Yalnız <b>özete<\/b> dayanarak sorumluluk yüklenemez; diğer kısımlarla birlikte okunduğunda yanıltıcı, hatalı veya tutarsızsa hariç.<\/li>\n<li>Reklamlar izahnameyle tutarlı olmalı; yatırım kararının izahnameye göre verilmesi gerektiği <b>uyarısı zorunludur<\/b>. Halka arz fiyatı yer alıyorsa fiyatın belirlenmesinde <b>Kurulun takdir yetkisi veya onayı olmadığı<\/b> vurgulanır. Onay ve yayım sonrası reklamda izahnamenin temin yerleri ve KAP dahil internet siteleri belirtilir. Yalnız nitelikli yatırımcıya satışta bu husus reklamda yazılır.<\/li>\n<\/ul>\n\n<h3>Pay Tebliği<\/h3>\n<h4>Kurula başvuru gerektiren başlıca işlemler<\/h4>\n<ul>\n<li>Halka açık olmayan ortaklıkların mevcut veya artırımla çıkacak paylarının halka arzı.<\/li>\n<li>Halka açık ortaklıkların: mevcut veya yeni paylarının halka arzı; yeni paylarının halka arz edilmeksizin satışı; şarta bağlı sermaye artırımı; sermaye azaltımı; kâr payı ve iç kaynaklardan artırım.<\/li>\n<li><b>Pay sahibi sayısı 500'ü aşması<\/b> nedeniyle halka arz olunmuş sayılan ortaklıkların halka açık stat
