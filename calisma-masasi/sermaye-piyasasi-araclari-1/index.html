üsünün onaylanması; borsada işlem görmeyen halka açık ortaklık paylarının borsada işlem görmeye başlaması; GİP'te işlem görecek ortaklıkların artırım yoluyla halka arzı; pay benzeri menkul kıymetlerin (katılma intifa senedi gibi) ihracı.<\/li>\n<\/ul>\n<h4>Temel kavramlar<\/h4>\n<ul>\n<li><b>İhraççı<\/b>: aracı ihraç eden veya başvuran <b>tüzel kişi<\/b>. <b>Halka arz eden<\/b>: sahip olduğu aracı halka arz etmek için başvuran <b>gerçek veya tüzel kişi<\/b>. Ayrım izahname sorumluluğu açısından önemlidir. Kitap örneği: Çuhadaroğlu Metal ihraççı; payını satan üç ortak (1.000.000, 4.000.000, 4.000.000 TL nominal B grubu, 10-12 Şubat 2025) halka arz eden.<\/li>\n<li><b>Halka açılma<\/b>: halka açık olmayan ortaklığın halka açık ortaklık statüsü kazanması.<\/li>\n<\/ul>\n<h4>İlk halka arz<\/h4>\n<table>\n<tr><th>Yöntem<\/th><th>Fon nereye gider?<\/th><\/tr>\n<tr><td>Sermaye artırımı yoluyla (ortakların rüçhanı kısıtlanır)<\/td><td>Ortaklığın kasasına<\/td><\/tr>\n<tr><td>Mevcut payların satışı yoluyla<\/td><td>Satış yapan ortaklara<\/td><\/tr>\n<tr><td>İkisi birlikte<\/td><td>Her ikisine<\/td><\/tr>\n<\/table>\n<ul>\n<li>Mevcut pay satışında satılacak paylar üzerinde rehin, teminat veya devri kısıtlayan kayıt <b>bulunmamalıdır<\/b>.<\/li>\n<li>Mevcut ödenmiş veya çıkarılmış sermayenin <b>tamamı ödenmiş<\/b> olmalıdır.<\/li>\n<li><b>Finansal büyüklük<\/b> (2026 başvuruları, özel bağımsız denetimden geçmiş son iki yıl tabloları): <b>aktif toplamı<\/b> 2024 için 2.400.000.000 TL, 2025 için 3.600.000.000 TL'den az olmamalı <b>veya<\/b> <b>net satış hasılatı<\/b> 2024 için 1.200.000.000 TL, 2025 için 1.800.000.000 TL'den az olmamalı. Tutarlar her yıl yeniden değerleme katsayısıyla güncellenir.<\/li>\n<li>Yenilenebilir enerji, petrokimya, savunma sanayi, tarım gibi sektörlerde hasılatının <b>en az %75<\/b>'ini bu faaliyetlerden elde edenlere şartlar <b>indirimli<\/b> uygulanabilir.<\/li>\n<li>İlişkili taraflardan <b>ticari olmayan alacaklar<\/b>: tüm alacaklara oranı <b>%20<\/b>'yi veya aktif toplamına oranı <b>%10<\/b>'u geçemez; aksi hâlde mevcut pay satışından gelen fonun bu alacakların tahsilinde kullanılacağı taahhüt edilir.<\/li>\n<\/ul>\n<h4>Yüklenim zorunluluğu (ek satış hariç, halka arz fiyatıyla piyasa değeri)<\/h4>\n<table>\n<tr><th>Halka arz büyüklüğü (2026)<\/th><th>Yetkili kuruluşun yüklenimi<\/th><\/tr>\n<tr><td>750.000.000 TL altı<\/td><td>Satılamayan payların <b>tamamı<\/b><\/td><\/tr>\n<tr><td>750.000.000 – 1.500.000.000 TL<\/td><td>750 milyona kadar kısmın tamamı, <b>aşan kısmın yarısı<\/b><\/td><\/tr>\n<tr><td>1.500.000.000 TL üzeri<\/td><td>Zorunluluk <b>yok<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Örnek: 1,15 milyar TL'lik halka arzda yüklenim = 750 + (400 / 2) = 950 milyon TL.<\/li>\n<li>Yetkili kuruluş veya piyasa danışmanı bu şekilde aldığı payları borsada işlem başlangıcından itibaren <b>6 ay<\/b> halka arz fiyatının altında borsada satamaz; bu süre içinde satış veya devirde <b>özel durum açıklaması<\/b> zorunludur; borsa dışında bu payları alanlar da sınırlamaya tabidir.<\/li>\n<\/ul>\n<h4>Halka açılma sonrası kısıtlar<\/h4>\n<table>\n<tr><th>Kim?<\/th><th>Kısıt<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>Sermayede <b>%10 ve üzeri<\/b> payı olan ortaklar ve yönetim kontrolü sahipleri<\/td><td>Borsada işlem başlangıcından itibaren <b>1 yıl<\/b> halka arz fiyatının altında borsada satış yok; devirde özel durum açıklaması<\/td><td>Pay Tebliği<\/td><\/tr>\n<tr><td>Dağıtımdan pay alan yatırımcılar<\/td><td>Paylar hesaba geçtiği tarihten itibaren <b>90 gün<\/b> borsa dışında satış, başka hesaba virman, borsada özel emir veya toptan satış yasak<\/td><td>i-SPK.128.23 İlke Kararı (19.09.2024)<\/td><\/tr>\n<tr><td>Halka arz edilen ortaklığın mevcut ortakları<\/td><td>İzahname onayından itibaren <b>180 gün<\/b>, <b>borsada satış dahil<\/b> (halka arz edilen kısım hariç)<\/td><td>i-SPK.128.23 İlke Kararı<\/td><\/tr>\n<\/table>\n<h4>Satışa hazır bekletilen paylar<\/h4>\n<ul>\n<li>Halka arz büyüklüğü <b>950.000.000 TL<\/b>'nin (2026) altındaysa, ek satış hariç halka arz edilecek payların nominalinin <b>%25<\/b>'i, ortakların yeni pay alma hakları tamamen kısıtlanarak satışa hazır bekletilir.<\/li>\n<li>Amaç: fiyatı yükselten talebi ek hacimle karşılamak ve ortaklığa piyasa değerinden sermaye girişi sağlamak.<\/li>\n<li>İzahnamenin KAP'ta ilanından itibaren <b>bir yıl<\/b> boyunca borsa fiyatı halka arz fiyatının <b>%25 fazlasından<\/b> daha fazla yükselmedikçe satışa başlanamaz. Bir yılda satılamayanlar <b>iptal<\/b> olur.<\/li>\n<\/ul>\n<h4>Fiyat istikrarını sağlayıcı işlemler<\/h4>\n<ul>\n<li>Aracı kurum ortaklık veya kendi hesabına yapabilir. <b>Ortaklık hesabına<\/b> yapılırsa: kullanılacak fon brüt halka arz gelirinin <b>%20<\/b>'sini, alınacak payların nominali halka arz edilen nominalin <b>%20<\/b>'sini geçemez. Pay geri alım düzenlemelerine tabi değildir; tüm hususlar izahnamede yer alır.<\/li>\n<li>Borsada işlem başlangıcından itibaren <b>en çok 30 gün<\/b>. <b>Halka arz fiyatının üzerinde alım emri verilemez<\/b>; borsa fiyatı halka arz fiyatının altına düştüğünde alım yapılabilir.<\/li>\n<li>Süre bitince <b>takip eden iş günü<\/b> aracı kurum KAP'ta özel durum açıklaması yapar (tarih, ortalama fiyat, miktar, tutar). Alınan paylar süre boyunca halka arz fiyatının altında satılamaz.<\/li>\n<\/ul>\n<h4>Sermaye artırımları<\/h4>\n<ul>\n<li><b>Bedelli<\/b>: halka açık ortaklıkta sermaye koyma borcu <b>nakden<\/b> ödenir (tam ve nakden ödeme ilkesi); nakit dışı varlık devrinden doğan borçlara mahsup edilemez. Fon mevcut sermayeyi aşıyor ve ilişkili taraf borçlarının ödenmesinde kullanılacaksa <b>önemli nitelikte işlem<\/b> sayılır; muhaliflere <b>ayrılma hakkı<\/b> verilir.<\/li>\n<li><b>Şarta bağlı<\/b>: kayıtlı sermayeli halka açık ortaklıkta; borçlanma aracı alacaklıları, ortaklık varantı sahipleri veya çalışanların dönüştürme, kullanım, alım haklarıyla. Yeni pay alma hakları <b>tamamen kısıtlanır<\/b>. Halka açık olmayan ortaklıkların çalışan pay edindirme programındaki şarta bağlı artırımı için Kurula başvuru gerekmez; ortak sayısı <b>500<\/b>'ü aşarsa ortak sayısı hükümleri uygulanır.<\/li>\n<li><b>Nominal değerin altında ihraç<\/b>: borsada işlem gören halka açık ortaklık; artırım kararının açıklanmasından önceki <b>30 gün<\/b> ağırlıklı ortalama fiyat ortalaması nominalin altında olmalı. Tescilli sermaye nominal üzerinden belirlenir. İmtiyazlı pay varsa imtiyazlar kaldırılır veya imtiyaz sahipleri diğer ortaklara <b>pay alım teklifi<\/b> yapar. Paylar halka arz edilecekse yönetim kontrolü sahipleri rüçhan haklarının <b>tamamını kullanır<\/b> ve aldıkları payları <b>1 yıl<\/b> borsada satmaz. Talep alınmadan önce içeriği <b>TSPB<\/b> tarafından belirlenen <b>risk bildirim formu<\/b> imzalatılır (elektronik ortamda okunduğunun onayı da olur).<\/li>\n<\/ul>\n<h4>Diğer hususlar<\/h4>\n<ul>\n<li><b>Ön talep toplama<\/b>: ilk veya ikincil halka arzda izahname onayından önce, yükümlülük doğurmadan, bir fiyat aralığından; <b>en çok 10 iş günü<\/b>; yalnız nominal ve fiyat tespiti için anket niteliğinde; sonuçlar <b>kamuya açıklanamaz ve reklamda kullanılamaz<\/b>.<\/li>\n<li><b>Ek pay satışı<\/b>: kesin talep arzı aşarsa, izahnamede açıklanmak koşuluyla; ek satış öncesi halka arz nominalinin <b>%20<\/b>'sini aşamaz. Paylar ortaklarca satılabilir veya aracı kurum ortaklardan ödünç alıp <b>ödünç alımlı satış<\/b> yapabilir. Kullanılıp kullanılmadığı aracı kurumca KAP'ta açıklanır.<\/li>\n<li><b>Fiyat tespit raporu<\/b>: satış fiyatı borsa fiyatından farklı veya nominalden yüksekse yetkili kuruluşça (konsorsiyumda lider veya eş lider) hazırlanır; halka arzdan <b>en az 3 gün önce<\/b> ilan edilir.<\/li>\n<li><b>Analist raporu<\/b>: başka bir yetkili kuruluş fiyat tespit raporunu analiz edebilir; fiyat hakkında görüş içerir; <b>en geç halka arzın başladığı tarihte<\/b> KAP ve kendi sitesinde ilan.<\/li>\n<li><b>Değerlendirme raporları<\/b>: ilk halka arzda fiyat tespit raporunu hazırlayan kuruluş, işlem başlangıcından sonraki <b>1 yıl<\/b> içinde <b>en az iki<\/b> rapor hazırlar; ilki işlem başlangıcından <b>6 ay sonra<\/b>, iki rapor arası <b>en az 4 ay<\/b>; halka arz fiyatı ile borsa fiyatı farkının nedenleri değerlendirilir.<\/li>\n<li>Ortaklık, işlem başlangıcından sonraki <b>2 yıl<\/b> boyunca finansal tabloların açıklanmasını izleyen <b>10 iş günü<\/b> içinde fiyatlamada esas alınan varsayımların gerçekleşip gerçekleşmediğine ilişkin rapor yayımlar.<\/li>\n<li><b>Fon kullanım raporu<\/b>: artırım yoluyla halka arzda ve borsada işlem görenlerin bedelli artırımlarında fonun kullanım amaçları önceden açıklanır; sonradan, artırım sonuçlarını içeren <b>ilk iki finansal tablonun<\/b> ilanını izleyen <b>10 iş günü<\/b> içinde kullanım raporu yayımlanır.<\/li>\n<li><b>Teslim<\/b> (kaydi sistem saklı): mevcut pay halka arzı ve kayıtlı sermayeli bedelli artırımda <b>satış anında<\/b>; kâr payı ve iç kaynak artırımında onaylı ihraç belgesinin verildiği tarihten itibaren <b>15 gün<\/b>; esas sermayelilerde tescilden itibaren hamiline <b>30 gün<\/b>, nama <b>90 gün<\/b>.<\/li>\n<li><b>Borsada işlem gören niteliğe dönüştürme<\/b>: pay sahibinin MKK üyesi aracılığıyla MKK'ya talebi ve Kurul ücretinin yatırılması; MKK nominal değeri ve başvuranları günlük toplu hâlde KAP'ta duyurur; aksi bildirilmedikçe duyurudan itibaren <b>2 iş günü<\/b> sonra satılabilir.<\/li>\n<\/ul>\n\n<h3>Satış Tebliği: genel esaslar<\/h3>\n<ul>\n<li>Fiyat, şekil ve dağıtım esaslarını kural olarak ihraççı ve/veya halka arz eden belirler; yetkili kuruluşa veya konsorsiyum liderine de bırakılabilir.<\/li>\n<li>Teslim MKK nezdinde hak sahibi adına açılmış hesaplarda izlenerek yapılır; satış, aracın yatırımcının MKK hesabına aktarılmasıyla <b>tamamlanmış<\/b> sayılır.<\/li>\n<li>Talep formu güvenlik önlemiyle elektronik ortamda da onaylanabilir. <b>Kurumsal yatırımcılar<\/b>, ödenmeme riski yetkili kuruluşça üstlenilirse bedeli talep toplama bitiminden sonra ödeyebilir.<\/li>\n<li><b>Blokajla talep<\/b>: BIST-30 payları, para piyasası fonları, kısa vadeli tahvil ve bono fonları, kamu borçlanma araçları, döviz, mevduat, borsada işlem gören özel sektör borçlanma araçları, kira sertifikaları ve Kurulca uygun görülen likit varlıklar. Blokajdan doğan zarardan yetkili kuruluş ile ihraççı ve/veya halka arz eden sorumludur; ne kadarlık talep yapılabileceği izahnamede yazılır.<\/li>\n<\/ul>\n<h4>Halka arz edilmeksizin satış<\/h4>\n<ul>\n<li>Satış şekilleri: halka arz; halka arz edilmeksizin <b>tahsisli<\/b> veya <b>nitelikli yatırımcıya<\/b>.<\/li>\n<li>Nitelikliye satılanlar borsada yalnız nitelikliler arasında <b>Girişim Sermayesi Pazarı<\/b>'nda işlem görebilir; tahsisli satılanların borsada işlem görmemesi esastır.<\/li>\n<li>Satıştan önce Kurulca içeriği belirlenen <b>beyan<\/b> imzalatılır (riskler; nitelikli satışta ayrıca nitelikli olduğu). MKK'da kayıtlı nitelikliden beyan gerekmez; MKK üyesi kuruluş kaydı kontrol eder. Daha önce tahsisli satışta beyan imzalanmış olması yeni beyan yükümlülüğünü kaldırmaz.<\/li>\n<li><b>Tahsisli<\/b>: payların ikincil piyasa işlemleri hariç, aracı belirli bir anda elinde tutan yatırımcı sayısı <b>150'yi geçmemeli<\/b>. Günlük kontrolde müşterek hesap sahipleri <b>ayrı ayrı<\/b> sayılır; yalnız <b>gün sonu bakiyesi olan<\/b> hesaplar dikkate alınır; <b>nitelikli yatırımcılar sayılmaz<\/b>. Aşılırsa MKK derhal ihraççıya ve Kurula bildirir; ihraççı bildirimden itibaren <b>20 iş günü<\/b> içinde izahname onayı için Kurula ve işlem görme için borsaya başvurur.<\/li>\n<li><b>Nitelikli<\/b>: yalnız onlara yönelik çağrı ve/veya önceden belirlenme yoluyla; <b>yatırımcı sayısı sınırı yoktur<\/b>. Nitelikli olma bilgisi beyan üzerine MKK üyesi kuruluşça <b>MKS<\/b>'ye kaydedilir; tek kuruluşun kaydı yeterlidir. Nitelikli kişinin tüm tekil hesapları nitelikli sayılır; müşterek hesap için tüm sahipler nitelikli olmalıdır. Kurumsal yatırımcılar beyan aranmadan <b>resen<\/b> kaydedilir. Statü kaybı yatırımcı tarafından bildirilir; profesyonel müşteri statüsünden çıkan nitelikli statüsünü de kaybeder.<\/li>\n<\/ul>\n\n<h3>İlk halka arzda satış yöntemleri<\/h3>\n<ul>\n<li>Tebliğ m.13: <b>talep toplama yoluyla<\/b>, <b>talep toplanmaksızın<\/b>, <b>borsada satış<\/b>. Talep toplanmaksızın satış istisnaidir: belirli büyüklüğün altındaki, payları borsada işlem görmeyen halka açık ortaklıkların belirli fiyattan satışı; bedel izahnamedeki özel hesaba yatırılır.<\/li>\n<li>Borsa dışı talep toplama: <b>sabit fiyatla, fiyat teklifi alarak, fiyat aralığıyla<\/b>. Prosedür'de borsada ilk halka arz: <b>sürekli işlem, sabit fiyat (SFY), değişken fiyat (DFY)<\/b>. En yaygın yöntem sabit fiyatla talep toplamadır.<\/li>\n<\/ul>\n<table>\n<tr><th>Ölçüt<\/th><th>Borsa dışı sabit fiyatla talep toplama<\/th><th>Borsada sabit fiyat (SFY)<\/th><\/tr>\n<tr><td>Dayanak<\/td><td>Satış Tebliği<\/td><td>BIST Pay Piyasası Prosedürü<\/td><\/tr>\n<tr><td>Tahsisat<\/td><td>Var; m.18 asgari <b>%10 yurt içi bireysel, %10 yurt içi kurumsal<\/b><\/td><td><b>Yok<\/b>; tüm gruplar eşit, dağıtımın neredeyse tamamı bireysele<\/td><\/tr>\n<tr><td>Süre<\/td><td><b>En az 2, en fazla 20 iş günü<\/b><\/td><td><b>En fazla 3 iş günü<\/b>; birincil piyasa seansı genellikle 10:30-13:00<\/td><\/tr>\n<tr><td>Emir<\/td><td>Talep formu (fiziksel veya elektronik)<\/td><td>Tek sabit fiyattan <b>İptale Kadar Geçerli (İKG)<\/b> emir; fiyat değiştirilemez; farklı fiyat reddedilir<\/td><\/tr>\n<tr><td>Öncelik<\/td><td>Grup içinde eşit ve adil davranma (m.19)<\/td><td>Fiyat önceliği yok; yalnız <b>zaman önceliği<\/b><\/td><\/tr>\n<tr><td>Mükerrer talep<\/td><td>Eşit dağıtımda <b>en yüksek miktarlı talep<\/b> dikkate alınır (m.22); oransal dağıtımda veya yetersiz talepte uygulanmaz<\/td><td><b>MKK bazında tekleştirme<\/b>: zaman önceliği olan <b>ilk emir<\/b> geçerli, sonrakiler dağıtım dışı<\/td><\/tr>\n<tr><td>Fazla talepte dağıtım<\/td><td>Eşit veya (izahnamede belirtilerek) oransal dağıtım (m.20)<\/td><td>Zaman öncelikli <b>dairesel dağıtım<\/b>: sırayla herkese 1'er lot<\/td><\/tr>\n<tr><td>Dağıtım takvimi<\/td><td>Liste 2 iş günü, ihraççı onayı ve teslim 2 iş günü, iade 1 iş günü<\/td><td>Talep toplamanın bittiği gün seans sonrası (genellikle 18:15 sonrası) otomatik; takas <b>T+2<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Borsa dışı yöntemde süre sonunda zorunlu asgari oranlar korunarak gruplar arası kaydırma yapılabilir; ancak bir grubun tutarı <b>%20'den fazla azaltılamaz<\/b>. Yeterli talep gelmeyen grubun kalanı diğer gruplara aktarılabilir.<\/li>\n<li><b>Eşit dağıtım<\/b>: grup tahsisi talepte bulunan sayısına bölünür; bu miktar ve altındaki talepler önce karşılanır; kalan, karşılanamayanlar arasında yine eşit paylaştırılır ve paylar bitene kadar sürer. Alt sınır koyan yatırımcının miktarı sınırın altında kalırsa listeden çıkarılır. Küsurat tama iblağ edilerek ihraççı veya halka arz edenin uygun gördüğü şekilde dağıtılır.<\/li>\n<li><b>Oransal dağıtım<\/b>: her talep, gruptaki toplam talebin arza oranı kadar karşılanır.<\/li>\n<li>Tüm bireysel yatırımcılara verilecek <b>asgari tutar<\/b> önceden belirlenebilir; yetmezse izlenecek yol izahnamede yazılır.<\/li>\n<li>SFY'de talep toplamanın sonunda <b>MKK sicil numarası bulunmayan veya müşterek hesap<\/b> olan hesaplardan gelen emirler dağıtıma girmez. Kurul veya Borsa aksi karar almamış ve duyurulmuşsa süre bitmeden dağıtım yapılabilir.<\/li>\n<li>Kitap örneği (SFY): arz 23 lot, talepler A 6, B 14, C 23, D 6, E 8 lot; dairesel dağıtım sonucu A 5, B 5, C 5, D 4, E 4.<\/li>\n<\/ul>\n\n<h3>i-SPK.128.23 İlke Kararı (19.09.2024)<\/h3>\n<ul>\n<li>Halka arz edilen payların piyasa değeri <b>750.000.000 TL ve altı<\/b> ise <b>borsada satış yöntemi zorunlu<\/b>.<\/li>\n<li>750 milyon TL üzeri halka arzda borsa dışı talep toplamada:\n  <ul>\n  <li>Yurt içi bireysel gruba <b>eşit dağıtım<\/b>.<\/li>\n  <li>İzahnamede tanımlanırsa kurumsal dışında <b>yüksek talepte bulunacak yatırımcı grubu<\/b>na toplamın <b>%10<\/b>'una kadar tahsisat; eşit veya oransal dağıtım. Oransal dağıtımda talebin tamamı kadar nakit ve/veya <b>%120<\/b>'si oranında BİST30 payı teminatı; yatırımcı başına talep gruba tahsis edilenin <b>dörtte birini<\/b> geçemez.<\/li>\n  <li>Yurt içi kurumsal grupta yeterli talep varsa tahsisin <b>en az %50<\/b>'si yatırım fonları, emeklilik yatırım fonları ve/veya OKS fonlarına; kurumsal yatırımcı başına dağıtım halka arzın <b>%1<\/b>'ini aşmaz; bir PYŞ'nin kurucusu/yöneticisi olduğu fonlar için <b>%3<\/b>; PYŞ'ler ve ilişkili tüzel kişilerin kendi nam ve hesabına talebi <b>%2<\/b>.<\/li>\n  <li>Bireysel portföy yöneticiliği müşterileri adına talepler, GYF, GSYF, unvanında serbest veya özel geçen fonlar ve III-39.1 m.31/1-(d) kapsamındakiler <b>kurumsal grupta sayılmaz<\/b>.<\/li>\n  <li>İçsel bilgiye ulaşabilecekler, eşleri ve birinci derece kan ve sıhri hısımları yalnız <b>yurt içi bireysel<\/b> gruptan talepte bulunabilir.<\/li>\n  <li>Bir gruba yeterli talep gelmişse o gruptan diğerlerine <b>kaydırma yapılamaz<\/b>; yeterli talep gelmeyen grubun kalanı serbestçe aktarılabilir.<\/li>\n  <li>Talep formu tarih ve saat belirten müteselsil sıra numarasıyla; dağıtım listesi talep bazında, talep numarası, form çeşidi, teminat tutarı ve türüyle.<\/li>\n  <li>Yurt dışı grupta hükümleri dolanmaya yönelik dağıtımdan ihraççı ve yetkili kuruluş/konsorsiyum lideri sorumludur; Kurula taahhütname verilir.<\/li>\n  <\/ul><\/li>\n<li>Kurumsal yatırımcının kendi portföyü için aldığı paylar bireysel hesaplara <b>aktarılamaz<\/b>; müşteri adına talepler müşterinin grubundan ve belgeleriyle yapılır.<\/li>\n<li>90 gün ve 180 gün kısıtları (yukarıdaki tablo). Usule aykırı dağıtımdan ihraççı ve/veya halka arz eden ile yetkili kuruluş, konsorsiyum lideri ve eş liderler kusurlarına göre sorumludur.<\/li>\n<\/ul>\n\n<h3>TSPB Halka Arz İlkeleri (öne çıkanlar)<\/h3>\n<ul>\n<li>Üyeler halka arza yalnız gelir amaçlı bakmaz; <b>prensip olarak kendilerinin yatırım yapmayacağı şirketleri halka arz etmez<\/b>; geniş katılımlı konsorsiyum için çaba gösterir; şirket ve yatırımcıya eşit mesafede durur.<\/li>\n<li>Değerleme raporları varsayım ve dayanaklarıyla hazırlanır; SPK'nın yayımladığı uluslararası değerleme standartlarına uyulur; şirket varsayımlarına ihtiyatla yaklaşılır.<\/li>\n<li><b>Fiyat aralığı dar tutulur<\/b>; fiyat iskontolu belirlenmeye çalışılır. Halka arzın çoğunluğu kurumsala tahsis edilmemişse <b>fiyat aralığı uygulanmaz, tek fiyattan<\/b> talep toplanır.<\/li>\n<li>Fiyat bandında yeterli talep varken gruplar arası tahsisat <b>değiştirilmez<\/b>. Yeterli talep yoksa tutarı küçültmek yerine <b>iptal veya erteleme<\/b> tercih edilir.<\/li>\n<li>İzahname dışında farklı fiyat uygulanmaz; teşvikler <b>süreye bağlı olmayan ve fiyatı etkilemeyen<\/b> yöntemlerden seçilir; yabancıya ağırlıklı tahsisatta Uluslararası Halka Arz Sirküleri tercih edilir.<\/li>\n<li>Şirketlere ilişkin: seçici olma, doğru zaman ve adil fiyat, şirket değeri odaklı rekabet etmeme, temettü politikasının açıklanmasını önerme, kurumsal yönetim, nitelikli bağımsız denetim, asgari finansal ve hukuki <b>ayrıntılı inceleme (due diligence)<\/b>.<\/li>\n<li>Yatırımcıya ilişkin: uzun vadeli bireysel ve kurumsal katılım, bireysel payın tabana yayılması, \"en kısa sürede en yüksek getiri\" kanısını değiştirme çabası.<\/li>\n<\/ul>", "sorular": [{"q": "İzahname ve İhraç Belgesi Tebliği'ne göre aşağıdaki halka arzlardan hangisinde izahname hazırlama yükümlülüğünden muafiyet bulunur? (Tutarlar 2026 yılı için geçerlidir.)", "o": ["Her yatırımcının en az 9.500.000 TL'lik alım yaptığı halka arz", "Her yatırımcının en az 950.000 TL'lik alım yaptığı halka arz", "Birim nominal değeri 1.000.000 TL olan borçlanma araçlarının halka arzı", "Toplam satış bedeli 100.000.000 TL olan ilk pay halka arzı", "Bireysel yatırımcılara yönelik herhangi bir halka arz"], "a": 0, "e": "Yatırımcı başına en az 9.500.000 TL alım veya birim nominali en az 9.500.000 TL olan araç muafiyet sebebidir. 142.500.000 TL altı muafiyeti payların ilk halka arzında uygulanmaz."}, {"q": "Aşağıdakilerden hangisi izahname hazırlanması gerekmeyen durumlardan biri değildir?", "o": ["Kâr payının pay olarak dağıtımı dahil bedelsiz pay çıkarılması", "Yalnız nitelikli yatırımcılara satış yapılması", "Sermaye piyasası araçlarının tahsisli satışı", "Duyuru metni ilanı şartıyla belirli birleşme işlemleri nedeniyle araç çıkarılması", "Daha önce tahsisli satılmış payların sonradan halka arz edilerek yeniden satışa sunulması"], "a": 4, "e": "Muafiyetle veya izahnamesiz ihraç edilen araçların sonradan halka arzında izahname hazırlanması zorunludur."}, {"q": "Halka açık olmayan bir şirket artırım yoluyla çıkaracağı payları halka arz etmeden yalnız MKK'da kayıtlı 30 nitelikli yatırımcıya satacaktır. Kurula onaylatılması gereken belge hangisidir?", "o": ["İzahname", "Yalnız sermaye piyasası aracı notu", "İhraç belgesi", "Tasarruf sahiplerine satış duyurusu", "Fiyat tespit raporu"], "a": 2, "e": "Halka arz edilmeksizin ihraçta izahname gerekmez ama ihraç belgesi hazırlanıp onaylatılır. İhraç belgesi ticaret siciline tescil edilmez, 15 iş günü içinde KAP ve internet sitelerinde ilan edilir."}, {"q": "Birden fazla belgeden oluşan izahnamede, halka açık ortaklığın sermaye artırımında yeni pay alma haklarının kullanımına ilişkin bilgiler hangi belgede yer alır?", "o": ["İhraççı bilgi dokümanı", "Özet", "Sermaye piyasası aracı notu", "Tasarruf sahiplerine satış duyurusu", "Fiyat tespit raporu"], "a": 2, "e": "Rüçhan kullanım bilgileri tek belgede ilgili kısımda, çoklu belgede sermaye piyasası aracı notunda (SPAN) yer alır."}, {"q": "İzahnamedeki yanlış, yanıltıcı ve eksik bilgilerden doğan zararlardan birincil olarak sorumlu olan kimdir?", "o": ["İhraççı", "Sermaye Piyasası Kurulu", "Lider yetkili kuruluş", "Bağımsız denetim kuruluşu", "Borsa İstanbul"], "a": 0, "e": "Birincil sorumlu ihraççıdır; zarar ondan tazmin edilemezse halka arz edenler, lider yetkili kuruluş, garantör ve YK üyeleri kusurlarına göre sorumlu olur."}, {"q": "İzahnameye ilişkin süreler bakımından aşağıdaki eşleştirmelerden hangisi yanlıştır?", "o": ["Kurulun ilk halka arzda inceleme süresi: 20 iş günü", "İzahnamenin geçerlilik süresi: ilk yayımdan itibaren 12 ay", "Onaylı izahnamenin ilanı: teslim alınmasından itibaren 15 iş günü", "Nerede yayımlandığının tescili: ilandan itibaren 10 iş günü", "Değişiklik sonrası talep geri alma: yayımdan itibaren 5 iş günü"], "a": 4, "e": "Talep geri alma süresi değişikliklerin yayımından itibaren 2 iş günüdür; izahnamede belirtilerek ihraççı daha uzun belirleyebilir. Diğer eşleştirmeler doğrudur.", "k": 1}, {"q": "İzahnamenin Kurulca onaylanmasına ilişkin hangisi doğrudur?", "o": ["Onay, Kurulun halka arz fiyatını uygun bulduğunu gösterir", "Onaylı izahname yatırım tavsiyesi niteliğindedir", "Satışa başlamak için izahnamenin nerede yayımlandığının tescili şarttır", "Onay, bilgilerin doğruluğunun Kurulca tekeffülü anlamına gelmez ve reklam amacıyla kullanılamaz", "Elektronik yayımlanan izahnamenin basılı nüshası ücret karşılığında verilir"], "a": 3, "e": "Onay bilgilerin doğruluğunun garantisi değildir, reklamda kullanılamaz, tavsiye değildir. Satış için tescil gerekmez; basılı nüsha bedelsizdir."}, {"q": "2026 yılında ilk halka arz başvurusu yapacak bir şirketin aktif toplamı 2024'te 2,0 milyar TL, 2025'te 3,0 milyar TL; net satış hasılatı 2024'te 1,3 milyar TL, 2025'te 1,9 milyar TL'dir. Pay Tebliği'ndeki finansal büyüklük şartına göre hangisi doğrudur? (Şirket indirimli sektörlerde değildir.)", "o": ["Şartı sağlamaz; aktif toplamı her iki yılda eşiğin altındadır", "Şartı sağlar; net satış hasılatı ölçütü her iki yılda karşılanmaktadır", "Şartı sağlamaz; aktif ve hasılat ölçütlerinin birlikte sağlanması gerekir", "Şartı sağlar; yalnız 2025 aktif toplamına bakılır", "Şartı sağlamaz; 2025 hasılatı 3,6 milyar TL'nin altındadır"], "a": 1, "e": "Eşikler aktif toplamı 2,4 / 3,6 milyar TL veya net satış hasılatı 1,2 / 1,8 milyar TL'dir. Hasılat 1,3 ve 1,9 milyar TL ile her iki yılda karşılandığı için şart sağlanır."}, {"q": "Ek satış hariç halka arz büyüklüğü 1.300.000.000 TL olan bir ilk halka arzda, satışa aracılık eden yetkili kuruluşun asgari yüklenim tutarı kaç TL'dir?", "o": ["1.300.000.000", "750.000.000", "650.000.000", "275.000.000", "1.025.000.000"], "a": 4, "e": "750 milyona kadar kısmın tamamı + aşan kısmın yarısı: 750 + (1.300 − 750) / 2 = 750 + 275 = 1.025 milyon TL."}, {"q": "Brüt halka arz geliri 1,2 milyar TL ve halka arz edilen payların nominal değeri 30 milyon TL olan bir halka arzda, aracı kurum ortaklık hesabına fiyat istikrarını sağlayıcı işlem yapacaktır. Kullanılabilecek azami fon ve alınabilecek azami nominal pay hangisidir?", "o": ["240 milyon TL fon; 6 milyon TL nominal pay", "120 milyon TL fon; 3 milyon TL nominal pay", "240 milyon TL fon; 7,5 milyon TL nominal pay", "300 milyon TL fon; 6 milyon TL nominal pay", "360 milyon TL fon; 9 milyon TL nominal pay"], "a": 0, "e": "Her iki sınır da %20'dir: 1,2 milyar × %20 = 240 milyon TL; 30 milyon × %20 = 6 milyon TL nominal."}, {"q": "Halka arz fiyatı 40 TL olan pay, işlem görmeye başladığı gün 43 TL'ye yükselmiştir. Fiyat istikrarını sağlayıcı işlemler açısından hangisi doğrudur?", "o": ["Aracı kurum 43 TL'den alım yapabilir; işlemler en çok 60 gün sürer", "İşlemler Pay Geri Alım Tebliği'ne tabi olduğundan genel kurul kararı gerekir", "Halka arz fiyatının üzerinde alım emri verilemez; işlemler en çok 30 gün yapılabilir", "Süre bitiminden itibaren 10 iş günü içinde KAP'ta açıklama yapılır", "Alınan paylar süre içinde halka arz fiyatının altında serbestçe satılabilir"], "a": 2, "e": "FİSİ'de halka arz fiyatı üzerinde alım emri verilemez; süre işlem başlangıcından en çok 30 gündür; açıklama takip eden iş günü yapılır ve paylar süre boyunca halka arz fiyatının altında satılamaz."}, {"q": "i-SPK.128.23 sayılı İlke Kararı'na göre ilk halka arzda dağıtımdan pay alan bireysel yatırımcı ile halka arz edilen ortaklığın mevcut ortağına uygulanan kısıtlar hangisidir?", "o": ["Yatırımcı 180 gün hiç satamaz; mevcut ortak 90 gün borsa dışında satamaz", "Yatırımcı 30 gün borsada satamaz; mevcut ortak 1 yıl satamaz", "Her ikisi de 90 gün borsada satış yapamaz", "Yatırımcıya kısıt yoktur; mevcut ortak 6 ay borsa dışında satamaz", "Yatırımcı 90 gün borsa dışında satamaz ve virmanlayamaz; mevcut ortak izahname onayından itibaren 180 gün borsada da satamaz"], "a": 4, "e": "Dağıtımdan alanlar 90 gün borsa dışı satış, virman, özel emir ve toptan satış yapamaz (borsada normal satış serbest). Mevcut ortaklar için kısıt izahname onayından itibaren 180 gün ve borsada satışı da kapsar."}, {"q": "Halka arz büyüklüğü 950 milyon TL'nin altında olan bir ilk halka arzda ek satış hariç halka arz edilecek payların nominali 60 milyon TL, halka arz fiyatı 24 TL'dir. Satışa hazır bekletilecek pay tutarı ve satışa başlanabilmesi için borsa fiyatının aşması gereken seviye hangisidir?", "o": ["12 milyon TL nominal; 28,80 TL", "15 milyon TL nominal; 30 TL", "15 milyon TL nominal; 28,80 TL", "6 milyon TL nominal; 30 TL", "15 milyon TL nominal; 36 TL"], "a": 1, "e": "Nominalin %25'i: 60 × %25 = 15 milyon TL. Borsa fiyatı halka arz fiyatının %25 fazlasını (24 × 1,25 = 30 TL) aşmadıkça satışa başlanamaz; bir yılda satılamayanlar iptal olur."}, {"q": "Ek pay satışı öncesinde halka arz edilen payların nominal değeri 45 milyon TL'dir. Ek pay satışına konu payların nominal değeri en fazla kaç TL olabilir?", "o": ["4,5 milyon", "11,25 milyon", "13,5 milyon", "9 milyon", "22,5 milyon"], "a": 3, "e": "Ek pay satışı, ek satış öncesi halka arz nominalinin %20'sini aşamaz: 45 × %20 = 9 milyon TL."}, {"q": "İlk halka arzda fiyat tespit raporunu hazırlayan kuruluşun değerlendirme raporlarına ilişkin hangisi doğrudur?", "o": ["İşlem başlangıcından sonraki 2 yıl içinde en az dört rapor; her biri 6 ay arayla", "İşlem başlangıcından sonraki 1 yıl içinde en az iki rapor; ilki 6 ay sonra, ikisi arasında en az 4 ay", "Yalnız bir rapor; işlem başlangıcından 3 ay sonra", "İşlem başlangıcından sonraki 1 yıl içinde en az iki rapor; ilki 3 ay sonra, aralık en az 6 ay", "Rapor zorunlu değildir; analist raporu yeterlidir"], "a": 1, "e": "Kitaba göre iki rapordan ilki işlem başlangıcından 6 ay sonra yapılır ve iki rapor arası en az 4 aydır."}, {"q": "Tahsisli satılan bir aracın gün sonu itibarıyla bakiyeli hesapları şöyledir: 130 tekil hesap, her biri iki kişiye ait 10 müşterek hesap ve MKK'da kayıtlı 15 nitelikli yatırımcı. 150 kişi sınırı bakımından sayılacak yatırımcı sayısı ve sonuç hangisidir?", "o": ["155; sınır aşılmıştır", "165; sınır aşılmıştır", "140; sınır aşılmamıştır", "150; sınır aşılmamıştır", "170; sınır aşılmıştır"], "a": 3, "e": "Müşterek hesap sahipleri ayrı ayrı sayılır (10 × 2 = 20), nitelikli yatırımcılar sayılmaz: 130 + 20 = 150. Sınır 150'yi geçmemektir, aşılmamıştır."}, {"q": "Borsa dışında sabit fiyatla talep toplanan bir halka arzda yurt içi bireysel gruba 3.000 lot tahsis edilmiştir. Talepler: A 200, B 500, C 700, D 900, E 1.500 lot. Eşit dağıtımda D yatırımcısı kaç lot alır?", "o": ["800", "600", "900", "766", "540"], "a": 0, "e": "1. tur: 3.000 / 5 = 600; A ve B tam karşılanır (700 lot), kalan 2.300. 2. tur: 2.300 / 3 ≈ 766,7; C'nin 700'ü karşılanır, kalan 1.600. 3. tur: 1.600 / 2 = 800; D ve E 800'er lot alır."}, {"q": "Borsada satış yöntemiyle yapılan halka arzda 10 lot satışa sunulmuştur. Zaman önceliğine göre geçerli talepler: A 2, B 5, C 4, D 6 lot (farklı MKK sicil numaraları). Zaman öncelikli dairesel dağıtım sonucu hangisidir?", "o": ["A 2, B 2, C 3, D 3", "A 1, B 3, C 3, D 3", "A 2, B 3, C 2, D 3", "A 3, B 3, C 2, D 2", "A 2, B 3, C 3, D 2"], "a": 4, "e": "1. tur dört yatırımcıya 1'er lot (kalan 6); 2. tur yine 1'er lot (A tamamlandı, kalan 2); 3. tur B ve C'ye 1'er lot (kalan 0). Sonuç A 2, B 3, C 3, D 2."}, {"q": "Borsada sabit fiyat yönteminde bir yatırımcı aynı MKK sicil numarasıyla 10:35'te 300 lot, 10:50'de 800 lot ve 11:20'de 1.000 lot olmak üzere farklı aracı kurumlardan üç emir iletmiştir. Dağıtıma kaç lotluk talep dahil edilir?", "o": ["1.000", "2.100", "300", "800", "700"], "a": 2, "e": "MKK bazında tekleştirmede zaman önceliği olan ilk emir kabul edilir; sonraki emirler miktarına bakılmaksızın dağıtım dışıdır. En yüksek talebi alma kuralı borsa dışı eşit dağıtıma aittir."}, {"q": "Borsa dışı sabit fiyatla talep toplama ile borsada sabit fiyat (SFY) yöntemi karşılaştırıldığında hangisi yanlıştır?", "o": ["Borsa dışı yöntemde talep toplama süresi 2 ile 20 iş günü arasındadır", "SFY'de talep toplama en fazla üç iş günüdür", "SFY yönteminde yatırımcı gruplarına önceden tahsisat yapılabilir", "SFY'de emirler arasında yalnız zaman önceliği vardır", "SFY'de takas dağıtım gününü izleyen ikinci iş günü yapılır"], "a": 2, "e": "SFY'de tahsisata izin verilmez; bütün gruplar eşittir. Tahsisat borsa dışı yöntemin özelliğidir."}, {"q": "i-SPK.128.23 sayılı İlke Kararı'na göre hangi halka arzlarda borsada satış yöntemi zorunludur?", "o": ["Halka arz edilen payların piyasa değeri 750 milyon TL ve altında olanlar", "Halka arz edilen payların piyasa değeri 1,5 milyar TL üzerinde olanlar", "Halka arz büyüklüğü 950 milyon TL ve altında olanlar", "Yalnız mevcut payların satışı yoluyla yapılanlar", "Yalnız yurt dışı kurumsal tahsisatı olanlar"], "a": 0, "e": "750.000.000 TL ve altındaki halka arzlarda borsada satış yöntemi zorunludur."}, {"q": "i-SPK.128.23 sayılı İlke Kararı'nda yurt içi kurumsal yatırımcı grubunda yapılacak dağıtıma ilişkin hangisi doğrudur?", "o": ["Her bir kurumsal yatırımcıya halka arzın en fazla %3'ü dağıtılabilir", "Serbest fonların talepleri kurumsal grupta değerlendirilir", "PYŞ'lerin kendi hesabına talebi halka arzın %10'una kadar karşılanabilir", "Yeterli talep varsa tahsisin en az %50'si yatırım fonları, emeklilik yatırım fonları ve/veya OKS fonlarına dağıtılır", "Kurumsal yatırımcının aldığı paylar bireysel hesaplara aktarılabilir"], "a": 3, "e": "Kurumsal başına sınır %1, PYŞ fonları için %3, PYŞ'nin kendi hesabına %2'dir. Serbest fonlar kurumsal grupta sayılmaz; kurumsalın aldığı paylar bireysel hesaplara aktarılamaz."}, {"q": "Satış Tebliği'ne göre borsa dışında talep toplama yoluyla satışta yatırımcı gruplarına yapılan tahsisatla ilgili hangisi doğrudur?", "o": ["Yurt içi bireysel gruba asgari %50 tahsisat zorunludur", "Yurt içi bireysel ve yurt içi kurumsal gruplara asgari %10 tahsisat zorunludur ve bir grubun tutarı %20'den fazla azaltılamaz", "Bir grubun tutarı serbestçe sıfırlanabilir", "Asgari tahsisat yalnız yurt dışı kurumsal gruba uygulanır", "Asgari oranlar %20 bireysel, %20 kurumsaldır"], "a": 1, "e": "Tebliğ m.18 asgari %10 yurt içi bireysel ve %10 yurt içi kurumsal tahsisat öngörür; kaydırmada bir grubun tutarı %20'den fazla azaltılamaz."}, {"q": "TSPB Halka Arz İlkelerine göre aşağıdakilerden hangisi üyelerin uyması gereken ilkelerden biri değildir?", "o": ["Prensip olarak kendilerinin yatırım yapmayacağı şirketleri halka arz etmemek", "Halka arzda fiyat aralığını dar tutmak", "Teşvikleri süreye bağlı olmayan ve fiyatı etkilemeyen yöntemlerden seçmek", "Halka arz fiyatını iskontolu belirlemeye gayret etmek", "Yeterli talep oluşmazsa halka arzı ertelemek yerine halka arz tutarını küçültmek"], "a": 4, "e": "İlkeye göre yeterli talep yoksa tutarı küçültmek yerine halka arzı iptal etmek veya ertelemek tercih edilir."}, {"q": "Payları borsada işlem gören halka açık bir ortaklığın nominal değerin altında pay ihraç edebilmesi için aranan fiyat koşulu hangisidir?", "o": ["Artırım kararının açıklanmasından önceki 30 gün içindeki ağırlıklı ortalama fiyatların ortalamasının nominal değerin altında olması", "Son kapanış fiyatının nominal değerin %20 altında olması", "Son 6 aylık ortalama fiyatın nominal değerin altında olması", "Payın Yakın İzleme Pazarı'nda işlem görmesi", "Son 1 yıllık en düşük fiyatın nominal değerin altında olması"], "a": 0, "e": "Koşul, açıklamadan önceki 30 günün ağırlıklı ortalama fiyat ortalamasıdır. Tescil edilen sermaye nominal değer üzerinden belirlenir ve TSPB risk bildirim formu imzalatılır."}]}, {"id": 4, "kisa": "Kurumsal Eylemler", "baslik": "Kurumsal Eylemler: Temettü, Sermaye Artırımı ve Azaltımı, Geri Alım ve Çıkış Hakları", "ozet": "Nakit kâr payı süreci ve fiyat düzeltmesi, bedelli artırım ve rüçhan hakkı, bedelsiz artırım, sermaye azaltımı, pay geri alım programları ile zorunlu pay alım teklifi, ayrılma ve satma hakları.", "notlar": "<p>Kurumsal eylemler sermaye yapısını, pay miktarını ve yatırımcı haklarını doğrudan etkiler: nakit kâr payı, bedelli ve bedelsiz sermaye artırımı, fon çıkışı gerektirmeyen sermaye azaltımı, pay geri alımı ve azınlığı koruyan çıkış hakları (pay alım teklifi, ayrılma, satma).<\/p>\n\n<h3>Nakit kâr payı (temettü)<\/h3>\n<ul>\n<li>Dönem kârı veya serbest yedeklerden genel kurul kararıyla dağıtılan tutar. Pay olarak da yapılabilir; en yaygını nakittir.<\/li>\n<li><b>II-19.1 Kâr Payı Tebliği<\/b>: halka açık ortaklık bir <b>kâr dağıtım politikası<\/b> belirler, genel kurul onayına sunar ve kamuya açıklar. Kâr payı dağıtım kararını <b>yalnız genel kurul<\/b> alabilir.<\/li>\n<li>İstisna: esas sözleşmede hüküm ve genel kurul yetkisi varsa YK kararıyla, yalnız ilgili hesap dönemiyle sınırlı <b>kâr payı avansı<\/b> dağıtılabilir.<\/li>\n<li>Genel kurul dağıtım kararı aldıysa dağıtıma <b>en geç ilgili hesap dönemi sonuna kadar<\/b> başlanır.<\/li>\n<li>Kâr payı <b>bir defada veya taksitle<\/b> ödenebilir. Dikkat: <b>payları borsada işlem görmeyen<\/b> ortaklıklar taksitle dağıtımdan yararlanamaz. Her taksit için ayrı hak kullanım tarihi belirlenir; Borsa fiyat düzeltmesini o taksitin brüt tutarı kadar, o taksitin hak kullanım tarihinde yapar.<\/li>\n<li>Tahsil edilmeyen kâr payları dağıtım tarihinden itibaren <b>5 yıl<\/b> sonra zamanaşımına uğrar ve <b>Hazine<\/b>'ye intikal eder.<\/li>\n<\/ul>\n<h4>Tarihler ve akış<\/h4>\n<table>\n<tr><th>Tarih<\/th><th>Anlamı<\/th><\/tr>\n<tr><td><b>Hak kullanım tarihi<\/b><\/td><td>Payın temettü hakkı olmadan işlem görmeye başladığı gün; <b>fiyat düzeltmesi bu gün<\/b> yapılır<\/td><\/tr>\n<tr><td><b>Kayıt tarihi<\/b><\/td><td>MKK'nın hak sahiplerini kesinleştirdiği gün; hak kullanım tarihini izleyen <b>ilk iş günü<\/b><\/td><\/tr>\n<tr><td><b>Ödeme tarihi<\/b><\/td><td>Aracı kurumların net temettüyü yatırımcı hesabına geçirdiği gün<\/td><\/tr>\n<\/table>\n<ul>\n<li>Temettü hakkı için pay, <b>hak kullanım tarihinden bir önceki iş günü kapanışında<\/b> portföyde bulunmalıdır.<\/li>\n<li>Akış: şirket genel kurul kararını KAP'ta duyurur, toplam tutarı <b>Takasbank<\/b>'a aktarır; Takasbank MKK'dan aldığı hak sahipleri listesine göre aracı kurumlara dağıtır; aracı kurumlar ödeme tarihinde net tutarı hesaplara yatırır. Kaydi sistem sayesinde kupon kesme veya başvuru gerekmez.<\/li>\n<li><b>Teorik fiyat<\/b> (BIST Özsermaye Hallerinde Teorik/Referans Fiyat Prosedürü, tamamı nakit): <b>Ft = Fk − T<\/b> (Fk önceki kapanış, T brüt temettü).<\/li>\n<\/ul>\n<h4>Vergilendirme<\/h4>\n<ul>\n<li>Tam mükellef gerçek kişide ilk aşama <b>stopaj<\/b>: şirket brüt kâr payı üzerinden keser. Kitap örneği: önceki kapanış 120 TL, brüt temettü 5 TL, stopaj %15: teorik fiyat 115 TL, stopaj 0,75 TL, net 4,25 TL.<\/li>\n<li>GVK'ya göre kâr payının <b>%50'si gelir vergisinden istisnadır<\/b>. Kalan %50 o yılın beyan haddini aşarsa beyannameye dahil edilir ve kesilen %15 stopaj mahsup edilir; aşmazsa beyanname verilmez, %15 stopaj nihai vergi olur.<\/li>\n<\/ul>\n\n<h3>Bedelli sermaye artırımı ve rüçhan hakkı<\/h3>\n<ul>\n<li>Mevcut ortaklardan veya yeni yatırımcılardan nakit karşılığı yeni pay ihracı; geri ödemesiz, uzun vadeli finansman. Halka açık ortaklıkta sermaye koyma borcu <b>nakden<\/b> ödenir.<\/li>\n<li>Yeni paylar <b>seyrelme<\/b> yaratır; TTK ve SPKn mevcut ortaklara <b>rüçhan hakkı<\/b> (yeni pay alma, ön alım) tanır: yeni paylardan mevcut payları oranında ve öncelikli alma.<\/li>\n<li>Süreç <b>VII-128.1 Pay Tebliği<\/b>'ne tabidir. Kayıtlı sermaye sisteminde artırım kararını <b>YK<\/b> alabilir.<\/li>\n<li>Rüçhan kural olarak tüm ortaklara tanınır; <b>haklı gerekçe<\/b> varsa sınırlandırılabilir veya kaldırılabilir. Kısıtlama, kayıtlı sermayede esas sözleşmeyle yetkili YK'nın, esas sermayede genel kurulun artırım kararında açıkça belirtilir.<\/li>\n<li>Süreç: artırım kararı ve SPK'ya izahname başvurusu; onay sonrası KAP duyurusu. Rüçhan kullanımı izahnamenin ilanını izleyen <b>10 gün<\/b> içinde başlatılır.<\/li>\n<li>Payları borsada işlem gören ortaklıklarda rüçhan kullanım süresi <b>15 günden az, 60 günden fazla olamaz<\/b>; uygulamada genellikle 15 gün. Kullanımın başladığı gün <b>Rüçhan Hakkı Pazarı<\/b> açılır.<\/li>\n<\/ul>\n<h4>Kitaptaki örnek takvim (ABC A.Ş., %200 bedelli, 100 milyondan 300 milyon TL'ye)<\/h4>\n<table>\n<tr><th>Adım<\/th><th>Tarih<\/th><th>Açıklama<\/th><\/tr>\n<tr><td>Payı elde bulundurma<\/td><td>23.07.2025<\/td><td>T+2 nedeniyle kayıt tarihinden 2 iş günü önceki kapanış<\/td><\/tr>\n<tr><td>Rüçhan başlangıcı<\/td><td>24.07.2025<\/td><td>MKK hesaplara <b>.R<\/b> uzantılı kuponları (ABC.R) tanımlar<\/td><\/tr>\n<tr><td>Kayıt tarihi<\/td><td>25.07.2025<\/td><td>Hak sahipleri MKK'da kesinleşir<\/td><\/tr>\n<tr><td>Ödeme tarihi<\/td><td>28.07.2025<\/td><td>Yeni payların hesaplara aktarılmaya başlaması<\/td><\/tr>\n<tr><td>Rüçhan pazarı<\/td><td>24.07–01.08.2025<\/td><td>Hakların borsada alınıp satıldığı dönem<\/td><\/tr>\n<tr><td>Rüçhan bitişi<\/td><td>07.08.2025<\/td><td>Bu tarihe kadar bedel yatırılarak katılım sürer<\/td><\/tr>\n<tr><td>Tasarruf sahiplerine satış<\/td><td>12–13.08.2025<\/td><td>Kalan 30 milyon TL nominal, birincil piyasada <b>.BE<\/b> sırasında<\/td><\/tr>\n<\/table>\n<ul>\n<li>%200 artırımda her 1 pay 2 yeni pay alma hakkı verir: 1.000 payı olan yatırımcı 2.000 TL yatırıp 2.000 yeni pay alır (kullanım fiyatı 1 TL).<\/li>\n<li><b>Rüçhan Hakkı Pazarı<\/b> genellikle kullanım süresinin ilk <b>5-7 iş günü<\/b> açıktır: Prosedüre göre pazarın son işlem günü kullanım süresi sonundan önceki <b>beşinci iş günüdür<\/b>. Pazar kapandıktan sonra hak satılamaz ama süre sonuna kadar bedel ödenerek kullanılabilir.<\/li>\n<li>Kullanılmayan haklar süre sonunda geçersizleşir; yatırımcının pay oranı azalır.<\/li>\n<\/ul>\n<h4>Teorik fiyat<\/h4>\n<ul>\n<li><b>Ft = (Fk + n₂ × R) / (1 + n₂)<\/b> ve <b>Fr = (Ft − R) × n₂<\/b>. Fk artırım öncesi son kapanış, n₂ bedelli oran (%200 için 2), R rüçhan kullanım fiyatı, Ft ana payın, Fr rüçhan hakkının teorik fiyatı.<\/li>\n<li>Kitap örneği: Fk 9 TL, n₂ = 2, R = 1 TL: Ft = 11 / 3 = 3,666 → fiyat adımına göre <b>3,67 TL<\/b>; Fr = 5,333 → <b>5,33 TL<\/b>. 100 pay: 367 + 533 ≈ 900 TL; toplam varlık teorik olarak korunur.<\/li>\n<li>Borsa, teorik fiyatı en yakın fiyat adımına yuvarlayıp referans fiyat olarak ilan eder. Fiyat düşüşü şirket değerinin azalması değil pay sayısının artmasıdır.<\/li>\n<\/ul>\n<h4>Yatırımcının üç seçeneği<\/h4>\n<ol>\n<li><b>Kullanmak<\/b>: pay başına kullanım fiyatını yatırır; tutar Takasbank aracılığıyla şirkete geçer, kuponlar silinip yerine yeni pay gelir; sahiplik oranı korunur.<\/li>\n<li><b>Satmak<\/b>: pazar açıkken Rüçhan Hakkı Pazarı'nda satıp nakde çevirir.<\/li>\n<li><b>Hiçbir şey yapmamak<\/b>: haklar süre sonunda MKK sisteminde iptal edilip değersizleşir; hakkın parasal değeri kadar kayıp ve pay oranında düşüş.<\/li>\n<\/ol>\n<h4>Tasarruf sahiplerine satış<\/h4>\n<ul>\n<li>Rüçhan sonrası kalan paylar için önce <b>tasarruf sahiplerine satış duyurusu<\/b> ilan edilir.<\/li>\n<li>Satış Tebliği: halka açık ortaklık artırımlarında kalan payların satışında <b>borsada satış yöntemi zorunludur<\/b>; satışa rüçhan kullanımının bitiminden itibaren <b>10 iş günü<\/b> içinde başlanır; paylar <b>nominal değerin altında satılamaz<\/b>; satılamayanlar iptal edilir ve sermaye buna göre tescil edilir.<\/li>\n<li>Borsada satış yöntemli halka arzların süresi <b>2 iş günü<\/b> ile sınırlıdır (SPK 08.07.2010 ve BİAŞ YK 16.07.2010 kararları). <b>.BE<\/b> uzantısı yalnız bu satış aşamasında geçici kullanılır; sonra paylar <b>.E<\/b> sırasına dahil olur.<\/li>\n<li>Borsa fiyatı nominalin üstündeyse kalan paylar primli satılır: örnekte 30 milyon pay 3,67 TL'den satılırsa (3,67 − 1) × 30.000.000 = <b>80.100.000 TL emisyon primi<\/b> şirkete girer.<\/li>\n<\/ul>\n<h4>Vergilendirme<\/h4>\n<ul>\n<li>Rüçhan hakkını <b>kullanmak<\/b> vergi doğurmaz. Hakkın borsada <b>satışı<\/b> menkul kıymet satış kazancıdır; <b>GVK geçici 67<\/b> kapsamında gerçek kişide stopaj <b>%0<\/b> ve nihai vergidir; beyan gerekmez. Yeni payların sonradan satışı da aynı kapsamdadır. Tüzel kişide kurum kazancına girer.<\/li>\n<li>%0 oranı <b>1 Ocak 2006<\/b>'dan itibaren iktisap edilen paylar ve bunlara dayalı haklar için geçerlidir; öncesinde iktisap edilenler dönemin mevzuatına göre beyanla vergilenir. Dikkat: <b>menkul kıymetler yatırım ortaklığı<\/b> paylarının satış kazancı <b>%10<\/b> tevkifata tabidir.<\/li>\n<\/ul>\n\n<h3>Bedelsiz sermaye artırımı<\/h3>\n<ul>\n<li>İç kaynaklarla artırım; ortaktan bedel alınmaz, şirkete nakit girmez; pasif hesaplardaki birikmiş tutarlar sermayeye aktarılır (muhasebesel işlem). Amaç: sermayeyi güçlendirmek, bilançoyu enflasyona karşı dengelemek, fiyatı düşürerek likiditeyi artırmak.<\/li>\n<li>Herkese oranlı yapıldığı için <b>mülkiyet oranı ve oy gücü değişmez<\/b>; pay adedi artarken birim kâr ve fiyat aynı oranda azalır.<\/li>\n<li>Kaynaklar: <b>iç kaynakların sermayeye eklenmesi<\/b> (geçmiş yıl kârları, olağanüstü yedekler, emisyon primi) ve <b>kâr payının pay olarak dağıtılması<\/b> (Kâr Payı Tebliği). İhraç Pay Tebliği'ne tabidir.<\/li>\n<li>İç kaynakların sermayeye eklenmesinde mevzuat sakıncası olmamalı ve tutarların <b>kanuni defterlerde karşılığı<\/b> bulunmalı. SPK mevzuatına göre tablolar ile kanuni kayıtlar arasında fark varsa <b>düşük olanı<\/b> esas alınır.<\/li>\n<li>Dikkat: payları borsada işlem gören ortaklıkların <b>dönem kârı hariç iç kaynak<\/b> artırım başvurularında, kararın açıklanmasından önceki <b>30 gün<\/b> ağırlıklı ortalama fiyat ortalamasıyla hesaplanan <b>düzeltilmiş fiyat 2 TL'nin altına düşecekse<\/b> başvuru işleme alınmaz. Kaynaklarda dönem kârı da varsa hesaplamada dönem kârının etkisi dikkate alınmaz.<\/li>\n<li><b>Sermayeye eklenemeyenler<\/b>: gerçeğe uygun değere taşımadan doğan <b>değer artış fonları<\/b> ve benzerleri; <b>ara dönem kârları<\/b>; mevzuatın izin vermediği fon ve yedekler.<\/li>\n<li>Önce <b>geçmiş yıl zararları<\/b> iç kaynaklardan mahsupla kapatılmalı veya genel kurulda kapatılacağına dair YK kararı Kurula sunulmalıdır.<\/li>\n<\/ul>\n<h4>Takvim ve teorik fiyat (kitap örneği: XYZ A.Ş., %400, 100 milyondan 500 milyon TL'ye)<\/h4>\n<table>\n<tr><th>Tarih<\/th><th>Anlamı<\/th><\/tr>\n<tr><td>05.08.2025 Salı<\/td><td>Payı seans kapanışında elde bulunduran hak sahibi olur (kayıt tarihinden 2 iş günü önce)<\/td><\/tr>\n<tr><td>06.08.2025 Çarşamba: <b>bölünme günü<\/b><\/td><td>Fiyat teorik olarak düzeltilir; bu gün alan bedelsiz alamaz<\/td><\/tr>\n<tr><td>07.08.2025: <b>kayıt tarihi (T+1)<\/b><\/td><td>MKK'da hak sahipleri tespit edilir<\/td><\/tr>\n<tr><td>08.08.2025: <b>ödeme tarihi (T+2)<\/b><\/td><td>Yeni paylar hesaplara geçer<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Ft = Fk / (1 + n₁)<\/b> (n₁ bedelsiz oran, %400 için 4). Örnek: 50 / 5 = <b>10 TL<\/b>. 100 pay × 50 = 5.000 TL; sonra 500 pay × 10 = 5.000 TL.<\/li>\n<li>Vergi: bedelsiz pay edinmek gelir sayılmaz, gerçek veya tüzel kişi için vergi doğmaz. Sonradan satışta GVK geçici 67 kapsamında gerçek kişide %0 stopaj (MKYO payları %10).<\/li>\n<\/ul>\n\n<h3>Sermaye azaltımı<\/h3>\n<table>\n<tr><th><\/th><th>Fon çıkışı gerektiren<\/th><th>Fon çıkışı gerektirmeyen<\/th><\/tr>\n<tr><td>Amaç<\/td><td>Fazla sermayeyi ortaklara iade<\/td><td>Zaten fiilen azalmış sermayeyi kayıtlara yansıtma<\/td><\/tr>\n<tr><td>Ortağa ödeme<\/td><td>Var; şirket malvarlığı fiilen azalır<\/td><td>Yok<\/td><\/tr>\n<tr><td>Dayanak<\/td><td>TTK genel hükümleri (SPK mevzuatında özel hüküm yok; toplantı ve karar nisapları için SPKn uygulanır)<\/td><td><b>Pay Tebliği<\/b>'nde özel düzenleme<\/td><\/tr>\n<tr><td>Alacaklıyı koruma prosedürü<\/td><td>TTK prosedürleri uygulanır<\/td><td>Uygulanmaz<\/td><\/tr>\n<\/table>\n<h4>Bilanço açığını kapatmak için azaltım (Pay Tebliği m.19)<\/h4>\n<ul>\n<li>Şart: paylar borsada <b>nominal değerin altında<\/b> işlem görmeli ve azaltım <b>münhasıran bilanço açığını<\/b> (geçmiş yıl ve dönem zararları toplamı) kapatmak için yapılmalı. Nominalin üstünde işlem görenler için özel düzenleme yoktur; TTK ve niteliğine uygun SPK mevzuatı uygulanır.<\/li>\n<li>Azaltım tutarı, işlem sonrası <b>düzeltilmiş borsa fiyatı nominal değerin %20'sini aşmayacak<\/b> şekilde belirlenir: nominal 1 TL ise düzeltilmiş fiyat teorik olarak <b>1,20 TL'yi geçmemeli<\/b>. Amaç fiyatı nominalin üstüne çıkarıp nakit artırımı mümkün kılmak.<\/li>\n<li>Bilanço açığı yoksa veya azaltım açıktan fazlaysa fazlalık için azaltımla <b>eş zamanlı sermaye artırımı<\/b> kararı gerekir. Azaltımla eş anlı veya izleyen <b>iki yıl<\/b> içindeki artırımlarda talepten önce <b>risk bildirim formu<\/b> imzalatılır.<\/li>\n<li>Bilanço açığı varken elde edilen kâr (açıktan fazla değilse) dağıtılamaz, yalnız birikmiş zararı kapatır. TTK, esas sermayenin <b>üçte ikisi<\/b> kaybedilirse şirketi artırıma, yapmayacaksa azaltıma zorlar.<\/li>\n<li>Diğer alan: <b>geri alınan payların itfası<\/b>; II-22.1'deki sürelerde satılamayan paylar azaltımla itfa edilmek zorundadır; nakit çıkışı geri alımda olduğu için itfada ek çıkış yoktur.<\/li>\n<li>YK'nın azaltım nedenlerini, esaslarını, malvarlığında eksilme olmayacağını ve faydalarını açıklayan raporu en geç genel kurul gündemiyle duyurulur, merkezde incelemeye hazır tutulur ve <b>genel kurulca onaylanır<\/b>.<\/li>\n<li>Fon çıkışı gerektirmeyen azaltım yalnız <b>pay sayısı azaltılarak<\/b> yapılır; Borsa fiyatı düzelterek toplam piyasa değerini korur. Teorik fiyat = Fk / (1 − azaltım oranı).<\/li>\n<li>Kitap örneği: 100 milyon pay, fiyat 0,80 TL, %30 azaltım: 0,80 / 0,70 = <b>1,14 TL<\/b>; 1.000 pay 700'e iner; 800 TL ≈ 700 × 1,14.<\/li>\n<\/ul>\n\n<h3>Pay geri alım programları (II-22.1)<\/h3>\n<ul>\n<li>Şirket kendi payını kasasındaki parayla Borsa'dan alır (nakit çıkışı). Amaçlar: fiyata destek, güven, HBK'yı yükseltme, çalışan pay programları için stok.<\/li>\n<li>Program <b>YK<\/b> tarafından hazırlanır, <b>genel kurul onayına<\/b> sunulur: amaç, azami pay sayısı, azami fon, süre, finansman kaynağı. Süre uygulamada genellikle <b>1-3 yıl<\/b>.<\/li>\n<li>Dikkat: <b>yakın ve ciddi kayıptan kaçınmak<\/b> için YK genel kurul kararı olmadan geri alım başlatabilir. Yakın ve ciddi kayıp: YK karar tarihinden önceki <b>son bir ayda<\/b> günlük ağırlıklı ortalama fiyatın <b>nominal değerin altında<\/b> seyretmesi veya <b>%20'nin üzerinde<\/b> değer kaybetmesi. Bunlar dışında YK kararıyla geri alım için önceden <b>Kurul onayı<\/b> gerekir.<\/li>\n<li>Program genel kuruldan <b>en az üç hafta önce<\/b> kamuya duyurulur. İşlemlere başlamadan <b>iki iş günü önce<\/b> dönem, nominal tutar ve sermayeye oran açıklanır. Her işlem, işlem gününü izleyen iş günü <b>seans başlamadan önce<\/b> açıklanır; geri alınan payların satışı da aynı şekilde.<\/li>\n<li>Program sürerken yönetim kontrolü sahipleri ve idari sorumluluğu olanların borsada ortaklık paylarını satması <b>yasaktır<\/b>.<\/li>\n<li>Emir verilemeyen zamanlar: <b>birinci seansın açılış seansı ve son 15 dakikası<\/b>, <b>ikinci seansın açılış ve kapanış seansları<\/b>. Alım fiyatı son işlem fiyatından veya en iyi satış teklifinden yüksek olamaz. Günlük alım, son <b>20 günlük ortalama işlem hacminin %25<\/b>'ini geçemez.<\/li>\n<li>Geri alınan payların nominali sermayenin <b>%10<\/b>'unu aşamaz (SPK oynak dönemlerde sınırları geçici askıya alabilmektedir).<\/li>\n<li>Geri alınan paylar \"pasif\"tir: genel kurul toplantı nisabında dikkate alınmaz. Bu bölümün ifadesiyle kâr payı ve rüçhan hariç hiçbir hak vermez; Tebliğ m.18 ise kâr payı ve bedelsiz hakların saklı olduğunu, rüçhan haklarının kullanılamayıp satılması gerektiğini söyler. %10 sınırına uyulursa süresiz tutulabilir, borsada satılabilir veya itfa edilebilir.<\/li>\n<li>Aşırı geri alım nakdi zayıflatıp yatırım imkânlarını sınırlayabilir.<\/li>\n<\/ul>\n\n<h3>Pay alım teklifi ve diğer çıkış hakları<\/h3>\n<table>\n<tr><th>Mekanizma<\/th><th>Tetikleyici<\/th><th>Muhatap<\/th><th>Fiyat<\/th><th>Yatırımcının yapması gereken<\/th><\/tr>\n<tr><td><b>Zorunlu pay alım teklifi<\/b> (II-26.1)<\/td><td>Tek başına veya birlikte hareketle oy haklarının <b>%50'sinden fazlası<\/b> veya YK üye çoğunluğunu seçme hakkının elde edilmesi<\/td><td><b>Yeni hakim ortak<\/b><\/td><td>Kontrolden önceki <b>6 ayda ödenen en yüksek bedel<\/b> ile açıklamadan önceki <b>6 aylık<\/b> günlük düzeltilmiş ağırlıklı ortalama borsa fiyatlarının aritmetik ortalamasından aşağı olamaz; Kurul değerleme raporu isteyebilir<\/td><td>Pasif: açıklama tarihinde pay sahibi olmak; teklif döneminde aracı kurumla talimat vermek<\/td><\/tr>\n<tr><td><b>Ayrılma hakkı<\/b> (II-23.3)<\/td><td>Önemli nitelikteki işlem: birleşme, bölünme, tür değiştirme, malvarlığının önemli kısmının devri veya sınırlı ayni hak, faaliyet konusunun tamamen değişmesi, imtiyaz tesisi veya değişikliği<\/td><td><b>Şirketin kendisi<\/b><\/td><td>Açıklamadan önceki dönem: <b>Yıldız Pazar 1 ay<\/b>, diğer pazarlar <b>6 ay<\/b> ortalama fiyat<\/td><td>Açıklama tarihinde pay sahibi olmak, genel kurula katılıp <b>olumsuz oy<\/b> vermek ve <b>muhalefeti tutanağa<\/b> geçirtmek<\/td><\/tr>\n<tr><td><b>Satma / ortaklıktan çıkarma<\/b> (II-27.3)<\/td><td>Hakim ortağın oy haklarının <b>en az %98'ine<\/b> ulaşması<\/td><td><b>Hakim ortak<\/b><\/td><td>Yüksek olanı: pazara göre ortalama borsa fiyatı ile değerleme raporu bedelinin aritmetik ortalaması; eş zamanlı kontrol değişikliği varsa zorunlu teklif fiyatı<\/td><td>Değerleme raporu özetinin açıklanmasını izleyen günden itibaren <b>2 ay<\/b> içinde şirkete <b>yazılı talep<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Zorunlu teklif süreci<\/b>: genellikle kontrol değişikliğini izleyen <b>6 iş günü<\/b> içinde SPK'ya başvuru, <b>2 ay<\/b> içinde çağrıya başlama, <b>10-20 iş günü<\/b> kabul dönemi. Gönüllü pay alım teklifi de mümkündür.<\/li>\n<li>Yükümlülük yerine getirilmez veya gecikirse hakim ortak gecikilen günler için <b>faiz<\/b> öder ve paylarının <b>oy hakları kendiliğinden donar<\/b>. Finansal yeniden yapılandırma, miras gibi özel durumlarda Kurul <b>muafiyet<\/b> tanıyabilir.<\/li>\n<li><b>Ayrılma süreci<\/b>: genel kuruldan <b>en geç 6 iş günü<\/b> sonra başlar, başladıktan sonraki <b>10 iş günü<\/b> içinde tamamlanır. Sonradan pay alanlar yararlanamaz. Toplantıya katılımı haksız engellenen için muhalefet şerhi aranmaz. Kâr payı imtiyazı yaratılması gibi işlemden belirli kişiler doğrudan yararlanıyorsa bedeli bu kişiler öder. SPK özel hâllerde şirketi muaf tutabilir.<\/li>\n<li><b>Satma hakkı<\/b>: hem çıkarma hem satma hakkı eş zamanlı doğar; hakim ortak %98'e açıklama yapar, ortaklık değerleme raporu hazırlatıp özetini açıklar. Genel kurula katılma veya şerh gerekmez. %98'e <b>pay alım teklifi sonucunda<\/b> ulaşılmışsa ayrıca yeni çağrı yükümlülüğü doğmaz. Hakim ortak bedelleri ortaklık hesabına yatırır.<\/li>\n<li>Ortak amaç: azınlığı iradesi dışındaki ortaklık yapısında tutmamak.<\/li>\n<\/ul>", "sorular": [{"q": "Önceki kapanış fiyatı 84,00 TL olan bir pay için hisse başına brüt 3,20 TL nakit temettü dağıtılacaktır. Stopaj oranı %15'tir. Hak kullanım sabahı teorik fiyat ve hisse başına net temettü hangisidir?", "o": ["81,28 TL; 2,72 TL", "80,80 TL; 3,20 TL", "80,80 TL; 0,48 TL", "86,72 TL; 2,72 TL", "80,80 TL; 2,72 TL"], "a": 4, "e": "Ft = Fk − brüt temettü = 84,00 − 3,20 = 80,80 TL. Net = 3,20 × (1 − 0,15) = 2,72 TL. Fiyat düzeltmesi brüt tutarla yapılır."}, {"q": "Genel kurul hisse başına brüt 8 TL temettünün iki eşit taksitte ödenmesine karar vermiştir. Birinci taksitin hak kullanım tarihinden önceki kapanış 100 TL ise Borsa'nın o günkü teorik fiyatı kaç TL'dir?", "o": ["92", "100", "96", "93,20", "98"], "a": 2, "e": "Taksitli dağıtımda her taksit için ayrı hak kullanım tarihi vardır ve düzeltme o taksitin brüt tutarı kadar yapılır: 100 − 4 = 96 TL."}, {"q": "Nakit kâr payında hak sahipliğine ilişkin hangisi doğrudur?", "o": ["Pay, kayıt tarihinde satın alınırsa temettü hakkı doğar", "Fiyat düzeltmesi ödeme tarihinde yapılır", "Pay, hak kullanım tarihinden bir önceki iş günü kapanışında portföyde bulunmalıdır; kayıt tarihi hak kullanım tarihini izleyen ilk iş günüdür", "Kayıt tarihi hak kullanım tarihinden iki iş günü öncedir", "Pay, ödeme tarihinde portföyde bulunmalıdır"], "a": 2, "e": "Hak kullanım günü pay temettüsüz işlem görür ve fiyat düzeltilir; MKK hak sahiplerini izleyen ilk iş günü olan kayıt tarihinde kesinleştirir."}, {"q": "Kâr Payı Tebliği ve kitaptaki açıklamalara göre hangisi yanlıştır?", "o": ["Payları borsada işlem görmeyen ortaklıklar kâr payını taksitle dağıtabilir", "Kâr payı dağıtım kararını yalnız genel kurul alabilir", "Esas sözleşmede hüküm ve genel kurul yetkisi varsa YK kararıyla kâr payı avansı dağıtılabilir", "Dağıtım kararı alınmışsa dağıtıma en geç hesap dönemi sonuna kadar başlanır", "Tahsil edilmeyen kâr payları 5 yıl sonra zamanaşımına uğrayıp Hazine'ye geçer"], "a": 0, "e": "Payları borsada işlem görmeyen ortaklıklar taksitle kâr dağıtımından yararlanamaz."}, {"q": "Tam mükellef gerçek kişinin aldığı kâr payının vergilendirilmesine ilişkin hangisi doğrudur?", "o": ["Kâr payının tamamı istisnadır, stopaj yapılmaz", "Stopaj net tutar üzerinden hesaplanır", "Kalan kısım beyan haddini aşmasa da beyanname verilmesi zorunludur", "Kâr payının %50'si istisnadır; kalan kısım beyan haddini aşarsa beyan edilir ve %15 stopaj mahsup edilir", "Stopaj oranı %10 olup her durumda nihai vergidir"], "a": 3, "e": "GVK'ya göre kâr payının yarısı istisnadır. Kalan yarı beyan haddini aşarsa beyannameye girer ve stopaj mahsup edilir; aşmazsa %15 stopaj nihai vergi olur."}, {"q": "Artırım öncesi kapanış fiyatı 12 TL olan bir payda %100 bedelli sermaye artırımı yapılacak, rüçhan kullanım fiyatı 1 TL'dir. Ana payın ve rüçhan hakkının teorik fiyatları hangisidir?", "o": ["6,00 TL; 5,00 TL", "6,50 TL; 5,50 TL", "6,50 TL; 11,00 TL", "13,00 TL; 12,00 TL", "5,50 TL; 6,50 TL"], "a": 1, "e": "Ft = (Fk + n₂ × R) / (1 + n₂) = (12 + 1) / 2 = 6,50 TL. Fr = (Ft − R) × n₂ = (6,50 − 1) × 1 = 5,50 TL."}, {"q": "Kapanış fiyatı 15 TL olan bir payda %50 bedelli sermaye artırımı yapılacak, kullanım fiyatı 1 TL'dir. Ana payın teorik fiyatı (fiyat adımına yuvarlanmış) yaklaşık kaç TL'dir?", "o": ["10,00", "7,50", "15,50", "8,00", "10,33"], "a": 4, "e": "n₂ = 0,5: Ft = (15 + 0,5 × 1) / 1,5 = 15,5 / 1,5 = 10,333 → 10,33 TL. Rüçhan hakkı teorik fiyatı (10,333 − 1) × 0,5 ≈ 4,67 TL olur."}, {"q": "Payları borsada işlem gören ortaklıklarda bedelli artırımda rüçhan hakkı kullanım süresi ve başlangıcına ilişkin hangisi doğrudur?", "o": ["Süre 15 günden az, 60 günden fazla olamaz; kullanım izahnamenin ilanını izleyen 10 gün içinde başlatılır", "Süre 10 günden az, 30 günden fazla olamaz; kullanım ilanı izleyen 15 gün içinde başlar", "Süre en fazla 15 gündür; kullanım ilan günü başlar", "Süre 30 ile 90 gün arasıdır; kullanım 2 iş günü içinde başlar", "Süre serbestçe belirlenir; başlangıç için süre sınırı yoktur"], "a": 0, "e": "Pay Tebliği'ne göre süre 15-60 gündür, uygulamada genellikle 15 gün; kullanım ilanı izleyen on gün içinde başlatılmalıdır."}, {"q": "Rüçhan Hakkı Pazarı'na ilişkin hangisi doğrudur?", "o": ["Pazar, rüçhan kullanım süresinin tamamı boyunca açıktır", "Pazar kapandığında kullanılmayan haklar derhal iptal edilir", "Pazarın son işlem günü kullanım süresi sonundan önceki beşinci iş günüdür; pazar kapansa da hak süre sonuna kadar kullanılabilir", "Pazar, kullanım süresi bittikten sonra açılır", "Haklar yalnız borsa dışında devredilebilir"], "a": 2, "e": "Prosedüre göre pazarın kapanış günü süre sonundan önceki beşinci iş günüdür; bu yüzden pazar genellikle ilk 5-7 iş günü açıktır. Sonrasında satış yapılamaz ama bedel ödenerek kullanım sürer."}, {"q": "Halka açık ortaklığın bedelli artırımında rüçhan sonrası kalan payların satışına ilişkin hangisi yanlıştır?", "o": ["Satıştan önce tasarruf sahiplerine satış duyurusu ilan edilir", "Satışta borsada satış yöntemi zorunludur", "Satışa rüçhan kullanımının bitiminden itibaren 10 iş günü içinde başlanır", "Satılamayan paylar iptal edilir ve sermaye buna göre tescil edilir", "Kalan paylar borsa dışında yetkili kuruluşun belirlediği fiyattan nominal değerin altında da satılabilir"], "a": 4, "e": "Kalan paylar borsa birincil piyasasında satılır ve nominal değerin altında satılamaz."}, {"q": "Rüçhan sonrası kalan 20 milyon TL nominal değerli paylar Borsa İstanbul birincil piyasasında 4,25 TL'den satılmıştır (nominal değer 1 TL). Şirkete girecek emisyon primi kaç TL'dir?", "o": ["85 milyon", "65 milyon", "20 milyon", "61,75 milyon", "45 milyon"], "a": 1, "e": "Pay başı prim = 4,25 − 1 = 3,25 TL; 3,25 × 20 milyon = 65 milyon TL. 85 milyon toplam satış hasılatıdır."}, {"q": "Bir gerçek kişinin bedelli artırımda elde ettiği rüçhan hakkını Borsa İstanbul'da satmasından doğan kazancın vergilendirilmesi hangisidir? (Pay 2006 sonrasında edinilmiştir, MKYO payı değildir.)", "o": ["%15 stopaj; beyan haddini aşarsa beyan edilir", "%10 stopaj; yıllık beyanname zorunludur", "Kazancın %50'si istisna, kalanı beyan edilir", "GVK geçici 67 kapsamında %0 stopaj; stopaj nihai vergidir, beyan gerekmez", "Rüçhan hakkı satışı vergi kapsamı dışındadır ve kayıt dahi tutulmaz"], "a": 3, "e": "Rüçhan satışı menkul kıymet satış kazancıdır; geçici 67 kapsamında gerçek kişide %0 stopaj uygulanır. MKYO paylarında oran %10'dur. Rüçhanı kullanmak ise vergi doğurmaz."}, {"q": "Kapanış fiyatı 60 TL olan payda %200 bedelsiz sermaye artırımı yapılmıştır. Elinde 300 pay bulunan yatırımcının artırım sonrası pay sayısı ve teorik fiyat hangisidir?", "o": ["600 pay; 30 TL", "900 pay; 20 TL", "900 pay; 30 TL", "500 pay; 20 TL", "1.200 pay; 15 TL"], "a": 1, "e": "Ft = Fk / (1 + n₁) = 60 / 3 = 20 TL. Yeni pay = 300 × 2 = 600; toplam 900. Değer 18.000 TL olarak korunur."}, {"q": "Payları borsada işlem gören bir ortaklık, dönem kârı hariç iç kaynaklardan %400 bedelsiz artırım için başvuracaktır. Kararın açıklanmasından önceki 30 günün ağırlıklı ortalama fiyat ortalaması 9 TL'dir. Başvuru hakkında hangisi doğrudur?", "o": ["Düzeltilmiş fiyat 2,25 TL olacağından başvuru işleme alınır", "Düzeltilmiş fiyat 1,80 TL'dir ancak bu sınır yalnız kâr payı artırımlarında uygulanır", "Düzeltilmiş fiyat 1,80 TL olsa da Yıldız Pazar'daki şirketlerde başvuru işleme alınır", "Düzeltilmiş fiyat 1,80 TL olacağından başvuru Kurulca işleme alınmaz", "Düzeltilmiş fiyat 4,50 TL olacağından sorun yoktur"], "a": 3, "e": "9 / (1 + 4) = 1,80 TL. Düzeltilmiş borsa fiyatını 2 TL'nin altına düşürecek iç kaynak artırım başvuruları işleme alınmaz."}, {"q": "Bedelsiz sermaye artırımında aşağıdakilerden hangisi sermayeye eklenebilir?", "o": ["Olağanüstü yedek akçeler", "Varlıkların gerçeğe uygun değere taşınmasından doğan değer artış fonları", "Ara dönemde oluşan dönem kârları", "Mevzuatın sermayeye eklenmesine izin vermediği yedekler", "Kanuni defterlerde karşılığı bulunmayan iç kaynaklar"], "a": 0, "e": "Geçmiş yıl kârları, olağanüstü yedekler ve emisyon primi eklenebilir; değer artış fonları ve ara dönem kârları eklenemez; kanuni kayıtlarda karşılık şarttır."}, {"q": "Borsada 0,80 TL'den işlem gören, nominal değeri 1 TL olan paylarda bilanço açığını kapatmak için %20 oranında fon çıkışı gerektirmeyen sermaye azaltımı yapılmıştır. Elinde 2.000 pay bulunan yatırımcının yeni pay sayısı ve teorik fiyat hangisidir?", "o": ["1.600 pay; 0,96 TL", "2.000 pay; 1,00 TL", "1.600 pay; 0,64 TL", "2.400 pay; 0,67 TL", "1.600 pay; 1,00 TL"], "a": 4, "e": "Teorik fiyat = 0,80 / (1 − 0,20) = 1,00 TL; pay sayısı 2.000 × 0,80 = 1.600. Değer 1.600 TL olarak korunur."}, {"q": "Nominal değeri 1 TL olan paylar borsada 0,60 TL'den işlem görmektedir. Bilanço açığını kapatmak için yapılacak fon çıkışı gerektirmeyen azaltımda, düzeltilmiş fiyatın nominal değeri %20'den fazla aşmaması kuralına göre uygulanabilecek en yüksek azaltım oranı hangisidir?", "o": ["%40", "%20", "%50", "%60", "%30"], "a": 2, "e": "Sınır fiyat 1,20 TL'dir. 0,60 / (1 − x) ≤ 1,20 ise 1 − x ≥ 0,50, yani x ≤ %50. %60 oranında fiyat 1,50 TL olurdu."}, {"q": "Fon çıkışı gerektirmeyen sermaye azaltımına ilişkin hangisi yanlıştır?", "o": ["Yalnız pay sayısı azaltılarak yapılır", "Bilanço açığı yoksa fazlalık için eş zamanlı sermaye artırımı kararı gerekir", "Alacaklıları korumaya yönelik TTK prosedürleri uygulanır ve ortaklara nakit ödeme yapılır", "Eş anlı veya izleyen iki yıl içindeki artırımlarda risk bildirim formu imzalatılır", "Geri alınan payların itfasında da kullanılır"], "a": 2, "e": "Fon çıkışı olmadığı için ortağa ödeme yapılmaz ve TTK'daki alacaklıyı koruma prosedürleri uygulanmaz."}, {"q": "Sermayesi 250.000.000 TL olan bir şirketin geri alabileceği payların azami nominal değeri ile son 20 günlük ortalama işlem hacmi 4.000.000 pay ise bir günde alabileceği azami miktar hangisidir?", "o": ["25.000.000 TL nominal; 1.000.000 pay", "25.000.000 TL nominal; 400.000 pay", "50.000.000 TL nominal; 1.000.000 pay", "12.500.000 TL nominal; 2.000.000 pay", "25.000.000 TL nominal; 4.000.000 pay"], "a": 0, "e": "Geri alınan payların nominali sermayenin %10'unu aşamaz: 25 milyon TL. Günlük alım son 20 günlük ortalama hacmin %25'ini geçemez: 4.000.000 × %25 = 1.000.000 pay."}, {"q": "Geri Alınan Paylar Tebliği'ne göre YK'nın genel kurul kararı olmadan, Kurul onayı da almadan geri alım yapabilmesini sağlayan yakın ve ciddi kayıp hâli hangisidir?", "o": ["Son bir haftada fiyatın %10 düşmesi", "Son üç ayda işlem hacminin yarıya inmesi", "Son bir yılda fiyatın %50 düşmesi", "Karardan önceki son bir ayda günlük ağırlıklı ortalama fiyatın nominal değerin altında seyretmesi veya %20'nin üzerinde değer kaybetmesi", "Son bir ayda fiyatın %5 düşmesi"], "a": 3, "e": "Bu iki hâlde yakın ve ciddi kayıp kabul edilir; diğer durumlarda YK kararıyla geri alım için önceden Kurul onayı gerekir."}, {"q": "Geri alım programı kapsamında aşağıdakilerden hangisi yapılabilir?", "o": ["Birinci seansın açılış seansında alım emri vermek", "Sürekli işlem bölümünde, son işlem fiyatını aşmayan bir fiyattan alım emri vermek", "Birinci seansın son 15 dakikasında alım yapmak", "En iyi satış teklifinden daha yüksek fiyattan alım emri vermek", "Program sürerken yönetim kontrolü sahibinin borsada pay satması"], "a": 1, "e": "Açılış seansı, birinci seansın son 15 dakikası ve ikinci seansın açılış ve kapanış seanslarında emir verilemez; fiyat son işlem veya en iyi satış fiyatını aşamaz; program boyunca kontrol sahipleri satış yapamaz."}, {"q": "Bir yatırımcı halka açık bir şirketin oy haklarının %55'ini satın almıştır. Kontrolden önceki altı ayda paylara ödediği en yüksek bedel 30,00 TL, son altı aylık günlük düzeltilmiş ağırlıklı ortalama fiyatların ortalaması 27,50 TL'dir. Zorunlu pay alım teklifi fiyatı en az kaç TL olmalıdır?", "o": ["27,50", "28,75", "57,50", "33,00", "30,00"], "a": 4, "e": "Teklif fiyatı, ödenen en yüksek bedel ile 6 aylık ortalama borsa fiyatının altına inemez; yüksek olan 30,00 TL'dir."}, {"q": "Zorunlu pay alım teklifine ilişkin hangisi yanlıştır?", "o": ["Teklifin muhatabı, yani payları satın alan taraf şirketin kendisidir", "Oy haklarının %50'sinden fazlasının elde edilmesiyle doğar", "YK üyelerinin çoğunluğunu seçme hakkının elde edilmesiyle de doğar", "Yükümlülük gecikirse faiz ödenir ve hakim ortağın oy hakları kendiliğinden donar", "Miras gibi özel durumlarda Kurul muafiyet tanıyabilir"], "a": 0, "e": "Zorunlu teklifte muhatap yeni hakim ortaktır; ayrılma hakkında muhatap şirkettir."}, {"q": "Ana Pazar'da işlem gören bir şirket faaliyet konusunu tamamen değiştirmeye karar vermiştir. Ayrılma hakkına ilişkin hangisi doğrudur?", "o": ["Fiyat, açıklamadan önceki 1 aylık ortalama fiyata göre belirlenir; genel kurula katılmak gerekmez", "Karar açıklandıktan sonra pay alanlar da yararlanır", "Fiyat, açıklamadan önceki 6 aylık ortalama fiyatlara göre belirlenir; olumsuz oy ve muhalefet şerhi gerekir", "Payları satın alma yükümlülüğü yeni hakim ortaktadır", "Süreç genel kuruldan 30 iş günü sonra başlar"], "a": 2, "e": "Yıldız Pazar'da 1 aylık, diğer pazarlarda 6 aylık ortalama esas alınır. Açıklama tarihinde pay sahibi olmak, olumsuz oy ve tutanağa muhalefet şarttır; muhatap şirkettir; süreç en geç 6 iş günü sonra başlar."}, {"q": "Hakim ortağın oy haklarının %98'ine ulaşmasıyla doğan satma hakkına ilişkin hangisi doğrudur?", "o": ["Azınlığın genel kurula katılıp muhalefet şerhi koyması şarttır", "Hak düşürücü süre genel kurul tarihinden itibaren 6 iş günüdür", "Fiyat yalnız son 1 aylık borsa fiyatıdır", "%98'e pay alım teklifiyle ulaşılmışsa ayrıca yeni çağrı yükümlülüğü doğar", "Azınlık, değerleme raporu özetinin açıklanmasını izleyen günden başlayan 2 aylık hak düşürücü sürede şirkete yazılı talep iletir"], "a": 4, "e": "Satma hakkı bildirime dayalıdır; genel kurul veya şerh gerekmez. Fiyat ortalama borsa fiyatı ile değerleme bedelinin ortalaması veya eş zamanlı kontrol değişikliğinde zorunlu teklif fiyatından yüksek olanıdır. Teklif sonucu ulaşılmışsa yeni çağrı gerekmez."}]}, {"id": 5, "kisa": "Piyasa İşleyiş Kuralları", "baslik": "Piyasa İşleyiş Kuralları: Pazarlar, Seanslar, Emirler, Devre Kesiciler, Açığa Satış ve Brüt Takas", "ozet": "Pazar kriterleri ve işlem esasları, baz fiyat, fiyat adımları ve sınırları, seans saatleri, tek fiyat ve açılış algoritması, devre kesiciler, emir tipleri, kredili işlem, açığa satış ve brüt takas.", "notlar": "<h3>Pazarlar<\/h3>\n<ul>\n<li>Pay piyasası pazarları: <b>Yıldız Pazar, Ana Pazar, Alt Pazar, Yakın İzleme Pazarı (YİP), Piyasa Öncesi İşlem Platformu (PÖİP), Yapılandırılmış Ürünler ve Fon Pazarı (YÜFP), Girişim Sermayesi Pazarı (GSP), Emtia Pazarı<\/b>.<\/li>\n<li>İlk defa kota alınan paylar <b>Yıldız, Ana, Alt Pazar veya GSP<\/b>'de işlem görebilir. Nitelikli yatırımcılara satılan paylar GSP'de işlem görür.<\/li>\n<li>Yıldız, Ana ve Alt Pazar benzer <b>büyüklük, derinlik ve likidite<\/b>ye göre gruplanır. Yıldız: FDPD, piyasa değeri ve hacmi yüksek büyük şirketler; Ana: daha düşük ama belirli büyüklükte; Alt: Yıldız veya Ana kriterlerini karşılamayan ama kotasyon şartlarını sağlayanlar.<\/li>\n<\/ul>\n<table>\n<tr><th>Kriter<\/th><th>Yıldız Pazar<\/th><th>Ana Pazar<\/th><\/tr>\n<tr><td>Piyasa değeri (PD)<\/td><td>6 milyar TL'den büyük<\/td><td>1 milyar TL'den büyük<\/td><\/tr>\n<tr><td>Fiili dolaşımdaki payların piyasa değeri (FDPD)<\/td><td>1 milyar TL'den büyük<\/td><td>400 milyon TL'den büyük<\/td><\/tr>\n<tr><td>Fiili dolaşım oranı (FDO)<\/td><td>%10'dan büyük<\/td><td>%10'dan büyük<\/td><\/tr>\n<tr><td>İmtiyaz<\/td><td>İmtiyaz varsa FDO %90'dan küçük<\/td><td>İmtiyaz varsa FDO %90'dan küçük<\/td><\/tr>\n<tr><td>Yerli fon<\/td><td>30 milyon TL'den büyük<\/td><td>Yok<\/td><\/tr>\n<tr><td>Likidite<\/td><td>0,15'ten küçük<\/td><td>0,5'ten küçük<\/td><\/tr>\n<tr><td>(*) Alternatif<\/td><td>FDO %5'ten büyük; FDPD 3 milyar TL'den büyük ve likidite 0,1'den küçük<\/td><td>FDO %5'ten büyük; temettü %10'dan büyük ve FDPD 450 milyon TL'den büyük veya FDPD 750 milyon TL'den büyük ve likidite 0,2'den küçük<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: her pay, sınıflandırıldığı pazarın <b>tüm kriterlerini<\/b> sağlamalıdır; istisnalar Pay Piyasası Prosedürü'ndedir. Alt Pazar için tabloda eşik yoktur.<\/li>\n<li><b>PD<\/b>: tüm sermaye üzerinden piyasa değeri. <b>FDPD<\/b>: dönem sonu FD pay adedi × bir yıllık düzeltilmiş kapanış fiyatları ortalaması. <b>Yerli fon<\/b>: MKK verilerine göre SPK denetimindeki yatırım ve emeklilik yatırım fonlarının portföyündeki kısmın son bir yıllık ortalama piyasa değeri. <b>Likidite<\/b>: 1 milyon TL işlem hacmiyle günlük ortalama fiyat değişim oranının mutlak değeri (küçük olması iyidir). <b>Temettü getirisi<\/b>: son 3 yıllık net nakit temettü toplamı / dönem sonu piyasa değeri × 100.<\/li>\n<li>Değerlendirme, endeks dönemleriyle uyumlu olarak <b>yılda en az iki kez<\/b>, verilerin <b>son bir yıllık ortalamaları<\/b> ile yapılır. Yeni işlem görmeye başlayanlar ilk <b>3 ay<\/b> içindeki değerlendirmelere dahil edilmez.<\/li>\n<\/ul>\n<h4>Yakın İzleme Pazarı (YİP)<\/h4>\n<ul>\n<li>Faaliyet ve mali yapısında olağandışı durum tespit edilen şirketlerin payları yatırımcıyı korumak için burada işlem görür (Kotasyon Yönergesi m.35).<\/li>\n<li>Başlıca nedenler: <b>son iki döneme<\/b> ait bağımsız denetim raporunda olumsuz görüş veya görüş bildirmekten kaçınma; faaliyetlerin makul sebep olmadan <b>3 aydan fazla<\/b> durması; <b>üst üste beş yıl<\/b> net dönem zararı; faaliyet için gerekli izin, lisans veya yetkinin iptali; özsermaye/sermaye oranının belirli oranların altına düşmesi; ticari olmayan ilişkili taraf alacaklarının toplam aktiflerin <b>%50<\/b>'sini aşması.<\/li>\n<li>YİP'e alma ve çıkarma <b>Borsa İstanbul Yönetim Kurulu<\/b> kararıyla olur; durum düzelinceye kadar orada işlem görür.<\/li>\n<\/ul>\n<h4>GSP ve PÖİP<\/h4>\n<ul>\n<li><b>GSP<\/b>: halka arz edilmeksizin nitelikli yatırımcılara satılmak üzere halka açık olmayan ortaklıkların artırımla ihraç ettiği paylar ve Borsa YK'nın uygun gördüğü diğer araçlar <b>yalnız nitelikli yatırımcılar<\/b> arasında işlem görür. YÜFP ve Emtia Pazarı'nda işlem görebilecek araçlardan nitelikliye ihraç edilenler de buradadır. Nitelikli yatırımcılar III-39.1 Tebliği'nde tanımlıdır. Üye, müşterisinin nitelikli olduğunu bilmek ve gerektiğinde belgelemek zorundadır; aksi hâlde hukuki ve maddi sorumluluk üyededir.<\/li>\n<li><b>PÖİP<\/b>: halka açık ortaklık statüsünde olup <b>payları Borsada işlem görmeyen<\/b> ortaklıkların payları için.<\/li>\n<\/ul>\n\n<h3>Pazarlarda işlem esasları (Tablo 2)<\/h3>\n<table>\n<tr><th>Esas<\/th><th>Yıldız<\/th><th>Ana<\/th><th>Alt<\/th><th>YİP<\/th><th>PÖİP<\/th><\/tr>\n<tr><td>İşlem yöntemi<\/td><td>Sürekli<\/td><td>Sürekli<\/td><td>Sürekli<\/td><td>5 kez tek fiyat<\/td><td>5 kez tek fiyat<\/td><\/tr>\n<tr><td>Açığa satış ve kredili işlem<\/td><td>Var<\/td><td>Var<\/td><td>Yok<\/td><td>Yok<\/td><td>Yok<\/td><\/tr>\n<tr><td>Brüt takas<\/td><td>Yok<\/td><td>Yok<\/td><td>Var<\/td><td>Var<\/td><td>Var<\/td><\/tr>\n<tr><td>Özkaynak oranı<\/td><td>%90<\/td><td>%75<\/td><td>%0<\/td><td>%0<\/td><td>%0<\/td><\/tr>\n<tr><td>Açık takas pozisyonu / özkaynak<\/td><td>%20<\/td><td>%50<\/td><td>%100<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>Fiyat marjı<\/td><td>%20<\/td><td>%15<\/td><td>%10<\/td><td>%10<\/td><td>%10<\/td><\/tr>\n<tr><td>Açığa satış yukarı adım kuralı<\/td><td>Yok<\/td><td>Var<\/td><td>-<\/td><td>-<\/td><td>-<\/td><\/tr>\n<tr><td>Devre kesici tetikleme oranı<\/td><td>%10<\/td><td>%7,5<\/td><td>%5<\/td><td>-<\/td><td>-<\/td><\/tr>\n<tr><td>Devre kesici sonrası emir toplama<\/td><td>5 dk<\/td><td>15 dk<\/td><td>15 dk<\/td><td>-<\/td><td>-<\/td><\/tr>\n<tr><td>Devre kesici sonrası eşleştirme<\/td><td>2 dk<\/td><td>2 dk<\/td><td>2 dk<\/td><td>-<\/td><td>-<\/td><\/tr>\n<tr><td>Tek fiyat emir toplamada bilgi yayını kısıtı<\/td><td>Yok<\/td><td>Yok<\/td><td>Var<\/td><td>Var<\/td><td>Var<\/td><\/tr>\n<tr><td>Açılış seansında piyasa ve piyasadan limite emir<\/td><td>Var<\/td><td>Var<\/td><td>Yok<\/td><td>Yok<\/td><td>Yok<\/td><\/tr>\n<\/table>\n<ul>\n<li>Tek fiyat sayısına açılış ve kapanış seansları dahil, kapanış fiyatından işlemler dahil değildir. Açılış seansının son 5 dakikasında emir iptali, kötüleştirme ve miktar azaltımı hiçbir pazarda yapılamaz.<\/li>\n<li>Teminatsız alım emri kabulüne ilişkin istisnalar yalnız <b>Yıldız Pazar<\/b>'daki paylarda; kolektif yatırım kuruluşları ve emeklilik fonları için Ana Pazar'da da uygulanabilir.<\/li>\n<li>Dikkat: BIST'in <b>2020/20<\/b> sayılı duyurusuyla 03.03.2020'den itibaren ikinci bir duyuruya kadar Yıldız ve Ana Pazar'da <b>fiyat marjı %10'a<\/b>, devre kesici tetikleme oranı <b>%5'e<\/b> düşürülmüş, devre kesici sonrası emir toplama <b>30 dakika<\/b> olarak belirlenmiştir. Kitabın devre kesici bölümünde ise emir toplama süresi genel olarak 10 dakika olarak anlatılır; kaynakta bu süreler arasında tutarsızlık vardır.<\/li>\n<\/ul>\n\n<h3>Alt Pazar, YİP ve PÖİP'te bilgilendirme<\/h3>\n<ul>\n<li>Yatırım kuruluşu bu pazarlarda <b>ilk işlem öncesinde<\/b> yatırımcıdan \"Bilgilendirme Metni\"ni okuyup anladığına dair <b>yazılı, sözlü veya elektronik<\/b> beyan alır; kayıt III-45.1 Belge ve Kayıt Düzeni Tebliği'ne tabidir.<\/li>\n<li>Sonrasında: internetten verilen <b>her alım emri öncesinde<\/b> metin yeniden sunulur; telefonla verilen alım emirlerinde metnin tamamını okumadan <b>hatırlatma<\/b> yapılır.<\/li>\n<li>Amaç: sığ ve düşük likiditeli pazarlarda sert fiyat dalgalanmasına karşı korumak; mümkün olduğunca <b>limit fiyatlı emir<\/b> kullanılması tavsiye edilir.<\/li>\n<\/ul>\n\n<h3>Temel kavramlar<\/h3>\n<ul>\n<li><b>Lot<\/b>: tüm pay ve yeni pay alma hakkı işlemlerinde <b>1,00 TL nominal = 1 adet = 1 lot<\/b>. Küsurat sıraları (.KE) dışında lottan küçük emir verilemez.<\/li>\n<li><b>Fiyat ilanı<\/b>: 1 TL nominal payın veya hakkın piyasa fiyatı; virgülden sonra <b>üç hane kuruş<\/b>. Fiyatlar seans sonunda Pay Piyasası Borsa Bülteni'nde ilan edilir; fiyat oluşmamışsa bu da ilan edilir.<\/li>\n<li><b>Baz fiyat<\/b>: seans boyunca fiyat sınırlarına esas fiyat; BISTECH'te <b>önceki işlem gününün kapanış fiyatı<\/b>. Baz fiyat yoksa: tek fiyatta ilk emir toplama sonrası eşleşme fiyatı; sürekli işlemde açılış fiyatı, o da yoksa ilk işlem fiyatı. <b>Yeni pay alma haklarında ilk gün baz fiyat uygulanmaz<\/b>, ilk günün kapanışı ertesi günün baz fiyatıdır. Gün içinde işlem olmazsa aynı baz fiyat ertesi gün de geçerlidir. Temettü, artırım, birleşme gibi durumlarda teorik fiyat en yakın fiyat adımına yuvarlanarak baz fiyat olur.<\/li>\n<li><b>Referans fiyat<\/b>: özsermaye hâllerinde hesaplanan, ancak fiyat limitlerine esas <b>olmayan<\/b>, tescile kadar yatırımcının referans aldığı fiyat.<\/li>\n<\/ul>\n<h4>Fiyat adımları<\/h4>\n<table>\n<tr><th>Fiyat seviyesi (TL)<\/th><th>Adım (TL)<\/th><\/tr>\n<tr><td>0,010 – 19,999<\/td><td>0,01<\/td><\/tr>\n<tr><td>20,000 – 49,999<\/td><td>0,02<\/td><\/tr>\n<tr><td>50,000 – 99,999<\/td><td>0,05<\/td><\/tr>\n<tr><td>100,000 – 249,999<\/td><td>0,10<\/td><\/tr>\n<tr><td>250,000 – 499,999<\/td><td>0,25<\/td><\/tr>\n<tr><td>500,000 – 999,999<\/td><td>0,50<\/td><\/tr>\n<tr><td>1000,000 – 2499,999<\/td><td>1,00<\/td><\/tr>\n<tr><td>2500 ve üzeri<\/td><td>2,50<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: adım <b>baz fiyata değil, emrin girildiği fiyat seviyesine<\/b> göre belirlenir. Baz 48,90 TL iken 49,98'e kadar 0,02, 50,00'dan sonra 0,05 adım uygulanır.<\/li>\n<\/ul>\n<h4>Fiyat değişim sınırları<\/h4>\n<ul>\n<li>Baz fiyattan: paylarda Yıldız <b>±%20<\/b>, Ana <b>±%15<\/b>, Alt, YİP ve PÖİP <b>±%10<\/b> (Tablo; 2020/20 duyurusu Yıldız ve Ana için %10); <b>yeni pay alma haklarında ±%50<\/b>.<\/li>\n<li>Yuvarlama aralığı <b>daraltacak şekilde içeri<\/b> yapılır: üst limit aşağı, alt limit yukarı adıma.<\/li>\n<li>Kapanış seansında son işlem fiyatının <b>±%3<\/b>'ü uygulanır.<\/li>\n<li>Kitap örneği: Alt Pazar, baz 32,46 TL: teorik 29,214 – 35,706; içe yuvarlamayla <b>29,22 – 35,70 TL<\/b>.<\/li>\n<\/ul>\n\n<h3>Seans saatleri<\/h3>\n<table>\n<tr><th>Sürekli işlem yöntemi (tam gün)<\/th><th>Saat<\/th><\/tr>\n<tr><td>Açılış (emir toplama 09:40-09:55, fiyat belirleme 09:55 sonrası)<\/td><td>09:40 – 10:00<\/td><\/tr>\n<tr><td>Sürekli işlem bölümü<\/td><td>10:00 – 18:00<\/td><\/tr>\n<tr><td>Kapanış (marj yayını 18:00-18:01, emir toplama 18:01-18:05, fiyat belirleme 18:05 sonrası)<\/td><td>18:00 – 18:07<\/td><\/tr>\n<tr><td>Kapanış fiyatından/tek fiyattan işlemler (marj yayını 18:07-18:08, işlemler 18:08-18:10)<\/td><td>18:07 – 18:10<\/td><\/tr>\n<tr><td>Birincil piyasa işlemleri<\/td><td>10:30 – 13:00<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Tek fiyat yöntemi<\/b>: 1. açılış 09:40-10:00 (emir toplama 09:40-09:55); 2. tek fiyat 10:00-13:00 (eşleşme 12:55); 3. gün ortası 13:00-14:00 (13:55); 4. tek fiyat 14:00-18:00 (17:55); 5. kapanış 18:01-18:07 (18:05); ardından 18:08-18:10 kapanış fiyatından işlemler.<\/li>\n<li><b>Yarım gün<\/b>: sürekli işlem ve tek fiyat bölümü 10:00-12:30; kapanış 12:30-12:37; kapanış fiyatından işlemler 12:37-12:40.<\/li>\n<\/ul>\n\n<h3>İşlem yöntemleri<\/h3>\n<ul>\n<li><b>Tek fiyat<\/b>: YİP ve PÖİP payları ile Borsa Genel Müdürlüğünce kararlaştırılan araçlar. <b>Sürekli işlem<\/b>: Yıldız, Ana, Alt Pazar ve GSP.<\/li>\n<li>Sürekli işlem seansında 4 bölüm: açılış, sürekli işlem, kapanış, kapanış fiyatından işlemler. Tek fiyat yönteminde günde açılış ve kapanış dahil <b>5 kez<\/b> fiyat belirlenir.<\/li>\n<li><b>Sürekli işlem (çok fiyat) yöntemi<\/b>: emirler işlem süresince öncelik kurallarına göre farklı fiyatlardan sürekli eşleşir; emirler ve işlemler izlenebilir; üyeler başkalarının emirleri üzerinde tamamen veya kısmen işlem yapabilir.<\/li>\n<li><b>Tek fiyat yöntemi<\/b>: emirler belirli sürede toplanır; emir toplama süresince işlem gerçekleşmez, emir iptali ve değişikliği mümkündür; sonra <b>en çok işlem miktarını<\/b> sağlayan tek fiyat belirlenir ve tüm işlemler bu fiyattan yapılır.<\/li>\n<\/ul>\n<h4>Emir toplama ve fiyat belirleme<\/h4>\n<ul>\n<li>Emir toplamada üyeler yalnız kendi emirlerini görür; denge fiyatı, denge miktarı, kalan miktar gibi sınırlı bilgi yayınlanır; derinlik paylaşılmaz. Baş temsilci kendi kurumunun tüm emirlerini görebilir.<\/li>\n<li>Fiyat iyileştirme, kötüleştirme, miktar artırma veya azaltma yapılabilir; <b>fiyat değişikliği veya miktar artırımı önceliği değiştirir<\/b>. Dikkat: paylarda <b>açılış seansının son beş dakikasında<\/b> emir iptali, fiyat kötüleştirme ve miktar azaltımı yapılamaz; buna sistemin rastlantısal belirlediği <b>en fazla 30 saniyelik<\/b> ek süre eklenir.<\/li>\n<li>Açığa satışa izinli sıralarda <b>açılış seansı dışında<\/b> açığa satış emri girilebilir. Kullanılabilecek emir türleri: limit, piyasa, piyasadan limite, KİE, dengeleyici. Yıldız ve Ana dışında açılış seansında piyasa ve piyasadan limite emir girilemez.<\/li>\n<li>Fiyat belirleme en fazla <b>5 dakika<\/b> sürer (ortalama 1 dakika); bu aşamada yeni emir, değişiklik, iptal yapılamaz. Eşleştirme belirlenen aralığın ilk 30 saniyesinde rastgele başlar; <b>devre kesici sonrası e
