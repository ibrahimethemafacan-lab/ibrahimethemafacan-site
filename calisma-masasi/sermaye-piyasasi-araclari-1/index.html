şleştirmelerde rastlantısallık uygulanmaz<\/b>. Eşleşmeyen geçerli emirler sonraki tek fiyat sürecine aktarılır.<\/li>\n<\/ul>\n<h4>Açılış fiyatı algoritması<\/h4>\n<ol>\n<li>En çok işlem miktarını sağlayan fiyat.<\/li>\n<li>Eşitlik varsa arta kalan emir miktarının <b>en az<\/b> olduğu fiyat.<\/li>\n<li>Yine eşitlikte piyasa yönü: alış ağırlıklıysa <b>yüksek<\/b>, satış ağırlıklıysa <b>düşük<\/b> fiyat.<\/li>\n<li>Yine eşitlikte <b>referans fiyata en yakın<\/b> fiyat (referans: son işlem, kapanış veya Borsanın belirlediği fiyattan en son belirlenen).<\/li>\n<\/ol>\n<ul>\n<li>Hesaba <b>dahil<\/b>: limit, piyasa, piyasadan limite, KİE, rezerv emirler, kotasyonlar. <b>Dahil değil<\/b>: küsurat, hepsi ya da hiçbiri, gerçekleşmezse iptal et, gösterge emirler, <b>dengeleyici emirler<\/b>, tetiklenmemiş stop ve stop limit.<\/li>\n<li>Fiyatları uyuşan emir yoksa veya yalnız piyasa emirleri varsa açılış fiyatı hesaplanmaz. Hiç emir olmayan, adıma uygun bir kademe de açılış fiyatı olabilir.<\/li>\n<li>Kümülatif alış en yüksek fiyattan aşağıya, kümülatif satış en düşük fiyattan yukarıya toplanır; işlem miktarı ikisinin küçüğüdür. Kitap örneği 2'de 20,00 ve 20,10'da 60 lot eşit; kalan miktar 20,10'da daha az olduğu için açılış fiyatı <b>20,10<\/b>.<\/li>\n<li><b>İşlem görme sırası<\/b>: 1) piyasa emirleri, 2) piyasadan limite emirler (bu ikisi arasında zaman önceliği), 3) limit emirler, 4) dengeleyici emirler. Eşleşmeyen dengeleyici emirler iptal edilir.<\/li>\n<\/ul>\n<h4>Kapanış seansı ve kapanış fiyatından işlemler<\/h4>\n<ul>\n<li>Kapanış fiyatı o seansta Borsa kaydına alınan son fiyattır; belirleme sistematiği açılışla aynıdır.<\/li>\n<li>Kapanış seansı emirleri son normal işlem fiyatının <b>±%3<\/b>'ünden fazla farklı olamaz ve günlük fiyat sınırları dışına çıkamaz. Kitap örneği: baz 3,00, sınırlar 2,40-3,60, son işlem 3,58: kapanış emirleri <b>3,48 – 3,60<\/b>.<\/li>\n<li><b>Kapanış fiyatından işlemler<\/b>: <b>2 dakika<\/b>; yalnız o gün işlem görmüş araçlarda; yeni emirler yalnız kapanış/son işlem fiyatından; bu aşamada girilen emirlerin fiyatı değiştirilemez, miktarı artırılıp azaltılabilir. Önceden aktarılan emirlerden kapanış fiyatına eşit olanların fiyatı değişmez ama miktarı artırılıp azaltılabilir; farklı fiyattakilerin miktarı yalnız azaltılabilir veya fiyatı kapanış fiyatına çekilebilir. KİE ve açığa satış emri girilebilir.<\/li>\n<\/ul>\n\n<h3>Devre kesiciler<\/h3>\n<h4>Pay bazında devre kesici<\/h4>\n<ul>\n<li>Yalnız <b>paylarda<\/b> ve yalnız <b>sürekli işlem<\/b> bölümlerinde çalışır. Referans fiyat: en son tek fiyatla belirlenen fiyat veya baz fiyattan en son güncelleneni; buna pazar marjı uygulanır.<\/li>\n<li>Limiti aşacak emir işlem görmez, devre kesici devreye girer; kısmen gerçekleşen emrin kalanı iptal edilir.<\/li>\n<li>Yıldız, Ana, Alt Pazar ve GSP'de devre kesici çalışınca <b>10 dakikalık<\/b> emir toplama, ardından <b>2 dakikalık<\/b> eşleştirme (30 saniyelik rastlantısal başlama). Açığa satışa açık paylarda seansın geri kalanında <b>yukarı adım kuralı<\/b> uygulanır.<\/li>\n<li>Dikkat: kapanışa <b>15 dakikadan az<\/b> kala (<b>17:45-18:00<\/b>) devre kesici çalışırsa emir toplama 15 dakikaya uzar, eşleştirme yapılmadan <b>kapanış seansı emir toplamasına<\/b> bağlanır; eşleştirme kapanış seansı emir toplama süresinin sonunda yapılır.<\/li>\n<li>Devre kesici ilişkili sıraları etkilemez: GARAN.E'de çalışsa da GARAN.R ve varant sıraları sürekli işlemle devam eder.<\/li>\n<\/ul>\n<h4>Endekse bağlı devre kesici (EBDKS)<\/h4>\n<ul>\n<li><b>BIST 100<\/b>'ün önceki kapanışa göre gün içinde <b>%6 veya daha fazla<\/b> düşmesiyle Pay Piyasası'nda işlemler <b>10 dakika<\/b> durdurulur (tek fiyattaki sıralarda eşleşme tamamlandıktan sonra; bu sırada iptal ve değişiklik yok).<\/li>\n<li>Sonra: sürekli işlem sıralarında <b>5 dakika<\/b> tek fiyat emir toplama ve <b>5 dakika içinde<\/b> eşleştirme; tek fiyat sıralarında <b>en az 10 dakikalık<\/b> yeni emir toplama ve akış kaldığı yerden devam.<\/li>\n<li><b>17:30-18:00<\/b> arasında devreye girerse işlemler kapanış seansına (18:00) kadar durur. %6 eşiği gün içinde <b>ikinci kez aşılırsa çalışmaz<\/b>; 18:00'den sonra devreye girmez.<\/li>\n<li>Genel Müdür oranları, referans endeksi resen değiştirebilir veya devre kesiciyi kaldırabilir.<\/li>\n<\/ul>\n\n<h3>Emir tipleri<\/h3>\n<table>\n<tr><th>Emir<\/th><th>Özellik<\/th><\/tr>\n<tr><td><b>Limit<\/b><\/td><td>Fiyat ve miktar belirtilir; gerçekleşmeyen kısım (KİE değilse) süre sonuna kadar pasif bekler<\/td><\/tr>\n<tr><td><b>Piyasa<\/b><\/td><td>Fiyatsız, yalnız miktar; karşı taraftaki en iyi fiyatlı emirlerle eşleşir; <b>yalnız KİE<\/b> olarak gönderilir; eşleşme yoksa iptal. Tek fiyat ve kapanışta eşleşmeye kadar bekler, eşleşmeyen kısım sonraki bölüme aktarılmaz. Sabit azami tutar yok; sıranın maksimum emir değeri sınırı (son işlem, yoksa önceki kapanış, yoksa referans fiyatla) uygulanır<\/td><\/tr>\n<tr><td><b>Piyasadan limite<\/b><\/td><td>Fiyatsız; <b>yalnız en iyi kademedeki<\/b> emirlerle eşleşir; kalan kısım gerçekleştiği son işlem fiyatıyla <b>limit emre dönüşüp pasife yazılır<\/b> (KİE ise yazılmaz). Hiç işleme dönüşmezse iptal. Serbest marjlı, ilk işlemin baz fiyat oluşturduğu sıralarda o seans sonuna kadar girilemez<\/td><\/tr>\n<tr><td><b>Dengeleyici<\/b><\/td><td>Tek fiyat bölümlerinde fiyat belirlemeye katılmaz; eşleşme fiyatında karşılanmadan kalan emirlerle işlem yapar; eşleşmeyen iptal<\/td><\/tr>\n<tr><td><b>Koşullu<\/b><\/td><td>Miktar koşullu (hepsi ya da hiçbiri, gerçekleşmezse iptal et), fiyat koşullu, zaman koşullu (açılışta/kapanışta), kısmi görünme koşullu (27.06.2016'dan beri)<\/td><\/tr>\n<tr><td><b>Kotasyon<\/b><\/td><td>Limit alış ve satıştan oluşur; yalnız <b>piyasa yapıcı/likidite sağlayıcı<\/b> üyeler girer; bütün veya tek taraf iptal edilebilir<\/td><\/tr>\n<tr><td><b>Orta nokta<\/b><\/td><td>Büyük emirlerin kendi aralarında eşleşmesi; değer <b>asgari 100.000 TL, azami 30 milyon TL<\/b>; normal defterdeki en iyi alış ve satışın <b>aritmetik ortalamasıyla<\/b> fiyatlanır; ayrı, kapalı defter; miktar ve hacim yayınlanır, <b>fiyat istatistiği yayınlanmaz<\/b>; yalnız <b>BIST 30<\/b> payları; 27.06.2016'dan beri<\/td><\/tr>\n<tr><td><b>AOF (TAR)<\/b><\/td><td>Gün sonu ağırlıklı ortalama fiyattan veya ona belirli adım uzaklıktan işlem; ayrı sıra (GARAN.AOF); piyasaya bilgi verilmez, Günlük Bülten'de yer alır; <b>asgari 100.000 lot, azami 10 milyon lot<\/b>; yalnız <b>BIST 30<\/b>; 30.09.2016'dan beri<\/td><\/tr>\n<tr><td><b>Küsurat<\/b><\/td><td>Lottan küçük; yalnız miktar girilir; .E sırasındaki son işlem fiyatından gerçekleşir (ör. ABCDE.KE'de 0,3 adet)<\/td><\/tr>\n<tr><td><b>Açığa satış<\/b><\/td><td>SPK ve Borsa fiyat sınırlamalarına uyulur<\/td><\/tr>\n<\/table>\n<h4>Değiştirme, öncelik ve geçerlilik<\/h4>\n<ul>\n<li>Miktar artırımı ve fiyat değişikliği emri yeni girilmiş sayar, <b>zaman önceliği kaybolur<\/b>. İyileştirme: alışta fiyatı yükseltmek, satışta düşürmek; kötüleştirme tersidir. Cari kademedeki emirlerde iptal, miktar azaltma ve kötüleştirmeye süreye bağlı üç aşamalı ücret uygulanır.<\/li>\n<li><b>Öncelik<\/b>: önce <b>fiyat<\/b> (düşük satış, yüksek alış önce), eşitlikte <b>zaman<\/b>.<\/li>\n<li><b>Geçerlilik<\/b>: <b>Günlük<\/b> (varsayılan); <b>KİE<\/b> (girildiği anda karşılanmayan kısım iptal); <b>İKG<\/b> (birincil piyasada .HE sıralarında halka arz süresi sonuna kadar); <b>Tarihli<\/b> (BISTECH başlangıcında devreye alınmadı). Süre uzatılırsa öncelik kaybolur, kısaltılırsa korunur.<\/li>\n<li>Süresi dolan, marj dışına çıkan veya adıma uymayan emirler iptal edilir; baz fiyat artırım vb. nedenle değişirse veya üye kodu değişirse tarihli ve süreli emirler iptal edilir.<\/li>\n<li>Tüm emirlerde <b>müşteri hesap numarası<\/b> zorunludur ve MKK'daki hesap numarasıyla aynı olmalıdır.<\/li>\n<\/ul>\n\n<h3>Kredili işlem ve açığa satış<\/h3>\n<ul>\n<li>Kredili işlem ve açığa satış listesi <b>Alt Pazar, PÖİP ve YİP hariç<\/b> tüm payları kapsar: <b>Yıldız, Ana ve GSP<\/b> payları her ikisine konu olabilir.<\/li>\n<li>Seri V No 65 Tebliği uyarınca işlem sırası sürekli kapatılan paylar hemen, geçici durdurulanlar <b>5 iş gününden<\/b> fazla kapalı kalırsa listeden çıkarılır; çıkarılanlar izleyen <b>üç aylık<\/b> dönem sonuna kadar Geçici Liste'de kalır, yeni işleme konu olmaz ama mevcut pozisyonlar korunabilir; dönem sonunda esas listeye dönmezse pozisyonlar tasfiye edilir.<\/li>\n<li><b>Yukarı adım kuralı<\/b> (Tebliğ m.29): açığa satış son işlem fiyatından <b>yüksek<\/b> fiyattan yapılır; son fiyat bir önceki fiyattan yüksekse son fiyattan da yapılabilir. <b>Yıldız Pazar'da uygulanmaz<\/b>; Ana Pazar ve BYF'lerde uygulanır.<\/li>\n<li>Seans açılışında son fiyat önceki kapanıştır; emir bunun bir adım üstünden verilebilir. Açılış seanslarında açığa satış emri verilemez; ilk açığa satış açılış fiyatının (oluşmadıysa önceki kapanışın) bir kademe üstünden verilebilir. Devre kesici emir toplamasında girilebilir.<\/li>\n<li><b>BIST 100<\/b> gün içinde önceki kapanışa göre <b>%2 veya daha fazla<\/b> düşerse açığa satış yapılabilen tüm sıralarda yukarı adım kuralı seans sonuna kadar otomatik uygulanır.<\/li>\n<\/ul>\n\n<h3>Brüt takas<\/h3>\n<ul>\n<li>Normalde Takasbank pay bazında ve toplam TL olarak <b>netleştirme<\/b> yapar: gün içinde alıp satan yalnız net fark kadar teslim yükümlüsüdür.<\/li>\n<li><b>Brüt takas<\/b>da netleştirme kaldırılır; alacaklar takas süresinden sonra dağıtılır. Alım için takas tarihinde hesapta yeterli <b>nakit<\/b>, satım için yeterli <b>pay<\/b> bulunmalıdır.<\/li>\n<li>Amaç: yanlış intiba uyandıran, piyasaya net katkı sağlamayan işlemleri ve olağandışı fiyat-miktar hareketlerini engellemek, gün içi spekülatif al-satı sınırlamak. Yalnız takasla ilgilidir; yatırım yapmayı engellemez, riskleri azaltabilir.<\/li>\n<\/ul>", "sorular": [{"q": "Bir şirketin verileri şöyledir: piyasa değeri 5,2 milyar TL, fiili dolaşımdaki payların piyasa değeri 1,2 milyar TL, fiili dolaşım oranı %25, likidite değeri 0,30. Diğer kriterlerin sağlandığı varsayılırsa pay hangi pazarda işlem görür?", "o": ["Yıldız Pazar", "Alt Pazar", "Ana Pazar", "Yakın İzleme Pazarı", "Girişim Sermayesi Pazarı"], "a": 2, "e": "Yıldız için PD 6 milyar TL'yi ve likidite değeri 0,15'in altını gerektirir; ikisi de sağlanmıyor. Ana Pazar eşikleri (PD 1 milyar, FDPD 400 milyon, FDO %10, likidite 0,5'in altı) sağlanıyor."}, {"q": "Pazar değerlendirmelerine ilişkin hangisi doğrudur?", "o": ["Her ay son üç aylık verilerle yapılır", "Yeni işlem görmeye başlayanlar ilk 1 yıl değerlendirmeye alınmaz", "Yılda en az iki kez son bir yıllık ortalamalarla yapılır; yeni işlem görmeye başlayanlar ilk 3 ay içindeki değerlendirmelere dahil edilmez", "Yalnız yılda bir kez yıl sonu verileriyle yapılır", "Payın, sınıflandırıldığı pazarın kriterlerinden çoğunluğunu sağlaması yeterlidir"], "a": 2, "e": "Değerlendirme endeks dönemleriyle uyumlu olarak yılda en az iki kez yapılır. Her pay pazarının tüm kriterlerini sağlamalıdır."}, {"q": "Kotasyon Yönergesi'ne göre aşağıdakilerden hangisi payların Yakın İzleme Pazarı'na alınma nedenlerinden biri değildir?", "o": ["Üst üste iki yıl net dönem zararı açıklanması", "Son iki döneme ait bağımsız denetim raporunda olumsuz görüş verilmesi", "Faaliyetlerin makul sebep olmaksızın 3 aydan fazla durdurulması", "Ticari olmayan ilişkili taraf alacaklarının toplam aktiflerin %50'sini aşması", "Faaliyet için gerekli lisansın iptal edilmesi"], "a": 0, "e": "Neden, üst üste beş yıl net dönem zararıdır. YİP'e alma ve çıkarma Borsa İstanbul YK kararıyla olur."}, {"q": "Girişim Sermayesi Pazarı'na ilişkin hangisi doğrudur?", "o": ["Halka açık olup payları borsada işlem görmeyen ortaklıklar için kurulmuştur", "Mali yapısı bozulan şirketlerin payları burada işlem görür", "Tüm bireysel yatırımcılar bilgilendirme metnini onaylayarak işlem yapabilir", "Yalnız nitelikli yatırımcılar işlem yapabilir; üye müşterisinin nitelikli olduğunu bilmek ve gerektiğinde belgelemek zorundadır", "Paylar burada günde beş kez tek fiyat yöntemiyle işlem görür"], "a": 3, "e": "GSP nitelikli yatırımcılara özgüdür. Halka açık ama borsada işlem görmeyenler PÖİP'te, mali yapısı bozulanlar YİP'te işlem görür; GSP'de sürekli işlem uygulanır."}, {"q": "Pazarlarda uygulanan işlem esaslarına (Tablo 2) göre Alt Pazar'da işlem gören paylar için hangisi doğrudur?", "o": ["Günde beş kez tek fiyat yöntemiyle işlem görür", "Brüt takas uygulanır, açığa satış ve kredili işlem yapılamaz", "Özkaynak oranı %75'tir", "Açılış seansında piyasa emri girilebilir", "Devre kesici tetikleme oranı %10'dur"], "a": 1, "e": "Alt Pazar'da sürekli işlem, brüt takas var, açığa satış ve kredili işlem yok, özkaynak oranı %0, devre kesici %5; açılışta piyasa ve piyasadan limite emir girilemez."}, {"q": "Alt Pazar, YİP ve PÖİP'te işlem yapacak yatırımcının bilgilendirilmesine ilişkin hangisi yanlıştır?", "o": ["İlk işlem öncesinde bilgilendirme metnini okuyup anladığına dair beyan alınır", "İnternetten verilen her alım emri öncesinde metin yeniden sunulur", "Telefonla verilen alım emirlerinde metnin tamamı okunmadan hatırlatma yapılır", "Mümkün olduğunca limit fiyatlı emir kullanılması tavsiye edilir", "Beyan yalnız yazılı olarak alınabilir ve ilk işlemden sonra yeniden bilgilendirme yapılmaz"], "a": 4, "e": "Beyan yazılı, sözlü veya elektronik alınabilir ve bilgilendirme yükümlülüğü ilk işlemden sonra da sürer."}, {"q": "Baz fiyata ilişkin hangisi doğrudur?", "o": ["Yeni pay alma haklarında ilk işlem günü baz fiyat uygulanmaz; ilk günün kapanışı ertesi günün baz fiyatıdır", "Baz fiyat, fiyat limitlerine esas olmayan referans fiyatla aynıdır", "Gün içinde hiç işlem olmazsa ertesi gün baz fiyat serbest bırakılır", "BISTECH'te baz fiyat önceki günün ağırlıklı ortalama fiyatıdır", "Temettü dağıtımında baz fiyat değişmez"], "a": 0, "e": "Baz fiyat önceki kapanıştır; işlem olmazsa aynen devam eder; özsermaye hâllerinde teorik fiyatın adıma yuvarlanmasıyla güncellenir. Referans fiyat limitlere esas değildir."}, {"q": "Baz fiyatı 248,00 TL olan bir paya 251,00 TL fiyatlı alış emri girilecektir. Bu emir için geçerli fiyat adımı kaç TL'dir?", "o": ["0,10", "0,50", "0,25", "0,05", "1,00"], "a": 2, "e": "Fiyat adımı baz fiyata değil, emrin fiyat seviyesine göre belirlenir: 250,000-499,999 TL aralığında adım 0,25 TL'dir."}, {"q": "Alt Pazar'da işlem gören bir payın baz fiyatı 72,40 TL'dir. Fiyat değişim sınırı ±%10 ve içe yuvarlama kuralı uygulandığında gün içi işlem aralığı hangisidir?", "o": ["65,15 – 79,65 TL", "65,16 – 79,64 TL", "65,10 – 79,70 TL", "61,54 – 83,26 TL", "65,20 – 79,60 TL"], "a": 4, "e": "Teorik sınırlar 65,16 ve 79,64'tür; adım 0,05 TL. Üst limit aşağı (79,60), alt limit yukarı (65,20) yuvarlanır. Son şık ±%15 ile bulunur."}, {"q": "Alt Pazar'da baz fiyatı 27,73 TL olan bir payın günlük fiyat sınırları 24,96 – 30,50 TL'dir. Sürekli işlem bölümündeki son işlem 30,00 TL'dir. Kapanış seansında girilebilecek emir fiyat aralığı hangisidir?", "o": ["29,10 – 30,90 TL", "29,10 – 30,50 TL", "27,00 – 33,00 TL", "29,40 – 30,60 TL", "24,96 – 30,50 TL"], "a": 1, "e": "Kapanış seansında son işlem fiyatının ±%3'ü uygulanır: 29,10 – 30,90. Ancak günlük fiyat değişim sınırları dışına çıkılamaz; üst sınır 30,50 TL'de kalır."}, {"q": "Açılış seansında emirler şöyledir. Alış: 30 lot piyasa, 20 lot 25,40 TL, 40 lot 25,30 TL, 30 lot 25,20 TL. Satış: 20 lot piyasa, 30 lot 25,20 TL, 30 lot 25,30 TL, 50 lot 25,40 TL. Açılış fiyatı ve işlem miktarı hangisidir?", "o": ["25,20 TL; 50 lot", "25,40 TL; 50 lot", "25,30 TL; 90 lot", "25,30 TL; 80 lot", "25,20 TL; 120 lot"], "a": 3, "e": "Kümülatif alış/satış: 25,20'de 120/50 (50 lot), 25,30'da 90/80 (80 lot), 25,40'ta 50/130 (50 lot). En çok işlem 25,30 TL'de 80 lottur."}, {"q": "Açılış fiyatı algoritmasında en çok işlem miktarını sağlayan birden fazla fiyat varsa sırasıyla uygulanan kriterler hangisinde doğru verilmiştir?", "o": ["Arta kalan miktarın en az olması, piyasa yönü, referans fiyata yakınlık", "Piyasa yönü, arta kalan miktarın en az olması, referans fiyata yakınlık", "Referans fiyata yakınlık, piyasa yönü, arta kalan miktarın en az olması", "Zaman önceliği, fiyat önceliği, piyasa yönü", "Arta kalan miktarın en çok olması, referans fiyata yakınlık, piyasa yönü"], "a": 0, "e": "Sıra: en çok işlem, en az arta kalan miktar, piyasa yönü (alış ağırlıklıysa yüksek, satış ağırlıklıysa düşük fiyat), referans fiyata en yakın fiyat.", "k": 1}, {"q": "Açılış fiyatı hesaplamasında aşağıdaki emirlerden hangisi dikkate alınmaz?", "o": ["Limit emirler", "Dengeleyici emirler", "Piyasadan limite emirler", "Kalanı iptal et emirleri", "Kotasyonlar"], "a": 1, "e": "Dengeleyici, küsurat, hepsi ya da hiçbiri, gerçekleşmezse iptal et, gösterge ve tetiklenmemiş stop emirleri hesaplamaya dahil edilmez."}, {"q": "Sürekli işlem yöntemi uygulanan paylarda tam gün seans saatlerine ilişkin eşleştirmelerden hangisi yanlıştır?", "o": ["Açılış emir toplama: 09:40 – 09:55", "Sürekli işlem bölümü: 10:00 – 18:00", "Kapanış seansı: 18:00 – 18:07", "Kapanış fiyatından işlemler: 18:07 – 18:10", "Birincil piyasa işlemleri: 14:00 – 17:00"], "a": 4, "e": "Birincil piyasa işlemleri 10:30 – 13:00 arasındadır; diğer saatler doğrudur.", "k": 1}, {"q": "Tek fiyat işlem yöntemine ilişkin hangisi doğrudur?", "o": ["Yıldız ve Ana Pazar paylarına uygulanır; günde 3 kez fiyat belirlenir", "Emir toplama süresince işlemler sürekli gerçekleşir", "Fiyat belirleme aşamasında yeni emir girilebilir", "YİP ve PÖİP paylarına uygulanır; açılış ve kapanış dahil günde 5 kez fiyat belirlenir", "Kapanış fiyatından işlemler bölümü 5 tek fiyat sayısına dahildir"], "a": 3, "e": "Tek fiyat YİP ve PÖİP'te uygulanır; emir toplamada işlem olmaz, fiyat belirlemede yeni emir girilemez; kapanış fiyatından işlemler sayıya dahil değildir."}, {"q": "Paylarda açılış seansının son beş dakikasında aşağıdakilerden hangisi yapılabilir?", "o": ["Alış emrinin fiyatını yükseltmek", "Emri iptal etmek", "Alış emrinin fiyatını düşürmek", "Emir miktarını azaltmak", "Satış emrinin fiyatını yükseltmek"], "a": 0, "e": "Son beş dakikada (ve en fazla 30 saniyelik rastlantısal ek sürede) iptal, fiyat kötüleştirme ve miktar azaltımı yapılamaz. Alışta fiyat yükseltmek iyileştirmedir."}, {"q": "Yıldız Pazar'da işlem gören bir payda saat 17:50'de pay bazında devre kesici çalışmıştır. Hangisi doğrudur?", "o": ["10 dakika emir toplama ve 2 dakika eşleştirme yapılıp 18:02'de sürekli işleme dönülür", "Payda işlemler ertesi güne kadar durdurulur", "Pay kapanış seansına katılmaz; kapanış fiyatı devre kesiciden önceki son işlem fiyatı olur", "Devre kesici 17:45'ten sonra çalışmaz", "Eşleştirme yapılmadan emir toplama kapanış seansına bağlanır; eşleştirme kapanış seansı emir toplama süresinin sonunda yapılır"], "a": 4, "e": "17:45-18:00 arasında çalışan devre kesicide emir toplama 15 dakikaya uzar ve kapanış seansı emir toplamasına bağlanır; eşleştirme o sürenin sonunda yapılır."}, {"q": "BIST 100 endeksi saat 15:00'te önceki kapanışa göre %6,2 düşmüş, EBDKS devreye girmiştir. Saat 16:00'da düşüş %7'ye ulaşmıştır. Sürekli işlem yöntemindeki sıralar için hangisi doğrudur?", "o": ["15 dakika durdurma ve 2 dakika eşleştirme; 16:00'da yeniden çalışır", "İşlemler gün sonuna kadar durdurulur", "10 dakika durdurma, ardından 5 dakika tek fiyat emir toplama ve 5 dakika içinde eşleştirme; 16:00'da devre kesici yeniden çalışmaz", "10 dakika durdurma ve 10 dakika emir toplama; 16:00'da yeniden çalışır", "5 dakika durdurma ve 5 dakika eşleştirme; 16:00'da işlemler kapanışa kadar durur"], "a": 2, "e": "EBDKS'de 10 dakika durdurma, sonra 5 dakika emir toplama ve 5 dakika içinde eşleştirme yapılır. %6 eşiği aynı gün ikinci kez aşılırsa devre kesici çalışmaz."}, {"q": "Sürekli işlemde en iyi satış kademesi 30,10 TL'de 150 lot, sonraki kademe 30,12 TL'de 400 lottur. Yatırımcı 400 lotluk piyasadan limite alış emri (KİE değil) göndermiştir. Sonuç hangisidir?", "o": ["400 lotun tamamı 30,10 ve 30,12 TL kademelerinden gerçekleşir", "150 lot gerçekleşir, kalan 250 lot iptal edilir", "150 lot 30,10 TL'den gerçekleşir; kalan 250 lot 30,10 TL limitli alış emri olarak pasife yazılır", "Emrin tamamı 30,12 TL limitli emir olarak pasife yazılır", "Emir karşılanmadan iptal edilir"], "a": 2, "e": "Piyasadan limite emir yalnız en iyi kademedeki emirlerle eşleşir; kalan kısım son işlem fiyatını alıp limit emre dönüşür ve pasife yazılır. KİE olarak girilseydi kalan iptal edilirdi."}, {"q": "BIST 30 kapsamındaki bir payda normal defterde en iyi alış 52,40 TL, en iyi satış 52,50 TL'dir. Bir kurum 250.000 TL değerinde orta nokta emri girmiştir. Hangisi doğrudur?", "o": ["Emir 52,45 TL'den fiyatlanır; işlem miktarı yayınlanır ancak fiyat istatistiği yayınlanmaz", "Emir asgari tutar olan 500.000 TL'nin altında olduğu için kabul edilmez", "Emir 52,50 TL'den fiyatlanır ve normal emir defterinde görünür", "Emir 52,45 TL'den fiyatlanır; işlem bilgisi hiç yayınlanmaz", "Orta nokta emri yalnız Alt Pazar paylarında kullanılabilir"], "a": 0, "e": "Orta nokta emri en iyi alış ve satışın aritmetik ortalamasıyla (52,45) ayrı kapalı defterde fiyatlanır; değeri 100.000 TL ile 30 milyon TL arasında olmalıdır; yalnız BIST 30 paylarında kullanılır."}, {"q": "Ağırlıklı ortalama fiyat (AOF) emirlerine ilişkin hangisi doğrudur?", "o": ["Değer asgari 100.000 TL, azami 30 milyon TL olmalıdır", "Normal emir defterinde işlem görür ve fiyatı anlık yayınlanır", "Yalnız piyasa yapıcılar girebilir", "Miktar asgari 100.000 lot, azami 10 milyon lot olmalıdır ve yalnız BIST 30 paylarında kullanılır", "Tüm pazarlardaki paylarda kullanılabilir"], "a": 3, "e": "AOF emirleri ayrı sırada (GARAN.AOF gibi) işlem görür, işlem sonrası piyasaya bilgi verilmez ama Günlük Bülten'de yer alır. TL sınırı orta nokta emrine aittir."}, {"q": "Emirlerde değişiklik ve öncelik kurallarına ilişkin hangisi yanlıştır?", "o": ["Miktar artırıldığında emir zaman önceliğini kaybeder", "Emrin geçerlilik süresi uzatıldığında emir önceliğini korur", "Fiyat değiştirildiğinde emir zaman önceliğini kaybeder", "Fiyat eşitliğinde sisteme önce kaydedilen emir önce karşılanır", "Süre kısaltıldığında emir önceliğini korur"], "a": 1, "e": "Süre uzatılırsa öncelik kaybolur, kısaltılırsa korunur."}, {"q": "Ana Pazar'da açığa satışa izin verilen bir payda (fiyat adımı 0,01 TL) iki durum vardır. I: önceki işlem 18,40, son işlem 18,35 TL. II: önceki işlem 18,30, son işlem 18,35 TL. Her durumda açığa satış emri verilebilecek en düşük fiyat hangisidir?", "o": ["I: 18,35 TL; II: 18,36 TL", "I: 18,41 TL; II: 18,35 TL", "I: 18,36 TL; II: 18,36 TL", "I: 18,34 TL; II: 18,31 TL", "I: 18,36 TL; II: 18,35 TL"], "a": 4, "e": "Yukarı adım kuralında açığa satış son fiyattan yüksek fiyattan yapılır; son fiyat bir önceki fiyattan yüksekse son fiyattan da yapılabilir. Yıldız Pazar'da bu kural uygulanmaz."}, {"q": "Kredili menkul kıymet ve açığa satış işlemlerine konu paylara ilişkin hangisi doğrudur?", "o": ["Liste Alt Pazar, PÖİP ve YİP hariç tüm payları kapsar; geçici durdurulan pay 5 iş gününden fazla kapalı kalırsa listeden çıkarılır", "Liste yalnız BIST 30 paylarını kapsar", "Listeden çıkarılan paylardaki pozisyonlar derhal tasfiye edilir", "Geçici Liste dönemi bir yıldır", "Alt Pazar payları kredili alıma konu olabilir ancak açığa satılamaz"], "a": 0, "e": "Yıldız, Ana ve GSP payları listededir. Çıkarılan paylar üç aylık dönem sonuna kadar Geçici Liste'de kalır; pozisyonlar korunabilir, dönem sonunda esas listeye dönmezse tasfiye edilir."}, {"q": "Brüt takas uygulanan YİP payında bir yatırımcı sabah 20.000 TL'lik alım yapmış, aynı gün bu payları 22.000 TL'ye satmıştır. Hangisi doğrudur?", "o": ["İşlemler netleştirilir ve yalnız 2.000 TL alacak kaydedilir", "Brüt takas yalnız Yıldız Pazar'da uygulandığı için netleştirme yapılır", "Alım ve satım netleştirilmez; takas tarihinde alım için 20.000 TL nakit bulunmalı, satış bedeli ayrıca hesaba geçer", "Satış bedeli alım bedelinden mahsup edildiği için nakit gerekmez", "Brüt takasta aynı gün satış yapılması yasaktır"], "a": 2, "e": "Brüt takasta netleştirme kaldırılır; alım için nakit, satım için pay bulundurulur ve alacaklar takas süresinden sonra dağıtılır. Amaç gün içi spekülatif al-satı sınırlamaktır."}]}, {"id": 6, "kisa": "Borçlanma Araçları Mevzuatı", "baslik": "Borçlanma Araçları: Mevzuat, Temel Kavramlar ve Yapısal Unsurlar", "ozet": "Borçlanma Araçları Tebliği kapsamında ihraç yetkisi ve limiti, satış yöntemleri, kamuyu aydınlatma, BASK, ikincil piyasa, banka kredisiyle karşılaştırma ve tahvilin yapısal unsurları.", "notlar": "\n<h3>Kapsam ve temel tanımlar (VII-128.8 Borçlanma Araçları Tebliği)<\/h3>\n<ul>\n<li><b>Borçlanma aracı:<\/b> ihraççının borçlu sıfatıyla düzenleyip sattığı tahvil, paya dönüştürülebilir tahvil, değiştirilebilir tahvil, finansman bonosu ve Kurulca borçlanma aracı sayılan diğer araçlar.<\/li>\n<li><b>Tahvil:<\/b> vadesi <b>365 gün veya daha uzun<\/b> olan borçlanma aracı. İskontolu, primli ve/veya kupon ödemeli satılabilir; faiz ve ödeme koşullarını ihraççı serbestçe belirler.<\/li>\n<li><b>Finansman bonosu:<\/b> vadesi <b>30 günden az olmayan, 364 günü aşmayan<\/b> araç. Kural olarak iskontolu satılır, kupon ödemeli ihraç da mümkündür. Tebliğin tahvil hükümleri, uygun düştüğü ölçüde bonolara kıyasen uygulanır.<\/li>\n<li>Nominal değer vade sonunda veya vadeye kadar taksitlerle geri ödenebilir.<\/li>\n<\/ul>\n<h3>İhraç kararı ve yetkili organ<\/h3>\n<ul>\n<li>TTK'ya göre kural: ihraç kararını <b>genel kurul<\/b> alır. <b>SPKn m.31<\/b> uyarınca bu yetki <b>esas sözleşmeyle yönetim kuruluna devredilebilir<\/b>; esas sözleşmede YK'nın ihraç yetkisinin <b>açıkça<\/b> yazılması şarttır.<\/li>\n<li>Kararda asgari olarak: ihraç edilecek araçların <b>azami tutarı<\/b> ve satışın <b>yurt içinde halka arzla, halka arz edilmeksizin veya yurt dışında<\/b> yapılacağı yer alır.<\/li>\n<li>Yetkili organ kararından itibaren <b>en geç 1 yıl<\/b> içinde Kurula başvurulmalıdır.<\/li>\n<li>Başvuru ve onay zorunluluğu <b>yurt dışı ihraçları da kapsar<\/b>.<\/li>\n<li>Dikkat: Esas sözleşmede açık yetki yoksa YK tek başına ihraç kararı alamaz; karar genel kurulundur.<\/li>\n<\/ul>\n<h3>İhraç limiti<\/h3>\n<ul>\n<li>Limit, izahname/ihraç belgesi onayı için Kurula yapılan <b>başvuru tarihi<\/b> esas alınarak, Kurul finansal raporlama düzenlemelerine göre hazırlanmış tablolardan hesaplanır. Hem konsolide hem solo tablo varsa <b>konsolide<\/b> esas alınır.<\/li>\n<li><b>Halka açık ortaklık:<\/b> özkaynağın <b>5 katı<\/b>. <b>Halka açık olmayan ortaklık:<\/b> özkaynağın <b>3 katı<\/b>.<\/li>\n<li>Talebe bağlı derecelendirmede yatırım yapılabilir seviyenin <b>en yüksek ilk üç kademesine<\/b> denk gelen uzun vadeli not alan <b>bankalar<\/b> için hesaplanan limit <b>%100 artırılır<\/b>.<\/li>\n<li>İndirim kalemleri: halen <b>tedavüldeki<\/b> borçlanma araçları ile ihraç tavanı kapsamında <b>henüz satılmamış<\/b> araçların nominal tutarı.<\/li>\n<li>Örnek: halka açık şirket, özkaynak 800 milyon TL → limit 4 milyar TL; tedavülde 600 milyon ve satılmamış tavan 400 milyon varsa kalan limit 3 milyar TL.<\/li>\n<\/ul>\n<h3>Erken itfa, geri alım ve kayden ihraç<\/h3>\n<ul>\n<li>Tahviller ihraççının veya yatırımcının talebine bağlı olarak <b>kısmen veya tamamen erken itfa<\/b> edilebilir nitelikte ihraç edilebilir (Tebliğ m.15). Yurt içi ihraçta esaslar izahname veya ihraç belgesinde yer almalıdır.<\/li>\n<li>İhraççı tahvillerini piyasadan <b>geri alabilir<\/b>; geri alınanlar vade boyunca tekrar satılabilir, elde tutulabilir veya MKK'da işlem yapılarak vadeden önce <b>iptal<\/b> edilebilir.<\/li>\n<li>Yurt içi ihraçlar MKK nezdinde <b>kayden<\/b> yapılır, haklar <b>hak sahibi bazında<\/b> izlenir; her tertip satış öncesi doğrudan MKK'ya başvurularak işletilir.<\/li>\n<\/ul>\n<h3>Satış yöntemleri<\/h3>\n<ul>\n<li>İki ana yol: <b>halka arz<\/b> ve <b>halka arz edilmeksizin<\/b> satış. Halka arzda yetkili kuruluş kullanmak esastır; halka arz edilmeksizin satışta aracı kuruluş zorunluluğu yoktur.<\/li>\n<li>Türkiye'de özel sektörde en çok tercih edilen yöntem maliyet ve hız nedeniyle <b>halka arz edilmeksizin satış<\/b>tır. İkiye ayrılır: <b>tahsisli satış<\/b> ve <b>nitelikli yatırımcıya satış<\/b>. İhraç tavanı içinde yöntemler ayrı ayrı veya birlikte kullanılabilir.<\/li>\n<li><b>4749 sayılı Kanun<\/b> uyarınca Hazine ve Maliye Bakanlığı ihraçları Kurulun ihraç tavanı onayından <b>muaftır<\/b>.<\/li>\n<li>Halka arz edilmeksizin satışta <b>izahname gerekmez<\/b>; Kurulca onaylanan <b>ihraç belgesi<\/b> hazırlanır. İhraç belgesi onaydan itibaren <b>1 yıl<\/b> içindeki ihraçlar için geçerlidir.<\/li>\n<\/ul>\n<table>\n<tr><th>Konu<\/th><th>Nitelikli yatırımcıya satış<\/th><th>Tahsisli satış<\/th><\/tr>\n<tr><td>Muhatap<\/td><td>Profesyonel müşteriler (talebe dayalı profesyoneller dahil)<\/td><td>Kimliği önceden belli kişiler, borsa dışında<\/td><\/tr>\n<tr><td>Yatırımcı sayısı sınırı<\/td><td>Yok<\/td><td>Belirli bir anda <b>150 kişiyi<\/b> geçemez (nitelikli yatırımcılar sayılmaz)<\/td><\/tr>\n<tr><td>Teyit / beyan<\/td><td>Vasıf MKK kayıtlarında yer almalı, aracı teyit eder<\/td><td>Riskleri anladığına dair beyan imzalatılır<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Halka arza dönüşme eşiği:<\/b> tahsisli araçları elinde tutan (nitelikli olmayan) yatırımcı sayısının 150'yi aştığı MKK'ca tespit edilirse işlem Kanun gereği <b>halka arz sayılır<\/b>; MKK durumu derhal ihraççıya ve Kurula bildirir; ihraççı izahname hazırlayıp borsada işlem görme başvurusu yapar.<\/li>\n<li>Halka arz edilmeksizin yurt içi satışta risk beyanları ihraççı veya yetkili kuruluşça <b>5 yıl<\/b> saklanır.<\/li>\n<li><b>Yurt dışı ihraç:<\/b> MKK'da hak sahibi bazında izleme zorunlu değildir; ancak ihraç tutarı, vade, faiz, ISIN, saklamacı ve satış ülkesi bilgileri satışın tamamlanmasını izleyen <b>3 iş günü<\/b> içinde MKK'ya bildirilir. Erken itfa dahil değişiklikler de <b>3 iş günü<\/b> içinde bildirilir.<\/li>\n<\/ul>\n<h3>Kamuyu aydınlatma (II-15.1 Özel Durumlar Tebliği)<\/h3>\n<ul>\n<li>Yükümlülük, izahname veya ihraç belgesinin <b>onay tarihinden itfa tarihine kadar<\/b> sürer; payları borsada işlem görmeyen ihraççılar da kapsamdadır.<\/li>\n<li>Halka arz edilmeksizin (nitelikli veya tahsisli) satan ihraççılar içsel bilgi ve sürekli bilgilendirme hükümlerinden muaftır; yalnızca Tebliğ <b>m.21<\/b>'de sayılan önemli olayları açıklar.<\/li>\n<li><b>Genel bilgi formu (KAP):<\/b> halka arz edenler ve nitelikli yatırımcıya satanlar doldurur, değişiklikte <b>en geç 2 iş günü<\/b> içinde günceller. <b>Yalnızca tahsisli<\/b> satış yapanlar bu yükümlülükten muaftır.<\/li>\n<li><b>Tüm ihraççılar için m.21 olayları:<\/b> ihraç tavanı alınması, tertip ihraçları, anapara/faiz/kupon temerrüdü (derhal); borç ödeme kabiliyetini etkileyen gelişmeler, derecelendirme notu, garanti ve teminat değişiklikleri, genel kurul gündemi, kâr dağıtımı, sermaye artırımı/azaltımı, birleşme, bölünme, ihraç koşullarının yatırımcı aleyhine değişmesi.<\/li>\n<li><b>Halka arz eden<\/b> ihraççı ayrıca içsel bilgiler bölümüne tam tabidir: YK üyesi, genel müdür gibi idari sorumluluğu olanlardaki değişiklikler, önemli varlık alım-satımları, önemli davalar da açıklanır.<\/li>\n<\/ul>\n<table>\n<tr><th>Pay sahipliği bildirimi<\/th><th>Eşikler<\/th><\/tr>\n<tr><td>Nitelikli yatırımcıya veya tahsisli satış yapan ihraççı<\/td><td>%25, %50, %67<\/td><\/tr>\n<tr><td>Halka arz yapan ihraççı<\/td><td>%5, %10, %15, %20, %25, %33, %50, %67, %95<\/td><\/tr>\n<\/table>\n<ul><li>Dikkat: Eşiğe ulaşma kadar eşiğin altına düşme de bildirim doğurur.<\/li><\/ul>\n<h3>Borçlanma Aracı Sahipleri Kurulu (BASK, II-31A.1)<\/h3>\n<ul>\n<li>İhraççı YK'sının veya araç sahiplerinin talebiyle toplanır. <b>Tertip BASK:<\/b> belirli ISIN altındaki tertip sahipleri. <b>Genel BASK:<\/b> bir tertip kararının diğer tertipleri olumsuz etkilemesi halinde tüm tertip sahipleriyle toplanan üst kurul.<\/li>\n<li>Faiz, vade, anapara gibi <b>asli hüküm ve şartlarda<\/b> değişiklik için Tertip BASK kararı zorunludur.<\/li>\n<li>Nisapta <b>ihraççı ve ilişkili tarafların<\/b> elindeki araçlar dikkate alınmaz, oy kullanılamaz.<\/li>\n<li>Karar nisabı (daha ağırı öngörülmedikçe): tertibin tedavüldeki nominalinin <b>üçte ikisi<\/b>.<\/li>\n<li>Karar, toplantıdan itibaren <b>en geç 3 iş günü<\/b> içinde ihraççı YK'sınca onaylanmalıdır.<\/li>\n<li>Olumsuz etkilendiğini iddia eden diğer tertip sahipleri, tedavüldeki toplam tutarın <b>%20<\/b>'sine sahipse Genel BASK'ı toplantıya çağırabilir; Genel BASK kararı <b>üçte iki<\/b> çoğunlukla reddederse Tertip BASK kararı yürürlüğe girmez.<\/li>\n<li><b>Borçlanma Aracı Sahipleri Temsilcisi:<\/b> tertip nominalinin <b>yarısından fazlası<\/b>nın oyuyla seçilir; görev, yetki ve ücreti izahname/ihraç belgesinde düzenlenir.<\/li>\n<li><b>Temerrüt sonrası yeniden yapılandırma:<\/b> karar anından itibaren temerrüt nedeniyle başlatılmış <b>icra takipleri durur<\/b>, ihtiyati tedbir ve ihtiyati haciz uygulanmaz, takiple kesilebilen zamanaşımı ve hak düşürücü süreler işlemez; yapılandırılmış borçlar ifa edilince duran takipler <b>düşer<\/b>.<\/li>\n<li>Örnek: tedavül 120 milyon, ilişkili tarafta 15 milyon → oy hakkı olan 105 milyon; gerekli kabul 70 milyon TL.<\/li>\n<\/ul>\n<h3>İkincil piyasa: Borçlanma Araçları Piyasası (BAP)<\/h3>\n<ul>\n<li>Doğrudan işlem yetkisi yalnızca Borsa üyesi <b>bankalar, aracı kurumlar ve TCMB<\/b>'dedir.<\/li>\n<li><b>Kesin Alım Satım Pazarı:<\/b> Hazine dış borçlanma araçları dışındaki DİBS, özel sektör tahvili ve bonolarının ikinci el işlemleri.<\/li>\n<li>Yurt içinde <b>halka arz edilen<\/b> özel sektör borçlanma araçlarının borsada işlem görmesi <b>zorunludur<\/b>; yatırımcı kısıtı yoktur.<\/li>\n<li><b>Nitelikli yatırımcıya<\/b> ihraçta borsada işlem görme zorunlu değildir. İkincil piyasa istenirse ya ilk satış <b>Nitelikli Yatırımcıya İhraç Pazarı<\/b>'nda yapılır ya da borsa dışında satılıp kote ettirilir; her iki durumda ikincil işlemler Kesin Alım Satım Pazarı'nda olur ve <b>nitelikli yatırımcı kısıtı devam eder<\/b>.<\/li>\n<li>Nitelikli Yatırımcıya İhraç Pazarı yalnızca bir <b>birincil piyasa<\/b> penceresidir.<\/li>\n<li>Hazine eurotahvilleri döviz cinsinden <b>Uluslararası Tahvil Pazarı<\/b>'nda işlem görür.<\/li>\n<li>Özel sektör halka arzı borsa platformunda değil, yetkili kuruluş/konsorsiyumla <b>talep toplama<\/b> yoluyla yapılır; \"borsada satış\" yöntemi mevzuatta olsa da fiilen kullanılmamaktadır.<\/li>\n<\/ul>\n<h3>Sabit getirili menkul kıymet kavramı<\/h3>\n<ul>\n<li>\"Sabit\" olan getirinin rakamı değil, <b>nakit akışını belirleyen formül ve ödeme takvimi<\/b>dir. TLREF'e endeksli değişken faizli tahvil de bu sınıftadır.<\/li>\n<li>Tahvil sahibi <b>alacaklıdır<\/b>, ortak değildir: yönetime katılma hakkı yoktur ama tasfiyede pay sahiplerinden <b>önce<\/b> ödenir. Faiz ve anapara ödemesi ihraççının kâr/zararından bağımsız ve bağlayıcıdır.<\/li>\n<li>İhraççı açısından ortakların payını sulandırmadan fon sağlar; ancak <b>finansal kaldıracı<\/b> artırır ve <b>yeniden finansman riski<\/b> doğurur.<\/li>\n<\/ul>\n<h3>Banka kredisi mi, tahvil mi?<\/h3>\n<ul>\n<li>Tahvilde ihraççı bankayı aradan çıkarıp doğrudan tasarruf sahiplerine, fonlara, sigorta şirketlerine ulaşır; teorik olarak hem daha düşük maliyet hem mevduattan yüksek getiri.<\/li>\n<li><b>Nakit akışı:<\/b> kredi genellikle dönemsel taksitli (anapara + faiz); tahvil çoğunlukla yalnız kupon öder, anapara vade sonunda tek seferde (<b>balon ödeme<\/b>). Projesi geç nakit üreten şirket için tahvil daha uygundur.<\/li>\n<li><b>Teminat:<\/b> bankalar ipotek, rehin, kefalet ister; tahviller (teminatlı menkul kıymetler hariç) çoğunlukla <b>teminatsız<\/b> ihraç edilir.<\/li>\n<li><b>Vade:<\/b> sermaye piyasasında daha uzun ve esnek vade imkanı.<\/li>\n<li><b>Ek maliyetler:<\/b> aracılık komisyonu, derecelendirme ücreti, vadeye bağlı oranlarla alınan <b>Kurul ücreti<\/b>, MKK saklama ve üyelik ücretleri, KAP katılım bedeli, borsa kotasyon ve yıllık işlem görme ücretleri. İhraç büyüklüğünün bu maliyetleri karşılayacak ölçekte olup olmadığına bakılmalıdır.<\/li>\n<li>Kredi ikili ve hızlı; ihraç uzun ve prosedürlü ama şirkete <b>kurumsal itibar<\/b> kazandırır.<\/li>\n<\/ul>\n<h3>Yapısal unsurlar<\/h3>\n<ul>\n<li><b>Nominal değer:<\/b> vade sonunda ödenecek anapara; DİBS ve özel sektör araçları standart <b>100 TL<\/b> nominalle ihraç edilir. Alış fiyatı ne olursa olsun vadede nominal ödenir.<\/li>\n<li><b>Kupon oranı:<\/b> nominal üzerinden yıllık faiz oranı; kupon daima <b>nominal değer<\/b> üzerinden hesaplanır, piyasa fiyatı üzerinden değil. %6 kupon, 100 TL nominal → yılda 6 TL; 6 ayda bir ödenirse 3'er TL. Türkiye'de kuponlar genellikle <b>3 ayda bir<\/b> (yılda 4) veya <b>6 ayda bir<\/b> (yılda 2) ödenir.<\/li>\n<li>Kupon oranı sözleşmeye yazılan sabit parametre; getiri ise alış fiyatına göre değişir. İskontolu alınan tahvilde vadeye kadar getiri kupon oranından yüksektir.<\/li>\n<li><b>Kuponsuz (zero-coupon):<\/b> nominalin altında satılır, getiri ihraç ve itfa fiyatı farkıdır.<\/li>\n<li><b>Sabit kupon:<\/b> nakit akışı kesin; faiz artınca fiyat düşer, vade uzadıkça faiz oranı riski artar.<\/li>\n<li><b>Değişken kupon:<\/b> Kupon = Referans oran (TLREF veya BIST TLREF Endeksi değişimi gibi) + <b>ek getiri (spread)<\/b>. Spread ihraççının kredi riskine göre belirlenen sabit marjdır. Kupon dönemsel güncellendiği için fiyat faiz dalgalanmasından çok daha az etkilenir.<\/li>\n<li><b>Hibrit kupon:<\/b> sabit oran ile referans + marj arasından kurala göre belirlenir; faiz düşüşünde sabit unsur, yükselişte değişken unsur yatırımcıyı korur.<\/li>\n<li><b>İtfa tarihi (vade):<\/b> TL devlet ve özel sektör tahvillerinde sıklıkla 10 yıl ve altı; eurotahvillerde <b>30 yıla kadar<\/b>.<\/li>\n<li><b>Sermaye benzeri borçlanma araçları:<\/b> çoğunlukla bankalarca, Basel kapsamında sermaye yeterliliğine dahil edilmek için ihraç edilir; çok uzun vadeli veya vadesiz olabilir; vadesizde ihraççıya belirli süreden sonra (ör. 5. veya 10. yıl) geri çağırma hakkı tanınabilir. Tasfiyede diğer tüm borçlanma araçlarından <b>sonra<\/b>, pay sahiplerinden <b>önce<\/b> gelir; bu yüzden kuponu daha yüksektir.<\/li>\n<li><b>İtfa yapısı:<\/b> vade sonu tek ödemeli (balon ödeme; rollover riski, yatırımcının anapara yeniden yatırım riski vadeye ertelenir; Türkiye'de yaygın) veya <b>parçalı itfa<\/b>. Parçalı itfanın <b>dengeli borç servisi<\/b> türünde her dönem toplam taksit sabittir; başta faiz payı büyük, zamanla anapara payı artar.<\/li>\n<li><b>TÜFE'ye endeksli anüite devlet tahvilleri:<\/b> parçalı itfanın en sofistike örneği; <b>reel taksit sabit<\/b>, nominal ödeme enflasyonla artar. Sigorta ve emeklilik şirketlerinin yıllık gelir sigortası yükümlülükleri için; genellikle <b>30 yıl vadeli, 3 ayda bir<\/b> ödemeli; deflasyona karşı getiri garantisi var; Hazine talep toplayarak <b>doğrudan satış<\/b>la ihraç eder.<\/li>\n<\/ul>\n", "sorular": [{"q": "Borçlanma Araçları Tebliği'ne göre finansman bonosunun vadesi hangi aralıkta olmalıdır?", "o": ["30 günden az olmayan ve 364 günü aşmayan", "1 günden 364 güne kadar", "30 günden 365 güne kadar", "90 günden 364 güne kadar", "7 günden 180 güne kadar"], "a": 0, "e": "Finansman bonosu 30 günden az olmayan ve 364 günü aşmayan vadeli araçtır; 365 gün ve üzeri tahvildir."}, {"q": "Esas sözleşmesinde borçlanma aracı ihracı konusunda yönetim kuruluna yetki verilmemiş bir anonim ortaklıkta tahvil ihracı kararını hangi organ almalıdır?", "o": ["Yönetim kurulu", "Genel kurul", "Sermaye Piyasası Kurulu", "Denetimden sorumlu komite", "Genel müdür"], "a": 1, "e": "TTK'ya göre kural genel kuruldur; SPKn m.31 uyarınca yetki ancak esas sözleşmede açıkça yazılırsa yönetim kuruluna devredilmiş olur."}, {"q": "Halka açık bir ortaklığın özkaynağı 800 milyon TL'dir. Tedavülde 600 milyon TL nominal tahvili, ihraç tavanı kapsamında henüz satılmamış 400 milyon TL bonosu vardır. Ortaklığın kalan ihraç limiti kaç TL'dir?", "o": ["1,4 milyar TL", "2,4 milyar TL", "3 milyar TL", "3,4 milyar TL", "4 milyar TL"], "a": 2, "e": "Limit özkaynağın 5 katı yani 4 milyar TL'dir. Tedavüldeki 600 milyon ve satılmamış 400 milyon düşülür: 4 - 1 = 3 milyar TL."}, {"q": "Halka açık olmayan bir ortaklığın özkaynağı 250 milyon TL'dir ve tedavülde borçlanma aracı yoktur. Azami ihraç limiti kaç TL'dir?", "o": ["250 milyon TL", "500 milyon TL", "1 milyar TL", "750 milyon TL", "1,25 milyar TL"], "a": 3, "e": "Halka açık olmayan ortaklıklarda limit özkaynağın 3 katıdır: 250 x 3 = 750 milyon TL. 1,25 milyar 5 kat çarpanının hatalı kullanımıdır."}, {"q": "Talebe bağlı derecelendirmede yatırım yapılabilir seviyenin en yüksek ilk üç kademesine denk gelen uzun vadeli not alan halka açık bir bankanın özkaynağı 200 milyon TL'dir. Bankanın hesaplanan ihraç limiti kaç TL olur?", "o": ["1 milyar TL", "1,2 milyar TL", "1,5 milyar TL", "600 milyon TL", "2 milyar TL"], "a": 4, "e": "Halka açık banka için limit 5 x 200 = 1 milyar TL'dir; ilk üç kademe not alan bankalarda limit yüzde 100 artırılır, sonuç 2 milyar TL."}, {"q": "Borçlanma aracı ihracına ilişkin yetkili organ kararının alınmasından itibaren Kurula en geç ne kadar sürede başvurulmalıdır?", "o": ["1 yıl", "30 gün", "3 ay", "6 ay", "2 yıl"], "a": 0, "e": "Yetkili organ kararından itibaren en geç bir yıl içinde Kurula başvurulmalıdır; bu zorunluluk yurt dışı ihraçları da kapsar."}, {"q": "Tahsisli satış yöntemiyle ihraç edilen bir tahvili belirli bir anda 145 bireysel yatırımcı ile 40 nitelikli yatırımcı elinde tutmaktadır. Bu durumla ilgili hangisi doğrudur?", "o": ["Toplam 185 kişi olduğu için işlem halka arz sayılır", "Nitelikli yatırımcılar sayılmadığından 150 sınırı aşılmamıştır", "Tahsisli satışta yatırımcı sayısı sınırı yoktur", "Sınır 100 kişi olduğundan izahname hazırlanmalıdır", "Yatırımcı sayısı yalnız ilk satışta kontrol edilir"], "a": 1, "e": "Tahsisli satışta belirli bir anda yatırımcı sayısı 150'yi geçemez ve bu hesapta nitelikli yatırımcılar dikkate alınmaz; 145 kişi sınırın altındadır."}, {"q": "Tahsisli olarak satılan borçlanma araçlarını elinde tutan yatırımcı sayısının 150'yi aştığı tespit edildiğinde aşağıdakilerden hangisi gerçekleşir?", "o": ["İhraç kendiliğinden iptal olur", "Fazla yatırımcıların payları ihraççı tarafından geri alınır", "İşlem halka arz sayılır; MKK derhal ihraççıya ve Kurula bildirir, ihraççı izahname hazırlayıp borsada işlem görme başvurusu yapar", "Takasbank araçları bloke eder", "Araçlar Nitelikli Yatırımcıya İhraç Pazarı'na aktarılır"], "a": 2, "e": "150'nin aşılması Kanun gereği halka arz sayılır; MKK tespit edip ihraççıya ve Kurula bildirir, ihraççı izahname ve borsa başvurusu yapar."}, {"q": "Halka arz edilmeksizin satılacak borçlanma araçları için Kurulca onaylanan ihraç belgesi, onay tarihinden itibaren ne kadar süre içinde yapılacak ihraçlar için geçerlidir?", "o": ["3 ay", "6 ay", "2 yıl", "1 yıl", "Süresiz"], "a": 3, "e": "İhraç belgesi onaylandığı tarihten itibaren bir yıl içinde yapılacak ihraçlar için geçerliliğini korur."}, {"q": "Yurt dışında ihraç edilen borçlanma araçlarına ilişkin ihraç tutarı, vade, faiz, ISIN kodu ve saklamacı bilgileri satışın tamamlanmasından itibaren MKK'ya ne kadar sürede iletilmelidir?", "o": ["Derhal", "1 iş günü", "2 iş günü", "10 iş günü", "3 iş günü"], "a": 4, "e": "Yurt dışı ihraç bilgileri satışın tamamlanmasını izleyen üç iş günü içinde MKK'ya iletilir; erken itfa dahil değişiklikler de üç iş gününde bildirilir."}, {"q": "Borçlanma aracı ihraççılarının KAP'ta genel bilgi formu yayımlama yükümlülüğü ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Halka arz edenler ve nitelikli yatırımcıya satanlar doldurur; yalnız tahsisli satış yapanlar muaftır", "Yalnız halka arz edenler formu doldurur", "Tüm ihraççılar istisnasız doldurur", "Yalnız tahsisli satış yapanlar doldurur", "Hiçbir borçlanma aracı ihraççısı doldurmaz"], "a": 0, "e": "Genel bilgi formu halka arz ve nitelikli yatırımcıya satış yapanlar için zorunludur, değişiklik en geç 2 iş gününde güncellenir; yalnızca tahsisli ihraç yapanlar istisnadır."}, {"q": "Borçlanma araçlarını yalnızca nitelikli yatırımcılara satmış bir ihraççıda bir yatırımcının sermaye payı yüzde 18'den yüzde 27'ye yükselmiştir. Aynı yatırımcı halka arz yoluyla ihraç yapmış başka bir ihraççıda payını yüzde 9'dan yüzde 11'e çıkarmıştır. Hangi durumlarda bildirim gerekir?", "o": ["Yalnız birinci ihraççıda", "Her iki ihraççıda", "Yalnız ikinci ihraççıda", "Hiçbirinde", "Yalnız yüzde 33 aşıldığında"], "a": 1, "e": "Nitelikli satış yapan ihraççıda eşikler %25, %50, %67'dir; %25 aşıldı. Halka arz yapan ihraççıda %5, %10, %15 gibi eşikler vardır; %10 aşıldı. İkisinde de bildirim gerekir."}, {"q": "Borçlanma araçlarını yalnızca tahsisli satış yöntemiyle ihraç etmiş bir şirketin genel müdürü değişmiştir. Bu durumla ilgili hangisi doğrudur?", "o": ["İçsel bilgi olarak derhal açıklanmalıdır", "İki iş günü içinde genel bilgi formunda güncellenmelidir", "Tebliğ m.21'de sayılmadığı için açıklama zorunluluğu yoktur", "Yalnız Kurula bildirilir", "BASK onayı gerekir"], "a": 2, "e": "Halka arz edilmeksizin satış yapan ihraççılar içsel bilgi hükümlerinden muaftır ve yalnız m.21'deki olayları açıklar; idari sorumlu değişikliği halka arz ihraççısı için açıklanır."}, {"q": "Aşağıdakilerden hangisi satış yöntemi ne olursa olsun tüm borçlanma aracı ihraççılarının açıklamakla yükümlü olduğu olaylardan biri değildir?", "o": ["Kupon ödemesinde temerrüt", "İhraç tavanı alınması", "Derecelendirme notunda değişiklik", "Aktif toplamının belirli oranını aşan maddi duran varlık alımı", "İhraç koşullarının yatırımcı aleyhine değişmesi"], "a": 3, "e": "Önemli maddi duran varlık alım-satımı m.21 kapsamında değildir; yalnız halka arz ihraççısının içsel bilgi yükümlülüğüne girer."}, {"q": "Tedavüldeki nominal tutarı 120 milyon TL olan bir tertibin 15 milyon TL'lik kısmı ihraççının ilişkili tarafındadır. Yeniden yapılandırma için Tertip BASK kararının alınabilmesi için asgari kaç TL nominal tutarın olumlu oyu gerekir?", "o": ["60 milyon TL", "80 milyon TL", "52,5 milyon TL", "105 milyon TL", "70 milyon TL"], "a": 4, "e": "İlişkili taraftaki 15 milyon nisaba katılmaz; oy hakkı olan 105 milyonun üçte ikisi 70 milyon TL'dir. 80 milyon, ilişkili taraf düşülmeden yapılan hesaptır."}, {"q": "Tertip BASK'ta alınan kararın geçerlilik kazanması için ihraççının yönetim kurulunca en geç ne zamana kadar onaylanması gerekir?", "o": ["Toplantıdan itibaren 3 iş günü içinde", "Toplantı günü", "Toplantıdan itibaren 10 iş günü içinde", "İlk genel kurulda", "Toplantıdan itibaren 30 gün içinde"], "a": 0, "e": "Tertip BASK kararları toplantı tarihinden itibaren en geç üç iş günü içinde ihraççı yönetim kurulunca onaylanmalıdır."}, {"q": "Bir Tertip BASK kararının haklarını olumsuz etkilediğini düşünen diğer tertip sahiplerinin Genel BASK'ın toplanmasını talep edebilmesi için tedavüldeki toplam tutarın asgari ne kadarına sahip olmaları gerekir?", "o": ["Yüzde 5", "Yüzde 20", "Yüzde 10", "Yüzde 33", "Yarısından fazlası"], "a": 1, "e": "Tedavüldeki toplam tutarın yüzde yirmisine sahip diğer tertip sahipleri Genel BASK talep edebilir; Genel BASK üçte iki çoğunlukla reddederse karar yürürlüğe girmez."}, {"q": "Temerrüt sonrasında BASK kararıyla borçlanma aracının yeniden yapılandırılmasının sonuçlarıyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Temerrüt nedeniyle başlatılan icra takipleri durur", "İhtiyati haciz kararları uygulanmaz", "Yapılandırma kararı ihraççının iflasını kendiliğinden sona erdirir ve borcu siler", "Takiple kesilebilen zamanaşımı süreleri işlemez", "Yapılandırılmış borçlar ifa edildikten sonra duran takipler düşer"], "a": 2, "e": "Yapılandırma takipleri durdurur, tedbir ve hacizleri uygulanmaz kılar, süreleri işletmez; borç ifa edilince takipler düşer. Borcun silinmesi gibi bir sonuç yoktur."}, {"q": "Yalnızca nitelikli yatırımcılara satılmak üzere ihraç edilip Borsa İstanbul'da kote ettirilen özel sektör tahvili ile ilgili hangisi doğrudur?", "o": ["Kotasyondan sonra tüm yatırımcılar alabilir", "İkincil işlemler Nitelikli Yatırımcıya İhraç Pazarı'nda yapılır", "Borsada işlem görmesi zorunludur", "İkincil işlemler Kesin Alım Satım Pazarı'nda yapılır ve nitelikli yatırımcı kısıtı devam eder", "Yalnız TCMB ile işlem yapılabilir"], "a": 3, "e": "Nitelikli Yatırımcıya İhraç Pazarı yalnız birincil satış penceresidir; ikincil işlemler Kesin Alım Satım Pazarı'nda olur ve sistem nitelikli olmayanların emrini engeller."}, {"q": "Projesi ancak üçüncü yıldan sonra nakit üretecek bir şirket için balon ödemeli tahvil ihracının banka kredisine göre temel avantajı nedir?", "o": ["Faiz ödemesi hiç yapılmaz", "Kurul ücreti ve derecelendirme maliyeti yoktur", "Kredi riskini tamamen ortadan kaldırır", "Mutlaka teminatlı olduğundan faizi düşüktür", "Anapara vade sonunda tek seferde ödendiği için ara dönemde anapara çıkışı olmaz"], "a": 4, "e": "Tahvilde çoğunlukla yalnız kupon ödenir, anapara vade sonunda tek seferde ödenir; bu, nakit akışı geç başlayan projelerle uyumludur. Ek ihraç maliyetleri ise vardır."}, {"q": "Sermaye benzeri borçlanma araçlarıyla ilgili hangisi doğrudur?", "o": ["Diğer borçlanma araçlarından sonra, pay sahiplerinden önce gelir ve daha yüksek kupon sunma eğilimindedir", "Tasfiyede tüm borçlanma araçlarından önce ödenir", "Pay sahiplerinden sonra ödenir", "Vadesiz ihraç edilemez", "Yalnız Hazine tarafından ihraç edilir"], "a": 0, "e": "Bu araçlar tasfiyede diğer tüm borçlanma araçlarından sonra, pay sahiplerinden önce gelir; ilave risk nedeniyle kuponları daha yüksektir."}, {"q": "Nominal değeri 100 TL, yıllık kupon oranı yüzde 14 olan ve kuponunu üç ayda bir ödeyen tahvili 92 TL'den alan yatırımcı her kupon döneminde kaç TL alır?", "o": ["3,22 TL", "3,50 TL", "7,00 TL", "14,00 TL", "12,88 TL"], "a": 1, "e": "Kupon piyasa fiyatı üzerinden değil nominal değer üzerinden hesaplanır: 100 x 0,14 / 4 = 3,50 TL. 3,22 TL fiyat üzerinden yapılan hatalı hesaptır."}]}, {"id": 7, "kisa": "Tahvil Fiyatı ve Getiri", "baslik": "Tahvil Fiyatlama, Getiri Ölçütleri ve Risk-Getiri İlişkisi", "ozet": "Temiz ve kirli fiyat, işlemiş faiz, kuponsuz senet fiyatı, basit ve bileşik faiz, nominal-cari-vadeye kadar getiri, Fisher denklemi, mevduat eşleniği, baz puan, risk primleri ve durasyon.", "notlar": "\n<h3>Temiz fiyat, kirli fiyat, işlemiş faiz<\/h3>\n<ul>\n<li>İki kupon tarihi arasında el değiştiren tahvilde, satıcının elde tuttuğu süreye düşen faiz alıcıdan tahsil edilir: <b>işlemiş (birikmiş) faiz<\/b>.<\/li>\n<li><b>Kirli fiyat<\/b> = temiz fiyat + işlemiş faiz; <b>takasta ödenen<\/b> fiyattır. <b>Temiz fiyat<\/b> birikmiş faizden arındırılmış, arz-talep ve faiz beklentisiyle oluşan çıplak değerdir; ekranda görülen fiyattır.<\/li>\n<li><b>Testere dişi modeli:<\/b> piyasa koşulları değişmezse temiz fiyat yatay; kirli fiyat her dönem başında temiz fiyattan başlayıp doğrusal yükselir, kupon günü dikey olarak temiz fiyata düşer. Bu yüzden <b>analizde temiz fiyat, takasta kirli fiyat<\/b> kullanılır.<\/li>\n<li><b>Kuponsuz senetlerde<\/b> işlemiş faiz sıfırdır, temiz fiyat = kirli fiyat; grafik testere dişi çizmez, vadeye doğru nominale (100 TL) yaklaşır.<\/li>\n<li><b>Gün sayımı:<\/b> DİBS ve özel sektör tahvillerinde <b>Gerçek/Gerçek (ACT/ACT)<\/b>; gün sayısı fiili takvim günü, yıl dönemine göre 365 veya 366. Hesap <b>son kupon tarihinden takas tarihine<\/b> kadar yapılır; son kupon günü dahil, <b>takas günü hariç<\/b>.<\/li>\n<li>Formül: İşlemiş faiz = Nominal x Yıllık kupon oranı x Gün sayısı / 365.<\/li>\n<li>Kitap örneği: 100 TL, %6 kupon (1 Haziran ve 1 Aralık), takas 19 Eylül → 30 + 31 + 31 + 18 = 110 gün; 100 x 0,06 x 110 / 365 = <b>1,81 TL<\/b>. 1 Aralık'ta alınan 3 TL'lik kuponun 1,81 TL'si ödenen faizin geri dönüşü, 1,19 TL'si alıcının kendi dönem geliridir.<\/li>\n<\/ul>\n<h3>Kuponsuz senet fiyatlaması<\/h3>\n<ul>\n<li>Hazine bonoları ve finansman bonolarında çoğunlukla kuponsuz ihraç. Yatırımcı nominalin altında alır, vadede nominali alır.<\/li>\n<li>Türkiye'de <b>Gerçek gün/365<\/b> ve <b>basit faiz<\/b> esastır: Fiyat = Nominal / [1 + basit faiz x (vadeye kalan gün / 365)].<\/li>\n<li>Kitap örneği: 180 gün, %20 → 100 / (1 + 0,20 x 180/365) = <b>91,02 TL<\/b>; 8,98 TL fark 180 günlük getiridir.<\/li>\n<li>Dikkat: Fiyatı nominalden faiz düşerek (100 x (1 - r x t)) bulmak yanlıştır; formül bölme işlemidir.<\/li>\n<\/ul>\n<h3>Basit faiz ve bileşik faiz<\/h3>\n<ul>\n<li>Fark <b>yeniden yatırım varsayımı<\/b>na dayanır: basit faiz kuponların atıl beklediğini, bileşik faiz her kuponun aynı oranla hemen yeniden yatırıldığını (faizin faiz kazandığını) varsayar.<\/li>\n<li><b>Yıllık basit faiz<\/b> = dönemsel getiri x yıllık kupon sayısı (piyasa kotasyonlarında kullanılan \"tabela faizi\").<\/li>\n<li><b>Yıllık bileşik (efektif) faiz<\/b> = (1 + dönemsel getiri)<sup>kupon sayısı<\/sup> - 1.<\/li>\n<li>Ödeme sıklığı arttıkça, basit faiz sabitken efektif getiri yükselir.<\/li>\n<\/ul>\n<table>\n<tr><th>Sıklık (basit %20)<\/th><th>Dönemsel<\/th><th>Efektif<\/th><th>Fark<\/th><\/tr>\n<tr><td>Yılda 1<\/td><td>%20<\/td><td>%20,00<\/td><td>0<\/td><\/tr>\n<tr><td>6 ayda bir<\/td><td>%10<\/td><td>%21,00<\/td><td>+100 bp<\/td><\/tr>\n<tr><td>3 ayda bir<\/td><td>%5<\/td><td>%21,55<\/td><td>+155 bp<\/td><\/tr>\n<tr><td>Aylık<\/td><td>%1,66<\/td><td>%21,94<\/td><td>+194 bp<\/td><\/tr>\n<tr><td>Günlük (repo)<\/td><td>%0,05<\/td><td>%22,13<\/td><td>+213 bp<\/td><\/tr>\n<\/table>\n<ul><li>Analizde yanıltıcı olabilen basit faiz yerine nakit akış sıklığını da fiyatlayan <b>bileşik faiz<\/b> kullanılmalıdır.<\/li><\/ul>\n<h3>Getiri ölçütleri<\/h3>\n<ul>\n<li>Toplam kazanç = kupon geliri + alış fiyatı ile vadede alınan nominal arasındaki fark (sermaye kazancı/kaybı).<\/li>\n<li><b>Nominal getiri<\/b> = yıllık kupon / nominal değer. Kupon oranına eşittir; piyasa fiyatından etkilenmez, maliyeti dikkate almaz.<\/li>\n<li><b>Cari getiri<\/b> = yıllık kupon / güncel piyasa fiyatı. Örnek: %20 kupon, fiyat 80 → 20/80 = %25. Vade sonu sermaye kazancını ve yeniden yatırımı dikkate almaz.<\/li>\n<li><b>Vadeye kadar getiri (YTM):<\/b> tüm kupon ve anapara akışlarının bugünkü değerini piyasa fiyatına eşitleyen iskonto oranı; <b>iç verim oranı (IRR)<\/b>. Fiyat = Σ Kupon/(1+r)<sup>t<\/sup> + Nominal/(1+r)<sup>n<\/sup>. En kapsamlı ölçüttür; \"vadeye kadar tutarsam yıllık bileşik ne kazanırım\" sorusunun cevabıdır.<\/li>\n<li>YTM'nin iki varsayımı: tahvil <b>vadeye kadar elde tutulur<\/b>; kuponlar <b>YTM oranıyla yeniden yatırılır<\/b>.<\/li>\n<li><b>Yeniden yatırım riski:<\/b> faizler düşerse kuponlar daha düşük oranla değerlendirilir; yüksek kuponlu ve uzun vadeli tahvillerde belirgindir; <b>kuponsuz<\/b> tahvilde ara nakit akışı olmadığından <b>yoktur<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Fiyat durumu<\/th><th>Sıralama<\/th><\/tr>\n<tr><td>İskontolu (fiyat &lt; 100)<\/td><td>YTM &gt; Cari getiri &gt; Nominal getiri<\/td><\/tr>\n<tr><td>Başabaş (fiyat = 100)<\/td><td>YTM = Cari getiri = Nominal getiri<\/td><\/tr>\n<tr><td>Primli (fiyat &gt; 100)<\/td><td>Nominal getiri &gt; Cari getiri &gt; YTM<\/td><\/tr>\n<\/table>\n<h3>Enflasyon ve reel getiri (Fisher)<\/h3>\n<ul>\n<li>Reel getiri = (1 + nominal getiri) / (1 + enflasyon) - 1.<\/li>\n<li>Doğrusal yaklaşım r ≈ i - π düşük enflasyonda kullanılır; yüksek enflasyonda reel getiriyi <b>olduğundan yüksek<\/b> gösterir. Örnek: i %50, π %40 → doğrusal %10, Fisher 1,50/1,40 - 1 = <b>%7,14<\/b>.<\/li>\n<li><b>Beklenen reel getiri<\/b> beklenen enflasyonla, <b>gerçekleşen reel getiri<\/b> gerçekleşen enflasyonla hesaplanır. Sabit kuponlu tahvilde gerçekleşen enflasyon beklenenden yüksekse reel getiri beklenenin altında kalır: <b>enflasyon riski<\/b>.<\/li>\n<\/ul>\n<h3>Net getiri ve mevduat eşleniği<\/h3>\n<ul>\n<li>Kotasyonlar brüttür; karar verici olan <b>net<\/b> (vergi sonrası) getiridir.<\/li>\n<li>Net getiri = Brüt faiz x (1 - stopaj oranı).<\/li>\n<li>Mevduat eşleniği = Net getiri / (1 - mevduat stopaj oranı): vergi avantajlı aracın net getirisini sağlamak için mevduatın sunması gereken brüt faiz.<\/li>\n<li>Kitap örneği: %0 stopajlı %40 bono, %20 stopajlı mevduat → 0,40 / 0,80 = <b>%50<\/b>. %48'lik mevduatın neti %38,40'ta kalır; bono tercih edilir.<\/li>\n<\/ul>\n<h3>Baz puan<\/h3>\n<ul>\n<li><b>1 baz puan = %0,01<\/b> (on binde bir); 100 baz puan = %1. %4,50 ile %4,90 arasındaki fark 40 bp.<\/li>\n<li>\"Faiz %10'dan %11'e çıktı\" yerine \"100 baz puan arttı\" denir; risk primleri (spread) de baz puanla ifade edilir.<\/li>\n<\/ul>\n<h3>Risk-getiri ilişkisi ve fiyatın nominalden sapması<\/h3>\n<ul>\n<li>Tahvil fiyatı, nakit akışlarının <b>cari piyasa faiziyle<\/b> bugüne indirgenmiş değeridir. Faiz ile fiyat <b>ters yönlü<\/b> hareket eder.<\/li>\n<li>Kupon &lt; piyasa faizi → <b>iskontolu<\/b>; kupon &gt; piyasa faizi → <b>primli<\/b>; kupon = piyasa faizi → <b>başabaş<\/b> (ihraç günü tipik).<\/li>\n<li>Talep edilen getirinin üç bileşeni: <b>faiz oranı riski<\/b> (ihraççıdan bağımsız, tüm sabit getirilileri etkiler), <b>kredi riski<\/b> (ödeyememe olasılığı; not düşerse prim artar, fiyat düşer), <b>likidite riski<\/b> (adil fiyattan nakde çevirememe; alış-satış marjının açılmasıyla görülür).<\/li>\n<li>Beklenen getiri = piyasa faiz oranı + kredi risk primi + likidite risk primi. Örnek: 2 yıllık DİBS %25, kredi primi %4, likidite primi %1 → %30.<\/li>\n<li>Aynı not ve vadedeki iki tahvilden <b>daha az işlem göreni daha yüksek getiri ve daha düşük fiyatla<\/b> işlem görür.<\/li>\n<li><b>Gösterge tahvil (on-the-run):<\/b> Hazine'nin en son ihraç ettiği, referans vadedeki (ör. 2 ve 10 yıl) tahviller; piyasa yapıcı kotasyonlu, hacmi yüksek, marjı dar. <b>Off-the-run:<\/b> eski veya vadesi yaklaşan tahviller; aynı kredi riskine rağmen likiditesi düşük.<\/li>\n<li>Devlet tahvilleri vergi ve para basma yetkisi nedeniyle kredi riski bakımından risksiz kabul edilir.<\/li>\n<\/ul>\n<h3>Piyasa faizleri nasıl değişir?<\/h3>\n<ul>\n<li><b>Kısa vade:<\/b> en belirleyici aktör merkez bankası; politika faizi ve likidite koşulları gecelik ve kısa vadeli faizlere hızla yansır.<\/li>\n<li><b>Uzun vade:<\/b> merkez bankası etkisi dolaylı; enflasyon ve büyüme beklentileri, para politikasının gelecek seyri, <b>ülke risk primi<\/b> (kamu maliyesi, dış borç, kredi notu) ve <b>küresel finansal koşullar<\/b> belirleyicidir. Not düşüşü faizi artırır.<\/li>\n<\/ul>\n<h3>Durasyon<\/h3>\n<ul>\n<li><b>Durasyon:<\/b> nakit akışlarının bugünkü değerleriyle ağırlıklandırılmış ortalama vadesi; aynı zamanda faiz duyarlılığı ölçüsü. Yüksek durasyon = yüksek faiz riski.<\/li>\n<li>Belirleyiciler: <b>vade<\/b> (uzadıkça durasyon artar), <b>kupon<\/b> (ters yönlü; yüksek kupon düşük durasyon; kuponsuz tahvilde durasyon yüksektir), <b>YTM<\/b> (ters yönlü; yüksek faiz ortamında durasyon kısalır).<\/li>\n<li><b>Düzeltilmiş durasyon:<\/b> faizde %1'lik (100 bp) değişimin fiyatta yaklaşık yüzde kaç değişim yaratacağını gösterir; doğrusal varsayım. Büyük faiz hareketlerinde eğriliği yakalayan <b>konveksite<\/b> de gerekir.<\/li>\n<\/ul>\n", "sorular": [{"q": "Nominal değeri 100 TL, yıllık kupon oranı yüzde 8 olan ve kuponlarını 1 Mart ile 1 Eylül'de ödeyen bir tahvilin takası 15 Mayıs'ta yapılmaktadır. Gerçek/Gerçek yöntemiyle (yıl 365 gün) tahvil başına işlemiş faiz yaklaşık kaç TL'dir?", "o": ["1,64 TL", "1,62 TL", "1,67 TL", "3,29 TL", "4,00 TL"], "a": 0, "e": "Son kupon günü dahil, takas günü hariç: Mart 31 + Nisan 30 + Mayıs 14 = 75 gün. 100 x 0,08 x 75/365 = 1,64 TL. 1,67 TL takas gününü de saymanın sonucudur."}, {"q": "Nominal değeri 50.000 TL, yıllık kupon oranı yüzde 18 olan bir tahvilin son kupon tarihi ile takas tarihi arasında 146 gün vardır. Alıcının satıcıya ödeyeceği işlemiş faiz kaç TL'dir?", "o": ["1.800 TL", "3.600 TL", "3.240 TL", "4.500 TL", "9.000 TL"], "a": 1, "e": "50.000 x 0,18 x 146/365 = 9.000 x 0,40 = 3.600 TL."}, {"q": "Takas işlemlerinde esas alınan ve işlemiş faizi de içeren fiyat hangisidir?", "o": ["Temiz fiyat", "Nominal değer", "Kirli fiyat", "İtfa fiyatı", "Gösterge fiyat"], "a": 2, "e": "Kirli fiyat temiz fiyata işlemiş faiz eklenerek bulunur ve takasta ödenen tutardır; analizde temiz fiyat kullanılır."}, {"q": "Testere dişi modeliyle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Temiz fiyat her gün doğrusal artar, kupon günü düşer", "Kuponsuz senetlerde testere dişi en belirgin şekilde görülür", "Analizlerde kirli fiyat kullanılması esastır", "Kirli fiyat dönem içinde doğrusal artar ve kupon ödeme günü temiz fiyat seviyesine düşer", "İşlemiş faiz kupon günü en yüksek seviyesinden yeniden başlar"], "a": 3, "e": "Piyasa koşulları değişmezse temiz fiyat yataydır; kirli fiyat işlemiş faizle doğrusal artar, kupon ödenince temiz fiyata iner. Kuponsuz senetlerde işlemiş faiz yoktur."}, {"q": "Vadesine 73 gün kalmış, nominali 100 TL olan bir hazine bonosu yıllık yüzde 30 basit faizle işlem görmektedir. Gerçek gün/365 yöntemine göre bononun fiyatı yaklaşık kaçtır?", "o": ["76,92 TL", "94,00 TL", "94,89 TL", "106,00 TL", "94,34 TL"], "a": 4, "e": "Fiyat = 100 / (1 + 0,30 x 73/365) = 100 / 1,06 = 94,34 TL. 94,00 TL faizi nominalden düşmenin, 76,92 TL dönemi hesaba katmamanın sonucudur."}, {"q": "Kuponsuz senetlerde temiz fiyat ile kirli fiyat arasındaki ilişki nasıldır?", "o": ["İkisi birbirine eşittir, çünkü işlemiş faiz sıfırdır", "Kirli fiyat her zaman temiz fiyattan yüksektir", "Temiz fiyat kirli fiyattan yüksektir", "Fark vadeye kalan gün sayısı kadardır", "Fark yalnız vade sonunda oluşur"], "a": 0, "e": "Dönemsel kupon olmadığından birikmiş faiz yoktur; temiz fiyat kirli fiyata eşittir."}, {"q": "Yıllık basit faizi yüzde 24 olan ve faizini üç ayda bir ödeyen bir bononun yıllık bileşik (efektif) getirisi yaklaşık yüzde kaçtır?", "o": ["%24,00", "%26,25", "%25,44", "%26,82", "%27,10"], "a": 1, "e": "Dönemsel getiri 24/4 = %6; (1,06)^4 - 1 = %26,25. %25,44 altı ayda bir, %26,82 aylık ödemenin efektif getirisidir."}, {"q": "Basit faizi aynı olan iki tahvilden kuponunu daha sık ödeyenin efektif getirisinin daha yüksek olmasının nedeni hangi varsayımdır?", "o": ["Vadeye kadar elde tutma varsayımı", "Risksiz faiz varsayımı", "Yeniden yatırım varsayımı", "Başabaş fiyat varsayımı", "Sabit enflasyon varsayımı"], "a": 2, "e": "Bileşik faiz her kuponun aynı oranla hemen yeniden yatırıldığını varsayar; kupon sıklığı arttıkça faizin faiz kazanma etkisi büyür."}, {"q": "Nominal değeri 100 TL ve yıllık kupon oranı yüzde 15 olan bir tahvil piyasada 120 TL'den işlem görmektedir. Cari getirisi yüzde kaçtır?", "o": ["%10,0", "%15,0", "%18,0", "%12,5", "%20,0"], "a": 3, "e": "Cari getiri = yıllık kupon / piyasa fiyatı = 15/120 = %12,5. %15 nominal getiridir."}, {"q": "Nominal değerinin üzerinde (primli) alınan bir tahvil için getiri ölçütlerinin doğru sıralaması hangisidir?", "o": ["YTM > Cari getiri > Nominal getiri", "Cari getiri > Nominal getiri > YTM", "YTM = Cari getiri = Nominal getiri", "Nominal getiri > YTM > Cari getiri", "Nominal getiri > Cari getiri > YTM"], "a": 4, "e": "Primli alınan tahvilde vade sonunda sermaye kaybı oluşur; sıralama Nominal > Cari > YTM'dir. İskontoluda tam tersidir."}, {"q": "Vadesine bir yıl kalan, nominali 100 TL, yıllık kuponu 10 TL olan ve vade sonunda son kuponla birlikte anaparasını ödeyecek bir tahvil 95 TL'dir. Vadeye kadar getirisi yaklaşık yüzde kaçtır?", "o": ["%15,79", "%10,00", "%10,53", "%15,00", "%5,26"], "a": 0, "e": "95 = 110 / (1 + r) → r = 110/95 - 1 = %15,79. %10,53 yalnız cari getiridir (10/95); sermaye kazancı dahil edilmemiştir."}, {"q": "Vadeye kadar getirinin (YTM) dayandığı varsayımlar hangileridir?", "o": ["Tahvil her yıl satılır ve kuponlar harcanır", "Tahvil vadeye kadar tutulur ve kuponlar YTM oranıyla yeniden yatırılır", "Kuponlar risksiz faizle yatırılır ve tahvil başabaştır", "Enflasyon sıfırdır ve tahvil kuponsuzdur", "Faiz oranları vade boyunca yükselir"], "a": 1, "e": "YTM iki varsayıma dayanır: vadeye kadar elde tutma ve kuponların aynı (YTM) oranıyla yeniden yatırılması."}, {"q": "Aşağıdaki tahvillerden hangisinde yeniden yatırım riski yoktur?", "o": ["Yüksek kuponlu uzun vadeli tahvil", "Üç ayda bir kupon ödeyen değişken faizli tahvil", "Kuponsuz (iskontolu) tahvil", "Altı ayda bir kupon ödeyen eurotahvil", "Dengeli borç servisli anüite tahvili"], "a": 2, "e": "Kuponsuz tahvilde ara nakit akışı olmadığı için yeniden yatırım riski yoktur; risk yüksek kuponlu uzun vadelilerde belirgindir."}, {"q": "Bir tahvilin nominal getirisi yüzde 60, beklenen enflasyon yüzde 45'tir. Fisher denklemine göre beklenen reel getiri yaklaşık yüzde kaçtır?", "o": ["%15,00", "%9,38", "%13,04", "%10,34", "%33,33"], "a": 3, "e": "1,60 / 1,45 - 1 = %10,34. Doğrusal yaklaşım (%15) yüksek enflasyonda reel getiriyi olduğundan yüksek gösterir."}, {"q": "Sabit kuponlu bir tahvilde vade boyunca gerçekleşen enflasyon beklenen enflasyondan yüksek çıkarsa ne olur?", "o": ["Gerçekleşen reel getiri beklenenin üzerine çıkar", "Nominal getiri artar", "Kupon oranı otomatik güncellenir", "Reel getiri değişmez", "Gerçekleşen reel getiri beklenenin altında kalır"], "a": 4, "e": "Gerçekleşen enflasyon beklenenden yüksekse gerçekleşen reel getiri beklenenin altında kalır; buna enflasyon riski denir."}, {"q": "Stopajı yüzde 0 olan ve yıllık yüzde 30 brüt faiz sunan bir hazine bonosunun, yüzde 17,5 stopaja tabi vadeli mevduat karşısındaki mevduat eşleniği yaklaşık yüzde kaçtır?", "o": ["%36,36", "%30,00", "%35,25", "%24,75", "%47,50"], "a": 0, "e": "Net getiri %30; mevduat eşleniği 0,30 / (1 - 0,175) = 0,30 / 0,825 = %36,36. %35,25 stopajı yanlış yönde eklemenin sonucudur."}, {"q": "Brüt yüzde 40 faiz veren ve yüzde 17,5 stopaja tabi bir mevduatın net getirisi yüzde kaçtır?", "o": ["%22,50", "%33,00", "%34,04", "%40,00", "%47,00"], "a": 1, "e": "Net getiri = 0,40 x (1 - 0,175) = %33,00."}, {"q": "Bir tahvilin getirisi yüzde 4,25'ten yüzde 4,80'e yükselmiştir. Bu değişim kaç baz puandır?", "o": ["0,55 baz puan", "5,5 baz puan", "55 baz puan", "550 baz puan", "12,9 baz puan"], "a": 2, "e": "1 baz puan %0,01'dir; 0,55 puanlık fark 55 baz puandır."}, {"q": "Aynı vadeli DİBS getirisi yüzde 28'dir. Bir özel sektör tahvilinde yatırımcı kredi riski için yüzde 3, sınırlı likidite için yüzde 1,5 ek getiri istemektedir. Beklenen getiri yüzde kaçtır?", "o": ["%28,0", "%29,5", "%31,0", "%32,5", "%33,5"], "a": 3, "e": "Beklenen getiri = piyasa faizi + kredi primi + likidite primi = 28 + 3 + 1,5 = %32,5."}, {"q": "Kupon oranı piyasa faiz oranının altında kalan bir tahvil için aşağıdakilerden hangisi doğrudur?", "o": ["Primli işlem görür", "Başabaş işlem görür", "Cari getirisi nominal getirisinden düşüktür", "Yeniden yatırım riski taşımaz", "İskontolu işlem görür ve vadede sermaye kazancı sağlar"], "a": 4, "e": "Kuponu piyasa faizinin altında kalan tahvil ancak nominalin altında alıcı bulur; iskontolu işlem görür ve vadede nominal tahsil edilerek sermaye kazancı oluşur."}, {"q": "Kredi notu ve vadesi aynı olan iki tahvilden ikincil piyasada daha az işlem göreni için hangisi beklenir?", "o": ["Daha yüksek getiri, daha düşük fiyat", "Daha düşük getiri, daha yüksek fiyat", "Aynı getiri, aynı fiyat", "Daha dar alış-satış marjı", "Daha düşük durasyon"], "a": 0, "e": "Likidite riski ilave getiri talebiyle telafi edilir; az işlem gören tahvil daha yüksek getiri ve daha düşük fiyatla işlem görür."}, {"q": "Diğer koşullar sabitken aşağıdakilerden hangisi bir tahvilin durasyonunu artırır?", "o": ["Kupon oranının yükselmesi", "Vadenin uzaması", "Vadenin kısalması", "Vadeye kadar getirinin yükselmesi", "Kuponların daha sık ödenmesi"], "a": 1, "e": "Vade uzadıkça durasyon artar; kupon ve YTM ile durasyon arasında ters ilişki vardır."}, {"q": "Düzeltilmiş durasyon neyi gösterir?", "o": ["Tahvilin kalan gün sayısını", "Kuponların toplam tutarını", "Faizde yüzde 1'lik değişimin fiyatta yol açacağı yaklaşık yüzde değişimi", "Kredi notundaki değişim olasılığını", "Alış-satış marjını"], "a": 2, "e": "Düzeltilmiş durasyon, faizde 100 baz puanlık değişimin fiyatta yaklaşık yüzde kaç değişim yaratacağını gösterir; büyük hareketlerde konveksite de gerekir."}, {"q": "Kısa ve uzun vadeli faizlerin belirleyicileriyle ilgili hangisi doğrudur?", "o": ["Uzun vadeli faizler yalnız politika faizine bağlıdır", "Ülke kredi notu yalnız kısa vadeli faizleri etkiler", "Küresel likidite yerel faizleri etkilemez", "Kısa vadede merkez bankası belirleyiciyken uzun vadede beklentiler, ülke risk primi ve küresel koşullar baskındır", "Kısa vadeli faizler merkez bankası kararlarına duyarsızdır"], "a": 3, "e": "Kısa vadeli faizler politika faizine çok duyarlıdır; uzun vadede enflasyon beklentisi, ülke risk primi ve küresel finansal koşullar belirleyicidir."}]}, {"id": 8, "kisa": "Faiz, Kredi Riski, DİBS", "baslik": "Risksiz Faiz, Kredi Riski, Özel Borçlanma Araçları ve DİBS Piyasası", "ozet": "Risksiz faiz, derecelendirme ve CDS, erken itfa opsiyonları, eurotahvil, STRIP, getiri eğrisi, TLREF ve diğer referans oranlar, TÜFE'ye endeksli tahvil, DİBS ihraç yöntemleri ve piyasa yapıcılığı.", "notlar": "\n<h3>Risksiz faiz oranı<\/h3>\n<ul>\n<li>Kredi riski üstlenmeden, <b>vadeye kadar elde tutma<\/b> koşuluyla beklenen getiri. \"Risksiz\" mutlak güvenlik değil, kredi riskinden arındırılmış teorik referanstır; enflasyon sürprizi, yeniden yatırım, likidite ve politika belirsizliği analiz dışında bırakılır.<\/li>\n<li>Riskli tüm varlıklar için <b>fırsat maliyeti<\/b>dir: Beklenen getiri = Risksiz faiz (nominal) + Risk primi.<\/li>\n<li>En yakın enstrüman <b>yerel para cinsi devlet borçlanma araçları<\/b> (vergi ve para arzı yetkisi). Küresel referans <b>ABD Hazine tahvilleri<\/b>, Türkiye'de <b>TL cinsi DİBS<\/b>.<\/li>\n<li><b>Vade uyumu<\/b> şarttır: 3 aylık işlemde kısa vadeli bono, 5 yıllık projede 5 yıl kalmış tahvil getirisi; birebir vade yoksa <b>interpolasyon<\/b>.<\/li>\n<li><b>Reel risksiz faiz<\/b> doğrudan gözlenmez; en somut göstergesi <b>TÜFE'ye endeksli DİBS<\/b> reel getirileridir.<\/li>\n<\/ul>\n<h3>Kredi riski ve derecelendirme<\/h3>\n<ul>\n<li>Yerel para cinsi devlet borcunda nominal temerrüt riski sıfıra yakındır ama aşırı para basımı <b>enflasyon riskini<\/b> artırır; devlet tahvilleri \"risksiz\" değil <b>\"varsayılan risksiz\"<\/b> (default risk-free) referanstır. Yerel para devlet borçları da derecelendirilir (ABD notu da geçmişte indirilmiştir).<\/li>\n<li>Uluslararası kuruluşlar: Moody's, S&amp;P, Fitch; Türkiye'de ayrıca <b>SPK'ca yetkilendirilmiş<\/b> yerel kuruluşlar.<\/li>\n<li>Notlar statik değildir: not indirimi risk primini artırır, fiyatı düşürür; değişiklikler çoğu zaman önceden fiyatlanır.<\/li>\n<li>İki ana kategori: <b>yatırım yapılabilir<\/b> (Moody's Aaa-Baa3; S&amp;P/Fitch AAA-BBB-) ve <b>spekülatif<\/b> (Ba1 ve altı; BB+ ve altı). Temerrüt: S&amp;P/Fitch'te <b>D<\/b>.<\/li>\n<li>Geçiş katlanarak artan risktir: tarihsel temerrüt olasılığı <b>BBB %0,45<\/b>, <b>BB %1,96<\/b> (yaklaşık 4 kat).<\/li>\n<li><b>Ulusal ölçek<\/b> notları ('tr' veya '(tur)' eki) yalnız Türkiye içindeki ihraççılarla kıyaslar; ulusal AAA alan banka uluslararası ölçekte ülke riski nedeniyle daha düşük not alabilir.<\/li>\n<li>Borçlanma aracını derecelendiren kuruluş, nota esas bilgileri vade boyunca <b>yılda en az bir kez<\/b> gözden geçirmelidir.<\/li>\n<\/ul>\n<table>\n<tr><th>Moody's<\/th><th>S&amp;P/Fitch<\/th><th>Kategori<\/th><\/tr>\n<tr><td>Aaa<\/td><td>AAA<\/td><td>Yatırım yapılabilir, en yüksek<\/td><\/tr>\n<tr><td>Aa1-Aa3<\/td><td>AA+, AA, AA-<\/td><td>Yatırım yapılabilir<\/td><\/tr>\n<tr><td>A1-A3<\/td><td>A+, A, A-<\/td><td>Yatırım yapılabilir<\/td><\/tr>\n<tr><td>Baa1-Baa3<\/td><td>BBB+, BBB, BBB-<\/td><td>Yatırım yapılabilir (en alt)<\/td><\/tr>\n<tr><td>Ba1-Ba3<\/td><td>BB+, BB, BB-<\/td><td>Spekülatif (en üst)<\/td><\/tr>\n<tr><td>B1-B3<\/td><td>B+, B, B-<\/td><td>Spekülatif<\/td><\/tr>\n<tr><td>Caa / Ca / C<\/td><td>CCC / CC / C<\/td><td>Spekülatif<\/td><\/tr>\n<tr><td>-<\/td><td>D<\/td><td>Temerrüt<\/td><\/tr>\n<\/table>\n<h3>Kredi temerrüt takası (CDS)<\/h3>\n<ul>\n<li>İhraç edilmiş menkul kıymet değil, <b>tezgahüstü (OTC)<\/b> işlem gören iki taraflı türev; işlevi sigortaya benzer ama hukuken <b>sigorta değildir<\/b>. Fiilen kurumsal yatırımcılara açıktır.<\/li>\n<li><b>Koruma alıcısı<\/b> dönemsel prim öder; <b>koruma satıcısı<\/b> (yatırım bankaları, hedge fonlar) kredi olayında dayanağı devralır veya kurtarma oranını dikkate alarak kaybı nakden tazmin eder.<\/li>\n<li><b>Kredi olayı:<\/b> temerrüt, alacaklı aleyhine yeniden yapılandırma, ödemelerin askıya alınması gibi sözleşmede tanımlı durumlar.<\/li>\n<li>5 yıllık CDS'in 200 bp fiyatlanması → nominal üzerinden yıllık yaklaşık <b>%2<\/b> koruma maliyeti.<\/li>\n<li>Gelişmiş ülkeler (ABD, Almanya, Japonya) için de CDS vardır. \"Türkiye CDS'i\" Hazine'nin <b>döviz cinsi eurotahvillerini<\/b> referans alır; döviz kazanma kapasitesi ve dış borç çevirme kabiliyetiyle ilişkilidir.<\/li>\n<li><b>Ülke risk tavanı (sovereign ceiling):<\/b> yerleşik şirketler uluslararası piyasada genellikle hazineden daha az riskli kabul edilmez; CDS artışı tüm kurumların döviz borçlanma maliyetini yükseltir.<\/li>\n<li>CDS notlardan <b>daha hızlı<\/b> tepki verir; not değişiklikleri çoğu zaman CDS hareketlerinin ardından gelir (öncü gösterge). En likit vade <b>5 yıl<\/b>; tek bir yılın değil dönemin ortalama primidir.<\/li>\n<\/ul>\n<h3>Erken itfa opsiyonları (Tebliğ m.15)<\/h3>\n<ul>\n<li>Şartlar, tarihler ve fiyatlama esasları ihracın başında izahname veya ihraç belgesinde açıklanır.<\/li>\n<li><b>Geri çağırma (call) opsiyonlu tahvil:<\/b> hak ihraççıda; faizler düşünce borcu kapatıp ucuza yeniden borçlanır. Yatırımcı için <b>yeniden yatırım riski<\/b>; yatırımcı <b>daha yüksek kupon<\/b> ister.<\/li>\n<li><b>Geri satma (put) opsiyonlu tahvil:<\/b> hak yatırımcıda; faizler yükselince kağıdı iade eder. İhraççı için <b>yeniden finansman riski<\/b>; yatırımcı <b>daha düşük kupona<\/b> razı olur.<\/li>\n<li>Kupon sıralaması: <b>Call opsiyonlu &gt; Opsiyonsuz &gt; Put opsiyonlu<\/b>.<\/li>\n<\/ul>\n<h3>Eurotahviller<\/h3>\n<ul>\n<li>İhraççının ülkesi dışındaki piyasada, genellikle yerel para dışında bir dövizle (USD, EUR) ihraç edilen tahvil. \"Euro\" ifadesi Avrupa'yı veya para birimini değil, tek ülke mevzuatına bağlı olmayan uluslararası yapıyı anlatır.<\/li>\n<li>Devlet ve özel sektör ihraç edebilir; Türkiye'de bankalar ve büyük şirketler aktif.<\/li>\n<li>Hukuken genellikle <b>hamiline yazılı küresel senet<\/b>; fiziki dolaşım yok; <b>Euroclear ve Clearstream<\/b> nezdinde saklanır.<\/li>\n<li>Kuponlar çoğunlukla <b>kaynakta vergi kesilmeden brüt<\/b> ödenir; ancak yatırımcının mukim olduğu ülkede (Türkiye'de beyan usulü) vergi doğabilir.<\/li>\n<li>Hazine'nin <b>USD<\/b> eurotahvillerinde kupon genellikle <b>6 ayda bir<\/b>, <b>EUR<\/b> ihraçlarda çoğunlukla <b>yılda bir<\/b>.<\/li>\n<li>İkincil işlemler ağırlıklı olarak küresel <b>OTC<\/b> piyasada; Türkiye'de BAP bünyesinde <b>Eurotahvil Pazarı<\/b> vardır.<\/li>\n<li><b>ICMA<\/b> kuralları; takas çoğunlukla <b>T+2<\/b>; Hazine USD eurotahvillerinde gün sayımı <b>30/360<\/b> (her ay 30 gün, yıl 360 gün).<\/li>\n<li>Fiyatlama: aynı vadeli risksiz getiri (USD için <b>UST<\/b>) + ülke risk primi; ör. \"UST + 200 bp\" (bu farka G-spread denir). Prim; kredi notu, CDS ve likiditeye bağlıdır.<\/li>\n<li>Kur riskine karşı döviz getirisi sunar ama faiz ve risk algısıyla fiyatı dalgalanır.<\/li>\n<li>Örnek (30/360): 100.000 USD, %6 kupon, son kupon 10 Mart, takas 22 Haziran → 20 + 30 + 30 + 22 = 102 gün; 100.000 x 0,06 x 102/360 = 1.700 USD.<\/li>\n<\/ul>\n<h3>STRIP<\/h3>\n<ul>\n<li>Devlet tahvilinin anapara ve kupon ödemelerinin ayrıştırılıp her birinin ayrı menkul kıymet olarak işlem görmesi. Her parça <b>kuponsuz (iskontolu)<\/b> araç gibi kendi vadesi ve fiyatıyla işlem görür, tek nakit akışını temsil eder ve <b>yeniden yatırım riski taşımaz<\/b>.<\/li>\n<li>Borsa İstanbul kodları: <b>T<\/b> tahvilin bütünü (kuponlu), <b>A<\/b> ayrıştırılmış anapara, <b>K<\/b> ayrıştırılmış kupon.<\/li>\n<li>Ödeme tarihi yaklaşan kuponun fiyatı nominal kupon tutarına yaklaşır; uzak vadeli parçalar daha düşük fiyattan işlem görür.<\/li>\n<\/ul>\n<h3>Getiri eğrisi<\/h3>\n<ul>\n<li>Kredi riski eşit (genellikle devlet) araçların vadeleri ile getirileri arasındaki ilişki; yatay eksen vade, dikey eksen getiri. Türkiye'de BAP'ta işlem gören <b>DİBS<\/b> verileriyle oluşturulur.<\/li>\n<li><b>Normal (pozitif eğimli):<\/b> vade uzadıkça getiri artar; büyüme ve ılımlı enflasyon beklentisi.<\/li>\n<li><b>Ters (negatif eğimli):<\/b> kısa vadeli faizler uzunlardan yüksek; genellikle sıkı para politikası dönemlerinde; yaklaşan <b>resesyon<\/b> için güçlü öncü gösterge ama tek başına kesin sonuç değildir.<\/li>\n<li>Kullanım: özel sektör tahvil fiyatlamasına referans (aynı vadeli DİBS getirisi + kredi ve likidite primi), bankaların <b>aktif-pasif yönetimi<\/b>, para politikasının <b>inandırıcılığı<\/b> (MB kısa faizi artırırken uzun faizler düşüyorsa piyasa enflasyonun kontrol edileceğine inanıyor).<\/li>\n<\/ul>\n<h3>Referans oranlar<\/h3>\n<ul>\n<li><b>IBOR<\/b> (LIBOR, EURIBOR, TRLIBOR): panel bankaların teminatsız borçlanma oranı <b>beyanına<\/b> dayanırdı. 2008 krizi sonrası hacim düştü, <b>2012<\/b> manipülasyon vakaları yaşandı → gerçekleşmiş, teminatlı işlemlere dayanan <b>risksiz referans oranlara<\/b> geçildi.<\/li>\n<li>Yöntem farkı: IBOR <b>ileriye dönük<\/b> (vade başında bilinir); yeni oranlar gecelik olduğundan <b>geriye dönük<\/b> (dönem sonunda kesinleşir).<\/li>\n<li>Türkiye karşılığı <b>TLREF<\/b> ve <b>TLREFK<\/b>; ABD'de <b>SOFR<\/b>, Euro Bölgesi'nde metodolojisi güçlendirilmiş <b>Euribor<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Konu<\/th><th>TLREF<\/th><th>TLREFK<\/th><\/tr>\n<tr><td>Hesaplayan<\/td><td>Borsa İstanbul<\/td><td>Borsa İstanbul<\/td><\/tr>\n<tr><td>Dayanak piyasa<\/td><td>Repo-Ters Repo Pazarı; aynı gün valörlü, <b>DİBS teminatlı gecelik<\/b> işlemler<\/td><td><b>Taahhütlü İşlemler Pazarı<\/b> (faizsiz, kira sertifikası gibi varlıkların geri alım vaadiyle satışı)<\/td><\/tr>\n<tr><td>Uç değer temizleme<\/td><td>En düşük ve en yüksek <b>%15<\/b> dilim atılır, kalan <b>%70<\/b><\/td><td>En düşük ve en yüksek <b>%10<\/b> atılır, kalan <b>%80<\/b><\/td><\/tr>\n<tr><td>Yetersiz veri<\/td><td>TCMB ortalama fonlama faizi ve geçmiş farklarla ikame hesap<\/td><td>Hacim aralığına göre TLREF ile ağırlıklandırma (çok düşük hacimde %100 TLREF olabilir)<\/td><\/tr>\n<\/table>\n<ul>\n<li>TLREF hacim ağırlıklı ortalamadır; teminatlı olduğundan bankaların kredi riskinden arındırılmıştır.<\/li>\n<li>Hazine'nin TLREF'e endeksli tahvillerinde ek getiri olmayabilir; <b>ilk kupon önceden belirlenmiş sabit oran<\/b>, sonrakiler TLREF'e endeksli.<\/li>\n<li><b>BIST TLREF/TLREFK Endeksi:<\/b> Endeks(t) = Endeks(t-1) x [1 + (R x g / 365)]; g iş günleri için 1, hafta sonu için 3. Her günün getirisi yeni anapara olduğundan <b>bileşik<\/b> ilerler. Örnek: 2.500 x (1 + 0,20/365) ≈ 2.501,37; ertesi gün %19 ile ≈ 2.502,67.<\/li>\n<li><b>SOFR:<\/b> ABD Hazine repo piyasasından, teminatlı; LIBOR'daki banka kredi riski primini içermez, \"saf risksiz faize\" en yakın oran. <b>Term SOFR<\/b>, vadeli işlem fiyatlarından türetilir, ARRC onaylıdır. <b>Euribor:<\/b> EMMI yönetiminde <b>hibrit metodoloji<\/b> (önce gerçek işlemler, sonra interpolasyon/piyasa verisi, son çare uzman görüşü); kendisi vadeli (1 hafta, 3 ay, 6 ay) yayımlanır.<\/li>\n<\/ul>\n<h3>TLREF'e endeksli tahvilde kupon (T-1 kuralı)<\/h3>\n<ul>\n<li>Kupon dönemi genellikle 3 ay; oran dönem sonunda hesaplanır. Endeks değerleri kupon tarihlerinin <b>bir iş günü öncesine (T-1)<\/b> aittir; gün sayımı <b>Gerçek/Gerçek<\/b>.<\/li>\n<li>Endeks getirisi = Bitiş endeksi / Başlangıç endeksi - 1. Dönemsel ek getiri = yıllık spread x gün / 365 (basit). Kupon oranı = ikisinin toplamı.<\/li>\n<li>Kitap örneği: 5.200 → 5.500, 91 gün, %4 spread: %5,7692 + %0,9973 = %6,7665 → 100 TL'de <b>6,77 TL<\/b>.<\/li>\n<\/ul>\n<h3>TÜFE'ye endeksli devlet tahvili<\/h3>\n<ul>\n<li>Enflasyonun üzerinde <b>sabit reel getiri<\/b>; hem kupon hem anapara TÜFE ile güncellenir.<\/li>\n<li><b>Deflasyon koruması:<\/b> TÜFE gerilese de reel faiz ödenir, anapara <b>nominalin (100 TL) altında<\/b> ödenmez.<\/li>\n<li>Kupon = Nominal x Endeks katsayısı x Dönemsel reel faiz. Anapara = Nominal x Endeks katsayısı.<\/li>\n<li>TÜFE <b>2 ay gecikmeli<\/b> kullanılır: 1 Eylül kuponunda 1 Ocak - 30 Haziran dönemi enflasyonu esas alınır.<\/li>\n<li>Kitap örneği: dönemsel reel %2, katsayı 1,10 →
