isa": "Türev Araçlar", "baslik": "Türev Araçlar: VİOP, Vadeli İşlem Sözleşmeleri, Teminat Mekanizması, Opsiyonlar ve Varantlar", "ozet": "Spot ve türev piyasa ayrımı, VİOP ve merkezi karşı taraf, vadeli işlem kavramları ve sözleşme kodları, başlangıç teminatı, kaldıraç ve teminat tamamlama, sözleşme türleri, taşıma maliyeti, opsiyonlar ve varantlar.", "notlar": "\n<h3>Türev piyasalara giriş<\/h3>\n<ul>\n<li><b>Spot piyasa:<\/b> ödeme teslimatla birlikte. <b>Türev piyasa:<\/b> ödeme ve teslimat ileri tarihte, belirli şartlara bağlı.<\/li>\n<li><b>Türev araç:<\/b> kendi başına bağımsız değeri olmayan, değerini dayanak varlıktan (finansal araç, endeks, emtia, gösterge) alan vadeli sözleşme. Fiyatı dayanağın performansına, vadeye, faize bağlıdır.<\/li>\n<li><b>Tezgahüstü (OTC):<\/b> merkezi yapı yok, karşılıklı güven, esnek (vade, miktar, fiyat serbest) ama <b>karşı taraf riski<\/b> var. <b>Organize piyasa:<\/b> borsa kuralları, <b>standardizasyon<\/b> (büyüklük, vade, teminat, fiyat adımı), likidite. Örnekler: CME, CBOT, CBOE; Türkiye'de <b>VİOP<\/b>.<\/li>\n<li>Dört ana grup: <b>forward, futures, opsiyon, swap<\/b>. Forward ve futures aynı mantıktadır (ileri tarihte önceden belirlenen fiyattan işlem yükümlülüğü); fark platformdur. Swap hem OTC hem borsada (BİST Swap Piyasası) işlem görür, kurumsal ağırlıklıdır ve çalışma notu kapsamı dışındadır. Opsiyonlar hem VİOP'ta hem OTC'de işlem görür.<\/li>\n<li>VİOP'ta en çok işlem: <b>BİST 30 endeks vadeli (XU30)<\/b>, ardından döviz vadeli; opsiyonlar daha az yaygın.<\/li>\n<\/ul>\n<h3>VİOP'un yapısı<\/h3>\n<ul>\n<li>Süreç İzmir'de <b>2005<\/b>'te faaliyete geçen <b>VOB<\/b> ile başladı; VOB, İMKB ve İstanbul Altın Borsası'nın tüzel kişilikleri sona erdirilerek <b>Borsa İstanbul<\/b> çatısında birleşildi.<\/li>\n<li><b>Merkezi karşı taraf (Takasbank):<\/b> işlem anında alıcıya karşı satıcı, satıcıya karşı alıcı olur; yatırımcılar birbirini tanımaz; teminatlar Takasbank'ta saklanır, müşteri ve aracı kurum portföy hesapları ayrıdır; aracı kurum iflas etse de teminat korunur.<\/li>\n<li><b>Piyasa yapıcılar<\/b> sürekli alış-satış kotasyonu verir, spot-vadeli makasının makul kalmasına ve derinliğe katkı sağlar. Takasbank nakit teminatları nemalandırır.<\/li>\n<\/ul>\n<h3>Vadeli işlem sözleşmeleri (futures)<\/h3>\n<ul>\n<li>Dayanağın önceden belirlenen fiyattan ileri tarihte teslimini veya <b>nakdi uzlaşı<\/b>yla kapanmasını öngören, borsaca standartlaştırılmış sözleşme. İhraççı tarafından arz edilmez; iki karşıt pozisyonun eşleşmesiyle doğar.<\/li>\n<li>Spottaki temettü, oy, rüçhan gibi haklar yoktur; yalnız fiyat riski ve getirisi üstlenilir.<\/li>\n<li><b>Uzun (long):<\/b> yükseliş beklentisi veya maliyeti sabitleme; vadede alma yükümlülüğü. <b>Kısa (short):<\/b> düşüş beklentisi veya korunma; vadede satma yükümlülüğü.<\/li>\n<li>VİOP'ta kısa pozisyon, spottaki açığa satıştan farklı olarak ödünç pay, yukarı adım kuralı gibi zorluklar olmadan teminatla açılabilir; <b>hedge<\/b> stratejilerinin temelidir.<\/li>\n<li><b>Sıfır toplamlı:<\/b> yeni değer üretilmez; bir tarafın kârı diğerinin zararıdır.<\/li>\n<li>Pozisyon vadeyi beklemeden <b>ters işlemle<\/b> kapatılabilir.<\/li>\n<li><b>Günlük uzlaşı (mark-to-market):<\/b> her gün uzlaşma fiyatına göre kâr/zarar hesaplanıp hesaplara yansıtılır; kâr ertesi gün kullanılabilir teminata eklenir, zarar hemen düşülür. Spot payda takas <b>T+2<\/b>'dir ve kâr/zarar satışa kadar kağıt üzerindedir.<\/li>\n<li><b>Forward:<\/b> OTC, esnek, karşı taraf riski ve düşük likidite; <b>günlük uzlaşı yok<\/b>, tüm hesaplaşma vade sonunda tek seferde.<\/li>\n<\/ul>\n<h3>Temel kavramlar<\/h3>\n<ul>\n<li><b>Sözleşme:<\/b> işlem birimi daima <b>1 adet<\/b>; küsuratlı sözleşme olmaz.<\/li>\n<li><b>Sözleşme kodu:<\/b> \"F_\" + dayanak kodu + iki haneli ay + iki haneli yıl. Örnek: F_GARAN0426, F_USDTRY0426, F_XU0300426, F_XAUUSD0426, F_XAUTRY0426.<\/li>\n<li><b>Vade:<\/b> standart sözleşmelerde koddaki ayın <b>son iş günü<\/b>; son iş günü yarım günse bir önceki tam iş günü. Elektrik vadeli ve esnek (gün-ay-yıl kodlu) sözleşmeler istisnadır.<\/li>\n<li><b>Fiyat kotasyonu<\/b> dayanağın 1 biriminin fiyatıdır. <b>Sözleşme değeri<\/b> = fiyat x sözleşme büyüklüğü (ör. USD/TL 40,00 x 1.000 = 40.000 TL). <b>Pozisyon büyüklüğü<\/b> = adet x sözleşme değeri.<\/li>\n<li><b>İşlem miktarı<\/b> = el değiştiren sözleşme adedi; <b>işlem hacmi<\/b> = fiyat x adet x sözleşme büyüklüğü.<\/li>\n<li><b>Gün sonu uzlaşma fiyatı:<\/b> kapanış fiyatından farklıdır; genellikle seansın son dakikalarındaki işlemlerin ağırlıklı ortalaması; teminat tamamlama çağrısı buna göre belirlenir. İstisnai durumda <b>Uzlaşma Fiyatı Komitesi<\/b> belirler. Vade sonunda <b>vade sonu uzlaşma fiyatı<\/b> kullanılır.<\/li>\n<li><b>Gün içi uzlaşma fiyatı:<\/b> Takasbank risk hesaplama anlarında kullanılır; kâr/zarar kesinleşmez, çekilemez ama kullanılabilir teminatı etkiler.<\/li>\n<li><b>Açık pozisyon:<\/b> kapatılmamış sözleşme sayısı. Yeni alıcı + yeni satıcı → <b>artar<\/b> (yeni sermaye); kapatan alıcı + kapatan satıcı → <b>azalır<\/b>; kapatan + yeni giren → <b>değişmez<\/b>. Vade yaklaştıkça yakın vadede doğal düşüş görülür.<\/li>\n<li><b>Uzlaşma şekli:<\/b> nakdi uzlaşı veya fiziki teslimat.<\/li>\n<li><b>Vade taşıma (rollover):<\/b> yakın vadeyi kapatıp uzak vadede aynı yönde pozisyon açmak. <b>Vadeler arası strateji emirleri<\/b> yalnız <b>BİST 30, Dolar/TL ve Dolar/Ons Altın<\/b> sözleşmelerinde kullanılabilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Sözleşme<\/th><th>Büyüklük<\/th><\/tr>\n<tr><td>Pay vadeli<\/td><td>100 pay<\/td><\/tr>\n<tr><td>Endeks vadeli<\/td><td>Endeks x 10 TL<\/td><\/tr>\n<tr><td>USD/TL, EUR/TL, EUR/USD, GBP/USD<\/td><td>1.000 birim (USD, EUR, EUR, GBP)<\/td><\/tr>\n<tr><td>Altın (TL/gram)<\/td><td>1 gram<\/td><\/tr>\n<tr><td>Dolar/ons altın, platin, paladyum<\/td><td>1 ons<\/td><\/tr>\n<tr><td>Dolar/ons gümüş<\/td><td>10 ons<\/td><\/tr>\n<tr><td>Dolar/ton bakır<\/td><td>0,1 ton<\/td><\/tr>\n<\/table>\n<h3>Teminat mekanizması<\/h3>\n<ul>\n<li>Spotun aksine tüm bedel ödenmez; <b>hem uzun hem kısa<\/b> taraf teminat yatırır.<\/li>\n<li><b>Başlangıç teminatı:<\/b> Takasbank'ça belirlenir, işleme girerken bloke edilir; <b>BİSTECH<\/b> portföy bazlı risk sistemiyle hesaplanır. Temel parametre <b>fiyat değişim aralığı (PSR)<\/b>. Takasbank volatilite artışında parametreleri tek taraflı artırabilir.<\/li>\n<li>Teminat nakit veya döviz, devlet tahvili, hisse gibi varlıklarla verilebilir; ancak gereksinimin belirli bir oranı (ör. <b>%50<\/b>) <b>nakit TL<\/b> olmalıdır; nakit dışı varlıklar iskontolu değerlenir.<\/li>\n<li>Ters pozisyonlar (ör. aynı hissede Şubat uzun, Mart kısa) BİSTECH'te netleştirilir; <b>vadeler arası yayılma<\/b> ve <b>ürünler arası yayılma<\/b> parametreleriyle indirimli teminat istenir.<\/li>\n<li>Kitap örneği: 200 TL x 100 pay x 5 sözleşme = 100.000 TL pozisyon; PSR %15 → <b>15.000 TL<\/b> teminat.<\/li>\n<li><b>Kaldıraç<\/b> = pozisyon büyüklüğü / teminat = 1 / PSR (örnekte <b>6,66<\/b>). %5 fiyat artışı spotta %5, teminata göre %33,3 getiri; düşüşte tersine. Aracı kurum PSR'nin üstünde (ör. 2 kat) uygulayabilir, kaldıraç düşer (3,33).<\/li>\n<li>Komisyon teminat üzerinden değil <b>pozisyon büyüklüğü<\/b> üzerinden alınır; kaldıraçta maliyet yükü ağırdır.<\/li>\n<li><b>Teminat tamamlama çağrısı:<\/b> gün sonu değerlemede toplam teminat, o günkü güncel başlangıç teminatının altına düşerse yapılır; eksik <b>nakit TL<\/b> yatırılarak veya pozisyon azaltılarak <b>ertesi iş günü en geç 15:00<\/b>'e kadar tamamlanır (fiziki teslimatlı döviz ve yarım günlerde <b>11:00<\/b>). Yerine getirilmezse pozisyon <b>re'sen kapatılabilir<\/b>.<\/li>\n<li><b>Gün içi sürdürme seviyesi:<\/b> altına inilirse bekleyen emirler iptal edilir, yalnız pozisyon azaltıcı işleme izin verilir; teminat eklenir veya pozisyon azaltılırsa engel kalkar. Gün içi düşüş gün sonu çağrısı anlamına gelmez. Olağanüstü durumda Takasbank <b>gün içi teminat tamamlama çağrısı<\/b> yapabilir; açık <b>2 saat<\/b> içinde kapatılır.<\/li>\n<li>Kitap örneği: 20.000 TL yatırılmış, fiyat 200 → 180: zarar 10.000, bakiye 10.000, yeni teminat 90.000 x %15 = 13.500 → çağrı <b>3.500 TL<\/b>. Fiyat 220'ye çıksa: bakiye 30.000, yeni teminat 16.500, serbest teminat 13.500 TL (çekilebilir).<\/li>\n<li><b>Fiyat boşluğu<\/b> riski: piyasa kapalıyken gelişen olaylarla stop-loss çalışmayabilir; teminat sıfırlanıp hesap eksiye düşebilir. Takasbank'ın muhatabı aracı kurumdur; eksi bakiye yatırımcının aracı kuruma <b>yasal borcu<\/b> olur. Spot kaldıraçlı işlemlerde (forex) ise SPK düzenlemesi gereği aracı kurum eksi bakiye için yatırımcıdan alacaklı olamaz.<\/li>\n<li><b>Nemalandırma:<\/b> Takasbank TL nakit teminatları, zorunlu karşılık düşüldükten sonra gecelik ve en iyi gayretle değerlendirir; asgari tutar belirleyebilir. Döviz, altın, hisse teminatlar nemalanmaz. Nakit TL'nin <b>15:40<\/b> itibarıyla hesapta olması gerekir. Serbest teminat dahil tüm nakit TL nemalanır. Muhatap aracı kurumdur; nema istemeyen yatırımcının talebi iletilirse nemalandırma yapılmaz.<\/li>\n<\/ul>\n<h3>Sözleşme türleri<\/h3>\n<table>\n<tr><th>Sözleşme<\/th><th>Vade<\/th><th>Uzlaşı<\/th><th>Not<\/th><\/tr>\n<tr><td>BİST 30 endeks<\/td><td>Çift aylar; en yakın 3 vade, Aralık ayrıca açılır<\/td><td>Nakdi<\/td><td>Akşam seansına dahil; endeks x 10 TL<\/td><\/tr>\n<tr><td>Pay vadeli (yaklaşık 50 hisse)<\/td><td>İçinde bulunulan ay ve en yakın iki ay (3 vade)<\/td><td><b>Fiziki teslimat<\/b>, T+2<\/td><td>Nakit temettüde düzeltme yok; sermaye artırımı vb. halinde N1, N2 kodlu standart dışı sözleşme<\/td><\/tr>\n<tr><td>Dolar/TL<\/td><td>16 aya kadar<\/td><td>Nakdi (fiziki teslimatlı türü de var)<\/td><td>Gerçek kişiler fiziki teslimatlı döviz sözleşmesine taraf olamaz<\/td><\/tr>\n<tr><td>Kıymetli madenler<\/td><td>Çift aylar; en yakın 3 vade<\/td><td>Nakdi<\/td><td>Dolar/ons sözleşmeleri akşam seansında; TL/gram altın akşam seansında değil<\/td><\/tr>\n<\/table>\n<ul>\n<li>Diğer döviz sözleşmeleri: EUR/TL (1.000 euro), RUB/TL (100.000 ruble), CNH/TL (10.000 yuan), EUR/USD (1.000 euro), GBP/USD (1.000 sterlin). <b>Esnek vade tarihli<\/b> döviz sözleşmeleri en fazla <b>364 gün<\/b>e kadar.<\/li>\n<li>Pay sözleşmelerinde uyarlamada büyüklük katsayıya göre değişebilir (ör. 180 pay); farklı yöntem kararı <b>Özsermaye Halleri Komitesi<\/b>'ndedir. Bakır kıymetli maden değil metal sayılır.<\/li>\n<\/ul>\n<h3>Fiyat dinamikleri (taşıma maliyeti)<\/h3>\n<ul>\n<li>Vadeli fiyat = Spot fiyat + Faiz maliyeti - Varlık getirisi (temettü, yabancı para faizi). Getirisiz varlıkta (gram altın) yalnız faiz eklenir. Kullanılan faiz politika faizi değil <b>piyasadaki fonlama maliyetidir<\/b>.<\/li>\n<li>Normalde (getirisiz varlık, temettüsüz hisse, TL faizi &gt; dolar faizi) vadeli &gt; spot ve uzak vade daha pahalıdır. Temettü faiz maliyetinden büyükse vadeli spotun <b>altında<\/b> olabilir; bu piyasa hatası değildir.<\/li>\n<li>Vadeye yaklaştıkça faiz bileşeni azalır, vade sonunda vadeli = spot. Örnek: spot 100, aylık %2 → 102; ay ortasında 101.<\/li>\n<li>Beklenmedik temettü veya beklentinin üzerinde temettü vadeli fiyatı aşağı, iptal veya düşük temettü yukarı iter.<\/li>\n<li>Vadeli fiyat bir tahmin değildir, <b>mekanik<\/b>tir. Spotta açığa satış zorlukları vadeliyi teorik değerin altına baskılayabilir. Sapmada <b>arbitraj<\/b>: vadeli pahalıysa spotta al, vadelide sat.<\/li>\n<\/ul>\n<h3>Opsiyonlar<\/h3>\n<ul>\n<li>Opsiyon satıcısı (yazıcı) prim karşılığında alıcıya belirli fiyattan <b>alma (call)<\/b> veya <b>satma (put)<\/b> hakkı verir. Hak yalnız alıcıdadır (uzun pozisyon); satıcı koşullu yükümlülük altındadır (kısa pozisyon). Önceden belirlenen fiyat <b>kullanım fiyatı<\/b>; hakkın kullanılması <b>işleme konulma<\/b>.<\/li>\n<li>Prim sigorta primi gibidir, iade edilmez; alıcının prim dışında yükümlülüğü yoktur.<\/li>\n<li><b>Call alıcısı:<\/b> kâr teorik olarak sınırsız, zarar primle sınırlı. <b>Call satıcısı:<\/b> kâr primle sınırlı, zarar büyük. <b>Put alıcısı:<\/b> fiyat düştükçe kazanır, zarar primle sınırlı. <b>Put satıcısı:<\/b> kâr sınırlı, kayıp potansiyeli fazla.<\/li>\n<li>Organize piyasada takas merkezi karşı taraf olur; taraflar yalnız <b>prim<\/b> ve <b>kullanım fiyatı<\/b> üzerinde pazarlık eder. OTC'de alıcı kredi riski taşır.<\/li>\n<li>Türler: haklar açısından <b>Amerikan<\/b> (vadeye kadar her an) ve <b>Avrupa<\/b> (yalnız vadede); alım ve satım; dayanağa göre finansal, vadeli işlem üzerine (CFTC'nin yasaklamaması sonucu doğdu), emtia ve diğer (reel, hava durumu, iklim); piyasaya göre organize ve OTC (egzotik).<\/li>\n<\/ul>\n<table>\n<tr><th>Artış<\/th><th>Call fiyatı<\/th><th>Put fiyatı<\/th><\/tr>\n<tr><td>Dayanak fiyatı<\/td><td>+<\/td><td>-<\/td><\/tr>\n<tr><td>Kullanım fiyatı<\/td><td>-<\/td><td>+<\/td><\/tr>\n<tr><td>Vadeye kalan gün<\/td><td>+<\/td><td>+<\/td><\/tr>\n<tr><td>Volatilite<\/td><td>+<\/td><td>+<\/td><\/tr>\n<tr><td>Piyasa faizi<\/td><td>+<\/td><td>-<\/td><\/tr>\n<tr><td>Temettü<\/td><td>-<\/td><td>+<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Durum<\/th><th>Call<\/th><th>Put<\/th><\/tr>\n<tr><td>Kârda (in the money)<\/td><td>Kullanım &lt; spot<\/td><td>Kullanım &gt; spot<\/td><\/tr>\n<tr><td>Zararda (out of the money)<\/td><td>Kullanım &gt; spot<\/td><td>Kullanım &lt; spot<\/td><\/tr>\n<tr><td>Başabaş (at the money)<\/td><td>Kullanım = spot<\/td><td>Kullanım = spot<\/td><\/tr>\n<\/table>\n<ul><li>Örnek: kullanım 60, prim 4 olan call'da vade sonu spot 70 → net kâr 70 - 60 - 4 = 6 TL. Kullanım 45, prim 3 olan put'ta spot 48 → kullanılmaz, zarar 3 TL.<\/li><\/ul>\n<h3>Varantlar<\/h3>\n<ul>\n<li>Dayanak varlığı belirli fiyattan belirli tarihte veya tarihe kadar alma ya da satma hakkı veren sermaye piyasası aracı; ihraç edilen <b>menkul kıymetleştirilmiş opsiyon<\/b>.<\/li>\n<li>Farklar: opsiyon VİOP'ta vadeli işlem esaslarıyla, varant <b>Pay Piyasası<\/b>'nda spot esaslarla işlem görür. Opsiyon özellikleri borsaca standart, varantınki <b>ihraççıca<\/b> belirlenir (standart vade yok). Opsiyon satıcısı teminat yatırır ve çağrıya uyar; varant yatırımcısı yalnız prim öder, <b>teminat yükümlülüğü yoktur<\/b>, azami kaybı primdir. Opsiyonda her yatırımcı yazıcı olabilir; varantın tek ihraççısı vardır (yatırım kuruluşları veya halka açık ortaklıklar), yatırımcı ihraççı olamaz.<\/li>\n<\/ul>\n", "sorular": [{"q": "Forward ve futures sözleşmeleri karşılaştırıldığında aşağıdakilerden hangisi yanlıştır?", "o": ["Forwardda kâr ve zarar her gün hesaplara yansıtılır", "Forward tezgahüstü, futures organize piyasada işlem görür", "Forwardda karşı taraf riski vardır", "Futuresta günlük uzlaşı uygulanır", "Futures sözleşmelerinin miktar ve vadesi borsaca standartlaştırılmıştır"], "a": 0, "e": "Forwardda günlük uzlaşı yoktur; tüm hesaplaşma vade sonunda tek seferde yapılır."}, {"q": "VİOP'ta merkezi karşı taraf uygulamasıyla ilgili hangisi doğrudur?", "o": ["Aracı kurum alıcıya karşı satıcı olur", "Takasbank alıcıya karşı satıcı, satıcıya karşı alıcı konumuna geçer", "Yatırımcılar karşı tarafın mali durumunu incelemek zorundadır", "Teminatlar aracı kurumun portföy hesabında tutulur", "Merkezi karşı taraf yalnız opsiyonlarda uygulanır"], "a": 1, "e": "İşlem gerçekleştiği anda Takasbank araya girer; teminatlar Takasbank nezdinde müşteri ve portföy hesapları ayrıştırılarak saklanır."}, {"q": "F_THYAO1226 kodlu sözleşmeyle ilgili hangisi doğrudur?", "o": ["THYAO pay opsiyonudur, vadesi 12 Şubat 2026'dır", "Endeks sözleşmesidir", "THYAO payına dayalı vadeli işlem sözleşmesidir, vadesi Aralık 2026'dır", "Vadesi 26 Aralık'tır", "Nakdi uzlaşılı döviz sözleşmesidir"], "a": 2, "e": "F_ vadeli işlemi, THYAO dayanağı, 1226 Aralık 2026 vadesini gösterir; standart sözleşmede vade ayın son iş günüdür."}, {"q": "BİST 30 endeksi 12.000 puan, Dolar/TL vadeli fiyatı 42,00 TL'dir. Bir adet endeks sözleşmesi ile bir adet Dolar/TL sözleşmesinin değerleri toplamı kaç TL'dir?", "o": ["12.042 TL", "120.042 TL", "54.000 TL", "162.000 TL", "1.242.000 TL"], "a": 3, "e": "Endeks sözleşmesi 12.000 x 10 = 120.000 TL; Dolar/TL 42 x 1.000 = 42.000 TL; toplam 162.000 TL."}, {"q": "Bir vadeli işlem sözleşmesinde gün içinde işlem hacmi yüksek olmasına rağmen açık pozisyon sayısı önemli ölçüde azalmıştır. Bu durum neyi gösterir?", "o": ["Piyasaya çok sayıda yeni alıcı ve satıcı girdiğini", "Pozisyonların yalnız el değiştirdiğini", "Sözleşme büyüklüğünün değiştiğini", "Teminat oranlarının düştüğünü", "Pozisyonu kapatmak isteyen uzun ve kısa tarafların birbiriyle eşleştiğini"], "a": 4, "e": "Açık pozisyon, pozisyonunu kapatmak isteyen alıcı ile pozisyonunu kapatmak isteyen satıcının eşleşmesiyle azalır; piyasadan risk ve sermaye çıkışı vardır."}, {"q": "Vadeler arası strateji emirleri aşağıdaki sözleşmelerden hangisinde kullanılamaz?", "o": ["Pay vadeli işlem sözleşmesi", "BİST 30 endeks", "Dolar/TL", "Dolar/Ons altın", "Hiçbiri, hepsinde kullanılabilir"], "a": 0, "e": "Vadeler arası strateji emirleri yalnız BİST 30 Endeksi, Dolar/TL ve Dolar/Ons Altın sözleşmelerinde kullanılabilir."}, {"q": "Bir yatırımcı fiyatı 150 TL olan payın vadeli işlem sözleşmesinden 8 adet uzun pozisyon açmak istemektedir. Fiyat değişim aralığı yüzde 12'dir ve başka pozisyon yoktur. Gerekli başlangıç teminatı ve kaldıraç oranı nedir?", "o": ["1.440 TL ve 8,33", "14.400 TL ve 8,33", "14.400 TL ve 12", "18.000 TL ve 6,67", "120.000 TL ve 1"], "a": 1, "e": "Pozisyon 150 x 100 x 8 = 120.000 TL; teminat 120.000 x 0,12 = 14.400 TL; kaldıraç 1 / 0,12 = 8,33. 1.440 TL sözleşme büyüklüğünü 100 almamanın sonucudur."}, {"q": "Fiyatı 150 TL olan pay vadeli sözleşmesinden 8 adet uzun pozisyon için 14.400 TL teminat yatırılmıştır. Dayanağın vadeli fiyatı yüzde 4 yükselirse yatırımcının teminatına göre getirisi yaklaşık yüzde kaçtır?", "o": ["%4", "%12", "%33,3", "%48", "%8,3"], "a": 2, "e": "Kâr 120.000 x 0,04 = 4.800 TL; 4.800 / 14.400 = yüzde 33,3. Kaldıraç 8,33 olduğundan getiri 4 x 8,33 olur."}, {"q": "Bir yatırımcı fiyatı 150 TL olan pay vadeli sözleşmesinden 8 adet uzun pozisyon için hesabına 18.000 TL yatırmıştır. Fiyat değişim aralığı yüzde 12'dir. Gün sonu uzlaşma fiyatı 135 TL'ye düşerse teminat tamamlama çağrısı tutarı kaç TL olur?", "o": ["Çağrı yapılmaz", "3.600 TL", "8.400 TL", "6.960 TL", "12.960 TL"], "a": 3, "e": "Zarar 15 x 100 x 8 = 12.000 TL, bakiye 6.000 TL. Yeni teminat 135 x 800 x 0,12 = 12.960 TL; çağrı 12.960 - 6.000 = 6.960 TL. 8.400 TL eski teminatın baz alınmasıdır."}, {"q": "Teminat tamamlama çağrısı alan bir yatırımcı (fiziki teslimatlı döviz sözleşmesi dışındaki bir sözleşmede) eksik teminatı en geç ne zamana kadar tamamlamalıdır?", "o": ["Aynı gün 17:00", "Ertesi iş günü 11:00", "İki iş günü sonra 15:00", "Vade sonuna kadar", "Ertesi iş günü 15:00"], "a": 4, "e": "Çağrı ertesi iş günü en geç 15:00'e kadar yerine getirilir; fiziki teslimatlı döviz sözleşmelerinde ve yarım günlerde son saat 11:00'dir."}, {"q": "Teminatı gün içinde sürdürme seviyesinin altına inen bir VİOP hesabı için hangisi doğrudur?", "o": ["Bekleyen emirleri iptal edilir ve yeni pozisyon artırıcı emir iletemez", "Gün sonunda mutlaka teminat tamamlama çağrısı alır", "Tüm pozisyonları derhal kapatılır", "Hesap kalıcı olarak kapatılır", "Hiçbir kısıtlama uygulanmaz"], "a": 0, "e": "Sistem bekleyen emirleri iptal eder ve yalnız pozisyon azaltıcı işleme izin verir; gün içi düşüş gün sonu çağrısı anlamına gelmez. Teminat eklenir veya pozisyon azaltılırsa engel kalkar."}, {"q": "Takasbank'ın olağanüstü fiyat dalgalanmalarında yaptığı gün içi teminat tamamlama çağrısında yatırımcının açığı kapatma süresi nedir?", "o": ["30 dakika", "2 saat", "1 saat", "Gün sonu", "Ertesi iş günü 15:00"], "a": 1, "e": "Teminat açığı kritik sınırları aşarsa Takasbank gün içi teminat tamamlama çağrısı yapabilir; açık iki saat içinde kapatılmalıdır."}, {"q": "VİOP teminatlarının nemalandırılmasıyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Yalnız TL nakit teminatlar nemalandırılır", "Serbest teminat dahil hesaptaki tüm nakit TL nemalandırılır", "Döviz cinsinden teminatlar da nemalandırılır", "Nakit teminatın saat 15:40 itibarıyla hesapta bulunması gerekir", "Nemalandırma istemeyen yatırımcının talebi iletilirse nemalandırma yapılmaz"], "a": 2, "e": "Döviz, altın ve hisse gibi nakit dışı teminatlar nemalandırma kapsamında değildir."}, {"q": "Dolar/TL vadeli fiyatı 41,00 TL iken 5 adet kısa pozisyon açan yatırımcı, fiyat 39,50 TL'ye düştüğünde pozisyonunu kapatmıştır. Kâr veya zararı nedir?", "o": ["7.500 TL zarar", "1.500 TL kâr", "750 TL kâr", "7.500 TL kâr", "15.000 TL kâr"], "a": 3, "e": "Kısa pozisyon fiyat düşünce kazanır: (41,00 - 39,50) x 1.000 x 5 = 7.500 TL kâr. Karşı taraftaki uzun pozisyon aynı tutarda zarar eder."}, {"q": "BİST 30 endeks vadeli işlem sözleşmeleri ile pay vadeli işlem sözleşmelerinin vade sonu uzlaşma şekilleri sırasıyla nedir?", "o": ["Fiziki teslimat, nakdi uzlaşı", "Her ikisi de nakdi uzlaşı", "Her ikisi de fiziki teslimat", "Nakdi uzlaşı, yatırımcı tercihine göre", "Nakdi uzlaşı, fiziki teslimat"], "a": 4, "e": "Endeks sözleşmeleri nakdi uzlaşılıdır; pay sözleşmelerinde fiziki teslimat yapılır ve takas vade sonunu izleyen ikinci iş günüdür."}, {"q": "VİOP sözleşmeleriyle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Dolar/TL sözleşmelerinde 16 aya kadar vadeler işlem görebilir", "TL/gram altın sözleşmeleri akşam seansına dahildir", "Pay sözleşmelerinde nakit temettü ödemesinde borsa fiyat düzeltmesi yapar", "Gerçek kişiler fiziki teslimatlı döviz sözleşmelerine taraf olabilir", "Esnek vadeli döviz sözleşmelerinde vade iki yıla kadar seçilebilir"], "a": 0, "e": "Dolar/TL'de içinde bulunulan ay dahil 16 aya kadar vadeler vardır. TL/gram altın akşam seansında değildir, temettüde düzeltme yapılmaz, gerçek kişiler fiziki teslimatlı döviz sözleşmesine taraf olamaz, esnek vade en fazla 364 gündür."}, {"q": "Spot fiyatı 250 TL olan ve vade boyunca getirisi olmayan bir dayanağın iki ay vadeli sözleşmesinin teorik fiyatı, aylık yüzde 2,5 basit faizle kaç TL'dir?", "o": ["256,25 TL", "262,50 TL", "262,66 TL", "250,00 TL", "275,00 TL"], "a": 1, "e": "Vadeli fiyat = 250 x (1 + 0,025 x 2) = 262,50 TL. 262,66 TL bileşik faizle, 256,25 TL tek ay hesabıyla bulunur."}, {"q": "Spot fiyatı 150 TL olan bir payın bir ay vadeli sözleşmesi için faiz maliyeti 4 TL'dir. Vade içinde hisse başına 6 TL nakit temettü ödenmesi kesin olarak beklenmektedir. Teorik vadeli fiyat kaç TL'dir?", "o": ["160 TL", "154 TL", "148 TL", "144 TL", "152 TL"], "a": 2, "e": "Vadeli fiyat = spot + faiz maliyeti - varlık getirisi = 150 + 4 - 6 = 148 TL. Vadelinin spotun altında olması temettü nedeniyle rasyoneldir."}, {"q": "Vadeli fiyat teorik fiyatın belirgin şekilde üzerine çıktığında arbitrajcının yapacağı işlem hangisidir?", "o": ["Spotta satış, vadelide alış", "Her iki piyasada alış", "Her iki piyasada satış", "Spotta alış, vadelide satış", "Yalnız vadelide alış"], "a": 3, "e": "Pahalı olan vadeliyi satar, ucuz olan spotu alır; vade sonunda fiyatlar eşitlendiğinde faiz maliyetinin üzerindeki farkı risksiz kazanır."}, {"q": "Kullanım fiyatı 60 TL olan bir alım opsiyonu için 4 TL prim ödenmiştir. Vade sonunda dayanak varlığın fiyatı 70 TL'dir. Opsiyon alıcısının hisse başına net sonucu nedir?", "o": ["10 TL kâr", "4 TL zarar", "14 TL kâr", "6 TL zarar", "6 TL kâr"], "a": 4, "e": "Spot kullanım fiyatının üzerinde olduğundan opsiyon kullanılır: 70 - 60 = 10 TL brüt, prim düşülünce 6 TL net kâr."}, {"q": "Kullanım fiyatı 45 TL olan bir satım opsiyonu 3 TL prim ödenerek alınmıştır. Vade sonunda dayanak fiyatı 48 TL'dir. Hangisi doğrudur?", "o": ["Opsiyon kullanılmaz, alıcı 3 TL zarar eder", "Opsiyon kullanılır, 3 TL kâr", "Opsiyon kullanılır, 6 TL zarar", "Opsiyon kullanılmaz, alıcı zarar etmez", "Satıcı 3 TL zarar eder"], "a": 0, "e": "Satım opsiyonu spot kullanım fiyatının altındaysa kârlıdır; 48 > 45 olduğundan kullanılmaz, alıcı ödediği 3 TL primi kaybeder, bu prim satıcının kazancıdır."}, {"q": "Kullanım fiyatı 80 TL olan bir satım opsiyonunda dayanak varlığın spot fiyatı 85 TL'dir. Opsiyonun durumu nedir?", "o": ["Kârda", "Zararda", "Başabaş", "Aşırı kârda", "Başabaşa yakın kârda"], "a": 1, "e": "Satım opsiyonunda kullanım fiyatı spot fiyattan düşükse opsiyon zarardadır."}, {"q": "Diğer koşullar sabitken dayanak varlığın volatilitesinin artması alım ve satım opsiyonlarının primlerini nasıl etkiler?", "o": ["Alım primi artar, satım primi azalır", "Alım primi azalır, satım primi artar", "Her ikisinin primi de artar", "Her ikisinin primi de azalır", "Etkilemez"], "a": 2, "e": "Volatilite ve vadeye kalan süre arttıkça hem alım hem satım opsiyonlarının fiyatı artar."}, {"q": "Diğer koşullar sabitken piyasa faiz oranlarının artması opsiyon primlerini nasıl etkiler?", "o": ["Alım azalır, satım artar", "İkisi de artar", "İkisi de azalır", "Alım artar, satım azalır", "Yalnız Amerikan tipi opsiyonları etkiler"], "a": 3, "e": "Faiz artışı alım opsiyonunun fiyatını artırır, satım opsiyonunun fiyatını azaltır; temettü artışında ise tersi olur."}, {"q": "Varantlar ile VİOP'ta işlem gören opsiyonlar arasındaki farklarla ilgili hangisi yanlıştır?", "o": ["Varantlar Borsa İstanbul Pay Piyasası'nda işlem görür", "Varant özellikleri ihraççı tarafından belirlenir", "Varant alan yatırımcıdan teminat istenmez", "Opsiyon satıcısı teminat yatırmak ve tamamlama çağrısına uymak zorundadır", "Bireysel yatırımcı varant ihraç ederek yazıcı konumuna geçebilir"], "a": 4, "e": "Her varantın tek ihraççısı vardır (yatırım kuruluşları veya halka açık ortaklıklar); yatırımcı ihraççı olamaz, bu yüzden risk yaratmaz ve teminat istenmez."}]}, {"id": 13, "kisa": "GVK Geçici 67. Madde", "baslik": "Gelir Vergisi Kanunu Geçici 67. Madde Uygulaması", "ozet": "Tevkifata tabi olan ve olmayan gelirler, tevkifat matrahı, FIFO, zarar mahsubu ve aynı tür menkul kıymetler, araç bazında tevkifat oranları ile ihtiyari beyan.", "notlar": "\n<h3>Kapsam: tevkifata tabi gelirler<\/h3>\n<ul>\n<li>BİST'te işlem gören hisse senedi alım-satım kazançları; devlet tahvili ve hazine bonosu faiz ve alım-satım kazançları; özel sektör tahvil ve bono gelirleri; mevduat faizleri; repo gelirleri; katılım bankası kâr payları ve kâr-zarar ortaklığı belgesi kâr payları; vadeli işlem ve opsiyon gelirleri; menkul kıymet ödünç işlemi gelirleri; aracı kuruluş varantları; altına dayalı DİBS ve 4749 sayılı Kanuna göre kurulan VKŞ'lerin altına dayalı kira sertifikaları; yatırım fonu katılma payları; yatırım ortaklığı hisseleri; kira sertifikaları; kaldıraçlı işlem sözleşmeleri; <b>darphane sertifikaları<\/b>.<\/li>\n<\/ul>\n<h3>Tevkifata tabi olmayan gelirler<\/h3>\n<ul>\n<li><b>Hisse senedi kâr payları<\/b> (geçici 67 dışında; GVK m.94 kapsamında kesinti yapılır).<\/li>\n<li>Hazine'nin ve 4749'a göre kurulan VKŞ'lerin <b>yurt dışında<\/b> ihraç ettiği menkul kıymetlerin (eurobond) getirileri.<\/li>\n<li><b>Tam mükellef kurumların<\/b> BİST'te işlem gören ve <b>1 yıldan fazla<\/b> elde tuttuğu hisselerin satış kazancı.<\/li>\n<li>Portföyünün sürekli <b>en az %51<\/b>'i BİST hisselerinden oluşan fonların <b>1 yıldan fazla<\/b> elde tutulan paylarının satış kazancı (TEFAS'ta işlem görmeyen serbest fonlar hariç). Süre iktisap tarihinden hesaplanır.<\/li>\n<li>Tam mükellef kurumların yurt dışında ihraç ettiği tahvil faizleri ve tam mükellef VKŞ'lerin yurt dışı kira sertifikası gelirleri.<\/li>\n<li><b>1.1.2006<\/b>'dan önce ihraç edilmiş tahvil/bonolar ile TOKİ ve Özelleştirme İdaresi menkul kıymetleri; 1.1.2006'dan önce iktisap edilmiş menkul kıymetler (31.12.2005 mevzuatına tabi).<\/li>\n<\/ul>\n<h3>Menkul kıymet tanımı ve tevkifata tabi kişiler<\/h3>\n<ul>\n<li>Türkiye'de ihraç edilip SPK'ca kayda alınan ve/veya Türkiye'deki borsalarda işlem görenler ile kayda alınmamış olsa da Hazine veya kamu tüzel kişilerince ihraç edilenler. Bankalar ve aracı kurumlar aracılığıyla yapılan vadeli işlem, opsiyon ve kaldıraçlı işlem sözleşmeleri \"diğer sermaye piyasası aracı\" sayılır.<\/li>\n<li>Gelir sahibinin <b>gerçek/tüzel, tam/dar mükellef<\/b> olması veya gelirin istisna olması önemli değildir; vergiden muaf olanlar da tevkifata tabidir.<\/li>\n<\/ul>\n<h3>Tevkifat matrahı<\/h3>\n<ul>\n<li><b>Alım-satım:<\/b> satış bedeli - alış bedeli; alış ve satışta ödenen <b>komisyon ve BSMV<\/b> dikkate alınır, başka gider indirilemez.<\/li>\n<li><b>FIFO:<\/b> değişik tarihlerde alınan aynı kıymetin bir kısmı satılırsa <b>ilk giren ilk çıkar<\/b>. Aynı gün işlemlerde ağırlıklı ortalama fiyat bilgisi kullanılabilir ama matrah FIFO'ya göre belirlenir. Alımdan önce satış (açığa satış) halinde satıştan sonraki ilk alım esas alınır.<\/li>\n<li>Örnek: 500 adet 40 TL, 300 adet 50 TL alış; 600 adet 55 TL satış; komisyon 150 TL → maliyet 500 x 40 + 100 x 50 = 25.000; matrah 33.000 - 25.000 - 150 = <b>7.850 TL<\/b>.<\/li>\n<li><b>Dövize, altına endeksli<\/b> kıymetlerde alış ve satış bedelinin işlem tarihindeki TL karşılıkları esas alınır.<\/li>\n<li><b>Yabancı para cinsinden ihraç edilenlerde kur farkı dikkate alınmaz<\/b>; işlem anındaki kur, yoksa TCMB döviz alış kuru.<\/li>\n<li><b>İtfa:<\/b> itfa bedeli - alış bedeli. <b>Dönemsel getiri:<\/b> getiri tutarı. <b>Ödünç:<\/b> ödünç verenin aldığı bedel. Hepsinde komisyon ve BSMV dikkate alınır.<\/li>\n<\/ul>\n<h3>Zarar mahsubu ve aynı tür menkul kıymetler<\/h3>\n<ul>\n<li>Aynı türden olmak kaydıyla <b>üç aylık dönem<\/b> içindeki zararlar kârlardan mahsup edilir. Dönem sonucu zararsa izleyen üç aylık döneme <b>takvim yılı aşılmamak<\/b> kaydıyla devredilir; <b>son çeyrek zararı<\/b> ertesi yıla aktarılamaz.<\/li>\n<li>Örnek: 1. çeyrek +40.000 / -70.000 = -30.000; 2. çeyrek +50.000 → matrah 20.000 TL.<\/li>\n<\/ul>\n<table>\n<tr><th>Grup<\/th><th>Kapsam<\/th><\/tr>\n<tr><td>I<\/td><td>Sabit getirili menkul kıymetler<\/td><\/tr>\n<tr><td>II<\/td><td>Değişken getirili menkul kıymetler (hisse; hisse ve hisse endeksine dayalı vadeli/opsiyon, hisse dayanaklı BİST varantları, hisse senedi yoğun fon payları da burada)<\/td><\/tr>\n<tr><td>III<\/td><td>Diğer menkul kıymetler ve diğer SPA (menkul kıymete bağlı olmayan işlemler; hisse dışı dayanaklı varantlar)<\/td><\/tr>\n<tr><td>IV<\/td><td>Yatırım fonu katılma belgeleri ve yatırım ortaklığı hisseleri<\/td><\/tr>\n<\/table>\n<ul><li>Menkul kıymete dayalı vadeli işlem ve opsiyonlar ilgili kıymetin grubunda sınıflandırılır.<\/li><\/ul>\n<h3>Hisse senetleri<\/h3>\n<ul>\n<li><b>Kâr payı:<\/b> tam mükellef kurumdan alınanın <b>yarısı<\/b> istisna (GVK m.22/3); kalan, beyan haddini (<b>2025 için 330.000 TL<\/b>) aşarsa yıllık beyanname ile beyan edilir; dağıtımda kesilen <b>%15<\/b> tevkifatın (9286 sayılı CK, 22.12.2024'ten itibaren) <b>tamamı<\/b> mahsup edilir. Örnek: brüt 900.000 → istisna 450.000, kalan 450.000 > 330.000 → beyan; 135.000 TL mahsup.<\/li>\n<li>Dar mükellef AŞ/Ltd. kâr paylarının yarısı istisna: sermayenin en az <b>%50<\/b>'sine sahip olunması ve kâr payının beyanname tarihine kadar Türkiye'ye transferi şartıyla.<\/li>\n<li><b>Alım-satım:<\/b> 1.1.2006'dan itibaren iktisap edilen hisseler, hisse/endeks dayalı vadeli-opsiyon, BİST'te işlem gören aracı kuruluş varantları ve hisse senedi yoğun fon payları için oran <b>%0<\/b> (MKYO hisseleri hariç). Beyanname verilmez.<\/li>\n<\/ul>\n<h3>Araç bazında tevkifat oranları<\/h3>\n<table>\n<tr><th>Gelir<\/th><th>Oran<\/th><\/tr>\n<tr><td>DİBS (1.1.2006 sonrası ihraç), genel<\/td><td>%10 (1.10.2010'dan itibaren)<\/td><\/tr>\n<tr><td>DİBS, 22.12.2021 - 30.6.2026 (dahil) arasında iktisap edilen<\/td><td>%0<\/td><\/tr>\n<tr><td>Altına dayalı DİBS; darphane sertifikası; 4749 VKŞ altına dayalı kira sertifikası<\/td><td>%0<\/td><\/tr>\n<tr><td>Özel sektör tahvili (1.2.2025'ten itibaren iktisap)<\/td><td>%10<\/td><\/tr>\n<tr><td>SPK onaylı finansman bonosu; 1 yıldan kısa vadeli kira sertifikası (24.5.2020'den itibaren)<\/td><td>%15<\/td><\/tr>\n<tr><td>Tam mükellef VKŞ kira sertifikası (genel)<\/td><td>%10<\/td><\/tr>\n<tr><td>4749 VKŞ kira sertifikası, 22.12.2021 - 30.6.2026 iktisap<\/td><td>%0<\/td><\/tr>\n<tr><td>Mevduat (9.7.2025'ten itibaren açılan/yenilenen)<\/td><td>Vadesiz ve 6 aya kadar %17,5; 1 yıla kadar %15; 1 yıldan uzun %10<\/td><\/tr>\n<tr><td>Döviz tevdiat hesabı faizi<\/td><td>%25 (vade ayrımı yok)<\/td><\/tr>\n<tr><td>Enflasyona bağlı değişken faizli, 1 yıldan uzun vadeli hesap<\/td><td>%0<\/td><\/tr>\n<tr><td>Kâr-zarar ortaklığı belgesi, faizsiz kredi kâr payı<\/td><td>%15<\/td><\/tr>\n<tr><td>Repo<\/td><td>%15<\/td><\/tr>\n<tr><td>Vadeli işlem/opsiyon: hisse ve hisse endeksine dayalı<\/td><td>%0<\/td><\/tr>\n<tr><td>Vadeli işlem/opsiyon: diğer (döviz vb.)<\/td><td>%10<\/td><\/tr>\n<tr><td>Yatırım fonu (1.2.2025'ten itibaren iktisap)<\/td><td>%15<\/td><\/tr>\n<tr><td>Yatırım fonu (9.7.2025'ten itibaren iktisap)<\/td><td>%17,5<\/td><\/tr>\n<tr><td>Hisse senedi yoğun fon<\/td><td>%0<\/td><\/tr>\n<tr><td>GYF ve GSYF payları, 2 yıldan fazla elde tutulan<\/td><td>%0<\/td><\/tr>\n<tr><td>VDMK, İDMK, İTMK, VTMK<\/td><td>%10<\/td><\/tr>\n<tr><td>MKYO hisseleri<\/td><td>%10 (diğer yatırım ortaklıkları, ör. GYO, %0)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Fonlarda indirimli dönemler: 23.12.2020-30.4.2024 iktisap %0; 1.5.2024-31.10.2024 %7,5; 1.11.2024-31.1.2025 genel %10 (değişken, karma, eurobond, dış borçlanma, yabancı, serbest ve döviz fonları indirimden hariç).<\/li>\n<li>Mevduatta 1.2.2025'ten itibaren genel oranlara (%10, %12, %15) dönülmüş, 9.7.2025'ten itibaren kısa vadeler %15 ve %17,5 yapılmıştır. Banka tahvilleri, banka kira sertifikaları ve mevduatta 2020-2025 arası indirimli oranlar uygulanmış, 31.1.2025 tarihli 9487 sayılı CK ile son verilmiştir.<\/li>\n<li>Kur korumalı ve dönüşümlü hesaplarda 9.7.2025'ten itibaren 6 aya kadar %17,5, 1 yıla kadar %15.<\/li>\n<li><b>Eurobond:<\/b> geçici 67 dışında; faiz gelirleri 2025 beyan haddi <b>330.000 TL<\/b>'yi aşarsa beyan edilir; alım-satım kazancı maliyet endekslemesi sonrası kalan tutar ne olursa olsun beyan edilir. Dar mükellefler eurobond geliri için beyanname vermez.<\/li>\n<li>Yatırım ortaklığı kâr payları geçici 67 dışında; GVK m.94'e göre kesinti sonrası beyan esaslarına tabi.<\/li>\n<li>Geçici 67 kazançları <b>ticari faaliyet<\/b> kapsamında elde edilirse ticari kazanç beyannamesine dahil edilir, tevkif edilen vergi mahsup edilir, kalan iade edilir.<\/li>\n<\/ul>\n<h3>Dar mükellefler<\/h3>\n<ul>\n<li>Türkiye'de yerleşmiş olmayanlar yalnız Türkiye'de elde ettikleri gelir üzerinden vergilenir. Yatırım ve çifte vergilendirmeyi önleme anlaşmalarından yararlanma için <b>vergi kimlik numarası<\/b> almaları gerekir (pasaportun noter onaylı örneği; KKTC vatandaşlarında nüfus cüzdanı yeterli). Bankalar/aracı kurumlar toplu VKN alabilir; belgeler <b>İstanbul Defterdarlığı Boğaziçi Vergi Dairesi<\/b>'ne gönderilir.<\/li>\n<li>Anlaşmadan yararlanmak için yetkili makamca düzenlenen <b>mukimlik belgesi<\/b> aslı ve onaylı Türkçe tercümesi ibraz edilir.<\/li>\n<\/ul>\n<h3>İhtiyari beyan<\/h3>\n<ul>\n<li>Beyanname verilmeyecek denilen alım-satım kazançları için (dar mükellefler dahil) takvim yılı itibarıyla yıllık beyanname verilebilir; amaç tevkif edilen verginin <b>mahsup ve iadesi<\/b>dir.<\/li>\n<li>Süre: izleyen yılın <b>Mart ayı başından son günü akşamına<\/b> kadar; süre geçtikten sonra verilen ihtiyari beyana dayanılarak işlem yapılmaz. 269 Seri No'lu GVGT ekindeki beyanname kullanılır.<\/li>\n<li>Yer: tam mükellefler ikametgah vergi dairesi (veya bağlı olduğu); dar mükellefler <b>Boğaziçi Vergi Dairesi<\/b>.<\/li>\n<li>Yalnız <b>alım-satım<\/b> kazançları beyan edilir; faiz ve itfa gelirleri beyan edilmez.<\/li>\n<li>İhtiyari beyanda oranlar: hisse ve hisse dayalı türev/varant %0; hisse senedi yoğun fon ve 2 yılı aşan GSYF/GYF %0, diğer fonlar <b>%17,5<\/b>; altına dayalı DİBS, darphane sertifikası, 4749 VKŞ altın kira sertifikası %0; finansman bonosu ve 1 yıldan kısa kira sertifikası %15; diğer kazançlar <b>%10<\/b>.<\/li>\n<li>Aynı türden olmak şartıyla yıl içindeki zararların tamamı mahsup edilebilir; mahsup ve iade 252 Seri No'lu GVGT'ye göre; tevkif edilen vergiler beyannameye dahil kazançlara ilişkin olmalıdır.<\/li>\n<li>Örnek: aynı tür tahvillerden A bankasında 300.000 kâr (30.000 tevkifat), B bankasında 120.000 zarar → matrah 180.000, vergi 18.000, iade <b>12.000 TL<\/b>.<\/li>\n<li>Kitaptaki tablo örneğinde toplam iade 17.000 TL (sabit getirili 8.000, diğer 6.000, fon 3.000); beyanname 1-31 Mart 2026 arasında verilmelidir.<\/li>\n<\/ul>\n", "sorular": [{"q": "Aşağıdaki gelirlerden hangisi GVK geçici 67. madde kapsamında tevkifata tabi değildir?", "o": ["Hisse senedi kâr payları", "Repo gelirleri", "Mevduat faizleri", "Darphane sertifikası kazançları", "Yatırım fonu katılma payı kazançları"], "a": 0, "e": "Hisse senedi kâr payları geçici 67 kapsamı dışındadır; dağıtımda GVK m.94'e göre kesinti yapılır."}, {"q": "Geçici 67. madde tevkifatı uygulanırken gelir sahibinin niteliğiyle ilgili hangisi doğrudur?", "o": ["Yalnız tam mükellef gerçek kişilerden kesilir", "Gelir sahibinin gerçek veya tüzel, tam veya dar mükellef olması ve gelirin istisna olup olmaması önemli değildir", "Vergiden muaf olanlara uygulanmaz", "Yalnız dar mükelleflerden kesilir", "Kurumlar her durumda tevkifattan muaftır"], "a": 1, "e": "Tevkifatta gelir sahibinin statüsü veya gelirin istisna olması önemli değildir; vergiden muaf olanların gelirleri de tevkifata tabidir."}, {"q": "Bir yatırımcı aynı hisseden 500 adedi 40 TL'den, sonra 300 adedi 50 TL'den almış, ardından 600 adedi 55 TL'den satmıştır. Alım ve satımda toplam 150 TL komisyon ödemiştir. Tevkifat matrahı kaç TL'dir?", "o": ["6.600 TL", "8.000 TL", "7.850 TL", "7.250 TL", "8.900 TL"], "a": 2, "e": "FIFO ile maliyet 500 x 40 + 100 x 50 = 25.000 TL; satış 33.000 TL; matrah 33.000 - 25.000 - 150 = 7.850 TL. 6.600 TL ağırlıklı ortalama maliyet kullanılmasının sonucudur."}, {"q": "Tevkifat matrahının tespitinde alış ve satış bedeli dışında aşağıdakilerden hangisi dikkate alınır?", "o": ["Saklama ücretleri", "Danışmanlık giderleri", "Enflasyon farkı", "Komisyon ve banka ve sigorta muameleleri vergisi", "Finansman giderleri"], "a": 3, "e": "Alım-satımda ödenen komisyonlar ile BSMV dikkate alınır; başka gider indirilemez."}, {"q": "Yabancı para cinsinden ihraç edilmiş bir menkul n getirili", "Fon katılma belgeleri", "Diğer menkul kıymetler ve diğer sermaye piyasası araçları", "Hisse senetleriyle aynı grup"], "a": 3, "e": "Hisse senedi ve hisse senedi endeksleri dışında bir dayanağa bağlı varantlar III. grupta değerlendirilir."}, {"q": "Bir yatırımcı yıl içinde BİST hisselerinden 40.000 TL zarar, BIST 30 vadeli sözleşmesinden 50.000 TL kâr, devlet tahvilinden 20.000 TL kâr ve hisse dayanaklı varanttan 15.000 TL kâr etmiştir. Değişken getirili grubun net sonucu nedir?", "o": ["45.000 TL kâr", "10.000 TL kâr", "65.000 TL kâr", "5.000 TL zarar", "25.000 TL kâr"], "a": 4, "e": "Hisse, hisse endeksine dayalı vadeli ve hisse dayanaklı varant aynı gruptadır: -40.000 + 50.000 + 15.000 = 25.000 TL. Devlet tahvili sabit getirili gruptadır."}, {"q": "Bir yatırımcı tam mükellef kurumlardan 2025 yılında brüt 900.000 TL kâr payı almıştır. Kâr payının beyanıyla ilgili hangisi doğrudur?", "o": ["Yarısı olan 450.000 TL istisnadır; kalan 450.000 TL 330.000 TL beyan haddini aştığından beyan edilir ve kesilen 135.000 TL'nin tamamı mahsup edilir", "Tamamı istisnadır", "Kalan tutar beyan haddini aşmaz", "Kesilen vergi mahsup edilemez", "Geçici 67 kapsamında %0 tevkifatla nihai vergilenir"], "a": 0, "e": "Tam mükellef kurum kâr paylarının yarısı istisnadır; kalan 450.000 TL 2025 beyan haddini aşar. Yüzde 15 oranında kesilen 135.000 TL'nin tamamı mahsup edilir."}, {"q": "Gerçek kişilerin 1.1.2006'dan sonra iktisap ettikleri BİST hisselerinin alım-satım kazançlarına uygulanan tevkifat oranı ve beyan durumu nedir?", "o": ["%10, beyan edilir", "%0, beyanname verilmez", "%15, beyan edilir", "%17,5, beyanname verilmez", "Tevkifat yok, beyan edilir"], "a": 1, "e": "2008/14272 sayılı BKK ile tam ve dar mükellef gerçek kişiler için oran %0'dır ve yıllık veya münferit beyanname verilmez."}, {"q": "Bir yatırımcı VİOP'ta BIST 30 endeks sözleşmesinden 80.000 TL, Dolar/TL sözleşmesinden 80.000 TL kâr etmiştir. Toplam tevkifat tutarı kaç TL'dir?", "o": ["0 TL", "16.000 TL", "8.000 TL", "12.000 TL", "14.000 TL"], "a": 2, "e": "Hisse ve hisse endeksine dayalı sözleşmelerde %0, diğerlerinde %10 uygulanır: 80.000 x 0,10 = 8.000 TL."}, {"q": "9.7.2025 tarihinden itibaren iktisap edilen yatırım fonu katılma paylarından (hisse senedi yoğun fonlar hariç) elde edilen kazançlara uygulanan tevkifat oranı nedir?", "o": ["%0", "%10", "%15", "%17,5", "%25"], "a": 3, "e": "8.7.2025 tarihli 10041 sayılı CK ile 9.7.2025'ten itibaren iktisap edilen fonlar için oran %17,5'tir; 1.2.2025'ten itibaren iktisap edilenler için %15 idi."}, {"q": "Portföyünün sürekli en az yüzde 51'i BİST hisselerinden oluşan ve TEFAS'ta işlem gören bir fonun 14 ay elde tutulan payları satılmıştır. Hangisi doğrudur?", "o": ["%17,5 tevkifat yapılır", "%10 tevkifat yapılır", "Bir yılın hesabında fonun kuruluş tarihi esas alınır", "Yalnız serbest fonsa istisna uygulanır", "Gelir tevkifat kapsamında değildir"], "a": 4, "e": "Bu fonların bir yıldan fazla tutulan paylarından elde edilen kazanç tevkifat kapsamı dışındadır; süre payın iktisap tarihinden hesaplanır. TEFAS'ta işlem görmeyen serbest fonlar hariçtir."}, {"q": "Aşağıdaki kazançlardan hangisine yüzde 10 oranında tevkifat uygulanır?", "o": ["Menkul kıymet yatırım ortaklığı hisselerinin alım-satım kazancı", "GYO hisselerinin alım-satım kazancı", "Hisse senedi yoğun fon payı kazancı", "Altına dayalı DİBS kazancı", "Darphane sertifikası kazancı"], "a": 0, "e": "Yatırım ortaklığı hisseleri MKYO hariç %0'a tabidir; MKYO hisselerinin satış kazancı %10 tevkifata tabidir."}, {"q": "9.7.2025'ten itibaren açılan 6 aya kadar vadeli TL mevduat hesabının faizine uygulanan tevkifat oranı nedir?", "o": ["%10", "%17,5", "%12", "%15", "%25"], "a": 1, "e": "10041 sayılı CK ile vadesiz ve 6 aya kadar vadeli hesaplarda %17,5, 1 yıla kadar %15, 1 yıldan uzunlarda %10 uygulanır. Döviz tevdiat hesaplarında oran %25'tir."}, {"q": "Repo gelirlerine uygulanan tevkifat oranı ve beyan durumu nedir?", "o": ["%0, beyan edilir", "%10, beyanname verilmez", "%15, beyanname verilmez", "%17,5, beyan edilir", "%25, beyanname verilmez"], "a": 2, "e": "Repo gelirleri geçici 67/4 kapsamında %15 tevkifata tabidir ve yıllık beyanname verilmez."}, {"q": "SPK onaylı finansman bonolarından sağlanan gelirlere 2569 sayılı CK ile belirlenen tevkifat oranı nedir?", "o": ["%0", "%5", "%10", "%15", "%17,5"], "a": 3, "e": "Finansman bonoları ve bir yıldan kısa vadeli kira sertifikası gelirleri için oran %15'tir; özel sektör tahvillerinde genel oran %10'dur."}, {"q": "Hazine ve Maliye Bakanlığınca ihraç edilen bir devlet tahvili 10 Mart 2025'te iktisap edilmiştir. Bu tahvilin gelirlerine uygulanan tevkifat oranı nedir?", "o": ["%10", "%15", "%17,5", "%5", "%0"], "a": 4, "e": "22.12.2021 - 30.6.2026 (dahil) arasında iktisap edilen DİBS gelirlerine 4937 ve 10706 sayılı CK'lar gereği %0 uygulanır; genel oran %10'dur."}, {"q": "Yurt dışında ihraç edilen Hazine eurobondlarından elde edilen gelirlerle ilgili hangisi doğrudur?", "o": ["Geçici 67 tevkifatı dışındadır; faiz geliri 2025 beyan haddi olan 330.000 TL'yi aşarsa beyan edilir", "%10 tevkifatla nihai vergilenir", "Kur farkı nedeniyle her zaman vergisizdir", "Dar mükellefler beyanname vermek zorundadır", "Alım-satım kazancı hiçbir zaman beyan edilmez"], "a": 0, "e": "Eurobond gelirleri ihraç tarihi ne olursa olsun geçici 67 dışındadır; faiz 330.000 TL'yi aşarsa, alım-satım kazancı ise endeksleme sonrası tutarı ne olursa olsun beyan edilir. Dar mükellefler beyanname vermez."}, {"q": "İhtiyari beyanla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["İzleyen yılın Mart ayında verilir", "Faiz ve itfa gelirleri de ihtiyari beyana dahil edilir", "Dar mükellefler Boğaziçi Vergi Dairesi'ne beyanda bulunur", "Süresinden sonra verilen ihtiyari beyana dayanılarak işlem yapılmaz", "Aynı türden menkul kıymetlerin yıl içindeki zararları mahsup edilebilir"], "a": 1, "e": "İhtiyari beyan yalnız alım-satım kazançlarına ilişkindir; faiz ve itfa gelirlerinin beyanı söz konusu değildir."}, {"q": "Bir yatırımcı A bankasında aynı tür tahvillerden 300.000 TL kâr etmiş ve yüzde 10 oranında 30.000 TL tevkifata uğramış; B bankasında aynı türden 120.000 TL zarar etmiştir. İhtiyari beyanla isteyebileceği iade tutarı kaç TL'dir?", "o": ["30.000 TL", "18.000 TL", "12.000 TL", "20.000 TL", "0 TL"], "a": 2, "e": "Matrah 300.000 - 120.000 = 180.000 TL; hesaplanan vergi %10 ile 18.000 TL; iade 30.000 - 18.000 = 12.000 TL."}, {"q": "İhtiyari beyanda diğer yatırım fonu katılma paylarından (hisse senedi yoğun fon ve iki yılı aşan GSYF/GYF dışındaki) elde edilen kazançlara uygulanan oran nedir?", "o": ["%0", "%10", "%15", "%17,5", "%20"], "a": 3, "e": "Çalışma notuna göre ihtiyari beyanda diğer fon kazançları için %17,5, diğer kazançlar için %10 oranı uygulanır."}, {"q": "İki yıldan fazla süreyle elde tutulan gayrimenkul yatırım fonu ve girişim sermayesi yatırım fonu katılma paylarından elde edilen kazançlara uygulanan tevkifat oranı nedir?", "o": ["%10", "%15", "%17,5", "%5", "%0"], "a": 4, "e": "4454 sayılı CK ile oran %0 olarak belirlenmiştir ve bu gelirler için beyanname verilmez."}]}];
const P={"1": ["Merhaba, Sermaye Piyasası Araçları bir dersinin ilk bölümündeyiz. Bugün payın temelini konuşacağız. Anonim şirketi, payın türlerini, tedavüldeki ve fiili dolaşımdaki payları, değer kavramlarını ve pay sahibinin haklarını sırayla ele alacağız.", "Önce anonim şirketle başlayalım. Türk Ticaret Kanunu anonim şirketi şöyle tanımlar. Sermayesi belirli ve paylara bölünmüş, borçlarından dolayı yalnız malvarlığıyla sorumlu şirket. Madde numarası üç yüz yirmi dokuz. Bu tanımdaki yalnız kelimesi sınavın gözdesidir, aklında tut.", "Şimdi şöyle düşün. Bir gıda şirketinin yüzde sekiz ortağısın ve pay bedelini kuruşu kuruşuna ödedin. Şirket iflas etti, bankalar evine haciz koymak istiyor. Koyamazlar. Senin şirkete tek borcun taahhüt ettiğin sermayeyi ödemekti. Yönetim kurulunda değilsen vergi ve prim borçları için de kişisel olarak sorumlu tutulmazsın. Limited şirketten farkı tam da burası.", "Anonim şirketin iki zorunlu organı var. Genel kurul ve yönetim kurulu. Genel kurul en üst karar organıdır ama günlük işe karışmaz. Yönetim kurulunu seçer, ibra eder, kâr dağıtımına ve esas sözleşme değişikliğine karar verir, bağımsız denetçiyi seçer. Yönetim kurulunun ise devredemeyeceği görevler var. Muhasebe düzenini kurmak ve borca batıklıkta mahkemeye bildirmek bunların en çok sorulanları.", "Burada dur bir saniye, çünkü bir tuzak var. Eski kanundaki murakıplık, yani denetim kurulu, altı bin yüz iki sayılı Türk Ticaret Kanunu ile kaldırıldı. Bugün denetim komitesi, riskin erken saptanması komitesi gibi komiteler var ama bunlar organ değil. Kurumsal yönetim ilkelerine göre de yönetim kurulunun çoğunluğu icracı olmayan üyelerden oluşmalı. Bağımsız üyeler ise Türkiye'de yerleşik gerçek kişilerdir.", "Finansman tarafında iki yol var. Tahvil alan yatırımcı şirketin alacaklısıdır. Vadesi bellidir, getirisi faizle sınırlıdır, oy hakkı yoktur. Pay alan yatırımcı ise ortaktır. Vade yoktur, getiri garantisi yoktur ama potansiyel sınırsızdır. Şirket tasfiye edilirse önce devlet, çalışanlar ve alacaklılar ödenir. Pay sahibi en sonda, artık değerden pay alır.", "Gelelim paya. Payın nominal değeri bir kuruştan az olamaz. Kuruş ve katları şeklinde artırılabilir. Borsadaki şirketlerde genellikle bir liradır. Sınavda bir lira diye bir şık gördüğünde dikkat et, kanuni alt sınır bir kuruştur. Pay ortaklığa karşı bölünmez. Birden fazla sahibi varsa ortak bir temsilci atanır.", "Sermaye Piyasası Kanunu menkul kıymeti tanımlarken para, çek, poliçe ve bonoyu hariç tutar. Ama pay kelimesini kanunda tanımlamaz. Payın tanımı Pay Tebliği'ndedir. Sermayeyi temsil eden ve ortaklık hakkı veren menkul kıymet. Bir de şunu bil, her anonim şirket payı sermaye piyasası aracı değildir. Borsada işlem görenler ve kanun gereği halka açık sayılanlar bu kapsamdadır.", "Pay türlerine geçelim. Esas sözleşmede aksi yoksa her pay adi paydır. İmtiyazlı pay ise kâr payı, tasfiye payı, rüçhan ya da oy gibi bir konuda üstün hak verir. İmtiyaz kural olarak paya tanınır, kişiye değil. Oyda imtiyazda bir paya en fazla on beş oy verilebilir.", "Kitaptaki örnek çok öğretici. Sermayenin sadece yüzde onunu tutan imtiyazlı grup, payı başına on beş oyla toplam oyların yüzde altmış iki buçuğunu kontrol ediyor. Yüzde doksanı tutan adi pay sahipleri ise yüzde otuz yedi buçukta kalıyor. Ama oyda imtiyazın kullanılamadığı yerler var. Esas sözleşme değişikliği, ibra ve sorumluluk davası. Bunu mutlaka ezberle.", "Bedelsiz pay iç kaynaklardan ve kârdan çıkar, ortaktan para istenmez. Bedelli pay ise nakit artırımla çıkar. İlginç bir ayrıntı var. Birleşmede devralan şirketin verdiği paylar da bedelli sayılır, çünkü karşılığında malvarlığı alınmıştır. Nominal değerin üstünde satılan paylar primlidir, aradaki fark emisyon primi olarak özkaynaklarda izlenir.", "Kurucu ve intifa payları sık sorulur. Bu kişilere oy hakkı, genel kurula katılma hakkı gibi pay sahipliği hakları verilemez. Ama net kâra katılma, tasfiye bakiyesine katılma ve yeni pay alma gibi ekonomik haklar verilebilir. Kısacası para var, yönetim yok.", "Şimdi tedavüldeki paylar. Şirket kendi payını geri aldığında bu payların oy ve yönetim hakları donar. Kâr payı ve bedelsiz pay hakları ise saklı kalır. Tebliğin on sekizinci maddesine göre rüçhan hakkı kullanılamaz, satılıp nakde çevrilir. Ama dikkat, kitabın geri alım kısmı rüçhan konusunda farklı bir ifade kullanır. İki anlatımda ortak olan şu. Oy hakkı donar ve bu paylar toplantı nisabında sayılmaz. Tedavüldeki pay, toplam sermayeden geri alınan payların çıkarılmasıyla bulunur. Kâr daha az paya bölündüğü için hisse başına kazanç yükselir. Mesela yüz doksan milyon lira kâr ve yüz milyon pay varsa hisse başına bir virgül doksan. Beş milyon pay geri alınırsa iki liraya çıkar.", "Fiili dolaşımdaki pay ise halka açıklığı gösterir. Piyasada gerçekten el değiştirebilen paylardır. Hakim ortak, sermayenin yüzde on ve üstüne sahip ortaklar, yönetim kurulu üyeleri, şirket vakfı, rehinli ve hacizli paylar fiili dolaşıma girmez. Bu yüzde on eşiği daha önce yüzde beşti, iki bin on dört yılında yükseltildi. Borsa endekslerinde ağırlık fiili dolaşımdaki payların piyasa değerine göre verilir.", "Değer kavramlarını beş başlıkta topla. Nominal değer hukukidir. Defter değeri özkaynağın pay sayısına bölünmesidir. Tasfiye değeri her şey satılıp borçlar ödendikten sonra kalandır ve dip fiyat göstergesidir. Piyasa değeri borsadaki fiyattır. İçsel değer ise olması gereken değerdir. Fiyatı defter değerine bölersen piyasa değeri bölü defter değeri oranını bulursun.", "Kaydi sistem de kısa ama net bir konu. Sermaye Piyasası Kanunu'nun on üçüncü maddesi kayden ihracı esas alır. Haklar Merkezi Kayıt Kuruluşu nezdinde izlenir. Borsadaki şirketler için kâğıt senet basılmaz. Sadece ortak sayısı nedeniyle halka açık sayılan ve borsada işlem görmeyen şirketler ile kooperatiflerin kontrolündeki şirketler bu zorunluluğun dışında tutulmuştur.", "Son olarak pay sahibinin hakları. Mali haklar kâr payı, rüçhan, bedelsiz pay, tasfiye bakiyesi, ayrılma ve satma hakkıdır. Satma hakkı, bir ortak oyların yüzde doksan sekizine ulaştığında doğar. Yönetimsel haklar ise genel kurula katılıp oy kullanmak ve bilgi alıp incelemektir. Halka açık şirkette sermayenin yüzde beşini tutanlar azınlık sayılır.", "Toparlayalım. Birincisi, anonim şirket borçlarından yalnız malvarlığıyla sorumludur, borcunu ödemiş ortağa gidilemez. İkincisi, nominal değer en az bir kuruştur. Üçüncüsü, bir paya en çok on beş oy verilir ve oyda imtiyaz esas sözleşme değişikliği ile ibrada kullanılamaz. Dördüncüsü, geri alınan payların oyu donar ama kâr payı hakkı saklıdır. Beşincisi, yüzde on ve üstü ortakların payı fiili dolaşıma girmez."], "2": ["Merhaba, ikinci bölümdeyiz. Bu sefer payın getirisini ve riskini konuşacağız. Sonra yatırımcı psikolojisine, ardından borsa endekslerine geçeceğiz. En sonda da yüksek frekanslı işlemlere kısaca değineceğiz.", "Payın iki getiri kaynağı var. Temettü ve sermaye kazancı. Halka açık şirkette kâr payı Kâr Payı Tebliği'ne tabidir. Yönetim kurulu teklif eder, genel kurul karar verir. Analizde temettü denince nakit kâr payı kastedilir. Pay olarak verilen kâr payı nakit akışı yaratmadığı için ayrı değerlendirilir.", "Temettü verimini hesaplamak çok kolay. Hisse başına temettüyü hisse fiyatına bölüyorsun. Fiyatı yirmi beş lira olan pay elli kuruş temettü veriyorsa verim yüzde ikidir. Toplam temettüyü piyasa değerine bölsen de aynı sonucu bulursun. Yatırımcılar bu oranı mevduat ve tahvil getirileriyle kıyaslar.", "Sermaye kazancında kritik nokta şu. Pay otuz liradan elli liraya çıktıysa yirmi lira kazancın var ama satmadıkça bu kazanç gerçekleşmemiştir. Bir de temettü ve bedelsiz artırım fiyatı aşağı çeker. Bu seni yanıltmasın. Temettüde parayı alırsın, bedelsizde pay adedin artar. Ekonomik değerin değişmez.", "Şimdi riske geçelim. Risk, getirinin beklenen değerden sapma ihtimalidir. İki büyük grup var. Sistematik risk tüm piyasayı etkiler ve çeşitlendirmeyle yok edilemez. Beta katsayısıyla ölçülür. Sistematik olmayan risk ise şirkete ya da sektöre özgüdür ve iyi bir çeşitlendirmeyle büyük ölçüde azaltılabilir.", "Sistematik risklerin listesi şöyle. Piyasa riski, faiz ve enflasyon riski, döviz kuru riski ve politik risk. Faiz arttığında iskonto oranı yükselir, gelecekteki nakit akışlarının bugünkü değeri düşer. Üstelik borçlanma maliyeti artar ve tahviller cazipleşir. Sonuçta paylar genellikle değer kaybeder. Enflasyon da faiz beklentisi üzerinden aynı yöne iter.", "Döviz kuru riskine güzel bir örnek var. Yabancı bir yatırımcı Borsa İstanbul'da yüzde on kazandı diyelim. Aynı dönemde lira dolar karşısında yüzde on değer kaybettiyse dolar bazında kazancı neredeyse sıfırlanır. Korunmak için vadeli piyasadaki döviz kontratları ya da doğal korunma kullanılır.", "Sistematik olmayan tarafta üç risk var. İhraççı riski, sektörel risk ve likidite riski. Sınavda şuna dikkat et. Sektörel risk sistematik görünür ama kitap onu sistematik olmayan risk sayar, çünkü etkisi sınırlı sayıda şirkette yoğunlaşır. Likidite riski de pozisyon büyüdükçe artar. Bu yüzden büyük fonlar için daha belirgindir. Alt Pazar ve Yakın İzleme Pazarı gibi sığ pazarlarda alış satış makası açılır.", "Gelelim davranışsal finansa. Altı eğilimi bilmen gerekiyor. Sürü davranışı, aşırı güven, kayıptan kaçınma, çapalama, doğrulama yanlılığı ve temsil. Sınav bunları genellikle küçük bir hikâyeyle sorar. O yüzden her birini bir sahneye bağlayalım.", "Arkadaşları ve sosyal medya yüzünden kendi analizine rağmen halka arza giren yatırımcı sürü davranışı gösterir. Geçen yılki kazancını kendi dehasına bağlayıp tüm parasını tek hisseye koyan aşırı güvenir. Kârdakini erkenden satıp zarardakini bırakamayan kayıptan kaçınır. Altmış liralık zirveyi aklından çıkaramayıp kırk beşi ucuz sanan çapalamaya düşer.", "Yalnız kendi fikrini destekleyen haberleri okuyan doğrulama yanlılığı yaşar. Küçük bir girişimi dev bir teknoloji markasına benzetip aynı başarıyı bekleyen de temsil yanılgısına düşer. Bir de şu yanılgıyı unutma. Sert düşen hisse ucuzladı ve riski azaldı sanılır. Oysa sert düşüş oynaklığın, yani riskin arttığını gösterir.", "Düzenleyici tarafta aracı kurum seni önce bilgilendirme formu ve risk bildirim formuyla uyarır. Uygunluk testinde ürün sana uygun değilse kurum yazılı uyarır, ama sen ısrar edersen işlem yapılabilir. Yerindelik testi daha sıkıdır. Danışmanlık ve portföy yöneticiliğinde uyumsuz işleme hiç izin verilmez. Aracı kurum batarsa Yatırımcı Tazmin Merkezi belirli sınırlar içinde tazmin eder.", "Endekslere geçelim. Borsa İstanbul'un genel göstergesi BIST yüz endeksidir. BIST otuz ise vadeli işlem ve opsiyon piyasasında endeks sözleşmelerinin dayanağıdır. Türkiye'deki temel endeksler fiili dolaşım piyasa değeri ağırlıklıdır. Fiyat ağırlıklı yönteme örnek ise Amerika'daki Dow Jones endeksidir. Bileşenler üç ayda bir güncellenir.", "Endeks hesabı basit bir bölme. Fiili dolaşımdaki payların toplam piyasa değerini bölen değerine bölersin. Baz yılda piyasa değeri yüz milyar lira ve endeks yüz ise bölen bir milyardır. Bugün piyasa değeri altmış beş milyara indiyse endeks altmış beştir, yani yüzde otuz beş kayıp var. Bölen değeri, sermaye artırımı ya da endekse pay eklenmesi gibi olayların endeksi yapay olarak oynatmasını engeller.", "Fiyat endeksi ile getiri endeksi farkını bir örnekle düşün. Elli liralık pay beş lira temettü dağıtınca kırk beşe iner. Fiyat endeksi bu düşüşü yansıtır. Getiri endeksi ise temettünün yeniden yatırıldığını varsayar ve düşüşü telafi eder. Bedelsiz artırım her iki endeksi de etkilemez. Bedelli artırımın etkisi ise bölen değeri ayarlanarak nötrlenir. Uzun vadeli performans için getiri endeksi daha doğru ölçüttür.", "Bir de ağırlık sınırlamalı endeksler var. Standart BIST yüz endeksinde tek bir paya üst sınır yok. Ama yüzde on veya yüzde yirmi beş sınırlamalı versiyonlarda tek bir şirketin endeksi domine etmesi engellenir. Fon yöneticileri bu yüzden bu endeksleri sever.", "Son konu yüksek frekanslı işlemler. Bunlar algoritmik işlemlerin en hızlı türüdür ve mikrosaniyelerle çalışır. Sunucular eş yerleşim, yani kolokasyon sayesinde borsaya fiziksel olarak en yakın yere konur. Çok emir gönderip hızla iptal ettikleri için emir işlem oranı yüksektir. Stratejileri piyasa yapıcılığı, istatistiksel arbitraj ve gecikme arbitrajıdır. Makası daraltırlar ama ani çöküş ve likidite boşluğu riski taşırlar.", "Toparlayalım. Birincisi, temettü verimi hisse başına temettünün fiyata bölünmesidir. İkincisi, sistematik risk çeşitlendirmeyle yok edilemez ve beta ile ölçülür. Üçüncüsü, sektörel risk ve likidite riski sistematik olmayan risk sayılır. Dördüncüsü, altı davranışsal eğilimi hikâyesiyle tanı. Beşincisi, endeks değeri fiili dolaşım piyasa değerinin bölene bölünmesidir ve getiri endeksi temettüyü yeniden yatırılmış kabul eder."], "3": ["Merhaba, üçüncü bölümdeyiz. Bu bölüm sınavın en çok sayı soran kısmı. Pay ihracını üç tebliğ üzerinden konuşacağız. İzahname ve İhraç Belgesi Tebliği, Pay Tebliği ve Satış Tebliği. Sonra halka arz dağıtımını ve Kurulun iki bin yirmi dört tarihli ilke kararını ele alacağız.", "İzahnameyle başlayalım. Halka arz yapacaksan ya da payın borsada işlem görecekse izahname şart. Halka arz etmeden, mesela sadece nitelikli yatırımcılara ya da tahsisli satış yapacaksan izahname değil ihraç belgesi hazırlarsın. Onaylı izahname yayımlamadan halka arz yapmak ise suçtur.", "Muafiyetler şöyle. Yatırımcı başına en az dokuz buçuk milyon liralık alım yapılan halka arzlar ve birim nominali dokuz buçuk milyon lira olan araçlar muaf. Bir de toplam satışı yüz kırk iki buçuk milyon liranın altındaki halka arzlarda ihraççı isterse Kurul muafiyet verebilir. Ama dikkat, bu sonuncusu payların ilk halka arzında uygulanmaz. Bedelsiz pay çıkarmak da izahname gerektirmez.", "İzahname tek belge ya da birden fazla belge olabilir. Çoklu belgede üç parça var. İhraççı bilgi dokümanı şirketi anlatır. Sermaye piyasası aracı notu payı anlatır. Özet de ikisinin kısa hâlidir. Rüçhan hakkı bilgileri araç notunda durur. Geçerli bir ihraççı bilgi dokümanın varsa sonraki halka arzda sadece araç notu ve özet yeterli.", "Süreleri bir kerede toparlayalım, çünkü sınav bunları çok sever. Kurul başvuruyu on iş gününde karara bağlar, ilk halka arzda bu süre yirmi iş günü. İzahname on iki ay geçerli. Onaydan sonra on beş iş günü içinde ilan edilir. Nerede yayımlandığı on iş günü içinde ticaret siciline tescil edilir ama satışa başlamak için bu tescili beklemen gerekmez. İzahname değişirse talepte bulunan yatırımcı iki iş günü içinde talebini geri alabilir.", "Onayın anlamına da dikkat. Kurul onayı bilgilerin doğruluğunu garanti etmez, reklamda kullanılamaz ve yatırım tavsiyesi değildir. Zarardan ilk sorumlu ihraççıdır. Ondan tahsil edilemezse halka arz eden, lider aracı kurum, garantör ve yönetim kurulu üyeleri devreye girer. Sadece özete dayanarak kimse sorumlu tutulamaz.", "Şimdi Pay Tebliği. İhraççı ile halka arz eden farklıdır. İhraççı payları çıkaran şirkettir. Halka arz eden ise elindeki payı satan ortaktır. Sermaye artırımıyla halka arzda para şirketin kasasına girer. Ortak satışında ise para satan ortağa gider.", "İki bin yirmi altıda başvuracak şirket için büyüklük şartı şöyle. İki bin yirmi beş aktif toplamı üç virgül altı milyar lira ya da net satışı bir virgül sekiz milyar lira olmalı. İki bin yirmi dört için de iki virgül dört milyar aktif ya da bir virgül iki milyar hasılat. Burada veya bağlacına dikkat et, ikisinden birini sağlamak yeterli. Bir de ilişkili taraflardan ticari olmayan alacaklar tüm alacakların yüzde yirmisini ya da aktiflerin yüzde onunu geçemez.", "Yüklenim konusu klasik bir hesap sorusu. Halka arz yedi yüz elli milyon liranın altındaysa aracı kurum satılamayan payların tamamını almayı taahhüt eder. Yedi yüz elli milyon ile bir buçuk milyar arasındaysa yedi yüz elliye kadar olan kısmın tamamını, aşan kısmın yarısını alır. Bir buçuk milyarın üstünde zorunluluk yok. Mesela bir milyar üç yüz milyonluk halka arzda yüklenim bir milyar yirmi beş milyon lira olur.", "Satış kısıtlarını bir tabloya oturtalım ama sözle. Aracı kurum yüklenimle aldığı payları altı ay halka arz fiyatının altında borsada satamaz. Yüzde on ve üstü ortaklar bir yıl halka arz fiyatının altında satamaz. Kurulun ilke kararına göre dağıtımdan pay alan yatırımcı doksan gün borsa dışında satamaz, başka hesaba virman yapamaz. Mevcut ortaklar ise izahname onayından itibaren yüz seksen gün borsada da satamaz.", "Fiyat istikrarı işlemlerinde iki tane yüzde yirmi var. Kullanılacak fon brüt halka arz gelirinin yüzde yirmisini, alınacak pay da halka arz edilen nominalin yüzde yirmisini geçemez. Süre en çok otuz gündür. Aracı kurum halka arz fiyatının üstünde alım yapamaz, fiyat altına düşünce alım yapar. Süre bitince ertesi iş günü Kamuyu Aydınlatma Platformu'nda açıklama yapılır.", "İki yüzde yirmi beş de satışa hazır bekletilen paylarda. Halka arz dokuz yüz elli milyon liranın altındaysa nominalin yüzde yirmi beşi bekletilir. Bu payların satışına, borsa fiyatı halka arz fiyatının yüzde yirmi beş fazlasını aşmadıkça başlanamaz. Bir yılda satılamazsa iptal olur. Ek pay satışı ise yine yüzde yirmi ile sınırlı ve ortaklardan ödünç alınarak da yapılabilir.", "Rapor takvimine geç. Fiyat tespit raporu halka arzdan en az üç gün önce ilan edilir. Aynı kuruluş işlem başladıktan sonraki bir yıl içinde en az iki değerlendirme raporu yazar. İlki altı ay sonra, ikisi arası en az dört ay. Şirket de iki yıl boyunca varsayımların tutup tutmadığını on iş günü içinde raporlar. Ön talep toplama ise en fazla on iş günü sürer ve sonuçları açıklanamaz.", "Halka arz edilmeksizin satışta tahsisli satışın sihirli sayısı yüz elli. Belli bir anda aracı tutan yatırımcı sayısı yüz elliyi geçmemeli. Sayarken müşterek hesap sahiplerini tek tek sayarsın, nitelikli yatırımcıları hiç saymazsın. Sınır aşılırsa ihraççı yirmi iş günü içinde izahname ve borsa başvurusu yapar. Nitelikli yatırımcıya satışta ise sayı sınırı yoktur.", "Gelelim dağıtıma. Borsa dışında sabit fiyatla talep toplamada yatırımcı gruplarına tahsisat yapılır. Bireysele ve kurumsala en az yüzde onar ayrılır. Süre iki ile yirmi iş günü arasıdır. Fazla talepte eşit dağıtım yapılır. Tahsis edilen payı talep eden sayısına bölersin, bu miktarın altında kalanları tam karşılarsın, kalanı tekrar eşit bölersin. Aynı kişi birden fazla talep verdiyse en yüksek talebi alınır.", "Borsada sabit fiyat yönteminde ise tahsisat yok, herkes eşit. Süre en fazla üç iş günü ve emirler iptale kadar geçerlidir. Burada fiyat önceliği yok, sadece zaman önceliği var. Aynı yatırımcı farklı kurumlardan birkaç emir verse bile sadece ilk emri sayılır. Fazla talepte sırayla herkese birer lot verilir ve bu tur paylar bitene kadar döner. Takas dağıtımdan iki iş günü sonra yapılır.", "Kurulun ilke kararından en sık sorulanlar şunlar. Yedi yüz elli milyon lira ve altındaki halka arzlarda borsada satış zorunlu. Daha büyüklerde bireysele eşit dağıtım yapılır. Yüksek talepte bulunanlara en fazla yüzde on ayrılabilir. Kurumsal tahsisin en az yarısı yatırım ve emeklilik fonlarına gider. Bir kurumsala en fazla yüzde bir, bir portföy şirketinin fonlarına toplamda yüzde üç verilebilir.", "Toparlayalım. Birincisi, ilk halka arzda Kurul inceleme süresi yirmi iş günü, izahname on iki ay geçerli. İkincisi, yüklenim yedi yüz elli milyonun altında tamamı, bir buçuk milyara kadar kademeli. Üçüncüsü, fiyat istikrarında yüzde yirmi fon, yüzde yirmi pay, otuz gün. Dördüncüsü, dağıtımdan alan doksan gün, mevcut ortak yüz seksen gün kısıtlı. Beşincisi, tahsisli satışta sınır yüz elli kişi. Altıncısı, borsada satışta ilk emir sayılır ve dağıtım birer lot dairesel yapılır."], "4": ["Merhaba, dördüncü bölümdeyiz. Kurumsal eylemleri konuşacağız. Temettü, bedelli ve bedelsiz sermaye artırımı, sermaye azaltımı, pay geri alımı ve son olarak azınlık pay sahibinin çıkış hakları. Bu bölümde formüller var, ama hepsi aslında aynı mantığa dayanıyor.", "O mantık şu. Kurumsal eylemlerde Borsa fiyatı düzeltir ve senin toplam varlığın teorik olarak değişmez. Temettüde fiyat düşer ama parayı alırsın. Bedelsizde fiyat bölünür ama pay sayın artar. Bunu aklında tutarsan formüller kendiliğinden yerine oturur.", "Temettüyle başlayalım. Kâr payı dağıtım kararını yalnız genel kurul verir. Yönetim kurulu ancak esas sözleşmede hüküm ve genel kurul yetkisi varsa, o yılla sınırlı kâr payı avansı dağıtabilir. Temettü taksitle de ödenebilir, ama payları borsada işlem görmeyen şirketler taksit uygulayamaz. Alınmayan temettü beş yıl sonra zamanaşımına uğrar ve Hazineye geçer.", "Tarihlere dikkat. Hak kullanım tarihi payın temettüsüz işlem gördüğü ilk gündür ve fiyat o gün düzeltilir. Kayıt tarihi bir sonraki iş günüdür. Temettü almak istiyorsan payı hak kullanım tarihinden bir önceki iş günü kapanışında elinde tutmalısın. Teorik fiyat basit. Önceki kapanıştan brüt temettüyü çıkarırsın. Yüz yirmi liralık pay beş lira dağıtırsa yüz on beşten açılır.", "Vergide stopaj yüzde on beş. Beş liralık brüt temettüde yetmiş beş kuruş kesilir, hesabına dört lira yirmi beş kuruş geçer. Gelir Vergisi Kanunu'na göre kâr payının yarısı istisnadır. Kalan yarısı beyan haddini aşarsa beyan edilir ve kesilen stopaj mahsup edilir. Aşmazsa stopaj nihai vergi olur.", "Bedelli sermaye artırımına geçelim. Şirket yeni para toplar, pay sayısı artar ve senin oranın seyrelir. Bunu önlemek için rüçhan hakkı var. Kullanım süresi on beş günden az, altmış günden fazla olamaz. Kullanım da izahnamenin ilanından sonraki on gün içinde başlatılmalı. Kayıtlı sermayeli şirkette artırım kararını yönetim kurulu alabilir.", "Teorik fiyat formülünü sözle anlatayım. Kapanış fiyatına, artırım oranı ile kullanım fiyatının çarpımını eklersin. Sonra bunu bir artı artırım oranına bölersin. Kitaptaki örnekte dokuz liralık payda yüzde iki yüz bedelli ve bir lira kullanım fiyatıyla sonuç üç virgül altmış yedi lira çıkıyor. Rüçhan hakkının değeri de ana pay teorik fiyatından kullanım fiyatını çıkarıp artırım oranıyla çarparak bulunur. Burada beş virgül otuz üç lira.", "Rüçhan hakkı pazarına dikkat. Pazar kullanım süresinin tamamı boyunca açık değildir. Son işlem günü, süre sonundan önceki beşinci iş günüdür. O yüzden genelde beş ile yedi iş günü açık kalır. Pazar kapandıktan sonra hakkını satamazsın ama süre bitene kadar parasını yatırıp kullanabilirsin. Hiçbir şey yapmazsan hak değersizleşir ve kaybedersin.", "Kullanılmayan haklar karşılığı kalan paylar ne olur? Önce tasarruf sahiplerine satış duyurusu yapılır. Sonra rüçhan bitiminden itibaren on iş günü içinde borsada satışa başlanır. Satış iki iş günü sürer ve nominal değerin altında satış yapılamaz. Fiyat nominalin üstündeyse aradaki fark emisyon primi olarak şirkete kalır. Satılamayan paylar iptal edilir.", "Vergi tarafında rüçhan hakkını kullanmak vergi doğurmaz. Borsada satarsan bu bir alım satım kazancıdır ve gerçek kişi için stopaj oranı yüzde sıfırdır. Yalnız menkul kıymetler yatırım ortaklığı paylarında oran yüzde ondur. Bu istisna da iki bin altı yılından sonra edinilen paylar için geçerli.", "Bedelsiz artırımda şirkete para girmez, sadece iç kaynaklar sermayeye aktarılır. Teorik fiyatı bulmak için kapanış fiyatını bir artı bedelsiz oranına bölersin. Elli liralık payda yüzde dört yüz bedelsiz yapılırsa fiyat on liraya iner, ama yüz payın beş yüz olur. Değer aynı kalır. Değer artış fonları ve ara dönem kârları sermayeye eklenemez.", "Bedelsizde bir sınır daha var. Dönem kârı dışındaki iç kaynaklardan yapılan artırımda, düzeltilmiş fiyat iki liranın altına düşecekse başvuru işleme alınmaz. Hesap son otuz günün ağırlıklı ortalama fiyatıyla yapılır. Mesela ortalama dokuz lira ise yüzde dört yüz bedelsiz fiyatı bir virgül seksene indirir ve başvuru reddedilir.", "Sermaye azaltımı iki türlüdür. Fon çıkışı gerektiren azaltımda ortaklara para iade edilir ve Türk Ticaret Kanunu hükümleri uygulanır. Fon çıkışı gerektirmeyen azaltım ise Pay Tebliği'nde düzenlenmiştir ve genelde bilanço açığını kapatmak için yapılır. Şart, payın borsada nominalin altında işlem görmesi. Düzeltilmiş fiyat nominalin yüzde yirmi fazlasını, yani bir lira nominalde bir lira yirmi kuruşu geçmemeli.", "Bunu bir örnekle düşün. Seksen kuruşluk payda yüzde otuz azaltım yaparsan fiyatı yetmiş kuruşa bölersin ve bir lira on dört kuruş bulursun. Bin payın yedi yüze iner ama değer yine sekiz yüz lira civarındadır. Azaltımla eş zamanlı ya da sonraki iki yıl içinde yapılacak artırımlarda yatırımcıya risk bildirim formu imzalatılır.", "Pay geri alımında programı yönetim kurulu hazırlar, genel kurul onaylar. Ama son bir ayda fiyat nominalin altında kaldıysa ya da yüzde yirmiden fazla düştüyse yönetim kurulu doğrudan başlayabilir. Geri alınan paylar sermayenin yüzde onunu geçemez. Günlük alım son yirmi günlük ortalama hacmin dörtte birini geçemez. Açılış seansında ve birinci seansın son on beş dakikasında alım yapılmaz.", "Şimdi azınlığın üç çıkış kapısı. Birincisi zorunlu pay alım teklifi. Biri oyların yüzde ellisinden fazlasını ya da yönetim kurulu çoğunluğunu seçme hakkını ele geçirirse diğer ortaklara teklif yapmak zorundadır. Fiyat, son altı ayda ödediği en yüksek bedel ile son altı ayın ortalama borsa fiyatından düşük olamaz. Payları alan yeni hakim ortaktır, şirket değil.", "İkincisi ayrılma hakkı. Birleşme, bölünme ya da faaliyet konusunun tamamen değişmesi gibi önemli işlemlerde doğar. Ama pasif bekleyerek olmaz. Açıklama tarihinde ortak olmalı, genel kurula katılıp ret oyu vermeli ve muhalefetini tutanağa yazdırmalısın. Fiyat Yıldız Pazar'da bir aylık, diğer pazarlarda altı aylık ortalamaya göre belirlenir. Payları şirket alır.", "Üçüncüsü satma hakkı. Hakim ortak oyların yüzde doksan sekizine ulaşınca hem o seni çıkarabilir hem de sen ona satabilirsin. Genel kurula katılman gerekmez. Değerleme raporu özetinin açıklandığı günün ertesinden itibaren iki ay içinde şirkete yazılı talep vermen yeterli. Bu süre hak düşürücüdür, kaçırırsan hakkını kaybedersin.", "Toparlayalım. Birincisi, temettüde teorik fiyat kapanış eksi brüt temettüdür ve hak için bir önceki iş günü kapanışında payı tutman gerekir. İkincisi, rüçhan süresi on beş ile altmış gün arasıdır ve pazar süre sonundan beş iş günü önce kapanır. Üçüncüsü, bedelsizde fiyat bir artı orana bölünür ve iki lira sınırı vardır. Dördüncüsü, azaltımda düzeltilmiş fiyat bir lira yirmi kuruşu geçmez. Beşincisi, geri alım sınırı yüzde on, zorunlu teklif yüzde elliyi aşınca, satma hakkı yüzde doksan sekizde doğar."], "5": ["Merhaba, beşinci ve bu kısmın son bölümündeyiz. Bugün borsanın mutfağına giriyoruz. Pazarlar, fiyat adımları ve sınırlar, seans saatleri, açılış fiyatının nasıl bulunduğu, devre kesiciler, emir tipleri, açığa satış ve brüt takas. Bol kural var ama mantığı oturunca kolaylaşıyor.", "Önce pazarlar. Yıldız Pazar büyük şirketlerin, Ana Pazar orta büyüklüktekilerin, Alt Pazar ise ikisine giremeyenlerin pazarıdır. Yıldız için piyasa değeri altı milyar liradan, fiili dolaşımdaki payların değeri bir milyar liradan büyük olmalı. Ana Pazar'da bu eşikler bir milyar ve dört yüz milyon lira. İkisinde de fiili dolaşım oranı yüzde onun üstünde olmalı.", "Burada dur bir saniye, çünkü sınavın sevdiği bir kural var. Her pay, bulunduğu pazarın tüm kriterlerini sağlamalı. Yani piyasa değeri beş milyar olan bir şirket diğer her şeyi sağlasa bile Yıldız'a giremez. Değerlendirme yılda en az iki kez yapılır. Yeni işlem görmeye başlayan şirket ilk üç ay değerlendirmeye alınmaz.", "Yakın İzleme Pazarı, sorunlu şirketlerin pazarıdır. Bağımsız denetçinin olumsuz görüş vermesi, faaliyetin üç aydan uzun durması, üst üste beş yıl zarar ya da ilişkili taraf alacaklarının aktiflerin yarısını aşması gibi nedenlerle buraya alınır. Kararı Borsa İstanbul yönetim kurulu verir. Girişim Sermayesi Pazarı ise sadece nitelikli yatırımcılara açıktır. Piyasa Öncesi İşlem Platformu da halka açık ama borsada işlem görmeyen şirketler içindir.", "Pazarların işlem kurallarında şu ayrımı ezberle. Yıldız, Ana ve Alt Pazar sürekli işlem görür. Yakın İzleme Pazarı ve Piyasa Öncesi İşlem Platformu günde beş kez tek fiyatla işlem görür. Açığa satış ve kredili işlem sadece Yıldız ve Ana Pazar'da var. Brüt takas ise Alt Pazar, Yakın İzleme ve Piyasa Öncesi Platformunda uygulanır. Bu üç sığ pazarda yatırımcıya ilk işlemden önce bilgilendirme metni okutulur.", "Gelelim fiyatlara. Bir lot, bir lira nominal değerli bir paydır. Baz fiyat önceki günün kapanışıdır ve gün içi sınırlar buna göre hesaplanır. Gün içinde hiç işlem olmazsa aynı baz fiyat ertesi gün de geçerlidir. Yeni pay alma haklarında ise ilk gün baz fiyat yoktur.", "Fiyat adımında sık yapılan hata şu. Adım, baz fiyata göre değil emrin girildiği fiyat seviyesine göre belirlenir. Yirmi liranın altında adım bir kuruş, yirmi ile elli arasında iki kuruş, elli ile yüz arasında beş kuruştur. Yüz ile iki yüz elli arasında on kuruş, iki yüz elli ile beş yüz arasında yirmi beş kuruş. Baz fiyat iki yüz kırk sekiz lira olsa bile iki yüz elli bir liradan emir girersen adım yirmi beş kuruştur.", "Fiyat değişim sınırlarında kitaptaki tablo Yıldız için yüzde yirmi, Ana için yüzde on beş, Alt Pazar, Yakın İzleme ve Piyasa Öncesi için yüzde on der. Ama dikkat, iki bin yirmi yılındaki bir duyuruyla Yıldız ve Ana Pazar'da marj yüzde ona indirildi. Yeni pay alma haklarında ise sınır yüzde ellidir. Sınırlar hesaplanırken yuvarlama hep içeri doğru yapılır. Tavan aşağı, taban yukarı yuvarlanır.", "Seans saatlerine geçelim. Açılışta emir toplama dokuz kırkta başlar, dokuz elli beşte biter. Sürekli işlem ondan on sekize kadar sürer. Kapanış seansı on sekizden on sekiz yediye, kapanış fiyatından işlemler de on sekiz yediden on sekiz ona kadardır. Halka arzların yapıldığı birincil piyasa ise on buçuk ile on üç arasında çalışır.", "Açılış seansında emirler toplanır ama eşleşme yapılmaz. Son beş dakikada emri iptal edemez, fiyatını kötüleştiremez, miktarını azaltamazsın. Ama fiyatı iyileştirebilirsin. Yani alış emrinin fiyatını yükseltmek serbesttir. Bu son beş dakikaya sistemin rastgele seçtiği en fazla otuz saniye de eklenir.", "Açılış fiyatı nasıl bulunur? Önce en çok işlemin gerçekleşeceği fiyata bakılır. Eşitlik varsa arta kalan miktarın en az olduğu fiyat seçilir. Yine eşitse piyasa yönüne bakılır. Alış ağırlıklıysa yüksek fiyat, satış ağırlıklıysa düşük fiyat. O da eşitse referans fiyata en yakın fiyat. Dengeleyici emirler bu hesaba girmez, sadece eşleşmeden kalanlarla işlem yaparlar.", "Kapanış seansında yeni bir marj var. Emirler son işlem fiyatının yüzde üç altı ile yüzde üç üstü arasında olmalı. Ama günlük tavanı ve tabanı da aşamaz. Mesela son işlem otuz lira, günlük tavan otuz buçuksa, kapanışta en yüksek emir otuz virgül doksan değil otuz buçuk olur. Kapanış fiyatından işlemler iki dakika sürer ve sadece kapanış fiyatından emir girilir.", "Şimdi devre kesiciler. Pay bazında devre kesici sadece paylarda ve sürekli işlem sırasında çalışır. Çalışınca emir toplamaya geçilir, ardından iki dakikalık eşleştirme yapılır. En sevilen soru şu. Saat on yedi kırk beş ile on sekiz arasında çalışırsa emir toplama doğrudan kapanış seansına bağlanır ve eşleştirme kapanış seansının emir toplaması bitince yapılır.", "Endekse bağlı devre kesici ise BIST yüz endeksi önceki kapanışa göre yüzde altı düşünce tüm pay piyasasını durdurur. Önce on dakika durdurma, sonra beş dakika emir toplama ve beş dakika içinde eşleştirme. Aynı gün ikinci kez yüzde altı aşılırsa tekrar çalışmaz. On yedi otuzdan sonra devreye girerse işlemler kapanış seansına kadar durur.", "Emir tiplerinde iki ikiliyi karıştırma. Piyasa emri fiyatsızdır ve sadece kalanı iptal et olarak gönderilir, eşleşmeyen kısım iptal olur. Piyasadan limite emir de fiyatsızdır ama sadece en iyi kademeyle eşleşir, kalan kısmı son işlem fiyatından limit emre dönüşüp bekler. Orta nokta emri en iyi alış ve satışın ortalamasından fiyatlanır, yüz bin lira ile otuz milyon lira arasında olmalıdır. Ağırlıklı ortalama fiyat emrinde ise sınır yüz bin lot ile on milyon lottur. İkisi de sadece BIST otuz paylarında var.", "Önceliğe gelince, önce fiyat, sonra zaman. Fiyatı değiştirir ya da miktarı artırırsan zaman önceliğini kaybedersin. Emrin süresini uzatırsan da önceliğini kaybedersin, kısaltırsan korursun. Her emirde müşteri hesap numarası girmek zorunludur.", "Açığa satışta yukarı adım kuralı var. Açığa satış son işlem fiyatının üstünden yapılır. Ama son fiyat bir öncekinden yüksekse son fiyattan da yapabilirsin. Bu kural Yıldız Pazar'da uygulanmaz, Ana Pazar'da uygulanır. BIST yüz gün içinde yüzde iki düşerse kural tüm açığa satış sıralarında seans sonuna kadar otomatik devreye girer. Açılış seansında açığa satış emri verilemez.", "Son konu brüt takas. Normalde gün içinde aynı payı alıp satarsan sadece net fark takasa girer. Brüt takasta netleştirme yoktur. Almak için takas günü hesabında nakit, satmak için pay bulunmalıdır. Amaç gün içi spekülatif al satı ve yanıltıcı işlemleri engellemektir.", "Toparlayalım. Birincisi, her pay pazarının bütün kriterlerini sağlamalı ve Yıldız için piyasa değeri altı milyarın üstünde olmalı. İkincisi, fiyat adımı emrin fiyat seviyesine göre belirlenir ve sınırlar içeri yuvarlanır. Üçüncüsü, kapanış seansında marj son fiyatın yüzde üç altı ve üstüdür. Dördüncüsü, endeks devre kesicisi yüzde altı düşüşte on dakika durdurur ve günde bir kez çalışır. Beşincisi, yukarı adım kuralı Yıldız Pazar'da yoktur, brüt takas ise sığ pazarlarda vardır."], "6": ["Merhaba, borçlanma araçları bölümüne başlıyoruz. Bu ilk derste mevzuatı konuşacağız. İhraç kararını kim alır, şirket ne kadar borçlanabilir, tahsisli satış ile nitelikli yatırımcıya satış nasıl ayrılır, bunları göreceğiz. Sonra tahvilin yapı taşlarına geçeceğiz.", "Önce iki temel tanım. Vadesi üç yüz altmış beş gün veya daha uzun olan araç tahvildir. Vadesi otuz günden az olmayan ve üç yüz altmış dört günü aşmayan araç ise finansman bonosudur. Bu iki sayıyı birbirine karıştırma, sınavda tam da buradan soru geliyor.", "Şimdi ihraç kararına bakalım. Türk Ticaret Kanunu'na göre kural olarak kararı genel kurul alır. Ama Sermaye Piyasası Kanunu'nun otuz birinci maddesi bu yetkinin esas sözleşmeyle yönetim kuruluna bırakılmasına izin verir. Burada dur bir saniye, çünkü şar
