 raporlar gibi. Bunları imzalayanlar yanlış ya da eksik bilgiden müteselsilen sorumlu. Talep, zararın doğduğu tarihten itibaren altı ayda zamanaşımına uğruyor. İzahnamede birinci derecede ihraççı sorumlu. İhraççıdan alınamazsa sıra aracı kuruma, garantöre ve yönetim kurulu üyelerine geliyor. Kamu borçlarında ise şirketten tahsil edilemeyen vergi gibi alacaklar kanuni temsilcilerin kendi malvarlığından tahsil ediliyor.", "Toparlayalım. Birincisi, yokluk ve butlan süresiz ileri sürülür, iptal ise ilandan itibaren otuz gün ya da bir ay içinde. İkincisi, bilgi alma hakkı daraltılamaz, ret hâlinde iki gün içinde kurula ve sonra mahkemeye gidilir. Üçüncüsü, mali haklar sınırlı sayıda ve genel kurulun yetkisinde, kâr payı için esas sözleşme hükmü şart. Dördüncüsü, sorumluluk kusur esaslı, farklılaştırılmış teselsül geçerli, zamanaşımı iki ve beş yıl. Beşincisi, ibra kararı geri alınamaz, diğer pay sahiplerinin dava hakkı altı ayda düşer ve alacaklılar etkilenmez."], "8": ["Merhaba, genel kurul bölümündeyiz. Bugün genel kurulun ne zaman, kimin çağrısıyla, nasıl toplandığını konuşacağız. Sonra oy hakkı, temsil ve en çok sorulan konu olan nisaplar gelecek. En sonda da genel kurul kararlarının iptalini anlatacağım.", "Genel kurul şirketin karar mercii. Ama yönetim kurulunun amiri değil, ikisi arasında işlev ayrılığı var. Genel kurul sadece kanunda ve esas sözleşmede açıkça yazan konularda karar alıyor. Devredilemez yetkileri altı başlık. Esas sözleşme değişikliği, yönetim kurulunun seçimi, ücreti, ibrası ve görevden alınması, denetçinin seçimi, finansal tablolar ve kâr dağıtımı, şirketin feshi ve önemli miktarda şirket varlığının toptan satışı.", "Burada dur bir saniye. Kayıtlı sermaye sisteminde tavan içinde sermaye artırımı genel kurulun değil, yönetim kurulunun işi. Sınavda bu şık genel kurulun devredilemez yetkisi değildir sorusunun cevabı olarak çok çıkıyor. Bir de tek pay sahipli şirkette o tek kişi genel kurulun bütün yetkilerini kullanıyor, kararlarını yazılı alması da şart.", "Toplantı türlerine bakalım. Olağan genel kurul her faaliyet döneminin bitiminden itibaren üç ay içinde yapılıyor. Yani takvim yılı kullanan bir şirket en geç mart sonuna kadar toplanmalı. Olağanüstü genel kurul ise ihtiyaç oldukça toplanıyor. Bir de çağrısız genel kurul var. Bütün pay sahipleri gelirse ve kimse itiraz etmezse çağrı yapmadan toplanabiliyorlar. Ama yüzde yüzlük katılım toplantı boyunca sürmeli.", "İmtiyazlı pay sahipleri özel kurulu ise çok dar bir alanda çalışıyor. Esas sözleşme değişikliği ya da sermaye artırımıyla ilgili bir karar imtiyazlıların haklarını zedeliyorsa onların onayı gerekiyor. Yönetim kurulu bu kurulu bir ay içinde çağırıyor. Toplantı nisabı imtiyazlı sermayenin yüzde altmışı, karar nisabı temsil edilenlerin çoğunluğu. Onay çıkmazsa o karar uygulanamıyor.", "Çağrıyı kim yapar? Esas olarak yönetim kurulu, hatta süresi dolmuş olsa bile. Tasfiyedeki şirkette tasfiye memurları. Bir de azlık var. Halka açık olmayan şirkette sermayenin onda biri, halka açık şirkette yirmide biri. Mesela seksen milyon liralık sermayesi olan halka açık bir şirkette dört milyon liralık pay yeterli. Azlık bu talebini noter aracılığıyla yapıyor.", "Azlığın talebinden sonraki süreler sınavın favorisi. Yönetim kurulu kabul ederse genel kurul kırk beş gün içinde yapılacak şekilde çağrılıyor. Reddederse ya da yedi iş günü içinde olumlu cevap vermezse azlık asliye ticaret mahkemesine gidiyor. Mahkeme gerekirse bir kayyım atıyor ve kararı kesin. Kırk beş gün ve yedi iş günü, bu ikisini birlikte ezberle.", "Gündeme gelelim. Gündemde olmayan konu görüşülemez, buna gündeme bağlılık ilkesi diyoruz. Ama istisnalar var. Özel denetim istemi gündemde olmasa da oylanıyor. Yönetim kurulunun görevden alınması yılsonu finansal tablolar maddesiyle ilgili sayılıyor. Haklı sebep varsa görevden alma oy çokluğuyla gündeme alınabiliyor. Gündem sırası çoğunlukla değişir, ama karara bağlanmış bir madde ancak oybirliğiyle yeniden açılır.", "Çağrı süresi de çok soruluyor. Halka açık olmayan şirkette çağrı, ilan ve toplantı günleri hariç, en az iki hafta önce yapılıyor. İnternet sitesinde ve Türkiye Ticaret Sicili Gazetesinde ilan ediliyor, pay defterindeki ortaklara da iadeli taahhütlü mektup gidiyor. Halka açık şirkette ise süre en az üç hafta ve ilan Kamuyu Aydınlatma Platformu, yani KAP üzerinden de yapılıyor.", "Genel kurula kimler katılıyor? Hazır bulunanlar listesinde adı olanlar. Bu listeyi yönetim kurulu başkanı imzalıyor. Borsa şirketlerinde liste Merkezi Kayıt Kuruluşundan alınan bilgilere göre hazırlanıyor. En az bir yönetim kurulu üyesi ve denetçi toplantıda bulunmak zorunda. Bakanlık temsilcisi ise sermaye artırımı, birleşme, faaliyet konusu değişikliği gibi gündemlerde, elektronik genel kurullarda ve yurt dışındaki toplantılarda zorunlu.", "Oy hakkı payın itibari değeriyle orantılı. Tek payı olanın da en az bir oyu var. Oy hakkının doğması için esas sözleşmede başka bir şey yazmıyorsa payın dörtte birinin ödenmiş olması lazım. Bir paya en çok on beş oy imtiyazı verilebiliyor. Ama esas sözleşme değişikliği, ibra ve sorumluluk davası kararlarında oy imtiyazı çalışmıyor.", "Oydan yoksunluğu bir örnekle düşün. Şirket, ortaklardan birinin oğlunun şirketinden fabrika satın alacak. O ortak bu konudaki oylamada oy kullanamaz. Yönetim kurulu üyeleri de kendi ibralarında kendi paylarıyla oy veremez. Şirketin kendi payları ise hiçbir hak vermiyor, toplantı nisabında da sayılmıyor.", "Birikimli oy da güzel bir sayısal soru malzemesi. Diyelim ki bin beş yüz oyun var ve dört kişilik yönetim kurulu seçilecek. Bin beş yüzü dörtle çarpıyorsun, altı bin oy ediyor. Bunun hepsini tek bir adaya verebilirsin. Böylece küçük ortak da yönetim kuruluna temsilci sokabiliyor. Ama bunun için esas sözleşmede açık hüküm olmalı, oy imtiyazı ve aday önerme hakkı olmamalı, üye sayısı da en az üç olarak sabitlenmeli.", "Temsilde şunu bil. Temsilcinin pay sahibi olması şart koşulamaz. Temsil belgesi yazılı olmalı. Temsilci talimata aykırı oy verse bile oy geçerli, sadece temsilciye karşı hakların saklı. Kurumsal temsilci ve bağımsız temsilci düzenlemesi iki bin on sekizde kaldırıldı. Bugün olağan temsilci ve tevdi eden temsilcisi kaldı. Tevdi eden temsilcisi talimat alamazsa yönetim kurulunun önerileri yönünde oy veriyor.", "Şimdi en önemli kısım, nisaplar. Adi kararlarda genel kurul sermayenin dörtte biriyle toplanıyor, hazır bulunanların çoğunluğuyla karar alıyor. İlk toplantıda dörtte bir sağlanamazsa ikinci toplantıda toplantı nisabı aranmıyor. Esas sözleşme değişikliğinde ise sermayenin yarısı gerekiyor. İkinci toplantı bir ay içinde yapılırsa üçte bir yeterli.", "Bazı kararlar çok daha ağır. Şirket merkezini yurt dışına taşımak ve ortaklara bilanço zararı için ek yükümlülük getirmek oybirliği istiyor. İşletme konusunu tamamen değiştirmek, imtiyazlı pay oluşturmak ve nama yazılı payların devrini sınırlamak ise sermayenin yüzde yetmiş beşinin olumlu oyunu istiyor. Ve bu ağır nisaplar sonraki toplantılarda da aynen aranıyor.", "Halka açık şirkette tablo biraz farklı. Kural olarak adi nisap uygulanıyor, esas sözleşmede oran yazılmadıkça. Sadece kanuna atıf yapmak yetmiyor. Sermaye azaltımı, rüçhan hakkının kısıtlanması ve önemli nitelikteki işlemlerde ise toplantı nisabı aranmıyor, katılanların üçte ikisinin olumlu oyu gerekiyor. Ama sermayenin yarısı toplantıdaysa katılanların çoğunluğu yetiyor.", "Genel kurul kararları toplantıya gelmeyenleri ve hayır diyenleri de bağlıyor. Çünkü bu bir sözleşme değil, bir karar. Sakat kararlarda yine yokluk, butlan ve iptal var. Nisapsız alınan karar yok hükmünde. Pay sahibinin asgari oy hakkını ya da bilgi alma hakkını kaldıran karar batıl. Kanuna, esas sözleşmeye ya da dürüstlük kuralına aykırı karar ise iptal edilebilir.", "İptal davası karar tarihinden itibaren üç ay içinde, şirket merkezindeki asliye ticaret mahkemesinde açılıyor. Davayı toplantıda hayır deyip muhalefetini tutanağa yazdıran pay sahibi açabiliyor. Çağrı usulsüzse toplantıya hiç gelmeyen de açabiliyor. Yönetim kurulu ve kişisel sorumluluğu doğacak her üye de açabiliyor. Ama denetçi açamıyor, bu tuzağı sakın kaçırma. Kötü niyetle dava açanlar da şirketin zararından müteselsilen sorumlu.", "Toparlayalım. Birincisi, olağan genel kurul faaliyet dönemi sonundan itibaren üç ay içinde yapılır. İkincisi, azlık halka açık olmayanda onda bir, halka açıkta yirmide bir, yönetim kurulu kabul ederse kırk beş gün, cevap vermezse yedi iş günü sonra mahkeme. Üçüncüsü, çağrı halka açık olmayanda iki hafta, halka açıkta üç hafta önce. Dördüncüsü, adi nisap dörtte bir, esas sözleşme değişikliği yarı ve ikinci toplantıda üçte bir, ağır kararlarda oybirliği ya da yüzde yetmiş beş. Beşincisi, iptal davası üç ay içinde açılır ve denetçi bu davayı açamaz."], "9": ["Merhaba, bu bölümde anonim şirketlerin denetimini konuşacağız. Önce sistemin nasıl kurulduğuna bakacağız. Sonra hangi şirketlerin denetime tabi olduğunu, kimlerin denetçi olabileceğini, denetçinin nasıl seçildiğini ve verdiği görüşlerin ne sonuç doğurduğunu anlatacağım. Eşik değerler ve süreler bu bölümün yıldızları.", "Kısa bir tarihçe ile başlayalım. Yeni Türk Ticaret Kanunu ilk hâliyle bütün sermaye şirketlerini bağımsız denetime sokuyordu. Ardından Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu kuruldu ve denetimle ilgili tüm yetkiler orada toplandı. Kanun yürürlüğe girmeden hemen önce ise iki bin on iki yılında yapılan bir değişiklikle sistem daraltıldı. Artık her şirket denetime tabi değil. Kuruluş ya da birleşme gibi işlemleri denetleyen işlem denetçiliği de tamamen kaldırıldı.", "Hangi şirketin denetime tabi olacağına bugün Cumhurbaşkanı karar veriyor. Bunun için çıkarılmış bir karar var. Bir de bu kapsamın dışında kalan anonim şirketler için ayrı bir denetim öngörülmüş, onun esasları bir yönetmelikle belirlenecek. Burada şunu da bil, denetçi artık şirketin organı değil. Şirkete karşı üçüncü kişi konumunda ve aralarında sadece bir sözleşme var.", "Peki denetim ne işe yarıyor? Temel ilke dürüst resim ilkesi. Finansal tablolar şirketin malvarlığını, borçlarını ve sonuçlarını gerçeğe uygun, şeffaf ve güvenilir biçimde göstermeli. Denetimin işlevlerini üç grupta düşün. Şirket açısından kontrol ve caydırıcılık. Üçüncü kişiler açısından bilgilendirme, güvence ve ekonomik işlev. Denetim kuruluşları açısından ise önleyici işlev ve zararı tazmin işlevi.", "Şimdi sınavın sevdiği eşik değerlere geçelim. Bazı şirketler bir listede sayılıyor ve hiçbir ölçüte bakılmadan denetime tabi. Mesela bankalar, sigorta şirketleri, portföy yönetim şirketleri, aracı kurumlar ve borsada işlem gören şirketler. Diğerleri için üç ölçüt var. Aktif toplamı, yıllık net satış ve çalışan sayısı. Bu üçünden en az ikisini art arda iki hesap döneminde aşarsan denetime giriyorsun.", "Rakamları üç grup hâlinde ezberle. Borsada işlem görmeyen ama halka açık sayılan şirketler için otuz milyon lira aktif, kırk milyon lira satış ve elli çalışan. İkinci listedeki şirketler için yüz yirmi milyon aktif, yüz elli milyon satış ve yüz çalışan. Geri kalan herkes için iki bin yirmi dört değişikliğiyle üç yüz milyon aktif, altı yüz milyon satış ve yüz elli çalışan.", "Hemen bir örnek yapalım. Halka açık sayılan bir şirketin aktifi iki yıl üst üste otuz beş milyon lira, satışı otuz iki milyon lira, çalışanı da altmış kişi. Aktif eşiği aşıldı, çalışan eşiği aşıldı, satış eşiği aşılmadı. Üç ölçütten ikisi iki yıl üst üste aşıldığı için bu şirket denetime tabi. Sınavda tam olarak bu tür sorular geliyor.", "Kimler denetçi olabilir? Yeminli mali müşavir ya da serbest muhasebeci mali müşavir olup Kamu Gözetimi Kurumundan yetki almış kişiler. Ya da ortakları bu kişilerden oluşan sermaye şirketleri. Ama bağımsızlığı zedeleyen durumlar varsa denetçi olamazlar. Şirkette pay sahibi olan, son üç yıl içinde şirketin yöneticisi ya da çalışanı olan, yöneticilerin yakını olan kişi denetçi olamaz.", "Bir de defter tutma engeli var. Şirketin defterini tutan ya da tablolarını hazırlayan kişi aynı şirketi denetleyemez. Kendi yaptığın işi kendin denetleyemezsin, mantık bu. Gelir bağımlılığı da önemli. Son beş yılda mesleki gelirinin yüzde otuzundan fazlasını tek bir müşteriden elde eden denetçi orada denetim yapamaz. Mesela toplam gelir on milyon lira ise eşik üç milyon lira.", "Rotasyonu da unutma. On yıl içinde aynı şirkette toplam yedi yıl denetçilik yapan kişi, üç yıl geçmeden tekrar seçilemez. Kamu Gözetimi Kurumu bu süreleri kısaltabilir. Ayrıca denetçi, denetlediği şirkete vergi danışmanlığı ve vergi denetimi dışında hiçbir danışmanlık veremez, bunu yavru şirketi üzerinden de yapamaz.", "Denetçiyi kim seçiyor? Genel kurul, ve bu onun devredilemez yetkisi. Şirketler topluluğunda ana şirketin genel kurulu topluluk denetçisini seçiyor. Seçim her faaliyet dönemi için ve dönem bitmeden yapılmalı. Ama kanun şirketin denetçisiz kalmasını istemiyor, bu yüzden istisnalar koymuş.", "Birinci istisna taraflılık kuşkusu. Yönetim kurulu ya da azlık, yani halka açık olmayanda sermayenin yüzde onu, halka açıkta yüzde beşi, mahkemeden başka bir denetçi atanmasını isteyebiliyor. İkinci istisna seçim yapılmaması. Faaliyet döneminin dördüncü ayına kadar denetçi seçilmemişse, yönetim kurulu, herhangi bir üye ya da herhangi bir pay sahibi mahkemeye gidip atama isteyebiliyor. Üçüncü istisna fesih. Denetçi işi bırakırsa yönetim kurulu hemen geçici bir denetçi seçiyor ve genel kurulun onayına sunuyor.", "Denetimin konusu finansal tablolar ve yıllık faaliyet raporu. Bunun yanında envanter, muhasebe, iç denetim ve riskin erken saptanması komitesinin raporları da denetleniyor. Denetçi raporunu açık ve anlaşılır bir dille, geçmiş yılla karşılaştırmalı yazıyor. Faaliyet raporunun finansal tablolarla tutarlılığını ise ayrı bir raporda değerlendiriyor. Raporu imzalayıp yönetim kuruluna sunuyor.", "Şimdi görüş türlerine geliyoruz, bu kısım çok önemli. Olumlu görüş her şeyin yolunda olduğunu söylüyor. Sınırlı olumlu görüş, düzeltilebilecek ve büyük etkisi olmayan aykırılıklar olduğunu söylüyor, bu durumda genel kurul gerekli düzeltmelere karar veriyor. Olumsuz görüş ise ciddi sorunlar olduğunu gösteriyor.", "Olumsuz görüşte süreler kritik. Yönetim kurulu, görüş yazısını aldığı tarihten itibaren dört iş günü içinde genel kurulu toplantıya çağırıyor. Genel kurul yeni bir yönetim kurulu seçiyor, esas sözleşme yasaklamıyorsa eski üyeler de yeniden seçilebiliyor. Yeni kurul altı ay içinde düzgün finansal tabloları hazırlatıp genel kurula sunuyor. Dört iş günü ve altı ay, bu ikiliyi aklında tut.", "Bir de görüş vermekten kaçınma var. Şirketin defterleri o kadar karışık ki denetim yapılamıyor, ya da şirket denetçinin önüne engeller koyuyor. Denetçi elinde kesin delil olmasa bile gerekçesini yazarak görüş vermekten kaçınabiliyor. Bunun sonucu olumsuz görüşle aynı. Şirketler ayrıca denetçi görüşünü finansal tablonun başlığında açıkça yazmak zorunda, böylece herkes görüşü hemen görebiliyor.", "Denetçinin sorumluluğu kusur sorumluluğu. Görevini kusurlu yaparsa şirkete, pay sahiplerine ve alacaklılara karşı sorumlu. Sır saklama ise ayrı bir maddede düzenlenmiş, o durumda genel sorumluluk maddesi uygulanmıyor. Denetçinin bilgi alma hakkı da güçlü. Yönetim kurulu tabloları ve faaliyet raporunu gecikmeden vermek, kasaya ve envantere erişim sağlamak zorunda. Denetçi gerekirse ana ve yavru şirketlerden de bilgi isteyebiliyor.", "Toparlayalım. Birincisi, denetçi organ değil, şirkete karşı üçüncü kişi ve işlem denetçiliği kaldırıldı. İkincisi, listede olmayan şirket üç ölçütten ikisini art arda iki dönem aşarsa denetime girer, diğer şirketler için eşik üç yüz milyon aktif, altı yüz milyon satış ve yüz elli çalışan. Üçüncüsü, son üç yılda şirkette çalışan ya da gelirinin yüzde otuzundan fazlasını o şirketten alan denetçi olamaz. Dördüncüsü, rotasyon on yılda yedi yıl ve ardından üç yıl ara, dördüncü aya kadar seçim yoksa mahkeme atar. Beşincisi, olumsuz görüşte dört iş günü içinde genel kurul toplanır ve yeni kurul altı ayda yeni tablo hazırlatır."], "10": ["Merhaba, bu bölümde esas sözleşme değişikliklerini ve bunların en önemlisi olan sermaye artırımı ile sermaye azaltımını konuşacağız. Kısa bir bölüm gibi görünüyor ama sayısal sorulara çok uygun. O yüzden tavanları, oranları ve süreleri dikkatle dinle.", "Önce temel kural. Esas sözleşmeyi değiştirme yetkisi genel kurulda ve bu yetki devredilemez. Genel kurul esas sözleşmenin bütün hükümlerini değiştirebilir. Tek sınır pay sahiplerinin müktesep ve vazgeçilmez hakları. Yani genel kurul, pay sahibinin genel kurula katılma ya da dava açma gibi temel haklarına dokunamaz.", "Süreç beş adımdan oluşuyor. Yönetim kurulu değişiklik taslağını hazırlar. Şirket izne tabiyse Ticaret Bakanlığından izin alınır. Genel kurul karar verir. Karar imtiyazlıların hakkını zedeliyorsa imtiyazlı pay sahipleri özel kurulu onaylar. En sonda da değişiklik ticaret siciline tescil ve ilan edilir.", "Bakanlık izni her şirket için gerekmiyor. Sadece Bakanlığın tebliğle belirlediği faaliyet alanlarındaki şirketler için. Bakanlık da sadece kanunun emredici hükümlerine aykırılık var mı diye bakıyor, yerindelik denetimi yapmıyor. Burada dur bir saniye, çünkü halka açık ortaklıklar için bir de Sermaye Piyasası Kurulu, yani SPK var. Halka açık şirketin esas sözleşme değişikliğinde SPK'nın uygun görüşü şart.", "Neden SPK'nın yetkisi devam ediyor? Çünkü Sermaye Piyasası Kanunu, Türk Ticaret Kanunu'ndan sonra, iki bin on iki yılının son günlerinde yürürlüğe girdi. Yani sonraki tarihli özel kanun. Bir de şunu unutma, esas sözleşme değişikliği üçüncü kişilere karşı ancak tescilden sonra hüküm doğuruyor. İzin gereken şirkette izin alınmamışsa değişiklik genel kurulda görüşülemiyor bile.", "Şimdi sermaye artırımına geçelim. Esas sermaye sabit bir rakam. Önceden belirlenmiş, nakitle ifade edilmiş, paylara bölünmüş ve tamamen taahhüt edilmiş. Ama kanundaki usullerle artırılıp azaltılabiliyor. Artırımı kaynağına göre ikiye ayırıyoruz. İç kaynaklardan artırım ve dış kaynaklardan artırım.", "İç kaynaklı artırımda şirket dışarıdan para almıyor. Yedek akçeleri ya da sermayeye eklenmesine izin verilen fonları sermayeye çeviriyor. Ortaklar bedelsiz pay alıyor. Dış kaynaklı artırımda ise ortaklar ya da yeni yatırımcılar nakit veya ayni değer getiriyor. Buna bedelli artırım da diyebilirsin.", "Burada çok sorulan bir kural var. Bilançoda sermayeye eklenebilecek fonlar varken, önce onlara dokunmadan dışarıdan para alarak artırım yapamazsın. İkisini aynı anda yapabilirsin, ama dış kaynaktan eklenen tutar iç kaynaktan ekleneni geçmemeli. Mesela on milyon liralık fon varsa, bunu eklerken dışarıdan en fazla on milyon lira daha ekleyebilirsin. Daha fazlası için Bakanlık genelgesi bütün ortakların katıldığı genel kurulda oybirliği istiyor.", "Sermaye sistemine göre de ayrım var. Esas sermaye sisteminde artırıma genel kurul karar veriyor, çünkü bu bir esas sözleşme değişikliği. Kayıtlı sermaye sisteminde ise esas sözleşmeye bir tavan yazılıyor. Yönetim kurulu bu tavana kadar sermayeyi kendi kararıyla artırabiliyor, esas sözleşmeyi değiştirmeye gerek kalmıyor. Bu sistem çok daha hızlı ve pratik.", "Kayıtlı sermayede üç kavramı karıştırma. Başlangıç sermayesi, kayıtlı sermayeli şirketin sahip olması gereken asgari çıkarılmış sermaye. Çıkarılmış sermaye, satışı yapılmış payları temsil eden sermaye. Kayıtlı sermaye ise yönetim kurulunun pay çıkarabileceği azami miktar, yani tavan. Mesela tavan beş yüz milyon, çıkarılmış sermaye üç yüz yirmi milyon lira ise yönetim kurulu daha yüz seksen milyon liralık artırım yapabilir.", "Kayıtlı sermaye sistemine geçiş için izin gerekiyor. Halka açık ortaklık bu izni SPK'dan alıyor. Halka açık olmayan şirket ise Ticaret Bakanlığından alıyor. Sınavda şıkları ters çevirip soruyorlar, dikkat et. Bir de şarta bağlı sermaye artırımı var. Bu ayrı bir sistem değil, özel bir artırım şekli. Değiştirilebilir tahvil sahipleri ya da pay alım hakkı verilen çalışanlar haklarını kullandıkça sermaye kendiliğinden artıyor.", "SPK'nın sermaye artırımındaki rolüne bakalım. Halka açık olmayan bir şirket payları halka arz etmeden ihraç ediyorsa bu Sermaye Piyasası Kanunu'nun dışında. Ama halka arz yoluyla artırım yapan her şirket, halka açık olsun olmasın, bir izahname hazırlayıp SPK'ya onaylatmak zorunda. Halka açık ortaklığın her türlü artırımında da esas sözleşme değişikliği için SPK'nın uygun görüşü alınıyor.", "Şimdi sermaye azaltımına geçelim. İki sebep olabilir. Şirketin sermayesi ihtiyacından fazlaysa yapılan azaltma kurucu nitelikte, ortaklara değer iade ediliyor. Zararlardan oluşan bilanço açığını kapatmak için yapılan azaltma ise açıklayıcı nitelikte, kayıtlarda zaten olmuş bir kaybı gösteriyor. Hangisi olursa olsun sermaye kanundaki asgari tutarın altına inemez.", "Azaltmanın temel şartı şu. Sermaye azaldıktan sonra da şirkette alacaklıların bütün alacaklarını karşılayacak kadar aktif bulunmalı. Bu tespiti eskiden işlem denetçisi yapacaktı. İşlem denetçiliği kalkınca kanunda bir boşluk oluştu. Kitaptaki görüşe göre bu tespiti asliye ticaret mahkemesinin atayacağı bilirkişiler yapmalı.", "Karar nisabı çok soruluyor. Halka açık olmayan şirkette sermaye azaltımı için sermayenin en az yüzde yetmiş beşinin olumlu oyu gerekiyor. Mesela altmış milyon liralık sermayede kırk beş milyon liralık oy lazım. Halka açık ortaklıkta ise toplantı nisabı aranmıyor, katılanların üçte ikisi yetiyor. Sermayenin yarısı toplantıdaysa salt çoğunluk yeterli.", "Alacaklıların korunması da kritik. Yönetim kurulu azaltma kararını internet sitesine koyuyor ve Türkiye Ticaret Sicili Gazetesinde yedişer gün arayla üç defa ilan ediyor. Alacaklılar üçüncü ilandan itibaren iki ay içinde alacaklarını bildirip ödeme ya da teminat isteyebiliyor. Mesela üçüncü ilan on mart günü yapıldıysa süre on mayısta doluyor.", "Bir istisna var. Sermaye, zararlardan doğan bilanço açığını kapatmak için ve sadece açık oranında azaltılıyorsa, yönetim kurulu alacaklıları çağırmaktan vazgeçebiliyor. Mantığı basit, şirketten para çıkmıyor ki alacaklı zarar görsün. Ama kurallara uyulmadan azaltma yapılırsa alacaklılar, tescilin ilanından itibaren iki yıl içinde iptal davası açabiliyor.", "Toparlayalım. Birincisi, esas sözleşme değişikliği genel kurulun devredilemez yetkisi ve tescilden önce üçüncü kişilere karşı hüküm doğurmaz. İkincisi, halka açık şirkette esas sözleşme değişikliği için SPK uygun görüşü, kayıtlı sermayeye geçiş için SPK izni gerekir, halka açık olmayan şirket ise Bakanlıktan izin alır. Üçüncüsü, bilançoda sermayeye eklenebilecek fon varken önce onlar eklenir ve dış kaynak iç kaynağı geçemez. Dördüncüsü, kayıtlı sermaye bir tavandır ve yönetim kurulu tavana kadar artırım yapar. Beşincisi, sermaye azaltımı yüzde yetmiş beşle alınır, ilanlar yedişer gün arayla üç kez yapılır, alacaklılara iki ay süre verilir ve iptal davası iki yıl içinde açılır."], "11": ["Merhaba, bu bölümde menkul kıymetleri, payı ve pay sahibinin haklarını konuşacağız. Biraz uzun bir bölüm ama günlük hayatta en çok karşılaştığın konular burada. Pay devri, kâr payı, rüçhan hakkı, azlık hakları. Hepsini sırayla anlatacağım.", "Önce menkul kıymet nedir ona bakalım. Sermaye Piyasası Kanunu menkul kıymeti sayarak tanımlıyor. Paylar, pay benzeri kıymetler, borçlanma araçları ve bunlara ilişkin depo sertifikaları. Kira sertifikaları ve varlık teminatlı menkul kıymetler de bu kapsamda. Ama para, çek, poliçe ve bono açıkça dışarıda bırakılmış. Sınavda çek şıkkını gördüğünde hemen işaretle.", "Pay, ortaklığın sermayesini temsil eden ve sahibine ortaklık hakkı veren menkul kıymet. Pay benzeri kıymet ise sabit bir getiri vaadi içermeyen ve pay sahipliği haklarından bir kısmını veren araç. Katılma intifa senedi buna örnek. Borçlanma araçları ise tahvil, bono, değiştirilebilir tahvil, paya dönüştürülebilir tahvil ve kıymetli maden bonosu gibi araçlar. Varant bir borçlanma aracı değil, onu da not et.", "İntifa senetlerini genel kurul çıkarıyor. Emre ya da hamiline yazılı olabiliyorlar. Burada dur bir saniye, çünkü kritik kural şu. İntifa senedi sahibine pay sahipliği hakları verilemez. Ona sadece net kâra katılma, tasfiye bakiyesine katılma ya da yeni pay alma hakkı tanınabilir. Yani genel kurulda oy kullanamaz.", "Borçlanma araçlarını kural olarak genel kurul çıkarıyor. Ama genel kurul bu yetkiyi en çok on beş ay için yönetim kuruluna bırakabiliyor. Esas sözleşmeyle süreli ya da süresiz devir de mümkün. İhraç limitinde Sermaye Piyasası Kurulu tebliği uygulanıyor. Halka açık ortaklık özkaynağının beş katına, halka açık olmayan ortaklık üç katına kadar borçlanma aracı çıkarabiliyor. Mesela iki yüz milyon lira özkaynağı olan halka kapalı şirket için limit altı yüz milyon lira.", "Gelelim paya. Payın itibari değeri en az bir kuruş. Cumhurbaşkanı bu değeri yüz katına kadar artırabiliyor. İtibari değerin altında pay çıkarılamıyor, ama üstünde, yani primli pay çıkarılabiliyor. Pay şirkete karşı bölünemiyor. Bir payın birkaç sahibi varsa ortak bir temsilci seçmeleri gerekiyor. Payları birleştirmek için ise her pay sahibinin onayı lazım.", "Pay senetleri nama ya da hamiline yazılı olabiliyor. Bedeli tamamen ödenmemiş paya hamiline senet çıkarılamıyor. Hamiline senetler bedel ödendikten sonra üç ay içinde basılıp dağıtılıyor ve sahipleri Merkezi Kayıt Kuruluşuna bildiriliyor. Nama yazılı paylarda ise senet basmak zorunlu değil, ama azlık isterse basılıyor. Senedi basılmamış paya çıplak pay diyoruz.", "Devir şekillerini bir tabloda düşün. Hamiline senet zilyetliğin devriyle ve devralanın Merkezi Kayıt Kuruluşuna bildirimiyle devrediliyor. Bildirim yapmazsan haklarını kullanamıyorsun ve beş bin lira idari para cezası var. Nama yazılı senet ciro ve teslimle devrediliyor. Çıplak nama yazılı pay ise alacağın temliki hükümleriyle devrediliyor. Borsadaki paylar ise kaydi olarak el değiştiriyor.", "Şimdi devir sınırlamalarına geçelim. Hamiline yazılı payın devri hiçbir şekilde sınırlanamıyor. Nama yazılı pay ise kural olarak serbest, ama kanun ya da esas sözleşme sınırlama getirebiliyor. Bedeli ödenmemiş nama yazılı payı devretmek için şirketin onayı gerekiyor. Şirket bu onayı sadece alıcının ödeme gücü şüpheliyse ve teminat vermiyorsa reddedebiliyor.", "Borsada olmayan nama yazılı paylarda şirket üç gerekçeyle kaydı reddedebiliyor. Esas sözleşmede yazan önemli bir sebep, payları gerçek değeriyle satın almayı teklif etmek ya da alıcının kendi hesabına aldığını beyan etmemesi. Borsadaki nama yazılı paylarda ise ret sadece esas sözleşmedeki yüzdelik iktisap sınırı aşılırsa ya da beyan verilmezse mümkün. Miras yoluyla gelen borsa payında pay sahipliği reddedilemiyor.", "Onay verilene kadar ne oluyor? Yeni kanun birlik teorisini benimsedi. Yani onay gelmedikçe payın mülkiyeti ve bütün haklar devredende kalıyor. Eski kanundaki bölünme teorisi terk edildi. Miras gibi durumlarda ise mülkiyet ve mali haklar hemen geçiyor, oy hakkı onayla geçiyor. Şirket üç ay içinde reddetmezse onay verilmiş sayılıyor.", "Şirket kendi payını alabilir mi? Kural olarak yasak, ama sermayesinin yüzde onuna kadar ivazlı alabiliyor. Bunun için genel kurul yönetim kurulunu en çok beş yıl için yetkilendiriyor. Kurala aykırı alınan paylar altı ay içinde elden çıkarılıyor ama işlem geçersiz olmuyor. Bağışla bedelsiz edinme ise yasak değil. Mesela üç yüz milyon lira sermayeli bir şirket otuz milyon liraya kadar kendi payını alabilir.", "Pay sahibinin haklarına geçelim. Yönetsel haklar genel kurula katılma, oy, iptal davası, sorumluluk davası, bilgi alma ve özel denetim isteme. Finansal tablolar ve faaliyet raporu genel kuruldan en az on beş gün önce pay sahiplerinin incelemesine açılıyor. Bilgi verme sadece şirket sırrı gerekçesiyle reddedilebiliyor. Ret hâlinde pay sahibi on gün içinde mahkemeye gidiyor. Bu hak esas sözleşmeyle kaldırılamıyor.", "Özel denetimde önce bilgi alma hakkını kullanmış olman gerekiyor. Sonra genel kuruldan özel denetim istiyorsun. Genel kurul kabul ederse otuz gün içinde mahkemeden özel denetçi istenir. Reddederse azlık, ya da itibari değeri en az bir milyon lira olan paylar, üç ay içinde mahkemeye başvurabiliyor. Genel kurul karar verdiyse masrafları şirket ödüyor.", "Mali haklara gelelim. Kâr payı sadece net dönem kârından ve serbest yedek akçelerden dağıtılıyor. Sıra şöyle. Önce yıllık kârın yüzde beşi, ödenmiş sermayenin yüzde yirmisine ulaşana kadar genel kanuni yedek akçeye ayrılıyor. Sonra ortaklara ödenmiş sermayenin yüzde beşi kadar birinci kâr payı veriliyor. Ondan sonra dağıtılacak tutarın yüzde onu ikinci tertip yedek akçeye gidiyor. Kalanı genel kurul serbestçe kullanıyor.", "Halka açık ortaklıklarda bir de eşitlik kuralı var. Kâr payı yıl içinde ne zaman alınmış olursa olsun bütün paylara eşit dağıtılıyor. Kâr payı avansında ise sınır şu. Bir yılda dağıtılacak toplam avans önceki yılın dönem kârının yarısını geçemiyor. Mesela geçen yıl doksan milyon lira kâr varsa avans en fazla kırk beş milyon lira. Haksız ve kötü niyetle kâr payı alan da beş yıl içinde geri vermek zorunda.", "Rüçhan hakkı, sermaye artırımında mevcut ortakların payları oranında yeni pay alma önceliği. Bu sayede ortaklık oranın sulanmıyor. Hak devredilebiliyor ve yönetim kurulu kullanım için en az on beş gün süre veriyor. Genel kurul bu hakkı ancak esas sermayenin yüzde altmışının oyu ve haklı sebeple kısıtlayabiliyor. Halka arz ya da bir işletmenin devralınması haklı sebep sayılıyor. Ama esas sözleşmeyle rüçhan hakkı kaldırılamıyor.", "Bir de yeni bir hak var, önerilmeye muhatap olma hakkı. Şarta bağlı sermaye artırımında değiştirilebilir tahviller çıkarılırsa, bunlar önce mevcut ortaklara payları oranında öneriliyor. Tasfiye bakiyesi hakkında ise şirket tasfiye edildikten sonra kalan para, esas sözleşmede başka hüküm yoksa ortaklara payları oranında dağıtılıyor.", "Azlık hakları da çok önemli. Azlık halka açık olmayanda sermayenin yüzde onu, halka açıkta yüzde beşi. Genel kurulu toplantıya çağırma, finansal tabloların görüşülmesini erteletme, özel denetçi isteme, nama yazılı senet bastırma, haklı sebeple fesih davası açma ve kuruluş sorumluluğundaki ibraya karşı çıkma azlık hakları arasında. Yönetim kurulu üyesini mahkeme yoluyla azlettirme diye bir hak ise yok.", "Son olarak pay sahibinin borcu. Burada tek borç ilkesi var. Pay sahibinin tek borcu taahhüt ettiği sermayeyi getirmek ve bu borç sadece şirkete karşı. Alacaklılar ortağa gidemiyor. İstisna olarak prim ödenebiliyor. Devri onaya bağlı paylarda da para dışı ikincil yükümlülükler getirilebiliyor, ama bunun için sermayenin tamamının oybirliği gerekiyor.", "Toparlayalım. Birincisi, çek ve bono menkul kıymet değil, varant da borçlanma aracı değil ve intifa senedi sahibine pay sahipliği hakkı verilemez. İkincisi, payın itibari değeri en az bir kuruş ve hamiline payın devri sınırlanamaz. Üçüncüsü, onaya bağlı devirde birlik teorisi geçerli ve şirket üç ay içinde cevap vermezse onay verilmiş sayılır. Dördüncüsü, şirket kendi payını sermayenin yüzde onuna kadar alabilir ve aykırı alımları altı ayda elden çıkarır. Beşincisi, rüçhan hakkı esas sermayenin yüzde altmışı ve haklı sebeple kısıtlanır, azlık ise yüzde on ya da yüzde beş."], "12": ["Merhaba, Ticaret Hukuku'nun son konusuna geldik, anonim şirketin sona ermesi ve tasfiyesi. Bu bölümde şirketin hangi sebeplerle sona erdiğini, tasfiyenin nasıl yürüdüğünü, kalan paranın nasıl dağıtıldığını ve iki ilginç kurumu, ek tasfiye ile tasfiyeden dönmeyi konuşacağız.", "Önce genel sona erme sebepleri. Esas sözleşmedeki süre doluyorsa şirket sona erer, ama şirket işlerine fiilen devam ederek belirsiz süreli hâle gelmişse sona ermez. İşletme konusu gerçekleşirse ya da gerçekleşmesi imkânsızlaşırsa sona erer. Esas sözleşmede yazan bir sebep gerçekleşirse, genel kurul karar verirse ya da şirket iflas ederse sona erer. Genel kurulun sona erme kararı için sermayenin yüzde yetmiş beşi gerekiyor.", "Burada dur bir saniye. Sınavda yönetim kurulu başkanının iflası diye bir şık çıkıyor. Bu şirketi sona erdirmez. Şirketi sona erdiren, şirketin kendi iflası. Başkanın iflası olsa olsa onun yönetim kurulu üyeliğini bitirir.", "Özel sebeplere geçelim. Birincisi organ eksikliği. Yönetim kurulu uzun süredir yoksa ya da genel kurul uzun süredir toplanamıyorsa, pay sahipleri, alacaklılar ya da Ticaret Bakanlığı mahkemeye gidebiliyor. Ama mahkeme hemen kapatmıyor. Önce yönetim kurulunu dinliyor ve durumu düzeltmesi için süre veriyor. Düzeltilmezse fesih kararı veriyor. Yani şirket kendiliğinden sona ermiyor.", "İkincisi haklı sebeple fesih. Bu yeni kanunla gelen bir azlık hakkı. Halka açık olmayan şirkette sermayenin onda biri, halka açıkta yirmide biri bir araya gelip mahkemeden fesih isteyebiliyor. Mesela yirmi beş milyon liralık sermayede iki buçuk milyon liralık pay yeterli. Bu payların tek kişide olması da gerekmiyor.", "Haklı sebep kanunda tanımlanmamış. Ama öğretide örnekler var. Bilgi alma hakkının sürekli engellenmesi, şirketin sürekli zarar etmesi, genel kurulun defalarca usulsüz toplanması gibi. Sadece kötü bir gelecek beklentisi ise haklı sebep değil. En önemli nokta şu. Mahkeme sebepleri haklı bulsa bile şirketi kapatmak zorunda değil. Davacı ortaklara paylarının gerçek değerini ödetip onları şirketten çıkarabiliyor, ya da duruma uygun başka bir çözüm bulabiliyor.", "Başka özel sebepler de var. Şirket kamu düzenine aykırı ya da muvazaalı işler yapıyorsa, Ticaret Bakanlığı öğrendiği tarihten itibaren bir yıl içinde fesih davası açabiliyor. Sermayenin üçte ikisi zararla eridiyse ve genel kurul ne yetinme ne de tamamlama kararı alırsa şirket kendiliğinden sona eriyor. Birleşmede devrolunan şirket ve tam bölünmede bölünen şirket de sona eriyor.", "Şimdi tasfiyeye geçelim. Önce sona erme sicile tescil edilip ilan ediliyor. Bunu iflasta iflas idaresi, mahkeme kararında mahkeme, diğer bütün hallerde yönetim kurulu yapıyor. Sonra şirket tasfiye sürecine giriyor. Ama dikkat, şirket bu sırada tüzel kişiliğini kaybetmiyor. Unvanının sonuna tasfiye hâlinde ibaresini ekliyor ve organların yetkileri tasfiye amacıyla sınırlanıyor.", "Tasfiyeyi tasfiye memurları yürütüyor. Esas sözleşme ya da genel kurul bunları atayabiliyor. Kimse atanmazsa tasfiyeyi yönetim kurulu yapıyor. Mahkeme feshe karar verdiyse tasfiye memurunu da mahkeme atıyor. Temsile yetkili tasfiye memurlarından en az biri Türk vatandaşı olmalı ve Türkiye'de oturmalı.", "Görevden almada ince bir nokta var. Genel kurul, kendisinin ya da esas sözleşmenin atadığı tasfiye memurlarını her zaman görevden alabiliyor. Ama mahkemenin atadığı tasfiye memurunu genel kurul görevden alamıyor. Haklı sebep varsa bir pay sahibinin talebiyle mahkeme görevden alabiliyor. Aktiflerin satışında pazarlık serbest, ama önemli miktarda aktifin toptan satışı için genel kurulun yüzde yetmiş beşlik kararı gerekiyor.", "Tasfiye memurlarının ilk işi bir envanter ve bilanço çıkarıp genel kurulun onayına sunmak. Sonra alacaklılara çağrı yapıyorlar. Bilinen alacaklılara taahhütlü mektup gidiyor. Diğerleri için Türkiye Ticaret Sicili Gazetesinde, internet sitesinde ve esas sözleşmedeki şekilde birer hafta arayla üç ilan yapılıyor. Bilinen ama başvurmayan alacaklının parası Bakanlığın belirlediği bir bankaya, vadesi gelmemiş ya da tartışmalı borçların karşılığı ise notere depo ediliyor.", "Tasfiye memurları yeni iş yapamıyor, sadece süregelen işleri bitiriyor, alacakları topluyor ve borçları ödüyor. Vadesi gelmemiş bir borç varsa, Merkez Bankasının kısa vadeli kredi oranıyla iskonto edip hemen ödüyorlar ve alacaklı bunu kabul etmek zorunda. Borçlar varlıktan fazlaysa durumu hemen asliye ticaret mahkemesine bildiriyorlar ve mahkeme iflasın açılmasına karar veriyor.", "Peki kalan para nasıl dağıtılıyor? Önce borçlar ödeniyor, sonra ortaklara pay bedelleri geri veriliyor. Artan para varsa, esas sözleşmede başka hüküm yoksa ödenen sermaye ve imtiyaz hakları oranında dağıtılıyor. Ama alacaklılara yapılan üçüncü çağrıdan itibaren üç ay geçmeden dağıtım yapılamıyor. Mesela üçüncü çağrı beş haziranda yapıldıysa dağıtım en erken beş eylülde. Alacaklılar için tehlike yoksa mahkeme daha erken izin verebiliyor.", "Tasfiye bittiğinde tasfiye memurları şirketin sicilden silinmesini istiyor. Silinme tescil ve ilan ediliyor ve tüzel kişilik böylece sona eriyor. Yani tüzel kişilik sicile tescille doğuyor, sicilden terkinle bitiyor. Bu simetriyi aklında tutarsan kolay hatırlarsın.", "Şimdi ek tasfiyeye gelelim. Diyelim ki şirket silindi, ama sonra şirkete ait unutulmuş bir gayrimenkul ortaya çıktı. Ya da şirket lehine açılması gereken bir dava var. İşte bu durumda şirket geçici olarak ihya ediliyor, yani yeniden tescil ediliyor. Bunu son tasfiye memurları, yönetim kurulu üyeleri, pay sahipleri ve alacaklılar isteyebiliyor. Denetçi ve sicil memuru isteyemiyor. Sınavda en çok bu soruluyor.", "Ek tasfiye için üç şart var. Korunmaya değer bir menfaat olacak, yeniden tescil amaca ulaşmanın tek yolu olacak ve silme kararının iptali dava edilecek. Menfaatin kesin ispatı gerekmiyor, inandırıcı delil yeterli. Mahkeme kabul ederse şirketi yeniden tescil ediyor ve tasfiye memuru atıyor. Bu tescil bildirici nitelikte ve şirket yine bir tasfiye şirketi. Alacaklılara yeniden çağrı yapmaya gerek yok.", "Son olarak tasfiyeden dönme. Şirket süresi dolduğu için ya da genel kurul kararıyla sona ermişse, ortaklar fikir değiştirip şirkete devam etmek isteyebilir. Genel kurul sermayenin yüzde altmışının oyuyla tasfiyeden dönebiliyor. Mesela elli milyon liralık sermayede otuz milyon liralık oy lazım. Ama şartı şu. Ortaklara malvarlığının dağıtımına hiç başlanmamış olacak. Küçücük bir dağıtım bile yapıldıysa artık dönüş yok, alınan karar batıl.", "Tasfiyeden dönme kararını genel kurul alıyor, tasfiye memurları değil. Tasfiye memuru sadece kararı sicile tescil ettiriyor ve bu tescil kurucu nitelikte. Ek tasfiyede tescil bildiriciydi, burada kurucu. Bu farkı iyi ayır. İflas kaldırılırsa ya da konkordatoyla sona ererse şirket yine devam ediyor, buna da zımni tasfiyeden dönme deniyor.", "Toparlayalım. Birincisi, genel kurul kararıyla sona erme yüzde yetmiş beş ister ve yönetim kurulu başkanının iflası şirketi sona erdirmez. İkincisi, organ eksikliğinde mahkeme önce süre verir, haklı sebeple fesihte ise azlık başvurur ve mahkeme fesih yerine ortağın çıkarılmasına karar verebilir. Üçüncüsü, tasfiye memuru atanmazsa yönetim kurulu tasfiye eder ve mahkemenin atadığını genel kurul görevden alamaz. Dördüncüsü, alacaklılara birer hafta arayla üç ilan yapılır ve üçüncü çağrıdan itibaren üç ay dolmadan dağıtım yapılamaz. Beşincisi, ek tasfiyeyi denetçi isteyemez ve tescili bildiricidir, tasfiyeden dönme ise yüzde altmışla alınır ve tescili kurucudur."]};
const AUD={"1": 19, "2": 18, "3": 18, "4": 19, "5": 19, "6": 22, "7": 20, "8": 20, "9": 18, "10": 18, "11": 21, "12": 19};

<script>
(function(){
const L="ABCDE";
const KEY="d1010-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2","#4F46E5","#BE185D","#15803D","#B45309","#0369A1","#9333EA","#0F766E","#C2410C","#1D4ED8"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("d1010"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){
  const s=S[si], col=HUE[si];
  const tab=st.tab[si]||"notlar";
  const f=st.tab["f"+si]||"tum";
  const x=secStats(si), kb=s.sorular.filter(q=>q.k).length;
  let h=`<div style="--c:${col};display:contents">
  <div class="crumb"><a href="#genel">Genel bakış</a> / Bölüm ${s.id}</div>
  <section class="hero"><div><span class="pill">Bölüm ${s.id} / ${S.length} · ${s.sorular.length} soru</span><h1>${esc(s.baslik)}</h1><p>${esc(s.ozet)}</p></div>${ring(x.c,x.n,col,"doğru")}</section>
  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,S.length>8?2:3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();
  const list=st.karma.list, x=statsOf(list,st.karma.ans);
  let h=`<div class="crumb"><a href="#genel">Genel bakış</a> / Karma deneme</div>
  <section class="hero" style="--c:#141A2B"><div><span class="pill">Tüm bölümler · ${list.length} soru</span><h1>Karma deneme</h1><p>Her bölümden en az ${S.length>8?"iki":"üç"} soru içeren rastgele set. Buradaki cevaplar bölüm skorlarını etkilemez.</p></div>${ring(x.c,list.length,"#0E8F7E","doğru")}</section>
  ${bar(x,`<button class="btn pri" data-newkarma="1">Yeni set oluştur</button>`)}<div class="qlist">`;
  const saved=st.ans; st.ans=st.karma.ans;
  list.forEach(([s,qi],n)=>{h+=qCard(s,qi,n+1,true)});
  st.ans=saved;
  return h+`</div>`;
}

function renderHome(){
  let tA=0,tC=0;S.forEach((s,i)=>{const x=secStats(i);tA+=x.a;tC+=x.c});
  let h=`<section class="hero"><div><span class="pill">SPL · Ticaret Hukuku</span><h1>Ticaret Hukuku Sınav Defteri</h1>
  <p>Ticaret şirketleri, anonim şirketin kuruluşu, organları, denetimi, sermaye değişiklikleri ve menkul kıymetleri için bölüm notları ve sorular.</p>
  <div class="row" style="margin-top:18px"><a class="btn pri" href="#b1">Bölüm 1'den başla</a><a class="btn" href="#karma">Karma deneme</a></div></div>${ring(tC,TOTAL,"#0E8F7E","toplam doğru")}</section>
  <div class="tiles"><div class="tile"><span>Yanıtlanan</span><b>${tA}<small style="font-size:14px;color:var(--muted)"> / ${TOTAL}</small></b></div><div class="tile"><span>Doğru</span><b style="color:var(--ok)">${tC}</b></div><div class="tile"><span>Başarı oranı</span><b>${tA?"%"+Math.round(tC/tA*100):"–"}</b></div></div>
  <div class="sec-h"><h2>Bölümler</h2><span class="stat">${TOTAL} soru</span></div>
  <div class="grid">`;
  S.forEach((s,i)=>{const x=secStats(i);const kb=s.sorular.filter(q=>q.k).length;h+=`<a class="card" href="#b${s.id}" style="--c:${HUE[i]}"><div class="top"><span class="no">Bölüm ${s.id}</span><span class="stat">${s.sorular.length} soru</span></div><span class="t">${esc(s.kisa)}</span><span class="d">${esc(s.ozet)}</span>${meter(x.a,x.c,x.n)}<span class="p"><span>${x.c}/${x.n} doğru</span><span>${x.a} yanıt</span></span></a>`});
  h+=`</div>
  <section class="facts"><h2>Sınav öncesi son bakış</h2><dl>
  <div><dt>AŞ asgari sermaye</dt><dd>Esas 250.000 TL; kayıtlı (halka kapalı) 500.000 TL</dd></div>
  <div><dt>Nakdi pay ödemesi</dt><dd>%25&#x27;i + primin tamamı tescilden önce; kalanı 24 ay</dd></div>
  <div><dt>Yapısal değişiklik davaları</dt><dd>Denkleştirme ve iptal: TTSG ilanından 2 ay</dd></div>
  <div><dt>Pay bildirim eşikleri (TTK 198)</dt><dd>%5-10-20-25-33-50-67-100; 10 gün</dd></div>
  <div><dt>Kuruluştan sonra devralma (TTK 356)</dt><dd>2 yıl; sermayenin 1/10&#x27;u; GK %75</dd></div>
  <div><dt>Yönetim kurulu nisabı</dt><dd>Üye tam sayısının çoğunluğuyla toplanır, hazır bulunanların çoğunluğuyla karar</dd></div>
  <div><dt>Genel kurul nisabı</dt><dd>Adi: 1/4 (2. toplantıda nisap yok); esas sözleşme değişikliği: 1/2 (2. toplantıda 1/3)</dd></div>
  <div><dt>Azlık</dt><dd>Halka açık olmayanda %10, halka açıkta %5</dd></div>
  <div><dt>Genel kurul iptal davası</dt><dd>Karar tarihinden itibaren 3 ay; denetçi açamaz</dd></div>
  <div><dt>Sermaye kaybı (m.376)</dt><dd>1/2 kayıpta GK hemen; 2/3 kayıpta karar yoksa şirket sona erer</dd></div>
  </dl></section>`;
  return h;
}

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b(\d+)$/.exec(r);
  if(m&&+m[1]>=1&&+m[1]<=S.length) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const AU=new Audio();AU.preload="auto";
const PK="d1010-ses-v1";
let pref={rate:1,voice:"",follow:true,mode:"podcast"};
try{const r=localStorage.getItem(PK);if(r)pref=Object.assign(pref,JSON.parse(r))}catch(e){}
const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(pref))}catch(e){}};

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["KAMUDESK", "Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu"],["eSerPK", "eski Sermaye Piyasası Kanunu"],["AATUHK", "Amme Alacaklarının Tahsil Usulü Hakkında Kanun"],["SerPK", "Sermaye Piyasası Kanunu"],["SPBKŞ", "sermayesi paylara bölünmüş komandit şirket"],["COP26", "Birleşmiş Milletler İklim Değişikliği Konferansı"],["KOBİ", "küçük ve orta ölçekli işletme"],["TSRS", "Türkiye Sürdürülebilirlik Raporlama Standartları"],["UFRS", "Uluslararası Finansal Raporlama Standartları"],["BDDK", "Bankacılık Düzenleme ve Denetleme Kurumu"],["EPDK", "Enerji Piyasası Düzenleme Kurumu"],["TMSF", "Tasarruf Mevduatı Sigorta Fonu"],["eTTK", "eski Türk Ticaret Kanunu"],["TCMB", "Türkiye Cumhuriyet Merkez Bankası"],["RTÜK", "Radyo ve Televizyon Üst Kurulu"],["SMMM", "serbest muhasebeci mali müşavir"],["TBK", "Türk Borçlar Kanunu"],["TMK", "Türk Medeni Kanunu"],["HMK", "Hukuk Muhakemeleri Kanunu"],["İİK", "İcra ve İflas Kanunu"],["AET", "Avrupa Ekonomik Topluluğu"],["ESG", "çevresel, sosyal ve kurumsal yönetim"],["KHK", "Kanun Hükmünde Kararname"],["TCK", "Türk Ceza Kanunu"],["CMK", "Ceza Muhakemesi Kanunu"],["VUK", "Vergi Usul Kanunu"],["TMS", "Türkiye Muhasebe Standartları"],["MKK", "Merkezi Kayıt Kuruluşu"],["KAP", "Kamuyu Aydınlatma Platformu"],["YMM", "yeminli mali müşavir"],["AŞ", "anonim şirket"],["RG", "Resmî Gazete"],["HD", "Hukuk Dairesi"],["m.", "madde"],["SPKn","Sermaye Piyasası Kanunu"],["TTSG","Türkiye Ticaret Sicili Gazetesi"],["TRİK","teminat, rehin, ipotek ve kefalet"],["YİB","yatırımcı ilişkileri bölümü"],["KYBF","Kurumsal Yönetim Bilgi Formu"],["URF","Uyum Raporu"],["KSS","kurumsal sosyal sorumluluk"],["NBD","net bugünkü değer"],["KGK","Kamu Gözetimi Kurumu"],["KYD","kurumsal yönetim derecelendirme"],["TTK","Türk Ticaret Kanunu"],["YK","yönetim kurulu"],["GK","genel kurul"],["KY","kurumsal yönetim"],["PD","piyasa değeri"],["FD","fiili dolaşımdaki"],["GM","genel müdür"],["SP","sermaye piyasası"],["ÇSY","çevresel, sosyal ve kurumsal yönetim"],["AB","Avrupa Birliği"],["ABD","Amerika Birleşik Devletleri"],["SOX","Sarbanes Oxley"]];
function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}

}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"&&typeof AUD!=="undefined"?"Bu bölümün podcast'i hazır bir kayıttır; oynat düğmesine bas, anlatılan paragrafı burada takip et.":pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];if(typeof AUD!=="undefined"&&AUD[si+1])P[si+1].forEach((par,k)=>items.push({el:-1,raw:par,say:par,src:"audio/b"+(si+1)+"-"+(k+1)+".mp3"}));else P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;

function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  {const au=pref.mode==="podcast"&&typeof AUD!=="undefined";$("pVoice").parentNode.hidden=au;if(au)$("pWarn").hidden=true;}
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){

  return vs.find(v=>v.name===pref.voice)||tr[0]||null;

function fillVoices(){
  if(!synth)return;

  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  if(items[idx].src){if(synth)synth.cancel();const tok={};utt=tok;AU.src=items[idx].src;AU.playbackRate=pref.rate;
    AU.onended=()=>{if(utt!==tok||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
    AU.onerror=()=>{if(utt!==tok)return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses dosyası yüklenemedi; bağlantını kontrol edip tekrar dene."};
    AU.play().catch(()=>{});ui();return}
  AU.pause();
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth&&typeof AUD==="undefined"){return}

  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}

}
function pause(){playing=false;utt=null;AU.pause();if(synth)synth.cancel();ui()}
function stop(finished){playing=false;utt=null;AU.pause();if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth&&typeof AUD==="undefined"){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing&&items[idx]&&items[idx].src){AU.playbackRate=pref.rate;ui()}else if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}

window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
})();
