l kurula bırakılanlar dışında, işletme konusunun gerçekleşmesi için gerekli her türlü iş ve işlem hakkında karar almaya yetkilidir. Genel kurul ise yalnız kanun ve esas sözleşmede açıkça öngörülen hallerde karar alır (m.408/1).<\/li>\n<\/ul>\n<h4>Devredilemez ve vazgeçilemez görev ve yetkiler (m.375)<\/h4>\n<ol>\n<li>(a) Şirketin <b>üst düzeyde yönetimi<\/b> ve bunlarla ilgili talimatların verilmesi.<\/li>\n<li>(b) Şirket <b>yönetim teşkilatının<\/b> belirlenmesi.<\/li>\n<li>(c) Muhasebe, finans denetimi ve gerektiği ölçüde <b>finansal planlama<\/b> için gerekli düzenin kurulması.<\/li>\n<li>(ç) <b>Şube müdürleri hariç<\/b> müdürlerin, aynı işleve sahip kişilerin ve imza yetkililerinin atanması ve görevden alınması.<\/li>\n<li>(d) Yönetimle görevli kişilerin kanuna, esas sözleşmeye, iç yönergelere ve yazılı talimatlara uygun davranıp davranmadığının <b>üst gözetimi<\/b>.<\/li>\n<li>(e) Pay defteri, yönetim kurulu karar defteri, genel kurul toplantı ve müzakere defterinin tutulması; <b>yıllık faaliyet raporu ve kurumsal yönetim açıklamasının<\/b> düzenlenip genel kurula sunulması; genel kurulun hazırlanması ve kararlarının yürütülmesi.<\/li>\n<li>(f) <b>Borca batıklık<\/b> durumunda mahkemeye bildirim.<\/li>\n<\/ol>\n<ul>\n<li>Hâkim görüşe göre m.375 <b>sınırlı sayıda değildir<\/b>. Nitelikleri gereği devredilemez sayılan diğer örnekler: şirketin feshi davasının açılması (m.353/1), sermaye kaybında tedbir alınması (m.376), riskin erken saptanması komitesinin kurulması (m.378), halka açık ortaklığın ilişkili taraf işlemlerinden önce esasları belirleyen karar (SerPK m.17/3).<\/li>\n<li>Dikkat: \"Önemli miktarda şirket varlığının toptan satışı\" yönetim kurulunun değil, <b>genel kurulun<\/b> devredilemez yetkisidir (m.408/2-e).<\/li>\n<\/ul>\n<h4>Yönetim kuruluna devredilebilen yetkiler<\/h4>\n<table>\n<tr><th>Yetki<\/th><th>Kapsam<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>Kayıtlı sermaye sistemi<\/td><td>Esas sözleşmedeki kayıtlı sermaye tavanına kadar sermayeyi yönetim kurulu kararıyla artırma<\/td><td>TTK m.460, SerPK m.18<\/td><\/tr>\n<tr><td>Tüm anonim şirketlerde (esas sözleşmeyle özel yetki şartıyla)<\/td><td>İmtiyazlı pay veya itibari değerin üzerinde pay çıkarma, yeni pay alma haklarını sınırlama; primli pay çıkarma (m.480/2)<\/td><td>TTK m.460, 480/2; SerPK m.18<\/td><\/tr>\n<tr><td>Yalnız halka açık ortaklıklarda ek olarak<\/td><td>İtibari değerin altında pay çıkarma, imtiyazlı pay sahiplerinin haklarını kısıtlayan karar alma<\/td><td>SerPK m.18<\/td><\/tr>\n<tr><td>Menkul kıymet çıkarma<\/td><td>Genel kurul, çıkarma ve şartları saptama yetkisini <b>en çok 15 ay<\/b> için yönetim kuruluna bırakabilir<\/td><td>TTK m.505<\/td><\/tr>\n<tr><td>Borçlanma aracı ihracı<\/td><td>Esas sözleşmeyle yönetim kuruluna <b>süreli veya süresiz<\/b> devredilebilir; \"ihraççı\" ifadesi nedeniyle halka açık olmayan şirketlere de uygulanır<\/td><td>SerPK m.31/3<\/td><\/tr>\n<\/table>\n<p>Dikkat: Genel kurulun m.408'deki devredilemez yetkileri ne esas sözleşmeyle ne de genel kurul kararıyla yönetim kuruluna verilebilir.<\/p>\n\n<h4>Sermaye kaybı ve borca batıklık (m.376–377)<\/h4>\n<table>\n<tr><th>Durum (son yıllık bilançoya göre)<\/th><th>Yönetim kurulunun yükümlülüğü / sonuç<\/th><\/tr>\n<tr><td>Sermaye + kanuni yedek akçeler toplamının <b>yarısı<\/b> zarar sebebiyle karşılıksız<\/td><td>Genel kurulu <b>hemen<\/b> toplantıya çağırır, uygun gördüğü <b>iyileştirici önlemleri<\/b> sunar<\/td><\/tr>\n<tr><td>Aynı toplamın <b>üçte ikisi<\/b> karşılıksız<\/td><td>Derhâl çağrılan genel kurul <b>sermayenin üçte biriyle yetinme<\/b> veya <b>sermayenin tamamlanması<\/b> kararı vermezse şirket <b>kendiliğinden sona erer<\/b><\/td><\/tr>\n<tr><td><b>Borca batıklık<\/b> şüphesi<\/td><td>Aktifler hem <b>işletmenin devamlılığı<\/b> esasına hem <b>muhtemel satış fiyatlarına<\/b> göre değerlenerek <b>ara bilanço<\/b> çıkarılır; aktifler alacakları karşılamıyorsa şirket merkezinin bulunduğu yer <b>asliye ticaret mahkemesine<\/b> bildirilir ve iflas istenir<\/td><\/tr>\n<\/table>\n<ul>\n<li>Borca batıklıkta istisna: alacaklılar, açığı karşılayacak tutardaki alacaklarının diğer tüm alacaklılardan <b>sonraki sıraya<\/b> konulmasını yazılı kabul eder ve bu beyan mahkemece atanan bilirkişilerce doğrulanırsa iflas istenmez. Aksi hâlde bilirkişi incelemesi başvurusu iflas bildirimi sayılır.<\/li>\n<li>m.377: yönetim kurulu veya herhangi bir alacaklı, yeni nakit sermaye dahil gerçek kaynakları gösteren bir <b>iyileştirme projesi<\/b> sunarak iflasın ertelenmesini isteyebilir (İİK m.179–179/b).<\/li>\n<\/ul>\n<h4>Riskin erken saptanması komitesi (m.378)<\/h4>\n<ul>\n<li>Pay senetleri <b>borsada işlem gören<\/b> şirketlerde kurulması <b>zorunludur<\/b>.<\/li>\n<li>Diğer şirketlerde <b>denetçi<\/b> gerekli görüp yönetim kuruluna yazılı bildirirse derhâl kurulur ve ilk raporunu kurulmasını izleyen <b>bir ayın sonunda<\/b> verir.<\/li>\n<li>Komite yönetim kuruluna <b>her iki ayda bir<\/b> rapor verir; rapor <b>denetçiye de<\/b> gönderilir.<\/li>\n<\/ul>\n\n<h3>Yönetim yetkisi: toplantı ve karar<\/h3>\n<ul>\n<li>Yönetim, devredilmedikçe <b>tüm üyelere<\/b> aittir ve kural olarak <b>kurul hâlinde<\/b> kullanılır.<\/li>\n<li>Karar alma yolları: (1) fiziki veya elektronik ortamda <b>toplantı<\/b>; (2) toplantısız <b>öneriye yazılı onay<\/b> (sirküler karar). Her iki hâlde de kararlar <b>yazılıp imzalanmadıkça geçerli değildir<\/b>.<\/li>\n<li>Dikkat: Üyeler birbirlerini temsilen oy kullanamaz ve toplantıya <b>vekil aracılığıyla katılamaz<\/b> (genel kurulda temsil mümkündür; yönetim kurulunda değil).<\/li>\n<\/ul>\n<table>\n<tr><th>Yöntem<\/th><th>Toplantı nisabı<\/th><th>Karar nisabı<\/th><th>Not<\/th><\/tr>\n<tr><td>Toplantı (fiziki/elektronik), m.390/1<\/td><td>Üye <b>tam sayısının çoğunluğu<\/b><\/td><td>Toplantıda <b>hazır bulunanların çoğunluğu<\/b><\/td><td>Esas sözleşme ağırlaştırabilir<\/td><\/tr>\n<tr><td>Oyların eşitliği, m.390/3<\/td><td colspan=\"2\">Konu gelecek toplantıya bırakılır; ikinci toplantıda da eşitlik olursa öneri <b>reddedilmiş<\/b> sayılır<\/td><td>Başkanın üstün oyu yok<\/td><\/tr>\n<tr><td>Öneriye yazılı onay (sirküler)<\/td><td>Fiilen <b>oybirliği<\/b>: hiçbir üye toplantı istememeli, öneri tüm üyelere yapılmalı<\/td><td>Üye <b>tam sayısının çoğunluğunun<\/b> yazılı onayı<\/td><td>Onaylar aynı kâğıtta olmak zorunda değil; karar defterine yapıştırılmalı veya karara dönüştürülüp deftere geçirilmeli<\/td><\/tr>\n<\/table>\n<h4>Müzakereye katılma yasağı (m.393)<\/h4>\n<ul>\n<li>Üye; kendisinin veya alt-üst soyunun, eşinin ya da <b>üçüncü derece dahil<\/b> kan ve kayın hısımlarından birinin <b>kişisel ve şirket dışı menfaatiyle<\/b> şirket menfaatinin çatıştığı konuların müzakeresine katılamaz.<\/li>\n<li>Dürüstlük kuralı gerektiriyorsa da uygulanır (ör. üyenin ortağı, ortağı olduğu şahıs şirketi, eski eşi).<\/li>\n<li>Tereddütte kararı yönetim kurulu verir; bu oylamaya ilgili üye katılamaz. Çatışmayı kurul bilmese bile üye açıklamak ve yasağa uymak zorundadır. Katılmama sebebi ve ilgili işlemler <b>karara yazılır<\/b> (m.393/3).<\/li>\n<li>Yasak oy yasağını da içerir; yasaklı üye <b>toplantı ve karar nisabında dikkate alınmaz<\/b>.<\/li>\n<li>Aykırılıkta: yasağa uymayan üye, menfaat çatışmasını bildiği hâlde itiraz etmeyen üyeler ve katılımına karar veren üyeler şirketin zararından <b>müteselsilen<\/b> sorumludur.<\/li>\n<\/ul>\n<h4>İşbölümü ve yönetimin devri<\/h4>\n<ul>\n<li><b>Komite ve komisyonlar<\/b> (m.366/2): işlerin gidişini izlemek, rapor hazırlamak, kararları uygulatmak veya iç denetim amacıyla; içlerinde yönetim kurulu üyeleri de bulunabilir. Kural olarak ihtiyaridir; riskin erken saptanması komitesi istisnadır.<\/li>\n<li><b>Yönetimin devri<\/b> (m.367): yönetim kurulu, <b>esas sözleşmeye konulacak bir hükümle<\/b> yetkilendirilmişse, düzenleyeceği bir <b>iç yönergeye<\/b> göre yönetimi kısmen veya tamamen bir veya birkaç üyeye ya da üçüncü kişiye devredebilir.<\/li>\n<li>İç yönerge görevleri, tanımları, kimin kime bağlı ve kime bilgi vermekle yükümlü olduğunu belirler. Yönetim kurulu, istem üzerine pay sahiplerini ve korunmaya değer menfaatini ikna edici biçimde ortaya koyan alacaklıları iç yönerge hakkında <b>yazılı<\/b> bilgilendirir. İç yönerge kural olarak <b>tescil ve ilana tabi değildir<\/b> (istisna m.371/7).<\/li>\n<li>Devredilemez yetkiler (m.375) bu yolla da devredilemez.<\/li>\n<li>Sorumluluğa etkisi (m.553/2): yetkiyi kanuna uygun devredenler, devralanın <b>seçiminde makul özen<\/b> göstermedikleri ispatlanmadıkça, devralanın fiil ve kararlarından sorumlu olmaz.<\/li>\n<\/ul>\n\n<h3>Temsil yetkisi<\/h3>\n<ul>\n<li>Temsil yetkisi kural olarak <b>tüm üyelere<\/b> aittir; esas sözleşmede aksi öngörülmemişse veya kurul tek kişiden oluşmuyorsa <b>çift imza<\/b> ile kullanılır (m.370/1). Esas sözleşmede tek imza öngörülmesi veya tek üyeli kurul hâlinde ferdi temsil geçerlidir.<\/li>\n<li>İmza yetkilileri şirket unvanı altında imza atar; imzalar <b>notere onaylatılarak<\/b> sicil müdürlüğüne verilir (m.40).<\/li>\n<li>Şirket belgelerinde <b>merkez, kayıtlı olunan sicil ve sicil numarası<\/b> gösterilir (m.372).<\/li>\n<li><b>Temsil yetkisinin devri<\/b> (m.370/2): bir veya daha fazla <b>murahhas üyeye<\/b> veya <b>müdür<\/b> olarak üçüncü kişilere devredilebilir. <b>En az bir yönetim kurulu üyesinin<\/b> temsil yetkisini koruması şarttır. Bu devir için esas sözleşme hükmü veya iç yönerge zorunlu değildir. Üye dışındakine devirde \"müdür / murahhas müdür\" sıfatı doğar.<\/li>\n<li>Müdürlerin ve imza yetkililerinin atanması ve görevden alınması m.375 uyarınca devredilemez yetkidir.<\/li>\n<li>Yönetim kurulu ticari temsilci ve ticari vekil de atayabilir; TBK m.40 vd. ile belirli kişilere temsil yetkisi verilebilir. Tasfiyede temsil, tasfiye amacıyla sınırlı olarak <b>tasfiye memurlarına<\/b> geçer.<\/li>\n<li><b>m.371/7 (6552 sayılı Kanun)<\/b>: yönetim kurulu, temsile yetkili olmayan üyeleri veya şirkete <b>hizmet akdiyle bağlı<\/b> olanları <b>sınırlı yetkili ticari vekil<\/b> veya diğer tacir yardımcısı olarak atayabilir. Görev ve yetkileri m.367'ye göre hazırlanan iç yönergede belirlenir ve bu durumda <b>iç yönergenin tescil ve ilanı zorunludur<\/b>. Atamayı yönetim kurulu yapmalıdır; iç yönergeyle atama yapılamaz. Bu kişiler de tescil ve ilan edilir; verdikleri zararlardan yönetim kurulu <b>müteselsilen<\/b> sorumludur.<\/li>\n<\/ul>\n<h4>Temsil yetkisinin kapsamı ve sınırlandırılması (m.371)<\/h4>\n<ul>\n<li>Temsil yetkisi şirketin amacına ve işletme konusuna giren her türlü işlemi kapsar. <b>Ultra vires<\/b> teorisi terk edildiğinden işletme konusu dışındaki işlemler de <b>kural olarak şirketi bağlar<\/b>.<\/li>\n<li>İstisna: üçüncü kişinin işlemin işletme konusu dışında olduğunu <b>bildiği veya bilebilecek durumda olduğu ispat edilirse<\/b> şirket bağlanmaz. Esas sözleşmenin ilan edilmiş olması tek başına yeterli delil değildir (sicilin olumlu işlevi burada işlemez).<\/li>\n<li>Sınırlama yalnız <b>iki hâlde<\/b> üçüncü kişilere karşı geçerlidir (m.371/3): yetkinin <b>merkez veya bir şubenin işlerine özgülenmesi<\/b> ve <b>birlikte kullanılması<\/b>; bunlar da tescil ve ilan edilmelidir. Konu veya miktar sınırlamaları iyiniyetli üçüncü kişilere karşı hüküm doğurmaz.<\/li>\n<li>Kanuna ve esas sözleşmeye aykırı işlemlerde şirketin temsilcilere <b>rücu hakkı<\/b> saklıdır (m.371/1).<\/li>\n<li>m.210/3: kamu düzenine veya işletme konusuna aykırı ya da muvazaalı faaliyetler hakkında Ticaret Bakanlığı öğrenmeden itibaren <b>bir yıl<\/b> içinde fesih davası açabilir; işletme konusu önemini korur.<\/li>\n<li><b>Pasif temsil<\/b>: şirkete yapılan ihbar ve ihtarda birlikte temsil kuralı uygulanmaz; temsil yetkisi olan herhangi birine yapılan bildirim geçerlidir.<\/li>\n<li>İşlemin esas sözleşmeye veya genel kurul kararına aykırı olması iyiniyetli üçüncü kişinin şirkete başvurmasına engel değildir.<\/li>\n<\/ul>\n<h4>Tescil ve ilan (m.373)<\/h4>\n<ul>\n<li>Yönetim kurulu, temsile yetkilileri ve temsil şekillerini gösteren kararının <b>noterce onaylı suretini<\/b> tescil ve ilan için sicile verir.<\/li>\n<li>Tescilden sonra temsilcilerin seçim veya atamasındaki hukuki sakatlık, üçüncü kişiye ancak sakatlığı <b>bildiği ispat edilirse<\/b> ileri sürülebilir.<\/li>\n<li>Kamu kurum ve kuruluşları sicil kayıtlarını esas alır; sicil müdürlüğü belgeleri ve TTSG ilanı dışında belge isteyemez.<\/li>\n<\/ul>\n<h4>Haksız fiilden şirketin sorumluluğu (m.371/5)<\/h4>\n<ul>\n<li>Temsile veya yönetime yetkili olanların görevlerini yaparken işledikleri <b>haksız fiillerden şirket sorumludur<\/b>; şirketin rücu hakkı saklıdır (TMK m.50/2'ye paralel).<\/li>\n<li>Fail de şahsen sorumludur; aynı zarardan şirket ve fail <b>müteselsilen<\/b> sorumludur.<\/li>\n<\/ul>\n", "sorular": [{"q": "TTK'ya göre anonim şirket yönetim kurulunun üye sayısına ilişkin hangisi doğrudur?", "o": ["En az üç üye zorunludur", "Bir veya daha fazla kişiden oluşabilir; üst sınır yoktur", "En az iki, en çok on bir üyeden oluşur", "Tek kişilik şirkette en az iki üye zorunludur", "En az beş üye her anonim şirket için zorunludur"], "a": 1, "e": "m.359/1 bir veya daha fazla kişiyi yeterli görür ve üst sınır koymaz. En az beş üye şartı yalnız bankalar ve Kurumsal Yönetim İlkelerine tabi borsa şirketleri içindir."}, {"q": "Aşağıdakilerden hangisinde yönetim kurulunun en az beş üyeden oluşması zorunludur?", "o": ["Tüm kayıtlı sermayeli anonim şirketlerde", "Tek pay sahipli anonim şirketlerde", "Denetime tabi tüm anonim şirketlerde", "Esas sermayesi belli tutarı aşan şirketlerde", "Bankalarda ve payları borsada işlem gören halka açık ortaklıklarda"], "a": 4, "e": "Bankacılık Kanunu m.23 ve KY İlkeleri m.4.3.1 bu şirketlerde en az beş üye öngörür; TTK'nın kendisi asgari sınır koymaz."}, {"q": "Anonim şirket yönetim kurulu toplantısında oylar eşit çıkarsa ne olur?", "o": ["Başkanın oyu üstün sayılır", "Konu genel kurula götürülür", "Konu gelecek toplantıya bırakılır; orada da eşitlik olursa öneri reddedilmiş sayılır", "Öneri hemen reddedilmiş sayılır", "Kura çekilir"], "a": 2, "e": "m.390/3 böyle düzenler ve emredicidir. Başkana üstün oy esas sözleşmeyle de tanınamaz; üstün oy limited şirket müdürleri için söz konusudur."}, {"q": "7511 sayılı Kanunla yapılan değişikliğe göre yönetim kurulu üyelerinin çoğunluğu başkandan yazılı olarak toplantı isterse başkan toplantıyı en geç ne kadar süre içinde yapılacak şekilde çağırmak zorundadır?", "o": ["30 gün", "7 gün", "15 gün", "45 gün", "3 ay"], "a": 0, "e": "İstemin başkana ulaştığı tarihten itibaren en geç otuz gün içinde; çağrı yapılmazsa istem sahipleri doğrudan çağırabilir."}, {"q": "Yönetim kurulu üyelerinin görev süresine ilişkin hangisi yanlıştır?", "o": ["En çok üç yıl için seçilirler", "Üç yıldan kısa süre için de seçilebilirler", "Esas sözleşmede aksine hüküm yoksa yeniden seçilebilirler", "Tüm üyelerin aynı süre için seçilmesi zorunludur", "Süresi dolan üye genel kurulca yeniden seçilebilir"], "a": 3, "e": "TTK, üyelerin aynı süre için seçilmesi zorunluluğu öngörmez; diğer ifadeler m.362/1'e uygundur."}, {"q": "Bir yönetim kurulu üyeliği boşaldığında geçici üye seçimine ilişkin hangisi doğrudur?", "o": ["Geçici üyeyi Ticaret Bakanlığı atar", "Yönetim kurulu geçici üye seçer, ilk genel kurulun onayına sunar; onaylanırsa üye selefinin süresini tamamlar", "Geçici üye üç yıllık yeni bir süre için görev yapar", "Geçici üyeyi asliye ticaret mahkemesi atar", "Boşalan üyelik bir sonraki olağan genel kurula kadar boş bırakılmak zorundadır"], "a": 1, "e": "m.363/1 uyarınca yönetim kurulu kanuni şartları taşıyan birini geçici seçer; üye onaylanırsa selefinin kalan süresini tamamlar."}, {"q": "TTK m.360 uyarınca tanınan yönetim kurulunda temsil edilme hakkı halka açık anonim şirketlerde hangi sınırı aşamaz?", "o": ["Üye sayısının üçte birini", "Üye sayısının dörtte birini", "İki üyeyi", "Üye sayısının üçte ikisini", "Üye sayısının yarısını"], "a": 4, "e": "Halka açık şirketlerde bu yolla tanınan temsil hakkı yönetim kurulu üye sayısının yarısını aşamaz; bağımsız üye hükümleri saklıdır."}, {"q": "Tüzel kişinin yönetim kurulu üyesi seçilmesi hâlinde hangisi doğrudur?", "o": ["Tüzel kişi adına dilediği sayıda gerçek kişi toplantıya katılabilir", "Tüzel kişiler yönetim kurulu üyesi olamaz", "Tüzel kişi adına, tüzel kişi tarafından belirlenen sadece bir gerçek kişi tescil ve ilan edilir ve yalnız o kişi oy kullanabilir", "Tüzel kişi adına katılacak kişinin tescili gerekmez", "Tüzel kişi temsilcisi genel kurul tarafından belirlenir"], "a": 2, "e": "m.359/2: tüzel kişiyle birlikte onun belirlediği sadece bir gerçek kişi tescil ve ilan edilir; internet sitesinde hemen açıklanır ve toplantıya yalnız bu kişi katılıp oy kullanır."}, {"q": "Aşağıdakilerden hangisi yönetim kurulu üyeliğini sona erdiren hallerden biri değildir?", "o": ["Üyenin yönetim kurulunun kararıyla görevden alınması", "Üyenin istifası", "Üyenin iflasına karar verilmesi", "Esas sözleşmedeki seçilme şartının sonradan kaybı", "Görev süresinin dolması"], "a": 0, "e": "Görevden alma genel kurulun devredilemez yetkisidir (m.364, 408/2-b); yönetim kurulu bir üyeyi görevden alamaz."}, {"q": "Yönetim kurulu üyelerinin görevden alınmasına ilişkin hangisi doğrudur?", "o": ["Esas sözleşmeyle atanan üyeler görevden alınamaz", "Ancak gündemde madde varsa görevden alınabilir", "Görevden alma mahkeme kararı gerektirir", "Gündemde madde bulunmasa da haklı sebep varsa genel kurul kararıyla görevden alınabilir", "Görevden alma yönetim kurulu başkanının yetkisindedir"], "a": 3, "e": "m.364: esas sözleşmeyle atanmış olsalar bile, gündemde ilgili madde varsa veya haklı sebep varsa gündemde olmasa da genel kurul kararıyla her zaman görevden alınabilirler."}, {"q": "Genel kurulca seçilen yönetim kurulu üyesi üyelik sıfatını ne zaman kazanır?", "o": ["Ticaret siciline tescille", "Üyeliği kabul etmesiyle", "Türkiye Ticaret Sicili Gazetesinde ilanla", "İlk yönetim kurulu toplantısına katılmasıyla", "Bakanlık onayıyla"], "a": 1, "e": "Üyelik kabul beyanıyla kazanılır; tescil açıklayıcıdır, kurucu değildir. Kabul beyanı şekle tabi değildir ve şarta bağlanamaz."}, {"q": "Aşağıdakilerden hangisi TTK m.375'te sayılan yönetim kurulunun devredilemez görev ve yetkilerinden biri değildir?", "o": ["Şirket yönetim teşkilatının belirlenmesi", "Borca batıklık durumunda mahkemeye bildirim", "Yıllık faaliyet raporu ve kurumsal yönetim açıklamasının düzenlenmesi", "Muhasebe ve finans denetimi düzeninin kurulması", "Şube müdürlerinin atanması ve görevden alınması"], "a": 4, "e": "m.375/1-ç müdürleri ve imza yetkililerini sayar ama şube müdürlerini açıkça hariç tutar."}, {"q": "TTK m.505'e göre genel kurul, menkul kıymet çıkarma ve şartlarını saptama yetkisini yönetim kuruluna en çok ne kadar süre için bırakabilir?", "o": ["6 ay", "12 ay", "15 ay", "3 yıl", "5 yıl"], "a": 2, "e": "m.505 en çok on beş ay öngörür. Borçlanma aracı ihracında ise SerPK m.31/3 esas sözleşmeyle süreli veya süresiz devre izin verir."}, {"q": "Aşağıdaki yetkilerden hangisi esas sözleşmeyle yönetim kuruluna yalnız halka açık ortaklıklarda bırakılabilir?", "o": ["İtibari değerinin altında pay çıkarılması", "Kayıtlı sermaye tavanına kadar sermaye artırımı", "İtibari değerinin üzerinde pay çıkarılması", "Yeni pay alma haklarının sınırlandırılması", "İmtiyazlı pay çıkarılması"], "a": 0, "e": "İtibari değerin altında pay çıkarma ve imtiyazlı pay sahiplerinin haklarını kısıtlama yetkisi yalnız SerPK m.18 ile halka açık ortaklıklarda devredilebilir; diğerleri TTK m.460 ile tüm şirketlerde mümkündür."}, {"q": "Son yıllık bilançoya göre sermaye ve kanuni yedek akçeler toplamı 12 milyon lira olan bir şirketin zararı hangi tutarı aştığında yönetim kurulu genel kurulu hemen toplantıya çağırıp iyileştirici önlemleri sunmak zorunda kalır?", "o": ["3 milyon lira", "4 milyon lira", "8 milyon lira", "6 milyon lira", "12 milyon lira"], "a": 3, "e": "Toplamın yarısı (12 / 2 = 6 milyon lira) zarar sebebiyle karşılıksız kalırsa m.376/1 devreye girer. 8 milyon lira üçte ikilik eşiktir."}, {"q": "Sermaye ve kanuni yedek akçeler toplamı 9 milyon lira olan bir şirkette zarar sebebiyle karşılıksız kalan tutar hangi düzeye ulaşırsa, genel kurul sermayenin üçte biriyle yetinme veya tamamlama kararı almadığında şirket kendiliğinden sona erer?", "o": ["3 milyon lira", "6 milyon lira", "4,5 milyon lira", "7,5 milyon lira", "9 milyon lira"], "a": 1, "e": "Üçte iki eşiği: 9 x 2/3 = 6 milyon lira. 4,5 milyon lira yarı eşiğidir ve yalnız toplantıya çağırma ve önlem sunma yükümlülüğü doğurur."}, {"q": "Borca batıklık şüphesinde yönetim kurulunun çıkaracağı ara bilançoya ilişkin hangisi doğrudur?", "o": ["Yalnız kayıtlı değerler esas alınır", "Ara bilançoyu denetçi çıkarır", "Ara bilanço genel kurul onayıyla kesinleşir", "Yalnız muhtemel satış fiyatları esas alınır", "Aktifler hem işletmenin devamlılığı esasına hem muhtemel satış fiyatlarına göre değerlenir"], "a": 4, "e": "m.376/3: iki esasa göre ara bilanço çıkarılır; aktifler alacakları karşılamıyorsa merkezin bulunduğu yer asliye ticaret mahkemesine bildirilir."}, {"q": "Riskin erken saptanması komitesine ilişkin hangisi yanlıştır?", "o": ["Pay senetleri borsada işlem gören şirketlerde kurulması zorunludur", "Diğer şirketlerde denetçinin yazılı bildirimi üzerine derhal kurulur", "Komite yönetim kuruluna her üç ayda bir rapor verir", "Denetçi istemiyle kurulan komite ilk raporunu kuruluşu izleyen bir ayın sonunda verir", "Komitenin raporu denetçiye de gönderilir"], "a": 2, "e": "Komite yönetim kuruluna her iki ayda bir rapor verir (m.378)."}, {"q": "Yönetim kurulunun toplantı ve karar nisabına ilişkin genel kural hangisidir?", "o": ["Üye tam sayısının çoğunluğu ile toplanır, toplantıda hazır bulunanların çoğunluğu ile karar alır", "Hazır bulunanların çoğunluğu ile toplanır, üye tam sayısının çoğunluğu ile karar alır", "Üye tam sayısının üçte ikisi ile toplanır ve karar alır", "Oybirliği ile toplanır, çoğunlukla karar alır", "Üyelerin dörtte biri ile toplanır, salt çoğunlukla karar alır"], "a": 0, "e": "m.390/1; esas sözleşme ağırlaştırabilir ve kural elektronik toplantılarda da uygulanır."}, {"q": "Toplantı yapılmaksızın öneriye yazılı onay yoluyla yönetim kurulu kararı alınmasına ilişkin hangisi yanlıştır?", "o": ["Önerinin tüm üyelere yapılması gerekir", "Hiçbir üyenin toplantı istememesi gerekir", "En az üye tam sayısının çoğunluğunun yazılı onayı gerekir", "Onayların aynı kâğıt üzerinde bulunması zorunludur", "Onay kâğıtları karar defterine yapıştırılmalı veya karara dönüştürülüp deftere geçirilmelidir"], "a": 3, "e": "Onayların aynı kâğıtta bulunması şart değildir; ancak defterle ilişkilendirilmesi geçerlilik için gereklidir."}, {"q": "Müzakereye katılma yasağı (m.393) kapsamında hangisi yanlıştır?", "o": ["Üçüncü derece dahil kan ve kayın hısımlarının şirket dışı menfaati de yasağı doğurur", "Yasak, kurul menfaat çatışmasını bilmiyorsa uygulanmaz", "Tereddütte kararı yönetim kurulu verir ve ilgili üye bu oylamaya katılamaz", "Yasaklı üye toplantı ve karar nisabında dikkate alınmaz", "Katılmama sebebi yönetim kurulu kararına yazılır"], "a": 1, "e": "Menfaat çatışması kurul tarafından bilinmese bile üye bunu açıklamak ve yasağa uymak zorundadır."}, {"q": "Yönetimin devrine (m.367) ilişkin hangisi doğrudur?", "o": ["Yönetim kurulu esas sözleşmede hüküm olmasa da yönetimi devredebilir", "Devir yalnız yönetim kurulu üyelerine yapılabilir", "İç yönerge her durumda tescil ve ilana tabidir", "Devredilemez yetkiler de iç yönergeyle devredilebilir", "Devir için esas sözleşmede yetki hükmü ve yönetim kurulunun düzenleyeceği bir iç yönerge gerekir"], "a": 4, "e": "m.367 esas sözleşme yetkisi ve iç yönerge arar; devir üyelere veya üçüncü kişiye yapılabilir; iç yönerge kural olarak tescil ve ilana tabi değildir."}, {"q": "Temsil yetkisine ilişkin hangisi yanlıştır?", "o": ["Esas sözleşmede aksi yoksa ve kurul tek kişiden oluşmuyorsa temsil çift imza ile kullanılır", "Temsil yetkisi murahhas üyelere veya müdür olarak üçüncü kişilere devredilebilir", "Temsil yetkisi tümüyle üçüncü kişilere devredilip hiçbir üyede bırakılmayabilir", "Merkez veya şube işlerine özgüleme tescil ve ilan edilirse üçüncü kişilere karşı geçerlidir", "Şirkete yapılan ihbarlar temsil yetkisi olan herhangi birine yapılabilir"], "a": 2, "e": "m.370/2: en az bir yönetim kurulu üyesinin temsil yetkisini haiz olması şarttır."}, {"q": "Temsile yetkili kişinin işletme konusu dışında yaptığı bir işlem hakkında hangisi doğrudur?", "o": ["İşlem kural olarak şirketi bağlar; üçüncü kişinin işletme konusu dışında olduğunu bildiği veya bilebilecek olduğu ispatlanırsa bağlamaz", "İşlem yok hükmündedir", "Esas sözleşme ilan edildiyse işlem hiçbir zaman şirketi bağlamaz", "İşlem ancak genel kurul onaylarsa geçerli olur", "İşlem yalnız yönetim kurulu üyelerini şahsen bağlar"], "a": 0, "e": "m.371/2; ultra vires terk edilmiştir ve esas sözleşmenin ilanı, bilme durumunun ispatı için tek başına yeterli delil değildir."}, {"q": "m.371/7 uyarınca atanan sınırlı yetkili ticari vekillere ilişkin hangisi doğrudur?", "o": ["İç yönergeyle doğrudan atanabilirler", "Tescil ve ilan edilmezler", "Verdikleri zarardan yönetim kurulu hiçbir şekilde sorumlu olmaz", "Görev ve yetkileri iç yönergede belirlenir ve bu iç yönergenin tescil ve ilanı zorunludur", "Yalnız temsile yetkili yönetim kurulu üyeleri arasından atanabilirler"], "a": 3, "e": "Atamayı yönetim kurulu yapar, iç yönerge tescil ve ilan edilir, ticari vekiller de tescil edilir ve yönetim kurulu bunların zararlarından müteselsilen sorumludur. Temsile yetkili olmayan üyeler veya hizmet akdiyle bağlı olanlar atanabilir."}]}, {"id": 7, "kisa": "Yönetim Kurulu: Sorumluluk", "baslik": "Yönetim Kurulu Kararlarının Sakatlığı, Üyelerin Hak ve Yükümlülükleri ile Hukuki ve Cezai Sorumluluk", "ozet": "Yokluk, butlan ve iptal; bilgi alma hakkı ve mali haklar; sadakat, özen, şirketle işlem ve rekabet yasakları; sorumluluk davası, farklılaştırılmış teselsül, zamanaşımı, ibra ve özel sorumluluk halleri.", "notlar": "\n<h3>Yönetim kurulu kararlarının sakatlığı<\/h3>\n<p>Hukuka aykırılığın ağırlığına göre üç yaptırım vardır: <b>yokluk<\/b>, <b>butlan<\/b> (kesin hükümsüzlük) ve <b>iptal edilebilirlik<\/b>. Yokluk ve butlan <b>süreye bağlı olmaksızın<\/b> her ilgili tarafından ileri sürülebilir, hâkim tarafından <b>resen<\/b> dikkate alınır, sonradan geçerlilik kazanamaz ve sicile tescil edilemez.<\/p>\n<table>\n<tr><th>Yaptırım<\/th><th>Ne zaman?<\/th><th>Dayanak ve özellik<\/th><\/tr>\n<tr><td><b>Yokluk<\/b><\/td><td>Kararın <b>kurucu unsurları<\/b> eksik: şekil eksikliği, ayırt etme gücü yokluğu, toplantı ve karar nisaplarına uyulmaması, usulsüz çağrı, üye olmayanların karar alması<\/td><td>TTK'da açık düzenleme yok; genel hükümlerle kabul edilir. Herkes, süresiz, yokluğun tespiti davası açabilir<\/td><\/tr>\n<tr><td><b>Butlan<\/b><\/td><td>Kurucu unsurlar var, ama <b>ağır hukuka aykırılık<\/b> ve geçerlilik şartı eksik<\/td><td>TTK m.391 (6102 ile ilk kez açıkça düzenlendi); sayım <b>sınırlı değildir<\/b> (\"özellikle\")<\/td><\/tr>\n<tr><td><b>İptal<\/b><\/td><td>Kanuna, esas sözleşmeye veya dürüstlük kuralına aykırılık; yalnız kanunun öngördüğü hallerde<\/td><td>Kayıtlı sermaye kararları (TTK m.460/5, SerPK m.18/6), yapısal değişiklik kararları (m.192/2), kâr payı avansı<\/td><\/tr>\n<\/table>\n<h4>Batıl kararlar (m.391)<\/h4>\n<ol>\n<li>(a) <b>Eşit işlem ilkesine<\/b> aykırı kararlar.<\/li>\n<li>(b) Anonim şirketin <b>temel yapısına<\/b> uymayan veya <b>sermayenin korunması<\/b> ilkesini gözetmeyen kararlar. Örnek: ek ödeme yükümü; kredi veren bir bankaya pay sahibine eş haklar veya yönetim kurulu kararlarında veto tanınması (temel haklar düzenine aykırı); üye olmayan birine üye hakları verilmesi (organsal yapıya aykırı).<\/li>\n<li>(c) Pay sahiplerinin özellikle <b>vazgeçilmez haklarını<\/b> ihlal eden, kısıtlayan veya güçleştiren kararlar. Örnek: iptal davasını yönetim kurulu onayına bağlamak; kâr amacının terki; genel kurula giriş kartını veya bilgi alma hakkını taahhütname imzalanmasına bağlamak; genel kurula temsilciyle katılmayı yasaklamak; bağımsız ve kurumsal temsilcilere teminat zorunluluğu getirmek.<\/li>\n<li>(d) <b>Diğer organların devredilemez yetkilerine<\/b> giren veya bunların devrine ilişkin kararlar (m.375, 397, 398, 408 düzeninin korunması; bütün hâlinde veya tek tek devirde uygulanır).<\/li>\n<\/ol>\n<ul>\n<li>Bunların dışında TBK m.27 anlamında emredici hükümlere, ahlaka, kamu düzenine, kişilik haklarına aykırı veya konusu imkânsız kararlar da batıldır.<\/li>\n<li>Dikkat: \"Dürüstlük kuralına aykırılık\" m.391'de sayılan bir butlan sebebi değildir; dürüstlük kuralına aykırılık iptal sebebidir.<\/li>\n<\/ul>\n<h4>İptal davası<\/h4>\n<ul>\n<li>Türk hukukunda yönetim kurulu kararlarının iptaline ilişkin ilk düzenleme 2499 sayılı eski SerPK m.12/6'dır; 3794 sayılı Kanunla <b>1992<\/b>'de, kayıtlı sermaye sisteminden doğan yetkilerle sınırlı olarak getirilmiştir.<\/li>\n<li><b>Halka açık ortaklık<\/b> (SerPK m.18/6): kayıtlı sermaye sistemi çerçevesindeki yönetim kurulu kararlarına karşı <b>yönetim kurulu üyeleri<\/b> veya hakları ihlal edilen <b>pay sahipleri<\/b>, kararın <b>ilanından itibaren 30 gün<\/b> içinde ortaklık merkezinin bulunduğu yer ticaret mahkemesinde dava açabilir.<\/li>\n<li><b>Halka açık olmayan şirket<\/b> (TTK m.460/5): kayıtlı sermaye kararlarına karşı pay sahipleri ve yönetim kurulu üyeleri, m.445'teki sebeplerle (kanun, esas sözleşme, dürüstlük kuralı) kararın <b>ilanından itibaren bir ay<\/b> içinde dava açabilir; m.448–451 kıyasen uygulanır.<\/li>\n<li>Süre <b>hak düşürücüdür<\/b>. Görevli mahkeme <b>asliye ticaret<\/b>, yetkili mahkeme <b>şirket merkezinin bulunduğu yer<\/b> mahkemesidir.<\/li>\n<li>Dikkat: Genel kurul kararlarının iptalindeki \"kararın alınmasından itibaren üç ay\" süresi burada uygulanmaz; süre <b>ilandan itibaren 30 gün / bir ay<\/b>dır.<\/li>\n<li><b>Yapısal değişiklik kararları<\/b> (m.192/2): birleşme, bölünme veya tür değiştirme kararı yönetim organınca verilmişse (ör. kolaylaştırılmış birleşme, m.155–156) de iptal davası açılabilir. Burada pay sahibinin olumsuz oy verip muhalefetini tutanağa geçirtme şartı uygulanamaz.<\/li>\n<li><b>Kâr payı avansı<\/b> (SerPK m.20/2): ara dönem finansal tabloların gerçeği yansıtmaması veya mevzuata aykırılığı nedeniyle doğru olmayan avans dağıtımında, pay sahipleri ve yönetim kurulu üyeleri ilgili kararlara karşı ilandan itibaren 30 gün içinde iptal davası açabilir. Yönetim kurulu üyeleri ve (raporlarıyla sınırlı) bağımsız denetçiler; ortaklığa, pay sahiplerine, alacaklılara ve avans dönemi içinde pay edinenlere karşı sorumludur.<\/li>\n<\/ul>\n\n<h3>Yönetim kurulu üyelerinin hakları<\/h3>\n<h4>Kişisel haklar<\/h4>\n<ul>\n<li>Toplantıya katılma, olağanüstü toplantı isteme, görüş açıklama, öneri, oy kullanma; kişisel sorumluluğunu doğuracak genel kurul kararlarına karşı <b>iptal davası açma<\/b> (m.446/1-d); <b>bilgi alma ve inceleme hakkı<\/b> (m.392).<\/li>\n<\/ul>\n<table>\n<tr><th>Bilgi alma ve inceleme (m.392)<\/th><th>Kural<\/th><\/tr>\n<tr><td>Toplantıda<\/td><td>Defter, kayıt, sözleşme, yazışma veya belgenin getirtilmesi, incelenmesi, yönetici veya çalışandan bilgi alınması istemi <b>reddedilemez<\/b>; yönetimle görevliler ve komiteler bilgi vermekle yükümlüdür<\/td><\/tr>\n<tr><td>Toplantı dışında<\/td><td>Üye, <b>başkanın izniyle<\/b> yönetimle görevlilerden bilgi alabilir, gerekiyorsa defter ve dosyaların incelemeye sunulmasını isteyebilir. Başkan ise izni <b>kuruldan<\/b> alır<\/td><\/tr>\n<tr><td>Ret hâlinde<\/td><td>Konu <b>iki gün<\/b> içinde yönetim kuruluna getirilir; kurul toplanmaz veya reddederse üye şirket merkezindeki <b>asliye ticaret mahkemesine<\/b> başvurur. Mahkeme dosya üzerinden karar verebilir, <b>karar kesindir<\/b>. Başkanın istemi kurulca reddedilirse başkan doğrudan mahkemeye gider<\/td><\/tr>\n<tr><td>Sınırlama<\/td><td>Bu haklar kısıtlanamaz, kaldırılamaz; esas sözleşme ve yönetim kurulu <b>genişletebilir, daraltamaz<\/b><\/td><\/tr>\n<\/table>\n<h4>Mali haklar (m.394)<\/h4>\n<ul>\n<li>Sınırlı sayıdadır: <b>huzur hakkı<\/b> (her toplantı için), <b>ücret<\/b>, başarıya bağlı <b>ikramiye ve prim<\/b>, yıllık kârdan <b>kâr payı<\/b>. Birkaçı birlikte verilebilir.<\/li>\n<li>Esas sözleşmeyle veya genel kurul kararıyla belirlenmelidir; bu belirleme genel kurulun <b>devredilemez yetkisidir<\/b> (m.408/2-b). Yönetim kurulunun kendi mali hakları hakkında aldığı karar <b>batıldır<\/b> (m.391/1-d).<\/li>\n<li>Dikkat: <b>Kâr payı<\/b> için genel kurul kararı tek başına yetmez; ayrıca <b>esas sözleşme hükmü<\/b> gerekir (m.339/2-f; SerPK m.19/5).<\/li>\n<li>Yolluk, temsil ödeneği, sigorta primleri, özel emeklilik, avans gibi ödemeler m.394 kapsamı dışındadır; esas sözleşme veya genel kurul kararı olmadan verilebilir.<\/li>\n<li>Üye ve üst düzey yöneticilere sağlanan mali menfaatler <b>yıllık faaliyet raporunda<\/b> gösterilir (m.516/2-c). Denetime tabi şirketler <b>internet sitesi<\/b> açıp faaliyet raporunu yayımlamak zorundadır (m.1524); aykırılık ilgili kararın iptaline ve kusurlu yöneticilerin sorumluluğuna yol açar.<\/li>\n<li>İflas hâlinde üyeler, <b>son üç yıl<\/b> içinde aldıkları ve uygun ücreti aşan kazanç payı dahil ücret unsurlarını alacaklılara iade eder (m.513).<\/li>\n<li>Kanun mali hakların miktarına sınır veya performans ölçütü koymaz; yaptırım ödemenin yüksekliğine değil <b>kamuya açıklanmamasına<\/b> bağlanmıştır.<\/li>\n<\/ul>\n\n<h3>Yönetim kurulu üyelerinin yükümlülükleri<\/h3>\n<table>\n<tr><th>Yükümlülük<\/th><th>Dayanak<\/th><th>Öz<\/th><\/tr>\n<tr><td><b>Sadakat (bağlılık)<\/b><\/td><td>m.369/1<\/td><td>Şirket menfaatini dürüstlük kuralına uyarak gözetmek; kişisel, hâkim pay sahibi veya yakınlarının menfaatini öne almamak. <b>Sır saklama<\/b> görev bittikten sonra da sürer. Şirketler topluluğunda m.203–205 saklıdır (m.369/2)<\/td><\/tr>\n<tr><td><b>Özen<\/b><\/td><td>m.369/1<\/td><td>\"<b>Tedbirli bir yöneticinin özeni<\/b>\": kişisel değil <b>nesnel<\/b> ölçü; yetkinlik, bilgiyi değerlendirme, gelişmeleri izleme yeteneği. Uzman bilgisi aranmaz. Yönetim/temsil yetkisi devredilen üçüncü kişilere de uygulanır<\/td><\/tr>\n<tr><td><b>Şirketle işlem yapmama<\/b><\/td><td>m.395/1<\/td><td>Genel kurul izni olmadan şirketle kendisi veya başkası adına işlem yapamaz; yapılırsa şirket işlemin <b>batıl<\/b> olduğunu ileri sürebilir<\/td><\/tr>\n<tr><td><b>Şirkete borçlanmama<\/b><\/td><td>m.395/2<\/td><td>Pay sahibi olmayan üyeler ile üyelerin pay sahibi olmayan alt-üst soyu, eşi, <b>üçüncü derece dahil<\/b> kan ve kayın hısımları şirkete <b>nakit<\/b> borçlanamaz; şirket bunlar için kefalet, garanti, teminat veremez, borçlarını üstlenemez<\/td><\/tr>\n<tr><td><b>Rekabet etmeme<\/b><\/td><td>m.396<\/td><td>Genel kurul izni olmadan işletme konusuna giren ticari iş türünden işlemi kendi veya başkası hesabına yapamaz; aynı tür işle uğraşan şirkete <b>sorumluluğu sınırsız ortak<\/b> olarak giremez<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Borçlanma yasağının yaptırımı<\/b>: şirket alacaklıları bu kişileri, şirkete borçlandıkları tutarda şirket borçları için <b>doğrudan takip<\/b> edebilir; ayrıca <b>300 günden az olmamak üzere adli para cezası<\/b> (m.562/5-c). İstisna: m.202 saklı kalmak şartıyla <b>şirketler topluluğuna dahil şirketler<\/b> birbirine kefil olabilir ve garanti verebilir (m.395/3).<\/li>\n<li><b>Rekabet yasağına aykırılıkta<\/b> şirket seçimlik haklara sahiptir: <b>tazminat<\/b> isteme, işlemi <b>şirket adına yapılmış sayma<\/b>, üçüncü kişiler hesabına yapılan sözleşmelerden doğan menfaatlerin şirkete ait olduğunu dava etme. Seçimi, ihlal eden üyenin katılmadığı yönetim kurulu yapar.<\/li>\n<li>Rekabet yasağından doğan haklar, diğer üyelerin öğrenmesinden itibaren <b>3 ay<\/b>, her hâlde işlemin gerçekleşmesinden itibaren <b>1 yıl<\/b> geçince zamanaşımına uğrar. Sorumluluk hükümleri saklıdır.<\/li>\n<\/ul>\n<h4>İşadamı kararı ilkesi (business judgement rule)<\/h4>\n<ul>\n<li>m.369 gerekçesinde kabul edilir: araştırma yapılıp bilgi alınarak verilen ticari karar sonradan zarar doğursa bile özensizlik sayılmaz. Amaç, ticari takdirin mahkemece korunmasıdır; değerlendirme kararın <b>oluşum sürecine<\/b> yönelik <b>şekli<\/b> bir denetimdir.<\/li>\n<li>Dört soru (unsur): (1) ticari takdire dayanan bilinçli bir karar var mı (<b>ihmali davranışlar kapsam dışı<\/b>); (2) şirket menfaati dışında menfaat gözetilmeden, tarafsız ve bağımsız alındı mı; (3) <b>yeterli bilgiye<\/b> dayanıyor mu; (4) şirket menfaatine olduğuna dair <b>makul inanca<\/b> dayanıyor mu.<\/li>\n<li>Hepsine olumlu cevap, özen yükümlülüğünün ihlal edilmediğine dair <b>aksi ispatlanabilir bir karinedir<\/b>. Biri olumsuzsa maddi denetime geçilir.<\/li>\n<li>Koruma dışında kalanlar: <b>hileli işlemler<\/b>, şirket kaynaklarının karşılıksız <b>kötüye kullanılması<\/b>, <b>emredici hükümlere aykırı<\/b> kararlar (şirket menfaatine olsa bile).<\/li>\n<li>m.553/3: hiç kimse <b>kontrolü dışında kalan<\/b> aykırılık ve yolsuzluklardan sorumlu tutulamaz; bu, gözetim ve özen yükümü gerekçe gösterilerek geçersiz kılınamaz.<\/li>\n<\/ul>\n\n<h3>Hukuki sorumluluk (m.549–561)<\/h3>\n<ul>\n<li>m.553/1: kurucular, <b>yönetim kurulu üyeleri<\/b>, <b>yöneticiler<\/b> ve tasfiye memurları, kanun ve esas sözleşmeden doğan yükümlülüklerini <b>kusurlarıyla<\/b> ihlal ederlerse <b>şirkete, pay sahiplerine ve şirket alacaklılarına<\/b> karşı verdikleri zarardan sorumludur.<\/li>\n<li><b>Kusur sorumluluğudur<\/b>; kusuru davacı ispat eder. Yaptırım <b>tazminattır<\/b>; TTK'da yöneticiler için \"iflas\" yaptırımı yoktur.<\/li>\n<li>Özel düzenlemeler: TTK'nın çeşitli maddeleri, SerPK ve 6183 sayılı AATUHK.<\/li>\n<\/ul>\n<h4>Davacılar<\/h4>\n<table>\n<tr><th>Davacı<\/th><th>Şirket zararı (dolaylı zarar) için<\/th><\/tr>\n<tr><td>Şirket<\/td><td>Dava açabilir<\/td><\/tr>\n<tr><td>Pay sahibi<\/td><td>Her pay sahibi açabilir; tazminatın yalnız <b>şirkete<\/b> ödenmesini isteyebilir. Dava haklıysa giderler davalıya yükletilemediğinde hâkim bunları davacı ile şirket arasında hakkaniyete göre paylaştırır<\/td><\/tr>\n<tr><td>Alacaklı<\/td><td>Ancak şirket <b>iflas etmişse<\/b>. İstemler önce <b>iflas idaresince<\/b> ileri sürülür; idare açmazsa her pay sahibi veya alacaklı açabilir. Hasıla önce davacı alacaklılara, kalan sermaye payları oranında davacı pay sahiplerine, artan iflas masasına (m.556)<\/td><\/tr>\n<\/table>\n<p>Pay sahiplerinin ve alacaklıların <b>doğrudan zararları<\/b> için kendi adlarına açacakları dava hakkı saklıdır; tazminat doğrudan onlara ödenir (ör. pay sahibinin haksız ıskatı; şirketin zayıf mali durumunu gizleyerek alacaklıyı işleme yöneltmek).<\/p>\n<h4>Farklılaştırılmış teselsül (m.557)<\/h4>\n<ul>\n<li>Mülga TTK'daki <b>mutlak teselsül<\/b> yerine kabul edildi. Birden çok kişi aynı zarardan sorumluysa her biri, <b>kusuruna ve durumun gereklerine göre, zarar şahsen kendisine yükletilebildiği ölçüde<\/b> diğerleriyle birlikte müteselsilen sorumludur.<\/li>\n<li>Davacı hepsini zararın tamamı için birlikte dava edip hâkimden her birinin tazminat borcunu belirlemesini isteyebilir; her sorumluya ancak <b>kendi sorumluluk tavanına kadar<\/b> başvurulabilir. m.557 iç ilişkiyi değil, <b>dış ilişkideki sorumluluk miktarını<\/b> belirler.<\/li>\n<\/ul>\n<h4>Mahkeme, zamanaşımı, ibra<\/h4>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>Mahkeme<\/td><td>Şirket merkezinin bulunduğu yer <b>asliye ticaret<\/b> mahkemesi; davacı isterse davalının yerleşim yeri mahkemesinde de açabilir<\/td><td>m.561; HMK m.6<\/td><\/tr>\n<tr><td>Zamanaşımı<\/td><td>Zararı ve sorumluyu öğrenmeden itibaren <b>2 yıl<\/b>, her hâlde fiilden itibaren <b>5 yıl<\/b>; fiil daha uzun ceza zamanaşımına tabi suçsa o süre<\/td><td>m.560<\/td><\/tr>\n<tr><td>İbra yetkisi<\/td><td>Genel kurulun devredilemez yetkisi; ibra oylamasında <b>oyda imtiyaz kullanılamaz<\/b><\/td><td>m.408/2-b, 479/3-c<\/td><\/tr>\n<tr><td>İbrada oy yasağı<\/td><td>Yönetim kurulu üyeleri ve imza yetkili yöneticiler kendi paylarından doğan oyu kullanamaz; üye olmayan pay sahiplerini temsilen kullanabilir<\/td><td>m.436/2; Yönetmelik m.19/4<\/td><\/tr>\n<tr><td>Bilançonun onayı<\/td><td>Kararda aksine açıklık yoksa üyelerin ve yöneticilerin <b>ibrası<\/b> sonucunu doğurur; bilinçli olarak gerçeği gizleyen bilançoda doğurmaz<\/td><td>m.424<\/td><\/tr>\n<tr><td>İbra kararının kaldırılması<\/td><td>Genel kurul kararıyla <b>kaldırılamaz<\/b>; şartları varsa m.445 ile iptal edilebilir, batıl veya yok sayılabilir<\/td><td>-<\/td><\/tr>\n<tr><td>İbranın etkisi<\/td><td>Açıklanan olaylar için şirketin, olumlu oy verenlerin ve ibrayı bilerek pay edinenlerin dava hakkı düşer; diğer pay sahiplerininki ibradan itibaren <b>6 ay<\/b> sonra düşer; <b>alacaklılar etkilenmez<\/b><\/td><td>-<\/td><\/tr>\n<tr><td>Kuruluş ve sermaye artırımı sorumluluğu<\/td><td>Tescilden itibaren <b>4 yıl<\/b> geçmedikçe sulh ve ibra yoluyla kaldırılamaz; sonra genel kurul onayı gerekir; sermayenin <b>onda biri<\/b> (halka açıkta <b>yirmide biri<\/b>) karşı çıkarsa onaylanmaz<\/td><td>m.559<\/td><\/tr>\n<\/table>\n<p>İbra, ilgili dönemdeki işlemlerin hukuka ve esas sözleşmeye uygunluğunun genel kurulca kabulüdür; hukuken <b>menfi borç ikrarı<\/b> niteliğindedir.<\/p>\n\n<h3>Özel sorumluluk halleri ve cezai yaptırımlar<\/h3>\n<table>\n<tr><th>Hâl<\/th><th>Hukuki sorumluluk<\/th><th>Cezai yaptırım<\/th><\/tr>\n<tr><td>Belge ve beyanların kanuna aykırılığı (m.549): kuruluş, sermaye artırım/azaltımı, birleşme, bölünme, tür değiştirme, menkul kıymet çıkarma belgeleri ve izahnameler<\/td><td><b>Düzenleyenler kusursuz<\/b>, <b>katılanlar kusurlu<\/b> sorumlu; davacı zarar görenler<\/td><td>Sahte belge ve deftere kasten gerçeğe aykırı kayıt: <b>1–3 yıl hapis<\/b> (m.562/8)<\/td><\/tr>\n<tr><td>Sermaye hakkında yanlış beyan, ödeme yetersizliğini bilme (m.550)<\/td><td>Gösterenler ve kusurlu yetkililer payları üstlenmiş sayılır, karşılık ve zararı faiziyle <b>müteselsilen<\/b> öder<\/td><td><b>3 ay–2 yıl hapis<\/b> veya adli para cezası (m.562/9)<\/td><\/tr>\n<tr><td>Değer biçmede yolsuzluk (m.551)<\/td><td>Ayni sermaye veya devralınan işletme/ayınlarda yüksek değer biçenler sorumlu; davacı şirket, pay sahipleri, alacaklılar<\/td><td><b>90 günden az olmamak üzere<\/b> adli para cezası (m.562/10)<\/td><\/tr>\n<tr><td>Halktan para toplama (m.552)<\/td><td>SPKn saklı; şirket kurmak veya sermaye artırmak amacıyla halka çağrıyla para toplamak yasak<\/td><td><b>6 ay–2 yıl hapis<\/b> (m.562/11)<\/td><\/tr>\n<tr><td>İnternet sitesi (m.1524)<\/td><td>-<\/td><td>Siteyi kurmayan yönetim organı üyelerine <b>100–300 gün<\/b>; içeriği usulüne uygun koymayanlara <b>100 güne kadar<\/b> adli para cezası (m.562/12)<\/td><\/tr>\n<tr><td>Şirkete borçlanma yasağı (m.395/2)<\/td><td>Alacaklıların doğrudan takibi<\/td><td><b>300 günden az olmamak üzere<\/b> adli para cezası (m.562/5-c)<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Birleşme, bölünme, tür değiştirme<\/b> (m.193): işlemlere herhangi bir şekilde katılan herkes şirketlere, ortaklara ve alacaklılara karşı kusurlarıyla verdikleri zarardan sorumludur. Alacaklılar için <b>iflas şartı aranmaz<\/b>.<\/li>\n<li><b>Şirketler topluluğunda hâkimiyetin kötüye kullanılması<\/b> (m.202): hâkim şirket bağlı şirketi kayba uğratacak işlemlere yöneltemez. Kayıp aynı faaliyet yılı içinde fiilen veya denk değerde bir istem hakkıyla <b>denkleştirilirse<\/b> aykırılık yoktur. Denkleştirilmezse bağlı şirketin her pay sahibi hâkim şirketten ve kayba sebep olan yönetim kurulu üyelerinden şirketin zararının tazminini isteyebilir; <b>alacaklılar şirket iflas etmemiş olsa bile<\/b> zararın şirkete ödenmesini isteyebilir. Bağımsız bir şirketin tedbirli yöneticisinin de aynı işlemi yapacağı ispatlanırsa tazminata hükmedilmez. Hâkim teşebbüsün merkezi yurt dışındaysa dava bağlı şirket merkezindeki asliye ticaret mahkemesinde açılır. m.206: talimatlardan doğan kayıp için alacaklıların davası.<\/li>\n<li><b>Kamuyu aydınlatma belgeleri<\/b> (SerPK m.32): izahname, pay alım teklifi bilgi formu, özel durum açıklaması, birleşme/bölünme duyuru metinleri, borsada işlem görme duyurusu, finansal raporlar gibi belgeleri <b>imzalayanlar<\/b> veya adına imzalanan tüzel kişiler, yanlış, yanıltıcı veya eksik bilgiden doğan zarardan <b>müteselsilen<\/b> sorumludur. Bilmediğini ve bunun kast veya ağır ihmalinden kaynaklanmadığını ispatlayan sorumlu olmaz. İlliyet karinesi vardır. Tazminat talebi <b>zararın doğduğu tarihten itibaren 6 ay<\/b> içinde zamanaşımına uğrar; sorumluluğu hafifleten veya kaldıran anlaşmalar geçersizdir.<\/li>\n<li>Talep şu hallerde reddedilir: alım-satım belgeye dayanmıyorsa; yanlışlık bilinerek işlem yapıldıysa; düzeltme yatırım kararından önce ilan edildiyse; bilgi doğru olsaydı da zarar doğacak idiyse.<\/li>\n<li><b>İzahname<\/b> (SerPK m.10): <b>birinci derecede ihraççı<\/b> sorumludur. Zarar ihraççıdan tazmin edilemezse veya edilemeyeceği açıksa halka arz edenler, lider aracı kurum, varsa garantör ve <b>ihraççının yönetim kurulu üyeleri<\/b> kusur ve durumun gereklerine göre (farklılaştırılmış teselsül) sorumlu olur.<\/li>\n<li><b>Kamu borçları<\/b> (6183 sayılı AATUHK mükerrer m.35): tüzel kişiden tahsil edilemeyen amme alacakları <b>kanuni temsilcilerin<\/b> şahsi malvarlığından tahsil edilir. Tasfiye, tasfiye öncesi döneme ait sorumluluğu kaldırmaz; ödeyenler asıl borçluya rücu edebilir.<\/li>\n<\/ul>\n", "sorular": [{"q": "Yönetim kurulu kararlarının yokluk ve butlan yaptırımlarına ilişkin hangisi yanlıştır?", "o": ["Süreye bağlı olmaksızın ileri sürülebilir", "Ancak kararın ilanından itibaren otuz gün içinde ileri sürülebilir", "Hâkim tarafından resen dikkate alınır", "Sonradan geçerlilik kazanması mümkün değildir", "Bu nitelikteki kararlar sicile tescil edilemez"], "a": 1, "e": "Otuz günlük hak düşürücü süre iptal davasına özgüdür; yokluk ve butlan süresiz ileri sürülebilir."}, {"q": "Aşağıdakilerden hangisi TTK m.391'de yönetim kurulu kararlarının butlan sebepleri arasında sayılmamıştır?", "o": ["Eşit işlem ilkesine aykırılık", "Sermayenin korunması ilkesini gözetmeme", "Pay sahiplerinin vazgeçilmez haklarını ihlal", "Diğer organların devredilemez yetkilerine girme", "Dürüstlük kuralına aykırılık"], "a": 4, "e": "Dürüstlük kuralına aykırılık m.391'de sayılmaz; kanun, esas sözleşme ve dürüstlük kuralına aykırılık iptal sebepleridir."}, {"q": "Toplantı ve karar nisabına uyulmadan alınmış veya üye sıfatı olmayan kişilerce alınmış bir yönetim kurulu kararı için öğretide kabul edilen yaptırım hangisidir?", "o": ["İptal edilebilirlik", "Askıda geçersizlik", "Yokluk", "Kısmi butlan", "Geçerli ama tazminat doğurur"], "a": 2, "e": "Kararın kurucu unsurlarına aykırılık (nisap, usulsüz çağrı, üye olmayanların karar alması, şekil eksikliği) yokluk yaptırımına bağlanır."}, {"q": "Halka açık bir ortaklıkta kayıtlı sermaye sistemi çerçevesinde alınan yönetim kurulu kararına karşı iptal davası hangi sürede açılır?", "o": ["Kararın ilanından itibaren 30 gün", "Kararın alınmasından itibaren 3 ay", "Kararın öğrenilmesinden itibaren 6 ay", "Kararın tescilinden itibaren 1 yıl", "Süresiz"], "a": 0, "e": "SerPK m.18/6: kararın ilanından itibaren otuz gün; süre hak düşürücüdür. Genel kurul kararları için öngörülen üç aylık süre uygulanmaz."}, {"q": "Yönetim kurulu kararlarına karşı iptal davasının Türk hukukuna ilk kez girişine ilişkin hangisi doğrudur?", "o": ["6102 sayılı TTK ile 2012'de", "6762 sayılı TTK ile 1957'de", "6362 sayılı SerPK ile 2012'de tüm kararlar için", "3794 sayılı Kanunla eski SerPK'da kayıtlı sermaye yetkileriyle sınırlı olarak 1992'de", "7511 sayılı Kanunla 2024'te"], "a": 3, "e": "İlk düzenleme 2499 sayılı eski SerPK m.12/6'dır; 3794 sayılı Kanunla 1992'de, kayıtlı sermayeden doğan yetkilerle sınırlı olarak getirilmiştir."}, {"q": "Yönetim kurulu üyesinin toplantı dışında bilgi alma istemi reddedilirse izlenecek yol hangisidir?", "o": ["Üye doğrudan Ticaret Bakanlığına başvurur", "Konu iki gün içinde yönetim kuruluna getirilir; kurul toplanmaz veya reddederse üye asliye ticaret mahkemesine başvurur", "Üye genel kurulu olağanüstü toplantıya çağırır", "Üye 30 gün içinde iptal davası açar", "Üye SPK'ya şikâyette bulunur"], "a": 1, "e": "m.392 uyarınca konu iki gün içinde kurula getirilir; sonra şirket merkezindeki asliye ticaret mahkemesine başvurulur, mahkeme kararı kesindir."}, {"q": "Yönetim kurulu üyesinin bilgi alma ve inceleme hakkına ilişkin hangisi yanlıştır?", "o": ["Toplantıda belge getirilmesi istemi reddedilemez", "Toplantı dışında başkanın izni gerekir", "Başkan toplantı dışında bilgi almak için izni kuruldan alır", "Mahkemenin bu konudaki kararı kesindir", "Esas sözleşme bu hakkı daraltabilir"], "a": 4, "e": "Esas sözleşme ve yönetim kurulu bu hakkı genişletebilir ama daraltamaz; hak kısıtlanamaz, kaldırılamaz."}, {"q": "Aşağıdakilerden hangisi TTK m.394'te sayılan, esas sözleşme veya genel kurul kararıyla belirlenmesi gereken mali haklardan biri değildir?", "o": ["Huzur hakkı", "Ücret", "Yolluk", "İkramiye", "Kâr payı"], "a": 2, "e": "Yolluk, temsil ödeneği, sigorta primi, özel emeklilik ve avanslar m.394 kapsamı dışındadır."}, {"q": "Yönetim kurulu üyelerine kâr payı ödenebilmesi için hangisi gereklidir?", "o": ["Genel kurul kararı ile birlikte esas sözleşme hükmü", "Yalnız yönetim kurulu kararı", "Yalnız genel kurul kararı", "Ticaret Bakanlığı izni", "SPK onayı"], "a": 0, "e": "m.394 alternatifli ifade kullansa da kâr payı için esas sözleşme hükmü de gerekir (m.339/2-f; SerPK m.19/5)."}, {"q": "Anonim şirketin iflası hâlinde yönetim kurulu üyeleri, uygun ücreti aşan ücret unsurlarını hangi döneme ilişkin olarak iade etmekle yükümlüdür?", "o": ["Son 1 yıl", "Son 2 yıl", "Son 5 yıl", "Son 3 yıl", "Son 10 yıl"], "a": 3, "e": "m.513: son üç yıl içinde alınan, kazanç payı dahil ve uygun ücreti aşan tutarlar."}, {"q": "Yönetim kurulu üyesinin rekabet yasağına aykırılığı hâlinde şirketin haklarının zamanaşımı hangisidir?", "o": ["Öğrenmeden itibaren 1 ay, her hâlde 6 ay", "Öğrenmeden itibaren 3 ay, her hâlde 1 yıl", "Öğrenmeden itibaren 6 ay, her hâlde 2 yıl", "Öğrenmeden itibaren 2 yıl, her hâlde 5 yıl", "Öğrenmeden itibaren 1 yıl, her hâlde 3 yıl"], "a": 1, "e": "m.396: diğer üyelerin öğrenmesinden itibaren üç ay, her hâlde gerçekleşmeden itibaren bir yıl. İki ve beş yıl genel sorumluluk zamanaşımıdır."}, {"q": "Şirkete borçlanma yasağına (m.395/2) ilişkin hangisi yanlıştır?", "o": ["Pay sahibi olmayan yönetim kurulu üyelerini kapsar", "Üyenin pay sahibi olmayan eşini de kapsar", "Şirket bu kişiler için kefalet veremez", "Şirketler topluluğuna dahil şirketler, m.202 saklı kalmak şartıyla birbirine kefil olabilir", "Yasağın tek yaptırımı işlemin batıl sayılmasıdır"], "a": 4, "e": "Yaptırım, alacaklıların bu kişileri şirket borçları için doğrudan takip edebilmesi ve 300 günden az olmamak üzere adli para cezasıdır."}, {"q": "Yönetim kurulu üyesinin genel kurul izni olmadan şirketle işlem yapması hâlinde sonuç nedir?", "o": ["İşlem kendiliğinden geçerlidir", "İşlem ancak SPK onayıyla geçerli olur", "Şirket işlemin batıl olduğunu ileri sürebilir", "Üye görevden kendiliğinden düşer", "Üyeye hapis cezası verilir"], "a": 2, "e": "m.395/1: genel kurul izni olmadan yapılan işlemde şirket işlemin batıl olduğunu ileri sürebilir."}, {"q": "İşadamı kararı ilkesine ilişkin hangisi yanlıştır?", "o": ["İhmali davranışlar da ilkenin koruması altındadır", "Ticari takdire dayanan bilinçli bir karar bulunmalıdır", "Kararın yeterli bilgiye dayanması gerekir", "Hileli işlemler korumadan yararlanamaz", "Unsurların varlığı aksi ispatlanabilir bir karine oluşturur"], "a": 0, "e": "İlke bilinçli olarak alınmış kararları korur; ihmali davranışlar kapsam dışıdır ve doğrudan özen yükümü açısından değerlendirilir."}, {"q": "TTK m.553/1'e göre yönetim kurulu üyelerinin hukuki sorumluluğunun niteliği hangisidir?", "o": ["Kusursuz sorumluluk", "Tehlike sorumluluğu", "Kusur karinesine dayalı sorumluluk; davalı kusursuzluğunu ispat eder", "Kusur sorumluluğu; kusuru davacı ispat eder", "Hakkaniyet sorumluluğu"], "a": 3, "e": "Yönetim kurulu üyelerinin sorumluluğu kusur sorumluluğudur ve davacı kusuru ispat etmelidir."}, {"q": "Şirket alacaklılarının, şirketin uğradığı zarar nedeniyle yönetim kurulu üyelerine karşı sorumluluk davası açabilmesi için hangi koşul aranır?", "o": ["Alacağın vadesinin gelmiş olması", "Şirketin iflas etmiş olması", "Genel kurulun izin vermesi", "Alacağın sermayenin onda birini aşması", "Şirketin tasfiyeye girmiş olması"], "a": 1, "e": "Alacaklılar şirketin dolaylı zararı için ancak şirket iflas etmişse dava açabilir; m.193 ve m.202 davalarında bu şart aranmaz."}, {"q": "Yönetim kurulu üyelerine karşı tazminat istemi hangi sürede zamanaşımına uğrar?", "o": ["Öğrenmeden itibaren 6 ay, her hâlde 1 yıl", "Öğrenmeden itibaren 1 yıl, her hâlde 3 yıl", "Öğrenmeden itibaren 3 yıl, her hâlde 10 yıl", "Fiilden itibaren 4 yıl", "Öğrenmeden itibaren 2 yıl, her hâlde 5 yıl"], "a": 4, "e": "m.560: zararı ve sorumluyu öğrenmeden itibaren iki yıl, her hâlde fiilden itibaren beş yıl; daha uzun ceza zamanaşımı varsa o uygulanır."}, {"q": "İbraya ilişkin hangisi yanlıştır?", "o": ["Yönetim kurulu üyelerinin ibrası genel kurulun devredilemez yetkisidir", "İbra oylamasında oyda imtiyaz kullanılamaz", "Geçerli bir ibra kararı sonraki bir genel kurul kararıyla kaldırılabilir", "Bilançonun onaylanması, kararda aksine açıklık yoksa ibra sonucunu doğurur", "İbra kararı alacaklıların dava hakkını etkilemez"], "a": 2, "e": "Geçerli ibra kararı genel hükümlerin aksine genel kurul kararıyla kaldırılamaz; ancak şartları varsa iptal edilebilir veya batıl ya da yok sayılabilir."}, {"q": "İbraya olumlu oy vermemiş ve ibrayı bilerek pay edinmemiş pay sahiplerinin dava hakkı ne zaman düşer?", "o": ["İbra tarihinden itibaren 6 ay", "İbra tarihinden itibaren 1 ay", "İbra tarihinden itibaren 3 ay", "İbra tarihinden itibaren 2 yıl", "Hiçbir zaman düşmez"], "a": 0, "e": "Diğer pay sahiplerinin dava hakkı ibra tarihinden itibaren altı ay geçmekle düşer."}, {"q": "Kuruluştan doğan sorumlulukların sulh ve ibra yoluyla kaldırılmasına ilişkin olarak halka açık bir şirkette sermayenin en az ne kadarını temsil eden pay sahiplerinin karşı çıkması genel kurul onayını engeller?", "o": ["Onda bir", "Dörtte bir", "Üçte bir", "Yirmide bir", "Yüzde iki"], "a": 3, "e": "m.559: tescilden itibaren dört yıl geçmeden sulh ve ibra yapılamaz; sonra genel kurul onayı gerekir ve sermayenin onda biri, halka açıkta yirmide biri karşı çıkarsa onaylanmaz."}, {"q": "Esas sermayesi 50 milyon lira olan halka açık olmayan bir anonim şirkette, kuruluştan doğan sorumluluğa ilişkin sulh ve ibranın genel kurulca onaylanmasını engellemek için en az ne kadar sermayeyi temsil eden pay sahiplerinin karşı çıkması gerekir?", "o": ["2,5 milyon lira", "5 milyon lira", "10 milyon lira", "12,5 milyon lira", "25 milyon lira"], "a": 1, "e": "Halka açık olmayan şirkette eşik onda birdir: 50 x 1/10 = 5 milyon lira. 2,5 milyon lira halka açık şirketlerdeki yirmide birlik eşiğe karşılık gelir."}, {"q": "Farklılaştırılmış teselsül (m.557) anlayışına ilişkin hangisi doğrudur?", "o": ["Her sorumlu, kusuru ne olursa olsun zararın tamamından sorumludur", "Sorumluluk yalnız iç ilişkide paylaştırılır", "Davacı sorumluları ayrı ayrı dava etmek zorundadır", "Teselsül tamamen kaldırılmıştır", "Her sorumlu, kusuruna ve durumun gereklerine göre zarar kendisine şahsen yükletilebildiği ölçüde müteselsilen sorumludur"], "a": 4, "e": "Mülga TTK'nın mutlak teselsülü yerine farklılaştırılmış teselsül kabul edilmiştir; m.557 dış ilişkideki sorumluluk miktarını belirler."}, {"q": "TTK m.549'a göre belge ve beyanların kanuna aykırılığından doğan sorumlulukta hangisi doğrudur?", "o": ["Düzenleyenler ve katılanlar kusur sorumluluğuna tabidir", "Düzenleyenler kusurlu, katılanlar kusursuz sorumludur", "Düzenleyenler kusursuz, katılanlar kusurlu sorumludur", "Yalnız yönetim kurulu başkanı sorumludur", "Sorumluluk yalnız izahname için söz konusudur"], "a": 2, "e": "m.549 düzenleyenler için kusursuz, katılanlar için kusurlu sorumluluk öngörür; kapsam halka arzla ilgili tüm belgeleri içerir."}, {"q": "SerPK m.32'ye göre kamuyu aydınlatma belgelerinden doğan tazminat talebinin zamanaşımı süresi hangisidir?", "o": ["Zararın doğduğu tarihten itibaren 6 ay", "Zararın doğduğu tarihten itibaren 3 ay", "Belgenin yayımından itibaren 1 yıl", "Öğrenmeden itibaren 2 yıl", "Fiilden itibaren 5 yıl"], "a": 0, "e": "Kamuyu aydınlatma belgelerinden doğan tazminat talebi zararın meydana geldiği tarihten itibaren altı ayda zamanaşımına uğrar; sorumluluğu kaldıran anlaşmalar geçersizdir."}, {"q": "İzahnamedeki yanlış bilgiden doğan zarardan birinci derecede kim sorumludur?", "o": ["Lider aracı kurum", "Garantör", "İhraççının yönetim kurulu üyeleri", "İhraççı", "Halka arz eden"], "a": 3, "e": "SerPK m.10: birinci derecede ihraççı sorumludur; tazmin edilemezse diğerleri kusur ve durumun gereklerine göre sorumlu olur."}]}, {"id": 8, "kisa": "Genel Kurul", "baslik": "Genel Kurul: Yetkiler, Toplantı Türleri, Çağrı, Katılım, Oy Hakkı, Nisaplar ve Kararların Sakatlığı", "ozet": "Genel kurulun devredilemez yetkileri, olağan-olağanüstü ve çağrısız toplantı, imtiyazlı pay sahipleri özel kurulu, çağrı süreleri, gündeme bağlılık, oy hakkı ve temsil, toplantı ve karar nisapları ile iptal ve butlan.", "notlar": "\n<h3>Genel kurulun konumu ve yetkileri<\/h3>\n<ul>\n<li>Genel kurul iç ilişkide görev yapan <b>karar mercii<\/b>dir; kararlarını yönetim kurulu icra eder. Genel kurul yönetim kurulunun <b>üstünde değildir<\/b> (işlev ayrılığı). Düzenleme: <b>TTK m.407–451<\/b>.<\/li>\n<li>Genel kurul, <b>kanunda ve esas sözleşmede açıkça öngörülen<\/b> hallerde karar alır (m.408/1); genel yetki yönetim kurulundadır (m.374).<\/li>\n<\/ul>\n<h4>Devredilemez görev ve yetkiler (m.408/2)<\/h4>\n<ol>\n<li>(a) <b>Esas sözleşmenin değiştirilmesi<\/b>.<\/li>\n<li>(b) Yönetim kurulu üyelerinin <b>seçimi, süreleri, ücretleri<\/b> ile huzur hakkı, ikramiye ve prim gibi haklarının belirlenmesi, <b>ibraları<\/b> ve <b>görevden alınmaları<\/b>.<\/li>\n<li>(c) Kanundaki istisnalar dışında <b>denetçinin seçimi ve görevden alınması<\/b>.<\/li>\n<li>(ç) <b>Finansal tablolar<\/b>, yönetim kurulunun yıllık raporu, yıllık kâr üzerinde tasarruf, kâr payı ve kazanç paylarının belirlenmesi, yedek akçenin sermayeye veya dağıtılacak kâra katılması dahil kullanılması.<\/li>\n<li>(d) Kanundaki istisnalar dışında <b>şirketin feshi<\/b>.<\/li>\n<li>(e) <b>Önemli miktarda şirket varlığının toptan satışı<\/b>.<\/li>\n<\/ol>\n<ul>\n<li>Bu konularda yönetim kurulunun aldığı kararlar <b>batıldır<\/b> (m.391/1-d).<\/li>\n<li><b>Tek pay sahipli şirkette<\/b> tek pay sahibi genel kurulun tüm yetkilerine sahiptir; genel kurul sıfatıyla aldığı kararların <b>yazılı<\/b> olması geçerlilik şartıdır (m.408/3). Çok ortaklı şirkette de m.422 sonucu yazılı şekil geçerlilik şartıdır.<\/li>\n<li>Liste genel kurulun tüm yetkileri değildir: esas sözleşme değişikliği (m.421), intifa senedi çıkarma (m.502), borçlanma aracı ihracı (m.504) gibi özel yetkiler de vardır.<\/li>\n<li>Dikkat: <b>Kayıtlı sermaye sisteminde sermaye artırımı<\/b> genel kurulun değil, yönetim kurulunun yetkisindedir.<\/li>\n<\/ul>\n\n<h3>Genel kurul toplantılarının türleri<\/h3>\n<table>\n<tr><th>Tür<\/th><th>Kural<\/th><\/tr>\n<tr><td><b>Olağan<\/b> (m.409/1)<\/td><td>Her faaliyet dönemi sonundan itibaren <b>üç ay içinde<\/b>. Asgari içerik: organların seçimi, finansal tablolar, yıllık rapor, kârın kullanımı, kâr ve kazanç payı oranları, yönetim kurulunun ibrası, gerekli diğer konular<\/td><\/tr>\n<tr><td><b>Olağanüstü<\/b> (m.409/2)<\/td><td>Gerektiğinde toplanır<\/td><\/tr>\n<tr><td><b>Çağrısız<\/b> (m.416)<\/td><td>Bütün payların sahipleri veya temsilcileri, aralarından biri itiraz etmezse çağrı usulüne uymadan toplanıp karar alabilir. <b>Yüzde yüz toplantı nisabının toplantı boyunca sürmesi<\/b> şarttır. Karar nisabında genel hükümler uygulanır; ancak muhalif pay sahibi toplantıyı terk ederse karar alınamaz. <b>Gündeme bağlılık ilkesi uygulanmaz<\/b>; gündeme oybirliğiyle madde eklenebilir<\/td><\/tr>\n<tr><td><b>İmtiyazlı pay sahipleri özel kurulu<\/b> (m.454)<\/td><td>Yalnız imtiyazlı pay sahiplerinin haklarını ihlal edebilecek kararların onanması için toplanır; başka konuda yetkisi yoktur<\/td><\/tr>\n<\/table>\n<h4>İmtiyazlı pay sahipleri özel kurulu (m.454)<\/h4>\n<ul>\n<li>Onanması gereken kararlar: genel kurulun <b>esas sözleşme değişikliği<\/b> kararı, <b>yönetim kuruluna sermaye artırımı yetkisi verme<\/b> kararı ve yönetim kurulunun sermaye artırımı kararı, imtiyazlı pay sahiplerinin haklarını ihlal edecek nitelikteyse. Onanmayan karar <b>uygulanamaz<\/b>.<\/li>\n<li>Çağrı: yönetim kurulu, genel kurul kararının ilanından itibaren en geç <b>bir ay<\/b> içinde çağırır. Çağırmazsa her imtiyazlı pay sahibi, çağrı süresinin son gününden itibaren <b>15 gün<\/b> içinde şirket merkezindeki asliye ticaret mahkemesinden çağrı isteyebilir.<\/li>\n<li>Nisap: imtiyazlı payları temsil eden sermayenin <b>yüzde altmışı<\/b> ile toplanır, toplantıda temsil edilen payların <b>çoğunluğu<\/b> ile karar alır.<\/li>\n<li>Hak ihlali sonucuna varılırsa gerekçeli tutanak <b>10 gün<\/b> içinde yönetim kuruluna teslim edilir; olumsuz oy verenlerin en az nisabı oluşturan imzalarını içeren liste ve ortak tebligat adresi de verilir; tutanak tescil ve TTSG'de ilan edilir. Şartlara uyulmazsa özel kurul kararı alınmamış sayılır.<\/li>\n<li>İmtiyazlı pay sahipleri genel kurulda bu nisaplara uygun olumlu oy vermişse ayrıca özel kurul yapılmaz. Özel kurulda <b>Bakanlık temsilcisi<\/b> bulunur ve tutanağı imzalar.<\/li>\n<li>Yönetim kurulu \"onaylamama kararı\"na karşı karar tarihinden itibaren <b>bir ay<\/b> içinde, iptal ve genel kurul kararının tescili davası açabilir; dava olumsuz oy verenlere yöneltilir.<\/li>\n<\/ul>\n\n<h3>Genel kurulun toplantıya çağrılması<\/h3>\n<table>\n<tr><th>Çağrıya yetkili<\/th><th>Koşul ve usul<\/th><\/tr>\n<tr><td><b>Yönetim kurulu<\/b><\/td><td>Asıl yetkili; <b>süresi dolmuş olsa bile<\/b> çağırabilir (m.410/1)<\/td><\/tr>\n<tr><td><b>Tasfiye memurları<\/b><\/td><td>Görevleriyle ilgili konular için (m.410/1)<\/td><\/tr>\n<tr><td><b>Azlık<\/b> (m.411–412)<\/td><td>Halka açık olmayan şirkette sermayenin <b>en az onda biri<\/b>, halka açıkta <b>yirmide biri<\/b>. Yönetim kurulundan yazılı, gerektirici sebepleri ve gündemi belirterek <b>noter aracılığıyla<\/b> çağrı veya gündeme madde ekleme ister. Esas sözleşme bu hakkı daha az paya da tanıyabilir<\/td><\/tr>\n<tr><td><b>Münferit pay sahibi<\/b><\/td><td>Yönetim kurulu devamlı toplanamıyor, toplantı nisabı oluşamıyor veya kurul mevcut değilse <b>mahkemenin izniyle<\/b>; mahkeme kararı kesin (m.410/2)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Azlığın gündem maddesi istemi, çağrı ilanının TTSG ilan ücretinin yatırılmasından <b>önce<\/b> yönetim kuruluna ulaşmalıdır.<\/li>\n<li>Yönetim kurulu kabul ederse genel kurul en geç <b>45 gün<\/b> içinde yapılacak şekilde çağrılır; aksi hâlde çağrıyı istem sahipleri yapar.<\/li>\n<li>Talep reddedilir veya <b>7 iş günü<\/b> içinde olumlu cevap verilmezse, aynı pay sahiplerinin başvurusuyla şirket merkezindeki <b>asliye ticaret mahkemesi<\/b> karar verir; gerek görürse gündemi düzenleyip çağrıyı yapacak bir <b>kayyım<\/b> atar. Mahkeme zorunluluk yoksa dosya üzerinden karar verir; <b>karar kesindir<\/b>.<\/li>\n<li>Dikkat: Tahvil sahipleri veya denetçi genel kurulu toplantıya çağırma yetkisine sahip değildir.<\/li>\n<\/ul>\n<h4>Gündem ve gündeme bağlılık<\/h4>\n<ul>\n<li>Gündemi <b>çağrıyı yapan<\/b> belirler (m.413); kural olarak yönetim kurulu. Azlık gündeme madde ekletebilir.<\/li>\n<li>Bakanlıkça görüşülmesi istenen konuların gündeme konması zorunludur (Yönetmelik m.13/5); halka açık ortaklıklarda <b>SPK'nın<\/b> görüşülmesini veya duyurulmasını istediği konular da gündeme alınır.<\/li>\n<li>\"Lüzum görülecek sair hususlar\" gibi belirsiz bir gündem maddesi konamaz; konular gündeme açıkça yazılmalıdır.<\/li>\n<\/ul>\n<p><b>Olağan genel kurul gündemi<\/b> (Yönetmelik m.13) sırasıyla: (1) açılış ve toplantı başkanlığı; (2) yıllık faaliyet raporunun okunması ve müzakeresi; (3) denetçi raporlarının okunması; (4) finansal tabloların okunması, müzakeresi ve tasdiki; (5) yönetim kurulu üyelerinin ibrası; (6) kârın kullanım şekli ve kâr payı oranları; (7) yönetim kurulu üyelerinin ücret, huzur hakkı, ikramiye ve primleri; (8) yıl içinde yapılan yönetim kurulu atamasının onayı; (9) süresi dolan üyelerin seçimi; (10) denetçinin seçimi; (11) gerekli diğer hususlar.<\/p>\n<table>\n<tr><th>Gündeme bağlılık ilkesinin istisnaları<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>Pay sahiplerinin tamamı hazırsa gündeme <b>oybirliğiyle<\/b> konu eklenmesi (çağrısız genel kurul)<\/td><td>m.416/2; Yönetmelik m.25<\/td><\/tr>\n<tr><td>Herhangi bir pay sahibinin <b>özel denetim<\/b> istemi, gündemde olsun olmasın karara bağlanır<\/td><td>m.438/1<\/td><\/tr>\n<tr><td>Yönetim kurulu üyelerinin görevden alınması ve yenilerinin seçimi <b>yılsonu finansal tabloların müzakeresi<\/b> maddesiyle ilgili sayılır<\/td><td>m.413/3<\/td><\/tr>\n<tr><td><b>Haklı sebeple<\/b> (yolsuzluk, yetersizlik, bağlılık yükümünün ihlali, geçimsizlik, nüfuzun kötüye kullanılması vb.) görevden alma ve yeni seçim, hazır bulunanların oy çokluğuyla gündeme alınır<\/td><td>m.364/1<\/td><\/tr>\n<tr><td>Bir pay sahibine genel kurul dışında bilgi verilmişse, diğerlerinin istemiyle gündemle ilgisiz olsa da aynı kapsamda bilgi verilmesi<\/td><td>m.437/2<\/td><\/tr>\n<\/table>\n<ul>\n<li>Gündem maddelerinin görüşülme sırası, hazır bulunan oyların <b>çoğunluğuyla<\/b> değiştirilebilir. Karara bağlanmış bir madde, hazır bulunanların <b>oybirliği<\/b> olmadıkça yeniden görüşülemez (Yönetmelik m.25/2–3).<\/li>\n<\/ul>\n<h4>Çağrının şekli ve süresi<\/h4>\n<table>\n<tr><th>Şirket<\/th><th>Çağrı yeri<\/th><th>Süre (ilan ve toplantı günleri hariç)<\/th><\/tr>\n<tr><td>Halka açık olmayan (TTK m.414)<\/td><td>Esas sözleşmedeki şekilde, <b>şirketin internet sitesi<\/b> ve <b>TTSG<\/b>; pay defterindeki ve adres bildiren pay sahiplerine <b>iadeli taahhütlü mektup<\/b><\/td><td>Toplantıdan en az <b>iki hafta<\/b> önce<\/td><\/tr>\n<tr><td>Halka açık (SerPK m.29/1)<\/td><td>Esas sözleşmedeki şekilde, ortaklığın internet sitesi, <b>KAP<\/b> ve SPK'nın belirlediği diğer yerler<\/td><td>Toplantıdan en az <b>üç hafta<\/b> önce<\/td><\/tr>\n<\/table>\n<ul>\n<li>Nama yazılı ihraç edilip borsada işlem gören paylarda m.414/1 uygulanmaz (SerPK m.29/2).<\/li>\n<li>Çağrı ilanının içeriği (Yönetmelik m.11): toplantı günü, saati, yeri, gündem; esas sözleşme değişikliği varsa eski ve yeni metinler; çağrıyı yapan; erteleme varsa sebebi ve ikinci toplantı nisabı; olağan toplantıda finansal tablolar, faaliyet raporu, denetim raporu ve kâr dağıtım önerisinin merkez ve şubelerde incelemeye hazır olduğu; ayrıca <b>vekâletname örnekleri<\/b>.<\/li>\n<li><b>Kurumsal ve bağımsız temsilci<\/b> ile organ temsilcisini düzenleyen m.428, <b>7099 sayılı Kanunla (15.02.2018)<\/b> yürürlükten kaldırıldı; m.430 ve 431 de ilga edildi.<\/li>\n<\/ul>\n\n<h3>Genel kurula katılım<\/h3>\n<ul>\n<li>Toplantıya yönetim kurulunun düzenlediği <b>hazır bulunanlar listesinde<\/b> adı olan pay sahipleri katılır (m.415). Oy hakkı olan <b>intifa hakkı sahipleri<\/b> ve sözleşmeyle katılma hakkı tanınan rehin hakkı sahipleri de katılabilir; intifa hakkı varsa aksi kararlaştırılmadıkça katılma ve oy hakkını intifa hakkı sahibi kullanır.<\/li>\n<li>Genel kurulda <b>temsil mümkündür<\/b>. Bir paya birden çok kişi ortak malikse ancak bir temsilci aracılığıyla katılırlar. Her pay sahibi kural olarak <b>tek kişiyle<\/b> temsil edilir; birden fazla temsilci gelirse oyu yalnız biri kullanır.<\/li>\n<li>Gerçek kişiler kimlik, tüzel kişi temsilcileri vekâletname gösterir.<\/li>\n<li>Payları kayden izlenen halka açık ortaklıklarda liste <b>MKK'dan<\/b> sağlanan pay sahipleri listesine göre hazırlanır (SerPK m.30).<\/li>\n<li>Katılma ve oy hakkı, payların veya pay senetlerinin bir yere <b>depo edilmesi şartına bağlanamaz<\/b> (TTK m.415 son fıkra; SerPK m.30/1).<\/li>\n<li><b>Katılmak zorunda olanlar<\/b> (Yönetmelik m.17): varsa murahhas üyelerle birlikte <b>en az bir yönetim kurulu üyesi<\/b> ve <b>denetçi<\/b>. Üyeler ve denetçi, pay sahibi olmasalar da görüş açıklayabilir.<\/li>\n<li><b>Toplantı yeri<\/b>: esas sözleşmede aksine hüküm yoksa şirket merkezinin bulunduğu yer (m.409/3).<\/li>\n<li><b>Hazır bulunanlar listesi<\/b> (m.417): kayden izlenen paylar için MKK'dan alınan \"pay sahipleri çizelgesi\"ne, diğerleri için pay defteri ve giriş kartlarına göre düzenlenir; <b>yönetim kurulu başkanı<\/b> imzalar ve toplantıdan önce toplantı yerinde bulundurulur. Gerekirse toplantı günüyle sınırlı pay devri yasağı getirilebilir.<\/li>\n<\/ul>\n<h4>Bakanlık temsilcisi (Yönetmelik m.32)<\/h4>\n<ul>\n<li>Kuruluş ve esas sözleşme değişikliği <b>Bakanlık iznine tabi<\/b> şirketlerin <b>bütün<\/b> genel kurullarında zorunlu.<\/li>\n<li>Diğer şirketlerde: gündeminde <b>sermaye artırımı veya azaltımı<\/b>, kayıtlı sermayeye geçiş veya çıkış, tavanın artırılması, <b>faaliyet konusunun değiştirilmesi<\/b>, <b>birleşme, bölünme, tür değiştirme<\/b> bulunan toplantılarda; <b>elektronik genel kurul<\/b> uygulayanların toplantılarında; <b>yurt dışındaki<\/b> tüm genel kurullarda ve yurt dışındaki imtiyazlı pay sahipleri özel kurullarında zorunlu.<\/li>\n<li>Diğer hallerde çağıranların talebi uygun görülürse görevlendirilir; azlık da Bakanlık temsilcisi istenmesini isteyebilir. Giderleri şirket karşılar.<\/li>\n<\/ul>\n\n<h3>Oy hakkı<\/h3>\n<ul>\n<li>Oy hakkı payların <b>toplam itibari değeriyle orantılı<\/b> kullanılır. Bir paya sahip olan da <b>en az bir oy<\/b> hakkına sahiptir; birden fazla paya sahip olanların oy sayısı esas sözleşmeyle <b>sınırlandırılabilir<\/b> (m.434).<\/li>\n<li>Oy hakkı, payın kanun veya esas sözleşmeyle belirlenen <b>en az miktarının ödenmesiyle<\/b> doğar (m.435); esas sözleşmede daha yüksek tutar yoksa pay tutarının <b>dörtte biri<\/b> ödenmelidir.<\/li>\n<li>Oylama kural olarak <b>açık ve el kaldırarak<\/b> yapılır.<\/li>\n<\/ul>\n<h4>Oydan yoksunluk ve oyun donması<\/h4>\n<ul>\n<li>Pay sahibi; kendisi, eşi, alt-üst soyu veya bunların ortağı olduğu şahıs şirketleri ya da hâkimiyetindeki sermaye şirketleri ile şirket arasındaki <b>kişisel işlem<\/b> veya <b>dava<\/b> müzakerelerinde oy kullanamaz (m.436/1).<\/li>\n<li>Yönetim kurulu üyeleri ve imza yetkili yöneticiler <b>ibra<\/b> kararlarında kendi paylarının oyunu kullanamaz (m.436/2).<\/li>\n<li>Şirketin iktisap ettiği <b>kendi payları<\/b> ve yavru şirketin edindiği ana şirket payları toplantı nisabında dikkate alınmaz; bedelsiz paylar hariç, şirketin kendi payları hiçbir pay sahipliği hakkı vermez; yavru şirketin ana şirket paylarındaki oy hakları <b>donar<\/b> (m.389).<\/li>\n<li>SerPK m.26–27: yönetim kontrolünü sağlayan payları edinen ve <b>pay alım teklifi<\/b> zorunluluğunu süresinde yerine getirmeyenlerin oy hakları kendiliğinden donar; bu paylar toplantı nisabında dikkate alınmaz.<\/li>\n<\/ul>\n<h4>Oyda imtiyaz (m.479)<\/h4>\n<ul>\n<li>Eşit itibari değerdeki paylara <b>farklı sayıda oy<\/b> verilerek tanınır.<\/li>\n<li>Bir paya <b>en çok 15 oy<\/b> hakkı tanınabilir. Kurumlaşmanın gerektirdiği veya haklı sebebin ispatlandığı hallerde, şirket merkezindeki <b>asliye ticaret mahkemesinin<\/b> istisna kararıyla bu sınır uygulanmaz; projedeki her değişiklik mahkeme kararına bağlıdır, mahkeme kararı geri alabilir.<\/li>\n<li>Oyda imtiyaz kullanılamayan kararlar: <b>esas sözleşme değişikliği<\/b>, <b>ibra<\/b>, <b>sorumluluk davası açılması<\/b> (m.479/3).<\/li>\n<\/ul>\n<h4>Birikimli oy<\/h4>\n<ul>\n<li>Yönetim kurulu seçiminde, kişinin oy sayısı ile seçilecek üye sayısı <b>çarpılır<\/b>; ortaya çıkan oyların tamamı tek adaya verilebilir veya adaylara bölünebilir.<\/li>\n<li>Halka açık olmayan şirketlerde Ticaret Bakanlığı tebliğiyle düzenlenmiştir (m.434/4). Esas sözleşmede şunlar gerekir: birikimli oya ilişkin <b>açık hüküm<\/b>; m.360 uyarınca grup temsili veya aday önerme hükmü <b>bulunmaması<\/b>; m.479 uyarınca oyda imtiyaz <b>bulunmaması<\/b>; üye sayısının <b>üçten az olmayacak<\/b> şekilde sabit belirlenmesi.<\/li>\n<\/ul>\n\n<h3>Genel kurulda temsil<\/h3>\n<ul>\n<li>Pay sahibi, pay sahibi olan veya olmayan birini temsilci olarak gönderebilir; temsilcinin <b>pay sahibi olmasını şart koşan esas sözleşme hükmü geçersizdir<\/b> (m.425/1).<\/li>\n<li>Temsil belgesi kural olarak <b>yazılı<\/b> olmalıdır (m.426/1). Temsilci talimata uyar; ama talimata aykırı oy <b>geçersiz değildir<\/b>, temsil edilenin temsilciye karşı hakları saklıdır (m.427/1).<\/li>\n<li>Halka açık ortaklıklarda vekâleten oy ve çağrı yoluyla vekâlet toplama: SPK'nın <b>II-30.1<\/b> sayılı Tebliği.<\/li>\n<li>7099 sayılı Kanunla m.428 kaldırıldığından bugün iki temsilci türü kalmıştır: <b>olağan (adi) bireysel temsilci<\/b> ve <b>tevdi eden temsilcisi<\/b>.<\/li>\n<li><b>Tevdi eden temsilcisi<\/b> (m.429): her genel kuruldan önce tevdi edenden talimat istemek zorundadır. Talimat alınamazsa tevdi edenin <b>genel talimatına<\/b>, o da yoksa <b>yönetim kurulunun önerileri<\/b> yönünde oy kullanır.<\/li>\n<\/ul>\n\n<h3>Toplantı ve karar nisapları<\/h3>\n<table>\n<tr><th>Karar türü<\/th><th>Toplantı nisabı<\/th><th>Karar nisabı<\/th><\/tr>\n<tr><td>Adi kararlar (m.418)<\/td><td>Sermayenin en az <b>dörtte biri<\/b>; toplantı boyunca korunmalı. İlk toplantıda sağlanamazsa <b>ikinci toplantıda nisap aranmaz<\/b><\/td><td>Toplantıda hazır bulunan oyların <b>çoğunluğu<\/b><\/td><\/tr>\n<tr><td>Esas sözleşme değişikliği (m.421/1)<\/td><td>Sermayenin en az <b>yarısı<\/b>; ikinci toplantı (en geç <b>bir ay<\/b> içinde) için en az <b>üçte biri<\/b><\/td><td>Toplantıda mevcut oyların <b>çoğunluğu<\/b><\/td><\/tr>\n<tr><td>Bilanço zararlarını kapatmak için yükümlülük ve ikincil yükümlülük koyan kararlar; şirket merkezinin <b>yurt dışına taşınması<\/b> (m.421/2)<\/td><td colspan=\"2\">Sermayenin <b>tamamının oybirliği<\/b><\/td><\/tr>\n<tr><td>İşletme konusunun <b>tamamen<\/b> değiştirilmesi; <b>imtiyazlı pay<\/b> oluşturulması; nama yazılı payların <b>devrinin sınırlandırılması<\/b> (m.421/3)<\/td><td colspan=\"2\">Sermayenin en az <b>yüzde 75<\/b>'inin olumlu oyu; sonraki toplantılarda da aynı nisap aranır<\/td><\/tr>\n<\/table>\n<ul>\n<li>m.421/1 nisaplarını düşüren veya nispi çoğunluk öngören esas sözleşme hükümleri <b>geçersizdir<\/b>.<\/li>\n<li>m.504'te de sermayenin yüzde 75'lik nitelikli nisabı aranır.<\/li>\n<li>Borsada işlem gören şirketlerde sermaye artırımı, kayıtlı sermaye tavanının yükseltilmesi ve birleşme, bölünme, tür değiştirme kararlarında esas sözleşmede aksi yoksa m.418'deki adi nisap uygulanır (m.421/5).<\/li>\n<li><b>Halka açık ortaklıklar<\/b> (SerPK m.29/3): merkezin yurt dışına taşınması ve bilanço zararları için yükümlülük kararları <b>hariç<\/b>, kanunda veya esas sözleşmede açıkça oran belirtilerek daha ağır nisap öngörülmedikçe <b>m.418<\/b> uygulanır. Esas sözleşmede TTK'ya veya madde numarasına yalnızca <b>atıf<\/b> yapılması \"aksine hüküm\" sayılmaz.<\/li>\n<\/ul>\n<table>\n<tr><th>Halka açık ortaklıkta özel kararlar (SerPK m.29/6)<\/th><th>Nisap<\/th><\/tr>\n<tr><td>Yeni pay alma haklarının kısıtlanması, yönetim kuruluna bu yetkinin verilmesi, <b>sermaye azaltımı<\/b>, SerPK m.23/1'deki <b>önemli nitelikteki işlemler<\/b><\/td><td>Toplantı nisabı aranmaz; toplantıya katılan oy hakkı olan payların <b>üçte ikisinin<\/b> olumlu oyu. Toplantıda sermayenin en az <b>yarısı<\/b> hazırsa katılanların <b>çoğunluğu<\/b> yeterli. İşlemin tarafı olan ortaklar oy kullanamaz; nisapları hafifleten esas sözleşme hükmü geçersiz<\/td><\/tr>\n<\/table>\n<p><b>Kararların etkisi<\/b> (m.423): genel kurul kararları toplantıda <b>bulunmayan<\/b> ve <b>olumsuz oy veren<\/b> pay sahiplerini de bağlar; çünkü genel kurul kararı sözleşme değil <b>karar<\/b> niteliğindedir. Yok veya batıl kararlar ise kimseyi bağlamaz.<\/p>\n\n<h3>Genel kurul kararlarının sakatlığı<\/h3>\n<ul>\n<li><b>Yokluk<\/b>: TTK'da düzenlenmemiştir; kurucu unsura aykırılıkta söz konusudur. Tipik örnek: <b>kanuni toplantı ve karar nisaplarına aykırı<\/b> kararlar.<\/li>\n<li><b>Butlan<\/b> (m.447, örnekleyici): (a) pay sahibinin genel kurula katılma, <b>asgari oy<\/b>, dava ve vazgeçilemez haklarını sınırlandıran veya kaldıran; (b) <b>bilgi alma, inceleme ve denetleme<\/b> haklarını kanunun izin verdiği ölçü dışında sınırlayan; (c) <b>temel yapıyı bozan<\/b> veya <b>sermayenin korunması<\/b> hükümlerine aykırı kararlar. Diğer sakatlıklarda <b>butlanın ikincilliği<\/b> ilkesi uygulanır; TBK m.27 de uygulanabilir.<\/li>\n<li>Sermayenin korunması iki kurala dayanır: <b>sermayenin iadesi yasağı<\/b> ve <b>malvarlığının amaca bağlılığı<\/b>.<\/li>\n<li>Yokluk ve butlan süresiz ileri sürülür; ancak <b>SPK<\/b> için SerPK m.92/1-b süre öngörür: hukuka aykırılığın Kurulca tespitinden itibaren <b>3 ay<\/b> ve her hâlde işlemden itibaren <b>3 yıl<\/b> içinde iptal; <b>5 yıl<\/b> içinde butlan veya yokluk tespiti davası.<\/li>\n<\/ul>\n<h4>İptal davası (m.445–451)<\/h4>\n<ul>\n<li>Sebepler: <b>kanuna, esas sözleşmeye veya dürüstlük kurallarına<\/b> aykırılık.<\/li>\n<li>Süre: <b>karar tarihinden itibaren üç ay<\/b> (hak düşürücü); mahkeme: şirket merkezindeki <b>asliye ticaret<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Dava açabilecekler (m.446)<\/th><\/tr>\n<tr><td>Toplantıda hazır bulunup <b>olumsuz oy veren ve muhalefetini tutanağa geçirten<\/b> pay sahipleri<\/td><\/tr>\n<tr><td>Hazır bulunsun bulunmasın, olumsuz oy versin vermesin; çağrının usulsüz yapıldığını, gündemin gereği gibi ilan edilmediğini, yetkisiz kişilerin katılıp oy kullandığını veya kendisinin haksız yere katılımdan men edildiğini ve bunların karara etkili olduğunu ileri süren pay sahipleri<\/td><\/tr>\n<tr><td><b>Yönetim kurulu<\/b><\/td><\/tr>\n<tr><td>Kararın yerine getirilmesi <b>kişisel sorumluluğuna<\/b> sebep olacaksa her bir yönetim kurulu üyesi<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: 6102 sayılı TTK'ya göre <b>denetçinin iptal davası açma yetkisi yoktur<\/b>.<\/li>\n<li>Dava açılması kararın yürütülmesini kendiliğinden durdurmaz; mahkeme <b>yürütmenin geri bırakılmasına<\/b> karar verebilir (m.449).<\/li>\n<li>Yönetim kurulu davayı ve duruşma gününü ilan eder ve internet sitesine koyar. Üç aylık süre bitmeden <b>duruşmaya başlanamaz<\/b>; birden fazla dava <b>birleştirilir<\/b>; şirketin istemiyle davacılardan <b>teminat<\/b> istenebilir (m.448).<\/li>\n<li>İptal kararı <b>yenilik doğurucudur<\/b> ve geçmişe etkilidir; ancak iptal edilen karara dayanılarak kurulan ilişkilerde üçüncü kişilerin hakları saklıdır (m.371/4).<\/li>\n<li>Kesinleşen iptal veya butlan kararı <b>bütün pay sahipleri<\/b> hakkında hüküm doğurur; yönetim kurulu derhâl tescil ettirir ve internet sitesine koyar (m.450).<\/li>\n<li><b>Kötü niyetle<\/b> dava açanlar şirketin zararından <b>müteselsilen<\/b> sorumludur (m.451).<\/li>\n<\/ul>\n", "sorular": [{"q": "Aşağıdakilerden hangisi genel kurulun devredilemez görev ve yetkileri arasında değildir?", "o": ["Esas sözleşmenin değiştirilmesi", "Kayıtlı sermaye tavanı içinde sermaye artırımı yapılması", "Önemli miktarda şirket varlığının toptan satışı", "Yönetim kurulu üyelerinin ibrası", "Kanundaki istisnalar dışında şirketin feshi"], "a": 1, "e": "Kayıtlı sermaye sisteminde tavan içinde sermaye artırımı yönetim kurulunun yetkisindedir; diğerleri m.408/2'de sayılır."}, {"q": "Olağan genel kurul toplantısı ne zaman yapılır?", "o": ["Her faaliyet dönemi sonundan itibaren bir ay içinde", "Her faaliyet dönemi sonundan itibaren altı ay içinde", "Her takvim yılının ilk iş gününde", "Yönetim kurulunun uygun gördüğü herhangi bir zamanda", "Her faaliyet dönemi sonundan itibaren üç ay içinde"], "a": 4, "e": "m.409/1: olağan toplantı her faaliyet dönemi sonundan itibaren üç ay içinde yapılır."}, {"q": "Çağrısız genel kurul toplantısına (m.416) ilişkin hangisi yanlıştır?", "o": ["Bütün payların sahipleri veya temsilcileri katılmalıdır", "Hiçbir pay sahibi itiraz etmemelidir", "Gündeme bağlılık ilkesi aynen uygulanır", "Yüzde yüzlük toplantı nisabı toplantı boyunca sürmelidir", "Muhalif pay sahibinin toplantıyı terk etmesi kararın alınmasını engeller"], "a": 2, "e": "Çağrısız genel kurulda gündeme bağlılık ilkesi geçerli değildir; gündeme oybirliğiyle madde eklenebili
