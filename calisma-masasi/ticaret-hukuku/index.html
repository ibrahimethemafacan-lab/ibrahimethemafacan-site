td><td>m.439/1<\/td><\/tr>\n<tr><td>Nama yazılı pay senedi bastırılmasını isteme<\/td><td>m.486/3<\/td><\/tr>\n<tr><td>Haklı sebeple fesih davası<\/td><td>m.531<\/td><\/tr>\n<tr><td>Kuruluş ve sermaye artırımı sorumluluğuna ilişkin sulh ve ibranın onaylanmasına karşı çıkma<\/td><td>m.559<\/td><\/tr>\n<tr><td>Bakanlık temsilcisi istenmesini isteme<\/td><td>Genel Kurul Yönetmeliği m.32/3<\/td><\/tr>\n<\/table>\n<p>Dikkat: Yönetim kurulu üyesinin azlini mahkemeden isteme diye bir pay sahipliği hakkı yoktur; görevden alma genel kurulun yetkisidir.<\/p>\n\n<h3>Pay sahibinin borcu<\/h3>\n<ul>\n<li><b>Tek borç ilkesi<\/b>: pay sahibi yalnız taahhüt ettiği <b>sermayeyi koyma<\/b> borcu ile ve yalnız <b>şirkete karşı<\/b> sorumludur (m.329). Alacaklılara karşı sorumluluğu yoktur; alacaklılar taahhüdün şirkete ödenmesini dava yoluyla bile isteyemez.<\/li>\n<li>İstisnalar: (1) esas sözleşmeyle pay bedeli dışında yalnız itibari değeri aşan <b>prim<\/b> yükletilebilir (m.480/1); (2) pay devri şirket onayına bağlıysa esas sözleşmeyle belli zamanlarda tekrarlanan, <b>konusu para olmayan ikincil yükümlülükler<\/b> getirilebilir (m.480/4); bunlar pay senedinin arkasına yazılabilir. İkincil yükümlülük koyan karar <b>sermayenin tamamının oybirliğini<\/b> gerektirir (m.421/2-a).<\/li>\n<\/ul>\n", "sorular": [{"q": "SPKn m.3'e göre aşağıdakilerden hangisi menkul kıymet niteliğinde değildir?", "o": ["Çek", "Pay", "Depo sertifikası", "Paya dönüştürülebilir tahvil", "Kira sertifikası"], "a": 0, "e": "Menkul kıymet tanımı para, çek, poliçe ve bonoyu açıkça hariç tutar; kira sertifikaları SPKn m.61 ile menkul kıymettir."}, {"q": "Aşağıdakilerden hangisi borçlanma aracı niteliğinde değildir?", "o": ["Tahvil", "Değiştirilebilir tahvil", "Kıymetli maden bonosu", "Varant", "Finansman bonosu"], "a": 3, "e": "Varant bir türev/diğer sermaye piyasası aracıdır; borçlu sıfatıyla ihraç edilen bir borçlanma aracı değildir."}, {"q": "İntifa senetlerine ilişkin hangisi yanlıştır?", "o": ["Çıkarılmasına genel kurul karar verir", "Sahiplerine bütün pay sahipliği hakları tanınabilir", "Emre veya hamiline yazılı olabilir", "Sahiplerine net kâra katılma hakkı tanınabilir", "Sahiplerine tasfiye bakiyesine katılma hakkı tanınabilir"], "a": 1, "e": "m.503: intifa senedi sahiplerine pay sahipliği hakları verilemez; yalnız net kâra, tasfiye bakiyesine katılma veya yeni pay alma hakları tanınabilir."}, {"q": "Özkaynağı 200 milyon lira olan halka açık olmayan bir ortaklığın Borçlanma Araçları Tebliğine göre genel ihraç limiti ne kadardır?", "o": ["200 milyon lira", "400 milyon lira", "1 milyar lira", "Sınırsız", "600 milyon lira"], "a": 4, "e": "Halka açık olmayan ortaklıkta limit özkaynağın üç katıdır: 200 x 3 = 600 milyon lira. Halka açık olsaydı beş kat, yani 1 milyar lira olurdu."}, {"q": "Borçlanma araçlarına ilişkin hangisi yanlıştır?", "o": ["Tahviller emre, nama ve hamiline yazılı ihraç edilebilir", "Bedelleri nakit olmalı ve teslimde tamamen ödenmelidir", "İhraç yetkisi esas sözleşmeyle yönetim kuruluna süresiz devredilemez", "Halka açık şirketlerde ihraç kararında m.418 nisapları uygulanır", "Konsolide tablo hazırlanıyorsa limit hesabında ana ortaklığa ait özkaynak esas alınır"], "a": 2, "e": "SPKn m.31/3: borçlanma aracı ihraç yetkisi esas sözleşmeyle yönetim kuruluna süreli veya süresiz devredilebilir."}, {"q": "TTK'ya göre payın asgari itibari değeri ve bu değerin artırılmasına ilişkin hangisi doğrudur?", "o": ["En az 1 kuruş; Cumhurbaşkanı yüz katına kadar artırabilir", "En az 1 lira; SPK on katına çıkarabilir", "En az 25 kuruş; Bakanlık iki katına çıkarabilir", "En az 1 kuruş; genel kurul serbestçe değiştirebilir", "İtibari değer zorunlu değildir"], "a": 0, "e": "m.476: en az bir kuruş, birer kuruş ve katları olarak yükseltilir; Cumhurbaşkanı yüz katına kadar artırabilir."}, {"q": "Payların birleştirilmesine ilişkin hangisi doğrudur?", "o": ["Yönetim kurulu kararı yeterlidir", "Sermaye artırımı yapılmadan birleştirme yapılamaz", "Yalnız halka açık şirketlerde mümkündür", "Genel kurul esas sözleşme değişikliğiyle karar verir ve her pay sahibinin onayı gerekir", "SPK izni şarttır"], "a": 3, "e": "m.477: sermaye aynı kalmak şartıyla genel kurul bölme veya birleştirme yapabilir; birleştirme için her pay sahibinin onayı gerekir."}, {"q": "Hamiline yazılı pay senetlerine ilişkin hangisi yanlıştır?", "o": ["Bedeli tamamen ödenmemiş paylar için çıkarılamaz", "Esas sözleşmeyle devri şirket onayına bağlanabilir", "Yönetim kurulu, bedelin tamamının ödenmesinden itibaren üç ay içinde basıp dağıtır", "Senet sahipleri dağıtımdan önce MKK'ya bildirilir", "Devri zilyetliğin geçirilmesi ve devralanın MKK'ya bildirimiyle hüküm doğurur"], "a": 1, "e": "Hamiline yazılı payların devrine sınırlama getirilemez; devir sınırlaması nama yazılı paylar içindir."}, {"q": "Hamiline yazılı payı devralıp MKK'ya bildirimde bulunmayan kişiye uygulanacak idari para cezası ne kadardır?", "o": ["1.000 TL", "10.000 TL", "20.000 TL", "50.000 TL", "5.000 TL"], "a": 4, "e": "m.562/13-b: 5.000 TL. Senetler dağıtılmadan önce yapılması gereken MKK bildirimini yapmayanlar için öngörülen ceza ise 20.000 TL'dir."}, {"q": "Bedeli tamamen ödenmemiş nama yazılı payların devrinde şirket onayı hangi durumda reddedilebilir?", "o": ["Şirket rakibine devir yapılıyorsa", "Yönetim kurulu dilediği her durumda", "Devralanın ödeme yeterliliği şüpheli ve istenen teminat verilmemişse", "Pay sahipleri çoğunluğu karşı çıkarsa", "Devir miras yoluyla gerçekleşmişse"], "a": 2, "e": "m.491: şirket yalnız devralanın ödeme yeterliliği şüpheli ve teminat verilmemişse reddedebilir; miras, mal rejimi ve cebri icrada bu kural uygulanmaz."}, {"q": "Borsaya kote edilmemiş nama yazılı paylarda şirketin devri pay defterine kaydetmeyi reddedebileceği hallerden biri hangisi değildir?", "o": ["Devralanın yabancı uyruklu olması (esas sözleşmede önemli sebep olarak öngörülmemişse)", "Esas sözleşmede öngörülen önemli bir sebep", "Devredene payları gerçek değeriyle almayı önermek", "Devralanın kendi ad ve hesabına aldığını beyan etmemesi", "Pay sahipleri çevresinin bileşiminin ekonomik bağımsızlık yönünden reddi haklı göstermesi"], "a": 0, "e": "m.493'teki sebepler dışında ret yapılamaz; uyruk, esas sözleşmede önemli sebep olarak düzenlenmedikçe ret sebebi olamaz."}, {"q": "6102 sayılı TTK'nın nama yazılı payların onaya bağlı devrinde benimsediği teori hangisidir?", "o": ["Bölünme teorisi", "Yaratma teorisi", "İlan teorisi", "Birlik teorisi", "Güven teorisi"], "a": 3, "e": "m.494/1: onay verilmedikçe mülkiyet ve tüm haklar devredende kalır (birlik teorisi); mülga TTK'daki bölünme teorisi terk edilmiştir."}, {"q": "Miras yoluyla edinilen borsaya kote edilmemiş nama yazılı paylarda şirket onay istemini aldığı tarihten itibaren ne kadar süre içinde reddetmezse onay verilmiş sayılır?", "o": ["15 gün", "3 ay", "1 ay", "6 ay", "1 yıl"], "a": 1, "e": "m.494/3: üç ay içinde reddedilmezse veya ret haksızsa onay verilmiş sayılır."}, {"q": "Borsaya kote edilmiş nama yazılı paylar için hangisi doğrudur?", "o": ["Şirket önemli sebep göstererek her zaman reddedebilir", "Miras yoluyla edinen kişinin pay sahipliği reddedilebilir", "Şirket payları gerçek değerle almayı önererek reddedebilir", "Hiçbir koşulda ret yapılamaz", "Esas sözleşmede yüzdeyle ifade edilen iktisap üst sınırı aşılırsa kayıt reddedilebilir"], "a": 4, "e": "m.495: ret yalnız iktisap üst sınırının aşılması veya kendi ad ve hesabına alım beyanının verilmemesi hâlinde mümkündür; miras, mal rejimi ve cebri icrada ret yoktur."}, {"q": "Çıkarılmış sermayesi 300 milyon lira olan bir anonim şirket, TTK m.379/1'e göre en fazla ne kadar tutarda kendi payını ivazlı olarak edinebilir?", "o": ["15 milyon lira", "60 milyon lira", "30 milyon lira", "100 milyon lira", "Hiç edinemez"], "a": 2, "e": "Sınır esas veya çıkarılmış sermayenin onda biridir: 300 x 0,10 = 30 milyon lira."}, {"q": "Şirketin kendi paylarını edinmesine ilişkin hangisi yanlıştır?", "o": ["Kurala aykırı edinme işlemi kesin olarak geçersizdir", "Genel kurul yönetim kurulunu en çok beş yıl için yetkilendirir", "İvazsız edinme yasak değildir", "Kurala aykırı edinilen paylar en geç altı ay içinde elden çıkarılır", "Şirket tek pay sahibi olacak şekilde kendi payını edinemez"], "a": 0, "e": "m.385: aykırı edinme işlemi geçersiz olmaz; paylar altı ay içinde elden çıkarılır veya rehin kaldırılır."}, {"q": "Finansal tablolar, faaliyet raporu ve kâr dağıtım önerisi genel kuruldan en az kaç gün önce pay sahiplerinin incelemesine hazır bulundurulur?", "o": ["7 gün", "10 gün", "21 gün", "15 gün", "30 gün"], "a": 3, "e": "m.437/1: en az on beş gün önce merkez ve şubelerde hazır bulundurulur; finansal tablolar bir yıl açık tutulur."}, {"q": "Bilgi alma istemi reddedilen pay sahibi mahkemeye hangi süre içinde başvurmalıdır?", "o": ["Reddi izleyen 2 gün içinde", "Reddi izleyen 10 gün içinde", "Reddi izleyen 30 gün içinde", "Reddi izleyen 3 ay içinde", "Süresiz"], "a": 1, "e": "m.437/5: reddi izleyen on gün, diğer hallerde makul süre; basit yargılama usulü uygulanır ve karar kesindir."}, {"q": "Genel kurul özel denetim istemini reddetmişse, halka açık olmayan bir şirkette mahkemeden özel denetçi istenebilmesi için hangisi yeterlidir?", "o": ["Tek bir pay sahibinin başvurusu", "Sermayenin yirmide birini temsil edenlerin otuz gün içinde başvurusu", "Yönetim kurulunun başvurusu", "Denetçinin başvurusu", "Sermayenin onda birini veya itibari değer toplamı en az 1 milyon TL olan payları temsil eden pay sahiplerinin üç ay içinde başvurusu"], "a": 4, "e": "m.439/1: halka açık olmayanda onda bir, halka açıkta yirmide bir veya itibari değeri en az 1 milyon TL olan paylar; üç ay içinde başvuru."}, {"q": "Ödenmiş sermayesi 100 milyon lira, genel kanuni yedek akçesi 12 milyon lira olan bir şirket 40 milyon lira yıllık kâr elde etmiştir. TTK m.519/1'e göre birinci tertip genel kanuni yedek akçeye ne kadar ayrılır?", "o": ["0 lira", "4 milyon lira", "2 milyon lira", "8 milyon lira", "20 milyon lira"], "a": 2, "e": "Yıllık kârın yüzde beşi ayrılır: 40 x 0,05 = 2 milyon lira. Yedek akçe 14 milyon olur ve ödenmiş sermayenin yüzde yirmisi olan 20 milyon lira sınırına henüz ulaşmamıştır."}, {"q": "Ödenmiş sermayesi 80 milyon lira olan bir şirkette TTK'ya göre pay sahiplerine dağıtılacak birinci kâr payı ne kadardır?", "o": ["4 milyon lira", "2 milyon lira", "8 milyon lira", "16 milyon lira", "Genel kurulun serbest takdirindedir"], "a": 0, "e": "m.519/2-c ve 511: ödenmiş sermayenin yüzde beşi, yani 80 x 0,05 = 4 milyon lira."}, {"q": "Halka açık bir ortaklığın önceki yıl dönem kârı 90 milyon liradır. Bu hesap döneminde dağıtabileceği toplam kâr payı avansı en fazla ne kadardır?", "o": ["30 milyon lira", "60 milyon lira", "90 milyon lira", "45 milyon lira", "Sınır yoktur"], "a": 3, "e": "SPKn m.20/1: bir hesap dönemindeki toplam avans önceki yıl dönem kârının yarısını aşamaz: 90 / 2 = 45 milyon lira."}, {"q": "Yeni pay alma (rüçhan) hakkının genel kurul kararıyla sınırlandırılması için hangi nisap ve şart aranır?", "o": ["Hazır bulunanların çoğunluğu", "Esas sermayenin yüzde altmışının olumlu oyu ve haklı sebep", "Sermayenin yüzde yetmiş beşinin olumlu oyu", "Oybirliği", "Esas sözleşme hükmü yeterlidir"], "a": 1, "e": "m.461/2: esas sermayenin yüzde altmışı ve haklı sebep; rüçhan hakkı esas sözleşmeyle sınırlandırılamaz veya kaldırılamaz."}, {"q": "Aşağıdakilerden hangisi TTK'da tanınan azlık haklarından biri değildir?", "o": ["Haklı sebeple fesih davası açma", "Nama yazılı pay senedi bastırılmasını isteme", "Finansal tabloların müzakeresinin ertelenmesini isteme", "Denetçinin haklı sebeple görevden alınması davası", "Yönetim kurulu üyesinin mahkeme kararıyla azlini isteme"], "a": 4, "e": "Böyle bir azlık hakkı yoktur; yönetim kurulu üyelerinin görevden alınması genel kurulun yetkisidir."}, {"q": "Pay sahibinin borcuna ilişkin hangisi doğrudur?", "o": ["Şirket borçlarından sınırsız sorumludur", "Alacaklılar taahhüt edilen sermayenin şirkete ödenmesini dava edebilir", "Yalnız taahhüt ettiği sermayeyi koyma borcu vardır ve yalnız şirkete karşı sorumludur", "Esas sözleşmeyle her türlü ek ödeme yükümlülüğü getirilebilir", "İkincil yükümlülükler basit çoğunlukla getirilebilir"], "a": 2, "e": "Tek borç ilkesi (m.329, 480/1). İkincil yükümlülük ancak devri onaya bağlı paylarda, sermayenin tamamının oybirliğiyle getirilebilir."}]}, {"id": 12, "kisa": "Sona Erme ve Tasfiye", "baslik": "Anonim Şirketlerde Sona Erme ve Tasfiye: Genel ve Özel Sona Erme Sebepleri, Tasfiye Süreci, Ek Tasfiye ve Tasfiyeden Dönme", "ozet": "TTK m.529'daki genel sona erme sebepleri, organ eksikliği ve haklı sebeple fesih, tasfiye memurları, tasfiye işlemleri ve alacaklılara çağrı, kalan varlığın dağıtımı, sicilden terkin, ek tasfiye ve tasfiyeden dönme.", "notlar": "\n<h3>Genel sona erme sebepleri (m.529)<\/h3>\n<ol>\n<li>Esas sözleşmedeki <b>sürenin dolması<\/b> (işlere fiilen devam edilerek belirsiz süreli hâle gelmemişse).<\/li>\n<li><b>İşletme konusunun gerçekleşmesi<\/b> veya gerçekleşmesinin <b>imkânsız<\/b> hâle gelmesi.<\/li>\n<li>Esas sözleşmede öngörülen herhangi bir <b>sona erme sebebinin<\/b> gerçekleşmesi.<\/li>\n<li>m.421/3–4'e uygun alınan <b>genel kurul kararı<\/b> (sermayenin en az <b>yüzde 75<\/b>'i).<\/li>\n<li><b>İflas<\/b> kararı.<\/li>\n<li>Kanunlarda öngörülen diğer haller (sayım sınırlı değildir).<\/li>\n<\/ol>\n<p>Dikkat: Yönetim kurulu başkanının veya bir pay sahibinin iflası şirketi sona erdirmez.<\/p>\n\n<h3>Özel sona erme sebepleri<\/h3>\n<h4>Organ eksikliği (m.530)<\/h4>\n<ul>\n<li><b>Uzun süreden beri<\/b> kanunen gerekli organlardan biri <b>mevcut değilse<\/b> (yönetim kurulu için) veya <b>genel kurul toplanamıyorsa<\/b> (genel kurul için ölçüt \"toplanamama\"dır).<\/li>\n<li>İstem: <b>pay sahipleri, şirket alacaklıları veya Ticaret Bakanlığı<\/b>; mahkeme: şirket merkezindeki <b>asliye ticaret<\/b>.<\/li>\n<li>Mahkeme <b>yönetim kurulunu dinler<\/b> ve durumu düzeltmesi için <b>süre verir<\/b>; düzeltilmezse <b>fesih<\/b> kararı verir. Şirket <b>kendiliğinden sona ermez<\/b>.<\/li>\n<li>Yönetim kurulunun süresi dolup yenisinin seçilememesi, istifalarla kurulun boşalıp doldurulamaması \"mevcut olmama\" sayılır; kurulun hiç veya gereği gibi toplanamaması da somut olaya göre kapsamdadır. \"Uzun süreden beri\" ibaresi <b>devamlılık<\/b> şartıdır.<\/li>\n<\/ul>\n<h4>Haklı sebeple fesih (m.531)<\/h4>\n<ul>\n<li>6102 ile getirilen yeni düzenleme ve bir <b>azlık hakkı<\/b>: sermayenin en az <b>onda birini<\/b>, halka açıkta <b>yirmide birini<\/b> temsil eden pay sahipleri haklı sebeplerle şirket merkezindeki asliye ticaret mahkemesinden fesih isteyebilir.<\/li>\n<li>Oranın tek bir kişide toplanması şart değildir; birden çok pay sahibi birleşebilir. Gerekçeye göre esas sözleşme <b>daha düşük oran<\/b> öngörebilir.<\/li>\n<li>Haklı sebep kanunda tanımlanmamış ve örneklenmemiştir. İsviçre öğretisindeki örnekler: genel kurulun defalarca kanuna aykırı çağrılması, azlık ve bireysel hakların sürekli ihlali (özellikle bilgi alma hakkının engellenmesi), sürekli zarar, kâr payının düzenli azalması. <b>Varsayımlar ve olumsuz beklentiler haklı sebep değildir<\/b>.<\/li>\n<li>Mahkeme sebepleri haklı bulsa da fesihle bağlı değildir: fesih yerine davacılara paylarının karar tarihine en yakın <b>gerçek değerinin ödenip şirketten çıkarılmalarına<\/b> veya duruma uygun ve kabul edilebilir <b>başka bir çözüme<\/b> (kâr dağıtma zorunluluğu, yeni pay sahibi alınması, kısmi tasfiye gibi) karar verebilir.<\/li>\n<\/ul>\n<h4>Diğer özel sebepler<\/h4>\n<table>\n<tr><th>Sebep<\/th><th>Kural<\/th><\/tr>\n<tr><td>Kamu düzenine veya işletme konusuna aykırı ya da muvazaalı faaliyet (m.210/3)<\/td><td>Ticaret Bakanlığı, öğrenmeden itibaren <b>bir yıl<\/b> içinde fesih davası açabilir; kabulünde şirket sona erip tasfiyeye girer<\/td><\/tr>\n<tr><td>Kuruluşta kanuna aykırılık (m.353)<\/td><td>Fesih davası<\/td><\/tr>\n<tr><td>Sermayenin <b>üçte ikisinin<\/b> kaybı (m.376/2)<\/td><td>Derhal çağrılan genel kurul sermayenin üçte biriyle yetinme veya tamamlama kararı vermezse şirket <b>kendiliğinden<\/b> sona erer<\/td><\/tr>\n<tr><td>Borca batıklık (m.376/3)<\/td><td>Ara bilanço sonrası mahkemeye bildirim ve iflas; alacaklıların sıralamada geri kalmayı kabulü bilirkişilerce doğrulanırsa iflas yok. Özünde iflas yoluyla sona erme<\/td><\/tr>\n<tr><td>Birleşme ve bölünme<\/td><td>Birleşmede <b>devrolunan<\/b> şirket ve <b>tam bölünmede<\/b> bölünen şirket infisah eder (m.152/3, 159/1-a)<\/td><\/tr>\n<\/table>\n\n<h3>Tasfiye<\/h3>\n<h4>Tasfiyeye girişin sonuçları<\/h4>\n<ul>\n<li>Sona erme tescil ve TTSG'de ilan ettirilir: <b>iflasta iflas idaresi<\/b>, <b>mahkeme kararıyla<\/b> sona ermede <b>mahkeme<\/b>, diğer tüm hallerde <b>yönetim kurulu<\/b>. Ardından tasfiye başlar.<\/li>\n<li>Şirket, pay sahipleriyle ilişkileri dahil, tasfiye sonuna kadar <b>tüzel kişiliğini korur<\/b> ve unvanını <b>\"tasfiye hâlinde\"<\/b> ibaresiyle kullanır; organların yetkileri <b>tasfiye amacıyla sınırlıdır<\/b> (m.533/2).<\/li>\n<li>Organlar, tasfiye için zorunlu olup tasfiye memurlarınca yapılamayan işlerle sınırlanır. Tasfiye işleriyle ilgili konularda genel kurulu <b>tasfiye memurları<\/b> çağırır.<\/li>\n<\/ul>\n<h4>Tasfiye memurları (m.536–539)<\/h4>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><\/tr>\n<tr><td>Atama<\/td><td>Esas sözleşme veya genel kurul kararıyla; atanmazsa tasfiyeyi <b>yönetim kurulu<\/b> yapar (m.536/1). Mahkeme fesih kararı verdiyse tasfiye memurunu <b>mahkeme<\/b> atar<\/td><\/tr>\n<tr><td>Kimler<\/td><td>Pay sahiplerinden veya üçüncü kişilerden olabilir; aksi öngörülmemişse <b>olağan ücrete<\/b> hak kazanır<\/td><\/tr>\n<tr><td>Tescil<\/td><td>Yönetim kurulu tasfiye memurlarını tescil ve ilan ettirir (tasfiyeyi yönetim kurulu yapıyorsa da)<\/td><\/tr>\n<tr><td>Vatandaşlık<\/td><td>Temsile yetkili tasfiye memurlarından <b>en az biri Türk vatandaşı<\/b> ve yerleşim yeri <b>Türkiye<\/b>'de olmalı (m.536/4). Hiçbiri değilse pay sahiplerinden, alacaklılardan birinin veya Bakanlığın istemiyle mahkeme uygun birini atar<\/td><\/tr>\n<tr><td>Görevden alma<\/td><td>Esas sözleşme veya genel kurulca atananları ve bu görevi yapan yönetim kurulu üyelerini genel kurul <b>her zaman<\/b> görevden alabilir; <b>mahkemece atananları genel kurul alamaz<\/b>. Bir pay sahibinin istemiyle ve haklı sebeple mahkeme de görevden alıp yenisini atayabilir (m.537)<\/td><\/tr>\n<tr><td>Yetki devri<\/td><td>Kanuni yetkiler devredilemez; belirli uygulama işlemleri için bir tasfiye memuru diğerine veya üçüncü kişiye temsil yetkisi verebilir (m.539)<\/td><\/tr>\n<tr><td>Aktiflerin satışı<\/td><td>Genel kurul aksini kararlaştırmamışsa <b>pazarlıkla<\/b> satış mümkün; <b>önemli miktarda aktifin toptan satışı<\/b> için genel kurul kararı ve sermayenin en az <b>yüzde 75<\/b>'inin olumlu oyu gerekir (sonraki toplantılarda da aynı nisap) (m.538)<\/td><\/tr>\n<\/table>\n<h4>Tasfiye işlemleri<\/h4>\n<ol>\n<li>Tasfiye başlangıcındaki durumu incelemek; gerekirse uzmanlara değer biçtirerek <b>envanter ve bilanço<\/b> düzenlemek; bilançoyu <b>genel kurulun onayına<\/b> sunmak; ardından mallara, belgelere ve defterlere el koymak.<\/li>\n<li><b>Alacaklılara çağrı<\/b>: bilinen ve adresi belli alacaklılara <b>taahhütlü mektup<\/b>; diğerlerine TTSG'de, internet sitesinde ve esas sözleşmedeki şekilde <b>birer hafta arayla üç ilan<\/b>.<\/li>\n<li>Bildirimde bulunmayan bilinen alacaklıların alacak tutarı <b>Bakanlıkça belirlenen bir bankaya<\/b> depo edilir. Henüz muaccel olmayan veya çekişmeli borçları karşılayacak para <b>notere<\/b> depo edilir (yeterli teminat varsa veya paylaşım bu borçların ödenmesi şartına bağlanmışsa gerekmez). Aykırı davranan tasfiye memurları haksız ödemelerden m.553'e göre sorumludur.<\/li>\n<\/ol>\n<table>\n<tr><th>Diğer tasfiye işleri (m.542)<\/th><\/tr>\n<tr><td>Süregelen işleri tamamlamak, ödenmemiş pay bedellerini tahsil etmek, aktifleri paraya çevirmek, borçlar varlığı aşmıyorsa borçları ödemek<\/td><\/tr>\n<tr><td>Tasfiyenin gerektirmediği <b>yeni işlem yapmamak<\/b><\/td><\/tr>\n<tr><td>Borçlar varlığı aşıyorsa durumu <b>derhal asliye ticaret mahkemesine<\/b> bildirmek; mahkeme <b>iflasın açılmasına<\/b> karar verir<\/td><\/tr>\n<tr><td>Mal ve hakları düzenli bir yönetici gibi korumak, tasfiyeyi en kısa sürede bitirmek<\/td><\/tr>\n<tr><td>Tasfiye uzarsa <b>her yılsonu<\/b> tasfiye finansal tablolarını, sonunda <b>kesin bilançoyu<\/b> genel kurula sunmak<\/td><\/tr>\n<tr><td>Gerekli defterleri tutmak; harcama ihtiyacı dışındaki paraları şirket adına <b>bankaya<\/b> yatırmak<\/td><\/tr>\n<tr><td><b>Vadesi gelmemiş borçları<\/b>, TCMB'nin kısa vadeli kredilere uyguladığı oranla <b>iskonto ederek derhal ödemek<\/b>; alacaklılar kabul etmek zorundadır (kanunen iskonto edilemeyenler hariç)<\/td><\/tr>\n<tr><td>Pay sahiplerine tasfiye hakkında bilgi ve istenirse imzalı belge vermek<\/td><\/tr>\n<\/table>\n<h4>Kalan varlığın dağıtımı ve terkin<\/h4>\n<ul>\n<li>Borçlar ödenip <b>pay bedelleri<\/b> geri verildikten sonra kalan varlık, esas sözleşmede aksi yoksa pay sahipleri arasında <b>ödedikleri sermaye ve imtiyaz hakları oranında<\/b> dağıtılır (m.543); tasfiye payında imtiyaz varsa esas sözleşmeye göre önce onlar tatmin edilir.<\/li>\n<li>Alacaklılara <b>üçüncü çağrıdan itibaren üç ay<\/b> geçmedikçe dağıtım yapılamaz; alacaklılar için tehlike yoksa mahkeme daha önce izin verebilir.<\/li>\n<li>Esas sözleşme veya genel kurul kararında aksine hüküm yoksa dağıtım <b>para olarak<\/b> yapılır.<\/li>\n<li><b>Terkin<\/b> (m.545): tasfiye bitince tasfiye memurları unvanın sicilden silinmesini ister; silinme tescil ve ilan edilir ve tüzel kişilik sona erer. İİK m.44 ve 337/a bu şirketlere uygulanmaz.<\/li>\n<\/ul>\n\n<h3>Ek tasfiye (geçici ihya, m.547)<\/h3>\n<ul>\n<li>Tasfiye kapandıktan sonra ek tasfiye işlemleri zorunlu görülürse, şirket merkezindeki asliye ticaret mahkemesinden şirketin <b>yeniden tescili<\/b> istenir. Ek tasfiye <b>geçici bir tedbirdir<\/b>; yeni hukuki durum yaratmaz, ihmal edilen işler yapılınca şirket yine sona erer.<\/li>\n<li><b>İsteyebilecekler (sınırlı sayıda)<\/b>: <b>son tasfiye memurları<\/b>, <b>yönetim kurulu üyeleri<\/b>, <b>pay sahipleri<\/b> ve <b>alacaklılar<\/b>. <b>Denetçiler<\/b> ve <b>sicil memuru<\/b> isteyemez (sicil memuru yalnız ilgilileri zorlayabilir).<\/li>\n<li>Örnek haller: dağıtımda unutulan veya sonradan ortaya çıkan aktif; şirket lehine çözülen çekişmeli borcun karşılığının boşta kalması; dağıtımda kanuna uyulmaması; haksız alınan tasfiye paylarının geri istenmesi; organlara sorumluluk davası; yapılması gereken açıklamalar; şirket lehine dava veya şirket aleyhine dava ya da icra takibi.<\/li>\n<li>Üç şart: <b>korunmaya değer menfaat<\/b> (inandırıcı delil yeterli, kesin ispat şart değil); yeniden tescilin amaca ulaşmada <b>tek yol<\/b> olması; sicilden silme kararının <b>iptalinin dava edilmesi<\/b>.<\/li>\n<li>Mahkeme kabul ederse yeniden tescile karar verir ve <b>son tasfiye memurlarını veya yeni kişileri<\/b> tasfiye memuru olarak atayıp tescil ve ilan ettirir; atama yapılmadan yalnız ihya kararı verilemez. Ret kararına karşı temyiz yolu açıktır.<\/li>\n<li>Ek tasfiye kararının tescili <b>bildiricidir<\/b>; şirket tüzel kişiliğini yeniden kazanır ama yine <b>tasfiye şirketidir<\/b>. Alacaklılara <b>yeniden çağrı ve bloke yılı gerekmez<\/b>. Yol <b>emredicidir<\/b>; esas sözleşme veya genel kurul kararıyla ayrılınamaz.<\/li>\n<li>TTK geçici m.7: sicil müdürlüğünce resen silinen şirketlerin alacaklıları ve hukuki menfaati olanlar haklı sebeple ihya isteyebilir.<\/li>\n<\/ul>\n\n<h3>Tasfiyeden dönme (m.548)<\/h3>\n<ul>\n<li>Şirket <b>sürenin dolmasıyla<\/b> veya <b>genel kurul kararıyla<\/b> sona ermişse, pay sahipleri arasında <b>malvarlığının dağıtımına başlanmadıkça<\/b>, genel kurul şirketin devamına karar verebilir.<\/li>\n<li>Nisap: sermayenin en az <b>yüzde 60<\/b>'ının olumlu oyu; esas sözleşme <b>ağırlaştırabilir<\/b>.<\/li>\n<li>Cüzi bir pay bedeli veya tasfiye payı iadesi bile dönmeyi imkânsız kılar; iade edilen edimlerin geri alınması da durumu değiştirmez; buna rağmen alınan karar <b>batıldır<\/b>. Sona ermeden önce alınmış bir karara dayanan kâr dağıtımı ise engel değildir.<\/li>\n<li>Genel kurulu <b>yönetim kurulu, denetçiler veya tasfiye memurları<\/b> çağırır; olağan veya olağanüstü toplantıda görüşülebilir. Gerekçeye göre tasfiyeden dönme kararı <b>esas sözleşme değişikliği değildir<\/b>.<\/li>\n<li>Kararı <b>tasfiye memuru<\/b> tescil ve ilan ettirir; bu tescil <b>kurucudur<\/b>.<\/li>\n<li><b>Zımni dönme<\/b>: iflasla sona eren şirkette iflas kaldırılmışsa veya iflas konkordatoyla sona ermişse şirket devam eder; tasfiye memuru iflasın kaldırıldığını, dağıtıma başlanmadığını gösteren belgeyle birlikte tescil ettirir.<\/li>\n<\/ul>\n<table>\n<tr><th>Karşılaştırma<\/th><th>Ek tasfiye<\/th><th>Tasfiyeden dönme<\/th><\/tr>\n<tr><td>Zaman<\/td><td>Tasfiye kapanıp şirket silindikten sonra<\/td><td>Tasfiye sürerken, dağıtıma başlanmadan<\/td><\/tr>\n<tr><td>Karar mercii<\/td><td>Asliye ticaret mahkemesi<\/td><td>Genel kurul (sermayenin yüzde 60'ı)<\/td><\/tr>\n<tr><td>Tescilin niteliği<\/td><td>Bildirici<\/td><td>Kurucu<\/td><\/tr>\n<tr><td>Sonuç<\/td><td>Şirket yine tasfiye şirketi<\/td><td>Şirket kâr amacına geri döner<\/td><\/tr>\n<\/table>\n", "sorular": [{"q": "Aşağıdakilerden hangisi TTK m.529'da sayılan genel sona erme sebeplerinden biri değildir?", "o": ["Yönetim kurulu başkanının iflası", "Esas sözleşmedeki sürenin dolması", "İşletme konusunun gerçekleşmesinin imkânsız hâle gelmesi", "Şirketin iflasına karar verilmesi", "Esas sözleşmede öngörülen bir sona erme sebebinin gerçekleşmesi"], "a": 0, "e": "Yönetim kurulu başkanının kişisel iflası şirketi sona erdirmez; şirketin kendi iflası sona erme sebebidir."}, {"q": "Anonim şirketin genel kurul kararıyla sona ermesi için gereken nisap hangisidir?", "o": ["Sermayenin dörtte biriyle toplanıp çoğunlukla karar", "Sermayenin yarısıyla toplanıp çoğunlukla karar", "Sermayenin yüzde altmışının olumlu oyu", "Sermayenin en az yüzde yetmiş beşinin olumlu oyu", "Oybirliği"], "a": 3, "e": "m.529 m.421/3–4'e atıf yapar: sermayenin en az yüzde yetmiş beşi."}, {"q": "Esas sözleşmedeki süresi dolan bir şirket işlerine fiilen devam ederek belirsiz süreli hâle gelmişse ne olur?", "o": ["Şirket kendiliğinden sona erer", "Şirket sürenin dolmasıyla sona ermiş sayılmaz", "Şirket mahkeme kararıyla feshedilir", "Şirket tasfiyeye girer", "Şirket limited şirkete dönüşür"], "a": 1, "e": "m.529/1-a: sürenin dolması, işlere fiilen devam edilerek belirsiz süreli hâle gelinmemişse sona erme sebebidir."}, {"q": "Organ eksikliği nedeniyle feshe (m.530) ilişkin hangisi yanlıştır?", "o": ["Durum uzun süreden beri devam etmelidir", "Pay sahipleri, alacaklılar veya Ticaret Bakanlığı isteyebilir", "Mahkeme yönetim kurulunu dinler ve durumu düzeltmesi için süre verir", "Genel kurul açısından ölçüt toplanamamadır", "Organ eksikliği şirketi kendiliğinden sona erdirir"], "a": 4, "e": "Şirket kendiliğinden sona ermez; mahkemenin verdiği süre içinde durum düzeltilmezse mahkeme fesih kararı verir."}, {"q": "Halka açık bir şirkette haklı sebeple fesih davası açabilmek için pay sahiplerinin sermayenin en az ne kadarını temsil etmesi gerekir?", "o": ["Yüzde bir", "Yüzde on", "Yüzde beş", "Yüzde yirmi", "Yüzde yirmi beş"], "a": 2, "e": "m.531: halka açık olmayanda onda bir, halka açıkta yirmide bir; esas sözleşme daha düşük oran öngörebilir."}, {"q": "Esas sermayesi 25 milyon lira olan halka açık olmayan bir şirkette, esas sözleşmede daha düşük oran yoksa, haklı sebeple fesih davası için en az ne kadarlık payın davacılarda bulunması gerekir?", "o": ["2,5 milyon lira", "1,25 milyon lira", "5 milyon lira", "6,25 milyon lira", "12,5 milyon lira"], "a": 0, "e": "Onda bir: 25 / 10 = 2,5 milyon lira; bu oran tek kişide toplanmak zorunda değildir."}, {"q": "Haklı sebeple fesih davasında mahkemenin yetkisine ilişkin hangisi doğrudur?", "o": ["Sebepleri haklı bulursa fesih kararı vermek zorundadır", "Yalnız davayı reddedebilir veya kabul edebilir", "Ticaret Bakanlığının onayıyla karar verir", "Fesih yerine davacılara payların gerçek değerinin ödenip şirketten çıkarılmalarına veya kabul edilebilir başka bir çözüme karar verebilir", "Yalnız tazminata hükmedebilir"], "a": 3, "e": "m.531: mahkeme fesih yerine gerçek değer ödenerek çıkarma veya duruma uygun başka bir çözüme karar verebilir."}, {"q": "Aşağıdakilerden hangisi öğretide haklı sebep olarak kabul edilmez?", "o": ["Bilgi alma hakkının sürekli engellenmesi", "Gelecekte zarar edileceğine dair olumsuz beklenti", "Şirketin sürekli zarar etmesi", "Genel kurulun defalarca kanuna aykırı çağrılması", "Dağıtılan kâr payının düzenli olarak azalması"], "a": 1, "e": "Varsayımlar ve olumsuz beklentiler haklı sebep sayılmaz."}, {"q": "Kamu düzenine aykırı faaliyet gösteren bir şirket hakkında Ticaret Bakanlığı fesih davasını hangi süre içinde açabilir?", "o": ["Öğrenmeden itibaren üç ay", "Öğrenmeden itibaren altı ay", "Faaliyetten itibaren beş yıl", "Süresiz", "Öğrenmeden itibaren bir yıl"], "a": 4, "e": "m.210/3: işlem, hazırlık veya faaliyetin öğrenilmesinden itibaren bir yıl içinde."}, {"q": "Mahkeme kararıyla sona eren bir anonim şirkette sona ermenin tescil ve ilanını kim sağlar?", "o": ["Yönetim kurulu", "İflas idaresi", "Kararı veren mahkeme", "Ticaret Bakanlığı", "Genel kurul"], "a": 2, "e": "İflasta iflas idaresi, mahkeme kararıyla sona ermede mahkeme, diğer hallerde yönetim kurulu."}, {"q": "Tasfiye hâlindeki anonim şirkete ilişkin hangisi yanlıştır?", "o": ["Tüzel kişilik sona erme kararının tescil edildiği anda sona erer", "Tüzel kişiliğini tasfiye sonuna kadar korur", "Unvanını tasfiye hâlinde ibaresiyle kullanır", "Organların yetkileri tasfiye amacıyla sınırlıdır", "Tasfiyeyle ilgili konularda genel kurulu tasfiye memurları çağırır"], "a": 0, "e": "Tüzel kişilik tasfiye bitip şirket sicilden terkin edilince sona erer."}, {"q": "Esas sözleşme veya genel kurul kararıyla tasfiye memuru atanmamışsa tasfiyeyi kim yapar?", "o": ["Ticaret Bakanlığı", "Asliye ticaret mahkemesi", "Denetçi", "Yönetim kurulu", "En çok paya sahip pay sahibi"], "a": 3, "e": "m.536/1: tasfiye memuru atanmamışsa tasfiyeyi yönetim kurulu yapar."}, {"q": "Tasfiye memurlarına ilişkin hangisi yanlıştır?", "o": ["Pay sahiplerinden veya üçüncü kişilerden olabilir", "Mahkemece atanan tasfiye memurlarını genel kurul her zaman görevden alabilir", "Temsile yetkili tasfiye memurlarından en az biri Türk vatandaşı olup Türkiye'de yerleşmiş olmalıdır", "Haklı sebeple bir pay sahibinin istemiyle mahkeme görevden alabilir", "Kanunla tanınan yetkiler devredilemez"], "a": 1, "e": "m.537: mahkemece atanan tasfiye memurları genel kurulca görevden alınamaz."}, {"q": "Tasfiye sırasında önemli miktarda aktifin toptan satışı için hangisi gerekir?", "o": ["Tasfiye memurlarının kararı yeterlidir", "Mahkeme izni", "Alacaklıların oybirliği", "Ticaret Bakanlığı izni", "Genel kurulun sermayenin en az yüzde yetmiş beşinin olumlu oyuyla alacağı karar"], "a": 4, "e": "m.538: pazarlıkla satış kural olarak serbesttir; önemli miktarda aktifin toptan satışı genel kurulun yüzde yetmiş beşlik kararını gerektirir."}, {"q": "Tasfiyede alacaklılara yapılacak çağrıya ilişkin hangisi doğrudur?", "o": ["Yalnız TTSG'de bir ilan", "Yedişer gün arayla iki ilan", "Bilinen alacaklılara taahhütlü mektup, diğerlerine TTSG, internet sitesi ve esas sözleşmedeki şekilde birer hafta arayla üç ilan", "Onar gün arayla üç ilan ve mahkeme duyurusu", "Yalnız internet sitesinde duyuru"], "a": 2, "e": "Tasfiyede bilinen alacaklılara taahhütlü mektup gönderilir, diğerleri birer hafta arayla üç ilanla çağrılır."}, {"q": "Bildirimde bulunmayan bilinen alacaklıların alacak tutarı ne yapılır?", "o": ["Ticaret Bakanlığınca belirlenecek bir bankaya depo edilir", "Pay sahiplerine dağıtılır", "Hazineye gelir kaydedilir", "Notere bırakılmadan tasfiye memurunda tutulur", "Alacak düşmüş sayılır"], "a": 0, "e": "Bilinen ama bildirimde bulunmayan alacaklıların alacak tutarı Bakanlıkça belirlenen bir bankaya; muaccel olmayan veya çekişmeli borçların karşılığı ise notere depo edilir."}, {"q": "Tasfiye sırasında şirket borçlarının varlığı aştığı anlaşılırsa tasfiye memurları ne yapar?", "o": ["Pay sahiplerinden ek ödeme ister", "Tasfiyeyi durdurup şirketi yeniden faaliyete geçirir", "Alacakları eşit oranda indirir", "Durumu derhal asliye ticaret mahkemesine bildirir ve mahkeme iflasın açılmasına karar verir", "Genel kurulu toplayıp sermaye artırır"], "a": 3, "e": "m.542: borçlar varlığı aşarsa durum derhal mahkemeye bildirilir ve mahkeme iflasın açılmasına karar verir."}, {"q": "Tasfiye memurlarının vadesi gelmemiş şirket borçlarını ödemesine ilişkin hangisi doğrudur?", "o": ["Vadeyi beklemek zorundadırlar", "TCMB'nin kısa vadeli kredilere uyguladığı oran üzerinden iskonto ederek derhal öderler ve alacaklılar kabul etmek zorundadır", "Alacaklının rızası olmadan erken ödeme yapılamaz", "Yasal faiz oranıyla iskonto ederler", "Bu borçlar notere depo edilip vadede ödenir"], "a": 1, "e": "m.542: TCMB'nin kısa vadeli kredi oranıyla iskonto edilerek derhal ödenir; kanunen iskonto edilemeyenler hariçtir."}, {"q": "Tasfiye sonucunda kalan varlığın dağıtımına ilişkin hangisi yanlıştır?", "o": ["Önce borçlar ödenir ve pay bedelleri geri verilir", "Kalan varlık esas sözleşmede aksi yoksa ödenen sermaye ve imtiyaz hakları oranında dağıtılır", "Alacaklılara üçüncü çağrıdan itibaren üç ay geçmeden kural olarak dağıtım yapılamaz", "Dağıtım, aksine hüküm yoksa para olarak yapılır", "Mahkeme hiçbir koşulda üç ay dolmadan dağıtıma izin veremez"], "a": 4, "e": "Alacaklılar için tehlike yoksa mahkeme üç ay dolmadan da dağıtıma izin verebilir (m.543)."}, {"q": "Alacaklılara üçüncü çağrı 5 Haziran'da yapılmıştır. Mahkeme izni yoksa kalan varlık en erken ne zaman dağıtılabilir?", "o": ["5 Temmuz", "5 Ağustos", "5 Eylül", "5 Aralık", "5 Haziran'dan bir yıl sonra"], "a": 2, "e": "Üçüncü çağrıdan itibaren üç ay geçmesi gerekir: 5 Haziran + 3 ay = 5 Eylül."}, {"q": "Aşağıdakilerden hangisi ek tasfiye için şirketin yeniden tescilini isteyebilecek kişilerden değildir?", "o": ["Denetçiler", "Son tasfiye memurları", "Yönetim kurulu üyeleri", "Pay sahipleri", "Alacaklılar"], "a": 0, "e": "m.547 isteyebilecekleri sınırlı sayar; denetçiler ve sicil memuru ek tasfiye isteyemez."}, {"q": "Ek tasfiyeye ilişkin hangisi yanlıştır?", "o": ["Geçici bir tedbirdir", "Ek tasfiye kararının tescili bildiricidir", "Şirket yine tasfiye şirketidir", "Alacaklılara yeniden çağrı yapılması ve bloke yılı zorunludur", "Esas sözleşme ile bu usulden ayrılınamaz"], "a": 3, "e": "Ek tasfiyede alacaklılara yeniden çağrı ve bloke yılına gerek yoktur."}, {"q": "Ek tasfiye için aranan şartlardan biri hangisi değildir?", "o": ["Korunmaya değer bir menfaat", "Menfaatin kesin delille ispatı", "Yeniden tescilin amaca ulaşmada tek yol olması", "Sicilden silme kararının iptalinin dava edilmesi", "İstemin inandırıcı delillere dayanması"], "a": 1, "e": "İstem ve delillerin inandırıcı olması yeterlidir; kesin ispat şart değildir."}, {"q": "Tasfiyeden dönmeye ilişkin hangisi yanlıştır?", "o": ["Şirket sürenin dolmasıyla veya genel kurul kararıyla sona ermişse mümkündür", "Pay sahipleri arasında malvarlığının dağıtımına başlanmamış olmalıdır", "Sermayenin en az yüzde altmışının olumlu oyu gerekir", "Kararın tescili kurucu niteliktedir", "Karar tasfiye memurlarının oybirliğiyle alınır"], "a": 4, "e": "Tasfiyeden dönme kararını genel kurul alır; tasfiye memuru yalnız kararı tescil ve ilan ettirir."}, {"q": "Esas sermayesi 50 milyon lira olan bir şirkette, esas sözleşmede ağırlaştırıcı hüküm yoksa tasfiyeden dönme kararı için en az ne kadar sermayeyi temsil eden payların olumlu oyu gerekir?", "o": ["12,5 milyon lira", "25 milyon lira", "30 milyon lira", "37,5 milyon lira", "50 milyon lira"], "a": 2, "e": "m.548: sermayenin en az yüzde altmışı: 50 x 0,60 = 30 milyon lira. 37,5 milyon lira genel kurul kararıyla sona erme için gereken yüzde yetmiş beşe karşılık gelir."}]}];
const P={"1": ["Merhaba, Ticaret Hukukunun ilk bölümündeyiz. Bugün ticaret şirketlerinin türlerini, hepsinde ortak olan özellikleri ve sermaye koyma borcunu konuşacağız. Bu bölüm kısa görünür ama sınavda sayı ve madde sorusu çok çıkar. O yüzden rakamlara özellikle dikkat et.", "Önce temel liste. Türk Ticaret Kanunu ticaret şirketlerini beş türle sınırlar. Kollektif, komandit, anonim, limited ve kooperatif. Kanun burada ibarettir der. Bu kelime çok önemli, çünkü sınırlı sayı ilkesinin dayanağı budur.", "Şimdi sınıflandırmaya bak. Kollektif ve komandit şahıs şirketidir. Anonim, limited ve sermayesi paylara bölünmüş komandit şirket ise sermaye şirketidir. Peki kooperatif nerede? Burada dur bir saniye. Kooperatif ticaret şirketi sayılır ama bu ikili ayrımın dışında bırakılmıştır. Sınavda tam bu tuzak gelir.", "Kanunda boşluk varsa ne olur? Türk Ticaret Kanunu bu durumda Medeni Kanunun tüzel kişilere ilişkin genel hükümlerini ve Borçlar Kanununun adi şirket hükümlerini devreye sokar. Adi şirket hükümleri altı yüz yirminci ile altı yüz kırk beşinci maddeler arasındadır.", "Ortak özelliklere geçelim. Birincisi tüzel kişilik. Bütün ticaret şirketleri tüzel kişidir. Adi şirketin ise tüzel kişiliği yoktur. Tüzel kişilik sayesinde şirket kendi malvarlığına, ticaret unvanına, tabiiyete ve ehliyete sahip olur. Yani anonim şirket ortaklarından ayrı olarak borçlanabilir.", "İkinci özellik sınırlı sayı ilkesi. Kanunda sayılanlar dışında yeni bir şirket tipi kuramazsın. İki türün özelliklerini karıştırıp karma bir tip de yaratamazsın. Peki ayırt edici nitelikleri taşımayan bir ortaklık kurulursa ne olur? Borçlar Kanunu gereği adi ortaklık sayılır.", "Üçüncü özellik çok sorulur. Ultra vires teorisinin kaldırılması. Eski kanunda şirketin ehliyeti işletme konusuyla sınırlıydı. Konu dışı işlem yok hükmündeydi. Yeni kanun bu teoriyi Avrupa düzenlemelerine paralel olarak terk etti. Artık ticaret şirketleri, yaş ve cinsiyet gibi insana özgü nitelikler dışında bütün haklara ehildir.", "Anonim şirkette bunun özel bir görünümü var. Temsilcinin işletme konusu dışında yaptığı işlem de şirketi bağlar. Ancak üçüncü kişinin bunu bildiği ya da bilebilecek durumda olduğu ispat edilirse durum değişir. O zaman işlemin iptali istenebilir. Burada bir tuzak var. Esas sözleşmenin ilan edilmiş olması tek başına yeterli delil değildir. Ayrıca işletme konusu esas sözleşmede yazmaya devam eder.", "Dördüncü özellik elektronik kurullar. Şirket sözleşmesinde düzenlenmişse yönetim kurulu, müdürler kurulu ve genel kurul elektronik ortamda yapılabilir. Elektronik katılım fiziki katılımla aynı sonucu doğurur. Nisaplar da aynen uygulanır. Akılda tut, borsaya kote şirketlerde elektronik genel kurul zorunludur, diğerlerinde ise tercihe bağlıdır.", "Sermaye koyma borcuna geçelim. Şirketin beş klasik unsuru vardır. Kişi, sözleşme, sermaye, ortak amaç ve ortak amaç için birlikte çaba. Sermaye unsur olduğu için ortaklar onu getirmek zorundadır. Asgari sermaye ise yalnız anonim ve limited şirketlerde aranır.", "Rakamları birlikte ezberleyelim. Esas sermaye sistemindeki anonim şirkette iki yüz elli bin lira. Kayıtlı sermaye sistemindeki halka kapalı şirkette beş yüz bin lira. Limited şirkette elli bin lira. Halka açık kayıtlı sermayeli ortaklıkta ise kitap iki bin yirmi beş için yüz elli milyon, iki bin yirmi altı için iki yüz milyon lira der.", "Sermaye olarak ne getirilebilir? Kanun örnek olarak sayar. Para, alacak, kıymetli evrak, fikri mülkiyet, taşınır ve taşınmaz, kişisel emek, ticari itibar, ticari işletme, elektronik alan adları ve maden ruhsatı gibi değerler. Ama anonim şirkette istisna var. Hizmet edimi, kişisel emek, ticari itibar ve vadesi gelmemiş alacak anonim şirkete sermaye olamaz. Bunu bir şirket kuran mühendis örneğiyle düşün. Bilgisini ve emeğini sermaye diye koyamaz.", "Ayni sermayede bilirkişi şarttır. Şirket merkezinin bulunduğu yerdeki asliye ticaret mahkemesi bilirkişi atar. Kurucular ve menfaat sahipleri rapora itiraz edebilir. Mahkemenin onayladığı bilirkişi kararı ise kesindir.", "Türlere göre özel kurallar var. Taşınmazda resmi şekil aranmaz. Taşınmaz tapuya şerh verildiği anda ayni sermaye sayılır. Şirketin onu satabilmesi için ise tapuya tescil gerekir. Taşınır güvenilir bir kişiye tevdi edilir. Fikri mülkiyet hakları özel siciline kaydedilir. Alacak ise şirketçe tahsil edilmedikçe ortağı borçtan kurtarmaz. Tahsil süresi bir aydır.", "Nakdi sermayede altın kural şu. Payların itibari değerinin en az yüzde yirmi beşi tescilden önce ödenir. Kalanı tescilden sonraki yirmi dört ay içinde ödenir. Çıkarma primi ise tamamen tescilden önce ödenir. Para, Bankacılık Kanununa tabi bir bankada şirket adına açılan özel hesaba yatırılır. Noter onayından itibaren üç ay içinde tüzel kişilik kazanılamazsa para geri verilir.", "Sermaye Piyasası Kanunu ise halka arzda payların tamamen ve nakden ödenmesini ister. Türk Ticaret Kanunundaki halka arzlı kuruluş hükmü de halka açık şirketlere ve halka açılmak için başvuranlara uygulanmaz. Bunu sınavda bir istisna sorusu olarak görebilirsin.", "Ortak borcunu ödemezse ne olur? Şirket ifa davası açar. Bu bir eda davasıdır. Şahıs şirketlerinde ortaklar da bu davayı açabilir. Anonim şirkette ise davayı yalnız şirket açar. Ayrıca ihtarla tazminat, temerrüt faizi ve kurucuların isteyebileceği ihtiyati tedbir de var.", "Anonim şirkete özgü yaptırım ıskattır. Yönetim kurulu ilanla bir aylık süre verir. Ödeme gelmezse pay sahibini haklarından yoksun bırakır ve payı başkasına satar. Ama yalnız ödenmeyen paylar için. Iskat edilen kişi, yeni alıcının ödemesinden açık kalan tutardan sorumlu kalır. Sözleşme cezası ise ancak esas sözleşmede yazıyorsa istenir.", "Toparlayalım. Birincisi, ticaret şirketi beş türdür ve kooperatif şahıs ile sermaye ayrımının dışındadır. İkincisi, ultra vires kalktı, konu dışı işlem iyi niyetli üçüncü kişiye karşı şirketi bağlar. Üçüncüsü, asgari sermaye esas sistemde iki yüz elli bin, kayıtlı sistemde beş yüz bin, limitedde elli bin liradır. Dördüncüsü, nakdi payın yüzde yirmi beşi tescilden önce, kalanı yirmi dört ayda ödenir. Beşincisi, ıskat süresi bir aydır ve yetki yönetim kurulundadır."], "2": ["Merhaba, şimdi şirketlerin yapısal değişikliklerine geçiyoruz. Birleşme, bölünme ve tür değiştirme. Bu bölüm nisap ve süre sorularıyla dolu. Kafanda üç ayrı çekmece açarak dinle. Her işlemin kendi süresi ve kendi oy oranı var.", "Önce genel resim. Bu konular Türk Ticaret Kanununun yüz otuz dördüncü ile yüz doksan dördüncü maddeleri arasında düzenlenir. Halka açık şirketlerde bu işlemler Sermaye Piyasası Kanununa göre önemli nitelikte işlem sayılır. Ayrıca bir ticari işletme, bir ticaret şirketi tarafından devralınarak onunla birleşebilir. Bu da kanunun özel bir istisnasıdır.", "Birleşmenin iki türü var. Devralma şeklinde birleşme ve yeni kuruluş şeklinde birleşme. İkisinde de malvarlığı tasfiye edilmeden bütün halinde geçer. Ortaklar da değişim oranına göre yeni pay alır.", "Kim kiminle birleşir? Şöyle düşün. Şahıs şirketi büyük bir sermaye şirketini yutamaz, ama onun tarafından yutulabilir. Yani kollektif ve komandit şirket, sermaye şirketiyle ancak devrolunan olarak birleşir. Kooperatif ise sermaye şirketleriyle serbestçe birleşir, şahıs şirketini de devralabilir.", "Ortakların korunması burada kilit ilke. Devrolunan şirketin ortağı, payının değerini karşılayan yeni pay ister. Değişim oranını tutturmak için denkleştirme ödemesi yapılabilir. Ama bu ödeme payların gerçek değerinin onda birini aşamaz. Ayrıca ortaklara pay yerine ayrılma akçesi seçeneği de sunulabilir.", "Süreç sırayla şöyle ilerler. Görüşmeler, gerekirse ara bilanço, sözleşme, rapor, inceleme hakkı, genel kurul kararı ve tescil. Ara bilanço için eşik altı aydır. Bilanço günü ile sözleşme tarihi arasında altı aydan fazla süre varsa ara bilanço çıkarılır. Fiziki envanter ise gerekmez.", "Birleşme sözleşmesi yazılıdır. Yönetim organları imzalar, genel kurullar onaylar. Birleşme raporunu da yönetim organları hazırlar. Küçük ve orta ölçekli şirketler, bütün ortaklar onaylarsa rapordan ve inceleme hakkından vazgeçebilir. Bunu bir aile şirketi örneğiyle düşün. Herkes zaten her şeyi biliyor.", "Şimdi sürelere dikkat. Birleşmede inceleme hakkı genel kurul kararından önceki otuz gün içinde sağlanır. Bölünmede ise bu süre iki aydır. Tür değiştirmede yine otuz gündür. İncelemeye son üç yılın finansal tabloları ve faaliyet raporları da sunulur. Kopyalar ücretsizdir.", "Nisaplara gelelim. Anonim şirkette birleşme kararı için sermayenin çoğunluğu toplantıda temsil edilmeli. Karar ise mevcut oyların dörtte üçüyle alınır. Limited şirkette sermayenin en az dörtte üçünü temsil eden ortakların dörtte üçü gerekir. Kollektif ve komanditte oybirliği aranır. Sözleşmeyle bu, dörtte üçe indirilebilir.", "Bir de özel durumlar var. Sözleşme yalnız ayrılma akçesi veriyorsa yüzde doksan gerekir. Bunu sınavda çok soruyorlar. Ayrıca bir şirket diğerinin tüm oylu paylarına ya da en az yüzde doksanına sahipse kolaylaştırılmış birleşme yapılabilir. Bu durumda rapor ve genel kurul onayı aranmayabilir.", "Birleşme tescille geçerlilik kazanır. Devrolunan şirket tescil anında sona erer. Bütün aktif ve pasifler kendiliğinden devralana geçer. Buna külli halefiyet denir. Alacaklılara ise yedişer gün arayla üç kez ilan yapılır. Üç ay içinde talep eden alacaklıya teminat verilir.", "Bölünmeye geçelim. Tam bölünmede şirket bütün malvarlığını dağıtır ve sona erer. Kısmi bölünmede ise bir parçayı devreder ve yaşamaya devam eder. Kısmi bölünmenin iki modeli var. İştirak modelinde payları bölünen şirketin kendisi alır. Ortaklara pay devri modelinde ise paylar ortaklara gider.", "Bölünmede kural net. Sermaye şirketleri ve kooperatifler yalnız sermaye şirketlerine ve kooperatiflere bölünebilir. Anonim şirket şahıs şirketine bölünemez. Mevcut şirkete devirde bölünme sözleşmesi yapılır. Yeni şirkete devirde ise bölünme planı hazırlanır, çünkü karşıda imza atacak kimse yoktur.", "Bölünmede de nisaplar birleşmedeki gibidir. Ama bir fark var. Ortakların yeni şirketlerde eski oranlarını koruyamadığı bölünmede, oy hakkı olan ortakların en az yüzde doksanı gerekir. Alacaklılar için yine üç ilan ve üç aylık teminat süresi vardır. Borç kendisine verilen şirket ödemezse diğer şirketler ikinci derecede ve müteselsilen sorumlu olur.", "Tür değiştirmede şirket eskisinin devamıdır. Tasfiye yok, yeni kuruluş yok. Anonim şirket limited şirkete veya kooperatife dönüşebilir. Kooperatif ise yalnız sermaye şirketine dönüşebilir. Kollektif ile komandit arasındaki geçişler daha basit kurallara tabidir.", "Tür değiştirme nisabını birleşmeyle karıştırma. Anonim şirkette sermayenin üçte ikisi toplantıda olmalı. Karar da mevcut oyların üçte ikisiyle alınır. Sermaye şirketi kooperatife dönüşecekse bütün ortakların onayı gerekir. Kollektif ve komanditte oybirliği aranır, sözleşmeyle üçte ikiye indirilebilir.", "Son olarak üç dava. Denkleştirme davasını her ortak açabilir. Süre, kararın ilanından itibaren iki aydır. Giderler kural olarak devralan şirkete aittir. Bu dava işlemin geçerliliğini etkilemez. İptal davasını ise yalnız olumsuz oy verip bunu tutanağa geçirten ortak açabilir. Süre yine iki aydır. Sorumluluk davasında hak düşürücü süre yoktur. Öğrenmeden itibaren iki yıl, her halde beş yıllık zamanaşımı uygulanır.", "Toparlayalım. Birincisi, şahıs şirketi sermaye şirketiyle ancak devrolunan olarak birleşir. İkincisi, denkleştirme ödemesi gerçek değerin onda birini aşamaz. Üçüncüsü, anonim şirkette birleşme ve bölünme dörtte üç, tür değiştirme üçte iki nisabıyla yapılır. Dördüncüsü, inceleme süresi birleşme ve tür değiştirmede otuz gün, bölünmede iki aydır. Beşincisi, denkleştirme ve iptal davası ilandan itibaren iki ay içinde açılır."], "3": ["Merhaba, şirketler topluluğu bölümündeyiz. Burada bir ana şirket ve onun yavru şirketleri arasındaki ilişkileri konuşacağız. Bir holding düşün, altında onlarca şirket var. Kanun bu yapıda azlık pay sahiplerini ve alacaklıları korumaya çalışır. Oranlar ve süreler sınavda çok çıkar.", "Önce hâkimiyet nasıl kurulur ona bakalım. Bir şirket diğerinin oy haklarının çoğunluğuna sahipse hâkimdir. Yönetim organında çoğunluğu seçebiliyorsa yine hâkimdir. Bir sözleşmeyle başka ortaklarla birlikte oy çoğunluğunu sağlıyorsa da hâkimdir. Son olarak bir sözleşme veya başka bir yolla diğerini kontrol edebiliyorsa hâkimdir.", "Hâkimiyet sözleşmesi varsa ticaret siciline tescil ve ilan edilmelidir. Bu, geçerlilik şartıdır. Ama sözleşme geçersiz olsa bile topluluk yükümlülükleri yine uygulanır. Ayrıca payların çoğunluğuna sahip olmak hâkimiyet için bir karinedir.", "Hâkimiyet doğrudan olabilir, bir ara şirket üzerinden dolaylı da olabilir. Hâkim teşebbüs yurt dışında olsa da kurallar uygulanır. Tepede bir gerçek kişi bile olabilir. Burada önemli bir not var. Hâkim teşebbüs tacir sayılır.", "Şimdi sık karıştırılan bir konu. Sermaye Piyasası Kanunundaki yönetim kontrolü. Halka açık bir şirkette oyların yüzde ellisinden fazlasına sahip olmak yönetim kontrolüdür. Yönetim kurulunun salt çoğunluğunu seçme ya da aday gösterme imtiyazı da öyledir. Yönetim kontrolü yalnız halka açık şirketlerde geçerlidir ve pay alım teklifi zorunluluğu doğurur. Hâkimiyet ise bütün şirketlerde geçerlidir.", "Karşılıklı iştirake geçelim. İki sermaye şirketi birbirinin paylarının en az dörtte birine sahipse karşılıklı iştirak vardır. Bu durum yasak değildir. Ama bir şirket bu konuma bilerek girerse haklarının yalnız dörtte birini kullanır. Bedelsiz pay alma hakkı ise korunur. Geri kalan haklar donar.", "Bir örnek verelim. Bir şirket bilerek karşılıklı iştirake girmiş ve sekiz yüz bin oyluk pay almış olsun. Bu paylarla yalnız iki yüz bin oy kullanabilir. Bu paylar toplantı ve karar nisabının hesabında da dikkate alınmaz. Ama yavru şirket ana şirketin payını almışsa bu sınırlama uygulanmaz.", "Bildirim yükümlülüğü çok sorulur. Eşikleri şöyle ezberle. Yüzde beş, on, yirmi, yirmi beş, otuz üç, elli, altmış yedi ve yüz. Bir teşebbüs bu eşiklerden birini geçerse ya da altına düşerse on gün içinde bildirim yapar. Bildirim hem şirkete hem yetkili makamlara gider.", "Yönetim kurulu üyeleri ve yöneticiler de bildirimde bulunur. Bu bildirim kendi paylarını, eşlerinin ve velayetleri altındaki çocuklarının paylarını kapsar. Bu kişilerin sermayesinin en az yüzde yirmisine sahip olduğu şirketler de bildirime dahildir. Bildirim yapılmazsa oy hakkı dahil haklar donar. Bunu unutma.", "Raporlara gelelim. Bağlı şirketin yönetim kurulu, faaliyet yılının ilk üç ayı içinde bir bağlılık raporu hazırlar. Bu raporda ana şirketle yapılan bütün işlemleri ve şirketin zarar görüp görmediğini anlatır. Ana şirketin her pay sahibi de genel kurulda yavru şirketler hakkında bilgi isteyebilir.", "Özel denetim burada farklı işler. Denetçi ya da riskin erken saptanması komitesi hile veya dolan görüşü bildirmişse yavru şirketin her pay sahibi mahkemeden özel denetçi isteyebilir. Azlık payı aranmaz. Önce genel kurula gitmek de gerekmez.", "Ana şirket yüzde doksana ulaşmışsa ve azlık şirketin işleyişini engelliyorsa, azlığın paylarını satın alabilir. Fiyat varsa borsa değeridir. Yoksa kanundaki yönteme göre belirlenir. Buna satın alma hakkı diyoruz.", "Şimdi sorumluluğa geçelim. Ana şirket yavru şirketi kayba uğratamaz. Örneğin yavrunun kârını kendine aktaramaz, ona kefalet verdiremez. Ama kayıp aynı faaliyet yılı içinde telafi edilirse sorun yoktur. En geç yıl sonuna kadar denk bir alacak hakkı tanınması da yeterlidir.", "Telafi yapılmazsa yavru şirketin her pay sahibi ana şirketten ve sorumlu yöneticilerden şirketin zararının ödenmesini ister. Para pay sahibine değil, şirkete ödenir. Alacaklılar da şirket iflas etmemiş olsa bile bunu isteyebilir. Ana şirket şu savunmayı yapabilir. Bağımsız ve özenli bir şirket yöneticisi de aynı işlemi yapardı.", "Birleşme, bölünme ya da fesih gibi büyük kararlarda haklı sebep yoksa farklı bir koruma var. Red oyu verip tutanağa geçirten pay sahibi, tazminat veya paylarının satın alınmasını isteyebilir. Satın almada en az borsa değeri esas alınır. Bu dava iki yılda zamanaşımına uğrar.", "Tam hâkimiyet ise yüzde yüz sahiplik demektir. Bu durumda ana şirket, topluluk politikası gereği zararlı olsa bile yavru şirkete talimat verebilir. Yavru şirket uymak zorundadır. Ama yavrunun ödeme gücünü açıkça aşan ya da varlığını tehlikeye atan talimat verilemez. Talimata uyan yavru şirket yöneticileri sorumlu tutulmaz.", "Son olarak güven sorumluluğu. Ana şirketin itibarı topluma veya tüketiciye güven veren bir seviyedeyse, bu itibarı kullanarak uyandırdığı güvenden sorumludur. Diyelim ki ünlü bir holding, yavru şirketine destek vereceği izlenimini yarattı. Sonra destek vermedi. Haklı olarak güvenen kişi zararını holdingden isteyebilir.", "Toparlayalım. Birincisi, karşılıklı iştirak eşiği dörtte birdir ve bilerek girende haklar dörtte biriyle sınırlanır. İkincisi, bildirim eşikleri yüzde beşten yüze kadardır ve süre on gündür. Üçüncüsü, bağlılık raporu ilk üç ayda hazırlanır. Dördüncüsü, satın alma hakkı yüzde doksanla doğar. Beşincisi, tam hâkimiyet yüzde yüzdür ve talimat yetkisi verir, ama ödeme gücünü aşan talimat yasaktır."], "4": ["Merhaba, anonim şirket bölümüne geldik. Bugün anonim şirketin tanımını, unsurlarını, temel ilkelerini ve sürdürülebilir finansı konuşacağız. Burası Ticaret Hukukunun kalbi. İlkeler kısmı özellikle oran ve yaptırım sorusu üretir.", "Önce tanım. Anonim şirket, sermayesi belirli ve paylara bölünmüş, borçlarından dolayı yalnız malvarlığıyla sorumlu şirkettir. Pay sahipleri ise yalnız taahhüt ettikleri sermaye ile ve yalnız şirkete karşı sorumludur. Bu son ifadeyi aklına kazı.", "Sermayenin belirli olması, önceden tespit edilmiş ve kendiliğinden değişmez olması demektir. Paylara bölünme ise her payın itibari değerle sermayedeki oranını göstermesidir. Yeni kanun hisse senedi yerine pay senedi terimini kullanır. Pay senedi kıymetli evraktır ve aynı zamanda menkul kıymettir.", "Şimdi sorumluluk konusunda bir tuzak. Şirketin sorumluluğu sınırsızdır. Şirket bütün malvarlığıyla borçlarını öder. Sınırlı olan, ortakların sorumluluğudur. Tek borç ilkesi de buradan gelir. Pay sahibi sermayesini ödediyse şirkete karşı başka borcu kalmaz. Alacaklılar ise ödenmeyen sermaye için ortağa dava bile açamaz.", "Peki bu ayrılık kötüye kullanılırsa? İşte burada tüzel kişilik perdesi aralanır. Düz kaldırmada şirketin borcu için ortağa gidilir. Ters kaldırmada ortağın borcu için şirkete gidilir. Yargıtayın bir kararında, borçlu yüzde doksan dokuz ortağı olduğu aile şirketine mal kaçırmıştı. Burada ters kaldırma uygulandı. Çapraz kaldırma ise topluluk içinde bir yavru şirketten ana şirkete, oradan diğer yavruya geçmektir.", "Ticaret unvanında işletme konusu ve anonim şirket ibaresi zorunludur. Unvanda bir gerçek kişinin adı varsa, anonim şirket ibaresi kısaltılamaz. Anonim şirket kanunen yasak olmayan her türlü ekonomik amaç ve konu için kurulabilir. Tek bir pay sahibi de yeterlidir. Ama şirket kendi paylarının tamamını alarak tek ortağı kendisi olamaz.", "Asgari sermayeyi tekrar edelim. Esas sermaye sisteminde iki yüz elli bin lira, kayıtlı sermayeli halka kapalı şirkette beş yüz bin lira. Bu tutarları artırma yetkisi Cumhurbaşkanındadır. Limited şirkette artırım on katla sınırlıdır, anonim şirkette ise bir üst sınır yoktur.", "Ekonomik fonksiyonlar iki tanedir. Birincisi sınırlı sorumluluk, yani girişimcinin cesaretlendirilmesi. İkincisi sermaye birikimi, yani küçük tasarrufların büyük yatırımlara akması. Anonim şirket sermaye piyasasında fon talep eden temel aktördür.", "İlkelere geçelim. Çoğunluk ilkesinde kural salt çoğunluktur. Ama iki karar oybirliği ister. Şirket merkezinin yurt dışına taşınması ve bilanço zararlarını kapatmak için ek yükümlülük konulması. İşletme konusunun tamamen değiştirilmesi, imtiyazlı pay oluşturulması ve nama yazılı payların devrinin sınırlandırılması ise sermayenin yüzde yetmiş beşini ister.", "Sermayenin korunması ilkesi alacaklıyı korur. Sermaye gerçek değeriyle getirilmeli ve ortaklara geri verilmemelidir. Buna aykırı yönetim kurulu ve genel kurul kararları batıldır. Sınavda iptal mi, butlan mı diye sorarlarsa, cevap butlandır.", "Emredicilik ilkesi çok önemli. Esas sözleşme, kanundaki anonim şirket hükümlerinden ancak kanun açıkça izin veriyorsa sapabilir. Yani anonim şirkette kural emrediciliktir. Ama sapma dar yorumlanır. Kanunun hiç düzenlemediği bir konuya, kanuna aykırı olmayan bir hüküm koyabilirsin.", "Şeffaflık ilkesinin en somut aracı internet sitesidir. Kanun ilk halinde bütün sermaye şirketlerine site açma zorunluluğu getirmişti. Sonra bu yükümlülük yalnız bağımsız denetime tabi sermaye şirketleriyle sınırlandı. Kurumsal yönetimin dört unsuru eşitlik, hesap verebilirlik, sorumluluk ve şeffaflıktır. Halka açık şirketlerde kurumsal yönetim ilkelerini belirleme yetkisi Sermaye Piyasası Kuruluna aittir.", "Eşit işlem ilkesi, eşit şartlarda eşit işlem demektir. Muhatap şirket organlarıdır, özellikle yönetim kurulu. Genel kurula katılma, bilgi alma ve iptal davası gibi haklarda ilke mutlaktır. Kâr payı, rüçhan ve oy hakkında ise nisbidir, yani paya göre değişir. Bu ilkeye aykırı yönetim kurulu kararları batıldır.", "Borçlanma yasağına bakalım. Pay sahibi şirkete ancak iki şart birlikteyse borçlanabilir. Vadesi gelmiş sermaye borcunu ödemiş olmalıdır. Şirketin kârı da serbest yedek akçelerle birlikte geçmiş yıl zararlarını karşılamalıdır. Aksi halde işlem batıldır. Borç verenlere üç yüz günden az olmamak üzere adli para cezası verilir. Pay sahibi olmayan yönetim kurulu üyeleri ise şirkete hiç nakit borçlanamaz.", "Oransallık ilkesi, hakların sermaye payına göre belirlenmesidir. Kâr payı, tasfiye payı, rüçhan ve oy hakkı buna örnektir. Azlık hakları da oranla bağlantılıdır. Sermayenin onda biri, halka açık şirkette yirmide biri. Ama katılma, bilgi alma, özel denetçi ve iptal davası gibi koruyucu haklar orana bağlı değildir.", "Sürdürülebilir finansa geçelim. Bu kavram çevresel, sosyal ve kurumsal yönetim faktörlerinin finansal kararlarda dikkate alınmasıdır. Kısaca ESG diyoruz. Sosyal sorumlu yatırımcı riskten kaçar. Etki yatırımcısı ise daha fazla riski ve hatta düşük kârı kabul edebilir.", "Türk Ticaret Kanununa iki bin yirmi iki yılında bir hüküm eklendi. Buna göre Kamu Gözetimi Kurumu, Türkiye Sürdürülebilirlik Raporlama Standartlarını belirler. Kurum iki standart yayımladı. Birincisi genel hükümler, ikincisi iklimle ilgili açıklamalar. Sermaye Piyasası Kurulu tarafında ise halka açık şirketler için gönüllülük esası var. Ya uyarsın ya da neden uymadığını açıklarsın.", "Zorunlu raporlama eşiklerini ezberle. Aktif toplamı beş yüz milyon lira, net satış bir milyar lira ve çalışan sayısı iki yüz elli kişi. Listedeki bir şirket bu üç ölçütten en az ikisini art arda iki dönem aşarsa kapsama girer. Bankalar ise eşik aranmadan zorunludur. Ama Tasarruf Mevduatı Sigorta Fonu bünyesindeki bankalar muaftır.", "Toparlayalım. Birincisi, pay sahibi yalnız şirkete karşı ve taahhüdü kadar sorumludur, şirketin sorumluluğu ise sınırsızdır. İkincisi, merkezin yurt dışına taşınması oybirliği, imtiyazlı pay oluşturma yüzde yetmiş beş ister. Üçüncüsü, sermayenin korunması ve eşit işlem ilkesine aykırı yönetim kurulu kararları batıldır. Dördüncüsü, pay sahibinin şirkete borçlanması iki şarta bağlıdır ve cezası üç yüz günden az olmayan adli para cezasıdır. Beşincisi, raporlama eşikleri beş yüz milyon, bir milyar ve iki yüz elli kişidir ve en az ikisi iki dönem üst üste aşılmalıdır."], "5": ["Merhaba, anonim şirketin kuruluşu bölümündeyiz. Bir şirket kağıt üzerinde nasıl doğar, hangi aşamalardan geçer ve doğduktan sonra kuruluş kusurları ne olur, bunları konuşacağız. Bu bölümde süre soruları çok sık gelir.", "Önce kurucu kavramı. Kurucu, pay taahhüt edip esas sözleşmeyi imzalayan gerçek veya tüzel kişidir. İki şart birlikte aranır. Pay taahhüdü ve imza. Biri başkası hesabına imza atarsa, hesabına işlem yapılan kişi de sorumluluk bakımından kurucu sayılır. Ayrıca temsilcinin bildiğini bilmiyormuş gibi davranamaz.", "Kuruluşun olağan yolu ani kuruluştur. Kurucular sermayenin tamamını şartsız taahhüt eder, imzalarını notere onaylatır. Tüzel kişilik ise ticaret siciline tescille gelir. Sermayenin tamamı nakitse ve özel bir menfaat yoksa buna basit ani kuruluş denir.", "Nitelikli ani kuruluşun üç hali var. Ayni sermaye konulması, kuruluş sırasında bir aynın ya da işletmenin satın alınması ve kuruculara kârdan özel menfaat sağlanması. Bu hallerde sermayenin korunması için ek kontroller devreye girer. En önemlisi mahkemenin atadığı bilirkişinin değer biçmesidir.", "Basit ani kuruluşun aşamalarını sırayla say. Esas sözleşme yazılır. Tek kişilik şirkette buna esas taahhütname denir. Sonra imzalar notere onaylatılır. Sermaye ödenir. Gerekiyorsa Bakanlık izni alınır. Esas sözleşme tescil edilir ve şirket tüzel kişilik kazanır. En son Türkiye Ticaret Sicili Gazetesinde ilan yapılır.", "Burada dur bir saniye, çünkü ön şirket kavramı sınavda çok soruluyor. Noter onayından sonra ön şirket doğar. Bu dönemde esas sözleşme ve anonim şirket hükümleri kurucular arasında uygulanır. Ama henüz tüzel kişilik yoktur. Noter onayından önceki hazırlık döneminde ise kurucular arasında bir adi şirket ilişkisi vardır.", "Eski kanunda tedrici kuruluş vardı. Yani payların bir kısmı kurucularca, kalanı halktan toplanırdı. Yeni kanun bunu kaldırdı ve yerine halka arz taahhüdü yolunu getirdi. Bu yolda peşin tutar bankaya yatırılmaz, paylar tescilden itibaren iki ay içinde halka arz edilir. Ama Sermaye Piyasası Kanunu bu hükmü halka açık şirketlere ve halka açılmak için başvuranlara uygulanmaz kıldı. Yani uygulamada işlevi kalmadı.", "İzin konusuna geçelim. Genel ilke serbestliktir. Ama Ticaret Bakanlığının tebliğinde sayılan şirketler Bakanlık izniyle kurulur. Bankalar, faktoring ve finansal kiralama şirketleri, sigorta şirketleri, holdingler, döviz büfeleri, bağımsız denetim şirketleri ve Sermaye Piyasası Kanununa tabi şirketler bunlar arasındadır. Bunların esas sözleşme değişiklikleri de izne tabidir.", "İzinle ilgili iki tuzak var. Bakanlık yalnız emredici hükümlere aykırılık olup olmadığına bakar, yerindelik incelemesi yapmaz. Ayrıca bu izin dışında anonim şirket kuruluşu başka bir makamın iznine bağlanamaz. Sermaye Piyasası Kanunu ise sonraki tarihli özel kanun olduğu için Kurulun bazı izin yetkilerinin geçerli olduğu kabul edilebilir.", "Kuruluş belgeleri üç tanedir. Esas sözleşme, değerleme raporları ve kuruluşla ilgili sözleşmeler. Bu liste sınırlı sayıdadır. Belgeler sicil dosyasına konulur ve şirket bunları beş yıl saklar.", "Kurucu menfaatlerinde kural sert. Kuruculara emekleri karşılığında para veya bedelsiz pay verilemez. Ama kurucu intifa senedi çıkarılabilir. Hesabı şöyle düşün. Dağıtılabilir kârdan önce yedek akçe ve pay sahipleri için yüzde beş kâr payı ayrılır. Kalan tutarın en çok onda biri kuruculara gider. Kalan üç milyon liraysa kuruculara en fazla üç yüz bin lira ödenir.", "Bir de şu var. Şirket kâr dağıtmamaya karar verse bile, dağıtılabilir kâr varsa kurucu intifa sahipleri paylarını alır. Yeni kanundan sonra kurulan şirketler halka arzdan önce bu senetleri bedelsiz iptal etmelidir. Etmezlerse senetler kendiliğinden geçersiz olur.", "Esas sözleşme yazılı yapılır ve bütün kurucuların imzası notere onaylatılır. İçinde unvan, merkez, işletme konusu, sermaye ve payların itibari değeri, pay senetlerinin türü, ayni sermaye, yönetim kurulu, genel kurul, ilanlar ve hesap dönemi gibi on iki kalem yer alır.", "Şimdi önemli bir koruma hükmü. Kuruluştan sonra devralma veya kiralama. Kanun buna kanuna karşı hile diyor. Amaç, kuruluştaki bilirkişi kontrolünü tescilden hemen sonra yapılan bir alımla atlatmayı önlemek. Şöyle düşün, şirket kurulur kurulmaz bir kurucunun arsasını fahiş fiyata satın alıyor.", "Bu hükmün uygulanması için dört şart var. İşlem tescilden itibaren iki yıl içinde yapılmalı. Konusu fabrika, arsa veya kamyon gibi duran varlıklar olmalı. Un, yağ gibi cari alımlar girmez. Satım, eser veya kira sözleşmesi olmalı, hizmet sözleşmesi girmez. Bedel de sermayenin onda birini geçmeli. Karşı tarafın kim olduğu önemli değildir, üçüncü kişi de olabilir.", "Prosedür üç adımdır. Önce yönetim kurulunun talebiyle mahkeme bilirkişi atar. Sonra genel kurul, sermayenin en az yüzde yetmiş beşiyle onay verir. İkinci toplantıda da aynı nisap aranır. Son olarak karar tescil ve ilan edilir ve en az altı ay internet sitesinde kalır. Bunlar yapılana kadar sözleşme askıda hükümsüzdür.", "Kuruluşun sonuçlarına gelelim. Tescilden sonra artık şirketin butlanına ya da yokluğuna karar verilemez. Ama kuruluşta kanuna aykırılık yüzünden alacaklıların, pay sahiplerinin veya kamunun menfaati ciddi şekilde zarar görmüşse fesih davası açılabilir. Davayı yönetim kurulu, Ticaret Bakanlığı, ilgili alacaklı veya pay sahibi açar. Süre, tescil ve ilandan itibaren üç aydır ve hak düşürücüdür. Mahkeme isterse feshetmek yerine süre verir.", "Son bir detay. Pay taahhüdü tescilden önce devredilebilir mi? Devir yasak değildir. Ama tescilden önceki devir şirkete karşı ileri sürülemez. Tescilden sonra ise pay devri kural olarak şirkete karşı da geçerlidir.", "Toparlayalım. Birincisi, kurucu pay taahhüt edip esas sözleşmeyi imzalayandır. İkincisi, ön şirket noter onayıyla doğar ama tüzel kişilik ancak tescille gelir. Üçüncüsü, kurucu intifa senedi yedek akçe ve yüzde beşten sonra kalanın en çok onda biridir. Dördüncüsü, kuruluştan sonra devralmada süre iki yıl, eşik sermayenin onda biri, nisap yüzde yetmiş beştir. Beşincisi, kuruluş kusurunda fesih davası tescil ve ilandan itibaren üç ay içinde açılır."], "6": ["Merhaba, Ticaret Hukuku'nda anonim şirketin organlarına geldik. Bu bölümde önce genel resme bakacağız. Sonra yönetim kurulunun nasıl kurulduğunu, kimlerin üye olabileceğini, nasıl toplanıp karar aldığını ve şirketi dışarıda nasıl temsil ettiğini konuşacağız. Bol sayı var, ama korkma, hepsini tek tek bağlayacağız.", "Şimdi şöyle düşün. Anonim şirket bir tüzel kişi ve kendi başına konuşamıyor. Onun adına iki zorunlu organ hareket ediyor. Biri genel kurul, yani karar organı. Diğeri yönetim kurulu, yani idare ve temsil organı. Organ şirketin temsilcisi değil, şirketin ta kendisi sayılıyor. Bunu sınavda kavram sorusu olarak görebilirsin.", "Burada dur bir saniye, çünkü çok önemli bir ilke var. Türk Ticaret Kanunu genel kurulu yönetim kurulunun üstüne koymuyor. Organlar arasında işlev ayrılığı ilkesi geçerli. Yani genel kurulun her şeye kadir olduğunu söyleyen salt yetki teorisi reddedilmiş. Bunun pratik sonucu şu. Yönetim kurulu kararları genel kurulun onayına sunulamaz. Yönetim kurulunun sorumluluğu da genel kurul kararıyla kaldırılamaz.", "Denetçi meselesine de kısaca değinelim. Eski kanunda denetçi zorunlu bir organdı. Yeni kanun denetçiyi organ olmaktan çıkardı. Ağırlıklı görüş, denetçinin tarafsız ve bağımsız olması gerektiği için organ sayılmaması yönünde. Yani zorunlu organ dendiğinde aklına iki şey gelsin, genel kurul ve yönetim kurulu.", "Gelelim yönetim kurulunun yapısına. Kanun bir veya daha fazla kişiyi yeterli görüyor. Üst sınır yok. Eskiden en az üç kişi şarttı, tek kişilik anonim şirkete izin verilince bu da kalktı. Ama dikkat, bankalarda ve Kurumsal Yönetim İlkelerine tabi borsa şirketlerinde en az beş üye gerekiyor. Sınavda en az üç şıkkı tuzak olarak çok çıkıyor.", "Yönetim kurulu kendi içinden bir başkan ve en az bir başkan vekili seçiyor. İki bin yirmi dört yılındaki değişiklikle her yıl seçme zorunluluğu kalktı. Esas sözleşmede yazıyorsa başkanı genel kurul da seçebilir. Ama esas sözleşmede böyle bir hüküm yoksa, kurul başkan seçemese bile genel kurul bu boşluğu dolduramaz.", "Şimdi en sevilen tuzağa geliyorum. Anonim şirkette başkanın üstün oyu yok. Oylar eşit çıkarsa konu bir sonraki toplantıya kalıyor. Orada da eşitlik olursa öneri reddedilmiş sayılıyor. Bu kural emredici, esas sözleşmeyle değiştiremezsin. Limited şirkette ise müdürler arasında eşitlik olursa başkanın oyu üstün sayılıyor. İkisini karıştırma.", "Toplantıya çağrıda da yeni bir kural var. Üyelerin çoğunluğu başkandan yazılı olarak toplantı isterse, başkan otuz gün içinde yapılacak şekilde çağırmak zorunda. Çağırmazsa veya başkana ulaşılamazsa, istemde bulunan üyeler kendileri çağırabiliyor. Otuz gün rakamını not et.", "Üyeleri kim seçiyor? Kural olarak genel kurul, ve bu onun devredilemez yetkisi. İlk yönetim kurulu ise esas sözleşmeyle atanıyor. İstisnalar da var. İşletme konusu kamu hizmeti olan şirketlerde belediye gibi bir kamu tüzel kişisi, pay sahibi olmasa bile esas sözleşme hükmüyle temsilci bulundurabiliyor. Bir üyelik boşalırsa yönetim kurulu geçici üye seçiyor, bu kişi ilk genel kurulun onayına sunuluyor ve onaylanırsa selefinin süresini tamamlıyor.", "Bir de aday önerme hakkı var. Esas sözleşmeyle belli pay gruplarına ya da azlığa yönetim kurulunda temsil hakkı verilebilir. Önerilen aday, haklı bir sebep yoksa seçilmek zorunda. Halka açık şirkette bu yolla verilen temsil, üye sayısının yarısını geçemiyor. Ve bu paylar imtiyazlı pay sayılıyor.", "Süreye bakalım. Üyeler en çok üç yıl için seçiliyor, daha kısa da olabilir. Esas sözleşme yasaklamıyorsa tekrar seçilebiliyorlar. Herkesin aynı süreyle seçilmesi gerekmiyor. Üyenin tam ehliyetli olması şart. İflas eden ya da kısıtlanan kişi üye olamıyor. Kasten işlediği suçtan hapis cezası alan biri de cezası infaz edilene kadar şirket yöneticisi olamıyor.", "Tüzel kişiler de üye olabilir. Diyelim ki bir holding şirketi yönetim kuruluna seçildi. Holding kendi adına sadece bir gerçek kişiyi belirliyor, o kişi tescil ve ilan ediliyor, şirketin internet sitesinde de hemen açıklanıyor. Toplantıya girip oy kullanan sadece bu kişi oluyor. Üyelik sıfatı ise kabul beyanıyla kazanılıyor, tescil sadece açıklayıcı.", "Üyelik nasıl biter? Süre dolar, üye istifa eder, ya da genel kurul görevden alır. Görevden alma için gündemde madde olması ya da haklı sebep olması yeterli. Esas sözleşmeyle atanmış olsa bile görevden alınabilir. Sınavda şuna dikkat et. Yönetim kurulu kendi üyesini görevden alamaz. Bu yetki sadece genel kurulda.", "Şimdi görev ve yetkilere geçelim. Genel yetki yönetim kurulunda. Kanun ve esas sözleşme genel kurula bırakmadıysa, işletme konusu için gereken her işte yönetim kurulu karar verir. Bir de devredilemez yetkiler listesi var. Üst düzey yönetim, teşkilatın belirlenmesi, muhasebe ve finansal planlama düzeni, müdürlerin atanması, üst gözetim, defterlerin tutulması ve faaliyet raporu, son olarak borca batıklıkta mahkemeye bildirim.", "Bu listede bir ince nokta var. Müdür atama devredilemez, ama şube müdürleri bunun dışında tutuluyor. Bir de önemli miktarda şirket varlığının toptan satışı bu listede değil. O, genel kurulun devredilemez yetkisi. Sınavda hangisi yönetim kurulunun devredilemez yetkisi değildir diye sorulursa bu şıkkı ara.", "Devredilebilen yetkilere örnek olarak kayıtlı sermaye sistemini düşün. Esas sözleşmede bir tavan yazılıyor ve yönetim kurulu bu tavana kadar sermayeyi kendi kararıyla artırabiliyor. Menkul kıymet çıkarma yetkisi genel kurul kararıyla en çok on beş ay için yönetim kuruluna bırakılabiliyor. Borçlanma aracında ise Sermaye Piyasası Kanunu, esas sözleşmeyle süreli ya da süresiz devre izin veriyor.", "Sermaye kaybı kısmı sayısal sorulara çok uygun. Son yıllık bilançoda sermaye artı kanuni yedek akçelerin yarısı zararla eridiyse, yönetim kurulu genel kurulu hemen toplar ve iyileştirici önlem önerir. Üçte ikisi eridiyse, genel kurul ya sermayenin üçte biriyle yetinmeye ya da sermayeyi tamamlamaya karar verir. Vermezse şirket kendiliğinden sona erer. Mesela toplam on iki milyon lira ise yarı eşik altı milyon, üçte iki eşik sekiz milyon lira.", "Borca batıklık şüphesinde yönetim kurulu bir ara bilanço çıkarıyor. Aktifleri hem işletme devam ediyormuş gibi hem de satılsa ne eder diye iki şekilde değerliyor. Aktifler borcu karşılamıyorsa merkezin bulunduğu yerdeki asliye ticaret mahkemesine bildirip iflas istiyor. Borsada işlem gören şirketlerde ayrıca riskin erken saptanması komitesi zorunlu. Bu komite her iki ayda bir rapor veriyor.", "Toplantı ve karar nisabı çok soruluyor. Yönetim kurulu üye tam sayısının çoğunluğuyla toplanır, toplantıda hazır bulunanların çoğunluğuyla karar alır. Toplantısız yazılı onay yolunda ise hiçbir üye toplantı istememeli ve öneri herkese gitmeli. Karar için üye tam sayısının çoğunluğunun yazılı onayı gerekiyor. Unutma, yönetim kurulunda vekâletle oy kullanılamaz.", "Müzakereye katılma yasağını da bir örnekle düşün. Şirket, bir üyenin kardeşinin şirketinden mal alacak. Üye bu konunun görüşmesine katılamaz, oy da veremez ve nisapta sayılmaz. Kurul bu çatışmayı bilmese bile üye kendisi açıklamak zorunda. Kurala uymazsa, bilip de itiraz etmeyen üyelerle birlikte zarardan müteselsilen sorumlu olur.", "Son büyük konu temsil. Kural çift imza. Esas sözleşme tek imza öngörüyorsa ya da kurul tek kişiyse tek imza yeterli. Temsil yetkisi murahhas üyelere ya da müdürlere devredilebilir, ama en az bir yönetim kurulu üyesinde temsil yetkisi kalmalı. İşletme konusu dışındaki işlemler de kural olarak şirketi bağlıyor. Sınırlama sadece iki hâlde geçerli. Merkez ya da şube işlerine özgüleme ve birlikte imza. Bunların da tescil ve ilan edilmesi şart.", "Toparlayalım. Birincisi, organlar arasında işlev ayrılığı var, genel kurul üst organ değil. İkincisi, yönetim kurulu bir veya daha fazla kişiden oluşur, üyeler en çok üç yıl için seçilir ve başkanın üstün oyu yoktur. Üçüncüsü, yönetim kurulu üye tam sayısının çoğunluğuyla toplanır, hazır bulunanların çoğunluğuyla karar alır. Dördüncüsü, sermaye ve kanuni yedeklerin yarısı kaybedilirse genel kurul hemen toplanır, üçte ikisi kaybedilirse karar alınmazsa şirket sona erer. Beşincisi, temsil kural olarak çift imzayla yapılır ve en az bir üyede temsil yetkisi kalmalıdır."], "7": ["Merhaba, yönetim kurulunun ikinci bölümündeyiz. Bugün işin daha hukuki tarafını konuşacağız. Önce sakat kararlar, sonra üyelerin hakları ve yükümlülükleri, en sonda da sorumluluk. Bu bölümde süreler çok önemli, o yüzden kulağını dört aç.", "Bir yönetim kurulu kararı hukuka aykırıysa üç farklı sonuç olabilir. Yokluk, butlan ve iptal. Yokluk en ağırı. Karar daha doğmadan sakat, yani kurucu unsuru eksik. Mesela nisap sağlanmadan alınmış, ya da üye olmayan kişiler karar almış. Butlanda ise karar var ama ağır bir hukuka aykırılık taşıyor. İkisinde de süre yok, hâkim kendiliğinden dikkate alıyor.", "Butlan sebeplerini kanun dört grupta sayıyor. Eşit işlem ilkesine aykırılık, şirketin temel yapısına ya da sermayenin korunmasına aykırılık, pay sahiplerinin vazgeçilmez haklarının ihlali ve başka organların devredilemez yetkilerine girme. Liste örnek niteliğinde, sınırlı değil. Burada dur bir saniye, çünkü sınavda dürüstlük kuralına aykırılık diye bir şık koyuyorlar. O bir iptal sebebi, butlan listesinde yok.", "İptal davası ise yönetim kurulu kararlarında istisnai. Esas olarak kayıtlı sermaye sisteminde yönetim kurulunun aldığı kararlar için var. Halka açık ortaklıkta kararın ilanından itibaren otuz gün, halka açık olmayanda ilandan itibaren bir ay içinde dava açılıyor. Genel kurul kararlarındaki üç aylık süreyle karıştırma. Bu davanın tarihi de soruluyor, ilk kez bin dokuz yüz doksan iki yılında eski Sermaye Piyasası Kanunu'na girdi.", "Şimdi hakları konuşalım. Üyenin en önemli kişisel hakkı bilgi alma ve inceleme hakkı. Toplantıda bir üye belge isterse bu istek reddedilemez. Toplantı dışında ise başkanın izni gerekiyor. Başkanın kendisi bilgi istiyorsa izni kuruldan alıyor. İstek reddedilirse konu iki gün içinde kurula geliyor, orada da olmazsa üye asliye ticaret mahkemesine gidiyor ve mahkemenin kararı kesin.", "Bu hakkı esas sözleşme genişletebilir ama daraltamaz. Bunu bir kural olarak kafana yaz, çünkü şık olarak esas sözleşme bu hakkı sınırlayabilir diye karşına çıkabilir.", "Mali haklar dört tane. Huzur hakkı, ücret, ikramiye ve prim, bir de kâr payı. Bunları genel kurul belirliyor ve bu onun devredilemez yetkisi. Yönetim kurulu kendi ücretine kendisi karar verirse o karar batıl. Kâr payında ince bir nokta var. Genel kurul kararı tek başına yetmiyor, esas sözleşmede de hüküm olmalı. Yolluk ya da temsil ödeneği gibi ödemeler ise bu listenin dışında.", "Bir de şu kural var. Şirket iflas ederse üyeler son üç yılda aldıkları, uygun ücreti aşan ödemeleri geri vermek zorunda. Kanun ücretin miktarına bir tavan koymuyor. Yaptırımı ödemenin yüksekliğine değil, kamuya açıklanmamasına bağlıyor. Denetime tabi şirketler internet sitesi açmak ve faaliyet raporunu orada yayımlamak zorunda.", "Yükümlülüklere geçelim. Sadakat yükümlülüğü, şirket menfaatini kişisel menfaatin önüne koymak demek. Sır saklama görev bittikten sonra da sürüyor. Özen yükümlülüğünde ölçü tedbirli bir yöneticinin özeni. Bu nesnel bir ölçü, yani kişinin kendi kapasitesine bakılmıyor. Uzman bilgisi de aranmıyor.", "Şimdi şöyle düşün. Bir yönetim kurulu yeni bir fabrika yatırımına karar veriyor. Raporları inceliyor, uzmanlardan görüş alıyor, kimsenin kişisel çıkarı yok. Sonra piyasa çöküyor ve şirket zarar ediyor. İşadamı kararı ilkesi burada üyeleri koruyor. Dört soruya bakılıyor. Ticari bir karar var mı, tarafsız alınmış mı, yeterli bilgiye dayanıyor mu, makul bir inanca dayanıyor mu. Ama hile, kaynakların kötüye kullanılması ve emredici hükme aykırılık bu korumanın dışında.", "Şirketle işlem yapma yasağı da önemli. Üye genel kurul izni almadan şirketle işlem yaparsa şirket bu işlemin batıl olduğunu ileri sürebilir. Borçlanma yasağında ise pay sahibi olmayan üye ve yakınları şirkete nakit borçlanamıyor. Şirket onlara kefil de olamıyor. Yaptırım olarak alacaklılar bu kişileri doğrudan takip edebiliyor, bir de üç yüz günden az olmamak üzere adli para cezası var.", "Rekabet yasağında üye, genel kurul izni olmadan şirketin işletme konusundaki ticari işleri yapamaz. Aynı işi yapan bir şirkete sınırsız sorumlu ortak olarak da giremez. Şirketin hakları, diğer üyelerin öğrenmesinden itibaren üç ay, her hâlde bir yıl içinde zamanaşımına uğruyor. Bu üç ay bir yıl ikilisini, genel sorumluluktaki iki yıl beş yıl ikilisiyle karıştırma.", "Sorumluluğa gelelim. Yönetim kurulu üyeleri kusurlarıyla verdikleri zarardan şirkete, pay sahiplerine ve alacaklılara karşı sorumlu. Bu bir kusur sorumluluğu ve kusuru davacı ispat ediyor. Pay sahibi şirketin zararı için dava açabilir ama tazminatın şirkete ödenmesini isteyebilir. Alacaklı ise bu davayı ancak şirket iflas etmişse açabilir.", "Eski kanunda herkes zararın tamamından sorumluydu. Yeni kanun farklılaştırılmış teselsülü getirdi. Yani her üye, kusuruna ve durumun gereklerine göre, zararın kendisine yüklenebilecek kısmı kadar sorumlu. Davacı hepsini birlikte dava edebilir ama her birine ancak kendi tavanına kadar gidebilir. Dava şirket merkezinin bulunduğu yerdeki asliye ticaret mahkemesinde açılıyor.", "Zamanaşımı iki yıl ve beş yıl. Zararı ve sorumluyu öğrendiğin tarihten itibaren iki yıl, her hâlde fiilden itibaren beş yıl. Fiil aynı zamanda bir suçsa ve ceza zamanaşımı daha uzunsa, o uzun süre geçerli.", "İbra da çok soruluyor. İbra, genel kurulun yönetimin o dönemki işlemlerini hukuka uygun bulması. Bilançonun onaylanması, kararda aksi yazmıyorsa ibra sonucunu doğuruyor. İbra oylamasında oyda imtiyaz kullanılamıyor, yönetim kurulu üyeleri de kendi paylarıyla oy veremiyor. Geçerli bir ibra kararı sonradan başka bir genel kurul kararıyla geri alınamıyor. Olumlu oy vermeyen pay sahiplerinin dava hakkı altı ay sonra düşüyor, alacaklılar ise hiç etkilenmiyor.", "Bir de dört yıl kuralı var. Kuruluş ve sermaye artırımından doğan sorumluluk, tescilden itibaren dört yıl geçmeden sulh ve ibrayla kaldırılamıyor. Dört yıldan sonra da genel kurul onayı gerekiyor. Sermayenin onda biri, halka açık şirkette yirmide biri karşı çıkarsa onay verilemiyor.", "Özel sorumluluk hallerinde ceza miktarlarını bil. Sahte belge düzenlemek bir yıldan üç yıla kadar hapis. Sermaye hakkında yanlış beyan üç aydan iki yıla kadar. Değer biçmede yolsuzluk doksan günden az olmamak üzere adli para cezası. Halktan izinsiz para toplamak altı aydan iki yıla kadar hapis. Belge sorumluluğunda belgeyi düzenleyen kusursuz, ona katılan ise kusurlu sorumlu.", "Sermaye piyasası tarafında kamuyu aydınlatma belgeleri var. İzahname, özel durum açıklaması, finansal
