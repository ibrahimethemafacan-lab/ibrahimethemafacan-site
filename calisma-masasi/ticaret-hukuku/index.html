<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.opts2 select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}
.opts2 .rates{display:inline-flex;background:var(--line2);border-radius:9px;padding:2px}
.opts2 .rates button{border:0;background:transparent;padding:4px 8px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}

<script>
const S=[{"id": 1, "kisa": "Ortak Hükümler ve Sermaye", "baslik": "Ticaret Şirketleri: Türleri, Ortak Özellikleri ve Sermaye Koyma Borcu", "ozet": "TTK'daki beş ticaret şirketi, ortak özellikleri (tüzel kişilik, sınırlı sayı, ultra vires'in kaldırılması, elektronik kurullar) ve sermaye koyma borcunun ifası ile yaptırımları.", "notlar": "<h3>Ticaret şirketleri ve kanuni sınıflandırma<\/h3><ul><li><b>TTK m.124/1:<\/b> ticaret şirketleri <b>kollektif, komandit, anonim, limited ve kooperatif<\/b> şirketlerden \"ibarettir\" (beş tür).<\/li><li><b>TTK m.124/2:<\/b> kollektif ve komandit = <b>şahıs şirketi<\/b>; anonim, limited ve sermayesi paylara bölünmüş komandit (SPBKŞ) = <b>sermaye şirketi<\/b>.<\/li><li>Dikkat: <b>Kooperatif<\/b> ticaret şirketidir ama şahıs/sermaye şirketi ayrımının <b>dışında<\/b> bırakılmıştır. SPBKŞ ise m.124/1'deki beşli sayımda ayrıca geçmez, sermaye şirketi olarak sınıflandırılır.<\/li><li>TTK'da hüküm yoksa: <b>TMK'nın tüzel kişilere ilişkin genel hükümleri<\/b> ve <b>TBK'nın adi şirkete ilişkin m.620–645<\/b> hükümleri niteliğe uygun düştüğü ölçüde uygulanır (TTK m.126).<\/li><li>Sermaye piyasaları açısından en önemli tür <b>anonim şirket<\/b>tir; genel hükümler AŞ ekseninde incelenir.<\/li><\/ul><table><tr><th>TTK'daki düzenleme<\/th><th>Maddeler<\/th><\/tr><tr><td>Genel hükümler (türler, tüzel kişilik, ehliyet, sermaye)<\/td><td>m.124–133<\/td><\/tr><tr><td>Birleşme, bölünme, tür değiştirme (yapısal değişiklikler)<\/td><td>m.134–194<\/td><\/tr><tr><td>Şirketler topluluğu<\/td><td>m.195–209<\/td><\/tr><tr><td>Ticaret Bakanlığının düzenleme ve denetleme yetkisi<\/td><td>m.210<\/td><\/tr><tr><td>Kollektif şirket<\/td><td>m.211–303<\/td><\/tr><tr><td>Komandit şirket<\/td><td>m.304–328<\/td><\/tr><tr><td>Anonim şirket<\/td><td>m.329–563<\/td><\/tr><tr><td>Sermayesi paylara bölünmüş komandit şirket<\/td><td>m.564–572<\/td><\/tr><tr><td>Limited şirket<\/td><td>m.573–644<\/td><\/tr><\/table><h3>Ortak özellik 1: Tüzel kişilik<\/h3><ul><li>Bütün ticaret şirketleri tüzel kişidir (<b>TTK m.125<\/b>). Bu yönüyle <b>tüzel kişiliği olmayan adi şirketten<\/b> ayrılırlar.<\/li><li>Sonuçları: hak süjesi olma, <b>özel malvarlığı<\/b>, <b>ticaret unvanı<\/b>, <b>tabiiyet<\/b>, <b>hak ve fiil ehliyeti<\/b>. AŞ ortaklarından bağımsız olarak kendisi hak sahibi olur ve borç altına girer.<\/li><\/ul><h3>Ortak özellik 2: Sınırlı sayı ilkesi (numerus clausus)<\/h3><ul><li>Dayanak: m.124/1'deki \"ibarettir\" ifadesi ve sınırlayıcı anlatım.<\/li><li>Sonuç: Kanunda sayılanlar dışında ticaret şirketi kurulamaz; türlerin karakteristik özellikleri karıştırılarak <b>yeni bir tip yaratılamaz<\/b>.<\/li><li>Bir ortaklık kanunda düzenlenmiş türlerin ayırt edici niteliklerini taşımıyorsa <b>TBK m.620/2<\/b> gereği <b>adi ortaklık<\/b> sayılır.<\/li><\/ul><h3>Ortak özellik 3: Ultra vires'in kaldırılması<\/h3><ul><li><b>6762 sayılı mülga TTK (m.137):<\/b> hak ehliyeti sözleşmedeki işletme konusu ile sınırlıydı; konu dışı işlem şirketi bağlamaz, <b>\"yok\"<\/b> sayılırdı (İngiliz kökenli ultra vires teorisi).<\/li><li>AET'nin <b>68/151<\/b> ve <b>2009/101/AT<\/b> sayılı Yönergelerine paralel olarak 6102 sayılı TTK teoriyi terk etti.<\/li><li><b>TTK m.125:<\/b> ticaret şirketleri <b>TMK m.48<\/b> çerçevesinde bütün haklardan yararlanır, borç üstlenir. Sınır: cins, yaş, hısımlık gibi insana özgü nitelikler.<\/li><li><b>AŞ'ye özgü görünüm, TTK m.371/2:<\/b> temsile yetkililerin işletme konusu dışında yaptığı işlemler de şirketi bağlar; meğer ki üçüncü kişinin işlemin konu dışı olduğunu <b>bildiği veya durumun gereğinden bilebilecek durumda olduğu ispat edilsin<\/b>.<\/li><li>Dikkat: Esas sözleşmenin <b>tescil ve ilan edilmiş olması tek başına yeterli delil değildir<\/b>; ticaret sicilinin olumlu fonksiyonu burada işlemez.<\/li><li>Dikkat: Ultra vires'in kalkması işletme konusunun esas sözleşmeden çıktığı anlamına gelmez; <b>m.339/2<\/b> esaslı noktaları belirtilmiş işletme konusunu zorunlu içerik sayar.<\/li><\/ul><table><tr><th>Durum<\/th><th>Sonuç<\/th><\/tr><tr><td>İşlem işletme konusu içinde<\/td><td>Hak ehliyeti ve temsil yetkisi kapsamında; şirketi bağlar.<\/td><\/tr><tr><td>İşlem işletme konusu dışında<\/td><td>Hak ehliyeti içinde ama temsil yetkisi dışında: <b>yetkisiz temsil<\/b>, işlem askıda.<\/td><\/tr><tr><td>Üçüncü kişi iyi niyetli (bilmiyor)<\/td><td>İşlem geçerli, şirketi bağlar.<\/td><\/tr><tr><td>Üçüncü kişi biliyor/bilebilecek durumda (ispatlanırsa)<\/td><td>İşlemin <b>iptali<\/b> talep edilebilir.<\/td><\/tr><\/table><h3>Ortak özellik 4: Kurulların elektronik ortamda yapılması<\/h3><ul><li>Dayanak: <b>TTK m.1527 ve m.1528<\/b>. Şart: şirket sözleşmesinde/esas sözleşmede düzenlenmiş olması.<\/li><li>Sermaye şirketlerinde <b>yönetim kurulu, müdürler kurulu ve genel kurul<\/b> toplantıları elektronik ortamda yapılabilir.<\/li><li>Usul ve esaslar: Ticaret Bakanlığının \"Anonim Şirketlerde Elektronik Ortamda Yapılacak Genel Kurullara İlişkin Yönetmelik\"i.<\/li><li><b>m.1527/5:<\/b> elektronik katılma, öneride bulunma, görüş açıklama ve oy verme, <b>fiziki katılmanın bütün hukuki sonuçlarını<\/b> doğurur; toplantı ve karar nisapları aynen uygulanır.<\/li><li>Dikkat: Elektronik genel kurul sistemi <b>pay senetleri borsaya kote şirketlerde zorunlu<\/b>, diğer şirketlerde ihtiyaridir.<\/li><\/ul><h3>Sermaye koyma borcu<\/h3><ul><li>Şirketin geleneksel <b>beş unsuru<\/b>: kişi, sözleşme, <b>sermaye<\/b>, ortak amaç, ortak amaç uğruna birlikte gayret (<b>affectio societatis<\/b>). Sermaye unsur olduğu için ortaklar sermaye koyma borcu altındadır.<\/li><li>Muhasebede sermaye, bilançonun <b>pasif<\/b> tarafındaki itibari bir değerdir; ticaret hukukunda ise asgari miktarı ve unsurları TTK'da düzenlenen zorunlu unsurdur.<\/li><li>Asgari sermaye zorunluluğu yalnız <b>anonim ve limited<\/b> şirketler için öngörülmüştür.<\/li><\/ul><table><tr><th>Şirket<\/th><th>Asgari sermaye<\/th><th>Dayanak<\/th><\/tr><tr><td>AŞ, esas sermaye sistemi<\/td><td><b>250.000 TL<\/b><\/td><td>TTK m.332/1<\/td><\/tr><tr><td>AŞ, kayıtlı sermaye sistemi (halka kapalı)<\/td><td><b>500.000 TL<\/b><\/td><td>TTK m.332/1<\/td><\/tr><tr><td>Halka açık AŞ, kayıtlı sermaye sistemi<\/td><td><b>2025 için 150 milyon TL; 2026 için 200 milyon TL<\/b><\/td><td>SPK Kayıtlı Sermaye Sistemi Tebliği (II-18.1) m.5/3<\/td><\/tr><tr><td>Limited şirket<\/td><td><b>50.000 TL<\/b><\/td><td>TTK m.580/1<\/td><\/tr><\/table><h4>Sermaye olarak getirilebilecek değerler (TTK m.127, örnekleyici)<\/h4><ol><li>Para, alacak, kıymetli evrak ve sermaye şirketlerine ait paylar<\/li><li>Fikri mülkiyet hakları<\/li><li>Taşınırlar ve her çeşit taşınmaz<\/li><li>Taşınır ve taşınmazların faydalanma ve kullanma hakları<\/li><li>Kişisel emek<\/li><li>Ticari itibar<\/li><li>Ticari işletmeler<\/li><li>Haklı olarak kullanılan devredilebilir elektronik ortamlar, alanlar, adlar ve işaretler<\/li><li>Maden ruhsatnameleri ve benzeri ekonomik değeri olan haklar<\/li><li>Devrolunabilen ve nakden değerlendirilebilen her türlü değer<\/li><\/ol><ul><li>İstisnalar saklı (m.127/2): komandit için <b>m.307/2<\/b>, AŞ için <b>m.342/1<\/b>, limited için <b>m.581/1<\/b>.<\/li><li><b>AŞ, TTK m.342 (emredici):<\/b> üzerinde sınırlı ayni hak, haciz ve tedbir bulunmayan, nakden değerlendirilebilen ve devrolunabilen malvarlığı unsurları (fikri mülkiyet ve sanal ortamlar dahil) ayni sermaye olabilir.<\/li><li>Dikkat: AŞ'ye <b>hizmet edimleri, kişisel emek, ticari itibar ve vadesi gelmemiş alacaklar<\/b> sermaye olarak konulamaz. Limited için benzeri m.581'dedir.<\/li><li>m.342 AŞ bakımından özel hükümdür; önce o uygulanır, m.127 yalnız m.342'ye aykırı olmayan ölçüde uygulanır.<\/li><\/ul><h4>Sermaye koyma borcunun ifası<\/h4><ul><li>İki aşama: <b>taahhüt<\/b> (şirket sözleşmesinin yapılmasıyla) ve <b>tasarruf<\/b> (sermayenin türüne göre değişen işlemlerle). Özel kurallara uyulmazsa değer sermaye kabul edilmez.<\/li><\/ul><table><tr><th>Sermaye türü<\/th><th>Kural<\/th><\/tr><tr><td>Taşınmaz ve taşınmaz üzerindeki ayni hak<\/td><td>Taahhüt içeren şirket sözleşmesi hükmü <b>resmi şekil aranmaksızın<\/b> geçerli (m.128/3). Bilirkişi değeriyle sözleşmede yer alan taşınmaz <b>tapuya şerh verildiği anda<\/b> ayni sermaye kabul edilir; şerh iyi niyeti kaldırır (m.128/2). Şirketin tasarruf edebilmesi için <b>tapu siciline tescil<\/b> gerekir (m.128/5). Tescil sonrası ticaret sicil müdürlüğü tapuya bildirir (\"Şirketlerde Yapı Değişikliği ve Ayni Sermaye Konulmasında Siciller Arası İşbirliğine İlişkin Tebliğ\").<\/td><\/tr><tr><td>Alacak<\/td><td>Ortak, alacak şirketçe <b>tahsil edilmedikçe<\/b> borcundan kurtulmaz (m.130). Vadesi gelmemişse vade gününden, muaccelse sözleşme tarihinden itibaren <b>1 ay<\/b> içinde tahsil edilmeli; edilemezse ortak sürenin bitiminden itibaren <b>temerrüt faizi<\/b> öder (tazminat hakkı saklı). Kısmi tahsilde hüküm tahsil edilmeyen kısma uygulanır. AŞ'de yalnız <b>muaccel<\/b> alacak konulabilir (m.342); m.343'e göre gerçekliği, geçerliliği, tahsil edilebilirliği ve tam değeri açıklanır.<\/td><\/tr><tr><td>Taşınır<\/td><td><b>Güvenilir bir kişiye tevdi<\/b> edilmesi şart (m.128/2); m.342 şartları ve m.343 bilirkişi değerlemesi.<\/td><\/tr><tr><td>Fikri mülkiyet hakları<\/td><td><b>Özel sicillerine kaydedildikleri<\/b> takdirde ayni sermaye sayılır (m.128); m.342–343 ve Siciller Arası İşbirliği Tebliği.<\/td><\/tr><tr><td>Nakit (AŞ)<\/td><td>Nakden taahhüt edilen payların itibari değerinin <b>en az %25'i tescilden önce<\/b>, kalanı tescili izleyen <b>24 ay<\/b> içinde ödenir; <b>çıkarma priminin tamamı tescilden önce<\/b> ödenir (m.344).<\/td><\/tr><\/table><ul><li><b>Bilirkişi değerlemesi (m.343):<\/b> ayni sermayeye, şirket merkezinin bulunduğu yer <b>asliye ticaret mahkemesince<\/b> atanan bilirkişilerce değer biçilir. Raporda yöntemin en adil seçim olduğu, her varlık için verilecek pay miktarı ve TL karşılığı gerekçelendirilir. Kurucular ve menfaat sahipleri itiraz edebilir; <b>mahkemenin onayladığı bilirkişi kararı kesindir<\/b>.<\/li><li><b>SerPK m.12/1:<\/b> ihraç olunan payların bedelleri <b>tamamen ve nakden<\/b> ödenir. SPK birleşme, bölünme, hisse değişimi gibi yapılandırmalarda nakden ödemenin zorunlu olmadığı halleri belirleyebilir; satılamayan paylar için <b>satın alma taahhüdü<\/b> isteyebilir (Pay Tebliği VII-128.1). TTK m.344/2 SerPK hükümlerini saklı tutar.<\/li><li><b>TTK m.346 (halka arz edilecek paylar):<\/b> esas sözleşmede tescilden itibaren <b>en geç 2 ay<\/b> içinde halka arz edileceği belirtilmiş ve garanti edilmiş nakdi payların karşılığı satış gelirinden ödenir. Satılmayan payların bedelinin <b>tamamı<\/b>, süresinde halka arz edilmeyen payların bedelinin <b>%25'i<\/b>, iki aylık süreyi izleyen <b>3 gün<\/b> içinde ödenir.<\/li><li>Dikkat: <b>SerPK m.12/6<\/b>, TTK m.346'yı <b>halka açık ve halka açılmak üzere Kurula başvuran<\/b> ortaklıklara uygulanmaz kılmıştır.<\/li><li><b>Ödeme yeri (m.345):<\/b> nakdi ödemeler <b>5411 sayılı Bankacılık Kanununa tabi bir bankada<\/b>, kurulmakta olan şirket adına açılan ve yalnız şirketin kullanabileceği özel hesaba yatırılır; ödeme ticaret siciline yöneltilen <b>banka mektubu<\/b> ile ispatlanır. Banka parayı, tüzel kişiliğin kazanıldığını bildiren sicil müdürlüğü yazısı üzerine yalnız şirkete öder.<\/li><li>m.335/1'deki <b>noter onayı tarihinden itibaren 3 ay<\/b> içinde tüzel kişilik kazanılamazsa, sicil müdürlüğü yazısıyla bedeller sahiplerine iade edilir (m.345/2).<\/li><\/ul><h4>Temerrüt ve yaptırımlar<\/h4><table><tr><th>Yaptırım<\/th><th>Esaslar<\/th><\/tr><tr><td>İfa talebi ve davası<\/td><td>Hukuki niteliği <b>eda davası<\/b>. Şahıs şirketlerinde şirketin yanında ortaklar da açabilir (<b>actio pro socio<\/b>, m.128/7); AŞ, limited ve SPBKŞ'de <b>yalnız şirket<\/b> açar.<\/td><\/tr><tr><td>Tazminat<\/td><td>Gecikme zararı istenebilir; <b>ihtar şarttır<\/b> (m.128/7). AŞ'de ayrıca m.482/4.<\/td><\/tr><tr><td>Temerrüt faizi<\/td><td>Alacak sermaye konulmuşsa m.130/3; AŞ'de yalnız muaccel alacak kısmı uygulanır.<\/td><\/tr><tr><td>İhtiyati tedbir<\/td><td>Taahhüt edilen hakların korunması için <b>kurucular<\/b> ortaklar aleyhine isteyebilir (m.128/8). HMK m.397/1'deki <b>iki haftalık<\/b> dava süresi şirketin <b>tescil ve ilanından<\/b> itibaren işler.<\/td><\/tr><tr><td>Iskat (AŞ, m.480–483)<\/td><td>Yönetim kurulu, TTSG'de ve esas sözleşmedeki şekilde ilanla, internet sitesinde de yayımlanan ihtarla <b>1 ay<\/b> süre verir. Ödenmezse YK; pay sahibini iştirak taahhüdünden ve kısmi ödemelerden doğan haklarından yoksun bırakabilir, payı satıp yerine başkasını alabilir, pay senetlerini iptal edebilir (m.482/2).<\/td><\/tr><tr><td>Çıkarma ve fesih (şahıs şirketleri)<\/td><td>Kollektifte sermaye koymamak <b>çıkarma için haklı sebep<\/b> (m.255/3) ve \"asli görev ve borçları yerine getirmemek\" <b>fesih için haklı sebep<\/b> (m.245/1-b); m.328 ile komandite de uygulanır.<\/td><\/tr><tr><td>Sözleşme cezası<\/td><td>AŞ'de pay sahipleri temerrüt halinde sözleşme cezasıyla yükümlü tutulabilir; <b>esas sözleşmede hüküm şart<\/b> (m.482/3). Limitedde m.578/1-f. TBK'da \"ceza koşulu\" adıyla m.179–182.<\/td><\/tr><\/table><ul><li>Iskat yalnız <b>bedeli ödenmeyen paylar<\/b> için uygulanır; borcunu ödediği paylardaki hakları alınamaz.<\/li><li>Iskat edilen pay sahibi, yeni pay sahibinin ödemelerinden <b>açık kalan tutardan<\/b> şirkete karşı sorumludur (m.483/3).<\/li><li>Limitedde sermaye koymamanın m.636/3 uyarınca fesih için haklı sebep olabileceği öğretide savunulur. AŞ'de sermaye koymamak fesih sebebi sayılmaz; ancak mali durum ciddi bozulursa m.376/3 ve m.529/1-b bağlamında iflas veya sona erme gündeme gelebilir. Salt bu nedenle m.531 haklı sebeple fesih kabulü güçtür.<\/li><li><b>Yargılama usulü:<\/b> ortaklık ilişkisinden doğan ve yöneticiler, tasfiye memurları, denetçilere karşı davalarda <b>basit yargılama usulü<\/b> (TTK m.1521).<\/li><li><b>Zamanaşımı:<\/b> TTK'da genel hüküm yok; <b>TBK m.147/4<\/b> gereği ortaklık sözleşmesinden doğan alacaklar <b>5 yıl<\/b>. TTK'da özel süre varsa o uygulanır (örn. m.560).<\/li><\/ul><h4>Ortakların kişisel alacaklıları (TTK m.133)<\/h4><table><tr><th>Şirket<\/th><th>Alacaklı neye başvurur?<\/th><\/tr><tr><td>Şahıs şirketi<\/td><td>Şirket devam ettikçe bilançoya göre ortağa düşen <b>kâr payı<\/b>, fesih halinde <b>tasfiye payı<\/b>; bilanço yoksa bunlara haciz koydurabilir.<\/td><\/tr><tr><td>Sermaye şirketi (AŞ)<\/td><td>Kâr ve tasfiye payına ek olarak, senede bağlanmış veya bağlanmamış <b>payların İİK'nın taşınır hükümlerine göre haczi ve paraya çevrilmesi<\/b>; haciz istek üzerine <b>pay defterine<\/b> işlenir.<\/td><\/tr><tr><td>Tüm ticaret şirketleri<\/td><td>Ortağın şirketten olan diğer alacakları da haczedilebilir.<\/td><\/tr><\/table><ul><li>Bu hükümler, alacaklının ortağın şirket dışındaki mallarına başvurmasına engel değildir.<\/li><\/ul>", "sorular": [{"q": "TTK m.124/2'deki sınıflandırmaya göre aşağıdakilerden hangisi şahıs şirketi ile sermaye şirketi ayrımının dışında bırakılmıştır?", "o": ["Kooperatif şirket", "Limited şirket", "Komandit şirket", "Sermayesi paylara bölünmüş komandit şirket", "Kollektif şirket"], "a": 0, "e": "Kooperatif ticaret şirketidir ama m.124/2'deki ikili ayrımın dışında tutulmuştur; SPBKŞ sermaye şirketi, komandit ise şahıs şirketidir."}, {"q": "Aşağıdakilerden hangisi TTK'ya göre sermaye şirketi değildir?", "o": ["Anonim şirket", "Limited şirket", "Sermayesi paylara bölünmüş komandit şirket", "Komandit şirket", "Tek pay sahipli anonim şirket"], "a": 3, "e": "Kollektif ve komandit şirketler şahıs şirketidir; SPBKŞ ise sermaye şirketidir."}, {"q": "TTK'da ticaret şirketlerine ilişkin hüküm bulunmayan hallerde, TTK m.126 uyarınca niteliğine uygun düştüğü ölçüde hangi hükümler uygulanır?", "o": ["Yalnız SerPK hükümleri", "TMK'nın tüzel kişilere ilişkin genel hükümleri ile TBK'nın adi şirkete ilişkin m.620–645 hükümleri", "İcra ve İflas Kanunu hükümleri", "TBK'nın satım sözleşmesine ilişkin hükümleri", "Ticaret Bakanlığı tebliğleri"], "a": 1, "e": "TTK m.126 boşlukta TMK'nın tüzel kişilere ilişkin genel hükümlerini ve TBK m.620–645'i genel hüküm olarak uygular."}, {"q": "Ticaret şirketlerinin sınırlı sayı ilkesine tabi olmasının temel hukuki sonucu nedir?", "o": ["Her şirket en fazla beş ortakla kurulabilir", "Ticaret şirketlerinin işletme konusu kanunda sınırlı sayıda belirlenmiştir", "Şirketler yalnız Bakanlık izniyle kurulabilir", "Sermaye olarak getirilebilecek değerler sınırlı sayıdadır", "Kanunda sayılan türler dışında ya da türlerin özellikleri karıştırılarak yeni bir ticaret şirketi tipi kurulamaz"], "a": 4, "e": "Numerus clausus nedeniyle kanunda sayılmayan veya karma bir tip yaratılamaz; ayırt edici nitelikleri taşımayan ortaklık TBK m.620/2 gereği adi ortaklık sayılır."}, {"q": "Bir anonim şirket adına temsile yetkili kişi, işletme konusu dışında kalan bir sözleşmeyi iyi niyetli bir üçüncü kişiyle yapmıştır. TTK m.371/2'ye göre sonuç nedir?", "o": ["İşlem yok hükmündedir", "İşlem kesin hükümsüzdür", "İşlem şirketi bağlar", "İşlem ancak genel kurul onayıyla geçerli olur", "İşlem yalnız temsilciyi şahsen bağlar"], "a": 2, "e": "Ultra vires kalktığından konu dışı işlemler de şirketi bağlar; istisna, üçüncü kişinin bildiğinin veya bilebilecek durumda olduğunun ispatıdır."}, {"q": "TTK m.371/2 kapsamında, üçüncü kişinin işlemin işletme konusu dışında olduğunu bildiğinin ispatı bakımından aşağıdakilerden hangisi doğrudur?", "o": ["Esas sözleşmenin ilanı kesin delildir", "Esas sözleşmenin tescil ve ilan edilmiş olması tek başına yeterli delil değildir", "Ticaret sicilinin olumlu fonksiyonu nedeniyle herkes bilmiş sayılır", "İspat yükü daima üçüncü kişidedir", "Bilme hali ancak noter ihtarıyla ispatlanabilir"], "a": 1, "e": "Kanun açıkça esas sözleşmenin ilanının tek başına yeterli delil olmadığını belirtir; sicilin olumlu fonksiyonu burada işlemez."}, {"q": "Mülga 6762 sayılı TTK döneminde işletme konusu dışında yapılan işlemlerin hukuki durumu neydi?", "o": ["Şirketi her durumda bağlardı", "İptal edilebilir sayılırdı", "Askıda geçerli sayılırdı", "Yalnız genel kurul onayıyla geçerli olurdu", "Şirketi bağlamaz, yok hükmünde sayılırdı"], "a": 4, "e": "Ultra vires teorisi gereği eski dönemde konu dışı işlem yok hükmündeydi; 6102 sayılı TTK bu teoriyi terk etti."}, {"q": "Genel kurullara elektronik ortamda katılma ve oy kullanma sistemi hangi şirketler için zorunludur?", "o": ["Tüm anonim şirketler", "Bağımsız denetime tabi tüm sermaye şirketleri", "Pay senetleri borsaya kote edilmiş şirketler", "Sermayesi 500.000 TL'yi aşan şirketler", "Kayıtlı sermaye sistemindeki halka kapalı şirketler"], "a": 2, "e": "Elektronik genel kurul borsaya kote şirketlerde zorunlu, diğer şirketlerde ihtiyaridir."}, {"q": "Esas sermaye sistemindeki bir anonim şirketin asgari sermayesi ile bir limited şirketin asgari sermayesinin toplamı kaç TL'dir?", "o": ["300.000 TL", "550.000 TL", "260.000 TL", "750.000 TL", "250.000 TL"], "a": 0, "e": "AŞ esas sermaye sisteminde 250.000 TL (m.332/1), limited şirkette 50.000 TL (m.580/1); toplam 300.000 TL."}, {"q": "Kayıtlı sermaye sistemini benimseyen halka açık anonim ortaklıklar için kitaptaki bilgiye göre 2026 yılı asgari sermayesi ne kadardır?", "o": ["150 milyon TL", "500.000 TL", "100 milyon TL", "200 milyon TL", "250 milyon TL"], "a": 3, "e": "Kayıtlı Sermaye Sistemi Tebliği m.5/3: 2025 için 150 milyon TL, 2026 için 200 milyon TL."}, {"q": "Aşağıdakilerden hangisi TTK m.342 uyarınca anonim şirkete sermaye olarak konulabilir?", "o": ["Kurucunun kişisel emeği", "Ticari itibar", "Üzerinde haciz veya tedbir bulunmayan, devredilebilir bir marka hakkı", "Vadesi altı ay sonra gelecek bir alacak", "Hizmet edimi"], "a": 2, "e": "Hizmet edimleri, kişisel emek, ticari itibar ve vadesi gelmemiş alacaklar AŞ'ye sermaye olamaz; şartları taşıyan fikri mülkiyet hakları ayni sermaye olabilir."}, {"q": "Anonim şirkete sermaye olarak konulan bir taşınmaz hangi anda ayni sermaye olarak kabul edilir?", "o": ["Tapuya şerh verildiği anda", "Şirket sözleşmesinin noterce onaylandığı anda", "Şirketin ticaret siciline tescil edildiği anda", "Tapu siciline şirket adına tescil edildiği anda", "Bilirkişi raporunun mahkemece onaylandığı anda"], "a": 0, "e": "m.128/2: taşınmaz tapuya şerh verildiği anda ayni sermaye sayılır; şirketin tasarruf edebilmesi için ise tapuya tescil gerekir (m.128/5)."}, {"q": "Nakden taahhüt edilen 4.000.000 TL itibari değerli paylar için 400.000 TL çıkarma primi öngörülmüştür. Tescilden önce ödenmesi gereken asgari tutar nedir?", "o": ["1.000.000 TL", "1.100.000 TL", "400.000 TL", "1.400.000 TL", "4.400.000 TL"], "a": 3, "e": "İtibari değerin en az %25'i (1.000.000 TL) ve çıkarma priminin tamamı (400.000 TL) tescilden önce ödenir: 1.400.000 TL."}, {"q": "Nakden taahhüt edilen payların kalan bedeli şirketin tescilini izleyen hangi süre içinde ödenmelidir?", "o": ["12 ay", "24 ay", "3 ay", "36 ay", "6 ay"], "a": 1, "e": "m.344: itibari değerin en az %25'i tescilden önce, kalanı tescili izleyen yirmi dört ay içinde ödenir."}, {"q": "Sermaye olarak muaccel bir alacağını devreden ortak, alacak hangi süre içinde tahsil edilmezse temerrüt faizi öder?", "o": ["Tescilden itibaren üç ay", "Vade gününden itibaren on gün", "Esas sözleşme tarihinden itibaren altı ay", "Tescilden itibaren yirmi dört ay", "Şirket sözleşmesi veya esas sözleşme tarihinden itibaren bir ay"], "a": 4, "e": "m.130: muaccel alacak sözleşme tarihinden, vadesi gelmemiş alacak vade gününden itibaren bir ay içinde tahsil edilmelidir."}, {"q": "Kurulmakta olan anonim şirket, esas sözleşmedeki imzaların noterce onayından itibaren hangi süre içinde tüzel kişilik kazanamazsa bankaya yatırılan bedeller sahiplerine iade edilir?", "o": ["Bir ay", "İki ay", "Altı ay", "Üç ay", "Bir yıl"], "a": 3, "e": "m.345/2: noter onayı tarihinden itibaren üç ay içinde tüzel kişilik kazanılamazsa bedeller sicil yazısıyla iade edilir."}, {"q": "TTK m.346'ya göre süresinde halka arz edilmeyen payların bedelinin hangi oranı, iki aylık süreyi izleyen kaç gün içinde ödenir?", "o": ["Tamamı, üç gün içinde", "Yüzde yirmi beşi, üç gün içinde", "Yüzde yirmi beşi, on gün içinde", "Yüzde ellisi, yedi gün içinde", "Tamamı, bir ay içinde"], "a": 1, "e": "Halka arz edilip satılmayan payların tamamı, süresinde halka arz edilmeyenlerin yüzde yirmi beşi iki aylık süreyi izleyen üç gün içinde ödenir."}, {"q": "Anonim şirkette sermaye koyma borcunun ifası için açılacak eda davasını kim açabilir?", "o": ["Her ortak (actio pro socio)", "Şirket alacaklıları", "Ticaret Bakanlığı", "Yönetim kurulu üyeleri şahsen", "Yalnız şirket tüzel kişiliği"], "a": 4, "e": "Actio pro socio yalnız şahıs şirketlerinde tanınır; AŞ, limited ve SPBKŞ'de ifa davasını sadece şirket açabilir."}, {"q": "Sermaye koyma borcunu yerine getirmeyen pay sahibine ıskat ihtarında verilmesi gereken süre ve ıskat yetkisi olan organ hangisidir?", "o": ["Bir ay; genel kurul", "Üç ay; yönetim kurulu", "Bir ay; yönetim kurulu", "On beş gün; genel kurul", "Üç ay; asliye ticaret mahkemesi"], "a": 2, "e": "m.482: yönetim kurulu ilanla bir aylık süre verir; ödenmezse haklardan yoksun bırakma ve payı satma yetkisi yönetim kuruluna aittir."}, {"q": "Anonim şirkette sermaye koyma borcunun gecikmesi halinde sözleşme cezası uygulanabilmesi için ne gerekir?", "o": ["Esas sözleşmede bu konuda hüküm bulunması", "Genel kurulun oybirliğiyle karar alması", "Mahkemenin izin vermesi", "Pay sahibinin ıskat edilmiş olması", "Ticaret Bakanlığına bildirim yapılması"], "a": 0, "e": "m.482/3: sözleşme cezası ancak esas sözleşmede öngörülmüşse istenebilir."}, {"q": "Ortaklık sözleşmesinden doğan ve ortakların birbirleri veya ortaklık ile aralarındaki alacaklarda, TTK'da özel hüküm yoksa uygulanan zamanaşımı süresi nedir?", "o": ["İki yıl (TTK m.560)", "On yıl (TBK m.146)", "Bir yıl", "Üç yıl", "Beş yıl (TBK m.147)"], "a": 4, "e": "TTK'da genel zamanaşımı hükmü bulunmadığından TBK m.147/4'teki beş yıllık süre uygulanır; özel süre varsa o geçerlidir."}, {"q": "Bir anonim şirket ortağının kişisel alacaklısı ile ilgili TTK m.133 bakımından aşağıdakilerden hangisi yanlıştır?", "o": ["Alacaklı ortağa düşen kâr payına başvurabilir", "Alacaklı tasfiye payına başvurabilir", "Alacaklı yalnız kâr payına başvurabilir, paylar haczedilemez", "Payların İİK'nın taşınır hükümlerine göre haczini isteyebilir", "Haciz istek üzerine pay defterine işlenir"], "a": 2, "e": "Sermaye şirketlerinde alacaklı kâr ve tasfiye payına ek olarak senede bağlanmış veya bağlanmamış payları da haczettirip paraya çevirtebilir."}]}, {"id": 2, "kisa": "Birleşme, Bölünme, Tür D.", "baslik": "Birleşme, Bölünme ve Tür Değiştirme (TTK m.134–194)", "ozet": "Yapısal değişikliklerin türleri, izin verilen şirket kombinasyonları, sözleşme-rapor-inceleme-karar-tescil aşamaları, nisaplar, alacaklı ve işçi koruması ile denkleştirme, iptal ve sorumluluk davaları.", "notlar": "<h3>Genel çerçeve<\/h3><ul><li>Düzenleme: <b>TTK m.134–194<\/b>. Halka açık AŞ'lerde birleşme, bölünme ve tür değiştirme <b>SerPK m.23/1-a<\/b> uyarınca <b>önemli nitelikteki işlem<\/b>dir; SPK'nın <b>Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)<\/b> ile <b>Birleşme ve Bölünme Tebliği (II-23.2)<\/b> önem taşır.<\/li><li>AŞ; sermaye şirketleri, kooperatifler ve (devralan olmak koşuluyla) şahıs şirketleriyle <b>birleşebilir<\/b> (m.137); sermaye şirketlerine ve/veya kooperatiflere <b>bölünebilir<\/b> (m.160); başka türde bir sermaye şirketine (limited, SPBKŞ) veya kooperatife <b>dönüşebilir<\/b> (m.181).<\/li><li><b>m.194 (istisna):<\/b> bir <b>ticari işletme<\/b>, bir ticaret şirketi tarafından devralınarak onunla birleşebilir; ticari işletme ticaret şirketine, ticaret şirketi de ticari işletmeye dönüşebilir.<\/li><li>Üç özel dava: <b>denkleştirme davası (m.191)<\/b>, <b>iptal davası (m.192)<\/b>, <b>sorumluluk davası (m.193)<\/b>.<\/li><\/ul><h3>Birleşme<\/h3><ul><li>TTK birleşmeyi tanımlamaz; m.136 iki türünü sayar: <b>devralma şeklinde birleşme<\/b> (bir şirketin diğerini devralması) ve <b>yeni kuruluş şeklinde birleşme<\/b> (yeni bir şirkette bir araya gelme).<\/li><li>Özü: malvarlığının <b>tasfiye edilmeksizin<\/b> bir bütün olarak devri ve karşılığında devralan/yeni şirket paylarının önceden belirlenen <b>değişim oranına<\/b> göre ortaklara verilmesi.<\/li><li>II-23.2 Tebliği de kavramı tanımlamaz, türlerini belirler: devralma [m.4/1-e] ve yeni kuruluş [m.4/1-r].<\/li><\/ul><h4>Geçerli birleşmeler (TTK m.137)<\/h4><table><tr><th>Şirket<\/th><th>Birleşebileceği şirketler<\/th><\/tr><tr><td>Sermaye şirketi<\/td><td>Sermaye şirketleri; kooperatifler; <b>devralan olmak şartıyla<\/b> kollektif ve komandit şirketler<\/td><\/tr><tr><td>Şahıs şirketi<\/td><td>Şahıs şirketleri; <b>devrolunan olmak şartıyla<\/b> sermaye şirketleri ve kooperatifler<\/td><\/tr><tr><td>Kooperatif<\/td><td>Kooperatifler; sermaye şirketleri; <b>devralan olmak şartıyla<\/b> şahıs şirketleri<\/td><\/tr><\/table><ul><li>Dikkat: Şahıs şirketi bir sermaye şirketini <b>devralamaz<\/b>; ancak sermaye şirketi tarafından devralınabilir.<\/li><\/ul><h4>Ortaklık payının ve haklarının korunması (m.140) ve ayrılma akçesi (m.141)<\/h4><ul><li>Devrolunan şirket ortağı, payının değerini karşılayan ve eşit haklar veren <b>devralan şirket payı<\/b> isteyebilir (istem hakkı); hesapta malvarlığı değerleri, oy dağılımı ve diğer önemli hususlar dikkate alınır.<\/li><li><b>Denkleştirme ödemesi (m.140/2):<\/b> tahsis edilen payların <b>gerçek değerinin onda birini<\/b> aşmamak şartıyla öngörülebilir.<\/li><li>Oydan yoksun pay sahiplerine aynı değerde oydan yoksun veya oy hakkı veren pay; imtiyazlara eş değer hak veya uygun karşılık; <b>intifa senedi<\/b> sahiplerine eş değer hak ya da senetlerin <b>birleşme sözleşmesi tarihindeki gerçek değeriyle<\/b> satın alınması.<\/li><li>Gerekçe: \"ortaklık payları ve hakları\" <b>azlık haklarını kapsamaz<\/b>; oransal eşitlik nedeniyle devralan şirkette azlık konumu kaybolabilir.<\/li><li><b>Ayrılma akçesi:<\/b> sözleşmede ortaklara pay ile payın gerçek değerine denk ayrılma akçesi arasında <b>seçim hakkı<\/b> tanınabilir veya <b>sadece ayrılma akçesi<\/b> öngörülebilir.<\/li><\/ul><h4>Birleşme süreci<\/h4><ol><li><b>Ön görüşmeler.<\/b><\/li><li><b>Ara bilanço (m.144):<\/b> sözleşme imza tarihi ile bilanço günü arasında <b>6 aydan fazla<\/b> geçmişse veya malvarlığında önemli değişiklik olmuşsa zorunlu. Yıllık bilanço kuralları uygulanır; ancak <b>fiziki envanter gerekmez<\/b>, değerlemeler yalnız defter hareketleri ölçüsünde değişir.<\/li><li><b>Birleşme sözleşmesi (m.145–146):<\/b> <b>yazılı<\/b>; yönetim organlarınca imzalanır, genel kurullarca onaylanır. Zorunlu içerik: unvan, tür, merkez (yeni kuruluşta yeni şirketinkiler); değişim oranı ve denkleştirme tutarı; imtiyazlı/oydan yoksun pay ve intifa senedi sahiplerine tanınan haklar; payların değiştirilme şekli; bilanço kârına hak kazanma tarihi; ayrılma akçesi; devrolunanın işlemlerinin devralan hesabına yapılmış sayılacağı tarih; yönetim organlarına ve yönetici ortaklara tanınan özel yararlar; sınırsız sorumlu ortakların isimleri.<\/li><li><b>Birleşme raporu (m.147):<\/b> yönetim organlarınca ayrı ayrı veya birlikte; amaç ve sonuçlar, sözleşme, değişim oranı, ayrılma akçesi, değerleme özellikleri, sermaye artırımı, ek ödeme yükümleri, işçilere etkiler ve sosyal plan, alacaklılara etkiler, alınan onaylar hukuki ve ekonomik yönden açıklanır. Yeni kuruluşta yeni şirketin sözleşmesi eklenir.<\/li><li><b>İnceleme hakkı (m.149):<\/b> genel kurul kararından <b>önceki 30 gün<\/b> içinde, merkez ve şubelerde (halka açık AŞ'de ayrıca SPK'nın öngördüğü yerlerde); sözleşme, rapor, <b>son 3 yılın<\/b> yılsonu finansal tabloları ve faaliyet raporları ile ara bilanço incelemeye sunulur; internet sitesinde de yayımlanır. Suretler <b>bedelsiz<\/b>. Belgelerin tevdi yerleri <b>tevdiden en az 3 iş günü önce<\/b> TTSG, sözleşmedeki gazeteler ve internet sitesinde ilan edilir.<\/li><li><b>Malvarlığında önemli değişiklik (m.150):<\/b> sözleşme imzası ile genel kurul tarihi arasında olursa yönetim organı kendi genel kuruluna ve diğer şirketlerin yönetim organlarına <b>yazılı<\/b> bildirir; gerekirse öneri geri çekilir, yoksa uyarlama gerekmediğinin gerekçesi genel kurulda açıklanır.<\/li><li><b>Birleşme kararı (m.151):<\/b> nisaplar aşağıdaki tabloda.<\/li><li><b>Tescil ve ilan (m.152–153):<\/b> karar alınır alınmaz yönetim organı tescil başvurusu yapar; birleşme <b>tescille geçerlilik kazanır<\/b>. Devralan sermaye artırdıysa esas sözleşme değişikliği de sunulur. Birleşme kararı TTSG'de ilan edilir.<\/li><\/ol><ul><li>Dikkat: <b>Küçük ve orta ölçekli şirketler<\/b>, <b>tüm ortakların onayıyla<\/b> birleşme raporundan ve inceleme hakkından vazgeçebilir (m.147/4).<\/li><\/ul><table><tr><th>Şirket / durum<\/th><th>Birleşme kararı nisabı (m.151)<\/th><\/tr><tr><td>AŞ ve SPBKŞ<\/td><td>Esas veya çıkarılmış sermayenin <b>çoğunluğunu temsil<\/b> etmesi şartıyla genel kurulda mevcut oyların <b>dörtte üçü<\/b> (m.421/5-b saklı)<\/td><\/tr><tr><td>Kooperatif tarafından devralınacak sermaye şirketi<\/td><td>Sermayenin çoğunluğunu temsil şartıyla mevcut oyların <b>dörtte üçü<\/b><\/td><\/tr><tr><td>Limited şirket<\/td><td>Sermayenin <b>en az dörtte üçünü<\/b> temsil eden <b>tüm ortakların dörtte üçü<\/b><\/td><\/tr><tr><td>Kooperatif<\/td><td>Verilen oyların <b>üçte ikisi<\/b>; ek ödeme/kişisel edim/sınırsız sorumluluk getiriliyor veya genişletiliyorsa kayıtlı tüm ortakların <b>dörtte üçü<\/b><\/td><\/tr><tr><td>Kollektif ve komandit<\/td><td><b>Oybirliği<\/b>; şirket sözleşmesiyle tüm ortakların dörtte üçü öngörülebilir<\/td><\/tr><tr><td>SPBKŞ başka şirketi devralıyorsa<\/td><td>Ek olarak <b>komanditelerin tamamının yazılı onayı<\/b><\/td><\/tr><tr><td>Limited tarafından devralınan AŞ/SPBKŞ'de ek yükümlülük doğuyorsa<\/td><td><b>Bütün ortakların oybirliği<\/b><\/td><\/tr><tr><td>Sözleşme ayrılma akçesi öngörüyorsa<\/td><td>Devreden şahıs şirketinde oy hakkı olan ortakların, sermaye şirketinde mevcut oy haklarının <b>%90'ı<\/b><\/td><\/tr><tr><td>Devrolunanın işletme konusu değişiyorsa<\/td><td>Ayrıca şirket sözleşmesi değişikliği nisabı<\/td><\/tr><\/table><h4>Kolaylaştırılmış birleşme (m.155–156)<\/h4><table><tr><th>Hal<\/th><th>Şart<\/th><th>Kolaylık<\/th><\/tr><tr><td>Birinci (m.155/1)<\/td><td>Devralan, devrolunanın oy hakkı veren <b>bütün paylarına<\/b> sahip; veya bir kişi/grup birleşen sermaye şirketlerinin oy hakkı veren tüm paylarına sahip<\/td><td>Sözleşmede yalnız m.146/1'in (a) ve (f)–(i) bentleri; <b>rapor ve inceleme hakkı yok<\/b>; <b>genel kurul onayına sunmayabilir<\/b><\/td><\/tr><tr><td>İkinci (m.155/2)<\/td><td>Devralan, oy hakkı veren payların <b>en az %90'ına<\/b> sahip; azlığa pay yanında gerçek değere denk <b>nakdi karşılık<\/b> önerilmiş; ek ödeme/kişisel sorumluluk doğmuyor<\/td><td>Rapor ve genel kurul onayı gerekmez; ancak inceleme hakkı tescil başvurusundan <b>30 gün önce<\/b> sağlanmalı<\/td><\/tr><\/table><h4>Birleşmenin sonuçları<\/h4><ul><li><b>Külli halefiyet:<\/b> devralan, malvarlığını bir bütün halinde devralır (m.136/4); tescil anında tüm aktif ve pasif kendiliğinden geçer (m.153/1).<\/li><li><b>İnfisah:<\/b> devrolunan şirket tescille sona erer (m.152/3). Ortaklar devralanın ortağı olur (şirket hesabına başkası adına tutulan paylar hariç).<\/li><li><b>Alacaklılar (m.157):<\/b> TTSG'de <b>yedişer gün arayla üç kez<\/b> ve internet sitesinde ilan. Birleşmenin geçerlilik kazanmasından itibaren <b>3 ay<\/b> içinde istemde bulunanların alacakları teminat altına alınır; zarar görmeyecekleri anlaşılırsa borç ödenebilir.<\/li><li><b>Ortakların kişisel sorumluluğu (m.158):<\/b> birleşme kararının ilanından önce doğan (veya sebebi oluşan) borçlar için devam eder (şahıs şirketleri açısından anlamlı). Bu istemler ilan tarihinden itibaren <b>3 yılda<\/b> zamanaşımına uğrar; alacak sonra muaccel olursa süre muacceliyetten başlar.<\/li><li>m.158/3 (kamuya arz edilmiş tahvillerde sorumluluğun itfaya kadar sürmesi) uygulamada işlevsizdir: tahvili yalnız AŞ ihraç edebilir ve pay sahiplerinin kişisel sorumluluğu yoktur.<\/li><li>İş ilişkileri için bölünmedeki <b>m.178<\/b> uygulanır (m.158/4).<\/li><\/ul><h3>Bölünme<\/h3><table><tr><th>Tür<\/th><th>Özellik<\/th><\/tr><tr><td><b>Tam bölünme<\/b> [m.159/1-a]<\/td><td>Tüm malvarlığı bölümlere ayrılıp diğer şirketlere devredilir; bölünen şirket <b>sona erer<\/b>, unvanı sicilden silinir; ortakları devralan şirketlerin paylarını alır.<\/td><\/tr><tr><td><b>Kısmi bölünme<\/b> [m.159/1-b]<\/td><td>Malvarlığının bir veya birden fazla bölümü devredilir; paylar ya ortaklara verilir ya da bölünen şirket alır ve <b>yavru şirket<\/b> oluşur.<\/td><\/tr><tr><td>İştirak modeli (II-23.2 m.4/1-ı)<\/td><td>Bölünen şirket malvarlığını ayni sermaye olarak koyar, karşılığında <b>kendisi<\/b> devralanda pay sahibi olur.<\/td><\/tr><tr><td>Ortaklara pay devri modeli (II-23.2 m.4/1-n)<\/td><td>Bölünen şirket sona ermez; <b>ortakları<\/b> devralan şirketin ortağı olur.<\/td><\/tr><\/table><ul><li><b>Geçerli bölünmeler (m.160):<\/b> sermaye şirketleri ve kooperatifler, sermaye şirketlerine ve kooperatiflere bölünebilir. Sınırlı sayıdadır.<\/li><li>AŞ; limited, SPBKŞ veya kooperatife bölünebilir; kooperatif de AŞ ve/veya limitede bölünebilir. Dikkat: <b>AŞ şahıs şirketine bölünemez<\/b>, tersi de mümkün değildir.<\/li><li><b>Pay korunması (m.161, m.140'a atıf):<\/b> <b>oranların korunduğu<\/b> bölünmede ortaklara tüm şirketlerde mevcut payları oranında; <b>oranların korunmadığı<\/b> bölünmede bazı veya tüm şirketlerde farklı oranda pay verilir.<\/li><li><b>Ara bilanço (m.165):<\/b> bilanço günü ile sözleşme/plan tarihi arasında 6 aydan fazla süre veya önemli değişiklik; fiziki envanter gerekmez.<\/li><li><b>Bölünme sözleşmesi / planı:<\/b> mevcut şirketlere devirde yönetim organlarınca <b>sözleşme<\/b>; yeni kurulacak şirketlere devirde yönetim organınca <b>plan<\/b> (sözleşme yapacak iki taraf yoktur). İkisi de <b>yazılı<\/b> ve m.173'e göre genel kurul onaylı. İçerik m.167'de \"özellikle\" diye sayılır, <b>sınırlı sayıda değildir<\/b> (envanter, taşınmaz/kıymetli evrak listesi, değişim oranı, iş ilişkileri listesi vb.).<\/li><li><b>Bölünme raporu (m.169):<\/b> ayrı veya ortak; yeni kuruluşta plana yeni şirket sözleşmesi eklenir; KOBİ'ler tüm ortakların onayıyla vazgeçebilir.<\/li><li><b>İnceleme hakkı (m.171):<\/b> genel kurul kararından <b>2 ay önce<\/b> merkezde (halka açıkta SPK'nın uygun gördüğü yerlerde de); sözleşme/plan, rapor, son 3 yılın finansal tabloları ve faaliyet raporları, ara bilanço. Kopyalar bedelsiz; TTSG ve internet ilanı; KOBİ'ler tüm ortakların onayıyla vazgeçebilir.<\/li><li><b>Malvarlığı değişikliği:<\/b> m.150 kıyasen uygulanır (m.172).<\/li><li><b>Bölünme kararı (m.173):<\/b> gerekiyorsa alacaklar teminata bağlandıktan sonra genel kurula sunulur; m.151'in 1, 3, 4 ve 6. fıkralarındaki nisaplar uygulanır. Dikkat: <b>Oranların korunmadığı bölünmede<\/b> devreden şirkette oy hakkını haiz ortakların <b>en az %90'ı<\/b> gerekir (m.173/3).<\/li><li><b>Tescil (m.179):<\/b> bölünme tescille geçerlilik kazanır; envanterdeki aktif ve pasifler devralana geçer. Kısmi bölünmede sermaye azaltımı gerekiyorsa esas sözleşme değişikliği de tescil edilir. <b>Tam bölünmede<\/b> devreden şirket tescille <b>infisah<\/b> eder.<\/li><\/ul><h4>Bölünmede alacaklı ve işçi koruması<\/h4><ul><li><b>m.174–175:<\/b> TTSG'de <b>yedişer gün arayla üç<\/b> ilan (sermaye şirketlerinde internet sitesinde de); ilanlardan itibaren <b>3 ay<\/b> içinde istemde bulunanların alacakları teminat altına alınır. Alacağın tehlikeye düşmediği ispatlanırsa yükümlülük kalkar; zarar yoksa teminat yerine borç ödenebilir.<\/li><li><b>m.176 ikinci derece sorumluluk:<\/b> borç kendisine tahsis edilen (birinci derece sorumlu) şirket ödemezse diğer şirketler <b>müteselsilen<\/b> sorumludur. Kapsama yalnız bölünmeyle devredilip ifa edilmeyen borçlar girer.<\/li><li>İkinci derece sorumlulara gidebilmek için alacak teminata bağlanmamış ve birinci derece sorumlu şirket: <b>(a)<\/b> iflas etmiş, <b>(b)<\/b> konkordato süresi almış, <b>(c)<\/b> kesin aciz vesikası şartları doğmuş, <b>(ç)<\/b> merkezi yurt dışına taşınmış ve Türkiye'de takip edilemez olmuş veya <b>(d)<\/b> yurt dışındaki merkezi değişmiş ve takip önemli ölçüde güçleşmiş olmalıdır.<\/li><li>Ortakların kişisel sorumluluğu için <b>m.158<\/b> uygulanır (m.177).<\/li><li><b>m.178 iş ilişkileri:<\/b> hizmet sözleşmeleri işçi itiraz etmezse tüm hak ve borçlarla devralana geçer. İşçi itiraz ederse sözleşme kanuni işten çıkarma süresi sonunda biter. Eski işveren ve devralan belirli alacaklardan <b>müteselsilen<\/b> sorumludur; işçi teminat isteyebilir; işveren, aksi kararlaştırılmadıkça hakları üçüncü kişiye devredemez.<\/li><\/ul><h3>Tür değiştirme<\/h3><ul><li>Düzenleme <b>m.180–190<\/b>. Tasfiye olmadan ekonomik varlığı koruyarak başka türe dönüşme. <b>m.180:<\/b> yeni türe dönüştürülen şirket <b>eskisinin devamıdır<\/b>; hukuki ilişkiler değişmez.<\/li><\/ul><table><tr><th>Şirket<\/th><th>Dönüşebileceği türler (m.181)<\/th><\/tr><tr><td>Sermaye şirketi<\/td><td>Başka türde sermaye şirketi; kooperatif<\/td><\/tr><tr><td>Kollektif şirket<\/td><td>Sermaye şirketi; kooperatif; komandit şirket<\/td><\/tr><tr><td>Komandit şirket<\/td><td>Sermaye şirketi; kooperatif; kollektif şirket<\/td><\/tr><tr><td>Kooperatif<\/td><td>Sermaye şirketi<\/td><\/tr><\/table><ul><li><b>m.182:<\/b> kollektif, bir komanditerin girmesi veya bir ortağın komanditer olmasıyla komandite; komandit, tüm komanditerlerin çıkması veya komandite olmasıyla kollektife dönüşür. Bu dönüşümlere <b>m.180–190 uygulanmaz<\/b>; tek kişi işletmesi olarak devama ilişkin m.257 saklıdır.<\/li><li><b>Korunma (m.183):<\/b> oydan yoksun paylara eşit değerde pay veya oy hakkı veren pay; imtiyazlı paylara aynı değerde pay veya uygun tazminat; intifa senetlerine aynı değerde hak veya plan tarihindeki gerçek değer.<\/li><li><b>Ara bilanço (m.184):<\/b> bilanço günü ile tür değiştirme <b>raporu<\/b> tarihi arasında 6 aydan fazla veya önemli değişiklik. Yeni türün kuruluş hükümleri uygulanır; ancak sermaye şirketlerinde <b>asgari ortak sayısı<\/b> ve <b>ayni sermaye<\/b> hükümleri uygulanmaz.<\/li><li><b>Tür değiştirme planı (m.185):<\/b> yönetim organı hazırlar; yazılı; m.189'a göre genel kurul onayı. Asgari içerik: önceki ve sonraki unvan, merkez, yeni tür ibaresi; yeni türün şirket sözleşmesi; ortakların sonraki paylarının sayısı, cinsi, tutarı.<\/li><li><b>Tür değiştirme raporu (m.186):<\/b> amaç ve sonuçlar, kuruluş hükümlerinin yerine getirildiği, yeni sözleşme, değişim oranı, ek ödeme ve kişisel sorumluluklar, yeni türden doğan yükümlülükler. KOBİ'ler tüm ortakların onayıyla vazgeçebilir.<\/li><li><b>İnceleme hakkı (m.188):<\/b> genel kurul kararından <b>30 gün önce<\/b> merkezde (halka açıkta SPK'nın istediği yerlerde); plan, rapor, son 3 yılın finansal tabloları, ara bilanço; kopyalar <b>bedelsiz<\/b>.<\/li><li><b>Tescil ve ilan:<\/b> tür değiştirme ve yeni sözleşme tescil edilir, <b>tescille geçerlilik<\/b> kazanır; TTSG'de ilan edilir; görev yönetim organındadır (m.189/2).<\/li><li><b>Sonuç:<\/b> tasfiye ve yeni kuruluş yoktur; tüzel kişilik devam eder. Ortakların kişisel sorumluluğu için m.158, iş sözleşmeleri için m.178 uygulanır (m.190).<\/li><\/ul><table><tr><th>Şirket / durum<\/th><th>Tür değiştirme kararı nisabı (m.189)<\/th><\/tr><tr><td>AŞ ve SPBKŞ<\/td><td>Esas veya çıkarılmış sermayenin <b>üçte ikisini<\/b> karşılaması şartıyla genel kurulda mevcut oyların <b>üçte ikisi<\/b> (m.421/5-b saklı)<\/td><\/tr><tr><td>AŞ/SPBKŞ'nin limitede dönüşmesinde ek ödeme veya kişisel edim doğacaksa<\/td><td><b>Tüm ortakların onayı<\/b><\/td><\/tr><tr><td>Sermaye şirketinin kooperatife dönüşmesi<\/td><td><b>Tüm ortakların onayı<\/b><\/td><\/tr><tr><td>Limited şirket<\/td><td>Sermayenin en az <b>dörtte üçüne<\/b> sahip ortakların <b>dörtte üçü<\/b><\/td><\/tr><tr><td>Kooperatif<\/td><td>Ortakların en az üçte ikisi temsil edilmek şartıyla mevcut oyların <b>çoğunluğu<\/b>; ek yük varsa kayıtlı ortakların <b>üçte ikisinin<\/b> olumlu oyu<\/td><\/tr><tr><td>Kollektif ve komandit<\/td><td><b>Oybirliği<\/b>; sözleşmeyle tüm ortakların <b>üçte ikisi<\/b> öngörülebilir<\/td><\/tr><\/table><ul><li>Dikkat: Birleşmede AŞ nisabı \"sermayenin çoğunluğu + mevcut oyların <b>dörtte üçü<\/b>\", tür değiştirmede \"sermayenin <b>üçte ikisi<\/b> + mevcut oyların <b>üçte ikisi<\/b>\"dir. Kollektif/komanditte sözleşmeyle indirilebilen nisap birleşmede <b>dörtte üç<\/b>, tür değiştirmede <b>üçte iki<\/b>dir.<\/li><\/ul><h3>Yapısal değişiklik davaları<\/h3><table><tr><th><\/th><th>Denkleştirme davası (m.191)<\/th><th>İptal davası (m.192)<\/th><th>Sorumluluk davası (m.193)<\/th><\/tr><tr><td>Konu<\/td><td>Payların/hakların gereği gibi korunmaması veya ayrılma karşılığının uygun belirlenmemesi; uygun denkleştirme akçesinin saptanması<\/td><td>m.134–190'ın ihlali<\/td><td>İşlemlere katılan kişilerin kusurla verdikleri zarar<\/td><\/tr><tr><td>Davacı<\/td><td><b>Her ortak<\/b><\/td><td>Karara <b>olumlu oy vermemiş ve bunu tutanağa geçirmiş<\/b> ortaklar; yönetim organı kararına karşı da açılabilir (kolaylaştırılmış birleşme)<\/td><td><b>Şirketler, ortaklar, alacaklılar<\/b><\/td><\/tr><tr><td>Süre<\/td><td>Kararın TTSG'de ilanından itibaren <b>2 ay<\/b> (hak düşürücü)<\/td><td>TTSG ilanından itibaren <b>2 ay<\/b> (hak düşürücü); ilan gerekmiyorsa tescilden<\/td><td>Hak düşürücü süre yok; m.560 gereği öğrenmeden <b>2 yıl<\/b>, her halde fiilden <b>5 yıl<\/b> zamanaşımı<\/td><\/tr><tr><td>Mahkeme<\/td><td>Katılan şirketlerden birinin merkezindeki asliye ticaret<\/td><td>Eksiklik için önce <b>süre verir<\/b>, giderilmezse iptal eder<\/td><td>Eda davası<\/td><\/tr><tr><td>Not<\/td><td>m.140/2'deki onda bir sınırı <b>uygulanmaz<\/b>; karar aynı durumdaki tüm ortaklar için sonuç doğurur; giderler kural olarak <b>devralan şirkete<\/b> aittir (HMK 326/1'e istisna); dava işlemin geçerliliğini <b>etkilemez<\/b><\/td><td>İptal kararı bozucu yenilik doğurur, iç ilişkide <b>geçmişe etkili (ex tunc)<\/b>; üçüncü kişilerin kazanılmış hakları saklı<\/td><td>Kurucuların sorumluluğu saklı; m.202–208, 555, 557, 560 saklı; iflasta m.556, 570 ve Koop. K. m.98 kıyasen<\/td><\/tr><\/table>", "sorular": [{"q": "TTK m.137'ye göre bir kollektif şirket bir anonim şirketle hangi koşulla birleşebilir?", "o": ["Kollektif şirketin devralan şirket olması koşuluyla", "Hiçbir koşulda birleşemez", "Kollektif şirketin devrolunan şirket olması koşuluyla", "Yalnız yeni kuruluş yoluyla", "Ticaret Bakanlığının izniyle her iki şekilde de"], "a": 2, "e": "Şahıs şirketleri sermaye şirketleriyle ancak devrolunan şirket olmaları şartıyla birleşebilir."}, {"q": "Aşağıdaki birleşmelerden hangisi TTK m.137'ye göre geçerli değildir?", "o": ["Bir komandit şirketin bir limited şirketi devralması", "Bir anonim şirketin bir kooperatifle birleşmesi", "Bir kooperatifin bir kollektif şirketi devralması", "Bir limited şirketin bir komandit şirketi devralması", "İki kollektif şirketin birleşmesi"], "a": 0, "e": "Şahıs şirketi bir sermaye şirketini devralamaz; ancak sermaye şirketi tarafından devralınabilir."}, {"q": "Birleşmede ortaklık paylarının değişim oranı belirlenirken öngörülebilecek denkleştirme ödemesi en fazla ne kadar olabilir?", "o": ["Tahsis edilen payların itibari değerinin onda biri", "Gerçek değerin dörtte biri", "Gerçek değerin yüzde beşi", "Tahsis edilen payların gerçek değerinin onda biri", "Sınır yoktur"], "a": 3, "e": "m.140/2: denkleştirme ödemesi tahsis olunan payların gerçek değerinin onda birini aşamaz."}, {"q": "Birleşmede devrolunan şirket ortağına tahsis edilen payların gerçek değeri 2.400.000 TL'dir. TTK m.140/2'ye göre ödenebilecek azami denkleştirme tutarı nedir?", "o": ["600.000 TL", "240.000 TL", "24.000 TL", "120.000 TL", "2.400.000 TL"], "a": 1, "e": "Denkleştirme gerçek değerin onda birini aşamaz: 2.400.000 / 10 = 240.000 TL."}, {"q": "Birleşme sözleşmesinin imzalandığı tarih ile bilanço günü arasında en az ne kadar süre geçmişse ara bilanço çıkarılması zorunludur?", "o": ["Üç aydan fazla", "Bir yıldan fazla", "Dokuz aydan fazla", "İki aydan fazla", "Altı aydan fazla"], "a": 4, "e": "m.144: altı aydan fazla süre geçmişse veya malvarlığında önemli değişiklik olmuşsa ara bilanço zorunludur."}, {"q": "Birleşmede ortakların inceleme hakkı, genel kurul kararından önceki kaç gün içinde sağlanmalıdır?", "o": ["15 gün", "2 ay", "3 iş günü", "30 gün", "60 gün"], "a": 3, "e": "m.149: birleşmede belgeler genel kurul kararından önceki otuz gün içinde incelemeye sunulur. Bölünmede bu süre iki aydır."}, {"q": "Bölünmede ortakların inceleme hakkı genel kurul kararından ne kadar önce sağlanmalıdır?", "o": ["Otuz gün", "İki ay", "On beş gün", "Üç ay", "Bir hafta"], "a": 1, "e": "m.171: bölünmeye katılan şirketler belgeleri genel kurul kararından iki ay önce incelemeye sunar."}, {"q": "Esas sermayesi 10.000.000 TL olan bir AŞ'nin birleşme genel kurulunda sermayenin 6.000.000 TL'lik kısmı temsil edilmektedir ve her 1 TL bir oydur. Birleşme kararı için asgari kaç olumlu oy gerekir?", "o": ["5.000.001", "4.000.000", "7.500.000", "3.000.001", "4.500.000"], "a": 4, "e": "Sermayenin çoğunluğu temsil edildiğinden nisap sağlanmıştır; mevcut oyların dörtte üçü gerekir: 6.000.000 x 3/4 = 4.500.000."}, {"q": "Birleşme sözleşmesi yalnız ayrılma akçesi öngörüyorsa, devreden sermaye şirketinde karar için gereken nisap nedir?", "o": ["Mevcut oyların dörtte üçü", "Oybirliği", "Şirkette mevcut oy haklarının yüzde doksanının olumlu oyu", "Sermayenin üçte ikisi", "Mevcut oyların salt çoğunluğu"], "a": 2, "e": "m.151: ayrılma akçesi öngörülmüşse sermaye şirketinde mevcut oy haklarının yüzde doksanının olumlu oyu gerekir."}, {"q": "Kollektif ve komandit şirketlerde birleşme sözleşmesi kural olarak nasıl onaylanır?", "o": ["Oybirliğiyle; şirket sözleşmesinde tüm ortakların dörtte üçü öngörülebilir", "Ortakların salt çoğunluğuyla", "Oybirliğiyle; şirket sözleşmesinde üçte iki öngörülebilir", "Sermayenin dörtte üçüyle", "Yöneticilerin kararıyla"], "a": 0, "e": "Birleşmede kollektif ve komanditte kural oybirliğidir; sözleşmeyle tüm ortakların dörtte üçü öngörülebilir. Tür değiştirmede bu oran üçte ikidir."}, {"q": "Kolaylaştırılmış birleşmenin ikinci halinde (m.155/2) devralan şirketin devrolunan şirketin oy hakkı veren paylarının en az ne kadarına sahip olması gerekir?", "o": ["Yüzde yetmiş beş", "Yüzde elli bir", "Yüzde yüz", "Yüzde altmış yedi", "Yüzde doksan"], "a": 4, "e": "Devralan oy hakkı veren payların en az yüzde doksanına sahipse ve azlığa gerçek değere denk nakdi karşılık önerilmişse kolaylaştırılmış usul uygulanabilir."}, {"q": "Birleşmede alacaklıların korunmasına ilişkin TTK m.157 hükmüne göre aşağıdakilerden hangisi doğrudur?", "o": ["Alacaklılara TTSG'de bir kez ilan yapılması yeterlidir", "Teminat süresi ilandan itibaren bir aydır", "Birleşmenin geçerlilik kazanmasından itibaren üç ay içinde istemde bulunan alacaklıların alacakları teminat altına alınır", "Şirket hiçbir durumda teminat yerine borcu ödeyemez", "Alacaklılar birleşmeye itiraz ederek tescili durdurur"], "a": 2, "e": "İlan yedişer gün arayla üç kez yapılır; üç ay içinde istemde bulunanlara teminat verilir; zarar görmeyecekleri anlaşılırsa borç ödenebilir."}, {"q": "Birleşmede devrolunan şirketin borçlarından doğan ortakların kişisel sorumluluğuna ilişkin istemler hangi süre geçince zamanaşımına uğrar?", "o": ["Birleşme kararının ilanından itibaren üç yıl", "Tescilden itibaren iki yıl", "İlandan itibaren beş yıl", "İlandan itibaren bir yıl", "Tescilden itibaren on yıl"], "a": 0, "e": "m.158/2: üç yıl; alacak ilandan sonra muaccel olursa süre muacceliyet tarihinden başlar."}, {"q": "TTK m.160'a göre aşağıdaki bölünmelerden hangisi mümkün değildir?", "o": ["Bir anonim şirketin bir limited şirkete bölünmesi", "Bir kooperatifin bir anonim şirkete bölünmesi", "Bir anonim şirketin bir kooperatife bölünmesi", "Bir anonim şirketin bir kollektif şirkete bölünmesi", "Bir limited şirketin bir SPBKŞ'ye bölünmesi"], "a": 3, "e": "Sermaye şirketleri ve kooperatifler yalnız sermaye şirketlerine ve kooperatiflere bölünebilir; AŞ şahıs şirketine bölünemez."}, {"q": "Bölünen şirketin, bölünmeye konu malvarlığını başka bir şirkete ayni sermaye olarak koyup karşılığında devralan şirkette kendisinin pay sahibi olduğu bölünme türü hangisidir?", "o": ["Ortaklara pay devri modeliyle kısmi bölünme", "İştirak modeliyle kısmi bölünme", "Tam bölünme", "Oranların korunduğu tam bölünme", "Yeni kuruluş şeklinde birleşme"], "a": 1, "e": "II-23.2 m.4/1-ı: iştirak modelinde payları bölünen şirketin kendisi alır; ortaklara pay devri modelinde ortaklar alır."}, {"q": "Bölünen şirket bölümlerini yeni kurulacak şirketlere devredecekse yönetim organı hangi belgeyi düzenler?", "o": ["Bölünme planı", "Bölünme sözleşmesi", "Birleşme sözleşmesi", "Tür değiştirme planı", "Kuruluş beyanı"], "a": 0, "e": "Mevcut şirketlere devirde bölünme sözleşmesi, yeni şirketlere devirde bölünme planı düzenlenir; çünkü sözleşme yapacak ikinci taraf yoktur."}, {"q": "Oranların korunmadığı bölünmede onama kararı için devreden şirkette hangi nisap aranır?", "o": ["Mevcut oyların dörtte üçü", "Oybirliği", "Sermayenin üçte ikisi", "Oy hakkını haiz ortakların en az yüzde doksanı", "Mevcut oyların salt çoğunluğu"], "a": 3, "e": "m.173/3: oranın korunmadığı bölünmede devreden şirkette oy hakkını haiz ortakların en az yüzde doksanı gerekir."}, {"q": "Bölünmede ikinci derecede sorumlu şirketlerin takip edilebilmesi için birinci derece sorumlu şirkete ilişkin aşağıdakilerden hangisi aranan hallerden biri değildir?", "o": ["İflas etmiş olması", "Birinci derece sorumlu şirketin yönetim kurulunun değişmiş olması", "Konkordato süresi almış olması", "Kesin aciz vesikası alınması şartlarının doğmuş olması", "Merkezinin yurt dışına taşınıp Türkiye'de takip edilemez hale gelmiş olması"], "a": 1, "e": "m.176/2 iflas, konkordato süresi, kesin aciz vesikası şartları, merkezin yurt dışına taşınması ve yurt dışı merkezin değişmesi hallerini sayar."}, {"q": "TTK m.181'e göre bir kooperatif hangi türe dönüşebilir?", "o": ["Kollektif şirkete", "Komandit şirkete", "Adi şirkete", "Herhangi bir ticaret şirketine", "Sermaye şirketine"], "a": 4, "e": "Kooperatif yalnız bir sermaye şirketine dönüşebilir."}, {"q": "Bir anonim şirketin limited şirkete dönüşmesinde ek ödeme veya kişisel edim yükümlülüğü doğmuyorsa tür değiştirme kararı hangi nisapla alınır?", "o": ["Sermayenin çoğunluğunu temsil şartıyla mevcut oyların dörtte üçüyle", "Tüm ortakların onayıyla", "Sermayenin üçte ikisini karşılaması şartıyla genel kurulda mevcut oyların üçte ikisiyle", "Mevcut oyların salt çoğunluğuyla", "Sermayenin yüzde yetmiş beşinin olumlu oyuyla"], "a": 2, "e": "m.189: AŞ'de tür değiştirme için sermayenin üçte ikisi ve mevcut oyların üçte ikisi gerekir; ek yükümlülük doğacaksa tüm ortakların onayı aranır."}, {"q": "Bir anonim şirketin kooperatife dönüşmesi için gereken karar nisabı nedir?", "o": ["Mevcut oyların üçte ikisi", "Tüm ortakların onayı", "Mevcut oyların dörtte üçü", "Oy haklarının yüzde doksanı", "Ortakların salt çoğunluğu"], "a": 1, "e": "m.189: bir sermaye şirketinin kooperatife dönüşmesi tüm ortakların onayını gerektirir."}, {"q": "Tür değiştirmede yeni türün kuruluş hükümleri uygulanırken sermaye şirketlerinde hangi hükümler uygulanmaz?", "o": ["Esas sözleşmenin tesciline ilişkin hükümler", "Asgari sermayeye ilişkin hükümler", "Ticaret unvanına ilişkin hükümler", "Organlara ilişkin hükümler", "Ortakların asgari sayısına ve ayni sermaye konulmasına ilişkin hükümler"], "a": 4, "e": "m.184: sermaye şirketlerinde asgari ortak sayısı ve ayni sermaye hükümleri tür değiştirmede uygulanmaz."}, {"q": "TTK m.191'deki denkleştirme davası ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Her ortak bu davayı açabilir", "Dava TTSG ilanından itibaren iki ay içinde açılır", "Dava, birleşme kararının geçerliliğini kendiliğinden ortadan kaldırır", "Giderler kural olarak devralan şirkete aittir", "m.140/2'deki onda bir sınırı uygulanmaz"], "a": 2, "e": "m.191/4: denkleştirme davası tek başına birleşme, bölünme veya tür değiştirme kararının geçerliliğini etkilemez."}, {"q": "Birleşme, bölünme veya tür değiştirme kararına karşı TTK m.192'deki iptal davasını kimler açabilir?", "o": ["Karara olumlu oy vermemiş ve bunu tutanağa geçirmiş ortaklar", "Her ortak, oyuna bakılmaksızın", "Yalnız şirket alacaklıları", "Yalnız Ticaret Bakanlığı", "Sermayenin onda birine sahip azlık"], "a": 0, "e": "İptal davası için olumsuz oy ve tutanağa geçirme şarttır; süre TTSG ilanından itibaren iki aydır."}, {"q": "Yapısal değişiklik işlemlerine katılan kişilere karşı TTK m.193'e göre açılan sorumluluk davası için hangi zamanaşımı uygulanır?", "o": ["TTSG ilanından itibaren iki ay", "İlandan itibaren üç yıl", "Tescilden itibaren bir yıl", "Zararı ve sorumluyu öğrenmeden itibaren iki, her halde fiilden itibaren beş yıl", "On yıl"], "a": 3, "e": "m.193'te hak düşürücü süre yoktur; saklı tutulan m.560 gereği iki yıl ve beş yıllık zamanaşımı uygulanır."}]}, {"id": 3, "kisa": "Şirketler Topluluğu", "baslik": "Şirketler Topluluğu: Hâkimiyet, Bildirim, Raporlama ve Sorumluluk (TTK m.195–209)", "ozet": "Hâkimiyet ilişkisinin kurulması, yönetim kontrolünden farkı, karşılıklı iştirak, pay bildirim eşikleri, bağlılık raporu, satın alma hakkı ve hâkim şirketin kayıp denkleştirme, tam hâkimiyet ve güven sorumluluğu.", "notlar": "<h3>Hâkimiyet ilişkisinin kurulması (TTK m.195)<\/h3><p>Bir ticaret şirketi diğerinde <b>doğrudan veya dolaylı<\/b> olarak aşağıdakilerden birini sağlıyorsa birinci şirket <b>hâkim<\/b>, diğeri <b>bağlı<\/b> şirkettir:<\/p><ol><li><b>Oy haklarının çoğunluğuna<\/b> sahip olmak,<\/li><li>Şirket sözleşmesi uyarınca <b>yönetim organında karar alabilecek çoğunluğu oluşturan sayıda üyeyi seçebilme<\/b> hakkı,<\/li><li>Kendi oyları yanında bir <b>sözleşmeye dayanarak<\/b>, tek başına veya diğer ortaklarla birlikte oy haklarının çoğunluğunu oluşturmak,<\/li><li>Diğer şirketi bir <b>sözleşme gereğince veya başka bir yolla<\/b> hâkimiyeti altında tutabilmek.<\/li><\/ol><ul><li><b>Hâkimiyet sözleşmesi<\/b>nin geçerliliği için <b>ticaret siciline tescil ve ilanı<\/b> şarttır. Sözleşmenin geçersizliği, şirketler topluluğuna ilişkin yükümlülük ve sorumlulukların uygulanmasını engellemez.<\/li><li><b>Karine (m.195/2):<\/b> bu haller dışında bir şirketin diğerinin <b>paylarının çoğunluğuna<\/b> veya onu yönetebilecek kararları alabilecek miktarda payına sahip olması hâkimiyet karinesidir.<\/li><li><b>Dolaylı hâkimiyet (m.195/3):<\/b> bir veya birkaç bağlı şirket aracılığıyla da kurulabilir. Hâkim şirket ve doğrudan/dolaylı bağlı şirketler birlikte <b>şirketler topluluğu<\/b>nu oluşturur (hâkim = \"ana\", bağlı = \"yavru\").<\/li><li>Hâkim, merkezi veya yerleşim yeri <b>yurt içinde veya dışında<\/b> bulunan bir teşebbüs olsa da m.195–209 uygulanır; konsolide tablolara ilişkin hükümler saklıdır.<\/li><li><b>\"Hâkim teşebbüs\" tacir sayılır.<\/b> Topluluğun tepesinde sermaye şirketi olmayan özel/kamu tüzel kişisi, gerçek kişi veya ticari işletme bulunabilir; bu durum topluluk sayılmaya engel değildir.<\/li><li><b>m.195/6 terim uyarlaması:<\/b> \"yönetim kurulu\" ifadesi limited şirkette <b>müdürleri<\/b>, SPBKŞ ve şahıs şirketlerinde <b>yöneticileri<\/b>, diğer tüzel kişilerde <b>yönetim organını<\/b>, gerçek kişilerde <b>kişinin kendisini<\/b> ifade eder.<\/li><\/ul><h3>Hâkimiyet ile SerPK'daki \"yönetim kontrolü\"nün karşılaştırılması<\/h3><ul><li><b>SerPK m.26/2:<\/b> halka açık bir ortaklıkta (a) oy haklarının <b>%50'sinden fazlasına<\/b> tek başına veya birlikte hareket edilen kişilerle doğrudan/dolaylı sahip olmak, (b) yönetim kurulu üye sayısının <b>salt çoğunluğunu seçme<\/b> veya genel kurulda bu çoğunluk için <b>aday gösterme hakkı veren imtiyazlı paylara<\/b> sahip olmak yönetim kontrolüdür.<\/li><\/ul><table><tr><th>Ölçüt<\/th><th>TTK hâkimiyet ilişkisi<\/th><th>SerPK yönetim kontrolü<\/th><\/tr><tr><td>Kapsam<\/td><td>Halka açık olsun olmasın <b>bütün<\/b> şirketler<\/td><td>Yalnız <b>halka açık<\/b> ortaklıklar<\/td><\/tr><tr><td>Kriterler<\/td><td>Kısmen örtüşür; her iki kavramın kendine özgü kriterleri vardır<\/td><td>Oyların %50'sinden fazlası veya YK çoğunluğu için seçme/aday gösterme imtiyazı<\/td><\/tr><tr><td>Hukuki sonuç<\/td><td>TTK m.195–209'daki topluluk hükümleri<\/td><td><b>Pay alım teklifi zorunluluğu<\/b> (SerPK m.26)<\/td><\/tr><\/table><h3>Karşılıklı iştirak (m.197) ve hakların donması (m.201)<\/h3><ul><li>Birbirlerinin paylarının <b>en az dörtte birine<\/b> sahip sermaye şirketleri karşılıklı iştirak durumundadır; yüzdeler <b>m.196<\/b>'ya göre hesaplanır.<\/li><li>Biri diğerine hâkimse ikincisi aynı zamanda bağlı şirkettir; her biri diğerine hâkimse ikisi de hem hâkim hem bağlıdır.<\/li><li>Gerekçe: karşılıklı iştirak <b>geçersiz değildir<\/b>, fakat hâkim/bağlı şirket yükümlülüklerini ve sınırlamaları getirir.<\/li><li><b>m.201:<\/b> karşılıklı iştirak konumuna <b>bilerek<\/b> giren şirket, iştirak paylarından doğan oyların ve diğer pay sahipliği haklarının yalnız <b>dörtte birini<\/b> kullanabilir; <b>bedelsiz pay edinme hakkı hariç<\/b> diğer haklar donar. Bu paylar toplantı ve karar nisabında <b>dikkate alınmaz<\/b>. m.389 ve m.612 saklıdır.<\/li><li>Dikkat: Bu sınırlama, <b>bağlı şirketin hâkim şirketin paylarını iktisap etmesi<\/b> veya <b>iki şirketin birbirine hâkim olması<\/b> halinde uygulanmaz (m.201/2).<\/li><\/ul><h3>Bildirim, tescil ve ilan yükümlülüğü (m.198)<\/h3><ul><li>Bir teşebbüs, bir sermaye şirketinin sermayesinin doğrudan veya dolaylı olarak <b>%5, %10, %20, %25, %33, %50, %67 veya %100<\/b>'ünü temsil eden paylarına ulaşır veya bu eşiklerin altına düşerse, işlemlerin tamamlanmasını izleyen <b>10 gün<\/b> içinde sermaye şirketine ve kanunlarda gösterilen yetkili makamlara bildirir.<\/li><li>Bu oranlarda kazanma veya elden çıkarma, <b>yıllık faaliyet ve denetleme raporlarında ayrı başlık<\/b> altında açıklanır ve şirketin <b>internet sitesinde<\/b> ilan edilir. Yüzde hesabında m.196 uygulanır.<\/li><li>Teşebbüsün ve sermaye şirketinin <b>YK üyeleri ve yöneticileri<\/b>; kendilerinin, <b>eşlerinin<\/b>, <b>velayetleri altındaki çocuklarının<\/b> ve bunların sermayesinin <b>en az %20'sine<\/b> sahip oldukları ticaret şirketlerinin paylarını da bildirir.<\/li><li>Bildirimler <b>yazılı<\/b> yapılır, ticaret siciline <b>tescil ve ilan<\/b> edilir.<\/li><li>Dikkat: Yükümlülük yerine getirilmedikçe ilgili paylara ait <b>oy hakkı dahil diğer haklar donar<\/b>.<\/li><\/ul><h3>Raporlar ve bilgi alma<\/h3><ul><li><b>Bağlılık raporu (m.199):<\/b> bağlı şirketin yönetim kurulu, faaliyet yılının <b>ilk üç ayı<\/b> içinde şirketin hâkim ve bağlı şirketlerle ilişkileri hakkında doğru ve dürüst hesap verme ilkelerine uygun rapor düzenler. Geçmiş yıldaki tüm hukuki işlemler ve alınan/alınmasından kaçınılan önlemler, edim-karşı edim, yarar-zarar ve zararın nasıl denkleştirildiği açıklanır.<\/li><li>Raporun sonunda YK, her işlemde uygun karşı edim sağlanıp sağlanmadığını ve şirketin zarara uğrayıp uğramadığını, zarar varsa denkleştirilip denkleştirilmediğini açıklar; bu açıklama <b>yalnız yıllık faaliyet raporunda<\/b> yer alır.<\/li><li><b>Hâkim şirket YK üyesinin hakkı:<\/b> başkandan bağlı şirketlerin finansal durumu, <b>üç aylık<\/b> hesap sonuçları ve ilişkileri hakkında rapor hazırlatılıp sunulmasını ve sonuç kısmının yıllık rapor ile denetleme raporuna eklenmesini isteyebilir. Bağlı şirketler, açık bir haklı sebep ispatlayamazsa bilgi ve belgeleri vermek zorundadır. Üye bunu üçüncü kişi yararına yaparsa sorumlu olur.<\/li><li><b>Bilgi alma (m.200):<\/b> <b>hâkim şirketin her pay sahibi<\/b> genel kurulda bağlı şirketlerin finansal durumu, hesap sonuçları ve topluluk içi ilişkiler hakkında doyurucu bilgi isteyebilir.<\/li><li><b>Özel denetim (m.207):<\/b> denetçi, özel denetçi veya riskin erken saptanması ve yönetimi komitesi, bağlı şirketin hâkim veya diğer bağlı şirketle ilişkilerinde <b>hile veya dolanın<\/b> varlığını belirten görüş bildirmişse <b>bağlı şirketin her pay sahibi<\/b> şirket merkezindeki <b>asliye ticaret mahkemesinden<\/b> özel denetçi atanmasını isteyebilir.<\/li><li>Dikkat: m.207'de <b>azlık payı aranmaz<\/b> ve m.438 vd.'den farklı olarak önce <b>genel kurula başvurma zorunluluğu yoktur
