<\/b>.<\/li><li><b>Satın alma hakkı (m.208):<\/b> hâkim şirket, sermaye şirketinin pay ve oy haklarının <b>en az %90'ına<\/b> sahipse ve azlık şirketin çalışmasını engelliyor, dürüstlük kuralına aykırı davranıyor, fark edilir sıkıntı yaratıyor veya pervasızca hareket ediyorsa, azlığın paylarını varsa <b>borsa değeriyle<\/b>, yoksa m.202/2'deki yönteme göre belirlenen değerle satın alabilir.<\/li><\/ul><h3>Sorumluluk rejimi<\/h3><h4>Tam hâkimiyet yokken (m.202)<\/h4><ul><li><b>Kayba uğratma yasağı (m.202/1-a):<\/b> hâkim şirket hâkimiyetini bağlı şirketi kayba uğratacak şekilde kullanamaz; örn. iş, varlık, fon, personel, alacak ve borç devri; kârı azaltma veya aktarma; malvarlığını sınırlandırma; kefalet, garanti, aval verdirme; haklı sebepsiz yatırımları durdurma.<\/li><li>İstisna: kayıp <b>o faaliyet yılı içinde fiilen denkleştirilirse<\/b> veya nasıl ve ne zaman denkleştirileceği belirtilerek <b>en geç faaliyet yılı sonuna kadar<\/b> bağlı şirkete denk değerde istem hakkı tanınırsa.<\/li><li>Denkleştirme yapılmazsa: bağlı şirketin <b>her pay sahibi<\/b>, hâkim şirketten ve kayba sebep olan YK üyelerinden <b>şirketin zararının<\/b> tazminini isteyebilir. Hâkim (yargıç) tazminat yerine payların hâkim şirketçe satın alınmasına veya başka uygun çözüme karar verebilir.<\/li><li><b>Alacaklılar<\/b> da, şirket <b>iflas etmemiş olsa bile<\/b>, zararın şirkete ödenmesini isteyebilir.<\/li><li>Savunma (m.202/1-d): aynı koşullarda dürüst ve tedbirli bir yöneticinin özeniyle hareket eden <b>bağımsız bir şirketin<\/b> YK üyelerinin de aynı işlemi yapacağı ispatlanırsa tazminat yoktur.<\/li><li>Davaya kıyasen m.553, 555–557, 560 ve 561 uygulanır. Hâkim teşebbüsün merkezi yurt dışındaysa dava <b>bağlı şirketin merkezindeki asliye ticaret mahkemesinde<\/b> açılır.<\/li><li><b>m.202/2 (özel işlemler):<\/b> hâkimiyetle yapılan ve bağlı şirket açısından açıkça haklı sebebi olmayan birleşme, bölünme, tür değiştirme, fesih, menkul kıymet çıkarma, önemli esas sözleşme değişikliği gibi işlemlerde; genel kurulda <b>red oyu verip tutanağa geçirten<\/b> veya YK kararına <b>yazılı itiraz eden<\/b> pay sahipleri hâkim teşebbüsten tazminat ya da paylarının satın alınmasını isteyebilir.<\/li><li>Satın alma değeri: varsa <b>en az borsa değeri<\/b>; yoksa veya hakkaniyete uygun değilse gerçek değer ya da genel kabul gören yönteme göre değer; <b>mahkeme kararına en yakın tarihteki veriler<\/b> esas alınır.<\/li><li>Zamanaşımı: genel kurul kararı veya YK kararının ilanı tarihinden itibaren <b>2 yıl<\/b>.<\/li><li>Dava açılınca muhtemel zarar veya satın alma bedeli kadar para mahkemece belirlenen bankaya <b>teminat<\/b> olarak yatırılır; yatırılmadıkça karara ilişkin işlem yapılamaz. Kötü niyetli davada davalı, davacılardan müteselsilen tazminat ve teminat isteyebilir.<\/li><li>Yapısal değişikliklerde tanınan diğer haklar saklıdır (m.202/4). Bağlı şirket yöneticileri, m.202'den doğabilecek sorumluluklarını sözleşmeyle üstlenmesini hâkim teşebbüsten isteyebilir (m.202/5).<\/li><\/ul><h4>Tam hâkimiyet varken (m.203–206)<\/h4><ul><li><b>Tam hâkimiyet:<\/b> bir ticaret şirketinin bir sermaye şirketinin pay ve oy haklarının doğrudan veya dolaylı <b>%100'üne<\/b> sahip olması.<\/li><li><b>m.203:<\/b> hâkim şirket YK'sı, topluluğun belirlenmiş ve somut politikalarının gereği olmak şartıyla, kayıp doğurabilecek olsa bile bağlı şirkete <b>talimat<\/b> verebilir; bağlı şirket organları uymak zorundadır.<\/li><li><b>m.204 (sınır):<\/b> bağlı şirketin <b>ödeme gücünü açıkça aşan<\/b>, <b>varlığını tehlikeye düşüren<\/b> veya <b>önemli varlıklarını kaybettirecek<\/b> talimat verilemez.<\/li><li><b>m.205:<\/b> bu talimatlara uyan bağlı şirket YK üyeleri ve yöneticileri şirkete ve pay sahiplerine karşı <b>sorumlu tutulamaz<\/b>.<\/li><li><b>m.206:<\/b> talimatla oluşan kayıp o hesap yılı içinde denkleştirilmez veya denk istem hakkı tanınmazsa, zarar gören <b>alacaklılar<\/b> hâkim şirkete ve kayıptan sorumlu YK üyelerine dava açabilir. Davalılar m.202/1-d savunmasına dayanabilir; kredi alacaklarında alacaklının denkleştirme yapılmadığını bilerek ilişkiye girdiğini ispatlayarak kurtulabilirler.<\/li><\/ul><h4>Güvenden doğan sorumluluk (m.209)<\/h4><ul><li>Hâkim şirket, topluluk itibarının <b>topluma veya tüketiciye güven veren<\/b> bir düzeye ulaştığı hallerde, bu itibarın kullanılmasının uyandırdığı güvenden sorumludur. Her topluluk kapsamda değildir; somut olaya göre belirlenir.<\/li><li>Şartlar: güven veren itibarlı topluluk; itibarın kullanılmasıyla somut güven uyandırılması ve kusurlu davranış; güvenin haklı olması; taraflar arasında işlem teması; güven ile tasarruflar arasında nedensellik; güvene aykırı davranış; zarar ve nedensellik bağı.<\/li><li>Örnek: hâkim şirket sözleşmeye taraf olmasa da yavru şirkete destek vereceği yönünde haklı bir beklenti yaratmışsa, beklentinin boşa çıkmasından doğan zarardan sorumludur.<\/li><\/ul><table><tr><th>Konu<\/th><th>Kesin bilgi<\/th><\/tr><tr><td>Karşılıklı iştirak eşiği<\/td><td>Birbirinin paylarının en az 1/4'ü (m.197)<\/td><\/tr><tr><td>Bilerek girilen karşılıklı iştirakte kullanılabilecek haklar<\/td><td>Yalnız 1/4; bedelsiz pay hakkı hariç diğerleri donar (m.201)<\/td><\/tr><tr><td>Bildirim eşikleri ve süre<\/td><td>%5, 10, 20, 25, 33, 50, 67, 100; 10 gün (m.198)<\/td><\/tr><tr><td>Yakınların şirketleri için bildirim eşiği<\/td><td>Sermayenin en az %20'si<\/td><\/tr><tr><td>Bağlılık raporu<\/td><td>Faaliyet yılının ilk 3 ayı (m.199)<\/td><\/tr><tr><td>Satın alma hakkı<\/td><td>Pay ve oyların en az %90'ı (m.208)<\/td><\/tr><tr><td>m.202/2 davası zamanaşımı<\/td><td>2 yıl<\/td><\/tr><tr><td>Tam hâkimiyet<\/td><td>%100 (m.203)<\/td><\/tr><\/table>", "sorular": [{"q": "TTK m.195'e göre aşağıdakilerden hangisi tek başına hâkimiyet ilişkisi kuran hallerden biri değildir?", "o": ["Oy haklarının çoğunluğuna sahip olması", "Yönetim organında karar alabilecek çoğunluğu seçme hakkına sahip olması", "Bir sözleşmeye dayanarak diğer ortaklarla birlikte oy haklarının çoğunluğunu oluşturması", "Diğer şirketi bir sözleşme gereğince hâkimiyeti altında tutması", "Bir şirketin diğer şirketin intifa senetlerinin çoğunluğuna sahip olması"], "a": 4, "e": "m.195 oy çoğunluğu, yönetim organı çoğunluğunu seçme, sözleşmeye dayalı oy çoğunluğu ve sözleşme veya başka yolla hâkimiyet hallerini sayar; intifa senedi oy hakkı vermez."}, {"q": "Hâkimiyet sözleşmesinin geçerli olabilmesi için ne gereklidir?", "o": ["Noter onayı", "Genel kurulda oybirliği", "Ticaret siciline tescil ve ilan edilmesi", "SPK onayı", "Ticaret Bakanlığı izni"], "a": 2, "e": "Hâkimiyet sözleşmesinin geçerliliği tescil ve ilana bağlıdır; geçersizlik ise topluluk yükümlülüklerinin uygulanmasını engellemez."}, {"q": "Şirketler topluluğu hükümlerinin uygulanmasında 'yönetim kurulu' terimi limited şirketlerde neyi ifade eder?", "o": ["Müdürleri", "Genel kurulu", "Denetçiyi", "Şirket ortaklarının tamamını", "Tasfiye memurlarını"], "a": 0, "e": "m.195/6: limited şirkette müdürler, SPBKŞ ve şahıs şirketlerinde yöneticiler, diğer tüzel kişilerde yönetim organı, gerçek kişide kişinin kendisi."}, {"q": "Hâkim teşebbüsün tepesinde sermaye şirketi değil bir gerçek kişi bulunması halinde aşağıdakilerden hangisi doğrudur?", "o": ["Topluluk hükümleri hiç uygulanmaz", "Yalnız konsolide tablo hükümleri uygulanır", "Gerçek kişi hâkim olamaz, topluluk adi ortaklık sayılır", "Topluluk yine şirketler topluluğu sayılır ve hâkim teşebbüs tacir kabul edilir", "Topluluk hükümleri yalnız yurt içi merkezliyse uygulanır"], "a": 3, "e": "Hâkim teşebbüs tacir sayılır; tepede gerçek kişi, kamu tüzel kişisi veya ticari işletme bulunması topluluk kabulüne engel değildir."}, {"q": "SerPK m.26/2'ye göre aşağıdakilerden hangisi yönetim kontrolünün elde edilmesi sayılır?", "o": ["Oy haklarının yüzde yirmi beşine sahip olunması", "Halka açık ortaklıkta oy haklarının yüzde ellisinden fazlasına birlikte hareket edilen kişilerle sahip olunması", "Sermayenin dörtte birine karşılıklı iştirak edilmesi", "Halka kapalı bir şirketin paylarının çoğunluğuna sahip olunması", "Yönetim kurulunda bir üyelik hakkı veren imtiyaza sahip olunması"], "a": 1, "e": "Yönetim kontrolü oyların yüzde ellisinden fazlası veya YK üye sayısının salt çoğunluğunu seçme ya da aday gösterme imtiyazıyla elde edilir; yalnız halka açık ortaklıklar için geçerlidir."}, {"q": "TTK'daki hâkimiyet ilişkisi ile SerPK'daki yönetim kontrolü karşılaştırıldığında aşağıdakilerden hangisi doğrudur?", "o": ["Yönetim kontrolü pay alım teklifi zorunluluğu doğururken hâkimiyet ilişkisi TTK m.195–209 sonuçlarını doğurur", "Her iki kavram da yalnız halka açık şirketlere uygulanır", "Kriterleri tamamen aynıdır", "Hâkimiyet ilişkisi pay alım teklifi zorunluluğu doğurur", "Yönetim kontrolü halka kapalı şirketlere de uygulanır"], "a": 0, "e": "Yönetim kontrolü yalnız halka açık ortaklıklarda ve pay alım teklifi sonucuyla; hâkimiyet tüm şirketlerde ve topluluk hükümleri sonucuyla bağlantılıdır."}, {"q": "TTK m.197'ye göre sermaye şirketlerinin karşılıklı iştirak durumunda sayılması için birbirlerinin paylarının en az ne kadarına sahip olmaları gerekir?", "o": ["Onda birine", "Üçte birine", "Yarısına", "Dörtte birine", "Yirmide birine"], "a": 3, "e": "Birbirlerinin paylarının en az dörtte birine sahip sermaye şirketleri karşılıklı iştirak durumundadır."}, {"q": "A AŞ, B AŞ'nin karşılıklı iştirak konumunda olduğunu bilerek B AŞ'de 800.000 oy hakkı veren pay edinmiştir. TTK m.201'e göre A AŞ bu paylardan kaç oy kullanabilir?", "o": ["800.000", "200.000", "400.000", "80.000", "Hiç oy kullanamaz"], "a": 1, "e": "Bilerek karşılıklı iştirake giren şirket oyların yalnız dörtte birini kullanabilir: 800.000 / 4 = 200.000."}, {"q": "Bilerek karşılıklı iştirak konumuna giren şirketin, iştirak paylarından doğan aşağıdaki haklarından hangisi TTK m.201'e göre donmaz?", "o": ["Oy hakkının dörtte üçü", "Kâr payı hakkının dörtte üçü", "Rüçhan hakkının dörtte üçü", "Genel kurula katılma hakkının dörtte üçü", "Bedelsiz payları edinme hakkı"], "a": 4, "e": "m.201: şirket oyların ve diğer pay sahipliği haklarının yalnız dörtte birini kullanabilir, kalan dörtte üç donar; bedelsiz payları edinme hakkı bu sınırlamanın dışındadır."}, {"q": "TTK m.201'deki dörtte bir sınırlaması hangi durumda uygulanmaz?", "o": ["Şirketlerin ikisinin de anonim şirket olması halinde", "İştirakin yüzde otuzu aşması halinde", "Bağlı şirketin hâkim şirketin paylarını iktisap etmesi halinde", "Karşılıklı iştirakin bilerek kurulması halinde", "Paylardan birinin borsada işlem görmesi halinde"], "a": 2, "e": "m.201/2: bağlı şirketin hâkim şirket paylarını iktisabı veya iki şirketin birbirine hâkim olması halinde sınırlama uygulanmaz."}, {"q": "Aşağıdaki oranlardan hangisi TTK m.198'deki bildirim eşiklerinden biri değildir?", "o": ["Yüzde beş", "Yüzde kırk", "Yüzde otuz üç", "Yüzde altmış yedi", "Yüzde yirmi"], "a": 1, "e": "Eşikler yüzde 5, 10, 20, 25, 33, 50, 67 ve 100'dür."}, {"q": "Bir teşebbüsün bir sermaye şirketindeki payı yüzde 9'dan yüzde 12'ye çıkmıştır. TTK m.198'e göre ne yapması gerekir?", "o": ["Herhangi bir bildirim yapması gerekmez", "Otuz gün içinde yalnız Ticaret Bakanlığına bildirmesi", "Pay alım teklifinde bulunması", "Bir sonraki genel kurulda açıklama yapması", "İşlemin tamamlanmasını izleyen on gün içinde şirkete ve yetkili makamlara bildirmesi"], "a": 4, "e": "Yüzde onluk eşik aşılmıştır; on gün içinde şirkete ve yetkili makamlara bildirim zorunludur."}, {"q": "TTK m.198 kapsamındaki bildirim, tescil ve ilan yükümlülüğü yerine getirilmezse sonuç nedir?", "o": ["Paylar kendiliğinden şirkete geçer", "Yalnız idari para cezası uygulanır", "İlgili paylara ait oy hakkı dahil diğer haklar donar", "Paylar iptal edilir", "Hiçbir hukuki sonuç doğmaz"], "a": 2, "e": "Yükümlülük yerine getirilmedikçe oy hakkı dahil diğer haklar donar; diğer hukuki sonuçlar saklıdır."}, {"q": "Sermaye şirketinin YK üyeleri, eşleri ve velayetleri altındaki çocuklarının sermayesinin en az hangi oranına sahip oldukları ticaret şirketlerinin paylarını da bildirmek zorundadır?", "o": ["Yüzde yirmi", "Yüzde beş", "Yüzde on", "Yüzde yirmi beş", "Yüzde elli"], "a": 0, "e": "m.198: bu kişilerin sermayesinin en az yüzde yirmisine sahip olduğu ticaret şirketlerinin payları da bildirilir."}, {"q": "Bağlı şirketin yönetim kurulu, hâkim ve bağlı şirketlerle ilişkiler hakkındaki raporu hangi süre içinde düzenler?", "o": ["Faaliyet yılının ilk altı ayı içinde", "Genel kuruldan on beş gün önce", "Hesap döneminin son ayında", "Faaliyet yılının ilk üç ayı içinde", "Bağımsız denetim raporu ile eş zamanlı"], "a": 3, "e": "m.199: bağlılık raporu faaliyet yılının ilk üç ayı içinde düzenlenir."}, {"q": "Hâkim şirketin genel kurulunda bağlı şirketlerin finansal durumu ve topluluk içi işlemler hakkında bilgi isteme hakkı kime aittir?", "o": ["Yalnız sermayenin onda birine sahip azlığa", "Yalnız hâkim şirketin YK üyelerine", "Hâkim şirketin her pay sahibine", "Bağlı şirketin alacaklılarına", "Yalnız bağımsız denetçiye"], "a": 2, "e": "m.200: hâkim şirketin her pay sahibi genel kurulda doyurucu bilgi isteyebilir."}, {"q": "TTK m.207'deki özel denetçi atanmasını isteme hakkı ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Bağlı şirketin her pay sahibi, azlık payı aranmaksızın ve önce genel kurula başvurmaksızın mahkemeden isteyebilir", "Yalnız sermayenin onda birine sahip pay sahipleri isteyebilir", "Önce genel kurulun reddetmiş olması gerekir", "Talep Ticaret Bakanlığına yapılır", "Hâkim şirketin pay sahipleri isteyebilir"], "a": 0, "e": "Denetçi, özel denetçi veya riskin erken saptanması komitesi hile/dolan görüşü bildirmişse bağlı şirketin her pay sahibi asliye ticaret mahkemesinden özel denetçi isteyebilir."}, {"q": "TTK m.208'e göre hâkim şirketin azlığın paylarını satın alma hakkı için pay ve oy haklarının en az ne kadarına sahip olması gerekir?", "o": ["Yüzde yetmiş beş", "Yüzde altmış yedi", "Yüzde yüz", "Yüzde doksan", "Yüzde elli bir"], "a": 3, "e": "Hâkim şirket en az yüzde doksana sahipse ve azlık şirketin çalışmasını engelliyor veya pervasızca davranıyorsa satın alma hakkı doğar."}, {"q": "Hâkim şirketin bağlı şirketi kayba uğratması halinde, TTK m.202/1'e göre kaybın denkleştirilmesi için en geç ne zamana kadar bağlı şirkete denk değerde istem hakkı tanınmalıdır?", "o": ["İzleyen faaliyet yılının ilk üç ayına kadar", "O faaliyet yılı sonuna kadar", "Kayıptan itibaren iki yıl içinde", "Genel kurul toplantısına kadar", "Bağımsız denetim raporunun yayımına kadar"], "a": 1, "e": "Kayıp o faaliyet yılı içinde fiilen denkleştirilmeli veya en geç faaliyet yılı sonuna kadar denk istem hakkı tanınmalıdır."}, {"q": "Denkleştirme yapılmadığında TTK m.202/1-b'ye göre bağlı şirketin pay sahibi neyi talep edebilir?", "o": ["Yalnız kendi kişisel zararının kendisine ödenmesini", "Bağlı şirketin feshini", "Hâkim şirketin tasfiyesini", "Hâkim şirket paylarının kendisine devrini", "Hâkim şirketten ve kayba sebep olan YK üyelerinden şirketin zararının tazminini"], "a": 4, "e": "Pay sahibi şirketin zararının tazminini ister; hâkim, uygun düşerse tazminat yerine payların satın alınmasına karar verebilir."}, {"q": "TTK m.202/2 kapsamında payların satın alınmasını veya tazminat isteme davası hangi süre içinde zamanaşımına uğrar?", "o": ["Kararın ilanından itibaren iki ay", "Kararın tescilinden itibaren beş yıl", "Öğrenmeden itibaren bir yıl", "Genel kurul kararının verildiği veya YK kararının ilan edildiği tarihten itibaren iki yıl", "Kararın alınmasından itibaren üç ay"], "a": 3, "e": "m.202/2: dava iki yılda zamanaşımına uğrar."}, {"q": "Tam hâkimiyet halinde hâkim şirketin bağlı şirkete verebileceği talimatlarla ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Tam hâkimiyet yüzde yüz pay ve oy sahipliğiyle oluşur", "Bağlı şirketin ödeme gücünü açıkça aşan talimat da topluluk politikası gereğiyse verilebilir", "Talimat, kayıp doğurabilecek nitelikte olsa da topluluk politikası gereğiyse verilebilir", "Bağlı şirket organları talimata uymak zorundadır", "Talimata uyan bağlı şirket yöneticileri şirkete karşı sorumlu tutulamaz"], "a": 1, "e": "m.204: ödeme gücünü açıkça aşan, varlığı tehlikeye düşüren veya önemli varlıkları kaybettirecek talimat verilemez."}, {"q": "TTK m.209'daki güvenden doğan sorumluluk ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Her şirketler topluluğu bu sorumluluğa tabidir", "Hâkim şirketin üçüncü kişiyle sözleşmeye taraf olması şarttır", "Kusur aranmaz, salt itibar yeterlidir", "Sorumluluk yalnız bağlı şirketin YK üyelerine aittir", "Topluluk itibarının topluma veya tüketiciye güven veren bir düzeye ulaşmış olması gerekir"], "a": 4, "e": "Her topluluk kapsamda değildir; güven veren itibar, haklı güven, işlem teması, kusurlu davranış ve nedensellik gibi şartlar aranır; hâkim şirketin sözleşmeye taraf olması gerekmez."}]}, {"id": 4, "kisa": "AŞ: Tanım, Unsur, İlkeler", "baslik": "Anonim Şirket: Tanım, Unsurlar, Ekonomik Fonksiyonlar, Temel İlkeler ve Sürdürülebilir Finans", "ozet": "AŞ'nin kanuni tanımı ve unsurları, tüzel kişilik perdesinin aralanması, asgari sermaye, çoğunluk-sermayenin korunması-emredicilik-şeffaflık-eşit işlem-borçlanma yasağı-oransallık ilkeleri ile TSRS kapsamı.", "notlar": "<h3>Tanım (TTK m.329)<\/h3><ul><li>Anonim şirket: <b>sermayesi belirli ve paylara bölünmüş<\/b> olan, <b>borçlarından dolayı yalnız malvarlığıyla sorumlu<\/b> bulunan şirkettir.<\/li><li>Pay sahipleri yalnız <b>taahhüt ettikleri sermaye payları ile<\/b> ve <b>şirkete karşı<\/b> sorumludur (m.329/2).<\/li><\/ul><h3>Unsurlar<\/h3><h4>1. Belirli ve paylara bölünmüş esas sermaye<\/h4><ul><li>Esas sermaye: pay sahiplerinin getirmeyi taahhüt ettiği malvarlığı toplamının <b>nakit olarak ifadesi<\/b>. Özellikleri: önceden belirlenmiş ve sabit, nakitle ifade edilmiş, itibari değerli paylara bölünmüş, <b>tamamen taahhüt edilmiş<\/b>.<\/li><li><b>Belirlilik:<\/b> önceden tespit edilmiş olma ve kendiliğinden değişmeme. Usulüne uygun olarak artırılabilir veya azaltılabilir.<\/li><li><b>Paylara bölünme:<\/b> her pay, sahibinin sermayeye katılım oranını gösterir; bu oran <b>itibari (nominal) değer<\/b> ile ifade edilir. Sermaye ve her payın itibari değeri esas sözleşmede gösterilir (TTK m.339).<\/li><li>6102 sayılı TTK mülga kanundaki \"hisse senedi\" yerine <b>\"pay senedi\"<\/b> terimini benimsemiştir. Pay senetleri <b>kıymetli evrak<\/b>tır ve SerPK m.3/1-o gereği <b>menkul kıymet<\/b> niteliğindedir.<\/li><\/ul><h4>2. Şirketin borçlarından yalnız kendi malvarlığıyla sorumlu olması<\/h4><ul><li>Şirket, ayrı bir hukuk süjesi olarak borçlarından <b>bütün malvarlığıyla, sınırsız<\/b> sorumludur. Sınırlı olan, ortakların sorumluluğudur.<\/li><\/ul><h4>3. Ortakların sorumluluğunun sınırlı ve şirkete karşı olması: tek borç ilkesi<\/h4><ul><li><b>Tüzel kişiliğin ayrılığı ilkesi:<\/b> şirket ile ortaklar ayrı kişiliklere ve malvarlıklarına sahiptir; kural olarak ne ortak şirket borcundan ne şirket ortak borcundan ne de bir şirket diğer şirketin borcundan sorumludur.<\/li><li><b>Tek borç ilkesi:<\/b> pay sahibi taahhüt ettiği sermaye koyma borcunu ifa edince şirkete karşı sorumluluğu biter. <b>m.480/1:<\/b> kanundaki istisnalar dışında esas sözleşmeyle pay sahibine pay bedeli veya itibari değeri aşan primi ifa dışında borç yükletilemez.<\/li><li>Dikkat: Ortakların şirket <b>alacaklılarına karşı<\/b> hiçbir sorumluluğu yoktur; taahhüt edilen sermaye getirilmese bile alacaklıların bunun şirkete ödenmesi için dava hakkı dahi yoktur. \"Yalnız şirkete karşı\" vurgusu mülga TTK m.269'dan farklı olarak açıkça yazılmıştır.<\/li><\/ul><h4>Tüzel kişilik perdesinin aralanması<\/h4><ul><li>Ayrılık ilkesinin <b>kötüye kullanıldığı<\/b> istisnai hallerde perde aralanarak gerçek borçlu sorumlu tutulur. Dayanak: dürüstlük kuralı ve hakkın kötüye kullanılması yasağı (TMK m.2–3).<\/li><li>Yargıtay ölçütleri: ortağın şirketle özdeşleşmesi, malvarlıklarının karışması, art niyetle sırf sorumluluktan kaçmak için perdeye sığınma, hâkimiyetin kötüye kullanılması (Yargıtay 11. HD, 11.12.2017, 2016/5148 E., 2017/7084 K.).<\/li><\/ul><table><tr><th>Tür<\/th><th>Yön<\/th><th>Açıklama<\/th><\/tr><tr><td><b>Düz<\/b> kaldırma<\/td><td>Şirket borcu → ortak<\/td><td>Şirketin sorumluluk alanı ortakları kapsayacak şekilde genişler; ortaklar şirketle birlikte <b>müteselsilen<\/b> sorumlu olur. Uygulamada perdenin arkasındaki genellikle bir hâkim şirkettir.<\/td><\/tr><tr><td><b>Ters<\/b> kaldırma<\/td><td>Ortak borcu → şirket<\/td><td>Ortağın şahsi borcu için şirket malvarlığına gidilir (Yargıtay 17. HD, 26.04.2011: borçlunun %99 ortağı ve müdürü olduğu aile şirketi üzerinden mal kaçırması).<\/td><\/tr><tr><td><b>Çapraz<\/b> kaldırma<\/td><td>Bağlı şirket → hâkim → diğer bağlı şirket<\/td><td>Şirketler topluluğunda malvarlıklarının karışması halinde; önce bağlı şirketten hâkim şirkete ulaşılır, sonra hâkimden diğer bağlı şirkete geçilir.<\/td><\/tr><\/table><h4>4. Ticaret unvanı<\/h4><ul><li>AŞ, TTK m.16/1 gereği <b>tacir<\/b>dir; unvan seçme, kullanma ve tescil ettirme zorunluluğu vardır (m.18/1, 39, 40).<\/li><li>Çekirdek unsurlar: <b>işletme konusu<\/b> ve <b>\"anonim şirket\" ibaresi<\/b>. Ayırt ediciliği sağlayan ekler m.46'ya uygun olarak eklenebilir.<\/li><li>Dikkat: Unvanda <b>gerçek kişinin adı veya soyadı<\/b> varsa tür ibaresi baş harflerle veya başka şekilde <b>kısaltılamaz<\/b> (m.43/2).<\/li><\/ul><h4>5. Amaç ve konu<\/h4><ul><li><b>m.331:<\/b> AŞ <b>kanunen yasaklanmamış her türlü ekonomik amaç ve konu<\/b> için kurulabilir. Temel amaç kâr elde etmektir; serbest bırakılan asıl husus şirketin <b>konusudur<\/b>; amaç ticari işletme işletmekle sınırlı düşünülmemelidir.<\/li><\/ul><h4>6. Tek pay sahibi yeterli<\/h4><ul><li><b>m.338:<\/b> AŞ <b>bir pay sahibiyle<\/b> kurulabilir; bu kişi gerçek veya tüzel kişi olabilir. Mülga TTK'daki <b>en az beş kurucu<\/b> şartı terk edilmiştir.<\/li><li>Dikkat: Şirket sonradan tek ortaklı hale gelebilir; ancak AŞ, tek pay sahibi kendisi olacak şekilde <b>kendi paylarının tamamını iktisap edemez<\/b> (m.338/3).<\/li><\/ul><h4>7. Tüzel kişilik ve ehliyet<\/h4><ul><li>AŞ tüzel kişiliği <b>ticaret siciline tescille<\/b> kazanır (m.355/1). Ultra vires kalktığından TMK m.48 çerçevesinde bütün haklardan yararlanır.<\/li><\/ul><h4>8. Asgari sermaye<\/h4><table><tr><th>Sistem<\/th><th>Asgari tutar<\/th><\/tr><tr><td>Esas sermaye sistemi<\/td><td><b>250.000 TL<\/b> (m.332/1)<\/td><\/tr><tr><td>Kayıtlı sermaye sistemi, halka kapalı<\/td><td><b>500.000 TL<\/b> (m.332/1)<\/td><\/tr><tr><td>Kayıtlı sermaye sistemi, halka açık<\/td><td>II-18.1 m.5/3: <b>2025 için 150 milyon TL; 2026 için 200 milyon TL<\/b><\/td><\/tr><\/table><ul><li>Amaç: ortakların kişisel sorumluluğu olmadığından <b>alacaklıların korunması<\/b>.<\/li><li>Asgari tutarları artırma yetkisi <b>Cumhurbaşkanı<\/b>ndadır. Dikkat: Limited şirkette artırım <b>on katına kadar<\/b> sınırlıyken (m.580/2) AŞ'de <b>üst sınır öngörülmemiştir<\/b>.<\/li><\/ul><h3>Ekonomik fonksiyonlar<\/h3><ul><li><b>Sınırlı sorumluluk:<\/b> riski sınırlayarak girişimciyi cesaretlendirir; yatırım, istihdam, vergi ve refah artışıyla kamu yararı doğurur.<\/li><li><b>Sermaye birikimi:<\/b> küçük tasarrufları büyük yatırımlara aktarır; menkul kıymet ihracıyla piyasalara derinlik kazandırır. AŞ'ler sermaye piyasasında <b>fon talep etme yetkisine sahip temel aktörlerdir<\/b>.<\/li><\/ul><h3>Anonim şirketlere ilişkin ilkeler<\/h3><h4>Çoğunluk ilkesi<\/h4><ul><li>Genel kurul (karar organı) ve yönetim kurulunda (idare ve temsil organı) kural <b>salt çoğunluk<\/b>tur (m.390, 421). Bazı kararlar nitelikli çoğunluk ister.<\/li><li>İlke mutlak değildir: azlık hakları ve dürüstlük kuralına aykırılığın genel kurul kararlarında iptal nedeni sayılması çoğunluğun gücünü sınırlar.<\/li><\/ul><table><tr><th>Karar<\/th><th>Gereken çoğunluk<\/th><\/tr><tr><td>Bilanço zararlarını kapatmak için yükümlülük/ikincil yükümlülük koyma; şirket merkezinin <b>yurt dışına taşınması<\/b><\/td><td>Sermayenin tümünü oluşturan payların sahiplerinin <b>oybirliği<\/b> (m.421/2)<\/td><\/tr><tr><td>İşletme konusunun <b>tamamen<\/b> değiştirilmesi; <b>imtiyazlı pay<\/b> oluşturulması; nama yazılı payların devrinin <b>sınırlandırılması<\/b><\/td><td>Sermayenin en az <b>%75'ini<\/b> oluşturan payların olumlu oyu (m.421/3)<\/td><\/tr><\/table><h4>Malvarlığının ve sermayenin korunması ilkesi<\/h4><ul><li>Alacaklılar yalnız şirket malvarlığına başvurabildiği için benimsenmiştir. Genel gerekçe <b>57. paragraf<\/b>: güvenli kuruluş ile sermayenin korunması birbirini tamamlayan iki taşıyıcı ilkedir; sermaye gerçek değeriyle getirilmeli, korunmalı, geri iade edilmemelidir (AET'nin 77/91 sayılı ikinci yönergesi).<\/li><li>Örnek hükümler: m.128, 343, 344/1, 345, 348, 376, 378, 509, 512, 513.<\/li><li>Dikkat: Sermayenin korunması ilkesine aykırı YK ve GK kararları <b>butlan<\/b> yaptırımına tabidir [m.391/1-b; m.447/1-c].<\/li><\/ul><h4>Sınırlı sorumluluk ilkesi<\/h4><ul><li>Yukarıdaki tek borç ilkesine bakınız.<\/li><\/ul><h4>Emredici hükümler ilkesi (m.340)<\/h4><ul><li>Esas sözleşme, TTK'nın AŞ hükümlerinden <b>ancak Kanunda açıkça izin verilmişse<\/b> sapabilir. Diğer kanunların izin verdiği tamamlayıcı hükümler o kanuna özgü sonuç doğurur.<\/li><li>Genel özel hukuktaki kuralın tersi: AŞ'de <b>kural emredicilik<\/b>, istisna irade serbestisidir.<\/li><li>\"Sapma\" <b>dar yorumlanır<\/b>: kanunun düzenlediği konuda aykırı hüküm konulamaz; kanunun sustuğu konuda aykırı olmayan ihtiyari hüküm konulabilir. Gerekçeye göre \"açıkça izin\" lafızla sınırlı değildir; amaca uygun yorumla sapma imkânı çıkıyorsa da kabul edilir. Tamamlayıcı hükümler sapma sayılmaz.<\/li><li>Esas sözleşmeye yazılacak hususlar esas itibarıyla <b>m.339/2<\/b>'dedir.<\/li><\/ul><h4>Kamuyu aydınlatma ve şeffaflık ilkesi<\/h4><ul><li>Kavram ilk kez <b>1963<\/b>'te Ticaret Bakanlığına sunulan bir raporda geçmiştir. TTK genel gerekçesi <b>68. paragraf<\/b>; AB düzenlemeleri etkili olmuştur.<\/li><li>Kurumsal yönetimin <b>dört esas unsuru<\/b>: eşitlik (adillik), hesap verebilirlik, sorumluluk, kamuyu aydınlatma ve şeffaflık. Genel gerekçe <b>89. paragraf<\/b>: şeffaflık şirketi \"camdan cep\" olarak görmeyi aşan bir anlayıştır; aracı internet ve zorunlu web siteleridir.<\/li><li><b>İnternet sitesi (m.1524):<\/b> ilk halinde tüm sermaye şirketlerine zorunluydu; TTK yürürlüğe girmeden <b>6335 sayılı Kanunla<\/b> yalnız <b>m.397/4 uyarınca bağımsız denetime tabi<\/b> sermaye şirketleriyle sınırlandı. Ayrıntı: \"Sermaye Şirketlerinin Açacakları İnternet Sitelerine Dair Yönetmelik\" (m.6 içeriği biraz genişletir).<\/li><li>Aydınlatıcı haklar: <b>bilgi alma ve inceleme<\/b> (m.437), <b>özel denetim isteme<\/b> (m.438–444).<\/li><li>SerPK'da kamuyu aydınlatma m.14–15 başlığı altında olsa da tüm kanuna yayılmıştır: izahname onayı, kamuyu aydınlatma belgelerinden sorumluluk (m.32), izahname sorumluluğu (m.10), KAP, borsaların düzenleme yetkisi (m.68/2).<\/li><li>SPK düzenlemeleri: Özel Durumlar Tebliği; Payları Borsada İşlem Görmeyen Ortaklıklara İlişkin Özel Durumlar Tebliği (<b>II-15.2<\/b>); KAP Tebliği (<b>VII-128.6<\/b>); Finansal Raporlama Tebliği (<b>II-14.1<\/b>).<\/li><\/ul><h4>Kurumsal yönetim (bir ilkeler bütünü)<\/h4><ul><li>ABD kökenlidir, <b>1990'lı yıllarda<\/b> dünyaya yayılmıştır.<\/li><li><b>TTK m.1529:<\/b> halka açık ortaklıklar esas alınarak kurumsal yönetim ilkelerini, YK açıklamasının esaslarını ve derecelendirme kurallarını belirleme yetkisi <b>SPK<\/b>'dadır. Diğer kamu kurumları <b>SPK'nın uygun görüşüyle<\/b> kendi alanlarında sınırlı ayrıntı düzenlemesi yapabilir (m.1529/2).<\/li><li><b>SerPK m.17:<\/b> ilkeler, ilişkili taraf işlemleri usulü ve bağımsız üyeler; m.17/2 ile SPK, <b>payları borsada işlem gören<\/b> halka açık ortaklıkları ilkelere kısmen veya tamamen uymaya zorlayabilir. Güncel düzenleme: <b>Kurumsal Yönetim Tebliği (II-17.1)<\/b>.<\/li><li>Genel gerekçe <b>136. paragraf<\/b>: kurumsal yönetim hükümleri iki grup. Birinci grup (ilkesel): m.1529, YK açıklaması (m.375/1-f), riskin erken teşhisi komitesi (m.378), denetçinin ikazı (m.398), teşkilat yönetmeliğiyle devir (m.367), murahhaslar (m.370), bağımsız denetim (m.397 vd.). İkinci grup (somut): kurucu menfaatleri (m.348), eşit işlem (m.357), borçlanma yasağı (m.358), YK üyesinin pay sahibi olma zorunluluğunun kaldırılması (m.359), azlığa YK'da temsil (m.360), YK sorumluluk sigortası (m.361), borca batıklık (m.376–377), devredilemez yetkiler (m.408), GK iç yönergesi (m.419), temsilciler (m.428 vd.), oyda imtiyazın sınırlandırılması (m.479), farklılaştırılmış teselsül (m.557), internet sitesi (m.1524).<\/li><\/ul><h4>Eşit işlem ilkesi (m.357)<\/h4><ul><li>\"Pay sahipleri <b>eşit şartlarda eşit işleme<\/b> tabi tutulur.\" Özel yansımalar: m.437/2, 461, 466; SerPK m.18/5.<\/li><li>Muhatap: şirket <b>organları<\/b>; somut muhatap <b>yönetim kurulu<\/b> (m.391); genel kurul ve tasfiye memurları da. Pay sahiplerinin birbirleri arasındaki ilişkide kural olarak uygulanmaz; yönetim kontrolü değişiminde çoğunluk-azlık ilişkisinde önem kazanır (SerPK m.26).<\/li><li>Pay sahipleri somut olaya özgü olarak oylarıyla ilkeden vazgeçebilir; ilke bütünüyle ve her hal için kaldırılamaz.<\/li><\/ul><table><tr><th>Uygulama<\/th><th>Haklar<\/th><\/tr><tr><td><b>Mutlak<\/b> (farklılaştırma yok)<\/td><td>Oransallığın uygulanmadığı vazgeçilmez haklar: genel kurula katılma, iptal davası, bilgi alma, özel denetçi isteme, sorumluluk davası<\/td><\/tr><tr><td><b>Nisbi<\/b> (konuma göre farklılaşabilir)<\/td><td>Oransallığın uygulandığı haklar: kâr payı, rüçhan, oy hakkı. Farklılaştırma objektif olmalı, keyfi olmamalı<\/td><\/tr><\/table><ul><li>Yaptırım: ilkeye aykırı <b>YK kararları butlan<\/b> (m.391/1-a); GK kararları için de butlan savunulur; gerekçe ise sonucun \"iptal\" olduğunu, tek sonuç olmadığını söyler. TTK'da YK kararlarının iptali düzenlenmemiştir.<\/li><\/ul><h4>Pay sahiplerinin şirkete borçlanma yasağı (m.358)<\/h4><ul><li>6335 sayılı Kanunla yumuşatılmıştır. Pay sahibi şirkete ancak şu <b>iki şart birlikte<\/b> varsa borçlanabilir: (1) sermaye taahhüdünden doğan <b>vadesi gelmiş borçlarını ifa etmiş<\/b> olmak; (2) şirketin <b>serbest yedek akçelerle birlikte kârının geçmiş yıl zararlarını karşılayacak<\/b> düzeyde olması.<\/li><li>Özel hukuk yaptırımı: işlem <b>geçersiz (batıl)<\/b>. Cezai yaptırım (m.562/5): pay sahibine borç verenlere <b>300 günden az olmamak üzere adli para cezası<\/b>.<\/li><li><b>YK üyeleri (m.395/2):<\/b> <b>pay sahibi olmayan<\/b> YK üyeleri ile m.393'teki pay sahibi olmayan yakınları şirkete <b>nakit borçlanamaz<\/b>; şirket bunlar için kefalet, garanti, teminat veremez, sorumluluk yüklenemez, borçlarını devralamaz. Aksi halde şirket alacaklıları bunları borçlanılan tutar için <b>doğrudan takip<\/b> edebilir; cezası m.562/5-c'ye göre 300 günden az olmamak üzere adli para cezası.<\/li><li>Dikkat: <b>Pay sahibi olan<\/b> YK üyeleri m.395 kapsamında değildir; onlara m.358 uygulanır.<\/li><\/ul><h4>Oransallık ilkesi<\/h4><ul><li>Pay sahipliği haklarının <b>sermayeye katılım oranına<\/b> göre belirlenmesi: kâr payı, tasfiye bakiyesi, rüçhan hakkı ve oy hakkı. Azlık hakları da oranla bağlantılıdır: sermayenin <b>onda biri<\/b>, halka açıkta <b>yirmide biri<\/b>.<\/li><li>Uygulanmadığı haklar (koruyucu haklar): genel kurula katılma, bilgi alma ve inceleme, özel denetçi isteme, iptal davası.<\/li><li>Esas sözleşmeyle istisna: birden fazla oya sahip olanların oy sayısı sınırlandırılabilir (m.434/1); kâr payı, tasfiye payı, rüçhan veya oyda <b>imtiyaz<\/b> tanınabilir (m.478/2).<\/li><\/ul><h3>Sürdürülebilir finans<\/h3><ul><li><b>Tanım:<\/b> finansal piyasalardaki uygulama, ürün ve politikalarda <b>çevresel, sosyal ve kurumsal yönetim (ESG)<\/b> faktörlerinin dikkate alınması. Kalkınma kaynağının yalnız kamu maliyesiyle karşılanamayacağının anlaşılmasıyla doğmuştur.<\/li><li><b>Sosyal sorumlu yatırımcılık<\/b> riskli alanlardan uzak durur ve kârla ilgilenir; <b>etki yatırımcılığı<\/b>nda daha fazla risk ve hatta düşük kâr kabul edilebilir.<\/li><li>ESG'nin üç boyutu: yatırımcının kâr pahasına ESG yatırımı yapabilmesi (kurumsal yatırımcıyı müşterisine karşı sorumlu kılmaması); ESG'ye önem veren AŞ'nin bu nedenle sorumluluğa muhatap olmaması; ve bunların ön koşulu olarak <b>ESG raporlaması<\/b> (finansal olmayan raporlama).<\/li><li><b>TTK m.88/6<\/b> (<b>02.06.2022<\/b> tarihli <b>7408 sayılı Kanun<\/b>la eklendi): <b>Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu (KGK)<\/b>, belirlediği işletmeler için uluslararası standartlarla uyumlu <b>Türkiye Sürdürülebilirlik Raporlama Standartlarını (TSRS)<\/b> belirleyip yayımlar; diğer düzenleyici kurumlar TSRS'ye uygun ayrıntı düzenlemesi yapabilir.<\/li><li>Gerekçe: Glasgow'da <b>31 Ekim – 12 Kasım 2021<\/b> tarihlerinde <b>197 ülke<\/b>nin katıldığı <b>COP26<\/b>'da Uluslararası Muhasebe Standartları Vakfı, <b>Uluslararası Sürdürülebilirlik Standartları Kurulu<\/b>nun kurulduğunu ilan etti; amaç UFRS Sürdürülebilirlik Açıklama Standartlarıdır.<\/li><li><b>7420 sayılı Kanun m.42<\/b> (RG 9.11.2022) ile 660 sayılı KHK m.9 değiştirildi: KGK'ya TSRS'leri belirleme, büyüklük ve sektöre göre farklı düzenleme, denetimcileri yetkilendirme ve gözetim görevi verildi.<\/li><li><b>II-17.1.a<\/b> ile Kurumsal Yönetim Tebliğine sürdürülebilirlik hükümleri eklendi: <b>gönüllülük esası<\/b>; halka açık ortaklık faaliyet raporunda ya SPK'nın \"sürdürülebilirlik ilkeleri uyum çerçevesi\"ne göre açıklama yapar ya da uygulamıyorsa <b>gerekçeli açıklama<\/b> yapar.<\/li><li>KGK yayımları: <b>TSRS 1<\/b> \"Sürdürülebilirlikle İlgili Finansal Bilgilerin Açıklanmasına İlişkin Genel Hükümler\", <b>TSRS 2<\/b> \"İklimle İlgili Açıklamalar\" ve TSRS Uygulama Kapsamına İlişkin Kurul Kararı.<\/li><\/ul><table><tr><th>TSRS Kurul Kararı m.3<\/th><th>Esas<\/th><\/tr><tr><td>Eşik ölçütleri<\/td><td>Aktif toplamı <b>500 milyon TL<\/b>; yıllık net satış hasılatı <b>1 milyar TL<\/b>; çalışan sayısı <b>250<\/b><\/td><\/tr><tr><td>Zorunluluk koşulu<\/td><td>Listedeki kuruluşlardan ölçütlerin <b>en az ikisini art arda iki raporlama döneminde<\/b> aşanlar<\/td><\/tr><tr><td>Listedeki kuruluşlar<\/td><td>SPK'ya tabi yatırım kuruluşları, kolektif yatırım kuruluşları, portföy yönetim şirketleri, ipotek finansmanı, merkezi takas ve saklama, veri depolama kuruluşları ile borsa ortaklıkları; BDDK'ya tabi bankalar, derecelendirme, finansal holding, finansal kiralama, faktoring, finansman, varlık yönetim şirketleri, nitelikli pay sahipleri, tasarruf finansman şirketleri; sigorta, reasürans ve emeklilik şirketleri; Borsa İstanbul piyasalarındaki yetkili müesseseler ve kıymetli maden kuruluşları<\/td><\/tr><tr><td>Borsa ortaklıklarında istisna<\/td><td>Yakın İzleme Pazarı ve nitelikli yatırımcılara satılmak üzere Girişim Sermayesi Pazarında işlem görenler hariç<\/td><\/tr><tr><td>Bankalar<\/td><td><b>Eşik aranmaksızın<\/b> zorunlu; <b>TMSF bünyesindekiler<\/b> hariç<\/td><\/tr><tr><td>Kapsam dışındakiler<\/td><td><b>İsteğe bağlı<\/b> uygulayabilir<\/td><\/tr><\/table><ul><li><b>AŞ'lere etkileri:<\/b> sürdürülebilirliğe uymayan şirketler sorumluluk riskiyle karşılaşabilir; ancak TTK pay sahibi çıkarı ve kâr maksimizasyonu üzerine kurulu olduğundan YK'nın ESG'den sorumlu tutulabilmesi için bunun <b>açıkça yükümlülük olarak düzenlenmesi<\/b> gerekir.<\/li><li><b>Finansman fırsatı:<\/b> <b>yeşil borçlanma aracı<\/b>, gelirleri yalnız yeni veya mevcut yeşil projelerin tamamını ya da bir kısmını finanse/yeniden finanse etmek için kullanılan araçtır. SPK, \"Yeşil Borçlanma Aracı, Sürdürülebilir Borçlanma Aracı, Yeşil Kira Sertifikası, Sürdürülebilir Kira Sertifikası Rehberi\"ni <b>24.02.2022<\/b>'de yayımlamıştır (i-SPK 128.18).<\/li><\/ul>", "sorular": [{"q": "TTK m.329'daki anonim şirket tanımına göre aşağıdakilerden hangisi anonim şirketin unsuru değildir?", "o": ["Sermayenin belirli olması", "Ortakların şirket alacaklılarına karşı taahhüt ettikleri sermaye kadar doğrudan sorumlu olması", "Sermayenin paylara bölünmüş olması", "Şirketin borçlarından yalnız malvarlığıyla sorumlu olması", "Pay sahiplerinin yalnız şirkete karşı sorumlu olması"], "a": 1, "e": "Pay sahipleri yalnız taahhüt ettikleri sermaye ile ve sadece şirkete karşı sorumludur; alacaklılara karşı sorumlulukları yoktur."}, {"q": "Anonim şirkette 'tek borç ilkesi' neyi ifade eder?", "o": ["Şirketin yalnız bir alacaklıya borçlanabilmesi", "Her pay sahibinin yalnız bir pay alabilmesi", "Şirketin yalnız tek tür pay çıkarabilmesi", "Yönetim kurulu üyesinin tek bir şirkette görev alabilmesi", "Pay sahibinin şirkete karşı tek borcunun taahhüt ettiği sermayeyi ödemek olması"], "a": 4, "e": "Tek borç ilkesine göre pay sahibi sermaye koyma borcunu ifa edince şirkete karşı sorumluluğu sona erer (m.329/2, m.480/1)."}, {"q": "Bir anonim şirket pay sahibi taahhüt ettiği sermayeyi ödememiştir. Şirket alacaklısının bu bedelin şirkete ödenmesi için pay sahibine karşı doğrudan dava açma imkânı var mıdır?", "o": ["Evet, her alacaklı açabilir", "Evet, ancak şirket iflas etmişse ve yalnız kendi alacağı kadar", "Hayır, alacaklıların böyle bir dava hakkı yoktur", "Evet, alacaklıların çoğunluğu karar verirse", "Yalnız kamu alacaklıları açabilir"], "a": 2, "e": "m.329'da sorumluluk yalnız şirkete karşıdır; kitap alacaklıların ödenmesini isteme hakkı dahi olmadığını vurgular."}, {"q": "Ortağın şahsi borcu nedeniyle doğrudan ortağı olduğu şirketin malvarlığına başvurulmasına ne ad verilir?", "o": ["Tüzel kişilik perdesinin ters kaldırılması", "Tüzel kişilik perdesinin düz kaldırılması", "Tüzel kişilik perdesinin çapraz kaldırılması", "Iskat", "Külli halefiyet"], "a": 0, "e": "Düz kaldırmada şirket borcu için ortağa, ters kaldırmada ortağın borcu için şirkete gidilir; çapraz kaldırma şirketler topluluğuna özgüdür."}, {"q": "Tüzel kişilik perdesinin çapraz kaldırılmasında izlenen sıra nasıldır?", "o": ["Önce ortaktan şirkete, sonra şirketten alacaklıya ulaşılır", "Doğrudan bir bağlı şirketten diğerine geçilir, hâkim şirkete uğranmaz", "Önce hâkim şirketin ortaklarına, sonra bağlı şirkete gidilir", "Önce bağlı şirketten hâkim şirkete, sonra hâkim şirketten diğer bağlı şirkete ulaşılır", "Yalnız hâkim şirketin malvarlığına başvurulur"], "a": 3, "e": "Çapraz kaldırmada önce bağlı şirketten hâkim şirkete ulaşılır, sonra hâkim şirketten diğer bağlı şirkete geçilir; şirketler topluluğuna özgüdür."}, {"q": "Unvanında gerçek kişinin adı veya soyadı bulunan anonim şirket bakımından aşağıdakilerden hangisi doğrudur?", "o": ["İşletme konusunun gösterilmesi gerekmez", "Unvan ticaret siciline tescil edilmez", "Şirket türünü gösteren ibare kısaltılarak yazılamaz", "Şirket türü ibaresi yalnız baş harflerle yazılmalıdır", "Unvanda en fazla iki kişinin adı yer alabilir"], "a": 2, "e": "m.43/2: gerçek kişi adı veya soyadı varsa 'anonim şirket' ibaresi baş harflerle veya başka şekilde kısaltılamaz."}, {"q": "Anonim şirketin kuruluşunda kurucu sayısına ilişkin TTK m.338 hükmü bakımından aşağıdakilerden hangisi yanlıştır?", "o": ["Şirket, tek pay sahibi kendisi olacak şekilde kendi paylarının tamamını iktisap edebilir", "Şirket tek pay sahibiyle kurulabilir", "Tek pay sahibi tüzel kişi olabilir", "Mülga TTK'daki en az beş kurucu şartı kaldırılmıştır", "Birden fazla ortakla kurulan şirket sonradan tek ortaklı hale gelebilir"], "a": 0, "e": "m.338/3: AŞ kendi paylarının tamamını iktisap ederek tek pay sahibi haline gelemez."}, {"q": "Esas sermaye sistemindeki iki anonim şirketin asgari sermayeleri toplamı ile kayıtlı sermaye sistemindeki halka kapalı bir anonim şirketin asgari sermayesi arasındaki fark ne kadardır?", "o": ["250.000 TL", "100.000 TL", "400.000 TL", "Fark yoktur, ikisi de 500.000 TL'dir", "750.000 TL"], "a": 3, "e": "İki esas sermayeli AŞ: 2 x 250.000 = 500.000 TL; kayıtlı sermayeli halka kapalı AŞ: 500.000 TL. Fark sıfırdır."}, {"q": "Asgari sermaye tutarlarını artırma yetkisi konusunda aşağıdakilerden hangisi doğrudur?", "o": ["Yetki Ticaret Bakanlığındadır ve her iki şirkette on kat sınırı vardır", "Yetki Cumhurbaşkanındadır; limited şirkette on katına kadar sınır varken anonim şirkette üst sınır öngörülmemiştir", "Yetki SPK'dadır ve sınır yoktur", "Yetki TBMM'dedir; anonim şirkette beş kat sınırı vardır", "Yetki Cumhurbaşkanındadır; her iki şirkette de on kat sınırı vardır"], "a": 1, "e": "Cumhurbaşkanı artırabilir; m.580/2 limitedde on katına kadar izin verirken AŞ için üst sınır yoktur."}, {"q": "Aşağıdaki genel kurul kararlarından hangisi sermayenin tümünü oluşturan payların sahiplerinin oybirliğini gerektirir?", "o": ["İşletme konusunun tamamen değiştirilmesi", "İmtiyazlı pay oluşturulması", "Nama yazılı payların devrinin sınırlandırılması", "Yönetim kurulu üyelerinin seçimi", "Şirket merkezinin yurt dışına taşınması"], "a": 4, "e": "m.421/2: merkezin yurt dışına taşınması ve bilanço zararları için yükümlülük koyma oybirliği ister; diğer üç esas sözleşme değişikliği sermayenin yüzde yetmiş beşini gerektirir."}, {"q": "Sermayesi 8.000.000 TL olan bir anonim şirkette imtiyazlı pay oluşturulması için en az kaç TL'lik payın sahiplerinin olumlu oyu gerekir?", "o": ["4.000.001 TL", "5.333.334 TL", "8.000.000 TL", "6.000.000 TL", "2.000.000 TL"], "a": 3, "e": "m.421/3: imtiyazlı pay oluşturma sermayenin en az yüzde yetmiş beşini oluşturan payların olumlu oyunu ister: 8.000.000 x 0,75 = 6.000.000 TL."}, {"q": "Sermayenin korunması ilkesine aykırı yönetim kurulu ve genel kurul kararlarına bağlanan yaptırım nedir?", "o": ["İptal edilebilirlik", "Butlan", "Askıda hükümsüzlük", "Yalnız tazminat", "Yokluk"], "a": 1, "e": "m.391/1-b ve m.447/1-c sermayenin korunması ilkesine aykırı kararları batıl sayar."}, {"q": "TTK m.340'taki emredicilik ilkesine göre aşağıdakilerden hangisi doğrudur?", "o": ["Esas sözleşme TTK'nın tüm hükümlerinden serbestçe sapabilir", "Kanunun sustuğu konularda esas sözleşmeye hiçbir hüküm konulamaz", "Tamamlayıcı hükümler de yasak sapma sayılır", "Sapma kavramı geniş yorumlanmalıdır", "Esas sözleşme TTK'nın AŞ hükümlerinden ancak Kanunda açıkça izin verilmişse sapabilir"], "a": 4, "e": "AŞ'de kural emrediciliktir; sapma dar yorumlanır ve kanunun sustuğu konularda aykırı olmayan ihtiyari hüküm konulabilir."}, {"q": "TTK m.1524'teki internet sitesi açma zorunluluğu 6335 sayılı Kanunla yapılan değişiklikten sonra hangi şirketlerle sınırlandırılmıştır?", "o": ["Tüm sermaye şirketleri", "Yalnız halka açık anonim ortaklıklar", "TTK m.397/4 uyarınca bağımsız denetime tabi sermaye şirketleri", "Tüm ticaret şirketleri", "Sermayesi 500.000 TL'yi aşan anonim şirketler"], "a": 2, "e": "Hüküm ilk halinde tüm sermaye şirketlerini kapsıyordu; 6335 sayılı Kanunla bağımsız denetime tabi sermaye şirketleriyle sınırlandı."}, {"q": "TTK genel gerekçesine göre aşağıdakilerden hangisi kurumsal yönetimin dört esas unsurundan biri değildir?", "o": ["Kâr maksimizasyonu", "Eşitlik (adillik)", "Hesap verebilirlik", "Sorumluluk", "Kamuyu aydınlatma ve şeffaflık"], "a": 0, "e": "Dört esas unsur eşitlik, hesap verebilirlik, sorumluluk ile kamuyu aydınlatma ve şeffaflıktır."}, {"q": "TTK m.1529'a göre halka açık anonim ortaklıklar için kurumsal yönetim ilkelerini ve derecelendirme kurallarını belirleme yetkisi kime aittir?", "o": ["Ticaret Bakanlığı", "Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu", "Borsa İstanbul", "Bankacılık Düzenleme ve Denetleme Kurumu", "Sermaye Piyasası Kurulu"], "a": 4, "e": "Yetki SPK'dadır; diğer kamu kurumları SPK'nın uygun görüşüyle kendi alanlarında sınırlı düzenleme yapabilir."}, {"q": "Eşit işlem ilkesinin mutlak olarak uygulandığı, yani pay sahipleri arasında farklılaştırma yapılamayan haklara örnek hangisidir?", "o": ["Kâr payı hakkı", "Rüçhan hakkı", "Genel kurul kararlarına karşı iptal davası açma hakkı", "Oy hakkı", "Tasfiye payı hakkı"], "a": 2, "e": "Oransallığın uygulanmadığı vazgeçilmez haklarda (katılma, iptal davası, bilgi alma, özel denetçi) ilke mutlaktır; kâr payı, rüçhan ve oyda nisbidir."}, {"q": "Eşit işlem ilkesine aykırı yönetim kurulu kararlarına TTK m.391/1-a uyarınca bağlanan yaptırım nedir?", "o": ["Butlan", "İptal", "Yokluk", "Askıda geçersizlik", "Yalnız sorumluluk davası"], "a": 0, "e": "m.391/1-a eşit işlem ilkesine aykırı YK kararlarını batıl sayar; TTK'da YK kararlarının iptali düzenlenmemiştir."}, {"q": "TTK m.358'e göre pay sahibinin anonim şirkete geçerli olarak borçlanabilmesi için hangi koşullar birlikte aranır?", "o": ["Pay sahibinin en az yüzde elli paya sahip olması ve genel kurul onayı", "Yönetim kurulunun oybirliğiyle karar vermesi ve teminat alınması", "Pay sahibinin YK üyesi olmaması ve borcun nakit olmaması", "Sermaye taahhüdünden doğan vadesi gelmiş borçların ifa edilmiş olması ve şirketin serbest yedek akçelerle birlikte kârının geçmiş yıl zararlarını karşılayacak düzeyde olması", "Şirketin halka açık olması ve SPK izni"], "a": 3, "e": "m.358: vadesi gelmiş sermaye borçlarının ifası ve kârın serbest yedek akçelerle birlikte geçmiş yıl zararlarını karşılaması gerekir."}, {"q": "TTK m.358'deki borçlanma yasağına aykırı olarak pay sahibine borç verenler için öngörülen cezai yaptırım nedir?", "o": ["Bir yıla kadar hapis", "Üç yüz günden az olmamak üzere adli para cezası", "Yüz günden az olmamak üzere adli para cezası", "İdari para cezası", "Beş yıla kadar meslekten men"], "a": 1, "e": "m.562/5: üç yüz günden az olmamak üzere adli para cezası; özel hukuk yaptırımı ise işlemin batıl olmasıdır."}, {"q": "TTK m.395/2'deki borçlanma yasağı ve buna bağlı kefalet, garanti ve teminat yasağı aşağıdakilerden hangisini kapsamaz?", "o": ["Pay sahibi olan yönetim kurulu üyesini", "Pay sahibi olmayan yönetim kurulu üyesini", "Yönetim kurulu üyesinin pay sahibi olmayan eşini", "YK üyesinin m.393'te sayılan pay sahibi olmayan yakınlarını", "Pay sahibi olmayan YK üyesi lehine şirketin kefalet vermesini"], "a": 0, "e": "Pay sahibi olan YK üyeleri m.395 kapsamında değildir; onlar için m.358 uygulanır."}, {"q": "Oransallık ilkesine esas sözleşmeyle istisna getirilebilecek hallerden biri aşağıdakilerden hangisidir?", "o": ["Bilgi alma hakkının kaldırılması", "Genel kurula katılma hakkının kaldırılması", "İptal davası açma hakkının sınırlandırılması", "Birden fazla oya sahip olanların oy sayısının sınırlandırılması", "Özel denetçi isteme hakkının kaldırılması"], "a": 3, "e": "m.434/1 oy sayısının sınırlanmasına, m.478/2 imtiyaz tanınmasına izin verir; koruyucu haklar kaldırılamaz."}, {"q": "KGK'nın TSRS Kurul Kararına göre listedeki bir şirketin aktif toplamı 620 milyon TL, net satışı 800 milyon TL ve çalışan sayısı 310'dur ve bu değerler art arda iki dönemdir aynıdır. Şirketin durumu nedir?", "o": ["Yalnız bir ölçütü aştığı için kapsam dışıdır", "İki ölçütü aştığı için TSRS uygulaması zorunludur", "Net satış eşiği aşılmadığı için kapsam dışıdır", "Üç ölçütün tamamı aşılmadığından gönüllüdür", "Ancak SPK izin verirse zorunlu hale gelir"], "a": 1, "e": "Eşikler 500 milyon TL aktif, 1 milyar TL net satış ve 250 çalışandır; aktif ve çalışan sayısı olmak üzere en az ikisi art arda iki dönemde aşılmıştır."}, {"q": "TSRS Kurul Kararına göre bankalar bakımından aşağıdakilerden hangisi doğrudur?", "o": ["Bankalar da üç ölçütün ikisini aşarsa kapsama girer", "Tüm bankalar kapsam dışındadır", "Yalnız halka açık bankalar zorunlu kapsamdadır", "TMSF bünyesindeki bankalar eşik aranmaksızın zorunlu kapsamdadır", "TMSF bünyesindekiler hariç bankalar eşik aranmaksızın zorunlu kapsamdadır"], "a": 4, "e": "BDDK'ya tabi bankalar eşik aranmaksızın zorunlu kapsamdadır; Tasarruf Mevduatı Sigorta Fonu bünyesindekiler muaftır."}, {"q": "TTK m.88/6 hükmüyle Türkiye Sürdürülebilirlik Raporlama Standartlarını belirleme ve yayımlama yetkisi hangi kuruma verilmiştir?", "o": ["Sermaye Piyasası Kurulu", "Ticaret Bakanlığı", "Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu", "Türkiye Bankalar Birliği", "Borsa İstanbul"], "a": 2, "e": "7408 sayılı Kanunla eklenen m.88/6 bu yetkiyi KGK'ya vermiştir."}]}, {"id": 5, "kisa": "AŞ Kuruluşu", "baslik": "Anonim Şirketin Kuruluşu: Kurucu, Kuruluş Türleri, İzin, Belgeler, Tescil ve Sonuçları", "ozet": "Kurucu kavramı, basit ve nitelikli ani kuruluş, ön şirket, halka arz taahhüdü, Bakanlık izni, kuruluş belgeleri, kurucu intifa senetleri, esas sözleşme içeriği, kuruluştan sonra devralma (m.356) ve kuruluşun hukuki sonuçları.", "notlar": "<h3>Kurucu kavramı (TTK m.337)<\/h3><ul><li><b>Kurucu:<\/b> <b>pay taahhüt edip esas sözleşmeyi imzalayan<\/b> gerçek ve tüzel kişiler (m.337/1).<\/li><li>Üçüncü kişi hesabına pay taahhüt edip imzalayan kişi kurucudur; ayrıca hesabına işlem yapılan (temsil olunan) kişi de <b>kuruluştan doğan sorumluluk bakımından kurucu<\/b> sayılır. Temsil olunan, kendi hesabına iş görenin bildiği veya bilmesi gerekeni bilmediğini ileri süremez (m.337/2).<\/li><li>Kurucu sıfatına sonuç bağlayan hükümlere örnek: m.388/3, 439/2, 441/3, 502/2, 553, 559, 562/5-a.<\/li><\/ul><h3>Kuruluş türleri<\/h3><h4>Ani kuruluş<\/h4><ul><li>AŞ'nin olağan ve temel kuruluş yolu: kurucuların, kanuna uygun düzenlenmiş, <b>sermayenin tamamını ödemeyi şartsız taahhüt ettikleri<\/b>, imzalarının <b>noterce onaylandığı<\/b> esas sözleşmede AŞ kurma iradelerini açıklamaları. Tüzel kişilik ise daha sonra <b>ticaret siciline tescil<\/b> ile kazanılır (m.355/1).<\/li><\/ul><table><tr><th><\/th><th>Basit ani kuruluş<\/th><th>Nitelikli (mevsuf) ani kuruluş<\/th><\/tr><tr><td>Sermaye<\/td><td>Taahhüt edilen sermayenin <b>tamamı nakit<\/b><\/td><td>Kısmen veya tamamen <b>ayni<\/b> sermaye olabilir<\/td><\/tr><tr><td>Özel durum<\/td><td>Kurucu menfaati, bilirkişi değerlemesi, yüksek kuruluş gideri gibi denetim gerektiren durum yok<\/td><td>Üç hal: (1) ayni sermaye (m.342); (2) kuruluşta satımla bir aynın veya işletmenin devralınması (m.343); (3) kuruculara kârdan özel menfaat (m.348)<\/td><\/tr><tr><td>Ek işlem<\/td><td>Yok<\/td><td>Sermayenin korunması gereği <b>bilirkişi değerlemesi<\/b> (m.343) ve ek güvenceler<\/td><\/tr><\/table><h4>Basit ani kuruluşun aşamaları<\/h4><ol><li><b>Esas sözleşmenin<\/b> yazılı hazırlanması (tek kişilik şirkette <b>esas taahhütname<\/b>).<\/li><li>Tüm kurucuların imzalarının <b>noterce onayı<\/b> (m.339/1) → <b>ön şirket<\/b> doğar (m.335); tescile kadar sürer.<\/li><li>Sermayenin kısmen veya tamamen <b>ödenmesi<\/b> (m.344).<\/li><li>Gerekiyorsa <b>Bakanlık izni<\/b> (m.333).<\/li><li>Esas sözleşmenin tamamının ticaret siciline <b>tescili<\/b> → <b>tüzel kişilik<\/b> (m.354).<\/li><li>Esas sözleşmenin tamamının <b>TTSG'de ilanı<\/b> (m.354).<\/li><\/ol><ul><li>Nitelikli kuruluşta esas sözleşmeden sonra ayni sermayeye veya devralınacak ayın/işletmeye şirket merkezindeki <b>asliye ticaret mahkemesince atanan bilirkişi<\/b> değer biçer (m.343); ayni sermaye unsurları güven altına alınır.<\/li><\/ul><h4>Ön şirket<\/h4><table><tr><th>Dönem<\/th><th>Hukuki durum<\/th><\/tr><tr><td>Noter onayından önce (hazırlık)<\/td><td>Kurucu adayları arasında AŞ kurmaya yönelik <b>adi şirket<\/b> ilişkisi<\/td><\/tr><tr><td>Noter onayı ile tescil arası (<b>ön şirket<\/b>)<\/td><td>Esas sözleşme ve AŞ hükümleri kurucular arasında uygulanır; ancak <b>tüzel kişilik yoktur<\/b><\/td><\/tr><tr><td>Ticaret siciline tescilden sonra<\/td><td><b>Tüzel kişilik<\/b> kazanılmıştır (m.355/1)<\/td><\/tr><\/table><h4>Halka arz taahhüdü yoluyla kuruluş (m.346)<\/h4><ul><li>Payların bir kısmının kurucularca, kalanının halktan toplanmasına dayanan <b>tedrici kuruluş<\/b> 6102 sayılı TTK'da <b>kaldırılmıştır<\/b>.<\/li><li>Yerine m.346 getirilmiştir; bu yol ani kuruluşun bir <b>alternatifi değildir<\/b>, <b>nitelikli kuruluş<\/b> özelliği de taşımaz.<\/li><li>İşleyiş: halka arz edilecek nakdi paylar kurucularca taahhüt edilir, ancak m.344'teki peşin tutar <b>bankaya yatırılmaz<\/b>; bedel halka satış hasılatından ödenir. Paylar tescilden itibaren <b>2 ay<\/b> içinde pay senedine bağlanıp halka arz edilmelidir; aksi halde asgari bedeli taahhüt edenler öder.<\/li><li>Dikkat: <b>SerPK m.12/6<\/b> (RG 30.12.2012), TTK m.346 ve m.462/3'ün <b>halka açık ve halka açılmak üzere Kurula başvuran<\/b> ortaklıklara uygulanmayacağını öngörerek m.346'nın uygulama alanını ortadan kaldırmıştır.<\/li><\/ul><h3>Kuruluşta izin (TTK m.333)<\/h3><ul><li>Genel ilke <b>serbestlik<\/b>; istisna: Ticaret Bakanlığının tebliğle belirleyip ilan ettiği faaliyet alanlarındaki AŞ'ler Bakanlık izniyle kurulur.<\/li><li>Dayanak: \"Anonim ve Limited Şirketlerin Sermayelerini Yeni Asgari Tutarlara Yükseltmelerine ve Kuruluşu ve Esas Sözleşme Değişikliği İzne Tabi Anonim Şirketlerin Belirlenmesine İlişkin Tebliğ\" <b>m.5<\/b>.<\/li><li>İzne tabi olanlar: <b>bankalar, finansal kiralama, faktoring, tüketici finansmanı ve kart hizmetleri, varlık yönetim, sigorta şirketleri, AŞ şeklindeki holdingler, döviz büfesi işletenler, umumi mağazacılık, tarım ürünleri lisanslı depoculuk, ürün ihtisas borsası, bağımsız denetim, gözetim, teknoloji geliştirme bölgesi yönetici şirketleri, SerPK'ya tabi şirketler, serbest bölge kurucu ve işleticisi şirketler<\/b>. Bunların <b>esas sözleşme değişiklikleri<\/b> de izne tabidir.<\/li><li>Dikkat: Bakanlık incelemesi <b>yalnız kanunun emredici hükümlerine aykırılık<\/b> yönünden yapılır. Bu izin dışında AŞ kuruluşunun ve esas sözleşme değişikliklerinin <b>başka bir makamın iznine bağlanması yasaktır<\/b>.<\/li><li>Tartışma: m.333'ün önceki tarihli özel kanunlarla SPK, BDDK, EPDK gibi kurumlara verilen izin yetkilerini kaldırdığı savunulabilir. Ancak 6362 sayılı SerPK TTK'dan <b>sonraki tarihli özel kanun<\/b> olduğundan SPK'nın aracı kurumlar (SerPK m.43/1) için kuruluş-faaliyet izni ve halka açık AŞ'lerin esas sözleşme değişiklikleri (m.18, 33/2) üzerindeki yetkileri geçerli kabul edilebilir; SerPK m.2/2 genel hükümleri ikincil kılar.<\/li><\/ul><h3>Kuruluş belgeleri (TTK m.336)<\/h3><ul><li>Üç belge: <b>esas sözleşme<\/b>; <b>değerleme raporları<\/b>; ayın ve işletme devralınmasına ilişkinler dahil kurulmakta olan şirketle, kurucular ve diğer kişilerle yapılan <b>kuruluşla ilgili sözleşmeler<\/b>.<\/li><li>Sicil dosyasına konulur; şirket birer nüshasını <b>5 yıl<\/b> saklar.<\/li><li>Kuruluş belgeleri <b>sınırlı sayıdadır<\/b>; önemi özellikle kuruluş sorumluluğu (m.549, 562, 563) bakımındandır.<\/li><\/ul><h3>Kurucu menfaatleri (TTK m.348)<\/h3><ul><li>Kurucuların emeğine karşılık sermayeyi azaltacak <b>para veya bedelsiz pay senedi<\/b> verilmesi <b>emredici olarak yasaktır<\/b>.<\/li><li>İzin verilen: <b>kurucu intifa senetleri<\/b>. Dağıtılabilir kârdan <b>m.519/1'deki yedek akçe<\/b> ile pay sahipleri için <b>%5 kâr payı<\/b> ayrıldıktan sonra kalanın <b>en çok onda biri<\/b> kuruculara ödenir.<\/li><li>Dağıtılabilir kâr varsa, şirket kârı dağıtmamaya karar verse bile kurucu intifa sahipleri esas sözleşmedeki paylarını alır (m.348/3).<\/li><li>Öğreti, intifa senedi dışında da (rüçhan, tasfiye payına katılma) kurucu menfaati tanınabileceğini kabul eder.<\/li><li>Dikkat: TTK yürürlüğünden sonra kurulan AŞ'ler, pay senetlerini <b>halka arz etmeden önce<\/b> kurucu intifa senetlerini <b>bedelsiz iptal<\/b> etmelidir; aksi halde senetler <b>kendiliğinden geçersiz<\/b> olur (m.348/2).<\/li><\/ul><h3>Esas sözleşme (TTK m.339)<\/h3><ul><li><b>Yazılı<\/b> yapılır ve <b>bütün kurucuların imzaları noterce onaylanır<\/b>.<\/li><\/ul><ol><li>Ticaret unvanı ve merkez<\/li><li>Esaslı noktaları belirtilmiş ve tanımlanmış <b>işletme konusu<\/b><\/li><li>Sermaye, her payın itibari değeri, ödeme şekil ve şartları<\/li><li>Pay senetlerinin nama veya hamiline olacağı; imtiyazlar; devir sınırlamaları<\/li><li>Ayni sermaye, değerleri ve karşılığı paylar; devralınan işletme/ayın bedeli; kuruluş için alınan mal ve hak bedelleri; hizmet edenlere verilecek ücret, ödenek, ödül<\/li><li>Kuruculara, YK üyelerine ve diğer kişilere kârdan sağlanacak menfaatler<\/li><li>YK üye sayısı ve imzaya yetkili olanlar<\/li><li>Genel kurulun çağrı şekli ve oy hakları<\/li><li>Şirket süreli ise süresi<\/li><li>İlanların nasıl yapılacağı<\/li><li>Pay sahiplerinin taahhüt ettiği payların türleri ve miktarları<\/li><li>Hesap dönemi<\/li><\/ol><h3>Kuruluşta kanuna karşı hile: kuruluştan sonra devralma veya kiralama (TTK m.356)<\/h3><ul><li>Amaç: kuruluştaki ayın/işletme devralma güvencelerinin (m.343 bilirkişi, m.339/2-e esas sözleşmede bedel, m.349/1 kurucular beyanı) kuruluştan hemen sonra yapılan işlemlerle <b>dolanılmasını önlemek<\/b>.<\/li><\/ul><table><tr><th>Uygulama şartı<\/th><th>Kural<\/th><\/tr><tr><td>Konu<\/td><td>Şirketin <b>işletme konusunu oluşturan ayın ve işletmeler<\/b> (m.356/5): yatırım malvarlığı, yani <b>duran varlıklar<\/b>. Cari işlemler (örn. gıda şirketinin un, yağ alımı) girmez; fabrika, arsa, dağıtım kamyonu girer.<\/td><\/tr><tr><td>Zaman<\/td><td>Kuruluşun <b>tescilinden itibaren 2 yıl<\/b>; esas olan <b>taahhüt işleminin<\/b> (sözleşmenin) bu sürede yapılması; ifanın sonra olması önemsiz. Süre <b>emredici<\/b>, esas sözleşmeyle uzatılamaz veya kısaltılamaz.<\/td><\/tr><tr><td>Taraf<\/td><td>Sınırlama yok: kurucu, ortak, yönetici veya herhangi bir <b>üçüncü kişi<\/b>.<\/td><\/tr><tr><td>İşlem<\/td><td>Devralma veya kiralama: mülkiyeti devreden <b>satım, eser veya kira<\/b> sözleşmesi; <b>hizmet sözleşmesi girmez<\/b>.<\/td><\/tr><tr><td>Değer<\/td><td>Bedelin <b>sermayenin onda birini geçmesi<\/b>; onda bir veya altı ya da <b>bedelsiz<\/b> iktisapta uygulanmaz.<\/td><\/tr><\/table><h4>Prosedür ve yaptırım<\/h4><ol><li><b>YK'nın talebiyle mahkemece atanan bilirkişi<\/b> ayın/işletmenin değerini raporlar.<\/li><li><b>Genel kurul onayı:<\/b> sermayenin <b>en az %75'ini<\/b> oluşturan pay sahiplerinin olumlu oyu; ilk toplantıda sağlanamazsa <b>ikinci toplantıda da aynı nisap<\/b> aranır.<\/li><li>Kararın <b>ticaret siciline tescili ve TTSG'de ilanı<\/b>; ayrıca en az <b>6 ay<\/b> süreyle şirketin <b>internet sitesine<\/b> konulması.<\/li><\/ol><ul><li>İşlem ancak genel kurul onayı ve tescille geçerli olur. Prosedüre uyulmaması geçersizlik doğurur; doktrindeki hâkim görüşe göre sözleşme o zamana kadar <b>askıda hükümsüzdür<\/b>.<\/li><\/ul><h3>Kuruluşun hukuki sonuçları<\/h3><ul><li><b>Tüzel kişilik:<\/b> tescille kazanılır (m.355/1); ön anonim şirketin tüzel kişiliği yoktur.<\/li><li><b>Butlan veya yokluk kararı verilemez (m.353):<\/b> tescilden sonra kuruluştaki ağır aykırılıklar şirketi batıl veya yok kılmaz.<\/li><li><b>Fesih davası (m.353):<\/b> kuruluşta kanuna aykırılıkla alacaklıların, pay sahiplerinin veya kamunun menfaatleri <b>önemli ölçüde tehlikeye düşmüş veya ihlal edilmişse<\/b>; <b>yönetim kurulu, Ticaret Bakanlığı, ilgili alacaklı veya pay sahibi<\/b> istemiyle şirket merkezindeki <b>asliye ticaret mahkemesi<\/b> fesih kararı verebilir.<\/li><li>Dikkat: Fesih davası şirketin <b>tescil ve ilanından itibaren 3 ay<\/b> içinde açılmalıdır; süre <b>hak düşürücüdür<\/b>. Mahkeme feshe karar vermek yerine eksikliklerin giderilmesi için <b>süre verebilir<\/b> (m.353/2).<\/li><li><b>Pay devri (m.352):<\/b> pay taahhüdünün <b>tescilden önce devri şirkete karşı ileri sürülemez<\/b>. Devir yasak değildir, yalnız şirkete karşı geçersizdir; tescilden sonra pay devri kural olarak şirkete karşı da ileri sürülebilir.<\/li><\/ul><table><tr><th>Kuruluşta süre/oran<\/th><th>Değer<\/th><\/tr><tr><td>Kuruluş belgelerini saklama<\/td><td>5 yıl (m.336)<\/td><\/tr><tr><td>Kurucu intifa senedi payı<\/td><td>Yedek akçe ve %5 kâr payından sonra kalanın en çok 1/10'u (m.348)<\/td><\/tr><tr><td>Halka arz taahhüdünde arz süresi<\/td><td>Tescilden itibaren 2 ay (m.346)<\/td><\/tr><tr><td>Kuruluştan sonra devralma<\/td><td>Tescilden 2 yıl; sermayenin 1/10'unu aşan bedel; GK'da sermayenin %75'i; internet sitesinde en az 6 ay (m.356)<\/td><\/tr><tr><td>Fesih davası<\/td><td>Tescil ve ilandan itibaren 3 ay, hak düşürücü (m.353)<\/td><\/tr><\/table>", "sorular": [{"q": "TTK m.337/1'e göre anonim şirkette kurucu kimdir?", "o": ["Esas sözleşmeyi hazırlayan avukatlar", "Şirketin ilk yönetim kurulu üyeleri", "Sermayenin en az yüzde onunu taahhüt edenler", "Pay taahhüt edip esas sözleşmeyi imzalayan gerçek ve tüzel kişiler", "Esas sözleşmeyi onaylayan noter"], "a": 3, "e": "Kurucu, pay taahhüt edip esas sözleşmeyi imzalayan gerçek ve tüzel kişilerdir."}, {"q": "Bir kişinin başkası hesabına pay taahhüt edip esas sözleşmeyi imzalaması halinde TTK m.337/2'ye göre aşağıdakilerden hangisi doğrudur?", "o": ["Yalnız imzalayan kişi kurucu sayılır", "Hesabına işlem yapılan kişi de kuruluştan doğan sorumluluk bakımından kurucu sayılır", "Yalnız hesabına işlem yapılan kişi kurucu sayılır", "İşlem geçersizdir", "Hesabına işlem yapılan kişi, temsilcinin bildiği hususları bilmediğini ileri sürebilir"], "a": 1, "e": "İmzalayan kurucudur; temsil olunan da sorumluluk bakımından kurucu sayılır ve temsilcinin bildiğini bilmediğini ileri süremez."}, {"q": "Aşağıdakilerden hangisi nitelikli ani kuruluşu gerektiren hallerden biri değildir?", "o": ["Sermayenin kısmen ayni olarak konulması", "Kuruluş sırasında bir işletmenin satın alınarak devralınması", "Kuruculara şirket kârından özel menfaat sağlanması", "Sermayenin tamamen ayni olarak konulması", "Sermayenin tamamının nakit olarak taahhüt edilmesi"], "a": 4, "e": "Sermayenin tamamen nakit olması ve özel menfaat bulunmaması basit ani kuruluştur; ayni sermaye, ayın/işletme devralma ve kurucu menfaati nitelikli kuruluş halleridir."}, {"q": "Anonim şirketin basit ani kuruluşunda aşağıdaki aşamaların doğru sıralaması hangisidir? I. Ticaret siciline tescil  II. İmzaların noterce onayı  III. Sermayenin ödenmesi  IV. TTSG'de ilan", "o": ["III, II, I, IV", "II, I, III, IV", "II, III, I, IV", "I, II, III, IV", "II, III, IV, I"], "a": 2, "e": "Esas sözleşme hazırlanır, imzalar noterce onaylanır (ön şirket), sermaye ödenir, gerekiyorsa izin alınır, tescil edilir ve TTSG'de ilan olunur."}, {"q": "Ön şirket ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Kurucuların imzalarının noterce onaylanmasıyla doğar ancak tüzel kişiliği yoktur", "Ticaret siciline tescille doğar ve tüzel kişidir", "Noter onayından önceki hazırlık dönemini ifade eder", "Ön şirket döneminde AŞ hükümleri kurucular arasında uygulanmaz", "Ön şirket TTSG'de ilanla tüzel kişilik kazanır"], "a": 0, "e": "Ön şirket noter onayıyla doğar, tescile kadar sürer; esas sözleşme ve AŞ hükümleri kurucular arasında uygulanır ama tüzel kişilik tescille kazanılır."}, {"q": "Anonim şirket kurmak üzere bir araya gelen kişiler arasında, esas sözleşme imzaları noterce onaylanmadan önceki hazırlık aşamasındaki ilişkinin hukuki niteliği nedir?", "o": ["Ön anonim şirket", "Kollektif şirket", "Tüzel kişiliği olan anonim şirket", "Hâkimiyet sözleşmesi", "Adi şirket ilişkisi"], "a": 4, "e": "Noter onayından önceki aşamada kurucu adayları arasında AŞ kurmaya yönelik bir adi şirket ilişkisi vardır."}, {"q": "TTK m.346'daki halka arz taahhüdü yoluyla kuruluş ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Paylar tescilden itibaren iki ay içinde halka arz edilmelidir", "Bu yol ani kuruluşun bir alternatifi değildir", "Halka arz edilecek payların yüzde yirmi beşi tescilden önce bankaya yatırılır", "Tedrici kuruluş 6102 sayılı TTK ile kaldırılmıştır", "SerPK m.12/6 bu hükmü halka açık ve halka açılmak üzere başvuran ortaklıklara uygulanmaz kılmıştır"], "a": 2, "e": "m.346'da peşin tutar bankaya yatırılmaz; bedel halka satış hasılatından ödenir."}, {"q": "TTK m.333'e göre Ticaret Bakanlığının kuruluş izni incelemesi hangi yönden yapılabilir?", "o": ["Yalnız kanunun emredici hükümlerine aykırılık bulunup bulunmadığı yönünden", "Şirketin ekonomik yerindeliği yönünden", "Kurucuların mali gücü yönünden", "Piyasadaki rekabet durumu yönünden", "Esas sözleşmenin tüm hükümlerinin uygunluğu ve yerindeliği yönünden"], "a": 0, "e": "Bakanlık incelemesi sadece emredici hükümlere aykırılık yönünden yapılır."}, {"q": "Aşağıdaki şirketlerden hangisinin kuruluşu, Ticaret Bakanlığı Tebliği m.5'e göre Bakanlık iznine tabi değildir?", "o": ["Faktoring şirketi", "Bağımsız denetim şirketi", "Anonim şirket şeklinde kurulan holding", "Hazır giyim üretimi yapan bir anonim şirket", "Döviz büfesi işleten şirket"], "a": 3, "e": "Tebliğ m.5 bankalar, finansal kuruluşlar, holdingler, döviz büfeleri, bağımsız denetim, SerPK'ya tabi şirketler gibi belirli alanları sayar; hazır giyim üretimi bunlardan değildir."}, {"q": "Aşağıdakilerden hangisi TTK m.336'ya göre kuruluş belgelerinden biri değildir?", "o": ["Esas sözleşme", "Şirketin ilk yıl bütçesi", "Değerleme raporları", "Ayın devralınmasına ilişkin sözleşme", "Kurulmakta olan şirketle kurucular arasında kuruluşla ilgili yapılan sözleşme"], "a": 1, "e": "Kuruluş belgeleri sınırlı sayıdadır: esas sözleşme, değerleme raporları ve kuruluşla ilgili sözleşmeler."}, {"q": "Kuruluş belgelerinin birer nüshası şirket tarafından ne kadar süre saklanır?", "o": ["Beş yıl", "On yıl", "İki yıl", "Üç yıl", "Süresiz"], "a": 0, "e": "m.336: kuruluş belgeleri sicil dosyasına konulur ve birer nüshası şirketçe beş yıl saklanır."}, {"q": "Bir anonim şirketin dağıtılabilir kârından m.519/1'deki yedek akçe ve pay sahipleri için yüzde beş kâr payı ayrıldıktan sonra 3.000.000 TL kalmıştır. Kurucu intifa senedi sahiplerine ödenebilecek azami tutar nedir?", "o": ["150.000 TL", "750.000 TL", "30.000 TL", "300.000 TL", "600.000 TL"], "a": 3, "e": "m.348: kalan tutarın en çok onda biri kuruculara ödenebilir: 3.000.000 / 10 = 300.000 TL."}, {"q": "Kurucu menfaatlerine ilişkin TTK m.348 bakımından aşağıdakilerden hangisi yanlıştır?", "o": ["Kurucu intifa senedi oluşturulabilir", "Kuruculara emeklerine karşılık bedelsiz pay senedi verilebilir", "Şirket kârı dağıtmamaya karar verse de dağıtılabilir kâr varsa intifa sahipleri paylarını alır", "Halka arzdan önce kurucu intifa senetleri bedelsiz iptal edilmelidir", "İptal edilmeyen intifa senetleri halka arzda kendiliğinden geçersiz olur"], "a": 1, "e": "Sermayeyi azaltacak para veya bedelsiz pay verilmesi emredici olarak yasaktır; yalnız kurucu intifa senedine izin verilir."}, {"q": "Aşağıdakilerden hangisi TTK m.339'a göre esas sözleşmede bulunması gereken hususlardan biri değildir?", "o": ["Şirketin hesap dönemi", "Yönetim kurulu üyelerinin sayısı ve imzaya yetkili olanlar", "Şirkete ait ilanların nasıl yapılacağı", "Esaslı noktaları belirtilmiş işletme konusu", "Kurucuların kişisel malvarlığı dökümü"], "a": 4, "e": "m.339/2 unvan, merkez, işletme konusu, sermaye, pay senetleri, ayni sermaye, kâr menfaatleri, YK, GK, süre, ilan, taahhütler ve hesap dönemini sayar."}, {"q": "Sermayesi 5.000.000 TL olan bir anonim şirket, tescilinden 14 ay sonra bir üçüncü kişiyle dağıtım için kamyon filosu satın alma sözleşmesi yapmıştır. TTK m.356 prosedürü hangi bedelin üzerinde uygulanır?", "o": ["1.250.000 TL", "250.000 TL", "500.000 TL", "50.000 TL", "2.500.000 TL"], "a": 2, "e": "İşlem iki yıl içinde ve duran varlığa ilişkindir; taraf sınırlaması yoktur. Bedel sermayenin onda birini (500.000 TL) geçerse m.356 uygulanır."}, {"q": "TTK m.356 kapsamındaki bir devralma işleminin onayı için genel kurulda aranan nisap nedir?", "o": ["Mevcut oyların salt çoğunluğu", "Sermayenin en az yüzde yetmiş beşini oluşturan pay sahiplerinin olumlu oyu; ikinci toplantıda da aynı nisap", "Sermayenin en az yüzde yetmiş beşi; ikinci toplantıda sermayenin yarısı", "Sermayenin dörtte biri", "Oybirliği"], "a": 1, "e": "m.356 ağırlaştırılmış nisap öngörür: sermayenin en az yüzde yetmiş beşi; ilk toplantıda sağlanamazsa ikinci toplantıda da aynı nisap aranır."}, {"q": "Aşağıdaki işlemlerden hangisi TTK m.356'nın uygulama alanına girer?", "o": ["Gıda şirketinin üretim için un ve yağ alması", "Tescilden üç yıl sonra sermayenin yarısı bedelle fabrika alınması", "Tescilden altı ay sonra sermayenin yirmide biri bedelle kamyon alınması", "Tescilden bir yıl sonra bir danışmanla hizmet sözleşmesi yapılması", "Tescilden bir yıl sonra fabrika yapılmak üzere sermayenin beşte biri bedelle arsa satın alınması"], "a": 4, "e": "m.356 için iki yıl içinde, duran varlığa ilişkin, satım/eser/kira niteliğinde ve sermayenin onda birini aşan bir işlem gerekir."}, {"q": "TTK m.356 kapsamındaki işlemde genel kurul onayının şirketin internet sitesinde en az ne kadar süreyle yayımlanması gerekir?", "o": ["Üç ay", "Bir yıl", "Altı ay", "Otuz gün", "İki yıl"], "a": 2, "e": "Genel kurul kararı tescil ve ilan edilir; ayrıca en az altı aylık süre için internet sitesine konulur."}, {"q": "TTK m.356 prosedürüne uyulmadan yapılan bir devralma sözleşmesinin hukuki durumu doktrindeki hâkim görüşe göre nedir?", "o": ["Prosedür tamamlanıncaya kadar askıda hükümsüzdür", "Kesin geçerlidir", "Yok hükmündedir", "İptal edilebilir, bir yıl içinde dava açılmazsa geçerli olur", "Yalnız YK üyelerini bağlar"], "a": 0, "e": "Kanun geçersizlik öngörse de hâkim görüş, genel kurul onayı ve tescile kadar sözleşmenin askıda hükümsüz olduğudur."}, {"q": "TTK m.353'e göre kuruluşta kanuna aykırılık nedeniyle açılacak fesih davası hangi süre içinde açılmalıdır?", "o": ["Tescilden itibaren bir yıl içinde", "Aykırılığın öğrenilmesinden itibaren iki ay içinde", "İlandan itibaren altı ay içinde", "Şirketin tescil ve ilanından itibaren üç ay içinde", "Süre sınırı yoktur"], "a": 3, "e": "Fesih davası tescil ve ilandan itibaren üç aylık hak düşürücü süre içinde açılmalıdır."}, {"q": "Aşağıdakilerden hangisi TTK m.353'teki fesih davasını açabilecekler arasında sayılmamıştır?", "o": ["Yönetim kurulu", "Ticaret Bakanlığı", "Sermaye Piyasası Kurulu", "İlgili alacaklı", "Pay sahibi"], "a": 2, "e": "Fesih istemi yönetim kurulu, Ticaret Bakanlığı, ilgili alacaklı veya pay sahibine aittir."}, {"q": "Anonim şirketin kuruluşundaki ağır hukuka aykırılıklarla ilgili TTK m.353 bakımından aşağıdakilerden hangisi doğrudur?", "o": ["Tescilden sonra şirketin butlanına veya yokluğuna karar verilemez; mahkeme feshe karar vermek yerine süre de verebilir", "Mahkeme her zaman şirketin yokluğunu tespit eder", "Şirketin butlanı için süre sınırı yoktur", "Mahkeme yalnız feshe karar verebilir, süre veremez", "Fesih davasını yalnız Ticaret Bakanlığı açabilir"], "a": 0, "e": "m.353 butlan ve yokluk kararını yasaklar; fesih davası üç ay içinde açılır ve mahkeme eksikliklerin giderilmesi için süre verebilir."}, {"q": "Pay taahhüdünün şirketin tescilinden önce devredilmesi TTK m.352'ye göre hangi sonucu doğurur?", "o": ["Devir kesin olarak yasaktır ve batıldır", "Devir yalnız noter onayıyla geçerlidir", "Devir şirkete karşı da geçerlidir", "Devir şirkete karşı ileri sürülemez", "Devir Ticaret Bakanlığı iznine bağlıdır"], "a": 3, "e": "m.352 devri yasaklamaz, yalnız şirkete karşı ileri sürülemez kılar."}]}, {"id": 6, "kisa": "Yönetim Kurulu: Yapı", "baslik": "Anonim Şirketin Organları ve Yönetim Kurulu: Yapı, Seçim, Görevler, Toplantı ve Temsil", "ozet": "Organlar arası işlev ayrılığı, yönetim kurulunun oluşumu, üyeliğin kazanılıp kaybedilmesi, devredilemez yetkiler, toplantı ve karar nisapları ile yönetim ve temsil yetkisinin devri.", "notlar": "\n<h3>Anonim şirketin organları<\/h3>\n<ul>\n<li>Zorunlu (olmazsa olmaz) iki organ: <b>genel kurul<\/b> (karar organı) ve <b>yönetim kurulu<\/b> (idare ve temsil organı). Organ, şirketin temsilcisi değil <b>bizatihi kendisidir<\/b>.<\/li>\n<li>TTK, mehaz İsviçre hukukundan farklı olarak genel kurula <b>üst organ<\/b> konumu vermez; <b>organlar arasında işlev ayrılığı<\/b> ilkesini benimser. Genel kurulun her şeye kadir olduğunu savunan <b>salt yetki teorisi reddedilmiştir<\/b>. Bu ayrımın dayanağı özellikle yönetim kurulunun devredilemez yetkilerini sayan m.375'tir.<\/li>\n<li>İşlev ayrılığının sonuçları: (1) genel kurulla bağdaşmayan konularda karar yetkisi esas sözleşmeyle genel kurula bırakılamaz; (2) yönetim kurulu kararları genel kurulun onayına sunulamaz, bu yönde esas sözleşme hükmü de konulamaz; (3) yönetim kurulunun sorumluluğu genel kurul kararıyla kaldırılamaz.<\/li>\n<li><b>Denetçi<\/b>: mülga 6762 sayılı TTK'da zorunlu organdı. 6102 sayılı TTK'da organ olmaktan çıkarıldı; ağırlıklı görüş, tarafsız ve bağımsız konumu nedeniyle denetçinin organ sayılmaması yönündedir.<\/li>\n<\/ul>\n\n<h3>Yönetim kurulunun yapısı<\/h3>\n<ul>\n<li>Düzenleme: <b>TTK m.359–396<\/b>. Yönetim kurulu hem <b>zorunlu<\/b> hem <b>daimi<\/b> organdır; yokluğu m.530'daki <b>organ eksikliği<\/b> nedeniyle fesih sebebidir.<\/li>\n<li><b>Üye sayısı<\/b> (m.359/1): esas sözleşmeyle atanmış veya genel kurulca seçilmiş <b>bir veya daha fazla kişi<\/b>. Üst sınır yoktur. Mülga TTK'daki \"en az üç üye\" şartı, tek kişilik anonim şirkete izin verilmesine paralel olarak kaldırıldı.<\/li>\n<li>Özel düzenlemeler: <b>bankalarda<\/b> (Bankacılık Kanunu m.23) ve Kurumsal Yönetim İlkelerini uygulamakla yükümlü <b>payları borsada işlem gören halka açık ortaklıklarda<\/b> (KY İlkeleri m.4.3.1) yönetim kurulu <b>en az beş üyeden<\/b> oluşur.<\/li>\n<\/ul>\n<h4>Başkan ve başkan vekili<\/h4>\n<ul>\n<li>Yönetim kurulu üyeleri arasından bir <b>başkan<\/b> ve onun yokluğunda vekâlet etmek üzere <b>en az bir başkan vekili<\/b> seçer (m.366/1). Birden fazla başkan vekili seçilebilir. Tek üyeli kurulda başkan seçimine gerek yoktur.<\/li>\n<li><b>7511 sayılı Kanun (29.05.2024)<\/b> ile m.366/1'deki \"her yıl\" ibaresi kaldırıldı; başkan ve vekilinin her yıl seçilme zorunluluğu yoktur, üyelik süresiyle uyumlu görevlendirme yapılabilir.<\/li>\n<li>Esas sözleşmede öngörülürse başkan ve başkan vekili veya bunlardan biri <b>genel kurulca<\/b> seçilebilir. Esas sözleşmede hüküm yoksa, kurul başkan seçemese bile genel kurul başkan seçemez.<\/li>\n<li>Başkan yalnızca <b>üyeler arasından<\/b> seçilir; icracı olmayan bir üye de başkan olabilir.<\/li>\n<li>Başkanın kanuni görevlerine örnekler: hâkim şirket raporunun hazırlanması (m.199/4), genel kurula katılabilecekler listesinin imzalanması (m.417/3), üyelerin toplantı dışında bilgi alma ve inceleme hakkına izin verilmesi (m.392).<\/li>\n<li>Başkan seçilememesi: kurulun karar almasını engelleyecek boyuttaysa m.531 uyarınca <b>haklı sebeple fesih<\/b>; kurulun uzun süredir fiilen toplanamaması ise m.530 anlamında <b>organ yokluğu<\/b> oluşturabilir. Başkansız da olsa karar alabilen bir kurul varsa organ yokluğundan söz edilmez.<\/li>\n<li><b>Üstün oy yoktur.<\/b> Anonim şirkette başkan dahil tüm üyelerin oyu eşittir; m.390/3 emredici olduğundan esas sözleşmeyle başkana üstün oy tanınamaz (m.340). Karşılaştırma: <b>limited şirkette<\/b> müdürler arasında eşitlik hâlinde başkanın oyu üstündür (m.624/3).<\/li>\n<\/ul>\n<h4>Toplantıya çağrı<\/h4>\n<ul>\n<li>Çağrı kural olarak başkan, ulaşılamazsa başkan vekili tarafından yapılır. Her üye başkandan kurulu toplantıya çağırmasını <b>yazılı<\/b> olarak isteyebilir (m.392/7). Başkanın çağrı yapması için bir üyenin talebi şart değildir.<\/li>\n<li>7511 sayılı Kanunla: <b>üyelerin çoğunluğunun yazılı istemi<\/b> üzerine başkan, istemin kendisine ulaştığı tarihten itibaren <b>en geç otuz gün içinde<\/b> yapılacak şekilde kurulu toplantıya çağırmak zorundadır. Bu sürede çağrı yapılmaz veya başkana ya da vekiline ulaşılamazsa çağrıyı <b>istem sahipleri<\/b> doğrudan yapabilir.<\/li>\n<li>Çağrı usulü ve toplantı sıklığı için TTK'da bağlayıcı kural yoktur; şirketler bunu esas sözleşme veya iç yönergeyle düzenler.<\/li>\n<\/ul>\n\n<h3>Yönetim kurulu üyelerinin seçimi<\/h3>\n<ul>\n<li>Kural: üyelerin seçimi ve görevden alınması <b>genel kurulun devredilemez yetkisidir<\/b> (m.408/2-b). İlk yönetim kurulu kural olarak <b>esas sözleşmeyle atanır<\/b> (m.339/3).<\/li>\n<li>İstisnalar:\n<ol>\n<li>Kuruluşta ilk esas sözleşmeyle atama.<\/li>\n<li><b>Kamu tüzel kişilerinin temsilci bulundurması<\/b> (m.334): işletme konusu <b>kamu hizmeti<\/b> olan anonim şirketlerde Devlet, il özel idaresi, belediye, köy ve diğer kamu tüzel kişilerine, esas sözleşme hükmüyle, <b>pay sahibi olmasalar da<\/b> yönetim kurulunda temsilci bulundurma hakkı verilebilir. Bu temsilcileri ancak onları atayan kamu tüzel kişisi görevden alabilir.<\/li>\n<li><b>Geçici üye<\/b> (m.363/1): bir üyelik herhangi bir sebeple boşalırsa yönetim kurulu kanuni şartları taşıyan birini geçici olarak seçer ve <b>ilk genel kurulun onayına<\/b> sunar. Geçici üye o genel kurula kadar görev yapar; onaylanırsa <b>selefinin süresini tamamlar<\/b>.<\/li>\n<li><b>SPK'nın atama yetkisi<\/b>: SerPK m.96/2, 97/1 ve 128/1-k kapsamıyla sınırlı olarak SPK anonim şirketlere yönetim kurulu üyesi atayabilir.<\/li>\n<\/ol><\/li>\n<li><b>Yönetim kurulunda temsil ve aday önerme hakkı<\/b> (m.360): esas sözleşmede öngörülmek şartıyla belirli pay gruplarına, belirli özellikleriyle grup oluşturan pay sahiplerine ve azlığa yönetim kurulunda temsil hakkı veya aday önerme hakkı tanınabilir. Önerilen aday, <b>haklı sebep yoksa<\/b> seçilmek zorundadır. Halka açık şirketlerde bu yolla tanınan temsil hakkı <b>üye sayısının yarısını aşamaz<\/b> (bağımsız üye hükümleri saklı). Bu paylar <b>imtiyazlı<\/b> sayılır.<\/li>\n<\/ul>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>Görev süresi<\/td><td>En çok 3 yıl; daha kısa süre de olabilir; üyelerin aynı süre için seçilmesi zorunlu değil<\/td><td>m.362/1<\/td><\/tr>\n<tr><td>Yeniden seçilme<\/td><td>Esas sözleşmede aksine hüküm yoksa mümkün<\/td><td>m.362/1<\/td><\/tr>\n<tr><td>Ehliyet<\/td><td>Üye ve tüzel kişi adına tescil edilecek gerçek kişi tam ehliyetli olmalı<\/td><td>m.359/3<\/td><\/tr>\n<tr><td>Seçilme engeli<\/td><td>Üyeliği sona erdiren sebepler seçilmeye de engeldir; iflas, kısıtlanma<\/td><td>m.359/4, 363/2<\/td><\/tr>\n<tr><td>Ceza mahkûmiyeti<\/td><td>Kasten işlenen suçtan hapis cezası, infaz tamamlanıncaya kadar şirket yöneticiliğinden yoksun bırakır<\/td><td>TCK m.53/1-d<\/td><\/tr>\n<tr><td>Ek nitelikler<\/td><td>Esas sözleşme asgari koşul koyabilir; Bankacılık K. m.25/1, Sigortacılık K. m.4/2, KY İlkeleri 4.3.6 (bağımsız üye)<\/td><td>Özel mevzuat<\/td><\/tr>\n<\/table>\n<h4>Tüzel kişi üye<\/h4>\n<ul>\n<li>6102 sayılı TTK'nın yeniliği: tüzel kişi yönetim kurulu üyesi olabilir. Tüzel kişiyle birlikte, onun adına ve onun belirlediği <b>sadece bir gerçek kişi<\/b> tescil ve ilan edilir; tescil ve ilan şirketin internet sitesinde <b>hemen<\/b> açıklanır. Toplantılara katılıp oy kullanabilen yalnız bu tescilli kişidir (m.359/2).<\/li>\n<li>Kamu tüzel kişilerinin pay sahibi olduğu şirketlerde (6455 sayılı Kanunla eklenen fıkra): kamu tüzel kişileri veya gerçek kişi temsilcileri seçilebilir. Üye sayısı <b>2'den fazla<\/b> olan şirketlerde, üyelerin tamamı aynı kamu tüzel kişisinin temsilcisi olmamak şartıyla, bir kamu tüzel kişisini temsilen birden fazla gerçek kişi seçilebilir.<\/li>\n<\/ul>\n<h4>Üyeliğin kazanılması ve sona ermesi<\/h4>\n<ul>\n<li>Genel kurulca seçilen kişi üyeliği <b>kabul etmekle<\/b> üye olur. Kabul beyanı şekle tabi değildir ve şarta bağlanamaz. Üyelerin sicile tescili (m.354) <b>açıklayıcıdır<\/b>, kurucu değildir.<\/li>\n<li>Tüzel kişi adına tescil edilecek gerçek kişinin tescilinin kurucu olup olmadığı tartışmalıdır; madde gerekçesine dayanan görüş tescilin <b>kurucu<\/b> etkili olduğunu savunur. Bu görüşe göre tescil yapılmadan temsilci toplantıya katılıp oy kullanamaz.<\/li>\n<li>Sona erme halleri:\n<ul>\n<li><b>Sürenin dolması<\/b> (yeniden seçilme mümkün).<\/li>\n<li><b>Görevden alma<\/b> (m.364): esas sözleşmeyle atanmış olsalar bile, gündemde ilgili madde varsa veya gündemde madde olmasa da <b>haklı sebep<\/b> varsa genel kurul kararıyla her zaman. Görevden alma da genel kurulun devredilemez yetkisidir.<\/li>\n<li><b>İstifa<\/b>: bozucu yenilik doğurucu tek taraflı beyan; şirketin kabulüne bağlı değildir.<\/li>\n<li><b>Yeterliliklerin kaybı<\/b> (m.363/2): iflas, ehliyetin kısıtlanması, kanuni veya esas sözleşmedeki şartın kaybı üyeliği <b>kendiliğinden ve daimi<\/b> olarak; TCK m.53/1-d hâli <b>geçici<\/b> olarak sona erdirir.<\/li>\n<li>Şirketin iflası veya başka nedenle sona ermesi.<\/li>\n<\/ul><\/li>\n<li>Dikkat: Yönetim kurulu bir üyeyi <b>görevden alamaz<\/b>; görevden alma yetkisi genel kurula aittir.<\/li>\n<\/ul>\n<h4>Şirket ile üye arasındaki ilişki<\/h4>\n<p>Temelde bir sözleşme vardır: genel kurulun seçim kararı <b>icap<\/b>, görevin üstlenilmesi <b>kabul<\/b>dür. Taraflar hizmet, vekâlet veya karma (sui generis) sözleşme öngörebilir; özel belirleme yoksa öğretide hâkim görüş <b>vekâlet sözleşmesi<\/b> kabul edilmesi ve boşlukta TBK vekâlet hükümlerinin uygulanmasıdır.<\/p>\n\n<h3>Yönetim kurulunun görev ve yetkileri<\/h3>\n<ul>\n<li><b>Genel yetki karinesi yönetim kurulu lehinedir<\/b> (m.374/1): kanun ve esas sözleşmeyle gene
