r."}, {"q": "İmtiyazlı pay sahipleri özel kurulunun toplantı ve karar nisabı hangisidir?", "o": ["İmtiyazlı payları temsil eden sermayenin yüzde altmışı ile toplanır, temsil edilen payların çoğunluğuyla karar alır", "İmtiyazlı payları temsil eden sermayenin dörtte biri ile toplanır, oybirliğiyle karar alır", "İmtiyazlı payların yarısı ile toplanır, üçte iki çoğunlukla karar alır", "Nisap aranmaz, katılanların çoğunluğuyla karar alınır", "Tüm sermayenin yüzde yetmiş beşi ile toplanır ve karar alır"], "a": 0, "e": "m.454/3: yüzde altmış toplantı nisabı ve temsil edilen payların salt çoğunluğu."}, {"q": "Yönetim kurulu, imtiyazlı pay sahipleri özel kurulunu genel kurul kararının ilanından itibaren en geç ne kadar süre içinde toplantıya çağırmalıdır?", "o": ["7 gün", "15 gün", "45 gün", "1 ay", "3 ay"], "a": 3, "e": "En geç bir ay; çağırmazsa her imtiyazlı pay sahibi sürenin son gününden itibaren on beş gün içinde mahkemeden çağrı isteyebilir."}, {"q": "Aşağıdakilerden hangisi genel kurulu toplantıya çağırmaya yetkili değildir?", "o": ["Süresi dolmuş yönetim kurulu", "Şirketin tahvil sahipleri", "Görevleriyle ilgili konularda tasfiye memurları", "Mahkemenin izniyle tek bir pay sahibi", "Azlık"], "a": 1, "e": "Tahvil sahiplerinin çağrı yetkisi yoktur; yönetim kurulu süresi dolmuş olsa bile çağırabilir (m.410)."}, {"q": "Halka açık olmayan bir anonim şirkette azlık hakkını kullanabilmek için sermayenin en az ne kadarına sahip olmak gerekir?", "o": ["Yirmide bir", "Dörtte bir", "Üçte bir", "Yüzde iki", "Onda bir"], "a": 4, "e": "Halka açık olmayanda onda bir, halka açıkta yirmide bir; esas sözleşme daha düşük oran öngörebilir."}, {"q": "Esas sermayesi 80 milyon lira olan halka açık bir ortaklıkta genel kurulun toplantıya çağrılmasını isteyebilmek için en az ne kadar sermayeyi temsil eden pay sahiplerinin bir araya gelmesi gerekir?", "o": ["2 milyon lira", "8 milyon lira", "4 milyon lira", "16 milyon lira", "20 milyon lira"], "a": 2, "e": "Halka açık ortaklıkta azlık yirmide birdir: 80 / 20 = 4 milyon lira. 8 milyon lira halka açık olmayan şirketteki onda birlik eşiktir."}, {"q": "Azlığın genel kurulu toplantıya çağırma istemini yönetim kurulu kabul ederse genel kurul en geç ne kadar süre içinde yapılacak şekilde çağrılır?", "o": ["45 gün", "7 iş günü", "15 gün", "30 gün", "3 ay"], "a": 0, "e": "m.412: en geç kırk beş gün içinde yapılacak şekilde; aksi hâlde çağrıyı istem sahipleri yapar."}, {"q": "Azlığın çağrı istemine yönetim kurulu kaç gün içinde olumlu cevap vermezse azlık mahkemeye başvurabilir?", "o": ["3 iş günü", "10 gün", "30 gün", "7 iş günü", "45 gün"], "a": 3, "e": "Talep reddedilir veya yedi iş günü içinde olumlu cevap verilmezse asliye ticaret mahkemesi karar verir; mahkeme kayyım atayabilir ve kararı kesindir."}, {"q": "Halka açık olmayan bir anonim şirkette genel kurul çağrısı, ilan ve toplantı günleri hariç, toplantıdan en az ne kadar önce yapılır?", "o": ["Bir hafta", "İki hafta", "Üç hafta", "Bir ay", "Kırk beş gün"], "a": 1, "e": "TTK m.414: en az iki hafta önce, internet sitesi ve TTSG'de. Halka açık ortaklıklarda SerPK m.29/1 gereği üç hafta."}, {"q": "Aşağıdakilerden hangisi gündeme bağlılık ilkesinin istisnalarından biri değildir?", "o": ["Pay sahibinin özel denetim istemi", "Haklı sebeple yönetim kurulu üyelerinin görevden alınması", "Çağrısız genel kurulda gündeme oybirliğiyle madde eklenmesi", "Yönetim kurulu üyelerinin görevden alınmasının yılsonu finansal tablolar maddesiyle ilgili sayılması", "Esas sözleşmede imtiyazlı pay oluşturulması"], "a": 4, "e": "İmtiyazlı pay oluşturulması gündemde bulunmalıdır; diğerleri kanuni istisnalardır."}, {"q": "Genel kurulda karara bağlanmış bir gündem maddesinin yeniden görüşülebilmesi için hangisi gerekir?", "o": ["Hazır bulunanların çoğunluğu", "Sermayenin yarısının oyu", "Hazır bulunanların oybirliği", "Yönetim kurulunun teklifi", "Bakanlık temsilcisinin onayı"], "a": 2, "e": "Yönetmelik m.25/3: hazır bulunanların oybirliği olmadıkça yeniden görüşülemez. Görüşme sırasını değiştirmek için ise oy çokluğu yeterlidir."}, {"q": "Aşağıdaki genel kurul toplantılarından hangisinde Bakanlık temsilcisinin bulunması zorunlu değildir?", "o": ["Bakanlık iznine tabi olmayan şirketin yalnız finansal tabloları onaylayacağı olağan toplantı", "Gündeminde sermaye artırımı bulunan toplantı", "Gündeminde birleşme bulunan toplantı", "Yurt dışında yapılan toplantı", "Elektronik genel kurul uygulayan şirketin toplantısı"], "a": 0, "e": "Yönetmelik m.32'de sayılan haller dışında Bakanlık temsilcisi zorunlu değildir; ancak talep üzerine görevlendirilebilir."}, {"q": "Genel kurulda oy hakkına ilişkin hangisi yanlıştır?", "o": ["Oy hakkı payların itibari değeriyle orantılıdır", "Tek paya sahip olan pay sahibinin de en az bir oyu vardır", "Birden fazla paya sahip olanların oy sayısı esas sözleşmeyle sınırlandırılabilir", "Esas sözleşmede daha yüksek tutar yoksa oy hakkı için pay tutarının yarısının ödenmesi gerekir", "Oylama kural olarak açık ve el kaldırarak yapılır"], "a": 3, "e": "Esas sözleşmede daha yüksek tutar öngörülmemişse pay tutarının dörtte birinin ödenmesi yeterlidir."}, {"q": "Oyda imtiyaza ilişkin hangisi doğrudur?", "o": ["Bir paya en çok on oy hakkı tanınabilir", "Bir paya en çok on beş oy hakkı tanınabilir; haklı sebep veya kurumlaşma hâlinde mahkeme istisna tanıyabilir", "Oyda imtiyaz farklı itibari değerdeki paylara aynı oy verilerek tanınır", "Oyda imtiyaz ibra kararlarında da kullanılabilir", "Oyda imtiyaz yalnız halka açık ortaklıklarda tanınabilir"], "a": 1, "e": "m.479: eşit itibari değerdeki paylara farklı sayıda oy; üst sınır on beş; esas sözleşme değişikliği, ibra ve sorumluluk davası kararlarında kullanılamaz."}, {"q": "Halka açık olmayan bir şirkette 4 üyeli yönetim kurulu birikimli oyla seçilecektir. 1.500 oy hakkına sahip bir pay sahibi toplam kaç oyu tek bir adaya verebilir?", "o": ["1.500", "3.000", "4.500", "375", "6.000"], "a": 4, "e": "Birikimli oy sayısı oy sayısı ile seçilecek üye sayısının çarpımıdır: 1.500 x 4 = 6.000; tamamı tek adaya verilebilir."}, {"q": "Halka açık olmayan şirkette birikimli oy uygulanabilmesi için esas sözleşmeye ilişkin hangisi gerekli değildir?", "o": ["Birikimli oya ilişkin açık hüküm bulunması", "Oyda imtiyaz hükmü bulunmaması", "Şirketin paylarının borsada işlem görmesi", "Aday önerme veya grup temsili hükmü bulunmaması", "Yönetim kurulu üye sayısının en az üç olarak sabit belirlenmesi"], "a": 2, "e": "Tebliğ halka açık olmayan şirketler içindir; borsada işlem görme şartı yoktur. Diğer dört koşul Tebliğ m.5/1'de aranır."}, {"q": "Genel kurulda temsile ilişkin hangisi yanlıştır?", "o": ["Temsilcinin talimata aykırı kullandığı oy geçersizdir", "Temsilci pay sahibi olmayan biri olabilir", "Temsilcinin pay sahibi olmasını öngören esas sözleşme hükmü geçersizdir", "Temsil belgesi kural olarak yazılı olmalıdır", "Bir paya birden çok kişi ortak malikse ancak bir temsilci aracılığıyla oy kullanabilirler"], "a": 0, "e": "m.427/1: talimata aykırı hareket oyu geçersiz kılmaz; temsil edilenin temsilciye karşı hakları saklıdır."}, {"q": "Tevdi eden temsilcisi, zamanında istediği hâlde talimat alamamış ve tevdi edenin genel talimatı da yoksa oyunu nasıl kullanır?", "o": ["Çekimser kalır", "Oy kullanamaz", "Çoğunluğun yönünde", "Yönetim kurulunun önerileri yönünde", "Kendi takdirine göre"], "a": 3, "e": "m.429: önce genel talimat, o da yoksa yönetim kurulunun önerileri yönünde oy verilir."}, {"q": "Esas sermayesi 40 milyon lira olan halka açık olmayan bir şirkette, esas sözleşmede ağırlaştırıcı hüküm yoksa esas sözleşme değişikliği için yapılan ilk toplantıda en az ne kadar sermaye temsil edilmelidir?", "o": ["10 milyon lira", "20 milyon lira", "13,3 milyon lira", "30 milyon lira", "40 milyon lira"], "a": 1, "e": "m.421/1: ilk toplantıda sermayenin en az yarısı (20 milyon lira); ikinci toplantıda üçte biri (yaklaşık 13,3 milyon lira). 10 milyon lira adi toplantı nisabıdır."}, {"q": "Aşağıdaki kararlardan hangisi sermayenin tamamının oybirliğini gerektirir?", "o": ["İşletme konusunun tamamen değiştirilmesi", "İmtiyazlı pay oluşturulması", "Nama yazılı payların devrinin sınırlandırılması", "Sermaye artırımı", "Şirket merkezinin yurt dışına taşınması"], "a": 4, "e": "m.421/2: merkezin yurt dışına taşınması ve bilanço zararlarını kapatmak için yükümlülük getirilmesi oybirliği ister; işletme konusunun tamamen değiştirilmesi, imtiyazlı pay ve devir sınırlaması yüzde yetmiş beş ister."}, {"q": "Halka açık bir ortaklıkta sermaye azaltımı kararı için, esas sözleşmede daha ağır nisap yoksa ve toplantıda sermayenin yarısından azı hazırsa hangi nisap aranır?", "o": ["Sermayenin dörtte biriyle toplanır, çoğunlukla karar alır", "Sermayenin yüzde yetmiş beşinin olumlu oyu gerekir", "Toplantı nisabı aranmaz; katılan oy hakkı olan payların üçte ikisinin olumlu oyu gerekir", "Oybirliği gerekir", "Katılanların salt çoğunluğu yeterlidir"], "a": 2, "e": "SerPK m.29/6: nisap aranmaz ve katılanların üçte ikisi gerekir; sermayenin en az yarısı hazırsa katılanların çoğunluğu yeterlidir."}, {"q": "Genel kurul kararlarına karşı iptal davasına ilişkin hangisi yanlıştır?", "o": ["Denetçi de iptal davası açabilir", "Karar tarihinden itibaren üç ay içinde açılmalıdır", "Şirket merkezindeki asliye ticaret mahkemesinde açılır", "Kararın yerine getirilmesi kişisel sorumluluğunu doğuracaksa her yönetim kurulu üyesi dava açabilir", "Üç aylık süre dolmadan duruşmaya başlanamaz"], "a": 0, "e": "6102 sayılı TTK'da denetçinin iptal davası açma yetkisi yoktur (m.446)."}, {"q": "Genel kurul kararlarının butlanına (m.447) örnek olarak hangisi gösterilemez?", "o": ["Pay sahibinin asgari oy hakkını kaldıran karar", "Bilgi alma hakkını kanunun izin verdiği ölçü dışında sınırlayan karar", "Sermayenin korunması hükümlerine aykırı karar", "Dürüstlük kuralına aykırı olan ama temel yapıyı bozmayan karar", "Pay sahibinin dava hakkını kaldıran karar"], "a": 3, "e": "Dürüstlük kuralına aykırılık bir iptal sebebidir (m.445); diğerleri m.447'de sayılan butlan halleridir."}]}, {"id": 9, "kisa": "Bağımsız Denetim", "baslik": "Anonim Şirketlerin Denetimi: Denetime Tabi Şirketler, Denetçinin Nitelikleri, Seçimi, Raporu, Görüşü ve Sorumluluğu", "ozet": "Bağımsız denetimin gelişimi ve işlevleri, dürüst resim ilkesi, denetime tabi şirketlerin eşik değerleri, denetçi olamayacak kişiler, rotasyon, seçim ve mahkemece atama, görüş türleri ve sonuçları ile denetçinin sorumluluğu.", "notlar": "\n<h3>Denetimin düzenlenişi ve gelişimi<\/h3>\n<ul>\n<li>6102 sayılı TTK'nın ilk hâli: <b>tüm sermaye şirketleri<\/b> için bağımsız denetim ve UFRS uyumlu <b>Türkiye Muhasebe Standartlarına<\/b> (TMS) göre finansal tablo zorunluluğu.<\/li>\n<li><b>660 sayılı KHK<\/b>: bağımsız denetimle ilgili yetkiler en üst otorite olarak <b>Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu (KAMUDESK, KGK)<\/b>'nda toplandı.<\/li>\n<li><b>6335 sayılı Kanun<\/b>: TTK yürürlüğe girmeden hemen önce köklü değişiklik; tüm sermaye şirketlerinin denetimi anlayışı terk edildi; kuruluş, sermaye artırımı/azaltımı, birleşme, bölünme, tür değiştirme, menkul kıymet ihracını denetleyen <b>işlem denetçiliği tamamen kaldırıldı<\/b>.<\/li>\n<li>m.397/4: denetime tabi şirketleri önce Bakanlar Kurulu, <b>700 sayılı KHK<\/b> sonrası <b>Cumhurbaşkanı<\/b> belirler; yürürlükteki düzenleme <b>6434 sayılı Cumhurbaşkanı Kararı<\/b>dır.<\/li>\n<li><b>6455 sayılı Kanun (Nisan 2013)<\/b> ile m.397/5 eklendi: m.397/4 kapsamı dışında kalan anonim şirketler için ayrı bir denetim; usul ve esaslar Ticaret Bakanlığınca hazırlanıp Cumhurbaşkanlığınca çıkarılacak yönetmelikle belirlenir.<\/li>\n<li>TMS uygulaması: 6335 sonrası yalnız KAMUDESK'in belirlediği şirketlerde zorunludur (kamu yararını ilgilendiren kuruluşlar, bağımsız denetime tabi olanlar ve m.1534/2'deki şirketler; <b>01.01.2014<\/b> ve sonrası hesap dönemleri). Denetim dışındaki şirketler <b>VUK<\/b>'a göre (vergi odaklı) muhasebe tutar (m.64/5); TMS uygulamaları isteğe bağlıdır.<\/li>\n<li>Denetçi <b>organ değildir<\/b>; şirkete karşı <b>üçüncü kişi<\/b> konumundadır, aralarında yalnız sözleşme ilişkisi vardır. Anonim şirket denetimi <b>m.397–406<\/b>'da düzenlenmiştir.<\/li>\n<\/ul>\n\n<h3>Bağımsız denetimin tanımı, amacı ve işlevleri<\/h3>\n<ul>\n<li>Bağımsız (dış) denetim: denetlenen işletmeyle organik bağı olmayan, bağımsız ve tarafsız uzmanlarca, denetim ve güvence standartlarına göre yapılan ve sonucu bir raporla belirlenen sürekli denetim.<\/li>\n<li>660 sayılı KHK tanımı (m.2/1-b): finansal tablo ve diğer finansal bilgilerin finansal raporlama standartlarına uygunluğu ve doğruluğu hakkında <b>makul güvence<\/b> sağlayacak yeterli ve uygun kanıtın, denetim teknikleriyle defter, kayıt ve belgeler üzerinden elde edilip rapora bağlanması.<\/li>\n<li>Önemli unsurlar: TMS'ye uygunluğun <b>Türkiye Denetim Standartlarına<\/b> göre denetlenmesi, bir kamu gözetim otoritesinin varlığı, pay sahipleri ve menfaat sahiplerinin yararının öne alınması.<\/li>\n<li><b>Dürüst resim ilkesi<\/b> (m.515): finansal tablolar TMS'ye göre şirketin malvarlığını, borç ve yükümlülüklerini, özkaynaklarını ve faaliyet sonuçlarını tam, anlaşılabilir, karşılaştırılabilir, ihtiyaçlara uygun, şeffaf, güvenilir ve gerçeği dürüst, aynen ve aslına sadık biçimde yansıtacak şekilde çıkarılır.<\/li>\n<\/ul>\n<table>\n<tr><th>Etki alanı<\/th><th>İşlev<\/th><\/tr>\n<tr><td>Denetlenen şirket<\/td><td><b>Kontrol<\/b> (hata ve hilelerin tespiti, kredibilite artışı), <b>caydırıcılık<\/b> (çalışanların hile yapmaktan kaçınması)<\/td><\/tr>\n<tr><td>Üçüncü kişiler<\/td><td><b>Bilgilendirme<\/b>, <b>güvence oluşturma<\/b>, <b>ekonomik<\/b> işlev (sağlıklı ekonomik ilişkiler)<\/td><\/tr>\n<tr><td>Denetim kuruluşları<\/td><td><b>Önleyici<\/b> işlev (hukuki ve cezai sorumluluk zararı önler), <b>zararı tazmin<\/b> işlevi<\/td><\/tr>\n<\/table>\n\n<h3>Denetime tabi anonim şirketler<\/h3>\n<p>İki kategori vardır: (1) m.397/4 uyarınca Cumhurbaşkanı Kararıyla <b>KAMUDESK gözetiminde bağımsız denetime<\/b> tabi olanlar; (2) bu kapsam dışında kalıp m.397/5'e göre çıkarılacak yönetmelikle denetlenecek anonim şirketler.<\/p>\n<p><b>6434 sayılı Cumhurbaşkanı Kararı<\/b>na göre bağımsız denetime tabi olanlar: (a) herhangi bir ölçüte bakılmaksızın <b>(I) sayılı listedeki<\/b> şirketler; (b) aşağıdaki üç ölçütten <b>en az ikisinin<\/b> eşik değerlerini <b>art arda iki hesap döneminde<\/b> aşan diğer şirketler.<\/p>\n<table>\n<tr><th>Şirket grubu<\/th><th>Aktif toplamı<\/th><th>Yıllık net satış hasılatı<\/th><th>Çalışan sayısı<\/th><\/tr>\n<tr><td>Borsada işlem görmeyen ama SPKn kapsamında <b>halka açık sayılan<\/b> şirketler<\/td><td>30 milyon TL<\/td><td>40 milyon TL<\/td><td>50<\/td><\/tr>\n<tr><td><b>(II) sayılı listedeki<\/b> şirketler<\/td><td>120 milyon TL<\/td><td>150 milyon TL<\/td><td>100<\/td><\/tr>\n<tr><td>Diğer şirketler (06.04.2024 değişikliği)<\/td><td>300 milyon TL<\/td><td>600 milyon TL<\/td><td>150<\/td><\/tr>\n<\/table>\n<p><b>(I) sayılı liste<\/b> (ölçütsüz denetim) başlıca şunları kapsar:<\/p>\n<ul>\n<li>SPK'ya tabi: yatırım kuruluşları, kolektif yatırım kuruluşları, portföy yönetim şirketleri, ipotek finansmanı kuruluşları, varlık kiralama şirketleri, merkezi takas ve merkezi saklama kuruluşları, veri depolama kuruluşları, derecelendirme ve değerleme kuruluşları; sermaye piyasası araçları borsada veya teşkilatlanmış piyasada işlem gören veya bu amaçla onaylı geçerli izahname ya da ihraç belgesi bulunan anonim şirketler; halka arz edilmeksizin pay dışı sermaye piyasası aracı ihraç eden anonim şirketler (araçların itfa edildiği dönem sonuna kadar).<\/li>\n<li>BDDK'ya tabi: bankalar, derecelendirme kuruluşları, finansal holdingler, finansal kiralama, faktoring, finansman, varlık yönetim şirketleri, banka ve finansal holdinglerde nitelikli paya sahip şirketler, tasarruf finansman şirketleri.<\/li>\n<li>Sigorta, reasürans ve emeklilik şirketleri.<\/li>\n<li>Borsa İstanbul'da faaliyet izni olan yetkili müesseseler, kıymetli maden aracı kurumları, kıymetli maden üretimi veya ticareti yapanlar.<\/li>\n<li>Lisanslı depo işletmeleri ve umumi mağazalar.<\/li>\n<li>RTÜK'e tabi belirli medya hizmet sağlayıcılar (en az iki yayın hakkı veya lisansı olanlar; internetten isteğe bağlı yayın hakkı olanlar).<\/li>\n<li>2024'te eklenenler: bağımsız denetim yükümlülüğü bulunan <b>EPDK<\/b> lisanslı şirketler; <b>TCMB<\/b>'ye tabi ödeme ve elektronik para kuruluşları; <b>kamu iktisadi teşebbüsleri<\/b> ve bağlı ortaklıkları.<\/li>\n<\/ul>\n\n<h3>Denetçinin nitelikleri ve seçilme engelleri (m.400)<\/h3>\n<ul>\n<li>Denetçi: 3568 sayılı Kanuna göre ruhsatlı <b>yeminli mali müşavir<\/b> veya <b>serbest muhasebeci mali müşavir<\/b> unvanını taşıyan ve <b>KAMUDESK tarafından yetkilendirilen<\/b> kişiler ve/veya ortakları bu kişilerden oluşan <b>sermaye şirketi<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Denetçi olamayacak kişi (m.400/1)<\/th><\/tr>\n<tr><td>(a) Denetlenecek şirkette <b>pay sahibi<\/b> olan<\/td><\/tr>\n<tr><td>(b) Şirketin yöneticisi veya çalışanı olan ya da atanmadan önceki <b>üç yıl<\/b> içinde bu sıfatı taşımış olan<\/td><\/tr>\n<tr><td>(c) Şirketle bağlantılı bir tüzel kişinin, ticaret şirketinin veya ticari işletmenin temsilcisi, yönetim kurulu üyesi, yöneticisi veya sahibi olan ya da bunlarda <b>yüzde yirmiden fazla<\/b> paya sahip olan; şirketin yönetim kurulu üyesi veya yöneticisinin alt-üst soyu, eşi veya <b>üçüncü derece dahil<\/b> kan veya kayın hısmı olan<\/td><\/tr>\n<tr><td>(d) Şirketle bağlantılı veya şirkette yüzde yirmiden fazla paya sahip bir işletmede çalışan ya da şirkette yüzde yirmiden fazla paya sahip bir gerçek kişinin yanında hizmet veren<\/td><\/tr>\n<tr><td>(e) Şirketin <b>defterlerinin tutulmasında<\/b> veya finansal tablolarının düzenlenmesinde denetleme dışında faaliyette veya katkıda bulunmuş olan<\/td><\/tr>\n<tr><td>(f) (e) bendi nedeniyle denetçi olamayan kişinin temsilcisi, çalışanı, yönetim kurulu üyesi, ortağı veya sahibi olan<\/td><\/tr>\n<tr><td>(g) (a)–(f) nedeniyle denetçi olamayan bir denetçinin yanında çalışan<\/td><\/tr>\n<tr><td>(h) Son <b>beş yıl<\/b> içinde denetçilik mesleki gelirinin <b>yüzde otuzundan fazlasını<\/b> denetlenecek şirkete veya ona yüzde yirmiden fazla iştirak etmiş şirketlere verdiği denetim ve danışmanlıktan elde etmiş ve cari yılda da elde etmesi beklenen<\/td><\/tr>\n<\/table>\n<ul>\n<li>Bu engeller ilgili denetim şirketini, ortaklarını, ortaklarının yanında çalışanları ve mesleği birlikte yürüttükleri kişileri de kapsar.<\/li>\n<li><b>Zorunlu rotasyon<\/b> (m.400/2): <b>on yıl<\/b> içinde aynı şirket için toplam <b>yedi yıl<\/b> denetçi seçilen kişi, <b>üç yıl<\/b> geçmedikçe aynı şirkete yeniden seçilemez. KAMUDESK usul ve esasları belirlemeye ve bu <b>süreleri kısaltmaya<\/b> yetkilidir.<\/li>\n<li><b>Danışmanlık yasağı<\/b> (m.400/3): denetçi denetlediği şirkete <b>vergi danışmanlığı ve vergi denetimi dışında<\/b> danışmanlık veya hizmet veremez; bunu yavru şirketi aracılığıyla da yapamaz.<\/li>\n<\/ul>\n\n<h3>Denetçinin seçilmesi (m.399)<\/h3>\n<ul>\n<li>Kural: denetçiyi <b>genel kurul<\/b> seçer; seçim ve görevden alma (kanuni istisnalar dışında) genel kurulun <b>devredilemez<\/b> yetkisidir. Şirketler topluluğunda topluluk denetçisini <b>ana şirketin genel kurulu<\/b> belirler.<\/li>\n<li>Denetçi <b>her faaliyet dönemi için<\/b> ve her hâlde görev yapacağı faaliyet dönemi bitmeden seçilmelidir. Yönetim kurulu, seçimi gecikmeksizin <b>tescil ettirir<\/b>, TTSG'de ve internet sitesinde <b>ilan eder<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>İstisna<\/th><th>Koşul<\/th><\/tr>\n<tr><td><b>Mahkemenin başka denetçi ataması<\/b> (m.399/4)<\/td><td>Yönetim kurulunun veya halka açık olmayanda sermayenin <b>yüzde onunu<\/b>, halka açıkta esas veya çıkarılmış sermayenin <b>yüzde beşini<\/b> oluşturan pay sahiplerinin istemiyle; seçilen denetçinin şahsına ilişkin <b>haklı sebep<\/b>, özellikle <b>taraflılık kuşkusu<\/b> varsa; şirket merkezindeki asliye ticaret mahkemesi ilgilileri ve denetçiyi dinleyerek karar verir<\/td><\/tr>\n<tr><td><b>Denetçi seçilememesi<\/b> (m.399/6)<\/td><td>Faaliyet döneminin <b>dördüncü ayına kadar<\/b> denetçi seçilmemişse, <b>yönetim kurulunun, her yönetim kurulu üyesinin veya herhangi bir pay sahibinin<\/b> istemiyle asliye ticaret mahkemesi atar. Denetçinin görevi reddetmesi, sözleşmeyi feshetmesi, atamanın iptali veya butlanı, görevini yapamaması veya engellenmesi hallerinde de aynı yol<\/td><\/tr>\n<tr><td><b>TMSF kayyımlığındaki şirketler<\/b> (691 sayılı KHK)<\/td><td>Dördüncü aya kadar denetçi seçilmemişse yönetim kurulunun teklifiyle TMSF'nin ilişkili olduğu <b>Bakan<\/b> atar; bu yetki Fon Kuruluna devredilebilir<\/td><\/tr>\n<tr><td><b>Yönetim kurulunun geçici denetçi seçmesi<\/b><\/td><td>Denetçi fesih ihbarında bulunursa yönetim kurulu hemen geçici denetçi seçer; fesih ihbarını genel kurulun bilgisine, seçtiği denetçiyi onayına sunar<\/td><\/tr>\n<\/table>\n\n<h3>Denetimin konusu (m.398)<\/h3>\n<ul>\n<li>Şirketin ve topluluğun <b>finansal tabloları<\/b> ile yönetim kurulunun <b>yıllık faaliyet raporu<\/b>; envanter, muhasebe ve Türkiye Denetim Standartlarının öngördüğü ölçüde <b>iç denetim<\/b>; m.378 uyarınca verilen <b>riskin erken saptanması raporları<\/b>.<\/li>\n<li>TMS'ye, kanuna ve esas sözleşmenin finansal tablolara ilişkin hükümlerine uyulup uyulmadığını da kapsar.<\/li>\n<li>KAMUDESK'in belirlediği esaslar çerçevesinde meslek etiğine uygun ve özenle yapılır.<\/li>\n<li>Amaç: malvarlıksal ve finansal durumun m.515'teki <b>dürüst resim ilkesine<\/b> uygun yansıtılıp yansıtılmadığını, yansıtılmamışsa sebeplerini dürüstçe ortaya koymak.<\/li>\n<\/ul>\n\n<h3>Denetim raporu (m.402)<\/h3>\n<ul>\n<li>Denetimin türü, kapsamı, niteliği ve sonuçları hakkında açık, anlaşılır, basit dille ve <b>geçmiş yılla karşılaştırmalı<\/b> olarak finansal tablolara ilişkin rapor düzenlenir.<\/li>\n<li><b>Ayrı bir raporda<\/b>, yıllık faaliyet raporundaki değerlendirmeler finansal tablolarla <b>tutarlılık<\/b> ve <b>gerçeğe uygunluk<\/b> açısından değerlendirilir.<\/li>\n<li>Raporda önce yönetim kurulunun finansal duruma ilişkin değerlendirmesi hakkında görüş açıklanır. Esas bölümde defter tutma düzeninin ve finansal tabloların kanun ve esas sözleşmeye uygunluğu ve yönetim kurulunun istenen açıklama ve belgeleri verip vermediği açıkça belirtilir; hesap planına uygunluk ve dürüst resim de belirtilir.<\/li>\n<li>m.398/4 uyarınca bir değerlendirme (riskin erken saptanması sistemi) yapılmışsa sonucu <b>ayrı bir raporda<\/b> gösterilir.<\/li>\n<li>Denetçi raporu <b>imzalar<\/b> ve <b>yönetim kuruluna<\/b> sunar.<\/li>\n<\/ul>\n\n<h3>Görüş yazısı ve hukuki sonuçları (m.403)<\/h3>\n<table>\n<tr><th>Görüş<\/th><th>Ne zaman?<\/th><th>Sonuç<\/th><\/tr>\n<tr><td><b>Olumlu<\/b><\/td><td>TMS ve diğer gerekliliklere aykırılık yok; tablolar doğru ve gerçeği dürüstçe yansıtıyor<\/td><td>Olağan süreç<\/td><\/tr>\n<tr><td><b>Sınırlı olumlu<\/b><\/td><td>Tablolarda yetkili kurullarca <b>düzeltilebilecek<\/b> ve sonuca etkisi kapsamlı ve büyük olmayan aykırılıklar var; sınırlamanın konusu, kapsamı ve düzeltme yolu yazıda gösterilir<\/td><td>Genel kurul gerekli <b>önlem ve düzeltmeleri<\/b> karara bağlar<\/td><\/tr>\n<tr><td><b>Olumsuz<\/b><\/td><td>Çekincelerin ağırlığına göre<\/td><td>Yönetim kurulu, görüş yazısının tesliminden itibaren <b>dört iş günü<\/b> içinde genel kurulu çağırır; genel kurul <b>yeni yönetim kurulu<\/b> seçer (esas sözleşmede aksi yoksa eski üyeler yeniden seçilebilir). Yeni kurul <b>altı ay<\/b> içinde uygun finansal tabloları hazırlatıp denetim raporuyla genel kurula sunar<\/td><\/tr>\n<tr><td><b>Görüş vermekten kaçınma<\/b><\/td><td>Defterlerde denetime imkân vermeyen ölçüde belirsizlik veya önemli kısıtlamalar; denetçi ispat edecek delile sahip olmasa da gerekçesini açıklar<\/td><td><b>Olumsuz görüşün sonuçlarını<\/b> doğurur<\/td><\/tr>\n<\/table>\n<ul>\n<li>Görüş yazısı KAMUDESK esaslarına göre ve herkesin anlayacağı dille yazılır; yönetim kurulunun finansal tablolarla ilgili sorumluluğunu gerektiren bir sebep olup olmadığına işaret edilir.<\/li>\n<li>m.397/2: denetime tabi şirketler finansal tablolarının denetimden geçip geçmediğini ve denetçi görüşünü tablonun <b>başlığında<\/b> açıkça belirtir; yıllık faaliyet raporu için de geçerlidir.<\/li>\n<\/ul>\n\n<h3>Denetçinin sorumluluğu ve bilgi alma hakkı<\/h3>\n<ul>\n<li>m.554 (6335 ile değişik): şirketin ve topluluğun yılsonu ve konsolide finansal tablolarını denetleyen <b>denetçi ve özel denetçiler<\/b>, kanuni görevlerinde <b>kusurlu<\/b> davranırlarsa şirkete, pay sahiplerine ve alacaklılara verdikleri zarardan sorumludur. <b>Kusur sorumluluğudur<\/b>.<\/li>\n<li><b>Sır saklama<\/b> sorumluluğu m.404'te özel olarak düzenlenmiştir; bu kapsamdaki hallerde m.554 uygulanmaz.<\/li>\n<li><b>Bilgi alma hakkı<\/b> (m.401): yönetim kurulu finansal tabloları ve yıllık faaliyet raporunu düzenletip onaylayarak <b>gecikmeksizin<\/b> denetçiye verir; defter, yazışma, belge, varlık, borç, kasa, kıymetli evrak ve envanterin incelenmesi için imkân sağlar. Denetçi gerekli tüm bilgi ve belgeleri ister; yılsonu hazırlığı için tablolar çıkarılmadan <b>önce<\/b> de isteyebilir; gerekirse bu yetkiyi <b>ana ve yavru şirketler<\/b> için de kullanır.<\/li>\n<li>m.401/4 (696 sayılı KHK, 7079 sayılı Kanun): terör örgütleriyle irtibat nedeniyle CMK m.133 uyarınca <b>kayyım atanan<\/b> şirketlerde, kayyımın ilk atandığı mali yıl ve öncesine ait işlemler için onay yükümlülüğü yoktur.<\/li>\n<\/ul>\n", "sorular": [{"q": "6335 sayılı Kanunla yapılan değişikliklerle ilgili hangisi doğrudur?", "o": ["Tüm sermaye şirketleri bağımsız denetime tabi tutuldu", "İşlem denetçiliği sistemi tamamen kaldırıldı", "KAMUDESK kaldırıldı", "Denetçi yeniden zorunlu organ hâline getirildi", "Denetime tabi şirketleri SPK belirlemeye başladı"], "a": 1, "e": "6335 sayılı Kanunla kuruluş, sermaye işlemleri, birleşme gibi işlemleri denetleyen işlem denetçiliği tamamen kaldırıldı ve tüm sermaye şirketlerinin denetimi anlayışından vazgeçildi."}, {"q": "Bağımsız denetime tabi olacak şirketleri belirleme yetkisi 700 sayılı KHK sonrasında kime aittir?", "o": ["Sermaye Piyasası Kurulu", "Ticaret Bakanlığı", "KAMUDESK", "Türkiye Odalar ve Borsalar Birliği", "Cumhurbaşkanı"], "a": 4, "e": "m.397/4'teki yetki önce Bakanlar Kurulundaydı; 700 sayılı KHK ile Cumhurbaşkanına geçti ve 6434 sayılı Cumhurbaşkanı Kararı çıkarıldı."}, {"q": "Denetçinin hukuki konumuna ilişkin hangisi doğrudur?", "o": ["Şirketin zorunlu organıdır", "Şirketin ihtiyari organıdır", "Şirkete karşı üçüncü kişi konumundadır ve aralarında sözleşme ilişkisi vardır", "Yönetim kurulunun bir alt komitesidir", "Genel kurulun temsilcisidir"], "a": 2, "e": "6102 sayılı TTK denetçiye organ işlevi veren görevleri tanımamış; bağımsızlık ve tarafsızlığı öne çıkarmıştır."}, {"q": "Aşağıdakilerden hangisi bağımsız denetimin denetim kuruluşları üzerindeki etkisinden doğan bir işlevdir?", "o": ["Önleyici işlev", "Caydırıcılık işlevi", "Bilgilendirme işlevi", "Ekonomik işlev", "Kontrol işlevi"], "a": 0, "e": "Denetim kuruluşlarının hukuki ve cezai sorumluluğu zararın oluşmasını engeller (önleyici) ve zararın giderilmesini sağlar (tazmin). Kontrol ve caydırıcılık şirkete, bilgilendirme ve ekonomik işlev üçüncü kişilere yöneliktir."}, {"q": "6434 sayılı Karara göre listede yer almayan bir şirketin bağımsız denetime tabi olması için eşik değerlerle ilgili hangi koşul aranır?", "o": ["Üç ölçütün tamamının bir hesap döneminde aşılması", "Üç ölçütten en az birinin iki dönem aşılması", "Üç ölçütten en az ikisinin herhangi bir dönemde aşılması", "Üç ölçütten en az ikisinin art arda iki hesap döneminde aşılması", "Yalnız aktif toplamının aşılması"], "a": 3, "e": "Karar m.1/1-b: üç ölçütten en az ikisinin eşik değerleri art arda iki hesap döneminde aşılmalıdır."}, {"q": "Listelerde yer almayan ve halka açık sayılmayan diğer şirketler için 2024 değişikliğiyle belirlenen eşik değerler hangisidir?", "o": ["30 milyon TL aktif, 40 milyon TL satış, 50 çalışan", "300 milyon TL aktif, 600 milyon TL satış, 150 çalışan", "120 milyon TL aktif, 150 milyon TL satış, 100 çalışan", "150 milyon TL aktif, 300 milyon TL satış, 200 çalışan", "500 milyon TL aktif, 1 milyar TL satış, 250 çalışan"], "a": 1, "e": "06.04.2024 değişikliğiyle diğer şirketler için 300 milyon TL aktif, 600 milyon TL net satış ve 150 çalışan. 30/40/50 halka açık sayılanlar, 120/150/100 (II) sayılı liste içindir."}, {"q": "Borsada işlem görmeyen ancak halka açık sayılan bir şirketin iki yıl üst üste aktif toplamı 35 milyon TL, net satışı 32 milyon TL ve çalışan sayısı 60 olmuştur. Bu şirketin durumu nedir?", "o": ["Hiçbir ölçütü aşmadığından denetime tabi değildir", "Yalnız bir ölçütü aştığından denetime tabi değildir", "Üç ölçütün tamamını aşmadığından denetime tabi değildir", "Ancak SPK karar verirse denetime tabidir", "İki ölçütü art arda iki dönem aştığından bağımsız denetime tabidir"], "a": 4, "e": "Eşikler 30 milyon TL aktif, 40 milyon TL satış, 50 çalışandır. Aktif (35 milyon, eşik 30 milyon) ve çalışan (60, eşik 50) eşiği iki dönem aşılmış; satış (32 milyon, eşik 40 milyon) aşılmamıştır. Üçten ikisi yeterli olduğundan şirket denetime tabidir."}, {"q": "Aşağıdakilerden hangisi 6434 sayılı Karardaki (I) sayılı listede yer alan, ölçütten bağımsız olarak denetime tabi şirketlerden biri değildir?", "o": ["Portföy yönetim şirketleri", "Faktoring şirketleri", "Tüm limited şirketler", "Sigorta şirketleri", "Lisanslı depo işletmeleri"], "a": 2, "e": "Limited şirketler toptan listede değildir; diğerleri (I) sayılı listede sayılır."}, {"q": "TTK m.400'e göre denetçi olabilecek kişiler hangisidir?", "o": ["KAMUDESK tarafından yetkilendirilen yeminli mali müşavir veya serbest muhasebeci mali müşavirler ve ortakları bunlardan oluşan sermaye şirketleri", "Yalnız yeminli mali müşavirler", "Tüm avukatlar ve mali müşavirler", "SPK lisansı bulunan herkes", "Ticaret Bakanlığınca atanan müfettişler"], "a": 0, "e": "m.400/1: 3568 sayılı Kanuna göre ruhsatlı YMM veya SMMM olup KAMUDESK'çe yetkilendirilen kişiler ve/veya ortakları bu kişilerden oluşan sermaye şirketleri."}, {"q": "Atanmasından önceki kaç yıl içinde denetlenecek şirketin yöneticisi veya çalışanı olan kişi denetçi olamaz?", "o": ["1 yıl", "2 yıl", "5 yıl", "3 yıl", "10 yıl"], "a": 3, "e": "m.400/1-b: atanmadan önceki üç yıl içinde yönetici veya çalışan sıfatını taşımış olan denetçi olamaz."}, {"q": "Bir denetçi son beş yılda denetçilik mesleki gelirinin tamamı olan 10 milyon TL'nin ne kadarından fazlasını tek bir müşteri şirketten elde etmişse (ve cari yılda da elde etmesi bekleniyorsa) o şirkette denetçi olamaz?", "o": ["1 milyon TL", "3 milyon TL", "2 milyon TL", "5 milyon TL", "2,5 milyon TL"], "a": 1, "e": "m.400/1-h: gelirin yüzde otuzundan fazlası; 10 milyon x 0,30 = 3 milyon TL."}, {"q": "TTK m.400/2'deki zorunlu rotasyon kuralı hangisidir?", "o": ["Beş yıl içinde toplam üç yıl denetçi olan, iki yıl geçmedikçe seçilemez", "On yıl içinde toplam beş yıl denetçi olan, beş yıl geçmedikçe seçilemez", "Yedi yıl üst üste denetçi olan bir daha seçilemez", "Üç yıl üst üste denetçi olan bir yıl ara verir", "On yıl içinde toplam yedi yıl denetçi olan, üç yıl geçmedikçe aynı şirkete seçilemez"], "a": 4, "e": "On yıl içinde toplam yedi yıl, ardından üç yıl bekleme; KAMUDESK bu süreleri kısaltabilir."}, {"q": "Denetçinin denetlediği şirkete verebileceği hizmetlerle ilgili hangisi doğrudur?", "o": ["Her türlü danışmanlık verebilir", "Yalnız hukuki danışmanlık verebilir", "Vergi danışmanlığı ve vergi denetimi dışında danışmanlık veya hizmet veremez", "Danışmanlığı yavru şirketi aracılığıyla verebilir", "Defter tutma hizmeti verebilir"], "a": 2, "e": "m.400/3: vergi danışmanlığı ve vergi denetimi dışında danışmanlık veya hizmet yasaktır; yavru şirket aracılığıyla da yapılamaz."}, {"q": "Denetçinin seçimine ilişkin hangisi yanlıştır?", "o": ["Denetçi en az beş faaliyet dönemi için seçilmek zorundadır", "Kural olarak genel kurul seçer", "Şirketler topluluğunda topluluk denetçisini ana şirketin genel kurulu belirler", "Denetçi görev yapacağı faaliyet dönemi bitmeden seçilmelidir", "Seçim sonrası yönetim kurulu denetçiyi tescil ve ilan ettirir"], "a": 0, "e": "Denetçi her faaliyet dönemi için seçilir; beş yıllık zorunlu seçim süresi yoktur."}, {"q": "Halka açık bir şirkette seçilmiş denetçinin taraflı davrandığı kuşkusuyla mahkemeden başka denetçi atanmasını isteyebilmek için pay sahiplerinin en az hangi oranda sermayeyi temsil etmesi gerekir?", "o": ["Yüzde bir", "Yüzde on", "Yüzde yirmi", "Yüzde beş", "Yüzde yirmi beş"], "a": 3, "e": "m.399/4: halka açık olmayanda yüzde on, halka açıkta esas veya çıkarılmış sermayenin yüzde beşi; yönetim kurulu da isteyebilir."}, {"q": "Faaliyet döneminin hangi ayına kadar denetçi seçilmemişse mahkeme denetçi atar?", "o": ["İkinci ay", "Dördüncü ay", "Üçüncü ay", "Altıncı ay", "Dokuzuncu ay"], "a": 1, "e": "m.399/6: dördüncü aya kadar seçilmemişse yönetim kurulu, herhangi bir yönetim kurulu üyesi veya herhangi bir pay sahibinin istemiyle asliye ticaret mahkemesi atar."}, {"q": "Denetçi fesih ihbarında bulunursa ne olur?", "o": ["Şirket denetimsiz kalır", "Ticaret Bakanlığı yeni denetçi atar", "KAMUDESK yeni denetçi atar", "Fesih ihbarı genel kurul onayına kadar hüküm doğurmaz", "Yönetim kurulu hemen geçici bir denetçi seçer ve genel kurulun onayına sunar"], "a": 4, "e": "Yönetim kurulu geçici denetçi seçer, fesih ihbarını genel kurulun bilgisine, seçtiği denetçiyi onayına sunar; bu, genel kurulun seçim yetkisine bir istisnadır."}, {"q": "Aşağıdakilerden hangisi TTK m.398'e göre denetimin konusu arasında sayılmaz?", "o": ["Şirketin finansal tabloları", "Yönetim kurulunun yıllık faaliyet raporu", "Yönetim kurulu üyelerinin ücretlerinin yerindeliği", "Riskin erken saptanması komitesi raporları", "Türkiye Denetim Standartlarının öngördüğü ölçüde iç denetim"], "a": 2, "e": "Ücretlerin yerindeliği denetim konusu değildir; diğerleri m.398'de sayılır."}, {"q": "Denetçi olumsuz görüş verdiğinde yönetim kurulu genel kurulu ne zaman toplantıya çağırmalıdır?", "o": ["Görüş yazısının tesliminden itibaren 4 iş günü içinde", "15 gün içinde", "30 gün içinde", "Bir sonraki olağan genel kurulda", "Altı ay içinde"], "a": 0, "e": "m.403: dört iş günü içinde çağrı; genel kurul yeni yönetim kurulu seçer ve yeni kurul altı ay içinde uygun tabloları hazırlatıp sunar."}, {"q": "Olumsuz görüş sonrası seçilen yeni yönetim kurulu, kanuna ve standartlara uygun finansal tabloları hangi sürede hazırlatıp genel kurula sunmalıdır?", "o": ["Bir ay", "Üç ay", "Bir yıl", "Altı ay", "Dört iş günü"], "a": 3, "e": "Yeni yönetim kurulu altı ay içinde uygun tabloları hazırlatır ve denetim raporuyla birlikte genel kurula sunar."}, {"q": "Görüş vermekten kaçınmaya ilişkin hangisi doğrudur?", "o": ["Sınırlı olumlu görüşün sonuçlarını doğurur", "Olumsuz görüşün sonuçlarını doğurur", "Hiçbir hukuki sonuç doğurmaz", "Denetçi ancak kesin delile sahipse kaçınabilir", "Yalnız halka açık şirketlerde mümkündür"], "a": 1, "e": "Belirsizlik veya önemli kısıtlamalarda denetçi delil olmasa da gerekçeyle görüş vermekten kaçınabilir; bu, olumsuz görüşün sonuçlarını doğurur."}, {"q": "Sınırlı olumlu görüş hangi durumda verilir?", "o": ["Tablolarda düzeltilemeyecek ağır aykırılıklar varsa", "Denetime önemli kısıtlamalar getirildiyse", "Hiçbir aykırılık yoksa", "Şirket borca batıksa", "Tablolarda yetkili kurullarca düzeltilebilecek ve sonuca etkisi kapsamlı ve büyük olmayan aykırılıklar varsa"], "a": 4, "e": "Sınırlı olumlu görüşte sınırlamanın konusu, kapsamı ve düzeltme yolu gösterilir; genel kurul gerekli önlem ve düzeltmeleri karara bağlar."}, {"q": "Denetçinin hukuki sorumluluğuna ilişkin hangisi doğrudur?", "o": ["Kusursuz sorumluluktur", "Yalnız şirkete karşı sorumludur", "Kusur sorumluluğudur; şirkete, pay sahiplerine ve alacaklılara karşıdır", "Sır saklama ihlallerinde de m.554 uygulanır", "Denetçi hiçbir koşulda sorumlu tutulamaz"], "a": 2, "e": "m.554 kusur sorumluluğu esasını benimser; sır saklama sorumluluğu m.404'te özel olarak düzenlendiğinden orada m.554 uygulanmaz."}, {"q": "Denetçinin bilgi alma hakkına (m.401) ilişkin hangisi yanlıştır?", "o": ["Denetçi ancak genel kurul izniyle bilgi isteyebilir", "Denetçi gerekli tüm bilgi ve belgeleri yönetim kurulundan isteyebilir", "Yılsonu denetimi hazırlığı için tablolar çıkarılmadan önce de bilgi isteyebilir", "Gerekirse bu yetkiyi ana ve yavru şirketler için de kullanabilir", "Yönetim kurulu kasa ve envanterin incelenmesi için imkân sağlamak zorundadır"], "a": 0, "e": "Denetçinin bilgi alma hakkı kanundan doğar; genel kurul izni gerekmez."}]}, {"id": 10, "kisa": "Esas Sözleşme ve Sermaye", "baslik": "Esas Sözleşme Değişiklikleri: Genel Usul, Sermaye Artırımı ve Sermaye Azaltımı", "ozet": "Esas sözleşme değişikliğinde yetkili organ ve aşamalar, Bakanlık izni ve SPK uygun görüşü, iç ve dış kaynaklı artırım, esas, kayıtlı ve şarta bağlı sermaye artırımı ile sermaye azaltımının şartları, nisabı ve alacaklıların korunması.", "notlar": "\n<h3>Esas sözleşme değişikliği: genel esaslar<\/h3>\n<ul>\n<li>Düzenleme: genel hükümler <b>TTK m.452–455<\/b>; sermaye artırımı ve azaltımı <b>m.456–475<\/b>. Ayrıca m.333, Ticaret Bakanlığının ikincil düzenlemeleri ve halka açık şirketler için sermaye piyasası mevzuatı.<\/li>\n<li><b>Yetkili organ genel kuruldur<\/b> ve bu yetki başka organa veya kişiye <b>devredilemez<\/b> (m.408/2-a).<\/li>\n<li><b>Yetkinin sınırı<\/b> (m.452): genel kurul, esas sözleşmede aksine hüküm yoksa ve kanuni şartlara uyarak esas sözleşmenin <b>bütün hükümlerini<\/b> değiştirebilir; <b>müktesep ve vazgeçilmez haklar saklıdır<\/b>.<\/li>\n<\/ul>\n<h4>Aşamalar<\/h4>\n<ol>\n<li>Yönetim kurulunun <b>değişiklik teklifini (taslağını)<\/b> hazırlaması.<\/li>\n<li>m.333 kapsamındaki şirketlerde <b>Ticaret Bakanlığı izni<\/b>.<\/li>\n<li><b>Genel kurul kararı<\/b> (m.421 nisapları).<\/li>\n<li>Karar esas sözleşme değişikliğine veya yönetim kuruluna sermaye artırımı yetkisi verilmesine ilişkin ve imtiyazlı pay sahiplerinin haklarını ihlal ediyorsa <b>imtiyazlı pay sahipleri özel kurulunun onayı<\/b> (m.454).<\/li>\n<li>Ticaret siciline <b>tescil ve ilan<\/b> (m.455).<\/li>\n<\/ol>\n<h4>Bakanlık izni ve SPK uygun görüşü<\/h4>\n<ul>\n<li>m.333: Bakanlıkça tebliğle faaliyet alanları belirlenip ilan edilen anonim şirketler <b>Bakanlık izniyle kurulur<\/b>; esas sözleşme değişiklikleri de aynı izne bağlıdır. Bakanlık incelemesi yalnız <b>kanunun emredici hükümlerine aykırılık<\/b> yönünden yapılır. Bunun dışında hiçbir anonim şirketin kuruluşu ve esas sözleşme değişikliği herhangi bir makamın iznine bağlanamaz.<\/li>\n<li>İlgili düzenleme: \"Anonim ve Limited Şirketlerin Sermayelerini Yeni Asgari Tutarlara Yükseltmelerine ve Kuruluşu ve Esas Sözleşme Değişikliği İzne Tabi Anonim Şirketlerin Belirlenmesine İlişkin Tebliğ\".<\/li>\n<li>TTK, önceki özel kanunlardaki izin yetkilerini kaldırma iradesini açıkça göstermiştir; özel kanunlardaki \"uygun görüş\" yetkilerinin durumu öğretide tartışmalıdır.<\/li>\n<li>6362 sayılı SPKn <b>30.12.2012<\/b>'de yürürlüğe girdiğinden TTK'ya göre <b>sonraki tarihli özel kanundur<\/b>. Bu nedenle m.333, SPK'nın şu yetkilerine engel değildir: halka açık ortaklıkların kayıtlı sermaye sistemine geçişte <b>SPK izni<\/b> (SPKn m.18/1) ve esas sözleşme değişikliğinde <b>SPK uygun görüşü<\/b> (SPKn m.33/2).<\/li>\n<li>Bakanlık iznine tabi şirkette izin alınmamışsa gündemdeki esas sözleşme değişikliği genel kurulda <b>görüşülemez<\/b> (Genel Kurul Yönetmeliği m.27/2).<\/li>\n<li>Karar, yönetim kurulunca şirket merkezinin ve şubelerinin bulunduğu yer ticaret siciline <b>tescil<\/b> edilir, ilana bağlı hususlar ilan edilir ve <b>internet sitesine<\/b> konur. Değişiklik üçüncü kişilere karşı <b>tescilden önce hüküm doğurmaz<\/b>.<\/li>\n<\/ul>\n\n<h3>Sermaye artırımı<\/h3>\n<ul>\n<li><b>Esas sermaye<\/b>: pay sahiplerinin getirmeyi taahhüt ettikleri malvarlığı toplamının nakit ifadesi. Özellikleri: önceden <b>belirlenmiş ve sabit<\/b>, <b>nakitle ifade edilmiş<\/b>, <b>itibari değerli paylara bölünmüş<\/b>, <b>tamamen taahhüt edilmiş<\/b>.<\/li>\n<li>Sermaye artırımı bilançodaki <b>esas sermaye<\/b> kaleminin, kayıtlı sermaye sisteminde ise <b>çıkarılmış sermaye<\/b> kaleminin yükseltilmesidir.<\/li>\n<\/ul>\n<h4>Kaynağına göre<\/h4>\n<table>\n<tr><th>Tür<\/th><th>Kaynak<\/th><th>Not<\/th><\/tr>\n<tr><td><b>İç kaynaklardan<\/b> (m.462)<\/td><td>Esas sözleşme veya genel kurul kararıyla ayrılmış ve belirli amaca özgülenmemiş yedek akçeler, kanuni yedek akçelerin serbestçe kullanılabilen kısımları, mevzuatın bilançoya konulmasına ve sermayeye eklenmesine izin verdiği fonlar<\/td><td>Sayım sınırlı değildir; pay sahiplerine <b>bedelsiz pay<\/b> verilir<\/td><\/tr>\n<tr><td><b>Dış kaynaklardan<\/b><\/td><td>Dışarıdan <b>nakdi veya ayni<\/b> olarak getirilen değerler<\/td><td>Taahhüt yoluyla artırım<\/td><\/tr>\n<\/table>\n<ul>\n<li>m.462/3: bilançoda sermayeye eklenebilecek fonlar varsa, bunlar <b>sermayeye dönüştürülmeden<\/b> taahhüt yoluyla artırım yapılamaz. Hem fonların dönüştürülmesi hem de <b>aynı zamanda ve aynı oranda<\/b> taahhüt yoluyla artırım yapılabilir. Yani dış kaynaktan eklenen tutar kural olarak iç kaynaktan ekleneni <b>aşamaz<\/b>.<\/li>\n<li>Ticaret Bakanlığının <b>23.01.2013 tarihli ve 548 sayılı Genelgesi<\/b>: iç kaynakları aşan ölçüde eşzamanlı dış kaynaklı artırım için bütün pay sahiplerinin hazır olduğu veya temsil edildiği genel kurulda <b>oybirliği<\/b> aranır.<\/li>\n<\/ul>\n<h4>Sermaye sistemine göre<\/h4>\n<table>\n<tr><th>Sistem<\/th><th>Artırım kararı<\/th><th>Süreç<\/th><\/tr>\n<tr><td><b>Esas sermaye<\/b><\/td><td><b>Genel kurul<\/b> (m.453/1, 456/2); esas sözleşme değişikliği olduğundan m.421 nisapları<\/td><td>Yönetim kurulu taslağı → varsa Bakanlık izni → genel kurul kararı → gerekiyorsa imtiyazlı pay sahipleri özel kurulu onayı → yeni pay alma haklarının kullandırılması ve satış → m.457'deki <b>yönetim kurulu beyanı<\/b> ile tescil ve ilan<\/td><\/tr>\n<tr><td><b>Kayıtlı sermaye<\/b><\/td><td>Esas sözleşmedeki <b>tavana kadar<\/b> <b>yönetim kurulu<\/b>; esas sözleşme değişikliği gerekmez<\/td><td>Daha basit, kısa ve az riskli. Halka açıkta <b>SPKn ve II-18.1 Tebliği<\/b> (geçişte SPK izni), halka açık olmayanda TTK ve Bakanlık tebliği (geçişte <b>Bakanlık izni<\/b>)<\/td><\/tr>\n<tr><td><b>Şarta bağlı artırım<\/b> (m.463–472)<\/td><td>Ayrı bir sermaye sistemi değil, <b>özel bir artırım şekli<\/b>; 6102 ile getirildi<\/td><td>Hak sahipleri değiştirme veya alım haklarını kullandıkça sermaye <b>kendiliğinden<\/b> artar<\/td><\/tr>\n<\/table>\n<h4>Kayıtlı sermaye sistemindeki kavramlar (SPKn m.3/1)<\/h4>\n<table>\n<tr><th>Kavram<\/th><th>Tanım<\/th><\/tr>\n<tr><td><b>Başlangıç sermayesi<\/b><\/td><td>Kayıtlı sermayeli ortaklıkların sahip olmaları zorunlu <b>asgari çıkarılmış sermaye<\/b><\/td><\/tr>\n<tr><td><b>Çıkarılmış sermaye<\/b><\/td><td>Kayıtlı sermayeli ortaklıkların <b>satışı yapılmış paylarını<\/b> temsil eden sermaye<\/td><\/tr>\n<tr><td><b>Kayıtlı sermaye<\/b><\/td><td>Esas sözleşmede hüküm bulunmak kaydıyla yönetim kurulu kararıyla, esas sermaye artırımı hükümlerine tabi olmadan pay çıkarılabilecek <b>azami miktar<\/b>; sicilde tescil ve ilan edilmiştir. Şirketin o anki sermayesi değil, <b>tavandır<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Esas sözleşmeyle özel yetki verilirse yönetim kurulu, tüm şirketlerde <b>imtiyazlı<\/b> veya <b>itibari değerin üzerinde<\/b> pay çıkarabilir ve <b>yeni pay alma haklarını sınırlayabilir<\/b>; halka açık ortaklıklarda ayrıca <b>itibari değerin altında<\/b> pay çıkarabilir ve <b>imtiyazlı pay sahiplerinin haklarını kısıtlayabilir<\/b> (TTK m.460, SPKn m.18). Bu kararlar iptal davasına konu olabilir.<\/li>\n<li>Kayıtlı sermaye sistemini benimseyen genel kurul kararları ve yönetim kurulunun artırım kararları imtiyazlı pay sahiplerinin haklarını ihlal ediyorsa <b>özel kurul onayı<\/b> şarttır (m.454/1).<\/li>\n<\/ul>\n<h4>Şarta bağlı sermaye artırımı<\/h4>\n<ul>\n<li>Uygulama alanı (m.463): genel kurul, yeni çıkarılan <b>tahviller veya benzeri borçlanma araçları<\/b> nedeniyle şirketten veya topluluk şirketlerinden alacaklı olanlara ya da <b>çalışanlara<\/b>, <b>değiştirme veya alım hakları<\/b> yoluyla yeni pay edinme hakkı tanıyarak sermayenin şarta bağlı artırılmasına karar verebilir. Uygulama bu iki hâlle sınırlıdır.<\/li>\n<li><b>Esas sözleşmede dayanak<\/b> gerekir (m.465). Hüküm, esas sözleşmede belirtilen şarta bağlı artırımın <b>toplam itibari değerine<\/b> ulaşılana kadar uygulanır.<\/li>\n<li>Esas sözleşme değişikliği yapılıp tescil edilince zemin hazırlanır; hak sahipleri haklarını kullandıkları <b>anda ve ölçüde<\/b> sermaye kendiliğinden artar.<\/li>\n<\/ul>\n<h4>Sermaye artırımında SPK'nın yetkisi<\/h4>\n<ul>\n<li>Halka açık olmayan ortaklıkların <b>halka arz edilmeyen<\/b> pay ihraçları SPKn kapsamı dışındadır (SPKn m.2/1).<\/li>\n<li><b>Halka açık ortaklığın<\/b> artırımında, halka arz olsun olmasın, Bakanlık izninin yanında esas sözleşme değişikliği için <b>SPK uygun görüşü<\/b> gerekir.<\/li>\n<li>Kayıtlı sermaye sistemine geçiş için halka açık ortaklık <b>SPK izni<\/b> almalıdır (SPKn m.18/1).<\/li>\n<li><b>Halka arz yoluyla<\/b> artırım yapan her şirket (halka açık olsun olmasın) SPKn'ye tabidir; <b>izahname hazırlanıp SPK'ca onaylanması<\/b> zorunludur.<\/li>\n<li>Satış kuralları: <b>Pay Tebliği (VII-128.1)<\/b> ve <b>Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)<\/b>.<\/li>\n<\/ul>\n\n<h3>Sermaye azaltımı (m.473–475)<\/h3>\n<table>\n<tr><th>Niteliği<\/th><th>Sebep<\/th><\/tr>\n<tr><td><b>Kurucu<\/b> sermaye azaltımı<\/td><td>Şirketin ihtiyacının üzerinde sermayeye sahip olması (pay sahiplerine değer iadesi)<\/td><\/tr>\n<tr><td><b>Açıklayıcı<\/b> sermaye azaltımı<\/td><td>Zararlar sonucu oluşan <b>bilanço açığının kapatılması<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Azaltılan kısmın yerine bedelleri tamamen ödenecek yeni paylar çıkarılmıyorsa genel kurul esas sözleşmenin değiştirilmesine karar verir. Çağrı ilanlarında, mektuplarda ve internet sitesinde azaltmanın <b>sebepleri, amacı ve yöntemi<\/b> hesap verme ilkelerine uygun olarak açıklanır. Yönetim kurulu bu hususları içeren bir <b>rapor<\/b> sunar; genel kurulca onaylanan rapor tescil ve ilan edilir.<\/li>\n<li>Sermaye hiçbir surette m.332'deki <b>asgari tutarın altına<\/b> indirilemez (m.473/5, emredici).<\/li>\n<li>Bakanlık iznine tabi şirketlerde <b>Bakanlık izni<\/b>, SPKn'ye tabi şirketlerde <b>SPK uygun görüşü<\/b> gerekir.<\/li>\n<li><b>Ön koşul<\/b> (m.473/2): azaltmaya rağmen <b>alacaklıların haklarını tamamen karşılayacak aktifin<\/b> şirkette bulunduğunun belirlenmesi. Bu tespiti ilk metinde işlem denetçisi yapacaktı; işlem denetçiliği kalkınca kimin yapacağı TTK'da yazmaz. Mülga TTK m.396/1 mahkemece atanan <b>üç bilirkişi<\/b> öngörüyordu; kitaptaki görüşe göre tespiti <b>asliye ticaret mahkemesince atanacak bilirkişiler<\/b> yapmalıdır.<\/li>\n<\/ul>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>Karar nisabı<\/td><td>Sermayenin en az <b>yüzde 75<\/b>'ini oluşturan payların sahiplerinin veya temsilcilerinin olumlu oyu; kararda azaltmanın tarzı gösterilir<\/td><td>m.473/3 atfıyla m.421/3<\/td><\/tr>\n<tr><td>Halka açık ortaklık<\/td><td>Toplantı nisabı aranmaz; katılan oy hakkı olan payların <b>üçte ikisi<\/b> (sermayenin yarısı hazırsa <b>çoğunluk<\/b>)<\/td><td>SPKn m.29/6<\/td><\/tr>\n<tr><td>Kayıtlı sermaye<\/td><td>m.473–475 çıkarılmış sermayenin azaltılmasına kıyasen uygulanır<\/td><td>m.473/6<\/td><\/tr>\n<tr><td>Alacaklılara çağrı<\/td><td>Yönetim kurulu kararı internet sitesine koyar; TTSG'de ve esas sözleşmedeki şekilde <b>yedişer gün arayla üç defa<\/b> ilan eder; bilinen alacaklılara ayrıca mektup gönderir<\/td><td>m.474/1<\/td><\/tr>\n<tr><td>Alacak bildirimi<\/td><td>TTSG'deki <b>üçüncü ilandan itibaren iki ay<\/b> içinde ödeme veya teminat istenebilir<\/td><td>m.474/1<\/td><\/tr>\n<tr><td>İstisna<\/td><td>Sermaye, zararlardan doğan <b>bilanço açığını kapatmak amacıyla ve açık oranında<\/b> azaltılıyorsa yönetim kurulu alacaklılara çağrıdan ve ödeme/teminattan vazgeçebilir<\/td><td>m.474/2<\/td><\/tr>\n<tr><td>Alacaklıların iptal davası<\/td><td>Süre dolmadan ve alacaklar ödenmeden veya teminata bağlanmadan azaltma yapılırsa, şirket merkezindeki asliye ticaret mahkemesinde, azaltmanın tescilinin <b>ilanından itibaren iki yıl<\/b> içinde iptal davası; teminat yetersizliğinde de yargı yolu açık<\/td><td>m.474<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Uygulama<\/b> (m.475): pay senetlerinin değiştirme, damgalama vb. yolla azaltılması gerekiyorsa, ihtara rağmen geri verilmeyen senetler şirketçe <b>iptal edilebilir<\/b>. Geri verilen senetler değiştirmeye yetmezse iptal edilir, karşılığındaki yeni senetler satılır ve pay sahibine düşen tutar şirkette saklanır.<\/li>\n<li>Azaltma kararı ve azaltmanın fiilen gerçekleştiği, m.473–475 şartlarına uyulduğunu gösteren belgeler sicile ibraz edilmeden <b>tescil edilemez<\/b>.<\/li>\n<\/ul>\n", "sorular": [{"q": "Anonim şirkette esas sözleşmeyi değiştirme yetkisine ilişkin hangisi doğrudur?", "o": ["Yönetim kuruluna esas sözleşmeyle devredilebilir", "Ticaret Bakanlığına aittir", "Denetçinin onayına bağlıdır", "Genel kurulun devredilemez yetkisidir", "Esas sözleşmede hüküm varsa murahhas üyeye devredilebilir"], "a": 3, "e": "Esas sözleşmenin değiştirilmesi m.408/2-a uyarınca genel kurulun devredilemez yetkisidir."}, {"q": "TTK m.452'ye göre genel kurulun esas sözleşme değişikliği yetkisinin sınırı nedir?", "o": ["Yalnız sermaye maddesi değiştirilebilir", "Pay sahiplerinin müktesep ve vazgeçilmez hakları saklıdır", "İşletme konusu hiçbir zaman değiştirilemez", "Kuruluştan sonraki ilk beş yıl değişiklik yapılamaz", "Değişiklik yalnız mahkeme onayıyla yapılabilir"], "a": 1, "e": "Genel kurul esas sözleşmenin bütün hükümlerini değiştirebilir; müktesep ve vazgeçilmez haklar saklıdır."}, {"q": "TTK m.333'e göre Bakanlık izni gereken şirketlerde Bakanlık incelemesi hangi yönden yapılır?", "o": ["Ticari yerindelik yönünden", "Sermaye yeterliliği yönünden", "Rekabet hukuku yönünden", "Yönetim kurulu üyelerinin nitelikleri yönünden", "Kanunun emredici hükümlerine aykırılık yönünden"], "a": 4, "e": "m.333: Bakanlık incelemesi yalnız kanunun emredici hükümlerine aykırılık yönünden yapılır."}, {"q": "Halka açık bir ortaklığın esas sözleşme değişikliğine ilişkin hangisi doğrudur?", "o": ["SPK'nın hiçbir yetkisi yoktur", "Yalnız Rekabet Kurumu izni gerekir", "SPK'nın uygun görüşü alınması zorunludur", "Değişiklik genel kurul kararı olmadan yönetim kurulunca yapılır", "Değişiklik tescil edilmeden üçüncü kişilere karşı hüküm doğurur"], "a": 2, "e": "SPKn m.33/2 uygun görüşü zorunlu kılar; SPKn TTK'dan sonra yürürlüğe giren özel kanun olduğundan m.333 buna engel değildir."}, {"q": "Esas sözleşme değişikliği kararının üçüncü kişilere karşı etkisi ne zaman doğar?", "o": ["Ticaret siciline tescille", "Genel kurul kararıyla", "Bakanlık izniyle", "Kararın internet sitesine konulmasıyla", "İmtiyazlı pay sahipleri özel kurulunun toplanmasıyla"], "a": 0, "e": "Esas sözleşme değişikliği kararları üçüncü kişilere karşı tescilden önce hüküm ifade etmez."}, {"q": "Bakanlık iznine tabi bir şirkette izin alınmadan esas sözleşme değişikliği gündeme konmuşsa ne olur?", "o": ["Genel kurul görüşüp karar alabilir, izin sonradan alınır", "Karar alınır ama tescil edilemez", "Yönetim kurulu doğrudan karar verir", "Değişiklik genel kurulda görüşülemez", "Karar kendiliğinden SPK'ya gönderilir"], "a": 3, "e": "Genel Kurul Yönetmeliği m.27/2: izin alınmamışsa gündemdeki esas sözleşme değişikliği görüşülemez."}, {"q": "Aşağıdakilerden hangisi esas sermayenin özelliklerinden biri değildir?", "o": ["Önceden belirlenmiş ve sabit olması", "Her yıl şirketin piyasa değerine göre güncellenmesi", "Nakitle ifade edilmesi", "İtibari değerli paylara bölünmüş olması", "Tamamen taahhüt edilmiş olması"], "a": 1, "e": "Esas sermaye sabittir; ancak kanuni usullerle artırılıp azaltılabilir, piyasa değerine göre kendiliğinden değişmez."}, {"q": "Bilançosunda sermayeye eklenebilecek fonlar bulunan bir şirketin sermaye artırımına ilişkin hangisi doğrudur?", "o": ["Bu fonlara dokunmadan yalnız taahhüt yoluyla artırım yapabilir", "İç kaynaklı artırım yasaktır", "Yalnız ayni sermaye artırımı yapabilir", "Fonlar ancak tasfiyede dağıtılabilir", "Fonları sermayeye dönüştürmeden taahhüt yoluyla artırım yapamaz; aynı zamanda ve aynı oranda taahhüt yoluyla artırım yapabilir"], "a": 4, "e": "m.462/3 iç kaynakların önce sermayeye eklenmesini ister; dış kaynaklı artırım kural olarak iç kaynaktan ekleneni aşamaz."}, {"q": "Bilançosunda sermayeye eklenebilecek 10 milyon lira fon bulunan bir şirket, bu fonları sermayeye eklerken aynı zamanda taahhüt yoluyla da artırım yapmak istiyor. Bütün pay sahiplerinin katıldığı genel kurulda oybirliği sağlanamıyorsa taahhüt yoluyla en fazla ne kadar artırım yapabilir?", "o": ["2,5 milyon lira", "5 milyon lira", "10 milyon lira", "20 milyon lira", "Sınır yoktur"], "a": 2, "e": "m.462/3 uyarınca dış kaynaktan eklenecek tutar iç kaynaktan ekleneni aşamaz: en fazla 10 milyon lira. Aşan artırım 548 sayılı Genelgeye göre bütün pay sahiplerinin katıldığı genel kurulda oybirliği gerektirir."}, {"q": "Ticaret Bakanlığının 548 sayılı Genelgesine göre iç kaynakları aşan ölçüde eşzamanlı dış kaynaklı sermaye artırımı için hangisi şarttır?", "o": ["Bütün pay sahiplerinin hazır olduğu veya temsil edildiği genel kurulda oybirliği", "Sermayenin yüzde yetmiş beşinin olumlu oyu", "Yönetim kurulunun oybirliği", "SPK izni", "Mahkeme kararı"], "a": 0, "e": "23.01.2013 tarihli 548 sayılı Genelge tüm pay sahiplerinin katıldığı genel kurulda oybirliği arar."}, {"q": "Esas sermaye sisteminde sermaye artırımına yetkili organ hangisidir?", "o": ["Yönetim kurulu", "Murahhas üye", "Denetçi", "Genel kurul", "Ticaret Bakanlığı"], "a": 3, "e": "Esas sermaye sisteminde artırım bir esas sözleşme değişikliğidir ve genel kurulca m.421 nisaplarına göre karara bağlanır."}, {"q": "Kayıtlı sermaye sistemine ilişkin hangisi yanlıştır?", "o": ["Yönetim kurulu esas sözleşmedeki tavana kadar sermayeyi artırabilir", "Halka açık olmayan şirketler sisteme geçmek için SPK izni alır", "Tavan içindeki artırım için esas sözleşme değişikliği gerekmez", "6102 sayılı TTK ile halka açık olmayan şirketler de bu sistemi kullanabilir", "Halka açık ortaklıklarda II-18.1 Tebliği uygulanır"], "a": 1, "e": "Halka açık olmayan şirketler sisteme geçiş için Ticaret Bakanlığından izin alır; SPK izni halka açık ortaklıklar içindir."}, {"q": "Kayıtlı sermayeli anonim ortaklıkların satışı yapılmış paylarını temsil eden sermayeye ne ad verilir?", "o": ["Başlangıç sermayesi", "Kayıtlı sermaye", "Esas sermaye", "Asgari sermaye", "Çıkarılmış sermaye"], "a": 4, "e": "SPKn m.3/1-d: çıkarılmış sermaye. Başlangıç sermayesi zorunlu asgari çıkarılmış sermaye; kayıtlı sermaye ise yönetim kurulunun pay çıkarabileceği azami miktardır."}, {"q": "Kayıtlı sermaye tavanı 500 milyon lira, çıkarılmış sermayesi 320 milyon lira olan bir ortaklıkta yönetim kurulu, esas sözleşme değişikliği yapmadan çıkarılmış sermayeyi en fazla ne kadar artırabilir?", "o": ["120 milyon lira", "320 milyon lira", "180 milyon lira", "500 milyon lira", "820 milyon lira"], "a": 2, "e": "Yönetim kurulu tavana kadar artırabilir: 500 - 320 = 180 milyon lira. Tavanın aşılması esas sözleşme değişikliği gerektirir."}, {"q": "Şarta bağlı sermaye artırımına ilişkin hangisi yanlıştır?", "o": ["Sermaye, yönetim kurulunun her hak kullanımı için ayrıca alacağı artırım kararıyla artar", "6102 sayılı TTK ile getirilmiştir", "Ayrı bir sermaye sistemi değil, özel bir artırım şeklidir", "Değiştirme veya alım hakkı tanıyan borçlanma araçları ile çalışanlara pay alım hakkı tanınmasıyla sınırlıdır", "Esas sözleşmede dayanak bulunması gerekir"], "a": 0, "e": "Hak sahipleri haklarını kullandıkları anda ve ölçüde sermaye kendiliğinden artar (m.463)."}, {"q": "Aşağıdaki sermaye artırımlarından hangisi SPKn kapsamı dışındadır?", "o": ["Halka açık ortaklığın bedelli sermaye artırımı", "Halka açık olmayan şirketin halka arz yoluyla sermaye artırımı", "Halka açık ortaklığın kayıtlı sermaye sistemine geçişi", "Halka açık olmayan şirketin halka arz edilmeyen pay ihracı", "Halka açık ortaklığın bedelsiz sermaye artırımı"], "a": 3, "e": "SPKn m.2/1: halka açık olmayan ortaklıkların halka arz edilmeyen pay ihraçları Kanun kapsamı dışındadır."}, {"q": "Zararlar sonucu bilançoda oluşan açığı kapatmak amacıyla yapılan sermaye azaltımının niteliği nedir?", "o": ["Kurucu sermaye azaltımı", "Açıklayıcı sermaye azaltımı", "Şarta bağlı sermaye azaltımı", "Gizli sermaye azaltımı", "Zorunlu tasfiye"], "a": 1, "e": "İhtiyaç fazlası sermayenin azaltılması kurucu, bilanço açığını kapatmak için yapılan azaltma açıklayıcı niteliktedir."}, {"q": "Halka açık olmayan bir anonim şirkette sermaye azaltımı kararı için gereken nisap hangisidir?", "o": ["Sermayenin dörtte biriyle toplanıp çoğunlukla karar", "Sermayenin yarısıyla toplanıp çoğunlukla karar", "Oybirliği", "Katılanların üçte ikisi", "Sermayenin en az yüzde yetmiş beşinin olumlu oyu"], "a": 4, "e": "m.473/3 m.421/3'e atıf yapar: sermayenin en az yüzde yetmiş beşi. Katılanların üçte ikisi halka açık ortaklıklar için SPKn m.29/6 nisabıdır."}, {"q": "Esas sermayesi 60 milyon lira olan halka açık olmayan bir şirkette sermaye azaltımı kararı için en az ne kadar sermayeyi temsil eden payların olumlu oyu gerekir?", "o": ["15 milyon lira", "30 milyon lira", "45 milyon lira", "40 milyon lira", "60 milyon lira"], "a": 2, "e": "Yüzde yetmiş beş: 60 x 0,75 = 45 milyon lira. 40 milyon lira üçte ikiye, 30 milyon lira yarıya karşılık gelir."}, {"q": "Sermaye azaltımında alacaklılara yapılacak çağrıya ilişkin hangisi doğrudur?", "o": ["TTSG'de ve esas sözleşmedeki şekilde yedişer gün arayla üç defa ilan edilir; alacaklılar üçüncü ilandan itibaren iki ay içinde başvurabilir", "TTSG'de bir kez ilan yeterlidir", "İlanlar onar gün arayla iki defa yapılır; başvuru süresi bir aydır", "Yalnız bilinen alacaklılara mektup gönderilir", "Çağrıyı mahkeme yapar"], "a": 0, "e": "m.474/1: yedişer gün arayla üç ilan; üçüncü ilandan itibaren iki ay; bilinen alacaklılara ayrıca mektup."}, {"q": "Bir şirket sermaye azaltımı için TTSG'deki üçüncü ilanı 10 Mart'ta yapmıştır. Alacaklılar alacaklarını bildirip ödeme veya teminat isteyebilmek için en geç ne zamana kadar başvurabilir?", "o": ["10 Nisan", "24 Mart", "10 Haziran", "10 Mayıs", "10 Eylül"], "a": 3, "e": "Süre üçüncü ilandan itibaren iki aydır: 10 Mart + 2 ay = 10 Mayıs."}, {"q": "Hangi durumda yönetim kurulu, sermaye azaltımında alacaklılara çağrıdan ve alacakların ödenmesi veya teminata bağlanmasından vazgeçebilir?", "o": ["Şirket halka açıksa", "Sermaye, zararlardan doğan bilanço açığını kapatmak amacıyla ve açık oranında azaltılıyorsa", "Azaltma ihtiyaç fazlası sermayenin iadesi için yapılıyorsa", "Genel kurul oybirliğiyle karar verdiyse", "Azaltma tutarı sermayenin yüzde onundan azsa"], "a": 1, "e": "m.474/2 istisnası yalnız açıklayıcı nitelikteki, açık oranında yapılan azaltma içindir."}, {"q": "Usulüne aykırı sermaye azaltımında alacaklıların iptal davası açma süresi hangisidir?", "o": ["Kararın alınmasından itibaren üç ay", "Tescilin ilanından itibaren altı ay", "Öğrenmeden itibaren bir yıl", "Süresiz", "Tescilin ilanından itibaren iki yıl"], "a": 4, "e": "m.474: şirket merkezindeki asliye ticaret mahkemesinde, azaltmanın tescilinin ilanından itibaren iki yıl içinde."}, {"q": "Sermaye azaltımına ilişkin hangisi yanlıştır?", "o": ["Sermaye m.332'deki asgari tutarın altına indirilemez", "Alacakları tamamen karşılayacak aktifin bulunduğunun belirlenmesi temel şarttır", "Azaltma kararı, şartlara uyulduğuna dair belge aranmaksızın tescil edilir", "Yönetim kurulu azaltmanın sebeplerini içeren raporu genel kurula sunar", "Kayıtlı sermaye sisteminde çıkarılmış sermayenin azaltılmasına bu hükümler kıyasen uygulanır"], "a": 2, "e": "m.475: m.473–475 şartlarına uyulduğunu gösteren belgeler sicile ibraz edilmeden tescil yapılamaz."}]}, {"id": 11, "kisa": "Menkul Kıymet ve Pay Hakları", "baslik": "Menkul Kıymetler, Pay ve Pay Sahipliği Hakları ile Azlık Hakları", "ozet": "SPKn'ye göre menkul kıymet, intifa senetleri ve borçlanma araçları, payın itibari değeri ve devri, devir sınırlamaları, şirketin kendi paylarını edinmesi, yönetsel ve mali haklar, rüçhan hakkı, azlık hakları ve pay sahibinin tek borcu.", "notlar": "\n<h3>Menkul kıymet kavramı<\/h3>\n<ul>\n<li><b>Sermaye piyasası aracı<\/b> (SPKn m.3/1-ş): menkul kıymetler ve türev araçlar ile yatırım sözleşmeleri dahil Kurulca belirlenen diğer araçlar. İkili ayrım: <b>menkul kıymetler<\/b> ve <b>diğer sermaye piyasası araçları<\/b> (türev araçlar, yatırım sözleşmeleri).<\/li>\n<li><b>Menkul kıymet<\/b> (SPKn m.3/1-o): <b>para, çek, poliçe ve bono hariç<\/b>; (1) paylar, pay benzeri diğer kıymetler ve bunlara ilişkin depo sertifikaları; (2) borçlanma araçları veya menkul kıymetleştirilmiş varlık ve gelirlere dayalı borçlanma araçları ve bunlara ilişkin depo sertifikaları.<\/li>\n<li>6362 sayılı SPKn ile eski Kanundaki \"unsurların bir arada bulunması\" anlayışı terk edildi; <b>örnekleyici sayım<\/b> benimsendi. SPKn m.59 ve 61 ile ipotek ve varlık teminatlı menkul kıymetler ve <b>kira sertifikaları<\/b> da menkul kıymettir.<\/li>\n<li><b>Depo sertifikaları<\/b> açıkça menkul kıymet sayıldı (eski dönemde yalnız \"sermaye piyasası aracı\" idi).<\/li>\n<\/ul>\n<table>\n<tr><th>Kavram<\/th><th>Tanım (SPK tebliğleri)<\/th><\/tr>\n<tr><td><b>Pay<\/b> (Pay Tebliği VII-128.1)<\/td><td>Ortaklığın sermayesini temsil eden ve sahibine <b>ortaklık hakkı<\/b> veren menkul kıymet<\/td><\/tr>\n<tr><td><b>Pay benzeri menkul kıymet<\/b><\/td><td>Sermayede temsil edilmesi zorunlu olmayan, <b>sabit getiri taahhüdü barındırmayan<\/b>, pay sahipliği haklarından birini veya bir kısmını veren ve Kurulca bu nitelikte belirlenen menkul kıymet; örnek: <b>katılma intifa senetleri<\/b><\/td><\/tr>\n<tr><td><b>Borçlanma araçları<\/b> (VII-128.8)<\/td><td>İhraççıların borçlu sıfatıyla ihraç ettiği tahviller, paya dönüştürülebilir tahviller, değiştirilebilir tahviller, bonolar, kıymetli maden bonoları ve Kurulca borçlanma aracı kabul edilenler<\/td><\/tr>\n<\/table>\n<p>Dikkat: <b>Çek<\/b> menkul kıymet değildir; <b>varant<\/b> borçlanma aracı değildir.<\/p>\n\n<h3>TTK'da menkul kıymetler (m.484–506)<\/h3>\n<table>\n<tr><th>Ayrım<\/th><th>Maddeler<\/th><\/tr>\n<tr><td>Pay senetleri<\/td><td>m.484–501<\/td><\/tr>\n<tr><td>İntifa senetleri<\/td><td>m.502–503<\/td><\/tr>\n<tr><td>Borçlanma senetleriyle alma ve değiştirme hakkını içeren menkul kıymetler<\/td><td>m.504–506<\/td><\/tr>\n<\/table>\n<h4>İntifa senetleri<\/h4>\n<ul>\n<li><b>Genel kurul<\/b>, esas sözleşme uyarınca veya esas sözleşmeyi değiştirerek; bedeli kanuna uygun olarak yok edilen payların sahipleri, alacaklılar veya benzer sebeple şirketle ilgili olanlar lehine intifa senedi çıkarabilir (m.502). m.348 uygulanır.<\/li>\n<li>Kurucular için çıkarılanlar dahil <b>emre veya hamiline<\/b> yazılı olabilir.<\/li>\n<li>Sahiplerine <b>pay sahipliği hakları verilemez<\/b>; ancak <b>net kâra<\/b>, <b>tasfiye bakiyesine<\/b> katılma veya <b>yeni pay alma<\/b> hakları tanınabilir (m.503).<\/li>\n<li>Türler: adi intifa senedi, <b>kurucu intifa senedi<\/b> (m.348), <b>katılma intifa senedi<\/b> (Pay Tebliği).<\/li>\n<\/ul>\n<h4>Borçlanma araçları<\/h4>\n<ul>\n<li>m.504'te sayılanlar: her çeşit tahvil, finansman bonosu, varlığa dayalı senet, iskontolu olanlar dahil diğer borçlanma senetleri, alma ve değiştirme hakkı veren senetler; sayım <b>sınırlı değildir<\/b>.<\/li>\n<li>Kural olarak <b>genel kurul kararıyla<\/b> çıkarılır; istisna: m.505 (en çok <b>15 ay<\/b> için yönetim kuruluna yetki) ve SPKn m.31/3 (esas sözleşmeyle yönetim kuruluna <b>süreli veya süresiz<\/b> devir; halka kapalı şirketlere de uygulanır).<\/li>\n<li>Nisap: halka açık olmayan şirketlerde <b>m.421/3–4<\/b> (esas sözleşme farklı nisap koyabilir); halka açık şirketlerde SPKn m.29/3 ve VII-128.8 m.5 gereği <b>m.418<\/b>.<\/li>\n<li>Hamiline veya emre yazılı ve itibari değerli olabilir; mülga TTK'daki \"tahvil emre yazılı olamaz\" anlayışı kalktı; tahviller <b>emre, nama ve hamiline<\/b> ihraç edilebilir. İtibari değeri genel kurul veya yetkili yönetim kurulu belirler. Bedel <b>nakit<\/b> olmalı ve teslimde <b>tamamen ödenmelidir<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>İhraç limiti<\/th><th>Kural<\/th><\/tr>\n<tr><td>TTK m.506<\/td><td>Toplam tutar sermaye ile bilançodaki yedek akçeler toplamını aşamaz; yeniden değerleme fonları toplama katılır. SPKn hükümleri saklı<\/td><\/tr>\n<tr><td>Uygulanan: VII-128.8 m.9<\/td><td>Halka açık ortaklık: <b>özkaynağın 5 katı<\/b>; halka açık olmayan ortaklık: <b>özkaynağın 3 katı<\/b>; konsolide tablo hazırlanıyorsa <b>ana ortaklığa ait özkaynak<\/b> esas alınır<\/td><\/tr>\n<\/table>\n\n<h3>Pay<\/h3>\n<ul>\n<li>Pay, sermayenin bölündüğü <b>en küçük birim<\/b>dir; ayrıca ortaklık hakkını temsil eder. 6102 ile \"hisse senedi\" yerine <b>\"pay senedi\"<\/b> terimi benimsendi. Borsadaki kaydi paylar için \"pay\", pay senedi anlamında da kullanılır.<\/li>\n<li>Pay hem SPKn hem TTK'ya göre <b>menkul kıymet<\/b>tir; nama veya hamiline yazılı olabildiğinden <b>kıymetli evrak<\/b> niteliği de kabul edilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>İtibari değer<\/td><td>En az <b>1 kuruş<\/b>; birer kuruş ve katları olarak yükseltilir; <b>Cumhurbaşkanı yüz katına<\/b> kadar artırabilir. Aykırı paylar geçersiz; ödemeden doğan haklar saklı; ihraç edenler müteselsilen sorumlu<\/td><td>m.476<\/td><\/tr>\n<tr><td>Primli pay<\/td><td>İtibari değerin altında pay çıkarılamaz; üstünde (primli/agiolu) çıkarılabilir, bunun için esas sözleşme hükmü veya genel kurul kararı gerekir. Değişken sermayeli yatırım ortaklığı paylarının itibari değeri yoktur (SPKn m.50/2)<\/td><td>m.347<\/td><\/tr>\n<tr><td>Bölünmezlik<\/td><td>Pay şirkete karşı bölünemez; birden çok malik ortak temsilci atar; atamazlarsa birine yapılan tebligat hepsi için geçerli<\/td><td>m.477<\/td><\/tr>\n<tr><td>Bölme / birleştirme<\/td><td>Genel kurul, sermaye aynı kalmak şartıyla esas sözleşme değişikliğiyle payları bölebilir veya birleştirebilir; <b>birleştirme için her pay sahibinin onayı<\/b> gerekir<\/td><td>m.477<\/td><\/tr>\n<tr><td>Türü<\/td><td>Pay senetleri <b>hamiline veya nama<\/b> yazılıdır; bedeli tamamen ödenmemiş paylar için hamiline senet çıkarılamaz (aykırılık geçersizlik)<\/td><td>m.484<\/td><\/tr>\n<tr><td>Tescilden önce<\/td><td>Şirketin veya sermaye artırımının tescilinden önce çıkarılan paylar geçersizdir; iştirak taahhüdü geçerliliğini korur<\/td><td>m.486<\/td><\/tr>\n<tr><td>Hamiline senet basımı<\/td><td>Bedelin tamamının ödenmesinden itibaren <b>3 ay<\/b> içinde basılıp dağıtılır; karar tescil, ilan ve internet sitesinde yayımlanır; dağıtımdan önce sahipler <b>MKK'ya bildirilir<\/b>; bildirmeyene <b>20.000 TL<\/b> idari para cezası (m.562/13-a). Basılana kadar ilmühaber çıkarılabilir<\/td><td>m.486<\/td><\/tr>\n<tr><td>Nama yazılı senet<\/td><td>Basım zorunlu değildir; <b>azlık isterse<\/b> basılıp dağıtılır. Senede bağlanmayan paylar: <b>çıplak pay<\/b><\/td><td>m.486/3<\/td><\/tr>\n<tr><td>Tür değişikliği<\/td><td>Esas sözleşmede aksi yoksa esas sözleşme değişikliğiyle dönüştürülebilir; nama yazılının hamiline dönüşmesi için bedelin <b>tamamen ödenmesi<\/b> şart<\/td><td>m.485<\/td><\/tr>\n<\/table>\n<p><b>Sınıflandırma<\/b>: devir şekline göre nama ve hamiline yazılı; imtiyaza göre imtiyazlı ve adi (imtiyaz: kâr payı, tasfiye payı, rüçhan, oy gibi haklarda üstün hak veya kanunda olmayan yeni bir hak, m.478–479); taahhüt edilen varlığa göre nakit ve ayın karşılığı; bedelli ve bedelsiz.<\/p>\n<h4>Payın devri<\/h4>\n<table>\n<tr><th>Pay<\/th><th>Devir şekli<\/th><\/tr>\n<tr><td>Hamiline yazılı senet<\/td><td><b>Zilyetliğin geçirilmesi<\/b> (m.489); ayrıca devralanın <b>MKK'ya bildirimi<\/b> ile hüküm doğurur. Bildirim yapılmazsa paya bağlı haklar kullanılamaz; bildirmeyene <b>5.000 TL<\/b> idari para cezası (m.562/13-b)<\/td><\/tr>\n<tr><td>Nama yazılı senet<\/td><td><b>Ciro ve zilyetliğin geçirilmesi<\/b>; yazılı devir beyanı ciro hükmündedir<\/td><\/tr>\n<tr><td>Senede bağlanmamış nama yazılı pay<\/td><td><b>Alacağın temliki<\/b> hükümleri<\/td><\/tr>\n<tr><td>Kaydi paylar<\/td><td>Devir <b>kaydi olarak<\/b> (tescille) gerçekleşir; borsada işlem gören ortaklıkların payları <b>MKK'da kayden<\/b> ihraç edilir (Pay Tebliği m.48; SPKn m.13)<\/td><\/tr>\n<\/table>\n<h4>Nama yazılı payların devrinin sınırlandırılması<\/h4>\n<ul>\n<li>Şirketle ilişkilerde yalnız <b>pay defterinde kayıtlı<\/b> olan pay sahibi ve intifa hakkı sahibi sayılır (m.499/4).<\/li>\n<li>Kanunda veya esas sözleşmede aksi yoksa nama yazılı paylar <b>serbestçe<\/b> devredilir (m.490/1). <b>Hamiline yazılı payların devri sınırlandırılamaz.<\/b><\/li>\n<li><b>Kanuni sınırlama<\/b> (m.491): <b>bedeli tamamen ödenmemiş<\/b> nama yazılı paylar ancak şirketin onayıyla devredilir; şirket yalnız devralanın ödeme gücü şüpheli ve istenen teminat verilmemişse reddedebilir. Miras, mirasın paylaşımı, mal rejimi veya cebri icrayla edinmede uygulanmaz.<\/li>\n<li><b>Esas sözleşmesel sınırlama<\/b>: devir şirket onayına bağlanabilir (intifa hakkı kurulmasında da geçerli); şirket <b>tasfiyeye girince<\/b> bu sınırlamalar düşer.<\/li>\n<\/ul>\n<table>\n<tr><th><\/th><th>Borsaya kote edilmemiş (m.493–494)<\/th><th>Borsaya kote edilmiş (m.495)<\/th><\/tr>\n<tr><td>Ret sebepleri<\/td><td>(a) esas sözleşmede öngörülen <b>önemli sebep<\/b> (pay sahipleri çevresinin bileşimi işletme konusu veya ekonomik bağımsızlık yönünden reddi haklı gösteriyorsa); (b) payları <b>gerçek değeriyle<\/b> devralmayı önermek; (c) devralanın kendi ad ve hesabına aldığını beyan etmemesi<\/td><td>(a) esas sözleşmedeki <b>yüzdeyle ifade edilen iktisap üst sınırının<\/b> aşılması; (b) istem hâlinde devralanın kendi ad ve hesabına aldığını beyan etmemesi. Başka sebeple ret yok<\/td><\/tr>\n<tr><td>Miras, mal rejimi, cebri icra<\/td><td>Şirket ancak payları gerçek değerle devralmayı önererek reddedebilir<\/td><td>Pay sahipliği <b>reddedilemez<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Gerçek değerin belirlenmesi şirket merkezindeki asliye ticaret mahkemesinden istenebilir (karar tarihine en yakın değer; giderler şirkete ait). Devralan gerçek değeri öğrendikten sonra <b>bir ay<\/b> içinde reddetmezse öneriyi kabul etmiş sayılır. Esas sözleşme m.493 şartlarını <b>ağırlaştıramaz<\/b>.<\/li>\n<li><b>Birlik teorisi<\/b> (m.494/1): onay verilmedikçe payların mülkiyeti ve <b>tüm haklar devredende<\/b> kalır. Mülga TTK'daki <b>bölünme teorisi<\/b> (mali haklar devralana, yönetsel haklar devredende) terk edildi.<\/li>\n<li>Miras, mal rejimi veya cebri icrayla edinmede mülkiyet ve malvarlığı hakları <b>derhal<\/b>, genel kurula katılma ve oy hakları <b>şirket onayıyla<\/b> geçer. Şirket istemi aldığı tarihten itibaren <b>3 ay<\/b> içinde reddetmezse veya ret haksızsa onay verilmiş sayılır.<\/li>\n<\/ul>\n<h4>Şirketin kendi paylarını edinmesi (m.379–389)<\/h4>\n<ul>\n<li>Kural olarak yasak, istisnalar genişletilmiş ve yaptırım değiştirilmiştir. Şirket esas veya çıkarılmış sermayesinin <b>onda birini<\/b> aşan veya aşacak miktarda kendi payını <b>ivazlı<\/b> edinemez ve rehin alamaz (m.379/1); <b>yüzde 10<\/b>'a kadar mümkündür. <b>İvazsız<\/b> edinme yasak değildir (m.383/1). Diğer istisnalar m.382'de sınırlı sayıdadır.<\/li>\n<li>Genel kurul yönetim kurulunu <b>en çok 5 yıl<\/b> geçerli bir kararla yetkilendirmelidir (m.379/2).<\/li>\n<li>m.382/b–d ve 383 uyarınca edinilen paylar kayıpsız devir mümkün olur olmaz ve her hâlde <b>3 yıl<\/b> içinde elden çıkarılır; şirket ve yavru şirketin bu payları toplamı yüzde 10'u aşmıyorsa gerekmez (m.384).<\/li>\n<li><b>Yaptırım<\/b> (m.385): m.379–381'e aykırı edinilen veya rehin alınan paylar en geç <b>6 ay<\/b> içinde elden çıkarılır veya rehin kaldırılır; işlem <b>geçersiz değildir<\/b>.<\/li>\n<li>Şirket <b>tek pay sahibi<\/b> olacak şekilde kendi payını edinemez (m.338/3). Kendi paylarını <b>taahhüt edemez<\/b>; yavru şirketin veya üçüncü kişinin şirket hesabına taahhüdü de böyle sayılır; aykırılıkta kuruluşta <b>kurucular<\/b>, artırımda <b>yönetim kurulu üyeleri<\/b> taahhüt etmiş sayılır, kusursuzluğunu ispatlayan kurtulur (m.388).<\/li>\n<li>Borsa şirketlerinde SPK yetkilidir (m.379/5, SPKn m.22): <b>Geri Alınan Paylar Tebliği (II-22.1)<\/b>.<\/li>\n<\/ul>\n\n<h3>Pay sahipliği hakları<\/h3>\n<h4>Yönetsel (katılma) haklar<\/h4>\n<ul>\n<li>Genel kurula katılma (tek paya sahip olanın bile katılımı engellenemez), oy, kararların yokluğunu, butlanını ve iptalini isteme, sorumluluk davası açma, bilgi alma ve inceleme, özel denetçi isteme.<\/li>\n<\/ul>\n<table>\n<tr><th>Bilgi alma ve inceleme (m.437)<\/th><th>Kural<\/th><\/tr>\n<tr><td>İncelemeye hazır belgeler<\/td><td>Finansal tablolar, konsolide tablolar, yıllık faaliyet raporu, denetim raporları ve kâr dağıtım önerisi genel kuruldan <b>en az 15 gün önce<\/b> merkez ve şubelerde hazır bulundurulur; finansal tablolar <b>1 yıl<\/b> açık tutulur; her pay sahibi gideri şirkete ait olmak üzere gelir tablosu ve bilançonun suretini isteyebilir<\/td><\/tr>\n<tr><td>Genel kurulda bilgi<\/td><td>Yönetim kurulundan şirket işleri, denetçiden denetimin şekli ve sonuçları hakkında; topluluk varsa bağlı şirketleri de kapsar<\/td><\/tr>\n<tr><td>Ret sebebi<\/td><td>Yalnız <b>şirket sırlarının açıklanması<\/b> veya korunması gereken diğer şirket menfaatlerinin tehlikeye girmesi<\/td><\/tr>\n<tr><td>Defter ve yazışma incelemesi<\/td><td>Genel kurulun açık izni veya yönetim kurulu kararı gerekir; uzman aracılığıyla yapılabilir<\/td><\/tr>\n<tr><td>Koruma<\/td><td>Esas sözleşmeyle veya organ kararıyla <b>kaldırılamaz, sınırlandırılamaz<\/b><\/td><\/tr>\n<tr><td>Mahkeme<\/td><td>Reddi izleyen <b>10 gün<\/b> içinde, diğer hallerde makul süre sonra asliye ticaret mahkemesi; basit yargılama; karar <b>kesin<\/b><\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Özel denetim (m.438–444)<\/th><th>Kural<\/th><\/tr>\n<tr><td>İstem<\/td><td>Her pay sahibi, haklarını kullanmak için gerekliyse ve <b>bilgi alma veya inceleme hakkını önceden kullanmışsa<\/b>, gündemde olmasa da genel kuruldan isteyebilir<\/td><\/tr>\n<tr><td>Genel kurul onaylarsa<\/td><td>Şirket veya her pay sahibi <b>30 gün<\/b> içinde asliye ticaret mahkemesinden özel denetçi atanmasını ister<\/td><\/tr>\n<tr><td>Genel kurul reddederse<\/td><td>Halka açık olmayanda sermayenin <b>onda biri<\/b>, halka açıkta <b>yirmide biri<\/b> veya itibari değer toplamı en az <b>1 milyon TL<\/b> olan pay sahipleri <b>3 ay<\/b> içinde mahkemeden ister; kanun veya esas sözleşme ihlaliyle zarar verildiğini <b>ikna edici biçimde<\/b> ortaya koymalılar. Mahkeme kararı kesin<\/td><\/tr>\n<tr><td>Rapor<\/td><td>Özel denetçi mahkemeye rapor verir; yönetim kurulu raporu ilk genel kurula sunar; pay sahipleri genel kuruldan itibaren <b>1 yıl<\/b> içinde suret isteyebilir<\/td><\/tr>\n<tr><td>Giderler<\/td><td>Mahkeme atadıysa avans ve giderleri belirler, haklı hallerde istem sahiplerine yükletebilir; <b>genel kurul<\/b> karar verdiyse giderler <b>şirkete<\/b> aittir<\/td><\/tr>\n<\/table>\n<h4>Mali haklar<\/h4>\n<ul>\n<li><b>Kâr payı<\/b> yalnız <b>net dönem kârından<\/b> ve <b>serbest yedek akçelerden<\/b> dağıtılabilir (m.509/2). Halka açık olmayanlarda Bakanlığın Kâr Payı Avansı Dağıtımı Hakkında Tebliği, halka açıklarda SPK <b>Kâr Payı Tebliği (II-19.1)<\/b> uygulanır.<\/li>\n<\/ul>\n<table>\n<tr><th>Sıra<\/th><th>Kârın dağıtımı (TTK)<\/th><\/tr>\n<tr><td>1<\/td><td>Yıllık kârın <b>yüzde 5<\/b>'i, ödenmiş sermayenin <b>yüzde 20<\/b>'sine ulaşıncaya kadar <b>genel kanuni yedek akçeye<\/b> (m.519/1); esas sözleşme daha fazlasını öngörebilir (m.521)<\/td><\/tr>\n<tr><td>2<\/td><td>Pay sahiplerine ödenmiş sermayenin <b>yüzde 5<\/b>'i oranında <b>birinci kâr payı<\/b> (m.511, 519/2-c)<\/td><\/tr>\n<tr><td>3<\/td><td>Esas sözleşmeye göre yönetim kurulu kazanç payları ve diğer dağıtımlar (m.511, 522)<\/td><\/tr>\n<tr><td>4<\/td><td>Yüzde 5 kâr payından sonra kârdan pay alacaklara dağıtılacak toplam tutarın <b>yüzde 10<\/b>'u genel kanuni yedek akçeye (<b>ikinci tertip<\/b>, m.519/2-c)<\/td><\/tr>\n<tr><td>5<\/td><td>Kalan konusunda genel kurul serbesttir<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Kâr payı avansı<\/b>: 6102 ile halka açık olmayanlar da dağıtabilir; kâr payından mahsup edilmek üzere ara dönem finansal tablolara göre oluşan kâr üzerinden hesaplanır.<\/li>\n<li>Haksız ve kötüniyetle kâr payı veya hazırlık dönemi faizi alan geri verir; geri alma hakkı alındığı tarihten itibaren <b>5 yıl<\/b>da zamanaşımına uğrar (m.512).<\/li>\n<li><b>Halka açık ortaklıklar<\/b> (SPKn m.19–20): SPK benzer ortaklıklar için farklı esaslar belirleyebilir. Kanuni yedek akçeler ve esas sözleşmedeki kâr payı ayrılmadan başka yedek akçe, ertesi yıla kâr aktarımı ve intifa senedi sahipleri, yönetim kurulu ve çalışanlara kâr payı kararı alınamaz. Kâr payı mevcut tüm paylara ihraç ve iktisap tarihine bakılmaksızın <b>eşit<\/b> dağıtılır (<b>kıst el yevm uygulanmaz<\/b>). Bir dönemde verilecek toplam <b>kâr payı avansı önceki yıl dönem kârının yarısını<\/b> aşamaz; önceki avanslar mahsup edilmeden yeni avans verilemez.<\/li>\n<li><b>Hazırlık devresi faizi<\/b> (m.509–510): sermaye için faiz ödenemez; ancak işletme tam faaliyete geçene kadar, TMS'ye uygun olarak özellikli varlık yatırımlarının maliyetine yüklenmek üzere esas sözleşmeyle faiz öngörülebilir; bitiş tarihi esas sözleşmede yazılır. Sermaye artırımında yeni pay sahiplerine en geç yeni yatırımın işletmeye alındığı güne kadar.<\/li>\n<\/ul>\n<h4>Yeni pay alma (rüçhan) hakkı (m.461)<\/h4>\n<ul>\n<li>Mevcut pay sahiplerinin, payları oranında yeni paylarda öncelik hakkı; pay oranını korur; <b>devredilebilir<\/b> (m.461/4).<\/li>\n<li>Yönetim kurulu kullanım esaslarını bir kararla belirler ve en az <b>15 gün<\/b> süre verir; karar tescil, TTSG'de ilan ve internet sitesinde yayımlanır.<\/li>\n<li>Kısıtlama veya kaldırma: <b>genel kurul<\/b>, <b>esas sermayenin yüzde 60<\/b>'ının olumlu oyu ve <b>haklı sebeple<\/b> (örnekler: halka arz, işletme veya iştirak devralınması, işçilerin şirkete katılması; finansal menfaat, ödeme darboğazı, teknoloji alımı da haklı sayılabilir). Yönetim kurulu gerekçeyi, primli/primsiz çıkarmayı ve primin hesabını bir raporla açıklar; rapor tescil ve ilan edilir.<\/li>\n<li>Kayıtlı sermayede, esas sözleşmeyle yetkilendirilen <b>yönetim kurulu<\/b> da kısıtlayabilir (nisap şartı dışında m.461 uygulanır).<\/li>\n<li>Dikkat: Rüçhan hakkı <b>esas sözleşmeyle<\/b> sınırlandırılamaz ve kaldırılamaz. Şirket, nama yazılı payların devir sınırlamasını gerekçe göstererek rüçhan hakkının kullanılmasını engelleyemez.<\/li>\n<\/ul>\n<h4>Önerilmeye muhatap olma hakkı (m.466)<\/h4>\n<ul>\n<li>6102 ile gelen yeni hak: şarta bağlı artırımda değiştirme veya alım hakkı içeren tahviller önce mevcut payları oranında <b>pay sahiplerine önerilir<\/b>. Çalışanlara alım hakkı tanınmasında uygulanmaz.<\/li>\n<li>Paydan ayrı devredilebilir ve bağışlanabilir; konusu yeni paylar değil, bu borçlanma araçlarıdır.<\/li>\n<li>Haklı sebeple kaldırılabilir veya sınırlandırılabilir (gerekçeye göre yetki genel kurulda; ör. bir aracı kurumun tahvillerin tümünü alma önerisi). Nisap belirsizdir; yüzde 60 uygulanması gerektiği savunulur.<\/li>\n<\/ul>\n<h4>Tasfiye bakiyesi (m.507–508)<\/h4>\n<p>Esas sözleşmede başka hüküm yoksa her pay sahibi tasfiye sonucunda kalan tutara <b>payı oranında<\/b> katılır; şirketin sona ermesi şarttır. Esas sözleşmede aksi yoksa tasfiye payı, sermaye için <b>yapılan ödemelerle orantılı<\/b> hesaplanır.<\/p>\n\n<h3>Azlık hakları<\/h3>\n<p>Azlık: halka açık olmayan şirkette sermayenin <b>onda biri (yüzde 10)<\/b>, halka açık şirkette <b>yirmide biri (yüzde 5)<\/b>.<\/p>\n<table>\n<tr><th>Azlık hakkı<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>Denetçinin haklı sebeple görevden alınması davası<\/td><td>m.399/5<\/td><\/tr>\n<tr><td>Genel kurulu toplantıya çağırma ve gündeme madde ekletme<\/td><td>m.411<\/td><\/tr>\n<tr><td>Finansal tabloların müzakeresinin ve bağlı konuların ertelenmesini isteme<\/td><td>m.420<\/td><\/tr>\n<tr><td>Özel denetçi atanmasını isteme (genel kurul reddinde)<\/
