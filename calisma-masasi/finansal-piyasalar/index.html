ellenir. Tamamlama yükümlülüğü <b>ertesi iş günü gün sonuna<\/b> kadar yerine getirilmezse temerrüt.<\/li>\n<li>Kullanım: önce temerrüde düşenin kaynakları; nakit katkılar yetmezse temerrüde düşmemiş üyelerin nakit dışı katkıları nakde çevrilir; en likitten başlanır; zarar üyelerin fondaki paylarına göre dağıtılır. Temerrütten sonra yatırılan katkılar kullanılmaz.<\/li>\n<li>Üyeliği biten kuruluşun sabit katkısı, Takasbank Yönetim Kurulunun belirleyeceği süre sonunda iade edilir.<\/li>\n<\/ul>\n\n<h3>Komisyonlar<\/h3>\n<ul>\n<li><b>İşlem komisyonu<\/b> = Σ (günlük piyasa değeri × komisyon oranı) / <b>36500<\/b>. Vadesi 1 ay ve kısa işlemlerde vade sonunda, 1 aydan uzun ve vadesizlerde <b>ay sonlarında<\/b> saat 17:00'de ödünç alandan tahsil edilip ödünç verene aktarılır. İleri valörlüde gün sayısı valör ile vade arası.<\/li>\n<li>İleri valörlü işlem takastan önce iptal olursa: sebep ödünç alansa komisyonu öder; ödünç verense ödünç alandan komisyon alınmaz.<\/li>\n<li><b>Takasbank komisyonu<\/b>: Takasbank YK kararı ve <b>SPK onayı<\/b> ile; gerçekleşen kısmın piyasa değeri üzerinden <b>her iki taraftan<\/b>; komisyon + BSMV işlem günü 17:00'de. Özel emirde tarifenin <b>%50<\/b>'si. Ödenmezse işlem yetkisi kaldırılır.<\/li>\n<\/ul>\n\n<h3>Ödünce konu kıymetten doğan haklar<\/h3>\n<ul>\n<li><b>Mali haklar<\/b> (kâr payı, bedelli, bedelsiz) <b>ödünç verene<\/b> aittir; ama ödünç veren <b>oy hakkını kaybeder<\/b>.<\/li>\n<li><b>Kâr payı:<\/b> ödünç alan tutarı dağıtım günü 17:00'ye kadar yatırır. Yatırmazsa temerrüt faizi = BİST repo, TCMB BPP ve Takasbank Para Piyasası gecelik ağırlıklı ortalamalarından en yükseğinin <b>%50 fazlası<\/b>.<\/li>\n<li><b>Bedelsiz:<\/b> ödünç alanın borç adedi bedelsiz oranında artar (1.000 pay, %50 bedelsiz → 1.500).<\/li>\n<li><b>Bedelli:<\/b> başlangıç tarihinde R (rüçhan) kodlu işlem oluşur; ödünç alan bunu başlangıcı izleyen <b>3. iş günü<\/b> sonunda iade eder. Ödünç veren Takasbank üzerinden katılabilir: beyan son saati <b>16:00<\/b>, artırım son saati <b>16:15<\/b>; yapılmazsa R işlemleri <b>16:20<\/b>'de iptal. Beyan ve artırım kısmi yapılamaz.<\/li>\n<li>Sermaye azaltımında adetler azaltım oranında güncellenir. Kâr payı ve bedelli aynı günse otomatik mahsup (istemeyen bir gün önce bildirir).<\/li>\n<\/ul>\n\n<h3>Muacceliyet ve temerrüt<\/h3>\n<ul>\n<li>Vadesizler dışında ödünç alanın vadeden önce kapatma hakkı yoktur. Muacceliyet halleri: vade gelmesi; teminat tamamlama veya garanti fonu yükümlülüğünün yerine getirilmemesi; Takasbank'ın tasfiye kararı; kıymetin kredili/açığa satış listesinden çıkarılması.<\/li>\n<li>17:00'de borcu kapanmayan üye <b>temerrüde düşer<\/b>. Ödünç alana vadeyi izleyen iş günü <b>11:30<\/b>'a kadar süre verilebilir; sonra Pay Piyasası'nda <b>Temerrüt Sırası<\/b> açılıp T+0 alım yapılabilir. Temin edilen kıymet en geç <b>2 iş günü<\/b> içinde ödünç verene iade edilir.<\/li>\n<li>Ödünç veren, vade günü veya ertesi iş günü 16:00'ya kadar yazılı isterse, vadeyi izleyen gün <b>16:30<\/b>'da nakit bedel ödenir. Nakit istemezse Takasbank <b>3 iş günü<\/b> kıymet aramaya çalışır; bulamazsa bu dönemin en yüksek ağırlıklı ortalama fiyatıyla alacak kaydedilir.<\/li>\n<\/ul>\n<table><tr><th>Kıymet temerrüdü<\/th><th>Temerrüt faiz oranı<\/th><\/tr>\n<tr><td>Borç aynı gün <b>17:30'a kadar<\/b> kapanırsa<\/td><td>BİST repo, TCMB BPP, Takasbank PP gecelik oranları, sözleşme komisyonu ve kıymetin ağırlıklı ortalama ÖPP komisyonundan en yükseğinin <b>%50'si<\/b>, 1 günlük<\/td><\/tr>\n<tr><td><b>17:30'dan sonra<\/b> kapanırsa<\/td><td>Gecelik faizlerin <b>iki katı<\/b>, sözleşme komisyonu ve ağırlıklı ortalama komisyondan en yükseği; temerrüt süresince<\/td><\/tr>\n<\/table>\n<ul>\n<li>Temerrüt süresince üye o hesaplar için işlem yapamaz, teminatları bloke edilir. İşlem komisyonu 17:00'de ödenmezse Takasbank alacaklıya öder, temerrüt faizi işler; 15:30'a kadar kapanmazsa Takasbank kıymeti erken iade edebilir.<\/li>\n<li>Olağanüstü durumlarda Takasbank saatleri değiştirme, emir iletimini durdurma, işlem iptali, vade değiştirme dahil her tedbiri alabilir.<\/li>\n<\/ul>", "sorular": [{"q": "Takasbank Ödünç Pay Piyasası'nda Takasbank'ın konumu hangisidir?", "o": ["Açık teklif yöntemiyle merkezi karşı taraftır", "Yalnız ödünç verenin vekilidir", "Yalnızca aracı olarak emirleri iletir", "Kapalı teklif yöntemiyle saklamacıdır", "Borsa İstanbul adına takas yapar"], "a": 0, "e": "Takasbank ÖPP'yi işletir ve açık teklif yöntemiyle merkezi karşı taraftır; ödünç verene karşı ödünç alan, ödünç alana karşı ödünç veren konumundadır."}, {"q": "ÖPP'de işleme konu olabilecek kıymetler hangileridir?", "o": ["Kredili alım ve açığa satışa konu Yıldız Pazar ve Ana Pazar payları ile borsa yatırım fonları", "Alt Pazar ve Yakın İzleme Pazarı payları", "Tüm pazarlardaki paylar ve devlet tahvilleri", "Yalnız borsa yatırım fonları", "Yalnız BIST 30 payları"], "a": 0, "e": "ÖPP'de kredili alım ve açığa satışa konu Yıldız Pazar ve Ana Pazar payları ile BYF katılma belgeleri işlem görür."}, {"q": "Bir payın halka açık tutarı 10.000.000 adettir. ÖPP'de tek bir sicil bazında bu payda en fazla kaç adetlik açık işlem bulunabilir?", "o": ["500.000", "1.000.000", "2.000.000", "300.000", "100.000"], "a": 3, "e": "Tek sicil bazında sınır halka açık tutarın %3'üdür: 10.000.000 × 0,03 = 300.000. Üye bazında %5, toplamda %20 uygulanır."}, {"q": "ÖPP'de kıymet bazında uygulanan sınırlar hangisinde doğru verilmiştir (halka açık tutara oranla)?", "o": ["Toplam %10, üye %5, sicil %1", "Toplam %15, üye %5, sicil %2", "Toplam %25, üye %10, sicil %5", "Toplam %20, üye %5, sicil %3", "Toplam %20, üye %10, sicil %3"], "a": 3, "e": "Açık işlemler toplamı %20'yi, üye bazında %5'i, tek sicil bazında %3'ü geçemez."}, {"q": "ÖPP seans saatleri hangisidir?", "o": ["09:30–17:30", "09:00–16:30", "10:00–16:00", "09:30–12:00 ve 14:00–16:45", "09:30–16:45"], "a": 4, "e": "ÖPP'de işlemler tek seansta 09:30–16:45 arasında yapılır."}, {"q": "Aşağıdakilerden hangisi ÖPP'de geçerli bir vade türü değildir?", "o": ["6 ay", "2 hafta", "4 ay", "12 ay", "3 gün"], "a": 2, "e": "Vadeler 1 haftaya kadar her gün; 1, 2, 3 hafta; 1, 2, 3, 6, 9 ve 12 ay ile vadesizdir. 4 ay yoktur."}, {"q": "ÖPP'de limit ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Limit hiçbir zaman değiştirilemez", "ÖPP limiti Takasbank'ın taahhüdüdür", "Ödünç verenler için de limit şartı vardır", "Limit SPK tarafından tahsis edilir", "Ödünç alma işlemlerinin piyasa değeri toplamı ÖPP limitini aşamaz, ödünç verene limit şartı yoktur"], "a": 4, "e": "Takasbank üyeye limit tahsis eder, bu taahhüt değildir ve değiştirilebilir; ödünç alma işlemleri limiti aşamaz, ödünç verene limit şartı yoktur."}, {"q": "ÖPP'de emirlerin eşleşme önceliği nasıldır?", "o": ["Talepte en düşük, teklifte en yüksek komisyon oranı", "Talepte en yüksek, teklifte en düşük komisyon oranı; sonra zaman", "En büyük adetli emir önce", "Yalnız zaman önceliği", "En uzun vadeli emir önce"], "a": 1, "e": "Talep (ödünç alma) emirlerinde en yüksek, teklif (ödünç verme) emirlerinde en düşük komisyon oranı önceliklidir; eşitlikte zaman önceliği geçerlidir."}, {"q": "ÖPP'de komisyon oranı adımı nedir?", "o": ["%0,10", "%0,25", "%0,05", "%1", "%0,01"], "a": 2, "e": "Emir komisyon adımları %0,05 (onbinde beş) ve katlarıdır; hesapta 1 yıl 365 gün alınır."}, {"q": "ÖPP'de 1.000.000 TL piyasa değerli bir işlemde yıllık komisyon oranı %3'tür. Piyasa değeri sabit kaldığında 10 günlük işlem komisyonu yaklaşık ne kadardır?", "o": ["833 TL", "822 TL", "300 TL", "30.000 TL", "8.219 TL"], "a": 1, "e": "İşlem komisyonu günlük piyasa değeri × oran / 36500 toplamıdır: 1.000.000 × 3 × 10 / 36500 ≈ 822 TL. 833 TL, 360 gün kullanılarak bulunur."}, {"q": "ÖPP'de verilebilecek emir türleriyle ilgili hangisi yanlıştır?", "o": ["Özel emirlerde değişiklik yapılabilir", "Kalanı İptal Et emrinde gerçekleşmeyen kısım pasife yazılmaz", "Blok Eşleşmezse İptal Et emri tamamen gerçekleşmezse iptal edilir", "Özel emirde üye karşı üyesi kendisi olacak şekilde emir girebilir", "Günlük emrin gerçekleşmeyen kısmı seans sonunda iptal edilir"], "a": 0, "e": "Özel emirlerde değişiklik yapılamaz; giren ve muhatap taraf iptal edebilir."}, {"q": "ÖPP'de işlem teminatı olarak aşağıdakilerden hangisi kabul edilmez?", "o": ["Konvertibl döviz", "Banka teminat mektubu", "Varlığa dayalı menkul kıymetler", "BIST 100 endeksindeki paylar", "Standart altın"], "a": 1, "e": "ÖPP teminat listesinde teminat mektubu yer almaz; paylar (BIST 100), altın, VDMK, döviz ve DİBS kabul edilir."}, {"q": "ÖPP'de toplam teminat gereksiniminin en az ne kadarının Türk Lirası olması gerekir?", "o": ["%25", "%10", "%50", "%30", "%20"], "a": 3, "e": "Toplam teminat gereksiniminin en az %30'u TL teminattan oluşmalıdır; altına düşerse teminat tamamlama çağrısı yapılır."}, {"q": "Bir müşteri ÖPP'ye teminat olarak 100.000 USD yatırmıştır. Değerlemede kullanılan TCMB döviz alış kuru 32,00 TL ise teminatın değerlenmiş tutarı nedir?", "o": ["3.200.000 TL", "3.104.000 TL", "2.880.000 TL", "2.720.000 TL", "2.848.000 TL"], "a": 2, "e": "USD değerleme katsayısı %90'dır: 100.000 × 32 × 0,90 = 2.880.000 TL. 2.848.000 TL EUR katsayısı (%89) ile bulunur."}, {"q": "ÖPP'de toplam ödünç borcu 1.000.000 TL olan bir hesabın değerlenmiş teminatı 1.080.000 TL'ye düşmüştür. Hangisi doğrudur?", "o": ["Ödünç işlemleri derhal iptal edilir", "Ödünç verenden ek teminat istenir", "Sürdürme seviyesi %100'ün üzerinde olduğundan çağrı yapılmaz", "Sürdürme seviyesi %110'un altında olduğundan teminat tamamlama çağrısı yapılır", "Çağrı ancak teminat %97'ye düşünce yapılır"], "a": 3, "e": "Sürdürme seviyesi teminat / ödünç borcu = %108'dir; %110'un altına düştüğü için başlangıç oranına tamamlama çağrısı yapılır. Ödünç verenden teminat istenmez."}, {"q": "ÖPP'de altın teminata hangi koşulla verilebilir?", "o": ["KMKTP'de işlem gören külçe altınlardan 100 gram ve katları şeklinde", "Her ağırlıkta külçe olarak", "1 kilogram ve katları şeklinde", "Ziynet altın olarak", "Yalnızca altın sertifikası olarak"], "a": 0, "e": "Altın, Borsa KMKTP'de işlem gören külçelerden 100 gram ve katları şeklinde, Takasbank'ın saklama hesabına virman yoluyla yatırılır."}, {"q": "ÖPP garanti fonunun büyüklüğü için hangisi doğrudur?", "o": ["SPK tarafından sabit tutar olarak belirlenir", "Üyelerin katılımı isteğe bağlıdır", "En çok ödünç borcu olan üye ile ikinci ve üçüncü üyenin birlikte temerrüdü halindeki kaynak ihtiyacından büyük olanından az olamaz", "Yalnız en büyük üyenin teminatı kadardır", "Tüm üyelerin ödünç borcunun %10'u kadardır"], "a": 2, "e": "Garanti fonu, en büyük borçlu üye ile ikinci ve üçüncü üyenin birlikte stres koşullarında temerrüdü halindeki ihtiyaçlardan büyüğünden az olamaz; MKT üyelerinin katılımı zorunludur."}, {"q": "Ödünce konu paylardan doğan haklarla ilgili hangisi doğrudur?", "o": ["Kâr payı MKK'da bloke edilir", "Mali haklar ödünç alana aittir", "Ödünç veren hem mali haklarını hem oy hakkını korur", "Haklar Takasbank'a aittir", "Mali haklar ödünç verene aittir, ancak ödünç veren oy hakkını kaybeder"], "a": 4, "e": "Bedelli, bedelsiz ve kâr payı gibi mali haklar ödünç verene aittir; ödünç veren yönetsel hakkını, yani oy hakkını kaybeder."}, {"q": "1.000 adet pay ödünç alan bir üyenin işlem vadesi içinde paya %50 bedelsiz sermaye artırımı yapılmıştır. Ödünç alan vadede kaç adet pay iade etmelidir?", "o": ["1.500", "1.050", "500", "1.000", "2.000"], "a": 0, "e": "Bedelsiz artırım günü borç adedi oran kadar artar: 1.000 + 1.000 × 0,50 = 1.500 pay."}, {"q": "ÖPP'de bedelli sermaye artırımında ödünç verenin Takasbank üzerinden katılım beyanı ve artırım için son saatler hangisidir?", "o": ["Beyan 17:00, artırım 17:15", "Beyan 12:00, artırım 16:45", "Beyan 16:15, artırım 16:20", "Beyan 15:30, artırım 16:00", "Beyan 16:00, artırım 16:15"], "a": 4, "e": "Beyan son saati 16:00, artırım son saati 16:15'tir; artırım yapılmazsa R kodlu işlemler 16:20'de iptal olur."}, {"q": "ÖPP'de vadesiz işlemde ödünç veren saat 11:00'de geri çağırma bildirimi yapmıştır. Ödünç alan kıymeti ne zaman iade etmelidir?", "o": ["T+0", "T+1", "T+2", "T+5", "T+3"], "a": 2, "e": "Geri çağırma 12:00'ye kadar bildirilirse iade T+2'de, 12:00'den sonra bildirilirse T+3'te yapılır."}, {"q": "ÖPP'de vadesi gelen ödünç borcu son kapama saatinde kapanmayan ve aynı gün 17:30'dan sonra kapatılan bir borç için temerrüt faiz oranı nasıl belirlenir?", "o": ["En yüksek oranın %50'si", "Gecelik faiz oranlarının iki katı, sözleşme komisyonu ve ağırlıklı ortalama komisyon oranından en yüksek olanı", "Sabit %10", "Sözleşme komisyon oranı", "TCMB politika faizi"], "a": 1, "e": "17:30'dan sonra kapanan borçta gecelik oranların iki katı ile komisyon oranlarından en yükseği uygulanır; 17:30'a kadar kapanırsa en yüksek oranın %50'si, 1 günlük uygulanır."}, {"q": "ÖPP'de aynı gün valörlü işlemlerde ödünce konu kıymetin takası ne zaman yapılır?", "o": ["Vade sonunda", "Ödünç işleminin gerçekleştiği anda", "T+2", "Gün sonunda 17:00'de", "T+1"], "a": 1, "e": "Aynı gün valörlü işlemlerde takas işlem anında, ileri valörlülerde valör günü yapılır."}]}, {"id": 12, "kisa": "Takasbank Para Piyasası", "baslik": "Takasbank Para Piyasası (TPP)", "ozet": "Takasbank'ın garantisindeki TL para piyasası: üyeler, limitler, saat ve vadeler, emir türleri, teminat oranları, netleştirme ve takas, komisyon, garanti fonu ve temerrüt faizi.", "notlar": "<h3>Tanım ve Takasbank'ın konumu<\/h3>\n<ul>\n<li><b>TPP<\/b>, TL fon fazlası veya ihtiyacı olan üyelerin talep ve tekliflerini buluşturan, <b>1 Ekim 1996<\/b>'da Takasbank bünyesinde kurulan <b>organize para piyasası<\/b>dır.<\/li>\n<li>Takasbank TPP'yi işletir; yükümlülükleri teminatlar, garanti fonu ve TPP'ye tahsis ettiği <b>sermayesi<\/b> ile yerine getirmeyi taahhüt eder; işlemler <b>Takasbank garantisi<\/b> altındadır.<\/li>\n<li>Dikkat: Takasbank <b>kotasyon vermez ve işlemlere katılımcı olmaz<\/b>.<\/li>\n<li>Takasbank'ın yükümlülüğü emirler eşleştiği anda başlar, tasfiyeyle biter.<\/li>\n<\/ul>\n\n<h3>Üyeler ve üyelik şartları<\/h3>\n<ul>\n<li>Üye olabilecekler: aracı kurumlar ve bankalar; finansal kiralama, faktoring ve finansman şirketleri; varlık yönetim şirketleri; sigorta ve emeklilik şirketleri; Kamu Haznedarlığı Yönetmeliği kapsamındaki kurumlar; özel kanunlu ve belirlenmiş katkı esaslı emekli yardım sandıkları; <b>TCMB (doğal üye)<\/b>; ipotek finansmanı kuruluşları.<\/li>\n<li>Şartlar: mevzuatında engel olmaması, <b>TPP Sözleşmesi<\/b>, özkaynağın mevzuattaki tutardan az olmaması, <b>garanti fonu katkı payının<\/b> yatırılması, istenen belgeler.<\/li>\n<\/ul>\n\n<h3>Tarafların yükümlülükleri<\/h3>\n<ul>\n<li><b>Para alan<\/b> (borçlanan) vadede anapara ve faizi öder; <b>vadeden önce ödeyip işlemi bitirme hakkı yoktur<\/b>.<\/li>\n<li><b>Para satan<\/b> (borç veren) valörde anaparayı öder; BSMV, gelir vergisi gibi vergilerden resmi mercilere karşı sorumludur.<\/li>\n<li>Temsilci: en fazla <b>8 kişi<\/b>, yazılı yetkilendirme; ilk girişte şifre değiştirilir; şifreyle iletilen emirden üye sorumlu.<\/li>\n<\/ul>\n\n<h3>Limitler<\/h3>\n<ul>\n<li>Takasbank <b>TPP limiti<\/b> ve yatırım fonu, yatırım ortaklığı ve <b>kamu kaynağı<\/b> için <b>Fon limiti<\/b> tahsis eder (taahhüt değildir). Fon limiti portföy ve müşteri işlemlerinde kullanılamaz. İkisinin toplamı <b>TPP Toplam Limit<\/b>.<\/li>\n<li><b>Alış limiti:<\/b> portföy ve müşteri işlemlerinde TPP limitini, fon/YO/kamu kaynağı işlemlerinde TPP Toplam Limitini aşamaz; değerlenmiş teminat dahilinde kullanılır; emirde anapara + faize karşılık teminat yeterliliği kontrol edilir.<\/li>\n<li><b>Satış limiti:<\/b> TPP limiti + vadesi gelen satışlar − toplam alışlar; serbest hesaptan yapılan borç kapama kadar artar; <b>Blokeli Satış Emrinden etkilenmez<\/b>.<\/li>\n<\/ul>\n\n<h3>İşleyiş kuralları<\/h3>\n<table><tr><th>Kural<\/th><th>Değer<\/th><\/tr>\n<tr><td>İşlem saati<\/td><td>Aynı gün valörlü, <b>09:30–15:30<\/b><\/td><\/tr>\n<tr><td>Vade<\/td><td>Gecelik (O/N) ile <b>2 ay<\/b> arası her gün; ayrıca 2, 3 ve 6 ay vadeleri ile bunların öncesi ve sonrasındaki üç iş günü<\/td><\/tr>\n<tr><td>Tutar<\/td><td>Asgari <b>5.000 TL<\/b>, 1.000 TL katları<\/td><\/tr>\n<tr><td>Faiz adımı<\/td><td><b>%0,05<\/b> ve katları; 1 yıl = 365 gün<\/td><\/tr>\n<tr><td>Karşılanmayan emir<\/td><td>Seans sonunda (15:30) iptal<\/td><\/tr>\n<\/table>\n<p>Yatırım fonları, emeklilik fonları ve yatırım ortaklıkları adına işlemler <b>SPK<\/b> mevzuatındaki sınırlar içinde yapılır.<\/p>\n\n<h3>Emirler<\/h3>\n<ul>\n<li>Unsurlar: müşteri tipi (portföy, müşteri, YF-YO, kamu kaynağı), YF/YO kodu, emir tipi (<b>alış, satış, blokeli satış<\/b>), emir türü, süre, faiz oranı (yalnız limitli türlerde), tutar.<\/li>\n<li>Alış emri için yeterli <b>limit ve teminat<\/b>; satış emri için yeterli <b>limit<\/b> gerekir (blokeli satış hariç).<\/li>\n<li><b>Blokeli Satış Emri:<\/b> serbest hesabında satacağı tutar kadar bakiyesi olan üyenin <b>risk oluşturmayan<\/b> satış emri; tutar bloke edilir, eşleşince tahsil edilir. Satış limitini etkilemez; <b>limit tahsis edilmemiş üyeler de<\/b> kullanabilir.<\/li>\n<li>Değişiklik: yalnız <b>tutar azaltımı<\/b> emir numarasını ve önceliği korur; müşteri tipi, kod, oran değişikliği ve tutar artırımı önceliği değiştirir. Çoklu iptal mümkün.<\/li>\n<\/ul>\n<table><tr><th>Emir türü<\/th><th>Faiz oranı<\/th><th>Tam gerçekleşme koşulu<\/th><th>Kalan kısım<\/th><\/tr>\n<tr><td>Limitli<\/td><td>Var<\/td><td>Yok<\/td><td>Pasifte bekler<\/td><\/tr>\n<tr><td>Limitli Gerçekleşmezse İptal Et (LGİE)<\/td><td>Var<\/td><td>Var<\/td><td>Tamamı gerçekleşmezse iptal<\/td><\/tr>\n<tr><td>Limitli Kalanı İptal Et (LKİE)<\/td><td>Var<\/td><td>Yok<\/td><td>İptal<\/td><\/tr>\n<tr><td>Piyasa<\/td><td>Yok<\/td><td>Yok<\/td><td>İptal<\/td><\/tr>\n<tr><td>Piyasa Gerçekleşmezse İptal Et (PGİE)<\/td><td>Yok<\/td><td>Var<\/td><td>Tamamı gerçekleşmezse iptal<\/td><\/tr>\n<\/table>\n<h4>Eşleşme<\/h4>\n<ul>\n<li><b>Alışta en yüksek, satışta en düşük<\/b> faiz oranı; sonra zaman.<\/li>\n<li>Aynı üyenin kendi emirlerini karşılamasında <b>15 saniye<\/b> bekleme süresi; 15 saniye dolmadan gelen karşıt emir başka üyelerle eşleşebilecekse onlarla eşleşir, kalanı iptal olur.<\/li>\n<li>Aynı üyenin emirlerinden biri fon/YO/kamu kaynağı adınaysa, <b>o emrin önce iletilmiş olması<\/b> gerekir; aksi halde eşleşmez.<\/li>\n<li>Hatalı müşteri tipi düzeltmesi aynı gün talep edilir, ücrete tabidir.<\/li>\n<li>Örnek: bekleyen alışlar %10,00/100.000, %9,90/200.000, %9,00/50.000 iken %9,90/400.000 limitli satış gelirse 100.000 %10'dan, 200.000 %9,90'dan gerçekleşir, 100.000 bekler (LKİE'de iptal, LGİE'de tamamı iptal).<\/li>\n<li>Ekranlarda en iyi <b>beş<\/b> teklif ve talep izlenir. Her sabah <b>Gün Başı Bilgileri<\/b> raporu: limitler, teminat değerlemesi, temerrütler, net borç-alacak.<\/li>\n<\/ul>\n\n<h3>Teminatlar<\/h3>\n<table><tr><th>Teminat<\/th><th>Değerleme katsayısı<\/th><th>Grup üst limiti<\/th><th>Kıymet bazında üst limit<\/th><\/tr>\n<tr><td>Altın<\/td><td>0,88<\/td><td>%25<\/td><td>%100<\/td><\/tr>\n<tr><td>Borsa İstanbul payları<\/td><td>1,00<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>DİBS (TL, USD, EUR)<\/td><td>0–1 yıl 0,94; 1–5 yıl 0,81; 5 yıl+ 0,78<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>Eurotahvil USD<\/td><td>0,89 / 0,89 / 0,88 / 0,86<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>Kira sertifikası<\/td><td>0,92 / 0,79 / 0,76<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>Pay (BIST 30 / BIST 100)<\/td><td>0,84 / 0,83<\/td><td><b>%90<\/b><\/td><td>%50<\/td><\/tr>\n<tr><td>Nakit TL / USD / EUR<\/td><td>1,00 / 0,90 / 0,89<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>Banka bonosu / tahvili<\/td><td><b>0,73<\/b><\/td><td>%50<\/td><td>%40<\/td><\/tr>\n<tr><td><b>Teminat mektubu<\/b><\/td><td>1,00<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>Varlığa dayalı menkul kıymet<\/td><td>0,92 / 0,79 / 0,76<\/td><td>%50<\/td><td>%40<\/td><\/tr>\n<tr><td>Şemsiye fon payı: hisse / borçlanma / para piyasası<\/td><td>0,88 / 0,93 / 0,97<\/td><td>%50<\/td><td>%20<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: TPP'de <b>teminat mektubu kabul edilir<\/b> (ÖPP'de edilmez). E-teminat mektubu olmalı, KKB'nin <b>ETMP<\/b> platformunda kontrol edilir; kesin ve süresiz veya kesin ve <b>en az 1 yıl<\/b> vadeli; aynı grup/holding bankalarının mektupları kabul edilmez.<\/li>\n<li>Teminat <b>yalnız portföy hesabından<\/b> verilir; müşteri hesabından verilemez. Giriş-çıkış son saati <b>17:00<\/b> (yarım günde 12:30); yazılı talimat asılları 5 iş günü içinde.<\/li>\n<li>Paylar: BIST 100; kotayı aşamaz; üyenin <b>iştiraki veya ortağı<\/b> olduğu şirket payı kabul edilmez. Banka bonosu: TL cinsi, ihraççı limiti dahilinde, grup bankası ihracı kabul edilmez, talimattan bir iş günü sonra teminata alınır.<\/li>\n<li>Yatırım fonu: yalnız hisse, borçlanma araçları ve para piyasası şemsiye fonları; grup şirketlerinin kurucusu olduğu fonlar kabul edilmez.<\/li>\n<li>Döviz ödemeli DİBS ve vadeli teminat mektupları vadesine <b>5 iş günü<\/b> kala değerlemeye alınmaz.<\/li>\n<\/ul>\n<table><tr><th>Teminat oranı<\/th><th>Değer<\/th><\/tr>\n<tr><td>Başlangıç teminatı<\/td><td>Alış emrinin anapara + faizinin <b>%105<\/b>'i<\/td><\/tr>\n<tr><td>Zorunlu teminat (teminat mektubu dışındaki varlıklardan)<\/td><td><b>%2, %4 veya %6<\/b>; dilim, 3 aylık açık alış ortalamasının özkaynağa oranına göre<\/td><\/tr>\n<tr><td>Asgari teminat (sürdürme)<\/td><td><b>%104<\/b> = kullanılabilir teminat / toplam borç alınmış tutar<\/td><\/tr>\n<tr><td>Satış işlemleri<\/td><td><b>Teminat aranmaz<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Kullanılabilir teminat asgari veya zorunlu seviyenin altına düşerse <b>teminat tamamlama çağrısı<\/b>; başlangıç seviyesine aynı gün sonuna kadar tamamlanır. Çağrıdaki üye limit ve teminatın izin verdiği kadar işlem yapabilir; Takasbank ek süre verebilir.<\/li>\n<li>Nakit TL teminat ve garanti fonu katkıları <b>15:40<\/b> bakiyesi üzerinden nemalandırılır (yarım günde 11:40); nemalanan tutar çıkılamaz.<\/li>\n<\/ul>\n\n<h3>Ödemeler<\/h3>\n<ul>\n<li><b>Netleştirme:<\/b> <b>15:45<\/b> (yarım günde 11:45); valör ve vade bazında; temerrüt dışında günler arası netleştirme yok.<\/li>\n<li><b>Takas:<\/b> nette borçlu üye en geç <b>16:00<\/b>'ya kadar TPPTK hesabından öder; alacaklılara 16:00'da serbest hesaba kaydedilir. Kısmi ödemede alacak dağıtımı <b>oransal<\/b>.<\/li>\n<li><b>Mahsup:<\/b> TPP net alacağı BİST <b>Borçlanma Araçları ve Pay Piyasası<\/b> borçlarına; bu piyasalardaki MKT alacakları TPP borcuna mahsup edilebilir.<\/li>\n<\/ul>\n<table><tr><th>Takasbank komisyonu (alıcı ve satıcıdan, işlem günü)<\/th><th>Oran<\/th><\/tr>\n<tr><td>Vadesi bir haftaya kadar (7 gün dahil)<\/td><td>Anaparanın <b>%0,003<\/b> (yüz binde 3)<\/td><\/tr>\n<tr><td>Diğer vadeler<\/td><td>Anaparanın <b>%0,00035 × gün sayısı<\/b> (milyonda 3,5 × gün)<\/td><\/tr>\n<\/table>\n\n<h3>Garanti fonu ve sermaye tahsisi<\/h3>\n<ul>\n<li>Katılım zorunlu; katkılar üyenin kendi mülkiyetindeki varlıklardan; Takasbank temsil ve idare eder.<\/li>\n<li>Temerrüde düşenin teminatı, katkı payı ve Takasbank'ın sermaye tahsisi yetmedikçe diğer üyelerin katkılarına başvurulamaz.<\/li>\n<li>Büyüklük: en fazla alış borcu olan üye ile ikinci ve üçüncü üyenin birlikte temerrüdü halindeki ihtiyaçların büyüğünden az olamaz. Yeterlilik en geç <b>3 ayda bir<\/b> sınanır; geçmiş üç ayın günlük açık alış verisi kullanılır.<\/li>\n<li><b>Sabit katkı payı 100.000 TL<\/b>; yılda en az bir kez gözden geçirilir. Değişken katkı dilimlidir. Yükümlülük her ayın son iş günü hesaplanır.<\/li>\n<li>Garanti fonuna <b>teminat mektubu kabul edilmez<\/b>. Katkı tek portföy hesabından verilir. Tamamlama yükümlülüğü <b>ertesi iş günü gün sonuna<\/b> kadar yerine getirilmezse temerrüt.<\/li>\n<li>Sermaye tahsisatı her yıl <b>1 Nisan–31 Mart<\/b> dönemi için Takasbank sitesinde duyurulur.<\/li>\n<\/ul>\n\n<h3>Temerrüt<\/h3>\n<ul>\n<li>Borçlu üye takas saati <b>16:00<\/b> itibarıyla ödemezse temerrüde düşer.<\/li>\n<li>Temerrüt faizi, BİST kamu repo pazarları, TCMB Bankalararası Para Piyasası veya TPP'deki gecelik ağırlıklı ortalama oranlardan <b>en yükseği<\/b> üzerinden:<\/li>\n<\/ul>\n<table><tr><th>Borcun kapatıldığı zaman<\/th><th>Temerrüt faizi<\/th><th>Üst sınır<\/th><\/tr>\n<tr><td><b>16:30<\/b>'a kadar (yarım günde 12:30)<\/td><td>En yüksek oranın <b>%50<\/b>'si<\/td><td>Var; Hazine'nin yeniden değerleme oranıyla yıllık belirlenir<\/td><\/tr>\n<tr><td>16:30'dan sonra<\/td><td>En yüksek oranın <b>iki katı<\/b><\/td><td>Yok<\/td><\/tr>\n<\/table>\n<ul>\n<li>Temerrütteki üye Nakit Kredi kullanamaz; Nakit Kredi temerrüdündeki üye TPP'de işlem yapamaz.<\/li>\n<li><b>Mağduriyet ödemesi:<\/b> eksik ödeme alan üyeye talep aranmadan, tahsil edilen temerrüt faizinin <b>2/3<\/b>'ü; aynı gün gecikmeli ödemede yapılmaz; faiz tahsil edilmezse ödenmez. Şartlar: temerrüt Borsa, Takasbank, MKK, TCMB sistem sorunundan kaynaklanmamalı, alacaklı yükümlülüğünü zamanında yapmış olmalı.<\/li>\n<\/ul>", "sorular": [{"q": "Takasbank Para Piyasası hangi tarihte kurulmuştur?", "o": ["19 Aralık 2019", "2 Nisan 1986", "14 Ekim 2016", "1 Ekim 1996", "17 Haziran 1991"], "a": 3, "e": "TPP 1 Ekim 1996'da Takasbank bünyesinde kuruldu. 2 Nisan 1986 TCMB Bankalararası Para Piyasası'nın kuruluş tarihidir."}, {"q": "TPP'de Takasbank'ın konumu ile ilgili hangisi yanlıştır?", "o": ["İşlemlerden doğan yükümlülükler Takasbank'ın garantisi altındadır", "TPP'yi işleten kurumdur", "Yükümlülüğü emirler eşleştiği anda başlar", "Yükümlülükleri teminat, garanti fonu ve tahsis ettiği sermayesiyle karşılar", "Piyasada alış satış kotasyonu vererek işlemlere katılır"], "a": 4, "e": "Takasbank TPP'de alış satış kotasyonu vermez ve işlemlerde katılımcı olmaz."}, {"q": "Aşağıdakilerden hangisi TPP'ye doğal üye olarak belirtilmiştir?", "o": ["TCMB", "Borsa İstanbul", "Hazine ve Maliye Bakanlığı", "SPK", "MKK"], "a": 0, "e": "Üye olabilecek kurumlar arasında T.C. Merkez Bankası doğal üye olarak sayılmıştır."}, {"q": "TPP'de işlem saatleri ve vadeler hangisinde doğru verilmiştir?", "o": ["10:00–16:00; yalnız gecelik", "09:30–16:45; 1 haftaya kadar her gün", "09:00–15:00; O/N ile 30 gün arası", "09:30–15:30; O/N ile 2 ay arası her gün ve 2, 3, 6 ay ile bunların öncesi ve sonrasındaki üç iş günü", "09:30–17:30; O/N ile 1 yıl arası"], "a": 3, "e": "TPP'de işlemler aynı gün valörlü olarak 09:30–15:30 arasında; vadeler O/N ile 2 ay arası her gün ve 2, 3, 6 ay ile bunların öncesi ve sonrasındaki üç iş günüdür."}, {"q": "TPP'de asgari emir tutarı ve faiz adımı hangisidir?", "o": ["5.000 TL / %0,05", "10.000 TL / %0,05", "1.000 TL / %0,01", "100.000 TL / %0,01", "5.000 TL / %0,25"], "a": 0, "e": "Asgari tutar 5.000 TL olup 1.000 TL katları şeklinde artar; faiz adımı %0,05 ve katlarıdır."}, {"q": "TPP'de para alan (borçlanan) üye ile ilgili hangisi doğrudur?", "o": ["Vadede anapara ve faizi öder, vadeden önce ödeyip işlemi sonlandırma hakkı yoktur", "Valörde anaparayı Takasbank'a öder", "Teminat vermez", "Vadeden önce borcunu ödeyerek işlemi sonlandırabilir", "BSMV'den resmi mercilere karşı sorumludur"], "a": 0, "e": "Para alan üye vadede anapara ve faizi öder; vadeden önce borcunu ödeyip işlemi sonlandırma hakkı yoktur. Valörde anapara ödeyen ve vergilerden sorumlu olan para satan üyedir."}, {"q": "TPP'de Blokeli Satış Emri için hangisi yanlıştır?", "o": ["Yalnızca TPP limiti yeterli olan üyeler girebilir", "Risk oluşturmayan bir satış emri tipidir", "Satış limitini etkilemez", "Tutar emri giren üyenin serbest hesabında bloke edilir", "Limit tahsis edilmemiş üyeler de kullanabilir"], "a": 0, "e": "Limit tahsis edilmemiş üyeler de blokeli satış emriyle satış yapabilir; bu emir satış limitinden etkilenmez."}, {"q": "TPP'de pasif bir emirde yapılan hangi değişiklik emir numarasını ve önceliği değiştirmez?", "o": ["Tutar azaltımı", "Müşteri tipi değişikliği", "Faiz oranı değişikliği", "Tutar artırımı", "Yatırım fonu kodu değişikliği"], "a": 0, "e": "Yalnız emir tutarının azaltılması numara ve önceliği korur; diğer tüm değişiklikler önceliği değiştirir."}, {"q": "TPP'de bekleyen alış emirleri sırasıyla %10,00/100.000 TL, %9,90/200.000 TL ve %9,00/50.000 TL'dir. %9,90/400.000 TL Limitli Kalanı İptal Et (LKİE) satış emri girilirse sonuç ne olur?", "o": ["350.000 TL gerçekleşir, 50.000 TL bekler", "Yalnız 100.000 TL gerçekleşir", "300.000 TL gerçekleşir, kalan 100.000 TL iptal olur", "300.000 TL gerçekleşir, kalan 100.000 TL pasifte bekler", "400.000 TL'nin tamamı iptal olur"], "a": 2, "e": "Satış emri %9,90 ve üzeri alışlarla eşleşir: 100.000 TL %10'dan, 200.000 TL %9,90'dan. %9,00'lık emirle eşleşmez. LKİE'de kalan 100.000 TL iptal olur; limitli emirde beklerdi."}, {"q": "TPP'de aynı üyenin kendi emirlerini karşılaması için uygulanan bekleme süresi nedir?", "o": ["5 saniye", "15 saniye", "30 saniye", "1 dakika", "Bekleme süresi yoktur"], "a": 1, "e": "Aynı kuruluşun portföy, müşteri veya fon adına emirlerini kendisinin karşılaması için bekleme süresi 15 saniyedir."}, {"q": "Aşağıdakilerden hangisi TPP işlem teminatı olarak kabul edilir, ancak ÖPP'de teminat olarak kabul edilmez?", "o": ["Altın", "Nakit TL", "BIST 100 payları", "Devlet iç borçlanma senedi", "Teminat mektubu"], "a": 4, "e": "TPP'de e-teminat mektubu değerleme katsayısı 1,00 ile işlem teminatı olarak kabul edilir; ÖPP teminat listesinde teminat mektubu yoktur. Garanti fonu katkı payı olarak ise TPP'de de kabul edilmez."}, {"q": "TPP'de banka bonosu ve tahvilinin teminat değerleme katsayısı nedir?", "o": ["0,89", "0,94", "0,83", "0,73", "1,00"], "a": 3, "e": "Banka bonosu ve tahvilinin değerleme katsayısı 0,73, grup limiti %50, kıymet bazında limiti %40'tır."}, {"q": "TPP'de başlangıç teminat oranı ve asgari teminat (sürdürme) oranı hangisidir?", "o": ["%110 / %105", "%120 / %110", "%100 / %97", "%104 / %102", "%105 / %104"], "a": 4, "e": "Başlangıç teminatı alış emrinin anapara ve faiz toplamının %105'i; asgari teminat oranı %104'tür."}, {"q": "Bir üye TPP'de gecelik vadeli, %36 faizli 1.000.000 TL'lik alış (borçlanma) emri girecektir. Gereken başlangıç teminatı yaklaşık ne kadardır?", "o": ["1.428.000 TL", "1.051.036 TL", "1.040.000 TL", "1.050.000 TL", "1.000.986 TL"], "a": 1, "e": "Faiz = 1.000.000 × 0,36 / 365 ≈ 986 TL; anapara + faiz ≈ 1.000.986 TL; × %105 ≈ 1.051.036 TL. 1.050.000 TL, faizin unutulmasıyla bulunur."}, {"q": "TPP'de uygulanan zorunlu teminat oranları hangileridir?", "o": ["%4, %8, %12", "%2, %4, %6", "%3, %5, %7", "%1, %2, %3", "%5, %10, %15"], "a": 1, "e": "Zorunlu teminat oranları %2, %4 ve %6'dır; üyenin 3 aylık açık alış ortalamasının özkaynağına oranına göre dilim belirlenir ve teminat mektubu dışındaki varlıklardan oluşmalıdır."}, {"q": "TPP'de teminat yatırma ile ilgili hangisi doğrudur?", "o": ["Üyenin iştiraki olduğu şirketin payları teminata kabul edilir", "Teminat giriş-çıkış son saati tam günde 15:30'dur", "Üyeler müşteri hesaplarından teminat verebilir", "Teminat mektubu kesin ve süresiz veya kesin ve en az 1 yıl vadeli e-teminat mektubu olmalıdır", "Tüm yatırım fonları teminata kabul edilir"], "a": 3, "e": "Teminat mektubu elektronik olmalı, kesin ve süresiz veya kesin ve en az 1 yıl vadeli olmalıdır. Teminat yalnız portföyden verilir, iştirak payları kabul edilmez, son saat 17:00'dir."}, {"q": "TPP'de netleştirme ve nette borçlu üyenin son ödeme saatleri hangisidir?", "o": ["15:30 / 16:00", "16:00 / 16:30", "15:45 / 16:00", "15:45 / 17:00", "15:40 / 15:45"], "a": 2, "e": "Netleştirme 15:45'te yapılır; nette borçlu üyeler en geç 16:00'ya kadar öder, alacaklılara 16:00'da kayıt yapılır."}, {"q": "TPP'de 10.000.000 TL anaparalı, 30 gün vadeli bir işlemde her bir taraftan alınacak Takasbank komisyonu (BSMV hariç) ne kadardır?", "o": ["3.500 TL", "9.000 TL", "1.050 TL", "300 TL", "105 TL"], "a": 2, "e": "Bir haftayı aşan vadede oran milyonda 3,5 × gün sayısıdır: 10.000.000 × 0,0000035 × 30 = 1.050 TL. 300 TL, bir haftaya kadar vadelerdeki yüz binde 3 oranıyla bulunur."}, {"q": "TPP üyelerinin yatırması gereken sabit garanti fonu katkı payı tutarı nedir?", "o": ["1.000.000 TL", "500.000 TL", "100.000 TL", "10.000 TL", "50.000 TL"], "a": 2, "e": "Sabit katkı payı 100.000 TL'dir; yılda en az bir kez gözden geçirilir. Garanti fonuna teminat mektubu kabul edilmez."}, {"q": "TPP'de borçlu üye takas saatinde ödeme yapmamış ve borcunu aynı gün 16:15'te kapatmıştır. İlgili gecelik ağırlıklı ortalama oranların en yükseği %40 ise uygulanacak temerrüt faiz oranı nedir?", "o": ["%10", "%20", "%60", "%80", "%40"], "a": 1, "e": "16:30'a kadar kapatılan borçlarda en yüksek gecelik oranın %50'si uygulanır: 40 × 0,50 = %20. 16:30'dan sonra kapatılsaydı iki katı, yani %80 uygulanırdı."}, {"q": "TPP'de mağduriyet ödemesi ile ilgili hangisi doğrudur?", "o": ["Aynı gün içindeki gecikmeli ödemelerde de yapılır", "Tahsil edilen temerrüt faizinin 2/3'ü ödenir", "Alacaklı üyenin yazılı talebi şarttır", "Temerrüt faizinin tamamı ödenir", "Temerrüt faizi tahsil edilmese de Takasbank öder"], "a": 1, "e": "Mağduriyet ödemesi talep aranmadan, tahsil edilen temerrüt faizinin 2/3'ü olarak yapılır; aynı gün gecikmeli ödemelerde ve faiz tahsil edilmezse yapılmaz."}, {"q": "TPP üyeleri TPP'deki net alacaklarını hangi piyasalardaki borçlarına mahsup edebilir?", "o": ["Kıymetli Madenler Piyasası", "TEFAS", "VİOP", "TCMB Bankalararası Para Piyasası", "Borsa İstanbul Borçlanma Araçları ve Pay Piyasası"], "a": 4, "e": "TPP net alacakları BİST Borçlanma Araçları Piyasası ile Pay Piyasası işlemlerinden doğan borçlara mahsup edilebilir; tersi de mümkündür."}]}, {"id": 13, "kisa": "TEFAS ve BEFAS", "baslik": "Türkiye Elektronik Fon Alım Satım Platformu (TEFAS) ve Bireysel Emeklilik Fon Alım Satım Platformu (BEFAS)", "ozet": "Takasbank'ın işlettiği iki fon platformu: üyeler, işlem gören fonlar, saat tabloları, talimat türleri, işlem limiti ve teminat, netleştirme, temerrüt faizi/cezası katsayıları ve komisyonlar.", "notlar": "<h3>TEFAS: tanım ve hukuki çerçeve<\/h3>\n<ul>\n<li><b>TEFAS<\/b>, yatırım fonu katılma paylarının kurucular tarafından platformdaki <b>dağıtım kuruluşları<\/b> aracılığıyla satılıp geri alındığı, takas ve saklamanın <b>Takasbank–MKK<\/b> entegrasyonuyla tam otomasyonla yapıldığı elektronik platformdur.<\/li>\n<li>Dayanak: III-52.1 Yatırım Fonlarına İlişkin Esaslar Tebliği <b>m.15/7<\/b>; SPK ilke kararları i-SPK.52.2 (07.03.2014) ve i-SPK.52.4.ş (09.05.2019).<\/li>\n<\/ul>\n<h3>TEFAS üyeleri ve fonlar<\/h3>\n<ul>\n<li>İşlem yapabilenler: <b>fon kurucuları<\/b>, portföy veya işlem aracılığı izni olan <b>yatırım kuruluşları<\/b>, fon payı pazarlama ve dağıtım izni olan <b>portföy yönetim şirketleri<\/b>. Kurucular <b>Kurucu Sözleşmesi<\/b>, dağıtıcılar <b>Dağıtım Kuruluşu Sözleşmesi<\/b> imzalar.<\/li>\n<li>SPK'nın zorunlu tuttuğu fonlar dışında kurucu talep ederse para piyasası, para piyasası katılım, kısa vadeli tahvil-bono, kısa vadeli kira sertifikaları katılım ve <b>serbest fonlar<\/b> da kabul edilebilir.<\/li>\n<li>Dikkat: TEFAS'ta işlem <b>göremeyenler<\/b>: özel fonlar, gayrimenkul yatırım fonları, girişim sermayesi yatırım fonları, <b>garantili ve anapara koruma amaçlı fonlar<\/b>.<\/li>\n<li>PYŞ'lerin kendi müşterilerine kendi kurucusu oldukları fonların işlemlerini TEFAS'tan yapması zorunlu değildir. Bu istisnalar dışında TEFAS'a üye fonların alım satımı <b>yalnız TEFAS<\/b> üzerinden.<\/li>\n<li>Serbest fon payları platformda <b>yalnız nitelikli yatırımcılara<\/b> satılır.<\/li>\n<li>Kurucunun faaliyeti durdurulursa fonların işlem görmeye devamını, SPK kararındaki esaslara göre <b>Takasbank<\/b> belirler.<\/li>\n<li>İşlem yapılamayacak haller: SPK faaliyetini durdurursa yeniden başlama kararı Takasbank'a tebliğ edilene kadar; borçlarını <b>1 aylık dönemde 3 kez<\/b> süresinde kapatmazsa <b>5 iş günü<\/b>. Kısıtlama kurucunun geri alım yükümlülüğünü kaldırmaz.<\/li>\n<\/ul>\n\n<h3>TEFAS işlem saatleri<\/h3>\n<table><tr><th>İşlem<\/th><th>Tam iş günü<\/th><th>Yarım gün<\/th><\/tr>\n<tr><td>Talimat kabul, aynı gün valörlü<\/td><td><b>09:00–13:30<\/b><\/td><td>09:00–11:30<\/td><\/tr>\n<tr><td>Talimat kabul, ileri valörlü<\/td><td><b>09:00–17:45<\/b><\/td><td>09:00–12:30<\/td><\/tr>\n<tr><td>Eşleşmeyen talimat iptali (aynı gün / ileri valör)<\/td><td>13:35 / 17:50<\/td><td>11:35 / 12:35<\/td><\/tr>\n<tr><td>Valör atlatma saati<\/td><td>13:30<\/td><td>11:30<\/td><\/tr>\n<tr><td>Nakit netleştirme TL / YP<\/td><td><b>14:00 / 12:30<\/b><\/td><td>12:00 / yok<\/td><\/tr>\n<tr><td>Temerrüt başlangıcı TL / YP<\/td><td><b>15:00 / 15:45<\/b><\/td><td>12:30 / yok<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kurucu/Operatör üye genel saatler içinde farklı saatler belirleyebilir. Fon fiyatı Takasbank'ın belirlediği son saate kadar sisteme girilir; fiyatı olmayan fonda talimat ve işlem yok.<\/li>\n<li>Fiyat aynı gün valörlüde işlem fiyatıdır; ileri valörlüde bloke tutar için kullanılır, işlem <b>fiyat valörü<\/b> tarihindeki fiyattan yapılır.<\/li>\n<\/ul>\n\n<h3>TEFAS işlem prensipleri<\/h3>\n<ul>\n<li>Talimat Takasbank ekranından veya web servisle; <b>öncelik fon bazında talimatın giriş saatine<\/b> göre.<\/li>\n<li>İşlemler TL ile (SPK'nın izin verdiği fonlarda yabancı para ile de).<\/li>\n<li>Talimatlar dağıtım kuruluşlarınca <b>müşteri bazında<\/b>; müşteri hesabı MKK'da tanımlı ve işlem yapabilir olmalı.<\/li>\n<li>Bloke: alımda <b>Kurucu TEFAS Havuz Hesabı<\/b>'nda, satımda müşteri hesabında. Kurucu havuzda yeterli bakiye bulundurmak zorunda, havuzu gün içinde değiştirebilir.<\/li>\n<li>Alım talimatı kurucunun tercihine göre <b>adet ve/veya tutar<\/b>, satım talimatı <b>yalnız adet<\/b> üzerinden. Takasbank'ın asgari TL tutarının altındaki ileri valörlü talimat kabul edilmez (tüm payların satışı hariç).<\/li>\n<\/ul>\n<table><tr><th>Alış talimat türü<\/th><th>İşleyiş<\/th><\/tr>\n<tr><td>Kalanı İptal Et<\/td><td>Mevcut adet eşleşir, kalanı iptal<\/td><\/tr>\n<tr><td>Kalanı Beklet<\/td><td>Tamamlanana kadar parçalı eşleşir; iptal saatinde kalan iptal<\/td><\/tr>\n<tr><td>Tamamını Al<\/td><td>Havuzda yeterli bakiye yoksa talimat sisteme alınmaz<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>İptal:<\/b> eşleşmemiş veya limit yetersizliğinden bekleyen alım talimatı gün içinde her an; eşleşmiş talimat kurucunun iptal son saatine kadar. İptal saati olarak kurucunun saati ile genel saatten <b>önce olanı<\/b> esas alınır. İptal saati geçmiş talimat üyenin yazılı talebi, kurucunun yazılı onayı ve Takasbank'ın uygun görmesiyle Takasbank'ça iptal edilir.<\/li>\n<li><b>İleri valörde marj:<\/b> adet üzerinden alım/satımda tutar = marjlı (artırılmış) fiyat × adet; tutar üzerinden alımda adet = tutar / (marj kadar düşürülmüş fiyat). Valör günü eşleşen adet ve tutardan fazla işlem olmaz.<\/li>\n<\/ul>\n\n<h3>TEFAS teminat ve işlem limiti<\/h3>\n<ul>\n<li>Teminatlar: nakit TL, USD, EUR; standart altın; <b>DİBS<\/b>; kira sertifikası; Takasbank'ın uygun gördüğü VDMK. DİBS ve kira sertifikası <b>Resmi Gazete fiyatıyla<\/b>, VDMK teorik fiyatla, döviz TCMB alış kuruyla değerlenir. Anapara ve kupon birlikte verilmeli; itfa günü ve ayrıştırılmış olanlar kabul edilmez.<\/li>\n<li>Kullanılabilir fonlama limiti = tahsis edilen limit ile <b>değerlenmiş teminatın küçüğü<\/b> (500.000 limit, 540.000 × 0,91 = 491.400 → 491.400; 900.000 teminatta 500.000).<\/li>\n<li><b>İşlem limiti<\/b> = kullanılabilir fonlama limiti + TL ve YP nakit borç kapatma bakiyesi + valör günü gelen TL satışlar − eşleşen alımlar. Limit üye bazında kontrol edilir.<\/li>\n<li>Limiti aşan talimat sisteme kabul edilir ama işleme alınmaz; tamamını karşılayacak limit açılmalıdır; iptal saatine kadar açılmazsa iptal. Kurucunun kendi işlemleri ve dağıtıcının operatörü olduğu fonlar limiti etkilemez. YP alımda limit TCMB <b>satış<\/b> kuruyla düşülür.<\/li>\n<\/ul>\n\n<h3>TEFAS netleştirme ve temerrüt<\/h3>\n<ul>\n<li>TL nakit <b>14:00<\/b>, YP <b>12:30<\/b>'da netleştirilir; <b>fon payı bazında netleştirme yapılmaz<\/b>, aktarımlar talimat bazında.<\/li>\n<li>Net TL borç <b>15:00<\/b>'e kadar TEFASP Nakit Borç Kapatma Hesabına, YP borç <b>15:45<\/b>'e kadar YP hesabına; aksi halde temerrüt. TL'de yükümlülük fonlama limitini aşmamak üzere Takasbank'ça karşılanır. Alacaklar serbest cari hesaba.<\/li>\n<li>Temerrüt faizi oranı: TCMB GLP (LON) borç verme oranı, BİST repo, TCMB BPP ve TPP gecelik oranlarından <b>en yükseği<\/b>; takvim günü; formül <b>temerrüt tutarı × oran × katsayı / 360<\/b>.<\/li>\n<\/ul>\n<table><tr><th>Yükümlülük<\/th><th>Ödeme zamanı<\/th><th>Katsayı<\/th><\/tr>\n<tr><td>Nakit TL<\/td><td>15:00–15:30 (yarım gün 12:30–13:00)<\/td><td>0,5<\/td><\/tr>\n<tr><td>Nakit TL<\/td><td>15:30'dan sonra aynı gün<\/td><td>1<\/td><\/tr>\n<tr><td>Nakit TL<\/td><td>Valör tarihinden sonra<\/td><td>2<\/td><\/tr>\n<tr><td>Nakit YP<\/td><td>15:45–16:30 / 16:30 sonrası aynı gün / valörden sonra<\/td><td>0,5 / 1 / 2<\/td><\/tr>\n<tr><td>Fon payı fiyat bildirimi<\/td><td>Son saatten sonra veya hiç<\/td><td>Maktu <b>904 TL<\/b> (her gün için)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Temerrüt faizi aynı gün ödenir. Mağdur üyeye tahsil edilen faizin <b>2/3<\/b>'ü ödenir (istemeyen yazılı bildirir).<\/li>\n<li>Temerrüt kapanmazsa valörü izleyen iş günü <b>11:00<\/b>'e kadar süre; sonra Takasbank ihbar, mahkeme izni vb. gerekmeden teminatları satar.<\/li>\n<li>İtiraz tahakkuktan itibaren <b>3 iş günü<\/b> içinde; Takasbank <b>Temerrüt Komitesi<\/b> değerlendirir.<\/li>\n<\/ul>\n<h3>TEFAS komisyonları<\/h3>\n<ul>\n<li><b>Aracılık komisyonu<\/b>: dağıtım kuruluşuna fon hesabından ödenir; fon yönetim ücretinin bir oranıdır. Formül: gün sonu fon payı adedi × pay satış fiyatı × fon yönetim ücreti oranı × aracılık komisyon oranı. Her ayın ilk iş günü önceki ay için aktarılır.<\/li>\n<li>Genel komisyon oranı SPK'nın belirlediği orandan farklı olamaz; özel komisyon oranı SPK sınırları içinde üye bazında. Fon yönetim ücreti her zaman, aracılık komisyon oranı <b>3'er aylık dönemlerle<\/b> değişir; dönemin son ayının <b>20<\/b>'sine kadar yapılan değişiklik sonraki dönemde, sonra yapılan ikinci dönemde geçerli.<\/li>\n<li><b>Takasbank komisyonları<\/b>: üyelik giriş ücreti (fon bazında bir kez, kurucudan), üyelik aidatı (aylık, tüm üyelerden), işlem komisyonu (satışta kurucudan, geri alışta dağıtım kuruluşundan, aylık).<\/li>\n<\/ul>\n\n<h3>BEFAS<\/h3>\n<ul>\n<li><b>BEFAS<\/b>, emeklilik yatırım fonu paylarının platforma üye <b>diğer emeklilik şirketlerinin<\/b> katılımcılarına satılıp geri alındığı, takas ve saklamanın <b>Takasbank<\/b> sistemiyle yapıldığı platformdur.<\/li>\n<li>Dayanak: 2019 Yılı Cumhurbaşkanlığı Yıllık Programı (256 sayılı CK); SPK 05.09.2019 tarih ve 49/1131 sayılı karar; SEDDK'nın 2021/9 sayılı Genelgesi (23/06/2021).<\/li>\n<li>Üyeler: emeklilik branşında faaliyet gösteren, Bireysel Emeklilik Tasarruf ve Yatırım Sistemi Kanunu'na tabi <b>emeklilik şirketleri<\/b> (Kurucu ve Dağıtıcı Sözleşmesi). <b>Operatör üye<\/b> olarak uygun görülen yatırım kuruluşları Yetkilendirme ve Ortak Sorumluluk Taahhütnamesi ile üye olur.<\/li>\n<li>Yalnız <b>Kurum (SEDDK)<\/b> Genelgesi ile işlem zorunluluğu getirilen fon türleri kabul edilir. Şirketin ve grup şirketinin kurucusu olduğu fonların kendi katılımcılarına işlemleri BEFAS'tan yapılmak zorunda değildir.<\/li>\n<li>Kurum faaliyeti durdurursa yeniden başlama kararının Takasbank'a tebliğine kadar işlem yapılamaz. Fonların devamını Kurum kararına göre Takasbank belirler.<\/li>\n<\/ul>\n<table><tr><th>BEFAS saatleri<\/th><th>Tam iş günü<\/th><th>Yarım gün<\/th><\/tr>\n<tr><td>Talimat kabul (ileri valörlü)<\/td><td><b>09:00–17:30<\/b><\/td><td>09:00–12:30<\/td><\/tr>\n<tr><td>Eşleşmeyen talimat iptali<\/td><td>17:35<\/td><td>12:35<\/td><\/tr>\n<tr><td>Valör atlatma<\/td><td>13:30<\/td><td>11:00<\/td><\/tr>\n<tr><td>Nakit netleştirme<\/td><td><b>14:00<\/b><\/td><td>11:15<\/td><\/tr>\n<tr><td>Temerrüt başlangıcı<\/td><td><b>15:00<\/b><\/td><td>12:30<\/td><\/tr>\n<\/table>\n<ul>\n<li>BEFAS'ta yalnız <b>ileri valörlü<\/b> talimat ve yalnız <b>TL<\/b>. Öncelik giriş saatine göre. Talimat <b>katılımcı hesabı<\/b> bazında; hesabın Takasbank'ta tanımlı sicil numarası olmalı.<\/li>\n<li>Fon fiyatını <b>operatör üye<\/b> geç fiyat bildirim saatine kadar girer ve Emeklilik Gözetim Merkezi'ne bilgi verir; sonradan güncelleyemez. Fiyat, son fiyata göre <b>maksimum fiyat marj oranı<\/b> aralığında olmalı. Bloke adetinde <b>bloke marj oranı<\/b> kullanılır.<\/li>\n<li>Bloke: alımda <b>Kurucu BEFAS Fon Payı İhraç Havuzu Hesabı<\/b>, satımda Takasbank saklamadaki katılımcı hesabı.<\/li>\n<li>Alım talimatı <b>tutar<\/b>, satım <b>adet<\/b> üzerinden. Talimat türleri TEFAS ile aynı: kalanı iptal et, kalanı beklet, tamamını al.<\/li>\n<li>Teminat: nakit TL, USD, EUR; standart altın; <b>TL DİBS<\/b>; <b>TL kira sertifikası<\/b>; uygun VDMK. Katsayılar genel mektupla duyurulur. İşlem limiti = kullanılabilir fonlama limiti + TL borç kapatma bakiyesi + valör günü satışlar − eşleşen alımlar. Kurucuların kendi fonlarına talimatları limiti etkilemez.<\/li>\n<li>Net TL borç <b>15:00<\/b>'e kadar BEFAS Borç Kapatma Hesabına; yapılmazsa Takasbank teminat karşılığı kredi kullandırarak kapatır.<\/li>\n<li><b>Temerrüt cezası<\/b> (TEFAS'ta temerrüt faizi): BİST repo, TCMB BPP, TPP gecelik oranlarından en yükseği; <b>katılım esaslı<\/b> emeklilik şirketlerinde BİST Taahhütlü İşlemler Pazarındaki gecelik ağırlıklı ortalama oran. Formül tutar × oran × katsayı / 360; katsayılar 0,5 / 1 / 2. Geç fiyat bildirimi maktu <b>720 TL<\/b>.<\/li>\n<li>Dikkat (kaynakta tutarsızlık): saat tablosu ve netleştirme bölümü temerrüt başlangıcını <b>15:00<\/b> verir; temerrüt bölümünde ise \"saat 16:00 itibariyle\" ifadesi geçer. Kitabın kendi çalışma sorusu 15:00'ı doğru kabul eder.<\/li>\n<li>Mağduriyet ödemesi cezanın <b>2/3<\/b>'ü; süre valörü izleyen iş günü 11:00; itiraz 3 iş günü.<\/li>\n<li><b>Aracılık komisyonu<\/b>: fon işletim gider kesintisinin belirli oranı; kurucunun kendi fonlarındaki işlemler için hesaplanmaz; oranlar operatör üyece <b>istenildiği zaman<\/b> değiştirilebilir (TEFAS'taki 3 aylık dönem kuralı yok). Takasbank: giriş ücreti, aylık aidat (emeklilik şirketlerinden), işlem komisyonu izleyen ayın <b>4. iş günü<\/b> sonuna kadar.<\/li>\n<\/ul>\n<table><tr><th>Karşılaştırma<\/th><th>TEFAS<\/th><th>BEFAS<\/th><\/tr>\n<tr><td>Ürün<\/td><td>Yatırım fonları<\/td><td>Emeklilik yatırım fonları<\/td><\/tr>\n<tr><td>Düzenleyici<\/td><td>SPK<\/td><td>SEDDK (Kurum) Genelgesi<\/td><\/tr>\n<tr><td>Saklama/takas<\/td><td>Takasbank–MKK<\/td><td>Takasbank<\/td><\/tr>\n<tr><td>Valör<\/td><td>Aynı gün ve ileri<\/td><td>Yalnız ileri<\/td><\/tr>\n<tr><td>Para birimi<\/td><td>TL (izinli fonlarda YP)<\/td><td>Yalnız TL<\/td><\/tr>\n<tr><td>İleri valör talimat kabul<\/td><td>09:00–17:45<\/td><td>09:00–17:30<\/td><\/tr>\n<tr><td>Alım talimatı<\/td><td>Adet ve/veya tutar<\/td><td>Tutar<\/td><\/tr>\n<tr><td>Fiyat bildirim gecikme bedeli<\/td><td>904 TL<\/td><td>720 TL<\/td><\/tr>\n<tr><td>Aracılık komisyonu esası<\/td><td>Fon yönetim ücreti<\/td><td>Fon işletim gider kesintisi<\/td><\/tr>\n<\/table>", "sorular": [{"q": "Aşağıdaki fonlardan hangisi TEFAS'ta işlem görebilir?", "o": ["Gayrimenkul yatırım fonları", "Girişim sermayesi yatırım fonları", "Serbest fonlar", "Özel fonlar", "Garantili fonlar"], "a": 2, "e": "Kurucu talep ederse serbest fonlar TEFAS'a kabul edilebilir (yalnız nitelikli yatırımcıya satılır). Özel, gayrimenkul, girişim sermayesi, garantili ve anapara koruma amaçlı fonlar işlem göremez."}, {"q": "TEFAS'ta işlem yapan bir üye diğer üyelere ve Takasbank'a olan borçlarını bir aylık dönemde kaç kez süresinde kapatmazsa kaç iş günü işlem yapamaz?", "o": ["5 kez / 5 iş günü", "3 kez / 5 iş günü", "2 kez / 3 iş günü", "1 kez / 1 iş günü", "3 kez / 10 iş günü"], "a": 1, "e": "Borçlarını 1 aylık dönemde 3 kez süresinde kapatmayan üye 5 iş günü süreyle TEFAS'ta işlem yapamaz."}, {"q": "TEFAS'ta tam iş gününde aynı gün valörlü işlemler için talimat kabul saatleri hangisidir?", "o": ["09:30–15:30", "09:00–14:00", "09:00–13:30", "09:00–12:30", "09:00–17:45"], "a": 2, "e": "Aynı gün valörlü talimatlar 09:00–13:30, ileri valörlü talimatlar 09:00–17:45 arasında kabul edilir."}, {"q": "TEFAS'ta TL ve yabancı para nakit yükümlülükleri için temerrüt başlangıç TL, kullanılabilir fonlama limiti 120.000 TL, valör günü gelen TL satış talimatları 40.000 TL ve eşleşmiş alım talimatları 25.000 TL'dir. Üyenin işlem limiti nedir?", "o": ["125.000 TL", "190.000 TL", "165.000 TL", "215.000 TL", "135.000 TL"], "a": 2, "e": "İşlem limiti = 120.000 + 30.000 + 40.000 − 25.000 = 165.000 TL. 190.000 TL, eşleşmiş alımların düşülmemesiyle bulunur."}, {"q": "TEFAS'ta işlem limitini aşan bir alım talimatı için hangisi doğrudur?", "o": ["Sisteme kabul edilir ama işleme alınmaz; tamamını karşılayacak limit açılması gerekir", "Limit kadarı gerçekleşir, kalanı iptal olur", "Sisteme hiç kabul edilmez", "Ertesi güne devreder", "Takasbank otomatik kredi kullandırarak gerçekleştirir"], "a": 0, "e": "Limiti aşan talimatlar sisteme kabul edilir ancak işleme alınmaz; işleme alınması için tamamını karşılayacak limit açılmalı, iptal saatine kadar açılmazsa otomatik iptal olur."}, {"q": "TEFAS'ta ileri valörlü bir fonda talimat günü fiyatı 10 TL, marj oranı %20'dir. Tutar üzerinden verilen 12.000 TL'lik alım talimatında eşleşecek adet kaçtır?", "o": ["960", "1.500", "1.200", "1.440", "1.000"], "a": 1, "e": "Tutar üzerinden alımda fiyat marj kadar düşürülür: 10 × 0,80 = 8; adet = 12.000 / 8 = 1.500. 1.000 adet, fiyatın marj kadar artırılmasıyla bulunur."}, {"q": "TEFAS'ta netleştirme ile ilgili hangisi yanlıştır?", "o": ["Yabancı para tutarlar 12:30'da netleştirilir", "Net TL borç 15:00'e kadar kapatılmalıdır", "TL nakit tutarlar 14:00'te netleştirilir", "Net nakit alacaklar serbest cari hesaplara aktarılır", "Fon payı bazında netleştirme yapılır"], "a": 4, "e": "TEFAS'ta fon payı bazında netleştirme yapılmaz; fon payı aktarımları talimat bazında gerçekleşir."}, {"q": "TEFAS'ta 1.000.000 TL'lik nakit TL borcunu valör günü 15:15'te kapatan üyeye uygulanacak temerrüt faizi nedir? (İlgili en yüksek oran yıllık %45'tir.)", "o": ["2.500 TL", "1.250 TL", "625 TL", "616 TL", "0 TL"], "a": 2, "e": "15:00–15:30 arası ödemede katsayı 0,5'tir: 1.000.000 × 0,45 × 0,5 / 360 = 625 TL. 616 TL, 365 gün kullanılarak bulunur."}, {"q": "TEFAS'ta nakit TL yükümlülüğünün valör tarihinden sonra yerine getirilmesi halinde temerrüt faizi katsayısı nedir?", "o": ["1,5", "2", "1", "0,5", "3"], "a": 1, "e": "Katsayılar 15:00–15:30 için 0,5; 15:30 sonrası aynı gün için 1; valör tarihinden sonra 2'dir."}, {"q": "TEFAS'ta temerrüde düşen üye nedeniyle alacağını alamayan üyeye ödenen mağduriyet ödemesi ne kadardır?", "o": ["Sabit 904 TL", "Temerrüt faizinin 2/3'ü", "Temerrüt faizinin 1/3'ü", "Temerrüt faizinin tamamı", "Temerrüt faizinin yarısı"], "a": 1, "e": "Temerrüde düşen kurumdan tahsil edilen temerrüt faizinin 2/3'ü mağduriyet ödemesi olarak yapılır. 904 TL geç fiyat bildirim bedelidir."}, {"q": "TEFAS'ta aracılık komisyon oranı değişikliği ile ilgili hangisi doğrudur?", "o": ["Her gün değiştirilebilir", "SPK onayıyla her zaman değiştirilebilir", "Değiştirilemez", "3'er aylık dönemlerle değiştirilebilir; dönemin son ayının 20'sine kadar yapılan değişiklik bir sonraki dönemde geçerli olur", "Yılda bir kez değiştirilebilir"], "a": 3, "e": "Fon yönetim ücreti istenildiği zaman, aracılık komisyon oranı 3'er aylık dönemlerle değiştirilebilir; son ayın 20'sinden sonraki değişiklik ikinci dönemde geçerli olur."}, {"q": "TEFAS'ta Takasbank işlem komisyonu kimden tahsil edilir?", "o": ["Her işlemde MKK'dan", "Yalnız yatırımcıdan", "Fon katılma payı satışlarında kurucu hesabından, geri alışlarda dağıtım kuruluşu hesabından", "Her iki işlemde de kurucudan", "Satışlarda dağıtım kuruluşundan, geri alışlarda kurucudan"], "a": 2, "e": "İşlem komisyonu fon payı satışlarında kurucu hesabından, geri alışlarda dağıtım kuruluşu hesabından aylık tahsil edilir."}, {"q": "BEFAS'ta işlem yapabilecek kuruluşlar hangileridir?", "o": ["Bankalar ve aracı kurumlar", "Tüm portföy yönetim şirketleri", "Yalnız sigorta şirketleri", "Bireysel yatırımcılar doğrudan", "Emeklilik branşında faaliyet gösteren emeklilik şirketleri; uygun görülen yatırım kuruluşları operatör üye olarak"], "a": 4, "e": "BEFAS'ta BES Kanunu'na tabi emeklilik şirketleri işlem yapar; operatör üye olarak uygun görülen yatırım kuruluşları taahhütname imzalayarak üye olabilir."}, {"q": "BEFAS'ta işlem görecek fonları belirleyen düzenleme hangisidir?", "o": ["Takasbank Yönetim Kurulu kararı", "SPK'nın zorunlu tuttuğu fonlar", "Borsa İstanbul kotasyon yönergesi", "Sigortacılık ve Özel Emeklilik Düzenleme ve Denetleme Kurumunun Genelgesi ile işlem zorunluluğu getirilen fonlar", "Emeklilik şirketinin serbest tercihi"], "a": 3, "e": "BEFAS'ta sadece Kurum (SEDDK) tarafından yayınlanan Genelge kapsamında işlem zorunluluğu getirilen fon türleri kabul edilir."}, {"q": "BEFAS'ta tam iş gününde ileri valörlü talimat kabul saatleri hangisidir?", "o": ["09:00–13:30", "09:00–17:45", "09:00–12:30", "09:00–17:30", "09:30–16:45"], "a": 3, "e": "BEFAS'ta ileri valörlü talimatlar 09:00–17:30 arasında kabul edilir; TEFAS'ta bu saat 09:00–17:45'tir."}, {"q": "BEFAS ile TEFAS karşılaştırıldığında aşağıdakilerden hangisi yanlıştır?", "o": ["BEFAS'ta aracılık komisyon oranı yalnızca 3'er aylık dönemlerle değiştirilebilir", "BEFAS'ta geç fiyat bildirim bedeli 720 TL'dir", "BEFAS'ta aracılık komisyonu fon işletim gider kesintisinin bir oranıdır", "BEFAS'ta alım talimatları tutar üzerinden iletilir", "BEFAS'ta işlemler yalnız TL ile yapılır"], "a": 0, "e": "BEFAS'ta fon işletim gider kesintisi oranı ve aracılık komisyon oranı operatör üye tarafından istenildiği zaman değiştirilebilir; 3'er aylık dönem kuralı TEFAS'a özgüdür. Diğer ifadeler doğrudur."}, {"q": "Katılım esaslı faaliyeti bulunan ve bunu Takasbank'a bildiren emeklilik şirketleri için BEFAS'ta temerrüt cezası oranı olarak hangisi kullanılır?", "o": ["TCMB politika faizi", "TPP gecelik ağırlıklı ortalama faiz", "TLREF", "Sabit %10", "BİST Taahhütlü İşlemler Pazarında TL kira sertifikalarında oluşan gecelik ağırlıklı ortalama oran"], "a": 4, "e": "Katılım esaslı şirketlerde diğer oranlardan bağımsız olarak BİST taahhütlü işlemler pazarındaki gecelik ağırlıklı ortalama oran kullanılır."}, {"q": "BEFAS'ta alım talimatlarında fon payları hangi hesapta bloke edilir?", "o": ["Kurucu BEFAS Fon Payı İhraç Havuzu Hesabında", "Emeklilik Gözetim Merkezi hesabında", "Katılımcının MKK hesabında", "Dağıtım kuruluşunun portföy hesabında", "Takasbank serbest cari hesabında"], "a": 0, "e": "Alım işlemlerinde fon payları Kurucu BEFAS Fon Payı İhraç Havuzu Hesabında, satım işlemlerinde Takasbank saklamadaki katılımcı hesabında bloke edilir."}]}];
const P={"1": ["Merhaba, Finansal Piyasalar dersinin ilk bölümündeyiz. Bugün iki şey konuşacağız. Önce piyasaların nasıl sınıflandığını, sonra Borsa İstanbul'un hukuki yapısını. Bu bölüm sınavda çoğunlukla merci, süre ve oran sorusu olarak geliyor.", "Şöyle başlayalım. Piyasa, alıcıyla satıcının buluştuğu yer. Mal ve hizmet alınıyorsa buna reel piyasa diyoruz. Fon fazlası olan birinin tasarrufunu fon açığı olana aktardığı yere ise finansal piyasa diyoruz. Finansal piyasa, para ve sermaye piyasasından daha geniş bir kavram. İkisini de içine alıyor.", "Sınavın sevdiği ayrım organize ve organize olmayan piyasa ayrımı. Merkez Bankası piyasaları, Borsa İstanbul piyasaları ve Takasbank piyasaları organize. Bankalararası tahvil ve döviz piyasası, serbest döviz piyasası ve serbest altın piyasası ise organize değil. Kuyumcudaki serbest altın alışverişini düşün, orada bir borsa kuralı yok. Bu örnek aklında kalsın.", "Şimdi vadeye bakalım. Vadesi genellikle bir yılı aşmayan fonlar para piyasasında döner. Bu fonlar işletmenin dönen varlıklarını finanse eder. Hazine bonosu, finansman bonosu ve repo bu piyasanın araçları. Bir yıldan uzun vadeli fonlar ise sermaye piyasasında döner. Onlar da bina, makine gibi duran varlıkları finanse eder.", "Birincil ve ikincil piyasa ayrımında dur bir saniye. Birincil piyasada şirket ilk kez pay satar ve kasasına yeni para girer. İkincil piyasada ise o pay yatırımcılar arasında el değiştirir. Burada şirkete tek kuruş girmez. Sınavda yeni sermaye girer diye bir şık görürsen, ikincil piyasa için bu yanlıştır.", "Gelelim borsaya. Borsa anonim şirket olarak kurulur. Kuruluş iznini Kurulun uygun görüşü üzerine Cumhurbaşkanı verir. Faaliyete geçmek içinse Sermaye Piyasası Kurulunun izni gerekir. Kuruluş izninden sonra en geç bir yıl içinde faaliyet izni istenir. Kurul da eksiksiz başvuruyu altı ay içinde karara bağlar.", "Önemli etkiye sahip ortak kavramı da sık soruluyor. Sermaye ya da oy haklarında %5 veya daha fazla payı olan kişi bu tanıma girer. %5'in altında kalsa bile yönetim kuruluna üye belirleme imtiyazı varsa yine önemli etkiye sahip sayılır. Ayrıca kontrol devri doğuran her işlem Kurul iznine bağlı. İzinsiz yapılan pay devri pay defterine yazılmaz.", "Borsa İstanbul, Sermaye Piyasası Kanununun 138'inci maddesiyle kuruldu. Esas sözleşmesi 2013 yılının nisan ayının üçünde tescil edildi. Bununla İstanbul Menkul Kıymetler Borsası ve İstanbul Altın Borsası tüzel kişiliğini kaybetti. Vadeli İşlem ve Opsiyon Borsasının payları ise sonradan devralındı. Bu sırayı karıştırma.", "Ortaklık yapısına bakalım. Sermaye 423.234.000 lira. Her pay bir kuruş. En büyük ortak %80,60 ile Türkiye Varlık Fonu. QH Oil şirketi %10 paya sahip. Türkiye Sermaye Piyasaları Birliği de küçük bir payla ortak. Dikkat et, Türkiye Odalar ve Borsalar Birliği ortaklar arasında yok.", "Yönetim kurulu dokuz üyeden oluşuyor. En az üçü bağımsız ve bağımsızlardan en az biri kadın olmak zorunda. Görev süresi üç yıl. Her üyenin en az 10 yıllık mesleki deneyimi olmalı. Üyelerin en az üçte biri ise 10 yıllık sermaye piyasası deneyimine sahip olmalı. Genel müdür de yönetim kurulu üyeleri arasından atanıyor.", "Komitelerde rakamları ezberle. Denetim komitesi en az iki üyeden oluşur ve hepsi bağımsızdır. Kurumsal yönetim komitesinde çoğunluk bağımsız ve icracı olmayan üyelerden. Riskin erken saptanması komitesinde çoğunluk icracı olmayan üyelerden. Uyuşmazlık ve disiplin komiteleri ise bir başkan ve iki üyeden oluşur.", "Şimdi uyuşmazlık sürecine geçelim. Bir yatırımcı, emrinin zamanında iletilmediğini düşünüyor diyelim. Yazılı dilekçe verir ve hizmet bedelini öder. İlk işlemden itibaren iki yıl geçtiyse başvurusu incelenmez. Kararı yönetim kurulu verir. Tutar büyükse taraflar 15 gün içinde Borsa aracılığıyla Sermaye Piyasası Kurulu'na itiraz edebilir. 2025 için bu sınır 1.645.665 lira.", "Hizmet bedelinde ince bir tuzak var. Başvuru usule aykırı sayılırsa bedel geri verilir. Ama şikâyetten vazgeçilirse, sulh olunursa ya da mahkemeye gidilirse bedel iade edilmez. Taraflar sulh olursa üye bunu üç iş günü içinde Borsaya bildirir.", "Disiplin cezaları hafiften ağıra beş basamak. Uyarı, kınama, para cezası, işlem yetkisinin geçici kaldırılması ve iptal. Para cezası 10.000 liradan 5.000.000 liraya kadar. Sosyal medyada yanıltıcı tavsiye fiillerinde alt sınır 50.000 lira. Geçici kaldırma en fazla üç ay sürer. Ceza, yönetim kurulu kararıyla kesinleşir.", "Zamanaşımını bir merdiven gibi düşün. Fiili öğrendikten sonra bir yıl, fiilden itibaren iki yıl geçerse soruşturma başlamaz. Fiilden üç yıl geçtiyse artık ceza verilemez. Verilen ceza üç yıl içinde uygulanmazsa düşer. Bir yıl içinde aynı fiil tekrarlanırsa bir derece ağır ceza gelir.", "Üyelikte iki kritik nokta var. Mali durumu bozulan üyenin yetkisini genel müdür beş işlem gününe kadar tedbiren kaldırabilir. Merkez Bankası ise piyasalarda işlem yapabilir ama teminat, disiplin ve ücret yükümlülüklerinden muaftır. Bağımsız denetim şirketleri ise Borsada işlem yapamaz.", "Kota alma yetkisi yönetim kurulunda. Bu yetki sınırları belirlenerek genel müdüre devredilebilir. İşlemleri geçici durdurmada ise genel müdür en fazla bir ay durdurabilir. Bir ayı aşacaksa yönetim kurulu kararı gerekir. Durdurma gerekçesiyle Kamuyu Aydınlatma Platformu, yani KAP üzerinden duyurulur. Hatalı işlem iptalleri de aynı gün KAP'ta ilan edilir.", "Son konu finansal ölçütler, yani endeksler. Borsa, uluslararası menkul kıymet komisyonları örgütünün ilkelerine uyum beyanını yılda en az bir kez günceller. Hesaplama kayıtlarını en az beş yıl saklar. TLREF için karar mercii TLREF Komitesi. Borsaya ait diğer ölçütlerde ise genel müdür, Finansal Ölçütler Komitesinin önerisiyle karar verir.", "Toparlayalım. Birincisi, serbest altın ve bankalararası piyasalar organize değil. İkincisi, borsa kuruluş iznini Cumhurbaşkanı verir, faaliyet iznini Kurul verir. Üçüncüsü, yönetim kurulu dokuz üye, en az üç bağımsız, görev süresi üç yıl. Dördüncüsü, uyuşmazlıkta itiraz süresi 15 gün, disiplinde para cezası 10.000 ile 5.000.000 lira arası. Beşincisi, genel müdür işlemi en fazla bir ay, üye yetkisini ise beş işlem gününe kadar durdurabilir."], "2": ["Merhaba, Pay Piyasası'nın ilk durağındayız. Bu bölümde önce piyasada hangi araçların işlem gördüğüne bakacağız. Sonra halka arzların nasıl yapıldığını konuşacağız. En sonda da pazar yapısına geçeceğiz. Bu bölüm eşik değerlerle dolu, o yüzden kulağını açık tut.", "Önce araçlar. Pay, yeni pay alma hakkı ve borsa yatırım fonu en bilinenleri. Bunlara varant, sertifika, sahipliğe dayalı kira sertifikası, gayrimenkul sertifikası, gayrimenkul ve girişim sermayesi fonları ve emtia sertifikası ekleniyor. Varant aslında menkul kıymetleştirilmiş bir opsiyon. Sertifika ise belirli koşullar gerçekleşince alacak hakkı veren yapılandırılmış bir ürün.", "Borsa yatırım fonlarında rakamları ezberle. Fon, Kamuyu Aydınlatma Platformu yani KAP ilanını izleyen ikinci iş günü işlem görmeye başlar. Lot büyüklüğü bir adet katılma payı. Fiyat marjı %20. Birim pay değeri en az bir lira. Takas da işlem gününden iki iş günü sonra yapılır.", "Emtia sertifikasında küçük bir ayrım var. Normalde emtia pazarında işlem görür. Ama yalnızca nitelikli yatırımcılara satılmışsa Girişim Sermayesi Pazarına gider. Darphane sertifikası da bir emtia sertifikası. Onu Darphane ve Damga Matbaası Genel Müdürlüğü ihraç ediyor.", "Şimdi halka arza geçelim. Borsada üç yöntem var. Sürekli işlem, sabit fiyat ve değişken fiyat. Halka arz duyurusu işlemden en az iki iş günü önce KAP'ta yapılır. Rüçhan hakkından arta kalan payların satışında ise en az bir işlem günü önce duyuru yeterli.", "Sürekli işlem yönteminde halka arzın iki günde bitmesi esas. İlk günün baz fiyatı, halka arz fiyatının en yakın fiyat adımına yuvarlanmış hâli. Mesela fiyat 128 lira 37 kuruşsa, adım 10 kuruş olduğundan baz fiyat 128 lira 40 kuruş olur. Halka arz sürerken ikincil piyasa açılmaz. İkincil piyasanın ilk baz fiyatı, birincil piyasadaki son kapanış fiyatıdır.", "Talep toplama yöntemlerinde emir toplama süresi en az bir, en fazla üç iş günü. Dağıtım, talep toplamanın bittiği gün akşam altıyı 15 geçe başlıyor. Burada Merkezi Kayıt Kuruluşu sicil numarası çok önemli. Aynı kişinin farklı kurumlardan girdiği emirler tekleştiriliyor ve sadece öncelikli ilk emre dağıtım yapılıyor. Müşterek hesaptan gelen emir ise dağıtıma hiç girmiyor.", "Sabit fiyat yönteminde tek bir fiyat var. Farklı fiyatlı emir reddedilir. Fiyat önceliği yok, sadece zaman önceliği var. Değişken fiyat yönteminde ise bir fiyat aralığı ilan edilir. Talep arzdan azsa ya da eşitse, en düşük alış fiyatı halka arz fiyatı olur.", "Değişken fiyatta fazla talep durumunu bir örnekle düşün. 1.000.000 lot satılacak. 22 liradan 300.000, 21 lira 80 kuruştan 400.000, 21 lira 60 kuruştan 500.000 lot talep var. Talebi yukarıdan aşağı topla. 21 lira 60 kuruşta toplam 1.200.000'e çıkıyor ve arz tamamen karşılanıyor. Halka arz fiyatı bu seviye olur. Herkes de bu fiyattan alır.", "Bir de fiyat istikrarı işlemleri var. Halka arzdan sonra fiyat düşerse aracı kurum destek alımı yapabilir. Ama halka arz fiyatının üzerinde alım emri veremez. Bu işlemleri de ayrı bir hesapta takip etmek zorunda.", "Gelelim pazarlara. Yıldız Pazar için piyasa değeri 6.000.000.000 liranın, fiili dolaşımdaki payların piyasa değeri 1.000.000.000 liranın üzerinde olmalı. Ana Pazar için bu eşikler 1.000.000.000 lira ve 400.000.000 lira. Fiili dolaşım oranı her ikisinde yüzde onun üzerinde olmalı. Yıldız için ayrıca yerli fonların payda 30.000.000 liranın üzerinde yatırımı aranıyor.", "Likidite kriterine dikkat et, çünkü mantığı ters gibi görünür. Bu ölçü, 1.000.000 liralık işlemin fiyatı ortalama ne kadar oynattığını gösterir. Değer küçükse pay daha likittir. Yıldız Pazar için 0,15'in, Ana Pazar için 0,5'in altında olmalı.", "İstisnalar da sık soruluyor. Fiili dolaşım oranı %5'in üzerindeyse, fiili dolaşımdaki değeri 3.000.000.000 lirayı aşan ve likiditesi 0,1'in altında olan pay doğrudan Yıldız Pazara gider. Alt Pazardaki bir pay, fiili dolaşım değeri 450.000.000 lirayı aşar ve temettü getirisi yüzde onu geçerse Ana Pazara çıkar. Değerlendirme yılda en az iki kez yapılır. Yeni şirket ilk üç ay değerlendirmeye girmez.", "Pazarlara göre işlem esaslarını bir merdiven gibi hatırla. Fiyat marjı Yıldızda %20, Anada %15, Alt Pazar, Yakın İzleme ve Piyasa Öncesi İşlem Platformunda %10. Devre kesici eşiği Yıldızda %10, Anada %7,5, Altta %5. Açığa satış ve kredili işlem yalnızca Yıldız ve Ana Pazarda var. Brüt takas ise alttaki üç pazarda uygulanıyor.", "Yakın İzleme Pazarı ve Piyasa Öncesi İşlem Platformunda işlemler günde beş kez tek fiyatla yapılıyor. Platformda ilk gün serbest marjla başlanıyor. Girişim Sermayesi Pazarında ise sadece nitelikli yatırımcı işlem yapabiliyor. O pazar, Ana Pazarın işlem esaslarına tabi. İlk günün baz fiyatı da ihraç fiyatı.", "Özellikli işlemlerde toptan alış satış önemli. Asgari tutar 100.000.000 lira, fiyat adımı bir kuruş. Takas borsa dışında yapılacaksa ayrı bir sıra açılıyor. Yeni pay alma haklarında bir lot, bir liralık nominal payın hakkı demek. Fiyat tesciline kadar marj serbest, sonra %50. Son işlem günü, kullanım süresinin bitiminden önceki beşinci iş günü. Bu sıralarda açılış ve kapanış seansı yapılmıyor.", "Toparlayalım. Birincisi, borsa yatırım fonu ilandan sonraki ikinci iş günü işlem görür ve marjı yüzde yirmidir. İkincisi, talep toplama bir ile üç iş günü sürer, dağıtım akşam altıyı 15 geçe başlar. Üçüncüsü, değişken fiyatta fazla talepte arzın tamamen karşılandığı fiyat halka arz fiyatıdır. Dördüncüsü, Yıldız Pazar 6.000.000.000 ve 1.000.000.000 liralık eşiklerle tanımlanır. Beşincisi, marjlar 20, 15 ve 10, devre kesici eşikleri 10, 7,5 ve beştir."], "3": ["Merhaba, Pay Piyasası'nın ikinci durağındayız. Bu bölüm saatlerle, fiyat adımlarıyla ve emir kurallarıyla dolu. Sınavda en çok sayısal soru buradan çıkıyor. O yüzden sana birkaç hesap örneği de vereceğim.", "Önce günün akışı. Seans sabah 49'ta açılış emir toplamayla başlar. 64'te açılış fiyatı belirlenir. Ondan akşam altıya kadar sürekli işlem var. Altıdan altıyı yedi geçeye kadar kapanış seansı yapılır. Son olarak altıyı sekiz geçe ile altıyı 10 geçe arasında kapanış fiyatından işlemler gerçekleşir. Yarım günde ise her şey 52'ta biter.", "İstisnaları unutma. Borsa yatırım fonlarında açılış emir toplaması bir dakika uzun, 65'ya kadar sürüyor. Varant ve sertifikalar açılışa katılmıyor, onlar ondan 10 saniye sonra başlıyor. Birincil piyasa ise 10,5 ile 13 arasında açık.", "Şimdi baz fiyat. Baz fiyat, önceki günün kapanış fiyatı. Fiyat sınırları bunun üzerinden hesaplanır. Gün boyu hiç işlem olmazsa aynı baz fiyat ertesi güne taşınır. Varant ve sertifikada ise baz fiyat yok. Referans fiyat da bir yol göstericidir ama fiyat sınırına esas olmaz. Bunu baz fiyatla karıştırma.", "Fiyat adımları sınavın gözdesi. Paylarda 20 liraya kadar adım bir kuruş. 20 ile 50 arası iki kuruş. 50 ile 100 arası beş kuruş. 100 ile 250 arası 10 kuruş. Sonra 25 kuruş, 50 kuruş, bir lira ve 2,5 lira geliyor. Borsa yatırım fonunda tablo bir basamak geriden gelir. 50 liraya kadar bir kuruş, 50 ile 100 arası iki kuruş. Varant, sertifika, emtia sertifikası ve toptan satışta adım her zaman bir kuruş.", "Burada dur bir saniye, çünkü adım baz fiyata göre değil, emrin fiyatına göre belirleniyor. Baz fiyatı 19 lira 97 kuruş olan bir pay düşün. 20 liraya kadar bir kuruşluk adım var. Fiyat yirmiyi geçince adım kendiliğinden iki kuruşa çıkar.", "Marjlara geçelim. Yıldız Pazarda %20, Ana Pazarda %15. Alt Pazar, Yakın İzleme Pazarı ve Piyasa Öncesi İşlem Platformunda %10. Borsa yatırım fonu ve gayrimenkul ile girişim fonlarında %20. Yeni pay alma hakkında %50. Gayrimenkul ve emtia sertifikasında ise sadece %5.", "Sınırları hesaplarken yuvarlama hep içe doğru yapılır. Taban yukarı, tavan aşağı yuvarlanır. Bir örnek yapalım. Ana Pazarda kapanışı 47 lira 30 kuruş olan bir pay olsun. %15 aşağı 40 lira 20,5 kuruş eder. İki kuruşluk adıma yukarı yuvarlarsan taban 40 lira 22 kuruş olur. Yukarı yönde 54 lira 39,5 kuruş çıkar. Orada adım beş kuruş olduğu için tavan 54 lira 35 kuruş olur.", "Sınırları kim değiştirebilir, bu da soruluyor. Pay Piyasası Direktörü sınırları iki katına kadar genişletebilir. Genel müdür tamamen kaldırabilir ya da değiştirebilir. Yönetim kurulu da pazar ve emir türüne göre farklı sınırlar koyabilir.", "Tek fiyat yöntemine gelelim. Emirler bir süre toplanır ve eşleşme olmaz. Sonra en çok işlem miktarını sağlayan tek bir fiyat bulunur. Tek fiyatla işlem gören paylarda bu iş günde beş kez yapılır. Açılış, öğlen birden önce, gün ortası, akşam altıdan önce ve kapanış. Emir toplama 30 saniyelik bir aralıkta rastgele kesilir. Fiyat belirleme için en fazla beş dakika ayrılır ama genelde bir dakika sürer.", "Açılış fiyatının algoritmasını sırayla bil. Önce en çok işlem miktarı. Eşitlik varsa en az artık miktar. Yine eşitse piyasanın yönü, yani alış ağırlıklıysa yüksek fiyat. Sonra referans fiyata en yakın fiyat. O da yoksa olası fiyatların ortalaması. Açılışın son beş dakikasında emir iptal edemezsin, fiyatı kötüleştiremezsin, miktarı azaltamazsın.", "Kapanış seansında yeni bir sınır daha devreye giriyor. Emirler son işlem fiyatının %9 ile %3 üstü arasında olmalı. Ama günlük taban ve tavanı da aşamazsın. Mesela baz fiyat 120, son işlem 140 olsun. %3 yukarısı 144 lira 20 kuruş ediyor. Ama Yıldız Pazar tavanı 144 lira, o yüzden üst sınır 144 lirada kalıyor. Varant, sertifika, temerrüt ve rüçhan sıraları kapanış seansına girmiyor.", "Emir tiplerinde iki kardeşi karıştırma. Piyasa emri sadece kalanı iptal et olarak girilir. Eşleşmeyen kısmı iptal olur. Piyasadan limite emir ise sadece en iyi kademeyle eşleşir. Kalan kısmı son işlem fiyatından limit emre dönüşür ve defterde bekler. Hepsi ya da hiçbiri gibi miktar koşullu emirler ise henüz devrede değil.", "Büyük oyuncular için iki özel emir var. Orta nokta emri en iyi alış ile en iyi satışın ortasından eşleşir. Tutarı 100.000 lira ile 30.000.000 lira arasında olmalı. Ağırlıklı ortalama fiyat emri ise gün sonu ortalama fiyatını referans alır. Miktarı 100.000 lot ile 10.000.000 lot arasında olmalı. İkisi de sadece BIST 30 endeksindeki paylarda kullanılıyor.", "Emri değiştirirken önceliğe dikkat et. Miktarı artırırsan ya da fiyatı değiştirirsen sıranın en arkasına düşersin. Miktarı azaltırsan yerin korunur. Süreyi uzatırsan öncelik kaybolur, kısaltırsan korunur. Yüksek frekanslı işlem yapanlar için emir işlem oranı var. Oran beşe biri aşarsa aşan her operasyon için 50 kuruş ücret alınır.", "Maksimum emir değerinde paylar altı gruba ayrılıyor. Birinci grupta 10.000.000 lira, altıncı grupta yarım 1.000.000 lira. Varantta 250.000 lira, sertifikada 1.000.000 lira. Fonlarda ve gayrimenkul sertifikasında 5.000.000 lira. Gruplar altı ayda bir güncellenir ve ocak ile temmuzda yürürlüğe girer. Son olarak protokoller. Hızlı emir için OUCH, hızlı veri için ITCH. İşlem terminalinde saniyede 10 emir sınırı var.", "Toparlayalım. Birincisi, sürekli işlem ondan akşam altıya kadar, kapanış fiyatından işlemler altıyı sekiz geçe ile 10 geçe arası. İkincisi, adım emrin fiyatına göre belirlenir ve sınırlar içe doğru yuvarlanır. Üçüncüsü, marjlar 20, 15 ve 10, kapanış seansında son fiyatın %3'ü. Dördüncüsü, tek fiyatta en çok işlem miktarı esas ve günde beş fiyat var. Beşincisi, orta nokta ve ağırlıklı ortalama fiyat emirleri sadece BIST 30 paylarında kullanılır."], "4": ["Merhaba, Pay Piyasası'nın son durağındayız. Bu bölümde piyasa yapıcıları, likidite sağlayıcıları, özel işlem bildirimini ve devre kesicileri konuşacağız. Sonra açığa satışa, brüt takasa ve volatilite tedbirlerine geçeceğiz. Bölüm uzun ama mantığı oturunca rakamlar kolay kalıyor.", "Önce piyasa yapıcı. Piyasa yapıcı, bir aracın alış ve satış tarafında sürekli fiyat veren üyedir. Amacı piyasanın düzenli işlemesine ve likiditeye katkı sağlamak. Bunun için iki temel şart var. Kısmi ya da geniş yetkili aracı kurum olacaksın. Bir de son bir yılda 2.000.000 lira ve üstü takas temerrüdü sayın beşi aşmayacak.", "Temerrüt sayımında küçük incelikler var. Aynı gün kapatılan temerrüt sayılmaz. Aynı gün farklı paylarda birden fazla büyük temerrüt varsa bunlar tek temerrüt sayılır. 2.000.000 liranın altındaki temerrütler ise hiç sayılmaz. Uygunluk altı ayda bir, haziran ve aralık sonunda değerlendirilir.", "Hangi araçta piyasa yapıcı zorunlu, bunu iyi ayır. Borsa yatırım fonunda zorunlu. Piyasa yapıcı yoksa fon tek fiyat yöntemine geçer. Varant ve sertifikada da zorunlu ama piyasa yapıcı yoksa sıra kapatılır. Ana ve Alt Pazar paylarında ise isteğe bağlı. Yakın İzleme Pazarı ile Piyasa Öncesi İşlem Platformunda piyasa yapıcılık hiç yapılamaz.", "Kotasyon kurallarına geçelim. Alış ve satış fiyatı eşit olamaz. Aradaki fark en az bir fiyat adımı olmalı. Kotasyon miktarı en az 250 lot. En fazla fark ise fiyata göre değişiyor. Bir liraya kadar altı adım, 2,5 liraya kadar sekiz adım, 10 liraya kadar 10 adım. 10 liranın üzerinde ise fiyatın %1'i.", "Bir örnek yapalım. 50 liralık bir payda piyasa yapıcı 50 liradan alış veriyor diyelim. %1, 50 kuruş eder. Demek ki satış fiyatı en fazla 50 lira 50 kuruş olabilir. İki liralık bir araçta ise sekiz adım, yani sekiz kuruş fark verebilir. Bu sınırı iki katına çıkarmaya Pay Piyasası Direktörü, tamamen kaldırmaya ise genel müdür yetkili.", "Piyasa yapıcı başarılı sayılmak için sürekli işlem süresinin yüzde doksanında geçerli kotasyon tutmalı. Karşılığında kotasyon işlemlerinde borsa payının %50'si indirilir. Yedek piyasa yapıcı ise indirim alamaz. Kotasyonda en küçük değişiklik bile önceliği kaybettirir. Miktarı azaltsan bile sıranın sonuna düşersin.", "Ayrılma kurallarına da bak. Kendi isteğiyle ayrılan üye en az iki iş günü önce yazılı başvurur. Sonra 30 gün aynı araca dönemez. Performansı yetersiz bulunup çıkarılan üye ise altı ay boyunca aynı araca başvuramaz. Varantlarda iki dönem üst üste %65'in altında kalmak uyarı sebebi.", "Likidite sağlayıcı ise farklı bir rol. İsteğe bağlı çalışır ve fiyat istikrarı sağlamak gibi bir görevi yoktur. Sürekli emir vermek zorunda da değildir. Başlaması için şirketin yönetim kurulu kararı ve bir anlaşma gerekir. BIST 30 endeksindeki paylarda yapılamaz. Piyasa yapıcının olduğu araçta da yapılamaz.", "Likidite sağlayıcıda iki oran var. Birincisi, desteklediği payların fiili dolaşımdaki piyasa değeri toplamı kendi özkaynağının 20 katını geçemez. Özkaynağı 150.000.000 lira olan bir kurum düşün. Desteklediği payların fiili dolaşım değeri toplamı 3.000.000.000 lirayı geçemez. İkincisi, altı aylık dönemde paydaki toplam işlem hacminin yüzde sekseninden fazlası onun işlemlerinden oluşamaz.", "Şimdi özel işlem bildirimi. Bir aracı kurum, iki müşterisinden fiyatı ve miktarı uyan alış ve satış emri aldı diyelim. Bunu emir defterine koymadan doğrudan işleme çevirebilir. İki kademe var. Birinci kademe 10 ile 50.000.000 lira arası ve son fiyatın %6 aşağısı ile yukarısı arasında. İkinci kademe 50.000.000 liranın üzerinden 250.000.000 liraya kadar ve %10 bandında. Günlük taban ve tavan hiçbir durumda aşılamaz.", "Devre kesicilere geçelim. Pay bazında devre kesici sadece paylarda ve sadece sürekli işlemde çalışır. Eşikler Yıldızda %10, Anada %7,5, Altta %5. Fiyat bu eşiği aşacaksa pay tek fiyat emir toplamaya alınır. Son 15 dakikada, yani akşam altıya çeyrek kala çalışırsa emir toplama kapanış seansına kadar uzar. Burada bir uyarı yapayım. Emir toplama süresi kaynakta iki farklı yerde farklı yazılmış. Bu yüzden süreden çok eşik oranlarına odaklan.", "Endekse bağlı devre kesicide ölçü BIST 100 endeksi. Endeks önceki kapanışa göre %6 düşerse sistem çalışır. Paylar 10 dakika durur ve bu sürede emir iptal edemezsin. Varant, sertifika, borsa yatırım fonu ve rüçhan sıraları ise 20 dakika durur. Akşam 5,5'tan sonra çalışırsa işlemler kapanış seansına kadar durur. Aynı gün ikinci kez çalışmaz. Akşam altıdan sonra da devreye girmez.", "Açığa satış ve kredili işlem sadece Yıldız Pazar, Ana Pazar ve Girişim Sermayesi Pazarı paylarında ve borsa yatırım fonlarında yapılır. Varant, sertifika, gayrimenkul fonu ve girişim sermayesi fonunda yapılamaz. Gayrimenkul sertifikasında ise ilginç bir ayrım var. Kredili alım olur ama açığa satış olmaz. İşlemleri beş iş gününden fazla durdurulan pay listeden çıkar ve üç aylık geçici listeye alınır.", "Yukarı adım kuralı şunu söyler. Açığa satış son fiyattan yüksek bir fiyattan yapılır. Ama son fiyat bir önceki fiyattan yüksekse son fiyattan da satabilirsin. Yıldız Pazarda bu kural yok. Ana Pazarda ve fonlarda var. BIST 100 endeksi gün içinde %2 düşerse kural her yerde seans sonuna kadar devreye girer. Açılış seansında ise açığa satış emri hiç giremezsin.", "Brüt takası şöyle düşün. Normalde gün içinde alıp sattığın payın sadece net farkını teslim edersin. Brüt takasta bu netleşme kalkar. Alacaksan nakdin, satacaksan payın hesabında hazır olmalı. Amaç yanıltıcı al sat işlemlerini önlemek. Piyasa yapıcı ve likidite sağlayıcının kotasyon işlemleri ise bu kuraldan muaf tutulur.", "Son olarak Volatilite Bazlı Tedbir Sistemi. Beş basamaklı bir merdiven var ve her basamak bir ay sürer. Birinci basamak açığa satış ve kredili işlem yasağı. İkincisi brüt takas. Üçüncüsü emir paketi, yani piyasa emri kısıtı ve emir iptal yasağı. Dördüncüsü tek fiyat yöntemi. Beşincisi internet üzerinden emir yasağı. Üst basamağa çıkınca alttakiler de devam eder. Tedbirler piyasa kapandıktan sonra KAP'ta duyurulur.", "Toparlayalım. Birincisi, piyasa yapıcıda kotasyon en az 250 lot, başarı ölçütü %90, borsa payı indirimi %50. İkincisi, likidite sağlayıcıda sınırlar özkaynağın 20 katı ve işlem hacminin %80'i. Üçüncüsü, özel işlem bildiriminde birinci kademe %6, ikinci kademe %10 bandında. Dördüncüsü, endekse bağlı devre kesici %6 düşüşte, otomatik yukarı adım kuralı %2 düşüşte çalışır. Beşincisi, volatilite tedbirlerinin sırası açığa satış yasağı, brüt takas, emir paketi, tek fiyat ve internet emir yasağıdır."], "5": ["Merhaba, Borsa İstanbul Borçlanma Araçları Piyasası bölümündeyiz. Bugün pazarları tek tek gezeceğiz. Saatleri, valörleri, emir büyüklüklerini ve repo pazarlarının farkını konuş
