(repo pazarları ve taahhütlü işlemler).<\/li>\n<li><b>Valör:<\/b> menkul kıymet ve paranın el değiştirdiği, takasın gerçekleştiği tarih.<\/li>\n<li><b>TLREF:<\/b> Türk Lirası Gecelik Referans Faiz Oranı; <b>TLREFK:<\/b> Türk Lirası Gecelik Katılım Referans Getiri Oranı.<\/li>\n<\/ul>\n\n<h3>Kimler işlem yapar, neler işlem görür<\/h3>\n<ul>\n<li>Yetkili <b>yatırım kuruluşları ve TCMB<\/b>. Üyeler taahhütname imzalar, Takasbank'ta hesap açar, Takasbank'ın belirlediği teminatı yatırır.<\/li>\n<li>İşlem görecek araçları pazar bazında <b>Borsa Yönetim Kurulu<\/b> belirler; işlem görmeme kararı da alabilir.<\/li>\n<li>TCMB, Hazine ve Hazine'nin varlık kiralama şirketlerinin yurt içi ihraçları ihraç günü (ihale/doğrudan satışta satış sonuçlarının ilanından itibaren) işlem görür. Hazine'nin yurt dışı ihraçları ihraç tarihinde başlar. Diğerlerinin başlangıç tarihi <b>KAP'ta<\/b> ilan edilir.<\/li>\n<li>Halka arz edilmeden ihraç edilen araçlar yalnızca <b>nitelikli yatırımcılar<\/b> arasında el değiştirir; bu koşulu işlem yapan yatırım kuruluşu sağlar.<\/li>\n<li>Araçlar TL veya döviz ödemeli olabilir.<\/li>\n<\/ul>\n<table><tr><th>Araç<\/th><th>Ayırt edici özellik<\/th><\/tr>\n<tr><td>Devlet tahvili<\/td><td>Vadesi 1 yıl (364 gün) ve daha uzun DİBS<\/td><\/tr>\n<tr><td>Hazine bonosu<\/td><td>Vadesi 1 yıldan kısa (364 güne kadar) DİBS<\/td><\/tr>\n<tr><td>GES<\/td><td>Getirisi KİT'lerden bütçeye aktarılan hasılat paylarına endeksli<\/td><\/tr>\n<tr><td>GOS<\/td><td>Köprü, baraj, santral gibi kamu altyapı tesislerinin gelirine ortaklık; mülkiyet ve işletmeyle ilişki yok<\/td><\/tr>\n<tr><td>Likidite senedi<\/td><td>TCMB'nin açık piyasa aracı; <b>iskontolu<\/b>, vadesi <b>91 günü aşmaz<\/b>, tek toplu senet<\/td><\/tr>\n<tr><td>Özel sektör tahvili<\/td><td>Vadesi <b>365 gün veya daha uzun<\/b> ÖSBA<\/td><\/tr>\n<tr><td>Finansman bonosu<\/td><td>Vadesi 30 günden az, 364 günden fazla olamaz<\/td><\/tr>\n<tr><td>VDMK / İDMK<\/td><td>VFF veya İFK'nin / KFF veya İFK'nin devraldığı varlıklar karşılığı<\/td><\/tr>\n<tr><td>VTMK<\/td><td>Bankalar, İFK, leasing, finansman, faktoring şirketleri, GYO'lar vb. teminat varlıkları karşılığı<\/td><\/tr>\n<tr><td>İTMK<\/td><td>Yalnızca KFK ve İFK ihraç edebilir; ihraççının genel yükümlülüğü<\/td><\/tr>\n<tr><td>Kira sertifikası<\/td><td>Varlık kiralama şirketi (anonim şirket) ihraç eder<\/td><\/tr>\n<\/table>\n\n<h3>İşlem saatleri<\/h3>\n<p>Genel kural: hafta içi <b>09.30–17.30<\/b>; aynı gün valörlü işlemler tüm pazarlarda <b>14.00<\/b>'te biter. Tek istisna <b>yatırım fonları<\/b>: aynı gün valörlü işlemleri 17.30'a kadar yapabilir. Saatleri Borsa Yönetim Kurulu belirler.<\/p>\n<table><tr><th>Pazar<\/th><th>Aynı gün valörlü<\/th><th>İleri valörlü<\/th><\/tr>\n<tr><td>Kesin Alım Satım, Repo Ters Repo, MK Tercihli Repo, Taahhütlü İşlemler, Gözaltı<\/td><td>09.30–14.00<\/td><td>09.30–17.30<\/td><\/tr>\n<tr><td>Nitelikli Yatırımcıya İhraç<\/td><td>09.30–14.00<\/td><td>09.30–14.00<\/td><\/tr>\n<tr><td>Pay Senedi Repo<\/td><td>10.00–14.00<\/td><td>10.00–17.30<\/td><\/tr>\n<tr><td>Uluslararası Tahvil<\/td><td>Yok<\/td><td>09.30–17.30<\/td><\/tr>\n<\/table>\n<ul>\n<li>Açık piyasa işlemleri için <b>09.00–09.30<\/b> arasında yalnızca <b>TCMB<\/b>, Repo Ters Repo ve Taahhütlü İşlemler pazarlarına emir iletebilir.<\/li>\n<li>Dikkat: Uluslararası Tahvil Pazarı'nda aynı gün valörlü emir girilemez.<\/li>\n<\/ul>\n\n<h3>Emir iletimi ve şeffaflık<\/h3>\n<ul>\n<li>Emirler BISTECH'e terminal ve/veya <b>FIX<\/b> protokolüyle iletilir. Erişim sorununda telefonla: temsilci kullanıcı kodu ve <b>tek kullanımlık SMS şifresini<\/b> söyler, emri piyasa uzmanı girer, emir numarası temsilciye bildirilir.<\/li>\n<li>Ekranlarda emri giren üyenin kodu görünmez; karşı taraf bilgisi <b>işlem gerçekleşince<\/b> sadece taraflara verilir. Taraf olmayanlar işlemi görür, tarafları göremez.<\/li>\n<li>Aynı fiyattaki emirlerin miktarı ekranda birikimli görünür.<\/li>\n<li>Üyenin kendi emirlerini karşıladığı tek taraflı (çapraz) işlemler Borsa kaydına alınmaz, fiyat ve getirisi bültende yayımlanmaz; hacim ve sözleşme sayısı toplamlara eklenir.<\/li>\n<\/ul>\n\n<h3>Eşleşme yöntemi ve öncelik<\/h3>\n<ul>\n<li><b>Çok fiyat (sürekli müzayede)<\/b> esastır; <b>tek fiyat<\/b> yöntemi yalnız özel belirlenen durumlarda.<\/li>\n<li>Fiyat eşit değilse işlem fiyatı, <b>sistemde önce bekleyen emrin<\/b> fiyatı/oranıdır.<\/li>\n<\/ul>\n<table><tr><th>Pazar<\/th><th>Öncelik<\/th><\/tr>\n<tr><td>Kesin Alım Satım, Uluslararası Tahvil, Gözaltı, Nitelikli Yatırımcıya İhraç<\/td><td>Alımda en yüksek, satımda en düşük fiyat; sonra zaman<\/td><\/tr>\n<tr><td>Repo Ters Repo, Pay Senedi Repo<\/td><td>Repoda en yüksek oran, ters repoda en düşük oran; sonra zaman<\/td><\/tr>\n<tr><td>MK Tercihli Repo, Taahhütlü İşlemler<\/td><td>Repo (geri alma taahhüdüyle satım): en yüksek oran, sonra en düşük MK fiyatı. Ters repo: en düşük oran, sonra en yüksek MK fiyatı; sonra zaman<\/td><\/tr>\n<\/table>\n\n<h3>Emir türleri ve tipleri<\/h3>\n<ul>\n<li>Türler: kesin alım, kesin satım, repo, ters repo, taahhütlü işlem, <b>özel işlem emri<\/b> (yalnız seçilen karşı kuruluş görür) ve <b>bağlayıcı olmayan emir<\/b>.<\/li>\n<li><b>Limitli emir:<\/b> fiyat/getiri (repo için oran) ve tutar belirtilir; koşul yoksa kalan kısım bekler.<\/li>\n<li><b>Piyasa emri:<\/b> yalnız miktar/tutar; kalan kısım otomatik iptal. Dikkat: <b>tek fiyat seansında girilemez<\/b>, sadece sürekli müzayedede.<\/li>\n<li><b>Dengeleyici emir:<\/b> tek fiyat yönteminde denge fiyatının hesabına katılmaz; eşleşme fiyatında karşılanmayan emirlerle eşleşir; karşılanmayan kısım iptal.<\/li>\n<li><b>Kalanı İptal Et (KİE):<\/b> limitli, dengeleyici veya piyasa emriyle verilebilir. <b>Gerçekleşmezse İptal Et (GİE):<\/b> tamamı gerçekleşmezse iptal; yalnız limitli veya piyasa emriyle.<\/li>\n<\/ul>\n\n<h3>Valör süreleri<\/h3>\n<table><tr><th>Pazar / araç<\/th><th>Asgari<\/th><th>Azami başlangıç valörü<\/th><\/tr>\n<tr><td>KAS ve Gözaltı – DİBS (TL)<\/td><td>0<\/td><td>90 takvim günü<\/td><\/tr>\n<tr><td>KAS ve Gözaltı – DİBS (döviz)<\/td><td>1<\/td><td>90 takvim günü<\/td><\/tr>\n<tr><td>KAS – Hazine altın tahvili / altına dayalı kira sertifikası<\/td><td>0<\/td><td>7 takvim günü<\/td><\/tr>\n<tr><td>KAS – ÖSBA ve diğer<\/td><td>0<\/td><td>30 takvim günü<\/td><\/tr>\n<tr><td>Uluslararası Tahvil<\/td><td>1<\/td><td>15 takvim günü<\/td><\/tr>\n<tr><td>Nitelikli Yatırımcıya İhraç<\/td><td>0<\/td><td>7 takvim günü<\/td><\/tr>\n<tr><td>Repo Ters Repo, MK Tercihli Repo, Taahhütlü İşlemler<\/td><td>0<\/td><td>7 takvim günü<\/td><\/tr>\n<tr><td>Pay Senedi Repo<\/td><td>0<\/td><td><b>2 iş günü<\/b><\/td><\/tr>\n<\/table>\n<p>Repo pazarlarında <b>bitiş valörü en fazla 1 yıl<\/b>. Döviz ödemeli araçlar en az 1 iş günü valörle işlem görür; azami valör kamu ihraçlarında 90, diğerlerinde 30 takvim günü. Dolar cinsi araçlar 100 ABD Doları, euro cinsi 100 Euro üzerinden fiyatlanır.<\/p>\n\n<h3>Emir büyüklükleri (nominal / tutar)<\/h3>\n<table><tr><th>Pazar<\/th><th>Normal emirler<\/th><th>Küçük emirler<\/th><th>Özel işlem emri<\/th><\/tr>\n<tr><td>KAS – DİBS (TL) ve TCMB likidite senedi<\/td><td>1.000.000 – 100.000.000<\/td><td>10.000 – 990.000<\/td><td>100.000.000 – 500.000.000<\/td><\/tr>\n<tr><td>KAS – DİBS (USD/EUR)<\/td><td>1.000 – 5.000.000<\/td><td>Yok<\/td><td>5.000.000 – 50.000.000<\/td><\/tr>\n<tr><td>KAS – diğer araçlar (TL)<\/td><td>10.000 – 100.000.000<\/td><td>Yok<\/td><td>100.000.000 – 500.000.000<\/td><\/tr>\n<tr><td>KAS – altın tahvili / altına dayalı kira sertifikası<\/td><td>995 – 99.500<\/td><td>Yok<\/td><td>99.500 – 995.000<\/td><\/tr>\n<tr><td>Repo Ters Repo<\/td><td>1.000.000 – 400.000.000<\/td><td>10.000 – 990.000<\/td><td>400.000.000 – 800.000.000<\/td><\/tr>\n<tr><td>Gözaltı, MK Tercihli Repo, Pay Senedi Repo, Taahhütlü İşlemler<\/td><td>10.000 – 100.000.000<\/td><td>Yok<\/td><td>Yok<\/td><\/tr>\n<tr><td>Uluslararası Tahvil (USD/EUR)<\/td><td>10.000 – 5.000.000<\/td><td>Yok<\/td><td>1.000 – 5.000.000<\/td><\/tr>\n<tr><td>Nitelikli Yatırımcıya İhraç<\/td><td>50.000 – 100.000.000<\/td><td>Yok<\/td><td>Yok<\/td><\/tr>\n<\/table>\n\n<h3>Emir geçerliliği, değişiklik, iptal<\/h3>\n<ul>\n<li>Emirler <b>gün için<\/b> geçerlidir; ertesi güne emir kalmaz. Aynı gün (başlangıç) valörlü emirler <b>14.00<\/b>'te, ileri valörlüler <b>17.30<\/b>'da otomatik iptal. NYİP'te emirler 14.00'e kadar geçerli.<\/li>\n<li>Hesap tipi, hesap kodu ve hesap no değiştirilemez.<\/li>\n<li><b>Öncelik kaybı:<\/b> fiyat/getiri veya oran değişikliği ile miktar/tutar <b>artışı<\/b>; MK Tercihli Repo ve Taahhütlü İşlemlerde MK fiyatı değişikliği de. Dikkat: miktarı <b>azaltmak<\/b> veya bilgi alanını değiştirmek önceliği kaybettirmez.<\/li>\n<li><b>İşlem iptali:<\/b> üye hatası prensip olarak iptal sebebi değildir. Kabul edilen gerekçeler: alış yerine satış (repo yerine ters repo) girmek, fiyat/oran/araç/hesap/miktar alanında maddi hata, portföyde olmayan nakdi veya aracı sehven satmak. İki taraf da elektronik onay verir, Borsa iptal eder, iptal <b>KAP'ta<\/b> ilan edilir. Hatalı hesaba yapılan işlemlerin düzeltmesi Takasbank prosedürüne göredir.<\/li>\n<li>Repo Ters Repo'da teminat menkul kıymet bildirimi Takasbank ekranından <b>15.00<\/b>'e kadar; sonrasında yazılı taleple ve Takasbank uygun görürse.<\/li>\n<li>Fiyat ve oranlar aynı gün <b>Borsa bülteninde<\/b>, her pazar için ayrı bültenle ilan edilir.<\/li>\n<\/ul>\n\n<h3>Piyasa yapıcılığı (yalnız Kesin Alım Satım Pazarı)<\/h3>\n<table><tr><th><\/th><th>DİBS piyasa yapıcılığı<\/th><th>ÖSBA piyasa yapıcılığı<\/th><\/tr>\n<tr><td>Esasları ve kuruluşları belirleyen<\/td><td><b>Hazine<\/b><\/td><td>Başvuruyu <b>Borsa Genel Müdürlüğü<\/b> karara bağlar<\/td><\/tr>\n<tr><td>Kapsam<\/td><td>Çift taraflı kotasyon zorunlu ölçüt ihraçlar<\/td><td>Tüm ÖSBA ve kira sertifikaları<\/td><\/tr>\n<tr><td>İzleme<\/td><td>Borsa izler, ihlali Hazine'ye ve kuruluşa bildirir<\/td><td>Değerlendirme ölçütleri: geçmiş KAS hacmi, temerrüt durumu, piyasa yapıcılık performansı<\/td><\/tr>\n<\/table>\n<ul>\n<li>ÖSBA piyasa yapıcısı ihraç öncesi ya da sonrası taahhütname ile başvurur; karar KAP'ta ilan edilir. Yapıcılık aracın <b>vadesi boyunca<\/b> sürer.<\/li>\n<li>Çekilme: <b>5 işlem günü<\/b> önceden yazılı bildirim. Emir gerçekleşir ya da iptal olursa <b>10 dakika<\/b> içinde yeni emir zorunlu.<\/li>\n<li>Bir araçta aynı anda yalnız bir alış ve bir satış piyasa yapıcı emri olabilir; yeni emir eskisini iptal eder.<\/li>\n<li>Olağanüstü durumda faaliyet, Genel Müdürlükçe geçici durdurulabilir (KAP'ta ilan).<\/li>\n<\/ul>\n\n<h3>ISIN kodu (12 hane)<\/h3>\n<p>Takasbank üretir. 1–2. hane ülke (TR), 12. hane kontrol hanesi. Pay Senedi Repo Pazarı'nda ISIN yerine 4 ya da 5 haneli pay kodu kullanılır.<\/p>\n<table><tr><th>Hane<\/th><th>Hazine'nin yurt içi ihraçları<\/th><th>Diğer menkul kıymetler<\/th><\/tr>\n<tr><td>3<\/td><td>T devlet tahvili, B hazine bonosu, H halka arz, G GOS, D kira sertifikası<\/td><td>C depo sertifikası, D kira sertifikası, F finansman bonosu, N gayrimenkul sertifikası, S özel sektör tahvili, Z diğer finansal enstrüman, 1 diğer özel sektör menkul kıymeti<\/td><\/tr>\n<tr><td>4–9 / 4–7<\/td><td>İtfa tarihi gün-ay-yıl (13 Mart 2023 = 130323)<\/td><td>4–7: ihraççı kodu<\/td><\/tr>\n<tr><td>10 / 8–10<\/td><td>10. hane: TL için T tümü, A anapara, K kupon; döviz için F tümü, P anapara, C kupon<\/td><td>8. hane itfa ayı: 1–9 Ocak–Eylül, E Ekim, K Kasım, A Aralık; 9–10. hane yılın son iki hanesi<\/td><\/tr>\n<tr><td>11<\/td><td>Aynı itfa tarihli ihraçların sıra numarası: 1–9, sonra A–Z<\/td><td>Aynı kural<\/td><\/tr>\n<\/table>\n<p>Örnek: TRT140727K13 = 14 Temmuz 2027 itfalı devlet tahvilinin kuponu; TRSRSGY21818 = RSGY kodlu şirketin 2018 Şubat itfalı tahvili. Enstrüman adı menkul kıymet + pazar + valör içerir (TRT240724T15_KESN_T1 = KAS, T+1 valör).<\/p>\n\n<h3>Yatırım fonu ve yatırım ortaklığı işlemleri<\/h3>\n<ul>\n<li>Emirde hangi fon/ortaklık için olduğu Borsa'nın standart koduyla belirtilir; fon emri aracı kuruluşun diğer emirleriyle eşleşebilir.<\/li>\n<li>Fon adına ters repoda alınan araçlar bitiş valörüne kadar <b>fon adına<\/b> saklanır; üye kendi hesabına kullanamaz.<\/li>\n<li>Yatırım <b>ortaklıkları<\/b> 14.00'ten sonra aynı gün valörlü emir iletemez; <b>fonlar<\/b> kapanışa kadar iletebilir.<\/li>\n<li>14.00–17.30 arası fon işlemlerinde önce fon emri girilir, kuruluş kendisi karşılayabilir. Referans: 14.00'e kadar oluşan <b>ağırlıklı ortalama<\/b> fiyat/oran, işlem <b>fon lehine<\/b> olmalı: KAS alımda ağırlıklı ortalama fiyat veya altı, satımda veya üstü; ters repoda ağırlıklı ortalama oran veya üstü, repoda veya altı.<\/li>\n<li>İki tarafı da fon olan işlemler ağırlıklı ortalama üzerinden yapılır. Bu işlemlerin takası kuruluşlar arasında yapılır, üye sıralamasında yer almaz.<\/li>\n<\/ul>\n\n<h3>Risk, takas, temerrüt<\/h3>\n<ul>\n<li>İşlem öncesi risk ölçütlerini ve sınırlarını <b>Genel Müdürlük<\/b> belirler ve değiştirebilir; emir bazında teminat istenebilir.<\/li>\n<li>Takas ve teminat Takasbank düzenlemelerine göre. Takasbank, temerrüde düşen kuruluş nam ve hesabına <b>Temerrüt Pazarı<\/b>'nda işlem yapar; temerrüt yokken bu pazarda tanımlı enstrüman olmaz, temerrütte yalnız Takasbank emrinin karşı yönlü emri girilebilir.<\/li>\n<\/ul>\n\n<h3>Kesin Alım Satım Pazarı<\/h3>\n<ul>\n<li>Aynı gün veya ileri valörlü kesin alım satım; satıcı valörde menkul kıymeti teslim eder, takasla mülkiyet geçer.<\/li>\n<li>Temiz fiyatlı araçlarda işlemiş faizin hesaplanamadığı valörlerde ve TÜFE'ye endeksli tahvillerde referans endeksin ilan edilmediği valörlerde emir girilemez.<\/li>\n<li>Fiyat tabanı 100 birim; altın tahvillerinde TL cinsinden 1 birim.<\/li>\n<\/ul>\n<table><tr><th>Emir giriş yöntemi<\/th><th>Araçlar<\/th><\/tr>\n<tr><td>Basit getiri<\/td><td>İskontolu ihraçlar; kuponlu tahvillerin (TÜFE'ye endeksli hariç) ayrıştırılmış anaparaları<\/td><\/tr>\n<tr><td>Temiz fiyat<\/td><td>Sabit faizli tahviller, sabit kira getirili kira sertifikaları, ilk kuponu sabitlenmiş değişken faizliler, TLREF/TLREFK'ye dayalı Hazine ihraçları; Şubat 2007 sonrası TÜFE'ye endeksliler için enflasyon katkısı hariç temiz fiyat<\/td><\/tr>\n<tr><td>Kirli fiyat<\/td><td>TÜFE'ye endeksli anüite tahviller, ayrıştırılmış kuponlar, ilk kuponu belli olmayan değişken faizliler, Hazine altın tahvilleri ve altına dayalı kira sertifikaları, gayrimenkul sertifikaları<\/td><\/tr>\n<\/table>\n<table><tr><th>Adım<\/th><th>Değer<\/th><\/tr>\n<tr><td>Temiz veya kirli fiyat<\/td><td>0,001 TL<\/td><\/tr>\n<tr><td>Getiri<\/td><td>%0,01<\/td><\/tr>\n<tr><td>TLREF/TLREFK'ye dayalı araçların kuponu belirsiz dönemleri<\/td><td>0,0001 TL<\/td><\/tr>\n<tr><td>Hazine altın tahvili / altına dayalı kira sertifikası<\/td><td>0,00001 TL<\/td><\/tr>\n<\/table>\n<h4>Tek fiyat uygulaması<\/h4>\n<ul>\n<li>Genel Müdürlüğün ilan ettiği araçlarda <b>12.10–12.30<\/b>: emir toplama <b>12.10–12.25<\/b>, eşleştirme <b>12.25–12.30<\/b>. Bu sırada çok fiyatla işlem yapılamaz; limitli ve dengeleyici emir girilebilir.<\/li>\n<li><b>Denge fiyatı:<\/b> en çok işlem miktarını sağlayan fiyat. Eşitlikte, karşılanmayan miktarı en az bırakan fiyat. Yine eşitlikte: alış miktarı fazlaysa <b>yüksek<\/b>, satış fazlaysa <b>düşük<\/b> fiyat, eşitse <b>aritmetik ortalama<\/b>.<\/li>\n<li>Karşılanmayan limit emirler pasife döner; dengeleyici emirler eşleşme bitince iptal olur.<\/li>\n<\/ul>\n\n<h3>Repo Ters Repo Pazarı<\/h3>\n<ul>\n<li>Repo yapan V1'de menkul kıymet verip para alır, V2'de anapara + faiz − stopaj öder. Ters repocu para satar, menkul kıymet alır.<\/li>\n<li>İşleme konu: TL veya döviz ödemeli <b>devlet tahvili, hazine bonosu ve TCMB likidite senedi<\/b>. Gruplar: <b>S<\/b> = TL ödemeli DİBS ve likidite senetleri, <b>K<\/b> = döviz ödemeli DİBS.<\/li>\n<li>Ters repocu hangi ISIN'i alacağını emir aşamasında bilmez; repocu işlemden sonra <b>en fazla 5 farklı<\/b> menkul kıymet bildirir.<\/li>\n<li>Teminat araçlar bitiş valörüne kadar ters repocu adına <b>bloke<\/b> hesapta tutulur. İlk işlemin vadesinden kısa olmak koşuluyla başka repoda kullanılabilir: <b>zincirleme repo<\/b>.<\/li>\n<li>Kupon ödeme günü V1 ile V2 arasına düşen araç repoya konu edilemez.<\/li>\n<li>Oran adımı <b>%0,01<\/b>. Bankaların bu pazardaki repo fonları <b>zorunlu karşılığa tabi değildir<\/b>.<\/li>\n<\/ul>\n\n<h3>Menkul Kıymet Tercihli Repo ve Pay Senedi Repo<\/h3>\n<ul>\n<li><b>MK Tercihli Repo:<\/b> emirde ISIN ve MK fiyatı belirtilir. KAS'ta işlem gören TL cinsi araçlar (özel sektör dahil). Oran adımı %0,01, fiyat adımı 0,001 TL. Getiri ile işlem gören araçlarda takas fiyatı üzerinden emir. Aracın itfa tarihi bitiş valörüne eşit veya ondan önce olamaz. Yatırım kuruluşu kendi ihraç ettiği aracı portföyü için repoya veremez. KAS'ta durdurulan araç burada da durur.<\/li>\n<li><b>Pay Senedi Repo:<\/b> <b>BIST 50<\/b> paylarından Genel Müdürlüğün uygun gördükleri. Pay fiyatı, işlem anında Pay Piyasası'ndaki <b>son işlem fiyatı<\/b>; payda henüz işlem yoksa emir reddedilir. Özsermaye hallerinde fiyat değişim tarihi ile MKK'da gerçekleşme arasındaki <b>iki gün<\/b> işlem yapılamaz (tahsisli artış hariç). Vade kırılabilir (esaslar Takasbank'ta). Pay Piyasası durursa burası da durur.<\/li>\n<\/ul>\n<table><tr><th><\/th><th>Repo Ters Repo<\/th><th>MK Tercihli Repo<\/th><th>Pay Senedi Repo<\/th><\/tr>\n<tr><td>Teminat aracı emirde belli mi<\/td><td>Hayır, yalnız grup kodu<\/td><td>Evet (ISIN + fiyat)<\/td><td>Evet (pay)<\/td><\/tr>\n<tr><td>Eşleşme için<\/td><td>Oran<\/td><td>Oran + araç + fiyat<\/td><td>Oran + pay<\/td><\/tr>\n<tr><td>Teminat olabilecek<\/td><td>Yalnız kamu (DİBS, likidite senedi)<\/td><td>Kamu + özel sektör borçlanma araçları<\/td><td>Paylar<\/td><\/tr>\n<\/table>\n\n<h3>Diğer pazarlar<\/h3>\n<ul>\n<li><b>Uluslararası Tahvil Pazarı:<\/b> Hazine'nin dış borçlanma araçları (Eurotahvil) ve döviz cinsi araçlar. <b>Bağlayıcı olmayan emir<\/b> ilan tahtası işlevi görür, işleme dönüşmez. Asgari nominal 10.000 (Hazine'nin küpürüne göre), azami 5.000.000. Valör en az 1 iş günü, en fazla 15 gün. Fiyat adımı 0,0001.<\/li>\n<li><b>Nitelikli Yatırımcıya İhraç Pazarı:<\/b> BAP'ta <b>birincil ihracın yapıldığı tek pazar<\/b>; yalnız özel sektörün nitelikli yatırımcıya ihraçları. Satış süresi <b>en fazla 10 iş günü<\/b>; satılamayan kısım Borsa Başkanlığından ek süreyle bir kez daha satışa çıkar, yine satılamazsa iptal. Satış emrini yalnız ihraca aracılık eden kurum girer, fiyatı serbestçe değiştirebilir. Aynı gün ile 7 gün arası valör; emir 50.000–100.000.000 TL; fiyat adımı 0,001, getiri adımı %0,01. İhraç tamamlanınca <b>izleyen iş günü<\/b> KAS'ta nitelikli yatırımcılar arasında işlem görür; Borsa dışında da işlem görebilir. Yanlış valör, ihraççı hesabına olmayan satış veya SPK limitini aşan satış <b>resen iptal<\/b> edilir.<\/li>\n<li><b>Gözaltı Pazarı:<\/b> Kotasyon Yönergesi uyarınca KAS'tan alınan araçlar. Ana paranın ödenemeyeceği KAP'ta açıklanır ve toplam nominalin <b>en az üçte ikisinin<\/b> muvafakatiyle yeniden yapılandırma itfaya kadar açıklanırsa aracın tamamı buraya alınabilir. Dikkat: Gözaltına alınan araç <b>KAS'a geri dönmez<\/b>. Temiz fiyatlı aracın sonraki kupon oranı ödeme gününden bir işlem günü önce 17.30'a kadar bildirilmezse Genel Müdür işlemleri durdurabilir.<\/li>\n<li><b>Taahhütlü İşlemler Pazarı:<\/b> Hazine'nin varlık kiralama şirketlerinin TL kira sertifikaları vb.; araç önceden bellidir. V2'de taraflar Takasbank ile işlem yapar; <b>Takasbank<\/b> bitiş valöründe işlemlerden birinden ya da ikisinden <b>sebep göstermeden vazgeçebilir<\/b>. Getiri ödeme günü V1 ile V2 arasına düşen araç işleme konu olamaz. Oran adımı %0,01, fiyat adımı 0,001 TL.<\/li>\n<\/ul>", "sorular": [{"q": "Borsa İstanbul Borçlanma Araçları Piyasası'nın ilk pazarı olan Kesin Alım Satım Pazarı hangi tarihte faaliyete geçmiştir?", "o": ["17 Mayıs 2010", "17 Şubat 1993", "2 Temmuz 2018", "17 Haziran 1991", "1 Aralık 2017"], "a": 3, "e": "BAP, 17 Haziran 1991'de Kesin Alım Satım Pazarı ile başladı. 17 Şubat 1993 Repo Ters Repo Pazarı'nın açılış tarihidir."}, {"q": "BAP'ta aynı gün valörlü işlemler kural olarak 14.00'te sona erer. Bu kuralın tek istisnası olarak aynı gün valörlü işlemlerini 17.30'a kadar yapabilen hangisidir?", "o": ["Aracı kurum müşterileri", "Bankaların kendi portföyleri", "TCMB", "Yatırım fonları", "Yatırım ortaklıkları"], "a": 3, "e": "Yatırım fonlarının aynı gün valörlü işlemleri 17.30'a kadar yapılabilir. Yatırım ortaklıkları ise 14.00'ten sonra aynı gün valörlü emir iletemez."}, {"q": "Pay Senedi Repo Pazarı'nda işlemler saat kaçta başlar?", "o": ["10.30", "09.30", "14.00", "10.00", "09.00"], "a": 3, "e": "BAP'ta işlemler 09.30'da başlarken Pay Senedi Repo Pazarı'nda 10.00'da başlar."}, {"q": "Açık piyasa işlemleri çerçevesinde 09.00–09.30 arasında yalnızca TCMB'nin emir iletebildiği BAP pazarları hangileridir?", "o": ["Repo Ters Repo ve Taahhütlü İşlemler Pazarı", "Kesin Alım Satım ve Repo Ters Repo Pazarı", "Nitelikli Yatırımcıya İhraç ve Uluslararası Tahvil Pazarı", "Pay Senedi Repo ve Menkul Kıymet Tercihli Repo Pazarı", "Kesin Alım Satım ve Gözaltı Pazarı"], "a": 0, "e": "TCMB 09.00–09.30 arasında Repo Ters Repo Pazarı ve Taahhütlü İşlemler Pazarı'na emir iletebilir; bu sürede diğer üyeler emir giremez."}, {"q": "Kesin Alım Satım Pazarı'nda Hazine tarafından ihraç edilen altın tahvilleri için uygulanabilecek azami valör süresi nedir?", "o": ["2 iş günü", "30 takvim günü", "15 takvim günü", "90 takvim günü", "7 takvim günü"], "a": 4, "e": "Altın tahvilleri ve altına dayalı kira sertifikalarında azami valör 7 takvim günüdür. DİBS için 90, ÖSBA için 30 takvim günü uygulanır."}, {"q": "Pay Senedi Repo Pazarı'nda iletilebilecek azami ileri başlangıç valörü ve azami bitiş valörü hangisinde doğru verilmiştir?", "o": ["1 iş günü / 365 gün", "2 iş günü / 1 yıl", "2 iş günü / 2 yıl", "7 takvim günü / 1 yıl", "7 takvim günü / 2 yıl"], "a": 1, "e": "Pay Senedi Repo Pazarı'nda başlangıç valörü en fazla 2 iş günü ileri olabilir, bitiş valörü en fazla 1 yıldır. Diğer repo pazarlarında başlangıç için 7 takvim günü uygulanır."}, {"q": "Uluslararası Tahvil Pazarı'nda emirlerin valörü için hangisi doğrudur?", "o": ["Aynı gün ile 7 takvim günü arasında olabilir", "En az 1 iş günü, en fazla 15 gün olabilir", "En az 2 iş günü, en fazla 90 takvim günü olabilir", "En az 1 iş günü, en fazla 30 takvim günü olabilir", "Aynı gün ile 15 takvim günü arasında olabilir"], "a": 1, "e": "Uluslararası Tahvil Pazarı'nda aynı gün valörlü emir girilemez; valör en az 1 iş günü, en fazla 15 gündür."}, {"q": "Repo Ters Repo Pazarı'nda Normal Emirler Pazarı için asgari ve azami emir büyüklükleri hangisidir?", "o": ["1.000.000 – 400.000.000 TL", "10.000 – 990.000 TL", "1.000.000 – 100.000.000 TL", "400.000.000 – 800.000.000 TL", "10.000 – 100.000.000 TL"], "a": 0, "e": "Repo Ters Repo'da Normal Emirler Pazarı 1.000.000–400.000.000 TL'dir. 10.000–990.000 küçük emirler, 400.000.000–800.000.000 özel işlem emri aralığıdır."}, {"q": "Nitelikli Yatırımcıya İhraç Pazarı'nda asgari emir büyüklüğü ne kadardır?", "o": ["10.000 TL", "100.000 TL", "50.000 TL", "1.000.000 TL", "1.000 TL"], "a": 2, "e": "NYİP'te asgari emir 50.000 TL, azami emir 100.000.000 TL'dir."}, {"q": "BAP'ta piyasa emri ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Gerçekleşmeyen kısmı otomatik olarak iptal edilir", "Bekleyen pasif emirlerle kısmen veya tamamen karşılanabilir", "Tek fiyat seansında da girilebilir", "Fiyat, getiri veya oran belirtilmeden yalnızca miktar ya da tutarla girilir", "Farklı fiyat seviyelerinden işlem yapmayı kabul etmek anlamına gelir"], "a": 2, "e": "Piyasa emri tek fiyat seansında girilemez, yalnızca sürekli müzayede seansında girilebilir. Diğer ifadeler doğrudur."}, {"q": "Gerçekleşmezse İptal Et koşulu BAP'ta hangi emir tipleriyle birlikte kullanılabilir?", "o": ["Yalnızca dengeleyici emir", "Yalnızca limitli emir", "Limitli emir veya piyasa emri", "Piyasa emri veya dengeleyici emir", "Limitli emir, piyasa emri veya dengeleyici emir"], "a": 2, "e": "Gerçekleşmezse İptal Et yalnızca limitli emir veya piyasa emri olarak verilebilir. Kalanı İptal Et ise dengeleyici emirle de kullanılabilir."}, {"q": "Kesin Alım Satım Pazarı'nda bekleyen bir emirde yapılan hangi değişiklik emrin zaman önceliğini kaybettirmez?", "o": ["Getirinin değiştirilmesi", "Nominal tutarın artırılması", "Fiyatın kötüleştirilmesi", "Fiyatın iyileştirilmesi", "Nominal tutarın azaltılması"], "a": 4, "e": "Fiyat veya getiri değişikliği ile nominal artışı önceliği kaybettirir. Nominal tutarın azaltılması ve bilgi alanının değiştirilmesi önceliği etkilemez."}, {"q": "TRT150728K14 ISIN koduna sahip menkul kıymet hangisidir?", "o": ["15 Temmuz 2028 itfalı TL devlet tahvilinin anaparası", "15 Temmuz 2028 itfalı hazine bonosu", "15 Temmuz 2028 itfalı TL devlet tahvilinin kuponu", "15 Temmuz 2028 itfalı döviz ödemeli devlet tahvilinin kuponu", "15 Temmuz 2028 itfalı kira sertifikası"], "a": 2, "e": "3. hane T devlet tahvili, 4–9. haneler 150728 itfa tarihi, 10. hane K TL ihraçlarda kuponu gösterir. Döviz kuponu C ile, TL anapara A ile gösterilir."}, {"q": "Hazine dışındaki ihraççıların ISIN kodlarında 8. hanede yer alan A harfi neyi gösterir?", "o": ["İhraç sıra numarasının 10 olduğunu", "İtfa ayının Ekim olduğunu", "İtfa ayının Ağustos olduğunu", "İtfa ayının Aralık olduğunu", "Anapara olduğunu"], "a": 3, "e": "Diğer menkul kıymetlerde 8. hane itfa ayıdır: Ocak–Eylül 1–9, Ekim E, Kasım K, Aralık A. Anaparayı gösteren A, Hazine kodlarında 10. hanededir."}, {"q": "Kesin Alım Satım Pazarı'nda tek fiyat yöntemi uygulanan kıymetlerde emir toplama ve eşleştirme saatleri hangisinde doğru verilmiştir?", "o": ["12.10–12.25 emir toplama, 12.25–12.30 eşleştirme", "09.30–09.55 emir toplama, 09.55–10.00 eşleştirme", "12.10–12.20 emir toplama, 12.20–12.30 eşleştirme", "12.00–12.25 emir toplama, 12.25–12.30 eşleştirme", "13.55–14.00 emir toplama, 14.00–14.05 eşleştirme"], "a": 0, "e": "Tek fiyat uygulaması 12.10–12.30 arasındadır: 12.10–12.25 emir toplanır, 12.25–12.30 eşleştirilir."}, {"q": "Tek fiyat yönteminde iki fiyat seviyesi hem en yüksek işlem miktarını hem de en az karşılanmayan miktarı sağlıyor. Bu seviyelerde bekleyen alış emirlerinin toplam nominali satış emirlerinden fazladır. Denge fiyatı nasıl belirlenir?", "o": ["Düşük olan fiyat denge fiyatıdır", "Önceki günün kapanış fiyatına yakın olan seçilir", "İki fiyatın aritmetik ortalaması alınır", "Yüksek olan fiyat denge fiyatıdır", "Tek fiyat seansı iptal edilir"], "a": 3, "e": "Alış miktarı fazlaysa yüksek fiyat, satış fazlaysa düşük fiyat, miktarlar eşitse aritmetik ortalama denge fiyatı olur."}, {"q": "Repo Ters Repo Pazarı'nda K grup kodu hangi menkul kıymetleri ifade eder?", "o": ["Özel sektör tahvilleri", "Kira sertifikaları", "TCMB likidite senetleri", "TL ödemeli DİBS", "Döviz ödemeli DİBS"], "a": 4, "e": "S grubu TL ödemeli DİBS ve TCMB likidite senetlerini, K grubu döviz ödemeli DİBS'i ifade eder."}, {"q": "Repo Ters Repo Pazarı'nda işlem gerçekleştikten sonra repo yapan taraf karşılık olarak en fazla kaç farklı menkul kıymet bildirebilir?", "o": ["5", "10", "3", "Sınır yoktur", "1"], "a": 0, "e": "Repocu, emirde belirttiği gruba ait en fazla beş farklı sermaye piyasası aracını takas ekranından bildirir."}, {"q": "Menkul Kıymet Tercihli Repo Pazarı'nda aşağıdaki repo emirleri bulunmaktadır: Emir A oran %40 fiyat 101,20; Emir B oran %41 fiyat 102,00; Emir C oran %41 fiyat 101,80; Emir D oran %39 fiyat 100,00; Emir E oran %40 fiyat 100,90. Uygun ters repo emri geldiğinde ilk hangi emir gerçekleşir?", "o": ["Emir E", "Emir C", "Emir B", "Emir D", "Emir A"], "a": 1, "e": "Repo emirlerinde önce en yüksek oran, sonra en düşük MK fiyatı önceliklidir. Yüzde kırk birlik iki emirden fiyatı düşük olan C öne geçer."}, {"q": "Borsa Kotasyon Yönergesi'ne göre ana para ödemesi yapılamayacağı açıklanan bir borçlanma aracının Gözaltı Pazarı'na alınabilmesi için yeniden yapılandırmaya toplam nominalin en az ne kadarını temsil eden yatırımcıların muvafakat vermesi gerekir?", "o": ["Üçte ikisi", "Tamamı", "Üçte biri", "Dörtte üçü", "Yarısı"], "a": 0, "e": "Toplam nominalin en az üçte ikisinden muvafakat alınıp yeniden yapılandırma itfaya kadar KAP'ta açıklanırsa aracın tamamı Gözaltı Pazarı'na alınabilir."}, {"q": "Nitelikli Yatırımcıya İhraç Pazarı ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["İhraççı satış fiyatını satış süresince serbestçe belirleyebilir", "BAP'ta birincil ihracın yapılabildiği tek pazardır", "Satış emrini yalnızca ihraca aracılık eden kurum girebilir", "Satış süresi 10 iş gününü aşamaz", "İhracı tamamlanan araçlar Kesin Alım Satım Pazarı'nda tüm yatırımcılar arasında işlem görür"], "a": 4, "e": "İhracı tamamlanan araçlar izleyen iş günü Kesin Alım Satım Pazarı'nda yalnızca nitelikli yatırımcılar arasında işlem görür."}, {"q": "Dönemsel kupon oranı yüzde 6 olan bir devlet tahvilinde kupon dönemi 182 gün, son kupon ödemesinden valör tarihine kadar geçen gün sayısı 91'dir. 100 nominal için işlemiş faiz kaçtır?", "o": ["0,030", "6,000", "3,000", "1,500", "12,000"], "a": 2, "e": "İşlemiş faiz = 0,06 × (91 / 182) × 100 = 3,000. Altı, kuponun tamamıdır; 1,500 dönemin yarısının yarısıdır."}, {"q": "14.00'ten sonra yapılan aynı gün valörlü bir yatırım fonu alım işlemi Kesin Alım Satım Pazarı'nda hangi fiyattan gerçekleştirilebilir?", "o": ["Ağırlıklı ortalama fiyat veya üzerinde", "Ağırlıklı ortalama fiyat veya altında", "Serbestçe belirlenen herhangi bir fiyattan", "Yalnızca 14.00'teki son işlem fiyatından", "Günün en yüksek fiyatından"], "a": 1, "e": "Bu işlemler fon lehine olmalıdır: alımda 14.00'e kadar oluşan ağırlıklı ortalama fiyat veya altı, satımda ağırlıklı ortalama fiyat veya üstü."}, {"q": "Taahhütlü İşlemler Pazarı'nda bitiş valöründe taraflarla yapacağı işlemlerden sebep göstermeksizin vazgeçme hakkına sahip olan kimdir?", "o": ["Borsa İstanbul Genel Müdürlüğü", "Takasbank", "Geri alma taahhüdüyle satım yapan üye", "SPK", "Hazine ve Maliye Bakanlığı"], "a": 1, "e": "Takasbank bitiş valöründe iki işlemden birinden veya ikisinden de sebep göstermeden vazgeçebilir; bu nedenle hukuki sorumluluğu doğmaz."}]}, {"id": 6, "kisa": "BİAŞ Para ve Swap Piyasası", "baslik": "Borsa İstanbul Para Piyasası ve Swap Piyasası", "ozet": "Borsa İstanbul'un TL teminatlı borç alma-verme piyasası ile para ve kıymetli maden swap pazarlarının saatleri, valörleri, emir kuralları ve sınırları.", "notlar": "<h3>Borsa İstanbul Para Piyasası<\/h3>\n<p>BAP bünyesinde <b>14 Ekim 2016<\/b>'da faaliyete geçti. Türk Lirası fon arz ve talep eden banka ve aracı kurumların <b>teminatlı borç alma ve verme<\/b> işlemleri yapılır.<\/p>\n<ul>\n<li><b>Kimler:<\/b> yetkili banka ve aracı kurumlar ile <b>Takasbank<\/b>. Şartları taşıyanlar üye temsilcisi olur.<\/li>\n<li>Emir; üyenin kendi portföyü, yatırım fonu/yatırım ortaklığı, <b>kamu kaynağı<\/b> veya müşteri hesabına iletilebilir.<\/li>\n<li><b>Takasbank merkezi karşı taraftır<\/b>: alıcıya karşı satıcı, satıcıya karşı alıcı olur, takası taahhüt eder.<\/li>\n<li>Taraflar işlem sırasında birbirini bilmez; işlem gerçekleşince karşı üye bilgisi verilir.<\/li>\n<li>Üyeler anlık pozisyon takibi yapabilir; kendi emirlerini karşılayarak işlem yapabilir.<\/li>\n<\/ul>\n<table><tr><th>Kural<\/th><th>Para Piyasası<\/th><\/tr>\n<tr><td>İşlem saatleri<\/td><td>Hafta içi 09.30–17.30<\/td><\/tr>\n<tr><td>Aynı gün başlangıç valörlü emir/işlem<\/td><td><b>09.30–15.00<\/b><\/td><\/tr>\n<tr><td>İleri başlangıç valörlü emir/işlem<\/td><td>09.30–17.30<\/td><\/tr>\n<tr><td>Başlangıç valörü<\/td><td>Aynı gün veya <b>1 iş günü ileri<\/b><\/td><\/tr>\n<tr><td>Bitiş valörü<\/td><td>Taraflarca serbest, en fazla <b>2 yıl<\/b><\/td><\/tr>\n<tr><td>Faiz oranı adımı<\/td><td>%0,01<\/td><\/tr>\n<tr><td>Emir büyüklüğü<\/td><td>Asgari <b>100.000<\/b>, azami <b>100.000.000<\/b> (asgari tutar ve katları)<\/td><\/tr>\n<tr><td>Emir geçerliliği<\/td><td>Gün içi; gerçekleşmeyen emir <b>17.30<\/b>'da otomatik iptal<\/td><\/tr>\n<\/table>\n<ul>\n<li>Emirler BISTECH terminalleri veya uzak erişim arayüzüyle; gerekirse Borsa uzmanları telefonla aranarak iletilir.<\/li>\n<li><b>Öncelik:<\/b> alım emirlerinde en yüksek faiz oranlı, satım emirlerinde en düşük faiz oranlı emir; eşitlikte zaman. Alım emri aynı veya daha düşük oranlı satımla eşleşir; oranlar farklıysa sistemde önce bekleyen emrin oranı işlem oranıdır.<\/li>\n<li>Karşılanmamış emirler ve kısmen karşılanmış emirlerin kalanı değiştirilebilir ve iptal edilebilir.<\/li>\n<li>Takas, teminat ve temerrüt esaslarını <b>Takasbank<\/b> belirler.<\/li>\n<\/ul>\n\n<h3>Borsa İstanbul Swap Piyasası: amaç ve katılımcılar<\/h3>\n<ul>\n<li><b>Amaç:<\/b> para birimlerinin birbirleriyle veya kıymetli madenlerle belirlenen koşullarda değiştirilmesi.<\/li>\n<li>İşlem yapabilenler: yetkili <b>bankalar, aracı kurumlar ve TCMB<\/b>.<\/li>\n<li>Dikkat: <b>Aracı kurumlar yalnızca Kıymetli Madenler Swap Pazarı'nda<\/b> işlem yapabilir; Para Swap Pazarı'nda yapamaz.<\/li>\n<li>SPK yetkisi olmayan kıymetli madenler aracı kuruluşları, Kıymetli Madenler Swap Pazarı'nda ancak yetkili banka ve aracı kurumların <b>müşterisi<\/b> olarak işlem yapabilir.<\/li>\n<\/ul>\n\n<h3>Temel kavramlar<\/h3>\n<ul>\n<li><b>Swap:<\/b> tarafların farklı para birimlerini ya da kıymetli maden ile para birimlerini kararlaştırdıkları süre ve koşullarda değiştirmesi.<\/li>\n<li><b>Döviz kuru:<\/b> para swapında başlangıç valöründeki TL yükümlülüğünün hesaplandığı, taraflarca belirlenen kur.<\/li>\n<li><b>Swap puanı:<\/b> para swapında döviz kuru ve iki para birimi arasındaki faiz farkı dikkate alınarak vade sonu kurunun hesaplanmasında kullanılan değer; kıymetli maden swapında vade sonu maden fiyatının tespitinde kullanılan değer.<\/li>\n<li><b>Kıymetli maden:<\/b> 11/08/1989 tarihli Resmî Gazete'de yayımlanan <b>Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar<\/b>'da tanımlanan madenler.<\/li>\n<li><b>Valör:<\/b> işlemlerin başlangıç ve bitiş takas tarihleri.<\/li>\n<\/ul>\n\n<h3>Piyasanın genel işleyişi<\/h3>\n<ul>\n<li>Para swapı: <b>TL–ABD Doları<\/b> ve <b>TL–Euro<\/b>. Kıymetli maden swapı: kıymetli maden ile TL, ABD Doları veya Euro.<\/li>\n<li>Taraflar birbirini bilmez. Dikkat: BAP ve Para Piyasası'ndan farklı olarak, <b>emri eşleşen üyelere emrinin hangi üyeyle eşleştiği bilgisi verilmez<\/b>.<\/li>\n<li>Başlangıç ile bitiş arasında Takasbank yeniden değerleme yaparak <b>değişim teminatı<\/b> hesaplar; yöntemini Takasbank belirler.<\/li>\n<li>Emirler <b>çok fiyat<\/b> yöntemiyle eşleşir; terminal, uzak erişim veya telefonla iletilir.<\/li>\n<li>Hesap tipleri: Para Swap'ta <b>portföy<\/b> ve Genel Müdürlüğün uygun gördüğü <b>müşteriler<\/b>; Kıymetli Madenler Swap'ta portföy, müşteri, yatırım ortaklığı ve yatırım fonu.<\/li>\n<\/ul>\n<table><tr><th>Kural<\/th><th>Swap Piyasası<\/th><\/tr>\n<tr><td>Aynı gün başlangıç valörlü emir/işlem<\/td><td>09.30–<b>14.00<\/b><\/td><\/tr>\n<tr><td>İleri başlangıç valörlü emir/işlem<\/td><td>09.30–17.30<\/td><\/tr>\n<tr><td>Yalnız TCMB<\/td><td>09.00–09.30<\/td><\/tr>\n<tr><td>Başlangıç valörü<\/td><td>Aynı gün veya 1 iş günü ileri<\/td><\/tr>\n<tr><td>Başlangıç–bitiş arası<\/td><td>En fazla <b>365 gün<\/b><\/td><\/tr>\n<tr><td>Takas yapılamayan gün<\/td><td>Valör bir sonraki iş gününe kayar<\/td><\/tr>\n<tr><td>Emir iptali (gerçekleşmezse)<\/td><td>Aynı gün başlangıçlılar 14.00'te, ileri başlangıçlılar kapanışta<\/td><\/tr>\n<\/table>\n\n<h3>Emir tipleri<\/h3>\n<ul>\n<li><b>Limitli emir:<\/b> para swapında döviz miktarı + swap puanı + döviz kuru; maden swapında maden miktarı + swap puanı + maden fiyatı.<\/li>\n<li><b>Piyasa emri:<\/b> kur/fiyat ve swap puanı yazılmadan yalnız miktar; kalan kısım otomatik iptal.<\/li>\n<li>Özel koşullar: <b>Kalanı iptal et<\/b> (gerçekleşmeyen kısım iptal), <b>Gerçekleşmezse iptal et<\/b> (tamamı gerçekleşmezse tümü iptal).<\/li>\n<\/ul>\n\n<h3>İptal, düzeltme, ilan, takas<\/h3>\n<ul>\n<li>Üye hatası prensip olarak iptal sebebi değildir. Kabul gören gerekçeler: alım yerine satım swap emri girmek (veya tersi); başlangıç/bitiş valörü, swap puanı, kur, miktar, maden fiyatı gibi unsurlarda maddi hata. Karşı taraf da elektronik onay verir, Borsa iptal eder, <b>KAP'ta<\/b> ilan edilir. Zorunlu hallerde talep yazılı alınır.<\/li>\n<li>Hatalı emirlerden doğan işlemlerin düzeltilmesine ilişkin esasları <b>Takasbank<\/b> belirler.<\/li>\n<li>Fiyatlar aynı gün, her pazar için ayrı <b>Borsa Bülteni<\/b> ile ilan edilir: en düşük, en yüksek, ağırlıklı ortalama swap puanı, kur veya maden fiyatı, tutar, miktar, sözleşme sayısı.<\/li>\n<li>Tek üyenin taraf olduğu (kendi emrini karşıladığı) işlemler Borsa kaydına alınmaz; hacim ve sözleşme sayısı toplamlara eklenir.<\/li>\n<li>Takas ve temerrüt esaslarını Takasbank belirler.<\/li>\n<\/ul>\n\n<h3>Para Swap Pazarı (1 Ekim 2018)<\/h3>\n<ul>\n<li><b>Başlangıç valörü:<\/b> TL karşılığı döviz <b>satım<\/b> swapı yapan taraf döviz, döviz <b>alım<\/b> swapı yapan taraf TL yükümlülüğünü yerine getirir.<\/li>\n<li><b>Bitiş valörü:<\/b> başta döviz alan, aldığı miktara eşit döviz; başta TL alan, TL yükümlülüğünü yerine getirir.<\/li>\n<li>Emir unsurları: başlangıç valörü, bitiş valörü, döviz miktarı, swap puanı, döviz kuru.<\/li>\n<\/ul>\n<table><tr><th>Para Swap kuralı<\/th><th>Değer<\/th><\/tr>\n<tr><td>Döviz satım swap emri önceliği<\/td><td>Önce en <b>yüksek<\/b> swap puanı, sonra en <b>düşük<\/b> döviz kuru<\/td><\/tr>\n<tr><td>Döviz alım swap emri önceliği<\/td><td>Önce en <b>düşük<\/b> swap puanı, sonra en <b>yüksek<\/b> döviz kuru<\/td><\/tr>\n<tr><td>Emir büyüklüğü<\/td><td><b>1 milyon<\/b> ABD Doları/Euro ve katları; tek seferde en fazla <b>300 milyon<\/b><\/td><\/tr>\n<tr><td>Adım<\/td><td>Swap puanı 0,01; döviz kuru <b>0,0001<\/b><\/td><\/tr>\n<tr><td>Kur sınırı<\/td><td>TCMB döviz alış ve satış kurlarının <b>aritmetik ortalamasının ±%15<\/b>'i; Genel Müdür gün içinde değiştirebilir<\/td><\/tr>\n<\/table>\n<p>Eşleşme: satım swap emri, swap puanı aynı/daha düşük ve kuru aynı/daha yüksek alım swap emriyle eşleşir; farklılıkta sistemde önce bekleyen emrin swap puanı ve kuru geçerlidir.<\/p>\n\n<h3>Kıymetli Madenler Swap Pazarı (16 Kasım 2020)<\/h3>\n<ul>\n<li>Kıymetli maden ile TL, ABD Doları veya Euro değişimi. Başlangıçta maden satım swapı yapan maden, alım swapı yapan para yükümlülüğünü yerine getirir; bitişte tersine döner.<\/li>\n<li>İşleme konu maden: Londra Külçe Piyasası Birliği (LBMA) <b>Good Delivery List<\/b>'teki rafinerilerin ürettiği <b>995/1000 saflıkta 1 kilobar altın<\/b>.<\/li>\n<\/ul>\n<table><tr><th>KM Swap kuralı<\/th><th>Değer<\/th><\/tr>\n<tr><td>Maden satım swap emri önceliği<\/td><td>En yüksek swap puanı, sonra en düşük maden fiyatı<\/td><\/tr>\n<tr><td>Maden alım swap emri önceliği<\/td><td>En düşük swap puanı, sonra en yüksek maden fiyatı<\/td><\/tr>\n<tr><td>Emir büyüklüğü<\/td><td><b>1 kilobar<\/b> altın ve katları; tek seferde en fazla <b>100 kilobar<\/b><\/td><\/tr>\n<tr><td>Adım<\/td><td>Swap puanı ve maden fiyatı için <b>0,01<\/b><\/td><\/tr>\n<tr><td>Fiyat sınırı<\/td><td>Borsa İstanbul Kıymetli Madenler ve Kıymetli Taşlar Piyasası'nın ilan ettiği <b>ağırlıklı ortalama fiyatın ±%15<\/b>'i<\/td><\/tr>\n<\/table>\n\n<h3>Karıştırılan noktalar<\/h3>\n<ul>\n<li>Dikkat: Aynı gün valörlü işlem son saati Para Piyasası'nda <b>15.00<\/b>, Swap Piyasası ve BAP'ta <b>14.00<\/b>.<\/li>\n<li>Dikkat: Bitiş valörü sınırı Para Piyasası'nda <b>2 yıl<\/b>, Swap'ta başlangıç–bitiş arası <b>365 gün<\/b>, BAP repo pazarlarında <b>1 yıl<\/b>.<\/li>\n<li>Dikkat: Para Piyasası'nda Takasbank hem <b>üye<\/b> (işlem yapabilir) hem <b>merkezi karşı taraftır<\/b>.<\/li>\n<li>Dikkat: Para swapında ±%15 sınırın referansı TCMB alış-satış kurlarının ortalaması; maden swapında referans Borsa İstanbul'un ağırlıklı ortalama fiyatı.<\/li>\n<\/ul>", "sorular": [{"q": "Borsa İstanbul Para Piyasası'nda hangi işlemler gerçekleştirilir?", "o": ["Devlet tahvillerinin kesin alım satımı", "Kıymetli madenlerin ödünç işlemleri", "Teminatsız döviz alım satımı", "Paylar üzerinde repo işlemleri", "Türk Lirası teminatlı borç alma ve verme işlemleri"], "a": 4, "e": "Para Piyasası'nda TL fon arz ve talep eden banka ve aracı kurumların teminatlı borç alma ve verme işlemleri yapılır."}, {"q": "Borsa İstanbul Para Piyasası'nda aynı gün başlangıç valörlü emir iletimi ve işlemler hangi saatler arasında yapılır?", "o": ["09.30–15.00", "09.30–17.30", "09.30–14.00", "09.00–09.30", "10.00–14.00"], "a": 0, "e": "Para Piyasası'nda aynı gün başlangıç valörlü işlemler 09.30–15.00, ileri başlangıç valörlüler 09.30–17.30 arasında yapılır."}, {"q": "Borsa İstanbul Para Piyasası'nda işlemlerin bitiş valörü en fazla ne kadar olabilir?", "o": ["365 gün", "1 yıl", "90 gün", "7 gün", "2 yıl"], "a": 4, "e": "Para Piyasası'nda bitiş valörü taraflarca serbestçe belirlenir, ancak en fazla 2 yıl olabilir."}, {"q": "Borsa İstanbul Para Piyasası'nda asgari ve azami emir büyüklükleri hangisidir?", "o": ["50.000 – 100.000.000", "100.000 – 10.000.000", "100.000 – 100.000.000", "1.000.000 – 400.000.000", "10.000 – 100.000.000"], "a": 2, "e": "Para Piyasası'nda asgari emir 100.000, azami emir 100.000.000'dur."}, {"q": "Borsa İstanbul Para Piyasası ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Takasbank merkezi karşı taraf olarak hizmet verir", "Gerçekleşmeyen emirler ertesi işlem gününe devreder", "Kamu kaynağı hesabına emir iletilebilir", "Takasbank piyasada işlem yapabilir", "Faiz oranı adımı %0,01'dir"], "a": 1, "e": "Emirler gün için geçerlidir; gerçekleşmeyenler 17.30'da sistem tarafından otomatik olarak iptal edilir."}, {"q": "Borsa İstanbul Para Piyasası'nda alım emirleri arasında öncelik nasıl belirlenir?", "o": ["Önce vadesi en kısa olan emir gerçekleşir", "Yalnızca zaman önceliği uygulanır", "En düşük faiz oranlı emir önceliklidir", "En yüksek faiz oranlı emir önceliklidir, eşitlikte zaman önceliği uygulanır", "En büyük tutarlı emir önceliklidir"], "a": 3, "e": "Alım emirlerinde en yüksek, satım emirlerinde en düşük faiz oranlı emirler önceliklidir; aynı oranda zaman önceliği uygulanır."}, {"q": "Borsa İstanbul Swap Piyasası'nın Para Swap Pazarı'nda aşağıdakilerden hangisi işlem yapamaz?", "o": ["Aracı kurumlar", "Genel Müdürlüğün uygun gördüğü müşteriler hesabına bankalar", "TCMB", "Yetkili bankalar", "Bankaların portföy hesapları"], "a": 0, "e": "Aracı kurumlar Swap Piyasası'nda yalnızca Kıymetli Madenler Swap Pazarı'nda işlem yapabilir."}, {"q": "SPK tarafından yetkilendirilmemiş bir kıymetli madenler aracı kuruluşu Kıymetli Madenler Swap Pazarı'nda nasıl işlem yapabilir?", "o": ["Yalnızca TCMB aracılığıyla", "Takasbank onayıyla doğrudan", "Doğrudan üye olarak", "Yetkili banka ve aracı kurumların müşterisi olarak", "Hiçbir şekilde işlem yapamaz"], "a": 3, "e": "Yetkisiz kıymetli madenler aracı kuruluşları bu pazarda ancak işlem yetkisi olan banka ve aracı kurumların müşterisi olarak işlem yapabilir."}, {"q": "Swap Piyasası'nda aynı gün başlangıç valörlü emirler gerçekleşmezse saat kaçta otomatik olarak iptal edilir?", "o": ["14.00", "12.30", "15.00", "17.30", "09.30"], "a": 0, "e": "Swap Piyasası'nda aynı gün başlangıç valörlü emir iletimi 14.00'te biter ve bekleyen bu emirler o saatte iptal olur; ileri başlangıçlılar kapanışta iptal olur."}, {"q": "Swap Piyasası'nda bir emrin başlangıç ve bitiş valörü arasındaki süre en fazla ne kadar olabilir?", "o": ["365 gün", "730 gün", "1 iş günü", "90 gün", "2 yıl"], "a": 0, "e": "Swap Piyasası'nda başlangıç ve bitiş valörü arasında en fazla 365 gün olabilir; başlangıç valörü aynı gün veya 1 iş günü ileri olabilir."}, {"q": "Swap Piyasası'nın BAP ve Para Piyasası'ndan ayrılan bir özelliği hangisidir?", "o": ["TCMB işlem yapamaz", "Emri işleme dönüşen üyelere karşı tarafın kim olduğu bilgisi verilmez", "Emirler tek fiyat yöntemiyle eşleşir", "İptal edilen işlemler KAP'ta ilan edilmez", "Emirler ertesi güne devreder"], "a": 1, "e": "Swap Piyasası'nda emirleri eşleşen üyelere, hangi üyenin emriyle eşleştikleri bilgisi verilmez. BAP ve Para Piyasası'nda karşı üye bilgisi işlemden sonra verilir."}, {"q": "Para Swap Pazarı'nda TL karşılığı döviz satım swap emirleri arasında öncelik sırası nasıldır?", "o": ["En yüksek döviz kuru, sonra en düşük swap puanı", "En yüksek swap puanı, sonra en düşük döviz kuru", "Yalnızca zaman önceliği", "En düşük swap puanı, sonra en yüksek döviz kuru", "En büyük döviz miktarı, sonra zaman"], "a": 1, "e": "Döviz satım swap emirlerinde önce en yüksek swap puanı, sonra en düşük döviz kuru önceliklidir. Döviz alım swaplarında en düşük swap puanı ve en yüksek kur öne geçer."}, {"q": "Para Swap Pazarı'nda TL karşılığı döviz satım swap emirleri şunlardır: Emir 1 swap puanı 31,25 kur 23,7790; Emir 2 swap puanı 32,65 kur 23,7796; Emir 3 swap puanı 32,65 kur 23,7790; Emir 4 swap puanı 31,01 kur 23,7696. Uygun karşı emir geldiğinde ilk hangisi gerçekleşir?", "o": ["Emir 4", "Emir 1", "Emir 3", "Emir 2 ve 3 aynı anda", "Emir 2"], "a": 2, "e": "En yüksek swap puanı 32,65 olan iki emirden döviz kuru düşük olan Emir 3 öne geçer."}, {"q": "Para Swap Pazarı'nda bir defada iletilebilecek en yüksek emir büyüklüğü nedir?", "o": ["50 milyon ABD Doları veya Euro", "300 milyon ABD Doları veya Euro", "100 milyon ABD Doları veya Euro", "1 milyar ABD Doları veya Euro", "500 milyon ABD Doları veya Euro"], "a": 1, "e": "Para Swap Pazarı'nda emirler 1 milyon ABD Doları veya Euro ve katları şeklinde, tek seferde en fazla 300 milyon olarak iletilebilir."}, {"q": "TCMB'nin ilan ettiği ABD Doları alış kuru 32,00, satış kuru 32,20'dir. Para Swap Pazarı'nda girilebilecek döviz kurunun alt ve üst sınırı yaklaşık olarak nedir?", "o": ["27,200 – 36,800", "28,890 – 35,310", "27,285 – 36,915", "31,040 – 33,160", "27,200 – 37,030"], "a": 2, "e": "Alış ve satış kurunun ortalaması 32,10'dur; ±%15 bant 32,10 × 0,85 = 27,285 ile 32,10 × 1,15 = 36,915 arasıdır."}, {"q": "Para Swap Pazarı'nda döviz kuru ve swap puanı için uygulanan fiyat adımları hangisidir?", "o": ["Kur 0,001, swap puanı 0,01", "Her ikisi için 0,01", "Kur 0,01, swap puanı 0,0001", "Kur 0,0001, swap puanı 0,01", "Her ikisi için 0,001"], "a": 3, "e": "Para Swap Pazarı'nda swap puanı adımı 0,01, döviz kuru adımı 0,0001'dir. Kıymetli Madenler Swap'ta her ikisi 0,01'dir."}, {"q": "Kıymetli Madenler Swap Pazarı'nda emir büyüklüğü için hangisi doğrudur?", "o": ["1 kilobar altın ve katları; azami 300 kilobar", "1 kilobar altın ve katları; azami 100 kilobar", "1 kilogram altın ve katları; azami 1.000 kilogram", "1 ons altın ve katları; azami 100 ons", "1 gram altın ve katları; azami 100.000 gram"], "a": 1, "e": "Emirler 1 kilobar altın ve katları şeklinde, tek seferde en fazla 100 kilobar olarak iletilir."}, {"q": "Kıymetli Madenler Swap Pazarı'nda iletilen emirlerde maden fiyatı hangi sınırlar içinde olmalıdır?", "o": ["Önceki günün kapanış fiyatının ±%20'si", "LBMA öğleden sonra fiksing fiyatının ±%15'i", "Borsa İstanbul Kıymetli Madenler ve Taşlar Piyasası ağırlıklı ortalama fiyatının ±%15'i", "Fiyat sınırı uygulanmaz", "TCMB'nin ilan ettiği altın fiyatının ±%10'u"], "a": 2, "e": "Kıymetli maden fiyatı, Borsa İstanbul Kıymetli Madenler ve Kıymetli Taşlar Piyasası'nın ilan ettiği ağırlıklı ortalama fiyatın ±%15'i içinde olmalıdır."}, {"q": "Kıymetli Madenler Swap Pazarı'nda işleme konu olabilecek kıymetli maden hangisidir?", "o": ["LBMA Good Delivery List'teki rafinerilerin ürettiği 995/1000 saflıkta 1 kilobar altın", "999,9/1000 saflıkta 1 kilogram külçe altın", "Her türlü standart dışı altın", "Platin ve paladyum külçeleri", "995/1000 saflıkta 1 kilobar gümüş"], "a": 0, "e": "Bu pazarda yalnızca LBMA Good Delivery List'te yer alan rafinerilerce üretilmiş 995/1000 saflıkta 1 kilobar altın swap işlemlerine konu olabilir."}, {"q": "Para Swap Pazarı'nda başlangıç valöründe TL karşılığı döviz alım swap işlemi yapan taraf hangi yükümlülüğü yerine getirir?", "o": ["Kıymetli maden yükümlülüğünü", "Hem TL hem döviz yükümlülüğünü", "Döviz yükümlülüğünü", "TL yükümlülüğünü", "Yalnızca teminat yükümlülüğünü"], "a": 3, "e": "Başlangıçta döviz satım swapı yapan döviz, döviz alım swapı yapan TL yükümlülüğünü yerine getirir; bitişte yükümlülükler tersine döner."}, {"q": "Swap Piyasası'nda hatalı emir nedeniyle gerçekleşen işlemlerin düzeltilmesine ilişkin esasları kim belirler?", "o": ["Borsa Yönetim Kurulu", "SPK", "TCMB", "Hazine ve Maliye Bakanlığı", "Takasbank"], "a": 4, "e": "Üye veya Borsa personelinin hatalı emirleri sonucu gerçekleşen işlemlerin düzeltme esaslarını Takasbank belirler. İşlem iptali ise Borsa tarafından yapılır ve KAP'ta ilan edilir."}, {"q": "Aşağıdaki piyasalardan hangisinde aynı gün (başlangıç) valörlü işlemlerin son saati diğerlerinden farklıdır?", "o": ["Para Swap Pazarı", "BAP Kesin Alım Satım Pazarı", "BAP Repo Ters Repo Pazarı", "Kıymetli Madenler Swap Pazarı", "Borsa İstanbul Para Piyasası"], "a": 4, "e": "Para Piyasası'nda aynı gün başlangıç valörlü işlemler 15.00'e kadar yapılır; diğerlerinde son saat 14.00'tür."}]}, {"id": 7, "kisa": "VİOP", "baslik": "Borsa İstanbul Vadeli İşlem ve Opsiyon Piyasası (VİOP)", "ozet": "VİOP'un tanımları, seans akışı ve saatleri, emir yöntemleri ve süreleri, hatalı işlem iptali eşikleri, komiteler, piyasa yapıcılığı ve olağanüstü durum kuralları.", "notlar": "<h3>Temel tanımlar<\/h3>\n<ul>\n<li><b>Vadeli işlem sözleşmesi:<\/b> belirli vadede, önceden belirlenen fiyat, miktar ve nitelikte dayanak varlığı alma veya satma <b>yükümlülüğü<\/b> veren sözleşme.<\/li>\n<li><b>Opsiyon sözleşmesi:<\/b> alan tarafa, ödediği <b>prim<\/b> karşılığında alma veya satma <b>hakkı<\/b>; satan tarafa, kazandığı prim karşılığında <b>yükümlülük<\/b> veren sözleşme.<\/li>\n<li><b>Uzun pozisyon:<\/b> vadeli işlemde alma yükümlülüğü; alım opsiyonunda alma hakkı; satım opsiyonunda satma hakkı. <b>Kısa pozisyon:<\/b> vadeli işlemde satma yükümlülüğü; alım opsiyonunda satma, satım opsiyonunda alma yükümlülüğü.<\/li>\n<li><b>Açık pozisyon:<\/b> ters işlem, nakdi uzlaşma veya fiziki teslimatla kapatılmamış pozisyon.<\/li>\n<li><b>Dayanak varlık:<\/b> sermaye piyasası aracı, mal, kıymet, ekonomik/finansal gösterge, emtia vb.<\/li>\n<li><b>Uzlaşma fiyatı:<\/b> hesapların güncellenmesi, nakdi uzlaşma veya fiziki teslimatta kullanılan fiyat.<\/li>\n<li><b>Özsermaye halleri:<\/b> temettü, bedelli/bedelsiz artırım, sermaye azaltımı, birleşme, bölünme, pay grupları arası değişim gibi pay değerini/miktarını etkileyen durumlar.<\/li>\n<li><b>Eşyerleşim (co-location):<\/b> sunucuların sisteme en yakın yere konuşlandırıldığı veri merkezi hizmeti.<\/li>\n<li><b>Algoritmik emir iletim sistemi:<\/b> insan müdahalesi olmadan önceden belirlenmiş kurallarla emir üreten sistem. <b>Yüksek frekanslı işlem kullanıcısı:<\/b> bu sistemlerle yüksek hızda çok sayıda emir iletebilen kullanıcı.<\/li>\n<\/ul>\n\n<h3>Pazarlar<\/h3>\n<p>11 pazar: Döviz, Elektrik, Emtia, Endeks, Kıymetli Madenler, BYF, Pay, Yabancı Endeksler, Metal, Faiz ve DİBS Türev Pazarı. Emir eşleştirme ve özel işlem bildirimleri pazar altında gerçekleşir; istatistik için pazar segmentleri tanımlanır.<\/p>\n\n<h3>Günlük iş akışı<\/h3>\n<ol>\n<li><b>İşlem yapılmayan dönem:<\/b> sistem açık ama emir girişi, özel işlem bildirimi ve işlem yok. Bağlanma, sorgulama, önceki günlerden kalan iptale kadar geçerli/tarihli emirleri iptal veya inaktif etme, bunların miktarını azaltma ya da fiyatını kötüleştirme, inaktif emir hazırlama yapılabilir.<\/li>\n<li><b>Açılış seansı:<\/b> emir toplama + eşleştirme; <b>tek fiyat<\/b> yöntemi. Emir toplama, bitiş saatinden sonraki <b>30 saniye<\/b> içinde rastgele bir anda biter. Denge fiyatı açılış fiyatı olarak ilan edilir.<\/li>\n<li><b>Normal seans:<\/b> fiyat ve zaman önceliğiyle <b>çok fiyat<\/b>; özel işlem bildirimi ve esnek sözleşme oluşturma bu seansta.<\/li>\n<li><b>Uzlaşma fiyatı ilanı:<\/b> her gün günlük, vade sonunda vade sonu uzlaşma fiyatı.<\/li>\n<li><b>Akşam seansı:<\/b> çok fiyat; işlemler <b>bir sonraki normal seansın<\/b> işlemi sayılır.<\/li>\n<li><b>Gün sonu işlemleri:<\/b> raporlar ve sistemi ertesi güne hazırlama.<\/li>\n<\/ol>\n<p><b>Denge fiyatı:<\/b> en çok işlem miktarı; eşitlikte en az açıkta kalan miktar; yine eşitlikte alış fazlaysa yüksek, satış fazlaysa düşük fiyat, eşitse aritmetik ortalama.<\/p>\n\n<h3>İşlem saatleri<\/h3>\n<table><tr><th>Bölüm<\/th><th>Akşam seansı olmayan sözleşmeler<\/th><th>Akşam seansına dahil sözleşmeler<\/th><\/tr>\n<tr><td>Seans saatleri (tam gün)<\/td><td>09:20–18:10<\/td><td>09:20–18:10 ve 19:00–23:00<\/td><\/tr>\n<tr><td>Seans saatleri (yarım gün)<\/td><td>09:20–12:40<\/td><td>09:20–12:40<\/td><\/tr>\n<tr><td>Seans öncesi<\/td><td>07:30<\/td><td>07:30<\/td><\/tr>\n<tr><td>Açılış emir toplama<\/td><td>09:20<\/td><td>09:20<\/td><\/tr>\n<tr><td>Açılış eşleştirme<\/td><td>09:25 (+30 sn içinde rassal)<\/td><td>09:25<\/td><\/tr>\n<tr><td>Sürekli müzayede<\/td><td>09:30<\/td><td>09:30<\/td><\/tr>\n<tr><td>Seans sonu<\/td><td>18:10 / yarım gün 12:40<\/td><td>18:10 / 12:40<\/td><\/tr>\n<tr><td>Uzlaşma fiyatı ilanı<\/td><td>18:55+ / 13:25+<\/td><td>18:45+ / 13:25+<\/td><\/tr>\n<tr><td>Gün sonu<\/td><td>19:00+ / 13:30+<\/td><td>18:46+ / 13:30+<\/td><\/tr>\n<tr><td>Akşam seansı öncesi / sürekli / sonu / gün sonu<\/td><td>Yok<\/td><td>18:50 / 19:00 / 23:00 / 23:15<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: <b>Takvim yılının son işlem gününde akşam seansı yapılmaz.<\/b><\/li>\n<li>Akşam seansındaki sözleşmeler: BIST 30, BIST Likit Banka, BIST Banka Dışı Likit 10, BIST Sürdürülebilirlik 25 endeks vadelileri ile Dolar/Ons Altın, Gümüş, Platin, Paladyum ve Dolar/Ton Bakır vadelileri.<\/li>\n<li>İşlem günü bölümleri pazar veya sözleşme bazında farklılaştırılabilir. Farklı işlem yöntemine <b>Genel Müdür<\/b> karar verebilir.<\/li>\n<\/ul>\n\n<h3>Özel işlem bildirimi ve gruplandırma<\/h3>\n<ul>\n<li>Asgari emir miktarının üzerindeki emirler emir defterine girmeden Borsa'ya bildirilip işleme dönüştürülür. Fiyat istatistikleri ayrı yayımlanır, ama <b>hacim ve miktar istatistiklerine dahil<\/b> edilir.<\/li>\n<li>Yalnız <b>normal seansta<\/b>, temsilci/baş temsilci terminali ve FIX kullanıcılarıyla yapılır.<\/li>\n<li><b>Tek taraflı:<\/b> taraflar farklı üyeler; biri kendi tarafını ve karşı taraf bilgisini girer, karşı taraf eşler. <b>Çift taraflı:<\/b> üye hem alıcı hem satıcı.<\/li>\n<li>Sistem kapasite için sözleşmeleri <b>gruplara<\/b> dağıtır; bazı protokollerde her gruba ayrı bağlantı gerekir.<\/li>\n<\/ul>\n\n<h3>Kapatma, durdurma, sonlandırma<\/h3>\n<table><tr><th>Durum<\/th><th>Kural<\/th><\/tr>\n<tr><td>Piyasa/pazar kapatma<\/td><td>Genel Müdür kararıyla bir gün ya da <b>5 işlem gününe kadar<\/b>; aşarsa Borsa Yönetmeliği m.39. Yeniden başlatma da Genel Müdür kararıyla; KAP'ta duyurulur.<\/td><\/tr>\n<tr><td>Bir yatırım aracında işlem durdurma<\/td><td>Genel Müdür en fazla <b>1 ay<\/b>; aşan süre için <b>Yönetim Kurulu<\/b>. Yetki Genel Müdür Yardımcılarına devredilebilir.<\/td><\/tr>\n<tr><td>Endekse bağlı devre kesici<\/td><td>Pay ve pay endeksi vadeli/opsiyonlarında işlemler <b>20 dakika<\/b> durur; emir iptal veya inaktif edilebilir, <b>değiştirilemez<\/b>. 17:30'dan sonra tetiklenirse işlemler <b>18:08<\/b>'de sürekli işlemle yeniden başlar.<\/td><\/tr>\n<tr><td>Sözleşmenin sonlandırılması (Genel Müdür)<\/td><td>Dayanak spot piyasada işlem görmüyorsa; lisans anlaşması bittiyse; <b>en az 3 ay<\/b> işlem veya açık pozisyon yoksa; işlem görmeyi engelleyen başka durum<\/td><\/tr>\n<\/table>\n\n<h3>Hatalı işlem iptali<\/h3>\n<ul>\n<li>En az bir üyenin hatalı emrinden kaynaklanmalı. Başvuru işlemden itibaren <b>30 dakika<\/b> içinde; son başvuru saati tam günde <b>18:30<\/b>, yarım günde <b>13:00<\/b>.<\/li>\n<li>Başvuru süresinde sözleşme ve hesap numarası; sonrasında emir no, işlem no, fiyat ve miktar bildirilir.<\/li>\n<li>Başvuru işlem terminali veya e-postayla; <b>akşam seansı talepleri yalnız e-postayla<\/b>. Akşam seansı talepleri takip eden normal seansta değerlendirilir.<\/li>\n<li>Hatalı özel işlem bildirimleri şartlar sağlanmasa da tarafların onayıyla iptal edilebilir. Açılış seansı işlemi iptal edilse de <b>denge fiyatı değişmez<\/b>.<\/li>\n<\/ul>\n<table><tr><th>Sözleşme sınıfı<\/th><th>Referans fiyattan sapma (bunun dışındaki işlemler iptale konu olabilir)<\/th><\/tr>\n<tr><td>BIST 30 endeks ve pay vadelileri<\/td><td>±%5<\/td><\/tr>\n<tr><td>Döviz vadelileri<\/td><td>±%3<\/td><\/tr>\n<tr><td>Diğer vadeliler<\/td><td>±%4<\/td><\/tr>\n<tr><td>Tüm opsiyonlar<\/td><td>Referans primin ±%50'si veya piyasa yapıcı azami spread'inden büyük olanı<\/td><\/tr>\n<\/table>\n<table><tr><th>Başvuru zamanı<\/th><th>Asgari zarar tutarı<\/th><\/tr>\n<tr><td>Normal seans, 17:30'dan önce (yarım gün 12:00'den önce)<\/td><td>200.000 TL<\/td><\/tr>\n<tr><td>Normal seans, 17:30 ve sonrası (yarım gün 12:00 ve sonrası)<\/td><td>800.000 TL<\/td><\/tr>\n<tr><td>Akşam seansı işlemleri<\/td><td>200.000 TL<\/td><\/tr>\n<\/table>\n<p>Referans fiyat: hatadan önceki veya sonraki fiyatlar, önceki gün uzlaşma fiyatı, hatalı emrin ilk işlem fiyatı, teorik fiyat, piyasa yapıcı fiyatı; adil değilse Genel Müdürlük farklı fiyat belirler.<\/p>\n\n<h3>Piyasa erişim protokolleri<\/h3>\n<ul>\n<li><b>İşlem terminalleri (TW, Omnet API)<\/b>.<\/li>\n<li><b>FixAPI:<\/b> emir iletimi (eşyerleşim ve uzak erişim; emir, kotasyon, özel işlem bildirimi, esnek sözleşme), referans veri, <b>Drop-Copy<\/b> (üyenin emir/işlem akışı, kullanıcı bazında filtreleme).<\/li>\n<li><b>OUCH:<\/b> en hızlı emir iletimi, yüksek frekanslı işlem; limit ve kotasyon emirleri. OUCH kullanıcıları yüksek frekanslı sayılır.<\/li>\n<li><b>ITCH:<\/b> düşük gecikmeli veri yayını.<\/li>\n<\/ul>\n<h4>Algoritmik ve yüksek frekanslı işlemler<\/h4>\n<ul>\n<li>Üye yazılım bilgi formuyla Borsa'ya yazılı bilgi verir; test edildiğine ve piyasayı bozmayacağına dair <b>taahhütname<\/b> verir; riskleri gerçek zamanlı izler.<\/li>\n<li>Her farklı yüksek frekanslı algoritma için <b>ayrı kullanıcı<\/b>; bu kullanıcılar işlem öncesi risk yönetiminin kullanıcı limitlerini kullanmak zorunda.<\/li>\n<li>Yüksek frekanslı sayılmak için sunucular Borsa'nın <b>eşyerleşim merkezinde<\/b> olmalı ve ayırt edici kullanıcı kodu verilmiş olmalı.<\/li>\n<li>Üye, algoritmasından Borsa'ya karşı <b>doğrudan ve devredilemez<\/b> şekilde sorumludur. Risk limitlerinin yöntemi yazılı olmalı, istenirse <b>aynı gün<\/b> bildirilir. Hizmet durdurulursa üye tazminat isteyemez.<\/li>\n<\/ul>\n\n<h3>Emirler<\/h3>\n<p><b>Öncelik:<\/b> fiyat (alışta yüksek, satışta düşük), sonra zaman.<\/p>\n<table><tr><th>Emir yöntemi<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Limit<\/td><td>Fiyat ve miktar zorunlu<\/td><\/tr>\n<tr><td>Piyasa<\/td><td>En iyi fiyattan başlayarak karşılanır; GİE veya KİE ile. Dikkat: <b>1 Mart 2021'den beri kullanımına izin verilmiyor<\/b>.<\/td><\/tr>\n<tr><td>Piyasadan limite<\/td><td>Fiyatsız; yalnız karşı taraftaki en iyi fiyat kademesiyle eşleşir; kalan kısım son işlem fiyatlı limit emre dönüşür; karşıda emir yoksa hemen iptal<\/td><\/tr>\n<\/table>\n<table><tr><th>Geçerlilik süresi<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Gün<\/td><td>Gün sonunda iptal<\/td><\/tr>\n<tr><td>İptale kadar geçerli<\/td><td>En geç sözleşmenin <b>vade sonuna<\/b> kadar<\/td><\/tr>\n<tr><td>Tarihli<\/td><td>Belirtilen tarihte gün sonunda iptal; vade sonundan ileri tarih girilemez<\/td><\/tr>\n<tr><td>Gerçekleşmezse İptal Et<\/td><td>Tamamı ya da hiçbiri<\/td><\/tr>\n<tr><td>Kalanı İptal Et<\/td><td>Gerçekleşmeyen kısım iptal<\/td><\/tr>\n<\/table>\n<ul>\n<li>Günlük limit dışındaki (alt limitin altında alış, üst limitin üstünde satış) emirler <b>Durdurulmuş<\/b> statüyle kabul edilir, limit içine girince aktifleşir.<\/li>\n<li><b>Vadeler arası strateji emri:<\/b> tek spread fiyatıyla iki vadeye ters yönlü iki emir. Strateji alış = uzak vade (M2) alış + yakın vade (M1) satış. Negatif fiyatla girilebilir. Yalnız <b>Limit<\/b> ve <b>Gün<\/b>; şart bağlanamaz, özel işlem bildirimi yapılamaz. Otomatik işlemler uzlaşma fiyatı ve fiyat istatistiklerine girmez. Limitler: (uzak baz − yakın baz) ± k. Akşam seansında kullanılmaz.<\/li>\n<li><b>Şarta bağlı emir:<\/b> son fiyat, en iyi alış veya en iyi satış koşuluna bağlı; koşul gerçekleşene kadar emir defterinde yer almaz; koşul sözleşmesi aynı grupta olmalı (FixAPI ile diğer BISTECH araçları da olabilir). İşlem görmeyen dayanak enstrümanları (D_XU030D gibi) koşul olursa emir aktifleşmez.<\/li>\n<li><b>Akşam seansı:<\/b> piyasa ve piyasadan limite emirleri ile iptale kadar geçerli ve tarihli süreler kullanılamaz; akşam seansında geçerli olduğu belirtilmeyen İKG/tarihli emirler <b>Durdurulmuş<\/b> statüye çekilir, normal seansta zaman öncelikleri korunarak aktifleşir.<\/li>\n<li><b>Açılış seansı:<\/b> yalnız limit fiyatlı ve GİE dışındaki sürelerle emir; strateji, şarta bağlı emir, esnek sözleşme ve özel işlem bildirimi yok; eşleştirme aşamasında giriş, iptal, düzeltme yok.<\/li>\n<li>Fiziki teslimatlı döviz vadeli ve opsiyonlarında <b>gerçek kişi hesaplarından emir kabul edilmez<\/b>.<\/li>\n<li>Kotasyon isteği FixAPI emir iletim kanalından bir üyeye veya tüm üyelere, tek ya da çift taraflı gönderilebilir.<\/li>\n<\/ul>\n<h4>Azami emir büyüklükleri (asgari hepsinde 1)<\/h4>\n<table><tr><th>Sözleşme<\/th><th>Azami<\/th><\/tr>\n<tr><td>Pay (dayanak kapanış 0–2,49 TL)<\/td><td>40.000<\/td><\/tr>\n<tr><td>Pay (5,00–9,99 / 20,00–39,99 / 40,00–79,99 TL)<\/td><td>10.000 / 2.500 / 1.250<\/td><\/tr>\n<tr><td>Pay (≥1.000 TL)<\/td><td>50<\/td><\/tr>\n<tr><td>Endeks / Döviz<\/td><td>2.000 / 5.000<\/td><\/tr>\n<tr><td>Dolar/Ons Altın / Gümüş<\/td><td>1.250 / 5.000<\/td><\/tr>\n<tr><td>Platin, Paladyum, Bakır<\/td><td>500<\/td><\/tr>\n<tr><td>TL/Gram Altın<\/td><td>25.000<\/td><\/tr>\n<tr><td>Baz Yük Elektrik / TLREF / Fiziki teslimatlı DİBS<\/td><td>50 / 100 / 200<\/td><\/tr>\n<tr><td>Diğer<\/td><td>2.000<\/td><\/tr>\n<\/table>\n\n<h3>Emir düzeltme, askıya alma, iptal<\/h3>\n<table><tr><th>Alan (emir defterindeki emir)<\/th><th>Değişir mi<\/th><th>Zaman önceliği korunur mu<\/th><\/tr>\n<tr><td>Hesap numarası<\/td><td>Hayır<\/td><td>-<\/td><\/tr>\n<tr><td>Pozisyon, açıklamalar<\/td><td>Evet<\/td><td>Evet<\/td><\/tr>\n<tr><td>Fiyat<\/td><td>Evet<\/td><td><b>Hayır<\/b><\/td><\/tr>\n<tr><td>Miktar artırma / azaltma<\/td><td>Evet<\/td><td>Hayır / Evet<\/td><\/tr>\n<tr><td>Emir geçerliliği<\/td><td>Evet<\/td><td>Hayır<\/td><\/tr>\n<tr><td>Geçerlilik süresi artırma / azaltma<\/td><td>Evet<\/td><td>Hayır / Evet<\/td><\/tr>\n<tr><td>Off-hours<\/td><td>Hayır<\/td><td>-<\/td><\/tr>\n<\/table>\n<ul>\n<li>Koşulu gerçekleşmemiş şarta bağlı emirde koşul sözleşmesi, koşul fiyatı, koşul, sözleşme ve tip değişmez; hesap no, fiyat, miktar, süre değişir ve <b>öncelik korunur<\/b>.<\/li>\n<li>Temsilci kendi emirlerini, baş temsilci üyenin tüm emirlerini, yetkili Borsa personeli sistemdeki tüm emirleri değiştirebilir/iptal edebilir.<\/li>\n<li><b>Askıya alma<\/b> sistem açısından iptal demektir; tekrar aktifleşen emir yeni numara alır, <b>zaman önceliğini kaybeder<\/b>. Yalnız işlem terminaliyle yapılır.<\/li>\n<li><b>İradi emir iptal ücreti:<\/b> iradi iptal/askıya alınan emirlerin parasal büyüklüğü, üyenin aylık işlem hacminin <b>%50<\/b>'sini aşarsa aşan kısım ücrete konu olur. Vade sonu kapamaları ve özel işlem bildirimleri hacme katılmaz. Muaf: piyasa yapıcı hesapların yapıcısı oldukları sınıftaki iptalleri, strateji emirleri, döviz, altın, gümüş, platin, paladyum ve bakıra dayalı sözleşmeler, sistemin yaptığı iptaller.<\/li>\n<li>İşlem öncesi risk yönetimi terminal, FixAPI ve OUCH emirlerini emir öncesi, emir sonrası ve işlem anında kontrol eder.<\/li>\n<\/ul>\n\n<h3>Komiteler<\/h3>\n<table><tr><th><\/th><th>Uzlaşma Fiyatı Komitesi<\/th><th>Özsermaye Halleri Komitesi<\/th><\/tr>\n<tr><td>Kuran<\/td><td>Genel Müdür<\/td><td>Genel Müdür<\/td><\/tr>\n<tr><td>Üye<\/td><td>5 asil, 7 yedek; görev <b>2 yıl<\/b><\/td><td>5 asil, 7 yedek; görev 2 yıl<\/td><\/tr>\n<tr><td>Asil üye dağılımı<\/td><td><b>3 VİOP, 1 Pay Piyasası, 1 Denetim ve Gözetim Kurulu<\/b><\/td><td><b>2 VİOP, 2 Endeks Direktörlüğü, 1 Pay Piyasası<\/b><\/td><\/tr>\n<tr><td>Karar<\/td><td>Salt çoğunlukla toplanır, katılanların salt çoğunluğuyla karar; eşitlikte başkanın oyu<\/td><td>Aynı; öneriler oylanır, en yüksek oyu alan kabul<\/td><\/tr>\n<\/table>\n<ul>\n<li>Başkan imza yetkili üyeler arasından seçilir; üyeler başkası adına oy kullanamaz; telefon, video, e-postayla karar alınabilir. Üyeler kararlarından <b>sorumlu tutulamaz<\/b>.<\/li>\n<li>Günlük uzlaşma fiyatı normal seans sonunda sözleşme unsurlarındaki yönteme göre belirlenir; Komite yeni fiyat belirleyebilir, vade sonu uzlaşma fiyatını düzeltebilir.<\/li>\n<li>Özsermaye hali sözleşmelere makul ve adil yansıtılamıyorsa, nakdi uzlaşmayla sonlandırma dahil tedbire <b>Genel Müdür<\/b> karar verir.<\/li>\n<\/ul>\n\n<h3>Piyasa yapıcılığı<\/h3>\n<ul>\n<li>Piyasa yapıcıyı <b>Genel Müdür<\/b> yetkilendirir; hangi sözleşmede uygulanacağına da o karar verir.<\/li>\n<li>Başvuru şartları: aracı kurumlar için <b>geniş yetkili<\/b> olmak, teknik altyapıyı tamamlamak, Piyasa Yapıcılığı Taahhütnamesi imzalamak. Belgeler: başvuru dilekçesi ve taahhütname (OUCH kullanıcısı isteniyorsa algoritmik sistem bilgi formu ve taahhütnamesi de).<\/li>\n<li>Başvuru, başlanmak istenen ayın ilk iş gününden <b>en az 10 iş günü önce<\/b>. Kararı takip eden ayın başından itibaren programa dahil olunur; <b>3 ay içinde<\/b> faaliyete başlanmazsa program dışı kalınır.<\/li>\n<li>Program unsurları: asgari emir büyüklüğü, azami spread, piyasada bulunma oranı, vadeye kalan gün sayısı, sorumlu sözleşmeler.<\/li>\n<li><b>A grubu:<\/b> pay vadelileri, Dolar/Ons Altın, TL/Gram Altın, Dolar/Ons Gümüş vadelileri. <b>B grubu:<\/b> baz yük elektrik, RUB/TL, CNH/TL, bazı endeks vadelileri, platin/paladyum, fiziki teslimatlı DİBS, bakır vadelileri, pay opsiyonları, BIST 30 opsiyonları, USD/TL opsiyonları.<\/li>\n<li>A grubunda müşteri hesabıyla piyasa yapıcılık için ek olarak <b>bir opsiyon grubu ve bir B grubu vadeli<\/b> sözleşmede de başvuru gerekir. Pay opsiyonlarında her <b>5 dayanak<\/b> bir opsiyon grubu sayılır. İki A grubunda yapıcı olununca ek B grubu şartı aranmaz.<\/li>\n<li>Normal ve akşam seansı için <b>ayrı program<\/b>, ayrı değerlendirme ve gelir paylaşımı. Takasbank'ta ayrı piyasa yapıcı hesabı açılır; yalnız bu işler için kullanılır, bu hesapla özel işlem bildirimi yapılabilir.<\/li>\n<li>Program unsurları <b>1 ay<\/b> önceden açıklanarak değiştirilir; haklar da en az 1 ay önceden haber verilerek değiştirilir. Program süresizdir; Genel Müdür <b>en az 3 ay<\/b> önceden haber vererek sonlandırabilir.<\/li>\n<li>Aşırı oynaklıkta yükümlülüklerin esnetilmesi talebi gerekçesiyle <b>aynı gün<\/b> iletilir.<\/li>\n<li><b>Değerlendirme:<\/b> günlük performans vadelerin aritmetik ortalaması; aylık performans günlüklerin ortalaması. <b>6 aylık dönemler<\/b> (Haziran ve Aralık sonu); <b>en az 3 ayda<\/b> şart sağlanmışsa yükümlülük yerine gelmiş sayılır.<\/li>\n<li><b>Gelir paylaşımı:<\/b> borsa payının belli kısmı (pozisyon kapama ücretleri ve özel işlem bildirimi payı hariç) performansa göre; ölçütler piyasada bulunma oranı ve işlem hacmi oranı. Günlük hesaplanır, aylık ödenir. Pay vadelilerinde Pay Piyasası sürekli işlem süresinin VİOP normal seans süresine oranının <b>%95<\/b>'i dikkate alınır.<\/li>\n<li>Piyasada bulunma oranını sağlayanlara borsa payı indirimi; özel işlem bildirimlerine indirim yok. Ücretsiz Piyasa Yapıcı FixAPI ve OUCH kullanıcısı tahsis edilebilir.<\/li>\n<li>Geçici ayrılma <b>en fazla 1 yıl<\/b>. Yetki iptali piyasada işlem yapma yetkisini etkilemez.<\/li>\n<\/ul>\n\n<h3>Özsermaye hali uyarlaması<\/h3>\n<ul>\n<li>Amaç: spot paydaki değişimi sözleşmeye adil yansıtmak, açık pozisyonların toplam değerini korumak. Fiyat, kullanım fiyatı, sözleşme büyüklüğü ve kod değişir; <b>açık pozisyon sayısı değişmez<\/b>.<\/li>\n<li>Mevcut standart sözleşmeler kapanır, açık pozisyonlar yeni kodlu <b>standart olmayan<\/b> sözleşmelere aktarılır (kod sonuna N1, N2...). İKG ve tarihli emirler iptal edilir.<\/li>\n<li>Yuvarlama: baz/kullanım fiyatı 2 ondalık, sözleşme büyüklüğü tam sayı, <b>düzeltme katsayısı 7 basamak<\/b>.<\/li>\n<li>Dikkat: <b>Nakit temettüde uyarlama yapılmaz.<\/b> Pay olarak dağıtılan temettüde bedelsiz formülü kullanılır.<\/li>\n<li>Spot payda limitler serbest bırakılırsa pay vadelilerinin limitine Özsermaye Halleri Komitesi karar verir. Esnek sözleşmeler de uyarlamaya tabidir.<\/li>\n<\/ul>\n\n<h3>Olağanüstü durumlar<\/h3>\n<ul>\n<li>Seansı başlatmama/durdurma kararı <b>Genel Müdür<\/b>'ündür. Normal seans için ölçüt: son üç ayda işlem yapan üyelerin <b>1/4<\/b>'ünden fazlası sisteme giremiyorsa ve/veya giremeyen üyelerin (en az <b>5 üye<\/b>) son üç aylık hacmi toplamın <b>%50<\/b>'sini oluşturuyorsa.<\/li>\n<li>Normal seans, bitiş saatinden <b>15 dakika<\/b> öncesine kadar başlatılamazsa o gün başlatılmaz. Akşam seansı için bu süre <b>1 saat<\/b>.<\/li>\n<li>Seans kesilip yeniden başlamazsa, veri kaybı yoksa yapılmış işlemler ve emirler geçerlidir. İşlemler Olağanüstü Durum Merkezinde (ODM) uzaktan erişimle yapılabilir.<\/li>\n<li>Genel Müdürün ek tedbirleri: mali yükümlülükleri değiştirmek, yalnız pozisyon kapatmaya izin vermek, vade tarihini, uzlaşma yöntemini, fiyat limitlerini, seans saatlerini değiştirmek.<\/li>\n<li>Günlük fiyat limitlerini Genel Müdür geçici değiştirebilir; sözleşme bazında <b>Genel Müdür Yardımcısı veya Piyasa Müdürü iki katına kadar<\/b> artırabilir.<\/li>\n<li>Sisteme giremeyen üye bekleyen emirlerini kayıtlı telefon veya e-postayla iptal ettirebilir; iptal anına kadar oluşan işlemlerin iptalini isteyemez.<\/li>\n<\/ul>\n\n<h3>Diğer hususlar<\/h3>\n<ul>\n<li>Takas merkezi <b>Takasbank<\/b>. Borsa payı işlemin <b>her iki tarafından<\/b> ayrı ayrı alınır; vade sonu kapamalarından da alınır.<\/li>\n<li>Genel Müdür önceden bildirim yapmadan: tek fiyat dahil farklı yöntem belirleyebilir, seansa ara verebilir, özel işlem bildirimini kabul etmeyebilir, emir türlerini kısıtlayabilir, bekleyen emirleri iptal edebilir, saatleri değiştirebilir.<\/li>\n<li>Sözleşme hükümleri VİOP Yönergesi m.6 gereği bildirim gerekmeden tarafları bağlar.<\/li>\n<li><b>Sözleşme kodu:<\/b> F_ vadeli, O_ opsiyon, P_ fiziki teslimat, M mini, A Amerikan / E Avrupa tipi, C alım / P satım, sonra kullanım fiyatı. Örnek: O_XU030E0417C1240.00. Esnek sözleşmeler TM_O / TM_F_ ile başlar ve vade günü de yazılır (250419).<\/li>\n<li><b>Esnek sözleşme:<\/b> normal seansta mevcut sözleşmeden, limitler dahilinde vade ve/veya kullanım fiyatı kullanıcıca belirlenir; işleme açık sözleşmeyle aynı vade ve fiyatta oluşturulamaz.<\/li>\n<\/ul>", "sorular": [{"q": "VİOP'ta tam iş gününde akşam seansına dahil olmayan sözleşmelerin seans saatleri hangisidir?", "o": ["09:20–18:10", "09:20–17:30", "09:00–18:10", "09:30–18:00", "10:00–18:10"], "a": 0, "e": "Akşam seansına dahil olmayan sözleşmelerde tam günde seans 09:20–18:10, yarım günde 09:20–12:40'tır."}, {"q": "VİOP'ta akşam seansı ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Akşam seansında iptale kadar geçerli ve tarihli emir süreleri kullanılamaz", "Akşam seansında vadeler arası strateji emirleri kullanılabilir", "Akşam seansı 19:00–23:00 arasında yapılır", "Akşam seansında gerçekleşen işlemler bir sonraki normal seansın işlemi sayılır", "Takvim yılının son işlem gününde akşam seansı yapılmaz"], "a": 1, "e": "Akşam seansında vadeler arası strateji emirleri kullanılmaz. Diğer ifadeler doğrudur."}, {"q": "VİOP açılış seansında emir toplama aşaması nasıl sona erer?", "o": ["Emir toplama bitiş saatinden 1 dakika önce", "09:30'da sürekli müzayedeyle birlikte", "Genel Müdürün ilanıyla", "Tam olarak 09:25:00'te", "Emir toplama bitiş saatinden sonraki 30 saniye içinde rassal bir zamanda"], "a": 4, "e": "Emir toplama aşaması, bitiş saatinden sonraki 30 saniye içinde herhangi bir zamanda sona erer; ardından eşleştirme gelir."}, {"q": "Endekse bağlı devre kesici tetiklendiğinde pay ve pay endeksi vadeli işlem ve opsiyon sözleşmelerinde işlemler ne kadar süreyle durdurulur?", "o": ["20 dakika", "10 dakika", "15 dakika", "5 dakika", "30 dakika"], "a": 0, "e": "Devre kesiciyle dayanaklarda işlem durunca ilgili VİOP sözleşmeleri 20 dakika durur; bu sırada emir iptal veya inaktif edilebilir ama değiştirilemez."}, {"q": "Endekse bağlı devre kesici 17:30'dan sonra devreye girerse ilgili VİOP sözleşmelerinde işlemler hangi saatte yeniden başlatılır?", "o": ["18:10", "Ertesi gün açılışta", "17:50", "18:08", "19:00"], "a": 3, "e": "17:30'dan sonraki tetiklemede işlemler geçici durdurulur ve 18:08 itibarıyla sürekli işlem seansıyla yeniden başlar."}, {"q": "Genel Müdür bir yatırım aracına ilişkin VİOP işlemlerini en fazla ne kadar süreyle durdurabilir?", "o": ["3 ay", "5 işlem günü", "1 ay", "1 yıl", "1 hafta"], "a": 2, "e": "Genel Müdür en fazla bir ay durdurabilir; bir ayı aşan süreler için Yönetim Kurulu kararı gerekir. Piyasa veya pazar kapatmada ise 5 işlem günü sınırı vardır."}, {"q": "Bir sözleşmede en az ne kadar süre işlem olmaması veya açık pozisyon bulunmaması halinde Genel Müdür sözleşmenin işlem görmesini sonlandırabilir?", "o": ["2 ay", "1 ay", "1 yıl", "3 ay", "6 ay"], "a": 3, "e": "Sözleşmede en az üç ay işlem olmaması veya açık pozisyon bulunmaması sonlandırma sebeplerinden biridir."}, {"q": "VİOP'ta hatalı işlem iptal başvurusu işlemin gerçekleşmesinden itibaren en geç ne kadar süre içinde yapılmalıdır?", "o": ["Ertesi işlem günü 10:00'a kadar", "15 dakika", "Seans sonuna kadar", "1 saat", "30 dakika"], "a": 4, "e": "Başvuru işlemden itibaren 30 dakika içinde yapılır; tam günde son başvuru saati 18:30, yarım günde 13:00'dır."}, {"q": "BIST 30 endeks vadeli işlem sözleşmesinde referans fiyat 100,00'dür. Hatalı işlem iptaline konu olabilmesi için işlemin hangi fiyattan gerçekleşmiş olması gerekir?", "o": ["105,00", "106,00", "104,00", "96,50", "95,00"], "a": 1, "e": "BIST 30 endeks ve pay vadelilerinde sınır ±%5'tir, yani 95,00–105,00. Bu aralığın dışında kalan yalnızca 106,00'dır; sınırdaki 105 ve 95 aralığın içindedir."}, {"q": "VİOP'ta döviz vadeli işlem sözleşmelerinde hatalı işlem iptali için referans fiyattan sapma oranı ne kadar olmalıdır?", "o": ["±%50", "±%5", "±%10", "±%3", "±%4"], "a": 3, "e": "Döviz vadelilerinde ±%3, BIST 30 ve pay vadelilerinde ±%5, diğer vadelilerde ±%4, opsiyonlarda referans primin ±%50'si uygulanır."}, {"q": "Tam iş gününde normal seans işlemi için saat 17:45'te yapılan hatalı işlem iptal başvurusunda aranan asgari zarar tutarı nedir?", "o": ["1.000.000 TL", "100.000 TL", "500.000 TL", "200.000 TL", "800.000 TL"], "a": 4, "e": "17:30 ve sonrasındaki başvurularda asgari zarar 800.000 TL'dir. 17:30'dan önceki başvurularda ve akşam seansı işlemlerinde 200.000 TL aranır."}, {"q": "VİOP'ta akşam seansında gerçekleşen bir hatalı işlemin iptal talebi nasıl iletilir ve ne zaman değerlendirilir?", "o": ["Yazılı dilekçeyle iletilir, Yönetim Kurulunca değerlendirilir", "Yalnızca e-posta ile iletilir, takip eden normal seansta değerlendirilir", "İşlem terminalinden iletilir, akşam seansı içinde değerlendirilir", "Telefonla iletilir, aynı gece değerlendirilir", "Akşam seansı işlemleri iptal edilemez"], "a": 1, "e": "Akşam seansı işlemlerine ilişkin iptal talepleri sadece e-postayla iletilir ve takip eden normal seansta değerlendirilir."}, {"q": "VİOP'ta Piyasa emir yöntemi ile ilgili hangisi doğrudur?", "o": ["1 Mart 2021 tarihinden itibaren kullanımına izin verilmemektedir", "Yalnızca açılış seansında girilebilir", "Yalnızca akşam seansında kullanılabilir", "Gün süresiyle zorunlu olarak girilir", "Karşılanmayan kısmı limit emre dönüşür"], "a": 0, "e": "Kitaba göre 1 Mart 2021'den itibaren Piyasa emir yöntemine izin verilmemektedir. Kalanı limit emre dönüşen, piyasadan limite emirdir."}, {"q": "Piyasadan limite emir için aşağıdakilerden hangisi doğrudur?", "o": ["Akşam seansında kullanılabilir", "Karşı taraftaki tüm fiyat kademeleriyle eşleşir", "Fiyat ve miktar girilmesi zorunludur", "Yalnızca karşı taraftaki en iyi fiyat kademesiyle eşleşir, kalanı son işlem fiyatlı limit emre dönüşür", "Karşı tarafta emir yoksa limit emir olarak bekler"], "a": 3, "e": "Piyasadan limite emir fiyatsız girilir, en iyi kademeyle eşleşir, kalan kısım son işlem fiyatını alarak limit emre dönüşür; karşıda emir yoksa hemen iptal edilir. Akşam seansında kullanılamaz."}, {"q": "VİOP'ta İptale Kadar Geçerli süreli bir emir, iptal edilmez ve eşleşmezse en geç ne zaman sistem tarafından iptal edilir?", "o": ["30 gün sonra", "Sözleşmenin vade sonunda", "İşlem günü sonunda", "Hiçbir zaman otomatik iptal edilmez", "Ay sonunda"], "a": 1, "e": "İptale kadar geçerli emir, en geç sözleşmenin vade sonuna kadar geçerlidir ve vade sonunda otomatik olarak iptal edilir."}, {"q": "Uzak vade baz fiyatı 105, yakın vade baz fiyatı 100 ve k değeri 2 olan bir vadeler arası strateji emrinde alt ve üst fiyat limitleri nedir?", "o": ["5 ile 9", "−2 ile 2", "98 ile 107", "3 ile 7", "103 ile 107"], "a": 3, "e": "Limitler (uzak baz − yakın baz) ± k ile bulunur: 5 − 2 = 3 ve 5 + 2 = 7."}, {"q": "VİOP'ta emir defterindeki bir emirde yapılan hangi değişiklik zaman önceliğini korur?", "o": ["Miktar azaltımı", "Miktar artırımı", "Fiyat değişikliği", "Geçerlilik süresinin artırılması", "Emir geçerliliğinin değiştirilmesi"], "a": 0, "e": "Miktar ve geçerlilik süresi azaltımı, pozisyon ve açıklama değişikliği önceliği korur. Fiyat değişikliği, miktar veya süre artırımı ve geçerlilik değişikliği önceliği kaybettirir."}, {"q": "Bir VİOP üyesinin aylık işlem hacmi 200 milyon TL, iradi olarak iptal ettiği emirlerin parasal büyüklüğü 130 milyon TL'dir. İradi emir iptal ücretine konu olan tutar ne kadardır?", "o": ["65 milyon TL", "70 milyon TL", "30 milyon TL", "Ücrete konu tutar yoktur", "130 milyon TL"], "a": 2, "e": "İptal büyüklüğünün aylık hacmin yüzde ellisini aşan kısmı ücrete konu olur: 130 − (0,50 × 200) = 30 milyon TL."}, {"q": "Aşağıdaki sözleşmelerden hangisindeki emir iptalleri iradi emir iptal ücreti hesaplamasına dahil edilir?", "o": ["USD/TL vadeli işlem sözleşmeleri", "Dolar/Ons Altın vadeli işlem sözleşmeleri", "BIST 30 endeks vadeli işlem sözleşmeleri", "Dolar/Ton Bakır vadeli işlem sözleşmeleri", "Dolar/Ons Gümüş vadeli işlem sözleşmeleri"], "a": 2, "e": "Dövize, altına, gümüşe, platine, paladyuma ve bakıra dayalı sözleşmelerdeki iptaller hesaplamaya dahil edilmez; endeks sözleşmeleri dahildir."}, {"q": "VİOP Uzlaşma Fiyatı Komitesinin asil üyelerinin dağılımı hangisidir?", "o": ["2 VİOP, 2 Endeks Direktörlüğü, 1 Pay Piyasası", "2 VİOP, 2 Pay Piyasası, 1 Takasbank", "3 VİOP, 1 Pay Piyasası, 1 Denetim ve Gözetim Kurulu", "5 VİOP", "3 VİOP, 2 Endeks Direktörlüğü"], "a": 2, "e": "Uzlaşma Fiyatı Komitesi 3 VİOP, 1 Pay Piyasası ve 1 Denetim ve Gözetim Kurulu üyesinden oluşur. 2 VİOP, 2 Endeks, 1 Pay dağılımı Özsermaye Halleri Komitesine aittir."}, {"q": "VİOP komiteleriyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Komite oluşturulurken yedi yedek üye seçilir", "Komite üyeleri diğer üyeler adına vekâleten oy kullanabilir", "Üyelerin görev süresi iki yıldır", "Komiteler beş asil üyeden oluşur", "Eşitlik halinde komite başkanının oyu belirleyicidir"], "a": 1, "e": "Komite üyeleri diğer üyeler adına oy kullanamaz. Diğer ifadeler her iki komite için de doğrudur."}, {"q": "VİOP'ta piyasa yapıcılık başvurusu, faaliyete başlanmak istenen ayın ilk iş gününden en az ne kadar önce Borsaya iletilmelidir?", "o": ["1 ay", "5 iş günü", "15 takvim günü", "3 ay", "10 iş günü"], "a": 4, "e": "Başvuru, başlanmak istenen ayın ilk iş gününden en az 10 iş günü önce yapılmalıdır."}, {"q": "VİOP piyasa yapıcılarının performansı nasıl değerlendirilir?", "o": ["Altı aylık dönemlerde, en az 3 ayda şart sağlanmalıdır", "Yıllık olarak, en az 9 ayda şart sağlanmalıdır", "Altı aylık dönemlerde, en az 5 ayda şart sağlanmalıdır", "Üç aylık dönemlerde, en az 2 ayda şart sağlanmalıdır", "Aylık dönemlerde, her ay şart sağlanmalıdır"], "a": 0, "e": "Performans Haziran ve Aralık sonu baz alınarak altı aylık dönemlerle incelenir; en az üç ayda şartı sağlayan yükümlülüğünü yerine getirmiş sayılır."}, {"q": "VİOP'ta özsermaye hali uyarlamalarıyla ilgili hangisi yanlıştır?", "o": ["Açık pozisyon sayısında düzeltme yapılmaz", "Esnek sözleşmeler de uyarlamaya tabidir", "Pozisyonlar standart olmayan yeni sözleşmelere aktarılır", "Düzeltme katsayısı virgü
