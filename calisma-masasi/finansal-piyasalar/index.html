eni pay alma haklarının kullanımından arta kalan payların birincil piyasada satışı ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Satış duyurusu en az 2 iş günü önce KAP'ta yapılır", "Her üye satış emri verebilir", "Bu piyasadan alınan paylar aynı gün birincil piyasada yeniden satılabilir", "Baz fiyat ve fiyat marjı uygulanmaz", "Özel işlem bildirimi yapılabilir"], "a": 3, "e": "Arta kalan payların satışında baz fiyat ve fiyat marjı yoktur; satış emrini yalnız aracı üye verir, alınan paylar birincil piyasada yeniden satılamaz, duyuru en az 1 işlem günü önce yapılır."}, {"q": "Halka arz sonrası fiyat istikrarını sağlayıcı işlemlerle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Halka arz fiyatının üzerinde satış emri verilemez", "Halka arz fiyatının üzerinde alım emri verilemez", "İşlemler aracı kurumun genel portföy hesabından yapılır", "Fiyat halka arz fiyatının üzerindeyken alım yapılması zorunludur", "Bu işlemler yalnızca özel işlem bildirimiyle yapılır"], "a": 1, "e": "Pay Tebliğine göre fiyat istikrarı işlemlerinde halka arz fiyatının üzerinde alım emri verilemez; işlemler ayrı bir hesapta izlenir."}, {"q": "Bir şirketin dönem sonu fiili dolaşımdaki pay adedi 80 milyon, bir yıllık düzeltilmiş kapanış fiyatları ortalaması 40 TL, fiili dolaşım oranı %7, likidite değeri 0,08'dir. Payın pazarı için hangisi doğrudur?", "o": ["FDO %10'un altında olduğu için Alt Pazar'da kalır", "FDO %10'un altında olduğu için PÖİP'e alınır", "FDPD 3,2 milyar TL olduğundan diğer kriterlere bakılmaksızın Yıldız Pazar'a alınır", "FDPD 320 milyon TL olduğundan Alt Pazar'da işlem görür", "Likidite 0,15'in altında olduğundan Ana Pazar'a alınır"], "a": 2, "e": "FDPD = 80 milyon × 40 TL = 3,2 milyar TL. FDO %5'ten büyük, FDPD 3 milyar TL'nin üstünde ve likidite 0,1'in altında olduğundan istisna gereği Yıldız Pazar'a alınır."}, {"q": "Alt Pazar'daki bir şirketin son üç yıllık net nakit temettüleri 45, 50 ve 55 milyon TL, dönem sonu piyasa değeri 1,2 milyar TL, FDPD'si 500 milyon TL ve FDO'su %8'dir. Temettü getirisi ve pazar sonucu hangisidir?", "o": ["%12,5 – Ana Pazar'a alınır", "%4,6 – Alt Pazar'da kalır", "%12,5 – Yıldız Pazar'a alınır", "%41,7 – Ana Pazar'a alınır", "%12,5 – Alt Pazar'da kalır"], "a": 0, "e": "Temettü getirisi = 150 / 1.200 × 100 = %12,5. FDO %5'ten büyük, FDPD 450 milyon TL'nin üstünde ve temettü getirisi %10'dan büyük olduğundan diğer kriterlere bakılmaksızın Ana Pazar'a alınır."}, {"q": "Yıldız Pazar'da yer almak için piyasa değeri ve fiili dolaşımdaki payların piyasa değeri eşikleri hangisinde doğru verilmiştir?", "o": ["PD > 1 milyar TL, FDPD > 400 milyon TL", "PD > 6 milyar TL, FDPD > 3 milyar TL", "PD > 3 milyar TL, FDPD > 1 milyar TL", "PD > 6 milyar TL, FDPD > 1 milyar TL", "PD > 10 milyar TL, FDPD > 1 milyar TL"], "a": 3, "e": "Yıldız Pazar: PD > 6 milyar TL ve FDPD > 1 milyar TL. Ana Pazar: PD > 1 milyar TL ve FDPD > 400 milyon TL."}, {"q": "Pazar değerlendirmesinde kullanılan likidite kriteri için aşağıdakilerden hangisi doğrudur?", "o": ["Günlük işlem hacminin piyasa değerine oranıdır", "1 milyon TL işlem hacmiyle oluşacak ortalama günlük fiyat değişiminin mutlak değerini gösterir; değer küçüldükçe pay daha likittir", "Özel işlem bildirimleri hacme dâhil edilir", "Yıldız Pazar için 0,5'ten küçük olması yeterlidir", "Değer büyüdükçe pay daha likittir"], "a": 1, "e": "Amihud illikidite ölçüsüdür; günlük yüzde fiyat değişiminin hacme oranlarının ortalaması 1.000.000 ile çarpılır. Yıldız için eşik 0,15, Ana için 0,5'tir; özel işlem bildirimleri dâhil edilmez."}, {"q": "Pazar değerlendirmeleri ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Değerlendirme yılda en az iki kez yapılır", "Kriterlerin son bir yıllık ortalamaları kullanılır", "İlk kez değerlendirilen şirketin ilk 10 iş gününe ait verisi likidite hesabına alınmaz", "Bir dönemde Yıldız'dan Alt Pazar'a geçme şartını sağlayan pay Ana Pazar'a alınır", "Yeni işlem görmeye başlayan şirketler ilk 6 ay değerlendirmeye alınmaz"], "a": 4, "e": "Yeni işlem görmeye başlayan şirketler ilk üç ay içindeki pazar değerlendirmelerine dâhil edilmez."}, {"q": "Aşağıdaki işlem esaslarından hangisi Ana Pazar için doğrudur?", "o": ["Fiyat marjı ±%20, özkaynak oranı %90, yukarı adım kuralı yoktur", "Fiyat marjı ±%15, özkaynak oranı %75, açığa satışta yukarı adım kuralı vardır", "Fiyat marjı ±%10, brüt takas uygulanır", "Devre kesici tetikleme oranı %10'dur", "Açık takas pozisyonu/özkaynak oranı %100'dür"], "a": 1, "e": "Ana Pazar: ±%15 marj, %75 özkaynak oranı, %50 açık takas pozisyonu/özkaynak, yukarı adım kuralı var, devre kesici %7,5."}, {"q": "Aşağıdakilerden hangisi Alt Pazar'da işlem gören paylar için geçerli değildir?", "o": ["Brüt takas uygulanması", "Fiyat marjının ±%10 olması", "Devre kesici tetikleme oranının %5 olması", "Açığa satış ve kredili işlem yapılabilmesi", "Açılış seansında piyasa emri girilememesi"], "a": 3, "e": "Alt Pazar'da açığa satış ve kredili işlem yoktur; brüt takas vardır, marj ±%10, devre kesici %5'tir."}, {"q": "T. İş Bankası A.Ş. Kurucu (ISKUR) payları için aşağıdakilerden hangisi doğrudur?", "o": ["Tek fiyat yöntemiyle işlem görür ve fiyat marjı ±%50'dir", "Sürekli işlem yöntemiyle işlem görür ve marjı ±%20'dir", "Açığa satış yapılabilir", "Açılış seansında piyasa emri girilebilir", "Özkaynak oranı %75'tir"], "a": 0, "e": "İş Bankası A, B ve Kurucu payları 5 kez tek fiyatla işlem görür; kredili alım ve açığa satış yoktur; ISKUR'da marj ±%50'dir."}, {"q": "Girişim Sermayesi Pazarı ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Paylar Ana Pazar işlem esaslarına tabidir", "İlk gün baz fiyatın tespitinde ihraç fiyatı esas alınır", "Üye, müşterisinin nitelikli yatırımcı olduğunu bilmek ve belgelemek zorundadır", "Nitelikli yatırımcıya ihraç edilen YÜFP araçları da bu pazarda işlem görebilir", "Nitelikli yatırımcı olmayanlar Borsa üyesi aracılığıyla işlem yapabilir"], "a": 4, "e": "GSP'de yalnız nitelikli yatırımcılar işlem yapabilir."}, {"q": "Piyasa Öncesi İşlem Platformu için aşağıdakilerden hangisi doğrudur?", "o": ["Paylar sürekli işlem yöntemine tabidir", "Paylarda açığa satış yapılabilir", "İşlemlerin başlayacağı ilk gün paylar serbest marjla işlem görür", "Paylar net takasa tabidir", "Günde 3 kez tek fiyat belirlenir"], "a": 2, "e": "PÖİP'te tek fiyat yöntemiyle günde 5 kez fiyat belirlenir; ilk gün serbest marjla başlanır; brüt takas uygulanır; açığa satış ve kredi yoktur."}, {"q": "Payları Borsada işlem gören bir şirketin toptan alış satış işlemlerinde asgari işlem tutarı ve fiyat adımı hangisidir?", "o": ["100 milyon TL – 1 kuruş", "50 milyon TL – 1 kuruş", "100 milyon TL – payın fiyat kademesine göre", "10 milyon TL – 1 kuruş", "250 milyon TL – 5 kuruş"], "a": 0, "e": "TAS işlemlerinde asgari tutar 100 milyon TL'dir (tahsisli ve nitelikli yatırımcıya satış şeklindeki bedelli artırımlar hariç); fiyat adımı 1 kuruştur."}, {"q": "Yeni pay alma hakkı işlemleri ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Bir lot, toplam 1 TL nominal değerli payın rüçhan hakkıdır", "Fiyat tesciline kadar fiyat marjı serbesttir", "Fiyat tescilini takip eden seanslarda marj ±%50'dir", "Son işlem günü kullanım süresi sonundan önceki beşinci iş günüdür", "Açılış ve kapanış seansları uygulanır"], "a": 4, "e": "Yeni pay alma hakları için açılış ve kapanış seansları düzenlenmez."}, {"q": "Resmî müzayede işlemleri ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Borsada işlem görmeyen paylar için de yapılabilir", "Satışın en az üç günde tamamlanması esastır", "Mahkeme, icra dairesi ve diğer resmî dairelerin Borsaya yazılı başvurusu üzerine yapılır", "Satışı her durumda Pay Piyasası Direktörlüğü yürütür", "Yalnızca ayrı bir işlem sırasında yapılabilir"], "a": 2, "e": "Resmî müzayede resmî dairelerin yazılı başvurusuyla, yalnız Pay Piyasasında işlem gören araçlarda yapılır; satışın tek günde tamamlanması esastır; satışı kural olarak haciz yükümlüsü yatırım kuruluşu yürütür."}]}, {"id": 3, "kisa": "Seans, fiyat ve emirler", "baslik": "Pay Piyasası: Seans Saatleri, Fiyat Oluşumu, İşlem Yöntemleri ve Emir Kuralları", "ozet": "Seans akışı ve saatler, lot ve özellik kodları, baz fiyat, fiyat adımları ve marjlar, sürekli işlem ve tek fiyat yöntemi, açılış ve kapanış seansları, emir tipleri, değiştirme ve iptal, emir değeri sınırları ve erişim protokolleri.", "notlar": "<h3>Seans saatleri<\/h3>\n<p>Seans, araçların alım satımı için belirlenen zaman dilimidir; YK araç, işlem türü veya yöntem bazında farklı seanslar belirleyebilir. Tam gün ve yarım gün için iki ayrı çizelge vardır. Tüm pazarlarda (Yıldız, Ana, Alt, YÜFP, YİP, GSP, PÖİP, Emtia) seans <b>tam günde 09:40 – 18:10<\/b>, <b>yarım günde 09:40 – 12:40<\/b>'tır.<\/p>\n<table>\n<tr><th>Seans bölümü (tam gün)<\/th><th>Saat<\/th><\/tr>\n<tr><td>Açılış (varant, sertifika ve YPAH hariç)<\/td><td>09:40 – 10:00<\/td><\/tr>\n<tr><td>Açılış emir toplama<\/td><td>09:40 – 09:55<\/td><\/tr>\n<tr><td>Açılış fiyatının belirlenmesi<\/td><td>09:55 (+)<\/td><\/tr>\n<tr><td>Sürekli işlem<\/td><td><b>10:00 – 18:00<\/b><\/td><\/tr>\n<tr><td>Kapanış (varant, sertifika ve YPAH hariç)<\/td><td>18:00 – 18:07<\/td><\/tr>\n<tr><td>Kapanış marj yayını<\/td><td>18:00 – 18:01<\/td><\/tr>\n<tr><td>Kapanış emir toplama<\/td><td>18:01 – 18:05<\/td><\/tr>\n<tr><td>Kapanış fiyatının belirlenmesi<\/td><td>18:05 (+)<\/td><\/tr>\n<tr><td>Kapanış fiyatından/tek fiyattan işlemler bölümü<\/td><td>18:07 – 18:10 (marj yayını 18:07 – 18:08, işlemler <b>18:08 – 18:10<\/b>)<\/td><\/tr>\n<tr><td>Temerrüt ve resmî müzayede işlemleri<\/td><td>10:00 – 13:00 ve 14:00 – 18:00<\/td><\/tr>\n<tr><td>Birincil piyasa işlemleri<\/td><td>10:30 – 13:00<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Seans bölümü (yarım gün)<\/th><th>Saat<\/th><\/tr>\n<tr><td>Açılış (emir toplama 09:40 – 09:55, fiyat 09:55 +)<\/td><td>09:40 – 10:00<\/td><\/tr>\n<tr><td>Sürekli işlem / tek fiyat bölümü<\/td><td>10:00 – 12:30 (tek fiyatta emir toplama 10:00 – 12:25, fiyat 12:25 +)<\/td><\/tr>\n<tr><td>Kapanış (marj yayını 12:30 – 12:31, emir toplama 12:31 – 12:35, fiyat 12:35 +)<\/td><td>12:30 – 12:37<\/td><\/tr>\n<tr><td>Kapanış fiyatından/tek fiyattan işlemler<\/td><td>12:37 – 12:40 (işlemler 12:38 – 12:40)<\/td><\/tr>\n<tr><td>Temerrüt ve resmî müzayede<\/td><td>10:00 – 12:30<\/td><\/tr>\n<tr><td>Birincil piyasa: talep toplamayla halka arz / YPAH'tan kalan paylar<\/td><td>10:30 – 12:00 / 10:30 – 12:30<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>BYF<\/b>'lerde açılış emir toplama <b>09:40 – 09:56 (+)<\/b>. <b>Varant ve sertifikalarda<\/b> seans <b>10:00:10<\/b>'da başlar. (+) işaretli saatler işlemlerin tamamlanmasına göre kayabilir.<\/li>\n<li>Resmî müzayede saatleri ME, MR, MF, MV, MF1, MF2, MG, MC, MS, MS1 kodlu işlemler için geçerlidir.<\/li>\n<\/ul>\n\n<h3>İşlem birimi, özellik kodları ve fiyat ilanı<\/h3>\n<ul>\n<li><b>Lot:<\/b> paylarda ve YPAH'ta <b>1,00 TL nominal = 1 adet = 1 lot<\/b>. Küsurat sıraları (<b>.KE<\/b>) dışında lottan küçük emir verilemez. Nominal değeri olmayan İş Bankası Kurucu paylarında emir <b>adet<\/b> olarak; BYF'de lot <b>1 adet katılma payı<\/b>.<\/li>\n<li>İlan edilen fiyat, 1 TL nominal değerli payın (veya üzerindeki rüçhanın) fiyatıdır; tüm fiyatlarda virgülden sonra <b>3 hane<\/b> kuruş bulunur. BYF fiyatı bir adet katılma belgesinin TL fiyatıdır.<\/li>\n<li>Fiyatlar ve miktarlar seans sonunda <b>Pay Piyasası Borsa Bülteni<\/b>'nde ilan edilir; fiyat oluşmadıysa bu da ilan edilir.<\/li>\n<li><b>Ağırlıklı ortalama fiyat (AOF):<\/b> seansta tescil edilen <b>normal emir<\/b> işlemlerinin miktar ağırlıklı fiyatı; Sistem hesaplar.<\/li>\n<\/ul>\n<table>\n<tr><th>Kod<\/th><th>Anlamı<\/th><th>Kod<\/th><th>Anlamı<\/th><\/tr>\n<tr><td>.E<\/td><td>Pay<\/td><td>.R<\/td><td>Yeni pay alma (rüçhan) hakkı<\/td><\/tr>\n<tr><td>.V<\/td><td>Varant<\/td><td>.BE<\/td><td>Birincil: rüçhandan arta kalan<\/td><\/tr>\n<tr><td>.C<\/td><td>Sertifika<\/td><td>.HE<\/td><td>Talep toplamayla halka arz veya pay geri alım çağrısı<\/td><\/tr>\n<tr><td>.F<\/td><td>BYF<\/td><td>.BS / .HS<\/td><td>SDKS sürekli işlemle / talep toplamayla halka arz<\/td><\/tr>\n<tr><td>.F1<\/td><td>GMF katılma payı<\/td><td>.BS1 / .HS1<\/td><td>Emtia sertifikası sürekli işlemle / talep toplamayla halka arz<\/td><\/tr>\n<tr><td>.F2<\/td><td>GSF katılma payı<\/td><td>.T ile başlayanlar (.TE, .TV, .TC, .TF, .TR ...)<\/td><td>Temerrüt sıraları<\/td><\/tr>\n<tr><td>.G<\/td><td>Gayrimenkul sertifikası<\/td><td>.M ile başlayanlar (.ME, .MR, .MV, .MF ...)<\/td><td>Resmî müzayede sıraları<\/td><\/tr>\n<tr><td>.S<\/td><td>Sahipliğe dayalı kira sertifikası<\/td><td>.KE<\/td><td>Küsurat<\/td><\/tr>\n<tr><td>.S1<\/td><td>Emtia sertifikası<\/td><td>.AOF<\/td><td>Ağırlıklı ortalama fiyattan işlem<\/td><\/tr>\n<tr><td><\/td><td><\/td><td>.NSE<\/td><td>Takası Takasbank dışında olan TAS işlemi<\/td><\/tr>\n<\/table>\n\n<h3>Baz fiyat ve referans fiyat<\/h3>\n<ul>\n<li><b>Baz fiyat:<\/b> seans boyunca alt ve üst fiyat sınırlarının hesaplandığı fiyat; BISTECH'te <b>önceki işlem gününün kapanış fiyatı<\/b>.<\/li>\n<li>Baz fiyat yoksa (kapanış yok veya fiyat serbest): tek fiyat sıralarında ilk fiyatın oluştuğu emir toplama sonrası eşleşme fiyatı; sürekli işlem sıralarında açılışta fiyat oluşmuşsa o, yoksa sürekli işlemdeki ilk işlem fiyatı. Yeni işlem görecek YPAH'ta ilk gün sonuna kadar baz fiyat uygulanmaz; ilk günün kapanışı ertesi günün baz fiyatıdır.<\/li>\n<li>Gün içinde hiç işlem olmazsa mevcut baz fiyat ertesi günün de baz fiyatıdır. <b>Varant ve sertifikalarda baz fiyat yoktur.<\/b><\/li>\n<li>Özsermaye hâllerinde (bedelsiz, bedelli vb.) teorik fiyat hesaplanıp en yakın fiyat adımına yuvarlanarak baz fiyat girilir.<\/li>\n<li><b>Referans fiyat:<\/b> özsermaye hâllerinde hesaplanan ama fiyat limitlerine <b>esas olmayan<\/b>, tescile kadar yatırımcıya yol gösteren fiyat. Endeks dışı şirketlerde uzun kapalılık veya veri yetersizliğinde hesaplanmamasına Genel Müdür karar verebilir. Referans fiyat belirlenen paylarda fiyat değişme sınırları uygulanmaz.<\/li>\n<\/ul>\n\n<h3>Fiyat adımları<\/h3>\n<p>Fiyat adımı, bir defada gerçekleşebilecek en küçük fiyat değişimidir; <b>baz fiyattan bağımsız olarak<\/b> emrin fiyat seviyesine göre belirlenir. Örnek: baz fiyatı 19,97 TL olan payda 20,00 TL'ye kadar adım 1 kuruş, 20,00 TL'den sonra 2 kuruştur.<\/p>\n<table>\n<tr><th>Fiyat seviyesi (TL)<\/th><th>Pay ve YPAH adımı (TL)<\/th><th>Fiyat seviyesi (TL)<\/th><th>BYF adımı (TL)<\/th><\/tr>\n<tr><td>0,01 – 19,999<\/td><td>0,01<\/td><td>0,01 – 49,999<\/td><td>0,01<\/td><\/tr>\n<tr><td>20,00 – 49,999<\/td><td>0,02<\/td><td>50,00 – 99,999<\/td><td>0,02<\/td><\/tr>\n<tr><td>50,00 – 99,999<\/td><td>0,05<\/td><td>100,00 – 249,999<\/td><td>0,05<\/td><\/tr>\n<tr><td>100,00 – 249,999<\/td><td>0,10<\/td><td>250,00 – 499,999<\/td><td>0,10<\/td><\/tr>\n<tr><td>250,00 – 499,999<\/td><td>0,25<\/td><td>500,00 – 999,999<\/td><td>0,25<\/td><\/tr>\n<tr><td>500,00 – 999,999<\/td><td>0,50<\/td><td>1.000 – 2.499,99<\/td><td>0,50<\/td><\/tr>\n<tr><td>1.000 – 2.499,999<\/td><td>1,00<\/td><td>2.500 ve üzeri<\/td><td>1,00<\/td><\/tr>\n<tr><td>2.500 ve üzeri<\/td><td>2,50<\/td><td><\/td><td><\/td><\/tr>\n<\/table>\n<ul><li><b>Varant, sertifika, emtia sertifikası ve TAS işlemlerinde<\/b> her fiyat seviyesinde adım <b>1 kuruş<\/b>tur. Dikkat: Paylarda adım kademelidir, 1 kuruş sabit değildir.<\/li><\/ul>\n\n<h3>Fiyat değişme sınırları (marjlar)<\/h3>\n<table>\n<tr><th>Araç / pazar<\/th><th>Baz fiyata göre marj<\/th><\/tr>\n<tr><td>Yıldız Pazar payları<\/td><td>±%20<\/td><\/tr>\n<tr><td>Ana Pazar payları<\/td><td>±%15<\/td><\/tr>\n<tr><td>Alt Pazar, YİP, PÖİP payları<\/td><td>±%10<\/td><\/tr>\n<tr><td>BYF<\/td><td>±%20<\/td><\/tr>\n<tr><td>GMF ve GSF<\/td><td>±%20<\/td><\/tr>\n<tr><td>Yeni pay alma hakları ve ISKUR.E<\/td><td>±%50<\/td><\/tr>\n<tr><td>Gayrimenkul sertifikası ve emtia sertifikası<\/td><td>±%5<\/td><\/tr>\n<tr><td>Kapanış seansı<\/td><td>Sürekli işlemdeki son işlem fiyatının ±%3'ü (günlük sınırlar içinde)<\/td><\/tr>\n<tr><td>Varant ve sertifika<\/td><td>Baz fiyat ve sabit sınır yok; piyasa yapıcının alış kotasyonunu referans alan <b>hareketli<\/b> fiyat sınırları<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Yuvarlama içe doğru<\/b> yapılır: üst limit <b>aşağı<\/b> adıma, alt limit <b>yukarı<\/b> adıma yuvarlanır (aralık daralır).<\/li>\n<li><b>PPD Direktörü<\/b> sınırları re'sen <b>iki katına kadar<\/b> genişletebilir; <b>Genel Müdür<\/b> kaldırabilir veya değiştirebilir; <b>YK<\/b> pazar ve emir türü bazında farklı belirleyebilir.<\/li>\n<\/ul>\n\n<h3>Fiyat tescili ve raporlama<\/h3>\n<ul>\n<li>İşlem miktarı <b>1 lot veya üzeri<\/b> ise fiyat Borsa kaydına alınır (tescil); Genel Müdürlük asgari miktarı KAP'ta ilan ederek değiştirebilir.<\/li>\n<li>Yalnız <b>normal emir defterindeki<\/b> eşleşmelerden doğan tescilli fiyatlar en düşük, en yüksek, AOF ve kapanış fiyatı olarak Bültende ilan edilir.<\/li>\n<li>Seans sonunda işlem raporları üyelere elektronik ortamda sunulur; üyeler yasal kayıtlarını bununla tutar; uyuşmazlıkta <b>Borsa kayıtları<\/b> esastır.<\/li>\n<\/ul>\n\n<h3>İşlem yöntemleri<\/h3>\n<ul>\n<li><b>Sürekli işlem (çok fiyat):<\/b> emirler işlem süresi boyunca sürekli ve farklı fiyat seviyelerinden eşleşir; emirler girildiği andan itibaren işlem görebilir; üyeler başkasının emri üzerinde tamamen veya kısmen işlem yapabilir.<\/li>\n<li><b>Tek fiyat:<\/b> emirler bir zaman diliminde eşleşmeden toplanır; sonunda <b>en çok işlem miktarını<\/b> sağlayan tek fiyat belirlenir ve tüm işlemler bu fiyattan yapılır. Emir toplama sırasında işlem olmaz; emir iptali ve değişikliği mümkündür.<\/li>\n<li>Ana sıraya bağlı geçici ve süreli sıralarda tek fiyat uygulanmaz: resmî müzayede, rüçhandan kalan payların birincil satışı, temerrüt ve YPAH işlemleri <b>sürekli işlem<\/b>dir; TAS işlemleri özel işlem bildirimi yoluyla PP uzmanlarınca yapılır.<\/li>\n<li>Tek fiyatla işlem görenler: piyasa yapıcısı zorunlu olup piyasa yapıcısı olmayan araçlar (varant ve sertifika hariç; bugün yalnız <b>BYF<\/b>'ler), <b>PÖİP ve YİP<\/b> payları ve Genel Müdürlükçe tek fiyata alınan araçlar. Piyasa yapıcı bulunursa duyurudan itibaren yeniden sürekli işleme geçilir.<\/li>\n<\/ul>\n<h4>Tek fiyat yönteminde günlük 5 fiyat<\/h4>\n<table>\n<tr><th>Süreç<\/th><th>Bölüm<\/th><th>Emir toplama<\/th><th>Fiyat belirleme<\/th><\/tr>\n<tr><td>1. Tek fiyat (açılış)<\/td><td>09:40 – 10:00<\/td><td>09:40 – 09:55 (+)<\/td><td>09:55 (+)<\/td><\/tr>\n<tr><td>2. Tek fiyat<\/td><td>10:00 – 13:00<\/td><td>10:00 – 12:55<\/td><td>12:55 (+)<\/td><\/tr>\n<tr><td>3. Tek fiyat (gün ortası)<\/td><td>13:00 – 14:00<\/td><td>13:00 – 13:55<\/td><td>13:55 (+)<\/td><\/tr>\n<tr><td>4. Tek fiyat<\/td><td>14:00 – 18:00<\/td><td>14:00 – 17:55<\/td><td>17:55 (+)<\/td><\/tr>\n<tr><td>5. Tek fiyat (kapanış)<\/td><td>18:01 – 18:07<\/td><td>18:01 – 18:05<\/td><td>18:05 (+)<\/td><\/tr>\n<tr><td>Kapanış fiyatından/tek fiyattan işlemler (5 sayısına dâhil değil)<\/td><td>18:08 – 18:10<\/td><td>-<\/td><td>-<\/td><\/tr>\n<\/table>\n<ul>\n<li>Açılışa katılamayan sıra gün içinde açılırsa o anda devrede olan tek fiyat sürecine katılır; eşleşmeyen geçerli emirler sonraki sürece aktarılır.<\/li>\n<li><b>Emir toplama aşaması:<\/b> emirler fiyat-zaman önceliğiyle sıralanır, eşleşme olmaz; fiyat iyileştirilebilir/kötüleştirilebilir, miktar artırılıp azaltılabilir (fiyat değişince veya miktar artınca öncelik değişir); emir iptal edilebilir. Teorik eşleşme (denge) fiyatı ve miktarı yayımlanır; derinlik gösterilmez.<\/li>\n<li><b>Açılışın son 5 dakikasında<\/b> paylarda emir iptal edilemez, fiyat kötüleştirilemez, miktar azaltılamaz; rastlantısal kesilmenin <b>en fazla 30 saniyesi<\/b> bu süreye eklenir.<\/li>\n<li>Açılış seansında <b>açığa satış emri girilemez<\/b>; diğer tek fiyat bölümlerinde girilebilir. Açılış ve kapanış dışında özel işlem bildirimi yapılabilir.<\/li>\n<li>Emir toplamada girilebilen emirler: limit, piyasa, piyasadan limite, kalanı iptal et, dengeleyici. Yıldız ve Ana Pazar dışındaki paylarda açılışta <b>piyasa ve piyasadan limite emir girilemez<\/b>.<\/li>\n<li>Emir toplama <b>30 saniyelik<\/b> aralıkta rastlantısal bir anda kesilir; eşleştirme bu 30 saniye içinde herhangi bir anda başlar ve o ana kadar emir girişi sürer. Devre kesici sonrası eşleştirme ise rastlantısal değil, belirlenen saatte başlar.<\/li>\n<li><b>Fiyat belirleme aşaması:<\/b> azami <b>5 dakika<\/b> (fiilen yaklaşık 1 dakika); emir girişi, değişikliği, iptali ve özel işlem bildirimi <b>yapılamaz<\/b>. Sonra fiyat ve kalan emirler 1'er kademe yayınlanır.<\/li>\n<\/ul>\n\n<h3>Açılış seansı ve açılış fiyatı<\/h3>\n<ul><li>Önceki günün kapanışı baz fiyattır; marjlar bunun üzerinden hesaplanır ve açılış ile izleyen tek fiyat aşamasında geçerlidir.<\/li><\/ul>\n<h4>Fiyat belirleme algoritması (tüm tek fiyat uygulamalarında, kapanış dâhil)<\/h4>\n<ol>\n<li>En çok işlem miktarını sağlayan fiyat.<\/li>\n<li>Eşitlikte arta kalan (işlem görmeyen) miktarı en az olan fiyat (<b>minimum surplus<\/b>).<\/li>\n<li>Yine eşitlikte piyasa yönü: alış ağırlıklıysa yüksek, satış ağırlıklıysa düşük fiyat (<b>market pressure<\/b>).<\/li>\n<li>Yine eşitlikte <b>referans fiyata<\/b> en yakın fiyat.<\/li>\n<li>Referans fiyat yoksa olası fiyatların en yüksek ve en düşüğünün aritmetik ortalaması, en yakın adıma yuvarlanır.<\/li>\n<\/ol>\n<ul>\n<li>En yüksek limit emre bir adım eklenip en düşüğünden bir adım çıkarılarak bulunan aralıktaki <b>emir olmayan kademeler de<\/b> hesaba katılır. Açılış fiyatı fiyat limitlerini aşamaz; aşarsa taban veya tavan olur.<\/li>\n<li>Hesaba <b>katılanlar:<\/b> limit, piyasa, piyasadan limite, kalanı iptal et, kısmi görünme koşullu (gizli kısmı dâhil) emirler ve kotasyonlar. <b>Katılmayanlar:<\/b> küsurat, hepsi ya da hiçbiri, gerçekleşmezse iptal et, dengeleyici ve tetiklenmemiş stop emirler.<\/li>\n<li><b>Açılış Referans Fiyatı (ARF):<\/b> yalnız açılışta kullanılır; kapanış fiyatı, baz fiyat, son işlem fiyatı ve Borsanın belirlediği referans fiyattan <b>en son güncelleneni<\/b>.<\/li>\n<li><b>Emirlerin işlem görme sırası:<\/b> piyasa emirleri, piyasadan limite emirler (bu ikisi arasında zaman önceliği), limit fiyatlı emirler, dengeleyici emirler.<\/li>\n<li><b>Dengeleyici emirler<\/b> fiyat belirlemeye katılmaz; eşleşme fiyatında karşılanmadan kalan emirlerle o fiyattan işleme girer, kendi aralarında giriş zamanına göre sıralanır, eşleşmeyenler iptal edilir.<\/li>\n<li>Veri yayını: emir toplama sırasında denge fiyatı ve miktarı; eşleştirmeyle açılış fiyatları, işlemler ve kalan emirler yayınlanır. Referans veriler gün içinde değişmeyen tanımlayıcı bilgiler, eşanlı veriler gün içinde değişen emir ve işlem bilgileridir.<\/li>\n<\/ul>\n\n<h3>Kapanış seansı ve kapanış fiyatından işlemler<\/h3>\n<ul>\n<li>Kapanış seansı, sürekli işlemden kalan emirler ve yeni emirlerle tek fiyat yöntemiyle kapanış fiyatının belirlendiği bölümdür. <b>.E ve .F<\/b> kodlu araçlarda uygulanır; <b>varant, sertifika, temerrüt ve YPAH sıraları kapanış seansına dâhil değildir<\/b>.<\/li>\n<li>Emir fiyatı, son normal emir işlem fiyatının <b>±%3<\/b>'ünü aşamaz; üst sınır aşağı, alt sınır yukarı adıma yuvarlanır. Serbest marjlı paylarda da ±%3 uygulanır. Ancak günlük baz fiyat sınırlarının dışına çıkılamaz.<\/li>\n<li>Örnek (±%20 marjlı pay): baz 3,00 TL, günlük sınırlar 2,40 – 3,60 TL; son işlem 3,58 TL ise kapanış seansında emir aralığı 3,48 – 3,60 TL olur.<\/li>\n<li>Gün içinde hiç işlem yoksa baz fiyat marjları geçerlidir (serbest marjlıysa sınır yok). Aktarılan emirler arasında ±%3 sınırının dışında alış/satış varsa ±%3 değil, günlük baz fiyat sınırları uygulanır.<\/li>\n<li>Açılışta durdurulup kapanışta açılan araçta kapanış kuralları uygulanır; açığa satış emri girilebilir.<\/li>\n<li>Kapanış seansında fiyat oluşmazsa önceki bölümlerdeki <b>son işlem fiyatı<\/b> kapanış olarak tescil edilir; yalnız açılışta işlem varsa Bültende tüm fiyat alanlarında açılış fiyatı, o da yoksa sıfır yazılır. Kapanış seansı işlemleri günlük AOF'ye dâhildir.<\/li>\n<li><b>Kapanış fiyatından işlemler<\/b> (2 dakika): yalnız o güne kadar işlem görmüş araçlarda, yalnız kapanış/son işlem fiyatından emir girilir. Bu aşamada girilen emirlerin fiyatı değiştirilemez, miktarı artırılıp azaltılabilir, iptal edilebilir. Aktarılan emirlerden kapanış fiyatına eşit olanların miktarı artırılıp azaltılabilir; farklı fiyattakilerin miktarı yalnız azaltılabilir, fiyatı yalnız kapanış fiyatına çekilebilir. Limit emirler (KİE ve açığa satış dâhil) ve özel işlem bildirimi yapılabilir. Bu işlemler AOF'ye dâhildir.<\/li>\n<\/ul>\n\n<h3>Emir tipleri<\/h3>\n<p>Aksi belirtilmedikçe emir girildiği gün geçerlidir.<\/p>\n<table>\n<tr><th>Emir<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Limit fiyatlı (LFE)<\/td><td>Fiyat ve miktar belirtilir; gerçekleşmeyen kısım süre sonuna kadar pasif bekler (KİE değilse).<\/td><\/tr>\n<tr><td>Piyasa emri<\/td><td>Yalnız miktar; karşı taraftaki en iyi fiyatlarla eşleşir. Yalnız <b>KİE<\/b> olarak girilir; karşı emir yoksa iptal olur. Tek fiyat/kapanış emir toplamasında eşleşmeyen kısım sonraki bölüme aktarılmaz, iptal edilir. Azami tutar maksimum emir değeridir (son işlem fiyatı, yoksa önceki kapanış üzerinden).<\/td><\/tr>\n<tr><td>Piyasadan limite<\/td><td>Fiyatsız; yalnız karşı taraftaki <b>en iyi kademe<\/b> ile eşleşir; kalan kısım son işlem fiyatından limit emre dönüşüp pasife yazılır (KİE ise yazılmaz). Hiç işlem görmezse iptal edilir.<\/td><\/tr>\n<tr><td>Dengeleyici<\/td><td>Tek fiyat bölümlerinde fiyat belirlemeye katılmadan eşleşme fiyatında kalan emirlerle işlem yapar; eşleşmeyen iptal.<\/td><\/tr>\n<tr><td>Koşullu<\/td><td>Miktar koşullu (AON, FOK), fiyat koşullu ve zaman koşullu (açılışta, kapanışta) emirler <b>henüz devrede değildir<\/b>. <b>Kısmi görünme koşullu (iceberg)<\/b> emir kullanılır: görünen kısım bitince gizli kısımdan açılan miktar yeni emir gibi öncelik alır.<\/td><\/tr>\n<tr><td>Kotasyon<\/td><td>Limit fiyatlı alış ve satıştan oluşur; yalnız piyasa yapıcı ve likidite sağlayıcı girebilir; bütün olarak ya da tek tarafı iptal edilebilir.<\/td><\/tr>\n<tr><td>Orta nokta (mid-point)<\/td><td>Normal defterdeki en iyi alış ve satışın aritmetik ortalamasından, ayrı ve kapalı defterde eşleşir; büyük emirler için düşük maliyet. Değer <b>100.000 TL – 30 milyon TL<\/b>; yalnız <b>BIST 30<\/b> payları. Miktar yayınlanır, fiyat istatistiği yayınlanmaz.<\/td><\/tr>\n<tr><td>AOF (TAR) emirleri<\/td><td>Gün sonu AOF'yi veya AOF ± belirli adımı referans alır; ayrı sırada (ör. GARAN.AOF) işlem görür; işlem bilgisi piyasaya verilmez, Günlük Bültende yer alır. Miktar <b>100.000 – 10 milyon lot<\/b>; yalnız <b>BIST 30<\/b> payları.<\/td><\/tr>\n<tr><td>Küsurat<\/td><td>Lottan küçük miktar; fiyatsız, .E sırasının son işlem fiyatından. Bu emir türü henüz devrede değildir.<\/td><\/tr>\n<tr><td>Açığa satış<\/td><td>SPK ve Borsanın fiyat sınırlamalarına uyar.<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Geçerlilik süresi<\/th><th>Açıklama<\/th><\/tr>\n<tr><td>Günlük<\/td><td>Gün sonuna kadar; işlem görmezse iptal<\/td><\/tr>\n<tr><td>Kalanı iptal et (KİE)<\/td><td>Girildiği anda karşılanmayan kısım otomatik iptal<\/td><\/tr>\n<tr><td>İptale kadar geçerli (İKG)<\/td><td>Talep toplamayla halka arzda (.HE) süre sonuna kadar<\/td><\/tr>\n<tr><td>Tarihli<\/td><td>Belirtilen son tarihe kadar; başlangıçta devreye alınmadı<\/td><\/tr>\n<\/table>\n<ul>\n<li>Emrin süresi <b>uzatılırsa öncelik kaybedilir<\/b>, kısaltılırsa korunur. Süresi dolan, marj dışına çıkan veya adıma uymayan emirler iptal edilir; baz fiyat sermaye artırımı vb. ile değişirse veya üye kodu değişirse tüm tarihli ve süreli emirler iptal edilir.<\/li>\n<\/ul>\n\n<h3>Emir değiştirme, iptal ve ücretlendirme<\/h3>\n<ul>\n<li>Miktar artırma ve fiyat değiştirme emri yeni emir sayar, <b>zaman önceliği kaybolur<\/b>. Miktar azaltma önceliği bozmaz. <b>İyileştirme:<\/b> alışta fiyatı yükseltmek, satışta düşürmek; <b>kötüleştirme:<\/b> tersi.<\/li>\n<li>Emrin işlem görmeyen kısmı istenildiği an iptal edilebilir.<\/li>\n<li>Cari fiyat kademesindeki emirlerde iptal, miktar azaltma ve fiyat kötüleştirme, emrin kabulünden (veya son değişiklikten) itibaren geçen <b>süreye göre üç aşamalı<\/b> ücretlendirilir; cari kademe dışındakiler farklı oranda ücretlenir.<\/li>\n<li>Ücret alınmayanlar: varant ve sertifika pazarındaki emir ve kotasyon değişiklikleri; özel işlem bildirimi iptalleri; piyasa yapıcıların kotasyon miktar azaltma ve fiyat kötüleştirmeleri; Sistemin veya Borsanın yaptığı iptaller.<\/li>\n<li><b>Yüksek frekanslı işlem (YFİ)<\/b> kullanıcıları bu tarifeden muaftır; onlara <b>emir/işlem oranı (OTR)<\/b> uygulanır: girilen, düzeltilen ve iptal edilen emir sayısının işlem sayısına oranı <b>5:1<\/b>'i aşarsa aşan her operasyon için <b>0,50 TL<\/b> alınır. Hesap günlük, tahakkuk aylıktır.<\/li>\n<li><b>Hatalı işlem düzeltme:<\/b> T+0 ve T+1 gün sonuna kadar <b>Takasbank<\/b> sisteminde (Takas Terminali), işlem bazında yapılır. Yalnız hesap, müşteri kategorisi (M/P/F) ve MKK müşteri hesabı düzeltilebilir; aynı emirden doğan tüm işlemler aynı şekilde değiştirilir; ücretlidir.<\/li>\n<\/ul>\n\n<h3>Öncelik ve emir değeri sınırları<\/h3>\n<ul><li>Dengeleyici emirler hariç öncelik: önce <b>fiyat<\/b>, sonra <b>zaman<\/b>.<\/li><\/ul>\n<table>\n<tr><th>Maksimum emir değeri (paylar)<\/th><th>Sınır<\/th><\/tr>\n<tr><td>1. grup<\/td><td>10 milyon TL<\/td><\/tr>\n<tr><td>2. grup<\/td><td>7,5 milyon TL<\/td><\/tr>\n<tr><td>3. grup<\/td><td>5 milyon TL<\/td><\/tr>\n<tr><td>4. grup<\/td><td>2,5 milyon TL<\/td><\/tr>\n<tr><td>5. grup<\/td><td>1 milyon TL<\/td><\/tr>\n<tr><td>6. grup<\/td><td>0,5 milyon TL<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Diğer araç<\/th><th>Maksimum emir değeri<\/th><\/tr>\n<tr><td>Varant (.V)<\/td><td>250.000 TL<\/td><\/tr>\n<tr><td>Sertifika (.C), emtia sertifikası<\/td><td>1 milyon TL<\/td><\/tr>\n<tr><td>BYF, GMF, GSF, GMS<\/td><td>5 milyon TL<\/td><\/tr>\n<tr><td>Temerrüt ve resmî müzayede sıraları<\/td><td>2,5 milyon TL<\/td><\/tr>\n<tr><td>Birincil piyasa (.BE)<\/td><td>500.000 TL<\/td><\/tr>\n<tr><td>YPAH (.R)<\/td><td>İlgili payın sınırı ile aynı<\/td><\/tr>\n<\/table>\n<ul>\n<li>Paylar günlük ortalama işlem hacmi ve piyasa değerine göre <b>6 gruba<\/b> ayrılır; sınır limit, piyasa, piyasadan limite, dengeleyici, kısmi görünme emirleri ve kotasyonlara uygulanır. Değerlendirme <b>6 ayda bir<\/b>, son 6 aylık veriyle yapılır; en az 2 gün önce duyurulup <b>Ocak ve Temmuz<\/b>'da yürürlüğe girer. Yeni payın sınırını PPD re'sen belirler.<\/li>\n<li>Paylarda piyasa yapıcının bir kerede girebileceği maksimum kotasyon tutarı da payın maksimum emir değeri grubuyla sınırlıdır.<\/li>\n<\/ul>\n\n<h3>Müşteri/portföy/fon ayrımı, AFK ve hesap numarası<\/h3>\n<ul>\n<li>Emirler <b>portföy, müşteri, fon<\/b> ayrımıyla girilir; FixAPI girişlerinde de üye sorumludur. Yeni fon kodu için fon kurucusu <b>Takasbank<\/b>'a başvurur; yatırım ortaklıkları için başvuru <b>PPD<\/b>'ye yapılır, kod KAP'ta duyurulur.<\/li>\n<li>Fon ve yatırım ortaklığı adına emirlerde 3 haneli kod <b>AFK<\/b> (Emir Aracısı/Fon Kodu) alanına, ortaklığın üyedeki hesap numarası \"Hes. No.\" alanına yazılır.<\/li>\n<li>Emir iletimine aracılık edilen kurum için: Hesap No'ya müşterinin kendi kurumundaki numarası, AFK'ya emri iletilen kurumun üye kodu.<\/li>\n<li>Piyasa yapıcı kotasyonlarında AFK: müşteri hesabıyla <b>PYM<\/b>, portföy hesabıyla <b>PYP<\/b>. Likidite sağlayıcıda <b>LSM<\/b> ve <b>LSP<\/b>.<\/li>\n<li>Tüm emirlerde, seansın tüm aşamalarında <b>müşteri hesap numarası zorunlu<\/b>dur ve MKK'daki hesap numarasıyla aynı olmalıdır.<\/li>\n<\/ul>\n\n<h3>Erişim protokolleri<\/h3>\n<table>\n<tr><th>Protokol<\/th><th>Özellik<\/th><\/tr>\n<tr><td>İşlem terminali (TW, Omnet API)<\/td><td>Emir iletim kapasitesi <b>saniyede 10<\/b> (değişiklik ve iptal dâhil, parametrik). Temsilci yardımcısı, temsilci, baş temsilci (şef broker) rolleri. Yalnız BISTECH üye temsilcisi eğitimini başarıyla tamamlayanlar kullanabilir.<\/td><\/tr>\n<tr><td>FixAPI<\/td><td>Üç amaç: emir iletimi (emir, kotasyon, özel işlem bildirimi; eşyerleşim ve uzak erişimden), referans veri, drop copy (üyenin emir ve işlem akışının kopyası, kullanıcı bazında filtre).<\/td><\/tr>\n<tr><td>OUCH<\/td><td>En hızlı emir iletim protokolü; yüksek frekanslı işlemlere imkân verir; yalnız <b>limit emir ve kotasyon<\/b> girilebilir.<\/td><\/tr>\n<tr><td>ITCH<\/td><td>Çok düşük gecikmeli <b>veri yayın<\/b> protokolü; emir defterindeki tüm emir ve işlem bilgilerine hızlı erişim.<\/td><\/tr>\n<\/table>", "sorular": [{"q": "Tam iş günlerinde Pay Piyasası'nda sürekli işlem bölümü hangi saatler arasında yapılır?", "o": ["09:40 – 18:10", "09:55 – 18:00", "10:00 – 17:30", "10:00 – 18:00", "09:40 – 18:00"], "a": 3, "e": "Seans 09:40 – 18:10 arasıdır; sürekli işlem bölümü 10:00 – 18:00'dir."}, {"q": "Tam iş günlerinde kapanış fiyatından/tek fiyattan işlemlerin gerçekleştiği zaman dilimi hangisidir?", "o": ["18:08 – 18:10", "18:00 – 18:05", "18:05 – 18:07", "18:01 – 18:05", "18:07 – 18:08"], "a": 0, "e": "18:07 – 18:08 marj yayını, 18:08 – 18:10 ise kapanış fiyatından/tek fiyattan işlemlerdir."}, {"q": "Pay Piyasası'nda kapanış fiyatı 47,30 TL olan Ana Pazar payının ertesi gün geçerli fiyat değişme sınırları hangisidir?", "o": ["40,21 – 54,40", "40,20 – 54,40", "40,24 – 54,35", "40,22 – 54,39", "40,22 – 54,35"], "a": 4, "e": "±%15 ile 40,205 ve 54,395 bulunur. Alt sınır yukarı adıma (0,02'lik adımla 40,22), üst sınır aşağı adıma (50 TL üstünde adım 0,05 olduğundan 54,35) yuvarlanır."}, {"q": "Baz fiyatı 84,60 TL olan bir Yıldız Pazar payının taban ve tavan fiyatları hangisidir?", "o": ["67,68 – 101,52", "67,65 – 101,60", "67,70 – 101,50", "67,70 – 101,60", "67,65 – 101,50"], "a": 2, "e": "±%20 ile 67,68 ve 101,52 bulunur. 50–99,999 TL aralığında adım 0,05 olduğundan alt sınır yukarı 67,70'e; 100 TL üstünde adım 0,10 olduğundan üst sınır aşağı 101,50'ye yuvarlanır."}, {"q": "Baz fiyatı 18,75 TL olan Alt Pazar payının fiyat değişme sınırları hangisidir?", "o": ["16,88 – 20,62", "16,87 – 20,63", "16,88 – 20,64", "16,87 – 20,62", "16,90 – 20,60"], "a": 0, "e": "±%10 ile 16,875 ve 20,625 bulunur. Alt sınır 0,01'lik adımla yukarı 16,88'e; 20 TL üzerinde adım 0,02 olduğundan üst sınır aşağı 20,62'ye yuvarlanır."}, {"q": "Fiyatı 75 TL olan bir pay ile fiyatı 75 TL olan bir BYF katılma belgesinde geçerli fiyat adımları sırasıyla hangisidir?", "o": ["0,02 TL – 0,05 TL", "0,05 TL – 0,05 TL", "0,10 TL – 0,02 TL", "0,01 TL – 0,01 TL", "0,05 TL – 0,02 TL"], "a": 4, "e": "Paylarda 50–99,999 TL aralığında adım 0,05 TL; BYF'lerde aynı aralıkta adım 0,02 TL'dir."}, {"q": "Aşağıdakilerden hangisinde fiyat adımı her fiyat seviyesinde 1 kuruş değildir?", "o": ["Varant", "Sertifika", "Borsa yatırım fonu", "Emtia sertifikası", "Toptan alış satış işlemleri"], "a": 2, "e": "Varant, sertifika, emtia sertifikası ve TAS işlemlerinde adım her seviyede 1 kuruştur; BYF ve paylarda kademeli adım tablosu uygulanır."}, {"q": "Aşağıdaki araçlardan hangisinde fiyat değişme sınırı baz fiyatın ±%5'idir?", "o": ["Gayrimenkul yatırım fonu", "Borsa yatırım fonu", "Alt Pazar payı", "Gayrimenkul sertifikası", "Yeni pay alma hakkı"], "a": 3, "e": "GMS ve emtia sertifikalarında marj ±%5; GMF, GSF ve BYF'de ±%20; Alt Pazar'da ±%10; YPAH'ta ±%50'dir."}, {"q": "Fiyat değişme sınırlarının değiştirilmesi ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["PPD Direktörü sınırları tamamen kaldırabilir", "PPD Direktörü sınırları re'sen iki katına kadar genişletebilir", "Genel Müdür yalnızca sınırları daraltabilir", "Sınırlar yalnızca SPK kararıyla değiştirilebilir", "Yönetim Kurulu pazar bazında farklı sınır belirleyemez"], "a": 1, "e": "PPD Direktörü iki katına kadar genişletebilir; Genel Müdür kaldırabilir veya değiştirebilir; YK pazar ve emir türü bazında farklı belirleyebilir."}, {"q": "Baz fiyatı 120 TL olan bir Yıldız Pazar payında kapanış seansı öncesindeki son işlem fiyatı 140 TL'dir. Kapanış seansında girilebilecek emir fiyat aralığı hangisidir?", "o": ["135,80 – 144,20", "136,00 – 144,00", "135,80 – 144,00", "96,00 – 144,00", "135,70 – 144,10"], "a": 2, "e": "Son işlem ±%3: 135,80 – 144,20. Ancak günlük sınırlar 96,00 – 144,00 olduğundan üst sınır 144,00'ı aşamaz; aralık 135,80 – 144,00 olur."}, {"q": "Tek fiyat yöntemiyle işlem gören bir payda emir toplama sonrası defter şöyledir. Alış: 10,05'ten 300, 10,04'ten 200, 10,03'ten 500 lot. Satış: 10,02'den 400, 10,04'ten 300, 10,05'ten 200 lot. Eşleşme fiyatı ve işlem miktarı hangisidir?", "o": ["10,04 TL – 500 lot", "10,03 TL – 400 lot", "10,05 TL – 300 lot", "10,02 TL – 400 lot", "10,04 TL – 700 lot"], "a": 0, "e": "10,04'te toplam alış 500, toplam satış 700 lottur; işlem miktarı 500 ile en yüksektir (10,02 ve 10,03'te 400, 10,05'te 300). En çok işlem miktarını sağlayan fiyat 10,04'tür."}, {"q": "Açılış fiyatı belirleme algoritmasında en çok işlem miktarını sağlayan birden fazla fiyat varsa ilk olarak hangi ölçüte bakılır?", "o": ["Piyasanın yönü", "Referans fiyata en yakın fiyat", "Olası fiyatların aritmetik ortalaması", "Arta kalan miktarı en az olan fiyat", "Önceki günün kapanış fiyatı"], "a": 3, "e": "Sıra: en çok işlem miktarı, en az arta kalan miktar (minimum surplus), piyasa yönü (market pressure), referans fiyata yakınlık, ortalama."}, {"q": "Aşağıdaki emirlerden hangisi açılış fiyatının hesaplanmasında dikkate alınır?", "o": ["Dengeleyici emirler", "Kısmi görünme koşullu (rezerv) emirler", "Küsurat emirler", "Hepsi ya da hiçbiri emirleri", "Tetiklenmemiş stop emirler"], "a": 1, "e": "Limit, piyasa, piyasadan limite, kalanı iptal et, rezerv emirler (gizli kısmıyla) ve kotasyonlar hesaba katılır; küsurat, AON, FOK, dengeleyici ve tetiklenmemiş stop emirler katılmaz."}, {"q": "Tek fiyat yönteminde fiyat belirleme aşamasına ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Ayrılan azami süre 5 dakikadır", "Emir girişi yapılamaz", "Özel işlem bildirimi yapılamaz", "Eşleştirme, tanımlanan zamandan itibaren ilk 30 saniye içinde rastlantısal başlar", "Bu aşamada emirler iptal edilebilir"], "a": 4, "e": "Fiyat belirleme aşamasında emir girişi, değişikliği ve iptali yapılamaz; özel işlem bildirimi de yapılamaz."}, {"q": "Paylarda açılış seansının emir toplama aşamasının son 5 dakikasında aşağıdakilerden hangisi yapılabilir?", "o": ["Emrin iptali", "Emrin fiyatının iyileştirilmesi", "Emrin fiyatının kötüleştirilmesi", "Emir miktarının azaltılması", "Açığa satış emri girilmesi"], "a": 1, "e": "Son 5 dakikada iptal, fiyat kötüleştirme ve miktar azaltma yapılamaz; açılış seansında açığa satış emri de girilemez. Fiyat iyileştirme yasak değildir."}, {"q": "Kapanış seansına ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Kapanış seansında fiyat oluşmazsa önceki bölümlerdeki son işlem fiyatı kapanış fiyatı olarak tescil edilir", "Kapanış seansı işlemleri günlük AOF hesabına dâhil edilir", "Serbest marjlı paylarda da son işlem fiyatına göre ±%3 uygulanır", "Varant ve sertifika sıraları kapanış seansına dâhildir", "Kapanış fiyatı açılış fiyatı ile aynı algoritmayla belirlenir"], "a": 3, "e": "Varant, sertifika, temerrüt ve YPAH sıraları kapanış seansına dâhil değildir."}, {"q": "Kapanış fiyatından işlemler aşamasına ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Bu aşamaya aktarılan ve kapanış fiyatından farklı fiyatta bekleyen emirlerin miktarı yalnızca azaltılabilir", "Bu aşamada piyasa emri girilebilir", "Gün içinde hiç işlem görmemiş paylara emir girilebilir", "Bu aşamada girilen emirlerin fiyatı değiştirilebilir", "Bu aşamadaki işlemler AOF hesabına dâhil edilmez"], "a": 0, "e": "Farklı fiyattaki aktarılan emirlerin miktarı azaltılabilir ama artırılamaz, fiyatı yalnız kapanış fiyatına çekilebilir. Aşama 2 dakika sürer, yalnız işlem görmüş araçlarda ve kapanış fiyatından emir girilir."}, {"q": "Piyasa emirleri ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Karşı taraftaki yalnızca en iyi fiyat kademesiyle eşleşir, kalanı limit emre dönüşür", "Serbest marjlı sıralarda baz fiyat oluşmadan girilebilir", "Tek fiyat emir toplamasında eşleşmeyen kısım sürekli işleme aktarılır", "Maksimum tutar sınırı yoktur", "Yalnızca kalanı iptal et olarak girilebilir"], "a": 4, "e": "Piyasa emri yalnız KİE olarak girilir; eşleşmeyen kısım iptal olur. Kalanın limit emre dönüşmesi piyasadan limite emrin özelliğidir."}, {"q": "Orta nokta (mid-point) emirleri ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Değeri asgari 100.000 TL, azami 30 milyon TL olabilir", "En iyi alış ve satış fiyatlarının aritmetik ortalamasından işlem görür", "Tüm Pay Piyasası paylarında kullanılabilir", "Ayrı ve kapalı bir emir defterinde işlem görür", "İşlem sonrası fiyat istatistikleri piyasada yayımlanmaz"], "a": 2, "e": "Orta nokta emirleri yalnızca BIST 30 Endeksi kapsamındaki paylarda kullanılır."}, {"q": "Bir payda normal emir defterindeki en iyi alış 25,40 TL, en iyi satış 25,44 TL'dir. Orta nokta emirleri hangi fiyattan eşleşir?", "o": ["25,42", "25,40", "25,44", "25,41", "25,43"], "a": 0, "e": "Orta nokta emirleri en iyi alış ve satışın aritmetik ortalamasından fiyatlanır: (25,40 + 25,44) / 2 = 25,42."}, {"q": "Ağırlıklı ortalama fiyat (AOF/TAR) emirlerinde miktar sınırları hangisidir?", "o": ["Asgari 100.000 TL, azami 30 milyon TL", "Asgari 250 lot, azami 1 milyon lot", "Asgari 10.000 lot, azami 10 milyon lot", "Asgari 1 milyon TL, azami 10 milyon TL", "Asgari 100.000 lot, azami 10 milyon lot"], "a": 4, "e": "AOF emirlerinde TL sınırı olmaksızın 100.000 – 10 milyon lot (adet) sınırı vardır; yalnız BIST 30 paylarında kullanılır. 100.000 TL – 30 milyon TL sınırı orta nokta emirlerine aittir."}, {"q": "Sistemde bekleyen bir emir üzerinde yapılan aşağıdaki değişikliklerden hangisi emrin zaman önceliğini kaybettirmez?", "o": ["Miktarın artırılması", "Fiyatın iyileştirilmesi", "Miktarın azaltılması", "Fiyatın kötüleştirilmesi", "Geçerlilik süresinin uzatılması"], "a": 2, "e": "Miktar artırma ve fiyat değişikliği emri yeni emir yapar; süre uzatma da önceliği kaybettirir. Miktar azaltma ve süre kısaltma önceliği korur."}, {"q": "Yüksek frekanslı işlem kullanıcısının bir günde 30 işlemi ve toplam 200 emir girme, düzeltme ve iptal operasyonu vardır. Bu kullanıcıdan alınacak OTR bazlı fazla kullanım ücreti kaç TL'dir?", "o": ["100", "15", "50", "25", "0"], "a": 3, "e": "Oran sınırı 5:1 olduğundan 30 işlem için 150 operasyon serbesttir. Aşan 50 operasyonun her biri için 0,50 TL alınır: 50 × 0,50 = 25 TL."}, {"q": "2. gruptaki bir pay için maksimum emir değeri ve varantlar için maksimum emir değeri sırasıyla hangisidir?", "o": ["10 milyon TL – 1 milyon TL", "7,5 milyon TL – 250.000 TL", "5 milyon TL – 250.000 TL", "7,5 milyon TL – 1 milyon TL", "2,5 milyon TL – 500.000 TL"], "a": 1, "e": "Gruplar 10 / 7,5 / 5 / 2,5 / 1 / 0,5 milyon TL'dir; 2. grup 7,5 milyon TL. Varantta 250.000 TL, sertifikada 1 milyon TL uygulanır."}, {"q": "Yalnızca limit emirler ve kotasyon emirlerinin kullanılabildiği, yüksek frekanslı işlemlere imkân veren emir iletim protokolü hangisidir?", "o": ["ITCH", "FixAPI Drop Copy", "OUCH", "Omnet API", "FixAPI Referans Veri"], "a": 2, "e": "OUCH en hızlı emir iletim protokolüdür ve yalnız limit emir ile kotasyon girişine izin verir; ITCH bir veri yayın protokolüdür."}]}, {"id": 4, "kisa": "PY, devre kesici, tedbirler", "baslik": "Pay Piyasası: Piyasa Yapıcılık, Özel İşlem Bildirimi, Devre Kesiciler, Açığa Satış ve Tedbirler", "ozet": "Piyasa yapıcılık ve likidite sağlayıcılık kuralları, özel işlem bildirimi kademeleri, pay bazında ve endekse bağlı devre kesiciler, kredili işlem ve açığa satış, takas, brüt takas, Volatilite Bazlı Tedbir Sistemi ve piyasanın tarihsel gelişimi.", "notlar": "<h3>Piyasa yapıcılık: tanımlar<\/h3>\n<ul>\n<li><b>Piyasa yapıcılık:<\/b> Genel Müdürlükçe yetkilendirilen üyenin, sorumlu olduğu araçta dürüst, düzenli ve etkin işleyişi sağlamak ve likiditeye katkı için <b>sürekli işlem yönteminde<\/b> yürüttüğü alım satım faaliyeti. Piyasa yapıcı, kendi namına ve hesabına çift taraflı kotasyon veya tek taraflı emirle katkı sağlar; önceden bildirdiği kendine ait olmayan hesapları da kullanabilir.<\/li>\n<li>Piyasa yapıcılıkla ilgili YK yetkileri, 26/06/2014 tarihli kararla <b>Borsa Genel Müdürlüğüne<\/b> devredilmiştir. Piyasa yapıcı üye, başvurusu kabul edilip <b>Piyasa Yapıcılık Taahhütnamesi<\/b>'ni imzalayan üyedir. <b>Yedek piyasa yapıcı<\/b> sırada bekleyen üyedir.<\/li>\n<li><b>Kotasyon:<\/b> tek/çift taraflı fiyat ve miktar bildirimi. <b>Minimum yayılma aralığı:<\/b> alış ve satış kotasyonu arasındaki en az fark; <b>maksimum yayılma aralığı:<\/b> en çok fark.<\/li>\n<\/ul>\n<h4>Genel kurallar<\/h4>\n<ul>\n<li>Sürekli işlem bölümünde alış ve satış tarafında <b>sürekli kotasyon<\/b> verilmesi esastır; fiyat ve zaman önceliği kotasyonlara da uygulanır.<\/li>\n<li>İşlemleri durdurulan araçta mevcut kotasyon değiştirilemez ve iptal edilemez.<\/li>\n<li>Piyasa yapıcı, portföyünde karşılığı olmayan miktarda kotasyon satışını alıştan önce yapabilir.<\/li>\n<li>Bir araçta birden fazla piyasa yapıcı olabilir. Kotasyon fiyatı <b>ayrı bir fiyat limiti oluşturmaz<\/b>; kotasyon girilmeden de emir girilip işlem yapılabilir. Açılış ve kapanış gibi tek fiyat bölümlerinde de kotasyon girilebilir.<\/li>\n<li>Kotasyonda AFK alanına <b>PYM/PYP<\/b> yazılır. İndirim günlük değerlendirmeyle hesaplanır, <b>aylık<\/b> tahakkuk eder.<\/li>\n<li>Kotasyondaki <b>her değişiklik<\/b> (miktar azaltma dâhil) önceliği kaybettirir; çünkü iptal ve yeni giriş sayılır.<\/li>\n<\/ul>\n<h4>Piyasa yapıcı olabilme kriterleri<\/h4>\n<table>\n<tr><th>Kriter<\/th><th>Geçerli pazarlar<\/th><\/tr>\n<tr><td>1) <b>Kısmi yetkili<\/b> (en az işlem aracılığı, en iyi gayret aracılığı ve sınırlı saklama izniyle) veya <b>geniş yetkili<\/b> olmak<br>2) Son 1 yılda, farklı günlerde düşülen <b>2 milyon TL ve üstü<\/b> takas temerrüdü sayısı <b>5'i aşmamak<\/b><\/td><td>Ana Pazar, Alt Pazar, YÜFP, GSP, EP<\/td><\/tr>\n<\/table>\n<ul>\n<li>Temerrüt sayımı: aynı gün kapatılan temerrüt sayılmaz; aynı gün farklı paylarda birden fazla 2 milyon TL ve üstü temerrüt <b>1 adet<\/b> sayılır; aynı gün her biri 2 milyon TL'nin altındaki temerrütler toplamına bakılmaksızın sayılmaz.<\/li>\n<li>III-37.1 Tebliği m.8: <b>dar yetkili<\/b> (emir iletimine aracılık, yatırım danışmanlığı), <b>kısmi yetkili<\/b> (işlem aracılığı, en iyi gayret aracılığı, sınırlı saklama, portföy yöneticiliği), <b>geniş yetkili<\/b> (portföy aracılığı, genel saklama, aracılık yüklenimi). Bankalar bu şekilde sınıflanmaz ama aynı izin şartları aranır.<\/li>\n<li>Kriterleri sağlamayan üye; kurucu/ihraççısı olduğu, grubunun halka arz ettiği veya halka arzına aracılık ettiği ve elinde araç bulunan araçta, BİAŞ YK onayıyla <b>yalnız o araçla sınırlı<\/b> piyasa yapıcı olabilir ve atanmada öncelik alır.<\/li>\n<li>Uygunluk <b>6 ayda bir<\/b> (Haziran ve Aralık sonu) değerlendirilir; sonuçlar <b>1 Temmuz ve 1 Ocak<\/b>'tan itibaren geçerlidir. Kriterleri kaybedenin yetkisi kalkar; yeniden sağlayınca yeniden yetkilendirilir ama önceki araç için <b>yeni başvuru<\/b> gerekir.<\/li>\n<\/ul>\n<h4>Uygulanan araçlar ve işlem yöntemi<\/h4>\n<table>\n<tr><th>Araç<\/th><th>Piyasa yapıcılık<\/th><th>Piyasa yapıcı yoksa<\/th><\/tr>\n<tr><td>Ana ve Alt Pazar payları (GYO, GSYO, MKYO dâhil)<\/td><td>İsteğe bağlı<\/td><td>İşlem yöntemi değişmez<\/td><\/tr>\n<tr><td>BYF<\/td><td><b>Zorunlu<\/b> (esas)<\/td><td><b>Tek fiyat<\/b> yöntemine geçilir<\/td><\/tr>\n<tr><td>Varant ve sertifika<\/td><td>Zorunlu; yalnız piyasa yapıcılı sürekli işlem<\/td><td>Sıra <b>kapatılır<\/b> (tek fiyat uygulanmaz)<\/td><\/tr>\n<tr><td>YÜFP'de SDKS, GMS, GMF, GSF<\/td><td>İsteğe bağlı<\/td><td>İşlem yöntemi değişmez<\/td><\/tr>\n<tr><td>Emtia sertifikası<\/td><td>Zorunlu (esas)<\/td><td>Genel Müdür tek fiyata geçilmesine karar verebilir<\/td><\/tr>\n<tr><td>YİP ve PÖİP payları<\/td><td><b>Yapılamaz<\/b><\/td><td>-<\/td><\/tr>\n<\/table>\n<ul><li>Dikkat: Yıldız Pazar payları piyasa yapıcılık için geçerli pazarlar listesinde yoktur; likidite sağlayıcılık listesinde ise vardır.<\/li><\/ul>\n<h4>Atanma<\/h4>\n<ul>\n<li>Bir araca birden fazla piyasa yapıcı atanabilir; üye başına araç sayısını Genel Müdür sınırlayabilir.<\/li>\n<li>Başvuracak üyenin yazılımı hazır olmalı, BİAŞ eğitimine katılmış olmalı ve sistemde <b>baş temsilci (şef broker)<\/b> tanımlı en az bir temsilcisi bulunmalıdır.<\/li>\n<li>Her araç için yalnız kotasyonda kullanılacak portföy ve müşteri hesapları bildirilir; bu hesaplar başka amaçla kullanılamaz, seans boyunca değiştirilemez. Bu hesaplarla piyasa yapıcılık kapsamında özel işlem bildirimi yapılabilir.<\/li>\n<li>Başvuruda öncelik <b>ilk başvurana<\/b>; aynı gün gelenlerde kurucu/ihraççı veya halka arza aracılık eden üyeye; şirketin tercihi de dikkate alınır. Pazar veya yöntem değişikliğiyle faaliyeti zorunlu biten üye, araç yeniden piyasa yapıcılı olursa öncelikli olur.<\/li>\n<\/ul>\n<h4>Haklar, kotasyon kuralları ve performans<\/h4>\n<ul>\n<li><b>Borsa payı indirimi:<\/b> kotasyonla yapılan işlemlerde performansa göre <b>%50<\/b>; yedek piyasa yapıcılığı indirim sağlamaz.<\/li>\n<li>Kotasyon girişi FixAPI, OUCH veya Borsa terminallerinden yapılır; terminalden kotasyon yetkisi yalnız baş temsilci olup piyasa yapıcılık eğitimini tamamlayan temsilcilere verilir. Portföy dışı hesap sahipleri kotasyonun belirlenmesinde etkin olamaz.<\/li>\n<li>Kotasyon fiyatı marj içinde ve yayılma aralığı sınırlarında serbestçe belirlenir; alış ve satış fiyatı <b>eşit olamaz<\/b>, alış satıştan <b>yüksek olamaz<\/b>; minimum yayılma <b>1 fiyat adımı<\/b>.<\/li>\n<li><b>Kotasyon miktarı alt sınırı: 250 lot<\/b> (tüm araçlarda); altına düşen kotasyon değerlendirmede geçersiz sayılır. Kotasyonlar yalnız <b>limit fiyatlı<\/b> emir olarak girilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Fiyat seviyesi (TL)<\/th><th>Maksimum kotasyon yayılma aralığı<\/th><\/tr>\n<tr><td>0,01 – 1,00<\/td><td>6 fiyat adımı<\/td><\/tr>\n<tr><td>1,01 – 2,50<\/td><td>8 fiyat adımı<\/td><\/tr>\n<tr><td>2,51 – 10,00<\/td><td>10 fiyat adımı<\/td><\/tr>\n<tr><td>10,01 ve üzeri<\/td><td>Fiyatın %1'i<\/td><\/tr>\n<\/table>\n<ul>\n<li>Talep üzerine maksimum yayılmayı <b>iki katına<\/b> çıkarmaya <b>PPD Direktörü<\/b>, tamamen serbest bırakmaya <b>Genel Müdür<\/b> yetkilidir.<\/li>\n<li><b>Başarı ölçütü:<\/b> sürekli işlem süresinin <b>%90<\/b>'ında miktar ve fiyat koşulunu sağlayan geçerli kotasyon. Fiyat taban veya tavanda kilitliyken kotasyon olmasa da yükümlülük yerine getirilmiş sayılır.<\/li>\n<li>Varantlarda dayanak bazında <b>yılda 2 kez<\/b> ayrıca değerlendirme: iki dönem üst üste <b>%65<\/b>'in altı uyarı; tekrarında faaliyet vade sonunda sona erdirilebilir; 6 ay yeniden başvurulamaz.<\/li>\n<\/ul>\n<h4>Faaliyetin sona ermesi<\/h4>\n<table>\n<tr><th>Sebep<\/th><th>Kural<\/th><\/tr>\n<tr><td>Kendi isteği<\/td><td>Son iş gününden <b>en az 2 iş günü önce<\/b> yazılı başvuru; PPD başvuruyu izleyen iş günü duyurur; <b>30 gün<\/b> içinde aynı araca yeniden başvuramaz<\/td><\/tr>\n<tr><td>Temel kriterlerin kaybı<\/td><td>Derhâl bildirilir; anlaşıldığı günün sonunda (istisnalar hariç) tüm araçlarda faaliyet biter; yedeklik de kalkar; aynı gün duyurulur<\/td><\/tr>\n<tr><td>Yetersiz performans<\/td><td>Genel Müdürlük uyarır; <b>son 6 ayda ikinci kez<\/b> tekrarlanırsa gün sonunda sona erdirilebilir; <b>6 ay<\/b> aynı araca başvuramaz. BİAŞ YK re'sen son verebilir<\/td><\/tr>\n<tr><td>Aracılık faaliyetinin durdurulması<\/td><td>Tüm araçlarda kendiliğinden biter, yedek listeden de çıkarılır<\/td><\/tr>\n<tr><td>Aracın tek fiyata veya başka pazara geçmesi<\/td><td>Tek fiyatta biter; yeni pazarda sürekli işlem ve piyasa yapıcılık varsa devam edebilir<\/td><\/tr>\n<\/table>\n<ul>\n<li>İşlemleri geçici durdurulan piyasa yapıcılı araçta bekleyen limit emirler iptal edilebilir, fiyatı kötüleştirilebilir, miktarı azaltılabilir, süresi kısaltılabilir; yeni emir, iyileştirme, artırma, süre uzatma yapılamaz. Kotasyonlar ise hiç değiştirilemez ve iptal edilemez; işlemler başlamadan kotasyon girilemez.<\/li>\n<li>Seans durdurulursa hiçbir emir veya kotasyon girişi, düzeltmesi, iptali yapılamaz.<\/li>\n<li>Piyasa yapıcılı araçların birincil piyasa, temerrüt, resmî müzayede ve YPAH sıralarında <b>piyasa yapıcı olmadan<\/b> sürekli işlem yapılır.<\/li>\n<\/ul>\n\n<h3>Likidite sağlayıcılık<\/h3>\n<ul>\n<li>Görevlendirildiği araçta kendi veya başkası hesabına emir/kotasyon ileterek gerekli gördüğü zaman likiditeye katkı. <b>İsteğe bağlıdır<\/b>, likiditeyi artırmaya yöneliktir, <b>fiyat istikrarı amacı taşımaz<\/b>.<\/li>\n<li>Başlamak için şirketin (ihraççının) <b>yönetim kurulu kararı<\/b> ve şirket ile kuruluş arasında <b>anlaşma<\/b> gerekir; Borsaya başvurulur, PPD KAP'ta duyurur.<\/li>\n<li>Kriter: <b>kısmi yetkili<\/b> (en az işlem aracılığı ve sınırlı saklama) veya geniş yetkili olmak. Pazarlar: <b>Yıldız, Ana, Alt, YÜFP, GSP<\/b>.<\/li>\n<li>Kapsam: <b>BIST 30 dışındaki<\/b> Yıldız, Ana ve Alt Pazar payları ile YÜFP'deki SDKS, GMS, GMF, GSF. Piyasa yapıcılık ve tek fiyat yöntemiyle <b>birlikte uygulanmaz<\/b>. YİP ve PÖİP'te yapılamaz.<\/li>\n<li>Bir araçta birden fazla likidite sağlayıcı olabilir. Grup paylar ayrı değerlendirilir (yalnız bir grupta yapılabilir). Rüçhan haklarında yapılıp yapılmayacağı sözleşmeyle belirlenir. Pay şirket ortaklarından da temin edilebilir.<\/li>\n<li>Her işlem sırası için ayrı portföy/müşteri hesabı bildirilir; Borsa izni olmadan değiştirilemez ve başka işte kullanılamaz. Kotasyonda AFK: <b>LSM/LSP<\/b>. Brüt takaslı sırada LSM/LSP'li kotasyon işlemleri muafiyete girer; kotasyon dışı emirler girmez. Açığa satış kurallarına uyarak açığa satış emri girebilir.<\/li>\n<li>Likidite sağlanan payların <b>FDPD toplamı<\/b>, kuruluşun <b>özkaynaklarının 20 katını<\/b> geçemez; aşılırsa bir kısmında faaliyet bırakılır.<\/li>\n<li>Haziran ve Aralık son işlem günü itibarıyla değerlendirilir: likidite sağlama işlemleri aracın <b>6 aylık işlem hacminin %80'ini<\/b> aşamaz (alt sınır yok). Seansın tüm aşamaları dâhil; özel işlem bildirimi ve TAS hariç. Dönem içinde başlayana kıstelyevm uygulanır.<\/li>\n<li>Sürekli emir verme zorunluluğu yoktur; hiç emir girmeyebilir ya da tek yönlü girebilir.<\/li>\n<li><b>Sona erme:<\/b> anlaşmanın bitmesi/feshi ve KAP ilanı; payın <b>BIST 30'a girmesi<\/b> veya yapılamayan pazara geçmesi; %80 aşımında PPD uyarısı, izleyen ilk 6 ayda tekrar aşılırsa görev sonu ve KAP ilanı; düzenlemeye aykırılıkta sona erme ve izleyen dönemde (6 ay) aynı araçta atanamama; faaliyet durdurma veya yetki iptalinde otomatik sona erme; devralma/birleşmede SPK onayından itibaren <b>10 işlem günü<\/b> içinde yeniden başvurulmazsa otomatik sona erme.<\/li>\n<\/ul>\n\n<h3>Özel işlem bildirimi<\/h3>\n<ul><li>Üyenin aynı veya farklı müşterilerinden aldığı, miktar ve fiyatı uyuşan karşılıklı emirleri <b>emir defterine iletmeden<\/b> işleme dönüştürmek için Borsaya bildirmesi; işlemler ayrıca duyurulur.<\/li><\/ul>\n<table>\n<tr><th>Kademe<\/th><th>Tutar aralığı<\/th><th>Fiyat limiti (son işlem fiyatına göre)<\/th><\/tr>\n<tr><td>1. kademe<\/td><td>10 milyon TL – 50 milyon TL<\/td><td>±%6<\/td><\/tr>\n<tr><td>2. kademe<\/td><td>50.000.001 TL – 250 milyon TL<\/td><td>±%10<\/td><\/tr>\n<\/table>\n<ul>\n<li>Her iki kademede de günlük fiyat limitleri aşılamaz. Değerler parametriktir, önceden duyurularak araç bazında veya piyasa genelinde değiştirilebilir.<\/li>\n<li>Pay, varant, sertifika, BYF, SDKS, GMS, GMF, GSF, emtia sertifikası ve YPAH sıralarında yapılabilir; Borsa dışı takaslı TAS işlemleri <b>.NSE<\/b> sıralarında özel işlem bildirimiyle yapılır.<\/li>\n<li>Açılış ve kapanış bölümlerinde, fiyat belirleme aşamasında, ilk defa işlem görecek payların birincil piyasasında ve rüçhandan kalan payların satışında yapılamaz.<\/li>\n<\/ul>\n\n<h3>Devre kesiciler<\/h3>\n<h4>Pay bazında devre kesici<\/h4>\n<ul>\n<li>Yalnız <b>paylarda<\/b> ve yalnız <b>sürekli işlem<\/b> bölümlerinde çalışır. Fiyat, referans değere göre eşiği aşarsa ilgili pay geçici olarak <b>tek fiyat emir toplamaya<\/b> alınır, ardından sürekli işleme dönülür.<\/li>\n<li><b>Referans fiyat:<\/b> en son tek fiyatla belirlenen fiyat (açılış, tekil açılış, devre kesici seansı) ile baz fiyattan <b>en son güncelleneni<\/b>. Referansa pazarın tetikleme oranı uygulanarak devre kesici limitleri bulunur.<\/li>\n<li>Tetikleme oranları: <b>Yıldız %10, Ana %7,5, Alt %5<\/b> (YİP ve PÖİP'te yok). Limiti aşacak emir iptal edilir; önceki seviyelerde kısmen işlem gördüyse kalanı iptal edilir.<\/li>\n<li>Emir toplama 30 saniyelik aralıkta rastlantısal kesilir; eşleştirme bu 30 saniye içinde başlar. Devre kesicinin çalıştığı ve açığa satış yapılabilen sıralarda <b>seans sonuna kadar yukarı adım kuralı<\/b> uygulanır.<\/li>\n<li>Emir toplama süresi: metinde Yıldız, Ana, Alt Pazar ve GSP için <b>10 dakika<\/b> denmektedir; pazar işlem esasları tablosunda ise emir toplama Yıldız'da 5, Ana ve Alt'ta 15 dakika, eşleştirme 2 dakika olarak verilmiştir. Dikkat: kaynakta bu iki bilgi çelişkilidir.<\/li>\n<li>Kapanışa kalan son 15 dakikada (<b>17:45 – 18:00<\/b>) çalışırsa emir toplama 15 dakikaya uzar, eşleştirme yapılmadan kapanış seansına devam eder; eşleştirme kapanış emir toplaması bitince yapılır.<\/li>\n<li>Bir pay sırasında devre kesici çalışınca ona bağlı YPAH, varant, temerrüt sıraları sürekli işleme <b>kesintisiz devam eder<\/b>.<\/li>\n<\/ul>\n<h4>Endekse bağlı devre kesici sistemi (EBDKS)<\/h4>\n<ul>\n<li><b>BIST 100<\/b> endeksi önceki kapanışa göre gün içinde <b>%6 veya daha fazla düşerse<\/b> devreye girer; Pay Piyasasında işlemler geçici durur. Endeks, yön ve oranları Borsa önceden duyurarak değiştirebilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Sıralar<\/th><th>Durdurma<\/th><th>Sonrası<\/th><\/tr>\n<tr><td>.E, .F1, .F2, .G, .S1 (pay, GMF, GSF, GMS, EMS)<\/td><td><b>10 dakika<\/b>; emir iptali ve değişikliği yapılamaz (eşleştirmedeki sıralarda önce eşleştirme tamamlanır)<\/td><td>Sürekli işlem sıralarında 5 dakika tek fiyat emir toplama, sonraki 5 dakikada eşleştirme. Tek fiyat sıralarında en az 10 dakikalık emir toplama, sonra akış kaldığı yerden<\/td><\/tr>\n<tr><td>.V, .C, .F, .R (varant, sertifika, BYF, rüçhan)<\/td><td><b>20 dakika<\/b>; emir iptali, fiyat kötüleştirme, miktar azaltma yapılabilir (.V, .C, .F'de kotasyon girişi, değişikliği ve iptali de)<\/td><td>Yeterli süre kalırsa sürekli işleme açılır<\/td><\/tr>\n<tr><td>.BE (rüçhandan kalan paylar, 10:30 – 13:00)<\/td><td>10:10'dan sonra devreye girerse <b>30 dakika<\/b><\/td><td>Yeniden açılan birincil seans <b>15:00<\/b>'te biter<\/td><\/tr>\n<\/table>\n<ul>\n<li>Sürekli işlemin bitiminden önceki <b>60 dakikada (17:30 – 18:00)<\/b> devreye girerse işlemler kapanış seansına kadar durur; kapanışa dâhil sıralar kapanışla devam eder.<\/li>\n<li>%6 eşiği aynı gün yeniden aşılsa da devre kesici aynı aşama için <b>ikinci kez çalışmaz<\/b>; <b>18:00'den sonra<\/b> devreye girmez. Devreye girerse açığa satış sıralarında seans sonuna kadar yukarı adım kuralı uygulanır.<\/li>\n<li><b>Genel Müdür<\/b>; araç, pazar veya piyasa bazında tetikleme oranlarını, referans endeksi ve endeks oranlarını re'sen kaldırabilir veya değiştirebilir.<\/li>\n<\/ul>\n\n<h3>İşlem öncesi risk yönetimi (PTRM)<\/h3>\n<ul><li>Borsa, özellikle <b>sponsor olunan kullanıcılara<\/b> yönelik risk kontrolü için araç, emir ve işlemlere kapasite, miktar ve tutar sınırları koyabilir ya da üye/kullanıcının koymasını isteyebilir; olağan dışı durumda limitleri re'sen değiştirebilir.<\/li><\/ul>\n\n<h3>Kredili işlem ve açığa satış<\/h3>\n<ul>\n<li>SPK'dan izin alan kurumlar, izin belgesiyle Borsaya başvurup sistemde yetki alır.<\/li>\n<li><b>Liste kapsamı:<\/b> Alt Pazar, PÖİP ve YİP hariç tüm paylar ve BYF'ler; yani <b>Yıldız, Ana ve GSP payları ile BYF'ler<\/b> kredili alım ve açığa satışa konu olabilir.<\/li>\n<li>Varant, sertifika, SDKS, GMF, GSF ve emtia sertifikasında kredili alım ve açığa satış <b>yapılamaz<\/b>. <b>Gayrimenkul sertifikasında kredili alım yapılabilir, açığa satış yapılamaz.<\/b><\/li>\n<li>Seri V No 65 Tebliği uyarınca işlem sırası <b>sürekli kapatılan<\/b> paylar hemen; geçici durdurulan paylar kapalılık <b>5 iş gününü aşarsa<\/b> listeden çıkarılır.<\/li>\n<li>Çıkarılan paylar izleyen <b>üç aylık dönem sonuna kadar Geçici Listede<\/b> kalır; yeni kredili ve açığa satış işlemi yapılamaz ama mevcut pozisyonlar aksine talep yoksa korunabilir. Dönem sonunda esas listeye dönmezse pozisyonlar doğrudan tasfiye edilir.<\/li>\n<\/ul>\n<h4>Açığa satışta fiyat sınırı (yukarı adım kuralı)<\/h4>\n<ul>\n<li>Tebliğ m.29: açığa satış <b>son işlem fiyatından yüksek<\/b> fiyattan yapılır; ancak son fiyat bir önceki fiyattan yüksekse <b>son fiyattan da<\/b> yapılabilir.<\/li>\n<li><b>Yıldız Pazar<\/b>'da yukarı adım kuralı yoktur; fiyat sınırları içindeki her fiyattan açığa satış girilebilir. <b>Ana Pazar<\/b> payları ve <b>BYF<\/b>'lerde kural geçerlidir.<\/li>\n<li><b>Açılış seanslarında açığa satış emri girilemez<\/b>; diğer tüm bölümlerde ve devre kesici emir toplamasında girilebilir. Açılış fiyatı oluşmuşsa açığa satış bu fiyatın bir kademe üstünden; oluşmamışsa önceki kapanışın bir kademe üstünden girilebilir. Baz fiyat serbestse işlem gerçekleştikten sonra; baz fiyat seans içinde değiştirilmişse işlem olmasa da girilebilir.<\/li>\n<li><b>BIST 100 endeksi gün içinde önceki kapanışa göre %2 veya daha fazla düşerse<\/b>, açığa satış yapılabilen tüm sıralarda yukarı adım kuralı seans sonuna kadar otomatik uygulanır.<\/li>\n<li>Emir girişinde açığa satış seçeneği işaretlenir (FixAPI'de ayırt edici kod). <b>Özel işlem bildirimi, kotasyon, orta nokta ve AOF (TAR) emirleriyle açığa satış yapılamaz.<\/b><\/li>\n<li>Bültende pay bazında: en düşük ve en yüksek açığa satış fiyatı, açığa satış AOF'si, işlem hacmi, işlem adedi ve sözleşme sayısı ilan edilir.<\/li>\n<\/ul>\n\n<h3>Sertifika zorunluluğu, takas ve temerrüt<\/h3>\n<ul>\n<li>BISTECH işlem terminallerini yalnız <b>BISTECH üye temsilcisi eğitimini başarıyla tamamlayan<\/b> temsilciler kullanabilir.<\/li>\n<li>Takas yöntemi, süreleri, mahsup, temerrüt, cezalar, faiz ve komisyon gibi hususlar <b>Takasbank<\/b> düzenlemelerindedir.<\/li>\n<li>Takasbank, temerrüt pozisyonunu kapatmak ve <b>aynı gün valörlü (T+0)<\/b> işlem yapmak isterse, ana sıra açık ya da kapalı olsun <b>ayrı bir temerrüt sırası<\/b> açılır. Temerrüt sırası cari baz fiyat ve marjlarla veya <b>serbest marjla<\/b> açılabilir; Takasbank talebiyle seans içinde serbest marja dönüştürülebilir.<\/li>\n<\/ul>\n\n<h3>Brüt takas (BT)<\/h3>\n<ul>\n<li>Normalde Takasbank pay bazında ve toplam TL olarak <b>netleştirme<\/b> yapar; gün içinde aynı payı alıp satan yatırımcı yalnız net fark kadar teslimle yükümlüdür.<\/li>\n<li>Netleştirmenin kaldırıldığı paylarda <b>brüt takas<\/b> uygulanır: alıcının takas tarihinde hesabında alımı karşılayacak <b>nakit<\/b>, satıcının da satışı karşılayacak <b>menkul kıymet<\/b> bulunmalıdır; alacaklar takas süresinden sonra dağıtılır.<\/li>\n<li>Amaç: yanlış izlenim yaratan, piyasaya net katkı sağlamayan işlemler ile olağan dışı fiyat-miktar hareketlerini önlemek. Yalnız takasla ilgilidir; yatırımı engellemez, riskleri azaltabilir.<\/li>\n<li><b>Muafiyet:<\/b> BT kapsamındaki paylarda piyasa yapıcı ve likidite sağlayıcıların, Borsaya bildirdikleri hesaplarla kotasyon (ve likidite sağlayıcılık emirleri) üzerinden yaptıkları işlemler <b>netleştirilmeye devam eder<\/b>.<\/li>\n<\/ul>\n\n<h3>Volatilite Bazlı Tedbir Sistemi (VBTS)<\/h3>\n<p>SPK kararlarıyla, aşırı volatiliteden korumak için kurulmuştur. Koşullar oluştukça tedbirler <b>kademeli<\/b> uygulanır; bir üst seviyeye geçildiğinde önceki tedbirler <b>devam eder<\/b>. Her seviye <b>1 ay<\/b> sürer.<\/p>\n<ol>\n<li><b>Açığa satış ve kredili işlem yasağı<\/b><\/li>\n<li><b>Brüt takas<\/b><\/li>\n<li><b>Emir paketi:<\/b> piyasa ve piyasadan limite emir kısıtı; emir iptali, miktar azaltma ve fiyat kötüleştirme yasağı; emir toplama bilgi yayınının kısıtlanması<\/li>\n<li><b>Tek fiyat yöntemiyle işlem görme<\/b><\/li>\n<li><b>Emir iletim kanallarının kısıtlanması<\/b> (internet emir yasağı)<\/li>\n<\/ol>\n<ul><li>Tedbir uygulanacak paylar, başlangıç tarihi ve süresi ilgili gün <b>piyasa kapandıktan sonra<\/b> Borsa tarafından <b>KAP<\/b>'ta duyurulur.<\/li><\/ul>\n\n<h3>Tarihsel gelişimden seçmeler<\/h3>\n<table>\n<tr><th>Tarih<\/th><th>Gelişme<\/th><\/tr>\n<tr><td>03.01.1986<\/td><td>İlk seans, toplu açılış fiyatı yöntemi; 41 şirket, 36 üye<\/td><\/tr>\n<tr><td>17.11.1987<\/td><td>Çok fiyat sürekli müzayede sistemine geçiş<\/td><\/tr>\n<tr><td>21.11.1994<\/td><td>Tam otomasyon<\/td><\/tr>\n<tr><td>01.11.2004<\/td><td>Borsa Yatırım Fonları Pazarı<\/td><\/tr>\n<tr><td>02.02.2007<\/td><td>Açılış seansı uygulaması<\/td><\/tr>\n<tr><td>13.08.2010<\/td><td>Varantların işlem görmeye başlaması<\/td><\/tr>\n<tr><td>10.01.2011<\/td><td>Otomatik seans durdurma sistemi ve brüt takas<\/td><\/tr>\n<tr><td>01.11.2012<\/td><td>Likidite sağlayıcılık uygulaması<\/td><\/tr>\n<tr><td>05.04.2013<\/td><td>İMKB'nin Borsa İstanbul A.Ş.'ye dönüşmesi<\/td><\/tr>\n<tr><td>20.01.2014<\/td><td>NASDAQ OMX ile stratejik işbirliği anlaşması<\/td><\/tr>\n<tr><td>30.11.2015<\/td><td>Pay Piyasasının BISTECH'e geçişi: tek seans, devre kesici, yeni emir tipleri, özel işlem bildirimi, yeni pazar yapısı<\/td><\/tr>\n<tr><td>2016<\/td><td>PTRM, OUCH, kısmi görünme emirleri, orta nokta ve AOF emirleri<\/td><\/tr>\n<tr><td>10.08.2020<\/td><td>Endekse bağlı devre kesici sistemi<\/td><\/tr>\n<tr><td>07.08.2023<\/td><td>BISTECH 3.0 sürümü<\/td><\/tr>\n<\/table>", "sorular": [{"q": "Bir üyenin son bir yılda takas temerrütleri şöyledir: farklı günlerde 2 milyon TL üstü 3 temerrüt; başka bir günde farklı paylarda 2 milyon TL üstü 2 temerrüt; başka bir günde her biri 2 milyon TL altında 4 temerrüt; aynı gün kapatılan 2 milyon TL üstü 1 temerrüt. Piyasa yapıcılık değerlendirmesinde dikkate alınan temerrüt sayısı ve sonuç hangisidir?", "o": ["10 – kriter sağlanmaz", "6 – kriter sağlanmaz", "4 – kriter sağlanır", "5 – kriter sağlanır", "8 – kriter sağlanmaz"], "a": 2, "e": "Farklı günlerdeki 3 temerrüt 3 sayılır; aynı gün farklı paylardaki 2 temerrüt 1 sayılır; 2 milyon TL altındakiler ve aynı gün kapatılan sayılmaz. Toplam 4, yani 5'i aşmadığı için kriter sağlanır."}, {"q": "Piyasa yapıcılık faaliyeti aşağıdaki pazarların hangisinde yürütülemez?", "o": ["Yakın İzleme Pazarı", "Ana Pazar", "Alt Pazar", "Yapılandırılmış Ürünler ve Fon Pazarı", "Emtia Pazarı"], "a": 0, "e": "YİP ve PÖİP paylarında piyasa yapıcılık yapılamaz. Geçerli pazarlar Ana, Alt, YÜFP, GSP ve Emtia Pazarıdır."}, {"q": "Piyasa yapıcısı bulunmayan sermaye piyasası araçları için aşağıdaki eşleştirmelerden hangisi doğrudur?", "o": ["BYF – işlem sırası kapatılır", "Ana Pazar payı – tek fiyat yöntemine geçilir", "Varant – tek fiyat yöntemine geçilir", "Gayrimenkul yatırım fonu – işlem sırası kapatılır", "Varant – işlem sırası kapatılır"], "a": 4, "e": "BYF'de tek fiyata geçilir; varant ve sertifikada sıra kapatılır; Ana/Alt Pazar paylarında ve isteğe bağlı araçlarda işlem yöntemi değişmez."}, {"q": "Fiyatı 2,00 TL olan bir sermaye piyasası aracında piyasa yapıcının alış kotasyonu 2,00 TL ise girebileceği satış kotasyonu en fazla kaç TL olabilir?", "o": ["2,06", "2,10", "2,08", "2,02", "2,20"], "a": 2, "e": "1,01–2,50 TL aralığında maksimum yayılma 8 fiyat adımıdır; adım 0,01 TL olduğundan en fazla 2,00 + 0,08 = 2,08 TL."}, {"q": "Fiyatı 50,00 TL olan bir payda piyasa yapıcının alış kotasyonu 50,00 TL'dir. Maksimum kotasyon yayılma aralığına uygun en yüksek satış kotasyonu kaç TL'dir?", "o": ["50,10", "50,05", "51,00", "50,50", "50,25"], "a": 3, "e": "10,01 TL ve üzerindeki fiyatlarda maksimum yayılma fiyatın %1'idir: 50 × %1 = 0,50 TL; satış en fazla 50,50 TL olabilir."}, {"q": "Piyasa yapıcı kotasyonları ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Kotasyon miktarı alt sınırı 250 lottur", "Kotasyon miktarı azaltıldığında öncelik korunur", "Alış ve satış kotasyon fiyatları birbirine eşit olamaz", "Minimum kotasyon yayılma aralığı 1 fiyat adımıdır", "Kotasyonlar yalnızca limit fiyatlı emir olarak girilir"], "a": 1, "e": "Kotasyonlarda yapılan her değişiklik (miktar azaltma dâhil) iptal ve yeni giriş sayıldığından öncelik kaybedilir."}, {"q": "Piyasa yapıcının başarılı sayılması ve borsa payı indirimi ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Sürekli işlem süresinin %80'inde kotasyon yeterlidir; indirim %25'tir", "Yedek piyasa yapıcı da %50 indirimden yararlanır", "Sürekli işlem süresinin %90'ında geçerli kotasyon bulundurmalıdır; başarılı piyasa yapıcı kotasyon işlemlerinde %50 indirimli borsa payı öder", "Fiyat tavanda kilitliyken kotasyon olmaması başarısızlık sayılır", "İndirim günlük tahakkuk ettirilir"], "a": 2, "e": "Başarı için sürekli işlem süresinin %90'ında geçerli kotasyon gerekir; indirim %50'dir, aylık tahakkuk eder; yedek piyasa yapıcıya indirim yoktur."}, {"q": "Maksimum kotasyon yayılma aralığının iki katına çıkarılmasına ve tamamen serbest bırakılmasına yetkili merciler sırasıyla hangileridir?", "o": ["PPD Direktörü – Borsa Genel Müdürü", "Borsa Genel Müdürü – Yönetim Kurulu", "Yönetim Kurulu – SPK", "PPD Direktörü – Yönetim Kurulu", "Genel Müdür Yardımcısı – Borsa Genel Müdürü"], "a": 0, "e": "Piyasa yapıcının talebiyle yayılmayı iki katına çıkarmaya PPD Direktörü, sınırları kaldırmaya Borsa Genel Müdürü yetkilidir."}, {"q": "Piyasa yapıcılıktan kendi isteğiyle ayrılmak isteyen üye ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["En az 5 iş günü önce başvurmalı ve 6 ay yeniden başvuramaz", "Sözlü bildirim yeterlidir", "Ayrılma talebi aynı gün KAP'ta duyurulur ve hiçbir bekleme süresi yoktur", "Faaliyetin sona ereceği tarihten en az 2 iş günü önce yazılı başvurmalı ve 30 gün geçmeden aynı araca yeniden başvuramaz", "En az 1 ay önce başvurmalıdır"], "a": 3, "e": "Kendi isteğiyle ayrılmada en az 2 iş günü önce yazılı başvuru gerekir; 30 gün dolmadan aynı araca yeniden başvurulamaz. 6 ay kuralı yetersiz performansa aittir."}, {"q": "Likidite sağlayıcılık ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["BIST 30 Endeksi kapsamındaki paylarda uygulanamaz", "Fiyat istikrarını sağlamaya yönelik zorunlu bir faaliyettir", "Piyasa yapıcılık ile birlikte uygulanmaz", "Başlaması için şirketin yönetim kurulu kararı ve anlaşma gerekir", "Likidite sağlayıcının sürekli emir verme zorunluluğu yoktur"], "a": 1, "e": "Likidite sağlayıcılık isteğe bağlıdır, likiditeyi artırmaya yöneliktir ve fiyat istikrarı amacı taşımaz."}, {"q": "Özkaynakları 150 milyon TL olan bir yatırım kuruluşunun likidite sağlayıcılık yaptığı payların fiili dolaşımdaki piyasa değerleri toplamı en fazla ne kadar olabilir?", "o": ["1,5 milyar TL", "750 milyon TL", "300 milyon TL", "15 milyar TL", "3 milyar TL"], "a": 4, "e": "FDPD toplamı özkaynakların 20 katını geçemez: 150 milyon × 20 = 3 milyar TL."}, {"q": "Bir payın 6 aylık değerlendirme dönemindeki işlem hacmi 500 milyon TL'dir. Bu payda likidite sağlayıcının likidite sağlama işlemleri en fazla ne kadar olabilir?", "o": ["250 milyon TL", "400 milyon TL", "100 milyon TL", "450 milyon TL", "500 milyon TL"], "a": 1, "e": "Likidite sağlama işlemleri 6 aylık işlem hacminin %80'inden fazla olamaz: 500 × 0,80 = 400 milyon TL. Alt sınır yoktur."}, {"q": "Bir payda tutarı 80 milyon TL olan özel işlem bildirimi yapılacaktır. Son işlem fiyatı 40,00 TL ve günlük sınırlar 34,00 – 46,00 TL ise bildirim hangi fiyat aralığında yapılabilir?", "o": ["37,60 – 42,40", "34,00 – 46,00", "38,00 – 42,00", "36,00 – 44,00", "32,00 – 48,00"], "a": 3, "e": "80 milyon TL ikinci kademeye (50.000.001 – 250 milyon TL) girer; son işlem fiyatının ±%10'u 36,00 – 44,00 TL'dir ve günlük sınırlar içinde kalır."}, {"q": "Özel işlem bildirimine ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Birinci kademede asgari tutar 10 milyon TL, fiyat limiti ±%6'dır", "İkinci kademede azami tutar 500 milyon TL'dir", "Fiyat limitleri baz fiyat üzerinden hesaplanır", "Açılış seansında yapılabilir", "Varant sıralarında yapılamaz"], "a": 0, "e": "Birinci kademe 10–50 milyon TL ve ±%6, ikinci kademe 50.000.001–250 milyon TL ve ±%10'dur; limitler son işlem fiyatı üzerinden hesaplanır; varantlarda da yapılabilir; açılış ve kapanışta yapılamaz."}, {"q": "Pay bazında devre kesicinin tetikleme oranları Yıldız, Ana ve Alt Pazar için sırasıyla hangisidir?", "o": ["%20 – %15 – %10", "%10 – %5 – %2,5", "%7,5 – %5 – %2,5", "%6 – %6 – %6", "%10 – %7,5 – %5"], "a": 4, "e": "Devre kesici tetikleme oranları Yıldız'da %10, Ana'da %7,5, Alt Pazar'da %5'tir; YİP ve PÖİP'te devre kesici yoktur."}, {"q": "Ana Pazar'daki bir payda devre kesici referans fiyatı 40,00 TL'dir. Devre kesicinin çalışacağı fiyat limitleri hangisidir?", "o": ["36,00 – 44,00", "34,00 – 46,00", "37,00 – 43,00", "38,00 – 42,00", "38,80 – 41,20"], "a": 2, "e": "Ana Pazar'da tetikleme oranı %7,5'tir: 40 × 0,925 = 37,00 ve 40 × 1,075 = 43,00 TL."}, {"q": "Pay bazında devre kesici uygulaması ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Seansın tek fiyat bölümlerinde de çalışır", "Yalnızca paylarda uygulanır", "Referans fiyat, en son tek fiyatla belirlenen fiyat ile baz fiyattan en son güncellenendir", "Çalıştığı açığa satış sıralarında seans sonuna kadar yukarı adım kuralı uygulanır", "Payın sırasında çalıştığında bağlı rüçhan ve varant sıraları sürekli işleme devam eder"], "a": 0, "e": "Pay bazında devre kesici yalnız sürekli işlem bölümlerinde çalışır."}, {"q": "BIST 100 endeksinin önceki kapanışı 10.000 puandır. Endeks gün içinde hangi değere veya altına gerilediğinde endekse bağlı devre kesici sistemi devreye girer?", "o": ["9.800", "9.500", "9.000", "9.250", "9.400"], "a": 4, "e": "EBDKS endeksin önceki kapanışa göre %6 veya daha fazla düşmesiyle devreye girer: 10.000 × 0,94 = 9.400 puan. %2'lik düşüş (9.800) ise yukarı adım kuralını tetikler."}, {"q": "Endekse bağlı devre kesici sistemi devreye girdiğinde aşağıdakilerden hangisi doğrudur?", "o": ["Pay sıraları 20 dakika durdurulur ve bu sürede emir iptal edilebilir", "Tüm sıralar 10 dakika durdurulur", "Varant, sertifika, BYF ve rüçhan sıraları 20 dakika durdurulur", "Eşik gün içinde tekrar aşılırsa sistem ikinci kez çalışır", "Saat 18:00'den sonra da devreye girebilir"], "a": 2, "e": ".E, .F1, .F2, .G, .S1 sıraları 10 dakika (iptal ve değişiklik yapılamaz), .V, .C, .F, .R sıraları 20 dakika durdurulur. Sistem ikinci kez çalışmaz ve 18:00'den sonra devreye girmez."}, {"q": "Kredili işlem ve açığa satış listesi ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Alt Pazar payları listeye dâhildir", "Varantlarda açığa satış yapılabilir", "BYF'ler listede yer almaz", "Gayrimenkul sertifikalarında kredili alım yapılabilir, açığa satış yapılamaz", "Girişim sermayesi yatırım fonlarında kredili alım yapılabilir"], "a": 3, "e": "Liste Yıldız, Ana ve GSP payları ile BYF'leri kapsar. Varant, sertifika, SDKS, GMF, GSF ve EMS'de ikisi de yapılamaz; GMS'de yalnız kredili alım yapılabilir."}, {"q": "İşlem sırası geçici olarak durdurulan bir pay, kapalılığın kaç iş gününü aşması hâlinde kredili işlem ve açığa satış listesinden çıkarılır ve çıkarılan pay ne kadar süre geçici listede kalır?", "o": ["10 iş günü – 1 ay", "5 iş günü – izleyen üç aylık dönem sonuna kadar", "5 iş günü – 6 ay", "3 iş günü – izleyen üç aylık dönem sonuna kadar", "20 iş günü – 1 yıl"], "a": 1, "e": "Geçici durdurmada kapalılık 5 iş gününü aşarsa pay listeden çıkarılır; izleyen üç aylık dönemin sonuna kadar Geçici Listede kalır. Sürekli kapatılan paylar hemen çıkarılır."}, {"q": "Ana Pazar'daki bir payda son işlem fiyatı 25,40 TL, bir önceki işlem fiyatı 25,36 TL'dir. BIST 100 endeksi günlük bazda %1 düşüştedir. Bu payda girilebilecek en düşük açığa satış fiyatı kaç TL'dir?", "o": ["25,42", "25,36", "25,40", "25,38", "25,44"], "a": 2, "e": "Ana Pazar'da yukarı adım kuralı geçerlidir. Son fiyat bir önceki fiyattan yüksek olduğu için açığa satış son fiyattan, yani 25,40 TL'den yapılabilir."}, {"q": "Açığa satış işlemlerine ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Açılış seansında açığa satış emri girilebilir", "Yıldız Pazar'da yukarı adım kuralı uygulanmaz", "BIST 100 endeksi %2 veya daha fazla düşerse açığa satış sıralarında yukarı adım kuralı otomatik uygulanır", "Özel işlem bildirimi ile açığa satış yapılamaz", "Orta nokta emirleriyle açığa satış yapılamaz"], "a": 0, "e": "Açılış seanslarında açığa satış emri iletilemez; diğer tüm bölümlerde ve devre kesici emir toplamasında girilebilir."}, {"q": "Brüt takas uygulaması ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Brüt takasta alıcının takas günü hesabında nakit bulundurması gerekmez", "Brüt takas yatırım yapmayı engelleyen bir tedbirdir", "Likidite sağlayıcıların kotasyon dışı emirleri de muaftır", "Piyasa yapıcıların bildirdikleri hesaplarla kotasyon üzerinden yaptıkları işlemler netleştirilmeye devam eder", "Yıldız Pazar paylarında standart olarak uygulanır"], "a": 3, "e": "BT kapsamındaki paylarda piyasa yapıcı ve likidite sağlayıcıların bildirilmiş hesaplarla yaptığı kotasyon işlemleri netleştirilir; kotasyon dışı emirler muaf değildir. BT Alt Pazar, YİP ve PÖİP'te uygulanır."}, {"q": "Volatilite Bazlı Tedbir Sistemi'nde tedbirlerin seviyelere göre sıralaması hangisinde doğru verilmiştir?", "o": ["Brüt takas – açığa satış yasağı – tek fiyat – emir paketi – internet emir yasağı", "Açığa satış ve kredili işlem yasağı – brüt takas – emir paketi – tek fiyat – emir iletim kanallarının kısıtlanması", "Emir paketi – brüt takas – açığa satış yasağı – tek fiyat – internet emir yasağı", "Açığa satış yasağı – emir paketi – brüt takas – internet emir yasağı – tek fiyat", "Tek fiyat – brüt takas – emir paketi – açığa satış yasağı – internet emir yasağı"], "a": 1, "e": "Seviyeler: 1) açığa satış ve kredili işlem yasağı, 2) brüt takas, 3) emir paketi, 4) tek fiyat, 5) emir iletim kanallarının kısıtlanması. Her biri 1 ay sürer ve önceki tedbirler devam eder."}]}, {"id": 5, "kisa": "Borçlanma Araçları Piyasası", "baslik": "Borsa İstanbul Borçlanma Araçları Piyasası (BAP)", "ozet": "BAP'ın pazarları, işlem saatleri, valör ve emir büyüklüğü tabloları, öncelik kuralları, ISIN kodu ve repo pazarlarının karşılaştırması.", "notlar": "<h3>Kuruluş ve pazarlar<\/h3>\n<p>BAP, sabit getirili menkul kıymetlerin şeffaf ve rekabetçi ortamda işlem görmesi, likiditenin artması ve bilgi akışının hızlanması için kuruldu. İlk pazar Kesin Alım Satım Pazarı'dır.<\/p>\n<table><tr><th>Pazar<\/th><th>Faaliyete geçiş<\/th><\/tr>\n<tr><td>Kesin Alım Satım Pazarı<\/td><td><b>17 Haziran 1991<\/b> (BAP'ın başlangıcı)<\/td><\/tr>\n<tr><td>Repo Ters Repo Pazarı<\/td><td>17 Şubat 1993<\/td><\/tr>\n<tr><td>Uluslararası Tahvil Pazarı (Eurotahvil)<\/td><td>16 Nisan 2007'de kuruldu, 13 Eylül 2013'te BAP'a dahil edildi<\/td><\/tr>\n<tr><td>Nitelikli Yatırımcıya İhraç Pazarı<\/td><td>17 Mayıs 2010<\/td><\/tr>\n<tr><td>Menkul Kıymet Tercihli Repo Pazarı<\/td><td>17 Aralık 2010<\/td><\/tr>\n<tr><td>Pay Senedi Repo Pazarı<\/td><td>7 Aralık 2012<\/td><\/tr>\n<tr><td>Gözaltı Pazarı<\/td><td>1 Aralık 2017<\/td><\/tr>\n<tr><td>Taahhütlü İşlemler Pazarı<\/td><td>2 Temmuz 2018<\/td><\/tr>\n<tr><td>Borsa İstanbul Para Piyasası<\/td><td>14 Ekim 2016<\/td><\/tr>\n<tr><td>Swap Piyasası: Para Swap / Kıymetli Madenler Swap<\/td><td>1 Ekim 2018 / 16 Kasım 2020<\/td><\/tr>\n<\/table>\n\n<h3>Temel kavramlar<\/h3>\n<ul>\n<li><b>Fiyat:<\/b> 100 birim nominal için verilen değer. Hazine'nin <b>altın tahvili ve altına dayalı kira sertifikalarında<\/b> 1000/1000 saflıkta <b>1 gram altını<\/b> temsil eden 1 nominal için verilen değer. Emir giriş yöntemine göre temiz, kirli veya takas fiyatı adını alır.<\/li>\n<li><b>İşlemiş faiz / birikmiş kira:<\/b> İlk kupon döneminde ihraç tarihinden, sonraki dönemlerde son kupon ödeme tarihinden valör tarihine kadar geçen gün sayısına (GGS) düşen tutar. Formül: dönemsel kupon × (GGS / kupon dönemindeki gün sayısı) × 100.<\/li>\n<li><b>Temiz fiyat<\/b> işlemiş faizi içermez; <b>kirli fiyat<\/b> içerir. <b>Takas fiyatı<\/b> takas tutarını hesaplamada kullanılır; enflasyona endeksli devlet tahvillerinde enflasyon katkısı eklenir, diğerlerinde kirli fiyata eşittir.<\/li>\n<li><b>İhraç değeri:<\/b> Nominalin altındaysa iskontolu, üstündeyse primli, eşitse başabaş satış.<\/li>\n<li><b>Repo:<\/b> geri alma taahhüdüyle satım; <b>ters repo:<\/b> geri satma taahhüdüyle alım. <b>V1<\/b> başlangıç, <b>V2<\/b> bitiş valörü
