acağız. Bu bölüm sayı dolu, o yüzden sana tablo gibi düşünmeyi öğreteceğim.", "Önce tarihçe. Piyasa 17 Haziran 1991'de Kesin Alım Satım Pazarı ile başladı. Repo Ters Repo Pazarı 1993'te geldi. Sonra 2000 onda Nitelikli Yatırımcıya İhraç ve Menkul Kıymet Tercihli Repo, 2012'de Pay Senedi Repo açıldı. Gözaltı Pazarı 2017'de, Taahhütlü İşlemler Pazarı 2018'de geldi. Sınavda ilk pazar hangisi diye sorarlarsa cevap Kesin Alım Satım.", "Birkaç kavramı netleştirelim. Fiyat, 100 birim nominal için verilen değerdir. Ama Hazine'nin altın tahvillerinde bir nominal, bir gram saf altını temsil eder. Temiz fiyat işlemiş faizi içermez, kirli fiyat içerir. İşlemiş faizi bulmak için dönemsel kuponu al, geçen gün sayısını dönemdeki gün sayısına böl ve çarp. Mesela %6 kupon, 182 günlük dönem, 91 gün geçmişse işlemiş faiz üç olur.", "Araç tanımlarında vade sınırları çok soruluyor. Devlet tahvili bir yıl ve daha uzun, hazine bonosu bir yıldan kısa. Özel sektör tahvili 365 gün ve üstü. Finansman bonosu 30 gün ile 364 gün arası. Merkez Bankası likidite senetleri iskontolu ve en fazla 91 gün vadeli. Bunları karıştırma.", "Şimdi saatler. Piyasa hafta içi 9,5 ile 17,5 arasında açık. Aynı gün valörlü işlemler 14'te biter. Bunun tek istisnası yatırım fonları, onlar 17 buçuğa kadar aynı gün valörlü işlem yapabilir. Yatırım ortaklıkları ise yapamaz, burada dur bir saniye, çünkü bu ikisini sınavda yan yana koyuyorlar. Pay Senedi Repo Pazarı da 9,5'ta değil, onda açılıyor.", "Bir de sabah yarım saati var. Dokuz ile 9,5 arasında sadece Merkez Bankası emir girebilir. Bu, açık piyasa işlemleri için ve yalnız Repo Ters Repo ile Taahhütlü İşlemler pazarlarında geçerli. Uluslararası Tahvil Pazarı'nda ise aynı gün valörlü emir hiç girilemiyor.", "Valör tablosuna geçelim. Kesin Alım Satım'da devlet borçlanma senetleri için en fazla 90 takvim günü, özel sektör araçları için 30 gün, altın tahvilleri için yedi gün. Repo pazarlarında başlangıç valörü en fazla yedi gün ileri olabilir. Pay Senedi Repo'da ise iki iş günü. Uluslararası Tahvil Pazarı'nda en az bir iş günü, en fazla 15 gün. Repo işlemlerinin bitişi ise en fazla bir yıl sonra olabilir.", "Emir büyüklüklerinde 3 rakamı ezberle. Kesin Alım Satım'da Türk lirası devlet borçlanma senetleri için normal emirler 1.000.000 ile 100.000.000 arası. Küçük emirler 10.000 ile 990.000 arası. Repo Ters Repo'da normal emirlerin tavanı 400.000.000'a çıkıyor. Nitelikli Yatırımcıya İhraç Pazarı'nda en küçük emir 50.000 lira. Diğer repo pazarlarında ve Gözaltı'nda 10.000 ile 100.000.000.", "Öncelik kuralı basit bir mantığa dayanıyor. Alan en yüksek fiyatı veren, satan en düşük fiyatı isteyen öne geçer. Repoda para alan taraf en yüksek oranı teklif ederse öne geçer. Ters repoda yani parayı veren tarafta en düşük oran öne geçer. Fiyat eşit değilse işlem, sistemde önce bekleyen emrin fiyatından olur. Menkul Kıymet Tercihli Repo'da oran eşitse bir de menkul kıymet fiyatına bakılır.", "Emir tiplerinde şuna dikkat et. Piyasa emri sadece miktarla girilir, kalan kısmı iptal olur ve tek fiyat seansında girilemez. Dengeleyici emir ise tam tersine tek fiyat yönteminde kullanılır. Gerçekleşmezse iptal et koşulu limitli ya da piyasa emriyle verilir, dengeleyiciyle verilmez. Bir de emrin miktarını azaltırsan sıranı kaybetmezsin, ama fiyatı değiştirirsen ya da miktarı artırırsan kaybedersin.", "Kesin Alım Satım'daki tek fiyat seansı 22 ile 42 arasında. İlk 15 dakika emir toplanır, son beş dakika eşleştirilir. Denge fiyatı en çok işlemi yapan fiyattır. Eşitlik varsa en az emri açıkta bırakan seçilir. Hâlâ eşitlik varsa alıcılar fazlaysa yüksek fiyat, satıcılar fazlaysa düşük fiyat, denge varsa ortalama alınır.", "Piyasa yapıcılığı sadece Kesin Alım Satım Pazarı'nda var ve iki ayrı sistem bulunuyor. Devlet borçlanma senetlerinde kuralları ve piyasa yapıcılarını Hazine belirliyor. Özel sektör araçlarında ise başvuruyu Borsa Genel Müdürlüğü değerlendiriyor. Özel sektörde piyasa yapıcı beş işlem günü önceden bildirerek çekilebilir. Emri gerçekleşirse 10 dakika içinde yenisini girmek zorunda.", "ISIN kodu 12 hanedir, ilk iki hane TR, son hane kontrol hanesi. Hazine kodunda üçüncü hane türü verir, T tahvil, B bono, D kira sertifikası. Sonraki altı hane itfa tarihi. 10'uncu hane Türk lirası için T tümü, A anapara, K kupon demek. Döviz için bu harfler F, P ve C. Özel sektör kodunda ise sekizinci hane ayı verir, Ekim E, Kasım K, Aralık A.", "Repo pazarlarını kıyaslayalım. Repo Ters Repo'da parayı veren taraf hangi tahvili alacağını işlemden sonra öğrenir, emirde sadece grup kodu vardır. S Türk lirası, K döviz ödemeli. Repocu en fazla beş farklı kıymet bildirebilir. Menkul Kıymet Tercihli Repo'da ise kıymeti ve fiyatını baştan seçersin, özel sektör tahvili de kullanabilirsin. Pay Senedi Repo'da teminat, BIST 50 içindeki paylardır ve fiyat pay piyasasındaki son işlem fiyatıdır.", "Kalan pazarlar. Nitelikli Yatırımcıya İhraç Pazarı birincil ihracın yapıldığı tek pazar. Satış en fazla 10 iş günü sürer. İhraç bitince ertesi iş günü Kesin Alım Satım'da ama sadece nitelikli yatırımcılar arasında işlem görür. Gözaltı Pazarı'na, ana parasını ödeyemeyip yatırımcılarının en az üçte ikisinin onayıyla yapılandırılan tahviller alınır ve bir daha geri dönmez. Taahhütlü İşlemler Pazarı'nda ise Takasbank vadede sebep göstermeden işlemden vazgeçebilir.", "Toparlayalım. Birincisi, aynı gün valörlü işlemler 14'te biter, sadece yatırım fonları 17 buçuğa kadar devam eder. İkincisi, valörde 90, 30, yedi ve iki iş günü sayılarını pazarlarıyla eşleştir. Üçüncüsü, repoda yüksek oran, ters repoda düşük oran öne geçer. Dördüncüsü, Repo Ters Repo'da teminat sonradan bildirilir, Menkul Kıymet Tercihli Repo'da baştan seçilir. Beşincisi, Gözaltı'na giren tahvil geri dönmez. Bir sonraki bölümde Borsa İstanbul para ve swap piyasalarına geçiyoruz."], "6": ["Merhaba, bu bölümde Borsa İstanbul'un iki küçük ama sınavda sevilen piyasasını konuşacağız. Önce para piyasası, sonra swap piyasası. İkisinde de birkaç saat ve sınır var, onları birbirinden ayırmayı öğreneceğiz.", "Para piyasası 2016 Ekim ayında, borçlanma araçları piyasası çatısı altında açıldı. Burada bankalar ve aracı kurumlar Türk lirası borç alıp veriyor ama teminatlı olarak. Yani bir banka akşam elinde fazla para varsa onu buraya koyar, ihtiyacı olan aracı kurum da teminat göstererek alır.", "Bu piyasanın kilit oyuncusu Takasbank. Takasbank hem burada işlem yapabilen bir kurum, hem de merkezi karşı taraf. Yani alıcıya karşı satıcı, satıcıya karşı alıcı gibi davranıp takası garanti ediyor. Sınavda Takasbank işlem yapamaz diye bir şık görürsen, bu yanlış.", "Saatlere bakalım. Piyasa 9,5 ile 17,5 arası açık. Ama aynı gün başlayan işlemler 15'e kadar yapılabiliyor. Burada dur bir saniye, çünkü borçlanma araçlarında ve swapta bu saat 14. Para piyasasında ise 15. Bunu sınavda tuzak olarak çok kullanıyorlar.", "Valörde para piyasası aynı gün ya da bir iş günü ileri başlayabilir. Bitiş valörünü taraflar serbestçe seçer, ama en fazla iki yıl. Emirler en az 100.000 lira, en fazla 100.000.000 lira. Faiz adımı %0,01. Gerçekleşmeyen emirler 17,5'ta silinir, ertesi güne bir şey kalmaz.", "Öncelik kuralı da tanıdık. Alım emirlerinde en yüksek faiz, satım emirlerinde en düşük faiz öne geçer. Faiz eşitse önce gelen kazanır. Oranlar farklıyken eşleşme olursa, sistemde önce bekleyen emrin oranı işlem oranı olur. Takas, teminat ve temerrüt kurallarını ise Takasbank belirler.", "Şimdi swap piyasasına geçelim. Amacı, paraların birbiriyle ya da kıymetli madenlerle belli bir süre için değiştirilmesi. Şöyle düşün, bir banka bugün dolar verip lira alıyor, vade gelince işlemi tersine çeviriyor. Vade sonundaki kur da swap puanıyla belirleniyor. Swap puanı, iki para arasındaki faiz farkını yansıtan değer.", "Kimler işlem yapabilir? Bankalar, aracı kurumlar ve Merkez Bankası. Ama aracı kurumlar sadece kıymetli madenler swap pazarında işlem yapabiliyor, para swapına giremiyor. Yetkisi olmayan kıymetli maden aracı kuruluşları da ancak bir banka ya da aracı kurumun müşterisi olarak işlem yapabiliyor.", "Swapın bir farkı daha var. Burada işlem gerçekleşse bile sana karşı tarafın kim olduğu söylenmiyor. Borçlanma araçları piyasasında ve para piyasasında işlemden sonra karşı üyeyi öğreniyordun. Swapta öğrenemiyorsun. Bu da güzel bir sınav sorusu.", "Swapın saatlerinde aynı gün başlayan işlemler 14'te bitiyor, ileri başlayanlar 17,5'ta. Sabah dokuz ile 9,5 arası yine sadece Merkez Bankası emir girebiliyor. Başlangıç aynı gün ya da bir iş günü ileri olabilir. Başlangıç ile bitiş arasında en fazla 365 gün olabilir.", "Emir tipleri limitli emir ve piyasa emri. Limitli emirde para swapı için döviz miktarı, swap puanı ve kur yazıyorsun. Piyasa emrinde sadece miktarı yazıyorsun, kalan kısım iptal oluyor. Bunlara kalanı iptal et ya da gerçekleşmezse iptal et koşulu eklenebiliyor.", "Para swap pazarı 2018 Ekim ayında kuruldu. Türk lirasına karşı dolar ve euro işlem görüyor. Emirler 1.000.000 dolar ya da euro ve katları şeklinde giriliyor. Tek seferde en fazla 300.000.000. Swap puanı adımı 0,01, kur adımı 0,0001.", "Para swapında önceliği şöyle hatırla. Döviz satan swapçı için önce en yüksek swap puanı, sonra en düşük kur öne geçer. Döviz alan swapçı için tam tersi, en düşük swap puanı ve en yüksek kur. Bir de kur sınırı var. Girilen kur, Merkez Bankası alış ve satış kurlarının ortalamasından %15'ten fazla sapamaz. Mesela ortalama 32,10 ise alt sınır yaklaşık 27,28 olur.", "Kıymetli madenler swap pazarı 2020 Kasım ayında kuruldu. Burada altın ile lira, dolar ya da euro değiştiriliyor. İşleme konu olan, Londra Külçe Piyasası Birliğinin onaylı listesindeki rafinerilerin ürettiği, binde 995 saflıkta bir kilobar altın. Emirler bir kilobar ve katları, tek seferde en fazla 100 kilobar.", "Maden swapında adımlar hem swap puanı hem fiyat için 0,01. Fiyat sınırı yine %15. Ama bu kez baz alınan fiyat Merkez Bankası kuru değil, Borsa İstanbul kıymetli madenler piyasasının ağırlıklı ortalama fiyatı. Bu ayrımı mutlaka not et.", "İptal kuralları borçlanma araçları piyasasıyla aynı mantıkta. Üye hatası tek başına iptal sebebi değil. Alım yerine satım girmek ya da kur, miktar, valör gibi bir alanda maddi hata yapmak kabul edilen gerekçeler. Karşı taraf da onay verirse Borsa iptal eder ve bunu Kamuyu Aydınlatma Platformu, yani KAP üzerinden duyurur. Hatalı emirlerin düzeltme esaslarını ise Takasbank belirler.", "Toparlayalım. Birincisi, para piyasasında aynı gün işlemleri 15'e kadar, swapta 10 dörde kadar. İkincisi, para piyasasında bitiş en fazla iki yıl, swapta en fazla 365 gün. Üçüncüsü, aracı kurumlar sadece kıymetli madenler swapında işlem yapar. Dördüncüsü, para swapında emir 1.000.000 ve katları, tavan 300.000.000, maden swapında bir kilobar ve tavan 100 kilobar. Beşincisi, swapta karşı taraf bilgisi verilmez."], "7": ["Merhaba, bu bölümde Borsa İstanbul Vadeli İşlem ve Opsiyon Piyasası, yani VİOP var. Seans saatlerinden hatalı işlem iptaline, emir türlerinden komitelere kadar uzun bir yol yürüyeceğiz. Bu bölümde rakamlar çok, o yüzden sana küçük hafıza kancaları vereceğim.", "Önce iki tanım. Vadeli işlem sözleşmesi iki tarafa da yükümlülük verir. Opsiyonda ise alan taraf prim öder ve hak kazanır, satan taraf primi alır ve yükümlülük altına girer. Sınavda opsiyon alıcısı için yükümlülük kelimesini görürsen dikkat et, bu yanlış.", "Bir günü baştan sona düşün. Sabah 7,5'ta sistem açılır ama emir girilemez, buna işlem yapılmayan dönem denir. 29'de açılış seansında emirler toplanır. 34'ten sonraki 30 saniye içinde rastgele bir anda toplama biter ve tek fiyatla eşleştirme yapılır. 9,5'ta normal seans başlar ve 18 ona kadar sürer.", "Akşam seansı 19 ile 23 arasında. Burada yapılan işlemler ertesi günün normal seansına sayılıyor. Akşam seansında endeks vadelileri ile altın, gümüş, platin, paladyum ve bakır vadelileri işlem görüyor. Takvim yılının son işlem gününde ise akşam seansı yapılmıyor. Bunu sınavda çok soruyorlar.", "Özel işlem bildirimini de bil. Büyük emirler emir defterine girmeden bildirimle işleme dönüştürülüyor. Bu sadece normal seansta yapılabiliyor. Taraflar farklı üyelerse tek taraflı, aynı üye hem alıcı hem satıcıysa çift taraflı bildirim kullanılıyor. Fiyat istatistikleri ayrı yayımlanıyor ama hacme dahil ediliyor.", "Durdurma kurallarına geçelim. Genel Müdür piyasayı ya da bir pazarı beş işlem gününe kadar kapatabilir. Bir yatırım aracındaki işlemleri ise en fazla bir ay durdurabilir, daha uzunu için Yönetim Kurulu gerekir. Devre kesici tetiklenirse pay ve endeks türevleri 20 dakika durur. 17,5'tan sonra tetiklenirse işlemler 26'de yeniden başlar. Üç ay boyunca işlem ya da açık pozisyon olmayan sözleşme sonlandırılabilir.", "Hatalı işlem iptali çok soru çıkan bir konu. Başvuru işlemden sonra 30 dakika içinde yapılır. Tam günde son başvuru saati 48. İptal edilebilmesi için fiyatın referanstan yeterince sapmış olması gerekir. BIST 30 ve pay vadelilerinde %5, dövizde %3, diğer vadelilerde %4, opsiyonlarda primin %50'si. Yani referans 100 ise BIST 30 vadelisinde 105'in üstü ya da 95'in altı gerekir.", "Bir de asgari zarar şartı var. 17,5'tan önce başvurursan zarar en az 200.000 lira olmalı. 17,5 ve sonrasında başvurursan eşik 800.000 liraya çıkıyor. Akşam seansı işlemleri için yine 200.000 lira. Akşam seansı talepleri sadece elektronik postayla gönderiliyor ve ertesi normal seansta değerlendiriliyor.", "Erişim protokolleri dört tane. İşlem terminalleri, FixAPI, OUCH ve ITCH. OUCH en hızlı emir iletim kanalı ve bunu kullanan herkes yüksek frekanslı işlemci sayılıyor. ITCH ise hızlı veri yayını için. Algoritmayla emir gönderen üye Borsa'ya taahhütname veriyor ve algoritmasından devredilemez şekilde sorumlu oluyor.", "Emir yöntemlerinde bir tuzak var. Kitapta piyasa emri anlatılıyor, ama dipnotta 2021 Mart ayından beri bu yöntemin kullanılmasına izin verilmediği yazıyor. Piyasadan limite emir ise fiyatsız girilir, sadece en iyi kademeyle eşleşir, kalanı son işlem fiyatıyla limit emre dönüşür. Karşıda emir yoksa hemen iptal olur.", "Geçerlilik sürelerine bakalım. Gün emri gün sonunda silinir. İptale kadar geçerli emir en geç vade sonunda silinir. Tarihli emirde vade sonundan ileri bir tarih giremezsin. Gerçekleşmezse iptal et tamamı ya da hiçbiri demek, kalanı iptal et ise olanı yap, kalanı sil demek. Açılış seansında yalnız limit emir girebilirsin ve gerçekleşmezse iptal et kullanılamaz.", "Emir düzeltmede kural basit. Emri kötüleştirmeyen, yani miktarı ya da süreyi azaltan değişiklik sıranı korur. Fiyatı değiştirirsen, miktarı artırırsan sıranı kaybedersin. Hesap numarasını ise hiç değiştiremezsin. Emri askıya alırsan sistem bunu iptal gibi görür ve tekrar aktifleştirdiğinde emir yeni numara alıp sona geçer.", "İradi emir iptal ücretini bir örnekle düşün. Bir aracı kurum ay içinde 200.000.000 liralık işlem yapmış, 130.000.000 liralık emir iptal etmiş. Hacmin yarısı 100.000.000 eder. Aşan 30.000.000 lira ücrete konu olur. Döviz, altın, gümüş, platin, paladyum ve bakır sözleşmelerindeki iptaller ve strateji emirleri bu hesaba girmez.", "Komitelere gelelim. Uzlaşma Fiyatı Komitesi ve Özsermaye Halleri Komitesi var. İkisi de beş asil, yedi yedek üyeli ve görev süresi iki yıl. Farkı üye dağılımında. Uzlaşma Fiyatı Komitesinde üç VİOP, bir pay piyasası, bir denetim ve gözetim üyesi var. Özsermaye Halleri Komitesinde iki VİOP, iki endeks, bir pay piyasası üyesi var. Eşitlikte başkanın oyu belirleyici ve kimse başkası adına oy kullanamaz.", "Piyasa yapıcılığında sayılar şöyle. Başvuru, başlanacak ayın ilk iş gününden en az 10 iş günü önce yapılır. Onaydan sonra üç ay içinde faaliyete başlamazsan programdan çıkarsın. Performans altı aylık dönemlerde ölçülür ve en az üç ayda şartı sağlaman yeter. Program kuralları bir ay önceden duyurularak değişir, programın kendisi ise üç ay önceden haber verilerek sonlandırılır. Geçici ayrılma en fazla bir yıl.", "Özsermaye uyarlamasında amaç, paydaki değişimi sözleşmeye adil yansıtmak. Açık pozisyon sayısı değişmez, ama sözleşme yeni koduyla standart olmayan hale gelir. Düzeltme katsayısı yedi basamağa yuvarlanır. Ve şunu unutma, nakit temettüde uyarlama yapılmaz. Temettü pay olarak dağıtılırsa bedelsiz formülü kullanılır.", "Olağanüstü durumlarda karar Genel Müdür'de. Üyelerin dörtte birinden fazlası sisteme giremezse ya da giremeyen en az beş üye toplam hacmin yarısını oluşturuyorsa seans başlatılmayabilir. Normal seans, bitişten 15 dakika öncesine kadar başlatılamazsa o gün açılmaz. Akşam seansında bu süre bir saat. Günlük fiyat limitini ise Genel Müdür Yardımcısı ya da Piyasa Müdürü iki katına kadar artırabilir.", "Toparlayalım. Birincisi, normal seans 29 ile 28 arası, akşam seansı 19 ile 23 arası. İkincisi, hatalı işlem iptali için 30 dakika ve %5, üç, dört, 50 sınırları. Üçüncüsü, asgari zarar 200.000, 17,5'tan sonra 800.000 lira. Dördüncüsü, iki komite de beş asil yedi yedek iki yıl, dağılımları farklı. Beşincisi, iradi emir iptalinde %50 eşiği ve nakit temettüde uyarlama olmaması."], "8": ["Merhaba, bu bölümde kıymetli madenler ve kıymetli taşlar piyasasını konuşacağız. Altının borsaya nasıl geldiğini, piyasanın saatlerini, saflık derecelerini ve ödünç piyasasını sırayla anlatacağım.", "Hikâye 1993'te başlıyor. O yıl Türk parasını koruma kararında yapılan değişikliklerle altının fiyatı, ithalatı ve ihracatı serbest bırakıldı. Ardından İstanbul Altın Borsası 1995 Temmuz ayında açıldı. Alım satım, takas ve kasa saklamayı birlikte sunan dünyanın ilk spot altın borsasıydı. 2013 Nisan ayında da Borsa İstanbul kurulunca bu işler onun bünyesine geçti.", "Borsa'nın burada mevzuattan gelen görevleri var, sınavda bunlar soruluyor. Bir kuyumcu toptancısı külçe altın ithal ettiyse, bunu üç iş günü içinde Borsa'ya teslim etmek ve Borsa'da satmak zorunda. Yurt içinde madenden çıkan dore bar ise rafineriden çıktıktan sonra yedi iş günü içinde Borsa kasasına giriyor. Üç ve yediyi karıştırma. İthalat üç, cevher yedi.", "Birkaç görev daha. Bankaların Merkez Bankası'na zorunlu karşılık olarak tuttuğu altınlar Borsa İstanbul kasasında, Merkez Bankası hesabı altında saklanıyor. Fonların altınları da burada saklanıyor ve burada alınıp satılıyor. Ham elmasta ise Kimberley Süreci denen uluslararası sertifika sisteminde Türkiye'nin ithalat ve ihracat otoritesi Borsa İstanbul.", "Borsa'da üç piyasa var. Kıymetli madenler piyasası, ödünç piyasası ve elmas ile kıymetli taş piyasası. Kıymetli madenler piyasasında altın, gümüş, platin ve paladyum, aynı günden 120 gün sonrasına kadar valörle işlem görüyor. Bireysel yatırımcı da üyeler aracılığıyla alıp satabiliyor ve madenini, Borsa'dan almamış olsa bile, Borsa kasasında saklatabiliyor.", "İşlem yöntemine gelelim. Esas yöntem sürekli işlem, yani fiyat ve zaman önceliğiyle çok fiyat. Bir de günde bir kez tek fiyat seansı var. Saat 14'te başlıyor, 10 dakika emir toplanıyor, beş dakika fiyat belirleniyor, 29'te bitiyor. Burada sadece standart bir kiloluk altın, aynı gün takas ve dolar başına ons fiyatıyla emir girilebiliyor.", "Spot piyasa sabah sekizde açılıyor ve 16'ya kadar sürüyor. 10 dakikalık bir gün sonu arasından sonra 16 ondan 68'e kadar devam ediyor. Takasın son saati 17. Erken takas dokuz ile 60 arasında yapılabiliyor. Hafta sonu ve resmi tatillerde takas yok.", "Fiyat birimlerinde Türk lirası için kilogram ve gram, dolar ve euro için ons kullanılıyor. Bir kilogram 32,15 ons, bir ons da 31,10 gram kadar. Mesela ons 2000 dolarsa bir kilo altın yaklaşık 64.300 dolar eder. Fiyat adımı altında ons başına beş cent, kilo başına bir lira. Gümüşte ons başına bir cent, kilo başına 10 kuruş.", "Saflık dereceleri sınavın favorisi. Standart altın en az binde 995. Standart gümüş en az %99,9. Platin ve paladyum en az %99,95. Bunun altındakiler standart dışı sayılıyor ve bunlar için Darphane'den ayar raporu almak gerekiyor. Ayar raporuna uygunluktan da madeni kasaya teslim eden üye sorumlu.", "Emirlerde dikkat etmen gereken birkaç şey var. Hesap tipi portföy, müşteri ya da fon olabiliyor. Emrin fiyatını değiştirirsen ya da miktarını artırırsan sistem onu yeni emir gibi görüyor ve sıranı kaybediyorsun. Fiksing emirleri Londra'daki sabah fiksing fiyatına bağlı ve sadece dolarla veriliyor. İşlem raporunda ise karşı üyeyi kendin seçiyorsun ve öncelik kuralı uygulanmıyor.", "Borsa dışında yapılan işlemler de unutulmuyor. Üyeler Borsa dışında yaptıkları altın alım satımlarını beş iş günü içinde sisteme bildirmek zorunda. Bu işlemler de Borsa işlemi sayılıyor ve komisyon ödeniyor. Bildirmezsen cezai komisyon ve gecikme faizi geliyor. İthalatta ise gümrük beyannamesi kapanmadan en az bir iş günü önce Tek Pencere Sistemi üzerinden bildirim yapılıyor.", "Şimdi ödünç piyasası. 2000 yılı Mart ayında kuruldu. Amacı, altını olanla altına ihtiyacı olanı buluşturmak ve kuyumcuya ucuz finansman sağlamak. Şöyle düşün, bir banka kasasındaki altını bir kuyumcu üreticisine faizle ödünç veriyor. Vade sonunda kuyumcu altını faiziyle geri veriyor ya da parasını ödüyor. Burada fiyat dediğimiz şey aslında faiz oranı.", "Ödünç piyasasının sayıları şöyle. Seans 10 ile 16 arası kesintisiz. İşlemler sadece aynı gün valörlü. En küçük işlem beş kilo, sonra birer kilo artıyor. Vade bir aya kadar her iş günü, sonrası aylık olarak 365 güne kadar. Emirler sadece limit emir, ama blok ya da bölünebilir olabiliyor. Bir de şu tuzak var, ithal edilen ya da madenden yeni gelen altın, piyasada bir kez alınıp satılmadan ödünce konu olamıyor.", "Takasta görev paylaşımı var. Altının takasını Borsa, paranın takasını Takasbank yapıyor. Teminatta ise ödünç alan, net teminatının %90'ı kadar işlem yapabiliyor. İşlem tutarı teminatın %90 yedisine ulaşırsa tamamlama çağrısı geliyor. Devlet tahvilleri ve kira sertifikaları teminata %90 değerle sayılıyor.", "Toparlayalım. Birincisi, ithal altın üç iş günü, cevher altını yedi iş günü içinde Borsa'ya gelir. İkincisi, tek fiyat 14'te başlar ve sadece bir kiloluk altın, aynı gün takas ve dolar ons fiyatıyla çalışır. Üçüncüsü, saflıklar binde 995, %99,9 ve %99,95. Dördüncüsü, Borsa dışı işlemler beş iş günü içinde bildirilir. Beşincisi, ödünç piyasasında beş kilo, aynı gün valör ve %90 ile %97 teminat eşikleri."], "9": ["Merhaba, bu bölümde tezgahüstü piyasaları konuşacağız. İngilizcede over the counter deniyor. Önce organize borsalarla farkını, sonra dünyadaki örnekleri, en sonda da Türkiye'deki kuralları anlatacağım.", "Şöyle düşün. Borsa İstanbul bir pazar yeri gibi. Kurallar yazılı, herkes aynı ekrana bakıyor, takas kurumu da işlemi garanti ediyor. Tezgahüstü piyasada ise merkezi bir yer yok. İki banka telefonla anlaşıyor, sözleşmenin şartlarını kendileri belirliyor. Kurallar esnek, ama güvenlik daha az.", "Bu esnekliğin bedelleri var. En önemlisi karşı taraf riski. Borsada takas kurumu olduğu için karşındaki kim olursa olsun paranı alırsın. Tezgahüstünde ise karşı taraf ödemezse zarara uğrarsın. Bunu sınavda çok soruyorlar. Organize borsada karşı taraf riski yok, tezgahüstünde var.", "Diğer farklara bakalım. Tezgahüstünde kotasyon şartı yok, küçük şirketler de burada işlem görebiliyor. Şeffaflık düşük, fiyatları sadece taraflar biliyor. Aracı sayısı fazla olduğu için rekabet var ve aracılık maliyeti daha düşük. Likiditeyi yatırımcı emirleri değil, aracıların kendi portföyünden yaptığı alım satımlar sağlıyor.", "Bir ince nokta daha. Tezgahüstü piyasalarda işlem hacmi yüksek. Çünkü işlemler tek seferde ve büyük tutarlarda yapılıyor. Ama aynı sebepten likidite düşük ve alış satış farkı yüksek. Yani yüksek hacim ile düşük likidite bir arada. Bu yüzden bu piyasalar bireyden çok kurumsal yatırımcıya hitap ediyor.", "Dünyaya bakarsak türevlerde tezgahüstü hacim borsaları çoktan geçmiş durumda. Dünyadaki türev hacminin neredeyse tamamı tezgahüstü. En çok faiz türevleri işlem görüyor, sonra döviz türevleri, kredi temerrüt swapları ve hisse türevleri geliyor. Pay tarafında ise tezgahüstü işlemlerin çoğu Amerika'da, bülten tahtası ve pembe sayfalar denen piyasalarda. Nasdaq da elektronik kotasyon piyasası olarak başladı, sonra borsaya dönüştü.", "Türevlerin neden yaygınlaştığını da bil. 1971'de Bretton Woods sistemi terk edildi, sabit kurdan dalgalı kura geçildi. Aynı dönemde petrol krizi yaşandı. Böylece risk yönetimi önem kazandı ve döviz ile faiz üzerine vadeli sözleşmeler yayıldı.", "Ürünlere geçelim. Forward sözleşme, iki tarafın kendi şartlarıyla yaptığı ileri tarihli alım satım. Garantör yok, kredi riski var. Taraflar dışında kimse bilmediği için fiyat referansı da olmuyor ve devretmek pratikte neredeyse imkânsız. Tek istisna faiz oranı anlaşmaları. Bunlar belli şartlarla ikinci elde satılabiliyor.", "Opsiyonlarda şunu bil. Faize dayalı opsiyonlar genellikle tezgahüstünde, diğerleri hem tezgahüstünde hem borsada işlem görüyor. Swap ise gelecekteki nakit akışlarının değiştirilmesi. Para, mal ve faiz swapları var. Faiz swapları tezgahüstü piyasanın en çok işlem gören ürünü.", "2008 krizi her şeyi değiştirdi. Krizin karmaşık türevlerden çıktığı düşünüldü. Amerika'da Dodd Frank Yasası, Avrupa'da EMIR, ayrıca Basel üç ve G 20 kararları geldi. Üç başlık öne çıktı. Birincisi, tüm işlemlerin veri depolama kuruluşlarına raporlanması. İkincisi, merkezi karşı taraf kullanmayanlara daha yüksek sermaye ve teminat şartı. Üçüncüsü, faiz swapları gibi ürünlerde zorunlu merkezi takas.", "Türkiye'ye gelelim. En derin tezgahüstü piyasalarımız bankalararası TL, döviz, tahvil ve repo piyasaları. Bankalararası TL ve döviz işlemlerinde merkezi takas yok, teminat da alınmıyor. Bunun yerine bankalar birbirine line denen limitler tanıyor. Bir de eski adıyla Tahtakale piyasası olarak bilinen serbest efektif piyasası var.", "Borsada işlem gören paylar için kural, emrin Borsa'ya gelmesi. Ama Borsa önerir ve SPK onaylarsa bazı durumlarda borsa dışında işlem yapılabiliyor. Miras paylaşımı, mahkeme kararı, rehin tasfiyesi, blok satış ve işlem sırası kapalı paylar bunlara örnek.", "Mevzuatta tanım da önemli. Tezgahüstü piyasa, borsalar ve teşkilatlanmış diğer pazar yerleri dışında kalan piyasa. Yani alternatif işlem sistemleri ve çok taraflı platformlar tezgahüstü sayılmıyor. Türk bankaları ise özellikle 2001 krizinden sonra döviz açıklarını türevlerle kapatmaya başladı. Burada amaç çoğunlukla riskten korunma.", "Raporlamada Merkezi Kayıt Kuruluşu, yani MKK, veri depolama kuruluşu olarak yetkilendirildi. Elektronik veri deposu sistemi 2018 Kasım sonunda devreye girdi. İşlemler en geç ertesi güne kadar raporlanıyor. Borsa İstanbul vadeli ve swap piyasalarındaki işlemleri Takasbank raporluyor. İki gerçek kişi arasındaki işlemde ise bildirim yükümlülüğü yok.", "Aracı kurumlar için kurallar da var. Teminat yatırılmadan işleme başlanamaz. Başlangıç ve sürdürme teminatı ile tamamlama çağrısı tıpkı borsadaki gibi. Risk modelleri en az altı ayda bir stres testinden geçiyor. Kullanılan elektronik platformlar da 10 gün içinde Türkiye Sermaye Piyasaları Birliği'ne bildiriliyor.", "Son olarak merkezi karşı taraf. Takas kuruluşları tezgahüstü işlemlerin takasını SPK izniyle yapabiliyor. SPK da bunu zorunlu tutabiliyor. Takasbank 2019 Aralık ayında Türk lirası faiz swapları için merkezi karşı taraf hizmeti vermeye başladı.", "Toparlayalım. Birincisi, tezgahüstünde karşı taraf riski var, organize borsada yok. İkincisi, tezgahüstünde hacim yüksek ama likidite düşük ve spread yüksek. Üçüncüsü, en çok işlem gören tezgahüstü ürün faiz swapları ve faiz türevleri. Dördüncüsü, MKK veri depolama kuruluşu, raporlama ertesi güne kadar ve iki gerçek kişi arasında bildirim yok. Beşincisi, Takasbank 2019'dan beri Türk lirası faiz swaplarında merkezi karşı taraf."], "10": ["Merhaba, bu bölümde Merkez Bankası piyasalarını ve bankalararası piyasaları konuşacağız. Para politikasının mantığından başlayıp açık piyasa işlemlerine, zorunlu karşılıklara ve bankaların kendi aralarındaki piyasalara kadar gideceğiz.", "Bir ekonominin dört temel hedefi var. Tam istihdam, sürdürülebilir büyüme, fiyat istikrarı ve ödemeler dengesinde istikrar. Bunlar zaman zaman birbiriyle çatışıyor. Merkez bankası enflasyonu düşürmeye çalışırken kısa vadede işsizlik artabiliyor. 1900 seksenlerden itibaren dünyada merkez bankalarının asıl görevi fiyat istikrarı olarak kabul edildi.", "Türkiye'de Merkez Bankası Kanunu 1970 tarihli ve 1211 sayılı. 2001 Nisan ayında yapılan değişiklikle temel amaç fiyat istikrarı oldu. Para politikasını ve araçlarını Merkez Bankası doğrudan kendisi belirliyor. Ayrıca finansal istikrar için de tedbir alıyor.", "Para politikası stratejilerini ikiye ayırabilirsin. Ara hedefleme ve doğrudan enflasyon hedeflemesi. Ara hedeflemenin üç türü var. Parasal hedefleme, kur çapası ve merkez bankası bilanço hedeflemesi. Bilanço hedeflemesinde net uluslararası rezervlere taban, net iç varlıklara tavan konuyor. Buna klasik IMF hedefi de deniyor.", "Türkiye'nin yolculuğu şöyle. 2002 ile 2005 arasında örtük enflasyon hedeflemesi yapıldı. 2006 başında açık enflasyon hedeflemesine geçildi. Yıl sonu enflasyonu hedeften iki puan saparsa Merkez Bankası Hükümete ayrı bir rapor yazıyor. Para Politikası Kurulu da tavsiye veren konumdan karar alan konuma geçti. Enflasyon Raporu üç ayda bir yayımlanıyor.", "İmkânsız üçlüyü de unutma. Sermaye serbestçe dolaşıyorsa faizi ve kuru aynı anda kontrol edemezsin. Faizi kontrol edersen kur piyasada belirlenir. Kuru kontrol edersen faiz üzerindeki gücünü kaybedersin. 2010 son çeyreğinden itibaren ise iki amaç, üç araç dönemi başladı. Fiyat istikrarına finansal istikrar eklendi, araçlara da zorunlu karşılık ve faiz koridoru eklendi.", "Araçlara gelelim. Dört tane var. Açık piyasa işlemleri, döviz müdahaleleri, reeskont ve zorunlu karşılıklar. İlk üçü para tabanını etkiliyor, zorunlu karşılık ise parasal çarpanı. Bu ayrım sınavda çok soruluyor.", "Açık piyasa işlemleri en etkin araç. Merkez Bankası repo yaptığında piyasaya para veriyor, yani bankalar Merkez Bankası'ndan borç alıyor. Ters repo yaptığında piyasadan para çekiyor. Bu işlemlerin süresi 91 günü aşamaz. Likidite senetlerinin vadesi de en fazla 91 gün. Ve bu işlemler asla Hazine'ye kredi vermek için yapılamaz.", "Saatler şöyle. İşlemler 10 ile 16 arasında. Standart ihale saat 11'de. Kuruluşlar yükümlülüklerini 61'e kadar yerine getirmek zorunda. İhale yöntemlerinde geleneksel yöntemde herkes kendi fiyatından işlem görür. Son fiyat yönteminde herkese kazanan son teklifin fiyatı uygulanır. Miktar yönteminde ise tutar, tekliflerin payına göre dağıtılır. Mesela 100.000.000'luk ihalede 150.000.000 teklif veren banka, toplam 200.000.000'luk teklif içinde 75.000.000 alır.", "Aracı kurumlar da bu işlemlere katılabiliyor ama şartlar var. En az 6.000.000 lira ödenmiş sermaye ve bu sermayenin en az yüzde onu kadar devlet tahvili ya da kira sertifikası bloke tutmak gerekiyor. Teminatlarda iskonto uygulanıyor. İki yıldan kısa devlet tahvilinde %1, iki ile beş yıl arasında %2, beş yıldan uzunda %3. Eurobond ve döviz depoları gibi diğerlerinde %5.", "Bankalararası para piyasası 1986'da kuruldu. Eskiden Merkez Bankası burada bankalar arasında aracılık yapıyordu. 2002 Aralık ayında buna son verildi. Bugün sadece bankalar katılabiliyor. Gün içi likidite imkânında bankalar gün sonuna kadar faizsiz borçlanabiliyor. Geç likidite penceresi ise 16 ile 17 arası açık.", "Likidite desteği kredisini de bil. Bankacılıkta güven kaybı olursa, ödeme gücü olan bankalara veriliyor. Özkaynağın iki katıyla sınırlı, birer aylık vadelerle ve en fazla bir yıl. Reeskontta ise en az üç imzalı ve vadesine en çok 120 gün kalmış senetler kabul ediliyor. Ama bugün reeskont kredisi kullandırılmıyor.", "Gösterge kur nasıl belirleniyor? Merkez Bankası 10,5'tan 15 buçuğa kadar her saat başı bankaların 1.000.000 dolar için verdiği kotasyonlara bakıyor. Altı ortalama çıkıyor ve bunların ortalaması saat 15,5'ta gösterge kur oluyor. 2001 Şubat ayından beri dalgalı kur var. Merkez Bankası kurun seviyesine değil, aşırı oynaklığa müdahale ediyor.", "Zorunlu karşılıklarda takvim şöyle. Yükümlülükler iki haftada bir cuma hesaplanıyor. Tesis iki hafta sonraki cuma başlıyor ve 14 gün sürüyor. Rezerv opsiyonu mekanizmasıyla bankalar Türk lirası karşılıklarının en fazla %40 beşini dolar, yüzde otuzunu altın olarak tutabiliyor. Yurt içinden toplanan hurda altın için de %5'lik ayrı bir dilim var.", "Rezerv opsiyonu neden önemli? Sermaye girişi hızlanınca bankalar daha fazla döviz tutuyor ve fazla döviz piyasadan çekiliyor. Giriş yavaşlayınca bankalar bu dövizi geri kullanıyor. Yani mekanizma otomatik bir dengeleyici gibi çalışıyor ve kur oynaklığını azaltıyor.", "Son olarak bankalararası piyasalar. Bankalararası Türk lirası piyasasında teminat yok. Bu yüzden bankalar birbirine line denen limitler tanıyor. Döviz piyasasında yatırımcı doğrudan işlem yapamıyor, bankalar 1.000.000 dolar için kotasyon veriyor ve ödemeler SWIFT ile gidiyor. Kapalıçarşı'da işlemler nakit, sözlü ve güvene dayalı, saat sınırı yok. Serbest altın piyasası ise hiçbir düzenlemeye tabi değil.", "Toparlayalım. Birincisi, Merkez Bankası'nın temel amacı fiyat istikrarı. İkincisi, zorunlu karşılık parasal çarpanı, diğer üç araç para tabanını etkiler. Üçüncüsü, açık piyasa işlemlerinde vade en fazla 91 gün ve Hazine'ye kredi yasak. Dördüncüsü, gösterge kur altı saatlik ortalamanın ortalaması ve 15,5'ta belirlenir. Beşincisi, rezerv opsiyonunda %45 dolar, %30 altın."], "11": ["Merhaba, bu bölümde Takasbank Ödünç Pay Piyasasını konuşacağız. Kısaca ÖPP diyeceğiz. Kimlerin işlem yaptığını, hangi payların ödünç verildiğini, teminatları, komisyonu ve temerrüdü anlatacağım.", "Önce mantığı kuralım. Elinde pay olan bir fon, o payı bir süreliğine ödünç verip komisyon kazanmak istiyor. Açığa satış yapmak isteyen bir aracı kurum da o payı ödünç almak istiyor. ÖPP bu ikisini buluşturuyor. Takasbank da araya girip ikisine karşı taraf oluyor. Buna açık teklif yöntemiyle merkezi karşı taraflık deniyor.", "Hangi paylar ödünç verilebiliyor? Kredili alıma ve açığa satışa konu olan Yıldız Pazar ve Ana Pazar payları ile borsa yatırım fonları. Bir payın listeden çıkması halinde o pay ödünce konu olmaktan da çıkıyor.", "Sınırlar sınavın sevdiği konu. Bir payın halka açık kısmının en fazla %20'si ÖPP'de açık işlem olabilir. Bir üye için sınır %5, tek bir sicil için %3. Mesela halka açık 10.000.000 pay varsa tek bir yatırımcı en fazla 300.000 adet ödünç alabilir. Bir de limit konusu var. Takasbank ödünç alana limit tanıyor, ama ödünç verene limit şartı yok.", "Seans 9,5 ile 61 arası, tek seans. Valör aynı gün, bir iş günü ya da iki iş günü olabilir. Vadeler bir haftaya kadar her gün, sonra bir, iki, üç hafta, sonra bir, iki, üç, altı, dokuz ve 12 ay. Dört ay gibi bir vade yok, buna dikkat et. Bir de vadesiz işlem var, en fazla bir yıl sürüyor.", "Vadesiz işlemde ödünç veren payını geri çağırabilir. Öğlen 12'ye kadar bildirirse pay iki iş günü sonra, 12'den sonra bildirirse üç iş günü sonra iade edilir. Ödünç alan da erken kapatabilir, ama en erken valörden sonraki üçüncü iş günü ve en az iki iş günü önceden bildirerek.", "Burada fiyat yerine komisyon oranı var. Ödünç almak isteyen en yüksek komisyonu teklif ederse öne geçer, ödünç vermek isteyen en düşük komisyonu isterse öne geçer. Komisyon adımı %0,05. Emir türleri günlük, kalanı iptal et ve blok eşleşmezse iptal et. Bir de taraflar önceden anlaşırsa özel emir var. Özel emir değiştirilemez ve ekranlara yansımaz.", "Şunu da unutma. ÖPP'de gerçekleşen işlemler iptal edilemiyor. Sadece ileri valörlü işlemlerde özel durumlar çıkarsa Takasbank takastan önce iptal edebiliyor. Aynı gün valörlü işlemde takas, işlem anında gerçekleşiyor.", "Teminata gelelim. Teminatı sadece ödünç alan veriyor, ödünç verenden teminat istenmiyor. Teminatın en az %30'u Türk lirası olmalı. Teminat olarak döviz, devlet tahvili, BIST 100 payları, fon payları, altın ve varlığa dayalı menkul kıymetler kabul ediliyor. Ama teminat mektubu kabul edilmiyor. Altın da 100 gram ve katları olarak veriliyor.", "Değerleme katsayılarından birkaçını ezberle. Türk lirası %100, dolar %90, euro %89. BIST 30 payları %84, altın %88. Mesela 100.000 dolar teminat verdin ve kur 32 ise teminat değerin 2.880.000 lira olur.", "Sürdürme seviyesi %110. Teminatını ödünç borcuna böldüğünde %100 onun altına düşersen teminat tamamlama çağrısı geliyor. Mesela 1.000.000'luk borca karşı 1.080.000 liralık teminatın kaldıysa oran %108, çağrı gelir. Aynı gün sonuna kadar başlangıç seviyesine tamamlamalısın, yoksa vadesi en yakın ödünçten başlanarak tasfiye edilir.", "Garanti fonu, teminatın yetmediği durumlar için. Üyelerin katılımı zorunlu ve katkı payları kendi varlıklarından olmalı. Fonun büyüklüğü, en çok borcu olan üye ile ikinci ve üçüncü üyenin birlikte batması senaryosundaki ihtiyaçların büyüğünden az olamaz. Yükümlülük her ayın son iş günü hesaplanıyor.", "Komisyon hesabı basit. Her gün için piyasa değerini komisyon oranıyla çarpıp 36.500'e bölüyorsun ve topluyorsun. 1.000.000'luk işlem, %3 komisyon ve 10 gün için bu yaklaşık 822 lira eder. Takasbank komisyonu ise her iki taraftan alınıyor ve özel emirlerde tarifenin yarısı uygulanıyor.", "Haklar konusu çok soruluyor. Kâr payı, bedelli ve bedelsiz gibi mali haklar ödünç verene ait. Ama ödünç veren oy hakkını kaybediyor. Bedelsiz artırım olursa ödünç alanın borcu artıyor. 1.000 pay aldıysan ve %50 bedelsiz geldiyse 1.500 pay iade edersin. Bedelli artırımda beyan son saati 16, artırım son saati 31.", "Temerrütte ilk hedef payın iadesi. Borç 17'de kapanmazsa üye temerrüde düşüyor. Ertesi gün 41'a kadar süre verilebiliyor, sonra pay piyasasında temerrüt sırası açılıp pay alınıyor. 47'a kadar kapatırsan faiz en yüksek oranın yarısı kadar, sonra kapatırsan gecelik faizlerin iki katı devreye giriyor.", "Toparlayalım. Birincisi, Takasbank açık teklif yöntemiyle merkezi karşı taraf. İkincisi, sınırlar %20, %5 ve %3. Üçüncüsü, seans 9,5 ile 61 arası ve komisyon adımı onbinde beş. Dördüncüsü, teminatı sadece ödünç alan verir, sürdürme seviyesi %110 ve en az %30 Türk lirası. Beşincisi, mali haklar ödünç verende, oy hakkı ise ödünç süresince kullanılamaz."], "12": ["Merhaba, bu bölümde Takasbank Para Piyasasını, kısaca TPP'yi konuşacağız. Kimlerin üye olduğunu, saatleri, emirleri, teminatları ve temerrüt faizini anlatacağım.", "TPP 1996 Ekim ayında kuruldu. Elinde Türk lirası fazlası olan ile paraya ihtiyacı olan kurumları buluşturuyor. Şöyle düşün, bir sigorta şirketinin bir gecelik fazla parası var, bir aracı kurumun ise paraya ihtiyacı var. İkisi TPP'de buluşuyor. İşlemler Takasbank'ın garantisi altında. Ama Takasbank kotasyon vermiyor ve kendisi işleme katılmıyor.", "Üye olabilecekler geniş bir liste. Bankalar ve aracı kurumlar, leasing, faktoring ve finansman şirketleri, varlık yönetim şirketleri, sigorta ve emeklilik şirketleri, bazı kamu kurumları ve emekli sandıkları, ipotek finansmanı kuruluşları. Merkez Bankası ise doğal üye. Üye olmak için garanti fonu katkı payını yatırmak da şart.", "Taraflara bakalım. Para alan, yani borçlanan taraf, vadede anapara ve faizi ödüyor. Vadeden önce erken ödeme hakkı yok. Para satan taraf ise başta anaparayı ödüyor ve vergilerden resmi mercilere karşı sorumlu. Bir üye en fazla sekiz temsilci tanımlayabiliyor.", "Limitler iki çeşit. TPP limiti ve fonlar ile kamu kaynağı için ayrı bir fon limiti. Fon limitini portföy ya da müşteri işleminde kullanamazsın. Bir de blokeli satış emri var. Serbest hesabında parası olan üye, bu parayı bloke ettirip satış emri girebiliyor. Bu emir risk yaratmadığı için limiti olmayan üyeler bile kullanabiliyor.", "Saatler ve vadeler şöyle. İşlemler aynı gün valörlü ve 9,5 ile 15,5 arası. Vade gecelikten iki aya kadar her gün, ayrıca iki, üç ve altı ay civarındaki günler. En küçük emir 5.000 lira, 1.000 liralık katlarla artıyor. Faiz adımı %0,05.", "Emir türleri beş tane. Limitli, limitli gerçekleşmezse iptal et, limitli kalanı iptal et, piyasa ve piyasa gerçekleşmezse iptal et. Sadece limitli emrin kalan kısmı bekliyor, diğerlerinde kalan kısım siliniyor. Emri değiştirdiğinde sıranı koruyan tek değişiklik tutarı azaltmak.", "Eşleşmede borç almak isteyenlerde en yüksek faiz, borç vermek isteyenlerde en düşük faiz öne geçiyor. Bir kurum kendi emrini karşılamak istiyorsa 15 saniye beklemesi gerekiyor. Fon adına bir emir varsa da fon emrinin önce girilmiş olması şart.", "Teminatlarda önemli bir fark var. TPP'de elektronik teminat mektubu kabul ediliyor, ödünç pay piyasasında edilmiyordu. Mektup kesin ve süresiz ya da en az bir yıl vadeli olmalı. Teminat sadece portföyden verilir, müşteri hesabından verilemez. Banka bonosunun katsayısı 0,73, nakit lira bir, dolar 0,90.", "Teminat oranlarını sırayla ezberle. Borç almak istediğinde anapara artı faizin %105'i kadar başlangıç teminatı veriyorsun. Teminatın, borcunun %100 dördünün altına inerse tamamlama çağrısı geliyor. Bir de %2, dört ya da altı olan zorunlu teminat var ve bu kısım teminat mektubu dışındaki varlıklardan olmalı. Borç veren taraftan ise teminat istenmiyor.", "Bir örnek yapalım. 1.000.000 lirayı %36 faizle bir geceliğine borç almak istiyorsun. Bir günlük faiz yaklaşık 986 lira. Bunu anaparaya ekleyip %105'le çarptığında yaklaşık 1.051.000 lira teminat gerekiyor.", "Gün sonunda ödemeler netleştiriliyor. Netleştirme 60'te. Borçlu üye en geç 16'da ödüyor, alacaklılar da 16'da paralarını alıyor. Borçlu kısmi öderse alacaklılara oransal dağıtım yapılıyor. TPP alacağını borçlanma araçları ve pay piyasası borçlarına mahsup edebiliyorsun.", "Takasbank komisyonu her iki taraftan alınıyor. Bir haftaya kadar vadede anaparanın 100 binde üçü. Daha uzun vadelerde 1.000.000'da 3,5 çarpı gün sayısı. Mesela 10.000.000 liralık 30 günlük işlemde 1.050 lira eder.", "Garanti fonuna her üye en az 100.000 lira sabit katkı yatırıyor. Fonun büyüklüğü en büyük üç borçlunun birlikte batması senaryosuna göre belirleniyor ve en geç üç ayda bir sınanıyor. Garanti fonuna teminat mektubu kabul edilmiyor, buna dikkat et.", "Temerrüt saat 16'da başlıyor. Borcunu 46'a kadar kapatırsan en yüksek gecelik faizin yarısı kadar temerrüt faizi ödersin ve bunun bir üst sınırı var. 46'dan sonra kapatırsan faiz iki katına çıkar ve üst sınır yok. Mağdur olan alacaklıya da tahsil edilen faizin üçte ikisi ödeniyor.", "Toparlayalım. Birincisi, TPP 1996'da kuruldu ve Merkez Bankası doğal üye. İkincisi, saat 9,5 ile 15,5 arası, en küçük emir 5.000 lira. Üçüncüsü, başlangıç teminatı %105, sürdürme %104, zorunlu teminat %2, dört ya da altı. Dördüncüsü, teminat mektubu işlem teminatı olur ama garanti fonuna girmez. Beşincisi, 46'dan önce kapanan borçta faizin yarısı, sonra iki katı."], "13": ["Merhaba, bu son bölümde iki fon platformunu konuşacağız. Türkiye Elektronik Fon Alım Satım Platformu, yani TEFAS ve Bireysel Emeklilik Fon Alım Satım Platformu, yani BEFAS. İkisini de Takasbank işletiyor ve birbirine çok benziyorlar. Sana farkları üzerinden anlatacağım.", "TEFAS'ın fikri şu. Bir bankanın müşterisisin ama başka bir portföy şirketinin fonunu almak istiyorsun. TEFAS sayesinde kendi bankanın ekranından o fonu alabiliyorsun. Fonu kuran şirket kurucu, sana satan banka ise dağıtım kuruluşu. Takas ve saklama Takasbank ile Merkezi Kayıt Kuruluşu arasında otomatik yürüyor.", "Hangi fonlar TEFAS'ta yok? Özel fonlar, gayrimenkul fonları, girişim sermayesi fonları, garantili ve anapara koruma amaçlı fonlar. Serbest fonlar ise kurucu isterse girebiliyor ama sadece nitelikli yatırımcıya satılıyor. Bir de istisna var. Portföy şirketi kendi müşterisine kendi fonunu satarken TEFAS'ı kullanmak zorunda değil.", "Bir yaptırımı da bil. Bir üye bir ay içinde üç kez borcunu zamanında kapatmazsa beş iş günü TEFAS'ta işlem yapamıyor. Faaliyeti SPK tarafından durdurulan üye de tekrar izin kararı Takasbank'a gelene kadar işlem yapamıyor.", "Saatler sınavda çok soruluyor. Aynı gün valörlü talimatlar dokuz ile 13,5 arası, ileri valörlüler dokuz ile 62 arası kabul ediliyor. Nakit netleştirme liralarda 14'te, dövizde 12,5'ta. Temerrüt liralarda 15'te, dövizde 60'te başlıyor.", "Talimatlarda öncelik giriş saatine göre. Alım talimatı kurucunun tercihine göre adet ya da tutarla, satım ise sadece adetle veriliyor. Üç alış talimat türü var. Kalanı iptal et, kalanı beklet ve tamamını al. Tamamını al seçersen ve havuzda yeterli pay yoksa talimatın sisteme hiç girmiyor.", "İleri valörlü işlemlerde fon fiyatı belli olmadığı için marj kullanılıyor. Mesela fon fiyatı 10 lira, marj %20. 12.000 liralık tutarla alım verirsen fiyat sekiz liraya düşürülüp 1.500 adet eşleşiyor. Takas günü ise o günkü gerçek fiyattan işlem yapılıyor ve eşleşen adetten fazlası alınmıyor.", "İşlem limiti hesabı da önemli. Önce kullanılabilir fonlama limitini bul. Bu, Takasbank'ın tanıdığı limit ile teminatın değerlenmiş tutarından küçük olanı. Sonra buna nakit borç kapatma bakiyesini ve o gün gelen satışları ekle, eşleşmiş alımları çıkar. Limiti aşan talimat sisteme girer ama işleme alınmaz. Tamamını karşılayacak limit açılırsa işleme girer.", "Netleştirmede şuna dikkat et. Nakit netleştiriliyor ama fon payları netleştirilmiyor, talimat talimat aktarılıyor. Temerrüt faizi hesabında en yüksek gecelik oran alınıyor, sonra bir katsayıyla çarpılıp 360'a bölünüyor. 15 ile 15,5 arası ödersen katsayı yarım, aynı gün daha geç ödersen bir, ertesi güne kalırsa iki.", "Bir örnek yapalım. 1.000.000 lira borcunu 30'te kapattın ve oran %45. 1.000.000'u %45'le ve yarımla çarpıp 360'a bölersen 625 lira faiz çıkar. Bu faizin üçte ikisi mağdur olan karşı tarafa ödeniyor. Fon fiyatını geç bildiren kurucu ise her gün için 904 lira maktu bedel ödüyor.", "Komisyonlara bakalım. Dağıtım kuruluşu, sattığı fon payları için fon yönetim ücretinden pay alıyor. Buna aracılık komisyonu deniyor. Bu oran üçer aylık dönemlerle değiştirilebiliyor. Dönemin son ayının yirmisine kadar değiştirirsen sonraki dönem geçerli oluyor. Takasbank ise giriş ücreti, aylık aidat ve işlem komisyonu alıyor.", "Şimdi BEFAS. Burada ürün emeklilik yatırım fonları. Bir emeklilik şirketinin katılımcısı, başka bir emeklilik şirketinin fonunu BEFAS üzerinden alabiliyor. Düzenleyici SPK değil, Sigortacılık ve Özel Emeklilik Düzenleme ve Denetleme Kurumu. Üyeler emeklilik şirketleri, uygun görülen yatırım kuruluşları ise operatör üye olabiliyor.", "BEFAS'ın farkları şöyle. Sadece ileri valörlü işlem var ve sadece Türk lirası. Talimat kabulü dokuz ile 17,5 arası. Alım talimatı sadece tutarla veriliyor. Netleştirme yine 14'te, temerrüt 15'te başlıyor. Geç fiyat bildiriminde maktu bedel 720 lira. Aracılık komisyonu ise fon işletim gider kesintisinden pay olarak hesaplanıyor ve istenildiği zaman değiştirilebiliyor.", "Bir küçük tuzak var. Katılım esaslı emeklilik şirketlerinde temerrüt cezası için faiz oranları değil, kira sertifikalarının işlem gördüğü taahhütlü işlemler pazarındaki oran kullanılıyor. Kitapta ayrıca bir tutarsızlık var. Saat tablosu temerrüt başlangıcını 15 olarak veriyor, temerrüt bölümünde ise 16 yazıyor. Sınavda kitabın kendi sorusu 15'i esas alıyor.", "Toparlayalım. Birincisi, TEFAS'ta özel, gayrimenkul, girişim sermayesi, garantili ve anapara koruma amaçlı fonlar işlem görmez. İkincisi, TEFAS'ta aynı gün talimat dokuz ile 13,5, ileri valör dokuz ile 62 arası. Üçüncüsü, nakit 14'te netleşir, lirada temerrüt 15'te başlar ve fon payı netleşmez. Dördüncüsü, temerrüt faizi katsayıları yarım, bir ve iki, mağdura üçte iki ödenir. Beşincisi, BEFAS'ta sadece ileri valör, sadece lira ve alım sadece tutarla."]};
const AUD={"1": 19, "2": 17, "3": 17, "4": 18, "5": 16, "6": 17, "7": 18, "8": 15, "9": 17, "10": 17, "11": 16, "12": 16, "13": 15};
</script>
<script>
(function(){
const L="ABCDE";
const KEY="d1006-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2","#4F46E5","#BE185D","#15803D","#B45309","#0369A1","#9333EA","#0F766E","#C2410C","#1D4ED8"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("d1006"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){
  const s=S[si], col=HUE[si];
  const tab=st.tab[si]||"notlar";
  const f=st.tab["f"+si]||"tum";
  const x=secStats(si), kb=s.sorular.filter(q=>q.k).length;
  let h=`<div style="--c:${col};display:contents">
  <div class="crumb"><a href="#genel">Genel bakış</a> / Bölüm ${s.id}</div>
  <section class="hero"><div><span class="pill">Bölüm ${s.id} / ${S.length} · ${s.sorular.length} soru</span><h1>${esc(s.baslik)}</h1><p>${esc(s.ozet)}</p></div>${ring(x.c,x.n,col,"doğru")}</section>
  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,S.length>8?2:3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();
  const list=st.karma.list, x=statsOf(list,st.karma.ans);
  let h=`<div class="crumb"><a href="#genel">Genel bakış</a> / Karma deneme</div>

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b(\d+)$/.exec(r);
  if(m&&+m[1]>=1&&+m[1]<=S.length) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();

<script>

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["TLREFK", "Türk Lirası Gecelik Katılım Referans Getiri Oranı"],["IOSCO", "Uluslararası Menkul Kıymetler Komisyonları Örgütü"],["EBDKS", "endekse bağlı devre kesici sistemi"],["HMVKŞ", "Hazine Müsteşarlığı Varlık Kiralama Şirketi"],["TLREF", "Türk Lirası Gecelik Referans Faiz Oranı"],["KMKTP", "Kıymetli Madenler ve Kıymetli Taşlar Piyasası"],["TEFAS", "Türkiye Elektronik Fon Alım Satım Platformu"],["BEFAS", "Bireysel Emeklilik Fon Alım Satım Platformu"],["SEDDK", "Sigortacılık ve Özel Emeklilik Düzenleme ve Denetleme Kurumu"],["BİAŞ", "Borsa İstanbul Anonim Şirketi"],["İMKB", "İstanbul Menkul Kıymetler Borsası"],["TSPB", "Türkiye Sermaye Piyasaları Birliği"],["TCMB", "Türkiye Cumhuriyet Merkez Bankası"],["KMKT", "Kıymetli Madenler ve Kıymetli Taşlar"],["YÜFP", "Yapılandırılmış Ürünler ve Fon Pazarı"],["PÖİP", "Piyasa Öncesi İşlem Platformu"],["YPAH", "yeni pay alma hakkı"],["SDKS", "sahipliğe dayalı kira sertifikası"],["VBTS", "Volatilite Bazlı Tedbir Sistemi"],["PTRM", "işlem öncesi risk yönetimi"],["FDPD", "fiili dolaşımdaki payların piyasa değeri"],["DİBS", "devlet iç borçlanma senedi"],["ÖSBA", "Özel Sektör Borçlanma Aracı"],["VDMK", "Varlığa Dayalı Menkul Kıymet"],["İDMK", "İpoteğe Dayalı Menkul Kıymet"],["VTMK", "Varlık Teminatlı Menkul Kıymet"],["İTMK", "İpotek Teminatlı Menkul Kıymet"],["ISIN", "Uluslararası Menkul Kıymet Tanımlama Numarası"],["NYİP", "Nitelikli Yatırımcıya İhraç Pazarı"],["VİOP", "Vadeli İşlem ve Opsiyon Piyasası"],["KMÖP", "Kıymetli Madenler Ödünç Piyasası"],["LBMA", "Londra Külçe Piyasası Birliği"],["TMSF", "Tasarruf Mevduatı Sigorta Fonu"],["BEİE", "Blok Eşleşmezse İptal Et"],["LGİE", "Limitli Gerçekleşmezse İptal Et"],["LKİE", "Limitli Kalanı İptal Et"],["PGİE", "Piyasa Gerçekleşmezse İptal Et"],["ETMP", "Elektronik Teminat Mektubu Platformu"],["BSMV", "Banka ve Sigorta Muameleleri Vergisi"],["İAB", "İstanbul Altın Borsası"],["MKK", "Merkezi Kayıt Kuruluşu"],["BYF", "borsa yatırım fonu"],["YİP", "Yakın İzleme Pazarı"],["GSP", "Girişim Sermayesi Pazarı"],["GMF", "gayrimenkul yatırım fonu"],["GSF", "girişim sermayesi yatırım fonu"],["GMS", "gayrimenkul sertifikası"],["EMS", "emtia sertifikası"],["VKŞ", "varlık kiralama şirketi"],["PYŞ", "portföy yönetim şirketi"],["AOF", "ağırlıklı ortalama fiyat"],["ARF", "açılış referans fiyatı"],["AFK", "emir aracısı fon kodu"],["PPD", "Pay Piyasası Direktörlüğü"],["PYM", "piyasa yapıcı müşteri hesabı"],["PYP", "piyasa yapıcı portföy hesabı"],["LSM", "likidite sağlayıcı müşteri hesabı"],["LSP", "likidite sağlayıcı portföy hesabı"],["OTR", "emir işlem oranı"],["YFİ", "yüksek frekanslı işlem"],["KİE", "kalanı iptal et"],["İKG", "iptale kadar geçerli"],["LFE", "limit fiyatlı emir"],["TAS", "toptan alış satış"],["ÖİB", "Özelleştirme İdaresi Başkanlığı"],["SFY", "sabit fiyat yöntemi"],["DFY", "değişken fiyat yöntemi"],["FDO", "fiili dolaşım oranı"],["TVF", "Türkiye Varlık Fonu"],["AON", "hepsi ya da hiçbiri"],["FOK", "gerçekleşmezse iptal et"],["BAP", "Borçlanma Araçları Piyasası"],["GES", "Gelire Endeksli Senet"],["GOS", "Gelir Ortaklığı Senedi"],["KAS", "Kesin Alım Satım Pazarı"],["GİE", "Gerçekleşmezse İptal Et"],["ODM", "Olağanüstü Durum Merkezi"],["KMP", "Kıymetli Madenler Piyasası"],["KİT", "Kıymetli Madenler İşlem Platformu"],["OTC", "tezgahüstü"],["FRA", "faiz oranı anlaşması"],["CCP", "merkezi karşı taraf"],["MKT", "merkezi karşı taraf"],["CDS", "kredi temerrüt swabı"],["APİ", "açık piyasa işlemleri"],["GİL", "Gün İçi Likidite"],["GLP", "Geç Likidite Penceresi"],["NUR", "net uluslararası rezervler"],["NİV", "net iç varlıklar"],["ROM", "Rezerv Opsiyonu Mekanizması"],["ROO", "Rezerv Opsiyonu Oranı"],["ROK", "Rezerv Opsiyonu Katsayısı"],["İhS", "İhale Sistemi"],["ÖPP", "Ödünç Pay Piyasası"],["TPP", "Takasbank Para Piyasası"],["BES", "Bireysel Emeklilik Sistemi"],["EP", "Emtia Pazarı"],["BT", "brüt takas"],["TW", "işlem terminali"],["SPKn","Sermaye Piyasası Kanunu"],["TTSG","Türkiye Ticaret Sicili Gazetesi"],["TRİK","teminat, rehin, ipotek ve kefalet"],["YİB","yatırımcı ilişkileri bölümü"],["KYBF","Kurumsal Yönetim Bilgi Formu"],["URF","Uyum Raporu"],["KSS","kurumsal sosyal sorumluluk"],["NBD","net bugünkü değer"],["KGK","Kamu Gözetimi Kurumu"],["KYD","kurumsal yönetim derecelendirme"],["TTK","Türk Ticaret Kanunu"],["YK","yönetim kurulu"],["GK","genel kurul"],["KY","kurumsal yönetim"],["PD","piyasa değeri"],["FD","fiili dolaşımdaki"],["GM","genel müdür"],["SP","sermaye piyasası"],["ÇSY","çevresel, sosyal ve kurumsal yönetim"],["AB","Avrupa Birliği"],["ABD","Amerika Birleşik Devletleri"],["SOX","Sarbanes Oxley"]];
function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}
  t=t.replace(/(\p{Ll})[’'](\p{L})/gu,"$1$2").replace(/\s+/g," ");
  return t.trim();
}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"&&typeof AUD!=="undefined"?"Bu bölümün podcast'i hazır bir kayıttır; oynat düğmesine bas, anlatılan paragrafı burada takip et.":pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];if(typeof AUD!=="undefined"&&AUD[si+1])P[si+1].forEach((par,k)=>items.push({el:-1,raw:par,say:par,src:"audio/b"+(si+1)+"-"+(k+1)+".mp3"}));else P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;
}
function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  {const au=pref.mode==="podcast"&&typeof AUD!=="undefined";$("pVoice").parentNode.hidden=au;if(au)$("pWarn").hidden=true;}
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){
  const vs=synth.getVoices();const tr=trVoices();
  return vs.find(v=>v.name===pref.voice)||tr[0]||null;
}
function fillVoices(){
  if(!synth)return;
  const vs=synth.getVoices();const tr=trVoices();const list=tr.length?tr:vs;
  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  if(items[idx].src){if(synth)synth.cancel();const tok={};utt=tok;AU.src=items[idx].src;AU.playbackRate=pref.rate;
    AU.onended=()=>{if(utt!==tok||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
    AU.onerror=()=>{if(utt!==tok)return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses dosyası yüklenemedi; bağlantını kontrol edip tekrar dene."};
    AU.play().catch(()=>{});ui();return}
  AU.pause();
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth&&typeof AUD==="undefined"){return}
  let si=curSi>=0?curSi:(qSi>=0?qSi:0);
  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}
  playing=true;speak();
}
function pause(){playing=false;utt=null;AU.pause();if(synth)synth.cancel();ui()}
function stop(finished){playing=false;utt=null;AU.pause();if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth&&typeof AUD==="undefined"){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing&&items[idx]&&items[idx].src){AU.playbackRate=pref.rate;ui()}else if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}
  navByPlayer=false;ui();
});
window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
})();

</script>
