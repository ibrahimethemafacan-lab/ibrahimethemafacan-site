<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.opts2 select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}

<script>
const S=[{"id": 1, "kisa": "Piyasalar ve BİAŞ yapısı", "baslik": "Finansal Piyasalar ve Borsa İstanbul A.Ş.'nin Hukuki Yapısı", "ozet": "Para ve sermaye piyasası ayrımı, borsanın tanımı ve kuruluşu, BİAŞ'ın ortaklık yapısı, organları ve komiteleri, disiplin ve uyuşmazlık süreçleri, kotasyon, işlem durdurma ve finansal ölçütler.", "notlar": "<h3>Piyasa ve finansal piyasa<\/h3>\n<ul>\n<li><b>Piyasa:<\/b> alıcı ile satıcının iletişim kurup para-mal değişiminin yapıldığı yer. Arz ve talebin buluşup işleme dönüştüğü <b>borsalar<\/b>, piyasanın en tipik örneğidir.<\/li>\n<li><b>Reel piyasa:<\/b> mal ve hizmet arz-talebi. <b>Finansal (mali) piyasa:<\/b> fon fazlası olanların tasarruflarını fon açığı olanlara aktardığı, \"mali varlık\" sayılan kıymetli evrakın alınıp satıldığı piyasa.<\/li>\n<li>Finansal piyasa; fon arz edenleri, fon talep edenleri, fon akımını düzenleyen kurumları, araçları ve hukuki-idari kuralları kapsar. Para ve sermaye piyasasından <b>daha geniş<\/b>, ikisini de içine alan kavramdır.<\/li>\n<li><b>Beş unsur:<\/b> tasarruf sahipleri (fon arz edenler), tüketiciler/yatırımcılar (fon talep edenler), yatırım ve finansman araçları, yardımcı kuruluşlar, hukuki ve idari düzen.<\/li>\n<\/ul>\n<table>\n<tr><th>Sınıflama ölçütü<\/th><th>Türler<\/th><\/tr>\n<tr><td>Piyasa yerine göre<\/td><td><b>Organize:<\/b> TCMB piyasaları (açık piyasa işlemleri, para piyasası, döviz piyasası), Borsa İstanbul piyasaları, Takasbank piyasaları.<br><b>Organize olmayan:<\/b> bankalararası tahvil piyasası, bankalararası döviz piyasası, serbest döviz piyasası, serbest altın piyasası.<\/td><\/tr>\n<tr><td>Fonun vadesine göre<\/td><td>Para piyasası (kısa vade) ve sermaye piyasası (uzun vade).<\/td><\/tr>\n<\/table>\n<ul><li>Dikkat: Serbest altın piyasası ve bankalararası piyasalar <b>organize olmayan<\/b> piyasadır; Takasbank piyasaları ise organizedir.<\/li><\/ul>\n\n<h3>Para piyasası ve sermaye piyasası<\/h3>\n<table>\n<tr><th>Özellik<\/th><th>Para piyasası<\/th><th>Sermaye piyasası<\/th><\/tr>\n<tr><td>Vade<\/td><td>Kısa; genellikle <b>1 yılı aşmaz<\/b><\/td><td><b>1 yıldan uzun<\/b><\/td><\/tr>\n<tr><td>Fonun kullanımı<\/td><td>İşletmenin <b>dönen varlıklarının<\/b> finansmanı (kredi)<\/td><td>Bina, makine, teçhizat gibi <b>duran varlıkların<\/b> finansmanı<\/td><\/tr>\n<tr><td>Araçlar<\/td><td>Hazine bonosu, finansman bonosu, banka bonoları, banka garantili bonolar, repo/ters repo (genel olarak ticari senetler)<\/td><td>Pay, özel sektör ve devlet tahvili, kâr-zarar ortaklığı belgesi, katılma intifa senedi, gelir ortaklığı senedi, eurobond, gayrimenkul sertifikası, yatırım fonu katılma payı, varlığa dayalı menkul kıymet<\/td><\/tr>\n<tr><td>Kaynak<\/td><td>Çeşitli mevduatlar<\/td><td>Tasarruf sahiplerinin birikimleri<\/td><\/tr>\n<\/table>\n<ul>\n<li>Para piyasasında likidite fazlası olan faiz ister, likidite açığı olan faiz öder.<\/li>\n<li><b>Birincil piyasa:<\/b> ihraççı ile tasarruf sahibinin doğrudan karşılaştığı, menkul kıymetin ilk kez satıldığı, şirketin fon yarattığı piyasa; halka arz kuralları uygulanır; firmaya <b>yeni sermaye girer<\/b>.<\/li>\n<li><b>İkincil piyasa:<\/b> daha önce satılmış kıymetlerin yatırımcılar arasında el değiştirdiği piyasa; <b>likidite<\/b> sağlar; en iyi örneği borsalardır. Pay sahibi ihraççıya hiçbir zaman, tahvil sahibi vadeden önce başvurup paraya çeviremez; bu ihtiyacı ikincil piyasa karşılar.<\/li>\n<li>Dikkat: İkincil piyasada el değiştiren kıymetten elde edilen fonun ihraççı şirketle <b>ilgisi yoktur<\/b>; şirkete yeni sermaye girmez.<\/li>\n<\/ul>\n\n<h3>Borsanın tanımı ve kuruluşu (SPKn)<\/h3>\n<ul>\n<li><b>Borsa:<\/b> anonim şirket olarak kurulan; sermaye piyasası araçları, kambiyo, kıymetli maden ve taşlar ile Kurulca uygun görülen diğer kıymetlerin serbest rekabet altında kolay ve güvenli alım satımını sağlayan, fiyatları tespit ve ilan eden, kendisi veya <b>piyasa işleticisi<\/b> tarafından işletilen, emirleri bir araya getiren, yetkilendirilmiş ve düzenli faaliyet gösteren sistem ve pazar yerleri.<\/li>\n<li><b>Kuruluş izni:<\/b> Kurulun uygun görüşü üzerine <b>Cumhurbaşkanı<\/b> verir. <b>Faaliyete geçiş:<\/b> Kurul iznine tabidir.<\/li>\n<li>Kuruluş izni şartları: anonim şirket olmak; payların tamamı <b>nama yazılı<\/b>; paylar <b>nakit<\/b> karşılığı; sermaye Kurulca belirlenen tutardan az olmamak ve <b>tamamen ödenmiş<\/b> olmak; kurucular ve önemli etkiye sahip ortaklar SPKn m.44 şartlarını taşımak; esas sözleşme mevzuata uygun; ortaklık yapısı açık ve şeffaf.<\/li>\n<li>Kuruluş izninden sonra <b>en geç 1 yıl<\/b> içinde faaliyet izni için Kurula başvurulur; Kurul eksiksiz başvurudan itibaren <b>6 ay<\/b> içinde karar verir.<\/li>\n<li>Esas sözleşme değişikliği, pay devri ve pay devri olmasa bile doğrudan/dolaylı <b>kontrol devri<\/b> doğuran her işlem Kurul iznine tabidir. İzinsiz devirler pay defterine kaydedilmez; yapılan kayıt hükümsüzdür.<\/li>\n<li><b>Önemli etkiye sahip ortak:<\/b> borsa veya piyasa işleticisinde sermayenin ya da oy haklarının doğrudan/dolaylı <b>%5 veya fazlasına<\/b> sahip olan ya da bu oranın altında olsa da yönetim kuruluna üye belirleme imtiyazı veren paya sahip ortak. Kanunla kurulan borsalar ve Hazine (bugün <b>Türkiye Varlık Fonu<\/b>) bu tanımın dışındadır.<\/li>\n<li><b>Piyasa işleticisi:<\/b> borsayı veya piyasalarını yöneten/işleten anonim ortaklık. Borsa ile piyasa işleticisi arasındaki anlaşma <b>Kurul onayı olmadan<\/b> hüküm doğurmaz.<\/li>\n<\/ul>\n<h4>Borsaların faaliyet alanları (SPKn m.67)<\/h4>\n<p>Kota alma, kottan çıkarma, işlem görme ve durdurma; emirlerin iletilmesi ve eşleştirilmesi; işlemlerden doğan yükümlülüklerin zamanında yerine getirilmesi; işlem yapma yetkisi verilmesi; disiplin düzenlemeleri; borsa gelirleri ve tahsili; uyuşmazlıkların çözümü; borsa, pay sahipleri ve piyasa işleticisi arasındaki çıkar çatışmalarının önlenmesi; işletim, denetim ve gözetim sistemleri; piyasa oluşturma, işletme ve yönetme. Amaç: güvenilir, şeffaf, etkin, istikrarlı, adil ve rekabetçi ortam.<\/p>\n\n<h3>Borsa İstanbul'un hukuki çerçevesi<\/h3>\n<ul>\n<li>BİAŞ, SPKn <b>m.138<\/b> ile kurulmuştur; esas sözleşmenin ticaret siciline tescili ile kuruluş ve faaliyet iznini almış sayılır.<\/li>\n<li>Esas sözleşme <b>03/04/2013<\/b>'te tescil edildi; <b>İMKB<\/b> ve <b>İstanbul Altın Borsası (İAB)<\/b>'nın tüzel kişiliği sona erdi, tüm varlık ve yükümlülükleri işleme gerek kalmadan BİAŞ'a geçti. Ardından <b>Vadeli İşlem ve Opsiyon Borsası A.Ş.<\/b>'nin tüm payları devralındı.<\/li>\n<li>Temel mevzuat: 6362 sayılı SPKn, 6102 sayılı TTK, Borsalar Yönetmeliği, BİAŞ Yönetmeliği, KMKT Yönetmeliği, diğer yönetmelik, yönerge ve prosedürler.<\/li>\n<\/ul>\n<table>\n<tr><th>Düzenleme<\/th><th>Resmî Gazete<\/th><th>Konusu<\/th><\/tr>\n<tr><td>Borsalar ve Piyasa İşleticilerinin Kuruluş, Faaliyet, Çalışma ve Denetim Esasları Hakkında Yönetmelik (Borsalar Yönetmeliği)<\/td><td>19/07/2013, 28712<\/td><td>Borsaların kuruluşu, sermaye yapısı, faaliyetleri ve denetimi, faaliyetin geçici/sürekli durdurulması, piyasa işleticisi<\/td><\/tr>\n<tr><td>BİAŞ Borsacılık Faaliyetlerine İlişkin Esaslar Yönetmeliği (BİAŞ Yönetmeliği)<\/td><td>19/10/2014, 29150<\/td><td>İşlem yapma yetkisi, kotasyon, işlem görme/durdurma, emir iletimi ve eşleştirme, gözetim, uyuşmazlık, disiplin<\/td><\/tr>\n<tr><td>BİAŞ Kıymetli Madenler ve Kıymetli Taşlar ile İlgili Borsacılık Faaliyetlerine İlişkin Esaslar Yönetmeliği (KMKT Yönetmeliği)<\/td><td>19/10/2014, 29150<\/td><td>Kıymetli maden, taş ve madene dayalı araçların işlem gördüğü piyasalar<\/td><\/tr>\n<\/table>\n\n<h3>Ortaklık yapısı<\/h3>\n<ul><li>Kuruluş sermayesi <b>423.234.000 TL<\/b>; her biri <b>1 kuruş<\/b> nominal değerli <b>42.323.400.000<\/b> adet nama yazılı paya bölünmüştür.<\/li><\/ul>\n<table>\n<tr><th>Pay sahibi<\/th><th>Oran<\/th><\/tr>\n<tr><td>Türkiye Varlık Fonu<\/td><td>%80,60<\/td><\/tr>\n<tr><td>QH Oil Investments LLC<\/td><td>%10<\/td><\/tr>\n<tr><td>Diğer (aracı kurumlar, bankalar, kıymetli maden ve döviz şirketleri, diğer şirketler)<\/td><td>%5,71<\/td><\/tr>\n<tr><td>Borsa İstanbul A.Ş. (kendi payı)<\/td><td>%2,39<\/td><\/tr>\n<tr><td>Türkiye Sermaye Piyasaları Birliği<\/td><td>%1,30<\/td><\/tr>\n<\/table>\n<ul><li>Dikkat: TOBB, BİAŞ'ın pay sahipleri arasında <b>yoktur<\/b>.<\/li><\/ul>\n\n<h3>Organlar: genel kurul ve yönetim kurulu<\/h3>\n<ul>\n<li>Organlar TTK çerçevesinde <b>genel kurul<\/b> ve <b>yönetim kurulu<\/b>dur; yönetim kuruluna yardımcı olmak üzere gerektiği sayıda komite kurulur.<\/li>\n<li><b>Olağan genel kurul:<\/b> faaliyet dönemi sonundan itibaren <b>3 ay<\/b> içinde toplanır (organ seçimi, finansal tablolar, yıllık rapor, kâr dağıtımı, ibra).<\/li>\n<li><b>Olağanüstü genel kurul:<\/b> yönetim kurulu, TTK'daki hallerde azlık veya gündemi de belirleyerek <b>SPK'nın daveti<\/b> üzerine toplanır.<\/li>\n<\/ul>\n<table>\n<tr><th>Yönetim kurulu kuralı<\/th><th>Değer<\/th><\/tr>\n<tr><td>Üye sayısı<\/td><td><b>9<\/b> (genel kurul seçer)<\/td><\/tr>\n<tr><td>Bağımsız üye<\/td><td>En az <b>3<\/b>; bağımsızlardan en az <b>1'i kadın<\/b><\/td><\/tr>\n<tr><td>Eğitim ve deneyim<\/td><td>4 yıllık fakülte mezunu, mezuniyet sonrası en az <b>10 yıl<\/b> mesleki deneyim<\/td><\/tr>\n<tr><td>Sermaye piyasası deneyimi<\/td><td>Üyelerin en az <b>üçte biri<\/b> 10 yıllık sermaye piyasası deneyimine sahip olmalı<\/td><\/tr>\n<tr><td>Görev süresi<\/td><td><b>3 yıl<\/b>; yeniden seçilebilir<\/td><\/tr>\n<tr><td>Toplantı/karar nisabı<\/td><td>Üye tam sayısının çoğunluğuyla toplanır, toplantıda hazır bulunanların çoğunluğuyla karar alır<\/td><\/tr>\n<tr><td>Başkan ve başkan vekili<\/td><td>Her yıl olağan genel kuruldan sonraki ilk toplantıda yönetim kurulu kendi üyeleri arasından seçer<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Genel Müdür:<\/b> yönetim kurulu, şartları taşıyan bir <b>üyesini<\/b> genel müdür olarak tayin eder; görev süresi o üyenin yönetim kurulu görev süresiyle sınırlıdır; en az 10 yıl mesleki deneyim şarttır.<\/li>\n<li>Yönetim kurulunun başlıca yetkileri: yönetmelikleri karara bağlamak, yönergeleri yürürlüğe koymak; işlem yapma yetkisi vermek, geçici/sürekli iptal etmek; kotasyon başvurularını karara bağlamak; piyasa, pazar, platform kurmak ve kaldırmak; komiteleri kurmak ve üyelerini seçmek; uyuşmazlıkları sonuçlandırmak; disiplin cezası vermek; gerektiğinde kottan çıkarmak; gözetim sistemini kurmak; bütçe ve kadroyu kesinleştirmek; gelir kalemlerini belirlemek; finansal tablolar ve faaliyet raporunu genel kurula sunmak; Genel Müdürü atamak; yabancı borsalarla işbirliği; <b>sermaye piyasası aracı ihraç etmek<\/b>.<\/li>\n<\/ul>\n\n<h3>Komiteler<\/h3>\n<p>Yönetim kurulu, BİAŞ Yönetmeliği m.57/1 ve II-17.1 Kurumsal Yönetim Tebliği uyarınca şu komiteleri kurmuştur: Kurumsal Yönetim, Denetim, Riskin Erken Saptanması, Sermaye Piyasası Araçları Uyuşmazlık, Kıymetli Madenler Piyasası ve Kıymetli Madenler Ödünç Piyasası Uyuşmazlık, Sermaye Piyasası Araçları Disiplin, Kıymetli Madenler ve Kıymetli Taşlar Piyasaları Disiplin.<\/p>\n<table>\n<tr><th>Komite<\/th><th>Görev<\/th><th>Yapı<\/th><\/tr>\n<tr><td>Denetim<\/td><td>Finansal tabloların doğruluğu, muhasebe sistemi, bağımsız denetçinin atanması, iç kontrol ve iç denetimin gözetimi<\/td><td>En az 2 üye; <b>tamamı bağımsız<\/b> YK üyesi<\/td><\/tr>\n<tr><td>Kurumsal Yönetim<\/td><td>Kurumsal yönetim ilkelerine uyumun tespiti ve iyileştirme önerileri<\/td><td>En az 2 üye; çoğunluğu bağımsız ve icracı olmayan; dışarıdan uzman alınabilir<\/td><\/tr>\n<tr><td>Riskin Erken Saptanması<\/td><td>Borsanın varlığını tehlikeye sokabilecek risklerin erken teşhisi ve yönetimi<\/td><td>En az 2 üye; çoğunluğu <b>icracı olmayan<\/b>; dışarıdan uzman alınabilir<\/td><\/tr>\n<tr><td>Uyuşmazlık komiteleri (2 adet)<\/td><td>Borsa işlemlerinden doğan uyuşmazlıklarda YK'ya yardım<\/td><td><b>1 başkan + 2 üye<\/b> (YK seçer)<\/td><\/tr>\n<tr><td>Disiplin komiteleri (2 adet)<\/td><td>İşlem yapma yetkisi verilenler ve temsilcileri hakkında disiplin soruşturması<\/td><td><b>1 başkan + 2 üye<\/b><\/td><\/tr>\n<\/table>\n<ul><li>Dikkat: \"Rekabet komitesi\" BİAŞ komiteleri arasında yoktur.<\/li><\/ul>\n\n<h3>Uyuşmazlıkların çözümü<\/h3>\n<ul>\n<li><b>Borsa işlemi<\/b> (BİAŞ Yönetmeliği m.34/1): emirlerin Borsaya iletilmesi, Borsa kurallarına göre eşleştirilmesi ve doğan yükümlülüklerin Borsa ile takas-saklama kuruluşlarının yöntem ve sürelerinde yerine getirilmesi.<\/li>\n<li>Uyuşmazlıkları çözme yetkisi <b>Yönetim Kurulu<\/b>ndadır; komite yardımcıdır. Sık konular: emrin hiç/kısmen yerine getirilmemesi, limit-süre-miktara aykırılık, zamanında iletilmeme, usulsüz alım satım, talimatsız alım satım, işlemlerin tasfiyesi.<\/li>\n<li>Başvuru <b>yazılı dilekçe<\/b> ve YK'nın belirleyip Kurulun onayladığı <b>uyuşmazlık hizmet bedeli<\/b> ile yapılır; Komite Raportörü ön değerlendirme yapar.<\/li>\n<li>Usule aykırılık giderilmezse başvuru <b>yapılmamış sayılır<\/b> ve bedel iade edilir. Şikâyetten vazgeçme, tahkim/yargı yoluna gitme veya sulhte bedel <b>iade edilmez<\/b>, Borsaya gelir yazılır. Başvuran kısmen/tamamen haklı çıkarsa bedel talep üzerine karşı taraftan alınıp iade edilir.<\/li>\n<li>Uyuşmazlığa konu ilk işlemden itibaren <b>2 yıl<\/b> içinde yapılmayan başvuru incelenmez (bedel iade edilir).<\/li>\n<li>Komite tarafları ve tanıkları dinleyebilir, BİAŞ Denetim ve Gözetim Kurulu'ndan inceleme isteyebilir; görüşünü YK'ya sunar.<\/li>\n<li>YK kararına itiraz: tutar SPKn m.84/5'teki ve her yıl yeniden değerleme oranında artırılan sınırı aşıyorsa (2025 için <b>1.645.665 TL<\/b>), taraflar tebliğden itibaren <b>15 gün<\/b> içinde <b>Borsa aracılığıyla SPK'ya<\/b> itiraz eder. SPK kararı nihaidir; ona karşı idari yargıya gidilir.<\/li>\n<li>Taraflar her zaman sulh olabilir; sulhte işlem yapma yetkisi verilenler durumu <b>3 iş günü<\/b> içinde Borsaya bildirir. Feragat edilen uyuşmazlık tekrar şikâyet konusu yapılamaz.<\/li>\n<\/ul>\n\n<h3>Disiplin cezaları<\/h3>\n<p>Disiplin komiteleri inceleyip kararını YK'ya sunar; ceza <b>YK kararı ile kesinleşir<\/b>.<\/p>\n<table>\n<tr><th>Ceza<\/th><th>İçerik<\/th><th>Gerektiren fiillere örnek (BİAŞ Yön. m.53)<\/th><\/tr>\n<tr><td>Uyarı<\/td><td>Daha dikkatli olması gerektiğinin yazıyla bildirilmesi<\/td><td>Düzenleme veya müşteri emirlerinde dikkat ve özen göstermemek; genel ahlak ve nezakete aykırılık; çalışma düzenini bozmak<\/td><\/tr>\n<tr><td>Kınama<\/td><td>Kusurlu sayıldığının yazıyla bildirilmesi<\/td><td>Kusurlu davranmak; Borsa imajını zedeleyen asılsız beyan veya yayın<\/td><\/tr>\n<tr><td>Para cezası<\/td><td><b>10.000 TL – 5.000.000 TL<\/b><\/td><td>Denetim eksikliğiyle suiistimale yol açmak; piyasa bozucu eylemlere karşı önlem almamak; kasıtlı davranmak; sövme, hakaret, tehdit; bilgi-belgeyi zamanında vermemek; sarhoş gelmek; sosyal medyada yanıltıcı yorum/tavsiye ve yönlendirme gruplarıyla işbirliği (bu son iki fiilde ceza <b>en az 50.000 TL<\/b>)<\/td><\/tr>\n<tr><td>İşlem yapma yetkisinin/temsilciliğin geçici kaldırılması<\/td><td><b>3 ayı aşmayan<\/b> süreyle bir veya birden fazla piyasada<\/td><td>Fiili saldırı; personele hakaret; Borsa malına kasten zarar; aynı piyasada <b>1 yılda 2 kez<\/b> belirli tutarı aşan teminattan karşılanan temerrüt; bilgi vermemek veya yanıltıcı vermek, denetime izin vermemek; SPKn m.106-107 suçlarına ve piyasa bozucu eylemlere uyan işlem<\/td><\/tr>\n<tr><td>İşlem yapma yetkisinin/temsilciliğin iptali<\/td><td>Tüm piyasalarda yetkinin iptali<\/td><td>Kasıtlı suçtan 5 yıl veya fazla hapis ya da sayılan suçlardan (zimmet, rüşvet, dolandırıcılık, aklama vb.) mahkûmiyet; Borsa belge ve kayıtlarını tahrif etmek veya yok etmek<\/td><\/tr>\n<\/table>\n<ul>\n<li>Fiilin niteliğine göre <b>bir derece ağır veya hafif<\/b> ceza verilebilir; benzer fiillere aynı türden ceza verilir.<\/li>\n<li>Geçici kaldırma/iptal gerektiren fiilde kuvvetli şüphe varsa <b>Genel Müdür<\/b>, nihai karara kadar yetkileri geçici kaldırabilir; derhal YK onayına sunulur.<\/li>\n<li>Geçici kaldırma/iptal cezaları veya SPK mevzuatına da aykırı fiil cezaları en kısa sürede <b>Kurula<\/b> ve ilgisine göre <b>TSPB<\/b>'ye bildirilir.<\/li>\n<li>Ceza kararından itibaren <b>1 yıl<\/b> içinde aynı cezayı gerektiren yeni fiil: <b>bir derece ağır<\/b> ceza.<\/li>\n<li>Para cezası tutarları YK tarafından her yıl yeniden değerleme oranında artırılabilir. Ödenmeyen para cezası yetkilinin <b>güvence bedelinden<\/b> tahsil edilir; temsilci ödemezse bir üst derece ceza verilir.<\/li>\n<li>Temsilcinin aldığı ceza, temsilcilik sona erse de uygulanır. Adli soruşturma, disiplin soruşturmasını engellemez.<\/li>\n<\/ul>\n<table>\n<tr><th>Zamanaşımı<\/th><th>Süre<\/th><\/tr>\n<tr><td>Soruşturmaya başlama<\/td><td>Fiilin öğrenilmesinden <b>1 yıl<\/b>, her durumda fiilden <b>2 yıl<\/b> sonra başlanamaz<\/td><\/tr>\n<tr><td>Ceza verme<\/td><td>Fiilden <b>3 yıl<\/b> sonra ceza verilemez<\/td><\/tr>\n<tr><td>Cezanın düşmesi<\/td><td>YK karar tarihinden itibaren <b>3 yıl<\/b> içinde uygulanamayan ceza düşer<\/td><\/tr>\n<tr><td>Fiil aynı zamanda suçsa<\/td><td>Kanundaki daha uzun dava zamanaşımı uygulanır<\/td><\/tr>\n<\/table>\n\n<h3>Üyelik ve işlem yapma yetkisi<\/h3>\n<ul>\n<li>Borsalar Yönetmeliği m.24: <b>TCMB<\/b>; SPKn m.37/1 (a), (b), (c) kapsamında izinli yatırım kuruluşları (emir alma-iletme, emir gerçekleştirme, kendi hesabına alım satım) ve diğer otoritelerce izinli olup SPK'nın uygun gördükleri üye olabilir.<\/li>\n<li>Yalnız işlem yapma yetkisi ya da hem yetki hem üyelik için başvurulabilir; YK piyasa bazında <b>üye olmaksızın da<\/b> işlem yetkisi verebilir.<\/li>\n<li>Bir defaya mahsus <b>giriş aidatı<\/b> ve Borsa işlemleri dışındaki zararlar için <b>güvence bedeli<\/b> alınır; ayrıca her piyasa için faaliyet aidatı, yıllık aidat ve teminat alınır.<\/li>\n<li><b>TCMB<\/b> üyelik, yetki, teminat, denetim ve disiplin yükümlülüklerine tabi değildir; aidat, borsa payı, kotasyon ve diğer ücretlerden muaftır.<\/li>\n<li>Teminat türleri: TL, TCMB'nin alım satımını yaptığı dövizler, borsa adına bloke mevduat, kıymetli madenler, DİBS, TCMB likidite senetleri, kira sertifikaları, banka teminat mektubu. Zararlara teminattan ödeme kararını <b>YK<\/b> verir; ödeme teminatla sınırlıdır.<\/li>\n<li>Mali yapı zayıflığı, saklama açığı, faaliyet/takas üyeliğinin durdurulması, teminat eksiği veya denetime izin vermeme hâlinde <b>Genel Müdür<\/b> yetkiyi <b>5 işlem gününe kadar<\/b> tedbiren kaldırır, Kurula bildirir.<\/li>\n<li>Yetki; şartların yitirilmesi, kesinleşmiş iflas veya disiplin aykırılığı nedeniyle <b>YK kararıyla<\/b> iptal edilir. Feragat başvurusunu <b>Genel Müdür<\/b> karara bağlar.<\/li>\n<li>Borsa piyasalarında işlem yapanlar: aracı kurumlar, ticari bankalar, yatırım ve kalkınma bankaları, katılım bankaları. Kıymetli madenler piyasası: bankalar, yetkili müesseseler, kıymetli madenler aracı kurumları, kıymetli maden üretim/ticaret A.Ş.'leri. Elmas ve kıymetli taş piyasası: kuyumculuk sektörü üyeleri ve Kıymetli Madenler Piyasası üyeleri.<\/li>\n<li>Dikkat: Bağımsız denetim şirketleri Borsa piyasalarında işlem yapamaz.<\/li>\n<\/ul>\n\n<h3>Denetim<\/h3>\n<ul>\n<li>Borsa; üyelerinden bilgi-belge isteyebilir, nezdinde inceleme yapabilir, yaptırım uygular; kurallarının <b>ağır ihmal ve kasıtla<\/b> ihlalinde Kurula bildirir. Gözetim sistemi kurar; bu görevi dışarıdan hizmet alarak yürütebilir ama sorumluluğu kalkmaz.<\/li>\n<li>BİAŞ'ın borsacılık faaliyetlerinin düzenleme, gözetim ve denetim mercii <b>SPK<\/b>'dır. <b>Mali denetimi<\/b> ise Kurulca ilan edilen listedeki <b>bağımsız denetim kuruluşları<\/b> yapar.<\/li>\n<\/ul>\n\n<h3>Kotasyon, işlem görme ve durdurma<\/h3>\n<ul>\n<li>Kota almada yetkili merci <b>Yönetim Kurulu<\/b>dur; sınırları belirlenerek yetki kısmen veya tamamen <b>Genel Müdüre<\/b> devredilebilir.<\/li>\n<li>Başvuruyu ihraççı, halka arz eden, fon kurucusu, ihraççı ile birlikte piyasa danışmanı veya ihraca aracılık eden kuruluş dilekçeyle yapar. Yanlış/eksik bilgiden ihraççı, halka arz eden, aracı kuruluş, konsorsiyum, piyasa danışmanı, garantör ve bağımsız denetçi kusurlarına göre sorumludur.<\/li>\n<li>Kottan çıkarma şartlarını YK belirler, Kurul onaylar; şart oluşunca YK kararıyla kottan çıkarılabilir.<\/li>\n<li><b>Kotasyon ücretleri:<\/b> başvuru, kota alma, ilave kota alma, kotta kalma, yeniden kota alma, toptan alış satış işlem ücreti. YK belirler, Kurul onaylar. Kotta olmayıp işlem gören ihraççılardan da kota alma, kotta kalma ve yeniden kota alma ücreti alınır. Kottan çıkarmada ücret <b>iade edilmez<\/b>.<\/li>\n<li><b>Geçici durdurma:<\/b> Genel Müdür <b>en fazla 1 ay<\/b> durdurabilir; 1 ayı aşan süre için <b>YK kararı<\/b> gerekir. Sebepler: kararları etkileyecek önemli bilgi veya açıklama beklenmesi; anormal piyasa hareketleri ya da işlemleri engelleyen maddi unsurlar; uyarılmasına rağmen ihraççının bilgi-belge vermemesi veya denetime izin vermemesi. Durdurma gerekçesiyle <b>KAP<\/b>'ta duyurulur ve Kurula bildirilir.<\/li>\n<\/ul>\n\n<h3>Emirlerin iletilmesi, eşleştirme ve iptal<\/h3>\n<ul>\n<li>Müşteri emirlerini işlem yapma yetkisi verilenlere iletir; bunlar müşteri emrini kısmen veya tamamen <b>reddedebilir<\/b>. İşleme dönüşmeden önce emirler değiştirilebilir veya iptal edilebilir.<\/li>\n<li>Temel yöntemler: <b>tek fiyat<\/b> (emirler zaman diliminde toplanır, en çok işlem miktarını sağlayan tek fiyattan eşleşir) ve <b>çok fiyat<\/b> (emirler sürekli olarak farklı fiyatlardan eşleşir). Ayrı ayrı veya birlikte kullanılabilir.<\/li>\n<li>Kabul edilen her emre emir numarası verilir. Öncelik sırası: önce <b>fiyat<\/b>, sonra <b>zaman<\/b>. Fiyat önceliği: düşük fiyatlı satış ve yüksek fiyatlı alış önce karşılanır.<\/li>\n<\/ul>\n<table>\n<tr><th>İptal sebebi<\/th><th>İptal yetkilisi<\/th><\/tr>\n<tr><td>Bilgisayar sistemlerinden kaynaklanan hata<\/td><td>Genel Müdür veya görevlendirilen Genel Müdür Yardımcıları<\/td><\/tr>\n<tr><td>Üye veya Borsa personelinin hatalı emri<\/td><td>Genel Müdür, görevli Genel Müdür Yardımcıları veya <b>ilgili Piyasa Müdürü<\/b><\/td><\/tr>\n<tr><td>İşlemleri durduracak diğer maddi unsurlar<\/td><td>Genel Müdür veya görevlendirilen Genel Müdür Yardımcıları<\/td><\/tr>\n<\/table>\n<ul><li>İptal re'sen veya işleme taraf en az bir üyenin başvurusuyla yapılır; seansın tamamı veya bir bölümü için olabilir. İptal kararları <b>aynı gün KAP<\/b>'ta ilan edilir.<\/li><\/ul>\n\n<h3>Finansal ölçütler (endeksler)<\/h3>\n<ul>\n<li><b>Finansal ölçüt:<\/b> formülle düzenli hesaplanan, ücretli/ücretsiz sunulan, bir aracın değerini, getirisini, ödeme tutarını, portföyü veya performans primini belirlemede kullanılan, Borsanın yöneticisi olduğu endeks, fiyat, oran vb. <b>Endeks:<\/b> varlık, fiyat, getiri veya oranlar kullanılarak düzenli hesaplanıp yayımlanan gösterge.<\/li>\n<li>Borsa, <b>IOSCO<\/b> ilkelerine uyumlu finansal ölçüt listesini ve uyum beyanını <b>yılda en az 1 kez<\/b> güncelleyip kamuya açıklar.<\/li>\n<li>Düzenlemeler: IOSCO Prensiplerine Uyumlu Finansal Ölçütler Yönergesi; Yönetim, Çıkar Çatışmalarının Önlenmesi, İhbar ve Şikâyet prosedürleri.<\/li>\n<li>Yöneticinin sorumluluk alanları: <b>oluşturma, hesaplama ve yayımlama, operasyon, yönetim<\/b>. Hesaplama kayıtları <b>en az 5 yıl<\/b> saklanır.<\/li>\n<li>Kural seti değişiklikleri: <b>esaslı<\/b> (formül, bileşen yöntemi, veri tipi, ağırlık ayarlaması gibi performansı önemli ölçüde etkileyen), <b>esaslı olmayan<\/b> ve <b>acil esaslı<\/b>. Değişiklikler gerekçesiyle internet sitesinde ilan edilir.<\/li>\n<li><b>Finansal Ölçütler Komitesi:<\/b> Endeks Direktörü, Endeks Uygulamaları Servisinin bağlı olduğu Direktör ve Piyasa Operasyon Direktörlerinden oluşur; görüşünü Karar Merciine sunar.<\/li>\n<\/ul>\n<table>\n<tr><th>Finansal ölçüt<\/th><th>Karar mercii<\/th><\/tr>\n<tr><td>TLREF oranı ve BIST TLREF Endeksi<\/td><td>TLREF Komitesi<\/td><\/tr>\n<tr><td>TLREFK oranı ve BIST TLREFK Endeksi<\/td><td>TLREFK Komitesi<\/td><\/tr>\n<tr><td>BIST-KYD endeksleri ve Borsaya ait diğer ölçütler<\/td><td>Finansal Ölçütler Komitesinin önerisiyle Genel Müdür<\/td><\/tr>\n<tr><td>Mülkiyeti Borsaya ait olmayan ölçütler<\/td><td>Sahibi kuruluşun uygun görüşü veya talebiyle Genel Müdür<\/td><\/tr>\n<\/table>\n<ul>\n<li>Tasarımda dikkate alınanlar: yeterli örneklem, pazarın büyüklüğü ve likiditesi, işlem hacmi, işlemlerin katılımcılar arası dağılımı, piyasa dinamikleri. Faize dayalı ölçütlerde enterpolasyon/ekstrapolasyon ve kredi puanı değişimiyle düzeltme yapılabilir.<\/li>\n<li>Hesaplamaya son verme sebepleri: tanımın değişmesi, temsil edememe, asgari bileşen veya veri yetersizliği, mevzuat/piyasa yapısı değişikliği. Borsaya ait olmayan ölçütte sahibin talebiyle; her ölçütte <b>Düzenleyici Otoritenin<\/b> talebiyle son verilebilir.<\/li>\n<li>Dışarıdan hizmet alınabilir; hizmet sağlayıcı ve rolü internet sitesinde ilan edilir, roller yazılı kurallara bağlanır, olağanüstü durum planı yapılır.<\/li>\n<li>Çıkar çatışmasında ücret politikası çalışanı ölçütün seviyesi üzerinden ödüllendirmeyecek biçimde kurulur. Çatışma yeterince yönetilemezse <b>Kurul<\/b>, faaliyetin sonlandırılmasını veya hesaplamaya son verilmesini isteyebilir.<\/li>\n<li>Kontrol sistemi; çıkar çatışması, güvenilirlik, girdi bütünlüğü, hesap verebilirlik ve şikâyet, operasyonel risk, ihbar mekanizması, personel yetkinliği ve eğitim konularını kapsar.<\/li>\n<li><b>Denetim:<\/b> bağımsız iç veya dış denetçi, düzenlemenin yürürlüğünden <b>6 ay sonra<\/b> ilk kez, sonra <b>2 yılda birden az olmamak<\/b> üzere süreçleri gözden geçirir.<\/li>\n<\/ul>", "sorular": [{"q": "Aşağıdakilerden hangisi Türkiye'de organize olmayan piyasalardan biridir?", "o": ["Takasbank piyasaları", "TCMB açık piyasa işlemleri", "Bankalararası döviz piyasası", "Borsa İstanbul pay piyasası", "TCMB döviz piyasası"], "a": 2, "e": "Bankalararası tahvil ve döviz piyasaları, serbest döviz ve serbest altın piyasası organize olmayan piyasalardır; TCMB, Borsa İstanbul ve Takasbank piyasaları organizedir."}, {"q": "Para piyasası ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Fonlar genellikle işletmelerin duran varlıklarının finansmanında kullanılır", "Vade genellikle bir yılı aşmaz", "Hazine bonosu ve repo bu piyasanın araçlarıdır", "Kaynaklarını çeşitli mevduatlar oluşturur", "Likidite açığı olanlar faiz ödeyerek fon temin eder"], "a": 0, "e": "Para piyasasından sağlanan fonlar dönen varlıkların finansmanında kullanılır; duran varlık finansmanı sermaye piyasasının işlevidir."}, {"q": "Birincil ve ikincil piyasa ayrımı açısından aşağıdakilerden hangisi doğrudur?", "o": ["İkincil piyasa işlemleri şirkete yeni sermaye kazandırır", "Birincil piyasada halka arz kuralları uygulanmaz", "Pay sahipleri paylarını paraya çevirmek için ihraççıya başvurabilir", "İkincil piyasada el değiştiren kıymetten sağlanan fonun ihraççı şirketle ilgisi yoktur", "Borsalar birincil piyasanın en tipik örneğidir"], "a": 3, "e": "İkincil piyasada kıymetler yatırımcılar arasında el değiştirir, şirkete yeni sermaye girmez. Borsalar ikincil piyasanın en iyi örneğidir."}, {"q": "Borsaların ve piyasa işleticilerinin kuruluşuna hangi merci izin verir?", "o": ["Sermaye Piyasası Kurulu", "Kurulun uygun görüşü üzerine Cumhurbaşkanı", "Hazine ve Maliye Bakanlığı", "Borsa İstanbul Yönetim Kurulu", "Türkiye Sermaye Piyasaları Birliği"], "a": 1, "e": "Kuruluş iznini Kurulun uygun görüşü üzerine Cumhurbaşkanı verir; faaliyete geçiş ise Kurul iznine tabidir."}, {"q": "Kuruluş izni alan bir borsa, faaliyet izni için Kurula en geç ne kadar süre içinde başvurmalı ve Kurul eksiksiz başvuruyu ne kadar sürede karara bağlar?", "o": ["6 ay ve 3 ay", "1 yıl ve 3 ay", "2 yıl ve 6 ay", "6 ay ve 1 yıl", "1 yıl ve 6 ay"], "a": 4, "e": "Kuruluş izninden itibaren en geç bir yıl içinde başvuru yapılır; Kurul eksiksiz başvurudan itibaren altı ay içinde karar verir."}, {"q": "Bir borsada önemli etkiye sahip ortak sayılmak için sermaye veya oy haklarında doğrudan ya da dolaylı en az hangi orana sahip olmak gerekir?", "o": ["%10", "%5", "%1", "%25", "%20"], "a": 1, "e": "Yüzde 5 veya fazlası ya da bu oranın altında olsa da YK'ya üye belirleme imtiyazı veren paylara sahip olanlar önemli etkiye sahip ortaktır (kanunla kurulan borsalar ve Hazine/TVF hariç)."}, {"q": "Borsa İstanbul'un ortaklık yapısına ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["En büyük pay sahibi Türkiye Varlık Fonu'dur", "QH Oil Investments LLC yüzde 10 paya sahiptir", "Türkiye Sermaye Piyasaları Birliği pay sahibidir", "Türkiye Odalar ve Borsalar Birliği pay sahipleri arasındadır", "Borsa İstanbul A.Ş. kendi paylarının bir kısmına sahiptir"], "a": 3, "e": "Pay sahipleri TVF (%80,60), QH Oil (%10), diğer (%5,71), BİAŞ (%2,39) ve TSPB'dir (%1,30); TOBB ortak değildir."}, {"q": "Borsa İstanbul'un 423.234.000 TL olan kuruluş sermayesi, her biri 1 kuruş nominal değerli kaç adet paya bölünmüştür?", "o": ["42.323.400.000", "423.234.000", "4.232.340.000", "42.323.400", "423.234.000.000"], "a": 0, "e": "423.234.000 TL bölü 0,01 TL eşittir 42.323.400.000 adet pay."}, {"q": "Borsa İstanbul'un esas sözleşmesinin tescil tarihi ve bu tescille tüzel kişiliği sona eren kurumlar hangi seçenekte doğru verilmiştir?", "o": ["03/04/2013 – İMKB ve VOB", "19/10/2014 – İMKB ve İstanbul Altın Borsası", "19/07/2013 – İMKB ve Takasbank", "30/12/2012 – İMKB ve VOB", "03/04/2013 – İMKB ve İstanbul Altın Borsası"], "a": 4, "e": "03/04/2013 tescil ile İMKB ve İAB'nin tüzel kişiliği sona ermiştir; VOB'un payları ise sonradan devralınmıştır."}, {"q": "Borsa İstanbul yönetim kurulu ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Genel kurul tarafından seçilen 9 üyeden oluşur", "En az 3 üyesi bağımsızdır", "Üyelerin görev süresi 4 yıldır", "Bağımsız üyelerden en az biri kadın olmalıdır", "Üyelerin en az üçte biri 10 yıllık sermaye piyasası deneyimine sahip olmalıdır"], "a": 2, "e": "Yönetim kurulu üyelerinin görev süresi 3 yıldır ve yeniden seçilebilirler."}, {"q": "Olağan genel kurul, faaliyet dönemi sonundan itibaren en geç ne kadar süre içinde toplanır?", "o": ["3 ay", "1 ay", "6 ay", "2 ay", "9 ay"], "a": 0, "e": "Olağan genel kurul her faaliyet dönemi sonundan itibaren üç ay içinde toplanır."}, {"q": "Borsa İstanbul Denetim Komitesi için aşağıdakilerden hangisi doğrudur?", "o": ["En az 3 üyeden oluşur ve çoğunluğu icracı olmayan üyedir", "1 başkan ve 2 üyeden oluşur", "Yönetim kurulu üyesi olmayan uzmanlar da üye olabilir", "Görevi borsa işlemlerinden doğan uyuşmazlıkları incelemektir", "En az 2 üyeden oluşur ve üyelerinin tamamı bağımsız yönetim kurulu üyesidir"], "a": 4, "e": "Denetim Komitesi en az iki üyeden oluşur ve tüm üyeleri bağımsız YK üyesidir. 1 başkan + 2 üye yapısı uyuşmazlık ve disiplin komitelerine aittir."}, {"q": "Aşağıdakilerden hangisi Borsa İstanbul bünyesinde kurulan komitelerden biri değildir?", "o": ["Riskin Erken Saptanması Komitesi", "Kurumsal Yönetim Komitesi", "Rekabet Komitesi", "Sermaye Piyasası Araçları Disiplin Komitesi", "Sermaye Piyasası Araçları Uyuşmazlık Komitesi"], "a": 2, "e": "BİAŞ'ta rekabet komitesi yoktur; sayılan diğer komiteler yönetim kuruluna yardımcı olmak üzere kurulmuştur."}, {"q": "Borsa yönetim kurulunun uyuşmazlık kararına karşı SPK'ya itiraz ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Her tutarda 30 gün içinde doğrudan SPK'ya itiraz edilir", "İtiraz yalnızca yatırımcı tarafından yapılabilir", "SPK kararına karşı yalnızca adli yargıya gidilebilir", "Tutar yasal sınırı aşıyorsa tebliğden itibaren 15 gün içinde Borsa aracılığıyla SPK'ya itiraz edilir", "İtiraz süresi işlem tarihinden itibaren başlar"], "a": 3, "e": "Uyuşmazlık tutarı yeniden değerlemeyle artırılan sınırı (2025 için 1.645.665 TL) aşıyorsa taraflar 15 gün içinde Borsa aracılığıyla SPK'ya itiraz eder; SPK kararına karşı idari yargıya gidilir."}, {"q": "Uyuşmazlık tutarı 1.200.000 TL olan bir dosyada Borsa yönetim kurulu 2025 yılında karar vermiştir. Bu karara ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Taraflar 15 gün içinde SPK'ya itiraz edebilir", "Tutar 1.645.665 TL sınırının altında kaldığı için SPK'ya itiraz yolu açık değildir", "Taraflar 30 gün içinde SPK'ya itiraz edebilir", "Karar SPK onayı olmadan kesinleşmez", "İtiraz Takasbank aracılığıyla yapılır"], "a": 1, "e": "SPK'ya itiraz, tutarın 2025 için 1.645.665 TL olan sınırın üzerinde olması şartına bağlıdır; 1,2 milyon TL bu sınırın altındadır."}, {"q": "Uyuşmazlık başvurusu ve hizmet bedeli ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["İlk işlemden itibaren 2 yıl içinde yapılmayan başvuru incelenmez", "Usule aykırılık giderilmezse başvuru yapılmamış sayılır ve bedel iade edilir", "Şikâyetten vazgeçilmesi hâlinde ödenen bedel başvuru sahibine iade edilir", "Başvuran haklı çıkarsa bedel karşı taraftan alınarak iade edilir", "Taraflar sulh olursa durum 3 iş günü içinde Borsaya bildirilir"], "a": 2, "e": "Şikâyetten vazgeçme, tahkim veya yargı yoluna gitme ve sulh hâllerinde bedel iade edilmez, Borsaya gelir kaydedilir."}, {"q": "İşlem yapma yetkisi verilenlere uygulanabilecek para cezasının alt ve üst sınırları hangisidir?", "o": ["10.000 TL – 5.000.000 TL", "50.000 TL – 5.000.000 TL", "10.000 TL – 1.000.000 TL", "5.000 TL – 500.000 TL", "100.000 TL – 10.000.000 TL"], "a": 0, "e": "Para cezası 10.000 TL'den 5.000.000 TL'ye kadardır; sosyal medya yoluyla yanıltıcı yorum ve yönlendirme fiillerinde ise en az 50.000 TL uygulanır."}, {"q": "Aşağıdaki fiillerden hangisi işlem yapma yetkisinin iptalini gerektirir?", "o": ["Borsa personeline görevi sırasında hakaret etmek", "Borsa dâhilinde genel nezaket kurallarına aykırı davranmak", "Borsa imajını zedeleyici asılsız beyanda bulunmak", "Borsaya ait belge ve kayıtları menfaat sağlamak amacıyla tahrif etmek", "Borsaya sarhoş gelmek"], "a": 3, "e": "Belge ve kayıtları tahrif etmek veya yok etmek iptal gerektirir. Personele hakaret geçici kaldırma, nezaket ihlali uyarı, asılsız beyan kınama, sarhoş gelmek para cezası gerektirir."}, {"q": "Disiplin soruşturması ve cezasında zamanaşımı ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Fiilin öğrenilmesinden itibaren 2 yıl içinde soruşturmaya başlanabilir", "Fiilin gerçekleştiği tarihten itibaren 3 yıl geçtikten sonra disiplin cezası verilemez", "YK karar tarihinden itibaren 5 yıl içinde uygulanamayan ceza düşer", "Fiil suç teşkil etse bile disiplin zamanaşımı süreleri değişmez", "Adli soruşturma başlatılmışsa disiplin soruşturması yapılamaz"], "a": 1, "e": "Soruşturma öğrenmeden 1 yıl, fiilden 2 yıl içinde başlamalı; fiilden 3 yıl sonra ceza verilemez; uygulanamayan ceza 3 yılda düşer; suç hâlinde daha uzun kanuni zamanaşımı uygulanır."}, {"q": "Mali durumu zayıflayan bir üyenin işlem yapma yetkisini tedbiren kaldırma yetkisi ve azami süresi hangisidir?", "o": ["Yönetim Kurulu – 1 aya kadar", "Genel Müdür – 1 aya kadar", "SPK – 5 işlem gününe kadar", "Disiplin Komitesi – 3 aya kadar", "Genel Müdür – 5 işlem gününe kadar"], "a": 4, "e": "Genel Müdür yetkiyi beş işlem gününe kadar tedbiren kaldırabilir ve durumu Kurula bildirir."}, {"q": "TCMB'nin Borsa İstanbul piyasalarındaki konumu ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["İşlem yapmaya yetkilidir", "Teminat yükümlülüğüne tabidir", "Disiplin hükümlerine tabi değildir", "Borsa payından muaftır", "Kota alma ve kotta kalma ücretlerinden muaftır"], "a": 1, "e": "TCMB üyeliğe kabul, yetki, teminat, denetim ve disiplin yükümlülüklerine tabi değildir; ücret ve borsa payından da muaftır."}, {"q": "Bir payın Borsada işlem görmesini geçici olarak durdurma yetkisi ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Genel Müdür en fazla 3 ay durdurabilir", "Durdurma kararı yalnızca SPK tarafından verilebilir", "Durdurma KAP'ta gerekçe gösterilmeden duyurulur", "Genel Müdür en fazla 1 ay durdurabilir; daha uzun süre için Yönetim Kurulu kararı gerekir", "Yönetim Kurulu en fazla 5 iş günü durdurabilir"], "a": 3, "e": "Genel Müdür bir aya kadar durdurabilir; bir ayı aşan süreler YK kararı gerektirir. Durdurma gerekçesiyle KAP'ta duyurulur ve Kurula bildirilir."}, {"q": "Bir üyenin hatalı emri sonucu gerçekleşen işlemi iptal etmeye aşağıdakilerden hangisi ayrıca yetkilidir?", "o": ["İlgili Piyasa Müdürü", "SPK Başkanı", "Takasbank Genel Müdürü", "Uyuşmazlık Komitesi", "Denetim Komitesi"], "a": 0, "e": "Hatalı emirden kaynaklanan işlemleri Genel Müdür ve görevli Genel Müdür Yardımcılarına ek olarak ilgili Piyasa Müdürü de iptal edebilir; iptal aynı gün KAP'ta ilan edilir."}, {"q": "Borsa, IOSCO ilkelerine uyumlu finansal ölçüt listesini ve uyum beyanını en az hangi sıklıkla güncelleyip duyurur?", "o": ["Ayda 1 kez", "Üç ayda 1 kez", "İki yılda 1 kez", "Beş yılda 1 kez", "Yılda 1 kez"], "a": 4, "e": "Uyum beyanı ve uyumlu finansal ölçütler listesi yılda en az bir kez güncellenerek kamuya duyurulur."}, {"q": "Finansal ölçüt hesaplama süreçlerine ilişkin kayıtlar en az ne kadar süre saklanır?", "o": ["3 yıl", "8 yıl", "5 yıl", "10 yıl", "2 yıl"], "a": 2, "e": "Borsa, finansal ölçüt hesaplama süreçlerine ilişkin tüm kayıtları en az beş yıl saklar."}]}, {"id": 2, "kisa": "Pay Piyasası: araç ve pazar", "baslik": "Pay Piyasası: İşlem Gören Araçlar, Birincil Piyasa ve Pazar Yapısı", "ozet": "Pay Piyasasında işlem gören araçlar, halka arzda sürekli işlem ve talep toplama yöntemleri, pazarları belirleme kriterleri, pazarlara göre işlem esasları ile toptan alış satış, yeni pay alma hakkı ve resmî müzayede.", "notlar": "<h3>Pay Piyasasında işlem gören araçlar<\/h3>\n<p>Yönetim Kurulunun işlem görmesine karar verdiği araçlar işlem görür; pazar ve platform bilgisi işlemler başlamadan önce <b>KAP<\/b>'ta ilan edilir.<\/p>\n<table>\n<tr><th>Araç<\/th><th>Tanım ve kritik kurallar<\/th><\/tr>\n<tr><td>Pay<\/td><td>Anonim ortaklık sermaye payını temsil eden kıymetli evrak niteliğinde menkul kıymet; sahibi şirkete ortaktır.<\/td><\/tr>\n<tr><td>Yeni pay alma hakkı (YPAH, rüçhan)<\/td><td>Bedelli sermaye artırımına mevcut ortakların öncelikle katılma hakkı; kullanım süresi içinde ayrı işlem sırası açılır.<\/td><\/tr>\n<tr><td>Borsa yatırım fonu (BYF)<\/td><td>Bir endeksi baz alıp performansını yansıtmayı amaçlayan, katılma payları borsada işlem gören, PYŞ'lerin içtüzükle kurduğu tüzel kişiliksiz malvarlığı. Katılma payı ayni (sepet) ya da nakit teslimle oluşturulur ve iade edilir.<\/td><\/tr>\n<tr><td>Yatırım kuruluşu varantı<\/td><td>Dayanak varlığı belirli fiyattan belirli tarihte/tarihe kadar alma veya satma hakkı veren, kaydi teslimat veya nakit uzlaşı ile kullanılan menkul kıymetleştirilmiş opsiyon. Avrupa ve Amerikan tipi, alım (call) ve satım (put) varantları işlem görür. İhraççı, dayanak, vade, kullanım fiyatı ve türü aynı olanlar aynı sırada işlem görür; her ISIN ayrı sıradır. VII-128.3 Tebliği.<\/td><\/tr>\n<tr><td>Yatırım kuruluşu sertifikası<\/td><td>Önceden belirlenmiş koşullar oluşunca alacak hakkı veren yapılandırılmış ürün (turbo, iskontolu, endeks sertifikası). İhraççının mali yükümlülüğüdür; ihraççının kredibilitesi önemlidir. YÜFP'de işlem görür.<\/td><\/tr>\n<tr><td>Sahipliğe dayalı kira sertifikası<\/td><td>Varlık Kiralama Şirketi (VKŞ) tarafından kaynak kuruluştan devralınacak varlıkların finansmanı için ihraç edilir. İhraç tutarı varlığın gerçeğe uygun değerinin belirli oranını aşamaz; gayrimenkulde kaynak kuruluş isterse geri alım hakkı tapuya şerh edilir. <b>Halka arz edilen kira sertifikasının borsada işlem görmesi zorunludur.<\/b><\/td><\/tr>\n<tr><td>Gayrimenkul sertifikası (GMS)<\/td><td>İnşa edilecek veya edilmekte olan projenin belirli bağımsız bölümlerini ya da alan birimini temsil eden, nominal değeri eşit araç. SPK onay başvurusuyla <b>eş zamanlı<\/b> Borsaya başvuru zorunlu. Yurt içinde/dışında halka arzla veya nitelikli yatırımcıya satışla ihraç edilebilir.<\/td><\/tr>\n<tr><td>Gayrimenkul yatırım fonu (GMF)<\/td><td>Nitelikli yatırımcılardan toplanan para ve gayrimenkullerle kurulan, süreli veya süresiz, tüzel kişiliksiz malvarlığı (III-52.3).<\/td><\/tr>\n<tr><td>Girişim sermayesi yatırım fonu (GSF)<\/td><td>Nitelikli yatırımcılardan toplanan para veya iştirak paylarıyla, <b>süreli<\/b> olarak kurulan malvarlığı (III-52.4).<\/td><\/tr>\n<tr><td>Emtia sertifikası (EMS)<\/td><td>SPK'nın belirlediği emtiayı (altın, gümüş vb.) temsilen ihraç edilir; spot emtiaya yatırım alternatifi. Kota alınarak <b>S1<\/b> koduyla <b>Emtia Pazarında<\/b>, yalnız nitelikli yatırımcıya ihraç edilenler <b>GSP<\/b>'de işlem görür. <b>Darphane sertifikası<\/b>, Darphane ve Damga Matbaası Genel Müdürlüğünün ihraç ettiği emtia sertifikasıdır.<\/td><\/tr>\n<\/table>\n<h4>BYF işlem kuralları<\/h4>\n<table>\n<tr><th>Kural<\/th><th>Değer<\/th><\/tr>\n<tr><td>İşlem başlangıcı<\/td><td>Bilgilerin ve YK kararının KAP'ta ilanını izleyen <b>2. iş günü<\/b><\/td><\/tr>\n<tr><td>Özellik kodu<\/td><td><b>.F<\/b><\/td><\/tr>\n<tr><td>Lot<\/td><td><b>1 adet<\/b> katılma payı; küsurat emir iletilemez<\/td><\/tr>\n<tr><td>Fiyat marjı<\/td><td><b>±%20<\/b><\/td><\/tr>\n<tr><td>Baz fiyat<\/td><td>Paylardaki gibi; ilk seansta ve fiyat oluşmayan seansı izleyen seansta kurucu/yetkili katılımcının ilan ettiği birim pay değeri<\/td><\/tr>\n<tr><td>Birim pay değeri<\/td><td>En az <b>1 TL<\/b><\/td><\/tr>\n<tr><td>Takas<\/td><td><b>T+2<\/b>; pay oluşturma ve geri alma Takasbank aracılığıyla<\/td><\/tr>\n<tr><td>Saklama<\/td><td>Portföydeki araçlar Takasbank'ta ve/veya MKK'da Takasbank altında açılan hesapta<\/td><\/tr>\n<tr><td>Fon değeri ilanı<\/td><td>Kurucu, seans saatlerinde kendi sitesinde ve <b>en az iki veri yayın kuruluşu<\/b> ekranında günceller; aksaklıkta kamuoyunu derhâl bilgilendirir<\/td><\/tr>\n<\/table>\n\n<h3>Birincil piyasa (halka arz)<\/h3>\n<ul>\n<li>Halka arz duyurusu, Borsa başvurusu uygun görülürse işlem tarihinden <b>en az 2 iş günü önce<\/b> KAP'ta ilan edilir.<\/li>\n<li>Payları işlem gören şirkette rüçhan kullanımından <b>arta kalan payların<\/b> satış duyurusu satıştan <b>en az 1 işlem günü önce<\/b> KAP'ta ilan edilir.<\/li>\n<li>Kodlar: talep toplama yöntemiyle halka arz <b>.HE<\/b>; sürekli işlemle halka arz ve arta kalan paylar <b>.BE<\/b>.<\/li>\n<li>Kurul izni hariç birincil piyasada paylar <b>nominal değerin (1 TL) altında<\/b> işlem göremez.<\/li>\n<li>GSP'de işlem görecek payların halka arz edilmeksizin nitelikli yatırımcıya ilk satışı da, izahnamede belirtilmesi ve Borsanın uygun görmesiyle Borsada yapılabilir.<\/li>\n<li>İlk halka arzlarda yöntemler: <b>sürekli işlem<\/b>, <b>sabit fiyat<\/b> ve <b>değişken fiyat<\/b>. Son ikisi Borsa dışındaki talep toplama yönteminden uyarlanmıştır.<\/li>\n<\/ul>\n<h4>Sürekli işlem yöntemi<\/h4>\n<ul>\n<li>Halka arzın <b>2 günde<\/b> tamamlanması esastır; üye daha uzun satış da talep edebilir. 2 gün talep edildiyse süre <b>uzatılamaz<\/b>. (SPK ve BİAŞ YK'nın 2010 kararlarıyla Borsada satış yöntemli halka arzlar 2 iş günü ile sınırlandırılmıştır.)<\/li>\n<li>İlk gün baz fiyatı: izahnamedeki halka arz fiyatının <b>en yakın fiyat adımına yuvarlanmış<\/b> hâli. Alt-üst sınırlarda ikincil piyasa marjları uygulanır; 2 günden uzun satışta her seans ilk günün baz fiyatı kullanılır.<\/li>\n<li>Halka arz sürerken <b>ikincil piyasa işlemleri başlatılamaz<\/b>. Satış bitince YK kararıyla ilgili pazarda işlem başlar.<\/li>\n<li>İkincil piyasadaki ilk seansın baz fiyatı: birincil piyasadaki <b>son seansın kapanış fiyatı<\/b>.<\/li>\n<li>İlk defa işlem görecek payların birincil piyasasında <b>özel işlem bildirimi yapılamaz<\/b>.<\/li>\n<\/ul>\n<h4>Talep toplama yöntemleri (SFY ve DFY)<\/h4>\n<ul>\n<li>İki aşama: <b>talep toplama<\/b> ve <b>dağıtım<\/b>. Emir toplama süresi <b>en az 1, en fazla 3 iş günü<\/b>dür; süreyi şirketin talebiyle BİAŞ YK belirler. Önceden duyurulmuşsa süre sonu beklenmeden (ör. 1. veya 2. gün sonunda) dağıtım yapılabilir.<\/li>\n<li>Birden fazla hesabı olan yatırımcının talebi yatırımcı bazında konsolide edilip <b>tek hesaptan<\/b> iletilir (2020/62 Duyuru).<\/li>\n<li>Emirler <b>MKK sicil numarası<\/b> ile yatırımcı bazında tekleştirilir: aynı sicile ait emirlerden yalnız öncelikli <b>ilk emre<\/b> dağıtım yapılır. Sicil numarası olmayan hesaplardan ve <b>müşterek hesaplardan<\/b> gelen emirler dağıtıma girmez. GSP ihraçlarında MKK'da nitelikli yatırımcı tanımlı olmayan hesaplar dağıtıma girmez.<\/li>\n<li>Her emre fiyat ve zaman önceliğine göre sırayla <b>birer lot<\/b> dağıtılır; işlemler dağıtım bitince gerçekleşir. Dağıtım, talep toplamanın bittiği gün <b>18:15 sonrası<\/b> başlar.<\/li>\n<li>Ortak kurallar: yalnız <b>iptale kadar geçerli limit fiyatlı alış<\/b> emri; emir seans içinde istenince iptal edilebilir; yalnız fiyat ve miktar değiştirilebilir; <b>hesap numarası düzeltmesi yapılamaz<\/b>; maksimum emir değerini PPD belirler.<\/li>\n<li>Takas: dağıtım günü T olmak üzere <b>T+2<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th><\/th><th>Sabit Fiyat Yöntemi (SFY)<\/th><th>Değişken Fiyat Yöntemi (DFY)<\/th><\/tr>\n<tr><td>Fiyat<\/td><td>Şirketin duyurduğu <b>tek fiyat<\/b>; farklı fiyatlı emir reddedilir; fiyat değiştirilemez<\/td><td>Duyurulan <b>fiyat aralığında<\/b> (sınırlar dâhil); fiyat aralık içinde değiştirilebilir<\/td><\/tr>\n<tr><td>Öncelik<\/td><td>Yalnız <b>zaman önceliği<\/b><\/td><td>Fiyat ve zaman önceliği<\/td><\/tr>\n<tr><td>Denge veya az talep<\/td><td>Her emir tam karşılanır<\/td><td>Halka arz fiyatı <b>en düşük alış fiyat seviyesi<\/b> olur; tüm emirler bu fiyattan karşılanır<\/td><\/tr>\n<tr><td>Fazla talep<\/td><td>Zaman önceliğine göre birer lot dağıtım<\/td><td>Arzın tamamının karşılandığı fiyat seviyesi halka arz fiyatı olur; bu fiyat ve üzerindeki emirlerin tamamı dağıtıma katılır, birer lot dağıtılır; altındaki emirler dikkate alınmaz<\/td><\/tr>\n<\/table>\n<ul><li>Dikkat: DFY'de fazla talepte ilk girilen ve halka arz fiyatının üzerindeki emir bile birer lot dağıtım nedeniyle tamamen karşılanmayabilir.<\/li><\/ul>\n<table>\n<tr><th>Ekran/yayın<\/th><th>Emir toplama aşaması<\/th><th>Dağıtım sonrası<\/th><\/tr>\n<tr><td>Emir baz, fiyat baz, gerçekleşen işlemler<\/td><td>Kapalı<\/td><td>Açık<\/td><\/tr>\n<tr><td>Emir defteri, emir geçmişi<\/td><td>Açık<\/td><td>Açık<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Birincil piyasa uygulaması<\/th><th>Yöntem<\/th><th>Seans (tam gün)<\/th><\/tr>\n<tr><td>İşlem görmeyen ortaklık paylarının halka arzı<\/td><td>SFY, DFY, sürekli işlem<\/td><td>10:30 – 13:00<\/td><\/tr>\n<tr><td>Rüçhan kullanımından kalan payların satışı<\/td><td>Sürekli işlem<\/td><td>10:30 – 13:00<\/td><\/tr>\n<tr><td>SFY/DFY talep toplama ve dağıtım<\/td><td><\/td><td>Talep 10:30 – 13:00; dağıtım 18:15 (+)<\/td><\/tr>\n<\/table>\n<h4>İşlem gören ortaklıkların birincil piyasası<\/h4>\n<ul>\n<li>Kullanılmayan rüçhan haklarından kalan paylar ve rüçhanı kısıtlanarak artırılan sermayeyi temsil eden paylar SPK kaydıyla Borsada halka arz edilebilir.<\/li>\n<li>Satış emrini <b>yalnız halka arza aracılık eden üye<\/b> verebilir; buradan alınan paylar birincil piyasada <b>yeniden satılamaz<\/b>.<\/li>\n<li>Rüçhandan kalan payların satışında <b>baz fiyat ve fiyat marjı uygulanmaz<\/b>; özel emir kuralları kaldırılmıştır, özel işlem bildirimi de yapılmaz.<\/li>\n<li>GSP'deki ortaklıkların artırımından kalan payları <b>yalnız nitelikli yatırımcılar<\/b> alabilir.<\/li>\n<\/ul>\n<h4>Fiyat istikrarını sağlayıcı işlemler<\/h4>\n<ul><li>Pay Tebliği (VII-128.1) m.11 çerçevesinde; <b>halka arz fiyatının üzerinde alım emri verilemez<\/b>. Borsa fiyatı halka arz fiyatının altına düşerse satışa aracılık eden üye alım yapabilir; işlemler <b>ayrı bir hesapta<\/b> izlenir ve bu hesap numarası kullanılır.<\/li><\/ul>\n\n<h3>İkincil piyasa: pazar yapısı<\/h3>\n<p>Pazarlar: <b>Yıldız Pazar, Ana Pazar, Alt Pazar, Yakın İzleme Pazarı (YİP), Piyasa Öncesi İşlem Platformu (PÖİP), Yapılandırılmış Ürünler ve Fon Pazarı (YÜFP), Girişim Sermayesi Pazarı (GSP), Emtia Pazarı<\/b>. Başvuru, kabul ve çıkarılma hususları Kotasyon Yönergesinde düzenlenir.<\/p>\n<h4>Pazarları belirleme kriterleri<\/h4>\n<table>\n<tr><th>Kriter<\/th><th>Yıldız Pazar<\/th><th>Ana Pazar<\/th><\/tr>\n<tr><td>Piyasa değeri (PD)<\/td><td>&gt; 6 milyar TL<\/td><td>&gt; 1 milyar TL<\/td><\/tr>\n<tr><td>Fiili dolaşımdaki payların piyasa değeri (FDPD)<\/td><td>&gt; 1 milyar TL<\/td><td>&gt; 400 milyon TL<\/td><\/tr>\n<tr><td>Fiili dolaşım oranı (FDO)<\/td><td>&gt; %10<\/td><td>&gt; %10<\/td><\/tr>\n<tr><td>İmtiyaz<\/td><td>İmtiyaz varsa FDO &lt; %90<\/td><td>İmtiyaz varsa FDO &lt; %90<\/td><\/tr>\n<tr><td>Yerli fon<\/td><td>&gt; 30 milyon TL<\/td><td>Aranmaz<\/td><\/tr>\n<tr><td>Likidite<\/td><td>&lt; 0,15<\/td><td>&lt; 0,5<\/td><\/tr>\n<tr><td>İstisna (FDO &gt; %5 olmak şartıyla)<\/td><td>FDPD &gt; 3 milyar TL ve likidite &lt; 0,1<\/td><td>Alt Pazardan: temettü getirisi &gt; %10 ve FDPD &gt; 450 milyon TL; veya FDPD &gt; 750 milyon TL ve likidite &lt; 0,2<\/td><\/tr>\n<\/table>\n<ul>\n<li>Her pay bulunduğu pazarın <b>tüm kriterlerini<\/b> sağlamalıdır; istisnalar yukarıdaki satırdadır (bu hâllerde diğer kriterlere bakılmaz). Alt Pazar için ayrıca eşik yoktur; diğerlerine girmeyen paylar oradadır.<\/li>\n<li>Bir dönemde Yıldız'dan Alt'a veya Alt'tan Yıldız'a geçme şartını sağlayan pay, bir sonraki dönem yeniden değerlendirilmek üzere <b>Ana Pazar<\/b>'a alınır.<\/li>\n<li><b>Genel Müdür<\/b>, tedbirleri ve incelemeleri dikkate alarak payı değerlendirme dışı bırakabilir veya pazarını değiştirmeyebilir.<\/li>\n<li><b>FDPD<\/b> = dönem sonu FD pay adedi × bir yıllık düzeltilmiş kapanış fiyatları ortalaması. <b>PD<\/b> tüm sermaye üzerinden hesaplanır.<\/li>\n<li><b>Yerli fon:<\/b> MKK verilerine göre SPK denetimindeki yatırım ve emeklilik fonlarının portföyündeki kısmın son 1 yıllık ortalama piyasa değeri.<\/li>\n<li><b>Likidite kriteri<\/b> (Amihud illikidite ölçüsü): günlük fiyat değişiminin (yüzde) mutlak değerinin o günkü işlem hacmine oranlarının aritmetik ortalaması × 1.000.000; yani 1 milyon TL hacmin yarattığı ortalama fiyat değişimi. Özel işlem bildirimleri hacme dâhil edilmez. <b>Düşük değer = daha likit<\/b>.<\/li>\n<li><b>Temettü getirisi<\/b> (ek kriter) = son 3 yıllık net nakit temettü toplamı / dönem sonu PD × 100.<\/li>\n<li><b>İmtiyaz:<\/b> YK üyesi seçme veya aday gösterme, kâr payı, tasfiye payı, rüçhan, oy gibi haklarda bir paya üstün hak tanınması; imtiyaz sayılıp sayılmayacağına Borsa Genel Müdürlüğü karar verir.<\/li>\n<li>FDO'su <b>%5'in altında<\/b> olan şirketler PÖİP'e alınabilir.<\/li>\n<li>SPK'nın 05.06.2026 tarihli kararıyla, FDO hesabı dışında tutulan payların sahiplerinin serbest veya özel fon katılma payları nedeniyle o fondaki payı oranında düşen ihraççı payları da FD dışında sayılır; FD pay adedi ve oranı 15.06.2026'dan itibaren <b>MKK<\/b> tarafından günlük hesaplanır.<\/li>\n<\/ul>\n<h4>Değerlendirme esasları<\/h4>\n<ul>\n<li>Endeks dönemleriyle uyumlu, <b>yılda en az 2 kez<\/b>, verilerin <b>son 1 yıllık ortalamaları<\/b> ile yapılır.<\/li>\n<li>Yeni işlem görmeye başlayan şirketler ilk <b>3 ay<\/b> içindeki değerlendirmelere alınmaz; ilk değerlendirmede ilk <b>10 iş gününün<\/b> verisi likidite hesabına girmez.<\/li>\n<li>Birleşme ve bölünmede pay dağıtımı sonrası veriler kullanılır; birden fazla pay grubunda FDPD her grup için ayrı hesaplanır.<\/li>\n<\/ul>\n<h4>Pazarlarda uygulanan işlem esasları<\/h4>\n<table>\n<tr><th>Esas<\/th><th>Yıldız<\/th><th>Ana<\/th><th>Alt<\/th><th>YİP<\/th><th>PÖİP<\/th><\/tr>\n<tr><td>İşlem yöntemi<\/td><td>Sürekli<\/td><td>Sürekli<\/td><td>Sürekli<\/td><td>5 kez tek fiyat<\/td><td>5 kez tek fiyat<\/td><\/tr>\n<tr><td>Açığa satış ve kredili işlem<\/td><td>Var<\/td><td>Var<\/td><td>Yok<\/td><td>Yok<\/td><td>Yok<\/td><\/tr>\n<tr><td>Brüt takas<\/td><td>Yok<\/td><td>Yok<\/td><td>Var<\/td><td>Var<\/td><td>Var<\/td><\/tr>\n<tr><td>Özkaynak oranı<\/td><td>%90<\/td><td>%75<\/td><td>%0<\/td><td>%0<\/td><td>%0<\/td><\/tr>\n<tr><td>Açık takas pozisyonu/özkaynak<\/td><td>%20<\/td><td>%50<\/td><td>%100<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>Fiyat marjı<\/td><td>±%20<\/td><td>±%15<\/td><td>±%10<\/td><td>±%10<\/td><td>±%10<\/td><\/tr>\n<tr><td>Açığa satışta yukarı adım kuralı<\/td><td>Yok<\/td><td>Var<\/td><td>-<\/td><td>-<\/td><td>-<\/td><\/tr>\n<tr><td>Devre kesici tetikleme oranı<\/td><td>%10<\/td><td>%7,5<\/td><td>%5<\/td><td>-<\/td><td>-<\/td><\/tr>\n<tr><td>Tek fiyat emir toplamada bilgi yayını kısıtı<\/td><td>Yok<\/td><td>Yok<\/td><td>Var<\/td><td>Var<\/td><td>Var<\/td><\/tr>\n<tr><td>Açılışta piyasa ve piyasadan limite emir<\/td><td>Var<\/td><td>Var<\/td><td>Yok<\/td><td>Yok<\/td><td>Yok<\/td><\/tr>\n<\/table>\n<ul>\n<li>Açılış seansının son 5 dakikasında emir iptali, fiyat kötüleştirme ve miktar azaltma hiçbir pazarda <b>yapılamaz<\/b>.<\/li>\n<li><b>Özkaynak oranı:<\/b> payın kredili alım, açığa satış ve ödünç işlemlerinde özkaynak olarak hangi orana kadar kabul edileceği. <b>Açık takas pozisyonu/özkaynak:<\/b> takas gerçekleşene kadar asgari bulundurulacak özkaynak oranı.<\/li>\n<li><b>İş Bankası (A), (B) ve Kurucu<\/b> payları (ISATR, ISBTR, ISKUR) 5 kez tek fiyatla işlem görür; kredili alım ve açığa satış yapılamaz; açık takas pozisyonu/özkaynak %100, özkaynak oranı %0; açılışta piyasa ve piyasadan limite emir kullanılamaz. <b>ISKUR<\/b>'da fiyat marjı <b>±%50<\/b>.<\/li>\n<li>Teminatsız alım emri kabulüne ilişkin Kurul istisnaları yalnız <b>Yıldız Pazar<\/b> paylarına uygulanır; kolektif yatırım kuruluşları ve emeklilik fonları için <b>Ana Pazar<\/b>'da da uygulanabilir.<\/li>\n<\/ul>\n<h4>Diğer pazarlar<\/h4>\n<ul>\n<li><b>YÜFP:<\/b> BYF, varant, sertifika, sahipliğe dayalı kira sertifikası, GMS, GMF ve GSF. Sürekli işlem yöntemine tabidir; piyasa yapıcılı sürekli işlem ve tek fiyat \"Piyasa Yapıcılık\" esaslarına göre uygulanır. Yorum ve karar yetkisi Genel Müdürdedir.<\/li>\n<li><b>Emtia Pazarı:<\/b> emtia sertifikalarının işlem gördüğü pazar.<\/li>\n<li><b>YİP:<\/b> olağan dışı durumlar, kamuyu aydınlatmada özensizlik veya kottan çıkarmaya varabilecek gelişmeler nedeniyle izlemeye alınan şirketlerin payları için sürekli gözetim altında likidite sağlayan pazar. Payları <b>YK kararıyla<\/b> alınır; YK öncesinde uyarabilir ve süre verebilir.<\/li>\n<li><b>GSP:<\/b> halka açık olmayan ortaklıkların halka arz edilmeksizin nitelikli yatırımcıya ihraç ettiği paylar ile nitelikli yatırımcıya ihraç edilen YÜFP ve Emtia Pazarı araçları; <b>yalnız nitelikli yatırımcılar<\/b> (III-39.1) işlem yapabilir. Üye müşterisinin nitelikli olduğunu bilmek ve belgelemek zorundadır; aksi hâlde sorumluluk üyeye aittir. Paylar <b>Ana Pazar<\/b> işlem esaslarına tabidir; ilk gün baz fiyatı <b>ihraç fiyatı<\/b> esas alınarak belirlenir.<\/li>\n<li><b>PÖİP:<\/b> SPKn m.16/2 kapsamında halka açık sayılan ama payları borsada işlem görmeyen ortaklıklar için (SPK'nın 03/06/2011 kararı). Tek fiyat, günde <b>5 kez<\/b> fiyat belirlenir. İlk gün <b>serbest marj<\/b>la başlar, ilk işlemden sonraki tek fiyat emir toplamada önceki işlem fiyatı baz alınır. FDO'su %5 altında kalıp başka pazardan gelen paylar önceki son fiyattan oluşan baz fiyatla başlar. Brüt takasa tabi; açığa satış ve kredi yok. Bilgileri KAP'a zamanında gönderen şirketlerde rüçhan sırası açılır; rüçhan, birincil piyasa, resmî müzayede ve temerrütte sürekli işlem uygulanır.<\/li>\n<\/ul>\n\n<h3>Özellikli işlemler<\/h3>\n<h4>Toptan alış satış (TAS)<\/h4>\n<ul>\n<li>Payları borsada işlem gören veya satışını ÖİB yürüten ortaklıkların belirli miktarın üzerindeki pay işlemleri: sermaye artırımıyla ihraç edilecek paylar, mevcut ortakların paylarının tahsisli/toplu satışı ve halka arz edilmeksizin yapılan sermaye artırımı satışları.<\/li>\n<li>Amaç: büyük blok işlemlerin güven ve şeffaflık içinde organize piyasada yapılması. Bilgiler işlem öncesi ve sonrası Bültende ve/veya KAP'ta duyurulur.<\/li>\n<li><b>Asgari tutar 100 milyon TL<\/b> (tahsisli ve nitelikli yatırımcıya satış şeklindeki bedelli artırımlar hariç). ÖİB işlemlerinde asgari miktarı Borsa Genel Müdürlüğü belirler.<\/li>\n<li>Fiyat adımı <b>1 kuruş<\/b>. Takas Borsada ise mevcut sırada, Borsa dışında ise <b>.NSE<\/b> kodlu ayrı sırada yapılır; Borsa dışı takas için sorumluluğun taraflarda olması ve Genel Müdürlüğün uygun görmesi gerekir.<\/li>\n<\/ul>\n<h4>Yeni pay alma hakları (.R)<\/h4>\n<ul>\n<li>Sıra, rüçhan kullanımının <b>başlangıç günü<\/b> açılır; işlemler payın bulunduğu pazarda yapılır.<\/li>\n<li><b>1 lot<\/b> = toplam 1 TL nominal değerli payın rüçhan hakkı.<\/li>\n<li>İlk tescilli işlemin olduğu seansın sonuna kadar referans fiyat (son kapanış ve rüçhan başlangıç günündeki baz fiyat esas alınarak Genel Müdürlükçe) belirlenir. Sonraki günlerde baz fiyat son işlem fiyatıdır.<\/li>\n<li>Fiyat marjı fiyat tesciline kadar <b>serbest<\/b>, sonrasında <b>±%50<\/b>. Fiyat adımları paylardaki gibidir.<\/li>\n<li>Son işlem günü: rüçhan kullanım süresi sonundan önceki <b>5. iş günü<\/b>. Açılış ve kapanış seansı <b>düzenlenmez<\/b>.<\/li>\n<\/ul>\n<h4>Resmî müzayede<\/h4>\n<ul>\n<li>Mahkeme, icra dairesi ve diğer resmî dairelerin <b>yazılı başvurusu<\/b> üzerine Pay Piyasasında yapılan satışlar; yalnız Pay Piyasasında işlem gören araçlar için.<\/li>\n<li>Likiditeye göre mevcut sırada veya ayrı resmî müzayede sırasında; satışın <b>tek günde<\/b> tamamlanması esastır (sıra kapalıysa sonraki günler).<\/li>\n<li>Satışı, borçlunun hesabının bulunduğu ve haciz yükümlüsü yatırım kuruluşu yürütür. Faaliyeti durdurulmuş kuruluşların hesaplarındaki kıymetlerde Takasbank, MKK veya resmî kurum talep ederse satışı <b>PPD<\/b> yapar.<\/li>\n<\/ul>", "sorular": [{"q": "Borsa yatırım fonu katılma belgeleri, BYF'ye ilişkin bilgilerin ve Borsa YK kararının KAP'ta ilanını izleyen kaçıncı iş günü işlem görmeye başlar?", "o": ["1. iş günü", "2. iş günü", "3. iş günü", "5. iş günü", "10. iş günü"], "a": 1, "e": "BYF katılma belgeleri, bilgiler ve YK kararının KAP'ta ilanını izleyen ikinci iş günü işlem görmeye başlar."}, {"q": "Borsa yatırım fonları ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Lot büyüklüğü 1 adet katılma payıdır", "Birim pay değeri en az 1 TL olacak şekilde belirlenir", "İşlemlerin takası T+2'de gerçekleşir", "Küsurat emir iletilemez", "Fiyat marjı ±%10'dur"], "a": 4, "e": "BYF'lerde fiyat marjı ±%20'dir."}, {"q": "Halka arz edilen sahipliğe dayalı kira sertifikaları ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Yalnızca Girişim Sermayesi Pazarında işlem görürler", "Borsada işlem görmeleri ve bu amaçla Borsaya başvurulması zorunludur", "Varlık kiralama şirketinin temerrüt hâlinde varlık üzerinde tasarruf yetkisi bulunmaz", "İhraç tutarı varlığın gerçeğe uygun değerini sınırsız aşabilir", "Kredili alım ve açığa satış işlemlerine konu olabilirler"], "a": 1, "e": "Halka arz edilecek kira sertifikalarının borsada işlem görmesi ve bunun için başvuru zorunludur; VKŞ temerrütte varlık üzerinde doğrudan tasarruf yetkisine sahip olmalıdır."}, {"q": "Yalnızca nitelikli yatırımcılara ihraç edilen emtia sertifikaları Borsada hangi pazarda işlem görür?", "o": ["Emtia Pazarı", "Yapılandırılmış Ürünler ve Fon Pazarı", "Piyasa Öncesi İşlem Platformu", "Girişim Sermayesi Pazarı", "Alt Pazar"], "a": 3, "e": "Emtia sertifikaları S1 koduyla Emtia Pazarında, yalnızca nitelikli yatırımcıya ihraç edilenler ise Girişim Sermayesi Pazarında işlem görür."}, {"q": "Borsada sürekli işlem yöntemiyle yapılan ilk halka arzda izahnamedeki halka arz fiyatı 128,37 TL'dir. Birincil piyasadaki ilk gün baz fiyatı kaç TL olur?", "o": ["128,40", "128,37", "128,30", "128,35", "128,50"], "a": 0, "e": "Baz fiyat, halka arz fiyatının en yakın fiyat adımına yuvarlanmasıyla bulunur. 100–249,999 TL aralığında adım 0,10 TL olduğundan 128,37 en yakın adım olan 128,40'a yuvarlanır."}, {"q": "Borsada sürekli işlem yöntemiyle halka arz edilen payların ikincil piyasadaki ilk seansında baz fiyat nasıl belirlenir?", "o": ["İzahnamedeki halka arz fiyatı alınır", "Birincil piyasadaki ağırlıklı ortalama fiyat alınır", "Serbest marjla işlem görür, ilk işlem fiyatı baz olur", "Borsa Genel Müdürlüğünce belirlenen referans fiyat alınır", "Birincil piyasadaki son seansta oluşan kapanış fiyatı alınır"], "a": 4, "e": "İkincil piyasadaki ilk seansın baz fiyatı birincil piyasadaki son seansın kapanış fiyatıdır; fiyat sınırları bu baz fiyat üzerinden hesaplanır."}, {"q": "Borsa birincil piyasada talep toplama yöntemlerinde emir toplama süresi ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["En az 2, en fazla 5 iş günüdür", "Her durumda 2 iş günüdür ve uzatılamaz", "En az 1, en fazla 3 iş günüdür ve şirketin talebi üzerine BİAŞ Yönetim Kurulunca belirlenir", "Süre SPK tarafından belirlenir", "Süre sonu beklenmeden hiçbir şekilde dağıtım yapılamaz"], "a": 2, "e": "Emir toplama süresi 1–3 iş günüdür; önceden duyurulmuşsa süre sonu beklenmeden de dağıtım yapılabilir."}, {"q": "Talep toplama yöntemlerinde dağıtım ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Müşterek hesaplardan iletilen emirler de dağıtıma konu edilir", "Emirler MKK sicil numarası kullanılarak yatırımcı bazında tekleştirilir", "Aynı sicil numarasına sahip emirlerden yalnızca öncelikli ilk emre dağıtım yapılır", "Dağıtım, talep toplamanın bittiği gün saat 18:15 sonrası başlar", "Dağıtım her emre sırayla birer lot şeklinde yapılır"], "a": 0, "e": "Birden fazla MKK sicil numarasına bağlı müşterek hesaplardan ve sicil numarası olmayan hesaplardan gelen emirler dağıtıma konu edilmez."}, {"q": "Değişken fiyat yöntemiyle 1.000.000 lotluk halka arzda dağıtıma konu talepler şöyledir: 22,00 TL'den 300.000 lot, 21,80 TL'den 400.000 lot, 21,60 TL'den 500.000 lot, 21,40 TL'den 600.000 lot. Halka arz fiyatı kaç TL olur?", "o": ["21,80", "22,00", "21,40", "21,70", "21,60"], "a": 4, "e": "Fazla talepte arzın tamamının karşılandığı fiyat seviyesi halka arz fiyatıdır. Kümülatif talep 22,00'de 300 bin, 21,80'de 700 bin, 21,60'ta 1,2 milyon lota ulaşır; arz ilk kez 21,60'ta tamamen karşılanır."}, {"q": "Sabit fiyat yöntemi ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Emirler duyurulan fiyat aralığında girilir", "Emrin fiyatı talep toplama süresince değiştirilebilir", "Tek fiyat girilebildiği için yalnızca zaman önceliği geçerlidir", "Az talep durumunda en düşük alış fiyatı halka arz fiyatı olur", "Fazla talepte dağıtım fiyat önceliğine göre yapılır"], "a": 2, "e": "SFY'de şirketin duyurduğu tek fiyattan emir girilir, fiyat değiştirilemez ve yalnız zaman önceliği uygulanır. Fiyat aralığı DFY'ye özgüdür."}, {"q": "Payları Borsada işlem gören bir ortaklığın sermaye artırımında y
