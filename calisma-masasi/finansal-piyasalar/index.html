lden sonra 7 basamağa yuvarlanır", "Nakit temettü dağıtımlarında uyarlama yapılır"], "a": 4, "e": "Nakit temettü dağıtımlarında uyarlama yapılmaz; pay şeklindeki temettüde bedelsiz formülü kullanılır."}, {"q": "VİOP'ta normal seans olağanüstü bir nedenle zamanında başlatılamazsa en geç ne zamana kadar başlatılabilir?", "o": ["Seans bitiş saatine kadar", "Saat 12:00'ye kadar", "Seans bitiş saatinden 15 dakika öncesine kadar", "Seans bitiş saatinden 1 saat öncesine kadar", "Seans bitiş saatinden 30 dakika öncesine kadar"], "a": 2, "e": "Normal seans bitişinden 15 dakika öncesine kadar başlatılamazsa o gün başlatılmaz. Akşam seansı için bu süre 1 saattir."}]}, {"id": 8, "kisa": "Kıymetli Madenler ve Taşlar", "baslik": "Borsa İstanbul Kıymetli Madenler ve Kıymetli Taşlar Piyasası", "ozet": "İstanbul Altın Borsası'ndan bugüne kıymetli maden piyasası: Borsa'nın mevzuattan gelen görevleri, KMP seans, valör, fiyat adımı ve saflık kuralları, ithalat ve borsa dışı işlem bildirimi, ödünç piyasası.", "notlar": "<h3>Tarihçe<\/h3>\n<ul>\n<li>1993'te <b>32 Sayılı Karar<\/b>'da yapılan değişikliklerle altının fiyatı, ithalatı ve ihracatı serbestleşti. Aynı yıl Kıymetli Madenler Borsalarının Kuruluş ve Çalışma Esasları Hakkında Genel Yönetmelik yayımlandı.<\/li>\n<li><b>İstanbul Altın Borsası<\/b> 26 Temmuz 1995'te faaliyete geçti; alım satım, takas ve kasa saklama hizmeti sunan <b>dünyanın ilk spot altın borsası<\/b>.<\/li>\n<li>6362 sayılı SPKn ile İstanbul Altın Borsası ve İMKB'nin tüzel kişiliği sona erdi; <b>Borsa İstanbul A.Ş. 03.04.2013<\/b>'te faaliyete geçti. İşlemleri Kıymetli Madenler ve Kıymetli Taşlar Piyasası (KMKTP) Bölümü yürütür.<\/li>\n<li>Kuruluş amaçları: altın sektörü ile finans sektörü arasında köprü, kurumsallaşma, dünya piyasalarına paralel fiyat, likidite, <b>referans fiyat<\/b> belirleme, kıymetli madene dayalı ürünlerle entegrasyon, kıymetli taşlara organize piyasa.<\/li>\n<\/ul>\n\n<h3>Borsa İstanbul'un mevzuattan gelen görevleri<\/h3>\n<table><tr><th>Konu<\/th><th>Kural<\/th><\/tr>\n<tr><td>Standart işlenmemiş kıymetli maden ithalatı (32 Sayılı Karar m.7/a-d)<\/td><td>Yalnız <b>TCMB<\/b> ve Borsa'da işlem yetkisi olan üyeler (kıymetli madenler aracı kuruluşları). İthal edilen standart ve standart dışı işlenmemiş madenler <b>3 iş günü<\/b> içinde Borsa'ya teslim edilir, Borsa'da alınıp satılır.<\/td><\/tr>\n<tr><td>Dahilde İşleme Rejimi kapsamındaki ithalat<\/td><td>Teslim şartı yok; <b>3 iş günü<\/b> içinde Borsa'ya yazılı bilgi verilir<\/td><\/tr>\n<tr><td>Yurt içi cevherden üretilen dore bar, granül vb.<\/td><td>Türkiye'deki rafinerilerde rafine edilir, rafinaj bitiminden itibaren <b>7 iş günü<\/b> içinde Borsa kasasına teslim edilir ve KMP'de satılır; ya da Darphane'nin (veya belirlediği kuruluşun) ayar raporundaki miktarlara göre ayrı ayrı işlem yapılır<\/td><\/tr>\n<tr><td>Fonlar ve yatırım ortaklıkları<\/td><td>Kıymetli madenlerinin saklaması KMKTP Bölümünde; alım satımları KMP'de<\/td><\/tr>\n<tr><td>Bankaların TCMB zorunlu karşılık altınları<\/td><td>Borsa İstanbul kasasında, <b>TCMB hesabı<\/b> altında saklanır<\/td><\/tr>\n<tr><td>Ham elmas (2006/11115 sayılı BKK)<\/td><td>Borsa İstanbul, <b>Kimberley Süreci Sertifika Sistemi<\/b>'nde Türkiye'nin ithalat ve ihracat otoritesi; sertifikaları inceler, teyit alır, sertifika düzenler<\/td><\/tr>\n<\/table>\n\n<h3>Piyasalar<\/h3>\n<ul>\n<li><b>Kıymetli Madenler Piyasası (KMP):<\/b> standart, standart dışı ve cevherden üretim altın, gümüş, platin, paladyum; <b>T+0'dan T+120'ye<\/b> kadar valörlü ve fiziki işlemler.<\/li>\n<li><b>Kıymetli Madenler Ödünç Piyasası (KMÖP):<\/b> ödünç ve yatırım vekâleti işlemleri.<\/li>\n<li><b>Elmas ve Kıymetli Taş Piyasası:<\/b> elmas ve kıymetli taşlar.<\/li>\n<li>Bireysel yatırımcılar üyeler aracılığıyla KMP'de alım satım yapabilir ve madenlerini, <b>Borsa'dan satın alma şartı olmadan<\/b>, Borsa kasasında saklatabilir.<\/li>\n<\/ul>\n\n<h3>KMP işlem yöntemi<\/h3>\n<ul>\n<li>Emirler işlem salonundaki temsilci veya internetten uzaktan erişimle <b>KİT<\/b> (Kıymetli Madenler İşlem Platformu) sistemine iletilir; sertifikasyon şartıyla kendi sistemini <b>FIXAPI<\/b> ile bağlamak mümkün.<\/li>\n<li>Esas yöntem <b>sürekli işlem (çok fiyat)<\/b>, fiyat ve zaman önceliği. Emirler aynı anda üyelere ve uluslararası piyasalara yayılır.<\/li>\n<li><b>Tek fiyat seansı:<\/b> emir toplama (eşleşme yok, emir değiştirilebilir/iptal edilebilir) ve fiyat belirleme (emir girilemez, değiştirilemez, iptal edilemez). Dikkat: tek fiyatta <b>yalnız standart 1 kg altın, T+0 takas ve USD/ONS<\/b> fiyat birimli emirler girilir.<\/li>\n<\/ul>\n<table><tr><th>Seans<\/th><th>Saat (takas günleri)<\/th><th>Not<\/th><\/tr>\n<tr><td>Tek fiyat<\/td><td>14:00'te başlar; 10 dakika emir toplama, 5 dakika fiyat belirleme; 14:15'te biter<\/td><td>Hafta sonu, resmi tatil ve yarım günlerde yok. Bu sırada spot seansa 15 dakika ara verilir.<\/td><\/tr>\n<tr><td>Fiksing<\/td><td>09:00'da başlar, London Gold Price açıklanana kadar<\/td><td>London Gold Price açıklanmayan günlerde yok<\/td><\/tr>\n<tr><td>Spot piyasa sürekli işlem<\/td><td><b>08:00–16:00<\/b>; 16:00–16:10 gün sonu (seans kapalı); <b>16:10–23:45<\/b><\/td><td>Yarım günlerde 08:00–13:00; hafta sonu ve resmi tatilde yok<\/td><\/tr>\n<tr><td>Takas<\/td><td>Para ve kıymet yükümlülükleri için son saat <b>17:00<\/b>; erken takas <b>09:00–15:45<\/b><\/td><td>Hafta sonu, resmi tatil ve yarım günlerde takas yok<\/td><\/tr>\n<\/table>\n\n<h3>Fiyat birimi, valör, fiyat adımı<\/h3>\n<ul>\n<li>TL ile <b>kilogram ve gram<\/b>, ABD Doları ve Euro ile <b>ons<\/b> fiyatı. Fiyatlar her birimde virgülden sonra <b>iki hane<\/b>. TRY/GR yalnız mini külçelerde; TRY/KG mini külçede kullanılamaz.<\/li>\n<li>Tek fiyat ve fiksing emirlerinde fiyat birimi yalnız <b>USD/ONS<\/b>. Fiziki takas her durumda işlem gören ürün üzerinden.<\/li>\n<li>Dönüşüm: <b>1 kg = 32,1507465 ons<\/b>; <b>1 ons = 31,1034768 gram<\/b>.<\/li>\n<\/ul>\n<table><tr><th>Emir<\/th><th>Valör<\/th><\/tr>\n<tr><td>Tek fiyat<\/td><td>Yalnız T+0<\/td><\/tr>\n<tr><td>Fiksing<\/td><td>İzleyen 10 takvim günündeki takas günleri; fiyat, işlem günü sabah açıklanan LBMA fiksingi<\/td><\/tr>\n<tr><td>Diğer tüm ürünler<\/td><td>İzleyen <b>120 takvim günündeki<\/b> takas günleri<\/td><\/tr>\n<\/table>\n<table><tr><th>Metal<\/th><th>Fiyat birimi<\/th><th>Adım (mini külçe hariç)<\/th><\/tr>\n<tr><td>Altın, platin, paladyum<\/td><td>USD veya EUR / ons<\/td><td>5 cent<\/td><\/tr>\n<tr><td>Altın, platin, paladyum<\/td><td>TRY / kg<\/td><td>1 TL<\/td><\/tr>\n<tr><td>Gümüş<\/td><td>USD veya EUR / ons<\/td><td>1 cent<\/td><\/tr>\n<tr><td>Gümüş<\/td><td>TRY / kg<\/td><td>10 kuruş<\/td><\/tr>\n<\/table>\n\n<h3>Emirler<\/h3>\n<ul>\n<li><b>Limit fiyatlı emir:<\/b> fiyat ve miktar; gerçekleşmeyen kısım süre sonuna kadar pasif bekler. Öncelik: alışta yüksek, satışta düşük fiyat, sonra zaman.<\/li>\n<li>Hesap tipi: <b>portföy, müşteri, fon<\/b>; üye yalnız kendi müşteri ve fonları adına emir girer. Hesap tipi ve hesap serbestçe değiştirilebilir.<\/li>\n<li>Dikkat: KMP'de <b>fiyat değişikliği<\/b> (iyileştirme veya kötüleştirme) ve <b>miktar artırımı<\/b> emri yeni emir yapar, zaman önceliği kaybolur. Kitabın genel cümlesi fiyat ve miktar değişikliğinde önceliğin kaybolduğunu söyler; azaltma için ayrı bir istisna yazmaz. Değişiklik ve iptal ücretsizdir.<\/li>\n<li><b>Fiyat limitleri<\/b> uluslararası fiyatlara göre dinamik, takas tarihine göre takvim günü bazında, <b>KMKTP Direktörlüğü<\/b> belirler.<\/li>\n<li><b>Fiksing emri:<\/b> LBMA sabah fiksing fiyatına bağlı; yalnız ABD Doları; fiyat hanesine (±) bir dolar farkı girilir. Takas olmayan günlerde ve sabah fiksingi yayımlanmazsa yapılmaz.<\/li>\n<li><b>İşlem raporu:<\/b> emir defterine girmeden karşı üye seçilerek işlem; takas <b>brüt<\/b>; karşı üyenin aynen kabulü veya ters yönlü rapor girmesiyle işleme döner; <b>öncelik kuralları uygulanmaz<\/b>.<\/li>\n<\/ul>\n\n<h3>İşleme konu kıymetli madenler<\/h3>\n<table><tr><th>Maden<\/th><th>Standart (en az)<\/th><th>Standart dışı<\/th><\/tr>\n<tr><td>Altın<\/td><td><b>995/1000<\/b>, bar veya külçe<\/td><td>995/1000'den düşük (995 hariç); külçe, bar, dore bar, granül, toz, hurda<\/td><\/tr>\n<tr><td>Gümüş<\/td><td><b>%99,9<\/b>, bar, külçe veya <b>granül<\/b><\/td><td>%99,9'dan düşük<\/td><\/tr>\n<tr><td>Platin<\/td><td><b>%99,95<\/b>, bar veya külçe<\/td><td>%99,95'ten düşük<\/td><\/tr>\n<tr><td>Paladyum<\/td><td><b>%99,95<\/b>, bar veya külçe<\/td><td>%99,95'ten düşük<\/td><\/tr>\n<\/table>\n<ul>\n<li>Standart tipler: <b>mini bar<\/b> 1; 2,5; 5; 10; 20; 50; 100; 250; 500 gr; <b>külçe 1 kg<\/b>; <b>large bar<\/b> 1 kg üzeri; gümüşte ayrıca torbalı granül.<\/li>\n<li>Standart dışı madenin ayar raporuna uygunluğundan, madeni Borsa kasasına teslim eden <b>üye sorumludur<\/b>. Ramat evleri ve rafineriler ürünün üzerine firma damgası ve ayar/ağırlık mührü vurur; üye Darphane'den (veya belirlediği kuruluştan) <b>ayar raporu<\/b> alır.<\/li>\n<li>İthal edilen standart dışı maden; gümrük beyannamesi, ithalat bilgi formu ve ayar raporuyla teslim edilir (ivedi durumda ayar raporu ve beyanname yeterli).<\/li>\n<li>Cevherden üretilen madende ayar raporunu Darphane düzenler; her bir madenin saflık ve ağırlığını gösterir.<\/li>\n<\/ul>\n\n<h3>İthalat<\/h3>\n<ul>\n<li>Standart işlenmemiş maden ithalatı yalnız <b>TCMB<\/b> ve <b>kıymetli madenler aracı kuruluşları<\/b> tarafından. İthal edilen madenler <b>3 iş günü<\/b> içinde Borsa'ya teslim ve Borsa'da alım satım zorunlu.<\/li>\n<li>Peşin ödeme, mal mukabili ve bedelsiz ithalatta her işlem için <b>gümrük beyannamesi kapanışından en az 1 iş günü önce<\/b> İthalat Öncesi Bildirim Formu bilgileriyle <b>Tek Pencere Sistemi<\/b> üzerinden bildirim.<\/li>\n<li>İthal edilen işlenmemiş madenin yurt içindeki <b>ilk alım satımı yalnız Borsa'da<\/b>.<\/li>\n<li>İthal edilen standart madenler Borsa'nın kabul ettiği rafineri listesindeki rafinerilerce üretilmiş olmalı.<\/li>\n<\/ul>\n\n<h3>Borsa dışı işlemlerin bildirimi<\/h3>\n<ul>\n<li>Yetkili üyelerin Borsa dışında yaptığı standart ve standart dışı işlenmemiş maden alım satımları <b>işlem tarihini izleyen 5 iş günü<\/b> içinde KİT'teki Borsa Dışı İşlem Raporu menüsüyle bildirilir; bu işlemler <b>Borsa işlemi<\/b> sayılır.<\/li>\n<li>Komisyon normal işlem gibi hesaplanır; alıcıdan ayrıca <b>çekme komisyonu<\/b> alınır. Taraflardan birinin bildirimi tüm taraflar için ücret tahsiline yeter.<\/li>\n<li>5 iş günü içinde bildirilmezse yıl içindeki tekerrür sıklığına göre <b>cezai komisyon<\/b> ve toplam komisyon üzerinden <b>gecikme faizi<\/b>.<\/li>\n<\/ul>\n\n<h3>Teminat ve takas (KMP)<\/h3>\n<ul>\n<li>Teminat olarak kabul edilenler, değerleme katsayıları ve süreçler <b>Takasbank<\/b> prosedüründe; teminat yönetimini Takasbank yapar. <b>İşlem limitini işlem teminatı belirler.<\/b><\/li>\n<li>Fiziki takas ve saklama Borsa'nın kıymetli maden kasalarında; takas esaslarında Takasbank merkezi takas hükümleri geçerli. Yükümlülüğünü yerine getirmeyen üyenin alacağı ödenmez.<\/li>\n<li>Teslimat işlem konusu madenin <b>türünde ve tipinde<\/b> yapılır. Rafine edilmemiş cevher madeninin kendinden kendine alım satımında takas ayar raporuyla yapılır, komisyon teslim edilmiş gibi alınır.<\/li>\n<li>Erken takas, Takas Terminali'ne girilen talep üzerine.<\/li>\n<\/ul>\n\n<h3>Kıymetli Madenler Ödünç Piyasası (KMÖP)<\/h3>\n<ul>\n<li><b>24 Mart 2000<\/b>'de İstanbul Altın Borsası bünyesinde kuruldu. Amaç: arz ve talebi buluşturmak, kuyumculuğa ucuz üretim finansmanı, altının menkul kıymetleştirilmesi.<\/li>\n<li>Yalnız <b>KMP üyeleri<\/b>, Borsa Genel Müdürlüğüne <b>dilekçe<\/b> ile başvurur.<\/li>\n<li><b>Ödünç işlemi:<\/b> fiyat, vade, miktar serbest; vade sonunda asıl değer + ilave değer ödünç alan tarafından ödenir. <b>Yatırım vekâleti:<\/b> vekil, müvekkilden aldığı madeni değerlendirir; vade sonunda sermaye + vadedilen getiri ödenir. Vade sonu teslimatı maden ya da para cinsinden olabilir.<\/li>\n<li>Ödünç işlemi yalnız ödünç emriyle, vekâlet emri yalnız vekâlet emriyle eşleşir.<\/li>\n<\/ul>\n<table><tr><th>KMÖP kuralı<\/th><th>Değer<\/th><\/tr>\n<tr><td>Fiyat tipi<\/td><td>TL/kg ve ABD Doları/ons; işlem birimi <b>kilogram<\/b><\/td><\/tr>\n<tr><td>Emir<\/td><td>Yalnız <b>limit<\/b>; <b>blok<\/b> (tamamı) veya <b>bölünebilir<\/b> (kısmi)<\/td><\/tr>\n<tr><td>Fiyat<\/td><td>Ödünçte <b>getiri (faiz) oranı<\/b>, vekâlette vadedilen getiri oranı; parasal tutara değil miktara ilişkin<\/td><\/tr>\n<tr><td>Öncelik<\/td><td>Ödünç alma (vekâleten alma) emrinde en yüksek, ödünç verme (vekâleten verme) emrinde en düşük oran; sonra zaman<\/td><\/tr>\n<tr><td>Saflık esası<\/td><td>Altında 1000/1000; gümüş, platin, paladyumda 100/100<\/td><\/tr>\n<tr><td>İşlem limiti<\/td><td>Alt limit <b>en az 5 kg<\/b>, artış <b>1 kg<\/b> ve katları<\/td><\/tr>\n<tr><td>Seans<\/td><td>İş günleri <b>10.00–16.00<\/b> kesintisiz<\/td><\/tr>\n<tr><td>Valör<\/td><td>Yalnız <b>T+0<\/b><\/td><\/tr>\n<tr><td>Vade<\/td><td>1 aya kadar her iş günü; sonrası 1'er aylık vadelerle <b>365 güne kadar<\/b><\/td><\/tr>\n<tr><td>Takas<\/td><td>Maden takası <b>Borsa<\/b>, nakit takası <b>Takasbank<\/b><\/td><\/tr>\n<tr><td>Emir geçerliliği<\/td><td>İlgili seansla sınırlı; seans sonunda iptal<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: İthalat veya cevherden üretimle gelen maden, <b>KMP'de alım satımı yapılmadan<\/b> ödünç ve vekâlete konu olamaz.<\/li>\n<li>Emirde bulunması zorunlu: unvan, tür (bölünebilir/blok), tip, fiyat tipi, maden cinsi ve miktarı, faiz oranı veya vadedilen getiri, vade sonu tarihi, teslimatın fiziki mi nakdi mi olduğu.<\/li>\n<li>İşlem günü ödünç veren (müvekkil) maden borcunu takas saatinde yerine getirir. Vade sonu nakit ödemede tutar = (maden miktarı + faiz) × teslimat günü referans fiyatı.<\/li>\n<li>İki iş gününden uzun vadelerde borç ve alacaklar vade bitiminden <b>iki iş günü önce<\/b> bildirilir. Takas saatleri KMP ile aynı.<\/li>\n<\/ul>\n<h4>KMÖP teminatları<\/h4>\n<ul>\n<li>Ödünç/vekâlet alan üye <b>toplam net teminatının %90'ı<\/b> kadar işlem yapabilir.<\/li>\n<li>Teminat türleri: TL; ABD Doları ve Euro efektif ve döviz; TL ve ABD Doları kesin ve süresiz banka teminat mektubu; devlet tahvili, hazine bonosu ve kira sertifikaları (<b>%90<\/b>'ı işleme konur).<\/li>\n<li>Teminatlar her gün sonunda Borsa tarafından değerlenir. İşlem tutarı teminat toplamının <b>%97<\/b>'sine ulaşırsa teminat tamamlama çağrısı yapılır; ödünç alınan madenin değeri teminatın <b>en fazla %90<\/b>'ı olacak şekilde ek teminat yatırılır.<\/li>\n<li>Vade sonunda takasla teminatlar serbest kalır. Borsa payı Borsa İstanbul internet sitesinde yayımlanır.<\/li>\n<\/ul>", "sorular": [{"q": "İstanbul Altın Borsası hangi tarihte faaliyete geçmiştir?", "o": ["26 Temmuz 1995", "24 Mart 2000", "17 Haziran 1991", "3 Nisan 2013", "1 Ocak 1993"], "a": 0, "e": "İstanbul Altın Borsası 26 Temmuz 1995'te dünyanın ilk spot altın borsası olarak faaliyete geçti. 24 Mart 2000 Ödünç Piyasası'nın, 3 Nisan 2013 Borsa İstanbul'un başlangıcıdır."}, {"q": "32 Sayılı Karar'a göre kıymetli madenler aracı kuruluşlarının ithal ettikleri standart ve standart dışı işlenmemiş kıymetli madenleri Borsa İstanbul'a teslim etme süresi nedir?", "o": ["1 iş günü", "5 iş günü", "3 iş günü", "10 iş günü", "7 iş günü"], "a": 2, "e": "İthal edilen işlenmemiş kıymetli madenler 3 iş günü içinde Borsa'ya teslim edilir ve Borsa'da alınıp satılır."}, {"q": "Yurt içinde cevherden üretilen dore bar, rafinaj işleminin tamamlanmasından itibaren kaç iş günü içinde Borsa kasasına teslim edilmelidir?", "o": ["5", "15", "3", "7", "10"], "a": 3, "e": "Cevherden üretilen kıymetli madenler rafinaj bitiminden itibaren 7 iş günü içinde Borsa kasasına teslim edilir."}, {"q": "Kimberley Süreci Sertifika Sistemi'nde ham elmas için Türkiye'nin ithalat ve ihracat otoritesi hangisidir?", "o": ["Ticaret Bakanlığı", "TCMB", "SPK", "Darphane ve Damga Matbaası Genel Müdürlüğü", "Borsa İstanbul"], "a": 4, "e": "2006/11115 sayılı Bakanlar Kurulu Kararı ile İstanbul Altın Borsası, bugün Borsa İstanbul, Kimberley Süreci'nde Türkiye'nin ithalat ve ihracat otoritesidir."}, {"q": "Bankaların TCMB zorunlu karşılık yükümlülüğüne ait altınları nerede saklanır?", "o": ["MKK nezdinde", "Yurt dışında LBMA kasalarında", "Takasbank kasasında, bankanın kendi hesabında", "Borsa İstanbul kasasında, TCMB hesabı altında", "TCMB kasasında, bankanın hesabında"], "a": 3, "e": "Zorunlu karşılık altınları Türkiye'de, Borsa İstanbul kasasında TCMB hesabı altında saklanır."}, {"q": "Kıymetli Madenler Piyasası'nda tek fiyat seansında hangi emirler girilebilir?", "o": ["Standart dışı altın için EUR/ONS emirler", "Standart 1 kg altın için T+0 takas tarihli ve USD/ONS fiyat birimli emirler", "Her türlü maden için TRY/KG cinsi emirler", "Gümüş ve platin için T+1 emirler", "Mini külçeler için TRY/GR emirler"], "a": 1, "e": "Tek fiyat seansında yalnızca standart 1 kg altın için takas tarihi T+0 ve fiyat birimi USD/ONS olan emirler girilebilir."}, {"q": "Kıymetli Madenler Piyasası'nda tek fiyat seansının işleyişi için hangisi doğrudur?", "o": ["14:00'te başlar; 10 dakika emir toplama, 5 dakika fiyat belirleme; 14:15'te tamamlanır", "14:00'te başlar; 5 dakika emir toplama, 10 dakika fiyat belirleme", "Fiyat belirleme aşamasında emirler iptal edilebilir", "Yarım günlerde de yapılır", "10.00'da başlar, 30 dakika sürer"], "a": 0, "e": "Tek fiyat 14:00'te başlar, 10 dakika emir toplama ve 5 dakika fiyat belirleme ile 14:15'te biter. Fiyat belirleme aşamasında emir değiştirilemez ve iptal edilemez; yarım günlerde yapılmaz."}, {"q": "Kıymetli Madenler Piyasası spot piyasada tam iş günü sürekli işlem saatleri hangisidir?", "o": ["09:30–17:30", "08:00–16:00 ve 16:10–23:45", "09:00–18:00 ve 19:00–23:00", "08:00–13:00", "10:00–16:00"], "a": 1, "e": "Spot piyasada sürekli işlem 08:00–16:00 ve 16:10–23:45 arasıdır; 16:00–16:10 gün sonu işlemleri için seans kapalıdır. Yarım günlerde 08:00–13:00 işlem yapılır."}, {"q": "Kıymetli Madenler Piyasası'nda para ve kıymet yükümlülükleri için son takas saati ile erken takas saatleri hangisidir?", "o": ["17:00 / 09:00–15:45", "14:00 / 09:00–13:00", "17:30 / 09:00–16:00", "16:00 / 09:00–15:00", "15:45 / 08:00–15:00"], "a": 0, "e": "Son takas saati 17:00'dir; erken takas 09:00–15:45 arasında mümkündür."}, {"q": "Kıymetli Madenler Piyasası'nda tek fiyat ve fiksing emirleri dışındaki ürünler için en fazla ne kadar ileri valörlü emir girilebilir?", "o": ["365 gün", "120 takvim günü", "30 takvim günü", "90 takvim günü", "10 takvim günü"], "a": 1, "e": "Diğer ürünlerde izleyen 120 takvim günündeki takas günleri için emir girilebilir. Fiksingde 10 takvim günü, tek fiyatta yalnız T+0 uygulanır."}, {"q": "Altının ons fiyatı 2.000 ABD Doları ise, kitapta verilen dönüşüm katsayısına göre 1 kilogram altının ABD Doları değeri yaklaşık kaçtır?", "o": ["32.150", "62.207", "64.301", "66.000", "31.103"], "a": 2, "e": "1 kg = 32,1507465 ons; 2.000 × 32,1507465 ≈ 64.301 ABD Doları. 62.207, ons ile gram katsayısının karıştırılmasıyla bulunur."}, {"q": "Kıymetli Madenler Piyasası'nda gümüş için TRY/KG fiyat biriminde uygulanan fiyat adımı nedir?", "o": ["1 cent", "1 kuruş", "5 cent", "1 TL", "10 kuruş"], "a": 4, "e": "Gümüşte TRY/KG adımı 10 kuruş, USD/EUR ons adımı 1 cent'tir. Altın, platin ve paladyumda TRY/KG adımı 1 TL, ons adımı 5 cent'tir."}, {"q": "Kıymetli Madenler Piyasası'nda standart işlenmemiş platin ve paladyum için asgari saflık derecesi nedir?", "o": ["%99,9", "%99,95", "%99,5", "%99,99", "995/1000"], "a": 1, "e": "Standart platin ve paladyum en az %99,95; standart altın en az 995/1000; standart gümüş en az %99,9 saflıkta olmalıdır."}, {"q": "Kıymetli Madenler Piyasası'nda işlem raporu için aşağıdakilerden hangisi yanlıştır?", "o": ["Karşı üyenin aynı şartlarla ters yönlü rapor girmesiyle de işleme dönüşür", "Takası brüt esaslara göre yapılır", "Karşı üyenin aynen kabulüyle işleme dönüşür", "Emir defterine iletilmeden karşı üye seçilerek girilir", "Fiyat ve zaman öncelik kuralları uygulanır"], "a": 4, "e": "İşlem raporunda öncelik kuralları uygulanmaz; gönderme ve kabul üyenin takdirine bağlıdır."}, {"q": "Yetkili üyelerin Borsa dışında yaptıkları işlenmemiş kıymetli maden alım satımlarını Borsa'ya bildirme süresi ve bildirilmemesinin sonucu hangisinde doğru verilmiştir?", "o": ["Aynı gün; işlem iptali", "3 iş günü; üyelik askıya alınır", "Bildirim zorunlu değildir", "İşlem tarihini izleyen 5 iş günü; cezai komisyon ve gecikme faizi", "10 iş günü; idari para cezası"], "a": 3, "e": "Borsa dışı işlemler izleyen 5 iş günü içinde KİT üzerinden bildirilir; bildirilmezse tekerrüre göre cezai komisyon ve gecikme faizi uygulanır."}, {"q": "Peşin ödeme, mal mukabili veya bedelsiz yöntemle işlenmemiş kıymetli maden ithal edecek aracı kuruluş Borsa'ya ne zaman bildirim yapmalıdır?", "o": ["Gümrük beyannamesi kapanış tarihinden en az 1 iş günü önce", "İthalattan sonra 3 iş günü içinde", "Gümrük beyannamesi kapanışından en az 5 iş günü önce", "Ay sonunda toplu olarak", "Bildirim yükümlülüğü yoktur"], "a": 0, "e": "Bu ithalatlarda her işlem için gümrük beyannamesi kapanışından en az 1 iş günü önce Tek Pencere Sistemi üzerinden bildirim yapılır."}, {"q": "Kıymetli Madenler Ödünç Piyasası ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Emirler piyasa emri olarak da verilebilir", "Vadeler 2 yıla kadar olabilir", "İşlemlerde alt limit en az 5 kg, artış 1 kg ve katlarıdır", "İşlemler T+2 valörlüdür", "Seans 09.30–17.30 arasındadır"], "a": 2, "e": "KMÖP'te alt limit 5 kg, artış 1 kg katlarıdır. İşlemler yalnız T+0, emirler yalnız limit, seans 10.00–16.00, vade en fazla 365 gündür."}, {"q": "Kıymetli Madenler Ödünç Piyasası'nda ödünç alma emirleri arasında en iyi fiyatlı emir hangisidir?", "o": ["En yüksek getiri oranlı emir", "En kısa vadeli emir", "En düşük getiri oranlı emir", "En büyük miktarlı emir", "İlk girilen emir"], "a": 0, "e": "Aynı nitelikteki emirler içinde ödünç alma emirlerinde en yüksek, ödünç verme emirlerinde en düşük getiri oranı en iyi fiyattır."}, {"q": "Kıymetli Madenler Ödünç Piyasası'nda kıymetli maden takası ve nakit takası sırasıyla kim tarafından yapılır?", "o": ["MKK / Takasbank", "Borsa İstanbul / TCMB", "Borsa İstanbul / Takasbank", "TCMB / Takasbank", "Takasbank / Borsa İstanbul"], "a": 2, "e": "KMÖP'te kıymetli maden takası Borsa tarafından, nakit takası Takasbank tarafından gerçekleştirilir."}, {"q": "KMÖP'te toplam net teminatı 1.000.000 TL olan bir üye en fazla ne kadarlık ödünç işlemi yapabilir?", "o": ["970.000 TL", "900.000 TL", "800.000 TL", "1.100.000 TL", "1.000.000 TL"], "a": 1, "e": "Ödünç veya vekâlet alan üye toplam net teminat tutarının %90'ı kadar işlem yapabilir: 0,90 × 1.000.000 = 900.000 TL."}, {"q": "KMÖP'te teminat tamamlama çağrısı hangi durumda yapılır?", "o": ["Ödünç işlem tutarı teminat toplamını aştığında", "Ödünç işlem tutarı teminat toplamının %90'ına ulaştığında", "Teminatın değeri %10 düştüğünde", "Ödünç işlem tutarı teminat toplamının %97'sine ulaştığında", "Her vade sonunda"], "a": 3, "e": "İşlem tutarı teminat toplamının %97'sine ulaşınca çağrı yapılır; üye, ödünç alınan madenin değeri teminatın en fazla %90'ı olacak şekilde ek teminat yatırır."}, {"q": "Bir üye KMÖP'te 10 kg altın ödünç almıştır; vade sonu faizi 0,2 kg altına karşılık gelmektedir. Vade sonu ödemesi nakit yapılacak ve teslimat günü referans fiyatı 3.000.000 TL/kg ise ödenecek tutar nedir?", "o": ["29.400.000 TL", "600.000 TL", "30.000.000 TL", "36.000.000 TL", "30.600.000 TL"], "a": 4, "e": "Nakit ödemede tutar, faiz ile maden miktarının toplamının referans fiyatla çarpımıdır: (10 + 0,2) × 3.000.000 = 30.600.000 TL."}]}, {"id": 9, "kisa": "Tezgahüstü Piyasalar", "baslik": "Tezgahüstü (OTC) Piyasalar", "ozet": "Tezgahüstü piyasaların organize piyasalardan farkları, dünyadaki pay ve türev OTC piyasaları, 2008 sonrası düzenlemeler ve Türkiye'deki raporlama, teminat ve merkezi karşı taraf kuralları.", "notlar": "<h3>Tanım<\/h3>\n<ul>\n<li><b>Organize piyasa:<\/b> düzenleyici gözetiminde, merkezi yapıda, yazılı kurallara bağlı, genellikle belirli bir mekân/platformda işlem yapılan piyasa (NYSE, Borsa İstanbul).<\/li>\n<li><b>Tezgahüstü (OTC, over the counter) piyasa:<\/b> merkezi yapı olmadan, telefon veya elektronik iletişimle, serbestçe yapılandırılmış sözleşmeler üzerinden ve esnek kurallarla işlem yapılan piyasa.<\/li>\n<li>Türk mevzuatında (III-37.1 Tebliğ) <b>tezgah üstü piyasa<\/b>: \"borsalar ve teşkilatlanmış diğer pazar yerleri dışında kalan piyasalar\". SPKn m.66'daki <b>teşkilatlanmış diğer pazar yerleri<\/b> (alternatif işlem sistemleri, çok taraflı işlem platformları vb.) tezgahüstü tanımının <b>dışındadır<\/b>.<\/li>\n<\/ul>\n\n<h3>Organize piyasalarla farklar<\/h3>\n<table><tr><th>Ölçüt<\/th><th>Organize borsa<\/th><th>Tezgahüstü piyasa<\/th><\/tr>\n<tr><td>İşlem platformu<\/td><td>Merkezi<\/td><td>Merkezi değil; çok sayıda işlemci (dealer)<\/td><\/tr>\n<tr><td>Likidite kaynağı<\/td><td>Yatırımcı emirleri<\/td><td>Aracıların kendi portföyünden alım satımı; piyasa yapıcılar (market maker) çift taraflı kotasyon verir<\/td><\/tr>\n<tr><td>Düzenleme<\/td><td>Kesin kurallar; üyelik şartı; güçlü gözetim; daha az esneklik<\/td><td>Bağlayıcı işlem kuralı yok; üyelik gerekmez; merkezi bilgi kaynağı olmadığından gözetim zor; sermaye piyasası suçu riski yüksek<\/td><\/tr>\n<tr><td>Standardizasyon<\/td><td>Standart ürünler<\/td><td>Serbest yapılandırma; riski esnek yönetme imkânı<\/td><\/tr>\n<tr><td>Aracılık<\/td><td>Yetkili, kimliği belli kuruluşlar zorunlu<\/td><td>Doğrudan alıcı-satıcı irtibatı mümkün; rekabet nedeniyle <b>aracılık maliyeti daha düşük<\/b><\/td><\/tr>\n<tr><td>Karşı taraf riski<\/td><td>Takas kurumu garanti ettiği için <b>yok<\/b><\/td><td>Merkezi takas zorunlu tutulan işlemler dışında <b>var<\/b><\/td><\/tr>\n<tr><td>Şeffaflık<\/td><td>Fiyat, miktar, taraf bilgileri kamuya açık<\/td><td>Yalnız tarafların bilgisinde; veri ancak kuruluşlardan derlenerek elde edilir<\/td><\/tr>\n<tr><td>Kotasyon şartı<\/td><td>Var (sermaye, kârlılık, kamuyu aydınlatma, içeriden öğrenenlere kısıt)<\/td><td><b>Kotasyon kuralı yok<\/b>; küçük şirketlere fon ve borsaya hazırlık imkânı<\/td><\/tr>\n<tr><td>Hacim ve likidite<\/td><td>Geniş yatırımcı tabanı, likit<\/td><td>Tek seferlik büyük tutarlar nedeniyle <b>hacim yüksek<\/b>; ama <b>likidite düşük, spread yüksek<\/b>; kurumsal ve profesyonel yatırımcıya hitap eder<\/td><\/tr>\n<\/table>\n<p>OTC'de en önemli sorunlardan biri en iyi kotasyonu veren aracıyı bulmaktır; çoğu zaman piyasa yapıcılar telefonla aranır.<\/p>\n\n<h3>Dünyada tezgahüstü piyasalar<\/h3>\n<ul>\n<li>Özellikle türev OTC piyasalarının hacmi organize piyasaları geçmiştir; dünyadaki türev hacminin <b>tamamına yakını<\/b> OTC'dir.<\/li>\n<li>OTC türevlerde en çok işlem gören sıra: <b>faiz türevleri<\/b>, döviz türevleri, CDS'ler, hisse türevleri.<\/li>\n<li><b>OTC pay piyasaları:<\/b> küçük ölçekli şirketler, blok ve süreklilik arz etmeyen işlemler, yüksek risk ve volatilite. İlk kotasyon şartı hiç aranmayabilir; düzenleyiciye periyodik finansal raporlama istenebilir.<\/li>\n<li>OTC pay işlemlerinin büyük çoğunluğu <b>ABD<\/b>'de: <b>OTCBB<\/b> (Over the Counter Bulletin Board) ve <b>Pink Sheets<\/b>. <b>Nasdaq<\/b> piyasa yapıcıların ekranda kotasyon verdiği elektronik piyasa olarak başladı, sonra <b>organize borsaya dönüştü<\/b>. ABD'de ulusal bir borsaya veya Nasdaq'a kote olmayan paylar OTC paydır.<\/li>\n<li>Kore'de aracı kurumların birliği (TSPB benzeri Korea Securities Dealers Association) <b>KOSDAQ<\/b>'ı kurdu.<\/li>\n<\/ul>\n\n<h3>OTC türev ürünler<\/h3>\n<ul>\n<li>Türevlerin yaygınlaşması: <b>1971<\/b>'de Bretton Woods'un terk edilmesiyle dalgalı kura geçiş ve aynı dönemdeki petrol krizi risk yönetimini öne çıkardı; tarımsal vadelilerin yanına döviz ve faiz vadelileri eklendi.<\/li>\n<li>Borsada türevlerin standartlaşmasının en önemli nedeni <b>likidite<\/b> sağlamaktır.<\/li>\n<li><b>Forward:<\/b> standart olmayan varlığın taraflarca belirlenen koşullarla ileri tarihte alım satımı. Garantör olmadığı için <b>kredi (karşı taraf) riski<\/b> var. Futures sözleşmelerinin temelidir. Taraflar dışında bilinmediği için <b>fiyat referansı olmaz<\/b>. Vadeden önce kapatmak (iptal ve cezai şart dışında) ve devretmek pratikte zor, ikinci el piyasası yok denecek kadar az. İstisna: <b>FRA<\/b> (forward rate agreement) belirli şartlarla ikinci elde satılabilir, kurumsal piyasada yaygın.<\/li>\n<li><b>Opsiyon:<\/b> ileri tarihte belirli fiyattan alma veya satma hakkı. Borsada takas kurumu garantördür. <b>Faize dayalı opsiyonlar genellikle OTC<\/b>'de, diğerleri hem OTC hem borsada.<\/li>\n<li><b>Swap:<\/b> gelecekteki nakit akışlarının değiştirilmesine ilişkin özel anlaşma; amaç korunma, finansman maliyetini düşürme, aktif-pasif yönetimi, spekülasyon. Türleri para, mal, faiz oranı swapı. <b>Faiz oranı swapları OTC'de en çok işlem gören ürün<\/b>dür.<\/li>\n<\/ul>\n\n<h3>2008 krizi sonrası düzenlemeler<\/h3>\n<p>Krizin karmaşık türevlerden kaynaklandığı görüşü OTC işlemleri mercek altına aldı. Öne çıkanlar: ABD <b>Dodd-Frank<\/b> Yasası, IOSCO düzenlemeleri, <b>Basel III<\/b>, G-20 kararları, AB <b>EMIR<\/b>. Diğer aktörler: ESMA, FINRA, ISDA, FSB, CFTC.<\/p>\n<ul>\n<li><b>Gözetim, şeffaflık, raporlama:<\/b> tüm OTC türev işlemlerinin <b>veri depolama kuruluşuna (trade repository)<\/b> raporlanması; blok işlemlerin ayrıca raporlanması; hacim ve fiyatların kamuyla paylaşılması.<\/li>\n<li><b>Riskten kaçınma:<\/b> merkezi karşı tarafla takas; CCP kullanmayanlara <b>daha yüksek sermaye<\/b>; teminat (margin); operasyonel risk değerlendirmesi; bankalar için stres testiyle sermaye yeterliliği.<\/li>\n<li><b>Takas ve merkezi karşı taraf (CCP):<\/b> 2008 öncesi OTC türevler genellikle CCP'den geçmiyordu; sonrasında belirli araçlar için, uygulamada <b>faiz swapları<\/b> için zorunlu merkezi takasa geçildi. Organize borsalarda CCP 20. yüzyılın başından beri var.<\/li>\n<\/ul>\n\n<h3>Türkiye'de tezgahüstü piyasalar<\/h3>\n<ul>\n<li>En derin OTC para ve borçlanma piyasaları: <b>Bankalararası TL, Bankalararası Döviz, Bankalararası Tahvil ve Bankalararası Repo<\/b> piyasaları.<\/li>\n<li>Bankalararası TL ve döviz piyasalarında merkezi takas yok; BDDK ve TCMB'nin sınırları içinde işlem yapılır. Genel teminat alınmaz; karşı taraf riskine <b>line<\/b> denen limitlerle sınır konur; işlem yalnız karşılıklı limiti olan taraflarla, telefon veya veri yayın platformlarıyla yapılır.<\/li>\n<li><b>Serbest Efektif Piyasası<\/b> (tarihsel adıyla Tahtakale): efektif arz-talebi belirleyici; bankalar ve yetkili müesseseler işlem yapar.<\/li>\n<li>Borsa'daki payların emirlerinin Borsa'ya iletilmesi esastır. İstisna (Borsa önerisi + <b>SPK onayı<\/b>): işlem sırası kapalı paylar, borsa dışı toptan/blok satış, miras paylaşımı, mahkeme kararı, rehin tasfiyesi.<\/li>\n<li>Bankalar özellikle <b>2001 krizinden<\/b> sonra bilanço içi açık pozisyonlarını bilanço dışı döviz türevleriyle kapatmaya yöneldi. OTC türevlerde işlemler çoğunlukla bankalar arasında veya bankalarla büyük şirketler arasında; temel saik <b>riskten korunma (hedging)<\/b>. En çok faiz swapları, çapraz kur swapları ve döviz swapları.<\/li>\n<\/ul>\n\n<h3>Türk sermaye piyasası mevzuatındaki düzenlemeler<\/h3>\n<h4>Raporlama<\/h4>\n<ul>\n<li>OTC türev işlem yapacak yatırım kuruluşları, işlem yapacakları türev türleri ve dayanak varlıklarına ilişkin <b>TSPB<\/b> esaslarına göre bir liste oluşturur, <b>internet sitesinde yayımlar ve Birliğe gönderir<\/b>.<\/li>\n<li><b>MKK<\/b>, SPK'nın 03.04.2015 tarihli kararıyla SPKn m.87 uyarınca <b>veri depolama kuruluşu<\/b> olarak yetkilendirildi. Yönetmelik 19.09.2018, Tebliğ (IV-87.1) 27.10.2018'de yayımlandı; <b>Elektronik Veri Deposu Sistemi 30.11.2018<\/b>'de devreye girdi.<\/li>\n<li>Yatırım kuruluşları ve tüzel kişiler; yurt içi ve yurt dışı OTC ile yurt dışı organize piyasalardaki türevlerini raporlar. <b>VİOP ve Swap Piyasası<\/b> işlemlerini merkezi karşı taraf <b>Takasbank<\/b> raporlar.<\/li>\n<li>Fark sözleşmeleri, forward, futures, opsiyon ve swap işlem detayları en geç <b>işlem gününün ertesi gününe<\/b> kadar raporlanır.<\/li>\n<\/ul>\n<table><tr><th>Örnek durum<\/th><th>Raporlama yükümlüsü<\/th><\/tr>\n<tr><td>İki yatırım kuruluşu arasında yurt içi OTC işlem<\/td><td>Her iki yatırım kuruluşu (tabloda Takasbank'ın raporladığı yurt içi OTC satırları da yer alır; merkezi karşı taraftan geçen işlemler)<\/td><\/tr>\n<tr><td>Yurt içi organize piyasa işlemi<\/td><td>Takasbank<\/td><\/tr>\n<tr><td>Yatırım kuruluşu ile müşterisi arasında yurt içi OTC<\/td><td>Yatırım kuruluşu<\/td><\/tr>\n<tr><td>İki yurt içi yerleşik tüzel kişi arasında OTC<\/td><td>Her iki tüzel kişi<\/td><\/tr>\n<tr><td>Yatırım kuruluşu ile yurt dışı CCP veya yurt dışı tüzel kişi<\/td><td>Yatırım kuruluşu<\/td><\/tr>\n<tr><td>İki gerçek kişi veya tüzel kişi ile gerçek kişi arasında OTC<\/td><td><b>Bildirim yükümlülüğü yok<\/b><\/td><\/tr>\n<\/table>\n<h4>Risk yönetimi ve teminatlandırma<\/h4>\n<ul>\n<li>Aracı kurumlar uluslararası kabul görmüş yöntemlerle bir <b>teminatlandırma politikası<\/b> oluşturur: doğrudan mali yükümlülük, müşterinin riskliliği, olumsuz piyasa koşulları, korunma veya fark pozisyonu gibi stratejiler dikkate alınır.<\/li>\n<li>Risk modelleri <b>en az altı ayda bir<\/b> geriye dönük stres testiyle sınanır.<\/li>\n<li>Her müşterinin pozisyon büyüklüğüne <b>limit<\/b> zorunlu; müşteriler gruplandırılabilir.<\/li>\n<li><b>Teminat yatırılmadan işleme başlanamaz.<\/b> Borsadaki gibi asgari <b>başlangıç ve sürdürme teminatı<\/b> ve teminat tamamlama çağrısı vardır.<\/li>\n<li>Genel müşteriye hizmetten önce ürünün yapılandırılması, fiyatlanması ve karşı taraf hakkında bilgi verilir.<\/li>\n<li>Kullanılan elektronik platform, program, modül ve eklentiler kullanılmaya başlandıktan itibaren <b>10 gün<\/b> içinde <b>Birliğe (TSPB)<\/b> yazılı bildirilir; bildirilmeyen platform kullanılamaz.<\/li>\n<\/ul>\n<h4>Takas ve merkezi karşı taraf<\/h4>\n<ul>\n<li>Merkezi takas kuruluşları OTC piyasaların takas, ödeme ve teminat işlemlerini <b>SPK izniyle<\/b> yapabilir. Merkezi takasa konu OTC araçları ve esasları, takas kuruluşunun önerisiyle SPK belirler.<\/li>\n<li>SPK, yatırım kuruluşlarının OTC işlemlerinin CCP nezdinde takasını <b>zorunlu tutabilir<\/b>.<\/li>\n<li><b>Takasbank<\/b>, <b>19 Aralık 2019<\/b>'dan itibaren <b>TL faize dayalı swaplar<\/b> için merkezi karşı taraf hizmeti veriyor.<\/li>\n<\/ul>", "sorular": [{"q": "Tezgahüstü piyasalarla ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Merkezi bir işlem platformu yoktur", "Kotasyon kuralları yoktur", "İşlemlerde karşı taraf riski bulunmaz", "Likidite düşük, spreadler yüksektir", "Aracılık maliyetleri organize piyasalara göre genellikle daha düşüktür"], "a": 2, "e": "Merkezi takas zorunlu tutulan işlemler dışında tezgahüstü işlemlerde karşı taraf riski vardır. Karşı taraf riskinin olmaması organize borsaların özelliğidir."}, {"q": "Tezgahüstü piyasalarda likiditeyi büyük ölçüde ne sağlar?", "o": ["Merkez bankasının müdahaleleri", "Takas kurumunun garantisi", "Bireysel yatırımcı emirleri", "Aracıların kendi portföylerinden yaptığı alım satımlar", "Borsa piyasa gözetim sistemi"], "a": 3, "e": "OTC'de likiditeyi büyük ölçüde aracıların kendi portföyünden alım satımı sağlar; borsalarda ise yatırımcı emirleri ana likidite kaynağıdır."}, {"q": "Tezgahüstü piyasaların organize piyasalara göre daha yüksek işlem hacmine sahip olmasının temel nedeni hangisidir?", "o": ["Kamuyu aydınlatma yükümlülüklerinin ağır olması", "Sürekli müzayede sistemi", "Merkezi karşı taraf zorunluluğu", "Geniş bireysel yatırımcı tabanı", "Esnek şartlar ve tek seferlik büyük tutarlı işlemler"], "a": 4, "e": "Esnek şartlar ve tek seferlik büyük montanlı işlemler OTC hacmini yükseltir; aynı nedenlerle likidite düşük, spread yüksektir."}, {"q": "Tezgahüstü türev piyasalarında en çok işlem gören ürün grubu hangisidir?", "o": ["Faiz türevleri", "Döviz türevleri", "Hisse türevleri", "Emtia türevleri", "Kredi temerrüt swapları (CDS)"], "a": 0, "e": "OTC türevlerde en çok faiz türevleri işlem görür; bunu döviz türevleri, CDS'ler ve hisse türevleri izler."}, {"q": "ABD'de fiziki mekâna bağlı olmadan piyasa yapıcıların ekranda kotasyon verdiği elektronik bir piyasa olarak başlayıp sonradan organize borsaya dönüşen piyasa hangisidir?", "o": ["Pink Sheets", "NYSE", "OTCBB", "Nasdaq", "KOSDAQ"], "a": 3, "e": "Nasdaq elektronik bir kotasyon piyasası olarak başladı, sonra organize borsaya dönüştü. OTCBB ve Pink Sheets ABD'deki OTC pay kotasyon piyasalarıdır."}, {"q": "Forward sözleşmelerle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Geleceğe yönelik fiyatlar için referans niteliği taşır", "Standart özellikleri nedeniyle kolayca devredilir", "Takas kurumu garantisi altında işlem görür", "Karşı tarafın yükümlülüğünü yerine getirmemesi riski taşır", "Organize borsada işlem görür"], "a": 3, "e": "Forward sözleşmelerde garantör olmadığı için kredi riski vardır. Taraflar dışında bilinmediğinden fiyat referansı olmaz ve standart olmadığından pratikte devredilemez."}, {"q": "Standart olmayan forward sözleşmelerin istisnası olarak belirli şartlarla ikinci el piyasada satılabilen ve kurumsal piyasada yaygın olan ürün hangisidir?", "o": ["Faiz oranı sözleşmeleri (FRA)", "Altın forwardları", "Döviz forwardları", "Emtia forwardları", "Pay forwardları"], "a": 0, "e": "Faiz oranındaki farklılıklar üzerine yapılan FRA'ların belirli şartlarla ikinci el piyasada satışı mümkündür; bu nedenle kurumsal piyasada yaygındır."}, {"q": "Uygulamada genellikle tezgahüstü piyasalarda işlem gören opsiyonlar hangisidir?", "o": ["Döviz opsiyonları", "Faiz oranına dayanan opsiyonlar", "Endeks opsiyonları", "Emtia opsiyonları", "Pay opsiyonları"], "a": 1, "e": "Faize dayalı opsiyonlar genellikle OTC'de, diğer opsiyonlar ise hem OTC'de hem organize borsalarda işlem görür."}, {"q": "Türev araçların yaygınlaşmasına zemin hazırlayan, sabit kurdan dalgalı kura geçişle sonuçlanan gelişme hangi yıl yaşanmıştır?", "o": ["1944", "1971", "1987", "2001", "2008"], "a": 1, "e": "Bretton Woods sisteminin 1971'de terk edilmesiyle dalgalı kura geçildi; petrol kriziyle birlikte risk yönetimi öne çıktı."}, {"q": "2008 krizi sonrasında tezgahüstü türevler için zorunlu merkezi takas uygulamasına uygulamada özellikle hangi ürünlerde geçilmiştir?", "o": ["Döviz opsiyonları", "Pay opsiyonları", "Emtia forwardları", "Kredi kartı alacakları", "Faiz swapları"], "a": 4, "e": "Kriz sonrasında belirli enstrümanlar için, uygulamada faiz swapları için zorunlu merkezi takasa geçildi."}, {"q": "Türkiye'de bankalararası TL ve döviz piyasalarında karşı taraf riski nasıl sınırlandırılır?", "o": ["Takasbank merkezi karşı taraf olur", "Tüm işlemlerden başlangıç teminatı alınır", "SPK her işlemi onaylar", "Borsa İstanbul garanti fonu kullanılır", "Line adı verilen karşı taraf risk limitleriyle"], "a": 4, "e": "Bu piyasalarda genel bir teminat alınmaz; işlem yapılacak bankalar ve tutarlara line denen karşı taraf limitleriyle sınır konur."}, {"q": "Aşağıdakilerden hangisi Borsa'da işlem gören paylar için Borsa dışında işlem yapılmasına izin verilebilecek istisnai durumlardan biri değildir?", "o": ["Miras paylaşımı", "Borsa dışı toptan veya blok satış", "Aracı kurumun gün içi portföy optimizasyonu", "Mahkeme kararı", "Rehin tasfiyesi"], "a": 2, "e": "Borsa önerisi ve SPK onayıyla izin verilebilen istisnalar işlem sırası kapalı paylar, blok satış, miras, mahkeme kararı ve rehin tasfiyesidir. Gün içi portföy optimizasyonu bu kapsamda değildir."}, {"q": "SPKn m.66'da tanımlanan alternatif işlem sistemleri ve çok taraflı işlem platformları gibi teşkilatlanmış diğer pazar yerleri, III-37.1 Tebliğ'deki tezgahüstü piyasa tanımına göre nerede yer alır?", "o": ["Tezgahüstü piyasa tanımının dışında kalır", "Tezgahüstü piyasanın bir alt türüdür", "Bankalararası piyasa sayılır", "Organize borsa sayılır", "Yalnızca türev işlemlerde tezgahüstü sayılır"], "a": 0, "e": "Tezgahüstü piyasa, borsalar ve teşkilatlanmış diğer pazar yerleri dışında kalan piyasalardır; bu nedenle teşkilatlanmış diğer pazar yerleri tanımın dışındadır."}, {"q": "Türkiye'de türev işlemlerin raporlandığı veri depolama kuruluşu olarak yetkilendirilen kurum hangisidir?", "o": ["TCMB", "Borsa İstanbul", "Merkezi Kayıt Kuruluşu (MKK)", "TSPB", "Takasbank"], "a": 2, "e": "MKK, SPK'nın 03.04.2015 tarihli kararıyla SPKn m.87 uyarınca veri depolama kuruluşu olarak yetkilendirildi; Elektronik Veri Deposu Sistemi 30.11.2018'de devreye girdi."}, {"q": "Elektronik Veri Deposu Sistemi'ne türev işlem detayları en geç ne zamana kadar raporlanır?", "o": ["İşlemden itibaren 10 gün içinde", "İşlem anında", "İşlemden itibaren 3 iş günü içinde", "Ay sonuna kadar", "İşlem gününün ertesi gününe kadar"], "a": 4, "e": "Fark sözleşmeleri, forward, futures, opsiyon ve swap işlem detayları en geç işlem gününün ertesi gününe kadar raporlanır."}, {"q": "Borsa İstanbul VİOP ve Swap Piyasası'nda gerçekleştirilen türev işlemleri Elektronik Veri Deposu Sistemi'ne kim raporlar?", "o": ["Takasbank", "MKK", "SPK", "İşlemin her iki tarafı", "Borsa İstanbul"], "a": 0, "e": "VİOP ve Swap Piyasası işlemlerini merkezi karşı taraf olan Takasbank raporlar."}, {"q": "İki gerçek kişi arasında yurt içinde tezgahüstü olarak yapılan bir türev sözleşmesi için raporlama yükümlülüğü kime aittir?", "o": ["Sözleşmeyi öneren tarafa", "Bildirim yükümlülüğü bulunmamaktadır", "Takasbank'a", "Her iki gerçek kişiye", "MKK'ya"], "a": 1, "e": "Raporlama tablosuna göre iki gerçek kişi arasındaki ve tüzel kişi ile gerçek kişi arasındaki yurt içi OTC işlemlerde bildirim yükümlülüğü yoktur."}, {"q": "Aracı kurumların tezgahüstü türev işlemlerinde teminatlandırma politikasında kullandıkları risk modelleri en az hangi sıklıkla geriye dönük stres testleriyle sınanmalıdır?", "o": ["Ayda bir", "Altı ayda bir", "İki yılda bir", "Yılda bir", "Üç ayda bir"], "a": 1, "e": "Risk modellerinin geçerliliği ve güvenilirliği en az altı ayda bir geriye dönük stres testleriyle sınanmak zorundadır."}, {"q": "Aracı kurumlar tezgahüstü türev işlemlerde kullandıkları elektronik işlem platformlarını kullanılmaya başlandıktan itibaren kaç gün içinde ve kime bildirmelidir?", "o": ["Ertesi iş günü MKK'ya", "10 gün içinde Borsa İstanbul'a", "5 gün içinde SPK'ya", "10 gün içinde Türkiye Sermaye Piyasaları Birliği'ne", "30 gün içinde SPK'ya"], "a": 3, "e": "Platform, program, modül ve eklentiler kullanılmaya başlandıktan itibaren on gün içinde Birliğe yazılı olarak bildirilir; bildirilmeyenler kullanılamaz."}, {"q": "Takasbank hangi tarihten itibaren hangi ürün için tezgahüstü türevlerde merkezi karşı taraf hizmeti vermeye başlamıştır?", "o": ["30 Kasım 2018, döviz forwardları", "1 Ekim 2018, para swapları", "19 Aralık 2019, TL faize dayalı swaplar", "16 Kasım 2020, altın swapları", "3 Nisan 2013, pay opsiyonları"], "a": 2, "e": "Takasbank 19 Aralık 2019'dan itibaren TL faize dayalı swaplar için merkezi karşı taraf hizmeti sunmaya başladı."}, {"q": "Tezgahüstü türev işlemlerde aracı kurumların müşterilerinden aldığı teminatlarla ilgili hangisi yanlıştır?", "o": ["Teminat yalnızca işlem sonrasında, ay sonunda talep edilir", "Asgari olarak başlangıç ve sürdürme teminatı belirlenir", "Teminat tamamlama çağrısı uygulaması vardır", "Teminat tesis edilmeden işleme başlanamaz", "Her müşteri için pozisyon limiti belirlenir"], "a": 0, "e": "Teminat işlem öncesinde istenir; teminat tesis edilmeden işlemlere başlanamaz."}]}, {"id": 10, "kisa": "TCMB ve Bankalararası", "baslik": "T.C. Merkez Bankası Piyasaları ve Bankalararası Piyasalar", "ozet": "TCMB'nin amaçları ve para politikası stratejileri, açık piyasa işlemleri, Bankalararası Para Piyasası, döviz işlemleri ve gösterge kur, reeskont, zorunlu karşılık ve ROM ile bankalararası repo, tahvil, TL, döviz, efektif ve altın piyasaları.", "notlar": "<h3>Ekonominin hedefleri ve merkez bankacılığı<\/h3>\n<ul>\n<li>Dört temel hedef: kaynakların tam istihdamı, sürdürülebilir büyüme, <b>fiyat istikrarı<\/b>, ödemeler dengesinde istikrar. Hedefler çatıştığı için maliye ve para politikası koordineli uygulanır.<\/li>\n<li>Dönemler: <b>1970 öncesi<\/b> maliye politikası ağırlıklı, para politikası destekleyici; <b>1970'ler<\/b> petrol krizi ve gevşek para politikası ile enflasyon; <b>1980'lerden<\/b> itibaren fiyat istikrarı asıl hedef.<\/li>\n<li>Miktar teorisine göre dolaşım hızı sabitken para arzındaki artış reel büyümeden fazlaysa enflasyon doğar.<\/li>\n<li>TCMB Kanunu: <b>1211 sayılı<\/b>, 14 Ocak 1970. <b>4651 sayılı Kanun (25 Nisan 2001)<\/b> ile temel amaç <b>fiyat istikrarı<\/b>; para politikasını ve araçlarını <b>doğrudan kendisi<\/b> belirler. Ayrıca finansal sistemde istikrarı sağlayıcı tedbirler alır.<\/li>\n<li>2008 krizi: fiyat istikrarının finansal istikrar için yeterli olmadığı anlaşıldı; makro ihtiyati araçlar yaygınlaştı.<\/li>\n<\/ul>\n\n<h3>Hazır imkânlar (standing facilities)<\/h3>\n<p>Politika faizlerinden kısa vadeli TL borç alma/verme imkânları. TCMB nihai kredi mercii olarak teminat karşılığı gün içi veya gün sonu kredi verebilir.<\/p>\n<ul>\n<li>TL depo borç alma ve borç verme<\/li>\n<li>Gün İçi Likidite (GİL)<\/li>\n<li>Geç Likidite Penceresi (GLP, LON)<\/li>\n<li>Likidite Desteği Kredisi<\/li>\n<li>BİST bünyesinde repo ve ters repo imkânı<\/li>\n<li>Piyasa yapıcısı bankalara likidite imkânı<\/li>\n<\/ul>\n\n<h3>Para politikası stratejileri<\/h3>\n<table><tr><th>Strateji<\/th><th>Özü<\/th><\/tr>\n<tr><td><b>Parasal hedefleme<\/b> (ara hedef)<\/td><td>Miktar teorisine dayanır; 1990'lara kadar yaygın. Repo, fon, kredi kartı, ATM gibi yenilikler para talebi tahminini zorlaştırınca etkisi azaldı.<\/td><\/tr>\n<tr><td><b>Kur çapası<\/b> (ara hedef)<\/td><td>Kurlar önceden ilan edilir; geriye dönük endekslemeyi kırmak için. TCMB'nin likidite ve faiz kontrolü kaybolur; bunları ödemeler dengesi belirler.<\/td><\/tr>\n<tr><td><b>MB bilanço hedeflemesi<\/b> (ara hedef, klasik IMF hedefi)<\/td><td>Net uluslararası rezervlere (NUR) <b>taban<\/b>, net iç varlıklara (NİV) <b>tavan<\/b><\/td><\/tr>\n<tr><td><b>Doğrudan enflasyon hedeflemesi<\/b><\/td><td>Hükümetle birlikte belirlenen enflasyon hedefi temel hedef; ara hedef ilan edilmez; hedef <b>nominal çapa<\/b> olur<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>İmkânsız üçlü:<\/b> sermaye hareketleri serbestken faiz ve kur birlikte kontrol edilemez.<\/li>\n<li>Türkiye: 2002 başında nihai hedefin enflasyon hedeflemesi olduğu duyuruldu; <b>2002–2005 örtük enflasyon hedeflemesi<\/b>; <b>2006 başından<\/b> itibaren açık enflasyon hedeflemesi. Üç yıllık hedef patikası.<\/li>\n<li>Yıl sonu enflasyonu nokta hedefin <b>2 puan<\/b> altında veya üstünde çıkarsa nedenler ve önlemler ayrı raporla <b>Hükümete<\/b> sunulur ve kamuoyuyla paylaşılır.<\/li>\n<li>2006'dan itibaren IMF şartlılığında NUR performans kriteri olarak kaldı; para tabanı kriteri ve NİV gösterge hedefi yerine <b>enflasyon gözden geçirme kriterleri<\/b> geldi.<\/li>\n<li><b>Para Politikası Kurulu<\/b> \"tavsiye veren\" konumdan <b>\"karar alıcı\"<\/b> konuma geçti. 2006'dan itibaren <b>üç ayda bir<\/b> yayımlanan <b>Enflasyon Raporu<\/b> temel iletişim aracı.<\/li>\n<li>Temel araç kısa vadeli (gecelik) faiz; gücü sinyal etkisiyle oluşan reel faize bağlı.<\/li>\n<li><b>2010 son çeyreğinden<\/b> itibaren fiyat istikrarına ek olarak finansal istikrar: bir hafta vadeli repo ihalesine ek olarak zorunlu karşılıklar, faiz koridoru ve likidite politikaları. Özet: <b>iki amaç, üç araç<\/b>.<\/li>\n<\/ul>\n\n<h3>Para politikası araçları<\/h3>\n<ol>\n<li>Açık piyasa işlemleri<\/li>\n<li>Döviz müdahaleleri, alım-satımları (ihale)<\/li>\n<li>Reeskont penceresi<\/li>\n<li>Zorunlu karşılıklar<\/li>\n<\/ol>\n<p>Dikkat: İlk üçü <b>para tabanını<\/b>, zorunlu karşılık ise <b>parasal çarpanı<\/b> etkiler.<\/p>\n\n<h3>Açık piyasa işlemleri (APİ)<\/h3>\n<ul>\n<li>Dayanak: 1211 sayılı Kanun <b>m.52<\/b>. TL karşılığı kesin alım satım, repo-ters repo, menkul kıymet ödünç, TL depo alma ve verme. Araçlar yüksek likiditeli ve az riskli olmalı.<\/li>\n<li><b>Likidite senedi<\/b>: TCMB kendi nam ve hesabına, vadesi <b>91 günü aşmayan<\/b>, ikincil piyasada alınıp satılabilen, iskontolu. Sürekli alternatif yatırım aracı olmaması için sınırlı ihraç. Likidite Senetleri Hakkında Tebliğ 5 Ekim 2006.<\/li>\n<li>Repo, ters repo ve TL depo işlemlerinin süresi <b>91 günü aşamaz<\/b> (başlangıç valör tarihi).<\/li>\n<li>APİ yalnız para politikası amacıyla; <b>Hazine'ye ve kamu kurumlarına kredi amacıyla yapılamaz<\/b>.<\/li>\n<li>Günümüz merkez bankacılığının <b>en etkin<\/b> aracıdır; faiz ve miktar TCMB'nin inisiyatifindedir; gelişmiş ve derin ikincil piyasa gerekir.<\/li>\n<li>Birimler: <b>Açık Piyasa İşlemleri Müdürlüğü<\/b> ve <b>Para Piyasaları Müdürlüğü<\/b>.<\/li>\n<\/ul>\n<table><tr><th>APİ zamanlaması<\/th><th>Saat<\/th><\/tr>\n<tr><td>İşlem saatleri<\/td><td>10:00–16:00<\/td><\/tr>\n<tr><td>Aynı gün valörlü standart ihale<\/td><td><b>11:00<\/b> (repo ve ters repo kesim saati)<\/td><\/tr>\n<tr><td>Gün içi geri satım vaadiyle alım (repo) ihaleleri<\/td><td>Herhangi bir anda ilan edilebilir<\/td><\/tr>\n<tr><td>Yükümlülüklerin yerine getirilmesi<\/td><td><b>16:45<\/b>'e kadar (EFT kapanışına kadar uzatılabilir)<\/td><\/tr>\n<\/table>\n<h4>İşlem çeşitleri<\/h4>\n<ul>\n<li><b>Depo:<\/b> TCMB'nin bankalara teminat ve limitlerle sağladığı imkân; Bankalararası Para Piyasası üzerinden. <b>TL depo alım ihalesi:<\/b> TL likidite fazlasını çekmek için.<\/li>\n<li>Geçici likidite açığı/fazlası: <b>Repo<\/b> = TCMB menkul kıymet alır, piyasaya likidite verir (katılımcılara TCMB'den <b>borç alma<\/b> imkânı). <b>Ters repo<\/b> = TCMB menkul kıymet satar, likidite çeker (katılımcılara TCMB'ye <b>borç verme<\/b> imkânı).<\/li>\n<li>Kalıcı açık/fazla: <b>doğrudan alım<\/b> (likidite verir), <b>doğrudan satım<\/b> (likidite çeker).<\/li>\n<li>Likidite senedi ihracı ve erken itfa dışındaki APİ yalnız <b>DİBS veya HMVKŞ'nin TL kira sertifikaları<\/b> karşılığında.<\/li>\n<\/ul>\n<h4>Yöntemler<\/h4>\n<table><tr><th>Yöntem<\/th><th>İşleyiş<\/th><\/tr>\n<tr><td>Geleneksel ihale<\/td><td>Kazanan her teklif <b>kendi<\/b> faiz/fiyatından<\/td><\/tr>\n<tr><td>Miktar yöntemi<\/td><td>Faiz/fiyat ve miktarı TCMB belirler; tutar tekliflerin toplam teklife oranına göre dağıtılır<\/td><\/tr>\n<tr><td>Son fiyat yöntemi<\/td><td>Teklifler sıralanır; tüm kazananlara ihaleyi kazanan <b>en son teklifin<\/b> fiyatı uygulanır<\/td><\/tr>\n<tr><td>Kotasyon<\/td><td>Faiz/fiyatı TCMB belirler; TCMB'nin BİST Borçlanma Araçları Piyasasındaki işlemleri bu yöntemle<\/td><\/tr>\n<\/table>\n<ul>\n<li>İhaleler Reuters veya TCMB İhale Sistemi (İhS) ile duyurulur, teklifler İhS ile alınır.<\/li>\n<li><b>Piyasa yapıcısı bankalara likidite:<\/b> 22.07.2002'den itibaren aldıkları ve itfa edilmemiş DİBS'lerin ihraç değerinin <b>%2<\/b>'si ile sınırlı; tamamı kotasyonla repoda, en fazla <b>%40<\/b>'ı ölçüt DİBS'leri TCMB'ye satmada kullanılabilir. Dikkat: <b>mevcut durumda kullandırılmıyor<\/b>.<\/li>\n<\/ul>\n<h4>Katılımcılar ve teminat<\/h4>\n<ul>\n<li>Tüm bankalar ve kriterlere göre seçilmiş aracı kurumlar. Aracı kurum şartları: halka arza aracılık, portföy yöneticiliği, yatırım danışmanlığı, repo-ters repo ve alım satıma aracılık yetkileri; asgari <b>6 milyon TL<\/b> ödenmiş sermaye; TCMB bloke deposunda ödenmiş sermayenin <b>en az %10<\/b>'u kadar DİBS veya HMVKŞ kira sertifikası; işlem için teminat.<\/li>\n<li>Teminat: her türlü DİBS, HMVKŞ kira sertifikaları (yurt içi ve dışı), döviz ve efektif deposu, yabancı devlet bono/tahvili, likidite senedi, Eurobond.<\/li>\n<\/ul>\n<table><tr><th>Teminat<\/th><th>İskonto<\/th><\/tr>\n<tr><td>DİBS ve HMVKŞ yurt içi kira sertifikası, vadesi 2 yıldan az (730 günden az)<\/td><td>%1<\/td><\/tr>\n<tr><td>Aynı, 2–5 yıl (730–1825 gün)<\/td><td>%2<\/td><\/tr>\n<tr><td>Aynı, 5 yıldan uzun (1825 gün ve üstü)<\/td><td>%3<\/td><\/tr>\n<tr><td>Eurobond, HMVKŞ yurt dışı kira sertifikası, IILM, yabancı bono/tahvil, döviz, efektif ve altın depoları, likidite senetleri<\/td><td>%5<\/td><\/tr>\n<\/table>\n<ul>\n<li>Repo ve ters repo vadesi 91 günü aşamaz; <b>komisyon ve masraf alınmaz<\/b>; <b>Resmi Gazete fiyatları<\/b> kullanılır.<\/li>\n<li>İskonto edilmiş teminat değeri, repo tutarı + faizden az olamaz.<\/li>\n<li>Doğrudan alımda vade sınırı yok; <b>kamu ihraçları birincil piyasadan alınamaz<\/b>.<\/li>\n<\/ul>\n\n<h3>Bankalararası Para Piyasası (TCMB)<\/h3>\n<ul>\n<li>TCMB Para Piyasaları Müdürlüğü bünyesinde, <b>2 Nisan 1986<\/b>'da kuruldu; garantör sıfatıyla aracılık (<b>blind-broker<\/b>) yapıyordu. <b>Aralık 2002<\/b>'den itibaren aracılığa son verildi; TL depo işlemleri yalnız TCMB adına.<\/li>\n<li>Katılımcılar: <b>yalnız bankalar<\/b>.<\/li>\n<li><b>GİL:<\/b> gün sonuna kadar ödenmek üzere, <b>faizsiz<\/b>, teminat karşılığı, limit dahilinde.<\/li>\n<li><b>TL depo:<\/b> TCMB gecelik (O/N) borç alma ve verme faizlerini ilan eder; bankalar teminat ve limit dahilinde borç alır, <b>limitsiz<\/b> borç verir. Gecelik faizin aşırı dalgalanmasını önler.<\/li>\n<li><b>TL depo alım ihalesi:<\/b> faiz teklifleri <b>1 baz puan<\/b> ve katları (%13,01, %13,07 gibi).<\/li>\n<li><b>Geç Likidite Penceresi:<\/b> <b>16:00–17:00<\/b>, gecelik, teminat karşılığı <b>limitsiz<\/b> borçlanma; borç verme de mümkün. Faiz alışta daha düşük, satışta daha yüksek. Zorunlu karşılık tesis döneminin son iş günü <b>16:00–17:15<\/b>.<\/li>\n<li>Teminat <b>borçlanma tutarının üzerinde<\/b> olmalı.<\/li>\n<li><b>Likidite Desteği Kredisi<\/b> (TCMB Kanunu m.40/I-c): bankacılık sisteminde güvensizlik ve fon çekilişi hızlanırsa, <b>ödeme kabiliyeti olan<\/b> bankalara; <b>özkaynağın iki katı<\/b> ile sınırlı, teminatlı, avans şeklinde, <b>birer aylık<\/b> vadelerle, <b>en fazla bir yıl<\/b>.<\/li>\n<li>Olağanüstü hallerde TMSF kaynakları yetmezse Fon'a avans işlemleri de bu müdürlükte.<\/li>\n<\/ul>\n\n<h3>Döviz ve efektif işlemleri<\/h3>\n<ul>\n<li>TCMB Kanunu m.4-b ve m.53-a. <b>Kur rejimini TCMB ve Hükümet birlikte<\/b> belirler; kur politikası, yani döviz alım satım kararı <b>TCMB<\/b>'nindir. Operasyonları <b>Döviz ve Efektif Piyasaları Müdürlüğü<\/b> yürütür; katılımcılar yalnız bankalar.<\/li>\n<li>Müdürlüğün görevleri: piyasayı izlemek ve müdahale, gösterge kurları belirlemek, yurt dışına TL banknot göndermek, iki gün ihbarlı DTH hesaplarını takip, döviz karşılığı efektif alım satım, döviz depo piyasasında aracılık.<\/li>\n<li><b>Gösterge kur (1 Nisan 2002'den beri):<\/b> her iş günü <b>10.30, 11.30, 12.30, 13.30, 14.30, 15.30<\/b>'da 1 milyon ABD Doları için kotasyon veren bankaların alım-satım ortalamalarının ortalaması alınır; bu <b>6 ortalamanın aritmetik ortalaması<\/b> saat <b>15.30<\/b> itibarıyla gösterge niteliğindeki 1 ABD Doları satış kurudur. Diğer kurlar çapraz kurların ortalamasıyla.<\/li>\n<li><b>Şubat 2001<\/b>'den beri <b>dalgalı kur<\/b>: kur hedefi yok; müdahaleler seviyeye değil <b>aşırı oynaklığa<\/b>; döviz müdahalesi para politikası aracı olarak kullanılmaz. Rezerv biriktirmek için döviz alım ihaleleri, derinlik kaybında döviz satım ihaleleri.<\/li>\n<li>Kuru belirleyenler: faiz farkı (yüksek faiz değer kazandırır), büyüme farkı, göreli fiyat seviyesi (yurt içi fiyat artışı değer kaybettirir), ödemeler dengesi (açık değer kaybettirir).<\/li>\n<li><b>Gürültücü işlemciler (noisy traders)<\/b>: temellerden bağımsız işlemler zaman zaman piyasa hacminin <b>%90<\/b>'ına ulaşır; kısa vadede kur sistematik tahmin edilemez.<\/li>\n<\/ul>\n\n<h3>Reeskont penceresi<\/h3>\n<ul>\n<li>TCMB Kanunu <b>m.45<\/b>: muteber <b>en az üç imzalı<\/b>, vadesine <b>en çok 120 gün<\/b> kalmış ticari senetler reeskonta kabul edilebilir; karşılığında avans da verilebilir.<\/li>\n<li>1990'ların başına kadar yatırım, tevsii, işletme ve ihracat kredileri verildi; bugün bankalar APİ ile fonlandığından <b>reeskont kredisi kullandırılmıyor<\/b>.<\/li>\n<\/ul>\n\n<h3>Zorunlu karşılıklar<\/h3>\n<ul>\n<li>2010 son çeyreğinden itibaren aktif kullanılan araç. Yükümlülükler <b>iki haftada bir cuma<\/b> günü hesaplanır. Tesis, hesaplama tarihini izleyen <b>iki hafta sonraki cuma<\/b> başlar ve <b>14 gün<\/b> sürer.<\/li>\n<li>Tabi olanlar: bankalar ve finansman şirketleri (yurt dışı şubeler dahil). TCMB'ye, Hazine'ye, yurt içi bankalara ve uluslararası anlaşmayla kurulan bankalara olan yükümlülükler hariç.<\/li>\n<li>Zorunlu karşılığa tabi kalemler: mevduat/katılım fonu, <b>repo fonları<\/b>, kullanılan krediler (Hazine garantili hariç), ihraç edilen menkul kıymetler (net), sermayeye dahil edilmeyen borçlanma araçları, yurt dışı merkeze yükümlülükler (net), kredi kartı ödemelerinden borçlar, müstakrizlerin fonları. (Not: BİST Repo Ters Repo Pazarı'ndaki banka repo fonları zorunlu karşılığa tabi değildir.)<\/li>\n<li>TL yükümlülük için TL; YP yükümlülük için USD kısmı USD, kalanı USD veya EUR olarak TCMB'de tesis edilir. Faiz/nema ödenebilir.<\/li>\n<\/ul>\n<h4>Rezerv Opsiyonu Mekanizması (ROM)<\/h4>\n<table><tr><th>TL zorunlu karşılığın tesis edilebileceği<\/th><th>Azami oran<\/th><\/tr>\n<tr><td>ABD Doları<\/td><td>%45<\/td><\/tr>\n<tr><td>Standart altın<\/td><td>%30<\/td><\/tr>\n<tr><td>Yurt içi yerleşiklerden toplanan işlenmiş veya hurda altından dönüştürülen standart altın<\/td><td>%5<\/td><\/tr>\n<\/table>\n<ul>\n<li>Tutarlar dilimlere karşılık gelen katsayılarla çarpılır. <b>ROO<\/b> (rezerv opsiyonu oranı) üst limiti, <b>ROK<\/b> (rezerv opsiyonu katsayısı) birim TL karşılık başına tutulacak döviz/altını belirler. <b>Eşik ROK<\/b> YP ve TL kaynakların göreli maliyetine bağlıdır.<\/li>\n<li>Faydaları: kısa vadeli sermaye akımı oynaklığını azaltır, brüt rezervleri güçlendirir, bankalara likidite esnekliği verir, kredilerin sermaye akımına duyarlılığını azaltır, bankaya optimizasyon imkânı verir; otomatik dengeleyici olduğundan faiz koridoruna ihtiyacı kısmen azaltır.<\/li>\n<li>Sermaye girişi hızlanınca YP kaynak ucuzlar, eşik ROK artar, bankalar ROM'u daha çok kullanır; giriş yavaşlayınca ROM kullanımı azalır, TL likidite talebi artar.<\/li>\n<li>Türkiye'de ithal ara malı yoğunluğu nedeniyle kurun enflasyona etkisi daha çok <b>maliyet<\/b> kanalıyla ve hızlı işler.<\/li>\n<\/ul>\n\n<h3>Bankalararası piyasalar<\/h3>\n<table><tr><th>Piyasa<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Bankalararası repo<\/td><td>Yatırım kuruluşları kendi aralarında, özel düzenlemeye tabi olmadan; yalnız line'ı olanlarla; oranlar çoğunlukla BİST BAP repo oranları baz alınarak<\/td><\/tr>\n<tr><td>Bankalararası tahvil<\/td><td>Sabit getirili kıymetlerin doğrudan alım satımı, kendi aralarında; line dahilinde<\/td><\/tr>\n<tr><td>Bankalararası TL<\/td><td><b>Teminat istenmez<\/b>; bu yüzden line limitleri. Likidite artar, nakit ihtiyacı azalırsa oranlar düşer; tersi oranları artırır<\/td><\/tr>\n<tr><td>Bankalararası döviz<\/td><td>İşlem türü ve vade kısıtı yok; spot, vadeli ve türev. Fiziki mekân yok; teminat yok; Reuters, Bloomberg ve telefon. <b>Yatırımcılar doğrudan işlem yapamaz<\/b>, bankalar aracılığıyla. Genelde <b>1.000.000 USD<\/b> için çift yönlü kotasyon; işlemler genelde aynı gün veya spot valör; ödeme emirleri <b>SWIFT<\/b> ile. Dünyada spot döviz işlemleri <b>FOREX<\/b> denilen bankalararası OTC piyasada. TCMB aşırı oynaklıkta müdahale edebilir.<\/td><\/tr>\n<tr><td>Serbest döviz (efektif) piyasası<\/td><td>Bankalar ve yetkili müesseseler; fiyat efektif arz-talebiyle. Döviz piyasaları <b>tam rekabete oldukça yakın<\/b>: çok sayıda alıcı-satıcı, serbest giriş-çıkış, homojen varlık, iyi bilgi. İşlemlerin çoğu spot<\/td><\/tr>\n<tr><td>Kapalıçarşı efektif piyasası<\/td><td>Nakit efektif; takas hemen; <b>teminat yok<\/b>, güvene dayalı, sözlü işlem; <b>sınırlı işlem saati yok<\/b>; genelde USD ve EUR, daha az CHF ve GBP<\/td><\/tr>\n<tr><td>Serbest altın piyasası<\/td><td>Hiçbir düzenlemeye tabi değil; pazarlık usulü; TL altın fiyatı ons/dolar fiyatı ve USD/TL kuruna bağlı<\/td><\/tr>\n<\/table>", "sorular": [{"q": "4651 sayılı Kanun ile yapılan değişiklikten sonra TCMB'nin temel amacı nedir?", "o": ["Döviz kurunu sabit tutmak", "Tam istihdamı sağlamak", "Ekonomik büyümeyi desteklemek", "Hazine'nin finansman ihtiyacını karşılamak", "Fiyat istikrarını sağlamak"], "a": 4, "e": "25 Nisan 2001 tarihli 4651 sayılı Kanun ile TCMB'nin temel amacı fiyat istikrarı olarak belirlendi; para politikası ve araçlarını doğrudan kendisi belirler."}, {"q": "Aşağıdaki para politikası araçlarından hangisi para tabanını değil parasal çarpanı etkilemek için kullanılır?", "o": ["Reeskont penceresi", "Döviz alım ihaleleri", "Zorunlu karşılıklar", "Döviz satım ihaleleri", "Açık piyasa işlemleri"], "a": 2, "e": "Açık piyasa işlemleri, döviz müdahaleleri ve reeskont para tabanını; zorunlu karşılıklar parasal çarpanı etkiler."}, {"q": "Net uluslararası rezervlere taban, net iç varlıklara tavan hedef konulan ve klasik IMF program hedefi olarak bilinen strateji hangisidir?", "o": ["Örtük enflasyon hedeflemesi", "Doğrudan enflasyon hedeflemesi", "Parasal hedefleme", "Merkez Bankası bilanço hedeflemesi", "Kur çapası"], "a": 3, "e": "MB bilanço hedeflemesinde NUR'a taban konularak döviz rezervi korunur, NİV'e tavan konularak parasal genişleme önlenir."}, {"q": "Sermaye hareketleri serbestken faiz oranlarının ve döviz kurunun aynı anda kontrol edilemeyeceğini ifade eden prensip hangisidir?", "o": ["Nominal çapa", "İmkânsız üçlü", "Miktar teorisi", "Faiz koridoru", "Sinyal etkisi"], "a": 1, "e": "İmkânsız üçlü prensibine göre faiz kontrol edilirken kuru piyasa belirler; kur kontrol edilirken merkez bankasının faiz üzerindeki etkisi kaybolur."}, {"q": "TCMB örtük enflasyon hedeflemesini hangi dönemde uygulamış, açık enflasyon hedeflemesine ne zaman geçmiştir?", "o": ["2002–2005 / 2006 başı", "2001–2003 / 2004 başı", "1998–2001 / 2002 başı", "2006–2009 / 2010 son çeyreği", "2003–2006 / 2007 başı"], "a": 0, "e": "2002–2005 döneminde örtük enflasyon hedeflemesi uygulandı; 2006 başından itibaren enflasyon hedeflemesi rejimine geçildi."}, {"q": "Enflasyon hedeflemesinde yıl sonu enflasyonunun nokta hedeften ne kadar sapması halinde TCMB nedenleri ve önlemleri içeren ayrı bir raporu Hükümete sunar?", "o": ["3 puan", "2 puan", "1,5 puan", "5 puan", "1 puan"], "a": 1, "e": "Gerçekleşen enflasyon nokta hedefin iki puan altında veya üstünde çıkarsa TCMB ayrı bir raporla Hükümete açıklama yapar ve raporu kamuoyuyla paylaşır."}, {"q": "TCMB'nin açık piyasa işlemleri kapsamında yaptığı repo, ters repo ve TL depo işlemlerinin süresi en fazla ne kadar olabilir?", "o": ["1 yıl", "7 gün", "91 gün", "182 gün", "30 gün"], "a": 2, "e": "1211 sayılı Kanun m.52'ye göre bu işlemlerin süresi 91 günü aşamaz; likidite senetlerinin vadesi de 91 günü aşamaz."}, {"q": "TCMB açık piyasa işlemleri ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Kamunun ihraç ettiği kıymetler birincil piyasadan alınamaz", "Yalnızca para politikası amaçları için yürütülür", "İşlemlerden komisyon veya masraf alınmaz", "Repo işlemlerinde Resmi Gazete fiyatları kullanılır", "Hazine'ye kredi amacıyla yapılabilir"], "a": 4, "e": "Açık piyasa işlemleri Hazine'ye, kamu kurum ve kuruluşlarına ve diğer kuruluşlara kredi amacıyla yapılamaz."}, {"q": "TCMB'nin aynı gün valörlü standart repo ve ters repo ihaleleri için kesim saati ile kuruluşların yükümlülüklerini yerine getirme son saati hangisidir?", "o": ["10:00 / 16:00", "11:00 / 17:00", "14:00 / 16:45", "11:00 / 16:45", "10:30 / 15:30"], "a": 3, "e": "Standart ihaleler genelde 11:00'de yapılır; yükümlülükler 16:45'e kadar yerine getirilir. İşlem saatleri 10:00–16:00'dır."}, {"q": "TCMB 100 milyon TL'lik bir ihaleyi miktar yöntemiyle yapmaktadır. A bankası 150 milyon TL, B bankası 50 milyon TL teklif vermiştir. A bankasına ne kadar tahsis edilir?", "o": ["75 milyon TL", "66,7 milyon TL", "100 milyon TL", "150 milyon TL", "50 milyon TL"], "a": 0, "e": "Miktar yönteminde tutar, teklifin toplam teklife oranına göre dağıtılır: 100 × 150 / 200 = 75 milyon TL."}, {"q": "Tüm kazanan tekliflere ihaleyi kazanan en son teklifin fiyatının uygulandığı ihale yöntemi hangisidir?", "o": ["Kotasyon yöntemi", "Son fiyat yöntemi", "Geleneksel yöntem", "Hollanda usulü teminat yöntemi", "Miktar yöntemi"], "a": 1, "e": "Son fiyat yönteminde teklifler sıralanır ve satılmak istenen tutara ulaşılana kadar tüm tekliflere kazanan en son teklifin fiyatı uygulanır. Geleneksel yöntemde her teklif kendi fiyatından işlem görür."}, {"q": "Vadesi 600 gün olan ve Resmi Gazete fiyatıyla 1.000.000 TL değerindeki bir DİBS, TCMB açık piyasa işlemlerinde teminat olarak ne kadar değerlenir?", "o": ["990.000 TL", "950.000 TL", "970.000 TL", "980.000 TL", "1.000.000 TL"], "a": 0, "e": "Vadesi 2 yıldan (730 günden) az DİBS için iskonto %1'dir: 1.000.000 × 0,99 = 990.000 TL. 2–5 yıl için %2, 5 yıldan uzun için %3 uygulanır."}, {"q": "Bir aracı kurumun TCMB açık piyasa işlemlerine katılabilmesi için gereken asgari ödenmiş sermaye ve bloke depoda tutması gereken DİBS veya kira sertifikası oranı hangisidir?", "o": ["20 milyon TL / ödenmiş sermayenin en az %10'u", "10 milyon TL / ödenmiş sermayenin en az %5'i", "6 milyon TL / ödenmiş sermayenin en az %20'si", "Sermaye şartı yoktur", "6 milyon TL / ödenmiş sermayenin en az %10'u"], "a": 4, "e": "Aracı kurumlar için asgari 6 milyon TL ödenmiş sermaye ve bloke depoda ödenmiş sermayenin en az %10'unu karşılayacak DİBS veya HMVKŞ kira sertifikası gerekir."}, {"q": "TCMB Bankalararası Para Piyasası ile ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Gün içi likidite imkânı faizlidir", "TCMB hâlen bankalar arasında blind-broker olarak aracılık yapmaktadır", "TL depo işlemlerinde bankalar limitli olarak borç verebilir", "Bankalar ve aracı kurumlar katılabilir", "2 Nisan 1986'da kurulmuş, Aralık 2002'den itibaren TCMB aracılık faaliyetine son vermiştir"], "a": 4, "e": "Piyasa 2 Nisan 1986'da kuruldu; Aralık 2002'den itibaren aracılığa son verildi. Katılımcılar yalnız bankalardır, GİL faizsizdir, bankalar limitsiz borç verebilir."}, {"q": "TCMB'nin Geç Likidite Penceresi işlemleri normal günlerde hangi saatler arasında yapılır?", "o": ["15:00–16:00", "09:00–09:30", "16:00–17:00", "17:00–18:00", "16:00–17:15"], "a": 2, "e": "GLP işlemleri 16:00–17:00 arasında yapılır; zorunlu karşılık tesis döneminin son iş gününde 16:00–17:15'tir."}, {"q": "Likidite Desteği Kredisi için aşağıdakilerden hangisi doğrudur?", "o": ["Özkaynak kadar, üç aylık vadelerle, en fazla iki yıl kullandırılabilir", "Gün içinde faizsiz olarak kullandırılır", "Özkaynağın iki katı ile sınırlı, birer aylık vadelerle, en fazla bir yıl süreyle kullandırılabilir", "Yalnızca aracı kurumlara verilir", "Ödeme güçlüğündeki tüm bankalara teminatsız verilir"], "a": 2, "e": "Ödeme kabiliyeti olan bankalara özkaynağın iki katıyla sınırlı, teminat karşılığı, avans şeklinde, birer aylık vadelerle ve en fazla bir yıl süreyle kullandırılabilir."}, {"q": "TCMB'nin bankalararası döviz piyasasından 10.30–15.30 arasında saat başı tespit ettiği altı ortalama sırasıyla 32,10; 32,12; 32,15; 32,11; 32,14 ve 32,16'dır. Gösterge niteliğindeki ABD Doları satış kuru kaçtır?", "o": ["32,14", "32,13", "32,16", "32,10", "32,12"], "a": 1, "e": "Gösterge kur altı ortalamanın aritmetik ortalamasıdır: 192,78 / 6 = 32,13. Son saatin değeri olan 32,16 tek başına gösterge kur değildir."}, {"q": "Dalgalı kur rejiminde TCMB'nin döviz müdahaleleri için hangisi doğrudur?", "o": ["Hiçbir koşulda yapılmaz", "Temel para politikası aracıdır", "Belirli bir kur seviyesini korumaya yöneliktir", "Seviyeye değil aşırı oynaklığa yöneliktir", "Hükümetin talimatıyla yapılır"], "a": 3, "e": "Şubat 2001'den beri uygulanan dalgalı kurda kur hedefi yoktur; müdahaleler seviyeye değil aşırı oynaklığa yöneliktir ve para politikası aracı olarak kullanılmaz."}, {"q": "TCMB Kanunu m.45'e göre reeskonta kabul edilecek ticari senetlerin şartları hangisidir?", "o": ["En az bir imza, vadesine en çok 91 gün", "En az iki imza, vadesine en çok 90 gün", "En az iki imza, vadesine en çok 365 gün", "En az üç imza, vadesine en çok 120 gün", "En az üç imza, vadesine en çok 180 gün"], "a": 3, "e": "Muteber sayılan asgari üç imzayı taşıyan ve vadesine en çok 120 gün kalmış ticari senetler reeskonta kabul edilebilir; bugün reeskont kredisi kullandırılmamaktadır."}, {"q": "Zorunlu karşılıkların hesaplanması ve tesisi ile ilgili hangisi doğrudur?", "o": ["Yükümlülükler iki haftada bir cuma hesaplanır, tesis ertesi gün başlar", "Yükümlülükler her pazartesi hesaplanır, tesis 7 gün sürer", "Yükümlülükler her ay sonu hesaplanır, tesis 30 gün sürer", "Yükümlülükler iki haftada bir cuma hesaplanır, tesis iki hafta sonraki cuma başlar ve 14 gün sürer", "Tesis süresi 28 gündür"], "a": 3, "e": "Zorunlu karşılığa tabi yükümlülükler iki haftada bir cuma hesaplanır; tesis, hesaplama tarihini izleyen iki hafta sonraki cuma başlar ve 14 gün sürer."}, {"q": "Rezerv Opsiyonu Mekanizması çerçevesinde TL yükümlülükler için tutulması gereken zorunlu karşılıkların en fazla ne kadarı ABD Doları ve standart altın cinsinden tesis edilebilir?", "o": ["ABD Doları %45, standart altın %5", "ABD Doları %45, standart altın %30", "ABD Doları %50, standart altın %50", "ABD Doları %30, standart altın %45", "ABD Doları %60, standart altın %30"], "a": 1, "e": "TL zorunlu karşılıkların en fazla %45'i ABD Doları, en fazla %30'u standart altın, en fazla %5'i yurt içi hurda/işlenmiş altından dönüştürülen standart altın cinsinden tesis edilebilir."}, {"q": "Aşağıdakilerden hangisi zorunlu karşılığa tabi yükümlülüklerden biri değildir?", "o": ["Yurt içi bankalara olan yükümlülükler", "Müstakrizlerin fonları", "Kredi kartı ödemelerinden borçlar", "Repo işlemlerinden sağlanan fonlar", "Mevduat ve katılım fonu"], "a": 0, "e": "TCMB'ye, Hazine'ye, yurt içi bankalara ve uluslararası anlaşmayla kurulan bankalara olan yükümlülükler zorunlu karşılık hesabına dahil edilmez."}, {"q": "Bankalararası döviz piyasası ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Fiziki bir mekân değildir", "İşlemlerden teminat alınmaz", "Yatırımcılar bu piyasada doğrudan işlem yapabilir", "Ödeme emirleri SWIFT aracılığıyla gönderilir", "Katılımcılar genelde 1.000.000 USD için çift yönlü kotasyon verir"], "a": 2, "e": "Yatırımcılar bankalararası döviz piyasasında doğrudan işlem yapamaz, işlemlerini bankalar aracılığıyla gerçekleştirir."}, {"q": "Kapalıçarşı Efektif Piyasası için aşağıdakilerden hangisi doğrudur?", "o": ["İşlemler nakit efektifle yapıldığı için takas hemen gerçekleşir, teminat alınmaz", "Yalnızca TCMB fiyat ilan eder", "Takasbank merkezi karşı taraftır", "İşlem saatleri 09:30–17:30 ile sınırlıdır", "İşlemler yazılı sözleşmeyle ve teminatla yapılır"], "a": 0, "e": "Kapalıçarşı'da işlemler nakit efektifle yapılır, takas hemen gerçekleşir; teminat yoktur, ilişkiler güvene dayalı ve sözlüdür; sınırlı işlem saati yoktur."}]}, {"id": 11, "kisa": "Takasbank Ödünç Pay (ÖPP)", "baslik": "Takasbank Ödünç Pay Piyasası (ÖPP)", "ozet": "Takasbank'ın merkezi karşı taraf olduğu ödünç pay piyasasının kıymetleri, limitleri, seans, valör ve vadeleri, emir türleri, teminat ve garanti fonu, komisyon, haklar ve temerrüt kuralları.", "notlar": "<h3>Tanım ve Takasbank'ın konumu<\/h3>\n<ul>\n<li><b>ÖPP<\/b>, teminat göstererek pay ödünç almak veya vermek isteyen aracı kurum ve bankalar ile müşterilerinin talep ve tekliflerini buluşturan, <b>Takasbank'ın kurduğu ve işlettiği<\/b> piyasadır.<\/li>\n<li>Takasbank <b>açık teklif yöntemiyle merkezi karşı taraftır<\/b>: ödünçler eşleştiği anda araya girer; ödünç verene karşı ödünç alan, ödünç alana karşı ödünç verendir. Yükümlülüğü eşleşmeyle başlar, tasfiyeyle biter.<\/li>\n<li>Müşteri işlemlerinde Takasbank'ın muhatabı <b>üyedir<\/b>.<\/li>\n<li>Vadede Takasbank kıymeti ödünç verene iade eder ve komisyonu öder; iade mümkün değilse nakit karşılığı öder. Ödünç alan kıymeti geri verir ve komisyonu öder.<\/li>\n<\/ul>\n\n<h3>Üyelik<\/h3>\n<ul>\n<li>Ödünç işlemine imkân veren faaliyet izni olan ve Prosedür şartlarını sağlayan kuruluşlar, Takasbank yetkilendirirse üye olur; <b>Ödünç Pay Piyasası Sözleşmesi<\/b> imzalanır.<\/li>\n<li>Faaliyetler kısıtlanabilir: MKT Yönetmeliği m.13-14 kapsamında durdurma/kısıtlama, yükümlülük ihlali, protesto, haciz, ihtiyati tedbir, yetki belgesi iptali, iflas, olumsuz istihbarat, kredi değerliliğinin azalması. Kıymet temerrüdündeki veya işlem yasaklı hesaplar adına işlem yapılamaz. Takasbank yükümlülüklerin tasfiyesine karar verirse borçlar muaccel olur.<\/li>\n<li>Üyelik MKT Yönetmeliği m.15 ve Merkezi Takas Yönetmeliği m.13'e göre sona erer.<\/li>\n<\/ul>\n\n<h3>İşleme konu kıymetler ve limitler<\/h3>\n<ul>\n<li>Kredili alım ve açığa satışa konu olan <b>Yıldız Pazar ve Ana Pazar<\/b> payları ile <b>borsa yatırım fonu<\/b> katılma belgeleri. Listeden çıkarılanlar, son tarihin takas süresi sonundan itibaren ödünce konu olmaz.<\/li>\n<li><b>Piyasa değeri<\/b> = bir önceki son seansın ağırlıklı ortalama fiyatı × adet. Gün içi değerlemede saat <b>12:00<\/b>'deki ağırlıklı ortalama. İşlem yoksa en iyi alış ve satışın ortalaması; biri yoksa son seans ağırlıklı ortalaması.<\/li>\n<li>Takasbank üyeye <b>ÖPP limiti<\/b> tahsis eder (taahhüt değildir, değiştirilebilir). Ödünç alma işlemlerinin piyasa değeri toplamı limiti aşamaz. Dikkat: <b>ödünç verene limit şartı yok<\/b>.<\/li>\n<li>Bir emrin azami piyasa değeri, Borsa spot piyasadaki azami işlem değeridir.<\/li>\n<\/ul>\n<table><tr><th>Kıymet bazında sınır (halka açık tutarın)<\/th><th>Oran<\/th><\/tr>\n<tr><td>ÖPP'deki toplam açık işlemler<\/td><td>%20<\/td><\/tr>\n<tr><td>Üye bazında açık işlemler<\/td><td>%5<\/td><\/tr>\n<tr><td>Tek bir sicil bazında açık işlemler<\/td><td>%3<\/td><\/tr>\n<\/table>\n\n<h3>Seans, valör, vade<\/h3>\n<table><tr><th>Kural<\/th><th>Değer<\/th><\/tr>\n<tr><td>Seans<\/td><td><b>09:30–16:45<\/b>, tek seans (Takasbank değiştirebilir)<\/td><\/tr>\n<tr><td>Valör<\/td><td>Aynı gün, 1 iş günü veya 2 iş günü<\/td><\/tr>\n<tr><td>Vade<\/td><td>Vadesiz; 1 haftaya kadar her gün; 1, 2, 3 hafta; 1, 2, 3, 6, 9, 12 ay<\/td><\/tr>\n<tr><td>Vadesiz işlem<\/td><td>Kapatma talebi gelmezse en fazla 1 yıl; sistemde 365 gün tutulur; geri çağırma/erken kapama gün içinde 18:00'e kadar girilir<\/td><\/tr>\n<tr><td>Komisyon adımı<\/td><td><b>%0,05<\/b> (onbinde beş) ve katları; 1 yıl = 365 gün<\/td><\/tr>\n<tr><td>Teminat giriş-çıkış<\/td><td>17:15'e kadar (nemalanmayan nakit TL 17:05'e kadar)<\/td><\/tr>\n<tr><td>Ödünç kapama son saati<\/td><td>17:00<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Vadesiz işlem<\/b> ödünç alana erken kapama, ödünç verene geri çağırma hakkı verir; vadesiz emir yalnız vadesiz emirle eşleşir.<\/li>\n<li><b>Geri çağırma:<\/b> valör ile azami 1 yıllık sürenin 3 iş günü öncesi arasında; 12:00'ye kadar bildirilirse ödünç alan <b>T+2<\/b>'de, 12:00'den sonra <b>T+3<\/b>'te iade eder.<\/li>\n<li><b>Erken kapama:<\/b> en erken valörü izleyen <b>3. iş günü<\/b>; iade gününden en az <b>2 iş günü<\/b> önce bildirilir.<\/li>\n<li><b>Sözleşme temditi:<\/b> iki taraf kabul ederse kapama yapılmadan vade uzatılır; vade ve komisyon oranı değişebilir.<\/li>\n<\/ul>\n\n<h3>Emirler ve eşleşme<\/h3>\n<ul>\n<li>Zorunlu unsurlar: emir tipi (<b>talep<\/b> = ödünç alma, <b>teklif<\/b> = ödünç verme), emir türü, müşteri tipi (portföy, müşteri, Fon/YO), kıymet grubu (E veya BF), kıymet kodu, adet, valör, vade türü, komisyon oranı. Müşteri ve portföy için MKK hesap numarası; ilk işlemde MKK sicil numarası bir defa tanımlanır.<\/li>\n<li>Emir için <b>garanti fonu katkı payı<\/b> yükümlülüğü yerine getirilmiş olmalı (tamamlama süresinde işlem sürer); ödünç talebi için yeterli <b>limit ve teminat<\/b> gerekir.<\/li>\n<li>Bağlantı sorununda e-postayla talimat; emir giriş zamanı Takasbank'ın girdiği an; yazılı talimatın aslı <b>5 iş günü<\/b> içinde.<\/li>\n<\/ul>\n<table><tr><th>Emir türü<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Günlük<\/td><td>Gerçekleşmeyen kısım pasifte bekler, seans sonunda iptal<\/td><\/tr>\n<tr><td>Kalanı İptal Et (KİE)<\/td><td>Gerçekleşmeyen kısım pasife yazılmadan iptal<\/td><\/tr>\n<tr><td>Blok Eşleşmezse İptal Et (BEİE)<\/td><td>Tamamen gerçekleşmezse tümü iptal<\/td><\/tr>\n<tr><td>Özel emir<\/td><td>Taraflar önce anlaşır, karşı üye kodu girilir, karşı üye onaylarsa işlem; üye kendisini karşı taraf yapabilir; <b>değiştirilemez<\/b>; veri ekranlarına yansımaz<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Öncelik:<\/b> talepte <b>en yüksek<\/b>, teklifte <b>en düşük<\/b> komisyon oranı; sonra zaman. Düşük oranlı teklif gelirse bekleyen talebin, yüksek oranlı talep gelirse bekleyen teklifin oranından işlem olur.<\/li>\n<li>Müşteri hesapları farklıysa iki taraf aynı üye olabilir. Dikkat: <b>işlemler iptal edilemez<\/b>; yalnız ileri valörlü işlemde özel durumlarda Takasbank takastan önce iptal edebilir.<\/li>\n<li>Değiştirilen emir yeni numara ve zaman alır; ancak <b>emir türü değişikliğinde öncelik ve numara korunur<\/b>. Komisyon oranı iki yönde değiştirilebilir.<\/li>\n<li>Veri ekranlarında derinlik <b>5 kademe<\/b>.<\/li>\n<li>Ödünç verenin kıymeti MKK'daki <b>ÖPP Alt Hesabı<\/b>ndan alınır; ödünç alanın aynı kıymetten borcu varsa <b>Ödünç Kapama Blokaj Hesabı<\/b>na, yoksa <b>Serbest Alt Hesap<\/b>'a geçer.<\/li>\n<li>Takas: aynı gün valörlüde <b>işlem anında<\/b>, ileri valörlüde valör günü.<\/li>\n<\/ul>\n\n<h3>Teminatlar<\/h3>\n<ul>\n<li>Kabul edilenler: nakit TL; USD, EUR, GBP; DİBS; Hazine Eurobond; Hazine VKŞ kira sertifikaları; <b>BIST 100<\/b> payları; hisse senedi ve borçlanma araçları şemsiye fon payları; standart altın; İTMK, İDMK, VTMK, VDMK; <b>Borsa İstanbul payları<\/b> (yalnız portföy adına); Darphane altın sertifikaları. Dikkat: <b>teminat mektubu yok<\/b>.<\/li>\n<li>Toplam teminat gereksiniminin <b>en az %30<\/b>'u TL olmalı.<\/li>\n<li>Altın: KMKTP'de işlem gören külçelerden <b>100 gram ve katları<\/b>. Borsa'da sırası kapanan pay teminat özelliğini kaybeder.<\/li>\n<li><b>Ödünç verenden teminat istenmez.<\/b> Başlangıç teminatı alınır; <b>sürdürme seviyesi<\/b> = değerlenmiş teminat / toplam ödünç borcu = <b>%110<\/b>.<\/li>\n<li>TL nakit teminat 15:45 bakiyesi üzerinden nemalandırılır; brüt nemadan vergiler ve <b>%5<\/b> Takasbank ücreti düşülür, ertesi iş günü eklenir.<\/li>\n<\/ul>\n<table><tr><th>Teminat<\/th><th>Grup limiti<\/th><th>Değerleme katsayısı<\/th><\/tr>\n<tr><td>Nakit TL<\/td><td>%100<\/td><td>%100<\/td><\/tr>\n<tr><td>Döviz USD / EUR, GBP<\/td><td>%70<\/td><td>%90 / %89<\/td><\/tr>\n<tr><td>DİBS (ISIN başına %50)<\/td><td>%70<\/td><td>0–1 yıl %94; 1–5 yıl %81; 5 yıl+ %78<\/td><\/tr>\n<tr><td>Kira sertifikası (ISIN başına %25)<\/td><td>%70<\/td><td>0–1 yıl %92; 1–5 yıl %79; 5 yıl+ %76<\/td><\/tr>\n<tr><td>BIST 100 payları (alt limit %20)<\/td><td>%70<\/td><td>BIST 30 %84; BIST 100 %83<\/td><\/tr>\n<tr><td>Hisse / Borçlanma araçları / Para piyasası şemsiye fonu<\/td><td>%50<\/td><td>%88 / %93 / %97<\/td><\/tr>\n<tr><td>Standart altın<\/td><td>%25<\/td><td>%88<\/td><\/tr>\n<tr><td>İTMK, İDMK, VTMK, VDMK (alt limit %40)<\/td><td>%50<\/td><td>%92 / %79 / %76<\/td><\/tr>\n<tr><td>Borsa İstanbul payları<\/td><td>%50<\/td><td>%100<\/td><\/tr>\n<\/table>\n<h4>Teminat tamamlama çağrısı<\/h4>\n<ul>\n<li>Teminat <b>%110<\/b>'un altına düşerse veya TL teminat gerekenin <b>%30<\/b>'unun altına inerse; teminat <b>başlangıç oranına<\/b> tamamlanmalı, aynı gün sonuna kadar. Çağrıdaki hesap yeni işlem yapamaz.<\/li>\n<li>TL oranı eksikliğinde ertesi iş günü gün içi değerlemeye kadar işlem yapılabilir. Gün içi risk değerleri <b>12:30<\/b>'a kadar güncellenir.<\/li>\n<li>Uyulmazsa teminat nakde çevrilip <b>vadesi en yakın<\/b> ödünçten başlanarak tasfiye; vade sonuna kadarki komisyon ödünç verene ödenir, ödünç alan öder.<\/li>\n<li>İleri valörlüde çağrıya uyulmazsa valör günü takas yapılmaz; 15:30'a kadar tamamlanmazsa Takasbank kıymeti ödünç verene iade edebilir.<\/li>\n<\/ul>\n\n<h3>Garanti fonu<\/h3>\n<ul>\n<li>Temerrütte teminatı aşan zararlar için; MKT üyelerinin katılımı <b>zorunlu<\/b>; katkı payları üyenin <b>kendi mülkiyetindeki<\/b> varlıklardan; Takasbank temsil ve idare eder.<\/li>\n<li>Büyüklük: <b>en çok ödünç borcu olan üye<\/b> ile <b>ikinci ve üçüncü üyenin birlikte<\/b> stres koşullarında temerrüdü halindeki kaynak ihtiyacının büyük olanından az olamaz. Katkı = ödünç borcu × risk katsayısı; sabit ve değişken kısım.<\/li>\n<li>Yükümlülük her ayın <b>son iş günü<\/b> hesaplanır, izleyen ayın ilk iş günü günc
