 ödünç veren portföy", "Risk %26,25; ödünç alan portföy", "Risk %30; ödünç veren portföy", "Risk %10; ödünç veren portföy"], "a": 0, "e": "w × 0,16 + (1 − w) × 0,06 = 0,21 → w = 1,50 (%150 B, −%50 risksiz). σ = 1,5 × 0,20 = %30. Borçlanıldığı için ödünç alan portföy; doğruda B'nin sağındadır."}, {"q": "Risksiz faiz %4'tür. Portföy 1: %13 getiri, %15 risk; Portföy 2: %17 getiri, %26 risk. Sharpe ölçütünü en yüksek yapan portföyü risksiz varlıkla birleştirip %10 getiriye ulaşmak isteyen yatırımcının katlanacağı risk kaçtır?", "o": ["%12,00", "%10,00", "%15,00", "%11,54", "%17,33"], "a": 1, "e": "Sharpe 1 = 0,09/0,15 = 0,60; Sharpe 2 = 0,13/0,26 = 0,50 → Portföy 1. w = 0,06/0,09 = 0,6667; σ = 0,6667 × 0,15 = %10,00. Portföy 2 ile risk %12,00 olurdu."}, {"q": "Tobin'in portföy seçimi teoremine göre, risksiz faizden sınırsız borç alıp verilebilen bir piyasada temkinli ve agresif iki yatırımcının portföyleri arasında farklılaşan nedir?", "o": ["Riskli portföydeki hisse senetlerinin dağılımı", "Teğet portföyün bileşimi", "Riskli portföy ile risksiz varlık arasındaki paylaşım", "Kullandıkları etkin sınır", "Risksiz faiz oranı"], "a": 2, "e": "İkinci aşamada seçilen riskli portföy herkes için aynıdır; kişiye göre değişen, birinci aşamadaki riskli/risksiz paylaşım kararıdır."}, {"q": "A = 3 olan yatırımcı, risksiz faizin %5, riskli portföyün beklenen getirisinin %15 ve standart sapmasının %20 olduğu piyasada riskli portföye w ağırlığı verecektir. Aşağıdaki seçeneklerden hangisi en yüksek faydayı sağlar?", "o": ["w = 0,25", "w = 0,50", "w = 1,00", "w = 0,83", "w = 1,20"], "a": 3, "e": "U = (0,05 + 0,10w) − 1,5 × (0,20w)²: w = 0,25 → 0,0713; w = 0,50 → 0,0850; w = 0,83 → 0,0917; w = 1,00 → 0,0900; w = 1,20 → 0,0836."}, {"q": "Net reel getiri hedefi %4, beklenen enflasyon %10, işlem maliyeti %2 ve risksiz faiz %9'dur. Köşe portföyler A (%24 getiri, %32 risk), B (%19 getiri, %24 risk), C (%15 getiri, %18 risk) ise hedefe en düşük riskle ulaşmak için seçilen köşe portföyün ağırlığı yaklaşık kaçtır?", "o": ["A portföyüne %51,25", "C portföyüne %128,13", "B portföyüne %70,00", "B portföyüne %87,83", "B portföyüne %76,88"], "a": 0, "e": "Brüt nominal hedef = 1,04 × 1,10 × 1,02 − 1 = %16,69; C hedefin altında kalır. A ile w = (0,1669 − 0,09)/0,15 = %51,25 ve σ = 0,5125 × %32 = %16,40; B ile w = %76,88 ve σ = 0,7688 × %24 = %18,45. Ölçüt köşe portföyün kendi riski değil birleşimin riskidir; Sharpe'ı yüksek A (0,47 > 0,42) hedefe daha düşük riskle ulaştırır."}, {"q": "Vergi sonrası %14,4 getiri hedefleyen yatırımcının vergi oranı %20'dir. Köşe portföyler (getiri; Sharpe): P1 %22; 0,40 — P2 %18; 0,25 — P3 %16; 0,35 — P4 %13; 0,20. Önceliği riske göre düzeltilmiş getiriyi en yükseğe çıkarmak olan yatırımcı için uygun dağılım hangisidir?", "o": ["%33,33 P1 ve %66,67 P3", "%100 P2", "%66,67 P1 ve %33,33 P3", "%50 P1 ve %50 P4", "%25 P1 ve %75 P3"], "a": 0, "e": "Vergi öncesi hedef 0,144 / 0,80 = %18. P2 tam %18 getirse de Sharpe'ı düşüktür; Sharpe'ı yüksek P1 ve P3 birleştirilir: 0,22w + 0,16(1 − w) = 0,18 → w = 1/3."}, {"q": "Eşit ağırlıklı ve N varlıktan oluşan bir portföyde N sonsuza giderken portföy varyansı neye yakınsar?", "o": ["Sıfıra", "Varlıklar arasındaki ortalama kovaryansa", "Varlıkların ortalama varyansına", "Pazar portföyünün beklenen getirisine", "Ortalama varyans ile ortalama kovaryansın toplamına"], "a": 1, "e": "σP² = (1/N) ort. varyans + [(N − 1)/N] ort. kovaryans; ilk terim sıfıra, ikinci çarpan bire gider. Kalan risk sistematik (piyasa) risktir."}, {"q": "Markowitz modelinin uygulamadaki tahmin ve hesaplama yükü sorununa çözüm arayışında öne çıkan ve varlık fiyatlama teorisine de temel olan çalışma hangisidir?", "o": ["Tobin'in Portföy Seçimi Teoremi", "Keynes'in Likidite Tercihi Teorisi", "Sharpe'ın Tek Endeks (Faktör) Modeli", "Fama-French Üç Faktör Modeli", "Ross'un Arbitraj Fiyatlama Teorisi"], "a": 2, "e": "Tobin risksiz varlık varsayımını eleştirmiştir; uygulama yükünü azaltan, veri tipini sadeleştiren çalışma Sharpe'ın Tek Endeks Modeli'dir."}, {"q": "Getirisi %25 ve standart sapması %30 olan A ile getirisi %15 ve standart sapması %20 olan B arasındaki korelasyon sıfırdır. %20 A ve %80 B'den oluşan portföyün standart sapması yaklaşık kaçtır?", "o": ["%22,00", "%2,92", "%17,00", "%17,09", "%22,36"], "a": 3, "e": "ρ = 0 olduğu için kovaryans terimi düşer: σp = √(0,04 × 0,09 + 0,64 × 0,04) = √0,0292 = %17,09. Beklenen getiri %17'dir."}]}, {"id": 4, "kisa": "FVFM", "baslik": "Finansal Varlıkları Fiyatlama Modelleri", "ozet": "SPD ve riskin pazar fiyatı, FVFM varsayımları, pazar portföyü, beta, MKPD, alfa, karakteristik doğru ve endeks modeli.", "notlar": "\n<h3>Giriş<\/h3>\n<ul>\n<li>Portföy teorisi ve sermaye pazarı teorisinin ardından iki varlık fiyatlama teorisi geliştirildi: <b>Finansal Varlıkları Fiyatlama Modeli (FVFM, CAPM)<\/b> ve Arbitraj Fiyatlama Modeli.<\/li>\n<li>FVFM, sermaye pazarındaki dengeyi ve risk-beklenen getiri ilişkisini matematiksel olarak açıklayan <b>ilk (kısmi) denge modelidir<\/b>.<\/li>\n<li>İki amacı: (1) yatırım alternatiflerinin değerlendirilmesinde <b>benchmark (karşılaştırma ölçütü)<\/b> getiri belirlemek; tahmini beklenen getiri ile dengede sağlanması gereken <b>adil getiri<\/b> arasındaki fark varlık seçiminin temel kriteridir (yüksek, düşük ya da doğru fiyatlanmış); (2) henüz işlem görmeyen varlıkların (ilk halka arz, yatırım projesi) beklenen getirisini belirlemek.<\/li>\n<li>Ampirik testler tam desteklemese de kavramsal gücü ve kullanışlılığı nedeniyle <b>en yaygın kullanılan<\/b> varlık fiyatlama modelidir.<\/li>\n<li>Markowitz'in 1952 çalışmasından <b>12 yıl sonra<\/b> <b>William Sharpe, John Lintner ve Jan Mossin<\/b> birbirinden bağımsız ve neredeyse eş zamanlı geliştirdi (Sharpe-Lintner-Mossin versiyonu).<\/li>\n<\/ul>\n\n<h3>Sermaye Pazarı Doğrusu (SPD)<\/h3>\n<ul>\n<li>İyi çeşitlendirilmiş etkin bir portföyün getirisi = risksiz getiri (paranın zaman değeri) + üstlenilen risk karşılığı risk primi.<\/li>\n<li>E(r<sub>P<\/sub>) = r<sub>f<\/sub> + σ<sub>P<\/sub> × [(E(r<sub>M<\/sub>) − r<sub>f<\/sub>) / σ<sub>M<\/sub>]. Köşeli parantezdeki terim <b>riskin pazar fiyatıdır<\/b> (market price of risk).<\/li>\n<li>Basit ifadeyle: Beklenen getiri = Zamanın fiyatı + Riskin fiyatı × Üstlenilen risk.<\/li>\n<li>SPD'de risk, toplam volatilitedir (standart sapma/varyans). Çeşitlendirilebilir (sistematik olmayan) risk için prim talep edilmez; SPD yalnız etkin portföylerde (toplam risk = sistematik risk) geçerlidir, <b>tekil varlıkların<\/b> risk-getiri ilişkisini açıklayamaz.<\/li>\n<li>FVFM riski <b>yalnızca sistematik bileşen<\/b> olarak yeniden tanımlar ve <b>beta (β)<\/b> ile ölçer: hem portföyler hem tekil varlıklar için geçerlidir.<\/li>\n<\/ul>\n\n<h3>FVFM'nin varsayımları<\/h3>\n<table>\n<tr><th>Yatırımcı davranışına ilişkin<\/th><th>Sermaye piyasasına ilişkin<\/th><\/tr>\n<tr><td>\n<ol>\n<li><b>Riskten kaçınma:<\/b> etkin sınırdaki portföyler tercih edilir.<\/li>\n<li><b>Rasyonalite:<\/b> ortalama-varyans (Markowitz) optimizasyonu.<\/li>\n<li><b>Homojen beklentiler:<\/b> beklenen getiri, varyans ve kovaryans tahminleri herkes için aynı → tek ortak optimal riskli portföy.<\/li>\n<li><b>Aynı tek dönemlik yatırım ufku:<\/b> kısa dönemli (miyopik) bakış.<\/li>\n<\/ol><\/td>\n<td>\n<ol>\n<li>Tam rekabetçi piyasa (yatırımcılar fiyat alıcı).<\/li>\n<li>Tüm varlıklar pazarlanabilir.<\/li>\n<li>Başlangıçta piyasa dengede; düşük/yüksek fiyatlanmış varlık yok.<\/li>\n<li>Varlıklar sonsuz bölünebilir.<\/li>\n<li>Risksiz faizden sınırsız borç alma/verme.<\/li>\n<li>Bilgiye anında, tam ve maliyetsiz erişim.<\/li>\n<li>Sınırsız açığa satış.<\/li>\n<li>Vergi ve işlem maliyeti yok.<\/li>\n<li>Faiz oranları istikrarlı (ya da tam öngörülebilir).<\/li>\n<\/ol><\/td><\/tr>\n<\/table>\n<ul>\n<li>Risksiz faizden daha yüksek faizle borçlanıldığı varsayılsa da modelin genel sonuçları değişmez. Temettü ve sermaye kazancı aynı vergi oranına tabiyse sonuçlar korunur; vergi yoksa yatırımcı getirinin biçimine kayıtsızdır. Emeklilik ve yardım fonları vergiden muaf olabilir.<\/li>\n<li>Modern bilim felsefesine göre teori, varsayımlarının gerçekçiliğiyle değil, olguları açıklama ve tahmin başarısıyla değerlendirilir. Üç soru: varsayımlar gerçeklikten ne ölçüde saptırıyor; hangi sonuçlara götürüyor; sonuçlar gözlenen davranışı ne ölçüde açıklıyor.<\/li>\n<\/ul>\n\n<h3>FVFM'nin türetilmesi<\/h3>\n<h4>Pazar portföyü ve yatırım fonu teoremi<\/h4>\n<ul>\n<li>Açığa satış var, risksiz borçlanma yoksa: BC eğrisi etkin sınır, ABC eğrisi minimum varyanslı portföyler; beklenti farkları nedeniyle her yatırımcının etkin sınırı farklı olabilir.<\/li>\n<li>Risksiz borçlanma/borç verme varsa, risk tercihinden bağımsız tek bir riskli portföy (teğet portföy) oluşur. Homojen beklentilerle herkesin riskli portföyü aynıdır; dengede bu portföy <b>pazar portföyüdür<\/b>.<\/li>\n<li><b>Pazar portföyü:<\/b> tüm riskli varlıkları, her birinin pazar değerinin toplam pazar değerine oranı kadar ağırlıkla içerir; değeri ekonomideki toplam servete eşittir. Hiçbir riskli varlık dışarıda kalamaz: talep görmeyen varlığın fiyatı cazip seviyeye düşer.<\/li>\n<li><b>Yatırım fonu teoremi (Çift Yatırım Fonu Teoremi):<\/b> portföy seçimi iki bileşene ayrılır: (i) pazarı temsil eden fonların profesyonel yöneticilerce oluşturulması (teknik problem), (ii) yatırımcının kaynaklarını risk tercihine göre bu fon ile risksiz varlık arasında dağıtması. Pazar endeksine yatırım yapan <b>pasif strateji etkindir<\/b>; daha yüksek getiri çabaları işlem ve araştırma maliyetleri nedeniyle daha düşük getiriye yol açabilir.<\/li>\n<li>Türkiye uygulaması: BIST 100 veya BIST 30'u takip eden endeks fonu + Hazine borçlanma araçları ya da TL mevduat.<\/li>\n<\/ul>\n<h4>Pazar risk primi<\/h4>\n<ul>\n<li>Yatırımcının servetinin pazar portföyüne ayırdığı pay: y<sub>i<\/sub> = [E(r<sub>M<\/sub>) − r<sub>f<\/sub>] / (A<sub>i<\/sub> × σ<sub>M<\/sub><sup>2<\/sup>).<\/li>\n<li>Dengede toplam net borçlanma sıfır olduğundan ortalama pozisyon %100'dür (ȳ = 1): <b>E(r<sub>M<\/sub>) − r<sub>f<\/sub> = Ā × σ<sub>M<\/sub><sup>2<\/sup><\/b>. Pazar risk primi, ortalama riskten kaçınma derecesi ve pazar varyansıyla orantılıdır.<\/li>\n<\/ul>\n<h4>Tekil varlıkların beklenen getirisi ve beta<\/h4>\n<ul>\n<li>Bir varlığın risk primi, pazar portföyünün riskine yaptığı katkıyla belirlenir. X'in pazar varyansına katkısı w<sub>X<\/sub> × σ<sub>XM<\/sub>; varlık sayısı arttıkça kovaryans terimleri varyans terimlerinden çok daha fazla olur ve belirleyici olur.<\/li>\n<li>Dengede tüm varlıkların getiri/risk oranı eşit olmalıdır: [E(r<sub>i<\/sub>) − r<sub>f<\/sub>] / σ<sub>iM<\/sub> = [E(r<sub>M<\/sub>) − r<sub>f<\/sub>] / σ<sub>M<\/sub><sup>2<\/sup>. Sağ taraf (pazar risk primi / pazar varyansı) da kitapta riskin pazar fiyatı olarak anılır.<\/li>\n<li>Tekil (sistematik olmayan) risk neden fiyatlanmaz: bir yıl sonra 100 TL beklenen hisse için çeşitlendirmeyen yatırımcı %26 ister (100/1,26 = 79,37 TL), çeşitlendiren %20 ister (100/1,20 = 83,33 TL). Çeşitlendirenler daha yüksek fiyat biçtiği için denge fiyatı 83,33 TL olur; tekil risk taşıyan ek prim alamaz.<\/li>\n<\/ul>\n<table>\n<tr><th>Kavram<\/th><th>Formül<\/th><\/tr>\n<tr><td>Beta<\/td><td>β<sub>i<\/sub> = σ<sub>iM<\/sub> / σ<sub>M<\/sub><sup>2<\/sup> = ρ<sub>iM<\/sub> × σ<sub>i<\/sub> / σ<sub>M<\/sub><\/td><\/tr>\n<tr><td>FVFM (MKPD)<\/td><td>E(r<sub>i<\/sub>) = r<sub>f<\/sub> + β<sub>i<\/sub> × [E(r<sub>M<\/sub>) − r<sub>f<\/sub>]<\/td><\/tr>\n<tr><td>Portföy beklenen getirisi ve betası<\/td><td>E(r<sub>P<\/sub>) = Σ w<sub>i<\/sub>E(r<sub>i<\/sub>); β<sub>P<\/sub> = Σ w<sub>i<\/sub>β<sub>i<\/sub><\/td><\/tr>\n<tr><td>Alfa<\/td><td>α = E(r<sub>i<\/sub>) − {r<sub>f<\/sub> + β<sub>i<\/sub> × [E(r<sub>M<\/sub>) − r<sub>f<\/sub>]}<\/td><\/tr>\n<tr><td>Karakteristik doğru (regresyon)<\/td><td>r<sub>it<\/sub> = a<sub>i<\/sub> + b<sub>i<\/sub> × r<sub>Mt<\/sub> + e<sub>it<\/sub><\/td><\/tr>\n<tr><td>Endeks modeli (ek getiri)<\/td><td>r<sub>i<\/sub> − r<sub>f<\/sub> = α<sub>i<\/sub> + β<sub>i<\/sub>(r<sub>M<\/sub> − r<sub>f<\/sub>) + ε<sub>i<\/sub><\/td><\/tr>\n<tr><td>Pazar modeli<\/td><td>r<sub>i<\/sub> − E(r<sub>i<\/sub>) = β<sub>i<\/sub>[r<sub>M<\/sub> − E(r<sub>M<\/sub>)] + ε<sub>i<\/sub><\/td><\/tr>\n<tr><td>Sistematik varyans payı<\/td><td>β<sup>2<\/sup>σ<sub>M<\/sub><sup>2<\/sup> / σ<sub>i<\/sub><sup>2<\/sup> = ρ<sub>iM<\/sub><sup>2<\/sup><\/td><\/tr>\n<\/table>\n<ul>\n<li><b>β<sub>M<\/sub> = 1<\/b>; pazardaki tüm riskli varlıkların ağırlıklı ortalama betası 1'dir. Risksiz varlığın betası <b>0<\/b>.<\/li>\n<li><b>β &gt; 1 agresif<\/b> (piyasa yükselirken daha çok kazandırır, düşerken daha sert düşer), <b>0 &lt; β &lt; 1 defansif<\/b>, <b>β &lt; 0<\/b> piyasayla ters yönlü (portföyde sigorta işlevi; kalıcı negatif betalı hisse bulmak zordur).<\/li>\n<li>Betası genellikle 1'in üzerinde olanlar: büyük banka hisseleri, savunma sanayi, otomotiv, dayanıklı tüketim. 1'in altında olanlar: temel gıda, perakende, elektrik dağıtımı. Aynı sektörde bile borçluluk, gelir yapısı ve yönetim stratejisine göre beta farklıdır.<\/li>\n<li>Herkes aynı riskli portföyü tutarsa bir varlığın pazar portföyüne göre betası, her yatırımcının kendi portföyüne göre betasına eşittir; iyi çeşitlendirilmiş portföy pazarla yüksek korelasyonlu olduğundan beta yine kullanışlı bir sistematik risk ölçüsüdür.<\/li>\n<\/ul>\n\n<h3>Menkul Kıymet Pazarı Doğrusu (MKPD)<\/h3>\n<ul>\n<li>Dikey eksende beklenen getiri, yatay eksende beta; doğru risksiz getiriden geçer ve <b>eğimi pazar risk primidir<\/b> (β<sub>M<\/sub> = 1 olduğu için). Varlığın risk primi = β × [E(r<sub>M<\/sub>) − r<sub>f<\/sub>].<\/li>\n<li>Dengede ve doğru fiyatlanmış tüm varlıklar MKPD üzerindedir.<\/li>\n<li><b>MKPD'nin üzerindeki<\/b> varlık: beklenen getirisi gerekli getiriden yüksek → <b>düşük fiyatlanmış (ucuz)<\/b>, pozitif alfa; talep artar, fiyat yükselir, beklenen getiri düşerek doğruya iner.<\/li>\n<li><b>MKPD'nin altındaki<\/b> varlık: <b>yüksek fiyatlanmış (pahalı)<\/b>, negatif alfa; satış baskısıyla fiyat düşer, beklenen getiri yükselerek doğruya çıkar.<\/li>\n<li>Örnek 4.1: E(r<sub>M<\/sub>) %16, β 1,25, r<sub>f<\/sub> %8 → gerekli getiri %8 + 1,25 × %8 = %18; beklenen %20 → α = %2.<\/li>\n<li>Menkul kıymet analizinin amacı alfası sıfırdan farklı varlıkları bulmaktır; başlangıç noktası pasif stratejidir. Fon yöneticisi pozitif alfalıların ağırlığını artırır, negatif alfalılarınkini azaltır.<\/li>\n<li>Piyasa aksaklıkları (bilgi asimetrisi, işlem maliyeti, vergi, likidite kısıtı, davranışsal önyargılar) alfa fırsatı yaratır; FVFM yine de en güçlü referans noktasıdır.<\/li>\n<\/ul>\n<table>\n<tr><th><\/th><th>SPD<\/th><th>MKPD<\/th><\/tr>\n<tr><td>Risk ölçüsü<\/td><td>Standart sapma (toplam risk)<\/td><td>Beta (sistematik risk)<\/td><\/tr>\n<tr><td>Geçerli olduğu yer<\/td><td>Yalnız etkin (iyi çeşitlendirilmiş) portföyler<\/td><td>Etkin portföyler ve tekil varlıklar<\/td><\/tr>\n<tr><td>Eğim<\/td><td>(E(r<sub>M<\/sub>) − r<sub>f<\/sub>) / σ<sub>M<\/sub><\/td><td>E(r<sub>M<\/sub>) − r<sub>f<\/sub><\/td><\/tr>\n<\/table>\n\n<h3>Betanın tahmini ve karakteristik doğru<\/h3>\n<ul>\n<li>İki yöntem: (1) kovaryans/varyans oranı (= ρ × σ<sub>i<\/sub>/σ<sub>M<\/sub>); (2) tarihsel getirilerle basit doğrusal regresyonun eğim katsayısı (<b>menkul kıymet karakteristik doğrusu<\/b>). Hata terimi, getirinin pazarla açıklanamayan kısmıdır.<\/li>\n<li>İki yöntem aynı betayı verir; ikincisi tahminin güvenilirliğini sınamaya (F testi, R<sup>2<\/sup>, b katsayısının t testi) imkân verdiği için daha çok tercih edilir.<\/li>\n<li>Örnek 4.2 (BIST 100, 60 aylık getiri): GARAN β 1,3755, R<sup>2<\/sup> %87,44; THYAO β 0,9523, R<sup>2<\/sup> %40,71; KENT β 0,3854, R<sup>2<\/sup> %1,19 (pazarla ilişkisi çok zayıf). R<sup>2<\/sup>, hisse getirisindeki değişkenliğin pazarla açıklanan kısmıdır.<\/li>\n<\/ul>\n\n<h3>FVFM ve endeks modeli<\/h3>\n<ul>\n<li>Teorik pazar portföyü (tüm pazarlanabilir varlıklar, değer ağırlıklı) oluşturulamaz. FVFM <b>ex ante<\/b> (beklenen) ilişkilere dayanır; gerçekte yalnız <b>ex post<\/b> (gerçekleşmiş) getiriler gözlenir. Testler için ek varsayım gerekir: ex post ortalamalar geleceğin uygun tahmincisidir ve FVFM endeks/pazar modeliyle test edilebilir.<\/li>\n<li>Endeks modelinde Cov(er<sub>M<\/sub>, ε<sub>i<\/sub>) = 0; dolayısıyla beta FVFM'deki betanın aynısıdır. Tek fark, teorik pazar portföyü yerine gözlenebilir bir pazar endeksinin kullanılmasıdır.<\/li>\n<li>FVFM tüm varlıklar için <b>alfanın beklenen değerinin sıfır<\/b> olmasını öngörür; endeks modeli formülasyonunda geçmiş dönem gerçekleşmiş alfaların ortalaması sıfır olmalı, örnek alfalar tesadüfi ve dönemler arasında bağımsız olmalıdır.<\/li>\n<li><b>Pazar modeli:<\/b> getirideki sürpriz = β × pazar getirisindeki sürpriz + şirkete özgü sürpriz. \"Endeks modeli\" ve \"pazar modeli\" çoğunlukla birbirinin yerine kullanılır.<\/li>\n<\/ul>\n\n<h3>Soru bankasındaki uygulamalar<\/h3>\n<ul>\n<li><b>Fon performansı (Jensen alfası):<\/b> α = gerçekleşen getiri − [r<sub>f<\/sub> + β(r<sub>M<\/sub> − r<sub>f<\/sub>)]. Endeksi geçmek tek başına başarı değildir; betası 1'den büyük fonun endeksten fazla kazandırması zaten beklenir.<\/li>\n<li><b>Hisse değerlemesi:<\/b> beklenen getiri = (P<sub>1<\/sub> + D<sub>1<\/sub> − P<sub>0<\/sub>) / P<sub>0<\/sub>; FVFM getirisinden büyükse hisse ucuzdur.<\/li>\n<li><b>Senaryolardan beta:<\/b> β = Δr<sub>i<\/sub> / Δr<sub>M<\/sub> (iki senaryodaki getiri farklarının oranı).<\/li>\n<li><b>Sermaye bütçelemesi:<\/b> projenin iskonto oranı FVFM ile bulunur (k = r<sub>f<\/sub> + β[E(r<sub>M<\/sub>) − r<sub>f<\/sub>]), nakit akışları bu oranla indirgenip net bugünkü değer hesaplanır; NBD &gt; 0 ise proje kabul edilir.<\/li>\n<li>Dikkat: soruda \"pazar risk primi\" doğrudan verilmişse onu E(r<sub>M<\/sub>) gibi kullanıp yeniden r<sub>f<\/sub> çıkarma.<\/li>\n<\/ul>\n", "sorular": [{"q": "Pazar portföyünün beklenen getirisi %16, standart sapması %25 ve risksiz faiz %6'dır. SPD üzerinde riskini %15 ile sınırlayan yatırımcının beklenen getirisi kaçtır?", "o": ["%6,00", "%9,60", "%8,40", "%12,00", "%7,50"], "a": 3, "e": "Riskin pazar fiyatı (0,16 − 0,06)/0,25 = 0,40; E = 0,06 + 0,40 × 0,15 = %12,00."}, {"q": "Aynı piyasada (rf %6, E(rM) %16, σM %25) %14 beklenen getiri hedefleyen yatırımcının SPD üzerinde katlanması gereken standart sapma kaçtır?", "o": ["%35,00", "%21,88", "%8,00", "%25,00", "%20,00"], "a": 4, "e": "0,14 = 0,06 + 0,40 × σ → σ = 0,08 / 0,40 = %20,00."}, {"q": "X hissesinin standart sapması %30, pazarın standart sapması %20 ve aralarındaki korelasyon 0,50'dir. X'in betası kaçtır?", "o": ["0,75", "0,33", "1,50", "0,15", "0,50 (korelasyonun kendisi)"], "a": 0, "e": "β = ρ × σX / σM = 0,50 × 0,30 / 0,20 = 0,75. Eşdeğer olarak σXM = 0,5 × 0,3 × 0,2 = 0,03 ve β = 0,03 / 0,04."}, {"q": "Önceki sorudaki X hissesinin (β = 0,75; σX = %30; σM = %20) toplam varyansının yüzde kaçı sistematik risktir?", "o": ["%75", "%25", "%50", "%56,25", "%37,50"], "a": 1, "e": "Sistematik varyans β² × σM² = 0,5625 × 0,04 = 0,0225; toplam varyans 0,09; oran 0,25 (= ρ²). Kalan %75 sistematik olmayan risktir."}, {"q": "Risksiz faiz %7, pazar portföyünün beklenen getirisi %15 ve bir hissenin betası 1,40'tır. FVFM'ye göre hissenin gerekli getirisi kaçtır?", "o": ["%21,00", "%28,00", "%18,20", "%26,20", "%12,71"], "a": 2, "e": "E(r) = 0,07 + 1,40 × (0,15 − 0,07) = 0,07 + 0,112 = %18,20."}, {"q": "Bugünkü fiyatı 50 TL olan bir hissenin bir yıl sonra 2 TL kâr payı ödemesi ve 56 TL'den satılması beklenmektedir. Beta 0,90, risksiz faiz %10, pazarın beklenen getirisi %20'dir. Hangisi doğrudur?", "o": ["Gerekli getiri %19, beklenen getiri %16; hisse düşük fiyatlanmıştır", "Gerekli getiri %18, beklenen getiri %16; hisse yüksek fiyatlanmıştır", "Gerekli getiri %19, beklenen getiri %12; hisse yüksek fiyatlanmıştır", "Gerekli getiri %19, beklenen getiri %16; hisse yüksek fiyatlanmıştır", "Gerekli getiri %16, beklenen getiri %19; hisse düşük fiyatlanmıştır"], "a": 3, "e": "Gerekli: 0,10 + 0,90 × 0,10 = %19; beklenen: (56 + 2 − 50)/50 = %16. Beklenen getiri gerekenden düşük → hisse MKPD'nin altında, pahalıdır (negatif alfa)."}, {"q": "Bir fon yılı %18 getiriyle kapatmıştır. Fonun betası 1,30; aynı dönemde risksiz faiz %6, piyasa endeksinin getirisi %14'tür. Fonun alfası kaçtır?", "o": ["%4,00", "%12,00", "%16,40", "−%6,20", "%1,60"], "a": 4, "e": "Gerekli getiri = 0,06 + 1,30 × 0,08 = %16,4; α = %18 − %16,4 = %1,60. Endeksi %4 geçmek, beta 1'den büyük olduğu için tek başına başarı göstergesi değildir."}, {"q": "Bir hisse için endeks modeli (rZ − rf) = 0,01 + 1,20 × (rM − rf) + εZ olarak tahmin edilmiştir. Dönemde pazar %18 getiri sağlamış, risksiz faiz %8 olmuş ve şirkete özgü şok εZ = −%3 gerçekleşmiştir. Hissenin gerçekleşen getirisi kaçtır?", "o": ["%18,00", "%21,00", "%10,00", "%19,60", "%17,00"], "a": 0, "e": "rZ − 0,08 = 0,01 + 1,20 × 0,10 − 0,03 = 0,10 → rZ = %18,00. Şoku eklememek %21,00, rf'yi eklememek %10,00 verir."}, {"q": "Pazar getirisinin %4 olduğu senaryoda bir hissenin −%3, %20 olduğu senaryoda %9 getiri sağlaması beklenmektedir. Hissenin betası ve niteliği nedir?", "o": ["0,75; agresif", "0,75; defansif", "1,33; agresif", "0,45; defansif", "1,00; pazarla aynı"], "a": 1, "e": "β = Δri / ΔrM = (0,09 − (−0,03)) / (0,20 − 0,04) = 0,12 / 0,16 = 0,75. Beta 1'den küçük olduğu için defansiftir."}, {"q": "Yatırımcıların ortalama riskten kaçınma katsayısı 3, pazar portföyünün standart sapması %18 ve risksiz faiz %10'dur. Denge koşulunda pazar portföyünün beklenen getirisi kaçtır?", "o": ["%9,72", "%64,00", "%19,72", "%14,86", "%17,86"], "a": 2, "e": "E(rM) − rf = Ā × σM² = 3 × 0,0324 = %9,72; E(rM) = %10 + %9,72 = %19,72."}, {"q": "Betası 1,20 olan bir projenin bugünkü maliyeti 200 milyon TL'dir; 3 yıl boyunca her yıl sonunda 90 milyon TL nakit girişi sağlayacaktır. Risksiz faiz %10, pazarın beklenen getirisi %18 ise FVFM'ye göre projenin net bugünkü değeri yaklaşık kaçtır?", "o": ["−4,32 milyon TL", "23,82 milyon TL", "70,00 milyon TL", "−9,22 milyon TL", "25,40 milyon TL"], "a": 3, "e": "İskonto oranı k = 0,10 + 1,20 × 0,08 = %19,60; NBD = −200 + 90 × [1 − 1,196⁻³]/0,196 = −9,22 milyon TL. NBD negatif olduğundan proje reddedilir."}, {"q": "Portföy %50 β = 0,60, %30 β = 1,00 ve %20 β = 1,80 olan hisselerden oluşmaktadır. Risksiz faiz %8 ve pazar risk primi %7 ise portföyün FVFM'ye göre beklenen getirisi kaçtır?", "o": ["%7,04", "%15,93", "%6,72", "%22,40", "%14,72"], "a": 4, "e": "βP = 0,30 + 0,30 + 0,36 = 0,96; E = 0,08 + 0,96 × 0,07 = %14,72. Prim doğrudan verildiği için yeniden rf çıkarılmaz."}, {"q": "Pazar portföyünün beklenen getirisi %16, standart sapması %20 ve risksiz faiz %6'dır. Riskten kaçınma katsayısı 4 olan yatırımcının servetinin pazar portföyüne ayırdığı pay kaçtır?", "o": ["%62,50", "%12,50", "%250,00", "%100,00", "%125,00"], "a": 0, "e": "y = [E(rM) − rf] / (A × σM²) = 0,10 / (4 × 0,04) = %62,50; kalan %37,5 risksiz varlıktadır."}, {"q": "Bir yıl sonra 120 TL nakit akışı beklenen bir hisse için çeşitlendirme yapmayan yatırımcılar %25, iyi çeşitlendirilmiş yatırımcılar %20 getiri talep etmektedir. FVFM mantığına göre denge fiyatı kaç TL olur?", "o": ["96 TL", "100 TL", "98 TL", "120 TL", "80 TL"], "a": 1, "e": "Çeşitlendiren yatırımcılar 120/1,20 = 100 TL, diğerleri 120/1,25 = 96 TL biçer. Daha yüksek fiyat biçen çeşitlendirmiş yatırımcılar fiyatı belirler; tekil risk fiyatlanmaz."}, {"q": "Aşağıdakilerden hangisi FVFM'nin varsayımlarından biri değildir?", "o": ["Homojen beklentiler", "Risksiz faizden sınırsız borç alma ve verme", "Yatırımcıların farklı uzunlukta yatırım ufuklarına sahip olması", "Sınırsız açığa satış", "Vergi ve işlem maliyetinin olmaması"], "a": 2, "e": "FVFM tüm yatırımcıların aynı tek dönemlik yatırım ufkuna sahip olduğunu varsayar."}, {"q": "FVFM'deki homojen beklentiler varsayımı neyi ifade eder?", "o": ["Tüm yatırımcıların aynı servete sahip olmasını", "Tüm yatırımcıların aynı riskten kaçınma derecesine sahip olmasını", "Tüm varlıkların aynı beklenen getiriye sahip olmasını", "Yatırımcıların beklenen getiri, varyans ve kovaryans tahminlerinin aynı olmasını", "Tüm yatırımcıların aynı vergi oranına tabi olmasını"], "a": 3, "e": "Homojen beklentilerde girdiler herkes için aynıdır; böylece herkes aynı etkin sınırı ve ortak optimal riskli portföyü belirler. Risk tercihleri farklı olabilir."}, {"q": "SPD ile MKPD karşılaştırmasında hangisi doğrudur?", "o": ["SPD'de risk ölçüsü beta, MKPD'de standart sapmadır", "MKPD yalnız iyi çeşitlendirilmiş portföyler için geçerlidir", "SPD'nin eğimi pazar risk primine eşittir", "İki doğruda da sistematik olmayan risk fiyatlanır", "SPD yalnız etkin portföyler için geçerliyken MKPD tekil varlıklar için de geçerlidir"], "a": 4, "e": "SPD toplam riski (σ) kullanır ve yalnız etkin portföylerde geçerlidir; MKPD beta kullanır, eğimi pazar risk primidir ve tekil varlıklarda da geçerlidir."}, {"q": "Beklenen getirisi, betasına göre MKPD'nin öngördüğü getiriden yüksek olan bir varlık için hangisi doğrudur?", "o": ["Düşük fiyatlanmıştır; alfası pozitiftir ve MKPD'nin üzerinde yer alır", "Yüksek fiyatlanmıştır; alfası negatiftir", "Doğru fiyatlanmıştır; alfası sıfırdır", "MKPD'nin altında yer alır ve satılmalıdır", "Fiyatı düşerek dengeye gelir"], "a": 0, "e": "MKPD üzerindeki varlık ucuzdur; talep arttıkça fiyatı yükselir, beklenen getirisi düşer ve doğruya iner."}, {"q": "Beta katsayısına ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Pazar portföyünün betası 1'dir", "Risksiz varlığın betası 1'dir", "Betası 1'den büyük varlıklar agresif olarak adlandırılır", "Portföy betası, varlık betalarının ağırlıklı ortalamasıdır", "Beta, kovaryansın pazar varyansına oranıdır"], "a": 1, "e": "Risksiz varlığın piyasayla korelasyonu sıfır olduğu için betası 0'dır."}, {"q": "Betanın tahmininde regresyon (karakteristik doğru) yönteminin kovaryans/varyans oranına göre daha çok tercih edilmesinin nedeni nedir?", "o": ["Her zaman daha yüksek beta vermesi", "Pazar portföyü gerektirmemesi", "Tahminin güvenilirliğini F testi, R² ve t testiyle sınamaya imkân vermesi", "Sistematik olmayan riski sıfır kabul etmesi", "Geleceğe dönük beklentileri doğrudan kullanması"], "a": 2, "e": "Aynı örneklemde iki yöntem aynı betayı verir; regresyon istatistiksel sınama imkânı sunduğu için tercih edilir."}, {"q": "Kitaptaki örnekte KENT hissesinin karakteristik doğrusunun R² değeri 0,0119'dur. Bu ne anlama gelir?", "o": ["Hissenin betası 1,19'dur", "Hisse getirisinin %98,8'i pazarla açıklanır", "Hissenin sistematik riski toplam riskinin tamamıdır", "Hisse getirisindeki değişkenliğin çok küçük bir kısmı BIST 100 ile açıklanabilir", "Hisse agresif bir varlıktır"], "a": 3, "e": "R², getirideki değişkenliğin pazar endeksiyle açıklanan kısmıdır; %1,19 pazarla ilişkinin çok zayıf olduğunu gösterir (beta da 0,3854 ile düşüktür)."}, {"q": "Pazar portföyüne ilişkin hangisi doğrudur?", "o": ["Yalnız en büyük şirketlerin hisselerini içerir", "Varlıkları eşit ağırlıkla içerir", "Risksiz varlığı da içerir", "Her yatırımcı için farklıdır", "Tüm riskli varlıkları, pazar değerlerinin toplam pazar değerine oranı kadar ağırlıkla içerir"], "a": 4, "e": "Homojen beklentilerle herkesin riskli portföyü aynıdır ve bu portföy değer ağırlıklı pazar portföyüdür; değeri ekonomideki toplam servete eşittir."}, {"q": "Çift Yatırım Fonu Teoremi'ne göre portföy seçim kararının iki bileşeni nedir?", "o": ["Pazarı temsil eden fonun profesyonelce oluşturulması ve yatırımcının bu fon ile risksiz varlık arasında dağıtım yapması", "Hisse ve tahvil seçimi", "Temel analiz ve teknik analiz", "Alfa yaratma ve beta yönetimi", "Vergi planlaması ve likidite yönetimi"], "a": 0, "e": "Teorem portföy seçimi ilkesinin farklı bir ifadesidir: teknik problem fon yöneticisinde, risk tercihine göre dağıtım yatırımcıdadır. Pasif strateji etkindir."}, {"q": "FVFM, Markowitz'in 1952 yılındaki çalışmasından kaç yıl sonra geliştirilmiştir?", "o": ["6", "10", "12", "18", "24"], "a": 2, "e": "Sharpe, Lintner ve Mossin birbirinden bağımsız olarak, Markowitz'ten 12 yıl sonra modeli geliştirmiştir.", "k": 1}, {"q": "Endeks modeli ile FVFM'nin karşılaştırılmasında hangisi doğrudur?", "o": ["Endeks modelindeki beta FVFM betasından farklı tanımlanır", "FVFM tüm varlıklar için alfanın beklenen değerinin sıfır olmasını öngörür", "FVFM ex post verilerle doğrudan test edilebilir", "Endeks modeli teorik pazar portföyünü kullanır", "Endeks modelinde hata terimi pazar getirisiyle korelasyonludur"], "a": 1, "e": "Endeks modelinde gözlenebilir bir endeks kullanılır, hata terimi pazarla korelasyonsuzdur ve beta FVFM betasıyla aynıdır. FVFM beklenen alfayı sıfır öngörür."}]}, {"id": 5, "kisa": "Arbitraj Fiyatlama Modeli", "baslik": "Arbitraj Fiyatlama Modeli", "ozet": "Tek ve çok faktörlü modeller, çok faktörlü MKPD, AFT ve arbitraj hesapları, iyi çeşitlendirilmiş portföyler, Fama-French ve Carhart modelleri, AFT-FVFM karşılaştırması.", "notlar": "\n<h3>Giriş<\/h3>\n<ul>\n<li>Standart FVFM ve türevleri (sıfır betalı FVFM, tüketim temelli FVFM, dönemlerarası FVFM) <b>ortalama-varyans etkinliğine<\/b> dayanır.<\/li>\n<li>Riskli varlık fiyatlarını çok faktörlü yaklaşımla açıklayan ilk formel çalışma <b>Ross (1976, 1977)<\/b>'tur: getiri süreci veri iken \"<b>arbitraj imkânı olmaması<\/b>\" (no-arbitrage) koşuluyla fiyatların nasıl belirlendiğini gösterir.<\/li>\n<li><b>Arbitraj:<\/b> yanlış fiyatlamadan yararlanarak risksiz kâr elde etme; aynı/benzer nitelikli ama farklı fiyattan işlem gören varlığın eşanlı alınıp satılması. Sermaye piyasası teorisinin temel ilkesi, dengede arbitraj imkânının olmamasıdır.<\/li>\n<li>Toplam risk = sistematik (piyasa) risk + sistematik olmayan (şirkete özgü) risk. Çok faktörlü modeller çok boyutlu sistematik riski (ekonomik çevrim/büyüme, faiz, enflasyon, enerji fiyatları gibi) ayrıntılı ölçmeyi ve yönetmeyi sağlar.<\/li>\n<li>Arbitraj olmaması koşuluna dayanarak faktör modelleriyle risk-getiri ilişkisini açıklayan yaklaşım <b>Arbitraj Fiyatlama Teorisi (AFT)<\/b>'dir.<\/li>\n<\/ul>\n\n<h3>Faktör modelleri<\/h3>\n<table>\n<tr><th>Model<\/th><th>Formül<\/th><\/tr>\n<tr><td>Tek faktör modeli<\/td><td>r<sub>i<\/sub> = E(r<sub>i<\/sub>) + β<sub>i<\/sub>F + ε<sub>i<\/sub><\/td><\/tr>\n<tr><td>Çok faktörlü model<\/td><td>r<sub>i<\/sub> = E(r<sub>i<\/sub>) + β<sub>i1<\/sub>F<sub>1<\/sub> + β<sub>i2<\/sub>F<sub>2<\/sub> + … + β<sub>ij<\/sub>F<sub>j<\/sub> + ε<sub>i<\/sub><\/td><\/tr>\n<tr><td>Faktör sürprizi<\/td><td>F = gerçekleşen değer − beklenen değer<\/td><\/tr>\n<tr><td>Çok faktörlü MKPD<\/td><td>E(r) = r<sub>f<\/sub> + β<sub>GSYH<\/sub>RP<sub>GSYH<\/sub> + β<sub>ENF<\/sub>RP<sub>ENF<\/sub> + β<sub>R<\/sub>RP<sub>R<\/sub><\/td><\/tr>\n<tr><td>Portföy varyansının ayrıştırılması<\/td><td>σ<sub>P<\/sub><sup>2<\/sup> = β<sub>P<\/sub><sup>2<\/sup>σ<sub>F<\/sub><sup>2<\/sup> + σ<sup>2<\/sup>(ε<sub>P<\/sub>)<\/td><\/tr>\n<tr><td>Sistematik olmayan varyans<\/td><td>σ<sup>2<\/sup>(ε<sub>P<\/sub>) = Σ w<sub>i<\/sub><sup>2<\/sup>σ<sup>2<\/sup>(ε<sub>i<\/sub>); eşit ağırlıkta σ̄<sup>2<\/sup>(ε<sub>i<\/sub>) / N<\/td><\/tr>\n<tr><td>İyi çeşitlendirilmiş portföy<\/td><td>r<sub>P<\/sub> = E(r<sub>P<\/sub>) + β<sub>P<\/sub>F; AFT'de E(r<sub>P<\/sub>) = r<sub>f<\/sub> + β<sub>P<\/sub> × faktör risk primi<\/td><\/tr>\n<tr><td>Fama-French üç faktör<\/td><td>r<sub>it<\/sub> − r<sub>f<\/sub> = α<sub>i<\/sub> + β<sub>iM<\/sub>(r<sub>Mt<\/sub> − r<sub>f<\/sub>) + β<sub>iSMB<\/sub>SMB<sub>t<\/sub> + β<sub>iHML<\/sub>HML<sub>t<\/sub> + ε<sub>it<\/sub><\/td><\/tr>\n<tr><td>Carhart dört faktör<\/td><td>Fama-French + β<sub>iWML<\/sub>WML<sub>t<\/sub><\/td><\/tr>\n<\/table>\n<h4>Tek faktör modeli<\/h4>\n<ul>\n<li>Getirideki belirsizliğin iki kaynağı: tüm varlıklar için ortak <b>makroekonomik faktör<\/b> ve <b>şirkete özgü olaylar<\/b>. Faktör, beklenen değerinden sapmayı (yeni bilgiyi) ölçtüğü için beklenen değeri <b>sıfırdır<\/b>; ε'nin beklenen değeri de sıfırdır.<\/li>\n<li>ε'ler birbirleriyle ve F ile korelasyonsuzdur.<\/li>\n<li>Örnek 5.1: faktör reel GSYH büyümesindeki sürpriz; beklenen %5, gerçekleşen %4,20 → faktör −%0,80; β = 1,25 → getiri beklenenden %1 düşük (+ ε<sub>A<\/sub>).<\/li>\n<li>Pazar portföyünü tek faktör alan model, her menkul kıymetin her faktöre duyarlılığının aynı olduğunu varsaymış olur; duyarlılıklar farklıysa çok faktörlü modeller daha doğru açıklar.<\/li>\n<\/ul>\n<h4>Çok faktörlü modeller<\/h4>\n<ul>\n<li>β<sub>ij<\/sub>: <b>faktör duyarlılığı, faktör yükü ya da faktör betası<\/b>. F<sub>j<\/sub>'ler beklenmeyen değişimleri gösterdiğinden beklenen değerleri sıfırdır.<\/li>\n<li>Koşullar: E(e<sub>i<\/sub>e<sub>j<\/sub>) = 0 (i ≠ j); E{e<sub>i<\/sub>[F<sub>j<\/sub> − E(F<sub>j<\/sub>)]} = 0.<\/li>\n<li>Örnek 5.2: beklentiler büyüme %5, enflasyon %4, faiz %6; β'lar 1,20; 0,80; −0,50; gerçekleşen %5,5; %6; %6 → sistematik katkı 1,20 × 0,5 + 0,80 × 2 − 0,50 × 0 = %2,20; şirkete özgü +%2 → riskli bileşen %4,20; beklenen %15,4 ile toplam getiri %19,60.<\/li>\n<li>Risk yönetiminde kullanım: belirli bir riskten korunmak isteyen, o faktör betasıyla aynı büyüklükte ters işaretli pozisyon alır (çoğunlukla türev araçlarla).<\/li>\n<\/ul>\n<h4>Çok faktörlü Menkul Kıymet Pazarı Doğrusu<\/h4>\n<ul>\n<li>Çok faktörlü modeller ampiriktir, bir anlamda <b>ateoriktir<\/b>; E(r<sub>i<\/sub>)'nin nasıl belirlendiğini söylemez. Bunu açıklayan teori gerekir.<\/li>\n<li>Beklenen getiri = risksiz faiz + her faktör için (faktör betası × o faktörün risk primi).<\/li>\n<li>Tek faktörlü MKPD'de referans prim pazar risk primidir; çok faktörlüde her faktörün ayrı primi vardır. Temel fark: çok faktörlü modelde risk primi ve/veya duyarlılık <b>negatif<\/b> olabilir (faiz yükselince getirisi artan, yani faiz riskine karşı koruma sağlayan varlık için yatırımcı negatif prime razı olabilir).<\/li>\n<li>Bir faktörün risk primi: o faktöre betası 1, diğerlerine 0 olan portföyün risk primi.<\/li>\n<li>Örnek 5.3: r<sub>f<\/sub> %6; primler %4, %2, −%6 → %6 + 1,20 × 4 + 0,80 × 2 + (−0,50) × (−6) = %6 + 4,8 + 1,6 + 3,0 = %15,40.<\/li>\n<\/ul>\n\n<h3>Arbitraj Fiyatlama Teorisi (AFT)<\/h3>\n<ul>\n<li>AFT, getiriler tek/çok faktörlü bir modelle üretiliyorsa beklenen getirilerin nasıl belirlendiğini, yani sermaye piyasası dengesinin hangi koşullarda oluştuğunu açıklar. FVFM gibi MKPD'ye dayanır, ancak yöntemi farklıdır.<\/li>\n<li><b>Ross'un üç önermesi:<\/b> (1) menkul kıymet getirileri bir faktör modeliyle ifade edilebilir; (2) sistematik olmayan riski çeşitlendirmeyle ortadan kaldıracak <b>yeterli sayıda<\/b> menkul kıymet vardır; (3) piyasalar <b>sürekli arbitraj fırsatına izin vermeyecek<\/b> kadar iyi işler.<\/li>\n<li><b>Arbitraj (AFT tanımı):<\/b> net yatırım yapmadan (net yatırım maliyeti sıfır) risksiz kazanç elde etme imkânı. Arbitraj olmaması, <b>Tek Fiyat Kanunu<\/b>'na (aynı/benzer iki varlık aynı fiyattan işlem görür) dayanır; ihlalde ucuz piyasada talep, pahalı piyasada arz artar ve fark kapanır.<\/li>\n<\/ul>\n<table>\n<tr><th><\/th><th>Risk-getiri argümanı (FVFM)<\/th><th>Arbitraj argümanı (AFT)<\/th><\/tr>\n<tr><td>Denge bozulunca<\/td><td>Çok sayıda yatırımcı, riskten kaçınma derecesine göre sınırlı ayarlama yapar<\/td><td>Yatırımcılar alabildikleri kadar büyük pozisyon alır<\/td><\/tr>\n<tr><td>Dengeye dönüş<\/td><td>Küçük ayarlamaların toplamı büyük hacim yaratır<\/td><td>Az sayıda yatırımcı yeterlidir; denge daha hızlı kurulur<\/td><\/tr>\n<\/table>\n<h4>İyi çeşitlendirilmiş portföyler<\/h4>\n<ul>\n<li>Portföy betası β<sub>P<\/sub> = Σ w<sub>i<\/sub>β<sub>i<\/sub>; beklenen getiri Σ w<sub>i<\/sub>E(r<sub>i<\/sub>); sistematik olmayan bileşen ε<sub>P<\/sub> = Σ w<sub>i<\/sub>ε<sub>i<\/sub> (ε'ler korelasyonsuz olmalı).<\/li>\n<li>N arttıkça ağırlıklar küçülür ve σ<sup>2<\/sup>(ε<sub>P<\/sub>) sıfıra yaklaşır (eşit ağırlıklı olmasa da). <b>İyi çeşitlendirilmiş portföy:<\/b> sistematik olmayan riskin ihmal edilebilir düzeye indiği sayıda menkul kıymet içeren portföy.<\/li>\n<li>Örnek 5.4: r<sub>f<\/sub> %8; A (iyi çeşitlendirilmiş) %10, β 0,8 → faktör primi 0,025; B β 1,2 → 0,08 + 1,2 × 0,025 = %11; B'nin getirisi de %11 olduğundan AFT'ye uygundur.<\/li>\n<li>Örnek 5.5: P1 %14/β 0,6, P2 %12/β 1,0 → 0,02 = −0,4F → F = −0,05, r<sub>f<\/sub> = %17. P3 (β 0,8) %13 sağlamalıydı, %10 sağlıyor → <b>aşırı değerli<\/b>. P3'te kısa, P1 ve P2'de uzun; faktör nötr: 0,6 × 1 + 1,0 × 1 − 0,8 × 2 = 0. Dağılım 25.000 / 25.000 / −50.000 TL → 3.500 + 3.000 − 5.000 = <b>1.500 TL<\/b> risksiz kazanç. (Faktör betası negatif de olabilir: petrol fiyatı faktörüne karşı havayolu hissesi.)<\/li>\n<li>Örnek 5.6: σ<sub>P<\/sub> %10 → varyans 0,01; faktör bileşenleri 0,0035; 0,0044; 0,0018 → katkılar %35, %44, %18; sistematik olmayan %3. Performansın %97'si faktörlerle açıklanır.<\/li>\n<li>Örnek 5.7: β 0,9, σ<sub>F<\/sub> %15, σ<sub>P<\/sub> %21 → sistematik pay (0,9 × 0,15)<sup>2<\/sup> / 0,21<sup>2<\/sup> = 0,41 (R<sup>2<\/sup> = %41); σ(ε<sub>P<\/sub>) = √(0,0441 − 0,018225) ≈ %16.<\/li>\n<\/ul>\n<h4>Beta ve beklenen getiri<\/h4>\n<ul>\n<li>Dengede yalnız <b>faktör riski<\/b> için prim talep edilir. İyi çeşitlendirilmiş portföyün getiri-faktör noktaları doğru üzerindedir; tekil hisse (S) sistematik olmayan risk taşıdığından noktalar doğrunun etrafına dağılır (S: %12 + 1,2F + ε<sub>S<\/sub>).<\/li>\n<li>Betası eşit (1,2) iki iyi çeşitlendirilmiş portföyden P %12, Z %10 getiriyorsa Z satılıp P alınır: <b>1 TL başına 2 kuruş<\/b> risksiz kazanç. Sonuç: <b>betası aynı iyi çeşitlendirilmiş portföylerin beklenen getirileri eşit olmalıdır.<\/b><\/li>\n<li>Betası farklı portföylerin risk primleri betalarıyla orantılı olmalıdır. Örnek: r<sub>f<\/sub> %6; A β 1, %11; B β 0,5, %7. %50 A + %50 risksiz → C: β 0,5, getiri %8,5 &gt; %7 → arbitraj fırsatı.<\/li>\n<li>Pazar portföyü tek faktör alınırsa: E(r<sub>i<\/sub>) = r<sub>f<\/sub> + β<sub>i<\/sub>[E(r<sub>M<\/sub>) − r<sub>f<\/sub>] → FVFM ile benzer MKPD. Pazar portföyü tek faktörle tam pozitif korelasyonludur, betası 1'dir.<\/li>\n<li>AFT'nin FVFM'den farkı: MKPD'de referans portföyün <b>pazar portföyü olması gerekmez<\/b>; doğru üzerindeki herhangi bir iyi çeşitlendirilmiş portföy referans olabilir. Pazar portföyünün gözlenemezliği sorunu olmadığından AFT <b>daha esnektir<\/b>; endeks modellerine teorik zemin sağlar (endeks iyi çeşitlendirilmişse MKPD geçerlidir).<\/li>\n<li>Soru bankası uygulaması: aşırı değerli (getirisi düşük) iyi çeşitlendirilmiş portföyü sat, aynı betayı veren \"pazar endeksi + risksiz varlık\" sentetik portföyünü al. Örn. β 0,8 → %80 endeks + %20 risksiz.<\/li>\n<\/ul>\n\n<h3>Tekil menkul kıymetler ve AFT<\/h3>\n<ul>\n<li>İlişki sonsuz sayıda farklı iyi çeşitlendirilmiş portföyde geçerliyse <b>neredeyse tüm<\/b> tekil varlıklarda da geçerli olur; formel ispatı güçtür.<\/li>\n<li>Tek bir menkul kıymetin ilişkiyi ihlal etmesi, iyi çeşitlendirilmiş portföydeki ağırlığı ihmal edilebilir olduğu için arbitraj fırsatı yaratmaz; çok sayıda varlık ihlal ederse arbitraj doğar.<\/li>\n<\/ul>\n\n<h3>Faktörler<\/h3>\n<ul>\n<li>AFT, hangi faktörlerin ve primlerin kullanılacağı konusunda yol göstermez. İki ilke: (1) getirileri yüksek derecede açıklayan <b>mümkün olduğunca az<\/b> faktör; (2) yatırımcıların ilgilendiği ve makul prim talep ettiği <b>önemli<\/b> risk faktörleri.<\/li>\n<li><b>Chen, Roll ve Ross<\/b> beş faktörü: <b>IP<\/b> (sanayi üretimindeki yüzde değişim), <b>EI<\/b> (beklenen enflasyondaki değişim), <b>UI<\/b> (beklenmeyen enflasyon değişimi), <b>CG<\/b> (uzun vadeli şirket tahvili getirisi − uzun vadeli devlet tahvili getirisi), <b>GB<\/b> (uzun vadeli devlet tahvili − hazine bonosu getirisi).<\/li>\n<li>Bu çok faktörlü regresyon çok boyutlu menkul kıymet karakteristik doğrusudur (MKKD); faktör betaları çoklu regresyonla tahmin edilir, hata terimi varyansı şirkete özgü riskin tahminidir.<\/li>\n<\/ul>\n<h4>Fama-French üç faktör modeli<\/h4>\n<ul>\n<li>Makro faktörler yerine <b>şirket karakteristiklerini<\/b> kullanır; Ross'un AFT'sinin ampirik uygulamasıdır ve uygulamada en çok tercih edilen modellerdendir.<\/li>\n<li>Gözlem: küçük şirketler büyüklerden, yüksek defter değeri/pazar değeri oranlı <b>değer<\/b> hisseleri <b>büyüme<\/b> hisselerinden ortalamada daha yüksek getiri sağlamıştır.<\/li>\n<li><b>SMB<\/b> (small minus big, küçük eksi büyük): küçük ölçekli hisseler portföyü getirisi − büyük ölçekli hisseler portföyü getirisi (büyüklük etkisi).<\/li>\n<li><b>HML<\/b> (high minus low): defter değeri/pazar değeri yüksek hisseler − düşük hisseler (değer etkisi). <b>r<sub>M<\/sub><\/b>: pazar endeksi getirisi (FVFM'deki rolü oynar).<\/li>\n<li>Faktör portföyleri, bir grupta uzun diğerinde kısa pozisyonla kurulduğu için <b>sıfır net yatırım<\/b> gerektirir; AFT yapısıyla uyumludur. Küçük şirket primi: kırılgan nakit akışı, sınırlı finansman, düşük şeffaflık riskinin bedeli. Değer primi: <b>finansal sıkıntı<\/b> riskinin tazminatı.<\/li>\n<li>Sorunlar: faktörlerin bir sistematik riske karşı tam koruma sağlayıp sağlamadığı belirsiz; açıklayıcı değişken arayışına <b>veri madenciliği<\/b> (data mining/data snooping) denir. Primlerin risk ödülü mü yanlış fiyatlama mı olduğu ve modelin AFT mi yoksa dönemlerarası FVFM (ICAPM) versiyonu mu olduğu tartışmalıdır.<\/li>\n<li>Yorum: pozitif SMB betası küçük şirketlere, negatif SMB büyük şirketlere; pozitif HML değer hisselerine, negatif HML büyüme hisselerine yönelimi gösterir.<\/li>\n<li>Örnek 5.8: β<sub>M<\/sub> 0,90 (prim %3), SMB 1,20 (%8), HML −0,70 (%5), r<sub>f<\/sub> %12, α %1 → r = 0,01 + 0,12 + 0,027 + 0,096 − 0,035 = %21,8 (kitap %22'ye yuvarlar). Artık getiri (r − r<sub>f<\/sub>) %9,8'e katkı: piyasa ≈ %27,6, SMB ≈ %98, HML ≈ −%35,7, alfa ≈ %10,2 (kitap artığı %10 alarak %27, %96, −%35, %10 verir) → küçük sermayeli, büyüme odaklı portföy; en az katkı HML.<\/li>\n<\/ul>\n<h4>Genişletilmiş modeller<\/h4>\n<ul>\n<li><b>Carhart (1997)<\/b> dört faktör: Fama-French + <b>momentum<\/b>. <b>WML<\/b> (winners minus losers): <b>12 aylık<\/b> fiyat performansına göre en iyi ve en kötü hisseler arasındaki getiri farkı. Momentum piyasa anomalisi olarak görülür; davranışsal yanılsamadan doğan risk faktörüdür.<\/li>\n<li><b>Ang (2014)<\/b>'e göre bir faktörün gerçek risk faktörü olması için dört kriterin tamamı: akademik destek ve ekonomik gerekçe; kalıcı ve önemli risk primi; hem normal hem kriz dönemlerinde performans geçmişi; aktif piyasası olan likit varlıklarda uygulanabilirlik.<\/li>\n<li>Diğer faktörler: <b>Yield<\/b> (yüksek − düşük kâr payı getirili), <b>Volatility<\/b> (düşük oynaklıklı − yüksek oynaklıklı), <b>Quality<\/b> (kârlılığı/verimliliği yüksek − düşük).<\/li>\n<li>Örnek 5.9: r<sub>f<\/sub> %10; piyasa 1,20 × 5, SMB 0,40 × 3, HML 0,25 × 2, WML 0,60 × 4, volatilite −0,30 × 1 → beklenen %19,8; gerçekleşen %23 → α = %3,2. WML katkısı 2,4 / 9,8 ≈ %24,5. Negatif volatilite betası (faktör düşük eksi yüksek tanımlı) yüksek oynaklıklı hisselerin tercih edildiğini gösterir; faktör %1 getirirse portföy %0,3 kaybeder.<\/li>\n<\/ul>\n\n<h3>AFT ve FVFM<\/h3>\n<ul>\n<li>İkisi de sermaye bütçelemesi, menkul kıymet değerlemesi ve performans değerlendirmesinde kullanılabilir. AFT, prim talep edilen sistematik (faktör) risk ile prim talep edilmeyen çeşitlendirilebilir riski ayırır.<\/li>\n<li>AFT'nin güçlü yanları: yalnız arbitraj olmaması varsayımına dayanır (ikna edici); dengesizlikten çok az yatırımcı haberdar olsa bile yoğun düzeltici baskı oluşur; iyi çeşitlendirilmiş portföyle risk-getiri ilişkisini açıklar.<\/li>\n<li>FVFM ise gözlenemeyen hipotetik pazar portföyüne ve ortalama-varyans etkinliğine dayanır; ihlalde çok sayıda yatırımcının ayarlamasıyla denge sağlanır.<\/li>\n<li>Dikkat: AFT, FVFM'yi tam olarak domine etmez. FVFM'nin beklenen getiri-beta ilişkisi tekil menkul kıymetlerde de geçerlidir; AFT'ninki iyi çeşitlendirilmiş portföylerde geçerlidir, ancak her tekil menkul kıymet için geçerli olduğu söylenemez.<\/li>\n<\/ul>\n", "sorular": [{"q": "Tek faktörlü modelde faktör, reel GSYH büyümesindeki sürprizdir. Beklenen büyüme %4, gerçekleşen %3,2'dir. Hissenin faktör betası 1,5, beklenen getirisi %14 ve şirkete özgü şok +%1'dir. Hissenin gerçekleşen getirisi kaçtır?", "o": ["%12,80", "%19,80", "%16,20", "%14,20", "%13,80"], "a": 4, "e": "Faktör sürprizi %3,2 − %4 = −%0,8; sistematik etki 1,5 × (−%0,8) = −%1,2. r = %14 − %1,2 + %1 = %13,80."}, {"q": "Bir hissenin faktör betaları GSYH için 0,8, enflasyon için −0,4, faiz için 1,1'dir. Beklentiler GSYH %4, enflasyon %10, faiz %12; gerçekleşenler sırasıyla %5, %13, %12'dir. Beklenen getiri %16 ve şirkete özgü şok sıfırsa gerçekleşen getiri kaçtır?", "o": ["%15,60", "%18,00", "%16,00", "%28,00", "%14,80"], "a": 0, "e": "Sürprizler +%1, +%3, %0. Sistematik katkı 0,8 × 1 − 0,4 × 3 + 1,1 × 0 = −%0,4; r = %16 − %0,4 = %15,60."}, {"q": "Risksiz faiz %8'dir. Bir hissenin GSYH, enflasyon ve faiz faktör betaları 1,0; 0,5 ve −0,6; bu faktörlerin risk primleri %5, %2 ve −%4'tür. Çok faktörlü MKPD'ye göre hissenin beklenen getirisi kaçtır?", "o": ["%11,60", "%16,40", "%8,40", "%19,00", "%13,00"], "a": 1, "e": "E(r) = %8 + 1,0 × 5 + 0,5 × 2 + (−0,6) × (−4) = %8 + 5 + 1 + 2,4 = %16,40. Negatif beta ile negatif prim çarpımı pozitiftir."}, {"q": "Tek faktörlü piyasada risksiz faiz %6'dır. İyi çeşitlendirilmiş A portföyü %12 getiri ve 1,2 faktör betasına sahiptir. Faktör betası 0,8 olan iyi çeşitlendirilmiş B portföyünün AFT'ye göre getirisi kaç olmalıdır?", "o": ["%8,00", "%9,60", "%10,00", "%11,00", "%14,00"], "a": 2, "e": "Faktör primi: 0,12 = 0,06 + 1,2F → F = %5. B: 0,06 + 0,8 × 0,05 = %10. 0,8 × %12 = %9,6 risksiz faizi ihmal eder."}, {"q": "İyi çeşitlendirilmiş P1 (getiri %13, beta 0,5) ve P2 (getiri %19, beta 1,5) portföyleri AFT'ye uygun fiyatlanmıştır. Bu verilere göre risksiz faiz ve faktör risk primi nedir?", "o": ["Risksiz faiz %7, faktör primi %12", "Risksiz faiz %13, faktör primi %6", "Risksiz faiz %10, faktör primi %3", "Risksiz faiz %10, faktör primi %6", "Risksiz faiz %4, faktör primi %10"], "a": 3, "e": "0,13 = rf + 0,5F ve 0,19 = rf + 1,5F → 0,06 = 1,0F → F = %6; rf = 0,13 − 0,03 = %10."}, {"q": "Aynı piyasada betası 1,0 olan iyi çeşitlendirilmiş P3 portföyü %14 getiri sunmaktadır. P1 ve P2'de 1'er birim uzun, P3'te 2 birim kısa pozisyonla toplam 100.000 TL'lik işlem hacmi (25.000 / 25.000 / −50.000 TL) oluşturulursa risksiz arbitraj kazancı kaç TL olur?", "o": ["2.000 TL", "8.000 TL", "3.000 TL", "0 TL", "1.000 TL"], "a": 4, "e": "P3'ün olması gereken getirisi %10 + 1,0 × %6 = %16; %14 sunduğu için aşırı değerlidir ve açığa satılır. Faktör betası: 0,5 + 1,5 − 2 × 1,0 = 0. Kazanç 3.250 + 4.750 − 7.000 = 1.000 TL."}, {"q": "Üç faktörlü bir portföyün standart sapması %20'dir. Faktörlerin sistematik varyans bileşenleri 0,012; 0,010 ve 0,014'tür. Sistematik olmayan riskin toplam varyansa katkısı yüzde kaçtır?", "o": ["%10", "%90", "%64", "%3,6", "%16,4"], "a": 0, "e": "Toplam varyans 0,20² = 0,04. Faktör katkıları 0,012/0,04 = %30, 0,010/0,04 = %25, 0,014/0,04 = %35; toplam %90. Sistematik olmayan pay %10."}, {"q": "Tek faktörlü bir portföyün faktör betası 1,2, faktörün standart sapması %10 ve portföyün standart sapması %20'dir. Portföyün sistematik olmayan riski (standart sapma) kaçtır?", "o": ["%8,00", "%16,00", "%2,56", "%36,00", "%16,73"], "a": 1, "e": "Sistematik varyans (1,2 × 0,10)² = 0,0144; R² = 0,0144/0,04 = %36. σ(ε)² = 0,04 − 0,0144 = 0,0256 → σ(ε) = %16,00. Standart sapmalar doğrudan çıkarılamaz."}, {"q": "Fama-French modelinde bir portföyün piyasa betası 1,1 (prim %6), SMB betası −0,3 (prim %4), HML betası 0,8 (prim %3)'tür. Risksiz faiz %10 ve alfa %0,5 ise portföyün getirisi kaçtır?", "o": ["%8,30", "%20,70", "%18,30", "%17,80", "%16,60"], "a": 2, "e": "r = 0,005 + 0,10 + 1,1 × 0,06 + (−0,3) × 0,04 + 0,8 × 0,03 = 0,005 + 0,10 + 0,066 − 0,012 + 0,024 = %18,30."}, {"q": "Önceki sorudaki portföyün SMB betasının negatif (−0,3), HML betasının pozitif (0,8) olması portföyün yatırım stili hakkında ne söyler?", "o": ["Küçük ölçekli ve büyüme hisselerine yöneliktir", "Küçük ölçekli ve değer hisselerine yöneliktir", "Büyük ölçekli ve büyüme hisselerine yöneliktir", "Büyük ölçekli ve değer hisselerine yöneliktir", "Momentum hisselerine yöneliktir"], "a": 3, "e": "Negatif SMB büyük şirketlere, pozitif HML yüksek defter/pazar değerli (değer) hisselere yönelimi gösterir."}, {"q": "Carhart modelinde bir fonun betaları ve faktör primleri şöyledir: piyasa 1,0 (%5), SMB 0,5 (%2), HML −0,2 (%3), WML 0,8 (%5). Risksiz faiz %9 ve fonun gerçekleşen getirisi %20 ise alfa kaçtır?", "o": ["%5,60", "%0,40", "%10,60", "%6,00", "%1,60"], "a": 4, "e": "Beklenen getiri = %9 + 5 + 1 − 0,6 + 4 = %18,40; α = %20 − %18,40 = %1,60. WML katkısını unutmak alfayı %5,60 gösterir."}, {"q": "Aynı fonda momentum (WML) faktörünün, modelin açıkladığı toplam risk primine (beklenen getiri − risksiz faiz) katkısı yaklaşık yüzde kaçtır?", "o": ["%42,55", "%21,74", "%4,00", "%20,00", "%80,00"], "a": 0, "e": "Toplam risk primi %18,40 − %9 = %9,40; WML katkısı 0,8 × %5 = %4; oran 4 / 9,4 = %42,55."}, {"q": "Pazar endeksinin beklenen getirisi %16, risksiz faiz %6'dır. Betası 1,2 olan iyi çeşitlendirilmiş A portföyü %20 beklenen getiri sunmaktadır. AFT'ye göre hangisi doğrudur?", "o": ["A yüksek fiyatlanmıştır; A açığa satılıp endeks alınarak %2 kazanılır", "A düşük fiyatlanmıştır; A alınıp %120 endeks ve −%20 risksiz varlıktan oluşan sentetik portföy satılarak %2 kazanılır", "A doğru fiyatlanmıştır; arbitraj fırsatı yoktur", "A düşük fiyatlanmıştır; A alınıp endeks satılarak %4 kazanılır", "A yüksek fiyatlanmıştır; risksiz varlık satılıp A alınmalıdır"], "a": 1, "e": "Adil getiri %6 + 1,2 × %10 = %18; A %20 sunduğu için ucuzdur. Aynı betalı sentetik portföy (β = 1,2: %120 endeks, −%20 risksiz) satılıp A alınırsa sıfır net yatırımla %20 − %18 = %2 kazanılır."}, {"q": "Risksiz faiz %5'tir. İyi çeşitlendirilmiş A portföyünün betası 1, beklenen getirisi %12; B portföyünün betası 0,6, beklenen getirisi %8'dir. A ve risksiz varlıkla B ile aynı betaya sahip bir portföy kurularak yapılacak arbitrajda 1 TL başına kazanç ne olur?", "o": ["1,2 kuruş; B alınır, %60 A ve %40 risksiz varlık satılır", "4 kuruş; B satılır, A alınır", "1,2 kuruş; B satılır, %60 A ve %40 risksiz varlık alınır", "0,8 kuruş; B satılır, %40 A ve %60 risksiz varlık alınır", "Arbitraj fırsatı yoktur"], "a": 2, "e": "%60 A + %40 risksiz: beta 0,6, getiri 0,6 × 12 + 0,4 × 5 = %9,2. Aynı betalı B %8 getirdiği için pahalıdır; B satılıp sentetik portföy alınırsa 1 TL başına 1,2 kuruş kazanılır."}, {"q": "Aşağıdakilerden hangisi Ross'un AFT'sinin dayandığı üç temel önermeden biri değildir?", "o": ["Menkul kıymet getirilerinin bir faktör modeliyle ifade edilebilmesi", "Sistematik olmayan riski çeşitlendirmeyle ortadan kaldıracak yeterli sayıda menkul kıymetin bulunması", "Piyasaların sürekli arbitraj fırsatına izin vermeyecek kadar iyi işlemesi", "Yatırımcıların ortalama-varyans optimizasyonu yapması", "Arbitraj imkânı olmaması koşulu"], "a": 3, "e": "Ortalama-varyans etkinliği FVFM ve türevlerinin temelidir; AFT faktör modeli, yeterli menkul kıymet ve arbitraj olmaması koşuluna dayanır."}, {"q": "AFT'de arbitraj nasıl tanımlanır?", "o": ["Yüksek riskle yüksek getiri elde etme", "Pazar portföyünü kopyalayarak getiri elde etme", "Uzun vadede pazarı yenme stratejisi", "Temettü ile sermaye kazancı arasında tercih yapma", "Net yatırım yapmadan risksiz kazanç elde etme imkânı"], "a": 4, "e": "Arbitraj, net yatırım maliyeti sıfırken risksiz kazanç sağlar ve Tek Fiyat Kanunu'na dayanır."}, {"q": "Denge fiyatlarının oluşumunda risk-getiri argümanı ile arbitraj argümanı karşılaştırıldığında hangisi doğrudur?", "o": ["Arbitraj fırsatında az sayıda yatırımcının büyük pozisyonları dengeyi hızla yeniden kurar", "Risk-getiri argümanında yatırımcılar alabildikleri kadar büyük pozisyon alır", "Arbitraj argümanı FVFM'nin temelidir", "Arbitraj argümanında dengeye dönüş için çok sayıda yatırımcının küçük ayarlamaları gerekir", "İki argüman arasında fark yoktur"], "a": 0, "e": "FVFM risk-getiri argümanına (çok yatırımcının sınırlı ayarlaması), AFT arbitraj argümanına (az yatırımcının büyük pozisyonu, hızlı denge) dayanır."}, {"q": "Aşağıdakilerden hangisi Chen, Roll ve Ross'un modelinde kullanılan beş faktörden biri değildir?", "o": ["Sanayi üretimindeki yüzde değişim", "Döviz kurundaki değişim", "Beklenmeyen enflasyon değişimi", "Uzun vadeli şirket tahvili ile devlet tahvili getirileri arasındaki fark", "Uzun vadeli devlet tahvili ile hazine bonosu getirileri arasındaki fark"], "a": 1, "e": "Beş faktör: IP (sanayi üretimi), EI (beklenen enflasyon değişimi), UI (beklenmeyen enflasyon), CG (şirket − devlet tahvili), GB (devlet tahvili − hazine bonosu)."}, {"q": "Fama-French modelindeki HML faktörü neyi ölçer?", "o": ["Küçük ve büyük ölçekli hisseler arasındaki getiri farkını", "Son 12 ayda en çok ve en az kazandıran hisseler arasındaki getiri farkını", "Defter değeri/pazar değeri yüksek hisseler ile düşük hisseler arasındaki getiri farkını", "Yüksek ve düşük kâr payı getirili hisseler arasındaki farkı", "Pazar endeksinin risksiz faiz üzerindeki getirisini"], "a": 2, "e": "HML (high minus low) değer etkisini; SMB büyüklük etkisini; WML momentumu; Yield kâr payı etkisini ölçer."}, {"q": "Carhart'ın Fama-French modeline eklediği WML faktörü nasıl tanımlanır?", "o": ["Düşük ve yüksek oynaklıklı hisseler arasındaki getiri farkı", "Kârlılığı yüksek ve düşük hisseler arasındaki getiri farkı", "Küçük ve büyük ölçekli hisseler arasındaki getiri farkı", "12 aylık fiyat performansına göre en iyi ve en kötü hisseler arasındaki getiri farkı", "Uzun vadeli devlet tahvili ile hazine bonosu getirisi farkı"], "a": 3, "e": "WML (winners minus losers) momentum faktörüdür; davranışsal yanılsamadan doğan risk faktörü olarak görülür."}, {"q": "Ang'ın (2014) bir faktörün gerçek risk faktörü sayılması için öne sürdüğü kriterler arasında hangisi yoktur?", "o": ["Akademik araştırmalarda güçlü destek ve ekonomik gerekçe", "Kalıcı ve önemli seviyede risk primi", "Hem normal hem kriz koşullarında performans geçmişi", "Aktif piyasası olan likit varlıklarda uygulanabilirlik", "Faktörün yalnızca gelişmekte olan piyasalarda prim sağlaması"], "a": 4, "e": "Ang'ın dört kriterinin tamamı sağlanmalıdır: akademik destek, kalıcı prim, normal ve kriz dönemlerinde geçmiş, likit varlıklarda uygulanabilirlik."}, {"q": "AFT ile FVFM karşılaştırmasında aşağıdakilerden hangisi doğrudur?", "o": ["AFT'de MKPD ilişkisi için referans portföyün pazar portföyü olması gerekmez", "AFT, FVFM'yi her açıdan domine eder", "AFT'nin risk-getiri ilişkisi her tekil menkul kıymet için kesin olarak geçerlidir", "FVFM gözlenebilir bir pazar portföyüne dayanır", "AFT ortalama-varyans etkinliğini temel alır"], "a": 0, "e": "AFT'de iyi çeşitlendirilmiş herhangi bir portföy referans olabilir, bu nedenle daha esnektir. FVFM'nin ilişkisi tekil varlıklarda da geçerliyken AFT'ninki her tekil varlık için garanti değildir."}, {"q": "Çok faktörlü MKPD'ye ilişkin hangisi yanlıştır?", "o": ["Her risk faktörü için ayrı bir risk primi vardır", "Faktör risk primleri tek faktörlü modelde olduğu gibi her zaman pozitiftir", "Faktör risk primi, o faktöre betası 1 ve diğerlerine 0 olan portföyün risk primi olarak düşünülebilir", "Faiz riskine karşı koruma sağlayan varlıklar için negatif prim söz konusu olabilir", "Basit MKPD'nin genelleştirilmiş bir ifadesidir"], "a": 1, "e": "Çok faktörlü modelde risk primi ve/veya faktör duyarlılığı negatif olabilir; bu, tek faktörlü modelden temel farklardan biridir."}, {"q": "Tek faktörlü bir piyasada tek bir menkul kıymet beklenen getiri-beta ilişkisini ihlal ederse AFT'ye göre ne olur?", "o": ["Tüm iyi çeşitlendirilmiş portföylerde arbitraj fırsatı doğar", "FVFM geçersiz hâle gelir", "İyi çeşitlendirilmiş portföy üzerindeki etkisi ihmal edilebilir olduğundan arbitraj fırsatı doğmaz", "Pazar portföyünün betası 1'den farklılaşır", "Faktör risk primi negatife döner"], "a": 2, "e": "Tek varlığın iyi çeşitlendirilmiş portföydeki ağırlığı çok küçüktür; ancak çok sayıda varlık ilişkiyi ihlal ederse arbitraj fırsatları doğar."}]}, {"id": 6, "kisa": "Temel Analiz: Makro-Rekabet", "baslik": "Temel Analiz I: Makroekonomi, Sektör, Rekabet Analizi ve Finansal Modelleme", "ozet": "Ekonomik döngü ve göstergeler, sektör duyarlılığı, Porter'ın beş gücü ve gelir-maliyet-işletme sermayesi projeksiyonları.", "notlar": "\n<h3>Temel analizin amacı ve akışı<\/h3>\n<ul>\n<li><b>Temel analiz:<\/b> genel ekonomi, sektör ve şirkete ait temel verilerden hareketle hisse senedinin değerini belirlemeye çalışan kapsamlı analiz süreci. Çıkış noktası, hiçbir şirketin tam bir eşi olmadığı, her şirketin varlık-borç yapısı, organizasyonu ve maddi olmayan değerleriyle özgün olduğudur.<\/li>\n<li><b>Asıl amaç:<\/b> şirketin gelecekte yaratacağı <b>nakit akışlarını, hisse başına kârını ve kâr payını<\/b> tahmin ederek doğru şirket değerine ulaşmak.<\/li>\n<li>Genellikle <b>yukarıdan aşağıya (top-down)<\/b>, yani makro analizden mikro analize doğru ilerler.<\/li>\n<li>Teknik analiz alım-satım <b>zamanlamasına<\/b>, temel analiz ise <b>\"hangi hisse senedi seçilmeli\"<\/b> sorusuna odaklanır. Dikkat: temel analiz teknik analizin alternatifi değil, <b>tamamlayıcısıdır<\/b>.<\/li>\n<li>Aşamalar: <b>Makroekonomi ve sektör analizi → Stratejik rekabet analizi → Finansal modelleme ve projeksiyonlar → Şirket değerleme yaklaşımları.<\/b><\/li>\n<\/ul>\n\n<h3>Genel ekonomi analizi<\/h3>\n<ul>\n<li>Hisse değeri gelecekteki nakit akışlarının iskontosuyla bulunduğu için makro gelişmeler tüm sektörleri ve şirketleri etkiler.<\/li>\n<li>Makro veriler içinde <b>GSYİH tahmini ilk sırada<\/b> gelir. Ayrıca istihdam/işsizlik, enflasyon, faiz oranları ve bütçe açığı ayrı ayrı tahmin edilmelidir.<\/li>\n<li>Talebi belirleyen <b>maliye ve para politikası<\/b> araçları (vergi politikası, para arzını etkileyen politikalar) da öngörülmelidir; bunlar arz-talebi, dolayısıyla satışları ve hisse değerlerini etkiler.<\/li>\n<\/ul>\n\n<h3>Ekonomik döngü (business cycle)<\/h3>\n<ul>\n<li>Konjonktürel etkilere bağlı olarak piyasa koşullarındaki <b>periyodik dalgalanmalar<\/b>; aşamalar tekrar ettiği için \"döngü\" adını alır.<\/li>\n<li>En çok kabul gören tanım <b>Burns ve Mitchell (1946)<\/b>: aynı anda birçok ekonomik aktivitede yaşanan <b>genişlemeler<\/b> ve bunları izleyen <b>resesyon ve daralmalar<\/b>dan oluşan süreç.<\/li>\n<li><b>Genişleme<\/b> dip (trough) noktasında başlar, zirvede (peak) biter; <b>daralma<\/b> zirvede başlar, dipte biter.<\/li>\n<li><b>Dönüm noktası (turning point):<\/b> bir sürecin başlangıcı veya bitişi; reel büyüme oranı ile trend büyüme oranı arasındaki <b>azami farka<\/b> göre belirlenir.<\/li>\n<li>Süre; ekonominin yapısı, savaşlar, politik krizler, salgınlar gibi iç ve dış faktörlerle olağandan uzun ya da kısa olabilir.<\/li>\n<li>Ampirik bulgu (NBER, 1945–2020): <b>genişleme daralmadan daha uzun sürer<\/b>; döngü <b>asimetriktir<\/b>, toparlanma daha hızlıdır, çünkü politika araçları daralma dönemlerinde daha etkili olmuştur.<\/li>\n<\/ul>\n<table>\n<tr><th>Evre<\/th><th>Tanım<\/th><th>Finansal koşullar / politika<\/th><th>Risk iştahı, güven, işgücü<\/th><\/tr>\n<tr><td>Toparlanma<\/td><td>Resesyondan çıkış, büyümeye başlangıç<\/td><td>Destekleyici; likidite artar, kredi koşulları gevşer; para ve maliye politikası destekleyici ve gevşek<\/td><td>Risk iştahı artar, güven yükselir; işsizlik yüksek kalabilir ama işgücüne katılım artar<\/td><\/tr>\n<tr><td>Genişleme<\/td><td>Güçlü ve yaygın olumlu gelişmeler; <b>döngünün en uzun evresi<\/b><\/td><td>Politika etkisi sınırlı, piyasa dinamikleri baskın; borçlanma ve kaldıraç artar; ılımlı enflasyonla sıkılaşma başlar<\/td><td>Risk iştahı ve güven çok yüksek; işsizlik belirgin düşük<\/td><\/tr>\n<tr><td>Yavaşlama<\/td><td>Yavaşlama başlar, daralma fiilen ortaya çıkar<\/td><td>Kredi erişimi zorlaşır; yüksek enflasyon nedeniyle politika sıkı<\/td><td>Risk iştahı ve güven azalmaya başlar; işsizlik artma eğiliminde<\/td><\/tr>\n<tr><td>Resesyon<\/td><td>Faaliyetin dip yaptığı, yavaşlamanın en derin olduğu dönem<\/td><td>Sıkılaşma derinleşir; politika <b>gevşemeye başlar<\/b><\/td><td>Risk iştahı önemli ölçüde düşer, güven en düşük; işsizlik maksimum, katılım düşer<\/td><\/tr>\n<\/table>\n<ul>\n<li>Genişleme kendi içinde <b>erken<\/b> ve <b>geç genişleme<\/b> olarak ikiye ayrılır. Geç genişlemede enflasyon belirginleştiği için parasal sıkılaşma başlar; ekonomi dengeli yavaşlamaya yöneldiğinden bu evreye <b>yumuşak iniş (soft landing)<\/b> denir.<\/li>\n<\/ul>\n<table>\n<tr><th>Faktör<\/th><th>Döngüyle ilişki<\/th><\/tr>\n<tr><td>Reel büyüme<\/td><td><b>Doğrusal yönlü (pro-cycle)<\/b>. Geç genişlemede potansiyel (trend) büyümenin üzerine çıkar, resesyonda altında kalır. Trend büyüme: uzun dönemde optimal büyüme oranı.<\/td><\/tr>\n<tr><td>Enflasyon<\/td><td><b>Doğrusal yönlü<\/b>: genişlemede artar, daralmada azalır.<\/td><\/tr>\n<tr><td>Getiri eğrisi<\/td><td>Başlangıçta dik ve pozitif eğimli → enflasyon ve sıkılaşmayla yataylaşır → <b>yavaşlamada negatif eğimli<\/b> → resesyonda politika faizi düşünce tekrar pozitif.<\/td><\/tr>\n<tr><td>Kredi risk primi<\/td><td><b>Ters yönlü (counter-cycle)<\/b>; belirleyicisi risk iştahı. Genişlemede azalır, daralmada artar.<\/td><\/tr>\n<tr><td>Makro ihtiyati araçlar<\/td><td><b>Ters yönlü<\/b>; ani genişleme-daralmaları (boom-bust) önlemeyi amaçlayan, çoğunlukla niceliksel düzenlemeler; riskler arttığında kendiliğinden agresifleşir.<\/td><\/tr>\n<\/table>\n\n<h3>Ekonomik göstergeler<\/h3>\n<table>\n<tr><th>Grup<\/th><th>Zamanlama<\/th><th>Değişkenler<\/th><\/tr>\n<tr><td><b>Öncü<\/b> (leading)<\/td><td>Reel GSYİH değişmeden <b>6–8 hafta önce<\/b> değişir<\/td><td>İmalatta ortalama haftalık çalışma saati; işsizlik sigortası başvuruları; tüketim malları yeni siparişleri; mal teslimleri; kurulan yeni şirket sayısı; makine-teçhizat yeni siparişleri; inşaat ruhsatları; <b>hisse senedi fiyat endeksi<\/b>; <b>para arzı<\/b>; stoklardaki değişme; işletme ve tüketici kredisi hacmindeki değişme<\/td><\/tr>\n<tr><td><b>Eşanlı<\/b> (coincident)<\/td><td>Reel hasılayla aynı anda<\/td><td>Tarım dışı sektörlerde ödenen ücretler; kişisel gelir; <b>sanayi üretim endeksi<\/b>; imalat ve ticaret satış hacmi<\/td><\/tr>\n<tr><td><b>İzleyen<\/b> (lagging)<\/td><td>Reel GSYİH değiştikten <b>6–8 hafta sonra<\/b><\/td><td>Ortalama işsizlik süresi; birim işgücü maliyeti; stokların satışlara oranı; ticari kredi hacmi; <b>kredi faiz oranı<\/b>; ticari kredilerin kişisel gelire oranı<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Kompozit (bileşik) göstergeler:<\/b> tek gösterge grev, hava koşulları, veri hatası gibi nedenlerle yanlış sinyal verebilir. OECD gibi otoriteler farklı alanları temsil eden verileri belirli ağırlıklarla birleştirir; tekil verideki \"gürültü\" filtrelenir, ana trend daha sağlıklı izlenir.<\/li>\n<li>Örnek kompozit öncü endeks bileşenleri: yeni yapı ruhsatları, hisse senedi piyasası endeksi, fabrika siparişleri, tüketici güven endeksi. Siparişlerde geçici düşüş olsa bile diğerleri yükseliyorsa endeks düşmeyebilir.<\/li>\n<li>Dikkat: işsizlik sigortası <b>başvuruları öncü<\/b>, ortalama işsizlik <b>süresi izleyen<\/b>; tüketim malları siparişleri öncü, stok/satış oranı izleyen göstergedir.<\/li>\n<\/ul>\n\n<h3>Sektör analizi<\/h3>\n<ul>\n<li>İlk iş şirketin hangi sektörde olduğunu belirlemek. ABD <b>SIC<\/b> kodları: ilk iki hane sektörü geniş, üçüncü ve dördüncü haneler dar tanımlar. Türkiye'de <b>NACE<\/b> kodları kullanılır.<\/li>\n<li>Kârın ekonomik döngüye duyarlılığını belirleyen <b>üç faktör<\/b>:\n<ol>\n<li><b>Satışların duyarlılığı:<\/b> gıda, ilaç gibi ihtiyaç maddelerinde (sigara dahil) düşüktür.<\/li>\n<li><b>Faaliyet kaldıracı:<\/b> sabit-değişken gider bileşimi. Değişken gider ağırlıklı sektörler daha az duyarlıdır; sabit gideri yüksek şirket yüksek faaliyet kaldıracına sahiptir ve esneklikten yoksundur.<\/li>\n<li><b>Finansal kaldıraç:<\/b> fon kaynaklarında borç-özkaynak bileşimi.<\/li>\n<\/ol><\/li>\n<li><b>Sektör yaşam döngüsü:<\/b> sektörler doğma, büyüme, olgunluk gibi dönemlerden geçer; bu döngü şirketler için de geçerlidir. Giriş koşulları, rekabet, arz ve talep yönlü faktörler dikkate alınır.<\/li>\n<\/ul>\n\n<h3>Porter'ın beş rekabet gücü<\/h3>\n<p>Rekabeti yalnızca doğrudan rakiplerle sınırlamak yerine beş kuvvetin bileşimi olarak görür: <b>yeni giriş tehdidi, tedarikçilerin pazarlık gücü, alıcıların pazarlık gücü, ikame ürün ve hizmetlerin tehdidi, mevcut rakipler arasındaki rekabet<\/b>. Bu \"genişletilmiş rekabet yapısı\" sektörün <b>uzun dönem ortalama kâr marjını ve özkaynak kârlılığını<\/b> belirler; aynı makro ortamda bazı sektörler tek basamaklı, bazıları yüzde 20'nin üzerinde özkaynak kârlılığı elde eder. Kritik soru \"beş güç var mı\" değil, <b>hangi gücün ne kadar güçlü olduğu ve zamanla nasıl değiştiğidir<\/b>.<\/p>\n<h4>1. Yeni giriş tehdidi<\/h4>\n<ul>\n<li>İki eksen: <b>giriş engelleri<\/b> (mevcut firmaların kalıcı avantajları) ve <b>misilleme beklentisi<\/b>.<\/li>\n<li>Giriş engelleri: <b>arz yönlü ölçek ekonomileri<\/b> (sabit maliyeti çok birime yaymak; ör. yılda 150 bin ton üzeri üreten ambalaj tesisi), <b>talep yönlü ölçek ekonomileri ve ağ etkileri<\/b> (kullanıcı arttıkça değer artar; yemek kartı örneği), <b>müşteri geçiş maliyetleri<\/b> (eğitim, entegrasyon, veri taşıma, aksama), <b>sermaye gereksinimi<\/b> (bina-makine yanında stok finansmanı, lisans, tanıtım ve ilk yıl zararları), <b>boyuttan bağımsız avantajlar<\/b> (lokasyon, tarihsel ilişkiler, bilgi birikimi), <b>dağıtım kanallarına erişim<\/b> (raf bedeli, ciro primi), <b>devlet politikaları<\/b> (lisans, asgari sermaye; bankacılıkta BDDK'nın uygun bulduğu iş planı ve yönetim ekibi).<\/li>\n<li>Misilleme ne kadar sert beklenirse <b>risk primi o kadar yükselir<\/b> ve fiili giriş o kadar azalır.<\/li>\n<\/ul>\n<h4>2. Tedarikçilerin pazarlık gücü<\/h4>\n<p>Tedarikçiler güçlüdür: tedarikçi sayısı az, alıcı çoksa; tedarikçinin müşteri profili çeşitliyse (tek sektöre bağlı değilse); alıcının tedarikçi değiştirme maliyeti yüksekse; girdinin yakın ikamesi yoksa; <b>ileriye doğru entegrasyon<\/b> tehdidi varsa. Örnek: kritik kimyasalı dünyada üç üretici sağlıyor, ton fiyatı 120.000 TL'den 140.000 TL'ye çekilebiliyor, boya üreticisi artışı fiyata yansıtamıyor.<\/p>\n<h4>3. Alıcıların pazarlık gücü<\/h4>\n<p>Alıcılar güçlüdür: birkaç büyük alıcı talebin çoğunu kontrol ediyorsa; ürün standart ve geçiş maliyeti düşükse; ürünün alıcının toplam maliyetindeki payı yüksekse; alıcının kârlılığı zaten düşükse; <b>geriye doğru entegrasyon<\/b> imkânı varsa. Örnek: satışların yüzde 70'i üç zincir marketten; yüzde 25'e varan iskonto, vadenin 60 günden 90 güne çıkarılması.<\/p>\n<h4>4. İkame ürün ve hizmetler<\/h4>\n<p>Aynı ihtiyacı farklı yöntemle karşılayan ürünler (şehirlerarası yolculukta özel araç, tren, otobüs, uçak). İkameler sektör için fiili bir <b>\"fiyat tavanı\"<\/b> oluşturur; tehdit yüksekse şirketler fiyat yerine kalite ve hizmetle <b>fiyat dışı farklılaşmaya<\/b> yönelir.<\/p>\n<h4>5. Mevcut rakipler arasındaki rekabet<\/h4>\n<p>Rekabet sertleşir: çok sayıda ve güçleri yakın rakip varsa (belirgin lider yoksa); sektör büyümesi düşükse; <b>çıkış engelleri yüksekse<\/b>; yatırımcılar prestij, istihdam gibi finansal olmayan nedenlerle bağlıysa. Fiyat rekabeti ürünler benzer ve geçiş maliyeti düşükken artar; sabit maliyeti yüksek, marjinal maliyeti düşük sektörler (otel, havayolu, yük taşımacılığı) boş kapasite için fiyat kırmaya yatkındır.<\/p>\n\n<h3>Beş güç sayılmayan dört çevresel unsur<\/h3>\n<ul>\n<li>Porter'a göre <b>sektör büyüme hızı, teknoloji ve inovasyon, devlet politikaları ve düzenlemeler, tamamlayıcı ürün ve hizmetler<\/b> ayrı rekabet gücü değildir; beş gücün şiddetini etkileyen koşullardır.<\/li>\n<li>Dikkat: <b>yüksek büyüme tek başına yüksek kârlılık demek değildir<\/b>; giriş engeli düşükse yeni oyuncuları çeker ve marjları düşürür.<\/li>\n<li>Tamamlayıcılara örnek: akıllı telefon–uygulama, oyun konsolu–oyun, elektrikli araç–şarj istasyonu.<\/li>\n<\/ul>\n\n<h3>Yapının değişimi, strateji ve sektör sınırları<\/h3>\n<ul>\n<li>Analistin görevi geçici <b>konjonktürel dalgalanmaları<\/b> kalıcı <b>yapısal değişimlerden<\/b> ayırmaktır (ör. bankacılıkta son on beş yılda dijital dönüşüm alıcı gücünü artırdı, yeni ikame kanalları yarattı).<\/li>\n<li>Porter'ın <b>üç stratejik yolu<\/b>: (1) şirketi güçlerle daha iyi baş edebileceği konuma yerleştirmek (niş alan), (2) güçlerdeki değişimi rakiplerden önce okuyup fırsata çevirmek, (3) \"oyun kurallarını\" kendi lehine değiştirmek (kilit lokasyon, patent, marka, sadakat programı).<\/li>\n<li>Sektör analizinde sıra: ürün ve coğrafya açısından kapsamı belirle → alıcı, tedarikçi, rakip, potansiyel giren ve ikameleri haritala → her grup için yoğunlaşma, büyüklük, geçiş maliyeti, kârlılık ve entegrasyon olasılığını değerlendir.<\/li>\n<\/ul>\n\n<h3>Finansal modelleme ve projeksiyonlar<\/h3>\n<ul>\n<li>Şirket değeri gelecekte beklenen nakit akışlarının bugünkü değeridir; bu yüzden değerlemedeki <b>en önemli süreç projeksiyonlardır<\/b>. Model mekanik geçmiş uzatmasıyla değil, iş modeli, yönetim, rekabet yapısı ve düzenleyici ortamı kavrayan tahminle kurulur.<\/li>\n<li>Reel sektörde modelleme <b>gelir tablosundan<\/b> başlar. Tipik sıra: <b>gelir tablosu → bilanço → nakit akış tablosu<\/b>. Banka ve sigorta şirketlerinde bilanço kalemlerinin bugünkü değeri zaman zaman daha belirleyicidir.<\/li>\n<li><b>Açık tahmin ufku<\/b> genellikle <b>10 yıla kadar<\/b>; hızlı teknolojik değişime açık sektörlerde 5 yıl, düzenlemenin ağır ve nakit akışının öngörülebilir olduğu altyapı/kamu hizmetlerinde on yıl. Ufkun ötesinde <b>terminal değer<\/b> kullanılır.<\/li>\n<li><b>Satışa dayalı proforma model:<\/b> önce satışlar tahmin edilir; SMM, brüt marj, faaliyet giderleri, amortisman, faiz, vergi, işletme sermayesi ve yatırımlar satışların yüzdesi olarak kurulur.<\/li>\n<\/ul>\n<table>\n<tr><th>Gelir yöntemi<\/th><th>Mantık<\/th><th>Artı / eksi<\/th><\/tr>\n<tr><td>Yukarıdan aşağıya<\/td><td>Toplam adreslenebilir pazar × şirketin pazar payı; olgun sektörlerde tercih edilir<\/td><td>Makro ve sektörle uyumlu / kapasite, mağaza sayısı, üretim sınırlarını ikinci plana atma riski<\/td><\/tr>\n<tr><td>Aşağıdan yukarıya<\/td><td>Ürün bazında adet × fiyat, mağaza/şube bazında satış, kapasite kullanımı<\/td><td>Operasyonel gerçekliği yansıtır / zaman alıcı, birimler arası tutarsızlık riski<\/td><\/tr>\n<tr><td>Hibrit<\/td><td>İki yaklaşım birbirini kontrol eder; <b>hacim–fiyat ayrıştırması<\/b> (satış = hacim × ortalama fiyat)<\/td><td>Pratikte en sağlıklı sonuç<\/td><\/tr>\n<\/table>\n<ul>\n<li>Örnek (ModaPark): 120 mağaza; hazır giyim pazarı yaklaşık 500 milyar TL, üç yıl yüzde 18 nominal büyüme; pazar payı yüzde 2,2'den (yaklaşık 11 milyar TL ciro) yüzde 2,7'ye.<\/li>\n<li>Fiyat varsayımları beş güç çerçevesinde kurulur: yoğun ikame ve fiyat rekabetinde nominal fiyat artışları <b>enflasyonun gerisinde<\/b> kalır; güçlü marka ve yüksek giriş engelinde enflasyonun üzerine çıkabilir.<\/li>\n<li>Maliyetler sabit–değişken, doğrudan–dolaylı veya fonksiyonel ayrımla modellenir. SMM hacim, girdi fiyatı ve verimlilikle; genel yönetim giderleri satışlardan daha yavaş artan, kısmen sabit kalem olarak ele alınır. Emsal şirket marjları kontrol mekanizmasıdır.<\/li>\n<li>Yüksek enflasyonda güçlü markalar maliyeti fiyata hızla yansıtır; deflasyona yakın dönemde sabit maliyet yoğun sektörlerde kârlılık zayıflar. Yeni teknolojide eski ürün satışlarının yeni ürüne kayması (kanibalizasyon) hesaba katılır.<\/li>\n<li><b>İşletme sermayesi<\/b> oranları (alacak gün sayısı, stok devir hızı, borç gün sayısı) pazarlık gücü ve rekabet yapısıyla şekillenir; tedarikçi güçlü, alıcı vade baskısı yapıyorsa nakit baskısı artar. <b>CAPEX<\/b> varsayımları kapasite kullanımı, büyüme hedefi ve teknolojik yenilemeye dayanır.<\/li>\n<li>Projeksiyonlar serbest nakit akımına dönüştürülür ve <b>AOSM<\/b> ile iskonto edilir.<\/li>\n<li><b>Yatırım sermayesi getirisi (ROIC):<\/b> uzun süre AOSM'nin anlamlı ölçüde üzerinde ROIC üreten şirketler <b>sürdürülebilir rekabet avantajına<\/b> sahiptir. Giriş engeli zayıf, alıcı-tedarikçi güçlü, ikamesi bol, fiyat rekabeti sert sektörlerde ROIC uzun vadede <b>AOSM'ye yakınsar<\/b>. Böyle bir sektörde ROIC'yi beş yılda yüzde 10'dan yüzde 25'e çıkarıp terminalde sabitleyen model, ikna edici gerekçe yoksa gerçekçi değildir.<\/li>\n<\/ul>\n\n<h3>Formül tablosu<\/h3>\n<table>\n<tr><th>Kavram<\/th><th>Formül<\/th><\/tr>\n<tr><td>Kompozit endeks değişimi<\/td><td>Σ (bileşen ağırlığı × bileşenin yüzde değişimi)<\/td><\/tr>\n<tr><td>Faaliyet kârı<\/td><td>Adet × (birim fiyat − birim değişken gider) − toplam sabit gider<\/td><\/tr>\n<tr><td>Birim toplam maliyet<\/td><td>Sabit maliyet / üretim hacmi + birim değişken maliyet<\/td><\/tr>\n<tr><td>Yukarıdan aşağıya hasılat<\/td><td>Toplam pazar büyüklüğü × pazar payı<\/td><\/tr>\n<tr><td>Hacim–fiyat<\/td><td>Satış = satış hacmi × ortalama birim fiyat<\/td><\/tr>\n<tr><td>Net işletme sermayesi (basit)<\/td><td>NİS = ticari alacaklar + stoklar − ticari borçlar; ΔNİS = NİS<sub>1<\/sub> − NİS<sub>0<\/sub><\/td><\/tr>\n<tr><td>Yatırım sermayesi getirisi<\/td><td>ROIC = vergi sonrası FVÖK / yatırılan sermaye<\/td><\/tr>\n<tr><td>Geçiş maliyeti geri ödemesi<\/td><td>Tek seferlik geçiş maliyeti / yıllık tasarruf<\/td><\/tr>\n<\/table>\n", "sorular": [{"q": "Bir kompozit öncü göstergeler endeksinde inşaat ruhsatları yüzde 30, hisse senedi endeksi yüzde 50, imalat yeni siparişleri yüzde 20 ağırlıklıdır. Bir ayda ruhsatlar 120'den 132'ye, hisse endeksi 2.000'den 2.080'e çıkmış, siparişler 150'den 126'ya inmiştir. Kompozit endeksteki değişim kaçtır?", "o": ["-%0,67", "-%2,0", "%1,8", "%3,2", "%5,0"], "a": 2, "e": "Bileşen değişimleri %10, %4 ve -%16'dır. Ağırlıklı toplam: 0,30×10 + 0,50×4 + 0,20×(-16) = 3 + 2 - 3,2 = %1,8. Ağırlıksız ortalama -%0,67 verir; siparişlerdeki düşüşe rağmen ana trend yukarıdır."}, {"q": "Aynı sektördeki iki şirket 10.000 adet ürünü 50 TL'den satmaktadır. Alfa'nın birim değişken gideri 20 TL, sabit gideri 150.000 TL; Beta'nın birim değişken gideri 40 TL, sabit gideri 30.000 TL'dir. Satış adedi yüzde 25 düşerse Alfa'nın faaliyet kârındaki düşüş oranı kaçtır?", "o": ["%50", "%25", "%35,7", "%75", "%40"], "a": 0, "e": "Alfa'nın kârı 300.000 - 150.000 = 150.000 TL'den 7.500 × 30 - 150.000 = 75.000 TL'ye iner: %50 düşüş. Beta'da düşüş %35,7'dir; sabit gideri yüksek (faaliyet kaldıracı yüksek) şirket döngüye daha duyarlıdır."}, {"q": "Bir sektörde yıllık sabit maliyet 12.000.000 TL, birim değişken maliyet 30 TL ve piyasa fiyatı 75 TL'dir. Yılda 300.000 adet üreten mevcut firmaya karşı 60.000 adet üretebilen yeni girişimci aynı fiyattan satarsa birim başına kâr/zararı ne olur?", "o": ["5 TL kâr", "125 TL zarar", "45 TL kâr", "155 TL zarar", "200 TL zarar"], "a": 3, "e": "Yeni girişimcinin birim maliyeti 12.000.000/60.000 + 30 = 230 TL; 75 - 230 = 155 TL zarar. Mevcut firmanın birim maliyeti 70 TL'dir (5 TL kâr). Bu, arz yönlü ölçek ekonomisi kaynaklı giriş engelidir."}, {"q": "Bir şirket yıllık lisans bedeli 900.000 TL olan yazılımı, lisansı 600.000 TL olan rakip yazılımla değiştirmeyi düşünüyor. Tek seferlik veri taşıma 300.000 TL, eğitim 150.000 TL, üretim aksaması 450.000 TL'dir. Geçiş maliyeti tasarrufla kaç yılda karşılanır ve bu durum hangi kavramla açıklanır?", "o": ["1,5 yıl – ağ etkisi", "3 yıl – müşteri geçiş maliyeti", "3 yıl – ileriye doğru entegrasyon", "2 yıl – müşteri geçiş maliyeti", "4 yıl – sermaye gereksinimi"], "a": 1, "e": "Toplam geçiş maliyeti 900.000 TL, yıllık tasarruf 300.000 TL; geri ödeme 3 yıl. Yüksek geçiş maliyeti müşteriyi mevcut tedarikçide tutar ve yeni girenler için engel oluşturur."}, {"q": "Ton fiyatı 250.000 TL olan bir boyada kritik kimyasal girdi 150.000 TL, diğer maliyetler 60.000 TL'dir. Dünyada üç üreticisi olan kimyasala yüzde 20 zam gelir ve şirket satış fiyatını değiştiremezse ton başına kârdaki erime yüzde kaçtır?", "o": ["%20", "%50", "%100", "%30", "%75"], "a": 4, "e": "Zamlı girdi 180.000 TL olur. Kâr 250.000 - 210.000 = 40.000 TL'den 250.000 - 240.000 = 10.000 TL'ye iner; erime %75. Az sayıda tedarikçi ve ikamesiz girdi tedarikçi gücünü artırır."}, {"q": "Bir üretici ayda 20.000 adet ürünü 50 TL'den zincir markete satmaktadır. Market yüzde 20 iskonto ve tahsilat vadesinin 45 günden 105 güne uzatılmasını dayatmıştır. Aylık finansman maliyeti yüzde 1,5 ise yeni ciro üzerinden ilave aylık finansman yükü ne kadardır?", "o": ["30.000 TL", "12.000 TL", "24.000 TL", "200.000 TL", "48.000 TL"], "a": 2, "e": "Yeni ciro 20.000 × 40 = 800.000 TL. Vade 60 gün yani 2 ay uzadığı için yük 800.000 × (%1,5 × 2) = 24.000 TL. Eski ciro (1.000.000 TL) kullanılırsa 30.000 TL bulunur, bu hatalıdır."}, {"q": "Ürün A 800 saat çalışır ve 320 TL'dir; ikame Ürün B 2.000 saat çalışır ve 900 TL'dir. Müşteriler saatlik maliyete göre seçim yapıyorsa, Ürün B fiyatını korurken Ürün A'nın çıkabileceği en yüksek fiyat kaç TL'dir?", "o": ["360 TL", "400 TL", "416 TL", "450 TL", "336 TL"], "a": 0, "e": "Ürün B'nin saatlik maliyeti 900/2.000 = 0,45 TL. Ürün A için tavan 0,45 × 800 = 360 TL. İkame ürün sektör için fiili fiyat tavanı oluşturur."}, {"q": "Yıl 0'da toplam pazar 600 milyar TL, şirketin payı yüzde 2,0'dir. Pazarın her yıl yüzde 25 büyümesi, şirket payının her yıl 0,25 puan artması bekleniyor. Yukarıdan aşağıya yaklaşımla Yıl 2 şirket hasılatı yaklaşık kaç milyar TL'dir?", "o": ["16,88", "18,75", "22,50", "23,44", "32,23"], "a": 3, "e": "Yıl 2 pazar: 600 × 1,25² = 937,5 milyar TL; pay %2,5. Hasılat 937,5 × 0,025 = 23,44 milyar TL. 16,88 Yıl 1, 32,23 Yıl 3 hasılatıdır."}, {"q": "Bir perakendecinin 40 mağazası mağaza başı yıllık 30 milyon TL ciro yapmaktadır. Gelecek yıl aynı mağaza büyümesi yüzde 20, yıl ortasında 8 yeni mağaza açılacak (yeni mağaza tam yıl cirosu mevcut mağazanın yeni cirosuna eşit varsayılıyor), 200 milyon TL olan e-ticaret cirosu yüzde 50 büyüyecektir. Aşağıdan yukarıya toplam hasılat kaç milyon TL'dir?", "o": ["2.028", "1.884", "1.740", "1.824", "1.908"], "a": 1, "e": "Mevcut mağazalar 40 × 36 = 1.440; yeni mağazalar yarım yıl çalıştığı için 8 × 18 = 144; e-ticaret 300. Toplam 1.884 milyon TL. Yeni mağazaları tam yıl saymak 2.028 verir."}, {"q": "Bir şirket geçen yıl 4 milyon adet ürünü 200 TL'den satmıştır. Bu yıl hacim yüzde 15, fiyat yüzde 25 artacak; SMM satışların yüzde 62'si olacak; faaliyet giderlerinin geçen yıl 100 milyon TL olan sabit kısmı yüzde 25 artacak, değişken kısmı satışların yüzde 4'ü olacaktır. Bu yılın FVÖK'ü kaç milyon TL'dir?", "o": ["437", "312", "221", "288", "266"], "a": 4, "e": "Hasılat 4,6 × 250 = 1.150; brüt kâr 1.150 × 0,38 = 437; faaliyet giderleri 125 + 46 = 171; FVÖK 437 - 171 = 266 milyon TL (marj yaklaşık %23,1)."}, {"q": "Geçen yıl satışlar 2.000, SMM 1.400 milyon TL; ticari alacaklar satışların yüzde 12'si, stoklar SMM'nin yüzde 15'i, ticari borçlar SMM'nin yüzde 10'udur. Bu yıl satışlar 2.600, SMM 1.800 olacak; alacak oranı yüzde 15'e çıkacak, stok oranı aynı kalacak, borç oranı yüzde 8'e inecektir. Net işletme sermayesi artışı kaç milyon TL'dir?", "o": ["310", "516", "206", "134", "162"], "a": 2, "e": "NİS0 = 240 + 210 - 140 = 310; NİS1 = 390 + 270 - 144 = 516; ΔNİS = 206 milyon TL. Bu artış serbest nakit akımını azaltan bir nakit çıkışıdır."}, {"q": "Giriş engeli olmayan, fiyat rekabetinin sert olduğu bir sektördeki şirket için model, yatırılan sermayenin 2.400 milyon TL'ye ve vergi sonrası FVÖK'ün 720 milyon TL'ye ulaşacağını ve bu getirinin terminal dönemde sürdüğünü varsaymaktadır. AOSM yüzde 14 ise doğru değerlendirme hangisidir?", "o": ["ROIC %30'dur; böyle bir yapıda ROIC uzun vadede AOSM'ye yakınsayacağından varsayım ikna edici gerekçe olmadan gerçekçi değildir", "ROIC %30'dur; rekabet yoğun olduğu için ROIC zamanla daha da artar", "ROIC %3,3'tür; şirket değer yok etmektedir", "ROIC %30'dur; AOSM'nin üzerinde olduğu için sürdürülebilir rekabet avantajı kanıtlanmıştır", "ROIC %16'dır; AOSM'ye yakın olduğu için tutarlıdır"], "a": 0, "e": "ROIC = 720/2.400 = %30. Zayıf rekabet yapısında yüksek getiri yeni girişleri çeker ve ROIC AOSM'ye yakınsar; ölçek, format veya düzenleme kaynaklı net gerekçe yoksa model beş güç analiziyle uyumsuzdur."}, {"q": "Ekonomik döngünün en çok kabul gören tanımı kime aittir?", "o": ["Porter (1979)", "Molodovsky", "Bri
