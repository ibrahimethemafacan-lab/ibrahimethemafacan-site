<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}

<script>
const S=[{"id": 1, "kisa": "Paranın Zaman Değeri", "baslik": "Paranın Zaman Değeri ve Faiz Hesaplamaları", "ozet": "Basit ve bileşik faiz, efektif ve sürekli bileşik faiz, bugünkü ve gelecekteki değer, anüite, kredi taksiti ve perpetüite hesapları.", "notlar": "\n<h3>Temel kavramlar<\/h3>\n<ul>\n<li><b>Yatırım:<\/b> bugün sahip olunan parasal büyüklüğün kullanımından (cari tüketimden), gelecekte daha fazla parasal büyüklük elde etme beklentisiyle belli bir süre vazgeçmektir. Fon fazlası olanlar tüketimi erteler; fon açığı olanlar bugün fazla tüketmek için gelecekte daha az tüketmeye razı olur.<\/li>\n<li><b>Paranın zaman değeri:<\/b> tüketimi ertelemenin ödülü ya da bugün daha fazla tüketmenin bedelidir.<\/li>\n<li><b>Paranın saf zaman değeri:<\/b> fiyatlar genel düzeyinin değişmediği ve belirsizliğin olmadığı hipotetik ortamda bugünkü ve gelecekteki parasal büyüklük arasındaki değişimin bedeli/ödülüdür.<\/li>\n<li><b>Gerekli getiri oranı:<\/b> yatırımcının fonlarından vazgeçmesi karşılığında talep ettiği ödül. Üç unsuru karşılar: (1) fonlardan vazgeçilen <b>zaman<\/b>, (2) paranın <b>satın alma gücündeki değişim<\/b>, (3) gelecekteki ödemelere ilişkin <b>belirsizlik<\/b>.<\/li>\n<li><b>Faiz:<\/b> borç verilen fon karşılığı talep edilen gelir (faiz geliri) ya da borç alanın katlandığı bedel (faiz gideri). <b>Faiz oranı<\/b> = yıllık faiz / borç verilen (alınan) fon tutarı. Örnek: 100 milyar TL kredi, yıllık %60 → yıl sonunda 60 milyar TL faiz.<\/li>\n<li>Dikkat: paranın zaman değeri hesapları \"faiz hesapları\" diye de anılır; ancak paranın zaman değeri yalnızca faizle sınırlı değildir.<\/li>\n<\/ul>\n\n<h3>Basit ve bileşik faiz<\/h3>\n<table>\n<tr><th>Yöntem<\/th><th>Faiz neyin üzerinden?<\/th><th>Formül<\/th><th>Büyüme<\/th><\/tr>\n<tr><td><b>Basit faiz<\/b><\/td><td>Yatırım süresi boyunca yalnız anapara<\/td><td>GD<sub>t<\/sub> = BD × (1 + r × t)<\/td><td>Doğrusal<\/td><\/tr>\n<tr><td><b>Bileşik faiz<\/b><\/td><td>Her dönemin faizi anaparaya eklenir; faizin de faizi kazanılır<\/td><td>GD<sub>t<\/sub> = BD × (1 + r)<sup>t<\/sup><\/td><td>Üstel (hızlanan)<\/td><\/tr>\n<\/table>\n<ul>\n<li>100 TL, yıllık %10: basit faizle 5. yıl sonu 150 TL; bileşik faizle 161,05 TL (110 → 121 → 133,10 → 146,41 → 161,05).<\/li>\n<li>10.000 TL, %8, 2 yıl: basit 11.600 TL; bileşik 11.664 TL.<\/li>\n<li>1.000 TL, %10, 50 yıl: 1.000 × 1,1<sup>50<\/sup> = 117.390,9 TL. Bunun 1.000 TL'si anapara, 5.000 TL'si (50 × 100) basit faiz, kalan 111.390,9 TL'si faizin faizi (bileşik etki).<\/li>\n<li>Dikkat: basit ve bileşik faiz farkı vade uzadıkça belirginleşir; bileşik etki = bileşik GD − basit GD.<\/li>\n<\/ul>\n\n<h3>Efektif yıllık faiz oranı (EYO)<\/h3>\n<ul>\n<li>Bankalar faizi geleneksel olarak <b>yıllık basit (nominal, duyurulan) oran<\/b> olarak açıklar; yıl içindeki her bileşik dönem için bu oranın uygun payı (r/m) uygulanır.<\/li>\n<li>Daha sık bileşikleme faiz getirisini (kredide maliyeti) yükseltir. <b>EYO<\/b>, yıl sonunda bileşikleme olmaksızın aynı sonucu verecek yıllık oranı gösterir.<\/li>\n<li>%20 yarıyıllık bileşik: 6 ayda %10 → 1.000 × 1,10<sup>2<\/sup> = 1.210 TL → EYO %21 (yıllık %20 ile 1.200 TL; 10 TL fark faizin faizidir).<\/li>\n<li>%8 çeyreklik bileşik: (1 + 0,08/4)<sup>4<\/sup> = 1,0824 → EYO %8,24.<\/li>\n<li>Dikkat: bileşikleme sıklığı farklı yatırımları karşılaştırırken daima EYO'ya çevir; yıllık basit oranlarla karşılaştırma yanıltıcıdır. Aynı nominal oranda m arttıkça EYO artar.<\/li>\n<\/ul>\n\n<h3>Sürekli bileşik faiz<\/h3>\n<ul>\n<li>Bileşikleme sayısı sonsuza (dönem süresi sıfıra) yaklaştırılırsa sürekli bileşik faiz elde edilir. e ≈ 2,71828.<\/li>\n<li>%10 sürekli bileşik → EYO = e<sup>0,10<\/sup> − 1 = %10,517.<\/li>\n<li>Ters dönüşüm: r* = ln(1 + EYO). %21 EYO'ya (yani %20 yarıyıllık bileşiğe) eşdeğer sürekli oran: ln(1,21) ≈ %19,062.<\/li>\n<li>Piyasada sürekli bileşik ürün olmasa da opsiyon fiyatlaması gibi hesaplarda fonksiyonların türevinin alınabilmesi için faiz sürekli bileşik olarak ifade edilir; bu nedenle EYO sürekli bileşik orana çevrilir.<\/li>\n<li>Soru bankası uygulaması: sürekli bileşik faizle t yıl sonraki değer GD = BD × e<sup>r × t<\/sup> (10.000 TL, %15, 3 yıl → 15.683,12 TL).<\/li>\n<\/ul>\n\n<h3>Bugünkü değer ve gelecekteki değer<\/h3>\n<ul>\n<li><b>Gelecekteki değer (GD):<\/b> bugünkü büyüklüğün r üzerinden faiz kazandıktan sonra ulaşacağı toplam değer.<\/li>\n<li><b>Bugünkü değer (BD):<\/b> gelecekteki büyüklüğün <b>iskonto oranıyla<\/b> bugüne indirgenmiş değeri. İskonto oranı, bugünkü değeri hesaplamada kullanılan faiz oranıdır.<\/li>\n<li>Nakit akışı (NA) sınıflaması: <b>bir defa gerçekleşen<\/b> NA; <b>seri hâlinde<\/b> NA (dönemsel tutarlar birbirinden farklı ya da birbirinin aynı).<\/li>\n<li>Farklı tutarlı serilerde her NA'nın zaman değeri ayrı ayrı hesaplanıp toplanır; başka yol yoktur. Eşit tutarlı serilerde seri bir bütün olarak ele alınabilir.<\/li>\n<li><b>Anüite:<\/b> dönemsel aralıkları eşit, aynı tutarda ve aynı yönde olan nakit akışı serisi.<\/li>\n<\/ul>\n\n<h4>Formül tablosu<\/h4>\n<table>\n<tr><th>Hesap<\/th><th>Formül<\/th><\/tr>\n<tr><td>Bir defalık NA'nın GD'si<\/td><td>GD<sub>t<\/sub> = NA<sub>0<\/sub> × (1 + r)<sup>t<\/sup><\/td><\/tr>\n<tr><td>Bir defalık NA'nın BD'si<\/td><td>BD = NA<sub>t<\/sub> / (1 + r)<sup>t<\/sup><\/td><\/tr>\n<tr><td>Farklı NA serisinin GD'si<\/td><td>NAGD = Σ NA<sub>t<\/sub> × (1 + r)<sup>n − t<\/sup><\/td><\/tr>\n<tr><td>Farklı NA serisinin BD'si<\/td><td>BD = Σ NA<sub>t<\/sub> / (1 + r)<sup>t<\/sup><\/td><\/tr>\n<tr><td>Anüitenin GD'si (dönem sonu)<\/td><td>AGD = A × [(1 + r)<sup>n<\/sup> − 1] / r<\/td><\/tr>\n<tr><td>Anüitenin BD'si (dönem sonu)<\/td><td>BD = A × [1 − 1/(1 + r)<sup>n<\/sup>] / r<\/td><\/tr>\n<tr><td>Anüitenin BD'si (dönem başı)<\/td><td>BD = A × [1 − 1/(1 + r)<sup>n<\/sup>] / r × (1 + r)<\/td><\/tr>\n<tr><td>Kalan borç (n dönemlik kredide N dönem sonra)<\/td><td>B = A × [1 − (1 + r)<sup>N − n<\/sup>] / r<\/td><\/tr>\n<tr><td>Düz perpetüite<\/td><td>BD<sub>0<\/sub> = A / r<\/td><\/tr>\n<tr><td>Büyüyen perpetüite<\/td><td>BD<sub>0<\/sub> = A<sub>1<\/sub> / (r − g), şart: r &gt; g<\/td><\/tr>\n<tr><td>Temettü (Gordon) modeli<\/td><td>P<sub>0<\/sub> = D<sub>1<\/sub> / (r − g), D<sub>1<\/sub> = D<sub>0<\/sub> × (1 + g)<\/td><\/tr>\n<\/table>\n\n<h4>Kitaptaki çözümlü örnekler<\/h4>\n<ul>\n<li>35.000 TL, yıllık %20 bileşik, 10 yıl → 216.711 TL (200.000 TL'lik ihtiyacı aşar).<\/li>\n<li>4 ay sonra 1.500 TL lazım, aylık %4 → bugün 1.500 / 1,04<sup>4<\/sup> = 1.282,2 TL.<\/li>\n<li>Haziran 400, Temmuz 550, Ağustos 600 TL, aylık %4 → Ağustos sonu 1.604,64 TL (yalnız 1.600 TL'lik İspanya turuna yeter).<\/li>\n<li>Her ay 600 TL, 3 ay, %4 → 600 × 3,1216 = 1.872,96 TL. Yıllık 10.000 TL, 5 yıl, %10 → 61.051 TL (ilk yatırım 4 yıl faiz kazanır, sonuncusu hiç kazanmaz).<\/li>\n<li>100, 150, 125 TL (ay sonları), %4 → 345,96 TL. Üç ay 150 TL → 150 × 2,7751 = 416,26 TL.<\/li>\n<li><b>Dönem başı ödemeli kredi:<\/b> 1.000.000 TL, 12 ay, yıllık %24 (aylık %2) → taksit 92.705,49 TL; toplam ödeme 1.112.465,88 TL; toplam faiz 112.465,88 TL.<\/li>\n<li><b>Kalan borç:<\/b> 5.000.000 TL, 60 ay, yıllık %30 (aylık %2,5), ay sonu taksit → taksit 161.767 TL; ilk taksitte faiz 5.000.000 × 0,025 = 125.000 TL, anapara 161.767 − 125.000 = 36.767 TL (kitap faizi yanlışlıkla taksit × 0,025 = 4.044 TL olarak hesaplar; faiz payı kalan borç üzerinden hesaplanır); 18 ay sonra (42 ay kala) kalan borç 4.176.922 TL.<\/li>\n<li>Dikkat: aylık ödemeli kredide yıllık oranı 12'ye böl, dönem sayısını ay olarak al. Dönem başı ödemede dönem sonu formülü (1 + r) ile çarpılır (ödemeler bir dönem öne çekilir).<\/li>\n<li>Dikkat: ilk taksitin faiz payı = kalan anapara × dönemsel faiz; anapara payı = taksit − faiz payı.<\/li>\n<\/ul>\n\n<h3>Perpetüite (sürekli ödemeler)<\/h3>\n<ul>\n<li>Teorik olarak sonsuz süre devam eden, her dönem sonunda sabit tutarlı nakit akışı sağlayan seri. Anüitede n sınırlıdır; perpetüitede n → ∞.<\/li>\n<li>Gerçeğe yakın örnekler: süresiz temettü ödeyeceği düşünülen halka açık şirket hissesi; el değiştirmesi planlanmayan, uzun süre sabit kira getiren işyeri; süresiz kupon taahhüdü içeren teorik sürekli tahvil (<b>consol bond<\/b>).<\/li>\n<li>Örnek: yıllık net kira 80.000 TL, talep edilen getiri %40 → 80.000 / 0,40 = 200.000 TL (ödenebilecek en yüksek tutar).<\/li>\n<li><b>Büyüyen perpetüite:<\/b> nakit akışı her dönem sabit g oranında artar (A, A(1+g), A(1+g)<sup>2<\/sup>, …). Kira ve temettüler genellikle arttığı için düz perpetüite yanıltıcı olabilir.<\/li>\n<li>Örnek: önümüzdeki yıl kira 200.000 TL, TÜFE'ye bağlı artış %8, iskonto %18 → 200.000 / 0,10 = 2.000.000 TL.<\/li>\n<li>Örnek (XYZ Holding): D<sub>0<\/sub> = 5 TL, g = %9, r = %18 → D<sub>1<\/sub> = 5,45 TL; P<sub>0<\/sub> = 5,45 / 0,09 = 60,56 TL. Piyasa fiyatı 110 TL → hisse <b>aşırı değerli<\/b>. g %6'ya düşerse D<sub>1<\/sub> = 5,30 TL, P<sub>0<\/sub> = 5,30 / 0,12 = 44,17 TL.<\/li>\n<li>Dikkat: payda bir sonraki dönemin (1. yıl sonu) nakit akışı yazılır; geçen yıl ödenen D<sub>0<\/sub> verilmişse önce (1 + g) ile büyütülür.<\/li>\n<li>Dikkat: r ≤ g ise formül kullanılamaz (bugünkü değer sonsuza gider). Büyüme oranındaki küçük bir düşüş bile değeri sert düşürür.<\/li>\n<\/ul>\n", "sorular": [{"q": "80.000 TL, yıllık %15 faizle 3 yıl değerlendirilecektir. Bileşik faizin basit faize göre yarattığı ek getiri (faizin faizi) kaç TL'dir?", "o": ["5.670 TL", "121.670 TL", "36.000 TL", "41.670 TL", "12.000 TL"], "a": 0, "e": "Basit: 80.000 × (1 + 0,15 × 3) = 116.000 TL. Bileşik: 80.000 × 1,15³ = 121.670 TL. Fark 5.670 TL bileşik etkidir."}, {"q": "A Bankası yıllık %18 nominal faizi çeyreklik, B Bankası yıllık %17,6 nominal faizi aylık bileşikleme ile sunmaktadır. Hangisi doğrudur?", "o": ["B Bankası daha yüksek EYO sunar (%19,09)", "A Bankası daha yüksek EYO sunar (%19,25)", "İki bankanın EYO'su eşittir", "A Bankası daha düşük EYO sunar (%18,00)", "B Bankası daha yüksek EYO sunar (%17,60)"], "a": 1, "e": "EYO A = (1 + 0,18/4)⁴ − 1 = %19,25; EYO B = (1 + 0,176/12)¹² − 1 = %19,09. Karşılaştırma nominal oranla değil EYO ile yapılır."}, {"q": "Efektif yıllık faiz oranı %25 olan bir mevduata eşdeğer sürekli bileşik faiz oranı yaklaşık kaçtır?", "o": ["%25,00", "%28,40", "%22,31", "%22,52", "%20,00"], "a": 2, "e": "e^r − 1 = 0,25 → r = ln(1,25) = %22,31. e^0,25 − 1 = %28,40 ise %25 sürekli oranın EYO'sudur (ters işlem)."}, {"q": "20.000 TL, yıllık %12 sürekli bileşik faizle 4 yıl yatırılırsa vade sonu değeri yaklaşık kaç TL olur?", "o": ["31.470,39 TL", "29.600 TL", "90.199,75 TL", "32.321,49 TL", "32.244,52 TL"], "a": 3, "e": "GD = 20.000 × e^(0,12 × 4) = 20.000 × e^0,48 = 32.321,49 TL. Yıllık bileşik 31.470,39 TL, aylık bileşik 32.244,52 TL verir; sürekli bileşik en yüksek sonucu verir."}, {"q": "Bir girişimcinin 6 yıl sonra 750.000 TL'ye ihtiyacı vardır. Yıllık %16 bileşik getiri sağlayan bir hesaba bugün tek seferde yatırması gereken tutar yaklaşık kaç TL'dir?", "o": ["357.084,76 TL", "382.653,06 TL", "263.473,52 TL", "646.551,72 TL", "307.831,69 TL"], "a": 4, "e": "BD = 750.000 / 1,16⁶ = 750.000 / 2,4364 = 307.831,69 TL. 5 dönemle iskontolamak (dönem sayısı hatası) ya da basit iskonto yanlıştır."}, {"q": "Bir yatırımcı 1., 2. ve 3. yıl sonlarında sırasıyla 4.000 TL, 6.000 TL ve 8.000 TL'yi yıllık %12 faizli hesaba yatıracaktır. 3. yıl sonunda hesapta kaç TL birikir?", "o": ["19.737,60 TL", "18.000 TL", "22.106,11 TL", "20.160 TL", "23.245,82 TL"], "a": 0, "e": "NAGD₃ = 4.000 × 1,12² + 6.000 × 1,12 + 8.000 = 5.017,60 + 6.720 + 8.000 = 19.737,60 TL. Son ödeme faiz kazanmaz; ilk ödeme 2 yıl faiz kazanır."}, {"q": "Her yıl sonunda 15.000 TL, yıllık %10 bileşik faizli hesaba 8 yıl boyunca yatırılırsa 8. yıl sonunda birikim yaklaşık kaç TL olur?", "o": ["120.000 TL", "171.538,32 TL", "188.692,15 TL", "32.153,83 TL", "80.023,89 TL"], "a": 1, "e": "AGD = 15.000 × [(1,10⁸ − 1) / 0,10] = 15.000 × 11,4359 = 171.538,32 TL. 1,10 ile çarpmak dönem başı ödeme varsayımına aittir."}, {"q": "Önümüzdeki 6 yıl boyunca her yıl sonunda 60.000 TL ödeme yapacak bir finansal ürün için gerekli getiri %18'dir. Bu ürün için bugün ödenebilecek en yüksek fiyat yaklaşık kaç TL'dir?", "o": ["360.000 TL", "247.630,26 TL", "209.856,15 TL", "133.355,35 TL", "333.333,33 TL"], "a": 2, "e": "BD = 60.000 × [1 − 1/1,18⁶] / 0,18 = 60.000 × 3,4976 = 209.856,15 TL. 60.000/0,18 sonsuz süreli (perpetüite) değer olurdu."}, {"q": "Bir şirket 5 yıl boyunca her yılın başında 80.000 TL kira ödeyecektir. Piyasa faizi yıllık %12 ise kira yükümlülüğünün bugünkü değeri yaklaşık kaç TL'dir?", "o": ["288.382,10 TL", "400.000 TL", "257.484,01 TL", "322.987,95 TL", "508.227,79 TL"], "a": 3, "e": "Dönem sonu BD = 80.000 × 3,6048 = 288.382,10 TL; ödemeler dönem başında olduğundan × 1,12 → 322.987,95 TL."}, {"q": "2.400.000 TL tutarındaki kredi, yıllık %36 faizle 36 ay boyunca her ay sonunda eşit taksitle ödenecektir. Aylık taksit yaklaşık kaç TL'dir?", "o": ["66.666,67 TL", "119.510,45 TL", "106.727,29 TL", "167.697,07 TL", "109.929,11 TL"], "a": 4, "e": "Aylık oran %36/12 = %3; A = 2.400.000 × 0,03 / [1 − 1,03⁻³⁶] = 109.929,11 TL. Dönem başı ödeme olsaydı taksit 106.727,29 TL olurdu."}, {"q": "Bir önceki krediye ait aylık taksit 109.929,11 TL ise ilk taksitin içindeki anapara payı yaklaşık kaç TL'dir?", "o": ["37.929,11 TL", "72.000 TL", "109.929,11 TL", "66.666,67 TL", "3.297,87 TL"], "a": 0, "e": "İlk ay faizi = 2.400.000 × 0,03 = 72.000 TL; anapara payı = 109.929,11 TL − 72.000 TL = 37.929,11 TL."}, {"q": "Aynı kredide (taksit 109.929,11 TL, aylık %3, 36 ay) 12. taksit ödendikten sonra kalan borç yaklaşık kaç TL'dir?", "o": ["1.600.000 TL", "1.861.709,01 TL", "2.638.298,55 TL", "1.094.234,76 TL", "1.080.850,73 TL"], "a": 1, "e": "Kalan borç, kalan 24 taksitin bugünkü değeridir: B = A × [1 − 1,03^(12 − 36)] / 0,03 = 1.861.709,01 TL. Taksitlerin bir kısmı faiz olduğundan 2.400.000 − 12 × A yanlıştır."}, {"q": "600.000 TL borç, yıllık %36 faizle 12 ay boyunca her ayın başında eşit taksitle ödenecektir. Toplam faiz ödemesi yaklaşık kaç TL'dir?", "o": ["216.000 TL", "123.327,02 TL", "102.259,24 TL", "255.456,53 TL", "702.259,24 TL"], "a": 2, "e": "Dönem başı taksit A = 600.000 / (9,9540 × 1,03) = 58.521,60 TL; toplam ödeme 702.259,24 TL; faiz = 102.259,24 TL."}, {"q": "Teorik olarak sonsuza kadar her yıl sonunda 36 TL sabit kâr payı ödeyecek bir imtiyazlı hisse için yatırımcıların beklediği getiri %24'tür. Hissenin bugünkü teorik değeri kaç TL'dir?", "o": ["864,00 TL", "44,64 TL", "120,00 TL", "150,00 TL", "186,00 TL"], "a": 3, "e": "Perpetüite: BD = A / r = 36 / 0,24 = 150 TL. 36 × 24 ya da 36 × 1,24 gibi işlemler formülle ilgisizdir."}, {"q": "Bir ticari gayrimenkulün gelecek yıl 450.000 TL net kira getirmesi ve kiranın her yıl sonsuza kadar %7 artması beklenmektedir. İskonto oranı %22'dir. Kira artış beklentisi %4'e düşerse gayrimenkulün değeri kaç TL azalır?", "o": ["3.000.000 TL", "2.500.000 TL", "245.455 TL", "13.500 TL", "500.000 TL"], "a": 4, "e": "g = %7: 450.000 / 0,15 = 3.000.000 TL; g = %4: 450.000 / 0,18 = 2.500.000 TL; azalış 500.000 TL."}, {"q": "Geçen yıl hisse başına 8 TL temettü ödeyen bir şirketin temettüsünün her yıl %10 büyümesi beklenmektedir. Gerekli getiri %20 ise büyüyen perpetüite yaklaşımıyla hissenin bugünkü değeri kaç TL'dir?", "o": ["88 TL", "80,00 TL", "44,00 TL", "40,00 TL", "29,33 TL"], "a": 0, "e": "D₁ = 8 × 1,10 = 8,80 TL; P₀ = 8,80 / (0,20 − 0,10) = 88 TL. D₀'ı doğrudan payda kullanmak (80 TL) tipik hatadır."}, {"q": "Büyüyen perpetüite yaklaşımıyla teorik değeri 60 TL bulunan bir hisse borsada 85 TL'den işlem görmektedir. Diğer her şey sabitken hangisi doğrudur?", "o": ["Hisse düşük değerlenmiştir (ucuzdur)", "Hisse aşırı değerlenmiştir (pahalıdır)", "Hisse adil fiyatlanmıştır", "Büyüme oranı gerekli getiriden büyüktür", "Gerekli getiri artarsa teorik değer de artar"], "a": 1, "e": "Piyasa fiyatı, nakit akışlarından hesaplanan teorik değerin üzerinde olduğu için hisse aşırı değerlidir. Gerekli getiri artarsa payda büyür, değer düşer."}, {"q": "Gerekli getiri oranının karşılaması gereken unsurlar arasında aşağıdakilerden hangisi yer almaz?", "o": ["Fonlardan vazgeçilen zaman", "Paranın satın alma gücündeki değişim", "Yatırılan anaparanın büyüklüğü", "Gelecekteki ödemelere ilişkin belirsizlik", "Tüketimin ertelenmesinin bedeli"], "a": 2, "e": "Gerekli getiri; vazgeçilen zamanı, satın alma gücündeki değişimi ve belirsizliği karşılar (tüketimi ertelemenin ödülü). Anaparanın büyüklüğü bir unsur değildir."}, {"q": "Efektif yıllık faiz oranına ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Bankalar faizi geleneksel olarak yıllık basit oran olarak duyurur", "Farklı bileşikleme sıklıkları karşılaştırılırken EYO kullanılmalıdır", "Sürekli bileşikte EYO = e^r − 1 formülüyle bulunur", "Yıllık %12 nominal faizde aylık bileşiklemenin EYO'su çeyreklik bileşiklemeninkinden düşüktür", "Daha sık bileşikleme kredi kullananın gerçek maliyetini artırır"], "a": 3, "e": "Aynı nominal oranda bileşikleme sıklığı arttıkça EYO artar: aylık %12,68 > çeyreklik %12,55."}, {"q": "Bir nakit akışı serisinin anüite sayılması için aşağıdakilerden hangisi gerekli değildir?", "o": ["Dönemsel aralıkların eşit olması", "Tutarların aynı olması", "Nakit akışlarının aynı yönde olması", "Serinin birden fazla nakit akışından oluşması", "İlk ödemenin bugün yapılması"], "a": 4, "e": "Anüite; aralıkları eşit, aynı tutarlı ve aynı yönlü nakit akışlarıdır. Ödemeler dönem sonunda da başında da olabilir; dönem başı ödemede formül (1 + r) ile çarpılır."}, {"q": "Aşağıdakilerden hangisi kitapta perpetüite yaklaşımına yakın nakit akışı örnekleri arasında sayılmaz?", "o": ["Beş yıl vadeli, eşit taksitli konut kredisi", "Süresiz temettü ödeyeceği düşünülen halka açık şirket hissesi", "Uzun süre sabit kira getiren ve satılması planlanmayan işyeri", "Süresiz kupon taahhüdü içeren teorik sürekli tahvil", "Consol tahvil"], "a": 0, "e": "Perpetüitede dönem sayısı sonsuzdur. Beş yıl vadeli taksitli kredi dönem sayısı sınırlı bir anüitedir."}]}, {"id": 2, "kisa": "Getiri ve Risk", "baslik": "Getiri ve Risk", "ozet": "Elde tutma, aritmetik, geometrik, para ve zaman ağırlıklı getiri; yıllıklandırma, reel ve kaldıraçlı getiri; varyans, semivaryans, portföy riski ve risk primi.", "notlar": "\n<h3>Giriş<\/h3>\n<ul>\n<li>Fiziksel varlıklar pek çok özelliğe göre seçilirken finansal varlıklar yalnızca iki özelliğe göre değerlendirilir: <b>getiri ve risk<\/b>.<\/li>\n<li>Ortalama ve varyans kullanmak, getirilerin <b>normal dağıldığı<\/b> varsayımına dayanır (normal dağılım ortalaması ve varyansıyla tamamen tanımlanır).<\/li>\n<li>Finansal varlıklardan iki tür gelir elde edilir: (1) nakit temettü, faiz gibi <b>dönemsel gelir<\/b> (her varlıkta olmayabilir), (2) fiyat artışı/azalışı olan <b>sermaye kazancı/kaybı<\/b>.<\/li>\n<\/ul>\n\n<h3>Elde tutma getirisi<\/h3>\n<ul>\n<li>Tek bir dönem için hesaplanan getiridir ve hesaplamanın tek bir yolu vardır; çok dönemli getiri farklı yollarla hesaplanabilir. Elde tutma dönemi bir gün, bir hafta, bir yıl vb. olabilir.<\/li>\n<li>R = Sermaye kazancı + Kâr payı verimi = (P<sub>t<\/sub> − P<sub>t−1<\/sub>) / P<sub>t−1<\/sub> + D<sub>t<\/sub> / P<sub>t−1<\/sub> = (P<sub>t<\/sub> − P<sub>t−1<\/sub> + D<sub>t<\/sub>) / P<sub>t−1<\/sub><\/li>\n<li>Örnek: 100 TL'ye alınan hisse 110 TL olmuş, 4 TL kâr payı ödenmiş → getiri %14 (%10 sermaye kazancı + %4 kâr payı verimi).<\/li>\n<li>Kâr payının t zamanında ödendiği varsayılır; daha önce ödenirse yatırımcı onu t'ye kadar değerlendirebileceği için getiri daha yüksek olur.<\/li>\n<li>Çok dönem bileşik getiri: R = (1 + R<sub>1<\/sub>) × (1 + R<sub>2<\/sub>) × … × (1 + R<sub>n<\/sub>) − 1. Örnek: %11, %8, −%2 → 1,11 × 1,08 × 0,98 − 1 = %17,48.<\/li>\n<\/ul>\n\n<h3>Aritmetik ve geometrik ortalama getiri<\/h3>\n<table>\n<tr><th><\/th><th>Aritmetik<\/th><th>Geometrik<\/th><\/tr>\n<tr><td>Formül<\/td><td>R̄ = (R<sub>1<\/sub> + … + R<sub>T<\/sub>) / T<\/td><td>R̄<sub>G<\/sub> = [(1 + R<sub>1<\/sub>) × … × (1 + R<sub>T<\/sub>)]<sup>1/T<\/sup> − 1<\/td><\/tr>\n<tr><td>Mantık<\/td><td>Her dönem başında yatırılan para aynı (basit faiz gibi)<\/td><td>Kazançlar yeniden yatırılır (bileşik faiz gibi); zaman ağırlıklı<\/td><\/tr>\n<tr><td>Uygun kullanım<\/td><td>Tek dönem tahmini (gelecek yılın beklenen getirisi), kısa veri setleri<\/td><td>Çok dönem performansını özetleme, uzun veri setleri<\/td><\/tr>\n<\/table>\n<ul>\n<li>Örnek: −%45, %32, %28 → aritmetik %5; geometrik −%2,4. 100 TL üç yıl sonra gerçekte 92,9 TL olur; bu değere geometrik ortalama ulaşır (aritmetik %5'e göre 115,8 TL çıkar).<\/li>\n<li>Hisse X: −20, −10, 25 → aritmetik −%1,67, geometrik −%3,45. Hisse Y: 10, 5, −2 → %4,33 ve %4,25. Hisse Z: 5, 5, 5 → ikisi de %5.<\/li>\n<li><b>Aritmetik ortalama her zaman geometrik ortalamadan büyük ya da ona eşittir<\/b>; eşitlik yalnızca tüm dönem getirileri aynıysa geçerlidir.<\/li>\n<li>Fark, getirilerin değişkenliğiyle (volatilite) artar; işaretler farklılaştıkça ve değerler birbirinden uzaklaştıkça aritmetik ortalama yanıltıcı olur. Fark özellikle olumsuz piyasa koşullarında belirginleşir; aritmetik ortalama uç değerlere daha duyarlıdır.<\/li>\n<li>Yaklaşık ilişki: r<sub>g<\/sub> ≈ r<sub>A<\/sub> − σ<sup>2<\/sup>/2 (kitapta ayrıca r<sub>g<\/sub> = ln(1 + r<sub>A<\/sub>) yazılır; bu ifade aslında basit getiriyi sürekli bileşik (logaritmik) getiriye çevirir, geometrik ortalama için kesin bir eşitlik değildir).<\/li>\n<\/ul>\n\n<h3>Para ağırlıklı getiri (iç verim oranı)<\/h3>\n<ul>\n<li>Aritmetik ve geometrik ortalama paranın bir kez, dönem başında yatırıldığını varsayar. Dönem içinde para eklenir/çekilirse <b>para ağırlıklı getiri (İVO)<\/b> kullanılır.<\/li>\n<li>Σ NA<sub>t<\/sub> / (1 + İVO)<sup>t<\/sup> = 0. Yatırılan paralar <b>nakit çıkışı (−)<\/b>, çekilen paralar ve dönem sonu bakiye <b>nakit girişi (+)<\/b> yazılır.<\/li>\n<li>Örnek: 20 TL yatırılmış (getiri −%45), 2. yıl başı 80 TL eklenmiş (getiri %32), yıl sonu 30 TL çekilmiş, 3. yıl getiri %28 → dönem sonu 115,3 TL; −20, −80, +30, +115,3 akışlarından İVO = %20,6. Yüksekliğin nedeni: büyük kaybın yaşandığı ilk yıl yatırılan tutarın düşük olması.<\/li>\n<li>Dezavantaj: her yatırımcı farklı zaman ve tutarda yatırım yaptığı için yatırımlar ve yatırımcılar arası karşılaştırmaya imkân vermez.<\/li>\n<\/ul>\n\n<h3>Zaman ağırlıklı getiri<\/h3>\n<ul>\n<li>Nakit giriş-çıkış zamanlamasını portföy yöneticisi kontrol edemediği için performans ölçümünde para ağırlıklı getiri tercih edilmez; fon yöneticilerini objektif karşılaştırmanın temel ölçüsü <b>zaman ağırlıklı getiridir<\/b>.<\/li>\n<li>Üç adım: (i) önemli nakit giriş/çıkışı olan her tarih ölçüm dönemini alt dönemlere böler (hemen öncesinde piyasa değeri hesaplanır); (ii) her alt dönem için ETSG = (dönem sonu değer − dönem başında yatırılan tutar) / dönem başında yatırılan tutar; (iii) alt dönem getirileri çarpılarak bağlanır: R<sub>TW<\/sub> = (1 + r<sub>1<\/sub>) × … × (1 + r<sub>k<\/sub>) − 1. Süre bir yıldan uzunsa yıllık getiriler geometrik ortalamayla birleştirilir.<\/li>\n<li>Örnek 2.1: AçıkYZ çeyrek getirileri %20, %5, %12, −%10 → R<sub>TW<\/sub> ≈ %27,01; DerinYZ %10, %2, %8, %4 → ≈ %26,02.<\/li>\n<li>Dikkat: amaç <b>fon yöneticisinin başarısı<\/b> ise zaman ağırlıklı; belirli bir yatırımcının <b>gerçekte ne kazandığı<\/b> ise para ağırlıklı getiri (İVO).<\/li>\n<\/ul>\n\n<h3>Yıllıklandırılmış getiri<\/h3>\n<ul>\n<li>Farklı vadeli getiriler ancak aynı bazda (yıllık) karşılaştırılabilir: r<sub>yıllık<\/sub> = (1 + r<sub>dönem<\/sub>)<sup>c<\/sup> − 1, c = yıl içindeki dönem sayısı.<\/li>\n<li>Aylık getiri 12, haftalık 52, günlük 365 kez bileşiklenir (soruda 360 gün denirse 360). Bir yıldan uzun dönemde c &lt; 1 olur (18 ay → c = 12/18).<\/li>\n<li>Örnekler: aylık %1,2 → %15,39; 20 günlük %0,8 → (1,008)<sup>365/20<\/sup> − 1 = %15,65; 18 aylık %21 → %13,55.<\/li>\n<li>Örnek 2.2 (360 gün): 90 günlük bono %3,25 → %13,65; günlük %0,04 → %15,49 (en yüksek); 21 aylık tahvil %24 → %13,08; aylık %0,95 → %12,01.<\/li>\n<li>Günlükten haftalığa (iş günü): c = 5; yıllıktan haftalığa: (1 + r<sub>yıllık<\/sub>)<sup>1/52<\/sup> − 1.<\/li>\n<\/ul>\n\n<h3>Beklenen getiri ve portföy getirisi<\/h3>\n<ul>\n<li><b>Beklenen getiri:<\/b> olası getirilerin olasılık ağırlıklı ortalaması: E(r) = Σ p<sub>i<\/sub> × r<sub>i<\/sub>. Örnek 2.3: olasılıklar %50, %30, %20; getiriler %15, %9, −%5 → E(r) = %9,2 (kitap tablosunda sütun başlıkları yer değiştirmiş görünüyor; çözüm bu şekilde).<\/li>\n<li><b>Portföy getirisi:<\/b> R<sub>p<\/sub> = Σ w<sub>i<\/sub> × R<sub>i<\/sub>, Σ w<sub>i<\/sub> = 1. Getiriler tek dönemlik, dönem içinde nakit akışı yok ve ağırlıklar sabit kabul edilir. Örnek: %30 Tüpraş (%1,80) + %70 Hazine bonosu (%0,82) → %1,11.<\/li>\n<\/ul>\n\n<h3>Getiriyi etkileyen diğer faktörler<\/h3>\n<table>\n<tr><th>Kavram<\/th><th>Formül / tanım<\/th><\/tr>\n<tr><td>Vergi sonrası getiri<\/td><td>r<sub>vs<\/sub> = r<sub>vö<\/sub> × (1 − t)<\/td><\/tr>\n<tr><td>Nominal getiri<\/td><td>(1 + r<sub>nominal<\/sub>) = (1 + r<sub>f<\/sub>) × (1 + π) × (1 + RP); r<sub>f<\/sub> reel risksiz faiz, π enflasyon, RP risk primi<\/td><\/tr>\n<tr><td>Reel getiri<\/td><td>(1 + r<sub>reel<\/sub>) = (1 + r<sub>nominal<\/sub>) / (1 + π) = (1 + r<sub>f<\/sub>) × (1 + RP)<\/td><\/tr>\n<tr><td>Kaldıraçlı (borçlu) getiri<\/td><td>E(r) = r + (B/Ö) × (r − r<sub>borç<\/sub>) = (1 + B/Ö) × r − (B/Ö) × r<sub>borç<\/sub><\/td><\/tr>\n<\/table>\n<ul>\n<li>Faiz geliri birçok ülkede normal gelir gibi vergilendirilir; kâr payı bazı ülkelerde düşük oranla ya da yatırımcı türüne göre hiç vergilendirilmez.<\/li>\n<li>Reel getiri; dönemler arası ve ülkeler arası karşılaştırma için gereklidir. Yatırım kararı için güvenilir kriter <b>vergi sonrası reel getiridir<\/b> (vergi oranları yatırımcıya ve menkul kıymete göre değişir).<\/li>\n<li><b>Brüt getiri:<\/b> komisyon, yönetim ve idari giderler düşülmeden önceki getiri; <b>net getiri:<\/b> bu giderler düşüldükten sonra kalan getiri.<\/li>\n<li>Gider türleri: <b>alım/satım komisyonları<\/b> (aracı ve düzenleyici kurum komisyonları, vergi, resim, harç), <b>portföy yönetim giderleri<\/b> (portföy yönetim şirketine ödenen), <b>idari giderler<\/b> (yasal giderler, saklama, denetim, performans ölçümü).<\/li>\n<li>Tablo 2.3 (bir emeklilik fonu, 2013): toplam gider oranı %2,035461; en büyük kalem fon işletim gideri kesintisi %1,733890.<\/li>\n<li>Örnek 2.4: brüt fiyat 1,30 → 1,68 TL: brüt getiri %29,23; yönetim ücreti %0,95 → net %28,95 (kitapta brüt getiri × (1 − %0,95) olarak hesaplanmış); vergi %10 → %26,06; enflasyon %9,15 → vergi sonrası reel getiri %15,49.<\/li>\n<li>Kaldıraç iki yolla: vadeli işlem sözleşmesi (değerin küçük bir yüzdesi yatırılır) ya da borçlanma. Fonun yarısı borçla sağlanırsa varlığın getirisi iki katına çıkar; borç faizi unutulmamalıdır.<\/li>\n<li>Örnek 2.5: beklenen getiri %15, özkaynağın %50'si kadar borç, faiz %10 → 0,15 + 0,50 × (0,15 − 0,10) = %17,5 (= 1,50 × 0,15 − 0,50 × 0,10). Vergi sonrası %10 hedef, vergi %20 → vergi öncesi %12,5; varlık getirisi %12, borç faizi %6 → borç oranı w = 0,083.<\/li>\n<\/ul>\n\n<h3>Risk ve belirsizlik<\/h3>\n<ul>\n<li>Risk, beklenenden farklı sonuçların ortaya çıkma ihtimalidir (Latince kökeni şans/tesadüf; iyi ve kötü anlamda).<\/li>\n<li><b>Risk:<\/b> olasılık dağılımı <b>objektif<\/b> olarak belirlenebilir. <b>Belirsizlik:<\/b> <b>subjektif<\/b> olasılık; kişi olasılık dağılımı hakkında bilgiye sahip değildir. Belirsizlik, matematiksel/istatistiksel yöntemlerle riske dönüştürülebilir.<\/li>\n<li>En yaygın risk ölçüsü <b>varyans<\/b> ve onun karekökü <b>standart sapmadır<\/b>.<\/li>\n<\/ul>\n\n<h4>Risk formülleri<\/h4>\n<table>\n<tr><th>Ölçü<\/th><th>Formül<\/th><\/tr>\n<tr><td>Anakütle varyansı<\/td><td>σ<sup>2<\/sup> = Σ (R<sub>t<\/sub> − μ)<sup>2<\/sup> / T<\/td><\/tr>\n<tr><td>Örneklem varyansı<\/td><td>s<sup>2<\/sup> = Σ (R<sub>t<\/sub> − R̄)<sup>2<\/sup> / (T − 1)<\/td><\/tr>\n<tr><td>Standart sapma<\/td><td>σ = √σ<sup>2<\/sup>; s = √s<sup>2<\/sup><\/td><\/tr>\n<tr><td>Kesikli dağılımda standart sapma<\/td><td>σ = √[Σ p<sub>i<\/sub> × (r<sub>i<\/sub> − μ)<sup>2<\/sup>]<\/td><\/tr>\n<tr><td>Semivaryans / aşağı yönlü sapma<\/td><td>SV = Σ<sub>R<sub>i<\/sub> ≤ H<\/sub> (R<sub>i<\/sub> − H)<sup>2<\/sup> / T; aşağı yönlü sapma = √SV<\/td><\/tr>\n<tr><td>Kovaryans<\/td><td>Cov(R<sub>i<\/sub>, R<sub>j<\/sub>) = Σ (R<sub>i<\/sub> − R̄<sub>i<\/sub>)(R<sub>j<\/sub> − R̄<sub>j<\/sub>) / (N − 1)<\/td><\/tr>\n<tr><td>Korelasyon<\/td><td>ρ<sub>i,j<\/sub> = Cov(R<sub>i<\/sub>, R<sub>j<\/sub>) / (σ<sub>i<\/sub> × σ<sub>j<\/sub>)<\/td><\/tr>\n<tr><td>İki varlıklı portföy varyansı<\/td><td>σ<sub>p<\/sub><sup>2<\/sup> = w<sub>1<\/sub><sup>2<\/sup>σ<sub>1<\/sub><sup>2<\/sup> + w<sub>2<\/sub><sup>2<\/sup>σ<sub>2<\/sub><sup>2<\/sup> + 2w<sub>1<\/sub>w<sub>2<\/sub>ρ<sub>1,2<\/sub>σ<sub>1<\/sub>σ<sub>2<\/sub><\/td><\/tr>\n<tr><td>N varlıklı portföy varyansı<\/td><td>σ<sub>p<\/sub><sup>2<\/sup> = Σ<sub>i<\/sub> Σ<sub>j<\/sub> w<sub>i<\/sub>w<sub>j<\/sub>Cov(R<sub>i<\/sub>, R<sub>j<\/sub>)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: örneklemde paydaya <b>T − 1<\/b> yazılır (serbestlik derecesi; örneklem ortalaması hesaplandığı için bir bilgi noktası kaybedilir; yansız tahmin için).<\/li>\n<li>Örnek 2.6: aylık %3, −1, 4, 2, 0 → ortalama %1,6; kareli sapmalar toplamı 17,2; s<sup>2<\/sup> = 17,2/4 = 4,3; s = %2,07.<\/li>\n<li><b>Semivaryans:<\/b> standart sapma yukarı ve aşağı sapmaları simetrik ölçer; oysa yatırımcıyı asıl \"kötü sürprizler\" ilgilendirir. Ortalama yerine çoğu zaman yatırımcının belirlediği <b>hedef getiri (H)<\/b> esas alınır; yalnız H'nin altındaki (R ≤ H) gözlemler hesaba girer, payda toplam gözlem sayısı T'dir.<\/li>\n<li>Örnek 2.7: %3, −1, 4, 2, 0 ve H = %1 → yalnız −1 ve 0 girer: (4 + 1)/5 = 1 → aşağı yönlü sapma %1 (kitap formülü SV adıyla karekök içinde verir).<\/li>\n<li>Örnek 2.8: A hissesi aylık ortalama %1,1, σ<sup>2<\/sup> = 0,000332, σ ≈ %1,82. Örnek 2.9: B hissesi %2,4 ve σ %3,1, ρ = −0,87, %60 A + %40 B → R<sub>p<\/sub> = %1,6, σ<sub>p<\/sub> ≈ %0,61: getiri arttı, risk A'nın riskinin altına indi (<b>çeşitlendirme etkisi<\/b>).<\/li>\n<li>Örnek 2.10: olasılık 0,60 → %10, 0,40 → %5: E(r) = %8, σ = 0,0245.<\/li>\n<li>Kovaryansın büyüklüğü yorumlanamaz, yalnız yönü (pozitif/negatif) bilgi verir; bu yüzden korelasyon katsayısı kullanılır.<\/li>\n<li>Portföy getirisi ağırlıklı ortalamadır; portföy riski ise ağırlıklı ortalama değildir, varlıkların birlikte hareketine (kovaryans) bağlıdır.<\/li>\n<\/ul>\n\n<h4>Korelasyonun sınırları ve dinamik yapısı<\/h4>\n<ul>\n<li><b>Doğrusal olmayan ilişkiler:<\/b> Pearson korelasyonu yalnızca doğrusal ilişkiyi ölçer (ör. borç oranı ile firma değeri arasındaki güçlü ama doğrusal olmayan ilişki).<\/li>\n<li><b>Uç gözlemlere hassasiyet:<\/b> aykırı gözlemler korelasyonu bozar; bilinçli yargıyla <b>trimming<\/b> (uç gözlemleri atmak) ya da <b>winsorizing<\/b> (makul seviyeye çekmek) uygulanabilir.<\/li>\n<li><b>Yanıltıcı (spurious) korelasyon:<\/b> korelasyon nedensellik değildir. Korelasyon kullanırken ekonomik anlamlılık sorgulanmalı, farklı dönem/veri setlerinde test edilmeli, grafik ve ek istatistiklerle desteklenmelidir.<\/li>\n<li><b>Statik<\/b> korelasyon belirli dönemdeki ortalama ilişkiyi, <b>dinamik<\/b> korelasyon zaman içindeki değişimi ölçer. Korelasyon seviyesi ve oynaklığı <b>kriz dönemlerinde yükselir<\/b>, sakin dönemlerde düşük ve durağandır; korelasyon uzun dönem ortalamasına dönme eğilimindedir.<\/li>\n<li>Kaldıraçlı portföy riski (Örnek 2.11): E(r) %15, σ %20, özkaynağın %30'u kadar risksiz faizden (%10) borç → E(r) = 1,30 × 0,15 − 0,30 × 0,10 = %16,5; σ = 1,3 × 0,20 = %26 (risksiz varlığın σ'sı ve korelasyonu sıfır).<\/li>\n<\/ul>\n\n<h3>Risk-getiri dengelemesi<\/h3>\n<ul>\n<li>Beklenen risk ile getiri arasında <b>pozitif ilişki<\/b> vardır; etkin piyasada yüksek risk almadan yüksek getiri elde edilemez. Fazladan alınan risk karşılığı ek getiriye <b>risk primi<\/b> denir.<\/li>\n<li>Hazine bonosunda yalnız nominal risksiz faiz (reel risksiz faiz + beklenen enflasyon) vardır, risk primi olmadığı varsayılır.<\/li>\n<li>Devlet tahvili: kredi riski yok, vade riski var → E(r<sub>D<\/sub>) = Nominal r<sub>f<\/sub> + Vade primi.<\/li>\n<li>Kurumsal tahvil: E(r<sub>K<\/sub>) = E(r<sub>D<\/sub>) + Kredi primi + Likidite primi.<\/li>\n<li>Hisse senedi: E(r<sub>H<\/sub>) = E(r<sub>K<\/sub>) + İlave risk primi. En yüksek risk primi hisse senetlerindedir. Toplam risk primi = vade + kredi + likidite + ilave risk primi.<\/li>\n<li>Örnek 2.13: enflasyon %6, reel HB %4, 2 yıllık devlet tahvili %12,5, kurumsal %14, hisse %18 → nominal r<sub>f<\/sub> %10; vade primi %2,5; kredi + likidite %1,5; ilave risk primi %4.<\/li>\n<li>Örnek 2.12: E(r) %20, σ %25 olan riskli portföye %25 oranında %12 getirili risksiz varlık eklenirse E(r) = 0,75 × 0,20 + 0,25 × 0,12 = %18; σ = 0,75 × 0,25 = %18,75.<\/li>\n<\/ul>\n\n<h3>Yatırım araçlarının diğer özellikleri<\/h3>\n<ul>\n<li>Ortalama-varyans yaklaşımının iki varsayımı: getirilerin normal dağılması ve piyasaların bilgi ile operasyon açısından etkin olması.<\/li>\n<li>Normal dağılımın üç özelliği: ortalama = medyan; ortalama ve varyansla tamamen tanımlanır; ortalama etrafında simetriktir. Gerçekte getiriler normal dağılmaz.<\/li>\n<li><b>Çarpıklık:<\/b> getirilerin çoğu <b>sağ tarafta<\/b> toplanıyorsa <b>sola çarpık<\/b>, çoğu <b>sol tarafta<\/b> toplanıyorsa <b>sağa çarpık<\/b>.<\/li>\n<li><b>Basıklık (şişkin kuyruk):<\/b> olağandışı olayların olasılığı normal dağılımın varsaydığından yüksektir; uç getiriler riski artırır. Etkisi <b>riske maruz değer (VaR)<\/b> gibi tekniklerle değerlendirilir.<\/li>\n<li>Operasyonel etkinliği bozan temel unsur <b>likiditedir<\/b>. İşlem yapmanın üç maliyeti: aracılık komisyonu, alım/satım farkı, fiyat etkisi. Komisyon pazarlığa bağlıdır ve toplam maliyette payı düşüktür; düşük likiditeli hisselerde alım/satım farkı yüksektir; küçük emirlerin likit hisselerde fiyat etkisi düşüktür. Likidite özellikle gelişmekte olan ülkeler için önemlidir.<\/li>\n<li>1950'lere kadar risk net tanımlanmamış; çeşitlendirmenin iyiliği varlık <b>sayısıyla<\/b> ölçülmüştür.<\/li>\n<li>Soru bankası notu: sola çarpık ve şişkin kuyruklu dağılımlarda yalnız standart sapmaya bakmak riski olduğundan düşük gösterir; aşağı yönlü ölçüler (VaR, semivaryans) gerekir.<\/li>\n<\/ul>\n", "sorular": [{"q": "Bir hisse 80 TL'ye alınmış, elde tutma süresinde 2 TL kâr payı ödemiş ve 90 TL'ye satılmıştır. Elde tutma getirisinin bileşenleri hangisidir?", "o": ["Sermaye kazancı %11,1, kâr payı verimi %2,2; toplam %13,3", "Sermaye kazancı %12,5, kâr payı verimi %2,5; toplam %15", "Sermaye kazancı %10, kâr payı verimi %2,5; toplam %12,5", "Sermaye kazancı %12,5, kâr payı verimi %2,2; toplam %14,7", "Sermaye kazancı %15, kâr payı verimi %2,5; toplam %17,5"], "a": 1, "e": "Sermaye kazancı (90 − 80)/80 = %12,5; kâr payı verimi 2/80 = %2,5; R = (90 − 80 + 2)/80 = %15. Payda daima dönem başı fiyattır."}, {"q": "Önceki sorudaki %15'lik getiri 60 günde elde edilmiştir. Bir yıl 360 gün kabul edilirse yıllıklandırılmış getiri yaklaşık kaçtır?", "o": ["%90,00", "%15,00", "%131,31", "%134,02", "%2,36"], "a": 2, "e": "c = 360/60 = 6; r = 1,15⁶ − 1 = %131,31. %90 basit çarpımdır; bileşik etkiyi ihmal eder."}, {"q": "Bir fonun dört yıllık getirileri sırasıyla %30, −%20, %15 ve −%5'tir. Fonun geometrik ortalama getirisi yaklaşık kaçtır?", "o": ["%5,00", "%13,62", "%3,40", "%3,24", "%0,00"], "a": 3, "e": "[1,30 × 0,80 × 1,15 × 0,95]^(1/4) − 1 = 1,1362^0,25 − 1 = %3,24. Aritmetik ortalama %5,00'dir; aritmetik daima ≥ geometrik."}, {"q": "Aritmetik ve geometrik ortalama getiriye ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Aritmetik ortalama her zaman geometrik ortalamaya eşit ya da ondan büyüktür", "Tüm dönem getirileri aynıysa iki ortalama eşittir", "Gelecek yılın beklenen getirisini tahmin etmek için aritmetik ortalama daha uygundur", "Çok dönemli performansı özetlemek için geometrik ortalama tercih edilir", "Getirilerin oynaklığı arttıkça iki ortalama arasındaki fark azalır"], "a": 4, "e": "Fark, getirilerin değişkenliğiyle artar (r_g ≈ r_A − σ²/2). Gözlemler dağıldıkça aritmetik ortalama gerçek getiriden uzaklaşır."}, {"q": "Bir yatırımcı bugün portföye 200.000 TL yatırmıştır. 1. yıl sonunda portföy değeri 240.000 TL'ye çıkmış ve yatırımcı aynı gün 100.000 TL daha eklemiştir. 2. yıl sonunda portföy 396.000 TL'dir ve tamamı çekilmiştir. Para ağırlıklı getiri (İVO) yaklaşık kaçtır?", "o": ["%17,92", "%18,22", "%18,24", "%32,00", "%20,00"], "a": 0, "e": "−200.000 − 100.000/(1 + İVO) + 396.000/(1 + İVO)² = 0 → İVO = %17,92. Zaman ağırlıklı getirinin yıllık ortalaması (%20 ve %16,47'den) %18,22 olurdu."}, {"q": "Bir fonun çeyreklik verileri şöyledir: 1. çeyrek yatırılan tutar 2.000.000 TL, dönem sonu 2.200.000 TL; 2. çeyrek yatırılan 2.500.000 TL, dönem sonu 2.375.000 TL; 3. çeyrek yatırılan 2.000.000 TL, dönem sonu 2.240.000 TL; 4. çeyrek yatırılan 2.240.000 TL, dönem sonu 2.352.000 TL. Fonun zaman ağırlıklı yıllık getirisi yaklaşık kaçtır?", "o": ["%22,00", "%22,89", "%5,50", "%17,60", "%23,88"], "a": 1, "e": "ETSG'ler %10, −%5, %12, %5. R_TW = 1,10 × 0,95 × 1,12 × 1,05 − 1 = %22,89. Alt dönem getirileri toplanmaz, çarpılarak bağlanır."}, {"q": "Bir portföy yöneticisinin başarısını, yatırımcıların fona para yatırma ve çekme zamanlamasından etkilenmeden ölçmek için hangi getiri ölçüsü kullanılmalıdır?", "o": ["Para ağırlıklı getiri (iç verim oranı)", "Aritmetik ortalama getiri", "Zaman ağırlıklı getiri", "Brüt getiri", "Kaldıraçlı getiri"], "a": 2, "e": "Nakit hareketleri yöneticinin kontrolünde olmadığı için performans ölçümünde zaman ağırlıklı getiri kullanılır; İVO yatırımcının gerçekte ne kazandığını gösterir."}, {"q": "18 aylık toplam getirisi %27 olan bir yatırımın yıllıklandırılmış getirisi yaklaşık kaçtır?", "o": ["%18,00", "%27,00", "%43,12", "%17,27", "%12,00"], "a": 3, "e": "c = 12/18; r = 1,27^(12/18) − 1 = %17,27. 27 × 12/18 = %18 basit oranlamadır."}, {"q": "Bir yıl 360 gün ve bir ay 30 gün kabul edildiğinde aşağıdaki yatırımlardan hangisi en yüksek yıllıklandırılmış getiriyi sağlar?", "o": ["45 günlük bono, dönemsel %2", "15 aylık tahvil, toplam %20", "Aylık ortalama %1,3 getirili fon", "90 günlük repo, dönemsel %4", "Günlük ortalama %0,05 getirili hisse"], "a": 4, "e": "Yıllıklandırılmış getiriler: 45 günlük bono, dönemsel %2 → %17,17; Günlük ortalama %0,05 getirili hisse → %19,72; 15 aylık tahvil, toplam %20 → %15,70; Aylık ortalama %1,3 getirili fon → %16,77; 90 günlük repo, dönemsel %4 → %16,99."}, {"q": "İyi, normal ve kötü senaryoların olasılıkları %25, %50 ve %25'tir. A hissesinin bu senaryolardaki getirileri %30, %12, −%10; B hissesininki %6, %10, %14'tür. %70 A ve %30 B'den oluşan portföyün beklenen getirisi kaçtır?", "o": ["%10,70", "%10,47", "%11,00", "%10,00", "%10,50"], "a": 0, "e": "E(A) = 0,25 × 0,30 + 0,50 × 0,12 + 0,25 × (−0,10) = %11,00; E(B) = %10,00; E(P) = 0,70 × %11,00 + 0,30 × %10,00 = %10,70."}, {"q": "Reel risksiz faiz oranı %3, beklenen enflasyon %15 ve risk primi %4 ise bir varlıktan beklenen nominal getiri kaçtır?", "o": ["%22,00", "%23,19", "%18,45", "%19,60", "%7,12"], "a": 1, "e": "(1 + r_nominal) = 1,03 × 1,15 × 1,04 = 1,2319 → %23,19. Bileşenleri toplamak (%22) yaklaşık sonuç verir, kitap çarpım formülünü kullanır. 1,03 × 1,04 − 1 reel getiridir."}, {"q": "Bir fonun brüt getirisi %40'tır. Kitaptaki yöntemle yönetim ücreti (%1) brüt getiriden oransal düşülmekte, ardından %10 vergi uygulanmaktadır. Enflasyon %20 ise vergi sonrası reel getiri yaklaşık kaçtır?", "o": ["%15,64", "%16,67", "%13,03", "%35,64", "%16,33"], "a": 2, "e": "Net getiri 0,40 × 0,99 = %39,60; vergi sonrası %39,60 × 0,90 = %35,64; reel = 1,3564 / 1,20 − 1 = %13,03. Enflasyonu çıkarmak değil, bölmek gerekir."}, {"q": "Beklenen getirisi %22 olan bir yatırım, %40 özkaynak ve %60 borçla finanse edilmiştir. Borç faizi %14 ise özkaynağın beklenen getirisi kaçtır?", "o": ["%22,00", "%26,80", "%13,60", "%34,00", "%18,80"], "a": 3, "e": "B/Ö = 0,60/0,40 = 1,5. E(r) = 0,22 + 1,5 × (0,22 − 0,14) = %34,00 (= 2,5 × 0,22 − 1,5 × 0,14)."}, {"q": "Bir hissenin dört aylık getirileri %5, −%1, %3 ve %1'dir. Bu veriler bir örneklem kabul edilirse örneklem standart sapması yaklaşık kaçtır?", "o": ["%2,24", "%6,67", "%5,00", "%4,47", "%2,58"], "a": 4, "e": "Ortalama %2; kareli sapmalar 9 + 9 + 1 + 1 = 20; s² = 20/(4 − 1) = 6,67; s = 2,58. Anakütle formülü (T'ye bölme) 2,24 verir."}, {"q": "Bir fonun beş aylık getirileri %4, −%2, %6, %0 ve %1'dir. Yatırımcının hedef getirisi aylık %1 ise aşağı yönlü sapma yaklaşık kaçtır?", "o": ["%1,41", "%2,00", "%1,83", "%2,24", "%3,19"], "a": 0, "e": "Yalnız hedefin altındaki/eşit gözlemler: (−2 − 1)² = 9, (0 − 1)² = 1, (1 − 1)² = 0. SV = 10/5 = 2,00; aşağı yönlü sapma √2 = 1,41. Payda toplam gözlem sayısıdır."}, {"q": "Portföyün %70'i standart sapması %12 olan X hissesinden, %30'u standart sapması %25 olan Y hissesinden oluşmaktadır. Korelasyon −0,30 ise portföyün standart sapması yaklaşık kaçtır?", "o": ["%15,90", "%9,43", "%11,26", "%0,89", "%16,98"], "a": 1, "e": "σp² = 0,49 × 0,0144 + 0,09 × 0,0625 + 2 × 0,7 × 0,3 × (−0,30) × 0,12 × 0,25 = 0,00890; σp = %9,43. Ağırlıklı ortalama (%15,90) yalnız ρ = +1'de geçerlidir."}, {"q": "Beklenen getirisi %18, standart sapması %20 olan riskli bir portföyün %40'ı yerine %10 getirili risksiz varlık konursa yeni portföyün beklenen getirisi ve riski ne olur?", "o": ["%14,8 ve %20", "%14,0 ve %12", "%14,8 ve %12", "%16,0 ve %8", "%14,8 ve %16"], "a": 2, "e": "E(r) = 0,60 × 0,18 + 0,40 × 0,10 = %14,8; risksiz varlığın σ'sı sıfır olduğundan σ = 0,60 × 0,20 = %12."}, {"q": "Beklenen getirisi %16, standart sapması %25 olan portföye yatırım yapan biri, özkaynağının %20'si kadar tutarı %9 risksiz faizle borçlanıp aynı portföye eklemiştir. Yeni beklenen getiri ve risk nedir?", "o": ["%19,2 ve %30", "%17,4 ve %25", "%14,6 ve %20", "%17,4 ve %30", "%17,8 ve %30"], "a": 3, "e": "Riskli ağırlık 1,20, risksiz −0,20: E(r) = 1,20 × 0,16 − 0,20 × 0,09 = %17,4; σ = 1,20 × 0,25 = %30."}, {"q": "Beklenen enflasyon %8, hazine bonosu reel getirisi %2, 5 yıllık devlet tahvili %13, 5 yıllık kurumsal tahvil %15 ve hisse senedi beklenen getirisi %21 ise hisse senedine yansıyan ilave risk primi kaçtır?", "o": ["%11", "%8", "%3", "%2", "%6"], "a": 4, "e": "Nominal rf = %8 + %2 = %10; vade primi %13 − %10 = %3; kredi + likidite primi %15 − %13 = %2; ilave risk primi %21 − %15 = %6. %11 toplam risk primidir."}, {"q": "İki hissenin getirileri arasındaki kovaryans 0,006; standart sapmaları %10 ve %15'tir. Korelasyon katsayısı kaçtır?", "o": ["0,40", "0,04", "0,60", "0,0009", "0,25"], "a": 0, "e": "ρ = Cov / (σ1 × σ2) = 0,006 / (0,10 × 0,15) = 0,006 / 0,015 = 0,40."}, {"q": "Bir hissenin %70 olasılıkla %15, %30 olasılıkla %5 getiri sağlaması beklenmektedir. Beklenen getirinin standart sapması yaklaşık kaçtır?", "o": ["%0,21", "%4,58", "%5,39", "%12,00", "%10,00"], "a": 1, "e": "E(r) = 0,7 × 0,15 + 0,3 × 0,05 = %12,00; σ = √[0,7 × (0,03)² + 0,3 × (−0,07)²] = √0,0021 = %4,58."}, {"q": "Bir getiri dağılımında gözlemlerin çoğu sağ tarafta toplanmış, sol tarafta uzun bir kuyruk oluşmuştur. Bu dağılım için hangisi doğrudur?", "o": ["Sağa çarpıktır", "Simetriktir; ortalama medyana eşittir", "Sola çarpıktır", "Basıklığı sıfırdır", "Normal dağılımdır"], "a": 2, "e": "Getirilerin çoğu sağda toplanıyorsa dağılım sola çarpıktır; çoğu solda toplanıyorsa sağa çarpıktır."}, {"q": "Yatırım araçlarının diğer özelliklerine ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Aracılık komisyonu toplam işlem maliyetinin en büyük kalemidir", "Basıklık, uç değerlerin olasılığının normal dağılımdakinden düşük olmasıdır", "Normal dağılımda medyan ortalamadan büyüktür", "Düşük likiditeye sahip hisse senetlerinde alım/satım farkı yüksektir", "Likidite sorunu yalnızca gelişmiş piyasalar için önemlidir"], "a": 3, "e": "Komisyonun toplam maliyetteki payı düşüktür; basıklık (şişkin kuyruk) uç olayların olasılığının yüksek olmasıdır; normal dağılımda ortalama = medyan; likidite gelişmekte olan ülkelerde önemlidir."}, {"q": "Risk ve belirsizlik kavramları için hangisi doğrudur?", "o": ["Belirsizlikte olasılıklar objektif, riskte subjektiftir", "İki kavram arasında hiçbir fark yoktur", "Belirsizlik hiçbir yöntemle riske dönüştürülemez", "Risk yalnızca olumsuz sonuçları ifade eder", "Riskte olasılık dağılımı objektif olarak belirlenebilir; belirsizlikte subjektiftir"], "a": 4, "e": "Riskte alternatif sonuçların olasılıkları objektif belirlenir; belirsizlikte kişinin olasılık dağılımına ilişkin bilgisi yoktur. Belirsizlik istatistiksel yöntemlerle riske dönüştürülebilir."}, {"q": "Kitaptaki ampirik bulgulara göre finansal varlıklar arasındaki korelasyon kriz dönemlerinde nasıl davranır?", "o": ["Seviyesi ve oynaklığı yükselir", "Sıfıra iner", "Düşer ve durağanlaşır", "Değişmez", "Kalıcı olarak negatife döner"], "a": 0, "e": "Krizde makro şoklar tüm varlıkları aynı yöne sürükler; korelasyon yükselir. Sakin dönemlerde düşük ve durağandır; uzun dönem ortalamasına dönme eğilimi gösterir."}]}, {"id": 3, "kisa": "Portföy Teorisi", "baslik": "Portföy Teorisi", "ozet": "Fayda fonksiyonu ve kayıtsızlık eğrileri, Markowitz ortalama-varyans modeli, etkin sınır, minimum varyans portföyü ve Tobin'in portföy seçimi teoremi.", "notlar": "\n<h3>Fayda teorisi<\/h3>\n<ul>\n<li>Finansta asıl incelenen, yatırımcının en iyi kararı nasıl alacağıdır; fiyatlar veri alınır ve fayda, beklenen getiri gibi objektif fonksiyonlar en yükseğe çıkarılmaya çalışılır. \"Beklenen fayda\" risk ve riske karşı tutumdan bağımsız incelenemez.<\/li>\n<li><b>Fayda:<\/b> bir nesneye sahip olmanın kişide yarattığı tatmin düzeyi. Görecelidir; servetteki artıştan doğan fayda, sahip olunan servet miktarıyla <b>ters orantılıdır<\/b> (fakirin aynı getiriden sağladığı fayda daha fazladır).<\/li>\n<li>Fayda fonksiyonunun üç temel unsuru: (1) her bireyin fayda fonksiyonu farklıdır; (2) fayda fonksiyonu her zaman pozitiftir; (3) <b>azalarak artar<\/b> (azalan marjinal fayda ilkesi).<\/li>\n<li>Tüm akılcı bireyler riskten kaçınan yapıdadır; ancak riskten kaçınma dereceleri farklıdır.<\/li>\n<\/ul>\n<table>\n<tr><th>Tutum<\/th><th>Servetteki bir birim artışın faydası<\/th><th>A katsayısı<\/th><th>Kayıtsızlık eğrisi<\/th><\/tr>\n<tr><td>Riske kayıtsız<\/td><td>Bir önceki birimin faydasıyla aynı<\/td><td>A = 0<\/td><td>Risk eksenine paralel<\/td><\/tr>\n<tr><td>Riskten hoşlanan<\/td><td>Bir birimlik azalışın fayda kaybından büyük<\/td><td>A &lt; 0<\/td><td>Negatif eğimli<\/td><\/tr>\n<tr><td>Riskten kaçınan<\/td><td>Aynı miktardaki azalışın fayda kaybından küçük<\/td><td>A &gt; 0<\/td><td>Pozitif eğimli; kaçınma arttıkça daha dik<\/td><\/tr>\n<\/table>\n<ul>\n<li>Yazı tura örneği: %50 olasılıkla 100 TL, %50 olasılıkla 0 ya da kesin 50 TL. Beklenen değer 50 TL. Riskten hoşlanan oynar, riske kayıtsız kayıtsız kalır, riskten kaçınan kesin 50 TL'yi seçer.<\/li>\n<li><b>Fayda fonksiyonu:<\/b> U = E(r) − ½ × A × σ<sup>2<\/sup>. Yüksek A, bir birim ek risk için daha büyük getiri telafisi istendiğini gösterir.<\/li>\n<li>Örnek 3.2 (A = 5): hisse fonu %25/%40 → U = 0,25 − ½ × 5 × 0,16 = −0,15; para piyasası fonu %15/%10 → U = 0,125 → para piyasası fonu seçilir (kitap metninde 0,215 yazıyor; doğru değer 0,125).<\/li>\n<li>Örnek 3.3: getiri/risk 0,10/%25, 0,16/%30, 0,21/%35, 0,25/%40. A = 2 → faydalar 0,0375; 0,070; 0,0875; 0,09 → Yatırım 4. A = 4 → −0,025; −0,02; −0,035; −0,07 → Yatırım 2. Riske kayıtsız ve riskten hoşlanan → en yüksek getirili Yatırım 4.<\/li>\n<\/ul>\n\n<h3>Kayıtsızlık eğrileri<\/h3>\n<ul>\n<li>Yatırımcı iki parametreye bakar: beklenen değer ve standart sapma: U = f(E(r), σ). Aynı faydayı sağlayan getiri-risk bileşimleri <b>kayıtsızlık eğrisini<\/b> oluşturur.<\/li>\n<li>Aynı eğri üzerindeki tüm noktalar aynı faydayı verir (daha yüksek risk daha yüksek getiriyle dengelenir). Aynı riskte daha yüksek getirili nokta daha üst eğridedir.<\/li>\n<li>Eğriler <b>kuzeybatıya<\/b> doğru gidildikçe daha yüksek faydayı gösterir; birbirine paraleldir ve <b>kesişmez<\/b>; riskten kaçınan yatırımcı için azalan marjinal fayda gereği eğriseldir.<\/li>\n<li>Eğim, bir birim ek risk için istenen getiri artışını gösterir: <b>daha dik<\/b> eğri riske daha duyarlı (daha çok kaçınan), <b>daha yatık<\/b> eğri riske daha az duyarlı yatırımcıyı temsil eder.<\/li>\n<\/ul>\n\n<h3>Ortalama-varyans modeli (Markowitz, 1952)<\/h3>\n<ul>\n<li>1950'lere kadar risk-getiri etkileşimi göz ardı edildi (\"yatırımın tek yolu bir noktaya yoğunlaşmak\" görüşü). <b>Harry Markowitz<\/b> 1952'de \"Portföy Seçimi\" makalesiyle getiriyi istenen, varyansı istenmeyen bir şey olarak gören yatırımcılar için model kurdu.<\/li>\n<li>Risk <b>varyans<\/b> ile sayısallaştırıldı; varyansı azaltmanın en etkin yolu <b>çeşitlendirmedir<\/b> (modelin en önemli noktası). Model, kovaryans etkisini fark ettirdi; birçok risk modelinin temel taşıdır.<\/li>\n<li>Piyasa uygulaması: MSCI Dünya Fiyat Endeksi (1320 hisse) ve altın, Ekim 2020–Ekim 2025, 60 aylık veri, korelasyon 0,239. Eşit ağırlıklı portföy: getiri %1,19, standart sapma %3,29 (MSCI %0,95 ve %4,18). Tablodaki en düşük standart sapma %50 altın ağırlığında; getiri ağırlıkla doğrusal, risk doğrusal değildir.<\/li>\n<li><b>Fırsat kümesi:<\/b> mevcut varlıklardan oluşturulabilecek tüm portföyler.<\/li>\n<li><b>Etkin portföy:<\/b> belirli bir risk seviyesinde en yüksek beklenen getiriyi veya belirli bir getiride en düşük riski sunan portföy. Etkin portföyleri birleştiren eğri <b>etkin sınırdır<\/b>.<\/li>\n<\/ul>\n<h4>Korelasyonun portföy riskine etkisi<\/h4>\n<table>\n<tr><th>Korelasyon<\/th><th>Sonuç<\/th><\/tr>\n<tr><td>ρ = +1<\/td><td>Portföy standart sapması, risklerin ağırlıklı ortalamasına eşit; çeşitlendirme faydası yok, risk doğrusal birleşir<\/td><\/tr>\n<tr><td>ρ = −1<\/td><td>Varlıklar tam zıt hareket eder; uygun ağırlıklarla risk tamamen sıfırlanabilir<\/td><\/tr>\n<tr><td>−1 &lt; ρ &lt; +1<\/td><td>Risk, ağırlıklı risk toplamından düşük; risk-getiri düzleminde sola kavisli (konkav) eğri<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Minimum risk (varyans) portföyü:<\/b> etkin sınırın en sol başlangıç noktası. İki varlıkta: w<sub>C<\/sub> = (σ<sub>S<\/sub><sup>2<\/sup> − σ<sub>C<\/sub>σ<sub>S<\/sub>ρ<sub>CS<\/sub>) / (σ<sub>C<\/sub><sup>2<\/sup> + σ<sub>S<\/sub><sup>2<\/sup> − 2σ<sub>C<\/sub>σ<sub>S<\/sub>ρ<sub>CS<\/sub>), w<sub>S<\/sub> = 1 − w<sub>C<\/sub>.<\/li>\n<li>Örnek: C %12/%18, S %8/%10, eşit ağırlık → getiri her durumda %10; risk ρ = 0,5'te %12,3, ρ = 0'da %10,3, ρ = −0,5'te %7,8. Korelasyon düştükçe çeşitlendirmenin gücü artar.<\/li>\n<li><b>Optimal portföy:<\/b> etkin sınır ile yatırımcının kayıtsızlık eğrisinin <b>teğet<\/b> olduğu nokta. Riskten daha çok kaçınan yatırımcının optimal portföyü sınırın daha düşük risk-getiri bölgesindedir.<\/li>\n<\/ul>\n<h4>Modele yöneltilen eleştiriler<\/h4>\n<ul>\n<li><b>Varsayımlara ilişkin:<\/b> getirilerin normal dağıldığı varsayımı; yatırımcıların aynı tek dönemlik yatırım ufku; akılcı birey tipinin geçerliliği; yalnız riskli varlıklara yatırım yapıldığı varsayımı (en çok ilgi çekeni <b>James Tobin<\/b>'in eleştirisi → Portföy Seçimi Teoremi).<\/li>\n<li><b>Uygulamaya ilişkin:<\/b> tüm kombinasyonların analizi, getiri/sapma/kovaryans tahminleri çok zor ve işlem yükü büyük. Çözüm arayışında <b>William F. Sharpe<\/b>'ın <b>Tek Endeks (Faktör) Modeli<\/b> öne çıkar; varlık fiyatlama teorisine de temel olmuştur.<\/li>\n<li><b>N varlıklı eşit ağırlıklı portföy:<\/b> σ<sub>P<\/sub><sup>2<\/sup> = (1/N) × ortalama varyans + [(N − 1)/N] × ortalama kovaryans. N → ∞ iken ilk terim sıfıra gider (özel/idiyosinkratik risk yok olur), portföy varyansı <b>ortalama kovaryansa<\/b> yakınsar: çeşitlendirmeyle yok edilemeyen bu risk <b>sistematik (piyasa) risktir<\/b>.<\/li>\n<\/ul>\n\n<h3>Portföy seçimi teoremi (Tobin, 1958)<\/h3>\n<ul>\n<li>Tobin, Keynes'in Likidite Tercihi Teorisi'ndeki iki noktayı gerçekçi bulmadı: (1) faiz beklentilerinin çok yavaş değişeceği; (2) yatırımcının nakit ile riskli varlık arasında ya biri ya diğeri şeklinde tek tercih yapacağı. Yatırımcılar servetlerini riskli ve risksiz varlıklar arasında <b>paylaştırır<\/b>.<\/li>\n<li><b>I. aşama:<\/b> riske karşı tutum, yani ne kadar risksiz, ne kadar riskli varlık tutulacağı; kişiden kişiye değişir.<\/li>\n<li><b>II. aşama:<\/b> portföyün riskli kısmının seçimi; etkin sınırdaki diğer tüm portföylerden üstün <b>tek portföy<\/b> belirlenir ve bu portföy <b>tüm yatırımcılar için aynıdır<\/b>.<\/li>\n<li>İki karar birbirinden bağımsızdır; teorem ortalama-varyans modelini bir anlamda basitleştirir, ancak etkin sınırın belirlenmesi için kolaylık getirmez.<\/li>\n<\/ul>\n<h4>Risksiz varlık ve Varlık Bileşim Doğrusu<\/h4>\n<table>\n<tr><th>Kavram<\/th><th>Formül<\/th><\/tr>\n<tr><td>Risksiz + riskli portföyün riski<\/td><td>σ<sub>p<\/sub> = w<sub>i<\/sub> × σ<sub>i<\/sub> (σ<sub>rf<\/sub> = 0)<\/td><\/tr>\n<tr><td>Beklenen getiri<\/td><td>E(R<sub>p<\/sub>) = w<sub>i<\/sub> × E(R<sub>i<\/sub>) + (1 − w<sub>i<\/sub>) × R<sub>f<\/sub><\/td><\/tr>\n<tr><td>Varlık Bileşim Doğrusu<\/td><td>E(R<sub>p<\/sub>) = R<sub>f<\/sub> + [(E(R<sub>i<\/sub>) − R<sub>f<\/sub>) / σ<sub>i<\/sub>] × σ<sub>p<\/sub><\/td><\/tr>\n<tr><td>Sharpe ölçütü (doğrunun eğimi)<\/td><td>[E(R<sub>i<\/sub>) − R<sub>f<\/sub>] / σ<sub>i<\/sub><\/td><\/tr>\n<\/table>\n<ul>\n<li>Risksiz varlık: getirisi kesin bilinen araç (hazine bonosu, devlet tahvili); standart sapması sıfır. Doğru getiri eksenini R<sub>f<\/sub>'de keser.<\/li>\n<li>R<sub>f<\/sub> ile riskli portföy arasındaki noktalar <b>ödünç veren<\/b> portföyler (risksiz varlık ağırlığı pozitif); riskli portföyün sağındaki noktalar <b>ödünç alan<\/b> portföyler (risksiz faizden borçlanıp riskli portföye yatırılır; riskli ağırlık %100'ün üstünde).<\/li>\n<li>Etkin sınıra <b>teğet<\/b> olan doğru üzerindeki C portföyü en üstün portföydür; tüm yatırımcılar için aynıdır. Riske duyarlı yatırımcı C ile risksiz varlığı birleştirir, risk iştahı yüksek olan borçlanıp C'den daha fazla alır. Bu fikir FVFM'nin temelidir.<\/li>\n<\/ul>\n<h4>Kitaptaki sayısal örnekler<\/h4>\n<ul>\n<li>Örnek 3.4: A %30 ve σ 0,40; B %20 ve σ 0,25; ρ = 0. %10 A + %90 B → E = %21, σ = %22,853 (ρ = 0 olduğu için kovaryans terimi sıfır). R<sub>f<\/sub> = %6; w<sub>A<\/sub> = %40,11'de doğrunun eğimi en yüksek: E(R<sub>p<\/sub>) = 0,06 + 0,8207 σ<sub>p<\/sub>. %20 getiri için σ = %17,06; %30 için σ = %29,24 (A'nın riski 0,40'tan düşük). U = E − 0,5 × 4 × σ<sup>2<\/sup> ile faydalar: %6 → 0,06; %20 → 0,1418 (en yüksek); %30 → 0,1290.<\/li>\n<li>Örnek 3.5: net reel hedef %5, enflasyon %10, işlem maliyeti %1 → brüt nominal hedef (1,05 × 1,10 × 1,01) − 1 ≈ %17 (tam değer %16,66). Köşe portföyler A %22/%30, B %20/%25, C %15/%20 → hedefi aşan en düşük riskli B seçilir; w × 0,20 + (1 − w) × 0,08 = 0,17 → %75 B, %25 risksiz.<\/li>\n<li>Dikkat: matematiksel ölçüt köşe portföyün kendi riski değil, <b>risksiz varlıkla birleşimin riskidir<\/b>. Hedefe ulaşmak için gereken risk σ = (hedef − R<sub>f<\/sub>) / Sharpe olduğundan, en düşük riski <b>Sharpe ölçütü en yüksek<\/b> köşe portföy verir. Örnek 3.5'te B'nin Sharpe'ı (0,48) A'nınkinden (0,47) yüksek olduğu için sonuç B'dir (σ %18,75; A ile %19,29); Sharpe sıralaması tersine dönerse riski yüksek köşe portföy seçilmelidir.<\/li>\n<li>Örnek 3.6: vergi sonrası hedef %12, vergi %20 → vergi öncesi 0,12 / 0,80 = %15. Sharpe ölçütü yüksek Portföy 1 (%18; 0,33) ve Portföy 3 (%14; 0,25) birleştirilir (Portföy 2 tam %15 getirse de Sharpe'ı 0,23): w × 0,18 + (1 − w) × 0,14 = 0,15 → %25 Portföy 1, %75 Portföy 3.<\/li>\n<li>Dikkat: hedef getiri sorularında önce hedefi brüt/vergi öncesi/nominal hâle getir (enflasyon, işlem maliyeti ve vergiyi çarpım ya da bölmeyle ekle), sonra ağırlığı bul.<\/li>\n<\/ul>\n", "sorular": [{"q": "Riskten kaçınma katsayısı A = 4 olan yatırımcı, beklenen getiri/standart sapma değerleri X: %10/%15, Y: %14/%22, Z: %18/%30, W: %22/%38 olan yatırımlardan hangisini seçer?", "o": ["Yatırım Y", "Yatırım Z", "Yatırım X", "Yatırım W", "Hiçbirini, çünkü tüm faydalar negatiftir"], "a": 2, "e": "U = E − 0,5 × 4 × σ²: X → 0,0550; Y → 0,0432; Z → 0,0000; W → −0,0688. En yüksek fayda seçilir."}, {"q": "Aynı alternatifler arasından riske kayıtsız (A = 0) bir yatırımcı hangisini seçer?", "o": ["Yatırım X", "Yatırım Y", "Yatırım Z", "Yatırım W", "Hepsine eşit ağırlıkla yatırım yapar"], "a": 3, "e": "A = 0 iken U = E(r); risk dikkate alınmaz ve en yüksek beklenen getirili W (%22) seçilir."}, {"q": "Beklenen getirisi %16, standart sapması %20 olan bir yatırımın, riskten kaçınma katsayısı 3 olan yatırımcıya sağladığı fayda kaçtır? (U = E(r) − ½Aσ²)", "o": ["0,04", "−0,14", "0,22", "0,14", "0,10"], "a": 4, "e": "U = 0,16 − 0,5 × 3 × 0,20² = 0,16 − 0,06 = 0,10. ½ çarpanını unutmak 0,04; σ'nın karesini almamak −0,14 verir."}, {"q": "Fayda fonksiyonundaki riskten kaçınma katsayısı A negatif olan bir yatırımcı için hangisi doğrudur?", "o": ["Riski sever; ek risk faydasını artırır", "Riskten kaçınır; ek risk faydasını azaltır", "Riske kayıtsızdır; risk faydasını etkilemez", "Kayıtsızlık eğrileri risk eksenine paraleldir", "Yalnızca risksiz varlığa yatırım yapar"], "a": 0, "e": "A pozitifse riskten kaçınan, sıfırsa riske kayıtsız, negatifse riski seven yatırımcıdır; A negatifken −½Aσ² terimi pozitif olur ve ek risk faydayı artırır."}, {"q": "Kayıtsızlık eğrilerine ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Kuzeybatıya gidildikçe daha yüksek faydayı gösterir", "Farklı fayda düzeylerini gösteren kayıtsızlık eğrileri birbiriyle kesişebilir", "Aynı eğri üzerindeki tüm noktalar aynı faydayı sağlar", "Daha dik eğri riske daha duyarlı yatırımcıyı temsil eder", "Riske kayıtsız yatırımcının eğrileri risk eksenine paraleldir"], "a": 1, "e": "Kayıtsızlık eğrileri birbirine paraleldir ve kesişmez."}, {"q": "Riskten kaçınan bir yatırımcı için K (%10 getiri, %15 risk) ve L (%14 getiri, %20 risk) aynı kayıtsızlık eğrisi üzerindedir. M portföyü %14 getiri ve %15 risk sunmaktadır. Hangisi doğrudur?", "o": ["M, K ve L ile aynı faydayı sağlar", "L, M'den daha yüksek fayda sağlar", "M, K ve L'den daha üst bir kayıtsızlık eğrisindedir ve tercih edilir", "K, M'den daha yüksek fayda sağlar", "Üç portföy karşılaştırılamaz"], "a": 2, "e": "M, L ile aynı getiriyi daha düşük riskle, K ile aynı riski daha yüksek getiriyle sunar; kuzeybatıdaki daha üst eğridedir."}, {"q": "Standart sapmaları %20 ve %10 olan iki hisseye eşit ağırlıkla yatırım yapılmıştır. Korelasyon −0,5 ise portföyün standart sapması yaklaşık kaçtır?", "o": ["%15,00", "%11,18", "%5,00", "%8,66", "%0,75"], "a": 3, "e": "σp² = 0,25 × 0,04 + 0,25 × 0,01 + 2 × 0,5 × 0,5 × (−0,5) × 0,20 × 0,10 = 0,0075; σp = %8,66. ρ = +1'de %15, ρ = 0'da %11,18 olurdu."}, {"q": "İki varlıklı portföylerde korelasyon katsayısının etkisine ilişkin hangisi doğrudur?", "o": ["ρ = +1 ise çeşitlendirme riski en çok azaltır", "ρ = 0 ise portföy riski sıfırdır", "Korelasyon düştükçe portföyün beklenen getirisi düşer", "ρ = +1 ise portföy riski ağırlıklı ortalamanın altına iner", "ρ = −1 ise uygun ağırlıklarla portföy riski tamamen sıfırlanabilir"], "a": 4, "e": "ρ = +1'de risk ağırlıklı ortalamaya eşittir (çeşitlendirme faydası yok); beklenen getiri korelasyondan etkilenmez; ρ = −1'de risk sıfırlanabilir."}, {"q": "A varlığının standart sapması %25, B'ninki %15 ve aralarındaki korelasyon 0,20'dir. Minimum varyanslı portföyde A'nın ağırlığı yaklaşık kaçtır?", "o": ["%21,43", "%78,57", "%37,50", "%26,47", "%50,00"], "a": 0, "e": "wA = (0,0225 − 0,25 × 0,15 × 0,20) / (0,0625 + 0,0225 − 2 × 0,0075) = 0,015 / 0,07 = %21,43; wB = %78,57. Riskli olan A'ya düşük ağırlık verilir."}, {"q": "Portföylerin beklenen getiri/risk değerleri şöyledir: A %9/%12, B %11/%12, C %11/%16, D %14/%16. Markowitz'in etkinlik kuralına göre hangileri etkindir?", "o": ["Yalnız B", "A ve C", "B ve D", "B, C ve D", "A, B, C ve D"], "a": 2, "e": "Aynı riskte (%12) B, A'dan; aynı riskte (%16) D, C'den üstündür; aynı getiride (%11) B, C'den daha az risklidir. Etkin olanlar B ve D.", "k": 1}, {"q": "Ortalama-varyans modelinde optimal portföy nasıl belirlenir?", "o": ["Minimum varyanslı portföy noktasında", "Etkin sınır ile yatırımcının kayıtsızlık eğrisinin teğet olduğu noktada", "Etkin sınırın en yüksek getirili noktasında", "Kayıtsızlık eğrisinin risk eksenini kestiği noktada", "Fırsat kümesinin ağırlık merkezinde"], "a": 1, "e": "Yatırımcı ulaşabileceği en üst kayıtsızlık eğrisini hedefler; bu, eğrinin etkin sınıra teğet olduğu noktadır. Daha çok riskten kaçınanın teğet noktası daha düşük risk bölgesindedir."}, {"q": "Riskten kaçınma derecesi yüksek Ali ile düşük olan Ayşe, etkin sınır üzerindeki Y (%8 risk, %12 getiri) ve Z (%20 risk, %25 getiri) portföylerinden birini seçecektir. Hangisi beklenir?", "o": ["Ali Z'yi, Ayşe Y'yi seçer", "İkisi de Y'yi seçer", "Ali Y'yi, Ayşe Z'yi seçer", "İkisi de Z'yi seçer", "İkisi de minimum varyanslı portföyü seçer"], "a": 2, "e": "Ali'nin kayıtsızlık eğrileri diktir ve sınıra düşük risk bölgesinde teğet olur; Ayşe'ninki daha yatıktır ve yüksek risk-getiri bölgesinde teğet olur."}, {"q": "Risksiz faiz %7, optimal riskli portföyün beklenen getirisi %19 ve standart sapması %24'tür. Varlık Bileşim Doğrusu üzerinde riskini %18 ile sınırlayan yatırımcının beklenen getirisi kaçtır?", "o": ["%14,25", "%9,00", "%19,00", "%16,00", "%10,42"], "a": 3, "e": "Eğim = (0,19 − 0,07) / 0,24 = 0,50; E = 0,07 + 0,50 × 0,18 = %16,00."}, {"q": "Etkin sınırdaki A portföyü %20 beklenen getiri ve %25 standart sapmaya sahiptir; risksiz faiz %8'dir. %14 hedef getiriye A ve risksiz varlıkla ulaşmak isteyen yöneticinin portföyü için hangisi doğrudur?", "o": ["%50 A; risk %25; ödünç alan portföy", "%70 A; risk %17,5; ödünç veren portföy", "%150 A; risk %37,5; ödünç alan portföy", "%50 A; risk %12,5; ödünç alan portföy", "%50 A; risk %12,5; ödünç veren portföy"], "a": 4, "e": "w × 0,20 + (1 − w) × 0,08 = 0,14 → w = 0,50; σ = 0,5 × 0,25 = %12,5. Risksiz varlık ağırlığı pozitif olduğu için ödünç veren portföydür."}, {"q": "B portföyü %16 beklenen getiri ve %20 standart sapmaya sahiptir; risksiz borçlanma faizi %6'dır. %21 getiri hedefleyen yatırımcının yeni portföyünün riski ve konumu nedir?", "o": ["Risk %30; ödünç alan portföy", "Risk %20;
