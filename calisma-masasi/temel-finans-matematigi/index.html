nson, Hood ve Beebower", "Burns ve Mitchell (1946)", "Shiller"], "a": 3, "e": "Burns ve Mitchell döngüyü, aynı anda birçok ekonomik aktivitede yaşanan genişlemeler ve bunları izleyen resesyon ve daralmalardan oluşan süreç olarak tanımlamıştır."}, {"q": "Aşağıdakilerden hangisi öncü gösterge değildir?", "o": ["İşsizlik sigortası için yapılan başvurular", "Kredi faiz oranı", "Alınan inşaat ruhsatları", "Hisse senedi fiyat endeksi", "Para arzı"], "a": 1, "e": "Kredi faiz oranı, reel GSYİH değiştikten 6–8 hafta sonra değişen izleyen göstergelerdendir. Diğerleri öncü göstergedir."}, {"q": "Aşağıdakilerden hangisi eşanlı (coincident) göstergedir?", "o": ["Ortalama işsizlik süresi", "Makine-teçhizat yeni siparişleri", "Stokların satışlara oranı", "Kurulan yeni şirket sayısı", "Sanayi üretim endeksi"], "a": 4, "e": "Eşanlı göstergeler: tarım dışı ücretler, kişisel gelir, sanayi üretim endeksi, imalat ve ticaret satış hacmi. Ortalama işsizlik süresi ve stok/satış oranı izleyen, diğer ikisi öncüdür."}, {"q": "Ekonomik döngüde getiri eğrisinin negatif eğimli hale gelmesi tipik olarak hangi evrede görülür?", "o": ["Toparlanma", "Erken genişleme", "Yavaşlama", "Resesyon sonrasında faizlerin düşürüldüğü dönem", "Genişlemenin başlangıcı"], "a": 2, "e": "Eğri başlangıçta dik ve pozitif, sıkılaşmayla yatay, yavaşlamada negatif eğimlidir; resesyonda politika faizi düşünce tekrar pozitif olur."}, {"q": "Aşağıdakilerden hangisi ekonomik döngüyle ters yönlü (counter-cycle) ilişkili bir faktördür?", "o": ["Kredi risk primi", "Reel büyüme", "Enflasyon", "Tüketici güveni", "Risk iştahı"], "a": 0, "e": "Kredi risk primi genişlemede azalır, daralmada artar; belirleyicisi risk iştahıdır. Reel büyüme ve enflasyon doğrusal yönlüdür."}, {"q": "Geç genişleme evresinin \"yumuşak iniş\" olarak adlandırılmasının nedeni nedir?", "o": ["Politika faizlerinin düşürülerek getiri eğrisinin dikleşmesi", "İşsizliğin maksimum seviyeye ulaşması", "Kredi koşullarının hızla gevşemesi", "Enflasyonun belirginleşmesiyle başlayan parasal sıkılaşmanın aşırı genişlemeyi önleyerek dengeli bir yavaşlama sağlaması", "Döngünün en kısa evresi olması"], "a": 3, "e": "Geç genişlemede enflasyon kendini daha fazla gösterir, parasal sıkılaşma başlar ve ekonomi dengeli yavaşlamaya yönelir; bu nedenle yumuşak iniş denir."}, {"q": "Porter'a göre aşağıdakilerden hangisi beş rekabet gücünden biri olarak değil, güçleri etkileyen çevresel bir unsur olarak değerlendirilmelidir?", "o": ["İkame ürünlerin tehdidi", "Tamamlayıcı ürün ve hizmetler", "Alıcıların pazarlık gücü", "Yeni giriş tehdidi", "Mevcut rakipler arasındaki rekabet"], "a": 1, "e": "Sektör büyüme hızı, teknoloji ve inovasyon, devlet politikaları ve tamamlayıcı ürünler ayrı rekabet gücü değildir; beş gücün şiddetini etkileyen koşullardır."}, {"q": "Aşağıdakilerden hangisi tedarikçilerin pazarlık gücünü artıran durumlardan biri değildir?", "o": ["Tedarikçi sayısının az, alıcı sayısının çok olması", "Alıcıların tedarikçi değiştirme maliyetinin yüksek olması", "Girdiye yakın ikame bulunmaması", "Tedarikçinin ileriye doğru entegrasyon tehdidi", "Tedarikçinin gelirlerinin yalnızca tek bir sektöre bağlı olması"], "a": 4, "e": "Tedarikçi, müşteri profili çeşitlendirilmiş ve gelirleri tek sektöre bağlı olmadığında güçlüdür. Tek sektöre bağımlılık gücünü azaltır."}, {"q": "Aşağıdakilerden hangisi mevcut rakipler arasındaki rekabeti sertleştiren bir koşuldur?", "o": ["Belirgin bir pazar liderinin bulunması", "Sektör büyüme hızının yüksek olması", "Sektörden çıkış engellerinin yüksek olması", "Ürünlerin güçlü biçimde farklılaşmış olması", "Alıcıların geçiş maliyetinin yüksek olması"], "a": 2, "e": "Çıkış engeli yüksekse firmalar zarar etse de faaliyeti sürdürür ve rekabet sertleşir. Düşük büyüme, güçleri yakın çok rakip ve benzer ürün de rekabeti artırır."}, {"q": "Bir finansal modelde açık tahmin ufku ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Genellikle 10 yıla kadar sürer; hızlı teknolojik değişime açık sektörlerde 5 yıl gibi daha kısa ufuklar tercih edilir", "Her sektörde en az 10 yıl olmak zorundadır", "Altyapı şirketlerinde en kısa ufuk kullanılır", "Açık ufkun sonunda terminal değer yerine yıl yıl tahmine devam edilir", "Ufuk yalnızca yatırımcının elde tutma süresine bağlıdır"], "a": 0, "e": "Ufuk elde tutma süresi, döngüsellik, olgunluk ve kurum geleneğine bağlıdır; genellikle 10 yıla kadar. Ötesinde terminal değer kullanılır."}, {"q": "Reel sektör şirketlerinde finansal modellemenin tipik kurulma sırası hangisidir?", "o": ["Bilanço, gelir tablosu, nakit akış tablosu", "Nakit akış tablosu, bilanço, gelir tablosu", "Bilanço, nakit akış tablosu, gelir tablosu", "Gelir tablosu, bilanço, nakit akış tablosu", "Gelir tablosu, nakit akış tablosu, bilanço"], "a": 3, "e": "Önce gelir tablosu projekte edilir, ardından bilanço; nakit akış tablosu bu ikisinden türetilir."}, {"q": "Porter'ın beş güç çerçevesinden hareketle önerdiği stratejik yollardan biri aşağıdakilerden hangisidir?", "o": ["Tüm segmentlerde aynı anda fiyat liderliği", "Sektördeki oyun kurallarını kendi lehine değiştirmek", "Sektör büyümesini ayrı bir rekabet gücü olarak yönetmek", "Geçiş maliyetlerini düşürerek müşteri çekmek", "Misilleme beklentisini azaltmak için kapasiteyi daraltmak"], "a": 1, "e": "Üç yol: güçlerle daha iyi baş edilecek konuma yerleşmek, güçlerdeki değişimi rakiplerden önce okumak ve oyun kurallarını kendi lehine değiştirmek."}]}, {"id": 7, "kisa": "Temel Analiz: Değerleme", "baslik": "Temel Analiz II: Şirket Değerleme Yaklaşımları (Maliyet, Gelir ve Piyasa Çarpanları)", "ozet": "Defter, tasfiye ve net aktif değeri; temettü iskonto modelleri, FSNA/ÖSNA, AOSM, uç değer ve F/K, PD/DD, FD/FAVÖK gibi çarpanlar.", "notlar": "\n<h3>Değerleme yaklaşımları<\/h3>\n<ul>\n<li>Şirket değeri yalnızca o şirkete özgüdür; şirket finansmanı, <b>birleşme ve satın almalar<\/b> ve portföy yönetiminde kritik öneme sahiptir.<\/li>\n<li>Üç yaklaşım: <b>maliyet (varlığa dayalı)<\/b>, <b>gelir<\/b> ve <b>piyasa<\/b>. Değer tespitinde bunların bir veya birkaçı birlikte kullanılabilir.<\/li>\n<\/ul>\n\n<h3>Maliyet (varlığa dayalı) yaklaşımı<\/h3>\n<p>Geçmiş gelirlerin gelecekte de elde edileceğinin garantisi yoktur; önemli olan varlıkların değeridir. Yöntemler: <b>defter değeri, tasfiye değeri, net aktif değeri<\/b>.<\/p>\n<table>\n<tr><th>Yöntem<\/th><th>Tanım<\/th><th>Sınav notları<\/th><\/tr>\n<tr><td>Defter değeri<\/td><td>Bilançodaki muhasebe kayıtlarına göre net özkaynak<\/td><td>Stok/amortisman yöntemine duyarlı; tarihi maliyet, enflasyon ve teknolojik değişim sapma yaratır; içsel marka ve Ar-Ge aktifleştirilmez; bilanço dışı yükümlülükler ve <b>hisse geri alımları<\/b> özkaynağı küçültür. Varlıkları piyasa değeriyle izlenen <b>banka, sigorta, yatırım kurumlarında birincil öneme<\/b> sahiptir. Dikkat: defter değeri her zaman taban değil; ROE sermaye maliyetinin altındaysa PD/DD &lt; 1 olabilir. Enflasyonist ekonomide <b>TMS 29<\/b> ile anlamlı hale getirilebilir.<\/td><\/tr>\n<tr><td>Tasfiye (likiditasyon) değeri<\/td><td>Faaliyet durursa tüm varlıklar nakde çevrilip borçlar ödendikten sonra hissedarlara kalan tutar<\/td><td><b>Cari piyasa / ikinci el değeri<\/b> esas alınır. Piyasa değeri için alt sınır kabul edilir; ancak <b>düzenli tasfiye<\/b> ile <b>zorunlu/acil tasfiye<\/b> arasında büyük fark olur.<\/td><\/tr>\n<tr><td>Net aktif değeri (düzeltilmiş özsermaye)<\/td><td>Varlıkların cari piyasa değerleri toplamı − borçların piyasa değerleri<\/td><td>Uygulaması zordur, bağımsız eksper görüşüne dayanır. Patent, know-how gibi maddi olmayan varlığı yoğun <b>teknoloji şirketlerinde kullanılmaz<\/b>; <b>GYO, holding (yatırım şirketleri), maden/orman<\/b> gibi doğal kaynak şirketlerinde en temel yöntemdir.<\/td><\/tr>\n<\/table>\n<ul>\n<li>İşletmenin sürekliliği varsayımında, <b>kârlı şirketler için teorik olarak en zayıf<\/b> yaklaşımlardan biridir: sinerjiyi, insan sermayesini, büyüme fırsatlarını ve görünmez rekabet avantajlarını dışarıda bırakır.<\/li>\n<li>Uygun olduğu yerler: faaliyetini durduracak şirketler, varlıkları likit finans şirketleri, varlık toplamı operasyonel değerinden yüksek hale gelmiş yapılar.<\/li>\n<\/ul>\n\n<h3>Gelir yaklaşımı ve temettü iskonto modeli (TİM)<\/h3>\n<ul>\n<li>Temel düşünce: bir varlık gelir sağladığı sürece değere sahiptir. Yöntemler: <b>indirgenmiş kâr payları<\/b> ve <b>indirgenmiş nakit akımları<\/b>.<\/li>\n<li>TİM: hissenin içsel değeri, ömrü boyunca ödeyeceği tüm temettülerin bugünkü değerleri toplamıdır. Temettü ödemeyen veya düzensiz ödeyen şirketlerde kullanımı kısıtlıdır; <b>olgun, istikrarlı, düzenli temettü dağıtan<\/b> şirketler için güçlüdür.<\/li>\n<li>n dönemlik elde tutmada nakit akışları temettüler ve satış fiyatıdır; n sonsuza giderse satış fiyatının bugünkü değeri sıfıra yaklaşır.<\/li>\n<li>Gordon modeli şartı: <b>r &gt; g<\/b>. g ≥ r ise değer sonsuz/anlamsız çıkar. r genellikle FVFM ile; g, ülkenin uzun vadeli <b>nominal GSYİH büyümesine yakın veya altında<\/b> alınır. g = dağıtılmayan kâr oranı × ÖSK (ÖSK sabit ve yeni yatırımlar aynı ÖSK'yı sağlar varsayımı).<\/li>\n<li>Gordon'a uygun şirketler: olgun-büyük ölçekli, istikrarlı temettü politikalı, büyümesi ekonomiye yakın. Uygun değil: yüksek ve değişken büyümeli genç teknoloji ve döngüsel şirketler. Sonuç r ve g'ye aşırı duyarlıdır; <b>duyarlılık analizi<\/b> önerilir.<\/li>\n<li>Örnek (kitap): D₀ = 4 TL, rf %10, piyasa risk primi %6, β 1,5, g %8 → r = %19, D₁ = 4,32 TL, F₀ = 4,32/0,11 = <b>39,27 TL<\/b>.<\/li>\n<\/ul>\n<h4>Büyüme fırsatlarının bugünkü değeri (BFBD / PVGO)<\/h4>\n<ul>\n<li>Yeni yatırımların getirisi (ÖSK) beklenen getiriden (k) yüksekse, dağıtım oranını düşürüp yatırım yapmak hisse değerini artırır.<\/li>\n<li>Kitap örneği: k %15, ÖSK %25, HBK₁ 8,33 TL, temettü 5 TL (dağıtım %60, tutma %40) → g = 0,25 × 0,40 = %10; büyümesiz değer 8,33/0,15 = 55,5 TL; büyümeli değer 5/0,05 = 100 TL; <b>BFBD = 44,5 TL<\/b>.<\/li>\n<li>P₀ &gt; HBK₁/k → piyasa kârlı büyüme bekler; P₀ = HBK₁/k → yeni yatırımlar ek değer katmaz (getiri = k); P₀ &lt; HBK₁/k → yatırımların getirisi k'nın altında, değer yıkımı beklenir.<\/li>\n<li>Hisseler arası kıyasta BFBD'nin fiyat içindeki payı (BFBD/P₀) karşılaştırılır.<\/li>\n<\/ul>\n<h4>Çok aşamalı modeller<\/h4>\n<ul>\n<li><b>İki aşamalı:<\/b> genellikle <b>5–10 yıl<\/b> süren yüksek büyüme (gₛ) ve sonsuza dek istikrarlı büyüme (gₗ). Kitap örneği: D₀ 1 TL, 4 yıl %20, sonra %7, r %15 → ilk aşama BD 4,46 TL + terminal değer BD 15,94 TL = <b>20,40 TL<\/b> (ara adımlar yuvarlanmadan yaklaşık 20,31 TL).<\/li>\n<li><b>H-modeli:<\/b> iki aşamalı modelin ani düşüş eleştirisine çözüm; yüksek büyüme <b>2H<\/b> süresince doğrusal azalarak gₗ'ye iner. H, yüksek büyüme döneminin yarısıdır (10 yıllık düşüş için H = 5). Kitap örneği: D₀ 2 TL, r %12, gₗ %6, gₛ %14, 2H = 8 → 35,33 + 10,67 = <b>46,00 TL<\/b>.<\/li>\n<li><b>Üç aşamalı:<\/b> yüksek büyüme, geçiş, olgunluk. Dikkat: büyüme düşerken <b>dağıtım oranı kademeli artırılmalıdır<\/b>; sabit bırakmak yanıltıcı değer üretir.<\/li>\n<li>TİM tek başına değil, İNA ve çarpanlarla çapraz kontrol edilerek kullanılmalıdır.<\/li>\n<\/ul>\n\n<h3>Serbest nakit akımı (SNA) ile değerleme<\/h3>\n<p>TİM fiilen ödenen nakde, SNA ise şirketin dağıtabileceği potansiyel maksimum nakde odaklanır; modern uygulamada SNA modelleri öne çıkmıştır. Nedenler:<\/p>\n<ul>\n<li><b>Yönetim takdiri:<\/b> temettü yönetimin inisiyatifindedir; 1990'lardan itibaren özellikle ABD'de hisse geri alımları temettülere alternatif olarak yaygınlaşmıştır.<\/li>\n<li><b>Büyüme şirketleri:<\/b> yıllarca temettü ödemeden büyüyen teknoloji şirketleri.<\/li>\n<li><b>Kontrol perspektifi:<\/b> azınlık hissedarı için TİM makul olabilir; <b>birleşme-satın alma ve kontrol<\/b> değerlemelerinde SNA esastır.<\/li>\n<li><b>Sermaye yapısı değişimi:<\/b> kaldıraçlı satın almada (LBO) temettü durur; FSNA kaldıraçsız nakdi iskonto ettiği için daha tutarlıdır.<\/li>\n<\/ul>\n<table>\n<tr><th><\/th><th>Firmaya SNA (FSNA)<\/th><th>Özsermayeye SNA (ÖSNA)<\/th><\/tr>\n<tr><td>Kime ait<\/td><td>Tüm sermaye sağlayıcılar (borç verenler + hissedarlar)<\/td><td>Yalnız hissedarlar<\/td><\/tr>\n<tr><td>Borç ödemeleri<\/td><td>Faiz ve anaparadan <b>önce<\/b> (kaldıraçsız)<\/td><td>Faiz ve net anapara <b>sonrası<\/b><\/td><\/tr>\n<tr><td>İskonto oranı<\/td><td><b>AOSM<\/b><\/td><td><b>Özsermaye maliyeti<\/b><\/td><\/tr>\n<tr><td>Hisse değerine geçiş<\/td><td>Firma değeri + faaliyet dışı varlıklar − finansal borçlar<\/td><td>Operasyonel özsermaye değeri + faaliyet dışı varlıklar (<b>borç tekrar düşülmez<\/b>)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Teorik olarak iki yaklaşım aynı özsermaye değerini verir. Projeksiyon döneminde sermaye yapısı değişiyorsa borç takvimini tahmin etmek zorlaştığından <b>FSNA pratikte daha kolay ve güvenilirdir<\/b>. Türkiye'de halka arz fiyat tespit raporlarında büyük ölçüde FSNA tercih edilir.<\/li>\n<li>FSNA'da faizin <b>vergi kalkanı nakit akımına eklenmez<\/b>; AOSM'de borç maliyeti vergi sonrası alınarak zaten yansıtılır, ikisini birden yapmak mükerrer sayımdır.<\/li>\n<li>Net sermaye yatırımı = brüt varlık alımı − eski varlık satış hasılatı. İdame yatırımlarının amortismana yakınsaması, büyüme yatırımlarının satış artışıyla uyumlu olması beklenir.<\/li>\n<li>Değerlemede NİS yalnız operasyonel kalemleri içerir; nakit ve kısa vadeli finansal borçlar dışarıda tutulur. Büyüyen şirkette ΔNİS &gt; 0 nakdi azaltır; süpermarket gibi peşin satıp geç ödeyen sektörlerde <b>negatif işletme sermayesi<\/b> ile büyüme nakit yaratabilir.<\/li>\n<li>Net borçlanma ÖSNA'yı artırır ama iflas riski ve betayı da yükselttiği için özsermaye maliyeti artar; nakit akımındaki matematiksel artışın değer etkisi nötrlenir. Yüksek borçlu şirkette ÖSNA daha oynaktır.<\/li>\n<\/ul>\n\n<h3>İskonto oranları<\/h3>\n<ul>\n<li>İskonto oranı nakit akımının doğasıyla tutarlı olmalıdır: FSNA → AOSM, ÖSNA → özsermaye maliyeti.<\/li>\n<li>Özsermaye maliyeti genellikle FVFM ile: risksiz faiz (temerrüt riski taşımayan, örneğin uzun vadeli devlet tahvili) + beta × piyasa risk primi.<\/li>\n<li>AOSM borç ve özsermaye maliyetlerinin <b>piyasa değerleriyle<\/b> ağırlıklandırılmış ortalamasıdır. Kitap örneği: rf %10, risk primi %6, β 1,20, kB %14, vergi %20, %30 borç → kÖS %17,2, vergi sonrası borç %11,2, AOSM %15,4.<\/li>\n<\/ul>\n\n<h3>Uç (terminal) değer<\/h3>\n<ul>\n<li>Açık tahmin ufkunun sonrasındaki sonsuz nakit akımlarının ufkun son yılına indirgenmiş tek değeri. İki yaklaşım: <b>çarpan (exit multiple)<\/b> — piyasadaki yanlış fiyatlamayı modele taşıdığı için eleştirilir — ve <b>sabit (sonsuz) büyüme<\/b> modeli.<\/li>\n<li>Uç değer toplam bugünkü değerin büyük kısmını (bazen %40, bazen %80'e varan) oluşturur; en çok eleştirilen ve manipülasyona açık aşamadır.<\/li>\n<li>Dikkat: hiçbir şirket sonsuza dek ekonominin nominal büyümesinden (veya risksiz faizden) hızlı büyüyemez; daralan sektörlerde g negatif olabilir. <b>Büyüme bedava değildir:<\/b> g &gt; 0 iken net yatırımı sıfır varsaymak (CapEx = amortisman) en sık yapılan hatadır. Son yıl nakit akımı normalize edilmiş olmalıdır.<\/li>\n<li>Türkiye'de fiyat tespit raporlarında ağırlıklı olarak sabit büyüme modeli kullanılır ve AOSM ile g'nin örneğin ±%1,0 değiştirildiği <b>hassasiyet (duyarlılık) tabloları<\/b> standarttır. Kitap örneğinde baz %15,4 AOSM ve %5 g ile 50,75 TL (kitap metninde baz değer 54,45 TL yazılı, tablo 50,75 TL verir); en iyimser hücre (AOSM %14,4, g %6) 65,94 TL, en kötümser (AOSM %16,4, g %4) 40,44 TL.<\/li>\n<\/ul>\n\n<h3>Piyasa çarpanları yaklaşımı<\/h3>\n<ul>\n<li>Temeli <b>tek fiyat yasası<\/b>: aynı özellikteki varlıklar aynı fiyattan işlem görmelidir.<\/li>\n<li><b>Fiyat çarpanları<\/b> (F/K, PD/DD) yalnız özkaynak yatırımcısının bakışını; <b>firma değeri çarpanları<\/b> (FD/FAVÖK, FD/Satışlar) sermaye yapısından bağımsız bakışı yansıtır.<\/li>\n<li><b>Karşılaştırılabilir varlıklar yöntemi:<\/b> emsal grubu seç → çarpanların ortalama/medyanını al → hedef şirkete uygula. Kısıt: tüm sektör aşırı değerliyse pahalı hisse \"ucuz\" görünebilir.<\/li>\n<li><b>Tahmin edilen temellere dayalı yöntem:<\/b> çarpan, büyüme-risk-kârlılıkla teorik modelden türetilir: <b>temellendirilmiş (gerekçelendirilmiş) çarpan<\/b>. Piyasa çarpanı bundan düşükse ucuz, yüksekse pahalı.<\/li>\n<li>Avantajlar: basitlik, piyasa odaklılık, veri erişimi, esneklik. Dezavantajlar: yanıltıcı basitlik, görecelilik, emsal bulma güçlüğü, muhasebe politikalarına duyarlılık.<\/li>\n<\/ul>\n<table>\n<tr><th>Çarpan<\/th><th>Formül / yorum<\/th><th>Dikkat<\/th><\/tr>\n<tr><td>F/K<\/td><td>Fiyat / HBK = Piyasa değeri / net kâr. Her 1 TL kâr için ödenen tutar; kendini kaç yılda geri ödediği.<\/td><td><b>Tarihi F/K<\/b> son dört çeyrek gerçekleşen kâr; <b>prospektif F/K<\/b> gelecek dört çeyrek tahmini (teorik olarak daha anlamlı). Faiz düşünce F/K'lar yükselir. Zarar eden şirkette anlamsız; döngüsel sektörde tepe noktada yanıltıcı düşük, dipte yüksek: <b>Molodovsky etkisi<\/b>. Yüksek amortismanlı şirkette FD/FAVÖK daha uygun.<\/td><\/tr>\n<tr><td>Gerekçelendirilmiş F/K<\/td><td>Temettü ödeme oranı / (özkaynak maliyeti − büyüme)<\/td><td>Kitap: A şirketi 0,40/(0,13−0,03) = 4 &lt; cari 6 → potansiyel pahalı.<\/td><\/tr>\n<tr><td>FKB (PEG)<\/td><td>(F/K) / beklenen yıllık kazanç büyümesi (yüzde olarak)<\/td><td>&lt; 1 büyümeye göre ucuz, = 1 adil, &gt; 1 pahalı. F/K 30, büyüme %40 → 0,75.<\/td><\/tr>\n<tr><td>Shiller CAPE<\/td><td>Cari fiyat / son <b>10 yılın enflasyondan arındırılmış (reel) ortalama<\/b> HBK'sı<\/td><td>Kısa vadeli al-sat sinyali değil; değerleme rejimi ve uzun vadeli (7–10 yıl) beklenen reel getiri tartışmasında kullanılır. Yüksek CAPE → sonraki uzun ufukta düşük reel getiri eğilimi (deterministik değil).<\/td><\/tr>\n<tr><td>PD/DD<\/td><td>Piyasa değeri / özkaynak (defter değeri)<\/td><td>= 1 defter değeri kadar; &lt; 1 varlıkların etkin kullanılmadığı, zarar beklendiği veya fırsat; &gt; 1 marka, patent, müşteri tabanı, büyüme potansiyeli.<\/td><\/tr>\n<tr><td>FD/FAVÖK<\/td><td>(Piyasa değeri + net borç) / FAVÖK<\/td><td>Faiz, vergi, amortismandan bağımsız; farklı borçluluk ve uluslararası kıyasta güvenilir; net kâr negatifken de hesaplanır. Ama ΔNİS'i dikkate almadığı için nakit yaratımını olduğundan iyi gösterebilir.<\/td><\/tr>\n<tr><td>FD/FSNA<\/td><td>Firma değeri / FSNA<\/td><td>Teoriye en uygun; sermaye yoğun (enerji, altyapı, telekom) ve işletme sermayesi büyüyen şirketlerde öne çıkar.<\/td><\/tr>\n<tr><td>FD/FVÖK<\/td><td>Firma değeri / FVÖK<\/td><td>Amortismanı içerdiği için FAVÖK'e göre daha muhafazakâr.<\/td><\/tr>\n<tr><td>F/S (FD/Satışlar)<\/td><td>Değer / yıllık satışlar<\/td><td>Kârlılık yerine ölçek; kazancı negatif veya çok değişken şirketler.<\/td><\/tr>\n<tr><td>Sektöre özel<\/td><td>FD/Abone (telekom, dijital), FD/Rezerv (petrol-gaz, madencilik)<\/td><td>Rezerv kalitesi, üretim maliyeti, fiyat varsayımı olmadan tek başına yorumlanmaz.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kitap örneği (yüksek borç): X şirketi PD 500, net borç 400, FAVÖK 150, net kâr 40 → F/K 12,5, FD/FAVÖK 6,0; Y şirketi PD 500, net borç 50, FAVÖK 100, net kâr 70 → F/K 7,1, FD/FAVÖK 5,5. Borç, X'in F/K'sını yanıltıcı biçimde yükseltir.<\/li>\n<li>Düşük PD/DD + düşük ROE + düşük büyüme + çok yüksek FKB = <b>değer tuzağı<\/b> profili; yüksek F/K ve PD/DD'ye rağmen FKB &lt; 1 olan büyüme şirketi potansiyel olarak ucuz olabilir.<\/li>\n<\/ul>\n\n<h3>Formül tablosu<\/h3>\n<table>\n<tr><th>Model<\/th><th>Formül<\/th><\/tr>\n<tr><td>n dönem TİM<\/td><td>F₀ = Σ Dₜ/(1+r)ᵗ + Fₙ/(1+r)ⁿ<\/td><\/tr>\n<tr><td>Gordon<\/td><td>F₀ = D₁/(r − g), D₁ = D₀(1+g), şart r &gt; g<\/td><\/tr>\n<tr><td>Sürdürülebilir büyüme<\/td><td>g = ÖSK × b (b = 1 − dağıtım oranı)<\/td><\/tr>\n<tr><td>BFBD<\/td><td>P₀ = HBK₁/k + BFBD; BFBD = NBD₁/(k − g)<\/td><\/tr>\n<tr><td>H-modeli<\/td><td>F₀ = D₀(1+gₗ)/(r−gₗ) + D₀·H·(gₛ−gₗ)/(r−gₗ)<\/td><\/tr>\n<tr><td>FSNA<\/td><td>FVÖK × (1 − vergi) + amortisman ve itfa − net sermaye yatırımı − ΔNİS<\/td><\/tr>\n<tr><td>ÖSNA<\/td><td>FSNA − faiz × (1 − vergi) + net borçlanma<\/td><\/tr>\n<tr><td>Özsermaye maliyeti (FVFM)<\/td><td>kÖS = rf + β × [E(rm) − rf]<\/td><\/tr>\n<tr><td>AOSM<\/td><td>ÖS/(ÖS+B) × kÖS + B/(ÖS+B) × kB × (1 − VO)<\/td><\/tr>\n<tr><td>Uç değer<\/td><td>TVₙ = FSNAₙ₊₁/(AOSM − g) veya ÖSNAₙ₊₁/(kÖS − g)<\/td><\/tr>\n<tr><td>Adil özsermaye değeri<\/td><td>Firma değeri + faaliyet dışı varlıklar − finansal borçlar; pay başına = / pay adedi<\/td><\/tr>\n<tr><td>Net aktif değeri / tasfiye değeri<\/td><td>Varlıkların piyasa (veya tasfiye) değeri − borçlar<\/td><\/tr>\n<\/table>\n", "sorular": [{"q": "Bir hissenin önümüzdeki üç yılda 3,00 TL, 3,30 TL ve 3,60 TL temettü ödemesi ve 3. yıl sonunda 50 TL'den satılması bekleniyor. Gerekli getiri yüzde 12 ise hissenin bugünkü değeri yaklaşık kaç TL'dir?", "o": ["44,43 TL", "59,90 TL", "43,46 TL", "7,87 TL", "35,59 TL"], "a": 2, "e": "F₀ = 3/1,12 + 3,30/1,12² + 53,60/1,12³ ≈ 43,46 TL. Temettüler ve satış fiyatı ayrı dönemlerine göre iskonto edilir; iskontosuz toplam 59,90 TL'dir."}, {"q": "Son ödenen temettüsü 5,00 TL olan hisse için risksiz faiz yüzde 8, piyasa risk primi yüzde 5, beta 1,2 ve sabit büyüme yüzde 6'dır. Gordon modeline göre içsel değer kaç TL'dir?", "o": ["66,25 TL", "62,50 TL", "88,33 TL", "37,86 TL", "53,00 TL"], "a": 0, "e": "r = 8 + 1,2 × 5 = %14; D₁ = 5 × 1,06 = 5,30 TL; F₀ = 5,30/(0,14 - 0,06) = 66,25 TL. D₀ kullanılırsa 62,50 TL bulunur (hata)."}, {"q": "Özsermaye kârlılığı yüzde 20 olan bir şirket kârının yüzde 70'ini temettü olarak dağıtmaktadır. ÖSK sabit kalırsa sürdürülebilir büyüme oranı kaçtır?", "o": ["%14", "%20", "%10", "%6", "%3,5"], "a": 3, "e": "g = ÖSK × tutma oranı = 0,20 × (1 - 0,70) = %6. Dağıtım oranıyla çarpmak (%14) yaygın hatadır."}, {"q": "Gelecek yıl HBK'sı 12 TL beklenen şirket kârının yüzde 50'sini dağıtıyor; yeni yatırımların ÖSK'sı yüzde 24, gerekli getiri yüzde 16'dır. Büyüme fırsatlarının bugünkü değeri (BFBD) kaç TL'dir?", "o": ["150 TL", "75 TL", "37,50 TL", "50 TL", "100 TL"], "a": 1, "e": "g = 0,24 × 0,50 = %12; P₀ = 6/(0,16 - 0,12) = 150 TL; büyümesiz değer 12/0,16 = 75 TL; BFBD = 150 - 75 = 75 TL (fiyatın yarısı)."}, {"q": "X hissesi 120 TL (k %10, HBK₁ 9 TL), Y hissesi 80 TL (k %12,5, HBK₁ 8 TL), Z hissesi 60 TL (k %15, HBK₁ 6 TL) fiyatlıdır. Büyüme fırsatlarının fiyat içindeki payı en yüksek olan hangisidir?", "o": ["X", "Y", "X ve Y eşit", "Üçünde eşit", "Z"], "a": 4, "e": "Büyümesiz değerler 90, 64 ve 40 TL; BFBD'ler 30, 16 ve 20 TL. Paylar X %25, Y %20, Z %33,3. Mutlak BFBD en yüksek X olsa da oran Z'de en yüksektir."}, {"q": "Son temettüsü 1,50 TL olan şirketin temettüleri 3 yıl yüzde 25, sonra sonsuza dek yüzde 5 büyüyecektir. Gerekli getiri yüzde 14 ise iki aşamalı modelle hisse değeri yaklaşık kaç TL'dir?", "o": ["34,18 TL", "23,07 TL", "28,50 TL", "17,50 TL", "39,61 TL"], "a": 2, "e": "D₁ 1,875; D₂ 2,344; D₃ 2,930 TL, BD toplamı ≈ 5,43 TL. D₄ = 3,076; TV₃ = 3,076/0,09 ≈ 34,18 TL; BD ≈ 23,07 TL. Toplam ≈ 28,50 TL. Terminal değeri iskonto etmemek veya ilk aşamayı unutmak tipik hatalardır."}, {"q": "Son temettüsü 2,50 TL olan şirketin yüzde 15 olan büyümesinin 12 yılda doğrusal olarak yüzde 5'e inmesi bekleniyor. Gerekli getiri yüzde 12 ise H-modeline göre değer kaç TL'dir?", "o": ["58,93 TL", "37,50 TL", "48,21 TL", "80,36 TL", "51,79 TL"], "a": 0, "e": "H = 12/2 = 6. Birinci kısım 2,50 × 1,05/0,07 = 37,50 TL; ikinci kısım 2,50 × 6 × 0,10/0,07 = 21,43 TL; toplam 58,93 TL. H yerine 12 kullanmak 80,36 TL verir."}, {"q": "FVÖK 2.000, vergi oranı yüzde 20, amortisman 400, brüt yatırım harcaması 900, eski varlık satış geliri 150, net işletme sermayesi artışı 300 milyon TL'dir. FSNA kaç milyon TL'dir?", "o": ["800", "1.250", "1.100", "950", "1.350"], "a": 3, "e": "Vergi sonrası FVÖK 1.600 + amortisman 400 - net yatırım (900 - 150 = 750) - ΔNİS 300 = 950. Varlık satışını düşmemek 800 verir."}, {"q": "FSNA'sı 950 milyon TL olan şirketin vergi öncesi faiz gideri 250 milyon TL, vergi oranı yüzde 20'dir. Yıl içinde 500 milyon TL yeni kredi kullanmış, 200 milyon TL anapara ödemiştir. ÖSNA kaç milyon TL'dir?", "o": ["1.000", "1.050", "700", "1.450", "850"], "a": 1, "e": "Vergi sonrası faiz 250 × 0,8 = 200; net borçlanma 500 - 200 = 300. ÖSNA = 950 - 200 + 300 = 1.050. Faizi vergi kalkanı olmadan düşmek 1.000 verir."}, {"q": "Risksiz faiz yüzde 15, piyasa risk primi yüzde 7, beta 1,1, vergi öncesi borç maliyeti yüzde 25, vergi oranı yüzde 25; hedef yapı yüzde 35 borç, yüzde 65 özsermayedir. AOSM yaklaşık kaçtır?", "o": ["%23,51", "%22,70", "%20,08", "%18,75", "%21,32"], "a": 4, "e": "kÖS = 15 + 1,1 × 7 = %22,7; vergi sonrası borç = 25 × 0,75 = %18,75; AOSM = 0,65 × 22,7 + 0,35 × 18,75 ≈ %21,32. Vergi kalkanı unutulursa %23,51 bulunur."}, {"q": "5. yıl FSNA'sı 800 milyon TL olan şirketin sonrasında yüzde 4 sabit büyüyeceği, AOSM'nin yüzde 16 olduğu varsayılıyor. 5. yıl sonundaki uç değerin bugünkü değeri yaklaşık kaç milyon TL'dir?", "o": ["6.933", "3.174", "3.301", "2.846", "2.476"], "a": 2, "e": "FSNA₆ = 832; TV₅ = 832/(0,16 - 0,04) ≈ 6.933; bugüne: /1,16⁵ ≈ 3.301 milyon TL. Uç değer 5. yıl sonunda tanımlandığı için 5 dönem iskonto edilir."}, {"q": "FSNA modelinde açık dönem nakit akımlarının bugünkü değeri 3.200, uç değerin bugünkü değeri 8.800 milyon TL'dir. Atıl nakit 500, yatırım amaçlı gayrimenkul 300, finansal borç 4.000 milyon TL; pay adedi 250 milyon ise pay başına adil değer kaç TL'dir?", "o": ["35,20 TL", "48,00 TL", "32,00 TL", "51,20 TL", "16,00 TL"], "a": 0, "e": "Firma değeri 12.000 + faaliyet dışı varlıklar 800 - finansal borç 4.000 = 8.800 milyon TL; /250 = 35,20 TL. Borcu düşmemek 51,20 TL verir."}, {"q": "Piyasa değerleri 800'er milyon TL ve FAVÖK'leri 160'ar milyon TL olan iki şirketten X'in net borcu yok ve net kârı 100; Y'nin net borcu 600 ve net kârı 40 milyon TL'dir. Hangisi doğrudur?", "o": ["F/K'lar 8 ve 20'dir; Y operasyonel olarak X'ten çok daha zayıftır", "FD/FAVÖK'ler eşittir, çünkü FAVÖK'ler eşittir", "F/K'lar 5 ve 8,75, FD/FAVÖK'ler 8 ve 20'dir", "F/K'lar 8 ve 20, FD/FAVÖK'ler 5 ve 8,75'tir; Y'nin F/K'sını borcun yarattığı faiz yükü şişirmektedir", "F/K sermaye yapısından bağımsız olduğu için kıyas için daha uygundur"], "a": 3, "e": "X: F/K 800/100 = 8, FD/FAVÖK 800/160 = 5. Y: F/K 800/40 = 20, FD = 1.400, FD/FAVÖK 8,75. FD/FAVÖK hem paydada faizi dışlar hem payda net borcu içerir; borçluluk farkını düzeltir."}, {"q": "A şirketinin F/K'sı 15 ve beklenen kazanç büyümesi yüzde 10; B şirketinin F/K'sı 28 ve beklenen büyümesi yüzde 40'tır. FKB oranına göre hangisi doğrudur?", "o": ["A 0,67 ile ucuz, B 1,43 ile pahalıdır", "A 1,5 ile pahalı, B 0,7 ile büyümesine göre ucuzdur", "Her ikisi de 1'in altındadır", "B, F/K'sı yüksek olduğu için her durumda pahalıdır", "A 1,5 ile ucuz, B 0,7 ile pahalıdır"], "a": 1, "e": "FKB = F/K ÷ büyüme(%). A: 15/10 = 1,5 (1'den büyük, pahalı); B: 28/40 = 0,7 (1'den küçük, ucuz). Büyüme dikkate alınınca yüksek F/K haklı çıkabilir."}, {"q": "Temettü ödeme oranı yüzde 50, özkaynak maliyeti yüzde 15, büyüme yüzde 5 olan hissenin piyasa F/K'sı 7'dir. Gerekçelendirilmiş F/K'ya göre yorum hangisidir?", "o": ["Gerekçelendirilmiş F/K 10'dur; hisse ucuzdur", "Gerekçelendirilmiş F/K 3,3'tür; hisse ucuzdur", "Gerekçelendirilmiş F/K 7'dir; hisse adil fiyatlıdır", "Gerekçelendirilmiş F/K 2,5'tir; hisse adil fiyatlıdır", "Gerekçelendirilmiş F/K 5'tir; hisse potansiyel olarak pahalıdır"], "a": 4, "e": "0,50/(0,15 - 0,05) = 5. Piyasa F/K'sı (7) gerekçelendirilmiş çarpandan yüksek olduğu için hisse potansiyel olarak pahalıdır."}, {"q": "Döngüsel bir şirketin piyasa değeri 24 milyar TL, rekor yıl net kârı 6 milyar TL, son 10 yılın reel ortalama kârı 1,6 milyar TL'dir. Klasik F/K ve CAPE ile ilgili hangisi doğrudur?", "o": ["Klasik F/K 15, CAPE 4'tür; hisse ucuzdur", "Klasik F/K 4, CAPE 15'tir; CAPE kısa vadeli al sinyali üretir", "Klasik F/K 4, CAPE 15'tir; tepe yıl kârı F/K'yı yanıltıcı biçimde düşük gösterir (Molodovsky etkisi)", "Klasik F/K 4'tür; döngüsel şirketlerde tek yıllık kâr en güvenilir veridir", "CAPE nominal kârların 5 yıllık ortalamasıyla hesaplanır"], "a": 2, "e": "24/6 = 4; 24/1,6 = 15. CAPE son 10 yılın enflasyondan arındırılmış ortalama kârını kullanır; kısa vadeli al-sat aracı değil, uzun vadeli değerleme rejimi göstergesidir."}, {"q": "Halka arz edilecek şirketin net kârı 200, FAVÖK'ü 320, net borcu 480 milyon TL, pay adedi 80 milyondur. Emsal F/K 10, emsal FD/FAVÖK 7 ise iki yönteme göre pay başına değerler nedir?", "o": ["F/K ile 25 TL, FD/FAVÖK ile 22 TL", "F/K ile 25 TL, FD/FAVÖK ile 28 TL", "F/K ile 20 TL, FD/FAVÖK ile 22 TL", "F/K ile 25 TL, FD/FAVÖK ile 34 TL", "F/K ile 22 TL, FD/FAVÖK ile 25 TL"], "a": 0, "e": "F/K: 200 × 10 = 2.000; /80 = 25 TL. FD/FAVÖK: 320 × 7 = 2.240 firma değeri; net borç düşülünce 1.760; /80 = 22 TL. Net borcu düşmemek 28 TL verir."}, {"q": "Faaliyetleri durma noktasına gelen bir şirketin varlıklarının düzenli satış (rayiç) değeri 720, acil tasfiye değeri 450, borçları 300 milyon TL'dir. Pay adedi 15 milyon ise net aktif değeri ve acil tasfiyede pay başına tutar nedir?", "o": ["450 milyon TL ve 30 TL", "420 milyon TL ve 28 TL", "720 milyon TL ve 10 TL", "420 milyon TL ve 10 TL", "150 milyon TL ve 28 TL"], "a": 3, "e": "Net aktif değeri 720 - 300 = 420 milyon TL. Acil tasfiye değeri 450 - 300 = 150 milyon TL; pay başına 10 TL. Düzenli ve zorunlu tasfiye arasında büyük fark oluşur."}, {"q": "Net aktif değeri yöntemi aşağıdaki şirketlerden hangisinde kullanılmaz?", "o": ["Gayrimenkul yatırım ortaklığı", "Patent ve know-how ağırlıklı teknoloji şirketi", "Holding (yatırım şirketi)", "Maden şirketi", "Orman işletmesi"], "a": 1, "e": "Maddi olmayan varlıkların yoğun olduğu teknoloji şirketlerinde kullanılmaz; GYO, holding ve doğal kaynak şirketlerinde en temel yöntemdir."}, {"q": "Defter değeri ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Banka ve sigorta şirketlerinin değerlemesinde birincil öneme sahiptir", "Hisse geri alımları defter değerinin gerçek değeri yansıtmasını kısıtlar", "Şirket içinde yaratılan marka değeri bilançoda aktifleştirilmez", "TMS 29 uygulamasıyla anlamlı hale getirilebilir", "Defter değeri her koşulda şirketin piyasa değeri için taban fiyattır"], "a": 4, "e": "ROE sermaye maliyetinin altındaysa şirket değer yok eder ve piyasa fiyatı defter değerinin altına (PD/DD 1'in altına) inebilir; defter değeri her zaman taban değildir."}, {"q": "FSNA ve ÖSNA yaklaşımlarıyla ilgili hangisi doğrudur?", "o": ["FSNA özsermaye maliyetiyle iskonto edilir", "FSNA'ya faizin vergi kalkanı ayrıca eklenmelidir", "ÖSNA ile bulunan değerden finansal borçlar tekrar düşülmez, yalnız faaliyet dışı varlıklar eklenir", "ÖSNA borç ödemelerinden önceki kaldıraçsız nakit akımıdır", "Sermaye yapısı değişirken ÖSNA pratikte daha güvenilirdir"], "a": 2, "e": "ÖSNA zaten faiz ve anapara sonrası olduğu için borcu tekrar düşmek mükerrer sayımdır. FSNA AOSM ile iskonto edilir; vergi kalkanı AOSM'de yansır; değişen sermaye yapısında FSNA daha kolaydır."}, {"q": "Gordon sabit büyüme modeliyle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Gerekli getiri oranı büyüme oranından büyük olmalıdır", "Yüksek ve değişken büyümeli genç teknoloji şirketleri için en uygun modeldir", "Büyüme oranının nominal GSYİH büyümesinin üzerinde seçilmesi önerilir", "Sonuçlar r ve g varsayımlarına duyarsızdır", "Pay olarak son ödenen temettü (D₀) kullanılır"], "a": 0, "e": "Model r > g şartına dayanır; olgun ve istikrarlı şirketlere uygundur; g genellikle nominal GSYİH büyümesine yakın veya altındadır; sonuç r ve g'ye aşırı duyarlıdır ve payda D₁ kullanılır."}, {"q": "Uç değer hesaplamasında değerleme pratiğinde en sık yapılan hata hangisidir?", "o": ["Uç değerin sabit büyüme modeliyle hesaplanması", "Hassasiyet tablosu sunulması", "Büyüme oranının nominal büyümenin altında seçilmesi", "Sonsuza dek pozitif büyüme varsayılırken net yatırımın sıfır (CapEx = amortisman) kabul edilmesi", "Uç değerin açık ufkun son yılına indirgenmesi"], "a": 3, "e": "Büyüme bedava değildir; g > 0 iken yatırımın durduğunu varsaymak son yıl nakit akımını yapay biçimde şişirir ve içsel değeri olduğundan yüksek gösterir."}, {"q": "Karşılaştırılabilir varlıklar (emsal) yönteminin en büyük kısıtı hangisidir?", "o": ["Veri elde etmenin zor olması", "Tüm sektör aşırı değerliyse pahalı bir hisseyi \"ucuz\" gösterebilmesi", "Yalnız zarar eden şirketlere uygulanabilmesi", "Çok sayıda varsayım ve terminal değer gerektirmesi", "Tek fiyat yasasına dayanmaması"], "a": 1, "e": "Yöntem piyasanın genel olarak doğru fiyatlandığını varsayar; sektör topluca pahalıysa göreceli değerleme yanıltır."}]}, {"id": 8, "kisa": "Teknik Analiz", "baslik": "Teknik Analiz: Elliot Dalgaları, Trendler, Göstergeler ve Formasyonlar", "ozet": "Elliot dalga kuralları ve düzeltme yapıları, trend çizgileri, hareketli ortalamalar, MACD, RSI, destek-direnç, OBO ve boşluk türleri.", "notlar": "\n<h3>Teknik analizin tanımı<\/h3>\n<ul>\n<li>Borsada işlem gören hisselerin <b>işlem hacimleri ve fiyatlarının<\/b> zaman ekseni üzerindeki grafiklerinin incelenmesine dayalı değerleme yaklaşımı.<\/li>\n<li>Sektör, beklentiler, büyüme potansiyeli, bilanço ve oranlar <b>öncelik taşımaz<\/b>; tüm ekonomik yapının alıcı-satıcı üzerindeki etkisinin grafiklere yansıdığı varsayılır.<\/li>\n<li>Grafikler lineer, logaritmik veya farklı ölçeklerle çizilebilir. En çok kullanılanlar: <b>çizgi, çubuk, mum ve sıfır-çarpı (OX)<\/b> grafikleri.<\/li>\n<li>Dört ana inceleme başlığı: <b>fiyat değişimleri, zaman ufku, işlem miktarı, genel piyasa durumu<\/b>.<\/li>\n<\/ul>\n\n<h3>Elliot dalga teorisi<\/h3>\n<ul>\n<li><b>Ralph Nelson Elliot<\/b>, 1930'larda fiyat hareketlerinin belirgin modellere göre gerçekleştiğini tespit etti. Her alım-satım kararı bilgi üretir, zincir bir döngü yaratır; modeller tekrar ettiği için tahmin edilebilir.<\/li>\n<li>Gözle görülür her yükseliş ve düşüş <b>5 dalga<\/b> halinde gelişir: <b>1, 3 ve 5<\/b> ana yön, <b>2 ve 4<\/b> düzeltme dalgalarıdır.<\/li>\n<li>Düzeltme hareketi <b>3 dalgada<\/b> tamamlanır ve dalgalar <b>harfle<\/b> (A-B-C) gösterilir. A ve C düzeltmenin yönünü belirler; B ters yönde tepki dalgasıdır.<\/li>\n<li>Her 5 dalgalık etki, kendisinden büyük bir etkinin alt dalgalarından birini oluşturur.<\/li>\n<li>Elliot toplam <b>9 dereceden<\/b> söz eder (dakikalık grafikten yüzyıllığa): grand supercycle, supercycle, cycle, primary, intermediate, minor, minute, minuette, subminuette.<\/li>\n<\/ul>\n<h4>Etki dalgaları (impulsive waves) ve kuralları<\/h4>\n<ul>\n<li>5 dalgalık hareketlerdir; tespit edilmeleri nispeten kolaydır.<\/li>\n<li><b>Kurallar:<\/b> 2. dalga hiçbir zaman 1. dalganın tümünü geri almaz; 4. dalga hiçbir zaman 3. dalganın tümünü geri almaz; 3. dalga her zaman 1. dalganın bitişini aşar; 3. dalga 1. ve 5. dalgaya göre (fiyat bakımından) <b>en kısa dalga olamaz<\/b>.<\/li>\n<li>İki tip: <b>etki (impulse) dalgası<\/b> — en sık görülen; 4. dalga hiçbir zaman 1. dalga seviyesine sarkmaz — ve <b>çapraz üçgen (takoz, diagonal)<\/b> — 5 dalgalı olup düzeltme özelliği de taşır; 4. dalga genellikle 1. dalga bölgesine sarkar.<\/li>\n<\/ul>\n<h4>Düzeltme formasyonları<\/h4>\n<table>\n<tr><th>Tür<\/th><th>Yapı<\/th><th>Ayırt edici özellik<\/th><\/tr>\n<tr><td>Zigzag<\/td><td><b>5-3-5<\/b><\/td><td>Tekli, çiftli, üçlü olabilir. B dalgası A'nın başladığı noktanın <b>aşağısında<\/b> sona erer.<\/td><\/tr>\n<tr><td>Yassı (flat)<\/td><td><b>3-3-5<\/b><\/td><td>Zigzagdan tek farkı yapıdır; B dalgası A'nın başladığı yere kadar, hatta ötesine yükselebilir.<\/td><\/tr>\n<tr><td>Üçgen<\/td><td><b>3-3-3-3-3<\/b><\/td><td>Ters yönlü iki çizgi arasında 5 adet 3 dalga; ana yöndeki direncin kırılmasıyla biter.<\/td><\/tr>\n<tr><td>Bileşik<\/td><td>Birden fazla düzeltme ardışık<\/td><td>Yükseliş geciktikçe karmaşıklaşır (ör. iki zigzag + bir yassı).<\/td><\/tr>\n<\/table>\n<ul><li>Düzeltme formasyonlarını tespit etmek etki dalgalarına göre <b>daha zordur<\/b>.<\/li><\/ul>\n\n<h3>Trendler<\/h3>\n<ul>\n<li>Fiyat analizi düşüncesi <b>19. yüzyıl sonunda Amerika'da<\/b> başlamıştır.<\/li>\n<li><b>Trend:<\/b> beklenti değişene kadar fiyatların küçük oynamalarla belirli yöne hareketi. Yükselen trend = <b>boğa piyasası<\/b> (alıcı fazla); alçalan trend = <b>ayı piyasası<\/b> (satıcı güçlü); denge dönemi = <b>yatay piyasa<\/b>.<\/li>\n<li>Yükselen trendde dip ve tepeler giderek yükselir; alçalan trendde tepeler ve dipler alçalır.<\/li>\n<li><b>Yükselen trend çizgisi dip noktaları<\/b>, alçalan trend çizgisi <b>tepe noktaları<\/b> birleştirilerek çizilir.<\/li>\n<li>Trend çizgisi ne kadar çok noktadan geçiyorsa o kadar güçlüdür. Çizgi ters yönde kırılırsa hareketin kırılma yönünde bir süre devam edeceği varsayılır; yeni uç nokta oluşunca çizgi yeniden düzeltilir.<\/li>\n<\/ul>\n\n<h3>Trend göstergeleri<\/h3>\n<p>Hareketin gücünü ve yönünü ölçen başlıca göstergeler: hareketli ortalamalar, MACD, RSI, VHF.<\/p>\n<h4>Hareketli ortalamalar<\/h4>\n<table>\n<tr><th>Tür<\/th><th>Hesap mantığı<\/th><\/tr>\n<tr><td>Basit<\/td><td>Dönem içi kapanışların aritmetik ortalaması (tüm günlere eşit ağırlık)<\/td><\/tr>\n<tr><td>Ağırlıklı<\/td><td>Son günlere ilk günlerden daha fazla ağırlık<\/td><\/tr>\n<tr><td>Üssel<\/td><td>İlk günleri ağırlıklı ortalama kadar ihmal etmez, son günlere basit ortalamadan fazla ağırlık verir<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kitaptaki 21 günlük örnekte düşüşte yönünü en önce çeviren ve ilk kırılan <b>ağırlıklı<\/b> ortalama oldu; basit ve üssel yaklaşık bir hafta geç kaldı.<\/li>\n<li>Fiyat ortalamanın üzerindeyse yükseliş, altındaysa düşüş; kısa dönem ortalama uzun dönem ortalamanın üzerindeyse yükseliş, altındaysa düşüş kabul edilir. Ortalamanın yön değiştirmesi de sinyaldir.<\/li>\n<li>Gün içi en yüksek ve en düşüklerle çizilen <b>52 günlük<\/b> ortalamalar destek ve direnç görevi görür.<\/li>\n<\/ul>\n<h4>MACD<\/h4>\n<ul>\n<li><b>26 günlük<\/b> ve <b>12 günlük<\/b> üssel hareketli ortalamaların farkı. Kesik çizgili <b>uyarı (sinyal) hattı<\/b>: MACD'nin <b>9 günlük<\/b> üssel ortalaması.<\/li>\n<li>MACD uyarı hattının üstüne çıkarsa <b>al<\/b>, altına inerse <b>sat<\/b>. Fiyat ile MACD arasındaki uyumsuzluk ters yönlü hareketin uyarısıdır; dipteki uyumsuzluk yükseliş uyarısıdır.<\/li>\n<li><b>Orta vadeli<\/b> kararlar için uygundur; kısa vadede hatalı sinyalden korunmak için diğer göstergelerle birlikte kullanılmalıdır.<\/li>\n<\/ul>\n<h4>Relatif Güç Göstergesi (RSI)<\/h4>\n<ul>\n<li>İsmi yanıltıcıdır: bir hissenin başka hisseye göre hareketini değil, kendi <b>iç gücünü (momentumunu)<\/b> gösterir.<\/li>\n<li>RSI = 100 − [100 / (1 + U/D)]; U yükseliş günlerindeki farkların ortalaması, D düşüş günlerindeki farkların ortalaması. 0–100 arasında değişir.<\/li>\n<li>Önerilen gün sayısı <b>14<\/b>; 9 ve 20 günlük de yaygın. Gün sayısı azaldıkça oynaklık artar.<\/li>\n<li>Beş kullanım: (1) <b>70 üstünde tepe, 30 altında dip<\/b>; (2) fiyatta görülmeyen formasyonlar (OBO, takoz, ikili dip/tepe); (3) dönüş işaretleri: 70'i aşağı, 30'u yukarı kesme; (4) fiyatta görülemeyen destek-dirençler; (5) uyumsuzluk.<\/li>\n<\/ul>\n<h4>VHF<\/h4>\n<ul><li>Kitapta üçgen düzeltme örneğinde VHF'nin sürekli azalarak yatay trendi onayladığı belirtilir. VHF trendin <b>yönünü değil gücünü<\/b> gösterir: yükselen VHF güçlü bir trende (yukarı ya da aşağı), azalan VHF yatay piyasaya işaret eder.<\/li><\/ul>\n\n<h3>Kanallar, destek ve direnç<\/h3>\n<ul>\n<li>Fiyatlar paralel iki çizgi arasında hareket edebilir; talep artınca üst, azalınca alt banda gider. Fiyatın bir banda yaslanması o yönde kırılma ihtimalini güçlendirir; bandların ortasından çizilen çizgi orta vadeli hattır.<\/li>\n<li>Psikolojik yorum: <b>alt band kötümserlik, üst band iyimserlik<\/b>, orta çizgi normal. Alt band kırılırsa <b>aşırı satış<\/b>, üst band kırılırsa <b>aşırı alış (alım çılgınlığı)<\/b> beklenir. Kitap örneğinde üst band kırılınca fiyat iki haftada ikiye katlandı; çılgınlık bitince önce üst bandda tutunmaya çalıştı, sonra kanala döndü.<\/li>\n<li><b>Direnç<\/b> yükselişte, <b>destek<\/b> düşüşte duraksanan seviyedir. Oluşum nedenleri: önceki duraksama seviyeleri, <b>fiyat basamağının değiştiği<\/b> seviyeler, hareket sonundaki tepkiler.<\/li>\n<li>Direnç ve destek kırılırken genellikle <b>işlem hacmi artar<\/b>.<\/li>\n<li><b>Rol değişimi:<\/b> kırılan direnç düşüşte destek olur (daha önce satanlar aynı fiyattan geri almak ister); kırılan destek yükselişte direnç olur (zarardaki alıcılar maliyetine gelince satar).<\/li>\n<\/ul>\n\n<h3>Formasyonlar<\/h3>\n<ul>\n<li>Alıcı-satıcı işlemlerinin grafikte bıraktığı izler. Kritik seviyelerin geçilmesi formasyonun bittiğini ve hareketin bozulma yönünde gelişeceğini haber verir.<\/li>\n<li><b>Omuz-Baş-Omuz (OBO):<\/b> trend dönüşü işaret eder. Sol omuz (A) yüksek hacimle; baş (B) yeni tepe ama hacim sol omuzdan azdır; sağ omuz çok daha düşük hacimle oluşur (alıcılar zayıflamış). Dipleri birleştiren <b>boyun çizgisi<\/b> kritik destektir; satış sinyali boyun çizgisinin <b>yüksek hacimle kırılmasıdır<\/b>. Sonrasında boyun çizgisine geri dönüş çabası genellikle <b>son satış fırsatıdır<\/b>. Dipte görülen <b>ters OBO<\/b> düşüşün bittiğini, yükselişin başladığını haber verir.<\/li>\n<li><b>İkili tepe:<\/b> talep fiyatı daha yukarı götüremez, yükseliş önceki tepe civarında biter. <b>İkili dip:<\/b> tersi; önceki dipte yeniden alım gelir ve yükseliş başlar (kitap örneğinde MACD ikinci düşüşte yeni dip yapmadı).<\/li>\n<\/ul>\n<h4>Boşluklar (gap)<\/h4>\n<table>\n<tr><th>Tür<\/th><th>Nerede<\/th><th>Anlamı<\/th><\/tr>\n<tr><td>Olağan<\/td><td>Özellikle işlem miktarı dar hisseler<\/td><td>Gelecek açısından önem taşımaz<\/td><\/tr>\n<tr><td>Kaçış<\/td><td>Fiyat formasyondan/trendden kurtulurken<\/td><td>Trend sonu; hızlı hareket beklenir; genelde artan hacimle; hacim artmazsa kapanma ihtimali artar<\/td><\/tr>\n<tr><td>Ölçüm<\/td><td>Ralli ortası<\/td><td>Fiyatın, yükselişin başladığı yer ile boşluk arası kadar daha gideceği varsayılır; boşluk toplam çıkışın yaklaşık ortasıdır<\/td><\/tr>\n<tr><td>Tükeniş<\/td><td>Ralli sonu<\/td><td>Kapanması rallinin bittiğini ve ters hareketin bir süre süreceğini gösterir<\/td><\/tr>\n<\/table>\n<ul><li>Boşluklar işlem miktarı çok fazla olan hisselerde görülürse dikkatle değerlendirilmelidir.<\/li><\/ul>\n\n<h3>Kullanım amacı ve sınav tuzakları<\/h3>\n<ul>\n<li>Teknik analiz, alım ya da satım kararı verenler için <b>alış ve satış bölgelerini belirlemede<\/b> önemli bir yardımcıdır. Genel beklentiler (makro, sektör) aynı olsa da her hisse kendi şirketinin beklentilerine göre farklı fiyat hareketi gösterebilir.<\/li>\n<li>Formasyon fiyat ya da gösterge grafiğinde tespit edildiğinde muhtemel gelişimi kestirilebilir; kritik seviyelerin geçilmesi hareketin <b>bozulma yönünde<\/b> gelişeceğini haber verir.<\/li>\n<li>Bir kanal içinde hareket ettiği kesinleşen hisseler uygun alış-satış fırsatları verir. OBO'da dipleri birleştiren destek (boyun) çizgisi genellikle paralel ya da paralele yakındır.<\/li>\n<li>Kitaptaki hareketli ortalama örneğinde yükselişlerin başladığı dönemde üç ortalamanın birbirine <b>yakınsaması<\/b> dikkat çeker.<\/li>\n<li>Dikkat: Elliot'ta etki dalgaları rakamla (1–5), düzeltme dalgaları <b>harfle<\/b> (A-B-C) gösterilir.<\/li>\n<li>Dikkat: RSI başka hisseye göre değil, hissenin kendi momentumunu ölçer; MACD orta vadeli kararlar içindir.<\/li>\n<li>Dikkat: <b>olağan boşluk<\/b> işlem miktarı dar hisselerde görülür ve önemsizdir; işlem miktarı çok yüksek hisselerdeki boşluklar dikkatle izlenmelidir.<\/li>\n<li>Dikkat: kırılan direnç desteğe, kırılan destek dirence dönüşür (rol değişimi).<\/li>\n<\/ul>\n\n<h3>Formül ve parametre tablosu<\/h3>\n<table>\n<tr><th>Gösterge / kural<\/th><th>Değer<\/th><\/tr>\n<tr><td>RSI<\/td><td>100 − 100/(1 + U/D); 14 gün; 70 üstü aşırı alım/tepe, 30 altı aşırı satım/dip<\/td><\/tr>\n<tr><td>MACD<\/td><td>EMA(12) ile EMA(26) farkı; sinyal hattı MACD'nin 9 günlük EMA'sı<\/td><\/tr>\n<tr><td>Ölçüm boşluğu hedefi<\/td><td>Hedef ≈ boşluk seviyesi + (boşluk seviyesi − yükselişin başladığı seviye)<\/td><\/tr>\n<tr><td>Elliot<\/td><td>Etki 5 dalga (1-3-5 ana yön), düzeltme 3 dalga (A-B-C); 9 derece<\/td><\/tr>\n<tr><td>Düzeltmeler<\/td><td>Zigzag 5-3-5, yassı 3-3-5, üçgen 3-3-3-3-3<\/td><\/tr>\n<\/table>\n", "sorular": [{"q": "Elliot dalga teorisine göre bir etki hareketinde ana yönü belirleyen dalgalar hangileridir?", "o": ["2 ve 4", "A ve C", "1, 3 ve 5", "1, 2 ve 3", "B ve 4"], "a": 2, "e": "1, 3 ve 5 numaralı dalgalar ana doğrultuyu, 2 ve 4 düzeltmeleri oluşturur. A ve C ise düzeltme hareketinin yönünü belirleyen dalgalardır."}, {"q": "Elliot etki dalgası kurallarına ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["3. dalga, fiyat bakımından 1. ve 5. dalgalara göre en kısa dalga olabilir", "2. dalga hiçbir zaman 1. dalganın tümünü geri almaz", "4. dalga hiçbir zaman 3. dalganın tümünü geri almaz", "3. dalga her zaman 1. dalganın bitiş noktasını aşar", "Klasik etki dalgasında 4. dalga 1. dalga seviyesine sarkmaz"], "a": 0, "e": "Kurala göre 3. dalga 1. ve 5. dalgalarla karşılaştırıldığında en kısa dalga olamaz."}, {"q": "Elliot toplam kaç dalga derecesinden söz etmektedir?", "o": ["5", "3", "7", "9", "12"], "a": 3, "e": "Elliot, dakikalık grafiklerden yüzyıllık grafiklere kadar 9 dereceden bahseder (grand supercycle'dan subminuette'e)."}, {"q": "Beş dalgalık olmakla birlikte düzeltme dalgası özellikleri de taşıyan ve 4. dalganın genellikle 1. dalga bölgesine sarktığı yapı hangisidir?", "o": ["Zigzag düzeltme", "Çapraz üçgen (diagonal, takoz)", "Yassı düzeltme", "Bileşik düzeltme", "Klasik etki (impulse) dalgası"], "a": 1, "e": "Çapraz üçgenler 5 dalgalı etki dalgalarıdır ama düzeltme özelliği taşır; klasik etki dalgasından farklı olarak 4. dalga genellikle 1. dalga bölgesine sarkar."}, {"q": "Düzeltme formasyonlarının dalga yapıları aşağıdakilerin hangisinde doğru eşleştirilmiştir? I. Zigzag: 5-3-5  II. Yassı: 3-3-5  III. Üçgen: 3-3-3-3-3", "o": ["Yalnız I", "Yalnız II", "I ve II", "II ve III", "I, II ve III"], "a": 4, "e": "Kitaba göre zigzag 5-3-5, yassı 3-3-5, üçgen 3-3-3-3-3 yapısındadır; üç eşleştirme de doğrudur.", "k": 1}, {"q": "Bir düzeltmede A dalgası fiyatı 200 TL'den 160 TL'ye indirmiş, B dalgası 202 TL'ye kadar yükselmiş, C dalgası fiyatı 155 TL'ye düşürmüştür. Bu düzeltme için en uygun nitelendirme hangisidir?", "o": ["Zigzag düzeltme; B dalgası A'nın başlangıcının altında kalmıştır", "Etki dalgası; 3. dalga en uzundur", "Yassı düzeltme; B dalgası A'nın başladığı seviyeye ulaşıp onu aşmıştır", "Üçgen düzeltme; beş adet üç dalga vardır", "Çapraz üçgen; 4. dalga 1. dalgaya sarkmıştır"], "a": 2, "e": "Zigzagda B dalgası A'nın başladığı noktanın aşağısında sona erer. Yassı düzeltmede B, A'nın başladığı yere kadar, hatta ötesine yükselebilir; burada B 202 TL ile A'nın başlangıcını (200 TL) aşmıştır."}, {"q": "Elliot etki dalgasında 1. dalga 40 TL'den 55 TL'ye yükselmiştir. 2. dalganın 1. dalga uzunluğunun yüzde 61,8'i kadar geri çekileceği, 3. dalganın 2. dalga dibinden başlayıp 1. dalga uzunluğunun 1,618 katı kadar yükseleceği varsayılırsa 3. dalganın tepe hedefi kaç TL'dir?", "o": ["70,00 TL", "79,27 TL", "64,27 TL", "45,73 TL", "73,27 TL"], "a": 0, "e": "1. dalga 15 TL; geri çekilme 15 × 0,618 = 9,27 TL, dip 45,73 TL. 3. dalga 15 × 1,618 = 24,27 TL; hedef 45,73 + 24,27 = 70,00 TL. 3. dalgayı 55 TL'den başlatmak 79,27 TL gibi hatalı sonuç verir."}, {"q": "Yükselen bir trend çizgisi nasıl çizilir?", "o": ["Tepe noktalarının birleştirilmesiyle", "Kapanış fiyatlarının ortalamasıyla", "İlk ve son işlem gününün birleştirilmesiyle", "Dip noktalarının birleştirilmesiyle", "En yüksek hacimli günlerin birleştirilmesiyle"], "a": 3, "e": "Yükselen trend çizgisi dip noktalarının, alçalan trend çizgisi tepe noktalarının birleştirilmesiyle oluşturulur."}, {"q": "Dönem içindeki son günlere ilk günlere göre daha fazla ağırlık veren, ancak ilk günleri üssel ortalama kadar dikkate almayan hareketli ortalama türü hangisidir?", "o": ["Basit hareketli ortalama", "Ağırlıklı hareketli ortalama", "Üssel hareketli ortalama", "52 günlük destek ortalaması", "MACD sinyal hattı"], "a": 1, "e": "Ağırlıklı ortalama son günlere daha çok ağırlık verir; üssel ortalama ise ilk günleri ağırlıklı ortalama kadar ihmal etmeden son günlere basit ortalamadan fazla ağırlık verir."}, {"q": "MACD göstergesi ve uyarı hattı ile ilgili hangisi doğrudur?", "o": ["MACD, 14 günlük RSI'ın 9 günlük basit ortalamasıdır", "MACD, 21 ve 52 günlük basit ortalamaların farkıdır", "Uyarı hattı MACD'nin 12 günlük ağırlıklı ortalamasıdır", "MACD kısa vadeli işlemlerde tek başına kullanılmalıdır", "MACD, 26 ve 12 günlük üssel ortalamaların farkıdır; uyarı hattı MACD'nin 9 günlük üssel ortalamasıdır"], "a": 4, "e": "MACD 26 günlük ve 12 günlük üssel ortalamaların farkıdır; kesik çizgili uyarı hattı MACD'nin 9 günlük üssel ortalamasıdır. Orta vadeli kararlar için uygundur, kısa vadede diğer göstergelerle kullanılmalıdır."}, {"q": "Fiyat birinci dipte 60 TL, daha derin ikinci dipte 50 TL'yi görürken MACD birinci dipte -4,5, ikinci dipte -2,0 seviyesinde oluşmuş ve uyarı hattını yukarı kesmiştir. Bu görünüm neye işaret eder?", "o": ["Düşüşün hızlanarak süreceği", "Tükeniş boşluğu", "Dipte uyumsuzluk; yükseliş yönünde dönüş uyarısı", "Aşırı alım bölgesi", "Omuz-baş-omuz formasyonunun tamamlanması"], "a": 2, "e": "Fiyat yeni dip yaparken göstergenin daha yüksek dip yapması uyumsuzluktur; MACD'nin uyarı hattının üstüne çıkması da al sinyalidir. Dipteki uyumsuzluk yükseliş uyarısıdır."}, {"q": "Bir hissede son 14 günde yükseliş günlerindeki farkların ortalaması 1,2 TL, düşüş günlerindeki farkların ortalaması 0,8 TL'dir. RSI kaçtır?", "o": ["60", "40", "66,7", "33,3", "150"], "a": 0, "e": "U/D = 1,2/0,8 = 1,5; RSI = 100 - 100/(1 + 1,5) = 100 - 40 = 60. 40, tersini almanın sonucudur."}, {"q": "RSI göstergesi ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Önerilen gün sayısı 14'tür", "Gün sayısı azaldıkça göstergenin oynaklığı artar", "70 seviyesinin üstünde tepe, 30 seviyesinin altında dip yapar", "Bir hissenin başka bir hisseye göre göreceli hareketini ölçer", "Fiyat grafiğinde görülmeyen formasyonlar RSI'da görülebilir"], "a": 3, "e": "Adına rağmen RSI bir hissenin diğerine göre hareketini değil, kendi iç gücünü yani momentumunu tanımlar."}, {"q": "Kanal analizinde psikolojik yaklaşıma göre kanalın üst bandının kırılması neyi ifade eder?", "o": ["Kötümserlik hattının aşıldığını ve aşırı satışı", "İyimserlik bandının aşıldığını ve aşırı alış beklentisini", "Normal seviyeye dönüşü", "Trendin kesin olarak sona erdiğini ve satış gerektiğini", "Olağan bir boşluğu"], "a": 1, "e": "Alt band kötümserliği, üst band iyimserliği, orta çizgi normali temsil eder. Üst band kırılırsa aşırı alış (alım çılgınlığı) beklenir."}, {"q": "Daha önce güçlü bir destek olan seviyenin, kırıldıktan sonra fiyat yeniden oraya geldiğinde dirence dönüşmesinin nedeni hangisidir?", "o": ["Merkez bankasının faiz kararları", "Ölçüm boşluğunun kapanması", "MACD'nin uyarı hattını yukarı kesmesi", "Kısa dönem ortalamanın uzun dönem ortalamanın üzerine çıkması", "O seviyeden alım yapıp zarara düşen yatırımcıların fiyat maliyetlerine gelince satış yapması"], "a": 4, "e": "Destek kırılınca o seviyede alanlar umutlarını kaybeder ve fiyat maliyetlerine geldiğinde satar; arz talebi aşar ve eski destek direnç olur."}, {"q": "Omuz-baş-omuz formasyonunda satış sinyali ve trend dönüşünün teyidi nasıl oluşur?", "o": ["Sağ omzun sol omuzdan yüksek hacimle oluşmasıyla", "Başın düşük hacimle oluşmasıyla", "Boyun çizgisinin yüksek işlem miktarıyla kırılmasıyla", "Sol omzun belirginleşmesiyle", "Boyun çizgisinin düşük hacimle yukarı kırılmasıyla"], "a": 2, "e": "Teyit boyun çizgisinin yüksek hacimle kırılmasıdır. Kırılma sonrası boyun çizgisine geri dönüş çabası genellikle son satış fırsatıdır."}, {"q": "Omuz-baş-omuz formasyonunda işlem hacmi ile ilgili tipik görünüm hangisidir?", "o": ["Sağ omuz, önceki omuz ve başın oldukça altında bir hacimle oluşur", "Baş, sol omuzdan daha yüksek hacimle oluşur", "Sağ omuz en yüksek hacimle oluşur", "Hacim formasyon boyunca sabit kalır", "Sol omuz en düşük hacimle oluşur"], "a": 0, "e": "Sol omuz yüksek hacimle oluşur; baştaki hacim genellikle sol omuzdakinden azdır; sağ omuz çok daha düşük hacimle oluşur ve alıcıların zayıfladığını gösterir."}, {"q": "Ralli ortalarında görülen ve fiyatın, yükselişin başladığı yer ile boşluğun oluştuğu yer arası kadar daha gideceği varsayılan boşluk türü hangisidir?", "o": ["Kaçış boşluğu", "Tükeniş boşluğu", "Olağan boşluk", "Ölçüm boşluğu", "Ters boşluk"], "a": 3, "e": "Ölçüm boşlukları ralli ortasında görülür; boşluk toplam çıkışın yaklaşık ortasıdır."}, {"q": "Yükselişin 80 TL'den başladığı bir rallide 104 TL seviyesinde bir ölçüm boşluğu oluşmuştur. Teorik fiyat hedefi kaç TL'dir?", "o": ["104 TL", "128 TL", "184 TL", "112 TL", "156 TL"], "a": 1, "e": "Ölçüm boşluğu çıkışın yaklaşık ortasıdır: 104 - 80 = 24 TL daha gidileceği varsayılır; hedef 104 + 24 = 128 TL."}, {"q": "Ralli sonlarında görülen ve kapanması rallinin sona erdiğini gösteren boşluk türü hangisidir?", "o": ["Ölçüm boşluğu", "Kaçış boşluğu", "Olağan boşluk", "Formasyon boşluğu", "Tükeniş boşluğu"], "a": 4, "e": "Tükeniş boşlukları ralli sonlarında görülür; boşluğun kapanması rallinin bittiğini ve ters yöndeki hareketin bir süre devam edeceğini gösterir."}, {"q": "Fiyatın bir formasyondan kurtulduğunda görülen, genellikle artan işlem miktarıyla birlikte oluşan ve sonrasında hacim artmazsa kapanma ihtimali yükselen boşluk hangisidir?", "o": ["Olağan boşluk", "Tükeniş boşluğu", "Kaçış boşluğu", "Ölçüm boşluğu", "Ada boşluğu"], "a": 2, "e": "Kaçış boşluğu trendden çıkışı gösterir; trend boşlukla kırılıyorsa hızlı hareket beklenir."}, {"q": "Bir hissenin VHF göstergesi fiyat hızla düşerken 0,25'ten 0,70'e yükselmiştir. Doğru yorum hangisidir?", "o": ["Düşüş yönlü trendin güçlendiğini gösterir; VHF yön değil trendin gücü hakkında bilgi verir", "Fiyatın yakında yukarı döneceğini gösterir", "Piyasanın yatay seyre girdiğini gösterir", "Aşırı satım sinyalidir, hemen alım yapılmalıdır", "Tükeniş boşluğu oluştuğunu gösterir"], "a": 0, "e": "VHF trendin gücünü ölçer; yükselen VHF hareketin güçlü bir trende dönüştüğünü gösterir, yön bilgisini fiyat grafiği verir. Azalan VHF yatay trendi onaylar."}, {"q": "Teknik analizde en çok kullanılan grafik türleri arasında aşağıdakilerden hangisi yer almaz?", "o": ["Çizgi grafiği", "Çubuk grafik", "Mum grafiği", "Pasta grafiği", "Sıfır-çarpı (OX) grafiği"], "a": 3, "e": "Kitaba göre en çok kullanılanlar çizgi, çubuk, mum ve sıfır-çarpı (OX) grafikleridir."}]}, {"id": 9, "kisa": "Tahvil ve Bono Değerlemesi", "baslik": "Sermaye Piyasası Araçlarının Değerlemesi: Tahvil ve Bono", "ozet": "Tahvil değeri ve verimler, spot-başa baş-vadeli faizler, arbitrajsız fiyatlama, süre, konveksite, getiri bileşenleri, kotasyon, makaslar, EDT, DFT ve bono.", "notlar": "\n<h3>Menkul kıymet ve sabit getirili araçlar<\/h3>\n<ul>\n<li><b>Menkul kıymet:<\/b> ortaklık veya alacaklılık sağlayan, belli bir meblağı temsil eden, yatırım aracı olarak kullanılan, dönemsel gelir getiren, misli nitelikte, seri halinde çıkarılan, itibari değeri olan kıymetli evrak.<\/li>\n<li>Sabit getirili menkul değerler sahibine gelecekte nakit akışı sağlayan borçlanma araçlarıdır; getirisi piyasa faizine veya enflasyona bağlı olanlar da vardır. Gerçekleşen getiri çoğu zaman öngörülenden farklıdır. Dünyada toplam piyasa değeri bakımından diğer araçların önündedir; risk ve getirileri genellikle hisse senedinden düşüktür.<\/li>\n<li><b>Tahvil:<\/b> uzun vadeli borçlanma aracı; dönemsel faiz (yıllık, altı aylık, üç aylık) ve vadede anapara öder. Devlet ve özel sektör tahvili olarak ikiye ayrılır. Türkiye'de vadeler <b>iki yıldan<\/b> başlar, özel sektörde <b>7 yıla<\/b>, devlette daha uzuna çıkar; gelişmiş ekonomilerde 20–30 yıl ve üzeri vardır.<\/li>\n<\/ul>\n\n<h3>Tahvil yatırımında riskler<\/h3>\n<table>\n<tr><th>Risk<\/th><th>Özü<\/th><\/tr>\n<tr><td>Anapara ve faizin ödenmeme<\/td><td>İhraççının finansal bozulması; özel sektör için önemli, devlet için bile geçerli olabilir. Moody's, S&amp;P, Fitch gibi kuruluşlar derecelendirir; risk arttıkça borçlanma faizi artar.<\/td><\/tr>\n<tr><td>Faiz oranı<\/td><td>Çıkarılmış tahvilleri en çok etkileyen risk: faiz artarsa fiyat düşer, faiz düşerse tahvil prim yapar.<\/td><\/tr>\n<tr><td>Enflasyon<\/td><td>Tahmin edilen ve edilmeyen olarak ikiye ayrılır; tam tahmin edilirse teorik olarak risk oluşmaz.<\/td><\/tr>\n<tr><td>Vade<\/td><td>Vade uzadıkça belirsizlik ve talep edilen faiz artar.<\/td><\/tr>\n<tr><td>Likidite<\/td><td>Piyasanın büyüklüğü ve derinliğine bağlıdır; <b>alış-satış fiyatı farkı<\/b> ile ölçülür. Kurumsal yatırımcılar büyük ihraçları tercih eder.<\/td><\/tr>\n<tr><td>Erken itfa (call)<\/td><td>İhraççının tahvili vadeden önce geri çağırma riski.<\/td><\/tr>\n<\/table>\n\n<h3>Tahvil değeri, verim kavramları ve karar kuralı<\/h3>\n<ul>\n<li>Tahvil değeri, gelecekteki faiz ve anapara akışlarının <b>piyasa faizi veya arzu edilen verimle<\/b> iskonto edilmiş bugünkü değeridir.<\/li>\n<li><b>Nominal verim<\/b> = kupon faiz oranı. <b>Cari verim<\/b> = yıllık kupon / tahvil değeri (kitap: %11 kupon, 7 yıl, piyasa %10 → değer 1.048,68 TL (kitap metninde 1.048,72), cari verim %10,49).<\/li>\n<li><b>Vadeye kadar verim (YTM):<\/b> piyasa değeri verildiğinde tahvilin iç verim oranı. Varsayımlar: tahvil <b>vadeye kadar elde tutulur<\/b> ve ara nakit akışları <b>aynı oranla yeniden yatırılır<\/b>.<\/li>\n<li>Kupon piyasa faizinden yüksekse değer nominalin üzerindedir (primli), düşükse altındadır (iskontolu).<\/li>\n<li><b>Yarı yıllık kupon:<\/b> kitap yıllık bileşik faizi altı aylık eşdeğere çevirir: √(1+i) − 1 (ör. %10 → %4,881); kupon ikiye bölünür, dönem sayısı ikiyle çarpılır.<\/li>\n<li><b>Dönem içi değerleme:<\/b> bir sonraki kupona kalan gün/365 kesirli üs olarak kullanılır (kitap örneği: 253 gün, %9 → 1.052,78 TL).<\/li>\n<\/ul>\n<table>\n<tr><th>Durum<\/th><th>Karar<\/th><th>Gerekçe<\/th><\/tr>\n<tr><td>r = i<\/td><td>Kayıtsız kal<\/td><td>Tahvil gerçek değerinde<\/td><\/tr>\n<tr><td>r &gt; i<\/td><td><b>Satın al<\/b><\/td><td>Tahvil düşük değerlenmiş<\/td><\/tr>\n<tr><td>r &lt; i<\/td><td>Satın alma<\/td><td>Tahvil yüksek değerlenmiş<\/td><\/tr>\n<\/table>\n<p>r: vadeye kadar verim, i: piyasa faizi / arzu edilen verim.<\/p>\n\n<h3>Spot, başa baş ve vadeli faizler<\/h3>\n<ul>\n<li><b>Spot faiz:<\/b> kupon ödemesiz (sıfır kuponlu) hazine tahvillerinden türetilir: <b>sıfır faizler (zero rates)<\/b>. Kuponsuz faizlerin oluşturduğu eğri <b>spot eğrisi<\/b>; vade yapısını temsil eder. Temerrüt riski ve kupon etkisi içermediği için değerlemede kullanılır. Kitap: 100 TL 5 yılda 150 TL → kesikli %8,44, sürekli %8,11.<\/li>\n<li><b>İskonto faktörü:<\/b> DF = 1/(1+z)ⁿ veya e<sup>−zn<\/sup>; vade ve faiz arttıkça azalır.<\/li>\n<li><b>Başa baş (par) faiz:<\/b> kuponlu tahvilin nominalde işlem görmesini sağlayan kupon oranı; spot eğrisi pozitif eğimliyse başa baş faizler spot faizlerin <b>altındadır<\/b>.<\/li>\n<li><b>Vadeli (forward) faiz:<\/b> spot faizlerin gelecekteki beklenen değerleri; gelecekteki faiz tahmini, fiyatlama, eğri analizi ve risk yönetiminde kullanılır. Spot faizler vadeli faizlerin <b>geometrik ortalamasıdır<\/b>.<\/li>\n<li>Pozitif eğimli eğride sıralama: <b>vadeli &gt; spot &gt; başa baş<\/b>; negatif eğimde tersi (başa baş en yüksek, vadeli en düşük) ve faizlerde düşüş beklentisi.<\/li>\n<\/ul>\n<table>\n<tr><th>Vade<\/th><th>Spot<\/th><th>İskonto faktörü<\/th><th>Başa baş<\/th><th>Vadeli (1 yıllık)<\/th><\/tr>\n<tr><td>1<\/td><td>%15,00<\/td><td>0,8696<\/td><td>%15,00<\/td><td>%15,00<\/td><\/tr>\n<tr><td>2<\/td><td>%15,50<\/td><td>0,7496<\/td><td>%15,46<\/td><td>%16,00<\/td><\/tr>\n<tr><td>3<\/td><td>%16,00<\/td><td>0,6407<\/td><td>%15,90*<\/td><td>%17,00<\/td><\/tr>\n<tr><td>4<\/td><td>%16,50<\/td><td>0,5429<\/td><td>%16,31<\/td><td>%18,00<\/td><\/tr>\n<tr><td>5<\/td><td>%17,00<\/td><td>0,4561<\/td><td>%16,69<\/td><td>%19,00<\/td><\/tr>\n<\/table>\n<p>* Kitapta 3 yıllık başa baş oran metindeki çözümde %15,69, tabloda %15,90 olarak yer alır; doğru hesap (100 − 64,07) / (0,8696 + 0,7496 + 0,6407) ≈ %15,90'dır.<\/p>\n\n<h3>Arbitrajsız fiyatlama ve bootstrapping<\/h3>\n<ul>\n<li><b>Arbitraj:<\/b> aynı özellikteki varlıkların farklı fiyatlardan işlem görmesinden doğan risksiz kazanç. <b>Arbitrajsız fiyatlama ilkesi<\/b> <b>tek fiyat kanununa<\/b> (aynı nakit akışı = aynı fiyat) dayanır ve <b>risk nötr fiyatlama<\/b> yaklaşımını esas alır (varlıklar risksiz faizle fiyatlanır). Her nakit akışı kendi vadesinin spot faiziyle iskonto edilir.<\/li>\n<li>Tahvil adil değerinden <b>pahalıysa<\/b>: tahvilde kısa (satış), aynı nakit akışlarını yaratan sentetik portföyde (kuponsuz tahviller) uzun pozisyon. <b>Ucuzsa<\/b>: tahvilde uzun, sentetikte kısa. Kazanç = fiyat farkı. Kitap: spotlar %12, %15, %18; %10 kuponlu 3 yıllık tahvil 83,44 TL (YTM %17,56); piyasada 85 TL ise kazanç 1,56 TL.<\/li>\n<li><b>Bootstrapping:<\/b> farklı vade ve kupondaki tahvil fiyatlarından sırayla iskonto faktörleri türetilir, sonra yeni tahvilin akışları bu faktörlerle iskonto edilir.<\/li>\n<li>Vadeli faizlerle değerleme: her akış, vadeye kadarki vadeli faizlerin çarpımıyla iskonto edilir (kitap: %20; %22,5; %23 vadeli faizlerle %9 kuponlu 3 yıllık tahvil 73,91).<\/li>\n<\/ul>\n\n<h3>Tahvil fiyatında değişkenlik (volatilite)<\/h3>\n<ul>\n<li>Tahvil değeri dört faktöre bağlıdır: nominal değer, kupon faizi, vade, piyasa faizi; en önemlisi <b>piyasa faizi<\/b> (ters yönlü ilişki).<\/li>\n<li>Vade uzadıkça faize duyarlılık artar; kalan süre uzadıkça faiz riski <b>azalarak artar<\/b>.<\/li>\n<li>Aynı mutlak faiz değişimi simetrik etki yaratmaz: <b>faiz düşüşünün fiyatı artırması, aynı artışın düşürmesinden fazladır<\/b>.<\/li>\n<li>Faiz riski kupon faiziyle <b>ters<\/b> ilişkilidir: yüksek kuponlu tahvil daha az tepki verir (kitap: 10 yıllık tahvilde %8'den %10'a geçişte %6 kuponda -%13, %12 kuponda -%11,5).<\/li>\n<\/ul>\n\n<h3>Süre (durasyon) ölçüleri<\/h3>\n<ul>\n<li><b>Macaulay süresi:<\/b> nakit akışlarının gerçekleşme dönemlerinin bugünkü değer ağırlıklı ortalaması (kitap: 10 yıl, %8 kupon, %10 faiz → 877,05 TL, MD 7,04 yıl, düzeltilmiş süre 6,40; faiz %9'a inince +56,13 TL, 933,18 TL).<\/li>\n<li>Özellikler: süre <b>vadeden kısadır<\/b> (kuponsuzda vadeye eşit); kupon arttıkça süre kısalır; süre vadeyle genellikle azalarak artar; <b>YTM yükseldikçe süre kısalır<\/b>.<\/li>\n<li>Kuponsuz tahvilin süresi ve faiz riski aynı özellikteki kuponlu tahvilden fazladır; kuponlu tahvilde ise <b>yeniden yatırım riski<\/b> doğar.<\/li>\n<li><b>Sonsuz kuponlu tahvil:<\/b> MD = (1+r)/r (r %10 → 11).<\/li>\n<li><b>Düzeltilmiş süre:<\/b> MD/(1+r); yarı yıllık kuponda MD/(1+r/2). ΔP/P ≈ −D<sub>mod<\/sub> × Δi.<\/li>\n<li><b>Baz noktası değeri (DV01, para durasyonu):<\/b> 1 baz puanlık değişimde fiyat değişimi; (ΔP⁺ + ΔP⁻)/2 veya BPV = D<sub>mod<\/sub> × P × 0,0001 (kitap: 92,7904 TL, D<sub>mod<\/sub> 3,69 → 0,0343).<\/li>\n<li><b>Efektif süre:<\/b> nakit akışları belirsizken (alım/satım opsiyonlu kompleks tahviller) uygundur; geleneksel tahvillerde de kullanılabilir. EfD = (P⁻ − P⁺)/(2 × ΔY × P₀).<\/li>\n<li><b>Kısmi süre (key rate, KR01):<\/b> getiri eğrisinin paralel olmayan hareketlerine duyarlılık; KR01'lerin toplamı DV01'e eşittir. Piyasada <b>2, 5, 10 ve 30 yıllık<\/b> vadeler anahtar vade kabul edilir; ara vadeler doğrusal enterpolasyonla bulunur.<\/li>\n<li><b>Süre açığı:<\/b> BPV<sub>g<\/sub> = BPV<sub>L<\/sub> − BPV<sub>A<\/sub>. <b>Pozitif açık<\/b> (varlık süresi uzun): faiz artış riski ağır basar. <b>Negatif açık<\/b> (yükümlülük süresi uzun): faiz düşüş riski ağır basar; faiz düşünce yükümlülük değeri varlıklardan fazla artar ve özkaynak azalır.<\/li>\n<\/ul>\n\n<h3>Konveksite<\/h3>\n<ul>\n<li>Fiyat-faiz ilişkisinin doğrusal olmaması; süre birinci türev, konveksite <b>ikinci türevdir<\/b>. Süre küçük değişimlerde geçerlidir; büyük değişimlerde konveksite eklenir.<\/li>\n<li>Pozitif konveksite <b>arzu edilen<\/b> özelliktir: faiz düşünce fiyat daha hızlı artar, faiz yükselince daha yavaş düşer; volatil dönemde avantaj.<\/li>\n<li>Kupon arttıkça konveksite düşer; vade uzadıkça artar. Aynı vadede sıralama: <b>kuponsuz &gt; düşük kuponlu &gt; yüksek kuponlu<\/b>. Kuponsuz tahvilin (Macaulay) konveksitesi <b>vadenin karesine<\/b> eşittir (3 yıl → 9).<\/li>\n<li>Dikkat: kitapta konveksite iki biçimde geçer. Formül 8.8, Σ CF<sub>t<\/sub>(t² + t)/(1 + i)<sup>t<\/sup> toplamını (1 + i)² ve P'ye böler (bu zaten düzeltilmiş ölçüdür; 10 yıllık %8 kuponlu örnekte 56,14). Kuponsuz tahvil örneğinde ise Macaulay konveksitesi Σ w<sub>t<\/sub> × t² olarak alınır ve C<sub>mod<\/sub> = C/(1 + r)² ile düzeltilir. Sınav sorusu hangi tanımı veriyorsa onu kullan.<\/li>\n<li>Düzeltilmiş konveksite = C/(1+r)² (34 ve %10 → 28,09). Efektif konveksite = (P⁺ + P⁻ − 2P₀)/(ΔY² × P₀) (98, 95, 101,2 ve 100 bp → 20,4). Opsiyonlu (geri çağrılabilir) tahvilde negatif çıkabilir.<\/li>\n<li>Fiyat değişimi ≈ −D<sub>mod<\/sub> × Δi × P + ½ × C<sub>mod<\/sub> × (Δi)² × P.<\/li>\n<\/ul>\n\n<h3>Tahvilde getiri ve bileşenleri<\/h3>\n<ul>\n<li>Dönem getirisi r = [(P<sub>t<\/sub> − P₀) + C] / P₀; finansman maliyeti varsa düşülür.<\/li>\n<li>Geniş tanımda kâr/zarar = <b>pozisyon taşıma getirisi (roll + carry)<\/b> + <b>vade yapısındaki değişim<\/b> + <b>kredi makasındaki değişim<\/b>.<\/li>\n<li>Pozisyon taşıma: faizler değişmeden vadenin ilerlemesinden doğan getiri; kupon ve fiyat etkisi içerir. İskontolu tahvilde fiyat etkisi pozitif, primlide negatiftir. Düz eğride alternatif hesap: P₀ × dönemsel verim. <b>Getiri eğrisi üzerinde kayma (riding the yield curve)<\/b> pozitif eğimli ve değişmeyen eğride uygulanır.<\/li>\n<li>Kredi makası daralırsa (ihraççı iyileşirse) YTM düşer, fiyat artar; genişlerse tersi.<\/li>\n<\/ul>\n\n<h3>Kotasyon ve gün sayımı<\/h3>\n<ul>\n<li>Tahviller <b>temiz fiyat<\/b> (birikmiş faizden arındırılmış) üzerinden kote edilir, çünkü oynaklığı daha azdır. <b>Kirli fiyat<\/b> = temiz fiyat + birikmiş faiz; uzlaşmada fiilen ödenen fiyattır.<\/li>\n<li>Birikmiş faiz AI = (son kupondan uzlaşmaya gün / kupon periyodu günü) × dönemlik kupon.<\/li>\n<\/ul>\n<table>\n<tr><th>Kural<\/th><th>Esas<\/th><th>Genel kullanım<\/th><\/tr>\n<tr><td>Gerçek/Gerçek<\/td><td>Yıl 365 gün, ayın gerçek gün sayısı<\/td><td><b>Devlet tahvilleri<\/b> (DİBS'te Gerçek/Gerçek – ISMA)<\/td><\/tr>\n<tr><td>30/360<\/td><td>Yıl 360, her ay 30 gün<\/td><td><b>Kurumsal tahviller<\/b><\/td><\/tr>\n<tr><td>Gerçek/360<\/td><td>Yıl 360, ayın gerçek gün sayısı<\/td><td><b>Hazine bonoları<\/b><\/td><\/tr>\n<\/table>\n<p>Bağlayıcı tek merkezi otorite yoktur; ISDA ve ICMA önerileri fiilî standarttır. Kitap: 15 Nisan–15 Ekim kuponlu %10 devlet tahvili, 1 Haziran, 47/183 gün → AI 1,28 TL; kurumsal olsaydı 45/180 → 1,25 TL.<\/p>\n\n<h3>Matrix fiyatlaması ve getiri makasları<\/h3>\n<ul>\n<li><b>Matrix fiyatlaması:<\/b> aktif piyasası olmayan veya yeni ihraç edilecek kurumsal tahvil için benzer kredi kalitesindeki referans tahvillerin YTM'lerinden doğrusal enterpolasyonla verim bulunur. Referans sayısı arttıkça güvenilirlik artar.<\/li>\n<li><b>Getiri makası:<\/b> diğer özellikleri aynı iki tahvilin YTM farkı. Referans olarak en likit (on the run) devlet tahvilleri kullanılır. Devlet tahvili YTM = nominal risksiz faiz + vade primi; kurumsal tahvil YTM'sine <b>likidite primi + kredi primi<\/b> eklenir; makas = likidite primi + kredi primi.<\/li>\n<li><b>G-spread:<\/b> aynı vadeli devlet tahvili ile kurumsal tahvil YTM farkı; vade uyuşmazsa iki referanstan enterpolasyon.<\/li>\n<li><b>Z-spread:<\/b> her nakit akışı kendi vadesindeki spot faize <b>sabit<\/b> bir makas eklenerek iskonto edilir.<\/li>\n<li><b>Swap eğrisi:<\/b> LIBOR, SOFR, EURIBOR; Türkiye'de swaplarda referans <b>TLREF<\/b>. Normalde pozitif eğimli; durgunluk beklentisinde negatif olabilir. Swap faizleri düşük de olsa karşı taraf riski taşır ama çoğu zaman daha saf faiz göstergesidir. Swap makası = kurumsal YTM − aynı vadeli swap oranı.<\/li>\n<li>Belirsizlikte makaslar genişler, risk iştahı artınca daralır; yüksek getirili (high yield) tahvillerde dalgalanma yatırım yapılabilir (investment grade) tahvillerden fazladır.<\/li>\n<\/ul>\n\n<h3>Diğer tahvil türleri ve bono<\/h3>\n<ul>\n<li><b>Enflasyona dayalı tahvil (EDT):<\/b> nakit akışları fiyat endeksine bağlı; koruma kupon, anapara veya ikisi üzerinden. Hisse senetleriyle korelasyonu geleneksel tahvillerden yüksek, çeşitlendirme özelliği düşüktür. Örnekler: ABD TIPS, İngiltere Index-linked Gilts. Türkiye'de TÜFE'ye endeksli devlet tahvillerinde <b>hem anapara hem kupon<\/b> güncellenir. Kitap: %5 kupon, %20 enflasyon → kupon 6 TL.<\/li>\n<li><b>Değişken faizli tahvil (DFT, FRN):<\/b> kupon = referans faiz + <b>kotasyon marjı (QM)<\/b>; nakit akışları referans + <b>iskonto marjı (DM)<\/b> ile iskonto edilir. Üç aylık referans faizler (LIBOR, EURIBOR, TLREF) kullanılır; kupon her periyot başında sıfırlanır.<\/li>\n<\/ul>\n<table>\n<tr><th>DFT fiyatı<\/th><th>Durum<\/th><th>Kredi riski<\/th><\/tr>\n<tr><td>Başa baş<\/td><td>QM = DM<\/td><td>Sabit<\/td><\/tr>\n<tr><td>Primli<\/td><td>QM &gt; DM<\/td><td>Azalış<\/td><\/tr>\n<tr><td>İskontolu<\/td><td>QM &lt; DM<\/td><td>Artış<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Bono:<\/b> bir yıldan kısa vadeli; devletinki hazine bonosu, bankanınki banka bonosu, şirketinki finansman bonosu. Kupon ödemez, iskontolu satılır, vadede nominal ödenir. Genel formül P₀ = ND/(1+r)<sup>n/365<\/sup> (1.000 TL, 91 gün, %11 → 974,32 TL). Türkiye'de hazine bonosu <b>basit faizle<\/b>: P₀ = ND/(1 + r·n/365) → 973,31 TL.<\/li>\n<\/ul>\n\n<h3>Formül tablosu<\/h3>\n<table>\n<tr><th>Kavram<\/th><th>Formül<\/th><\/tr>\n<tr><td>Tahvil değeri<\/td><td>TD = Σ A/(1+i)ᵗ + I/(1+i)ⁿ<\/td><\/tr>\n<tr><td>Cari verim<\/td><td>Yıllık kupon / tahvil değeri<\/td><\/tr>\n<tr><td>Spot faiz (kesikli / sürekli)<\/td><td>V₀(1+z)ⁿ = Vₙ; V₀·e<sup>zn<\/sup> = Vₙ<\/td><\/tr>\n<tr><td>Başa baş faiz<\/td><td>pₙ × (DF₁ + … + DFₙ) + 100 × DFₙ = 100 → pₙ = (1 − DFₙ)/ΣDF (oran olarak)<\/td><\/tr>\n<tr><td>Vadeli faiz<\/td><td>(1+z<sub>B<\/sub>)<sup>B<\/sup> / (1+z<sub>A<\/sub>)<sup>A<\/sup> = (1+F)<sup>B−A<\/sup><\/td><\/tr>\n<tr><td>Spot = vadelilerin geometrik ortalaması<\/td><td>zₙ = [(1+F₀,₁)(1+F₁,₁)…]<sup>1/n<\/sup> − 1<\/td><\/tr>\n<tr><td>Macaulay süresi<\/td><td>MD = Σ t × BD(CFₜ) / P₀; sonsuz kuponlu: (1+r)/r<\/td><\/tr>\n<tr><td>Düzeltilmiş süre<\/td><td>D<sub>mod<\/sub> = MD/(1+r); ΔP/P = −D<sub>mod<\/sub> × Δi<\/td><\/tr>\n<tr><td>DV01 / BPV<\/td><td>(ΔP⁺ + ΔP⁻)/2 = D<sub>mod<\/sub> × P × 0,0001<\/td><\/tr>\n<tr><td>Efektif süre / konveksite<\/td><td>(P⁻ − P⁺)/(2ΔY·P₀); (P⁺ + P⁻ − 2P₀)/(ΔY²·P₀)<\/td><\/tr>\n<tr><td>Süre açığı<\/td><td>BPV<sub>g<\/sub> = BPV<sub>L<\/sub> − BPV<sub>A<\/sub>; BPV = değer × (−süre) × 0,0001<\/td><\/tr>\n<tr><td>Konveksite ile fiyat değişimi<\/td><td>dP/P = ½ × konveksite × (dr)²; C<sub>mod<\/sub> = C/(1+r)²<\/td><\/tr>\n<tr><td>Birikmiş faiz / kirli fiyat<\/td><td>AI = (t/T) × C; kirli = temiz + AI<\/td><\/tr>\n<tr><td>Doğrusal enterpolasyon<\/td><td>y<sub>x<\/sub> = y₁ × (t₂ − x)/(t₂ − t₁) + y₂ × (x − t₁)/(t₂ − t₁)<\/td><\/tr>\n<tr><td>Z-spread<\/td><td>Σ C/(1 + zₜ + Z)ᵗ = fiyat<\/td><\/tr>\n<tr><td>DFT<\/td><td>BD = Σ [(REF+QM)/m × FV] / [1 + (REF+DM)/m]ᵗ + FV/[…]ⁿ<\/td><\/tr>\n<tr><td>Bono<\/td><td>P₀ = ND/(1+r)<sup>n/365<\/sup>; hazine bonosu (basit): ND/(1 + r·n/365)<\/td><\/tr>\n<\/table>\n", "sorular": [{"q": "6 yıl vadeli, 1.000 TL nominal değerli, yıllık %12 kupon ödemeli bir tahvilin piyasa faizi %14 iken değeri yaklaşık kaç TL'dir?", "o": ["1.000,00 TL", "1.082,23 TL", "922,23 TL", "455,59 TL", "783,61 TL"], "a": 2, "e": "Kuponların BD'si 120 × anüite faktörü (%14, 6 yıl) ile anaparanın BD'si toplanır: ≈ 922,23 TL. Kupon piyasa faizinden düşük olduğu için tahvil iskontoludur."}, {"q": "3 yıl vadeli, 1.000 TL nominal değerli, yıllık %8 kuponu altı ayda bir ödeyen tahvilde yıllık bileşik piyasa faizi %10,25'tir. Kitaptaki yönteme göre tahvilin değeri ve cari verimi yaklaşık nedir?", "o": ["949,24 TL ve %8,43", "949,24 TL ve %4,21", "943,13 TL ve %8,48", "944,29 TL ve %8,47", "1.000,00 TL ve %8,00"], "a": 0, "e": "Altı aylık eşdeğer faiz √1,1025 - 1 = %5; 6 dönem, 40 TL kupon → değer ≈ 949,24 TL. Cari verim yıllık kupon/değer = 80/949,24 ≈ %8,43. Yıllık oranı ikiye bölmek (%5,125) kitaptaki yönteme uymaz."}, {"q": "Bir yatırımcı tahvilin vadeye kadar verimini (r) %15, kendi arzu ettiği verimi (i) %13 olarak hesaplamıştır. Karar ve gerekçe hangisidir?", "o": ["Satın alma; tahvil yüksek değerlenmiştir", "Kayıtsız kal; tahvil gerçek değerindedir", "Satın al; tahvil yüksek değerlenmiştir", "Satın al; tahvil düşük değerlenmiştir", "Sat; kupon faizi düşüktür"], "a": 3, "e": "r, i'den büyükse tahvil düşük değerlenmiştir ve satın alınır; r, i'den küçükse yüksek değerlenmiştir; r = i ise kayıtsız kalınır."}, {"q": "Yıllık %12 kupon ödeyen 1.000 TL nominal değerli tahvilin bir sonraki kuponuna 146 gün kalmıştır ve vadeye kadar üç kupon daha ödeyecektir (son kuponla birlikte anapara). Piyasa faizi %10 ise kesirli üslerle değeri yaklaşık kaç TL'dir?", "o": ["1.049,74 TL", "1.111,52 TL", "1.000,00 TL", "1.095,61 TL", "1.154,71 TL"], "a": 1, "e": "Süreler 146/365 = 0,4; 1,4 ve 2,4 yıldır. TD = 120/1,1^0,4 + 120/1,1^1,4 + 1.120/1,1^2,4 ≈ 1.111,52 TL. Tam yıl üsleri kullanmak değeri olduğundan düşük gösterir."}, {"q": "Bugün yatırılan 100 TL'nin 4 yıl sonra 160 TL'ye ulaşması durumunda kesikli ve sürekli bileşik spot faizler yaklaşık kaçtır?", "o": ["%15,00 ve %15,00", "%11,75 ve %12,47", "%12,47 ve %15,00", "%16,00 ve %11,75", "%12,47 ve %11,75"], "a": 4, "e": "Kesikli: 1,6^(1/4) - 1 ≈ %12,47. Sürekli: ln(1,6)/4 ≈ %11,75. Basit faiz (60/100/4) %15 verir. Sürekli bileşik oran kesikliden düşüktür."}, {"q": "1, 2 ve 3 yıllık spot faizler sırasıyla %8, %10 ve %12'dir. Yıllık kupon ödeyen 3 yıllık tahvilin nominal değerden işlem görmesini sağlayacak başa baş kupon oranı yaklaşık kaçtır?", "o": ["%12,00", "%10,00", "%11,70", "%13,50", "%12,47"], "a": 2, "e": "İskonto faktörleri 0,9259; 0,8264; 0,7118. p = (1 - 0,7118)/(0,9259 + 0,8264 + 0,7118) ≈ %11,70. Pozitif eğimli eğride başa baş oran aynı vadeli spot faizin (%12) altında kalır."}, {"q": "1 yıllık spot faiz %12, 2 yıllık spot faiz %14 ise 1 yıl sonra başlayacak 1 yıl vadeli faiz (F₁,₁) yaklaşık kaçtır?", "o": ["%16,04", "%14,00", "%13,00", "%2,00", "%15,00"], "a": 0, "e": "(1,14)² / 1,12 - 1 = 1,2996/1,12 - 1 ≈ %16,04. Pozitif eğimli spot eğrisinde vadeli faizler spot faizlerin üzerindedir."}, {"q": "1 ve 2 yıllık spot faizler %11 ve %13'tür. Yıllık %18 kupon ödeyen 2 yıllık, 100 TL nominal değerli tahvil piyasada 106 TL'den işlem görmektedir. Arbitraj için yapılacak işlem ve kazanç hangisidir?", "o": ["Tahvil satılır, sentetik pozisyonda alış yapılır; kazanç ≈ 2,63 TL", "Arbitraj yoktur", "Tahvil alınır; kazanç ≈ 2,34 TL", "Tahvil alınır, sentetik pozisyonda satış yapılır; kazanç ≈ 2,63 TL", "Tahvil satılır; kazanç 6,00 TL"], "a": 3, "e": "Adil değer 18/1,11 + 118/1,13² ≈ 108,63 TL. Piyasa fiyatı (106 TL) adil değerin altında, tahvil ucuzdur: tahvilde uzun, sentetikte kısa pozisyon alınır."}, {"q": "1 yıllık, %12 kuponlu tahvil 99,50 TL; 2 yıllık, %9 kuponlu tahvil 92,00 TL'dir (yıllık kupon, 100 TL nominal). Bootstrapping ile 2 yıllık, %14 kuponlu tahvilin adil fiyatı yaklaşık kaç TL'dir?", "o": ["113,72 TL", "100,30 TL", "92,00 TL", "103,38 TL", "105,00 TL"], "a": 1, "e": "D₁ = 99,50/112 ≈ 0,8884; D₂ = (92 - 9 × 0,8884)/109 ≈ 0,7707. Fiyat = 14 × 0,8884 + 114 × 0,7707 ≈ 100,30 TL."}, {"q": "3 yıl vadeli, %8 yıllık kuponlu, 100 TL nominal değerli tahvilin vadeye kadar verimi %10'dur. Macaulay süresi, düzeltilmiş süresi ve faizlerin 1 puan düşmesi halinde düzeltilmiş süreyle tahmini fiyat artışı yaklaşık nedir?", "o": ["3,00 yıl; 2,73 yıl; 2,59 TL", "2,78 yıl; 3,06 yıl; 2,90 TL", "2,52 yıl; 2,78 yıl; 2,64 TL", "2,78 yıl; 2,52 yıl; 23,99 TL", "2,78 yıl; 2,52 yıl; 2,40 TL"], "a": 4, "e": "P₀ ≈ 95,03 TL; MD = Σt×BD/P₀ ≈ 2,78 yıl (vadeden kısa); D_mod = 2,78/1,10 ≈ 2,52; ΔP ≈ 2,52 × 0,01 × 95,03 ≈ 2,40 TL."}, {"q": "Fiyatı 100 TL olan opsiyonlu bir tahvilin değeri faizler 50 baz puan düşerse 102,30 TL'ye çıkmakta, 50 baz puan artarsa 97,80 TL'ye inmektedir. Efektif süresi kaçtır?", "o": ["9,0", "2,25", "4,5", "45,0", "0,45"], "a": 2, "e": "EfD = (P⁻ - P⁺)/(2 × ΔY × P₀) = (102,30 - 97,80)/(2 × 0,005 × 100) = 4,5. Paydada 2'yi unutmak 9,0 verir."}, {"q": "Bir tahvilin 2 yıllık anahtar vadedeki KR01'i 5, 5 yıllık anahtar vadedeki KR01'i 8 baz puandır. Doğrusal enterpolasyonla 3 yıllık vadeye duyarlılık kaç baz puandır?", "o": ["6", "6,5", "7", "5", "13"], "a": 0, "e": "KR01₃ = (5-3)/(5-2) × 5 + (3-2)/(5-2) × 8 = 3,33 + 2,67 = 6. 3 yıl 2 yıla daha yakın olduğu için 2 yıllık değere daha fazla ağırlık verilir."}, {"q": "Bir bankanın varlıklarının piyasa değeri 1.000 milyon TL ve düzeltilmiş süresi 5; yükümlülüklerinin bugünkü değeri 900 milyon TL ve düzeltilmiş süresi 2'dir. Süre açığı ve faizlerin 100 baz puan artmasının özkaynağa yaklaşık etkisi nedir?", "o": ["Negatif süre açığı; özkaynak yaklaşık 32 milyon TL artar", "Pozitif süre açığı; özkaynak yaklaşık 68 milyon TL azalır", "Negatif süre açığı; özkaynak yaklaşık 18 milyon TL azalır", "Pozitif süre açığı; özkaynak yaklaşık 32 milyon TL azalır", "Süre açığı yoktur; özkaynak değişmez"], "a": 3, "e": "BPV_A = -500.000 TL, BPV_L = -180.000 TL; BPV_g = BPV_L - BPV_A = +320.000 TL (pozitif açık, faiz artış riski). 100 bp artışta varlıklar 50, yükümlülükler 18 milyon TL düşer; özkaynak 32 milyon TL azalır."}, {"q": "6 yıl vadeli kuponsuz bir tahvilin vadeye kadar verimi %20'dir. Macaulay konveksitesi ve düzeltilmiş konveksitesi nedir?", "o": ["6 ve 5", "36 ve 25", "36 ve 30", "25 ve 36", "12 ve 10"], "a": 1, "e": "Kuponsuz tahvilin konveksitesi vadenin karesidir: 6² = 36. Düzeltilmiş konveksite 36/(1,20)² = 36/1,44 = 25. (Kitabın kuponsuz tahvil tanımı: Macaulay konveksitesi = vadenin karesi, düzeltilmiş = C/(1 + r)².)"}, {"q": "Yıllık %12 kuponu altı ayda bir ödeyen, 100 TL nominal değerli bir devlet tahvilinde son kupondan bu yana 60 gün geçmiştir ve kupon periyodu 182 gündür. Temiz fiyat 95,00 TL ise kirli fiyat yaklaşık kaç TL'dir?", "o": ["93,02 TL", "97,00 TL", "98,96 TL", "95,00 TL", "96,98 TL"], "a": 4, "e": "Devlet tahvilinde Gerçek/Gerçek: AI = 60/182 × 6 ≈ 1,98 TL; kirli = 95 + 1,98 ≈ 96,98 TL. Yıllık kuponu (12) kullanmak 98,96 TL verir; 30/360 ile AI 60/180 × 6 = 2,00 TL ve kirli fiyat 97,00 TL olurdu."}, {"q": "Benzer kredi kalitesindeki 2 yıllık referans tahvilin YTM'si %12, 5 yıllık referans tahvilin YTM'si %15,6'dır. 3 yıllık, yıllık %14 kuponlu tahvilin matrix fiyatlamasıyla bulunan verimi ve fiyatı yaklaşık nedir?", "o": ["%13,8 ve 100,47 TL", "%14,4 ve 99,08 TL", "%13,2 ve 101,88 TL", "%12,0 ve 104,80 TL", "%15,6 ve 96,48 TL"], "a": 2, "e": "YTM₃ = 12 × (5-3)/3 + 15,6 × (3-2)/3 = 8 + 5,2 = %13,2. Bu oranla fiyat ≈ 101,88 TL. İki referansın basit ortalaması %13,8 verir."}, {"q": "3 yıllık referans devlet tahvilinin YTM'si %10, 7 yıllık referansınki %12'dir. 4 yıllık kurumsal tahvilin YTM'si %14 ise G-spread kaç baz puandır?", "o": ["350", "300", "400", "250", "200"], "a": 0, "e": "Enterpolasyonla 4 yıllık referans verim: 10 × 3/4 + 12 × 1/4 = %10,5. G-spread = 14 - 10,5 = %3,5 = 350 baz puan."}, {"q": "1 ve 2 yıllık spot faizler %11 ve %13'tür. 2 yıllık, yıllık %12 kuponlu tahvilin Z-spread'i 150 baz puan ise fiyatı yaklaşık kaç TL'dir?", "o": ["98,52 TL", "95,91 TL", "97,51 TL", "96,10 TL", "100,00 TL"], "a": 3, "e": "Her akış kendi spot faizi + 150 bp ile iskonto edilir: 12/1,125 + 112/1,145² ≈ 96,10 TL."}, {"q": "3 yıllık swap oranı %15, 6 yıllık swap oranı %18'dir. 5 yıllık kurumsal tahvilin YTM'si %19,5 ise swap makası kaç baz puandır?", "o": ["350", "250", "150", "300", "200"], "a": 1, "e": "5 yıllık swap oranı: 15 × 1/3 + 18 × 2/3 = %17. Swap makası 19,5 - 17 = %2,5 = 250 baz puan."}, {"q": "1.000 TL nominal değerli, vadesine 1 yıl kalan, kuponunu üç ayda bir ödeyen değişken faizli tahvilde referans faiz yıllık %16, kotasyon marjı %1,5, iskonto marjı %2,5'tir. Dönemlik kupon ve tahvil değeri yaklaşık nedir?", "o": ["43,75 TL ve 1.000,00 TL", "175,00 TL ve 991,56 TL", "46,25 TL ve 1.009,00 TL", "40,00 TL ve 991,06 TL", "43,75 TL ve 991,06 TL"], "a": 4, "
