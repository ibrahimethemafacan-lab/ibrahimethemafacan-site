e": "Kupon (REF + QM)/4 × 1.000 = 17,5%/4 × 1.000 = 43,75 TL; iskonto oranı (REF + DM)/4 = %4,625. Değer ≈ 991,06 TL. QM, DM'den küçük olduğu için tahvil iskontolu, kredi riski artmıştır."}, {"q": "1.000 TL nominal değerli, 182 gün vadeli, %20 iskonto oranlı bononun genel (bileşik) formüle göre değeri ve Türkiye'de hazine bonosu için kullanılan basit faiz formülüne göre değeri yaklaşık nedir?", "o": ["909,32 TL ve 913,10 TL", "900,00 TL ve 909,09 TL", "913,10 TL ve 909,32 TL", "913,10 TL ve 900,28 TL", "833,33 TL ve 909,32 TL"], "a": 2, "e": "Bileşik: 1.000/1,20^(182/365) ≈ 913,10 TL. Basit: 1.000/(1 + 0,20 × 182/365) ≈ 909,32 TL. Basit faizle bulunan değer daha düşüktür."}, {"q": "Macaulay süresinin özellikleriyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Vadeye kadar verim yükseldikçe süre uzar", "Kuponlu tahvilin süresi vadesinden kısadır", "Kupon faizi arttıkça süre kısalır", "Kuponsuz tahvilin süresi vadesine eşittir", "Süre vadeye bağlı olarak genellikle azalarak artar"], "a": 0, "e": "Vadeye kadar verim ile süre arasında ters ilişki vardır; yüksek YTM süreyi kısaltır."}, {"q": "Aynı vadeye sahip tahviller arasında konveksite sıralaması genellikle nasıldır?", "o": ["Yüksek kuponlu > düşük kuponlu > kuponsuz", "Düşük kuponlu > kuponsuz > yüksek kuponlu", "Hepsinin konveksitesi eşittir", "Kuponsuz > düşük kuponlu > yüksek kuponlu", "Kuponsuz tahvilin konveksitesi sıfırdır"], "a": 3, "e": "Kupon arttıkça akışların vade sonuna yığılması azalır, süre ve konveksite düşer. Kuponsuz tahvilin konveksitesi vadenin karesine eşittir."}, {"q": "Gün sayımı kurallarının genel kullanımları aşağıdakilerin hangisinde doğru verilmiştir?", "o": ["Devlet tahvili: 30/360 – Kurumsal tahvil: Gerçek/Gerçek – Hazine bonosu: Gerçek/360", "Devlet tahvili: Gerçek/Gerçek – Kurumsal tahvil: 30/360 – Hazine bonosu: Gerçek/360", "Devlet tahvili: Gerçek/360 – Kurumsal tahvil: 30/360 – Hazine bonosu: Gerçek/Gerçek", "Devlet tahvili: Gerçek/Gerçek – Kurumsal tahvil: Gerçek/360 – Hazine bonosu: 30/360", "Üçünde de 30/360 kullanılır"], "a": 1, "e": "Genel olarak devlet tahvillerinde Gerçek/Gerçek, kurumsal tahvillerde 30/360, hazine bonolarında Gerçek/360 uygulanır; DİBS'lerde Gerçek/Gerçek (ISMA) kullanılır.", "k": 1}, {"q": "Spot eğrisi pozitif eğimliyken spot, başa baş ve vadeli faizlerin aynı vadedeki sıralaması hangisidir?", "o": ["Başa baş > spot > vadeli", "Spot > vadeli > başa baş", "Üçü birbirine eşittir", "Başa baş > vadeli > spot", "Vadeli > spot > başa baş"], "a": 4, "e": "Pozitif eğimde vadeli faizler hem spot hem başa baş faizlerin üzerinde, başa baş faizler en düşüktür. Negatif eğimde sıralama tersine döner."}]}, {"id": 10, "kisa": "Portföy Performansı", "baslik": "Portföy Performans Ölçüm Teknikleri", "ozet": "Sharpe, Treynor, M², Sortino, Jensen alfası, değerlendirme, bilgi ve yakalama ölçütleri; BHB, risk kaynakları, faktör analizi, aktif pay ve referans portföy.", "notlar": "\n<h3>Performans analizinin çerçevesi<\/h3>\n<ul>\n<li>Performans analizi portföy yönetim sürecinin <b>nihai aşamasıdır<\/b>; yalnız ne kadar iyi performans sağlandığını değil, nedenlerini de sorgular. Üç soru: <b>performans ne kadar, neden bu performans elde edildi, nasıl artırılabilir?<\/b><\/li>\n<li>Önce getiri ölçülür ve kıyaslanır; sonra getiri-risk birlikte, yönetici katkısı, varlık seçimi, çeşitlendirme ve piyasa zamanlaması incelenir. Ortalamanın üzerinde getirinin iki faktörü: <b>zamanlama<\/b> ve <b>yatırım aracı seçimi<\/b>.<\/li>\n<li>Fonlar farklı hedefler ve risk düzeylerine sahiptir (hisse fonu yüksek, kamu borçlanma aracı fonu en düşük, dengeli fon orta risk-getiri); önce <b>hedeflerine göre gruplanıp<\/b> sonra karşılaştırılmalıdır.<\/li>\n<\/ul>\n<h4>Getiri yöntemi ve brüt/net ayrımı<\/h4>\n<ul>\n<li>Yöneticinin nakit akışları üzerinde kontrolü olmayan, yatırımcının dilediği zaman giriş-çıkış yaptığı yatırım fonlarında <b>zaman ağırlıklı getiri<\/b>; yöneticinin nakit giriş-çıkış zamanını belirlediği <b>özel sermaye (private equity)<\/b> fonlarında <b>para ağırlıklı getiri (iç verim oranı)<\/b> kullanılır.<\/li>\n<li>Net getiri = brüt getiri − alım-satım komisyonları, yönetim ve idari giderler.<\/li>\n<li><b>Yönetici performansı<\/b> ölçülürken yöneticinin kontrolündeki <b>alım-satım komisyonları ve yönetim ücreti<\/b> brüt getiriden düşülür; <b>saklama, denetim, yasal giderler<\/b> gibi idari giderler brüt getiri içinde bırakılır.<\/li>\n<li><b>Yatırımcı açısından<\/b> performans tüm maliyetler düşülmüş <b>net getiridir<\/b>; birçok ülkede düzenleyiciler net getirilerin yayımlanmasını ister.<\/li>\n<\/ul>\n\n<h3>Riske göre düzeltilmiş performans<\/h3>\n<p>Yatırımcılar riskten kaçındığı için yalnız getiriye bakmak yanlıştır. Ölçüm ikiye ayrılır: <b>mutlak analiz<\/b> (toplam getiri ve risk) ve <b>göreceli analiz<\/b> (referans portföye göre). Mutlak analizde iki başlık: <b>birim risk başına getiri<\/b> (Sharpe, Treynor, M², Sortino) ve <b>farksal getiri<\/b> (Jensen alfası, değerlendirme ölçütü).<\/p>\n<table>\n<tr><th>Ölçüt<\/th><th>Formül<\/th><th>Risk ölçüsü / not<\/th><\/tr>\n<tr><td>Sharpe<\/td><td>S<sub>p<\/sub> = (r<sub>p<\/sub> − r<sub>f<\/sub>)/σ<sub>p<\/sub><\/td><td>Toplam risk; risksiz faiz ile portföyü birleştiren doğrunun eğimi; SPD üzerindeki her portföyün Sharpe'ı pazarınkine eşittir<\/td><\/tr>\n<tr><td>Treynor<\/td><td>T<sub>p<\/sub> = (r<sub>p<\/sub> − r<sub>f<\/sub>)/β<sub>p<\/sub><\/td><td>Sistematik (piyasa) risk; MKPD üzerindeki her portföyün Treynor'ı pazarınkine eşittir<\/td><\/tr>\n<tr><td>M² (Modigliani ve Modigliani, 1997)<\/td><td>M² = S<sub>p<\/sub> × σ<sub>m<\/sub> + r<sub>f<\/sub><\/td><td>Portföyü piyasa riskine normalize eder; sonucu <b>yüzdesel getiri<\/b> olarak verir; r<sub>m<\/sub> ile kıyaslanır<\/td><\/tr>\n<tr><td>Sortino<\/td><td>(r<sub>p<\/sub> − r<sub>t<\/sub>)/σ′<sub>p<\/sub><\/td><td>Yalnız hedef getirinin altındaki sapmalar (aşağı yönlü risk); r<sub>f<\/sub> yerine <b>hedef getiri<\/b><\/td><\/tr>\n<tr><td>Jensen alfası (1968)<\/td><td>α<sub>p<\/sub> = r<sub>p<\/sub> − [r<sub>f<\/sub> + β<sub>p<\/sub>(r<sub>m<\/sub> − r<sub>f<\/sub>)]<\/td><td>Varlık seçme yeteneği; iyi çeşitlendirilmiş portföyler için uygun<\/td><\/tr>\n<tr><td>Değerlendirme ölçütü (Treynor-Black, 1973)<\/td><td>D<sub>p<\/sub> = α<sub>p<\/sub>/σ<sub>e<\/sub><\/td><td>Birim spesifik (hata) risk başına alfa; şans mı yetenek mi<\/td><\/tr>\n<tr><td>Bilgi ölçütü<\/td><td>B<sub>p<\/sub> = (r<sub>p<\/sub> − r<sub>b<\/sub>)/σ(r<sub>p<\/sub> − r<sub>b<\/sub>)<\/td><td>Aktif getiri / takip hatası (aktif risk); yıllıklandırılmış değerlerle<\/td><\/tr>\n<tr><td>Yakalama ölçütü<\/td><td>C = U<sub>c<\/sub>/D<sub>c<\/sub>; U<sub>c<\/sub> = U<sub>p<\/sub>/U<sub>b<\/sub>, D<sub>c<\/sub> = D<sub>p<\/sub>/D<sub>b<\/sub><\/td><td>Yükselen ve düşen piyasada referansa göre performans<\/td><\/tr>\n<\/table>\n<h4>Sharpe ve Treynor<\/h4>\n<ul>\n<li>Sharpe (William Sharpe) en çok bilinen tek parametreli ölçüttür; en yüksek Sharpe en başarılı portföydür. Getirilerin <b>normal dağıldığını varsayar<\/b>; asimetrik veya kalın kuyruklu alternatif yatırımlarda yetersiz kalabilir.<\/li>\n<li>Dikkat: pay negatifse (r<sub>p<\/sub> &lt; r<sub>f<\/sub>) Sharpe sıralama için kullanılamaz; yüksek riskli portföy daha az negatif değerle yanıltıcı biçimde iyi görünür. Aynı şart Treynor için de geçerlidir.<\/li>\n<li>Sharpe ve Treynor oranları tek başına mutlak anlam taşımaz ve farkın <b>ekonomik anlamlılığını<\/b> göstermez; Sharpe için bu eksikliği M², Treynor için Jensen alfası giderir.<\/li>\n<li>Hangi ölçüt: <b>iyi çeşitlendirilmiş<\/b> portföy pazar portföyüne denk geldiği için beta ayırt edici değildir → <b>Sharpe<\/b> önerilir; <b>iyi çeşitlendirilmemiş<\/b> portföy için Treynor \"iyi bir turnusol kâğıdı\" olarak anılır. Kötü çeşitlendirilmiş fon Treynor'da iyi, Sharpe'ta kötü çıkabilir, çünkü standart sapması yüksektir.<\/li>\n<li>Kitap örneği (r<sub>f<\/sub> %3): A %9 getiri, σ %12, β 0,52 → Sharpe 0,50, Treynor 11,5; B %11, σ %28, β 1,50 → 0,29 ve 5,3; M %10, σ %19, β 1 → 0,37 ve 7,0. İki ölçüt de A &gt; M &gt; B sıralar.<\/li>\n<li>M² örneği: r<sub>f<\/sub> %10, r<sub>p<\/sub> %15, σ<sub>p<\/sub> %20, σ<sub>m<\/sub> %8 → M² %12; piyasa %11 ise riske göre düzeltilmiş ilave getiri %1.<\/li>\n<\/ul>\n<h4>Sortino, Jensen ve değerlendirme ölçütü<\/h4>\n<ul>\n<li>Standart sapma simetriktir; özellikle <b>sola çarpık<\/b> dağılımda riski olduğundan düşük gösterebilir. Sortino yarı standart sapmayı (hedefin altındaki sapmaların karelerinin ortalamasının karekökü) kullanır; <b>serbest fonlar, emtia fonları, opsiyon yazan stratejiler<\/b> için Sharpe'tan üstündür.<\/li>\n<li>Jensen: yatırımcının pasif olarak pazar portföyü ve risksiz varlıkla aynı riski alma seçeneği varsayılır; gerçekleşen getiri ile beklenen getiri farkı alfadır. Kitap: A için %3 + 0,52 × 7 = %6,6; alfa %2,4. B için %13,5; alfa −%2,5. Regresyon: r<sub>p<\/sub> − r<sub>f<\/sub> = α<sub>p<\/sub> + β<sub>p<\/sub>(r<sub>m<\/sub> − r<sub>f<\/sub>) + e; alfanın sıfırdan anlamlı farklılığı istatistiksel test edilir.<\/li>\n<li>Ekonomik anlamda Jensen alfası yatırımcı servetine net katkıdır ve yatırımcının yöneticiye ödemeye razı olacağı <b>maksimum yönetim ücretini<\/b> temsil eder.<\/li>\n<li>Değerlendirme ölçütünde spesifik risk: σ<sub>p<\/sub>² = (β<sub>p<\/sub>σ<sub>m<\/sub>)² + σ<sub>e<\/sub>². Kitap: σ<sub>p<\/sub> %15, β 0,9, σ<sub>m<\/sub> %13 → σ<sub>e<\/sub> %9,38; alfa %2,6; D<sub>p<\/sub> 0,28. Düşük hata terimi alfanın yetenekten geldiğine dair güveni artırır.<\/li>\n<\/ul>\n<h4>Göreceli performans<\/h4>\n<ul>\n<li><b>Takip hatası (aktif risk):<\/b> portföy ile referans getirileri arasındaki farkın standart sapması. Aylık takip hatası √12 ile yıllıklandırılır.<\/li>\n<li>Bilgi ölçütü değerlendirme ölçütüne benzer; fark: değerlendirme ölçütünde alfa regresyonla bulunur, bilgi ölçütünde ek getiri doğrudan hesaplanır. Yöneticinin referans üzerinde ne kadar <b>tutarlı<\/b> ek getiri yarattığını gösterir.<\/li>\n<li>Bilgi ölçütü aktif pozisyonların <b>agresiflik düzeyinden etkilenmez<\/b>: aktif ağırlıklar iki katına çıkınca aktif getiri ve takip hatası birlikte iki katına çıkar, oran sabit kalır.<\/li>\n<li>Takip hatası çok düşük ve bilgi ölçütü negatif olan fonlar <b>gizli endeks (closet index)<\/b> fonu olabilir.<\/li>\n<li>Yakalama ölçütü: U<sub>c<\/sub> &gt; 1 yükselişte, D<sub>c<\/sub> &lt; 1 düşüşte referanstan iyi. C &gt; 1 <b>konveks profil (pozitif asimetri)<\/b>, C &lt; 1 konkav (negatif asimetri), C = 1 doğrusal (simetrik). Kitap: U<sub>c<\/sub> 1,125, D<sub>c<\/sub> 0,667 → C ≈ 1,69 (kitapta 1,68) (basitlik için aritmetik toplam; literatürde geometrik bağlama gerekir).<\/li>\n<\/ul>\n<table>\n<tr><th>Ölçü birimi<\/th><th>Ölçüm türü<\/th><th>Performans kriteri<\/th><\/tr>\n<tr><td>Sharpe<\/td><td>Mutlak<\/td><td>Toplam risk<\/td><\/tr>\n<tr><td>Treynor<\/td><td>Mutlak<\/td><td>Sistematik risk<\/td><\/tr>\n<tr><td>M²<\/td><td>Mutlak<\/td><td>Normalize edilmiş risk<\/td><\/tr>\n<tr><td>Sortino<\/td><td>Mutlak<\/td><td>Aşağı yönlü risk<\/td><\/tr>\n<tr><td>Değerleme (değerlendirme) ölçütü<\/td><td>Mutlak<\/td><td>Spesifik risk<\/td><\/tr>\n<tr><td>Bilgi ölçütü<\/td><td>Göreceli<\/td><td>Aktif risk<\/td><\/tr>\n<tr><td>Yakalama ölçütü<\/td><td>Göreceli<\/td><td>Piyasa duyarlılığı<\/td><\/tr>\n<\/table>\n<ul><li>Sharpe ve Sortino için uygulamada <b>1,00<\/b> düzeyi genellikle kabul edilebilir sayılır; ancak eşikler tek başına yeterli değildir, uygun referansla kıyas gerekir.<\/li><\/ul>\n\n<h3>Portföy performansının bileşenleri<\/h3>\n<h4>Getirinin kaynakları: BHB modeli<\/h4>\n<ul>\n<li>r<sub>p<\/sub> = r<sub>b<\/sub> + (r<sub>p<\/sub> − r<sub>b<\/sub>): r<sub>b<\/sub> pasif performans, (r<sub>p<\/sub> − r<sub>b<\/sub>) aktif performans. Endekse dayalı portföylerde performans büyük ölçüde referansa bağlıdır.<\/li>\n<li><b>Brinson–Hood–Beebower<\/b> aktif getiriyi üç bileşene ayırır: <b>varlık dağılımı<\/b> (ağırlık kararı; piyasa zamanlaması olarak da ifade edilir), <b>varlık seçimi<\/b> (seçilen varlıkların getirisi), <b>etkileşim<\/b>. Tek dönem için aritmetik yöntem yeterlidir; çok dönemde geometrik yöntem gerekir.<\/li>\n<li>Kitap örneği: enerji, sanayi, teknoloji; aktif getiri %2,9 = dağılım %0,7 + seçim %1,5 + etkileşim %0,7.<\/li>\n<\/ul>\n<table>\n<tr><th>Bileşen<\/th><th>Formül (her varlık/sektör için, sonra toplanır)<\/th><\/tr>\n<tr><td>Varlık dağılımı (A)<\/td><td>(w<sub>p<\/sub> − w<sub>b<\/sub>) × r<sub>b<\/sub><\/td><\/tr>\n<tr><td>Varlık seçimi (S)<\/td><td>(r<sub>p<\/sub> − r<sub>b<\/sub>) × w<sub>b<\/sub><\/td><\/tr>\n<tr><td>Etkileşim (I)<\/td><td>(r<sub>p<\/sub> − r<sub>b<\/sub>) × (w<sub>p<\/sub> − w<sub>b<\/sub>)<\/td><\/tr>\n<tr><td>Toplam<\/td><td>r<sub>p<\/sub> − r<sub>b<\/sub> = A + S + I<\/td><\/tr>\n<\/table>\n<h4>Riskin kaynakları<\/h4>\n<ul>\n<li>Varlık bazında en önemli veri kaynağı <b>varyans-kovaryans matrisidir<\/b>. Mutlak risk = portföy standart sapması; varlığın katkısı CV<sub>i<\/sub> = Σ w<sub>i<\/sub>w<sub>j<\/sub>Cov<sub>ij<\/sub> / Var<sub>p<\/sub>.<\/li>\n<li><b>Aktif risk<\/b> = σ(r<sub>p<\/sub> − r<sub>b<\/sub>); aktif varyans AV<sub>p<\/sub> = Σ Σ (w<sub>ip<\/sub> − w<sub>ib<\/sub>)(w<sub>jp<\/sub> − w<sub>jb<\/sub>)Cov<sub>ij<\/sub>. Kitap: aktif risk %2,1; katkının yaklaşık %70'i A varlığından.<\/li>\n<li>Bir varlığın volatilitesi veya diğer varlıklarla korelasyonu arttıkça toplam riske katkısı artar; referansla korelasyonu yüksekse veya ağırlığı referanstakine yakınsa aktif riski düşük olur.<\/li>\n<\/ul>\n<h4>Değerlendirme süreci<\/h4>\n<ul>\n<li>Sorular: göreli ve mutlak performans ne durumda, belirleyici bileşenler neler, risk performansla uyumlu mu, <b>şans faktörü<\/b> ne kadar etkili?<\/li>\n<li><b>Aktif yönetim<\/b>: endeksi aşmak için dinamik yönetim, genelde daha riskli. <b>Pasif yönetim<\/b>: endeksi takip, genelde daha düşük risk.<\/li>\n<li>Şansı test etme yolları: değerlendirme ölçütü (yükseldikçe şans payı azalır), alfanın <b>Student t testi<\/b> ile anlamlılığı, alfanın tarihsel <b>kalıcılığı<\/b>.<\/li>\n<\/ul>\n\n<h3>Faktör bazlı performans analizi<\/h3>\n<ul>\n<li>Avantaj: çeşitlendirme, verim potansiyeli ve analiz kolaylığı (100 varlık için 100×100 matris yerine örneğin 3 faktör). Tek faktörlü portföy yoğunlaşma riski taşır; kriz dönemlerinde faktörler iyi performans göstermeyebilir.<\/li>\n<li>Faktör portföyleri uzun-kısa pozisyonlarla kurulur; portföy getirisinin faktörlere regresyonuyla duyarlılıklar bulunur.<\/li>\n<\/ul>\n<table>\n<tr><th>Faktör<\/th><th>Tanım<\/th><th>Profil<\/th><\/tr>\n<tr><td>RMRF<\/td><td>Piyasa risk primi<\/td><td>Piyasa (beta) odaklı<\/td><\/tr>\n<tr><td>SMB<\/td><td>Küçük ölçekli − büyük ölçekli hisseler<\/td><td>Küçük ölçek odaklı<\/td><\/tr>\n<tr><td>HML<\/td><td>Değer − büyüme hisseleri<\/td><td>Değer (ucuz) odaklı<\/td><\/tr>\n<tr><td>WML<\/td><td>Geçmişte kazanan − kaybeden hisseler<\/td><td>Momentum<\/td><\/tr>\n<tr><td>Volatilite<\/td><td>Düşük − yüksek volatiliteli hisseler<\/td><td>Düşük risk<\/td><\/tr>\n<tr><td>Likidite<\/td><td>Düşük − yüksek likiditeli hisseler<\/td><td>Likidite<\/td><\/tr>\n<tr><td>Kalite<\/td><td>ROE'si yüksek − düşük olanlar<\/td><td>Kârlılık<\/td><\/tr>\n<tr><td>Enflasyon<\/td><td>Enflasyona dayalı − nominal devlet tahvilleri<\/td><td>Değer koruma<\/td><\/tr>\n<tr><td>Faiz oranları<\/td><td>Uzun vadeli − kısa vadeli devlet tahvili<\/td><td>Durasyon<\/td><\/tr>\n<tr><td>Kredi<\/td><td>Düşük kaliteli − yüksek kaliteli tahviller<\/td><td>Kredi primi<\/td><\/tr>\n<tr><td>Reel büyüme<\/td><td>Gerçekleşen − beklenen büyüme<\/td><td>Sürpriz büyüme primi<\/td><\/tr>\n<\/table>\n<ul>\n<li>Bu faktörlere <b>dinamik faktörler<\/b> de denir: uzun dönemde prim sağlar, kısa dönemde konjonktüre duyarlıdır. Araştırmalara göre getiri-risk profilini <b>temel hisse faktörleri<\/b> makro faktörlerden daha iyi açıklar.<\/li>\n<li><b>Mutlak analiz:<\/b> r<sub>p<\/sub> − r<sub>f<\/sub> = Σ(B<sub>i<\/sub> × F<sub>i<\/sub>) + α + e. Risk faktörleri çeşitlendirmeyi, <b>alfa zamanlamayı<\/b> ve yönetici performansını (agresif portföylerde belirgin), <b>hata terimi yoğunlaşmayı<\/b> (konsantre portföylerde yüksek) temsil eder. Zamanlama + yoğunlaşma = seçim etkisi. Sistematik bileşen yoğun portföyler risk primi odaklı (rewarded), arka planda kalanlar katma değer odaklıdır (unrewarded).<\/li>\n<li><b>Göreceli analiz:<\/b> r<sub>p<\/sub> − r<sub>b<\/sub> = Σ(B<sub>i<\/sub> − B<sub>k<\/sub>) × F<sub>k<\/sub> + α + e; faktör duyarlılık farkının etkisine <b>faktör eğilimi (factor tilt)<\/b> denir. R<sub>A<\/sub> = faktör eğilimi + zamanlama + yoğunlaşma. Faktör eğilimi arttıkça korelasyon azalır, aktif risk artar.<\/li>\n<li><b>Aktif pay (active share):<\/b> AS = ½ × Σ|w<sub>p<\/sub> − w<sub>b<\/sub>|. %80 aktif pay → portföy referansa %20 benzer. Faktör eğilimi nötrken aktif riski aktif pay şekillendirir.<\/li>\n<li>Sektör uygulamasında <b>aktif risk %7 ve üzeri<\/b>, <b>aktif pay %70 ve üzeri<\/b> yüksek kabul edilir (standart eşik yoktur).<\/li>\n<\/ul>\n<table>\n<tr><th>Portföy türü<\/th><th>Yapı<\/th><th>Aktif pay<\/th><th>Aktif risk<\/th><\/tr>\n<tr><td>Hisse seçici<\/td><td>Çeşitlendirilmiş<\/td><td>Yüksek<\/td><td>Düşük<\/td><\/tr>\n<tr><td>Faktör portföyü<\/td><td>Çeşitlendirilmiş<\/td><td>Düşük<\/td><td>Düşük<\/td><\/tr>\n<tr><td>Faktör portföyü<\/td><td>Konsantre<\/td><td>Yüksek<\/td><td>Yüksek<\/td><\/tr>\n<tr><td>Hisse seçici<\/td><td>Konsantre<\/td><td>Yüksek<\/td><td>Yüksek<\/td><\/tr>\n<\/table>\n<ul>\n<li>Aktif payı yüksek, aktif riski düşük (çeşitlendirilmiş hisse seçici, <b>aşağıdan yukarıya<\/b> kurulan) portföylerin alfa potansiyeli daha yüksektir. Hisse seçici + konsantre portföylerde performansın önemli kısmı yoğunlaşmadan gelir.<\/li>\n<li><b>Sektör rotasyon<\/b> portföyleri <b>yukarıdan aşağıya<\/b> kurulur, hem aktif hem mutlak riske maruz kalır, öne çıkan bileşen <b>zamanlamadır<\/b>.<\/li>\n<\/ul>\n\n<h3>Referans portföy (benchmark)<\/h3>\n<ul>\n<li>Piyasa endeksi bir piyasanın genel performansını, referans portföy ise <b>belirli bir portföyün<\/b> performansını takip eder; yatırım profilini yansıtacak şekilde tasarlanır. Endeksler fiyat ağırlıklı, piyasa değeri ağırlıklı veya eşit ağırlıklı olabilir.<\/li>\n<li><b>Bailey ilkeleri:<\/b> <b>açıklık<\/b> (varlık ve ağırlıklar net), <b>yatırım yapılabilirlik<\/b> (kolay taklit), <b>ölçülebilirlik<\/b> (zamanında ve düzenli), <b>uygunluk<\/b> (stratejiyi yansıtma), <b>önceden belirlenme<\/b> (değerlendirmeden önce oluşturulma).<\/li>\n<li><b>Bailey bileşen analizi:<\/b> P = M + S + A; <b>S = B − M stil kararı<\/b>, <b>A = P − B aktif yönetim kararı<\/b>. Referans geniş piyasayı temsil ederse S = 0; portföy referansla örtüşürse A = 0. Kitap: P %10,5, B %9,5, M %8 → S %1,5, A %1. Hatalı referans (BIST 100 fonu için BIST TÜM) stil katkısını yok edip aktif başarı yanılgısı yaratır.<\/li>\n<li>Stil endeksleri: Russell 1000 Growth/Value, S&amp;P 500 Growth/Value (faktör); S&amp;P 500 Information Technology, MSCI World Energy (sektör); MSCI Emerging Markets, MSCI Pacific (coğrafya). Borsa İstanbul BIST30, BIST50 gibi büyüklük ve sektör endeksleri yayımlar.<\/li>\n<li><b>Özelleştirilmiş referans portföy:<\/b> daha adil ve kesin ölçüm potansiyeli; dezavantajı kurulum ve devamlılığın maliyetli olması ve yayımlanmadığı için şeffaflık eksikliği. Adımlar: amaçları belirle → uyumlu menkul kıymet sepeti → ağırlıklandır → gözden geçir ve oluştur → izle ve yeniden dengele.<\/li>\n<\/ul>\n<table>\n<tr><th>Kalite standardı<\/th><th>Anlamı<\/th><\/tr>\n<tr><td>Sistematik yanlılık<\/td><td>Stil katkısı (S) ile aktif karar (A) arasında anlamlı korelasyon olmamalı: ρ(A, S) = 0<\/td><\/tr>\n<tr><td>Aktif risk (takip hatası)<\/td><td>P − B oynaklığı, P − M oynaklığından düşük olmalı<\/td><\/tr>\n<tr><td>Risk profili<\/td><td>Sistematik risk yapısı referansla benzer olmalı; kalıcı sapma yanlılık yaratır<\/td><\/tr>\n<tr><td>Karşılama<\/td><td>Hem portföyde hem referansta bulunan varlıkların piyasa değeri / portföy piyasa değeri; yüksek olmalı<\/td><\/tr>\n<tr><td>Değişim / devir<\/td><td>Düzenli dengeleme gerekir ama aşırı değişim kaliteyi bozar<\/td><\/tr>\n<tr><td>Pozitif aktif pozisyon<\/td><td>Aktif yöneticiler pozitif aktif ağırlık tutma eğiliminde olur; çok sayıda negatif aktif pozisyon referansın yanlış kurgulandığını gösterir<\/td><\/tr>\n<\/table>\n", "sorular": [{"q": "Getirisi %18, standart sapması %24, betası 1,2 olan portföy için risksiz faiz %6'dır. Sharpe ve Treynor ölçütleri nedir?", "o": ["0,75 ve 0,15", "0,10 ve 0,50", "0,50 ve 0,10", "0,50 ve 0,20", "0,25 ve 0,10"], "a": 2, "e": "Sharpe = (18 - 6)/24 = 0,50. Treynor = (0,18 - 0,06)/1,2 = 0,10. Risksiz faizi düşmemek 0,75 ve 0,15 verir."}, {"q": "Risksiz faiz %4'tür. İyi çeşitlendirilmiş Fon X: getiri %15, σ %12, β 1,1. Beş hisseye yoğunlaşmış Fon Y: getiri %19, σ %28, β 1,0. Pazar: getiri %12, σ %10, β 1. Fon Y için doğru tespit hangisidir?", "o": ["Treynor'a göre pazardan iyi (0,15 ile 0,08'in üzerinde), Sharpe'a göre kötüdür (0,54 ile 0,80'in altında)", "Hem Sharpe hem Treynor'a göre pazardan iyidir", "Treynor'a göre pazardan kötü, Sharpe'a göre iyidir", "Hem Sharpe hem Treynor'a göre pazardan kötüdür", "Sharpe ve Treynor değerleri pazarınkine eşittir"], "a": 0, "e": "Fon Y: Sharpe (19-4)/28 ≈ 0,54, pazarın 0,80 değerinin altında; Treynor 15/1,0 = 0,15, pazarın 0,08 değerinin üzerinde. Kötü çeşitlendirilmiş fonun spesifik riski standart sapmayı yükseltir; Treynor bunu görmez."}, {"q": "Getirisi %16, standart sapması %20 olan fon için pazarın standart sapması %12, getirisi %12, risksiz faiz %4'tür. M² ölçütü ve yorumu hangisidir?", "o": ["%13,6; pazarın 1,6 puan üzerinde", "%11,2; pazarın 0,8 puan üzerinde", "%0,6; pazardan iyi", "%11,2; riske göre düzeltildiğinde pazarın 0,8 puan altında", "%16,0; pazarın 4 puan üzerinde"], "a": 3, "e": "M² = (16 - 4)/20 × 12 + 4 = 0,6 × 12 + 4 = %11,2. Pazar getirisi %12 olduğu için fon riske göre düzeltildiğinde pazarın altındadır."}, {"q": "Bir serbest fonun altı aylık getirileri %7, -%3, %4, %0, %9 ve %1'dir. Hedef getiri aylık %2 ise Sortino ölçütü yaklaşık kaçtır?", "o": ["0,24", "0,45", "1,34", "0,33", "0,20"], "a": 1, "e": "Ortalama %3. Hedefin altındaki sapmalar: -5, -2, -1; kareler toplamı 30; /6 = 5; yarı standart sapma √5 ≈ 2,236. Sortino = (3 - 2)/2,236 ≈ 0,45."}, {"q": "Betası 1,3 olan fonun getirisi %20, pazar getirisi %14, risksiz faiz %5'tir. Jensen alfası kaçtır?", "o": ["%6,0", "%2,0", "%1,7", "-%3,3", "%3,3"], "a": 4, "e": "Beklenen getiri = 5 + 1,3 × (14 - 5) = %16,7. Alfa = 20 - 16,7 = %3,3. Pazar getirisiyle doğrudan fark (%6) beta riskini yok sayar."}, {"q": "Alfası %3 olan portföyün toplam riski %22, betası 1,2, pazarın standart sapması %15'tir. Değerlendirme ölçütü yaklaşık kaçtır?", "o": ["0,14", "0,17", "0,24", "0,75", "0,20"], "a": 2, "e": "Sistematik risk 1,2 × 15 = %18. σe = √(0,22² - 0,18²) = √0,016 ≈ %12,65. Dp = 3/12,65 ≈ 0,24. Toplam riske bölmek 0,14 verir."}, {"q": "Fon getirisi %21, referans endeks getirisi %17, yıllıklandırılmış takip hatası %5'tir. Bilgi ölçütü kaçtır ve yönetici aktif ağırlıklarını iki katına çıkarırsa ne olur?", "o": ["0,8; değişmez", "0,8; iki katına çıkar", "1,25; değişmez", "0,8; yarıya iner", "4,2; değişmez"], "a": 0, "e": "Bp = (21 - 17)/5 = 0,8. Aktif ağırlıklar ikiye katlanınca aktif getiri ve takip hatası birlikte ikiye katlanır; oran sabit kalır."}, {"q": "Piyasanın yükseldiği dönemlerde fon %18, referans %15; düştüğü dönemlerde fon -%9, referans -%12 getiri sağlamıştır. Yakalama ölçütü ve getiri profili nedir?", "o": ["0,625; konkav (negatif asimetri)", "1,2; doğrusal", "0,9; konkav", "1,6; konveks (pozitif asimetri)", "1,6; konkav"], "a": 3, "e": "Uc = 18/15 = 1,2; Dc = -9/-12 = 0,75; C = 1,2/0,75 = 1,6. C > 1 konveks getiri profilidir."}, {"q": "Portföy ağırlıkları finans %30, sanayi %50, teknoloji %20; referans ağırlıklar %40, %35, %25'tir. Portföy getirileri %14, %9, %18; referans getirileri %11, %10, %16'dır. BHB modeline göre toplam aktif getiri ve varlık seçimi etkisi nedir?", "o": ["Aktif getiri %0,4; seçim etkisi -%0,4", "Aktif getiri %0,4; seçim etkisi %1,35", "Aktif getiri %2,9; seçim etkisi %1,5", "Aktif getiri %0,4; seçim etkisi -%0,55", "Aktif getiri %1,35; seçim etkisi %0,4"], "a": 1, "e": "rp = %12,3, rb = %11,9, aktif %0,4. Dağılım Σ(wp - wb)rb = -%0,4; seçim Σ(rp - rb)wb = 1,2 - 0,35 + 0,5 = %1,35; etkileşim -%0,55. Toplam -0,4 + 1,35 - 0,55 = %0,4."}, {"q": "Dört hisselik bir evrende portföy ağırlıkları %40, %20, %25, %15; referans ağırlıklar her biri %25'tir. Aktif pay kaçtır?", "o": ["%30", "%85", "%7,5", "%25", "%15"], "a": 4, "e": "Mutlak farklar 15, 5, 0, 10; toplam 30; AS = ½ × 30 = %15. Portföy referansa %85 benzer; yarıya bölmemek %30 verir."}, {"q": "Portföyün piyasa, SMB ve HML duyarlılıkları 1,05; 0,50; -0,10, referansınki 1,00; 0,20; 0,20'dir. Faktör performansları %6, %2 ve -%2, portföyün alfası %1 ise toplam aktif getiri kaçtır?", "o": ["%1,5", "%3,1", "%2,5", "%1,9", "%0,9"], "a": 2, "e": "Faktör eğilimi: 0,05 × 6 + 0,30 × 2 + (-0,30) × (-2) = 0,3 + 0,6 + 0,6 = %1,5. Alfa eklenince aktif getiri %2,5. HML'de negatif eğilim, değer hisseleri kaybettirdiği dönemde katkı sağlamıştır."}, {"q": "Özelleştirilmiş referans portföyü %16,5, geniş piyasa endeksi %13 getiri sağlarken fon %18 kazanmıştır. Bailey analizine göre stil ve aktif yönetim etkileri nedir?", "o": ["Stil %3,5; aktif %1,5", "Stil %1,5; aktif %3,5", "Stil %5; aktif %1,5", "Stil %3,5; aktif %5", "Stil %0; aktif %5"], "a": 0, "e": "S = B - M = 16,5 - 13 = %3,5; A = P - B = 18 - 16,5 = %1,5. Fonun piyasayı %5 geçmesinin yalnız %1,5'i yönetici becerisidir."}, {"q": "Yatırımcıların dilediği zaman para yatırıp çekebildiği ve yöneticinin nakit akışları üzerinde kontrolünün olmadığı yatırım fonlarında hangi getiri yöntemi kullanılmalıdır?", "o": ["Para ağırlıklı getiri (iç verim oranı)", "Brüt aritmetik getiri", "Yalnız net varlık değeri değişimi", "Zaman ağırlıklı getiri", "Vergi sonrası reel getiri"], "a": 3, "e": "Nakit akışlarının etkisini dışlayan zaman ağırlıklı getiri kullanılır. Para ağırlıklı getiri, nakit zamanlamasını yöneticinin belirlediği özel sermaye fonları için uygundur."}, {"q": "Portföy yöneticisinin performansı ölçülürken aşağıdaki maliyetlerden hangisi brüt getiri içinde bırakılmalıdır?", "o": ["Alım-satım komisyonları", "Saklama giderleri", "Portföy yönetim ücreti", "Yöneticinin işlem sıklığından doğan maliyetler", "Yöneticinin seçtiği aracı kurum komisyonu"], "a": 1, "e": "Komisyonlar ve yönetim ücreti yöneticinin kontrolündedir ve düşülür; saklama, denetim ve yasal giderler kontrol dışındadır, brüt getiri içinde kalır."}, {"q": "Sharpe ölçütü ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Getirilerin normal dağıldığını varsayar", "Toplam riski (standart sapma) kullanır", "Sermaye piyasası doğrusu üzerindeki portföylerin Sharpe değeri pazarınkine eşittir", "Tek başına performans farkının ekonomik anlamlılığını göstermez", "Portföy getirisi risksiz faizin altındayken de sıralama için güvenilir sonuç verir"], "a": 4, "e": "Pay negatifse daha riskli portföy daha az negatif değer alarak yanıltıcı biçimde iyi görünür; Sharpe sıralama için kullanılamaz."}, {"q": "Getirileri normal dağılmayan, opsiyon yazan veya kalın kuyruklu stratejiler izleyen bir serbest fonun performansını ölçmek için en uygun ölçüt hangisidir?", "o": ["Treynor ölçütü", "Sharpe ölçütü", "Sortino ölçütü", "Aktif pay", "Karşılama oranı"], "a": 2, "e": "Sortino yalnız hedef getirinin altındaki sapmaları dikkate alır; asimetrik getirili alternatif yatırımlarda Sharpe'tan üstündür."}, {"q": "Jensen alfasının ekonomik anlamı aşağıdakilerden hangisidir?", "o": ["Yatırımcının yöneticiye ödemeye razı olacağı maksimum yönetim ücreti", "Portföyün toplam riski", "Portföyün referansa benzerlik oranı", "Birim aktif risk başına ek getiri", "Takip hatasının karesi"], "a": 0, "e": "Jensen alfası yaratılan farksal getirinin yatırımcı servetine net katkısıdır ve ödenebilecek maksimum yönetim ücretini temsil eder."}, {"q": "Performans ölçü birimleri ile kriterlerinin eşleştirilmesinde hangisi yanlıştır?", "o": ["Sharpe – toplam risk", "Sortino – aşağı yönlü risk", "Değerleme ölçütü – spesifik risk", "Bilgi ölçütü – sistematik risk", "Yakalama ölçütü – piyasa duyarlılığı"], "a": 3, "e": "Bilgi ölçütünün kriteri aktif risktir; sistematik risk Treynor ölçütüne aittir."}, {"q": "Takip hatası çok düşük ve bilgi ölçütü negatif olan, aktif yönetildiğini iddia eden bir fon için en olası teşhis hangisidir?", "o": ["Konsantre hisse seçici fon", "Gizli endeks (closet index) fonu", "Sektör rotasyon fonu", "Konveks getiri profilli fon", "Faktör eğilimi yüksek fon"], "a": 1, "e": "Endeksi neredeyse kopyalayıp üzerine yüksek yönetim ücreti kesen fonlar düşük takip hatası ve negatif bilgi ölçütüyle teşhis edilebilir."}, {"q": "Sektör uygulamalarında genellikle yüksek kabul edilen aktif risk ve aktif pay eşikleri hangisidir?", "o": ["Aktif risk %2 ve üzeri, aktif pay %20 ve üzeri", "Aktif risk %10 ve üzeri, aktif pay %50 ve üzeri", "Aktif risk %5 ve üzeri, aktif pay %90 ve üzeri", "Aktif risk %1 ve üzeri, aktif pay %100", "Aktif risk %7 ve üzeri, aktif pay %70 ve üzeri"], "a": 4, "e": "Standart bir eşik olmamakla birlikte sektör uygulamasında aktif risk için %7, aktif pay için %70 ve üzeri yüksek kabul edilir."}, {"q": "Aktif payı yüksek, aktif riski yüksek ve R² değeri düşük bir portföy hangi türe girer?", "o": ["Hisse seçici ve çeşitlendirilmiş", "Çeşitlendirilmiş faktör portföyü", "Hisse seçici ve konsantre", "Pasif endeks fonu", "Gizli endeks fonu"], "a": 2, "e": "Yüksek aktif pay hisse seçimini, yüksek aktif risk ve düşük R² sistematik olmayan bileşenin büyüklüğünü yani konsantrasyonu gösterir."}, {"q": "Referans portföy kalite standartlarından \"sistematik yanlılık\" neyi ifade eder?", "o": ["Stil katkısı ile aktif karar arasında anlamlı korelasyon bulunmasını", "Portföy ile referansın ortak varlıklarının piyasa değeri oranını", "Referansın gereğinden fazla değiştirilmesini", "P - B oynaklığının P - M oynaklığından düşük olmasını", "Referans portföyün değerlendirmeden önce oluşturulmasını"], "a": 0, "e": "İyi kurgulanmış referans portföyde ρ(A, S) = 0 olmalıdır. Karşılama, devir ve aktif risk ayrı standartlardır; önceden belirlenme ise Bailey ilkesidir."}, {"q": "Bailey'nin referans portföy ilkeleri arasında aşağıdakilerden hangisi yer almaz?", "o": ["Açıklık", "Yatırım yapılabilirlik", "Ölçülebilirlik", "Geçmiş performansa göre sonradan seçilebilme", "Uygunluk"], "a": 3, "e": "İlkeler açıklık, yatırım yapılabilirlik, ölçülebilirlik, uygunluk ve önceden belirlenmedir; performans sonradan oluşturulan ölçütlere göre değerlendirilmemelidir."}, {"q": "Faktör bazlı mutlak performans analizinde hata terimi neyi temsil eder?", "o": ["Zamanlamayı ve yönetici performansını", "Portföydeki yoğunlaşmayı; konsantre portföylerde yüksek olur", "Çeşitlendirmeyi", "Piyasa risk primini", "Faktör eğilimini"], "a": 1, "e": "Risk faktörleri çeşitlendirmeyi, alfa zamanlamayı ve yönetici performansını, hata terimi yoğunlaşmayı temsil eder; zamanlama ile yoğunlaşma birlikte seçim etkisini oluşturur."}]}];
const P={"1": ["Merhaba, Temel Finans Matematiği dersinin ilk bölümündeyiz. Bugün paranın zaman değerini konuşacağız. Basit ve bileşik faiz, efektif faiz, bugünkü değer, anüite ve perpetüite bu bölümün omurgası. Bu dersin soruları neredeyse hep hesap sorusu. O yüzden formülleri mantığıyla birlikte oturtalım.", "Önce temel fikir. Yatırım, bugünkü tüketimden gelecekte daha fazlasını elde etmek için vazgeçmektir. Tüketimi ertelemenin ödülüne paranın zaman değeri diyoruz. Fiyatların sabit olduğu ve belirsizliğin hiç olmadığı hayali bir dünyada bu ödüle paranın saf zaman değeri denir.", "Gerçek hayatta ise yatırımcı üç şeyin karşılığını ister. Birincisi vazgeçtiği zaman. İkincisi paranın satın alma gücündeki değişim. Üçüncüsü gelecekteki ödemelerin belirsizliği. Bu üç unsuru karşılayan orana gerekli getiri oranı deniyor. Şunu da not et, paranın zaman değeri faizle sınırlı değildir.", "Şimdi basit faiz ile bileşik faiz. Basit faizde faiz her yıl yalnızca anapara üzerinden hesaplanır. Yüz lirayı yüzde onla beş yıl tutarsan her yıl on lira kazanırsın ve yüz elli liraya ulaşırsın. Bileşik faizde ise her yılın faizi anaparaya eklenir. Aynı yüz lira beş yılın sonunda yüz altmış bir lira beş kuruş olur.", "Bu farkın adı faizin faizi, yani bileşik etki. Vade uzadıkça fark büyür. Kitaptaki örnekte bin lirayı yüzde onla elli yıl tutarsan yüz on yedi bin lirayı aşarsın. Bunun yalnızca beş bin lirası basit faizdir. Yüz on bin lirayı aşan kısım tamamen faizin faizidir, çünkü bileşik faiz üstel büyür.", "Gelelim efektif yıllık faize. Bankalar faizi yıllık nominal oran olarak duyurur ama yıl içinde birkaç kez bileşikleyebilir. Yüzde yirmi yarıyıllık bileşik demek, her altı ayda yüzde on demektir. Bin lira bir yılda bin iki yüz on lira olur. Yani efektif oran yüzde yirmi değil, yüzde yirmi birdir.", "Formülün mantığı basit. Nominal oranı yıl içindeki dönem sayısına böl, bire ekle, dönem sayısı kadar kuvvetini al ve birini çıkar. Sınavda iki bankayı karşılaştıran sorular çok çıkıyor. Burada dur bir saniye, çünkü tuzak şurada. Nominal oranı yüksek olan banka her zaman daha çok kazandırmaz. Daima efektif orana çevirip öyle karşılaştır.", "Bileşikleme sıklığını sonsuza götürürsek sürekli bileşik faize ulaşırız. Bu durumda efektif oran, e sayısının faiz oranı kadar kuvvetinden bir çıkarılarak bulunur. Tersini istersen, bir artı efektif oranın doğal logaritmasını alırsın. Yüzde yirmi bir efektif oranın sürekli karşılığı yaklaşık yüzde on dokuz virgül sıfır altıdır. Bu dönüşüm özellikle opsiyon fiyatlamasında kullanılır.", "Şimdi bugünkü değer ve gelecekteki değer. Gelecekteki değer, bugünkü paranın faiz kazanarak ulaşacağı tutardır. Bugünkü değer ise gelecekteki paranın iskonto oranıyla bugüne indirilmiş hâlidir. Biri çarpar, öteki böler. Gelecekteki değer için bir artı faizin dönem sayısı kadar kuvvetiyle çarparsın, bugünkü değer için aynı sayıya bölersin.", "Nakit akışları ya bir defalıktır ya da seri hâlindedir. Seri içindeki tutarlar farklıysa her birini ayrı ayrı taşır ve toplarsın. Tutarlar eşit, aralıklar eşit ve yönleri aynıysa bu seriye anüite denir. Anüitede seriyi tek formülle hesaplayabilirsin. Mesela her yıl on bin lirayı yüzde onla beş yıl biriktiren biri altmış bir bin elli bir liraya ulaşır.", "Anüitede dikkat etmen gereken iki nokta var. Birincisi ödeme zamanı. Ödemeler dönem başındaysa dönem sonu formülüyle bulduğun değeri bir artı faizle çarparsın. İkincisi dönem uyumu. Kredi aylık ödeniyorsa yıllık faizi on ikiye böl, dönem sayısını da ay olarak al. Yüzde yirmi dört yıllık faiz, aylık yüzde iki demektir.", "Kredi sorularında sık sorulan bir şey daha var. İlk taksitin ne kadarı faiz, ne kadarı anapara. Faiz payı, kalan borcun dönemsel faizle çarpımıdır. Anapara payı da taksitten bu faizi çıkarınca kalır. Kalan borcu soruyorlarsa, kalan taksitlerin bugünkü değerini hesaplarsın. Ödenen taksitleri borçtan düz çıkarmak yanlıştır, çünkü taksitin bir kısmı faizdir.", "Son konu perpetüite. Sonsuza kadar süren, her dönem aynı tutarı ödeyen seri. Değeri çok basit, ödemeyi iskonto oranına bölersin. Yıllık seksen bin lira kira getiren bir işyeri için yüzde kırk getiri istiyorsan en fazla iki yüz bin lira ödersin. Gerçek hayatta süresiz temettü veren bir hisse ya da consol tahvil bu yaklaşıma yakındır.", "Nakit akışı her yıl sabit bir oranda büyüyorsa büyüyen perpetüite kullanılır. Bu kez gelecek yılın nakit akışını, iskonto oranı ile büyüme oranının farkına bölersin. Burada iki tuzak var. Geçen yılın temettüsü verilmişse önce büyüme oranıyla büyütmelisin. Ayrıca iskonto oranı büyüme oranından büyük olmalı, yoksa formül çalışmaz.", "Kitaptaki hisse örneği güzel bir yorum sorusu. Geçen yıl beş lira temettü ödenmiş, büyüme yüzde dokuz, gerekli getiri yüzde on sekiz. Gelecek yılın temettüsü beş lira kırk beş kuruş olur, teorik değer de altmış lira elli altı kuruş. Hisse borsada yüz on liradan işlem görüyorsa aşırı değerlidir. Büyüme yüzde altıya inerse değer kırk dört lira on yedi kuruşa düşer.", "Toparlayalım. Birincisi, basit faiz yalnız anaparaya, bileşik faiz birikmiş tutara işler. İkincisi, faizleri karşılaştırırken daima efektif yıllık orana çevir. Üçüncüsü, dönem başı ödemede bir artı faizle çarp, aylık ödemede faizi on ikiye böl. Dördüncüsü, kalan borç kalan taksitlerin bugünkü değeridir. Beşincisi, büyüyen perpetüitede payda gelecek yılın nakit akışı yazılır ve iskonto oranı büyüme oranından büyük olmalıdır."], "2": ["Merhaba, ikinci bölümdeyiz. Bu bölümde getiri ve riski konuşacağız. Önce farklı getiri hesaplama yollarını, sonra varyans, standart sapma ve portföy riskini ele alacağız. Sonunda da risk primi ve normal dağılımdan sapmalarla bitireceğiz.", "Şöyle başlayalım. Bir dolap alırken rengine, rafına, malzemesine bakarsın. Finansal varlıkta ise sadece iki şeye bakarsın, getiri ve risk. Getirinin iki kaynağı var. Biri temettü ya da faiz gibi dönemsel gelir, diğeri fiyat artışından gelen sermaye kazancı.", "Tek dönemlik getiriye elde tutma getirisi denir. Fiyat farkına temettüyü ekler, dönem başı fiyata bölersin. Yüz liraya aldığın hisse yüz on lira olmuş ve dört lira temettü vermişse getirin yüzde on dörttür. Bunun yüzde onu sermaye kazancı, yüzde dördü kâr payı verimidir.", "Birden fazla dönem varsa ortalama almanın iki yolu var. Aritmetik ortalama getirileri toplayıp dönem sayısına böler. Geometrik ortalama ise bileşik mantıkla çalışır. Eksi kırk beş, artı otuz iki ve artı yirmi sekiz getirilerini düşün. Aritmetik ortalama yüzde beş der ama yüz liran üç yıl sonra doksan iki lira doksan kuruş olur. Gerçeği geometrik ortalama söyler.", "Bunu sınavda çok soruyorlar. Aritmetik ortalama her zaman geometrik ortalamaya eşit ya da ondan büyüktür. Eşitlik sadece bütün getiriler aynıysa olur. Oynaklık arttıkça aradaki fark açılır. Gelecek yılı tahmin ediyorsan aritmetik, geçmiş performansı özetliyorsan geometrik ortalamayı kullan.", "Peki yatırımcı arada para ekleyip çekiyorsa ne olacak. O zaman para ağırlıklı getiri, yani iç verim oranı devreye girer. Yatırdığın paraları eksi, çektiklerini ve son bakiyeyi artı yazarsın. Bu akışların bugünkü değerini sıfır yapan oran iç verim oranıdır. Kitaptaki örnekte bu oran yüzde yirmi virgül altı çıkıyor.", "Fon yöneticisini değerlendirirken ise zaman ağırlıklı getiri kullanılır. Çünkü müşterinin ne zaman para yatıracağı yöneticinin elinde değil. Her büyük nakit hareketinde dönemi bölersin. Her alt dönemin getirisini dönem başında yatırılan tutara göre bulursun. Sonra bu getirileri bir ekleyerek çarparsın. Kısacası yöneticinin başarısı zaman ağırlıklı, senin cebine giren para ağırlıklı getiriyle ölçülür.", "Farklı vadeli getirileri karşılaştırmak için yıllıklandırma yaparsın. Dönem getirisine bir ekler, yıl içindeki dönem sayısı kadar kuvvetini alır, birini çıkarırsın. Aylıkta on iki, haftalıkta elli iki, günlükte üç yüz altmış beş kullanılır. Soruda yıl üç yüz altmış gün denmişse ona uy. On sekiz aylık getiride kuvvet birden küçük olur, on ikinin on sekize oranıdır.", "Beklenen getiri, senaryo getirilerinin olasılıkla ağırlıklı ortalamasıdır. Portföy getirisi de varlık getirilerinin ağırlıklı ortalamasıdır. Burada dur bir saniye, çünkü aynı kolaylık risk için geçerli değil. Portföyün riski ağırlıklı ortalama değildir, varlıkların birlikte hareketine bağlıdır.", "Getiriyi etkileyen başka faktörler de var. Vergi sonrası getiri için getiriyi bir eksi vergi oranıyla çarparsın. Reel getiri için ise bir artı nominal getiriyi bir artı enflasyona bölersin. Enflasyonu düz çıkarmak sınavda en sık yapılan hatadır. Yatırım kararında asıl güvenilir ölçü vergi sonrası reel getiridir.", "Kaldıraç da önemli. Diyelim yatırımın getirisi yüzde on beş ve özkaynağının yarısı kadar yüzde on faizle borç aldın. Özkaynak getirin yüzde on beşe, borç oranı çarpı getiri farkı eklenerek yüzde on yedi buçuk olur. Kaldıraç riski de aynı oranda büyütür. Yüzde otuz borçla yüzde yirmilik risk yüzde yirmi altıya çıkar.", "Şimdi riske geçelim. Riskte olasılıkları objektif olarak bilirsin, belirsizlikte bilmezsin. En yaygın risk ölçüsü varyans ve onun karekökü olan standart sapmadır. Örneklemle çalışıyorsan paydaya gözlem sayısı eksi bir yazarsın. Buna serbestlik derecesi denir.", "Yatırımcı çoğu zaman sadece kötü sürprizlerden korkar. Bunun için semivaryans kullanılır. Bir hedef getiri belirlersin, sadece hedefin altında kalan ayları hesaba katarsın. Ama paydaya yine toplam gözlem sayısını yazarsın. Karekökünü alınca aşağı yönlü sapmayı bulursun.", "İki varlıklı portföyde riskin anahtarı korelasyondur. Kovaryans sadece yön söyler, büyüklüğü yorumlanamaz. Korelasyon ise kovaryansı iki standart sapmanın çarpımına bölerek bulunur. Kitaptaki örnekte eksi sıfır virgül seksen yedi korelasyon sayesinde portföy riski tek hissenin bile altına iniyor. Buna çeşitlendirme etkisi diyoruz.", "Korelasyonun sınırlarını da bil. Sadece doğrusal ilişkiyi ölçer, uç gözlemlerden kolay etkilenir ve nedensellik göstermez. Ayrıca sabit değildir. Kriz dönemlerinde korelasyonlar yükselir, sakin dönemlerde düşer. Yani çeşitlendirmeye en çok ihtiyaç duyduğun anda etkisi azalabilir.", "Risk ile getiri arasında pozitif bir ilişki vardır. Hazine bonosunda risk primi yoktur. Devlet tahvili vade primi, kurumsal tahvil ayrıca kredi ve likidite primi taşır. Hisse senedi bunların üstüne bir de ilave risk primi ekler. Kademeli farkları alarak her primi ayrı ayrı bulabilirsin.", "Son olarak normal dağılım. Normal dağılımda ortalama medyana eşittir ve dağılım simetriktir. Gerçek getiriler ise çarpık ve şişkin kuyrukludur. Getirilerin çoğu sağda toplanmışsa dağılım sola çarpıktır. Şişkin kuyruk uç olayların sık yaşanması demektir ve riske maruz değer gibi tekniklerle ölçülür.", "Toparlayalım. Birincisi, aritmetik ortalama geometrik ortalamadan küçük olamaz. İkincisi, yönetici başarısı zaman ağırlıklı, yatırımcının kazancı para ağırlıklı getiriyle ölçülür. Üçüncüsü, reel getiride enflasyona bölersin, çıkarmazsın. Dördüncüsü, örneklem varyansında payda gözlem sayısı eksi birdir. Beşincisi, portföy riski korelasyona bağlıdır ve korelasyon düştükçe risk azalır."], "3": ["Merhaba, üçüncü bölüme geldik, portföy teorisi. Bugün fayda ve kayıtsızlık eğrileriyle başlayacağız. Ardından Markowitz'in ortalama varyans modeline, etkin sınıra ve optimal portföye geçeceğiz. En sonda Tobin'in portföy seçimi teoremi ve risksiz varlıkla bitireceğiz.", "Önce fayda. Fayda, bir şeye sahip olmanın verdiği tatmindir. Servetteki artıştan doğan fayda, sahip olduğun servetle ters orantılıdır. Yani aynı bin lira fakir birini zengin birinden daha çok mutlu eder. Fayda fonksiyonunun üç özelliği var. Herkesinki farklıdır, her zaman pozitiftir ve azalarak artar.", "Riske karşı üç tutum var. Riske kayıtsız olan için bir birim servet artışının faydası hep aynıdır. Riskten hoşlanan için kazancın sevinci kaybın acısından büyüktür, riskten kaçınan içinse kaybın acısı daha büyüktür. Yazı tura örneğinde yüzde elli ihtimalle yüz lira ile garanti elli lira arasında seçim yaparsın. Riskten kaçınan garanti elli lirayı alır.", "Bunu sayıya dökmek için fayda fonksiyonu kullanılır. Fayda, beklenen getiriden yarım çarpı A çarpı varyans çıkarılarak bulunur. A riskten kaçınma katsayısıdır. Pozitifse riskten kaçınan, sıfırsa riske kayıtsız, negatifse riski seven yatırımcıdır. Burada dur bir saniye, çünkü sınavda yarım çarpanını ve standart sapmanın karesini almayı unutturmaya çalışırlar.", "Kitaptaki örnekte A katsayısı beş olan bir yatırımcı var. Hisse fonu yüzde yirmi beş getiri ama yüzde kırk risk sunuyor. Para piyasası fonu yüzde on beş getiri ve yüzde on risk sunuyor. Hisse fonunun faydası eksi sıfır virgül on beş, para piyasası fonununki artı sıfır virgül yüz yirmi beş. Yatırımcı daha düşük getiriye rağmen para piyasası fonunu seçer.", "Kayıtsızlık eğrisi, aynı faydayı veren getiri ve risk bileşimlerini birleştirir. Kuzeybatıya, yani daha az risk ve daha çok getiriye doğru gittikçe fayda artar. Eğriler birbirine paraleldir ve asla kesişmez. Dik eğri riske duyarlı, yatık eğri riske daha az duyarlı yatırımcıyı gösterir. Riske kayıtsız yatırımcının eğrisi ise risk eksenine paraleldir.", "Şimdi Markowitz. Bin dokuz yüz elli iki yılında yazdığı Portföy Seçimi makalesiyle riski ilk kez varyansla ölçtü. Ona göre riski azaltmanın en etkin yolu çeşitlendirmedir. Kitaptaki altın ve dünya hisse endeksi örneğinde korelasyon sıfır virgül iki üç dokuz. Eşit ağırlıklı portföy, hisse endeksinden daha yüksek getiriyi daha düşük riskle sağlıyor.", "Etkin portföy şu demek. Aynı riskte en yüksek getiriyi ya da aynı getiride en düşük riski veren portföy. Bu portföyleri birleştiren eğriye etkin sınır denir. Sınavda dört beş portföy verip hangileri etkin diye soruyorlar. Aynı riskli olanlardan getirisi düşüğü, aynı getirili olanlardan riski yükseği ele. Geriye kalanlar etkindir.", "Korelasyonun üç özel durumu var. Korelasyon artı bir ise portföy riski ağırlıklı ortalamaya eşittir ve çeşitlendirme hiç işe yaramaz. Eksi bir ise doğru ağırlıklarla riski tamamen sıfırlayabilirsin. Arada bir değerse risk ağırlıklı ortalamanın altına iner. Bir de minimum varyans portföyü var. Bu, etkin sınırın en sol noktasıdır ve iki varlıkta özel bir formülle hesaplanır.", "Peki yatırımcı etkin sınırdan hangi portföyü seçer. Kendi kayıtsızlık eğrisinin etkin sınıra teğet olduğu noktayı seçer. Riskten çok kaçınan biri sınırın alt kısmında, cesur biri üst kısmında durur. Yani etkin sınır herkes için aynıdır ama optimal portföy kişiye göre değişir.", "Modele eleştiriler de geldi. Bir kısmı varsayımlara yönelik. Getirilerin normal dağıldığı, herkesin tek dönemlik ufku olduğu ve yalnız riskli varlıklara yatırım yapıldığı varsayımı gibi. Diğer kısmı uygulamaya yönelik, çünkü bu kadar çok tahmin ve hesap yapmak çok zor. Bu yükü hafifletmek için Sharpe tek endeks modelini geliştirdi.", "Çeşitlendirmenin bir sınırı da var. Eşit ağırlıklı portföye varlık ekledikçe her varlığa özgü risk erir gider. Ama varlık sayısı sonsuza gitse bile portföy varyansı sıfıra inmez. Ortalama kovaryansa yaklaşır. İşte bu yok edilemeyen riske sistematik risk ya da piyasa riski diyoruz.", "Şimdi Tobin. Bin dokuz yüz elli sekiz yılında risksiz varlığı modele ekledi. Ona göre seçim iki aşamalıdır. Birinci aşamada yatırımcı ne kadar risk alacağına, yani riskli ve risksiz paylaşımına karar verir. İkinci aşamada riskli kısmı seçer ve bu portföy herkes için aynıdır. İki karar birbirinden bağımsız olduğu için teorem portföy seçimini kolaylaştırır.", "Risksiz varlığın riski sıfır olduğu için karma portföyün riski, riskli ağırlık çarpı riskli standart sapmadır. Getirisi ise ağırlıklı ortalamadır. Bu ikisi birleşince bir doğru çıkar, adı Varlık Bileşim Doğrusu. Doğrunun eğimi, risk primini standart sapmaya bölerek bulunur. Buna Sharpe ölçütü de denir.", "Doğru üzerinde riskli portföyün solunda kalanlar ödünç veren portföylerdir, çünkü paranın bir kısmı risksiz varlıktadır. Sağında kalanlar ödünç alan portföylerdir, çünkü yatırımcı borçlanıp riskli portföye yüzde yüzden fazla yatırır. Etkin sınıra teğet olan doğrudaki portföy en üstün portföydür. Bu fikir bir sonraki bölümün, yani Finansal Varlıkları Fiyatlama Modeli'nin temelidir.", "Hedef getiri soruları da çok sık çıkıyor. Önce hedefi brüt hâle getir. Enflasyonu ve işlem maliyetini çarparak ekle, vergiyi bir eksi vergi oranına bölerek ekle. Sonra hedefi aşan portföyler arasından riski düşük olanı ya da Sharpe ölçütü yüksek olanları seç. En son basit bir ağırlık denklemiyle dağılımı bulursun.", "Toparlayalım. Birincisi, fayda beklenen getiriden yarım çarpı A çarpı varyans çıkarılarak bulunur. İkincisi, kayıtsızlık eğrileri kesişmez ve kuzeybatıya gittikçe fayda artar. Üçüncüsü, etkin portföy aynı riskte en yüksek getiriyi verir, optimal portföy ise teğet noktadadır. Dördüncüsü, Tobin'e göre riskli portföy herkes için aynıdır, değişen sadece risksiz varlıkla paylaşımdır. Beşincisi, riskli ağırlık yüzde yüzü aşarsa portföy ödünç alan portföydür."], "4": ["Merhaba, dördüncü bölümdeyiz. Konumuz Finansal Varlıkları Fiyatlama Modeli. Sermaye Pazarı Doğrusu ile başlayıp varsayımlara, betaya ve Menkul Kıymet Pazarı Doğrusu'na geçeceğiz. Sonunda alfa, beta tahmini ve endeks modeliyle bitireceğiz.", "Bu model, risk ile beklenen getiri arasındaki ilişkiyi açıklayan ilk denge modelidir. Markowitz'ten on iki yıl sonra Sharpe, Lintner ve Mossin birbirinden habersiz geliştirdi. Modelin iki işi var. Birincisi, bir varlığın sağlaması gereken adil getiriyi söylemek. İkincisi, halka arz edilecek bir hisse ya da yeni bir proje gibi henüz işlem görmeyen varlıklara getiri biçmek.", "Önce Sermaye Pazarı Doğrusu. Etkin bir portföyün beklenen getirisi, risksiz faiz artı riskin pazar fiyatı çarpı portföyün standart sapmasıdır. Riskin pazar fiyatı, pazarın risk primini pazarın standart sapmasına bölerek bulunur. Mesela pazar yüzde on altı getiriyor, riski yüzde yirmi beş, risksiz faiz yüzde altı. Riskin fiyatı sıfır virgül kırk olur.", "Ama bu doğrunun bir eksiği var. Sadece iyi çeşitlendirilmiş portföylerde çalışır. Çünkü tek bir hissenin standart sapmasında çeşitlendirmeyle yok edilebilecek risk de vardır. Piyasa bu risk için prim ödemez. Finansal Varlıkları Fiyatlama Modeli burada devreye girer ve riski sadece sistematik kısımla, yani betayla ölçer.", "Modelin varsayımları sınavda çok çıkıyor. Yatırımcı tarafında dört tane var. Riskten kaçınma, rasyonellik, homojen beklentiler ve herkesin aynı tek dönemlik yatırım ufku. Homojen beklenti, herkesin beklenen getiri, varyans ve kovaryans tahminlerinin aynı olması demektir. Risk tercihlerinin aynı olması demek değildir, buna dikkat et.", "Piyasa tarafında ise dokuz varsayım var. Tam rekabet, bütün varlıkların alınıp satılabilmesi, başlangıçta dengede olan piyasa ve sonsuz bölünebilirlik. Bunlara risksiz faizden sınırsız borç alıp verme, bilgiye bedavaya erişim, sınırsız açığa satış, vergi ve işlem maliyetinin olmaması ve istikrarlı faiz eklenir. Bir teori varsayımlarının gerçekçiliğiyle değil, açıklama ve tahmin gücüyle değerlendirilir.", "Herkes aynı beklentiye sahipse herkes aynı riskli portföyü seçer. Dengede bu portföy pazar portföyüdür. Pazar portföyü bütün riskli varlıkları piyasa değerleri oranında içerir. Hiçbir varlık dışarıda kalamaz, çünkü kimse almazsa fiyatı cazip hâle gelene kadar düşer. Pratikte bunun Türkiye'deki karşılığı, Borsa İstanbul yüz endeksini izleyen bir endeks fonu ile devlet tahvilinin karışımıdır.", "Buna yatırım fonu teoremi ya da çift yatırım fonu teoremi deniyor. Pazarı temsil eden fonu profesyoneller kurar, yatırımcı da sadece bu fon ile risksiz varlık arasındaki payı seçer. Pazar risk primi ise yatırımcıların ortalama riskten kaçınma katsayısı ile pazar varyansının çarpımına eşittir. Ortalama katsayı üç, pazar riski yüzde on sekizse prim yaklaşık yüzde dokuz virgül yetmiş iki olur.", "Şimdi betaya gelelim. Beta, bir varlığın pazarla kovaryansının pazar varyansına oranıdır. Aynı şeyi korelasyon çarpı varlığın standart sapması bölü pazarın standart sapması diye de bulabilirsin. Pazarın betası bir, risksiz varlığın betası sıfırdır. Betası birden büyük olanlar agresif, birden küçük olanlar defansiftir. Bankalar ve otomotiv genelde agresif, gıda ve elektrik dağıtımı defansif örneklerdir.", "Ve modelin kalbi. Bir varlığın beklenen getirisi, risksiz faiz artı beta çarpı pazar risk primidir. Risksiz faiz yüzde yedi, pazar yüzde on beş ve beta bir virgül dört ise gerekli getiri yüzde on sekiz virgül iki olur. Burada dur bir saniye. Soruda pazar risk primi doğrudan verilmişse ondan bir kez daha risksiz faizi çıkarma.", "Bu ilişkinin grafiğine Menkul Kıymet Pazarı Doğrusu denir. Yatay eksende beta, dikey eksende beklenen getiri vardır. Doğrunun eğimi pazar risk primidir. Sermaye Pazarı Doğrusu sadece etkin portföylerde geçerliyken, bu doğru tek tek hisseler için de geçerlidir. İki doğruyu birbirine karıştırma, biri standart sapma, diğeri betayla çalışır.", "Doğrunun üstündeki varlık ucuzdur, çünkü riskine göre fazla getiri vaat eder. Herkes alır, fiyatı yükselir, getirisi düşer ve doğruya iner. Doğrunun altındaki varlık pahalıdır, satılır ve fiyatı düşer. Beklenen getiri ile gerekli getiri arasındaki farka alfa denir. Kitaptaki örnekte gerekli getiri yüzde on sekiz, beklenen yüzde yirmi, yani alfa yüzde iki.", "Fon performansında da aynı mantık var. Bir fon endeksi yüzde dört geçmiş olabilir. Ama betası birden büyükse bunu zaten yapması gerekiyordu. Gerçek başarı, betaya göre hesaplanan gerekli getirinin üstünde kalan kısımdır, yani alfadır. Aynı formülle bir projenin iskonto oranını da bulup net bugünkü değerini hesaplayabilirsin.", "Beta pratikte nasıl tahmin edilir. Ya kovaryansı varyansa bölersin ya da hissenin geçmiş getirilerini pazar getirisine regresyonla bağlarsın. Bu regresyon doğrusuna karakteristik doğru denir. Regresyon tercih edilir, çünkü tahminin güvenilirliğini test etmeye imkân verir. R kare ise getirideki dalgalanmanın ne kadarının pazarla açıklandığını gösterir.", "Son olarak test meselesi. Teorik pazar portföyü kurulamaz ve model beklentilere dayanır. Oysa biz sadece gerçekleşmiş getirileri görürüz. Bu yüzden uygulamada gözlenebilir bir endeksle çalışan endeks modeli kullanılır. Endeks modelindeki beta, fiyatlama modelindeki betanın aynısıdır. Fiyatlama modeli ise bütün varlıklarda alfanın beklenen değerinin sıfır olmasını öngörür.", "Toparlayalım. Birincisi, Sermaye Pazarı Doğrusu standart sapmayla çalışır ve sadece etkin portföylerde geçerlidir. İkincisi, Finansal Varlıkları Fiyatlama Modeli'nde beklenen getiri risksiz faiz artı beta çarpı pazar risk primidir. Üçüncüsü, pazarın betası bir, risksiz varlığın betası sıfırdır. Dördüncüsü, doğrunun üstündeki varlık ucuz, altındaki pahalıdır. Beşincisi, alfa beklenen getiri ile gerekli getiri arasındaki farktır."], "5": ["Merhaba, beşinci ve kapsamımızdaki son bölümdeyiz. Konumuz Arbitraj Fiyatlama Teorisi. Önce faktör modellerini, sonra teorinin mantığını ve arbitraj hesaplarını konuşacağız. En sonda Fama French ve Carhart modelleriyle iki fiyatlama modelinin karşılaştırmasına geçeceğiz.", "Finansal Varlıkları Fiyatlama Modeli ortalama varyans etkinliğine dayanıyordu. Ross ise bin dokuz yüz yetmiş altı ve yetmiş yedi yıllarında farklı bir yol açtı. Ona göre fiyatları belirleyen şey arbitraj imkânının olmamasıdır. Arbitraj, aynı varlığın iki yerde farklı fiyatlanmasından risksiz kâr elde etmektir. Ucuzdan alıp pahalıdan satarsın ve fark kapanana kadar bu sürer.", "Önce tek faktör modeli. Bir hissenin gerçekleşen getirisi üç parçadan oluşur. Beklenen getiri, faktördeki sürprizin betayla çarpımı ve şirkete özgü şok. Burada dur bir saniye, çünkü faktör beklenen değeri değil sürprizi ölçer. Beklenen büyüme yüzde beş, gerçekleşen yüzde dört virgül iki ise sürpriz eksi sıfır virgül sekizdir.", "Örnek verelim. Betası bir virgül yirmi beş olan hisse bu sürprizle beklenenden yüzde bir daha az kazanır. Çok faktörlü modelde aynı mantığı her faktör için ayrı ayrı uygularsın. Büyüme, enflasyon ve faiz sürprizlerini kendi betalarıyla çarpar, toplarsın. Üstüne şirkete özgü şoku ve beklenen getiriyi eklersin.", "Şimdi beklenen getirinin kendisi nereden geliyor ona bakalım. Çok faktörlü Menkul Kıymet Pazarı Doğrusu der ki beklenen getiri, risksiz faiz artı her faktör için beta çarpı o faktörün risk primidir. Kitaptaki örnekte yüzde altı risksiz faize dört virgül sekiz, bir virgül altı ve üç eklenir, toplam yüzde on beş virgül dört olur.", "Bu modelin önemli bir farkı var. Faktör primleri ve betalar negatif olabilir. Faiz yükselince değer kazanan bir varlık yatırımcısını faiz riskine karşı korur. Bu yüzden yatırımcı ondan daha düşük getiriye razı olur, yani prim negatif olur. Negatif beta ile negatif prim çarpılınca da getiriye pozitif katkı gelir, bu hesap tuzağına dikkat et.", "Ross'un teorisi üç önermeye dayanır. Birincisi, getiriler bir faktör modeliyle açıklanabilir. İkincisi, şirkete özgü riski yok etmeye yetecek kadar çok menkul kıymet vardır. Üçüncüsü, piyasalar sürekli arbitraj fırsatına izin vermeyecek kadar iyi işler. Ortalama varyans optimizasyonu bu listede yoktur, o Finansal Varlıkları Fiyatlama Modeli'ne aittir.", "İki denge argümanını da ayırt et. Finansal Varlıkları Fiyatlama Modeli'nde denge bozulunca çok sayıda yatırımcı portföyünde küçük ayarlamalar yapar. Arbitraj teorisinde ise arbitraj fırsatı sıfır yatırımla risksiz kazanç sunduğu için birkaç yatırımcı dev pozisyon alır. Bu yüzden arbitraj dengeyi çok daha hızlı kurar.", "İyi çeşitlendirilmiş portföy, şirkete özgü riskin ihmal edilecek kadar küçüldüğü portföydür. Böyle bir portföyde getiri yalnızca faktöre bağlıdır. Buradan çok önemli bir sonuç çıkar. Betası aynı olan iki iyi çeşitlendirilmiş portföyün beklenen getirisi de aynı olmak zorundadır. Biri yüzde on iki, öteki yüzde on getiriyorsa düşüğü satar, yükseği alırsın ve her lirada iki kuruş kazanırsın.", "Sınavda en çok sorulan hesap şudur. Sana iki doğru fiyatlanmış portföy verirler. Bu ikisinden iki denklem kurarak risksiz faizi ve faktör primini bulursun. Sonra üçüncü portföyün olması gereken getirisini hesaplarsın. Getirisi olması gerekenden düşükse pahalıdır ve açığa satılır, yüksekse ucuzdur ve alınır.", "Arbitraj portföyünü kurarken faktör betasını sıfırlarsın. Kitaptaki örnekte birinci ve ikinci portföyden birer birim alınır, üçüncüden iki birim satılır. Yirmi beşer bin lira alıp elli bin lira sattığında net yatırımın sıfırdır. Kazanç ise bin beş yüz liradır. Bir başka yol da aynı betayı pazar endeksi ve risksiz varlıkla sentetik olarak kurmaktır.", "Risk ayrıştırma soruları da gelir. Portföyün varyansı, beta kare çarpı faktör varyansı ile şirkete özgü varyansın toplamıdır. Sistematik payı toplam varyansa bölersen R kareyi bulursun. Şirkete özgü riski bulmak için varyanstan çıkarma yaparsın, standart sapmaları doğrudan birbirinden çıkaramazsın.", "Arbitraj teorisi hangi faktörlerin kullanılacağını söylemez. Chen, Roll ve Ross beş makro faktör seçti. Sanayi üretimindeki değişim, beklenen enflasyondaki değişim ve beklenmeyen enflasyon bunların ilk üçüdür. Diğer ikisi şirket tahvili ile devlet tahvili farkı ve devlet tahvili ile hazine bonosu farkıdır.", "Fama ve French ise makro faktörler yerine şirket özelliklerini kullandı. Pazar faktörüne iki faktör eklediler. Küçük eksi büyük faktörü büyüklük etkisini, yüksek eksi düşük faktörü ise defter değeri pazar değeri oranıyla değer etkisini ölçer. Küçük şirketler ve değer hisseleri tarihsel olarak daha çok kazandırmıştır. Bunun nedeni kırılganlık ve finansal sıkıntı riskinin primi olarak açıklanır.", "Yorum kısmı kolay puan. Küçük eksi büyük betası pozitifse portföy küçük şirketlere, negatifse büyük şirketlere yönelmiştir. Yüksek eksi düşük betası pozitifse değer hisselerine, negatifse büyüme hisselerine yönelmiştir. Carhart bin dokuz yüz doksan yedi yılında buna momentum faktörünü ekledi. Bu faktör on iki aylık performansa göre kazananlar ile kaybedenler arasındaki farktır.", "Ang iki bin on dört yılında gerçek bir risk faktörü için dört şart koydu. Akademik destek ve ekonomik gerekçe, kalıcı bir prim, hem normal hem kriz döneminde geçmiş ve likit varlıklarda uygulanabilirlik. Bunların dışında kâr payı, düşük oynaklık ve kalite faktörleri de sıkça kullanılır.", "Son olarak iki modeli karşılaştıralım. Arbitraj teorisi daha esnektir, çünkü referans olarak gözlenemeyen pazar portföyüne ihtiyaç duymaz. İyi çeşitlendirilmiş herhangi bir portföy yeter. Ama Finansal Varlıkları Fiyatlama Modeli'ni tamamen geride bırakmaz. Fiyatlama modelinin ilişkisi tek tek hisselerde de geçerlidir, arbitraj teorisi ise bunu her hisse için garanti etmez.", "Toparlayalım. Birincisi, faktör modellerinde faktör beklenen değeri değil sürprizi ölçer. İkincisi, çok faktörlü modelde beklenen getiri risksiz faiz artı betalar çarpı primlerdir ve primler negatif olabilir. Üçüncüsü, aynı betalı iyi çeşitlendirilmiş portföyler aynı getiriyi vermelidir, yoksa arbitraj doğar. Dördüncüsü, küçük eksi büyük büyüklüğü, yüksek eksi düşük değeri, kazananlar eksi kaybedenler momentumu ölçer. Beşincisi, arbitraj teorisi pazar portföyüne ihtiyaç duymaz ama tekil hisseler için fiyatlama modeli kadar kesin değildir."], "6": ["Merhaba, temel analizin ilk bölümündeyiz. Bugün bir hisseye değer biçmeden önce yapılan hazırlığı konuşacağız. Önce makroekonomi ve ekonomik döngü, sonra sektör ve Porter'ın beş gücü, en sonda da finansal modellemenin mantığı var.", "Önce tanım. Temel analiz, genel ekonomiden sektöre, oradan şirkete inerek hissenin gerçek değerini bulmaya çalışır.", "Yani yönü yukarıdan aşağıyadır. Amaç şirketin gelecekteki nakit akışını, hisse başına kârını ve kâr payını tahmin etmek. Burada dur bir saniye, çünkü sınavda sık çıkan bir ayrım var. Teknik analiz ne zaman alayım sorusuna, temel analiz hangi hisseyi alayım sorusuna cevap arar. İkisi rakip değil, birbirini tamamlar.", "Genel ekonomi analizinde ilk sırada gayrisafi yurt içi hasıla tahmini gelir. Bunun yanında işsizlik, enflasyon, faiz ve bütçe açığı ayrı ayrı tahmin edilir. Vergi politikası ve para arzı gibi maliye ve para politikası araçlarını da öngörmen gerekir. Çünkü bunlar talebi, dolayısıyla şirketlerin satışlarını etkiler.", "Şimdi ekonomik döngüye geçelim. En çok kabul gören tanım Burns ve Mitchell'e ait, bin dokuz yüz kırk altı yılından. Döngü genişlemeler ve onları izleyen daralmalardan oluşur. Genişleme dipte başlar, zirvede biter.", "Daralma ise zirvede başlar, dipte biter. Başlangıç ve bitiş noktalarına dönüm noktası denir. Bu noktalar reel büyüme ile trend büyüme arasındaki en büyük farka göre belirlenir. Bunu sınavda çok soruyorlar. Genişleme dönemi daralmadan daha uzun sürer.", "Yani döngü asimetriktir ve toparlanma daha hızlıdır. Neden mi? Çünkü politika araçları daralma dönemlerinde daha etkili olmuştur. Bir de şunu aklında tut. Döngünün en uzun evresi genişlemedir.", "Genişleme kendi içinde erken ve geç diye ikiye ayrılır. Geç genişlemede enflasyon belirginleşir ve merkez bankası sıkılaştırmaya başlar. Ekonomi aşırı ısınmadan dengeli yavaşlamaya yöneldiği için bu evreye yumuşak iniş denir. Resesyonda ise işsizlik zirve yapar, güven en düşüktür ve politika gevşemeye başlar. Faktörlerin döngüyle ilişkisi de önemli.", "Reel büyüme ve enflasyon döngüyle aynı yönde hareket eder. Kredi risk primi ve makro ihtiyati araçlar ise ters yönlüdür. Getiri eğrisinin hikayesini şöyle düşün. Başta dik ve pozitif eğimlidir, sıkılaşmayla yataylaşır, yavaşlamada negatif eğime döner. Resesyonda faizler indirilince yeniden pozitif olur.", "Gelelim göstergelere. Öncü göstergeler reel hasıla değişmeden altı ile sekiz hafta önce değişir.", "Hisse senedi endeksi, para arzı, inşaat ruhsatları, yeni siparişler ve işsizlik sigortası başvuruları bu gruptadır. Eşanlı göstergeler aynı anda değişir, sanayi üretim endeksi ve kişisel gelir gibi. İzleyen göstergeler ise altı ile sekiz hafta sonra değişir. Kredi faiz oranı ve ortalama işsizlik süresi bunlara örnektir. Dikkat et, işsizlik sigortası başvurusu öncü, işsizlik süresi izleyendir.", "Tek bir gösterge grev ya da kötü hava yüzünden yanlış sinyal verebilir. Bu yüzden göstergeler ağırlıklandırılıp kompozit endeks haline getirilir. Hesabı basit. Her bileşenin yüzde değişimini ağırlığıyla çarpıp toplarsın. Siparişler düşse bile ruhsatlar ve borsa yükseliyorsa endeks yukarı bakabilir.", "Sektör analizinde ilk iş şirketin sektörünü belirlemek, Türkiye'de bunun için NACE kodları kullanılır. Kârın döngüye duyarlılığını üç şey belirler. Birincisi satışların duyarlılığıdır, gıda, ilaç ve sigarada bu duyarlılık düşüktür. İkincisi faaliyet kaldıracıdır, sabit gideri yüksek şirket satış düşünce kârını çok daha hızlı kaybeder. Üçüncüsü finansal kaldıraç, yani borç ile özkaynak dengesidir.", "Şimdi Porter'ın beş gücü. Yeni giriş tehdidi, tedarikçi gücü, alıcı gücü, ikame ürün tehdidi ve mevcut rakipler arasındaki rekabet. Bu beş güç sektörün uzun vadeli kâr marjını ve özkaynak kârlılığını belirler. Bazı sektörler tek haneli kârlılıkta sıkışırken bazıları yıllarca yüzde yirminin üzerinde kalır. Önemli olan hangi gücün ne kadar baskın olduğudur.", "Yeni giriş tehdidinde iki eksen var, giriş engelleri ve misilleme beklentisi. Engelleri sayalım. Arz yönlü ölçek ekonomisi, ağ etkisi, müşteri geçiş maliyeti, sermaye gereksinimi, lokasyon gibi boyuttan bağımsız avantajlar, dağıtım kanalına erişim ve devlet politikaları. Örneğin bir yazılımı değiştirmenin maliyeti yıllık tasarrufun üç katıysa, müşteri üç yıl boyunca kazanç görmez. Bu yüzden memnun olmasa bile mevcut firmada kalır.", "Tedarikçi gücünde kritik koşullar şunlar. Tedarikçi az ve alıcı çoksa, tedarikçinin müşterileri çeşitliyse, girdinin ikamesi yoksa ve ileriye doğru entegrasyon tehdidi varsa tedarikçi güçlüdür. Alıcı tarafında ise birkaç büyük alıcı, standart ürün, düşük geçiş maliyeti ve geriye doğru entegrasyon imkânı alıcıyı güçlendirir. Zincir marketin iskonto ve uzun vade dayatması tam da budur.", "İkame ürünler sektör için bir fiyat tavanı oluşturur. Müşteri bir noktadan sonra alternatife geçer. Rekabeti ise şunlar sertleştirir. Güçleri yakın çok sayıda rakip, düşük büyüme ve yüksek çıkış engeli. Otel ve havayolu gibi sabit maliyeti yüksek sektörler boş kapasiteyi doldurmak için fiyat kırmaya yatkındır.", "Burada sınavın sevdiği bir tuzak var. Sektör büyüme hızı, teknoloji, devlet politikaları ve tamamlayıcı ürünler beşinci ya da altıncı güç değildir. Bunlar güçleri etkileyen çevresel koşullardır. Ayrıca yüksek büyüme tek başına yüksek kârlılık anlamına gelmez. Giriş engeli düşükse yeni oyuncular gelir ve marjlar erir.", "Son durak finansal modelleme. Reel sektörde model gelir tablosundan başlar, sonra bilanço, en son nakit akış tablosu kurulur. Açık tahmin ufku genellikle on yıla kadardır. Hızlı değişen teknoloji sektörlerinde beş yıl, altyapı gibi öngörülebilir alanlarda on yıl kullanılır. Ufkun ötesinde terminal değer devreye girer.", "Gelir tahmininde üç yol var. Yukarıdan aşağıya yöntemde toplam pazarı şirketin payıyla çarparsın.", "Aşağıdan yukarıya yöntemde mağaza mağaza, ürün ürün toplarsın. Hibrit yöntemde ikisi birbirini kontrol eder ve satışı hacim çarpı fiyat olarak kurarsın. Net işletme sermayesi ise alacak artı stok eksi ticari borçtur. Bu tutardaki artış nakit akışını azaltır.", "Toparlayalım, birincisi, temel analiz yukarıdan aşağıya ilerler ve hangi hisse sorusuna cevap verir. İkincisi, genişleme döngünün en uzun evresidir ve döngü asimetriktir. Üçüncüsü, öncü göstergeler altı ile sekiz hafta önce, izleyenler altı ile sekiz hafta sonra değişir. Dördüncüsü, büyüme hızı ve tamamlayıcı ürünler Porter'ın güçleri arasında değildir. Beşincisi, zayıf rekabet yapısında yatırım sermayesi getirisi uzun vadede sermaye maliyetine yakınsar."], "7": ["Merhaba, temel analizin ikinci bölümündeyiz, yani şirket değerlemesindeyiz. Bugün üç yaklaşımı konuşacağız. Önce maliyet yaklaşımı, sonra temettü ve serbest nakit akımı modelleri, en sonda da piyasa çarpanları. Hesap ağırlıklı bir bölüm, o yüzden formülleri cümle cümle kuracağız.", "Maliyet yaklaşımının mantığı şu. Geçmişte kazanılan gelirin geleceği garanti değildir, önemli olan varlıkların değeridir.", "Üç yöntem var. Defter değeri bilançodaki net özkaynaktır. Tasfiye değeri, faaliyet durursa varlıklar satılıp borçlar ödendikten sonra kalan tutardır. Net aktif değeri ise varlıkların piyasa değerinden borçların piyasa değerinin çıkarılmasıdır.", "Burada dur bir saniye, çünkü tuzak var. Defter değeri her zaman taban fiyat değildir. Şirket özkaynağı üzerinden sermaye maliyetinin altında getiri üretiyorsa piyasa değeri defter değerinin altına iner. Bir de net aktif değeri teknoloji şirketlerinde kullanılmaz. Gayrimenkul yatırım ortaklıkları, holdingler ve maden ya da orman gibi doğal kaynak şirketlerinde ise en temel yöntemdir.", "Tasfiyede de ince bir ayrım var. Planlı yapılan düzenli tasfiye ile acil ve zorunlu tasfiye arasında büyük fark oluşur. Maliyet yaklaşımı kârlı ve faaliyetine devam eden şirketler için teorik olarak en zayıf yöntemlerden biridir. Çünkü sinerjiyi, insan sermayesini ve büyüme fırsatlarını görmez.", "Gelir yaklaşımına geçelim. Temettü iskonto modelinde hissenin değeri gelecekteki tüm temettülerin bugünkü değeridir.", "En bilinen hali Gordon modeli. Gelecek yılın temettüsünü, gerekli getiri ile büyüme farkına bölersin. Mesela son temettü beş lira, büyüme yüzde altı ise gelecek yılın temettüsü beş virgül otuz liradır. Gerekli getiri yüzde on dört ise değer altmış altı virgül yirmi beş lira çıkar.", "Bunu sınavda çok soruyorlar. Gordon modelinde gerekli getiri mutlaka büyümeden büyük olmalı. Payda sıfıra yaklaşırsa değer sonsuza gider. Bir de payda son ödenen değil, gelecek yılın temettüsü kullanılır. Büyüme oranını ise özkaynak kârlılığı ile kârda tutulan payın çarpımı olarak bulabilirsin.", "Dağıtım oranıyla çarparsan yanlış cevaba gidersin. Şimdi büyüme fırsatlarının bugünkü değeri. Şirket kârının hepsini dağıtsaydı değeri gelecek yılın kârının gerekli getiriye bölümü olurdu. Bu büyümesiz değerdir. Piyasa fiyatı ile bu değer arasındaki fark büyüme fırsatlarının değeridir.", "Fark pozitifse piyasa kârlı büyüme bekler. Fark negatifse yatırımların değer yıkacağını düşünür. Hisseleri kıyaslarken bu farkın fiyattaki payına bakılır. Çok aşamalı modellerde ilk dönem hızlı büyür, sonra istikrarlı büyümeye geçilir. İki aşamalı modelde ilk dönem genellikle beş ile on yıl sürer.", "Her yılın temettüsünü ayrı iskonto edersin, sonra terminal değeri bulup o da bugüne getirirsin. H modelinde ise büyüme aniden değil, doğrusal olarak düşer. H, yüksek büyüme döneminin yarısıdır. On iki yıllık düşüş için H altıdır, on iki değil. Neden serbest nakit akımı modelleri öne çıktı?", "Çünkü temettü yönetimin takdirindedir. Hisse geri alımları temettünün yerini alabilir. Birçok büyüme şirketi yıllarca temettü ödemez. Kontrolü ele geçiren yatırımcı için de serbest nakit akımı esastır. Azınlık hissedarı içinse temettü modeli makul olabilir.", "Firmaya serbest nakit akımı şöyle kurulur. Faaliyet kârını vergiden arındırırsın, amortismanı geri eklersin. Sonra net yatırım harcamasını ve işletme sermayesi artışını düşersin. Net yatırım, brüt alımdan eski varlık satışı çıkarılarak bulunur. Burada sık yapılan hata faizin vergi kalkanını nakit akımına eklemektir.", "Bu etki zaten sermaye maliyetinde vergi sonrası borç maliyetiyle yansır. Özsermayeye serbest nakit akımına geçmek için firmaya serbest nakit akımından vergi sonrası faizi düşer, net borçlanmayı eklersin. Firmaya serbest nakit akımı ağırlıklı ortalama sermaye maliyetiyle, özsermayeye serbest nakit akımı ise özsermaye maliyetiyle iskonto edilir. Borç artırmak bu nakdi büyütür ama betayı ve özsermaye maliyetini de artırır. Yani bedava değer yaratmaz.", "Özsermaye maliyetini finansal varlıkları fiyatlama modeliyle bulursun. Risksiz faize beta çarpı piyasa risk primini eklersin. Ağırlıklı ortalama sermaye maliyeti ise özsermaye ve borç maliyetlerinin piyasa değeri ağırlıklı ortalamasıdır. Borç maliyetini mutlaka bir eksi vergi oranıyla çarp. Unutursan oran olduğundan yüksek çıkar.", "Uç değer için iki yol var, çarpan yöntemi ve sabit büyüme modeli. Sabit büyümede açık dönemden sonraki ilk yılın nakit akımını, iskonto oranı ile büyüme farkına bölersin. Bulduğun değer açık dönemin son yılına aittir, onu da bugüne indirirsin. Uç değer toplam değerin bazen yüzde kırkını, bazen yüzde sekseninin üzerini oluşturur. Bu yüzden Türkiye'deki fiyat tespit raporlarında artı eksi yüzde birlik hassasiyet tabloları standarttır.", "Firma değerinden pay başına değere geçişi de bil. Firma değerine atıl nakit ve yatırım amaçlı gayrimenkul gibi faaliyet dışı varlıkları eklersin. Sonra finansal borçları düşersin ve pay adedine bölersin. Ama dikkat, özsermayeye serbest nakit akımıyla çalıştıysan borcu tekrar düşmezsin. Yoksa borcu iki kez saymış olursun.", "Son olarak piyasa çarpanları. Temelinde tek fiyat yasası var.", "Fiyat kazanç oranı her bir liralık kâr için ödenen tutardır. Döngüsel şirketlerde ekonominin tepesinde kâr şiştiği için bu oran yanıltıcı biçimde düşük görünür. Buna Molodovsky etkisi denir. Shiller'in döngüsel düzeltilmiş oranı bu yüzden son on yılın enflasyondan arındırılmış ortalama kârını kullanır.", "Fiyat kazanç büyüme oranı, yani FKB, fiyat kazanç oranını beklenen büyümeye böler. Birin altı büyümeye göre ucuz, biri adil, birin üstü pahalı demektir. Firma değeri bölü faiz amortisman vergi öncesi kâr oranı ise borçluluk farkını düzeltir. Çünkü payda faizi içermez, pay ise net borcu içerir. Çok borçlu şirketin fiyat kazanç oranı faiz yükü yüzünden şişebilir, bu oran o yanılgıyı giderir.", "Piyasa değeri bölü defter değeri biri aşıyorsa piyasa şirkete marka, patent ya da büyüme potansiyeli için prim ödüyor demektir. Birin altındaysa ya varlıklar verimsiz kullanılıyordur ya da gerçek bir fırsat vardır. Düşük oran, düşük özkaynak kârlılığı ve zayıf büyüme bir aradaysa buna değer tuzağı denir. Emsal yönteminin en büyük kısıtını da unutma. Bütün sektör pahalıysa en ucuz görünen hisse bile aslında pahalı olabilir.", "Toparlayalım, birincisi, net aktif değeri teknoloji şirketlerinde kullanılmaz, gayrimenkul ortaklıkları ve holdinglerde kullanılır. İkincisi, Gordon modelinde gerekli getiri büyümeden büyük olmalı ve payda gelecek yılın temettüsü durur. Üçüncüsü, firmaya serbest nakit akımı sermaye maliyetiyle, özsermayeye serbest nakit akımı özsermaye maliyetiyle iskonto edilir. Dördüncüsü, büyüme bedava değildir ve uç değer en hassas aşamadır. Beşincisi, döngüsel şirkette tepe yıl kârı Molodovsky etkisi yaratır, FKB birin altındaysa hisse büyümesine göre ucuzdur."], "8": ["Merhaba, teknik analiz bölümündeyiz. Bugün grafiklerin dilini konuşacağız. Elliot dalgaları, trendler, hareketli ortalamalar, MACD ve RSI, sonra destek direnç, formasyonlar ve boşluklar. Hesap az ama sayı ezberi çok, o yüzden sayılara özellikle dikkat et.", "Teknik analiz fiyat ve işlem hacmi grafiklerini zaman ekseninde inceler. Bilanço, sektör ve oranlar burada öncelikli değildir. Varsayım şu, bütün ekonomik yapı zaten alıcı ve satıcı davranışıyla grafiğe yansır. En çok kullanılan grafikler çizgi, çubuk, mum ve sıfır çarpı grafikleridir. İncelemeyi de dört başlıkta toplarız, fiyat değişimi, zaman ufku, işlem miktarı ve genel piyasa durumu.", "Elliot ile başlayalım. Ralph Nelson Elliot bin dokuz yüz otuzlarda fiyatların belli modellerle hareket ettiğini fark etti.", "Her yükseliş ya da düşüş beş dalgada gelişir. Birinci, üçüncü ve beşinci dalga ana yöndür. İkinci ve dördüncü dalga düzeltmedir. Düzeltme hareketi ise üç dalgada tamamlanır ve rakamla değil harfle, yani A, B ve C diye gösterilir.", "Burada dur bir saniye, çünkü kurallar sınavda çok çıkıyor. İkinci dalga birinci dalganın tamamını geri alamaz.", "Dördüncü dalga üçüncü dalganın tamamını geri alamaz. Üçüncü dalga her zaman birinci dalganın tepesini aşar. Ve üçüncü dalga, birinci ve beşinci dalgaya göre en kısa dalga olamaz. Elliot toplam dokuz dalga derecesinden söz eder, dakikalık grafikten yüzyıllık grafiğe kadar.", "Etki dalgalarının iki tipi var. Klasik etki dalgasında dördüncü dalga asla birinci dalga seviyesine sarkmaz. Çapraz üçgende ise, yani takozda, dördüncü dalga genellikle birinci dalga bölgesine sarkar. Çapraz üçgen beş dalgalıdır ama düzeltme özelliği de taşır.", "Düzeltme formasyonlarına gelince yapıları ezberle. Zigzag beş üç beş.", "Yassı düzeltme üç üç beş. Üçgen ise beş tane üç dalgadan oluşur. Zigzagda B dalgası, A dalgasının başladığı noktanın altında kalır. Yassı düzeltmede B dalgası A'nın başladığı yere kadar, hatta biraz ötesine çıkabilir. Mesela A iki yüz liradan başladıysa ve B iki yüz ikiye çıktıysa, yani A'nın başlangıcını aştıysa, bu yassı düzeltmeye işaret eder.", "Soru bankasında Fibonacci oranlı bir hesap da var, soruda oranlar verilir. Diyelim birinci dalga kırk liradan elli beş liraya çıktı, yani on beş liralık bir dalga. İkinci dalga bunun yüzde altmış bir virgül sekizi kadar geri çekilirse dip kırk beş virgül yetmiş üç lira olur. Üçüncü dalga ilk dalganın bir virgül altı yüz on sekiz katı kadar yükselirse, bu dipten başlayarak hedef yetmiş liraya ulaşır.", "Trendler kısmında temel tanımlar var. Yükselen trende boğa piyasası, alçalan trende ayı piyasası denir. Alıcı ile satıcı dengedeyse yatay piyasa oluşur. Yükselen trend çizgisini dipleri birleştirerek, alçalan trend çizgisini tepeleri birleştirerek çizersin.", "Çizgi ne kadar çok noktadan geçerse trend o kadar güçlüdür. Bu tür fiyat analizinin on dokuzuncu yüzyıl sonunda Amerika'da başladığını da hatırla. Hareketli ortalamaların üç türü var. Basit ortalama tüm günlere eşit ağırlık verir. Ağırlıklı ortalama son günlere daha fazla ağırlık verir.", "Üssel ortalama ise ilk günleri ağırlıklı kadar ihmal etmez ama son günlere basitten fazla ağırlık verir. Kitaptaki yirmi bir günlük örnekte düşüşü ilk yakalayan ağırlıklı ortalama olmuş. Fiyat ortalamanın üzerindeyse yükseliş, altındaysa düşüş kabul edilir. Elli iki günlük ortalamalar da destek ve direnç işlevi görür. MACD için üç sayı var, yirmi altı, on iki ve dokuz.", "Yirmi altı günlük ve on iki günlük üssel ortalamaların farkı MACD'yi verir. MACD'nin dokuz günlük üssel ortalaması ise uyarı hattıdır. MACD uyarı hattının üstüne çıkarsa al, altına inerse sat sinyali oluşur. Orta vadeli kararlar için uygundur. Fiyat yeni dip yaparken MACD daha yüksek bir dip yapıyorsa buna uyumsuzluk denir ve yükseliş uyarısıdır.", "RSI'ın adı seni yanıltmasın, bir hissenin başka bir hisseye göre hareketini değil kendi iç gücünü ölçer. Hesapta yükseliş günlerinin ortalama farkını düşüş günlerinin ortalama farkına bölersin ve buna bir eklersin. Sonra yüzü bu sayıya bölüp yüzden çıkarırsın. Önerilen süre on dört gündür, yetmişin üstü tepe, otuzun altı dip bölgesidir. Yükselişler ortalaması bir virgül iki, düşüşler sıfır virgül sekiz ise RSI altmış çıkar.", "Kanallarda alt band kötümserliği, üst band iyimserliği temsil eder. Ortadaki çizgi normaldir. Üst band kırılırsa aşırı alış, alt band kırılırsa aşırı satış beklenir. Destek ve direnç kırılırken genellikle işlem hacmi artar.", "Bir de rol değişimini bil. Kırılan direnç destek olur, kırılan destek dirence döner. Çünkü eski seviyede zarara düşenler fiyat maliyetlerine gelince satış yapar. Omuz baş omuz formasyonu trend dönüşünü haber verir. Sol omuz yüksek hacimle oluşur.", "Baş daha yüksek bir tepedir ama hacmi sol omuzdan azdır. Sağ omuz ise çok zayıf hacimle oluşur, alıcılar yorulmuştur. Satış sinyali boyun çizgisinin yüksek hacimle kırılmasıdır. Kırılmadan sonra fiyat boyun çizgisine bir kez daha gelebilir, bu genellikle son satış fırsatıdır. Dipte görülen ters omuz baş omuz ise yükselişin başladığını gösterir.", "İkili tepede talep fiyatı önceki tepenin üzerine taşıyamaz. İkili dipte ise fiyat önceki dipte yeniden alımla karşılaşır ve yükselmeye başlar. Kitaptaki örnekte ikinci düşüşte MACD yeni dip yapmamış, bu da dönüşün habercisi olmuş. Son konu boşluklar, dört türü var. Olağan boşluk işlem miktarı dar hisselerde görülür ve önemsizdir.", "Kaçış boşluğu fiyat formasyondan kurtulurken oluşur ve hızlı hareket beklenir. Ölçüm boşluğu rallinin ortasında görülür. Fiyatın, yükselişin başladığı yer ile boşluk arası kadar daha gideceği varsayılır. Seksen liradan başlayan rallide yüz dört lirada ölçüm boşluğu varsa hedef yüz yirmi sekiz liradır. Tü
