keniş boşluğu ise rallinin sonunda görülür ve kapanması rallinin bittiğini söyler.", "Soru bankasında VHF göstergesi de geçiyor, onu da kısaca söyleyeyim. VHF trendin yönünü değil gücünü gösterir. Fiyat hızla düşerken VHF yükseliyorsa düşüş trendi güçleniyor demektir, fiyat yukarı dönecek demek değildir. VHF'nin sürekli azalması ise yatay piyasayı onaylar.", "Toparlayalım, birincisi, Elliot'a göre etki beş dalga, düzeltme üç dalgadır ve üçüncü dalga en kısa olamaz. İkincisi, zigzag beş üç beş, yassı üç üç beş, üçgen beş tane üç dalgadır. Üçüncüsü, MACD yirmi altı ile on iki günlük üssel ortalamaların farkıdır, uyarı hattı dokuz günlüktür. Dördüncüsü, RSI on dört günlüktür, yetmişin üstü tepe, otuzun altı dip bölgesidir. Beşincisi, ölçüm boşluğu rallinin ortasında, tükeniş boşluğu sonundadır."], "9": ["Merhaba, sermaye piyasası araçlarının değerlemesi bölümündeyiz. Bugün tahvil ve bonoyu konuşacağız.", "Önce tahvil değeri ve verim kavramları var. Sonra spot, başa baş ve vadeli faizlere, ardından süre ve konveksiteye geçeceğiz. En sonda kotasyon, makaslar ve özel tahvil türleri var. Hesabı en yoğun bölümlerden biri, o yüzden yavaş gidelim.", "Tahvil uzun vadeli bir borçlanma aracıdır. Dönemsel faiz öder ve vadede anaparayı geri verir. Türkiye'de vadeler iki yıldan başlar, özel sektörde yedi yıla kadar çıkar. Tahvil yatırımcısının riskleri şunlar. Anapara ve faizin ödenmemesi, faiz oranı riski, enflasyon riski, vade riski, likidite riski ve erken itfa riski.", "Likidite riskinin alış ile satış fiyatı arasındaki farkla ölçüldüğünü unutma. Tahvilin değeri, gelecekteki kupon ve anapara ödemelerinin piyasa faiziyle iskonto edilmiş toplamıdır. Kupon piyasa faizinden yüksekse tahvil nominalin üzerinde, düşükse altında fiyatlanır. Cari verim ise yıllık kuponun tahvil fiyatına bölümüdür. Vadeye kadar verim tahvilin iç verim oranıdır.", "İki varsayımı var. Tahvil vadeye kadar tutulur ve ara ödemeler aynı oranla yeniden yatırılır. Karar kuralı çok soruluyor. Vadeye kadar verim senin istediğin getiriden büyükse tahvil ucuzdur, satın alırsın. Küçükse tahvil pahalıdır, almazsın.", "Eşitse kayıtsız kalırsın. Yarı yıllık kuponda kitap yıllık bileşik faizi altı aylığa çevirir. Yıllık oranın bir fazlasının karekökünden bir çıkarırsın. Kuponu ikiye böler, dönem sayısını ikiyle çarparsın. Şimdi spot faiz.", "Kuponsuz devlet tahvillerinden türetilir, bu yüzden sıfır faiz de denir. Örneğin yüz lira dört yılda yüz altmış lira olursa kesikli spot faiz yaklaşık yüzde on iki virgül kırk yedidir. Sürekli bileşik faizle bu oran yüzde on bir virgül yetmiş beşe düşer. İskonto faktörü de bir bölü bir artı spot faizin vade kuvvetidir. Vade ve faiz arttıkça iskonto faktörü küçülür.", "Başa baş faiz, kuponlu tahvilin tam nominalden işlem görmesini sağlayan kupon oranıdır. Vadeli faiz ise gelecekte başlayacak bir dönem için bugünden belirlenen faizdir. İki yıllık spot faizin karesini bir yıllık spot faizin bir fazlasına bölersin, bir çıkarırsın. Bir yıllık yüzde on iki, iki yıllık yüzde on dört ise bir yıl sonra başlayan bir yıllık faiz yüzde on altıyı biraz geçer. Spot faiz de vadeli faizlerin geometrik ortalamasıdır.", "Bunu sınavda çok soruyorlar. Eğri pozitif eğimliyse en yüksek vadeli faiz, sonra spot faiz, en düşük de başa baş faiz olur. Eğri negatif eğimliyse sıralama tam tersine döner ve piyasa faizlerin düşeceğini bekler. Arbitrajsız fiyatlamada her nakit akışı kendi vadesinin spot faiziyle iskonto edilir.", "Bu ilke tek fiyat kanununa ve risk nötr fiyatlamaya dayanır. Tahvil adil değerinden pahalıysa tahvili satar, aynı akışları yaratan kuponsuz tahvillerden sentetik bir portföy alırsın. Ucuzsa tersini yaparsın. Aradaki fark risksiz kazancındır. Bootstrapping ise piyasadaki tahvil fiyatlarından sırayla iskonto faktörlerini türetmektir.", "Tahvil fiyatı ile faiz ters yönlü hareket eder. Vade uzadıkça faiz duyarlılığı artar ama azalarak artar. Kupon yükseldikçe duyarlılık azalır. Bir de asimetri var. Faiz düştüğünde fiyatın artışı, aynı büyüklükte faiz artışındaki düşüşten daha fazladır.", "Macaulay süresi nakit akışlarının zamanlarının bugünkü değer ağırlıklı ortalamasıdır. Kuponlu tahvilde süre vadeden kısadır, kuponsuz tahvilde vadeye eşittir. Kupon artınca süre kısalır, vadeye kadar verim artınca da süre kısalır. Sonsuz kuponlu tahvilde süre, bir artı faizin faize bölümüdür. Faiz yüzde sekiz ise süre on üç virgül beş yıldır.", "Düzeltilmiş süreyi bulmak için Macaulay süresini bir artı vadeye kadar verime bölersin. Fiyattaki yüzde değişim yaklaşık olarak eksi düzeltilmiş süre çarpı faiz değişimidir. Baz noktası değeri ise faizdeki bir baz puanlık değişimin fiyata etkisidir. Düzeltilmiş süre çarpı fiyat çarpı on binde bir diye hesaplanır. Opsiyonlu tahvillerde nakit akışı belirsiz olduğu için efektif süre kullanılır.", "Kısmi süre, getiri eğrisi paralel kaymadığında her vadenin etkisini ayrı ölçer. Kısmi sürelerin toplamı baz noktası değerine eşittir. Piyasada iki, beş, on ve otuz yıllık vadeler anahtar vade kabul edilir, aradakiler doğrusal enterpolasyonla bulunur. Süre açığında ise yükümlülüklerin baz noktası değerinden varlıklarınkini çıkarırsın.", "Varlık süresi uzunsa açık pozitiftir ve banka faiz artışından zarar görür. Yükümlülük süresi uzunsa açık negatiftir ve faiz düşüşü özkaynağı eritir. Konveksite fiyat ile faiz arasındaki eğriliktir, yani ikinci türevdir. Süre birinci türevdir ve sadece küçük değişimlerde iyi çalışır. Pozitif konveksite istenen bir özelliktir.", "Faiz düşünce fiyat daha hızlı artar, faiz yükselince daha yavaş düşer. Aynı vadede konveksite sıralaması şöyledir. Kuponsuz, sonra düşük kuponlu, en son yüksek kuponlu tahvil. Kuponsuz tahvilin konveksitesi vadenin karesidir. Altı yıllık kuponsuz tahvilde otuz altı eder.", "Getiri tarafında üç bileşen var. Pozisyon taşıma getirisi, vade yapısındaki değişim ve kredi makasındaki değişim. Pozisyon taşıma, faizler değişmezken vadenin ilerlemesinden doğan kazançtır. Eğri pozitif eğimli ve sabitse getiri eğrisi üzerinde kayma stratejisi kazandırır. Kredi makası daralırsa fiyat artar, genişlerse düşer.", "Kotasyon kısmına gelelim. Tahviller temiz fiyatla kote edilir, çünkü temiz fiyat daha az oynaktır. Alıcının fiilen ödediği kirli fiyattır. Kirli fiyat, temiz fiyata birikmiş faizin eklenmesiyle bulunur. Gün sayımında devlet tahvilleri gerçek bölü gerçek, kurumsal tahviller otuz bölü üç yüz altmış, hazine bonoları gerçek bölü üç yüz altmış kuralını kullanır.", "Matrix fiyatlamada işlem görmeyen bir tahvilin verimi, benzer kredi notlu iki referans tahvilin veriminden doğrusal enterpolasyonla bulunur. Getiri makası iki tahvilin verim farkıdır ve kurumsal tahvilde likidite primi ile kredi priminden oluşur. G makası devlet tahviline göre farktır. Z makasında her nakit akışı kendi spot faizine sabit bir makas eklenerek iskonto edilir. Türkiye'de swaplarda referans faiz olarak TLREF kullanılır.", "Değişken faizli tahvilde kupon, referans faize kotasyon marjı eklenerek bulunur. İskonto ise referans faiz artı iskonto marjıyla yapılır. İskonto marjı kotasyon marjından büyükse tahvil iskontolu işlem görür ve ihraççının kredi riski artmış demektir. İkisi eşitse tahvil başa baş, kotasyon marjı büyükse primlidir. Enflasyona dayalı tahvilde ise Türkiye'de hem anapara hem kupon tüketici fiyatlarına göre güncellenir.", "Son olarak bono. Vadesi bir yıldan kısadır, kupon ödemez ve iskontolu satılır. Genel formülde nominal değer, bir artı faizin gün bölü üç yüz altmış beş kuvvetine bölünür. Türkiye'de hazine bonosu ise basit faizle hesaplanır. Bu durumda nominal değeri, bir artı faiz çarpı gün bölü üç yüz altmış beşe bölersin.", "Toparlayalım, birincisi, vadeye kadar verim istenen getiriden büyükse tahvil ucuzdur ve alınır. İkincisi, pozitif eğimli eğride vadeli faiz en yüksek, başa baş faiz en düşüktür. Üçüncüsü, kupon ya da vadeye kadar verim arttıkça süre kısalır, kuponsuz tahvilde süre vadeye eşittir. Dördüncüsü, kuponsuz tahvilin konveksitesi vadenin karesidir ve pozitif konveksite istenen bir özelliktir. Beşincisi, devlet tahvilinde gerçek bölü gerçek, kurumsal tahvilde otuz bölü üç yüz altmış kullanılır ve kirli fiyat temiz fiyat artı birikmiş faizdir."], "10": ["Merhaba, portföy performans ölçüm teknikleri bölümündeyiz. Bugün bir fonun ne kadar iyi yönetildiğini nasıl ölçtüğümüzü konuşacağız. Sharpe, Treynor, M kare, Sortino ve Jensen gibi ölçütler, sonra bilgi ve yakalama ölçütleri, ardından getiri ve riskin kaynakları, faktör analizi ve referans portföy var. Performans analizi portföy yönetim sürecinin son aşamasıdır. Üç soruya cevap arar.", "Performans ne kadar, neden böyle oldu ve nasıl artırılır. Burada dur bir saniye, çünkü getiri yöntemi seçimi sınavda sorulur. Yatırımcının istediği zaman para yatırıp çektiği fonlarda yöneticinin nakit akışına etkisi yoktur. Bu yüzden zaman ağırlıklı getiri kullanılır. Nakit giriş çıkışını yöneticinin belirlediği özel sermaye fonlarında ise para ağırlıklı getiri, yani iç verim oranı kullanılır.", "Brüt ve net ayrımı da önemli. Yöneticinin performansını ölçerken onun kontrolündeki alım satım komisyonlarını ve yönetim ücretini düşersin. Saklama, denetim ve yasal giderler yöneticinin kontrolünde olmadığı için brüt getiride kalır. Yatırımcı açısından ise önemli olan bütün maliyetler düşüldükten sonraki net getiridir.", "Sharpe ölçütü ile başlayalım. Portföy getirisinden risksiz faizi çıkarır, standart sapmaya bölersin.", "Yani toplam riske göre ölçer. Mesela getiri yüzde on sekiz, risksiz faiz yüzde altı, standart sapma yüzde yirmi dört ise Sharpe sıfır virgül beştir. Sharpe getirilerin normal dağıldığını varsayar. Getiri risksiz faizin altındaysa sıralama için kullanılamaz, çünkü riskli portföy daha iyi görünür. Treynor ölçütü aynı farkı betaya böler, yani sadece piyasa riskini dikkate alır.", "Şimdi şöyle düşün. Sadece beş hisseye yatırım yapan bir fonun betası düşük ama standart sapması çok yüksek olabilir. Bu fon Treynor'a göre pazardan iyi, Sharpe'a göre kötü görünebilir. Kitaba göre iyi çeşitlendirilmiş portföyde Sharpe kullanmak daha doğrudur. Çeşitlendirilmemiş portföy için Treynor iyi bir turnusol kağıdı olarak anılır.", "M kare ölçütünü Modigliani'ler bin dokuz yüz doksan yedide geliştirdi. Sharpe değerini pazarın standart sapmasıyla çarpar, risksiz faizi eklersin. Böylece portföy pazarın risk seviyesine getirilir ve sonuç yüzde olarak çıkar. Bu değeri pazar getirisiyle kıyaslarsın. Mesela M kare yüzde on bir virgül iki, pazar yüzde on iki ise fon riske göre düzeltildiğinde pazarın gerisindedir.", "Sortino ölçütü standart sapma yerine sadece hedefin altındaki sapmaları kullanır. Risksiz faiz yerine yatırımcının hedef getirisi esas alınır. Standart sapma simetrik olduğu için, özellikle sola çarpık dağılımlarda riski düşük gösterebilir. Bu yüzden serbest fonlarda, emtia fonlarında ve opsiyon yazan stratejilerde Sortino Sharpe'tan daha uygundur. Jensen alfası bin dokuz yüz altmış sekizde geliştirildi.", "Önce finansal varlıkları fiyatlama modeliyle beklenen getiriyi bulursun. Risksiz faize beta çarpı pazar risk primini eklersin. Gerçekleşen getiriden bunu çıkarınca alfa kalır. Alfa yöneticinin varlık seçme yeteneğini gösterir. Ekonomik olarak da yatırımcının yöneticiye ödemeye razı olacağı en yüksek yönetim ücretidir.", "Değerlendirme ölçütü ise alfayı spesifik riske böler. Bin dokuz yüz yetmiş üçte Treynor ve Black tarafından tanıtıldı. Spesifik riski bulmak için toplam varyanstan sistematik varyansı çıkarırsın. Sistematik risk de beta çarpı pazarın standart sapmasıdır. Değerlendirme ölçütü yükseldikçe sonucun şanstan değil yetenekten geldiğine güven artar.", "Göreceli tarafta bilgi ölçütü var. Fonun referansı aştığı kısmı takip hatasına bölersin.", "Takip hatası, yani aktif risk, fon ile referans getirisi arasındaki farkın standart sapmasıdır. Bunu sınavda çok soruyorlar. Yönetici aktif ağırlıklarını iki katına çıkarırsa hem aktif getiri hem takip hatası iki katına çıkar. Bilgi ölçütü değişmez. Takip hatası çok düşük ve bilgi ölçütü negatifse fon büyük ihtimalle gizli bir endeks fonudur.", "Yakalama ölçütünde fonun yükselen piyasadaki performansını referansa bölersin, düşen piyasada da aynısını yaparsın. Sonra bu iki oranı birbirine bölersin. Sonuç biri aşarsa getiri profili konvekstir, yani pozitif asimetri vardır. Birin altındaysa konkavdır. Yükselişte referansın yüzde yüz yirmisini, düşüşte yüzde yetmiş beşini yakalayan fonun ölçütü bir virgül altıdır.", "Getirinin kaynakları için Brinson, Hood ve Beebower modelini bil. Aktif getiriyi üçe ayırır.", "Varlık dağılımı, ağırlık farkı çarpı referans getirisidir. Varlık seçimi, getiri farkı çarpı referans ağırlığıdır. Etkileşim ise getiri farkı çarpı ağırlık farkıdır. Üçünün toplamı aktif getiriyi verir. Varlık dağılımı piyasa zamanlaması olarak da adlandırılır.", "Riskin kaynaklarında temel veri varyans kovaryans matrisidir. Bir varlığın oynaklığı ya da diğerleriyle korelasyonu arttıkça toplam riske katkısı artar. Referansla korelasyonu yüksekse veya ağırlığı referanstakine yakınsa aktif riski düşük olur. Performansta şansı test etmek için de değerlendirme ölçütüne, alfanın t testiyle anlamlılığına ve alfanın kalıcılığına bakılır.", "Faktör analizinde portföy getirisi piyasa, büyüklük, değer ve momentum gibi faktörlerle açıklanır. Büyüklük faktörü küçük eksi büyük, değer faktörü değer eksi büyüme, momentum faktörü kazananlar eksi kaybedenler olarak kurulur. Mutlak analizde faktörler çeşitlendirmeyi, alfa zamanlamayı, hata terimi de yoğunlaşmayı temsil eder. Göreceli analizde portföy ile referansın duyarlılık farkına faktör eğilimi denir.", "Aktif pay, portföy ile referans ağırlıkları arasındaki mutlak farkların toplamının yarısıdır. Aktif pay yüzde seksen ise portföy referansa yüzde yirmi oranında benziyor demektir. Sektör uygulamasında aktif risk için yüzde yedi, aktif pay için yüzde yetmiş ve üzeri yüksek kabul edilir. Aktif payı yüksek ama aktif riski düşük, iyi çeşitlendirilmiş hisse seçici portföylerin alfa potansiyeli daha yüksektir. Sektör rotasyon portföylerinde ise öne çıkan bileşen zamanlamadır.", "Son konu referans portföy. Piyasa endeksi bir piyasayı, referans portföy ise belirli bir portföyü takip eder.", "Bailey'nin ilkeleri açıklık, yatırım yapılabilirlik, ölçülebilirlik, uygunluk ve önceden belirlenmedir. Bailey'nin bileşen analizinde portföy getirisi piyasa artı stil artı aktif karardır. Stil, referans ile piyasa farkıdır. Aktif karar ise portföy ile referans farkıdır.", "Kalite standartlarında en çok sorulanı sistematik yanlılıktır. Stil katkısı ile aktif karar arasında anlamlı bir korelasyon olmamalıdır. Bir de karşılama oranı var. Hem portföyde hem referansta bulunan varlıkların piyasa değerinin, portföyün toplam değerine oranıdır ve yüksek olmalıdır. Yanlış referans seçilirse stil etkisi kaybolur ve yönetici olduğundan başarılı görünür.", "Toparlayalım, birincisi, yatırım fonlarında zaman ağırlıklı, özel sermaye fonlarında para ağırlıklı getiri kullanılır. İkincisi, Sharpe toplam riski, Treynor betayı, Sortino aşağı yönlü riski, bilgi ölçütü aktif riski kullanır. Üçüncüsü, Jensen alfası beklenen getirinin üstündeki farktır ve azami yönetim ücretini temsil eder. Dördüncüsü, bilgi ölçütü aktif ağırlıklar ikiye katlansa da değişmez. Beşincisi, Bailey analizinde stil referans eksi piyasa, aktif karar portföy eksi referanstır."]};
const AUD={"1": 16, "2": 18, "3": 17, "4": 16, "5": 18, "6": 22, "7": 22, "8": 22, "9": 22, "10": 22};
</script>
<script>
(function(){
const L="ABCDE";
const KEY="d1009-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2","#4F46E5","#BE185D","#15803D","#B45309","#0369A1","#9333EA","#0F766E","#C2410C","#1D4ED8"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("d1009"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){
  const s=S[si], col=HUE[si];
  const tab=st.tab[si]||"notlar";
  const f=st.tab["f"+si]||"tum";
  const x=secStats(si), kb=s.sorular.filter(q=>q.k).length;
  let h=`<div style="--c:${col};display:contents">
  <div class="crumb"><a href="#genel">Genel bakış</a> / Bölüm ${s.id}</div>
  <section class="hero"><div><span class="pill">Bölüm ${s.id} / ${S.length} · ${s.sorular.length} soru</span><h1>${esc(s.baslik)}</h1><p>${esc(s.ozet)}</p></div>${ring(x.c,x.n,col,"doğru")}</section>
  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,S.length>8?2:3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();
  const list=st.karma.list, x=statsOf(list,st.karma.ans);
  let h=`<div class="crumb"><a href="#genel">Genel bakış</a> / Karma deneme</div>
  <section class="hero" style="--c:#141A2B"><div><span class="pill">Tüm bölümler · ${list.length} soru</span><h1>Karma deneme</h1><p>Her bölümden en az ${S.length>8?"iki":"üç"} soru içeren rastgele set. Buradaki cevaplar bölüm skorlarını etkilemez.</p></div>${ring(x.c,list.length,"#0E8F7E","doğru")}</section>
  ${bar(x,`<button class="btn pri" data-newkarma="1">Yeni set oluştur</button>`)}<div class="qlist">`;
  const saved=st.ans; st.ans=st.karma.ans;
  list.forEach(([s,qi],n)=>{h+=qCard(s,qi,n+1,true)});
  st.ans=saved;
  return h+`</div>`;
}

function renderHome(){
  let tA=0,tC=0;S.forEach((s,i)=>{const x=secStats(i);tA+=x.a;tC+=x.c});
  let h=`<section class="hero"><div><span class="pill">SPL · Temel Finans Matematiği ve Değerleme Yöntemleri</span><h1>Temel Finans Matematiği Sınav Defteri</h1>
  <p>Paranın zaman değeri, getiri ve risk, portföy teorisi, fiyatlama modelleri, temel ve teknik analiz, değerleme ve performans ölçümü için bölüm notları ve sorular.</p>
  <div class="row" style="margin-top:18px"><a class="btn pri" href="#b1">Bölüm 1'den başla</a><a class="btn" href="#karma">Karma deneme</a></div></div>${ring(tC,TOTAL,"#0E8F7E","toplam doğru")}</section>
  <div class="tiles"><div class="tile"><span>Yanıtlanan</span><b>${tA}<small style="font-size:14px;color:var(--muted)"> / ${TOTAL}</small></b></div><div class="tile"><span>Doğru</span><b style="color:var(--ok)">${tC}</b></div><div class="tile"><span>Başarı oranı</span><b>${tA?"%"+Math.round(tC/tA*100):"–"}</b></div></div>
  <div class="sec-h"><h2>Bölümler</h2><span class="stat">${TOTAL} soru</span></div>
  <div class="grid">`;
  S.forEach((s,i)=>{const x=secStats(i);const kb=s.sorular.filter(q=>q.k).length;h+=`<a class="card" href="#b${s.id}" style="--c:${HUE[i]}"><div class="top"><span class="no">Bölüm ${s.id}</span><span class="stat">${s.sorular.length} soru</span></div><span class="t">${esc(s.kisa)}</span><span class="d">${esc(s.ozet)}</span>${meter(x.a,x.c,x.n)}<span class="p"><span>${x.c}/${x.n} doğru</span><span>${x.a} yanıt</span></span></a>`});
  h+=`</div>
  <section class="facts"><h2>Sınav öncesi son bakış</h2><dl>
  <div><dt>Efektif yıllık faiz</dt><dd>(1 + r/m)^m − 1; sürekli bileşikte e^r − 1</dd></div>
  <div><dt>Büyüyen perpetüite</dt><dd>BD = A₁ / (r − g); r &gt; g şart</dd></div>
  <div><dt>Örneklem varyansı</dt><dd>Payda T − 1 (anakütlede T)</dd></div>
  <div><dt>Fayda fonksiyonu</dt><dd>U = E(r) − ½ × A × σ²</dd></div>
  <div><dt>FVFM (MKPD)</dt><dd>E(r) = rf + β × [E(rM) − rf]; βM = 1</dd></div>
  <div><dt>Öncü / izleyen göstergeler</dt><dd>GSYİH&#x27;den 6–8 hafta önce / sonra</dd></div>
  <div><dt>İskonto oranı eşleşmesi</dt><dd>FSNA → AOSM; ÖSNA → özsermaye maliyeti</dd></div>
  <div><dt>MACD / RSI</dt><dd>EMA12 ile EMA26 farkı, sinyal 9 gün / RSI 14 gün, 70-30</dd></div>
  <div><dt>Gün sayımı</dt><dd>Devlet Gerçek/Gerçek, kurumsal 30/360, bono Gerçek/360</dd></div>
  <div><dt>Aktif risk / aktif pay</dt><dd>%7 ve üzeri / %70 ve üzeri yüksek</dd></div>
  </dl></section>`;
  return h;
}

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b(\d+)$/.exec(r);
  if(m&&+m[1]>=1&&+m[1]<=S.length) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const AU=new Audio();AU.preload="auto";
const PK="d1009-ses-v1";
let pref={rate:1,voice:"",follow:true,mode:"podcast"};
try{const r=localStorage.getItem(PK);if(r)pref=Object.assign(pref,JSON.parse(r))}catch(e){}
const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(pref))}catch(e){}};

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["ICAPM", "dönemlerarası Finansal Varlıkları Fiyatlama Modeli"],["GSYİH", "gayrisafi yurt içi hasıla"],["CAPEX", "sermaye harcamaları"],["FAVÖK", "faiz, amortisman ve vergi öncesi kâr"],["PD/DD", "piyasa değeri defter değeri oranı"],["TLREF", "Türk lirası gecelik referans faiz oranı"],["NAGD", "nakit akışlarının gelecekteki değeri"],["ETSG", "elde tutma dönemi getirisi"],["TÜFE", "tüketici fiyat endeksi"],["MSCI", "em es si ay"],["FVFM", "Finansal Varlıkları Fiyatlama Modeli"],["CAPM", "Finansal Varlıkları Fiyatlama Modeli"],["MKPD", "Menkul Kıymet Pazarı Doğrusu"],["MKKD", "menkul kıymet karakteristik doğrusu"],["GSYH", "gayrisafi yurt içi hasıla"],["BIST", "Borsa İstanbul"],["NBER", "Ulusal Ekonomik Araştırmalar Bürosu"],["NACE", "Avrupa ekonomik faaliyet sınıflaması"],["OECD", "Ekonomik İşbirliği ve Kalkınma Örgütü"],["BDDK", "Bankacılık Düzenleme ve Denetleme Kurumu"],["ROIC", "yatırım sermayesi getirisi"],["AOSM", "ağırlıklı ortalama sermaye maliyeti"],["BFBD", "büyüme fırsatlarının bugünkü değeri"],["FSNA", "firmaya serbest nakit akımı"],["ÖSNA", "özsermayeye serbest nakit akımı"],["FVÖK", "faiz ve vergi öncesi kâr"],["CAPE", "döngüsel olarak düzeltilmiş fiyat kazanç oranı"],["MACD", "hareketli ortalama yakınsama ıraksama göstergesi"],["DV01", "baz puan değeri"],["KR01", "kısmi süre duyarlılığı"],["DİBS", "devlet iç borçlanma senetleri"],["ISDA", "Uluslararası Swap ve Türev Birliği"],["ICMA", "Uluslararası Sermaye Piyasası Birliği"],["ISMA", "Uluslararası Menkul Kıymet Piyasası Birliği"],["SOFR", "teminatlı gecelik finansman oranı"],["TIPS", "enflasyona karşı korumalı ABD hazine tahvili"],["RMRF", "piyasa risk primi faktörü"],["EYO", "efektif yıllık faiz oranı"],["AGD", "anüitelerin gelecekteki değeri"],["İVO", "iç verim oranı"],["SPD", "Sermaye Pazarı Doğrusu"],["AFT", "Arbitraj Fiyatlama Teorisi"],["ENF", "enflasyon"],["SMB", "küçük eksi büyük faktörü"],["HML", "yüksek eksi düşük faktörü"],["WML", "kazananlar eksi kaybedenler faktörü"],["VaR", "r function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}
  t=t.replace(/(\p{Ll})[’'](\p{L})/gu,"$1$2").replace(/\s+/g," ");
  return t.trim();
}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"&&typeof AUD!=="undefined"?"Bu bölümün podcast'i hazır bir kayıttır; oynat düğmesine bas, anlatılan paragrafı burada takip et.":pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];if(typeof AUD!=="undefined"&&AUD[si+1])P[si+1].forEach((par,k)=>items.push({el:-1,raw:par,say:par,src:"audio/b"+(si+1)+"-"+(k+1)+".mp3"}));else P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;
}
function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  {const au=pref.mode==="podcast"&&typeof AUD!=="undefined";$("pVoice").parentNode.hidden=au;if(au)$("pWarn").hidden=true;}
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){
  const vs=synth.getVoices();const tr=trVoices();
  return vs.find(v=>v.name===pref.voice)||tr[0]||null;
}
function fillVoices(){
  if(!synth)return;
  const vs=synth.getVoices();const tr=trVoices();const list=tr.length?tr:vs;
  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  if(items[idx].src){if(synth)synth.cancel();const tok={};utt=tok;AU.src=items[idx].src;AU.playbackRate=pref.rate;
    AU.onended=()=>{if(utt!==tok||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
    AU.onerror=()=>{if(utt!==tok)return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses dosyası yüklenemedi; bağlantını kontrol edip tekrar dene."};
    AU.play().catch(()=>{});ui();return}
  AU.pause();
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth&&typeof AUD==="undefined"){return}
  let si=curSi>=0?curSi:(qSi>=0?qSi:0);
  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}
  playing=true;speak();
}
function pause(){playing=false;utt=null;AU.pause();if(synth)synth.cancel();ui()}
function stop(finished){playing=false;utt=null;AU.pause();if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth&&typeof AUD==="undefined"){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing&&items[idx]&&items[idx].src){AU.playbackRate=pref.rate;ui()}else if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}
  navByPlayer=false;ui();
});
window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
})();

</script>
