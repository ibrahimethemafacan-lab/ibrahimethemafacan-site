ontu (−), <b>138<\/b> Şüpheli Diğer Alacaklar, <b>139<\/b> Şüpheli Diğer Alacaklar Karşılığı (−).<\/li>\n<li>131–133: esas faaliyet dışı işlemlerden (ödünç verme gibi) doğan alacaklar. Doğunca borç, tahsilde alacak.<\/li>\n<\/ul>\n\n<h3>Alacak senetleri reeskontu (122 ve 137)<\/h3>\n<ul>\n<li>Amaç senetli alacakları bilanço gününde <b>tasarruf (peşin) değeriyle<\/b> göstermektir. Hazine ve Maliye Bakanlığının öngördüğü oran ve formül esas alınır.<\/li>\n<li>Yabancı paralı senetler de reeskonta tabidir (<b>29.7.1998<\/b>'den itibaren). Oran: senetteki faiz oranı; yoksa <b>LIBOR<\/b> (VUK m.280). LIBOR tespiti <b>30 Eylül 2024<\/b>'te durdu, ancak VUK'ta değişiklik yapılmadı.<\/li>\n<li>Aylık, üç aylık veya altı aylık tablo düzenleyenler reeskontu her ara dönem sonunda yapar, izleyen dönemin <b>ilk günü ters kayıtla<\/b> kapatır.<\/li>\n<\/ul>\n<p><b>Dönem sonu: ticari senetler için 90.000 TL, diğer senetler için 30.000 TL reeskont<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>657 Reeskont Faiz Giderleri<\/td><td><\/td><td>120.000<\/td><\/tr><tr><td><\/td><td>122 Alacak Senetleri Reeskontu<\/td><td>90.000<\/td><\/tr><tr><td><\/td><td>137 Diğer Alacak Senetleri Reeskontu<\/td><td>30.000<\/td><\/tr><\/table><p><b>İzleyen yılın ilk günü<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>122 Alacak Senetleri Reeskontu<\/td><td><\/td><td>90.000<\/td><\/tr><tr><td>137 Diğer Alacak Senetleri Reeskontu<\/td><td><\/td><td>30.000<\/td><\/tr><tr><td><\/td><td>647 Reeskont Faiz Gelirleri<\/td><td>120.000<\/td><\/tr><\/table>\n<h3>Şüpheli alacaklar ve karşılık<\/h3>\n<ul>\n<li>Tekdüzen sistemdeki tanım VUK'taki şüpheli alacak tanımını aynen benimser. Uzun vadeli alacak gruplarında <b>şüpheli alacak hesabı yoktur<\/b> (ama 229 ve 239 karşılık hesapları vardır); bu nitelikteki kısa vadeli alacaklar şüpheli alacak hesabına aktarılır ve ihtiyatlılık gereği karşılık ayrılır.<\/li>\n<li><b>Perakende satış yöntemi:<\/b> bilanço gününden önceki <b>iki dönemde<\/b> vadesinde tahsil edilemeyen alacakların o dönemlerin toplam vadeli satışlarına oranlarının <b>ortalaması<\/b>, değerleme dönemindeki vadeli satışlara uygulanır.<\/li>\n<li>Bulunan karşılık mevcut karşılık bakiyesinden azsa fark <b>129 borç / 644 alacak<\/b>.<\/li>\n<li>Daha önce kayıtlardan silinmiş bir alacak sonradan tahsil edilirse <b>671 Önceki Dönem Gelir ve Kârları<\/b>.<\/li>\n<li>Gerçekleşen zarar ayrılan karşılığı aşarsa: karşılık kadar 129 borç, fazlası <b>681 Önceki Dönem Gider ve Zararları<\/b> borç (hesap planı açıklaması ve kitap örneği).<\/li>\n<li>Dikkat: Kitapta aynı konu anlatılırken zarar fazlası için bir yerde 654 Karşılık Giderleri de geçmektedir; hesap planı açıklaması ve sayısal örnek 681'i kullanır. Tahmin edilen zararın gerçekleşmeyen kısmı hesap planında 644'e aktarılır; kitabın izleyen döneme ait tahsil örneğinde ise fark 671'e alınmıştır.<\/li>\n<\/ul>\n<p><b>Kitap örneği: 560.000 TL'lik senet şüpheli hale geldi, 160.000 TL karşılık ayrıldı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>128 Şüpheli Ticari Alacaklar<\/td><td><\/td><td>560.000<\/td><\/tr><tr><td><\/td><td>121 Alacak Senetleri<\/td><td>560.000<\/td><\/tr><tr><td>654 Karşılık Giderleri<\/td><td><\/td><td>160.000<\/td><\/tr><tr><td><\/td><td>129 Şüpheli Ticari Alacaklar Karşılığı<\/td><td>160.000<\/td><\/tr><\/table><p><b>İzleyen dönemde yalnız 310.000 TL tahsil edildi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>100 Kasa<\/td><td><\/td><td>310.000<\/td><\/tr><tr><td>129 Şüpheli Ticari Alacaklar Karşılığı<\/td><td><\/td><td>160.000<\/td><\/tr><tr><td>681 Önceki Dönem Gider ve Zararları<\/td><td><\/td><td>90.000<\/td><\/tr><tr><td><\/td><td>128 Şüpheli Ticari Alacaklar<\/td><td>560.000<\/td><\/tr><\/table>\n<ul>\n<li>Dikkat: Senet iskontosunda iskonto bedeli <b>780 Finansman Giderleri<\/b>'ne, banka tahsil komisyonu <b>653 Komisyon Giderleri<\/b>'ne, protesto ve hatır senedi giderleri <b>770 Genel Yönetim Giderleri<\/b>'ne yazılır.<\/li>\n<li>Dikkat: Menkul kıymet alım komisyonu maliyete eklenmez; maddi duran varlıkta ise kullanılır hale getirme giderleri maliyete eklenir. Bu fark sık sorulur.<\/li>\n<\/ul>", "sorular": [{"q": "Hazır değerler grubunun kapsamı ile ilgili hangisi doğrudur?", "o": ["Menkul kıymetler dahil tüm likit varlıkları kapsar", "Yalnızca kasadaki ulusal parayı kapsar", "Ticari alacakları da kapsar", "Bir yıldan uzun vadeli mevduatları kapsar", "Elde ve bankadaki nakit ile değer kaybına uğramadan paraya çevrilebilen varlıkları kapsar, menkul kıymetler hariçtir"], "a": 4, "e": "10 Hazır Değerler grubu nakit ile değer kaybına uğramadan paraya çevrilebilen varlıkları içerir; menkul kıymetler ayrı (11) grupta izlenir."}, {"q": "Akşam yapılan sayımda kasada 132.800 TL bulunmuştur; kayıtlara göre kasada 145.300 TL olması gerekir. Yapılacak kayıt hangisidir?", "o": ["100 Kasa borç, 397 Sayım ve Tesellüm Fazlaları alacak 12.500 TL", "689 Diğer Olağandışı Gider ve Zararlar borç, 100 Kasa alacak 12.500 TL", "197 Sayım ve Tesellüm Noksanları borç, 100 Kasa alacak 132.800 TL", "100 Kasa borç, 197 Sayım ve Tesellüm Noksanları alacak 12.500 TL", "197 Sayım ve Tesellüm Noksanları borç, 100 Kasa alacak 12.500 TL"], "a": 4, "e": "Fiili mevcut kayıtlardan 145.300 − 132.800 = 12.500 TL eksiktir. Noksan önce geçici olarak 197 hesabına alınır, nedeni araştırılır."}, {"q": "Ankara'da keşide edilen ve İzmir'de ödenecek bir çekin muhataba ibraz süresi TTK'ya göre ne kadardır?", "o": ["10 gün", "1 ay", "3 ay", "15 gün", "6 ay"], "a": 1, "e": "Keşide yeri dışında başka bir yerde ödenecek çek bir ay içinde ibraz edilmelidir. Aynı yerde ödenecekse 10 gün, farklı kıtalar arasında 3 aydır."}, {"q": "Bir alıcıdan alınan ileri tarihli çek hangi hesapta izlenmelidir?", "o": ["101 Alınan Çekler", "108 Diğer Hazır Değerler", "102 Bankalar", "121 Alacak Senetleri", "126 Verilen Depozito ve Teminatlar"], "a": 3, "e": "İleri tarihli çek keşide tarihi hükmüne uymadığı ve özün önceliğine aykırı olduğu için alınan çekler hesabında izlenemez; alacak senetleri hesabında izlenir ve dönem sonunda reeskonta tabi tutulur."}, {"q": "Banka, işletmenin mevduatına 250.000 TL faiz tahakkuk ettirmiş ve %15 stopajı hesaptan kesmiştir. 193 Peşin Ödenen Vergiler ve Fonlar hesabına kaç TL borç kaydedilir?", "o": ["37.500 TL", "250.000 TL", "212.500 TL", "25.000 TL", "45.000 TL"], "a": 0, "e": "Stopaj 250.000 × %15 = 37.500 TL'dir. Faizin tamamı 642'ye alacak, stopaj 193'e borç yazılır; bankadaki net artış 212.500 TL olur."}, {"q": "Kurumlar vergisi mükellefi bir işletmede yıl içinde 193 Peşin Ödenen Vergiler ve Fonlar hesabında biriken tutar yılsonunda nasıl işlem görür?", "o": ["131 Ortaklardan Alacaklar ile karşılaştırılarak kapatılır", "Doğrudan gider yazılır", "Ödenecek vergi ve fonlardan mahsup edilir", "Faiz gelirlerinden düşülür", "Sermayeye eklenir"], "a": 2, "e": "Kitaba göre peşin ödenen vergiler kurumlar vergisi mükelleflerinde ödenecek vergi ve fonlardan mahsup edilir; gelir vergisi mükelleflerinde ortaklardan alacaklar ile kapatılır."}, {"q": "İşletmenin satıcıya verdiği çekin lehtar tarafından bankadan tahsil edildiği öğrenilmiştir. Yapılacak kayıt hangisidir?", "o": ["320 Satıcılar borç, 102 Bankalar alacak", "102 Bankalar borç, 103 Verilen Çekler ve Ödeme Emirleri alacak", "103 Verilen Çekler ve Ödeme Emirleri borç, 102 Bankalar alacak", "103 Verilen Çekler ve Ödeme Emirleri borç, 320 Satıcılar alacak", "101 Alınan Çekler borç, 102 Bankalar alacak"], "a": 2, "e": "Çek verildiğinde 320 borç, 103 alacak yazılmıştır. Tahsil edildiği anlaşılınca 103 kapatılır ve bankalar hesabı alacaklandırılır."}, {"q": "İşletme geçici yatırım amacıyla 8.000 adet hisse senedini adedi 14 TL'den satın almış, ayrıca 2.800 TL komisyon ödemiştir. 110 Hisse Senetleri hesabına kaç TL borç kaydedilir?", "o": ["114.800 TL", "112.000 TL", "109.200 TL", "2.800 TL", "140.000 TL"], "a": 1, "e": "Menkul kıymetler alış bedeliyle kaydedilir: 8.000 × 14 = 112.000 TL. Komisyon maliyete eklenmez, 653 Komisyon Giderleri hesabına yazılır."}, {"q": "Adedi 14 TL'den alınmış 5.000 adet hisse adedi 18 TL'den satılmış, satış için 1.500 TL komisyon ödenmiştir. 645 Menkul Kıymet Satış Kârları hesabına kaç TL alacak kaydedilir?", "o": ["18.500 TL", "90.000 TL", "21.500 TL", "20.000 TL", "70.000 TL"], "a": 3, "e": "Satış tutarı 90.000, maliyet 70.000 TL; kâr 20.000 TL. Komisyon ayrıca 653'e yazılır, bankaya giren tutar 88.500 TL olur."}, {"q": "İşletme çıkarıldığı gün aldığı 400.000 TL nominal değerli, 6 ay vadeli, yıllık %30 faizli tahvili vadesinde faiziyle tahsil etmiştir. Stopaj oranı %15'tir. Bankalar hesabına kaç TL borç kaydedilir?", "o": ["460.000 TL", "451.000 TL", "520.000 TL", "442.000 TL", "400.000 TL"], "a": 1, "e": "Altı aylık faiz 400.000 × %30 × 6/12 = 60.000 TL; stopaj 9.000 TL. Bankaya 400.000 + 60.000 − 9.000 = 451.000 TL girer; 9.000 TL 193'e yazılır."}, {"q": "1 Mart'ta çıkarılmış 600.000 TL nominal değerli, yıllık %24 faizli tahvil 1 Mayıs'ta işlemiş faiziyle birlikte satın alınmıştır. Alış kaydında 136 Diğer Çeşitli Alacaklar hesabına kaç TL borç yazılır?", "o": ["12.000 TL", "144.000 TL", "24.000 TL", "48.000 TL", "Hiç tutar yazılmaz, faiz tahvil maliyetine eklenir"], "a": 2, "e": "İki aylık işlemiş faiz 600.000 × %24 × 2/12 = 24.000 TL'dir. Bu tutar tahvilin maliyetine katılmaz, ayrı olarak 136 hesabında izlenir."}, {"q": "Maliyeti 400.000 TL olan 200 adet hisse için daha önce 70.000 TL değer düşüklüğü karşılığı ayrılmıştır. Hisseler adedi 1.900 TL'den satılmıştır. 644 Konusu Kalmayan Karşılıklar hesabına kaç TL alacak kaydedilir?", "o": ["70.000 TL", "20.000 TL", "30.000 TL", "380.000 TL", "50.000 TL"], "a": 4, "e": "Satış 200 × 1.900 = 380.000 TL. Kayıt: 102 380.000 ve 119 70.000 borç; 110 400.000 alacak; denkleştirici 380.000 + 70.000 − 400.000 = 50.000 TL 644'e alacak."}, {"q": "İşletme 250.000 TL'lik bonoyu vadesinden önce bankaya iskonto ettirmiş, iskonto ve giderler 18.000 TL tutmuştur. İskonto tutarı hangi hesaba borç kaydedilir?", "o": ["780 Finansman Giderleri", "653 Komisyon Giderleri", "770 Genel Yönetim Giderleri", "657 Reeskont Faiz Giderleri", "689 Diğer Olağandışı Gider ve Zararlar"], "a": 0, "e": "Senet iskontosu bir finansman işlemidir; iskonto ve giderler 780 Finansman Giderleri hesabına yazılır, bankaya 232.000 TL girer ve ciro sorumluluğu nazım hesaplarda izlenir."}, {"q": "Bankaya tahsile verilen 180.000 TL'lik senet ödenmemiş, banka protesto ettirip 6.000 TL protesto giderini işletmenin hesabından kesmiştir. Senet ve gider sonunda 127 Diğer Ticari Alacaklar hesabına kaç TL ile aktarılır?", "o": ["180.000 TL", "174.000 TL", "6.000 TL", "186.000 TL", "192.000 TL"], "a": 3, "e": "Kitaptaki işleyişe göre protestolu senet ile 770'e yazılan protesto gideri borçluya yansıtılmak üzere toplu olarak 127 hesabına aktarılır: 180.000 + 6.000 = 186.000 TL."}, {"q": "Vadesi gelen 250.000 TL'lik bonosunu ödeyemeyen alıcı, 20.000 TL gecikme faizi karşılığında yeni bir bono vermiştir. Yeni senet ve faiz için doğru ifade hangisidir?", "o": ["Yeni senet 270.000 TL ile 121'e borç, faiz 642 Faiz Gelirleri hesabına alacak yazılır", "Yeni senet 250.000 TL ile kaydedilir, faiz 649'a yazılır", "Yeni senet 270.000 TL ile 120'ye borç yazılır", "Faiz 647 Reeskont Faiz Gelirleri hesabına yazılır", "Yeni senet 128 Şüpheli Ticari Alacaklar hesabına alınır"], "a": 0, "e": "Senet yenilemede eski senet 121'den çıkarılır, yeni senet anapara artı gecikme faiziyle (270.000 TL) 121'e borç yazılır, gecikme faizi 642'ye alınır."}, {"q": "Gerçek bir borcu olmayan bir işletmenin kredi ihtiyacı için verdiği bono (hatır senedi) alındığında karşı hesap olarak hangi hesap alacaklandırılır?", "o": ["120 Alıcılar", "320 Satıcılar", "600 Yurt İçi Satışlar", "649 Diğer Olağan Gelir ve Kârlar", "336 Diğer Çeşitli Borçlar"], "a": 4, "e": "Hatır senedi ticari bir alacağa dayanmadığı için 121 borç, 336 Diğer Çeşitli Borçlar alacak kaydedilir; ilgili giderler 770'e yazılır."}, {"q": "Maliyeti 600.000 TL, birikmiş amortismanı 250.000 TL olan bina, senet alınmaksızın kredili olarak 420.000 TL'ye satılmıştır. Satış bedeli ve KDV'den doğan alacak hangi hesaba borç kaydedilir?", "o": ["120 Alıcılar", "121 Alacak Senetleri", "127 Diğer Ticari Alacaklar", "136 Diğer Çeşitli Alacaklar", "128 Şüpheli Ticari Alacaklar"], "a": 2, "e": "Mal ve hizmet satışı dışındaki ticari işlemlerden (duran varlık ve menkul kıymetin kredili satışı gibi) doğan senetsiz alacaklar 127'de izlenir. Bu satışta kâr 420.000 − 350.000 = 70.000 TL'dir."}, {"q": "Dönem sonunda ticari alacak senetleri için 90.000 TL, diğer alacak senetleri için 30.000 TL reeskont hesaplanmıştır. İzleyen yılın ilk günü yapılacak kayıtta hangi hesap kaç TL alacaklandırılır?", "o": ["657 Reeskont Faiz Giderleri 120.000 TL", "647 Reeskont Faiz Gelirleri 120.000 TL", "122 Alacak Senetleri Reeskontu 90.000 TL", "642 Faiz Gelirleri 120.000 TL", "647 Reeskont Faiz Gelirleri 90.000 TL"], "a": 1, "e": "Dönem sonunda 657 borç, 122 ve 137 alacak yazılır. İzleyen yılın ilk günü 122 ve 137 borçlandırılarak toplam 120.000 TL 647 Reeskont Faiz Gelirleri hesabına alacak yazılır."}, {"q": "Yabancı paralı alacak senetlerinin reeskontunda senette faiz oranı yoksa VUK m.280'e göre hangi oran uygulanır?", "o": ["TCMB politika faizi", "Yasal faiz oranı", "Mevduat faizi ortalaması", "LIBOR (Londra Bankalar Arası Faiz Oranı)", "Enflasyon oranı"], "a": 3, "e": "Kitaba göre senette faiz yoksa LIBOR uygulanır. LIBOR tespiti 30 Eylül 2024'te durmuş, ancak VUK'ta değişiklik yapılmamıştır."}, {"q": "Perakende satış yöntemini uygulayan işletmede önceki iki dönemde vadesinde tahsil edilemeyen alacakların vadeli satışlara oranı %3 ve %5'tir. Cari dönem vadeli satışları 2.500.000 TL, 129 hesabının mevcut alacak kalanı 130.000 TL'dir. Yapılacak kayıt hangisidir?", "o": ["129 borç, 644 Konusu Kalmayan Karşılıklar alacak 30.000 TL", "654 Karşılık Giderleri borç, 129 alacak 100.000 TL", "654 Karşılık Giderleri borç, 129 alacak 30.000 TL", "129 borç, 671 Önceki Dönem Gelir ve Kârları alacak 30.000 TL", "129 borç, 644 alacak 100.000 TL"], "a": 0, "e": "Ortalama oran (%3 + %5)/2 = %4; gereken karşılık 2.500.000 × %4 = 100.000 TL. Mevcut 130.000 TL'den 30.000 TL fazladır; fark 129 borç, 644 alacak yazılır."}, {"q": "Önceki yıllarda tahsil edilemeyeceği anlaşılarak kayıtlardan silinmiş bir alacak bu yıl tahsil edilmiştir. Tahsil edilen tutar hangi hesaba alacak kaydedilir?", "o": ["644 Konusu Kalmayan Karşılıklar", "128 Şüpheli Ticari Alacaklar", "671 Önceki Dönem Gelir ve Kârları", "642 Faiz Gelirleri", "600 Yurt İçi Satışlar"], "a": 2, "e": "Daha önce alacaklardan düşülmüş tutarın tahsili önceki döneme ait bir gelir olarak 671 hesabında izlenir."}, {"q": "Aşağıdakilerden hangisi Tekdüzen sistemdeki şüpheli ticari alacak tanımına girmez?", "o": ["Vadesi birkaç kez uzatılmış alacak", "Protesto edilmiş senet", "Vadesi henüz gelmemiş ve borçlunun ödeme gücü yerinde olan senetli alacak", "Yazıyla birden fazla istendiği halde ödenmeyen alacak", "İcra takibine konulmuş alacak"], "a": 2, "e": "Şüpheli alacak ödeme süresi geçmiş, vadesi birkaç kez uzatılmış veya protesto edilmiş, yazıyla birden fazla istenmiş ya da dava veya icra safhasına aktarılmış alacaklardır."}, {"q": "Bir şüpheli ticari alacak 300.000 TL olup alacağa karşılık 120.000 TL tutarında teminat alınmıştır. Bu alacak için ayrılabilecek karşılık en fazla kaç TL'dir?", "o": ["300.000 TL", "180.000 TL", "120.000 TL", "420.000 TL", "150.000 TL"], "a": 1, "e": "Teminatlı alacaklarda karşılık yalnız teminatı aşan kısım için ayrılır: 300.000 − 120.000 = 180.000 TL."}, {"q": "İşletme ihaleyi kazandığı halde işten vazgeçtiği için verdiği teminatı geri alamamıştır. Teminat tutarı hangi hesaba borç kaydedilir?", "o": ["654 Karşılık Giderleri", "770 Genel Yönetim Giderleri", "126 Verilen Depozito ve Teminatlar", "689 Diğer Olağandışı Gider ve Zararlar", "780 Finansman Giderleri"], "a": 3, "e": "Geri alınamayan depozito ve teminatlar olağandışı bir zarardır ve 689 hesabına borç, 126 hesabına alacak yazılır."}, {"q": "Geçici yatırım amaçlı tuttuğu hisse senetleri için ilgili şirketin genel kurul kararıyla temettü tahakkuk ettiğini öğrenen işletme, kitaptaki örneğe göre hangi hesabı borçlandırır?", "o": ["120 Alıcılar", "136 Diğer Çeşitli Alacaklar", "110 Hisse Senetleri", "640 İştiraklerden Temettü Gelirleri", "131 Ortaklardan Alacaklar"], "a": 1, "e": "Kitap örneğinde tahakkuk eden temettü 136 Diğer Çeşitli Alacaklar borç, 649 alacak kaydedilir; tahsilde 136 kapatılır ve banka komisyonu 653'e yazılır."}]}, {"id": 4, "kisa": "Stoklar ve Diğer Dönen V.", "baslik": "Dönen Varlıklar II: Stoklar, Gelecek Aylara Ait Giderler ve Diğer Dönen Varlıklar", "ozet": "Stok hesapları, aralıklı ve aralıksız sayım yöntemleri, iskonto ve iadeler, stok değer düşüklüğü, sipariş avansları ile KDV ve diğer dönen varlık hesapları.", "notlar": "<h3>15 Stoklar: kapsam ve hesaplar<\/h3>\n<ul>\n<li>Satmak, üretimde kullanmak veya tüketmek amacıyla edinilen ve bir yıl içinde kullanılacak veya nakde çevrilecek ilk madde ve malzeme, yarı mamul, mamul, ticari mal, yan ürün, artık ve hurda. <b>Faturası gelmemiş stoklar<\/b> ilgili kalemin içinde gösterilir.<\/li>\n<li><b>Ticari mal:<\/b> satmak için alınan; <b>hammadde:<\/b> mamul üretiminde kullanılan; <b>yarı mamul:<\/b> üretimine başlanmış ama raporlama tarihinde bitmemiş; <b>mamul:<\/b> üretimi tamamlanmış, satışa hazır.<\/li>\n<li>İlk üç hesap (150, 151, 152) üretim işletmelerince kullanılır.<\/li>\n<\/ul>\n<table>\n<tr><th>Hesap<\/th><th>İşleyiş<\/th><\/tr>\n<tr><td>150 İlk Madde ve Malzeme<\/td><td>Hammadde, yardımcı madde, işletme ve ambalaj malzemesi. Alış veya üretim maliyetiyle borç; üretime verilince, tüketilince, satılınca alacak (üretime verilen 710 Direkt İlk Madde ve Malzeme Giderleri'ne).<\/td><\/tr>\n<tr><td>151 Yarı Mamuller – Üretim<\/td><td>İki fonksiyonu vardır: <b>üretim hesabı<\/b> ve <b>yarı mamul stokunu saptama<\/b>. Dönem sonunda direkt ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri (711, 721, 731 yansıtma hesapları) kadar borçlanır; tamamlananlar 152'ye aktarılır. Kalanı yarı mamul stokudur.<\/td><\/tr>\n<tr><td>152 Mamuller<\/td><td>Tamamlanan mamuller ambara alınınca borç, satılınca veya çekilince alacak.<\/td><\/tr>\n<tr><td>153 Ticari Mallar<\/td><td>Değişikliğe uğramadan satılmak üzere alınan mallar. Maliyet bedeliyle borç, satış veya çekilişte maliyet bedeliyle alacak.<\/td><\/tr>\n<tr><td>157 Diğer Stoklar<\/td><td>Yoldaki mallar, değeri düşük stoklar, ürün, artık ve hurda gibi ayrı izlenmesi mümkün olmayan kalemler; maliyet bedeliyle.<\/td><\/tr>\n<tr><td>158 Stok Değer Düşüklüğü Karşılığı (−)<\/td><td>Yangın, deprem, su basması, bozulma, çürüme, kırılma, paslanma, teknolojik gelişme, moda değişikliği veya piyasa fiyatı düşüşü nedeniyle ayrılan karşılık.<\/td><\/tr>\n<tr><td>159 Verilen Sipariş Avansları<\/td><td>Sipariş edilen stoklar için yapılan avans ödemeleri; ödeme borç, malın tesliminde alacak.<\/td><\/tr>\n<\/table>\n<p><b>Örnek: Üretime 25.000 TL madde, 16.000 TL işçilik, 9.000 TL genel üretim gideri verildi; 38.000 TL'lik mamul tamamlandı (yarı mamul kalanı 12.000 TL)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>151 Yarı Mamuller – Üretim<\/td><td><\/td><td>50.000<\/td><\/tr><tr><td><\/td><td>711 Direkt İlk Madde ve Malzeme Giderleri Yansıtma<\/td><td>25.000<\/td><\/tr><tr><td><\/td><td>721 Direkt İşçilik Giderleri Yansıtma<\/td><td>16.000<\/td><\/tr><tr><td><\/td><td>731 Genel Üretim Giderleri Yansıtma<\/td><td>9.000<\/td><\/tr><tr><td>152 Mamuller<\/td><td><\/td><td>38.000<\/td><\/tr><tr><td><\/td><td>151 Yarı Mamuller – Üretim<\/td><td>38.000<\/td><\/tr><\/table>\n<h3>Mal hareketlerinin kaydında iki yöntem<\/h3>\n<p>Seçimde işletmenin yapısı, iş hacmi, mal çeşidi sayısı, teknolojik durum, fiziki sayım kolaylığı ve yöneticilerin bilgi ihtiyacı etkilidir.<\/p>\n<table>\n<tr><th><\/th><th>Aralıklı sayım (aralıklı envanter)<\/th><th>Aralıksız sayım (sürekli envanter)<\/th><\/tr>\n<tr><td>153'ün fonksiyonu<\/td><td><b>Değer + sonuç<\/b> fonksiyonu aynı hesapta<\/td><td>Değer ve sonuç fonksiyonu <b>ayrı hesaplarda<\/b><\/td><\/tr>\n<tr><td>Satış kaydı<\/td><td>Tek madde: satış fiyatıyla 600 alacak; maliyet devri yapılmaz<\/td><td>İki madde: satış fiyatıyla 600 alacak + <b>maliyetle 621 borç / 153 alacak<\/b><\/td><\/tr>\n<tr><td>621'in çalışması<\/td><td><b>Dönem sonunda<\/b> tek kayıtla: SMM = 153 borç kalanı − sayım stoku<\/td><td><b>Her satıştan sonra<\/b><\/td><\/tr>\n<tr><td>Satış iadesi<\/td><td>Yalnız 610 + 191 / 120<\/td><td>610 + 191 / 120 ve ayrıca <b>153 / 621<\/b> (maliyetle)<\/td><\/tr>\n<tr><td>153 borç kalanı (dönem sonu, sayım öncesi)<\/td><td>SMM + dönem sonu stoku<\/td><td>Yalnız olması gereken dönem sonu stoku<\/td><\/tr>\n<tr><td>Sayım farkı<\/td><td><b>Saptanamaz<\/b>; sayım sonucu doğrudan dönem sonu stokudur<\/td><td>Saptanır: fazla 153 / 397, noksan 197 / 153<\/td><\/tr>\n<\/table>\n<p><b>153 hesabına kayıtlar (her iki yöntemde):<\/b> borç tarafına dönem başı stoku, satın almalar, <b>satın alma giderleri<\/b> ve iade giderleri (alıcı olarak ödenen); alacak tarafına satın alma iskontoları, satın alma iadeleri ve satılan malların maliyeti. Aralıksız yöntemde satış iadelerinin maliyeti 153'ün borcuna yazılır.<\/p>\n<ul>\n<li><b>Satış giderleri<\/b> (satışla ilgili taşıma gibi) 153'e değil <b>760 Pazarlama, Satış ve Dağıtım Giderleri<\/b>'ne yazılır; dönem gideridir ve brüt satış kârından düşülür. Dolayısıyla satılan malın maliyeti, alış maliyetine eşittir.<\/li>\n<li>Satış iadelerinde ödenen iade giderleri satıcı tarafından ödenirse satış gideri, alıcı tarafından ödenirse satın alma gideri gibi işlem görür.<\/li>\n<\/ul>\n<h4>Aralıklı sayım yöntemi: sayısal örnek<\/h4>\n<p>Dönem başı stok 12.000 TL; 80.000 TL mal alındı; alışla ilgili 6.000 TL taşıma gideri; satıcı 3.000 TL iskonto yaptı; 4.000 TL'lik mal iade edildi; 70.000 TL'lik satış; müşteriden 2.000 TL iade, müşteriye 1.000 TL iskonto; satışla ilgili 5.000 TL nakliye; dönem sonu sayımında stok 46.000 TL (KDV %18).<\/p>\n<p><b>Alış iskontosu<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>320 Satıcılar<\/td><td><\/td><td>3.540<\/td><\/tr><tr><td><\/td><td>153 Ticari Mallar<\/td><td>3.000<\/td><\/tr><tr><td><\/td><td>391 Hesaplanan KDV (alış iskontoları KDV'si)<\/td><td>540<\/td><\/tr><\/table><p><b>Satış iadesi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>610 Satıştan İadeler<\/td><td><\/td><td>2.000<\/td><\/tr><tr><td>191 İndirilecek KDV (satış iadeleri KDV'si)<\/td><td><\/td><td>360<\/td><\/tr><tr><td><\/td><td>120 Alıcılar<\/td><td>2.360<\/td><\/tr><\/table><p><b>Satış iskontosu<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>611 Satış İskontoları<\/td><td><\/td><td>1.000<\/td><\/tr><tr><td>191 İndirilecek KDV (satış iskontoları KDV'si)<\/td><td><\/td><td>180<\/td><\/tr><tr><td><\/td><td>120 Alıcılar<\/td><td>1.180<\/td><\/tr><\/table><p><b>Dönem sonu: 153 borç kalanı 12.000 + 80.000 + 6.000 − 3.000 − 4.000 = 91.000 TL; SMM = 91.000 − 46.000 = 45.000 TL<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>621 Satılan Ticari Mallar Maliyeti<\/td><td><\/td><td>45.000<\/td><\/tr><tr><td><\/td><td>153 Ticari Mallar<\/td><td>45.000<\/td><\/tr><\/table>\n<p>Sonuç: net satışlar 70.000 − 2.000 − 1.000 = 67.000 TL; brüt satış kârı 67.000 − 45.000 = 22.000 TL; satış gideri düşülünce 17.000 TL.<\/p>\n<ul>\n<li>Dikkat: Alış iskontosu ve alış iadesinde KDV düzeltmesi <b>391 Hesaplanan KDV<\/b>'ye; satış iskontosu ve satış iadesinde ise <b>191 İndirilecek KDV<\/b>'ye yazılır.<\/li>\n<li>İskonto faturada gösterilmişse ayrı kayıt yapılmaz; kayıt <b>net fatura bedeliyle<\/b> yapılır. Sonradan yapılan iskontolar ayrıca kaydedilir. Peşin ödeme nedeniyle yapılan iskontoya <b>kasa iskontosu<\/b>, çok miktarda alım nedeniyle yapılana <b>miktar iskontosu<\/b> denir.<\/li>\n<li>Kalite koşullarına uymayan mal iade edilir; satıcı belli oranda iskonto önerir ve alıcı kabul ederse iade yapılmaz.<\/li>\n<\/ul>\n<h4>Aralıksız sayım yöntemi<\/h4>\n<p><b>Maliyeti 40.000 TL olan mal 64.000 TL'ye kredili satıldı (KDV %18)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>120 Alıcılar<\/td><td><\/td><td>75.520<\/td><\/tr><tr><td><\/td><td>600 Yurt İçi Satışlar<\/td><td>64.000<\/td><\/tr><tr><td><\/td><td>391 Hesaplanan KDV<\/td><td>11.520<\/td><\/tr><tr><td>621 Satılan Ticari Mallar Maliyeti<\/td><td><\/td><td>40.000<\/td><\/tr><tr><td><\/td><td>153 Ticari Mallar<\/td><td>40.000<\/td><\/tr><\/table><p><b>Dönem sonu: 153 kalanı 44.000 TL, sayımda 46.500 TL bulundu<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>153 Ticari Mallar<\/td><td><\/td><td>2.500<\/td><\/tr><tr><td><\/td><td>397 Sayım ve Tesellüm Fazlaları (mal sayım fazlası)<\/td><td>2.500<\/td><\/tr><\/table>\n<p>7/A seçeneğinde 760'ta toplanan satış giderleri dönem sonunda <b>761 Yansıtma<\/b> aracılığıyla <b>631<\/b>'e, oradan 690'a aktarılır. Gelir hesapları (600) 690'ın alacağına, indirim ve maliyet hesapları (610, 611, 621) borcuna devredilir.<\/p>\n\n<h3>158 Stok değer düşüklüğü karşılığı<\/h3>\n<ul>\n<li>Değer düşüklüğü saptanınca: <b>654 Karşılık Giderleri borç / 158 alacak<\/b>. Tekdüzen sistem bu zararı mal hareketlerinden doğan gider değil, <b>diğer olağan faaliyetlerden gider<\/b> olarak kabul eder (65 grubu).<\/li>\n<li>Değeri düşük stok satılırken satış tutarı maliyeti aşmadıkça <b>satış tutarı alış maliyetine eşit<\/b> varsayılır.<\/li>\n<li>Satışla işlevi kalmayan karşılık <b>644 Konusu Kalmayan Karşılıklar<\/b>'a aktarılır. Önceki dönemlerde ayrılıp gerek kalmayan karşılıklar <b>671 Önceki Dönem Gelir ve Kârları<\/b>'na alınır.<\/li>\n<li>Değeri düşük stok satıldığında dört durum: karşılığa gerek kalmaması; karşılıktan kısmen yararlanılması; karşılığa gerek kalmayıp maliyetten yüksek fiyatla satış; karşılıktan tam yararlanılması (satılamayıp kayıttan silinme: 158 / 153).<\/li>\n<li>Aralıklı yöntemde maliyet devri yılsonunda yapıldığı için kullanılmayan karşılık farkı yılsonu değerlemesinde ele alınır.<\/li>\n<\/ul>\n<p><b>Örnek (aralıksız sayım): 60.000 TL'lik değeri düşük mal için aynı tutarda karşılık ayrıldı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>654 Karşılık Giderleri<\/td><td><\/td><td>60.000<\/td><\/tr><tr><td><\/td><td>158 Stok Değer Düşüklüğü Karşılığı<\/td><td>60.000<\/td><\/tr><\/table><p><b>Mal 45.000 TL'ye peşin satıldı (karşılıktan kısmen yararlanma)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>100 Kasa<\/td><td><\/td><td>53.100<\/td><\/tr><tr><td><\/td><td>600 Yurt İçi Satışlar<\/td><td>45.000<\/td><\/tr><tr><td><\/td><td>391 Hesaplanan KDV<\/td><td>8.100<\/td><\/tr><tr><td>621 Satılan Ticari Mallar Maliyeti<\/td><td><\/td><td>45.000<\/td><\/tr><tr><td>158 Stok Değer Düşüklüğü Karşılığı<\/td><td><\/td><td>15.000<\/td><\/tr><tr><td><\/td><td>153 Ticari Mallar<\/td><td>60.000<\/td><\/tr><tr><td>158 Stok Değer Düşüklüğü Karşılığı<\/td><td><\/td><td>45.000<\/td><\/tr><tr><td><\/td><td>644 Konusu Kalmayan Karşılıklar<\/td><td>45.000<\/td><\/tr><\/table>\n<h3>159 Verilen sipariş avansları<\/h3>\n<ul>\n<li>Mal siparişi için ödenen avans 159'da; maddi ve maddi olmayan duran varlık ile özel tükenmeye tabi varlık siparişleri için ödenenler \"verilen avanslar\" (259, 269, 279) hesaplarında izlenir.<\/li>\n<li>Avansın karşılığı işletmeye <b>para olarak dönmez<\/b>, mal veya hizmet olarak döner; işletmenin para isteme hakkı yoktur. Bu yüzden avanslar <b>alacaklar grubunda yer almaz<\/b>.<\/li>\n<li>Verilen avanslar <b>damga vergisine<\/b> tabidir; kitap örneğinde binde 7,5 oranındaki vergi avanstan mahsup edilip 360 Ödenecek Vergi ve Fonlar'a alınmıştır. Sipariş ve teminat mektubu nazım hesaplarda izlenir; mal teslim alınınca nazım kayıtlar silinir.<\/li>\n<\/ul>\n<p><b>600.000 TL'lik siparişe 200.000 TL avans ödendi; binde 7,5 damga vergisi avanstan kesildi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>159 Verilen Sipariş Avansları<\/td><td><\/td><td>200.000<\/td><\/tr><tr><td><\/td><td>102 Bankalar<\/td><td>198.500<\/td><\/tr><tr><td><\/td><td>360 Ödenecek Vergi ve Fonlar<\/td><td>1.500<\/td><\/tr><\/table><p><b>Mal teslim alındı; 150.000 TL çek verildi, kalan ve KDV için borçlanıldı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>153 Ticari Mallar<\/td><td><\/td><td>600.000<\/td><\/tr><tr><td>191 İndirilecek KDV<\/td><td><\/td><td>108.000<\/td><\/tr><tr><td><\/td><td>159 Verilen Sipariş Avansları<\/td><td>200.000<\/td><\/tr><tr><td><\/td><td>103 Verilen Çekler ve Ödeme Emirleri<\/td><td>150.000<\/td><\/tr><tr><td><\/td><td>320 Satıcılar<\/td><td>358.000<\/td><\/tr><\/table>\n<h3>Stoklarla ilgili özel durumlar<\/h3>\n<ul>\n<li><b>Mal sigorta tazminatı:<\/b> tazminat ile hasarlı malın değeri arasındaki fark kâr veya zarara yazılır. Örnek: değer kaybı 30.000 TL, tahakkuk eden tazminat 42.000 TL → 127 borç 42.000; 153 alacak 30.000; <b>679 Diğer Olağandışı Gelir ve Kârlar<\/b> alacak 12.000.<\/li>\n<li><b>Ambalaj:<\/b> ticaret işletmesinde dayanıksız ambalaj gideri <b>satış gideri<\/b>dir; sanayide belli durumlarda mamul maliyetine girer. Dayanıklı ve iade edilecek ambalajda bedel faturaya katıldıysa iade, mal iadesi gibi kaydedilir; depozito alındıysa <b>326 Alınan Depozito ve Teminatlar<\/b> borç hesabında izlenir, ambalaj dönünce ters kayıtla kapatılır.<\/li>\n<\/ul>\n\n<h3>18 Gelecek aylara ait giderler ve gelir tahakkukları<\/h3>\n<ul>\n<li><b>180 Gelecek Aylara Ait Giderler:<\/b> peşin ödenen ve cari dönemin gideri olmayan tutarlar; ilgili aylarda gider hesabına aktarılır.<\/li>\n<li><b>181 Gelir Tahakkukları:<\/b> döneme ait olup tahsili veya kesin borç kaydı sonraki döneme kalan gelirler; dönem sonunda gelir hesabı karşılığında borçlandırılır.<\/li>\n<\/ul>\n\n<h3>19 Diğer dönen varlıklar<\/h3>\n<table>\n<tr><th>Hesap<\/th><th>Özellik<\/th><\/tr>\n<tr><td>190 Devreden KDV<\/td><td>191'in 391 ile karşılaştırılmasından sonra indirilemeyen ve izleyen döneme devreden KDV (191'den 190'a aktarılır).<\/td><\/tr>\n<tr><td>191 İndirilecek KDV<\/td><td>Mal ve hizmet alımında ödenen KDV.<\/td><\/tr>\n<tr><td>192 Diğer KDV<\/td><td>Teşvikli yatırım malı ithalinde ertelenen ve bir yıl içinde indirilecek KDV.<\/td><\/tr>\n<tr><td>193 Peşin Ödenen Vergiler ve Fonlar<\/td><td>Bir yıl içinde mahsup edilecek peşin vergiler. Dönem sonunda 371'e aktarılır; aktarılan tutar <b>370'teki tutarı aşamaz<\/b>, aşan kısım 193'te kalır.<\/td><\/tr>\n<tr><td>195 İş Avansları<\/td><td>İşletme adına harcama yapacak personel ve diğer kişilere verilen avanslar.<\/td><\/tr>\n<tr><td>196 Personel Avansları<\/td><td>Personele işletme hizmetleri için veya ücret ve yolluklara mahsuben verilen avanslar.<\/td><\/tr>\n<tr><td>197 Sayım ve Tesellüm Noksanları<\/td><td>Kasa, stok ve maddi duran varlık noksanları ile tesellüm noksanlarının geçici olarak izlendiği hesap.<\/td><\/tr>\n<tr><td>198 Diğer Çeşitli Dönen Varlıklar<\/td><td>Sayılanlar dışındaki dönen varlıklar.<\/td><\/tr>\n<tr><td>199 Diğer Dönen Varlıklar Karşılığı (−)<\/td><td>Yılsonunda kesin hesaplara aktarılamayan noksanların fazlaları aşan kısmı kadar karşılık: 654 / 199.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Örnek: 391'de 80.000 TL, 191'de 95.000 TL varsa 391 kapatılır, indirilemeyen 15.000 TL <b>190 Devreden KDV<\/b>'ye aktarılır.<\/li>\n<li>Örnek: 193'te 50.000 TL, 370'te 42.000 TL varsa 371'e yalnız 42.000 TL aktarılır, 8.000 TL 193'te kalır.<\/li>\n<\/ul>", "sorular": [{"q": "Aralıklı sayım yöntemini uygulayan işletmede dönem başı stok 15.000, alışlar 120.000, alış giderleri 8.000, alış iskontoları 6.000, alış iadeleri 7.000 TL'dir. Dönem sonu sayımında stok 40.000 TL bulunmuştur. Satılan ticari mallar maliyeti kaç TL'dir?", "o": ["98.000 TL", "103.000 TL", "82.000 TL", "130.000 TL", "90.000 TL"], "a": 4, "e": "191 İndirilecek KDV hesabına borç 900 TL", "191 İndirilecek KDV hesabına alacak 900 TL", "391 Hesaplanan KDV hesabına alacak 900 TL", "391 Hesaplanan KDV hesabına borç 900 TL", "360 Ödenecek Vergi ve Fonlar hesabına alacak 900 TL"], "a": 2, "e": "Kitaptaki kayıtta 320 borç 5.900, 153 alacak 5.000 ve 391 Hesaplanan KDV (alış iskontoları KDV'si) alacak 900 TL yazılır. Alış iadelerinde de KDV 391'e alacak yazılır."}, {"q": "İşletme bir müşterisine faturadan sonra 8.000 TL satış iskontosu yapmıştır (KDV %18). 120 Alıcılar hesabına kaç TL alacak kaydedilir?", "o": ["8.000 TL", "6.560 TL", "9.440 TL", "1.440 TL", "9.600 TL"], "a": 2, "e": "Kayıt: 611 Satış İskontoları 8.000 ve 191 İndirilecek KDV 1.440 borç; 120 Alıcılar 9.440 TL alacak."}, {"q": "Ticaret işletmesinin sattığı malı müşteriye teslim etmek için ödediği nakliye gideri hangi hesaba borç kaydedilir?", "o": ["153 Ticari Mallar", "760 Pazarlama, Satış ve Dağıtım Giderleri", "621 Satılan Ticari Mallar Maliyeti", "770 Genel Yönetim Giderleri", "612 Diğer İndirimler"], "a": 1, "e": "Satış giderleri ticari mallar hesabında izlenmez; dönem gideri olarak 760'ta toplanır ve brüt satış kârından düşülür."}, {"q": "Satın alınan mal için ödenen taşıma gideri aralıklı sayım yönteminde hangi hesaba borç kaydedilir?", "o": ["760 Pazarlama, Satış ve Dağıtım Giderleri", "770 Genel Yönetim Giderleri", "780 Finansman Giderleri", "153 Ticari Mallar", "621 Satılan Ticari Mallar Maliyeti"], "a": 3, "e": "Satın alma giderleri malın maliyetine eklenir ve 153'ün borcuna yazılır; satış giderlerinden farkı budur."}, {"q": "Üretime 25.000 TL direkt ilk madde ve malzeme, 16.000 TL direkt işçilik ve 9.000 TL genel üretim gideri verilmiş, 38.000 TL'lik mamulün üretimi tamamlanmıştır. 151 Yarı Mamuller hesabının kalanı kaç TL'dir?", "o": ["50.000 TL", "12.000 TL", "38.000 TL", "21.000 TL", "3.000 TL"], "a": 1, "e": "151 borcu 25.000 + 16.000 + 9.000 = 50.000 TL; tamamlanan 38.000 TL 152'ye aktarılır; kalan 12.000 TL yarı mamul stokudur."}, {"q": "İşletme verdiği bir mal siparişi için 200.000 TL avans ödemiş, binde 7,5 oranındaki damga vergisini avanstan kesmiştir. Bankalar hesabına kaç TL alacak kaydedilir?", "o": ["200.000 TL", "185.000 TL", "198.500 TL", "201.500 TL", "1.500 TL"], "a": 2, "e": "Damga vergisi 200.000 × 7,5/1000 = 1.500 TL; 159 borç 200.000, 360 alacak 1.500, 102 alacak 198.500 TL."}, {"q": "Sipariş edilen 600.000 TL'lik mal teslim alınmıştır (KDV %18). Daha önce 200.000 TL avans verilmiş, teslimde 150.000 TL çek keşide edilmiş, kalan ve KDV için borçlanılmıştır. 320 Satıcılar hesabına kaç TL alacak yazılır?", "o": ["250.000 TL", "450.000 TL", "508.000 TL", "400.000 TL", "358.000 TL"], "a": 4, "e": "Toplam 600.000 + 108.000 = 708.000 TL; avans 200.000 ve çek 150.000 düşülünce 358.000 TL satıcılara borçlanılır."}, {"q": "Aralıksız sayım yönteminde maliyeti 60.000 TL olan değeri düşük mal için 60.000 TL karşılık ayrılmıştı. Mal 45.000 TL'ye satılmıştır. 644 Konusu Kalmayan Karşılıklar hesabına kaç TL alacak yazılır?", "o": ["45.000 TL", "15.000 TL", "60.000 TL", "0 TL", "30.000 TL"], "a": 0, "e": "Kitaptaki işleyişe göre satış tutarı maliyet sayılır: 621 45.000 ve 158 15.000 borç, 153 60.000 alacak. Kalan karşılık 45.000 TL işlevini yitirir ve 158 borç, 644 alacak yazılır."}, {"q": "Stoklarda değer düşüklüğü saptandığında ayrılan karşılık için borçlanan hesap hangisidir?", "o": ["621 Satılan Ticari Mallar Maliyeti", "689 Diğer Olağandışı Gider ve Zararlar", "158 Stok Değer Düşüklüğü Karşılığı", "654 Karşılık Giderleri", "770 Genel Yönetim Giderleri"], "a": 3, "e": "Tekdüzen sistem stok değer düşüklüğünü mal hareketi gideri değil diğer olağan faaliyet gideri sayar: 654 borç, 158 alacak."}, {"q": "Hasara uğrayan malın değer kaybı 30.000 TL'dir. Sigorta şirketi işletme lehine 42.000 TL tazminat tahakkuk ettirmiştir. Kayıtta 679 Diğer Olağandışı Gelir ve Kârlar hesabına kaç TL alacak yazılır?", "o": ["12.000 TL", "42.000 TL", "30.000 TL", "72.000 TL", "679 kullanılmaz, fark 153'e yazılır"], "a": 0, "e": "127 borç 42.000; 153 alacak 30.000; tazminat fazlası 12.000 TL 679'a alacak yazılır."}, {"q": "7/A seçeneğini uygulayan ticaret işletmesinde satış giderlerinin dönem sonucuna ulaşma sırası hangisidir?", "o": ["631, 760, 761, 690", "760, 631, 761, 690", "761, 760, 690, 631", "760, 690, 631, 761", "760, 761, 631, 690"], "a": 4, "e": "Giderler önce 760'ta toplanır; dönem sonunda 761 Yansıtma hesabı alacaklandırılarak 631'e, oradan da 690'a aktarılır."}, {"q": "193 Peşin Ödenen Vergiler ve Fonlar hesabında 50.000 TL, 370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları hesabında 42.000 TL vardır. Dönem sonunda 371 hesabına kaç TL aktarılır?", "o": ["50.000 TL aktarılır", "8.000 TL aktarılır", "42.000 TL aktarılır, 8.000 TL gider yazılır", "Hiç aktarma yapılmaz", "42.000 TL aktarılır, 8.000 TL 193'te kalır"], "a": 4, "e": "193'ten 371'e aktarılacak tutar 370'teki tutarı aşamaz; aşan 8.000 TL 193'ün bakiyesi olarak kalır."}, {"q": "Ay sonunda 391 Hesaplanan KDV'de 80.000 TL, 191 İndirilecek KDV'de 95.000 TL bulunmaktadır. Mahsuptan sonra yapılacak işlem hangisidir?", "o": ["15.000 TL 360 Ödenecek Vergi ve Fonlar hesabına alacak yazılır", "İndirilemeyen 15.000 TL 190 Devreden KDV hesabına borç kaydedilir", "15.000 TL 192 Diğer KDV hesabına aktarılır", "15.000 TL gider yazılır", "95.000 TL 190 hesabına aktarılır"], "a": 1, "e": "391 kapatılır; 191'in indirilemeyen 15.000 TL'lik bakiyesi izleyen döneme devretmek üzere 190 Devreden KDV hesabına borç, 191'e alacak yazılır."}, {"q": "Yılsonunda kesin hesaplarına aktarılamayan kasa, stok ve maddi duran varlık sayım noksanları 40.000 TL, sayım fazlaları 25.000 TL'dir. Ayrılacak karşılığın kaydı hangisidir?", "o": ["654 borç, 199 alacak 40.000 TL", "689 borç, 197 alacak 15.000 TL", "197 borç, 397 alacak 25.000 TL", "654 Karşılık Giderleri borç, 199 Diğer Dönen Varlıklar Karşılığı alacak 15.000 TL", "199 borç, 654 alacak 15.000 TL"], "a": 3, "e": "199 hesabı noksanların fazlaları aştığı kısım kadar ayrılır: 40.000 − 25.000 = 15.000 TL; 654 borç, 199 alacak."}, {"q": "Verilen sipariş avanslarının alacaklar grubunda yer almamasının nedeni hangisidir?", "o": ["Avansın karşılığı işletmeye para olarak değil mal veya hizmet olarak döner", "Avanslar her zaman bir yıldan uzun vadelidir", "Avanslar damga vergisine tabidir", "Avanslar nazım hesaplarda izlenir", "Avanslar gider niteliğindedir"], "a": 0, "e": "İşletmenin verdiği avans karşılığında para isteme hakkı yoktur; karşılık mal veya hizmet olarak döner. Bu yüzden avanslar alacak sayılmaz."}, {"q": "Aralıklı sayım yöntemi ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Ticari mallar hesabına değer ve sonuç fonksiyonu birlikte yüklenir", "Satılan malın maliyeti dönem sonunda tek kayıtla bulunur", "Stok sayım fazlası ve noksanı saptanıp ayrı hesaplarda izlenebilir", "Satışlar satış fiyatıyla 600 hesabına alacak yazılır", "Satılan malların maliyeti 153 borç kalanından sayım stokunun düşülmesiyle bulunur"], "a": 2, "e": "Aralıklı yöntemde yöntemin yapısı gereği sayım farkı saptanamaz; sayım sonucu doğrudan dönem sonu stokudur. Sayım farkı aralıksız yöntemde saptanır."}, {"q": "Aşağıdakilerden hangisi 157 Diğer Stoklar hesabında izlenen kalemlerdendir?", "o": ["Yarı mamuller", "Satışa hazır mamuller", "Artık ve hurda", "Satın alınan hammadde", "Verilen sipariş avansları"], "a": 2, "e": "157 hesabında yoldaki mallar, değeri düşük stoklar, ürün, artık ve hurda gibi diğer hesaplara konulamayan kalemler izlenir."}, {"q": "Satılan mallarla birlikte verilen dayanıklı ambalajlar için müşteriden depozito alınmıştır. Depozito hangi hesaba alacak kaydedilir?", "o": ["126 Verilen Depozito ve Teminatlar", "326 Alınan Depozito ve Teminatlar", "600 Yurt İçi Satışlar", "649 Diğer Olağan Gelir ve Kârlar", "340 Alınan Sipariş Avansları"], "a": 1, "e": "Ambalaj değerinde tahsil edilen depozito bir borçtur ve 326 Alınan Depozito ve Teminatlar hesabında izlenir; ambalaj iade edilince ters kayıtla kapatılır."}, {"q": "Teşvikli yatırım mallarının ithalinde ödenmeyip ertelenen ve bir yıl içinde indirilecek KDV hangi hesapta izlenir?", "o": ["190 Devreden KDV", "191 İndirilecek KDV", "193 Peşin Ödenen Vergiler ve Fonlar", "192 Diğer KDV", "391 Hesaplanan KDV"], "a": 3, "e": "Teşvikli yatırım malı ithalinde ertelenen ve ertelemenin bir yıl içinde olduğu KDV 192 Diğer KDV hesabında izlenir; bir yılı aşan kısım 292'dedir."}, {"q": "Bir satış işleminde iskonto faturada gösterilmiştir. Kaydın nasıl yapılacağına ilişkin doğru ifade hangisidir?", "o": ["Brüt bedel 600'e, iskonto 611'e yazılır", "Kayıt net fatura bedeliyle yapılır, iskonto için ayrı kayıt yapılmaz", "İskonto 649 hesabına gelir yazılır", "Brüt bedel kaydedilir, iskonto dipnotta açıklanır", "İskonto 780 Finansman Giderleri hesabına yazılır"], "a": 1, "e": "Satış veya alış anında yapılıp faturada gösterilen iskonto ayrıca kaydedilmez; kayıtlar net fatura değeriyle yapılır. Sonradan yapılan iskontolar ayrıca kaydedilir."}]}, {"id": 5, "kisa": "Duran Varlıklar", "baslik": "Duran Varlıklar: Uzun Vadeli Alacaklar, Mali Duran Varlıklar, Maddi ve Maddi Olmayan Duran Varlıklar, Amortisman", "ozet": "Mali duran varlıklarda oy oranı eşikleri, duran varlıkların maliyeti, amortisman yöntemleri ve kayıtları, satış, yenileme fonu ve sigorta tazminatı.", "notlar": "<h3>Duran varlıkların kapsamı<\/h3>\n<ul>\n<li>Bir yıldan veya normal faaliyet döneminden daha uzun süre faaliyetlerde kullanılmak amacıyla edinilen ve ilke olarak bir yıl içinde paraya çevrilmesi veya tüketilmesi öngörülmeyen varlıklar. <b>Satmak amacıyla edinilmezler<\/b>; zamanla yıpranır, eskir, değerden düşerler.<\/li>\n<li>Fiziki yapısı olan <b>maddi<\/b> (bina, makine), fiziki yapısı olmayıp hak sağlayan <b>maddi olmayan<\/b> (imtiyaz, telif hakkı) duran varlıklar vardır. Taşınır büro eşyası da sürekli kullanıldığı için duran varlıktır. Hukuk taşınmaz aktiflere sabit değer der; muhasebede taşınır ve taşınmaz birlikte duran varlıktır.<\/li>\n<li>Satılması söz konusu olmayan bir varlığın kullanılmasına son verildiğinde, ömrü uzun olsa da duran varlık niteliği kaybolur.<\/li>\n<li>Gruplar: <b>22<\/b> Ticari Alacaklar, <b>23<\/b> Diğer Alacaklar, <b>24<\/b> Mali Duran Varlıklar, <b>25<\/b> Maddi Duran Varlıklar, <b>26<\/b> Maddi Olmayan Duran Varlıklar, <b>27<\/b> Özel Tükenmeye Tabi Varlıklar, <b>28<\/b> Gelecek Yıllara Ait Giderler ve Gelir Tahakkukları, <b>29<\/b> Diğer Duran Varlıklar (20 ve 21 boştur).<\/li>\n<\/ul>\n\n<h3>22–23 Uzun vadeli alacaklar<\/h3>\n<ul>\n<li>Vadesi bir yılı aşan ticari (220 Alıcılar, 221 Alacak Senetleri, 222 Reeskont, 224 Kazanılmamış Finansal Kiralama Faiz Gelirleri, 226 Verilen Depozito ve Teminatlar, 229 Şüpheli Ticari Alacaklar Karşılığı) ve diğer alacaklar (231, 232, 233, 235, 236, 237, 239). Vadesi bir yılın altına düşenler dönen varlıklardaki ilgili hesaba aktarılır.<\/li>\n<li>Uzun vadeli gruplarda <b>şüpheli alacak hesabı yoktur<\/b>, yalnız karşılık hesapları (229, 239) vardır. 235 Personelden Alacaklar hesabında personele verilen avanslar izlenmez. İşleyiş dönen varlıklardaki karşılıkları gibidir.<\/li>\n<\/ul>\n\n<h3>24 Mali duran varlıklar<\/h3>\n<table>\n<tr><th>Hesap<\/th><th>Kapsam<\/th><\/tr>\n<tr><td>240 Bağlı Menkul Kıymetler<\/td><td>Oy veya yönetime katılma hakkı <b>%10'un altında<\/b> olan ama uzun vadede tutulacak hisseler; uzun vadeli amaç veya yasal zorunlulukla tutulan ya da paraya dönüşme niteliği kaybolmuş diğer menkul kıymetler. Payı %10'un altına düşen iştirakler de buraya (\"Diğer Ortaklıklar\" yardımcı hesabı) aktarılır.<\/td><\/tr>\n<tr><td>241 Bağlı MK Değer Düşüklüğü Karşılığı (−)<\/td><td>119 gibi çalışır.<\/td><\/tr>\n<tr><td>242 İştirakler<\/td><td>Yönetime ve ortaklık politikalarına katılmak için edinilen paylar; oy veya yönetime katılma hakkı <b>en az %10, en fazla %50<\/b>. İştirak ilişkisinde sermaye payına değil oy veya yönetime katılma hakkına bakılır.<\/td><\/tr>\n<tr><td>243 İştiraklere Sermaye Taahhütleri (−)<\/td><td>Taahhütte 242 karşılığında alacak, ödendikçe borç.<\/td><\/tr>\n<tr><td>244 İştirakler Sermaye Payları Değer Düşüklüğü Karşılığı (−)<\/td><td>Sürekli veya önemli düşüşte 654 / 244; düşüş gerçekleşmez veya pay satılırsa 244 / 644.<\/td><\/tr>\n<tr><td>245 Bağlı Ortaklıklar<\/td><td>Doğrudan veya dolaylı <b>%50'den fazla<\/b> sermaye veya oy hakkı ya da en az bu oranda yönetim çoğunluğunu seçme hakkı. Belirlemede <b>yönetim çoğunluğunu seçme hakkı<\/b> esas alınır.<\/td><\/tr>\n<tr><td>246, 247<\/td><td>Bağlı ortaklıklara sermaye taahhütleri (−) ve değer düşüklüğü karşılığı (−); 243 ve 244 gibi.<\/td><\/tr>\n<tr><td>248, 249<\/td><td>Diğer mali duran varlıklar ve karşılığı (−).<\/td><\/tr>\n<\/table>\n<p><b>Örnek: 2.000.000 TL sermayeli şirketin 700.000 TL'lik payı taahhüt edildi, 300.000 TL ödendi (kalan taahhüt 400.000 TL)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>242 İştirakler<\/td><td><\/td><td>700.000<\/td><\/tr><tr><td><\/td><td>243 İştiraklere Sermaye Taahhütleri<\/td><td>700.000<\/td><\/tr><tr><td>243 İştiraklere Sermaye Taahhütleri<\/td><td><\/td><td>300.000<\/td><\/tr><tr><td><\/td><td>102 Bankalar<\/td><td>300.000<\/td><\/tr><\/table><p><b>Daha önce 120.000 TL ayrılan karşılığın 50.000 TL'sinin yeterli olduğu anlaşıldı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>244 İştirakler Sermaye Payları Değer Düşüklüğü Karşılığı<\/td><td><\/td><td>70.000<\/td><\/tr><tr><td><\/td><td>644 Konusu Kalmayan Karşılıklar<\/td><td>70.000<\/td><\/tr><\/table>\n<ul>\n<li>İştirakteki pay %10'un altına düşerse 240 / 242; bağlı ortaklıktaki pay %50'nin altına düşerse 242 / 245 kaydı yapılır.<\/li>\n<\/ul>\n\n<h3>25–27 Maddi, maddi olmayan ve özel tükenmeye tabi varlıklar<\/h3>\n<table>\n<tr><th>Grup<\/th><th>Hesaplar<\/th><\/tr>\n<tr><td>25 Maddi Duran Varlıklar<\/td><td>250 Arazi ve Arsalar, 251 Yeraltı ve Yerüstü Düzenleri (yol, köprü, tünel, iskele vb.), 252 Binalar, 253 Tesis, Makine ve Cihazlar (konveyör, forklift dahil), 254 Taşıtlar, 255 Demirbaşlar, 256 Diğer MDV, 257 Birikmiş Amortismanlar (−), 258 Yapılmakta Olan Yatırımlar, 259 Verilen Avanslar<\/td><\/tr>\n<tr><td>26 Maddi Olmayan Duran Varlıklar<\/td><td>260 Haklar, 261 Şerefiye, 262 Kuruluş ve Örgütlenme Giderleri, 263 Araştırma ve Geliştirme Giderleri, 264 Özel Maliyetler, 267 Diğer MODV, 268 Birikmiş Amortismanlar (−), 269 Verilen Avanslar<\/td><\/tr>\n<tr><td>27 Özel Tükenmeye Tabi Varlıklar<\/td><td>271 Arama Giderleri, 272 Hazırlık ve Geliştirme Giderleri, 277 Diğer ÖTTV, 278 Birikmiş Tükenme Payları (−), 279 Verilen Avanslar<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Maddi olmayan varlık<\/th><th>Kapsam<\/th><th>İtfa<\/th><\/tr>\n<tr><td>260 Haklar<\/td><td>İmtiyaz, patent, lisans, ticari marka, unvan; kamu otoritesinin tanıdığı kullanma yetkileri<\/td><td>Yararlanma süresinde; süre belli değilse <b>5 yılda eşit<\/b><\/td><\/tr>\n<tr><td>261 Şerefiye<\/td><td>Devralınan işletmenin maliyeti ile rayiç bedelli net varlıkları arasındaki <b>olumlu fark<\/b>; rayiç bedel yoksa net defter değeri esas alınır. Muhasebeleştirilmesi için <b>bedelinin ödenmiş olması<\/b> gerekir.<\/td><td><b>5 yılda eşit<\/b><\/td><\/tr>\n<tr><td>262 Kuruluş ve Örgütlenme Giderleri<\/td><td>Kuruluş, yeni şube, genişleme için yapılan ve karşılığında maddi değer elde edilmeyen giderler (noter, harç vb.); fiili harcamadan fazla olamaz<\/td><td>Genelde <b>5 yılda eşit<\/b><\/td><\/tr>\n<tr><td>263 Ar-Ge Giderleri<\/td><td>Aktifleştirilen araştırma ve geliştirme harcamaları<\/td><td><b>5 yılda eşit<\/b><\/td><\/tr>\n<tr><td>264 Özel Maliyetler<\/td><td>Kiralanan gayrimenkulü geliştirmek veya değerini sürekli artırmak için yapılan ve kira sonunda mal sahibine kalacak harcamalar (normal bakım, onarım, temizlik hariç)<\/td><td>Kira süresince; kira süresi <b>5 yıldan uzunsa 5 yılda<\/b>. Kira bitmeden boşaltılırsa kalan tutar o yıl bir defada gider<\/td><\/tr>\n<\/table>\n<ul>\n<li>271 Arama giderlerinde üretilebilir cevher rezervi saptanamazsa giderler <b>zarar<\/b> yazılır. Özel tükenmeye tabi varlıklar (maden, petrol kuyusu, taş ocağı) \"tükenme payı\" ile itfa edilir (278).<\/li>\n<\/ul>\n\n<h3>Duran varlıkların maliyeti ve kayda alınma zamanı<\/h3>\n<ul>\n<li>Esas <b>alış maliyetidir<\/b>; maliyet yoksa inşa veya üretim maliyeti. Kendi imal ettiği makine imal maliyetiyle, kendi inşa ettiği bina ve gemi inşaat maliyetiyle kaydedilir.<\/li>\n<li>Vergi mevzuatı <b>noter, mahkeme, değer takdiri, komisyon ve tellaliye giderleri ile emlak ve taşıt alım vergilerini<\/b> maliyete eklemekte veya genel gider yazmakta işletmeyi <b>serbest<\/b> bırakır.<\/li>\n<li><b>Gümrük vergisi, taşıma, montaj<\/b> ve varlığı kullanılabilir hale getiren tüm giderler ise <b>maliyet unsurudur<\/b>.<\/li>\n<li>Kayda alınma tarihi: varlığın amaçlanan kullanıma <b>hazır hale gelip fiilen kullanılmaya başlandığı<\/b> an. Teslim alındığında kullanıma hazır değilse harcamalar 258 Yapılmakta Olan Yatırımlar veya diğer duran varlıklarda bekletilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Varlık<\/th><th>Maliyet ve özel kurallar<\/th><\/tr>\n<tr><td>Arazi ve arsalar<\/td><td>Arazi: tarıma ayrılan veya parsellenebilir geniş toprak; arsa: belediye sınırında, inşaata elverişli parsel. Amortisman <b>ayrılmaz<\/b>. Arsa ve bina ayrı hesaplarda izlenir. Arsa işe yaramayan bir binayla alınırsa bina bedeli, yıkım ve enkaz kaldırma giderleri <b>arsa maliyetine<\/b> eklenir; enkaz satış geliri maliyetten düşülür.<\/td><\/tr>\n<tr><td>Yeraltı ve yerüstü düzenleri<\/td><td>İnşaat maliyetiyle; tamamlanana kadar 258'de, bitince 251'e aktarılır.<\/td><\/tr>\n<tr><td>Makineler<\/td><td>Alış fiyatı + gümrük vergisi + taşıma sırasındaki sigorta + taşıma + montaj.<\/td><\/tr>\n<tr><td>Taşıtlar<\/td><td>Alış fiyatı + gümrük + taşıma. <b>Binek otolarında KDV'nin indirimi öngörülmemiştir.<\/b><\/td><\/tr>\n<tr><td>Demirbaşlar<\/td><td>Alış fiyatı + özel giderler (komisyon, taşıma); kendi imalinde imal maliyeti.<\/td><\/tr>\n<\/table>\n<p><b>Örnek: Fabrika arsası üzerindeki eski binayla 500.000 TL'ye alındı, yıkım 60.000 TL, enkaz 25.000 TL'ye satıldı (KDV %18); arsa maliyeti 535.000 TL<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>250 Arazi ve Arsalar<\/td><td><\/td><td>500.000<\/td><\/tr><tr><td>191 İndirilecek KDV<\/td><td><\/td><td>90.000<\/td><\/tr><tr><td><\/td><td>100 Kasa<\/td><td>590.000<\/td><\/tr><tr><td>250 Arazi ve Arsalar<\/td><td><\/td><td>60.000<\/td><\/tr><tr><td>191 İndirilecek KDV<\/td><td><\/td><td>10.800<\/td><\/tr><tr><td><\/td><td>100 Kasa<\/td><td>70.800<\/td><\/tr><tr><td>100 Kasa<\/td><td><\/td><td>29.500<\/td><\/tr><tr><td><\/td><td>250 Arazi ve Arsalar<\/td><td>25.000<\/td><\/tr><tr><td><\/td><td>391 Hesaplanan KDV<\/td><td>4.500<\/td><\/tr><\/table>\n<h3>Amortisman<\/h3>\n<ul>\n<li>Amortisman; kullanma, eskime, yıpranma ve demode olma nedeniyle oluşan değer azalışıdır. Amortismana tabi tutarın hizmet süresine <b>sistemli dağıtımıdır<\/b>; bir <b>tahsis<\/b> işlemidir.<\/li>\n<li>Amortisman bir <b>değerleme yöntemi değildir<\/b>; parayla ilgisi yoktur, ayrılması aynı tutarda <b>fon ayrılması anlamına gelmez<\/b>.<\/li>\n<li>Duran varlıklar maliyetle izlenir; piyasa dalgalanmaları dikkate alınmaz, çünkü değer kullanım niteliğine dayanır.<\/li>\n<li><b>Boş arazi ve arsalar<\/b> için amortisman ayrılmaz; vergi mevzuatına göre <b>meyve bahçeleri ve bağlar<\/b> gibi tarım tesisleri için ayrılır. Sınırsız ömürlü maddi olmayan varlıklar itfa edilmez.<\/li>\n<li>Toplam amortismanı belirleyen üç unsur: <b>amortisman matrahı<\/b> (elde etme maliyeti), <b>kalıntı (hurda) değer<\/b> (çok küçük veya tahmini zorsa dikkate alınmaz), <b>tahmini hizmet süresi<\/b> (yıl veya ay; faaliyet dönemi veya çalışma saati; üretim birimi).<\/li>\n<\/ul>\n<table>\n<tr><th>Yöntem<\/th><th>Hesap<\/th><th>Kurallar<\/th><\/tr>\n<tr><td><b>Eşit tutarlar<\/b> (normal, sabit yüzdeli)<\/td><td>A = (M − H) / n; oran a = A / (M − H) veya 1 / faydalı ömür<\/td><td>En basit yöntem; her yıl aynı tutar.<\/td><\/tr>\n<tr><td><b>Azalan bakiyeler<\/b><\/td><td>Normal oranın <b>iki katı<\/b>, her yıl itfa edilmemiş değere (net defter değeri) uygulanır<\/td><td>İlk yıllarda yüksek amortisman (yeni varlık daha verimli, hızlı demode olma, son yıllarda artan bakım giderleriyle denge). VUK: oran <b>%50'yi geçemez<\/b>; son yıla devreden bakiye o yıl tamamen yok edilir.<\/td><\/tr>\n<\/table>\n<p><b>Eşit tutarlar örneği:<\/b> maliyet 330.000 TL, hurda değer 30.000 TL, ömür 4 yıl → yıllık amortisman (330.000 − 30.000) / 4 = 75.000 TL, oran %25; 4. yıl sonunda kalan değer hurda değere (30.000 TL) eşit olur.<\/p>\n<p><b>Azalan bakiyeler örneği (VUK):<\/b> maliyet 250.000 TL, ömür 4 yıl → normal oran %25, azalan oran %50.<\/p>\n<table>\n<tr><th>Yıl<\/th><th>Amortisman<\/th><th>Birikmiş<\/th><th>Kalan değer<\/th><\/tr>\n<tr><td>1<\/td><td>125.000<\/td><td>125.000<\/td><td>125.000<\/td><\/tr>\n<tr><td>2<\/td><td>62.500<\/td><td>187.500<\/td><td>62.500<\/td><\/tr>\n<tr><td>3<\/td><td>31.250<\/td><td>218.750<\/td><td>31.250<\/td><\/tr>\n<tr><td>4<\/td><td>31.250 (kalan bakiyenin tamamı)<\/td><td>250.000<\/td><td>0<\/td><\/tr>\n<\/table>\n<h4>Vergi mevzuatındaki amortisman kuralları<\/h4>\n<ul>\n<li>Amortisman vergi mevzuatındaki süre ve oranlarla ayrılır; işletme bu oranları aşmamak koşuluyla oran seçebilir ama <b>uygulamaya başladığı oranı izleyen yıllarda değiştiremez<\/b>.<\/li>\n<li>Süre varlığın <b>aktife girdiği yıldan<\/b> başlar; yıl sayısı = <b>1 / oran<\/b>. Bir yıl hiç veya eksik ayrılan amortisman nedeniyle süre uzatılamaz.<\/li>\n<li><b>Eşit tutarlardan azalan bakiyelere geçilemez<\/b>; azalan bakiyelerden eşit tutarlara istenildiği zaman geçilebilir.<\/li>\n<li>Aktife girdiği tarih ne olursa olsun yıllık amortisman <b>tam ayrılır<\/b>. Tek istisna <b>binek otomobilleri<\/b>: aktife girdiği yıl için ay kesri tam ay sayılarak <b>kıst (aylık)<\/b> amortisman ayrılır; ayrılmayan kısım son yılda yok edilir. Çıktığı yıldan itibaren amortisman ayrılmaz.<\/li>\n<li><b>Fevkalade ekonomik ve teknik amortisman nispetleri:<\/b> doğal afet, yeni icat veya zorunlu çalışma nedeniyle değer kaybında istem üzerine <b>Hazine ve Maliye Bakanlığı<\/b> belirler.<\/li>\n<\/ul>\n<h4>Amortisman kayıt yöntemleri<\/h4>\n<p><b>Direkt yöntem (doğrudan varlık hesabından düşme)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>770 Genel Yönetim Giderleri (amortisman giderleri)<\/td><td><\/td><td>45.000<\/td><\/tr><tr><td><\/td><td>252 Binalar<\/td><td>45.000<\/td><\/tr><\/table><p><b>Endirekt (dolaylı) yöntem<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>770 Genel Yönetim Giderleri (amortisman giderleri)<\/td><td><\/td><td>40.000<\/td><\/tr><tr><td><\/td><td>257 Birikmiş Amortismanlar<\/td><td>40.000<\/td><\/tr><\/table>\n<ul>\n<li>Direkt yöntem VUK'a uygundur ama iki sakıncası vardır: varlığın <b>elde etme maliyeti kaybolur<\/b> ve ayrılan amortismanlar görünmediği için tahminlerin isabeti değerlendirilemez.<\/li>\n<li>Endirekt yöntemde maliyet varlık hesabında kalır; VUK birikmiş amortismanların bilançonun pasifinde veya aktifinde yer alabileceğini belirtir. Tamamen itfa edilen varlık 257 borç, varlık hesabı alacak kaydıyla kapatılır.<\/li>\n<li><b>Hasılat harcamaları<\/b> (normal bakım, tamir, temizlik) gider yazılır. <b>Sermaye harcamaları<\/b> (genişletme veya değeri sürekli artırma) maliyete eklenir ve yeni hizmet süresine göre amortisman yeniden hesaplanır.<\/li>\n<\/ul>\n\n<h3>Maddi duran varlıkların satışı<\/h3>\n<ul>\n<li>Defter değeri = maliyet − birikmiş amortisman. Satış bedeli defter değerine eşitse kâr veya zarar oluşmaz; küçükse zarar, büyükse kâr oluşur. Kitap örneklerinde satış zararı 659 Diğer Olağan Gider ve Zararlar, satış kârı 649 Diğer Olağan Gelir ve Kârlar hesabına yazılmıştır (hesap planı açıklamaları MDV satış kârını 679, zararını 689 kapsamında da sayar).<\/li>\n<\/ul>\n<p><b>Örnek (endirekt yöntem): maliyeti 900.000 TL, birikmiş amortismanı 540.000 TL olan bina 300.000 TL'ye peşin satıldı (KDV %18)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>100 Kasa<\/td><td><\/td><td>354.000<\/td><\/tr><tr><td>257 Birikmiş Amortismanlar<\/td><td><\/td><td>540.000<\/td><\/tr><tr><td>659 Diğer Olağan Gider ve Zararlar (MDV satış zararı)<\/td><td><\/td><td>60.000<\/td><\/tr><tr><td><\/td><td>252 Binalar<\/td><td>900.000<\/td><\/tr><tr><td><\/td><td>391 Hesaplanan KDV<\/td><td>54.000<\/td><\/tr><\/table>\n<h4>Yenileme fonu (549 Özel Fonlar)<\/h4>\n<ul>\n<li>Satılan varlık yerine yenisi alınacaksa satış kârı pasifte geçici bir hesapta (<b>549 Özel Fonlar – MDV Yenileme Fonu<\/b>) <b>üç yıl<\/b> tutulabilir. Bu sürede kullanılmayan kâr <b>üçüncü yılın vergi matrahına<\/b> eklenir; fon kâra devredilerek kapatılırken kitap örneğinde 671'e alınmıştır.<\/li>\n<li>Yeni varlık alındığında ayrılan amortismanlar önce fondan mahsup edilir; fon tükenince amortisman gider yazılır.<\/li>\n<li>Örnek: 120.000 TL fon, yeni varlık 400.000 TL, 5 yıl ömür → yıllık amortisman 80.000 TL. 1. yıl: 80.000 TL fondan (gider 0); 2. yıl: 40.000 TL fondan, 40.000 TL gider; sonraki yıllar tamamen gider.<\/li>\n<\/ul>\n<h4>Sigorta tazminatı<\/h4>\n<ul>\n<li>MDV'ler genelde defter değerinin altında olmamak üzere sigortalanır. Tazminat ile defter değeri farkı kâr veya zarar yazılır; yenileme kararı varsa tazminat fazlası pasifte geçici hesapta en fazla <b>üç yıl<\/b> tutulabilir, kullanılmazsa kâra eklenir.<\/li>\n<\/ul>\n<p><b>Örnek: maliyeti 700.000 TL, birikmiş amortismanı 420.000 TL olan bina yandı; 350.000 TL tazminat tahakkuk etti, yenileme kararı alındı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>127 Diğer Ticari Alacaklar<\/td><td><\/td><td>350.000<\/td><\/tr><tr><td>257 Birikmiş Amortismanlar<\/td><td><\/td><td>420.000<\/td><\/tr><tr><td><\/td><td>252 Binalar<\/td><td>700.000<\/td><\/tr><tr><td><\/td><td>679 Diğer Olağandışı Gelir ve Kârlar (MDV sigorta tazminatı)<\/td><td>70.000<\/td><\/tr><tr><td>679 Diğer Olağandışı Gelir ve Kârlar<\/td><td><\/td><td>70.000<\/td><\/tr><tr><td><\/td><td>549 Özel Fonlar (MDV yenileme fonu)<\/td><td>70.000<\/td><\/tr><\/table>\n<h3>28–29 Diğer duran varlık grupları<\/h3>\n<ul>\n<li><b>280 Gelecek Yıllara Ait Giderler<\/b> (peşin ödenen, sonraki yıllara ait giderler; ilgili yılda 180'e aktarılır), <b>281 Gelir Tahakkukları<\/b> (döneme ait, tahsili bir yıldan sonra olacak gelirler).<\/li>\n<li><b>291 Gelecek Yıllarda İndirilecek KDV<\/b> (amortismana tabi kıymetlerle ilgili, bir yıldan uzun sürede indirilecek KDV; indirileceği dönemde 191'e aktarılır), <b>292 Diğer KDV<\/b>, <b>293 Gelecek Yıllar İhtiyacı Stoklar<\/b> (bir yıllık ihtiyacı aşan stoklar), <b>294 Elden Çıkarılacak Stoklar ve MDV<\/b>, <b>295 Peşin Ödenen Vergiler ve Fonlar<\/b> (izleyen yıldan sonra mahsup edilecek; süresi bir yılın altına inince 193'e), <b>297<\/b>, <b>298 Stok Değer Düşüklüğü Karşılığı (−)<\/b>, <b>299 Birikmiş Amortismanlar (−)<\/b>.<\/li>\n<\/ul>\n<ul>\n<li>Dikkat: İştirak eşiği %10 ile %50 arası, bağlı ortaklık %50'nin üstüdür; %10'un altı bağlı menkul kıymettir. Belirlemede oy veya yönetime katılma hakkı esastır, sermaye payı değil.<\/li>\n<li>Dikkat: Haklar, şerefiye, kuruluş giderleri ve Ar-Ge için tipik süre 5 yıldır; özel maliyette süre kira süresidir, ancak 5 yılı aşamaz.<\/li>\n<\/ul>", "sorular": [{"q": "Maliyeti 500.000 TL, hurda değeri 50.000 TL, hizmet süresi 5 yıl olan makine için eşit tutarlar yöntemine göre yıllık amortisman ve amortisman oranı nedir?", "o": ["100.000 TL ve %20", "90.000 TL ve %20", "90.000 TL ve %18", "110.000 TL ve %22", "100.000 TL ve %25"], "a": 1, "e": "A = (500.000 − 50.000) / 5 = 90.000 TL; oran 90.000 / 450.000 = %20."}, {"q": "Maliyeti 400.000 TL, hizmet süresi 5 yıl olan makine için muhasebe kuramına göre azalan bakiyeler yöntemiyle 2. yıl ayrılacak amortisman kaç TL'dir?", "o": ["160.000 TL", "80.000 TL", "64.000 TL", "96.000 TL", "128.000 TL"], "a": 3, "e": "Normal oran %20, azalan bakiyeler oranı %40. 1. yıl 400.000 × %40 = 160.000; kalan 240.000 × %40 = 96.000 TL."}, {"q": "Faydalı ömrü 3 yıl olan bir makine için VUK'a göre azalan bakiyeler yönteminde uygulanabilecek en yüksek amortisman oranı yüzde kaçtır?", "o": ["%50", "%66,67", "%33,33", "%40", "%100"], "a": 0, "e": "Normal oran 1/3 = %33,33; iki katı %66,67 olur ama VUK'a göre azalan bakiyeler oranı %50'yi geçemez."}, {"q": "İşletme fabrika kuracağı arsayı üzerindeki kullanılmaz binayla birlikte 500.000 TL'ye almış, binanın yıkımı için 60.000 TL ödemiş ve enkazı 25.000 TL'ye satmıştır. Arsanın maliyeti kaç TL'dir?", "o": ["500.000 TL", "560.000 TL", "535.000 TL", "585.000 TL", "475.000 TL"], "a": 2, "e": "Bina bedeli ve yıkım gideri arsa maliyetine eklenir, enkaz geliri düşülür: 500.000 + 60.000 − 25.000 = 535.000 TL."}, {"q": "Bir makine 300.000 TL'ye alınmış; 20.000 TL gümrük vergisi, 5.000 TL taşıma sigortası ve 15.000 TL montaj gideri ödenmiştir. Makinenin maliyet bedeli kaç TL'dir?", "o": ["300.000 TL", "320.000 TL", "340.000 TL", "335.000 TL", "325.000 TL"], "a": 2, "e": "Makinenin alış maliyeti alış fiyatı, gümrük vergisi, taşıma sigortası, taşıma ve montaj giderlerinden oluşur: 340.000 TL."}, {"q": "Maliyeti 900.000 TL, birikmiş amortismanı 540.000 TL olan bina 300.000 TL'ye satılmıştır. Satış sonucu nedir?", "o": ["60.000 TL kâr", "60.000 TL zarar", "240.000 TL kâr", "600.000 TL zarar", "Kâr veya zarar oluşmaz"], "a": 1, "e": "Defter değeri 900.000 − 540.000 = 360.000 TL; satış bedeli 300.000 TL olduğundan 60.000 TL zarar doğar."}, {"q": "MDV satışından doğan 120.000 TL kâr 549 Özel Fonlar hesabına alınmıştır. Yerine 400.000 TL'ye 5 yıl ömürlü yeni bir varlık alınmış, eşit tutarlar yöntemi uygulanmaktadır. 2. yıl gider yazılacak amortisman kaç TL'dir?", "o": ["80.000 TL", "0 TL", "120.000 TL", "40.000 TL", "56.000 TL"], "a": 3, "e": "Yıllık amortisman 80.000 TL. 1. yıl tamamı fondan karşılanır (fonda 40.000 TL kalır). 2. yıl 40.000 TL fondan, 40.000 TL gider yazılır."}, {"q": "Maliyeti 700.000 TL, birikmiş amortismanı 420.000 TL olan sigortalı bina yanmış, 350.000 TL tazminat tahakkuk etmiştir. Tazminat ile defter değeri arasındaki fark ne kadardır ve yenileme kararı alınırsa nereye aktarılabilir?", "o": ["70.000 TL kâr; 570 Geçmiş Yıllar Kârları hesabına", "70.000 TL kâr; 549 Özel Fonlar hesabına en fazla üç yıl için", "350.000 TL kâr; 549 Özel Fonlar hesabına", "70.000 TL zarar; 689 hesabına", "280.000 TL kâr; 542 Olağanüstü Yedekler hesabına"], "a": 1, "e": "Defter değeri 280.000 TL; tazminat fazlası 70.000 TL'dir. Yenileme kararı varsa bu tutar pasifte 549 hesabında en fazla üç yıl tutulabilir."}, {"q": "Bir işletmeyi devralan şirket 750.000 TL şerefiye bedeli ödemiştir. Şerefiye için yıllık ayrılacak amortisman kaç TL'dir?", "o": ["75.000 TL", "250.000 TL", "150.000 TL", "187.500 TL", "Şerefiye itfa edilmez"], "a": 2, "e": "Şerefiye amortisman yoluyla 5 yılda eşit taksitlerle yok edilir: 750.000 / 5 = 150.000 TL."}, {"q": "İşletme 8 yıllığına kiraladığı binada 400.000 TL özel maliyet harcaması yapmıştır. Yıllık itfa tutarı kaç TL'dir?", "o": ["50.000 TL", "40.000 TL", "100.000 TL", "400.000 TL", "80.000 TL"], "a": 4, "e": "Özel maliyetler kira süresince itfa edilir; kira süresi 5 yıldan fazlaysa 5 yılda eşit itfa edilir: 400.000 / 5 = 80.000 TL."}, {"q": "İşletme bir şirketin 700.000 TL'lik payını iştirak olarak almayı taahhüt etmiş, 300.000 TL'sini ödemiştir. 243 İştiraklere Sermaye Taahhütleri hesabının kalanı nedir?", "o": ["400.000 TL alacak kalanı", "400.000 TL borç kalanı", "700.000 TL alacak kalanı", "300.000 TL alacak kalanı", "Hesap kapanmıştır"], "a": 0, "e": "Taahhütte 242 borç, 243 alacak 700.000 TL; ödemede 243 borç 300.000 TL. Kalan 400.000 TL alacak kalanıdır ve ödenmemiş taahhüdü gösterir."}, {"q": "İştirak payları için daha önce 120.000 TL değer düşüklüğü karşılığı ayrılmıştır. Borsa değeri arttığından 50.000 TL karşılığın yeterli olduğu anlaşılmıştır. Yapılacak kayıt hangisidir?", "o": ["654 borç, 244 alacak 70.000 TL", "244 borç, 644 alacak 50.000 TL", "244 borç, 671 alacak 70.000 TL", "244 borç, 644 Konusu Kalmayan Karşılıklar alacak 70.000 TL", "242 borç, 244 alacak 70.000 TL"], "a": 3, "e": "Fazla kalan 120.000 − 50.000 = 70.000 TL karşılık iptal edilir: 244 borç, 644 alacak."}, {"q": "Bir şirketteki oy hakkı %8 olan ve uzun vadede elde tutulacak hisse senetleri hangi hesapta izlenir?", "o": ["240 Bağlı Menkul Kıymetler", "242 İştirakler", "245 Bağlı Ortaklıklar", "110 Hisse Senetleri", "248 Diğer Mali Duran Varlıklar"], "a": 0, "e": "Oy veya yönetime katılma hakkı %10'un altında olan ve uzun vadede tutulacak hisseler 240 hesabında izlenir; %10–%50 iştirak, %50'nin üstü bağlı ortaklıktır."}, {"q": "Bağlı ortaklık niteliğinin belirlenmesinde Tekdüzen sistemin esas aldığı ölçüt hangisidir?", "o": ["Sermaye payının büyüklüğü", "Kâr payı oranı", "Borsa değeri", "Hisse senedi sayısı", "Yönetim çoğunluğunu seçme hakkı"], "a": 4, "e": "245 hesabında %50'den fazla sermaye veya oy hakkı ya da yönetim çoğunluğunu seçme hakkı sayılır; belirlemede yönetim çoğunluğunu seçme hakkı esas alınır."}, {"q": "Amortismanın direkt yöntemle kaydında aşağıdakilerden hangisi doğrudur?", "o": ["Amortisman gider hesabına borç, 257 Birikmiş Amortismanlar hesabına alacak yazılır", "Duran varlık hesabına borç, gider hesabına alacak yazılır", "Amortisman 549 Özel Fonlar hesabına alacak yazılır", "Amortisman yalnızca nazım hesaplarda izlenir", "Amortisman gider hesabına borç, ilgili duran varlık hesabına alacak yazılır"], "a": 4, "e": "Direkt yöntemde amortisman doğrudan varlık hesabından düşülür; bu nedenle elde etme maliyeti kaybolur. 257 kullanılması endirekt yöntemdir."}, {"q": "Duran varlıklarla ilgili yapılan aşağıdaki harcamalardan hangisi hasılat harcaması olarak gider yazılır?", "o": ["Binaya yeni bir kat eklenmesi", "Makinenin normal bakım ve temizlik gideri", "Makinenin kapasitesini kalıcı olarak artıran revizyon", "Satın alınan makinenin montaj gideri", "İthal makinenin gümrük vergisi"], "a": 1, "e": "Normal bakım, tamir ve temizlik hasılat harcamasıdır ve gider yazılır. Genişletme veya değeri sürekli artıran harcamalar sermaye harcamasıdır; montaj ve gümrük maliyet unsurudur."}, {"q": "Bir hakkın yararlanma süresi belli değilse Tekdüzen hesap planı açıklamalarına göre nasıl itfa edilir?", "o": ["10 yılda eşit taksitlerle", "Hiç itfa edilmez", "Azalan bakiyeler yöntemiyle 4 yılda", "5 yılda eşit taksitlerle", "Satıldığı yıl bir defada"], "a": 3, "e": "260 Haklar yararlanma süresince, süre belli değilse 5 yıllık sürede eşit taksitlerle itfa edilir."}, {"q": "Aşağıdakilerden hangisi için amortisman ayrılmaz?", "o": ["Boş arsa", "Meyve bahçesi", "Bağ", "Demirbaş", "Yeraltı ve yerüstü düzenleri"], "a": 0, "e": "Boş arazi ve arsalar için amortisman ayrılmaz; vergi mevzuatına göre meyve bahçeleri ve bağlar gibi tarım tesisleri için ayrılır."}, {"q": "Vergi mevzuatında aktife girdiği yıl için kıst (aylık) amortisman ayrılması öngörülen varlık hangisidir?", "o": ["Binalar", "Makineler", "Binek otomobilleri", "Demirbaşlar", "Kamyonlar"], "a": 2, "e": "Kitaba göre ülkemizde yalnız binek otomobilleri için aktife girdiği yılda ay kesri tam ay sayılarak kıst amortisman ayrılır; diğerlerinde yıllık amortisman tam ayrılır."}, {"q": "Amortisman yöntemleri arasında geçişle ilgili hangisi doğrudur?", "o": ["Eşit tutarlar yöntemini uygulayan işletme istediği zaman azalan bakiyelere geçebilir", "Yöntem değişikliği her iki yönde serbesttir", "Azalan bakiyeler yöntemini uygulayan işletme istediği zaman eşit tutarlar yöntemine geçebilir", "Yöntem hiçbir koşulda değiştirilemez", "Yöntem değişikliği için Hazine ve Maliye Bakanlığı izni gerekir"], "a": 2, "e": "Eşit tutarlarla amortisman ayırmaya başlayan işletme yöntemi değiştiremez; azalan bakiyeleri uygulayan ise istediği zaman eşit tutarlara geçebilir."}, {"q": "Satın alınan bir makine teslim alındığında henüz kullanılabilir durumda değildir. Kurulum tamamlanana kadar yapılan harcamalar hangi hesapta izlenir?", "o": ["253 Tesis, Makine ve Cihazlar", "258 Yapılmakta Olan Yatırımlar", "770 Genel Yönetim Giderleri", "180 Gelecek Aylara Ait Giderler", "159 Verilen Sipariş Avansları"], "a": 1, "e": "Duran varlık kullanılabilir hale gelip fiilen kullanılmaya başlandığında kayda alınır; o zamana kadar harcamalar 258'de bekletilir."}, {"q": "Vergi mevzuatına göre aşağıdaki giderlerden hangisini maddi duran varlığın maliyetine eklemek veya doğrudan gider yazmak işletmenin seçimine bırakılmıştır?", "o": ["Gümrük vergisi", "Taşıma gideri", "Montaj gideri", "Noter ve tellaliye giderleri", "Varlığı kullanılır hale getiren deneme giderleri"], "a": 3, "e": "Noter, mahkeme, değer takdiri, komisyon ve tellaliye giderleri ile emlak ve taşıt alım vergilerinde işletme serbesttir; gümrük, taşıma, montaj ve kullanıma hazırlama giderleri maliyet unsurudur."}, {"q": "Maden arama faaliyetleri sonucunda üretilebilir cevher rezervi saptanamamıştır. 271 Arama Giderleri hesabında biriken tutar nasıl işlem görür?", "o": ["5 yılda itfa edilir", "Zarar kaydedilir", "Tükenme payıyla itfa edilir", "Maddi duran varlık maliyetine eklenir", "Gelecek yıllara ait gider olarak bekletilir"], "a": 1, "e": "Hesap planı açıklamasına göre arama sonucunda rezerv bulunamazsa yapılan giderler zarar yazılır."}, {"q": "Amortismana tabi kıymetlerle ilgili olup bir yıldan uzun sürede indirilebilecek KDV hangi hesapta izlenir?", "o": ["191 İndirilecek KDV", "190 Devreden KDV", "291 Gelecek Yıllarda İndirilecek KDV", "295 Peşin Ödenen Vergiler ve Fonlar", "392 Diğer KDV"], "a": 2, "e": "Bu KDV 291'de izlenir; indirilebileceği dönemlere isabet eden tutarlar bilanço dönemi sonunda 191'e aktarılır."}, {"q": "İşletme bir varlık için %12,5 normal amortisman oranı uygulamaktadır. VUK'a göre amortisman süresi kaç yıldır?", "o": ["12,5 yıl", "4 yıl", "10 yıl", "6 yıl", "8 yıl"], "a": 4, "e": "Amortisman süresinin yıl olarak hesabı için 1 sayısı uygulanan orana bölünür: 1 / 0,125 = 8 yıl."}]}, {"id": 6, "kisa": "Yabancı Kaynaklar", "baslik": "Kısa ve Uzun Vadeli Yabancı Kaynaklar: Mali, Ticari ve Diğer Borçlar, Vergi Yükümlülükleri, Karşılıklar, Tahakkuklar", "ozet": "Banka kredileri ve faiz tahakkuku, çıkarılmış menkul kıymetler, ticari borçlar ve reeskont, bordro, vergi ve SGK yükümlülükleri, borç ve gider karşılıkları, uzun vadeli kaynaklara aktarım.", "notlar": "<h3>Kısa vadeli yabancı kaynaklar (3)<\/h3>\n<p>Bir yıl veya normal faaliyet dönemi içinde ödenecek borçlar (dönen–duran ayrımıyla uyumlu; TMS 1 de bu ayrımı kabul eder). Gruplar: <b>30<\/b> Mali Borçlar, <b>32<\/b> Ticari Borçlar, <b>33<\/b> Diğer Borçlar, <b>34<\/b> Alınan Avanslar, <b>35<\/b> Yıllara Yaygın İnşaat ve Onarım Hakedişleri, <b>36<\/b> Ödenecek Vergi ve Diğer Yükümlülükler, <b>37<\/b> Borç ve Gider Karşılıkları, <b>38<\/b> Gelecek Aylara Ait Gelirler ve Gider Tahakkukları, <b>39<\/b> Diğer Kısa Vadeli Yabancı Kaynaklar.<\/p>\n\n<h3>30 Mali borçlar<\/h3>\n<table>\n<tr><th>Hesap<\/th><th>Kapsam<\/th><\/tr>\n<tr><td>300 Banka Kredileri<\/td><td>Banka ve finans kuruluşlarından kısa vadeli nakdi krediler<\/td><\/tr>\n<tr><td>301 / 302<\/td><td>Finansal kiralama işlemlerinden borçlar (vadesi 1 yılı geçmeyen) / Ertelenmiş finansal kiralama borçlanma maliyetleri (−)<\/td><\/tr>\n<tr><td>303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri<\/td><td>Uzun vadeli kredilerin bilanço tarihinden itibaren bir yıl içinde ödenecek taksit, anapara ve faizleri<\/td><\/tr>\n<tr><td>304 Tahvil Anapara Borç Taksit ve Faizleri<\/td><td>Tahvillerin bir yıl içinde ödenecek taksit ve faizleri<\/td><\/tr>\n<tr><td>305 Çıkarılmış Bonolar ve Senetler<\/td><td>Finansman bonosu, banka garantili bono, varlığa dayalı menkul kıymet gibi kısa vadeli araçlar; nominal bedelle alacak<\/td><\/tr>\n<tr><td>306 Çıkarılmış Diğer Menkul Kıymetler<\/td><td>Kâr-zarar ortaklığı belgesi ve diğer çeşitli menkul kıymetler<\/td><\/tr>\n<tr><td>308 Menkul Kıymetler İhraç Farkları (−)<\/td><td>İskontolu ihraçta nominal değer ile satış fiyatı farkının gelecek döneme ait kısmı; <b>aktif karakterli<\/b> olup pasifte eksi değerle yer alır (mali borçların net tutarı görünsün diye)<\/td><\/tr>\n<tr><td>309 Diğer Mali Borçlar<\/td><td>Yukarıdakilere girmeyen mali borçlar<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>300 alacaklanır:<\/b> kredinin nakden veya hesaben çekilmesi, faiz ve komisyonun anaparaya eklenmesi, yabancı paralı kredinin değerlemesinde TL karşılığının artması. <b>Borçlanır:<\/b> ödeme, teminatın nakde çevrilerek bankanın tahsili, avans kredinin vadede ödenmesi, cari hesap kredinin kapatılması, değerlemede TL karşılığının azalması.<\/li>\n<li>TL krediler kayıtlı değerle, yabancı paralı krediler değerleme günündeki kurla değerlenir. <b>Kredilerle ilgili kur farkı 656 Kambiyo Zararları'na değil 780 Finansman Giderleri'ne<\/b> yazılır.<\/li>\n<li>Avans şeklindeki kredide kredi tarihinden değerleme gününe kadar işleyen faiz <b>780 borç / 381 Gider Tahakkukları alacak<\/b>; ertesi yıl ödemede yalnız o yıla düşen faiz gider yazılır. Cari hesap şeklindeki kredide banka faizi hesaba eklerse 780 borç / 300 alacak.<\/li>\n<li>Faiz formülü (kitaptaki örnekler): <b>Faiz = Anapara × Gün × Oran / 36.500<\/b>.<\/li>\n<li>Mal rehni karşılığı kredide banka malın değerine marj uygular: kitap örneğinde 150.000 TL'lik mala %25 marjla 112.500 TL kredi verilmiştir. Teminat nazım hesaplarda veya yardımcı hesapta izlenir.<\/li>\n<\/ul>\n<p><b>Örnek: 1 Kasım'da 300.000 TL, %36 faizli, 3 ay vadeli kredi; 31 Aralık'ta 61 günlük faiz = 300.000 × 61 × 36 / 36.500<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>780 Finansman Giderleri<\/td><td><\/td><td>18.049,32<\/td><\/tr><tr><td><\/td><td>381 Gider Tahakkukları<\/td><td>18.049,32<\/td><\/tr><\/table><p><b>Örnek: 20.000 YP kredi 1,40 kurundan kaydedilmiş, dönem sonu kur 1,55<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>780 Finansman Giderleri<\/td><td><\/td><td>3.000<\/td><\/tr><tr><td><\/td><td>300 Banka Kredileri<\/td><td>3.000<\/td><\/tr><\/table>\n<ul>\n<li>Uzun vadeli kredinin ertesi yıl ödenecek taksiti dönem sonunda <b>400 borç / 303 alacak<\/b>; tahvilin bir yıl içinde ödenecek kısmı <b>405 borç / 304 alacak<\/b>.<\/li>\n<li>Tahvil faizi tahakkuk ettirilirken stopaj ayrılabilir: kitap örneğinde 2.500 TL faizin 2.125 TL'si 381'e, %15 stopaj 375 TL'si 360'a yazılmıştır.<\/li>\n<li>Primli ihraç edilen KZOB'da başabaş üstü fark <b>529 Diğer Sermaye Yedekleri<\/b>'ne alınır. Örnek: 50.000 TL nominal belge 54.000 TL'ye satılırsa 4.000 TL 529'a.<\/li>\n<\/ul>\n<p><b>Örnek: 1 Kasım'da 3 ay vadeli 200.000 TL nominal finansman bonosu 170.000 TL'ye satıldı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>102 Bankalar<\/td><td><\/td><td>170.000<\/td><\/tr><tr><td>308 Menkul Kıymetler İhraç Farkları<\/td><td><\/td><td>30.000<\/td><\/tr><tr><td><\/td><td>305 Çıkarılmış Bonolar ve Senetler<\/td><td>200.000<\/td><\/tr><\/table><p><b>31 Aralık: iki aylık itfa (bilançoda 305 200.000 − 308 10.000 = net 190.000 TL)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>780 Finansman Giderleri<\/td><td><\/td><td>20.000<\/td><\/tr><tr><td><\/td><td>308 Menkul Kıymetler İhraç Farkları<\/td><td>20.000<\/td><\/tr><\/table>\n<h3>32 Ticari borçlar<\/h3>\n<ul>\n<li>Ticari ilişkiden doğan senetli ve senetsiz borçlar. Ayırt edici unsur <b>borcun kime olduğu değil, ticari faaliyetten doğup doğmadığıdır<\/b>. Ticari olmayanlar 33 grubunda izlenir.<\/li>\n<li>Hesaplar: <b>320<\/b> Satıcılar (senetsiz), <b>321<\/b> Borç Senetleri (senetli; işletmenin keşide ettiği <b>vadeli çekler<\/b> de burada), <b>322<\/b> Borç Senetleri Reeskontu (−), <b>326<\/b> Alınan Depozito ve Teminatlar, <b>329<\/b> Diğer Ticari Borçlar.<\/li>\n<li>Ortaklar, ana kuruluş, iştirak ve bağlı ortaklıklara olan <b>ticari<\/b> borçlar da 320/321'de izlenir ve dipnotta gösterilir.<\/li>\n<li>Ana faaliyet dışı kredili alımlar (örneğin kırtasiyeci olmayan işletmenin kırtasiye alımı) 320'de değil <b>336 Diğer Çeşitli Borçlar<\/b>'da izlenir.<\/li>\n<li>320 alacaklanır: kredili alım, anlaşmaya göre satıcının ödediği giderler, cari hesaba yürütülen faiz, kur artışı. Borçlanır: ödeme, mal iadesi, satıcının iskontosu, kur azalışı.<\/li>\n<li>Dönem sonu: satıcılarla <b>mutabakat<\/b>; faiz tahakkukları (780 / 320); yabancı paralı borçlarda kur farkı (ticari borçta artış <b>656 Kambiyo Zararları<\/b>, azalış <b>646 Kambiyo Kârları<\/b>); <b>SPK'ya tabi şirketlerde 3 aydan uzun vadeli senetsiz borçlar reeskonta tabidir<\/b> (320 / 647; izleyen dönem başında 657 / 320).<\/li>\n<\/ul>\n<h4>Borç senetleri reeskontu<\/h4>\n<ul>\n<li>Vadesi gelecek döneme sarkan senetler için bilanço günü ile vade arasındaki süreye düşen faiz hesaplanır (tasarruf değeri). Oran: TL senetlerde <b>senette yazılı oran, yoksa TCMB resmi iskonto oranı<\/b>; yabancı paralı senetlerde senette oran yoksa LIBOR.<\/li>\n<li>İç iskonto formülü: <b>Reeskont = a × n × t / (36.500 + n × t)<\/b> (a: anapara, n: vadeye kalan gün, t: faiz oranı).<\/li>\n<li>Dönem sonu <b>322 borç / 647 Reeskont Faiz Gelirleri alacak<\/b>. Gelir hesabı 690'a kapatıldığından, izleyen dönem başında düzeltme <b>657 Reeskont Faiz Giderleri borç / 322 alacak<\/b> şeklinde yapılır.<\/li>\n<\/ul>\n<p><b>Örnek: 50.000 TL'lik senet, vadeye 20 gün, %45 → 50.000 × 20 × 45 / (36.500 + 900)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>322 Borç Senetleri Reeskontu<\/td><td><\/td><td>1.203,21<\/td><\/tr><tr><td><\/td><td>647 Reeskont Faiz Gelirleri<\/td><td>1.203,21<\/td><\/tr><\/table>\n<ul>\n<li><b>326 Alınan Depozito ve Teminatlar:<\/b> yalnız <b>nakit<\/b> alınanlar; menkul kıymet, senet, emtia veya teminat mektubu olarak alınanlar <b>nazım hesaplarda<\/b> izlenir. Yükümlülüğünü yerine getirmeyen yüklenicinin teminatı irat kaydedilirse 326 borç, <b>679<\/b> alacak.<\/li>\n<\/ul>\n\n<h3>33 Diğer borçlar ve personel bordrosu<\/h3>\n<ul>\n<li>Ticari nedene dayanmayan, en çok bir yıl içinde ödenecek borçlar: <b>331<\/b> Ortaklara, <b>332<\/b> İştiraklere, <b>333<\/b> Bağlı Ortaklıklara, <b>335<\/b> Personele Borçlar, <b>336<\/b> Diğer Çeşitli Borçlar, <b>337<\/b> Diğer Borç Senetleri Reeskontu (−).<\/li>\n<li>Şahıs işletmesinde işletme sahibine olan bu nitelikteki borçlar da 331'de izlenir. Genel kurulun dağıtım kararıyla iştirake düşen kâr payı: <b>570 borç / 332 alacak<\/b>.<\/li>\n<li>İşletmeden ayrılan personelin alacağı dönem sonunda 335'ten <b>336<\/b>'ya aktarılır. Seyahat giderinin avansı aştığı kısım personele ödenemezse 335'e alınır.<\/li>\n<\/ul>\n<p><b>Örnek bordro: net ücret 150.000; gelir vergisi 40.000; damga vergisi 2.000; SSK işçi payı 30.000; işveren payı 45.000<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>770 Genel Yönetim Giderleri (ücret ve giderler)<\/td><td><\/td><td>267.000<\/td><\/tr><tr><td><\/td><td>335 Personele Borçlar (net ücret)<\/td><td>150.000<\/td><\/tr><tr><td><\/td><td>360 Ödenecek Vergi ve Fonlar (GV 40.000 + DV 2.000)<\/td><td>42.000<\/td><\/tr><tr><td><\/td><td>361 Ödenecek Sosyal Güvenlik Kesintileri (işçi 30.000 + işveren 45.000)<\/td><td>75.000<\/td><\/tr><\/table>\n<p>Gider = brüt ücret (222.000) + işveren payı (45.000) = 267.000 TL. Personel pazarlama bölümündeyse gider 760'a yazılır.<\/p>\n\n<h3>34–36 Alınan avanslar, hakedişler, vergi yükümlülükleri<\/h3>\n<ul>\n<li><b>340 Alınan Sipariş Avansları:<\/b> gelecekteki mal ve hizmet teslimleri için peşin tahsil edilen tutarlar; tahsilde alacak, teslimde borç. <b>349 Alınan Diğer Avanslar<\/b>.<\/li>\n<li><b>350 Yıllara Yaygın İnşaat ve Onarım Hakediş Bedelleri:<\/b> onaylanan hakedişler alacak; işin <b>geçici kabulünde<\/b> satış hesabına aktarılır. 358 Yıllara Yaygın İnşaat Enflasyon Düzeltme Hesabı.<\/li>\n<li><b>360 Ödenecek Vergi ve Fonlar<\/b> (mükellef veya sorumlu sıfatıyla), <b>361 Ödenecek Sosyal Güvenlik Kesintileri<\/b>, <b>368 Vadesi Geçmiş, Ertelenmiş veya Taksitlendirilmiş Vergi ve Diğer Yükümlülükler<\/b> (ödeme süresi bilanço tarihinde bir yıldan az), <b>369 Ödenecek D
