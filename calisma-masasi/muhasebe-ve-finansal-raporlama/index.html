Gelirin ilgili giderle karşılaştırılması", "Nakit esası"], "a": 4, "e": "Dönemsellik varsayımı hesap kesimi, tahakkuk esası, gelirin gerçekleşme noktası ve gelir-gider karşılaştırılması ilkelerini gerektirir; nakit esası bunlardan biri değildir."}]}, {"id": 9, "kisa": "TMS/TFRS Standartları", "baslik": "TMS/TFRS: Türkiye Muhasebe ve Finansal Raporlama Standartları", "ozet": "Sunum, TFRS 18, politika-tahmin-hata, stoklar, finansal araçlar, iştirak ve konsolidasyon, MDV, YAG, kiralama, değer düşüklüğü, karşılıklar, kur farkı ve TMS 29.", "notlar": "<h3>Standart haritası<\/h3>\n<p>Kitap bu bölümü BOBİ FRS ve TMS/TFRS'den yararlanarak, standartları çoğunlukla <b>adıyla<\/b> anlatır. Aşağıdaki numaralar KGK setindeki karşılıklardır; kitapta numarasıyla geçenler: TMS 1, TMS 2, TMS 16, TMS 29, TMS 40 ve TFRS 18.<\/p>\n<table>\n<tr><th>Standart<\/th><th>Konu<\/th><th>Sınav için çekirdek bilgi<\/th><\/tr>\n<tr><td>TMS 1 → TFRS 18<\/td><td>Finansal tabloların sunuluşu<\/td><td>TFRS 18 (RG 08.05.2025) <b>01.01.2027<\/b>'den itibaren TMS 1'in yerini alır.<\/td><\/tr>\n<tr><td>TMS 2<\/td><td>Stoklar<\/td><td>Maliyet ile net gerçekleşebilir değerden düşük olanı; değer düşüklüğü \"Satışların Maliyeti\"ne.<\/td><\/tr>\n<tr><td>TMS 7<\/td><td>Nakit akış tabloları<\/td><td>Esas, yatırım, finansman faaliyetleri; nakit benzeri genellikle ≤ 3 ay vade.<\/td><\/tr>\n<tr><td>TMS 8<\/td><td>Muhasebe politikaları, tahmin değişiklikleri ve hatalar<\/td><td>Politika değişikliği ve önemli geçmiş dönem hatası <b>geriye dönük<\/b>; tahmin değişikliği hata sayılmaz.<\/td><\/tr>\n<tr><td>TMS 10<\/td><td>Raporlama döneminden sonraki olaylar<\/td><td>Düzeltme gerektiren / gerektirmeyen olaylar.<\/td><\/tr>\n<tr><td>TMS 12<\/td><td>Gelir vergileri<\/td><td>Ertelenmiş vergi varlığı ve borcu.<\/td><\/tr>\n<tr><td>TMS 16<\/td><td>Maddi duran varlıklar<\/td><td>Maliyet veya yeniden değerleme modeli; arsa amortismana tabi değil.<\/td><\/tr>\n<tr><td>TMS 19<\/td><td>Çalışanlara sağlanan faydalar<\/td><td>Faydaların muhasebeleştirilmesi ve açıklanması.<\/td><\/tr>\n<tr><td>TMS 20<\/td><td>Devlet teşvikleri<\/td><td>Performans şartlı teşvik şart karşılanana kadar \"Ertelenmiş Gelirler\".<\/td><\/tr>\n<tr><td>TMS 21<\/td><td>Kur değişiminin etkileri<\/td><td>Parasal kalem kapanış kuru; kur farkı kâr veya zarara.<\/td><\/tr>\n<tr><td>TMS 23<\/td><td>Borçlanma maliyetleri<\/td><td>Özellikli varlıkta aktifleştirme.<\/td><\/tr>\n<tr><td>TMS 24<\/td><td>İlişkili taraf açıklamaları<\/td><td>İlişkili taraf işlem ve taahhütleri.<\/td><\/tr>\n<tr><td>TMS 27<\/td><td>Bireysel finansal tablolar<\/td><td>Bağlı ortaklık, iş ortaklığı ve iştirak yatırımları.<\/td><\/tr>\n<tr><td>TMS 28<\/td><td>İştirakler ve iş ortaklıkları<\/td><td>Oy hakkının <b>%20<\/b> veya fazlası → önemli etki; özkaynak yöntemi.<\/td><\/tr>\n<tr><td>TMS 29<\/td><td>Yüksek enflasyonlu ekonomiler<\/td><td>TÜFE: son 3 dönemde %100'ü ve cari dönemde %10'u aşarsa düzeltme.<\/td><\/tr>\n<tr><td>TMS 34<\/td><td>Ara dönem finansal raporlama<\/td><td>Bir yıldan kısa dönem raporlarının asgari içeriği.<\/td><\/tr>\n<tr><td>TMS 36<\/td><td>Varlıklarda değer düşüklüğü<\/td><td>Geri kazanılabilir tutar = SMD GUD ile kullanım değerinden <b>yüksek<\/b> olanı.<\/td><\/tr>\n<tr><td>TMS 37<\/td><td>Karşılıklar, koşullu borç ve varlıklar<\/td><td>Koşullu varlık tablolara alınmaz.<\/td><\/tr>\n<tr><td>TMS 38<\/td><td>Maddi olmayan duran varlıklar<\/td><td>Araştırma gider, geliştirme şartlarla aktif.<\/td><\/tr>\n<tr><td>TMS 40<\/td><td>Yatırım amaçlı gayrimenkuller<\/td><td>GUD veya maliyet yöntemi; tüm YAG'a uygulanır.<\/td><\/tr>\n<tr><td>TMS 41<\/td><td>Tarımsal faaliyetler<\/td><td>Canlı varlıklar ve hasat ürünleri.<\/td><\/tr>\n<tr><td>TFRS 2 / 3 / 5 / 6 / 8<\/td><td>Hisse bazlı ödemeler / işletme birleşmeleri / satış amaçlı duran varlıklar ve durdurulan faaliyetler / maden kaynakları / faaliyet bölümleri<\/td><td>Kitapta yalnız amaç düzeyinde.<\/td><\/tr>\n<tr><td>TFRS 9<\/td><td>Finansal araçlar<\/td><td>İtfa edilmiş maliyet, GUD, maliyet; finansal tablo dışı bırakma.<\/td><\/tr>\n<tr><td>TFRS 10 / 11 / 12 / 13<\/td><td>Konsolide tablolar / müşterek anlaşmalar / diğer işletmelerdeki paylar / GUD ölçümü<\/td><td>Oyların yarısından fazlası → kontrol.<\/td><\/tr>\n<tr><td>TFRS 15<\/td><td>Hasılat<\/td><td>Kitap mal satışı, hizmet, inşaat, faiz-isim hakkı-kâr payı ölçütlerini BOBİ FRS diliyle verir.<\/td><\/tr>\n<tr><td>TFRS 16<\/td><td>Kiralamalar<\/td><td>Kiracı: kullanım hakkı varlığı + kira yükümlülüğü.<\/td><\/tr>\n<tr><td>TFRS 17<\/td><td>Sigorta sözleşmeleri<\/td><td>Sigorta sözleşmelerinden doğan tutarlar ve açıklamalar.<\/td><\/tr>\n<tr><td>TFRS 19<\/td><td>Kamuya hesap verme sorumluluğu bulunmayan bağlı ortaklıklar: açıklamalar<\/td><td><b>01.01.2027<\/b>'den itibaren; ihtiyari.<\/td><\/tr>\n<\/table>\n<ul>\n<li>KGK'nın <b>TSRS<\/b>'si (Türkiye Sürdürülebilirlik Raporlama Standartları) <b>01.01.2024<\/b>'ten itibaren kademeli yürürlükte; ESG bilgilerinin TMS/TFRS tablolarıyla tutarlı sunulmasını amaçlar.<\/li>\n<li>KGK 2024'ten itibaren faizsiz finans kuruluşları için <b>KFMS<\/b> (Katılım Finans Muhasebe Standartları) yayımlamaktadır.<\/li>\n<\/ul>\n\n<h3>Finansal tabloların sunuluşu<\/h3>\n<ul>\n<li>Amaç: finansal durum, performans ve nakit akışları hakkında karar için faydalı bilgi; ayrıca yönetimin kaynakları ne etkinlikte kullandığını göstermek.<\/li>\n<li><b>Asgari set:<\/b> (a) finansal durum tablosu, (b) kâr veya zarar tablosu, (c) nakit akış tablosu, (ç) özkaynak değişim tablosu, (d) önemli muhasebe politikaları ve açıklayıcı bilgileri içeren dipnotlar.<\/li>\n<li>Standarda tam uyum dipnotlarda açıkça belirtilir; uyum + gerekli ilave açıklama = gerçeğe uygun sunum varsayılır.<\/li>\n<li>Bir hükmün uygulanması gerçeğe uygun sunumla çelişecekse (<b>çok nadir<\/b>) hüküm uygulanmaz; dipnotta: uygulanmayan hüküm, nedeni, yerine benimsenen uygulama ve etkileri, diğer hükümlere uyulduğu açıklanır.<\/li>\n<\/ul>\n<table>\n<tr><th>Genel raporlama ilkesi<\/th><th>Özü<\/th><\/tr>\n<tr><td>İşletmenin sürekliliği<\/td><td>Tasfiye veya faaliyete son verme niyeti ya da zorunluluğu yoksa tablolar süreklilik varsayımıyla hazırlanır.<\/td><\/tr>\n<tr><td>Tahakkuk esası<\/td><td><b>Nakit akış tablosu hariç<\/b> tüm tablolar tahakkuk esasına göre.<\/td><\/tr>\n<tr><td>İhtiyatlılık<\/td><td>Belirsizlikte varlık ve gelir fazla, yükümlülük ve gider düşük gösterilmez.<\/td><\/tr>\n<tr><td>Önemlilik<\/td><td>Her önemli hesap sınıfı ayrı gösterilir; kalemin önemi benzer kalemlerle karşılaştırılarak belirlenir.<\/td><\/tr>\n<tr><td>Mahsup yasağı<\/td><td>İzin verilen hâller dışında varlık-yükümlülük, gelir-gider netleştirilmez.<\/td><\/tr>\n<tr><td>Raporlama sıklığı<\/td><td>Yılda <b>en az bir<\/b> kez. Dönem bir yıldan uzun/kısa ise dipnotta: dönemin değiştiği, nedeni, tutarların tam karşılaştırılabilir olmadığı.<\/td><\/tr>\n<tr><td>Karşılaştırmalı bilgi<\/td><td>Cari dönem tutarlarının tamamı önceki dönemle birlikte sunulur.<\/td><\/tr>\n<tr><td>Sunumda tutarlılık<\/td><td>Sunum ve sınıflandırma dönemler arası değiştirilmez; istisnada gerekçesiyle dipnotta açıklanır.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Tablolarda açıkça yer alacak bilgiler: unvan ve unvan değişikliği; tek işletme mi konsolide mi; dönem sonu tarihi ve kapsanan dönem; sunum para birimi; yuvarlama derecesi.<\/li>\n<li><b>Finansal durum tablosu:<\/b> belirli bir tarihteki varlık, yükümlülük ve özkaynaklar. Varlık: geçmiş olay sonucu, işletmenin kontrolünde, gelecekte fayda beklenen değer. Yükümlülük: geçmiş olaydan doğan, kaynak çıkışına yol açacak mevcut mükellefiyet. Özkaynak: varlıklardan tüm yükümlülükler çıktıktan sonra kalan pay. Sunum <b>kısa vade–uzun vade<\/b> ayrımıyla yapılır.<\/li>\n<li><b>Dönen varlık<\/b> (biri yeterli): normal faaliyet döngüsünde paraya çevrilmesi, satılması veya tüketilmesi beklenen; esasen ticari amaçla tutulan; <b>12 ay<\/b> içinde paraya çevrilmesi beklenen; kısıtsız nakit veya nakit benzeri. Diğerleri duran varlıktır.<\/li>\n<li><b>Kısa vadeli yükümlülük<\/b> (biri yeterli): normal döngüde ödenecek; ticari amaçla üstlenilen; 12 ay içinde yerine getirilecek; ödemeyi en az 12 ay erteleme yönünde <b>koşulsuz hak bulunmayan<\/b>.<\/li>\n<li><b>Gelir:<\/b> ortak katkıları hariç, özkaynakta dönem içindeki artış. <b>Gider:<\/b> ortaklara dağıtımlar hariç, özkaynakta dönem içindeki azalış.<\/li>\n<li><b>Özkaynak değişim tablosu:<\/b> her özkaynak kalemi için bir sütun (dönem başı, artış/azalış, dönem sonu); nedenler satırlarda.<\/li>\n<\/ul>\n<h4>Nakit akış tablosu<\/h4>\n<ul>\n<li><b>Nakit:<\/b> kasadaki nakit ve vadesiz mevduat. <b>Nakit benzeri:<\/b> kolayca nakde çevrilebilen, değer değişim riski önemsiz, kısa vadeli ve yüksek likiditeli yatırım; genellikle edinimden itibaren <b>üç ay veya daha kısa<\/b> vade. Özkaynak araçları genellikle nakit benzeri sayılmaz.<\/li>\n<li>Kredili cari mevduat (KMH) genellikle <b>finansman<\/b> faaliyetidir; talep üzerine geri ödenebilir ve nakit yönetiminin ayrılmaz parçasıysa nakit ve nakit benzerinin bileşeni sayılır.<\/li>\n<li><b>Esas faaliyet:<\/b> hasılat yaratan ana faaliyetler ve yatırım/finansman olmayan diğerleri. <b>Yatırım:<\/b> uzun vadeli varlıklar ve nakit benzeri olmayan yatırımların edinimi ve elden çıkarılması; yalnız bilançoda varlık doğuran harcama yatırım çıkışı olabilir. <b>Finansman:<\/b> özkaynak ve yükümlülüklerin tutar ve içeriğini değiştiren faaliyetler.<\/li>\n<\/ul>\n<h4>TFRS 18 Finansal tablolarda sunum ve açıklama<\/h4>\n<ul>\n<li><b>01/01/2027<\/b> ve sonrasında başlayan dönemler; TMS 1 yürürlükten kalkar. En önemli yenilik <b>kâr veya zarar tablosu formatı<\/b>.<\/li>\n<li>Gelir ve giderler <b>beş bölümden<\/b> birinde: esas faaliyetler, yatırım, finansman, vergi, durdurulan faaliyetler.<\/li>\n<li>İki yeni <b>ara toplam<\/b>: \"Esas Faaliyet Kârı\" ve \"Finansman ve Vergi Öncesi Kâr\".<\/li>\n<li><b>Yönetimin tanımladığı performans ölçütleri<\/b> (finansal tablo dışında kamuya açık iletişimde kullanılan, TFRS'nin zorunlu kılmadığı ölçütler) dipnotta açıklanır: yönetimin bakış açısını ve TFRS ölçütleriyle karşılaştırmayı gösterir.<\/li>\n<li>Kalemlerin birleştirilmesi ve ayrıştırılmasına ilave rehberlik.<\/li>\n<\/ul>\n\n<h3>Muhasebe politikaları, tahminler ve hatalar<\/h3>\n<table>\n<tr><th>Durum<\/th><th>Uygulama<\/th><\/tr>\n<tr><td>Muhasebe politikası değişikliği<\/td><td>Daha gerçeğe ve ihtiyaca uygun bilgi sağlıyorsa yapılır (tutarlılık ve karşılaştırılabilirlik gözetilir); <b>geriye dönük<\/b>, sanki baştan beri uygulanıyormuş gibi; karşılaştırmalı dönemler düzeltilir.<\/td><\/tr>\n<tr><td>Muhasebe tahmini değişikliği<\/td><td>Şüpheli alacak, stok değer düşüklüğü, GUD, garanti yükümlülüğü, faydalı ömür gibi. Yeni bilgi veya tecrübeden doğar; önceki dönemle ilgili değildir, <b>hata düzeltmesi sayılmaz<\/b>.<\/td><\/tr>\n<tr><td>Cari dönem hatası<\/td><td>Tablolar onaylanmadan tespit edilirse cari dönemde düzeltilir.<\/td><\/tr>\n<tr><td>Önemli geçmiş dönem hatası<\/td><td><b>Geriye dönük düzeltme<\/b>: hatalı döneme ait karşılaştırmalı tutarlar düzeltilir; hata sunulan en erken dönemden önceyse en erken dönemin varlık, yükümlülük ve özkaynak <b>açılış bakiyeleri<\/b> düzeltilir.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Standartta politika yoksa işletme, kavramsal çerçevedeki faydalı bilgi özelliklerini taşıyan ve kendi şartlarına en uygun politikayı takdirle belirler.<\/li>\n<li>Yanlışlık: kayda alma, ölçüm, sunum veya açıklamada hata veya hile; matematik hataları, politika uygulama hataları, gözden kaçırma, yanlış yorum ve hileler. <b>Dikkat:<\/b> kasıtlı yapılmış <b>önemsiz<\/b> bir yanlışlık da tabloları standarda aykırı hâle getirir.<\/li>\n<\/ul>\n\n<h3>Raporlama döneminden sonraki olaylar<\/h3>\n<ul>\n<li>Dönem sonu ile tabloların yönetim organınca <b>onaylandığı tarih<\/b> arasında lehte veya aleyhte olaylar.<\/li>\n<li><b>Düzeltme gerektiren:<\/b> dönem sonunda <b>mevcut olan<\/b> durumu teyit eder → tablolardaki tutarlar (dipnotlar dâhil) düzeltilir.<\/li>\n<li><b>Düzeltme gerektirmeyen:<\/b> dönem sonundan <b>sonra ortaya çıkan<\/b> durumu gösterir → tutarlar değiştirilmez.<\/li>\n<\/ul>\n\n<h3>Hasılat<\/h3>\n<ul>\n<li>Hasılat: olağan faaliyetlerden doğan gelir. Kapsam: mal satışı, hizmet sunumu, yüklenicinin inşa sözleşmeleri, faiz, isim hakkı ve kâr payı.<\/li>\n<li><b>Mal satışı<\/b> (tümü sağlanmalı): önemli risk ve getirilerin alıcıya devri; mallar üzerinde kontrolün sürdürülmemesi (kontrol = kullanımı yönetme ve kalan faydayı büyük ölçüde elde etme gücü); hasılatın güvenilir ölçümü; faydaların muhtemel olması; maliyetlerin güvenilir ölçümü.<\/li>\n<li><b>Hizmet sunumu<\/b> (tümü): hasılatın güvenilir ölçümü; faydanın muhtemel olması; dönem sonunda <b>tamamlanma düzeyinin<\/b> güvenilir ölçümü; katlanılan ve katlanılacak maliyetlerin güvenilir ölçümü.<\/li>\n<li><b>İnşa sözleşmesi:<\/b> sonuç güvenilir tahmin edilebiliyorsa hasılat ve maliyet tamamlanma düzeyine göre kâr veya zarara yansıtılır = <b>tamamlanma yüzdesi yöntemi<\/b>.<\/li>\n<li><b>Faiz:<\/b> nakdin kullandırılmasının bedeli. <b>İsim hakkı:<\/b> patent, marka, telif, yazılım gibi uzun vadeli varlıkların kullandırılma bedeli. <b>Kâr payı:<\/b> kârın özkaynak aracı hamillerine payları oranında dağıtımı.<\/li>\n<\/ul>\n\n<h3>Stoklar (TMS 2)<\/h3>\n<ul>\n<li>Stok: olağan akışta satılmak üzere tutulan, satılmak üzere üretilmekte olan veya üretimde/hizmette kullanılacak hammadde ve malzeme.<\/li>\n<li><b>Maliyet<\/b> = satın alma + dönüştürme + mevcut konum ve duruma getirme maliyetleri.<\/li>\n<li>Satın alma maliyeti: alış fiyatı, ithalat ve diğer vergiler (<b>iade alınabilecekler hariç<\/b>), taşıma, yükleme-boşaltma ve doğrudan ilgili diğer maliyetler; <b>ticari iskonto ve indirimler düşülür<\/b>.<\/li>\n<li>Dönüştürme maliyeti: direkt işçilik gibi doğrudan maliyetler + sabit ve değişken genel üretim giderlerinden sistematik pay. Kitaba göre üretimle ilgili olmayan genel giderler veya özel müşteri için ürün tasarım maliyetleri de uygun durumda dâhil edilebilir.<\/li>\n<li><b>Maliyete giremeyen, dönem gideri olanlar:<\/b> normalin üstündeki fire ve kayıplar, işçilik ve diğer üretim maliyetleri; bir sonraki üretim aşaması için gerekli olanlar dışındaki depolama; katkısı olmayan genel yönetim giderleri; satış giderleri.<\/li>\n<li>Ortak ürün ve yan ürün: ayrı belirlenemeyen maliyetler mantıklı ve tutarlı dağıtılır (ör. nispi satış değeri). Önemsiz yan ürün <b>net gerçekleşebilir değerle<\/b> ölçülür ve ana ürün maliyetinden düşülür.<\/li>\n<li>Hizmet işletmesinde stok: hizmette doğrudan çalışanların ücret ve maliyetleri ile ilişkilendirilebilen giderler; satış ve genel yönetim giderleri dâhil edilmez.<\/li>\n<li><b>Ölçüm teknikleri:<\/b> esas fiili maliyet; sonuç fiili maliyete yakınsa <b>standart maliyet<\/b> (normal kapasite ve verimlilik düzeyleri, düzenli gözden geçirilir) veya <b>perakende yöntemi<\/b> (satış değerinden uygun brüt kâr marjı düşülür).<\/li>\n<li>Bilançoda <b>maliyet ile net gerçekleşebilir değerden (NGD) küçük olanı<\/b>. NGD = tahmini satış fiyatı − tahmini tamamlama maliyeti − tahmini satış giderleri. Tamamlama maliyeti mamuller içindir; ticari mallarda NGD = satış fiyatı − satış giderleri.<\/li>\n<li><b>Değer düşüklüğü:<\/b> her dönem sonu değerlendirilir (zarar görme, kullanılmaz hâle gelme, fiyat düşüşü, tamamlama veya satış maliyeti artışı). Defter değeri NGD'ye indirilir; zarar <b>\"Satışların Maliyeti\"<\/b> kalemine yansıtılır. Test genellikle kalem bazında; benzer amaç ve bölgedeki ürünler gruplanabilir.<\/li>\n<li><b>İptal:<\/b> koşullar ortadan kalkar veya NGD açıkça artarsa düşüklüğün tamamı veya bir kısmı iptal edilir. <b>Dikkat:<\/b> yeni değer stokun <b>maliyet bedelini aşamaz<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Örnek<\/th><th>Hesap<\/th><\/tr>\n<tr><td>Maliyet 120; tahmini satış fiyatı 130, tamamlama 15, satış gideri 5<\/td><td>NGD = 130 − 15 − 5 = 110 → değer düşüklüğü 10, bilanço değeri 110<\/td><\/tr>\n<tr><td>Maliyeti 100 olan stok önce 80'e indirildi; sonra NGD 110'a çıktı<\/td><td>İptal en fazla 20 → yeni değer 100 (maliyet tavanı)<\/td><\/tr>\n<\/table>\n\n<h3>Finansal araçlar (TFRS 9)<\/h3>\n<ul>\n<li>Finansal araç: bir işletmede finansal varlık, diğerinde finansal yükümlülük veya özkaynak aracı doğuran sözleşme.<\/li>\n<li><b>Finansal varlık:<\/b> nakit; başka işletmenin özkaynak aracı; nakit veya finansal varlık alma ya da lehte takas hakkı (ticari alacak, tahvil, bono); işletmenin kendi özkaynak aracıyla ödenecek belirli sözleşmeler (değişken sayıda araç alma veya sabit-sabit dışı takas).<\/li>\n<li><b>Finansal yükümlülük:<\/b> nakit veya finansal varlık verme ya da aleyhte takas yükümlülüğü; kendi özkaynak aracıyla ödenecek belirli sözleşmeler (değişken sayıda araç verme veya sabit-sabit dışı). <b>Özkaynak aracı:<\/b> tüm yükümlülükler çıktıktan sonra varlıklarda hak.<\/li>\n<li><b>Üç ölçüt:<\/b> itfa edilmiş maliyet, gerçeğe uygun değer, maliyet değeri.<\/li>\n<li><b>İtfa edilmiş maliyet:<\/b> ilk ölçüm − anapara geri ödemeleri ± etkin faiz yöntemiyle birikmiş itfa − değer düşüklüğü. <b>Etkin faiz oranı<\/b>, tahmini nakit akışlarını net defter değerine indirgeyen orandır, yani aracın <b>iç verim oranı<\/b>.<\/li>\n<li><b>Maliyet değeri:<\/b> edinim tutarı; işlem maliyetleri (komisyon) <b>dâhil<\/b>. <b>GUD:<\/b> bilgili ve istekli taraflar arasında karşılıklı pazarlıkla oluşacak tutar. Göstergeler: aktif piyasa fiyatı, son işlemler, benzer araç, iskonto edilmiş nakit akışı, opsiyon fiyatlama modelleri.<\/li>\n<li><b>Varlığın tablo dışı bırakılması:<\/b> haklar sona erdiğinde veya elde edildiğinde; risk ve getirilerin <b>tamamına yakını<\/b> devredildiğinde; risk ve getiriler tutulsa da kontrol, varlığı tek taraflı ve kısıtsız satabilecek bir tarafa devredildiğinde; geri kazanıma ilişkin makul beklenti kalmadığında.<\/li>\n<li><b>Yükümlülüğün tablo dışı bırakılması:<\/b> yükümlülük yerine getirildiğinde, iptal edildiğinde veya zamanaşımına uğradığında. Önemli ölçüde farklı şartlarla takas veya şartlarda önemli değişiklik → eski yükümlülük kalkar, yenisi kaydedilir; defter değeri ile ödenen tutar farkı <b>kâr veya zarara<\/b>.<\/li>\n<\/ul>\n\n<h3>İştirakler, iş ortaklıkları ve konsolidasyon<\/h3>\n<table>\n<tr><th>Kavram<\/th><th>Ölçüt<\/th><th>Muhasebe<\/th><\/tr>\n<tr><td>İştirak<\/td><td><b>Önemli etki<\/b>; oy hakkının doğrudan veya dolaylı <b>%20<\/b> veya fazlası (aksi kanıtlanmadıkça)<\/td><td>İlk kayıt maliyet; maliyet yöntemi veya özkaynak yöntemi<\/td><\/tr>\n<tr><td>İş ortaklığı<\/td><td>Sözleşmeye bağlı <b>müşterek kontrol<\/b>; stratejik kararlar <b>oy birliği<\/b> gerektirir<\/td><td>Özkaynak yöntemi kullanılabilir<\/td><\/tr>\n<tr><td>Bağlı ortaklık<\/td><td><b>Kontrol<\/b>; oy haklarının <b>yarısından fazlası<\/b> (aksi kanıtlanmadıkça)<\/td><td>Konsolidasyon<\/td><\/tr>\n<\/table>\n<ul>\n<li>Maliyet yönteminde iştirakten alınan kâr payı, edinimden önceki veya sonraki kârdan olmasına bakılmaksızın kâr veya zarar tablosunda \"Bağlı Ortaklıklardan, İştiraklerden ve Müşterek Girişimlerden Kâr Payları\" kalemine yazılır; yatırımcı-iştirak işlemleri elimine edilmez. Önemli etki kaybedilince iştirak olarak izleme biter.<\/li>\n<li>Müşterek girişim türleri (3): müştereken kontrol edilen <b>faaliyetler<\/b>, <b>varlıklar<\/b> ve <b>işletmeler<\/b>.<\/li>\n<li><b>Özkaynak yönteminde dört düzeltme:<\/b> iştirak kâr/zararından pay yatırımcının kâr/zararıdır (defter değerini artırır/azaltır); alınan dağıtımlar (kâr payı) defter değerini <b>azaltır<\/b>; iştirakin kâr/zararına yansımamış tutarlardaki (MDV yeniden değerlemesi, kur farkı) pay <b>yatırımcının özkaynaklarında<\/b>; potansiyel oy haklarında mevcut sahiplik dikkate alınır.<\/li>\n<li>Örnek: %30 iştirak 1.000 maliyetle alındı; iştirak 400 kâr etti, toplam 100 kâr payı dağıttı → defter değeri 1.000 + 120 − 30 = <b>1.090<\/b>.<\/li>\n<li><b>Kontrol<\/b> (yarı veya daha az oyla da): diğer ortaklarla anlaşmayla oyların yarısından fazlasını kontrol etmek; sözleşme veya ana sözleşmeyle politikaları yönetme gücü; yönetim kurulu çoğunluğunu atama veya görevden alma gücü; cari ve önceki dönemde görevdeki kurul çoğunluğunun yatırımcının oylarıyla atanmış olması (üçüncü bir tarafın bu haklara sahip olmaması şartıyla). Ana ortaklık + bağlı ortaklıklar = <b>topluluk<\/b>.<\/li>\n<\/ul>\n\n<h3>Maddi duran varlıklar (TMS 16)<\/h3>\n<ul>\n<li>Üretimde, kiraya vermede veya idari amaçla kullanılan, birden fazla dönem faydalanılacak fiziki kalemler. Yedek parça ve bakım malzemeleri tanımı karşılıyorsa MDV, aksi hâlde stok.<\/li>\n<li>Ömrü uzatan veya kapasiteyi artıran harcamalar (yenileme, büyük kontroller) defter değerine eklenir.<\/li>\n<li><b>İlk ölçüm maliyet:<\/b> iskonto ve indirimler düşülmüş alış fiyatı + alımla ilgili giderler + amaçlanan kullanıma hazır hâle getirme maliyetleri.<\/li>\n<li><b>Vadeli alım:<\/b> bir yıl veya daha kısa vadede vade farkı ayrıştırılmaz; <b>bir yıldan uzun<\/b> vadede vade farkı ayrıştırılıp <b>peşin fiyat<\/b> esas alınır.<\/li>\n<li>Sonraki ölçüm: <b>maliyet modeli<\/b> (maliyet − birikmiş amortisman − birikmiş değer düşüklüğü) veya <b>yeniden değerleme modeli<\/b> (GUD güvenilir ölçülebiliyorsa; yeniden değerleme tarihindeki GUD − sonraki amortisman ve düşüklük). Seçilen model ilgili <b>varlık sınıfının tümüne<\/b> uygulanır; yeniden değerleme, defter değeri GUD'den önemli ölçüde farklılaşmayacak düzenlilikte yapılır.<\/li>\n<li>Amortisman <b>zorunludur<\/b>; farklı ömürlü önemli parçalar ayrı amortismana tabi tutulur. <b>Arsa ve araziler<\/b> sınırsız ömürlü olduğundan amortismana tabi değildir.<\/li>\n<li>Amortismana tabi tutar = maliyet (veya yeniden değerlenmiş tutar) − <b>kalıntı değer<\/b>. Kalıntı değer önemsizse dikkate alınmaz.<\/li>\n<li>Yöntemler: <b>doğrusal<\/b> (kalıntı değer değişmedikçe gider sabit), <b>azalan bakiyeler<\/b> (gider azalır), <b>üretim miktarı<\/b> (beklenen kullanım veya üretime göre).<\/li>\n<li>Örnek: maliyet 1.000.000 TL, kalıntı değer 100.000 TL, ömür 5 yıl, doğrusal → yıllık amortisman (1.000.000 − 100.000) / 5 = <b>180.000 TL<\/b>.<\/li>\n<\/ul>\n\n<h3>Yatırım amaçlı gayrimenkuller (TMS 40)<\/h3>\n<ul>\n<li>Kullanım dışında <b>kira geliri ve/veya değer artışı<\/b> için tutulan arazi ve binalar.<\/li>\n<li>İlk kayıt MDV hükümleriyle <b>maliyet<\/b>; finansal kiralamayla edinilende Kiralamalar bölümü. Geleneksel kiralamayla tutulan gayrimenkul tanımı karşılıyorsa YAG sınıflanabilir; bu durumda finansal kiralama hükümleri uygulanır.<\/li>\n<li>Sonraki ölçüm: <b>GUD yöntemi veya maliyet yöntemi<\/b> (politika tercihi, tüm YAG'a uygulanır). <b>Dikkat:<\/b> GUD yöntemi seçildikten sonra politika değişikliğiyle maliyet yöntemine geçilmez. GUD'de tüm YAG'lar dönem sonu GUD'leriyle gösterilir.<\/li>\n<li>Elde tutma amacı değişirse MDV'ye veya stoklara aktarılır.<\/li>\n<\/ul>\n\n<h3>Maddi olmayan duran varlıklar (TMS 38)<\/h3>\n<ul>\n<li>Fiziksel niteliği olmayan, tanımlanabilir, parasal olmayan varlık.<\/li>\n<li><b>Araştırma:<\/b> yeni bilimsel veya teknik bilgi için özgün ve planlı inceleme → gelecekte fayda gösterilemediğinden <b>gider<\/b>; araştırmadan MODV doğmaz.<\/li>\n<li><b>Geliştirme:<\/b> ticari üretim öncesi araştırma sonuçlarının yeni veya geliştirilmiş ürün, süreç, sistem tasarımına uygulanması. Şu koşulların <b>tamamı<\/b> varsa MODV: teknik olarak tamamlanabilirlik; tamamlama ve kullanma/satma niyeti; kullanma/satma imkânı; muhtemel faydayı nasıl sağlayacağının belirliliği (piyasa veya iç kullanıma elverişlilik); yeterli teknik, mali ve diğer kaynak; harcamaların güvenilir ölçümü.<\/li>\n<\/ul>\n\n<h3>Kiralamalar (TFRS 16)<\/h3>\n<ul>\n<li>Sözleşme, bir bedel karşılığında tanımlanan varlığın <b>kullanımını kontrol etme hakkını<\/b> belirli süre devrediyorsa kiralamadır; değerlendirme sözleşme başında yapılır.<\/li>\n<li><b>Kiracı<\/b>, fiilen başlama tarihinde <b>kullanım hakkı varlığı<\/b> ve <b>kira yükümlülüğü<\/b> kaydeder. Kira yükümlülüğü ödenmemiş kira ödemelerinin bugünkü değeridir; iskonto oranı kolayca belirlenebiliyorsa <b>zımni faiz oranı<\/b>, değilse kiracının <b>alternatif borçlanma faiz oranı<\/b>.<\/li>\n<li>Kullanım hakkı varlığının maliyeti: kira yükümlülüğünün ilk ölçümü + başlangıçta veya öncesinde yapılan ödemeler (alınan teşvikler düşülür) + başlangıçtaki doğrudan maliyetler + söküm, taşıma, restorasyon tahmini maliyetleri.<\/li>\n<li>Sonraki ölçüm: varlıkta maliyet yöntemi ya da benzer varlıklara TMS 40 veya TMS 16 kapsamında GUD/yeniden değerleme uygulanıyorsa o yöntem. Yükümlülük: faizle artırılır, ödemelerle azaltılır, yeniden değerlendirmelerle yeniden ölçülür.<\/li>\n<li><b>Kiraya veren:<\/b> risk ve getirilerin önemli ölçüde tamamını devrediyorsa <b>finansal kiralama<\/b> (net kiralama yatırımı kadar alacak; sabit dönemsel getiriyle finansman geliri), devretmiyorsa <b>faaliyet kiralaması<\/b> (kira geliri doğrusal veya daha uygun sistematik esasla).<\/li>\n<li><b>Sat ve geri kirala:<\/b> satıcı-kiracı kullanım hakkı varlığını elde tuttuğu hakkın önceki defter değeri oranında ölçer; yalnız devredilen haklarla ilgili kazanç/kaybı yansıtır.<\/li>\n<li>Örnek: 3 yıl, yıl sonu 100.000 TL kira, alternatif borçlanma oranı %12 → kira yükümlülüğü ≈ <b>240.183 TL<\/b>.<\/li>\n<\/ul>\n\n<h3>Devlet teşvikleri ve borçlanma maliyetleri<\/h3>\n<ul>\n<li>Devlet teşviki: faaliyetle ilgili şartlar karşılanınca kaynak transferi. Kapsam dışı: makul değer atfedilemeyen yardımlar, normal ticari işlemlerden ayırt edilemeyenler, vergi matrahı veya vergi borcuyla ilgili faydalar.<\/li>\n<li>Gelecek performans şartı yoksa (veya önceden yerine getirildiyse) <b>alındığında<\/b> kâr veya zarara; performans şartlıysa şart karşılanınca kâr veya zarara, o zamana kadar <b>\"Ertelenmiş Gelirler\"<\/b>.<\/li>\n<li><b>Özellikli varlık:<\/b> kullanıma veya satışa hazır hâle gelmesi zorunlu olarak <b>uzun süre<\/b> gerektiren varlık. Doğrudan ilişkili borçlanma maliyetleri (faiz, finansal kiralama faizi, kur farkı) güvenilir ölçülebilir ve fayda muhtemelse maliyete eklenir.<\/li>\n<li>Aktifleştirme başlangıcı (üçü birden): varlık için harcama yapılması; borçlanma maliyetinin oluşması; hazırlama işlemlerine başlanması. Uzun süreli ara verilirse aktifleştirmeye ara verilebilir; gerekli işlemler esas itibarıyla tamamlanınca biter.<\/li>\n<\/ul>\n\n<h3>Varlıklarda değer düşüklüğü (TMS 36)<\/h3>\n<ul>\n<li><b>Geri kazanılabilir tutar<\/b> = satış maliyetleri düşülmüş GUD ile <b>kullanım değerinden yüksek olanı<\/b>. Defter değeri bundan büyükse <b>değer düşüklüğü zararı<\/b> doğar.<\/li>\n<li>Ayrı belirlenemezse <b>nakit yaratan birim<\/b> (diğerlerinden büyük ölçüde bağımsız nakit akışı yaratan en küçük varlık grubu) için hesaplanır.<\/li>\n<li>Her dönem sonunda <b>gösterge<\/b> olup olmadığına bakılır; gösterge yoksa (belirsiz ömürlü MODV dâhil, kitaba göre) geri kazanılabilir tutar hesaplanmaz. Dikkat: bu ifade kitabın yararlandığı BOBİ FRS yaklaşımıdır; tam TFRS'de (TMS 36) belirsiz ömürlü MODV ve şerefiye gösterge aranmaksızın her yıl teste tabidir. Gösterge, zarar kaydedilmese bile kalan ömür, yöntem ve kalıntı değerin gözden geçirilmesini gerektirebilir.<\/li>\n<li>İki tutarın ikisini de hesaplamak her zaman gerekmez: biri defter değerini aşıyorsa düşüklük yoktur.<\/li>\n<li><b>Kullanım değeri<\/b> = beklenen gelecekteki nakit akışlarının bugünkü değeri. Dikkate alınanlar: beklenen nakit akışları, tutar/zamanlama sapmaları, paranın zaman değeri (<b>risksiz cari faiz<\/b>), varlığa özgü belirsizlik bedeli, likidite gibi diğer unsurlar.<\/li>\n<li>Nakit akışı tahmini <b>mevcut durum<\/b>a göre yapılır; taahhüt edilmemiş yeniden yapılandırma veya performans iyileştirmesi, <b>finansman faaliyetleri<\/b> ve <b>gelir vergisi<\/b> ödeme-iadeleri dâhil edilmez.<\/li>\n<\/ul>\n<table>\n<tr><th>Örnek<\/th><th>Hesap<\/th><\/tr>\n<tr><td>Defter değeri 500; SMD GUD 420; kullanım değeri 450<\/td><td>Geri kazanılabilir tutar = max(420; 450) = 450 → düşüklük 50<\/td><\/tr>\n<tr><td>3 yıl yıllık 100 nakit girişi, iskonto %10<\/td><td>Kullanım değeri ≈ 248,69<\/td><\/tr>\n<\/table>\n\n<h3>Karşılıklar, koşullu borçlar ve varlıklar (TMS 37)<\/h3>\n<ul>\n<li>Yükümlülük: geçmiş olaydan doğan, kaynak çıkışına yol açacak mevcut yükümlülük. <b>Sorumluluk doğuran olay:<\/b> yerine getirmekten başka gerçekçi alternatif bırakmayan, hukuki veya zımni yükümlülük yaratan olay.<\/li>\n<li><b>Zımni yükümlülük:<\/b> geçmiş uygulama, yayımlanmış politika veya belirli açıklamalarla başkalarında geçerli beklenti yaratılması.<\/li>\n<li><b>Karşılık şartları<\/b>: geçmiş olaydan yükümlülük; kaynak çıkışının <b>muhtemel<\/b> olması (kesinse ticari borç olur); tutarın güvenilir tahmini. Karşılık = zamanı veya tutarı belli olmayan yükümlülük.<\/li>\n<li>Çıkış kesin değilse veya tutar güvenilir ölçülemiyorsa <b>koşullu borç<\/b>. <b>Dikkat:<\/b> her karşılık koşullu borçtur, her koşullu borç karşılık değildir.<\/li>\n<li><b>Koşullu varlık<\/b> tablolarda yer almaz (hiç elde edilemeyecek gelirin kaydı riski).<\/li>\n<\/ul>\n\n<h3>Kur değişiminin etkileri (TMS 21)<\/h3>\n<ul>\n<li><b>Geçerli para birimi<\/b>: temel ekonomik çevrenin para birimi; satış fiyatlarını en çok etkileyen para birimi, fiyatları en çok etkileyen ülkenin para birimi ve işçilik/hammadde maliyetlerini en çok etkileyen para birimi dikkate alınır.<\/li>\n<li><b>Parasal kalemler<\/b> (nakit, mevduat, alacak, borç senetleri, çekler): <b>kapanış kuru<\/b>yla çevrilir; kur farkı kural olarak oluştuğu dönemde <b>kâr veya zarara<\/b>.<\/li>\n<li><b>Parasal olmayan<\/b> (avanslar, şerefiye, stok, MDV, MODV, parasal olmayan teslimle sonuçlanacak karşılıklar): tarihi maliyetle ölçülenler <b>işlem tarihi kuru<\/b>yla (kur farkı doğmaz); GUD ile ölçülenler GUD'nin belirlendiği tarihteki kurla.<\/li>\n<li>Örnek: 10.000 USD alacak 30 TL kurdan kaydedildi, kapanış kuru 32 TL → kur farkı geliri 20.000 TL.<\/li>\n<\/ul>\n\n<h3>Gelir vergileri, enflasyon ve diğerleri<\/h3>\n<ul>\n<li><b>Ertelenmiş vergi:<\/b> ticari kâr ile mali kâr farkından doğar; ticaret ve vergi kanunlarının muhasebeleştirme farkının ve dönemselliğin sonucudur. Yönleri: ertelenmiş vergi <b>varlığı<\/b> ve <b>borcu<\/b>. Kaynakları: <b>geçici farklar<\/b>, kullanılmamış mali zararlar, kullanılmamış vergi avantajları.<\/li>\n<li><b>Ara dönem raporlama:<\/b> bir yıldan kısa dönemlerde asgari içerik ve ölçüm-kayıt ilkeleri.<\/li>\n<li><b>TMS 29:<\/b> geçerli para birimi TL olanlar, TÜİK'in Türkiye geneli <b>TÜFE<\/b> artışı içinde bulunulan dönem dâhil <b>son üç raporlama döneminde %100'ü<\/b> ve <b>cari dönemde %10'u<\/b> aşarsa tablolarını düzeltir. Ara dönemde: ara dönemin son ayı dâhil önceki <b>36 ay<\/b> ve son <b>12 ay<\/b>. Tutarlar dönem sonu satın alma gücüyle ifade edilir; karşılaştırmalı bilgiler de. Düzeltilmiş tablolarla birlikte <b>düzeltilmemiş hâller sunulamaz<\/b>. TFRS'ye tabi işletmeler <b>2023<\/b> hesap döneminden itibaren düzeltme yapıyor, 2025'te de devam ediyor.<\/li>\n<li>Örnek: yıllık TÜFE %30, %40 ve %15 → üç yıllık kümülatif 1,30 × 1,40 × 1,15 − 1 ≈ %109,3 (> %100) ve cari %15 (> %10) → düzeltme gerekir.<\/li>\n<li>Diğer standartlar (amaç düzeyinde): çalışanlara sağlanan faydalar; ilişkili taraf açıklamaları; hisse bazlı ödemeler; işletme birleşmeleri; sigorta sözleşmeleri; satış amaçlı duran varlıklar ve durdurulan faaliyetler; maden kaynakları; faaliyet bölümleri; bireysel tablolar; müşterek anlaşmalar; diğer işletmelerdeki paylar; GUD ölçümü.<\/li>\n<\/ul>\n<h4>TFRS 19 Kamuya hesap verme sorumluluğu bulunmayan bağlı ortaklıklar<\/h4>\n<ul>\n<li><b>1/01/2027<\/b>'den itibaren. İşletme dönem sonunda <b>üç koşulun tamamı<\/b> varsa ihtiyari uygular: bağlı ortaklık olması; kamuya hesap verme sorumluluğu olmaması; kamuya açık TFRS konsolide tablo hazırlayan ana veya ara kademe ana ortaklığının olması.<\/li>\n<li><b>Kamuya hesap verme sorumluluğu<\/b> var sayılır: borçlanma veya özkaynak araçları kamuya açık piyasada (yerli/yabancı borsa, tezgâh üstü) işlem görüyor veya ihraç sürecindeyse; ya da temel faaliyeti geniş bir grup adına <b>emanetçi<\/b> sıfatıyla varlık tutmaksa (bankalar, kredi birlikleri, sigorta şirketleri, menkul kıymet aracıları, yatırım fonları, yatırım bankaları).<\/li>\n<\/ul>", "sorular": [{"q": "TFRS 18 Finansal Tablolarda Sunum ve Açıklama standardına ilişkin hangisi yanlıştır?", "o": ["01.01.2027 ve sonrasında başlayan dönemlerde uygulanır", "Yürürlüğe girmesiyle TMS 1 yürürlükten kalkar", "Kâr veya zarar tablosuna \"Esas Faaliyet Kârı\" ve \"Finansman ve Vergi Öncesi Kâr\" ara toplamlarını ekler", "Yönetimin tanımladığı performans ölçütlerinin dipnotlarda açıklanmasını zorunlu kılar", "Gelir ve giderleri üç bölümde (esas, yatırım, finansman) sınıflandırır; vergi ve durdurulan faaliyetler ayrı gösterilmez"], "a": 4, "e": "TFRS 18'e göre gelir ve giderler beş bölümden birinde sınıflandırılır: esas faaliyetler, yatırım, finansman, vergi ve durdurulan faaliyetler."}, {"q": "Finansal tabloların sunuluşuna ilişkin genel ilkelerden hangisine göre nakit akış tablosu hariç tüm tablolar hazırlanır?", "o": ["İhtiyatlılık", "Mahsup yasağı", "Tahakkuk esası", "Sunumda tutarlılık", "Önemlilik"], "a": 2, "e": "Nakit akış tablosu hariç tüm finansal tablolar tahakkuk esasına göre düzenlenir."}, {"q": "Bir işletme, satın alındığı tarihten itibaren vadesi iki ay olan ve değer değişim riski önemsiz bir mevduat ile vadesi dokuz ay olan bir devlet tahvili tutmaktadır. Nakit akış tablosu açısından hangisi doğrudur?", "o": ["Yalnız iki ay vadeli mevduat genellikle nakit benzeridir", "Her ikisi de nakit benzeridir", "Yalnız tahvil nakit benzeridir", "İkisi de nakit benzeri değildir", "Her ikisi de nakit olarak gösterilir"], "a": 0, "e": "Edinimden itibaren üç ay veya daha kısa vadeli yatırımlar genellikle nakit benzeri sayılır; dokuz aylık tahvil bu ölçütü karşılamaz."}, {"q": "Muhasebe tahminlerindeki değişikliklere ilişkin hangisi doğrudur?", "o": ["Geriye dönük olarak uygulanır", "Önceki dönemlerle ilgili olduğundan hata düzeltmesi sayılır", "Açılış bakiyeleri düzeltilerek muhasebeleştirilir", "Yeni bilgi veya tecrübeden kaynaklanır, önceki dönemlerle ilgili değildir ve hata düzeltmesi sayılmaz", "Yalnızca standart değişikliğinde yapılabilir"], "a": 3, "e": "Tahmin değişiklikleri yapıları gereği önceki dönemlerle ilgili değildir ve yanlışlık düzeltmesi olarak nitelendirilemez."}, {"q": "Önemli bir geçmiş dönem hatası, karşılaştırmalı olarak sunulan en erken dönemden daha önce meydana gelmişse nasıl düzeltilir?", "o": ["Cari dönem kâr veya zararına yansıtılır", "Sunulan en erken döneme ilişkin varlık, yükümlülük ve özkaynak kalemlerinin açılış bakiyeleri düzeltilir", "Yalnızca dipnotta açıklanır", "Gelecek dönemlere ileriye dönük yansıtılır", "Hiçbir düzeltme yapılmaz"], "a": 1, "e": "Geriye dönük düzeltmede hata en erken sunulan dönemden önceyse o dönemin açılış bakiyeleri düzeltilir."}, {"q": "Raporlama dönemi sonunda mevcut olan bir durumu teyit eden ve tabloların onay tarihinden önce ortaya çıkan olay için ne yapılır?", "o": ["Düzeltme gerektiren olaydır; ilgili dipnotlar dâhil tablolardaki tutarlar düzeltilir", "Bir sonraki dönemin tablolarına yansıtılır", "Tutarlar değiştirilmez, yalnız dipnot verilir", "Yönetim isterse düzeltme yapar", "Olay hiçbir şekilde dikkate alınmaz"], "a": 0, "e": "Dönem sonunda mevcut durumu teyit eden olaylar düzeltme gerektiren olaylardır ve tutarlar düzeltilir."}, {"q": "Bir yüklenici 10.000 TL bedelli bir inşa sözleşmesinde toplam maliyeti 8.000 TL tahmin etmektedir. Dönem sonuna kadar 2.000 TL maliyete katlanılmıştır ve sonuç güvenilir tahmin edilebilmektedir. Tamamlanma yüzdesi yöntemine göre döneme ait hasılat ve kâr kaçtır?", "o": ["Hasılat 2.000 TL, kâr 0 TL", "Hasılat 2.500 TL, kâr 2.000 TL", "Hasılat 10.000 TL, kâr 2.000 TL", "Hasılat 2.500 TL, kâr 500 TL", "Hasılat 8.000 TL, kâr 500 TL"], "a": 3, "e": "Tamamlanma = 2.000 / 8.000 = %25. Hasılat 10.000 × %25 = 2.500 TL; maliyet 2.000 TL; kâr 500 TL."}, {"q": "Bir işletme ithal ettiği mal için 1.000 TL alış fiyatı, 50 TL gümrük vergisi, ileride iade alacağı 180 TL KDV ve 30 TL taşıma gideri ödemiş, satıcıdan 40 TL ticari iskonto almıştır. TMS 2'ye göre stok maliyeti kaçtır?", "o": ["1.080 TL", "1.040 TL", "1.220 TL", "1.260 TL", "1.000 TL"], "a": 1, "e": "İade alınabilecek vergiler hariç tutulur, ticari iskonto düşülür: 1.000 + 50 + 30 − 40 = 1.040 TL."}, {"q": "Maliyeti 120 TL olan bir mamulün tahmini satış fiyatı 130 TL, tahmini tamamlama maliyeti 15 TL ve tahmini satış gideri 5 TL'dir. Dönem sonu bilanço değeri ve değer düşüklüğü zararı nedir?", "o": ["120 TL; zarar yok", "130 TL; zarar yok", "110 TL; 10 TL zarar doğrudan özkaynaklara", "115 TL; 5 TL zarar", "110 TL; 10 TL zarar \"Satışların Maliyeti\"ne"], "a": 4, "e": "NGD = 130 − 15 − 5 = 110 TL. Maliyet ile NGD'den düşük olanı 110 TL; 10 TL değer düşüklüğü Satışların Maliyeti kalemine yansıtılır."}, {"q": "Maliyeti 100 TL olan bir stok geçen dönem 80 TL'ye indirilmiştir. Bu dönem ekonomik koşullar düzelmiş ve NGD 110 TL'ye çıkmıştır. Stokun yeni defter değeri kaç TL olur?", "o": ["80 TL", "90 TL", "100 TL", "110 TL", "120 TL"], "a": 2, "e": "Değer düşüklüğü iptal edilir ancak yeni değer maliyet bedelini aşamaz; iptal en fazla 20 TL olup defter değeri 100 TL olur."}, {"q": "TMS 2'ye göre aşağıdakilerden hangisi stok maliyetine dâhil edilmez, oluştuğu dönemde gider yazılır?", "o": ["Direkt işçilik giderleri", "Normalin üstünde gerçekleşen hammadde fire ve kayıpları", "Hammaddenin işletmeye taşınma maliyeti", "Sabit genel üretim giderlerinden sistematik pay", "İthalat vergileri"], "a": 1, "e": "Normalin üstündeki fire ve kayıplar, gereksiz depolama, katkısı olmayan genel yönetim giderleri ve satış giderleri dönem gideridir."}, {"q": "Bir finansal aracın beklenen ömrü boyunca tahmini nakit ödeme ve tahsilatlarını net defter değerine tam olarak indirgeyen orana ne ad verilir?", "o": ["Nominal faiz oranı", "Zımni faiz oranı", "Risksiz faiz oranı", "Alternatif borçlanma oranı", "Etkin faiz oranı"], "a": 4, "e": "Etkin faiz oranı, aracın iç verim oranıdır ve itfa edilmiş maliyetin hesaplanmasında kullanılır."}, {"q": "Bir finansal varlığın tablo dışı bırakılması için aşağıdakilerden hangisi yeterli değildir?", "o": ["Nakit akışlarına ilişkin sözleşmeden doğan hakların süresinin dolması", "Risk ve getirilerin tamamına yakınının karşı tarafa devredilmesi", "Varlığın gerçeğe uygun değerinin defter değerinin altına düşmesi", "Değerin geri kazanılmasına ilişkin makul beklentinin kalmaması", "Kontrolün, varlığı tek taraflı ve kısıtsız satabilecek bir tarafa devredilmesi"], "a": 2, "e": "GUD'nin düşmesi değer düşüklüğü veya ölçüm konusudur; tablo dışı bırakma nedeni değildir."}, {"q": "A şirketi, B şirketinin oy haklarının %30'unu 1.000 TL'ye edinmiştir ve aksi kanıtlanmadığı için önemli etki sahibidir. B şirketi yıl içinde 400 TL kâr etmiş ve toplam 100 TL kâr payı dağıtmıştır. Özkaynak yöntemine göre yıl sonu yatırım tutarı kaçtır?", "o": ["1.090 TL", "1.030 TL", "1.000 TL", "1.120 TL", "1.300 TL"], "a": 0, "e": "Kârdan pay 400 × %30 = 120 TL defter değerini artırır, alınan kâr payı 100 × %30 = 30 TL azaltır: 1.000 + 120 − 30 = 1.090 TL."}, {"q": "Konsolide finansal tablolar standardının kitaptaki özetine göre, aksi açıkça ortaya konulmadıkça bir işletme üzerinde kontrol bulunduğunu (bağlı ortaklık) gösteren temel ölçüt hangisidir?", "o": ["Oy haklarının en az %20'sine sahip olunması", "Sermayenin en az %10'una sahip olunması", "Stratejik kararların oy birliğiyle alınması", "Oy haklarının yarısından fazlasına sahip olunması (aksi kanıtlanmadıkça)", "Yönetim kurulunda en az bir üye bulundurulması"], "a": 3, "e": "Oy haklarının yarısından fazlasına sahip yatırımcının, aksi kanıtlanmadıkça kontrolü olduğu kabul edilir; %20 önemli etki (iştirak), oy birliği müşterek kontroldür. Tekdüzen hesap planında ise 245 hesabında yönetim çoğunluğunu seçme hakkı esas alınır."}, {"q": "Maliyeti 1.000.000 TL, kalıntı değeri 100.000 TL, faydalı ömrü 5 yıl olan bir makine doğrusal yöntemle amortismana tabi tutulmaktadır. Yıllık amortisman gideri kaçtır?", "o": ["200.000 TL", "220.000 TL", "180.000 TL", "100.000 TL", "225.000 TL"], "a": 2, "e": "Amortismana tabi tutar = maliyet − kalıntı değer = 900.000 TL; 900.000 / 5 = 180.000 TL."}, {"q": "TMS 16'ya göre aşağıdakilerden hangisi yanlıştır?", "o": ["Yeniden değerleme modelinde amortisman ayrılması ihtiyaridir", "Seçilen değerleme modeli ilgili maddi duran varlık sınıfının tümüne uygulanır", "Bir yıldan uzun vadeli alımda vade farkı ayrıştırılarak peşin fiyat esas alınır", "Farklı faydalı ömre sahip önemli parçalar ayrı amortismana tabi tutulabilir", "Arsa ve araziler amortismana tabi değildir"], "a": 0, "e": "Maddi duran varlıklar için amortisman ayrılması zorunludur; model seçimi bunu değiştirmez."}, {"q": "Yatırım amaçlı gayrimenkullere ilişkin hangisi doğrudur?", "o": ["Her gayrimenkul için ayrı model seçilebilir", "Yalnızca kira geliri için tutulanlar bu kapsamdadır", "İlk kayıtta gerçeğe uygun değerle ölçülür", "GUD yöntemi seçildikten sonra politika değişikliğiyle maliyet yöntemine geçilmez", "Amaç değişse bile stoklara aktarılamaz"], "a": 3, "e": "GUD veya maliyet yöntemi tüm YAG'a uygulanır; GUD seçildikten sonra maliyet yöntemine geçilmez. İlk kayıt maliyetledir."}, {"q": "İşletme içi bir projenin araştırma safhasında yapılan harcamalar nasıl muhasebeleştirilir?", "o": ["Maddi olmayan duran varlık olarak aktifleştirilir", "Gerçekleştiklerinde gider olarak", "Proje tamamlanınca aktifleştirilir", "Stok maliyetine eklenir", "Ertelenmiş gelir olarak"], "a": 1, "e": "Araştırma safhasında gelecekte fayda sağlayacak bir varlığın mevcudiyeti gösterilemediğinden harcamalar gider yazılır; geliştirme ise koşullar sağlanırsa aktifleştirilir."}, {"q": "Bir kiracı, yıl sonlarında ödenecek 3 yıllık 100.000 TL kira için zımni faiz oranını kolayca belirleyememektedir; alternatif borçlanma faiz oranı %12'dir. Kiralamanın başladığı tarihte kira yükümlülüğü yaklaşık kaçtır?", "o": ["300.000 TL", "268.000 TL", "212.600 TL", "264.000 TL", "240.183 TL"], "a": 4, "e": "Zımni oran belirlenemediğinden alternatif borçlanma oranı kullanılır: 100.000/1,12 + 100.000/1,12² + 100.000/1,12³ ≈ 240.183 TL."}, {"q": "Bir varlığın defter değeri 500 TL, satış maliyetleri düşülmüş gerçeğe uygun değeri 420 TL ve kullanım değeri 450 TL'dir. TMS 36'ya göre kaydedilecek değer düşüklüğü zararı kaçtır?", "o": ["0 TL", "30 TL", "80 TL", "50 TL", "130 TL"], "a": 3, "e": "Geri kazanılabilir tutar iki değerden yüksek olanıdır: 450 TL. Zarar 500 − 450 = 50 TL."}, {"q": "Bir makinenin önümüzdeki 3 yıl her yıl sonunda 100 TL net nakit girişi sağlaması beklenmekte, uygun iskonto oranı %10'dur. Defter değeri 260 TL ve satış maliyetleri düşülmüş GUD 230 TL ise değer düşüklüğü zararı yaklaşık kaçtır?", "o": ["0 TL", "11,31 TL", "30 TL", "40 TL", "51,31 TL"], "a": 1, "e": "Kullanım değeri ≈ 90,91 + 82,64 + 75,13 = 248,69 TL; geri kazanılabilir tutar max(230; 248,69) = 248,69. Zarar 260 − 248,69 ≈ 11,31 TL."}, {"q": "TMS 37'ye göre aşağıdakilerden hangisi doğrudur?", "o": ["Koşullu varlıklar bilançoda gösterilir", "Her koşullu borç aynı zamanda karşılıktır", "Kaynak çıkışı kesin olan yükümlülük karşılık olarak sınıflanır", "Zımni yükümlülükten karşılık doğmaz", "Her karşılık tanımı gereği koşullu borçtur, ancak her koşullu borç karşılık olma şartlarını taşımaz"], "a": 4, "e": "Kitaba göre her karşılık koşullu borçtur ama her koşullu borç karşılık değildir; kesin çıkış ticari borçtur, koşullu varlıklar tablolarda yer almaz."}, {"q": "Geçerli para birimi TL olan bir işletme 10.000 USD tutarındaki ticari alacağını işlem tarihinde 1 USD = 30 TL kurundan kaydetmiştir. Dönem sonu kapanış kuru 32 TL ise TMS 21'e göre hangisi doğrudur?", "o": ["Alacak 300.000 TL'de kalır, kur farkı oluşmaz", "Alacak 320.000 TL'ye çevrilir; fark özkaynaklarda izlenir", "Alacak 320.000 TL'ye çevrilir; 20.000 TL kur farkı geliri kâr veya zarara yansır", "Alacak parasal olmayan kalem olduğundan işlem kurunda kalır", "Alacak 310.000 TL ortalama kurla gösterilir"], "a": 2, "e": "Alacak parasal kalemdir; kapanış kuruyla çevrilir ve kur farkı oluştuğu dönemde kâr veya zarara yansıtılır: 10.000 × (32 − 30) = 20.000 TL."}, {"q": "Geçerli para birimi TL olan bir işletmede yıllık TÜFE artışları son üç dönemde sırasıyla %30, %40 ve %15'tir. TMS 29 açısından sonuç nedir?", "o": ["Kümülatif artış yaklaşık %109 (>%100) ve cari dönem %15 (>%10) olduğundan düzeltme gerekir", "Kümülatif artış %85 olduğundan düzeltme gerekmez", "Cari dönem %15 olduğundan tek başına düzeltme gerekir", "Üç yılın ortalaması %28 olduğundan düzeltme gerekmez", "Yalnızca son 12 aya bakılır, düzeltme gerekmez"], "a": 0, "e": "Kümülatif: 1,30 × 1,40 × 1,15 − 1 ≈ %109,3. Son üç dönemde %100'ü ve cari dönemde %10'u aşan TÜFE artışı düzeltmeyi zorunlu kılar; oranlar toplanmaz, bileşik hesaplanır."}]}, {"id": 10, "kisa": "SPK Tebliği II-14.1", "baslik": "Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği (II-14.1)", "ozet": "Tebliğin kapsamı, yıllık ve ara dönem rapor yükümlülüğü, bildirim süreleri, KAP ve Kurul bildirimi, sorumluluk beyanı, ilan, SP muhasebe defteri ve muafiyetler.", "notlar": "<h3>Tebliğin amacı ve kapsamı<\/h3>\n<ul>\n<li><b>Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği (II-14.1)<\/b>: 13.06.2013 tarihli, 28676 sayılı RG. Amaç: kamunun zamanında, yeterli ve doğru aydınlatılması için finansal raporların hazırlanması ve sunulmasına ilişkin ilke, usul ve esaslar.<\/li>\n<li><b>İşletme<\/b> = yatırım fonları ile konut finansmanı ve varlık finansmanı fonları <b>dışında kalan<\/b> ihraççılar ve sermaye piyasası kurumları.<\/li>\n<li>SPKn'de <b>ihraççı<\/b>: kitle fonlaması platformlarıyla para toplayanlar hariç, sermaye piyasası aracı ihraç eden, ihraç için Kurula başvuran veya araçları halka arz edilen tüzel kişiler ve Kanuna tabi yatırım fonları.<\/li>\n<li><b>Sermaye piyasası kurumları (SPKn m.35):<\/b> yatırım kuruluşları; kolektif yatırım kuruluşları; bağımsız denetim, değerleme ve derecelendirme kuruluşları; portföy yönetim şirketleri; ipotek finansmanı kuruluşları; konut ve varlık finansmanı fonları; varlık kiralama şirketleri; merkezî takas, merkezî saklama ve veri depolama kuruluşları; Kurulca belirlenen diğerleri.<\/li>\n<\/ul>\n<table>\n<tr><th>Özel durum<\/th><th>Tebliğ uygulaması<\/th><\/tr>\n<tr><td>İşlem sırası geçici durdurulan işletme<\/td><td>Borsada işlem gören işletme sayılır.<\/td><\/tr>\n<tr><td>Pay dışı aracı yurt içinde ihraç eden halka açık olmayan işletme<\/td><td>Araçların <b>itfa tarihine kadar<\/b> tabidir (son bildirim tarihi esas).<\/td><\/tr>\n<tr><td>İhraç belgesi/izahname geçerli ama son bildirim tarihinde tedavülde aracı olmayan halka açık olmayan işletme<\/td><td>Belgenin <b>geçerlilik süresi boyunca<\/b> tabidir.<\/td><\/tr>\n<tr><td>Halka açık olmayan ortaklığın <b>münhasıran yurt dışında<\/b> pay dışı araç ihracı<\/td><td>Raporlama yükümlülüğü bakımından Tebliğ <b>uygulanmaz<\/b>.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Tablolar KGK'nın yayımladığı <b>TMS/TFRS<\/b> esas alınarak hazırlanır (Tebliğ m.5/1). Açıklık ve uygulama birliği için Kurul SPKn <b>m.14<\/b> kapsamında kararlar alır; işletmeler bunlara uymak zorundadır (m.5/2).<\/li>\n<\/ul>\n\n<h3>Yıllık ve ara dönem rapor düzenleme yükümlülüğü<\/h3>\n<ul>\n<li>Tebliğ kapsamındaki <b>tüm işletmeler<\/b> yıllık finansal rapor düzenler.<\/li>\n<li><b>3, 6 ve 9 aylık<\/b> ara dönem raporu düzenleyenler: araçları borsada veya teşkilatlanmış pazar yerinde işlem gören işletmeler, yatırım kuruluşları, yatırım ortaklıkları, portföy yönetim şirketleri ve ipotek finansmanı kuruluşları.<\/li>\n<li>Konsolide tablo hazırlama yükümlüsü <b>yatırım ortaklıkları<\/b>, yıllık ve ara dönemde konsolide tablolarla birlikte <b>bireysel<\/b> tablolarını da hazırlar ve birlikte bildirir.<\/li>\n<\/ul>\n\n<h3>Faaliyet raporları<\/h3>\n<ul>\n<li>Yıllık faaliyet raporu, 28/8/2012 tarihli (RG 28395) <b>\"Şirketlerin Yıllık Faaliyet Raporunun Asgari İçeriğinin Belirlenmesi Hakkında Yönetmelik\"<\/b>e göre hazırlanır; <b>süreler bakımından Tebliğ<\/b> uygulanır.<\/li>\n<li>Yıllık rapora ayrıca eklenenler: YK üyeleri ve üst yöneticilerin yetki sınırları ve görev süreleri (başlangıç-bitiş), toplu sözleşme, personel hakları; sektör ve sektördeki yer, üretim, satış miktar ve fiyatları, verimlilik oranları; yatırımlar ve teşvikler; finansman kaynakları ve ihraç edilmiş araçlar; esas sözleşme değişiklikleri; varsa <b>Kurumsal Yönetim İlkelerine Uyum Raporu<\/b>; ilişkili taraf bilgileri; tablolarda olmayan faydalı diğer hususlar.<\/li>\n<li>Ara dönem faaliyet raporu: ara dönemi ilgilendiren önemli olaylar, tablolara etkileri ve dönemin kalanı için önemli risk ve belirsizlikler.<\/li>\n<li><b>Ticari sır<\/b> niteliğindeki bilgiler bu niteliği korudukça rapora konmayabilir; niteliği kaybettikten sonraki <b>ilk faaliyet raporunda<\/b> açıklanır.<\/li>\n<\/ul>\n\n<h3>Sorumluluk ve sorumluluk beyanı<\/h3>\n<ul>\n<li>Raporların hazırlanması, sunulması, gerçeğe uygunluğu ve doğruluğundan <b>işletme<\/b> ile kusurlarına ve durumun gereklerine göre <b>YK üyeleri<\/b> sorumludur. YK, tablo ve faaliyet raporunun kabulü için <b>ayrı bir karar<\/b> alır.<\/li>\n<li>YK, Kurumsal Yönetim İlkeleri uyarınca seçilen <b>denetim komitesini<\/b>, yoksa üyeleri arasından <b>en az bir üyeyi<\/b> finansal raporlamadan sorumlu belirler. Bu, YK'nın sorumluluğunu kaldırmaz.<\/li>\n<li><b>Sorumluluk beyanı<\/b>: raporlamadan sorumlu YK üyeleri ile genel müdür veya raporlamadan sorumlu yönetici imzalar. İçerik: (a) tablo ve raporu incelediklerini; (b) bildikleri çerçevede önemli konularda gerçeğe aykırı açıklama veya yanıltıcı eksiklik bulunmadığını; (c) tabloların (konsolidasyondakilerle birlikte) aktif, pasif, finansal durum ve kâr-zararı dürüstçe yansıttığını, faaliyet raporunun gelişimi, performansı, önemli risk ve belirsizlikleri dürüstçe yansıttığını.<\/li>\n<li>YK, imza yükümlülerinin bağlı ortaklık, iştirak ve iş ortaklıklarıyla ilgili önemli bilgilere ulaşmasını sağlar. İmza yükümlüleri iç kontrol ve bilgiye ulaşma sistemine ilişkin eleştiri ve önerilerini YK'ya, denetimden sorumlu komiteye ve <b>bağımsız denetim kuruluşuna<\/b> bildirir.<\/li>\n<\/ul>\n\n<h3>Bildirim süreleri<\/h3>\n<table>\n<tr><th>Rapor<\/th><th>Konsolide yok<\/th><th>Konsolide var<\/th><\/tr>\n<tr><td>Yıllık (araçları borsada işlem gören; bağımsız denetim raporuyla birlikte)<\/td><td><b>60 gün<\/b><\/td><td><b>70 gün<\/b><\/td><\/tr>\n<tr><td>Ara dönem (tüm işletmeler)<\/td><td><b>30 gün<\/b><\/td><td><b>40 gün<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Ara dönem tabloları Kurul düzenlemelerine göre <b>sınırlı bağımsız denetime (incelemeye)<\/b> tabiyse ek süre: araçları borsada işlem görenler <b>+10 gün<\/b>, diğer işletmeler <b>+15 gün<\/b>.<\/li>\n<li>Süreler hesap döneminin veya ara dönemin <b>bitimini izleyen<\/b> günlerle sayılır. Son gün resmî tatile denk gelirse <b>izleyen ilk iş günü<\/b> son bildirim tarihidir.<\/li>\n<li><b>Halka açık ortaklıklar<\/b> yıllık raporu ve denetim raporunu, raporların görüşüleceği genel kuruldan <b>en az 3 hafta önce<\/b>; diğer işletmeler <b>TTK m.437<\/b>'deki süreye (genel kuruldan <b>en az 15 gün önce<\/b>) uyarak bildirir.<\/li>\n<li><b>Dikkat:<\/b> her hâlükârda yıllık raporlar hesap döneminin bitimini izleyen <b>üçüncü ayın sonuna<\/b> kadar bildirilir.<\/li>\n<li>Kurumca kabul edilecek <b>makul gerekçe<\/b> varsa, denetimden sorumlu komite (yoksa raporlamadan sorumlu YK üyesi veya genel müdür) başvurusuyla ek süre verilebilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Örnek (31 Aralık / 30 Haziran sonlu dönemler)<\/th><th>Süre<\/th><\/tr>\n<tr><td>Borsa şirketi, yıllık, konsolide yok<\/td><td>60 gün<\/td><\/tr>\n<tr><td>Borsa şirketi, yıllık, konsolide<\/td><td>70 gün<\/td><\/tr>\n<tr><td>Borsa şirketi, 6 aylık, konsolide, sınırlı denetimli<\/td><td>40 + 10 = 50 gün (30 Haziran → 19 Ağustos)<\/td><\/tr>\n<tr><td>Borsada işlem görmeyen işletme, 6 aylık, konsolide yok, sınırlı denetimli<\/td><td>30 + 15 = 45 gün<\/td><\/tr>\n<\/table>\n\n<h3>KAP'a mı, Kurula mı?<\/h3>\n<table>\n<tr><th>KAP'a bildirenler (kamuya açıklanmak üzere)<\/th><th>Kurula bildirenler<\/th><\/tr>\n<tr><td>Araçları borsada veya teşkilatlanmış pazar yerinde işlem gören işletmeler; portföy yönetim şirketleri; yatırım kuruluşları<\/td><td>Borsada işlem görmeyen halka açık ortaklıklar; araçlarını yalnız nitelikli yatırımcıya satan ve borsada işlem görmeyenler; pay dışı aracı tahsisli ihraç eden halka açık olmayanlar; halka arz veya nitelikli satışını henüz yapmamış yatırım ortaklıkları; varlık kiralama şirketleri; bağımsız denetim, gayrimenkul değerleme ve derecelendirme kuruluşları; ipotek finansmanı kuruluşları; merkezi takas, saklama ve veri depolama kuruluşları; Kurulca belirlenen diğer kurumlar<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kurula bildirenlerin araçları borsada işlem görmeye başlarsa, bu süre boyunca borsa şirketlerinin bildirim esaslarına uyar.<\/li>\n<li>Yalnız nitelikli yatırımcıya satanlar ile tahsisli pay dışı araç ihraç edenler, tüm ihraçlar itfa edilene kadar ihraç belgesinde belirttikleri yöntemle yatırımcıların raporlara eşit erişimini sağlar; isterlerse KAP'a bildirerek yükümlülüklerini yerine getirmiş sayılırlar.<\/li>\n<li>Kurul, borsada işlem görmeyen halka açık ortaklıkların raporlarını <b>internet sitesinde<\/b> açıklar; diğer Kurula bildirenlerden gerekli görülenleri de yayımlar.<\/li>\n<\/ul>\n\n<h3>Bildirim usulü<\/h3>\n<ul>\n<li><b>Denetimden geçmiş<\/b> rapor: denetim raporunun, denetim kuruluşunu temsil ve ilzama yetkili kişinin imzalı yazısıyla işletmeye ulaştığı ve <b>aynı gün<\/b> kabul ve bildirim YK kararının alındığı tarihi izleyen <b>ilk iş günü sonuna<\/b> kadar.<\/li>\n<li><b>Denetimden geçmemiş<\/b> rapor: kabul ve bildirim YK kararının alındığı tarihi izleyen ilk iş günü sonuna kadar.<\/li>\n<li>Borsa şirketleri KAP bildirimlerini <b>seans saatleri dışında<\/b> yapmak zorundadır.<\/li>\n<li>Süreler içinde kalmak şartıyla tablolar faaliyet raporundan <b>önce<\/b> bildirilebilir; bu durumda <b>ayrı ayrı<\/b> YK kararı ve sorumluluk beyanı gerekir.<\/li>\n<li>Bağlı ortaklık, iş ortaklığı veya iştirak, raporlarını ana ortaklık/yatırımcı ile <b>aynı anda veya daha önce<\/b> bildirir. Ana ortaklığı yurt dışında olan bunu yapamazsa Tebliğ esaslarına uyar.<\/li>\n<li>Bildirilen rapor ile genel kurulda kabul edilen rapor farklıysa, denetim raporu ve sorumluluk beyanının yeniden düzenlenmesi beklenmeksizin genel kurulda kabul edilen rapor <b>yeniden bildirilir ve ilan edilir<\/b>; bu hüküm genel kurulun Tebliğe aykırı karar almasına yol açacak şekilde uygulanamaz.<\/li>\n<\/ul>\n\n<h3>İnternet sitesinde ilan ve genel kurul öncesi inceleme<\/h3>\n<ul>\n<li>KAP'a bildiren işletmeler yıllık ve ara dönem raporlarını kamuya açıklandıktan sonra kendi internet sitelerinde ilan eder; bilgiler <b>en az 5 yıl<\/b> açık tutulur.<\/li>\n<li>Birden fazla site varsa <b>tescil edilen sitede zorunlu<\/b>, diğerlerinde ihtiyari; tescilli sitede diğer sitelerin bağlantıları verilir. Borsada işlem görmeyen halka açık ortaklıkların sitesi varsa aynı yükümlülüğe uyar.<\/li>\n<li>Halka açık ortaklıklar yıllık rapor ve denetim raporunu genel kuruldan <b>en az üç hafta önce<\/b> merkez ve şubelerde hazır bulundurur, isteyene gönderir; basım ve ulaştırma bedeli talep edilebilir. Diğerleri için <b>TTK m.437<\/b>.<\/li>\n<\/ul>\n\n<h3>Özet bilgi, diğer mevzuat tabloları ve SP muhasebe defteri<\/h3>\n<ul>\n<li><b>Özet bilgi<\/b>: raporlar Tebliğe göre açıklanmışsa türetilmiş özet bilgi açıklanabilir; asıl rapora nasıl ulaşılacağı belirtilir; önceden belirlenmiş sonuca yönelik ve yanıltıcı olamaz.<\/li>\n<li>Vergi gibi diğer mevzuat tabloları hazırlanabilir; ancak sermaye piyasası mevzuatı uyarınca kamuya açıklanacak tablolar Tebliğe uygun olmalıdır. Diğer kurumun bilgiyi kamuya açık tuttuğu ve o dönem için Tebliğe göre tablo açıklanmamışsa, bu bilgiler ilgili mercilerle <b>eş zamanlı<\/b> kamuya açıklanır.<\/li>\n<li><b>Dikkat:<\/b> kamuya açıklamalarda Tebliğe uygun olmayan raporlar veya verileri kullanılırsa, araç değerini etkileyecek önemli hususlarda <b>gerçeğe aykırı veya eksik bilgi verilmiş<\/b> sayılır.<\/li>\n<li><b>Sermaye Piyasası Muhasebe Defteri:<\/b> Tebliğ hesaplamaları için kanuni defterlere yeni kayıt yapılamaz, kayıtlar değiştirilemez. Defter kayıtları ile Tebliğe göre tablolar arasındaki ilişkiyi kurmak için tutulur; tüm açılış ve cari dönem düzeltme ve sınıflandırma kayıtları ayrı ayrı yazılır.<\/li>\n<li>Elektronik veya yazılı tutulabilir. Yazılıysa sayfalar <b>müteselsil sıra numaralı<\/b>, temsile yetkililerce imzalı ve <b>TTK'daki ticari defter saklama süresi<\/b> kadar saklanır. Elektronikte YK değiştirilmeme ve saklama önlemini alır. Gerekli belgeler de deftere sistematik bağlanarak TTK süresince saklanır.<\/li>\n<\/ul>\n\n<h3>Bağımsız denetim, muafiyetler ve özel durumlar<\/h3>\n<ul>\n<li>Raporların denetiminde Kurulun bağımsız denetim düzenlemelerine uyulur. Konsolide denetimde bilgi ve belge temini <b>ana ortaklığın<\/b> sorumluluğundadır. Faaliyet raporunun denetimi, içindeki finansal bilgilerin denetlenmiş tablolarla <b>tutarlılığı<\/b> ve gerçeği yansıtıp yansıtmadığını kapsar.<\/li>\n<\/ul>\n<table>\n<tr><th>Muafiyet<\/th><th>Kimler<\/th><\/tr>\n<tr><td>Ara dönem finansal raporun tamamından (son bildirim tarihi itibarıyla)<\/td><td>Araçlarının işlem sırası <b>30 günden fazla<\/b> durdurulanlar; borsa kotundan sürekli çıkarılanlar; faaliyeti geçici durdurulan SP kurumları; tasfiye hâlindekiler.<\/td><\/tr>\n<tr><td><b>3 ve 9 aylık<\/b> ara dönem finansal rapordan<\/td><td>Payları <b>Piyasa Öncesi İşlem Platformu<\/b>'nda (PÖİP) işlem görenler; araçları borsada yalnız nitelikli yatırımcılar arasında işlem görenler; araçlarını yalnız nitelikli yatırımcıya satan yatırım ortaklıkları; halka arzını veya nitelikli satışını henüz yapmamış yatırım ortaklıkları.<\/td><\/tr>\n<tr><td>Ara dönem <b>faaliyet raporu<\/b>ndan<\/td><td>PÖİP'te işlem görenler; araçları borsada işlem görmeyen yatırım kuruluşları.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>İlke kararı i-SPK.II-17.6<\/b> (15.10.2020, 64/1284): GİP kaldırıldığından GİP şirketleri <b>Alt Pazar<\/b> yükümlülüklerine tabidir; Tebliğ m.22 kapsamında yalnız <b>30.09.2020<\/b> tarihli ara dönem tablolarından muaf tutuldular.<\/li>\n<li><b>Fiili dolaşım oranı %5'in altına<\/b> düştüğü için PÖİP'e alınacak ortaklıklara 3 ve 9 aylık ara dönem rapor, 6 aylık ara dönem faaliyet raporu ve 6 aylık sınırlı denetim muafiyetleri <b>uygulanmaz<\/b>.<\/li>\n<li><b>Tasfiye hâlindekiler:<\/b> İcra ve İflas Kanunu (2004), TTK ve ilgili mevzuata göre finansal rapor yerine geçen belgeleri düzenlemeleri yükümlülüğü karşılar (SPKn m.16 ve m.33 saklı). Belgeler Kurula bildirilir, Kurul internet sitesinde duyurur; işletmenin sitesi varsa orada da ilan edilir.<\/li>\n<li><b>Payları borsada işlem görmeyen halka açık ortaklıklar:<\/b> KGK'ya göre TMS/TFRS yükümlüsü değilse, borsada işlem görünceye veya Kanun kapsamından çıkıncaya kadar TTK m.88 ve Geçici m.1 çerçevesinde KGK esaslarına göre hazırlar; isterse TMS/TFRS seçer. Seçen, <b>makul gerekçe olmadıkça<\/b> standardını değiştiremez.<\/li>\n<\/ul>", "sorular": [{"q": "II-14.1 sayılı Tebliğde \"işletme\" tanımının dışında bırakılanlar hangileridir?", "o": ["Portföy yönetim şirketleri", "Yatırım fonları ile konut finansmanı ve varlık finansmanı fonları", "Varlık kiralama şirketleri", "Bağımsız denetim kuruluşları", "Yatırım kuruluşları"], "a": 1, "e": "Tebliğde işletme, yatırım fonları ile konut finansmanı ve varlık finansmanı fonları dışında kalan ihraççılar ve sermaye piyasası kurumlarıdır."}, {"q": "Halka açık olmayan bir ortaklığın münhasıran yurt dışında gerçekleştirdiği pay dışındaki sermaye piyasası aracı ihracı bakımından Tebliğin finansal raporlama hükümleri için hangisi doğrudur?", "o": ["Araçların itfasına kadar uygulanır", "İhraç belgesinin geçerlilik süresince uygulanır", "Kurul onayıyla uygulanır", "Yalnızca yıllık raporlar için uygulanır", "Uygulanmaz"], "a": 4, "e": "Halka açık olmayan ortaklıkların münhasıran yurt dışındaki pay dışı ihraçlarında raporlama yükümlülüğü bakımından Tebliğ uygulanmaz."}, {"q": "Aşağıdakilerden hangisi Tebliğe göre 3, 6 ve 9 aylık ara dönem finansal rapor düzenlemekle yükümlü olanlar arasında sayılmamıştır?", "o": ["Araçları borsada işlem gören işletmeler", "Yatırım kuruluşları", "Gayrimenkul değerleme kuruluşları", "İpotek finansmanı kuruluşları", "Portföy yönetim şirketleri"], "a": 2, "e": "Ara dönem rapor yükümlüleri: borsa şirketleri, yatırım kuruluşları, yatırım ortaklıkları, PYŞ'ler ve ipotek finansmanı kuruluşlarıdır."}, {"q": "Payları borsada işlem gören ve konsolide finansal tablo hazırlama yükümlülüğü bulunmayan bir ortaklık, 31 Aralık'ta biten hesap dönemine ait yıllık finansal raporunu ve bağımsız denetim raporunu en geç kaç gün içinde bildirmelidir?", "o": ["60 gün", "40 gün", "30 gün", "70 gün", "90 gün"], "a": 0, "e": "Konsolide tablo yükümlülüğü yoksa yıllık rapor dönem bitimini izleyen 60 gün, varsa 70 gün içinde bildirilir."}, {"q": "Payları borsada işlem gören, konsolide tablo hazırlayan bir ortaklığın 6 aylık ara dönem tabloları sınırlı bağımsız denetime tabidir. Ara dönem 30 Haziran'da bittiğine göre son bildirim süresi kaç gündür?", "o": ["40 gün", "45 gün", "55 gün", "50 gün", "70 gün"], "a": 3, "e": "Konsolide ara dönem süresi 40 gündür; sınırlı denetim varsa borsa şirketleri için 10 gün eklenir: 40 + 10 = 50 gün (19 Ağustos)."}, {"q": "Araçları borsada işlem görmeyen bir yatırım kuruluşu konsolide tablo hazırlamamaktadır ve 6 aylık ara dönem tabloları incelemeye tabidir. Ara dönem raporunun bildirim süresi kaç gündür?", "o": ["30 gün", "40 gün", "45 gün", "50 gün", "55 gün"], "a": 2, "e": "Konsolide yoksa ara dönem süresi 30 gündür; sınırlı denetim varsa borsada işlem görmeyen işletmeler için 15 gün eklenir: 30 + 15 = 45 gün."}, {"q": "Payları borsada işlem gören, konsolide tablo hazırlamayan ve 3 aylık ara dönem tabloları sınırlı denetime tabi olmayan bir ortaklık, 31 Mart'ta biten ara dönem raporunu en geç hangi tarihte bildirmelidir (tatil olmadığı varsayılarak)?", "o": ["30 Nisan", "10 Mayıs", "15 Mayıs", "20 Mayıs", "31 Mayıs"], "a": 0, "e": "Konsolide yoksa ara dönem raporu 30 gün içinde bildirilir: 31 Mart + 30 gün = 30 Nisan."}, {"q": "Halka açık ortaklıklar yıllık finansal raporları ile bağımsız denetim raporlarını en geç ne zaman bildirmelidir?", "o": ["Genel kuruldan en az 15 gün önce", "Genel kurul gününe kadar", "Genel kuruldan en az 1 ay önce", "Genel kuruldan en az 3 hafta önce; her hâlükârda dönem bitimini izleyen üçüncü ayın sonuna kadar", "Dönem bitimini izleyen altıncı ayın sonuna kadar"], "a": 3, "e": "Halka açık ortaklıklar genel kuruldan en az 3 hafta önce bildirir; diğer işletmeler TTK m.437'deki 15 günlük süreye uyar. Her durumda üçüncü ayın sonu son sınırdır."}, {"q": "Aşağıdakilerden hangisi finansal raporlarını kamuya açıklanmak üzere KAP'a bildirmekle yükümlüdür?", "o": ["Varlık kiralama şirketleri", "Portföy yönetim şirketleri", "Bağımsız denetim kuruluşları", "Derecelendirme kuruluşları", "Merkezi saklama kuruluşları"], "a": 1, "e": "KAP'a bildirenler borsa şirketleri, PYŞ'ler ve yatırım kuruluşlarıdır; diğer şıklar raporlarını Kurula bildirir."}, {"q": "Bağımsız denetimden geçmiş bir yıllık finansal raporun KAP'a bildirimi için süre nasıl belirlenir?", "o": ["Denetim raporunun tarihinden itibaren 10 gün içinde", "Seans açılmadan önce aynı gün", "Genel kurul kararından sonraki ilk iş günü", "Denetim sözleşmesinin bitiminden itibaren 6 iş günü içinde", "Denetim raporunun yetkili kişinin imzalı yazısıyla işletmeye ulaştığı ve aynı gün kabul ve bildirim YK kararının alındığı tarihi izleyen ilk iş günü sonuna kadar"], "a": 4, "e": "Denetimden geçmiş raporlar, denetim raporunun işletmeye ulaştığı ve aynı gün YK kararının alındığı tarihi izleyen ilk iş günü sonuna kadar bildirilir."}, {"q": "Sermaye piyasası araçları borsada işlem gören işletmelerin Tebliğ kapsamındaki KAP bildirimlerinin zamanlamasına ilişkin kural hangisidir?", "o": ["Seans saatleri içinde yapılmalıdır", "Öğle arasında yapılmalıdır", "Yalnızca hafta sonu yapılmalıdır", "Seans saatleri dışında yapılmalıdır", "Zamanlama serbesttir"], "a": 3, "e": "Borsa şirketleri Tebliğ kapsamındaki KAP bildirimlerini seans saatleri dışında yapmak zorundadır."}, {"q": "Finansal tabloların yönetim kurulu faaliyet raporundan önce bildirilmesi için hangi koşul gerekir?", "o": ["Kurul izni alınmalıdır", "Bildirim süreleri içinde kalınmalı ve tablolar ile faaliyet raporu için ayrı ayrı YK kararı ve sorumluluk beyanı düzenlenmelidir", "Önce faaliyet raporu bildirilmelidir, aksi yasaktır", "Denetim komitesinin onayı yeterlidir", "Genel kurul kararı gerekir"], "a": 1, "e": "Sürelere uyulmak şartıyla tablolar önce bildirilebilir; bu durumda her biri için ayrı YK kararı ve ayrı sorumluluk beyanı gerekir."}, {"q": "KAP'a rapor bildiren işletmeler yıllık ve ara dönem finansal raporlarını internet sitelerinde en az ne kadar süre kamuya açık tutmalıdır?", "o": ["1 yıl", "3 yıl", "10 yıl", "8 yıl", "5 yıl"], "a": 4, "e": "Finansal raporlar internet sitesinde en az 5 yıl süreyle kamuya açık tutulur."}, {"q": "Sorumluluk beyanını imzalaması gerekenler kimlerdir?", "o": ["Yalnızca bağımsız denetçi", "Yalnızca yönetim kurulu başkanı", "Finansal raporlamadan sorumlu YK üyeleri ile genel müdür veya finansal raporlamadan sorumlu yönetici", "Genel kurul divan heyeti", "Denetim komitesinin tüm üyeleri ve iç denetçi"], "a": 2, "e": "Sorumluluk beyanı raporlamadan sorumlu YK üyeleri ile genel müdür veya raporlamadan sorumlu yönetici tarafından verilir."}, {"q": "Yönetim kurulunun finansal raporlamadan sorumlu olarak belirlediği denetim komitesi veya YK üyesi için hangisi doğrudur?", "o": ["Denetim komitesi yoksa YK üyeleri arasından en az bir üye belirlenir ve bu, YK'nın sorumluluğunu kaldırmaz", "Bu belirleme YK'nın sorumluluğunu tamamen ortadan kaldırır", "Bu görev mutlaka genel müdüre verilir", "Denetim komitesi yoksa bağımsız denetçi atanır", "Belirleme genel kurulca yapılır"], "a": 0, "e": "YK denetim komitesini, yoksa en az bir üyeyi raporlamadan sorumlu belirler; ancak YK'nın sorumluluğu devam eder."}, {"q": "Faaliyet raporlarında açıklanması gereken ancak ticari sır niteliği taşıyan bilgiler için hangisi doğrudur?", "o": ["Hiçbir zaman açıklanmaz", "Beş yıl sonra açıklanır", "Kurula gizli olarak bildirilir", "Yalnızca genel kurulda sözlü açıklanır", "Sır niteliğini koruduğu sürece rapora konmayabilir; niteliği kaybettikten sonraki ilk faaliyet raporunda açıklanır"], "a": 4, "e": "Ticari sırlar bu niteliklerini korudukça yer almayabilir; niteliği kaybettiği tarihten sonraki ilk faaliyet raporunda açıklanır."}, {"q": "Sermaye Piyasası Muhasebe Defterine ilişkin hangisi yanlıştır?", "o": ["Defter kayıtları ile Tebliğe göre hazırlanan tablolar arasındaki ilişkiyi kurmak için tutulur", "Elektronik ortamda veya yazılı olarak tutulabilir", "Tebliğ hesaplamaları nedeniyle kanuni defterlerdeki kayıtlar değiştirilerek tutulur", "Yazılı tutulan defterin sayfaları müteselsil sıra numaralı olur ve temsile yetkililerce imzalanır", "TTK'da ticari defterler için öngörülen süre kadar saklanır"], "a": 2, "e": "Tebliğ hesaplamaları nedeniyle kanuni defterlere yeni kayıt yapılamaz ve kayıtlar değiştirilemez; düzeltmeler SP Muhasebe Defterine ayrı ayrı yazılır."}, {"q": "İlgili ara dönem raporunun son bildirim tarihi itibarıyla aşağıdaki işletmelerden hangisi ara dönem finansal rapor düzenleme yükümlülüğünden muaf değildir?", "o": ["Araçlarının işlem sırası 20 gün süreyle durdurulmuş işletme", "Araçları borsa kotundan sürekli olarak çıkarılmış işletme", "Tasfiye hâlindeki işletme", "Faaliyeti geçici olarak durdurulmuş sermaye piyasası kurumu", "Araçlarının işlem sırası 45 gün süreyle durdurulmuş işletme"], "a": 0, "e": "Muafiyet işlem sırası 30 günden fazla durdurulanlar içindir; 20 günlük durdurma muafiyet sağlamaz."}, {"q": "Payları Piyasa Öncesi İşlem Platformunda işlem gören bir işletme (fiili dolaşım nedeniyle alınanlar hariç) hangi raporlardan muaftır?", "o": ["Yalnızca yıllık finansal rapordan", "Yalnızca 6 aylık ara dönem raporundan", "Tüm finansal raporlardan", "3 ve 9 aylık ara dönem finansal raporlar ile ara dönem faaliyet raporundan", "Hiçbir rapordan muaf değildir"], "a": 3, "e": "PÖİP'te işlem görenler 3 ve 9 aylık ara dönem finansal rapor ile ara dönem faaliyet raporundan muaftır; 6 aylık sınırlı denetim de uygulanmaz."}, {"q": "Fiili dolaşım oranı hangi seviyenin altına düştüğü için PÖİP'e alınan ortaklıklara, PÖİP için öngörülen ara dönem muafiyetleri uygulanmaz?", "o": ["%1", "%5", "%10", "%15", "%25"], "a": 1, "e": "İlke kararı i-SPK.II-17.6'ya göre fiili dolaşım oranı %5'in altına düştüğü için PÖİP'e alınan ortaklıklara bu muafiyetler uygulanmaz."}, {"q": "Bildirimi yapılan finansal raporlar ile genel kurulda kabul edilen finansal raporlar arasında fark bulunması hâlinde ne yapılır?", "o": ["Bağımsız denetim raporu ve sorumluluk beyanının yeniden düzenlenmesi beklenmeksizin genel kurulda kabul edilen raporlar tekrar bildirilir ve ilan edilir", "Fark önemsizse bir şey yapılmaz", "Genel kurul kararı iptal edilir", "Raporlar bir sonraki yıl düzeltilir", "Kurul raporları re'sen düzeltir"], "a": 0, "e": "Genel kurulda kabul edilen raporların, denetim raporu ve sorumluluk beyanı yeniden düzenlenmeden tekrar bildirimi ve ilanı zorunludur."}, {"q": "KGK'ya göre TMS/TFRS yükümlülüğü bulunmayan ve payları borsada işlem görmeyen bir halka açık ortaklık isteğe bağlı olarak TMS/TFRS'yi seçmiştir. Hangisi doğrudur?", "o": ["Her yıl serbestçe standart değiştirebilir", "Kurul izniyle KÜMİ FRS'ye geçer", "İki yıl sonra zorunlu olarak BOBİ FRS'ye döner", "Makul bir gerekçesi bulunmadıkça uyguladığı standardı değiştiremez", "TMS/TFRS'yi seçemez"], "a": 3, "e": "TMS/TFRS'yi seçen bu ortaklıklar makul gerekçe olmadıkça uyguladıkları standardı değiştiremez."}]}, {"id": 11, "kisa": "Denetimin Temel Kavramları", "baslik": "Bağımsız Denetim: Temel Kavramlar, Yaklaşımlar ve Risk", "ozet": "Denetimin amacı ve türleri, denetçi türleri, standartlar, geleneksel ve risk tabanlı yaklaşım, denetim riski modeli, önemlilik, kanıt, prosedürler ve görüş türleri.", "notlar": "<h3>Bağımsız denetim çerçevesi<\/h3>\n<ul>\n<li>Denetim; kalkınma, sosyal refah ve <b>hesap verme<\/b> (accountability) ile <b>sorumluluk<\/b> (responsibility) ilkelerine dayalı demokratik yönetimin aracıdır. Kamusal alanda <b>13. yüzyıldan<\/b> itibaren kurumsallaşmaya başladı; özel sektörde önemi Sanayi Devrimi sonrasında arttı.<\/li>\n<li>Denetim teftiş, kontrol, revizyon gibi deyimlerle karıştırılsa da amacı hata ve yolsuzluğu ve sorumlularını bulmaktan çok <b>hata ve yolsuzluk riskini en aza indirmek<\/b>, kaynakların etkin, verimli ve tutumlu kullanılmasına rehberlik etmektir.<\/li>\n<li><b>Vekâlet teorisi (asil-vekil ilişkisi):<\/b> temelleri <b>Max Weber<\/b>'e (Ekonomi ve Toplum, 1920) dayanır. Shavell'e (1979) göre asil adına vekilin ücret karşılığı hizmet yaptığı sözleşmedir. Sorun; asilin tam bilgi sahibi olmaması veya bunun pahalı olması, risk üstlenimi, çaba-sonuç-ücret ilişkisinin doğrusal olmaması, çıkar çatışması ve <b>ahlaki tehlike<\/b> varsa ortaya çıkar. Farklı motivasyonlar ve <b>bilgi asimetrisi<\/b> güveni etkiler; denetim vekil üzerinde bağımsız kontrol sağlar.<\/li>\n<li>Bağımsız denetim (Whittington-Pany): finansal tabloların GKGMİ'ye uygunluğu konusunda <b>makul güvence<\/b> için yeterli ve uygun kanıt toplanıp değerlendirilerek <b>görüş<\/b> verilmesi. Bağımsızlık güvenilirliğin ön koşuludur.<\/li>\n<li><b>SPK Seri:X No:22 tanımı:<\/b> kamuya açıklanacak veya Kurulca istenecek yıllık tablo ve diğer finansal bilgilerin raporlama standartlarına uygunluğu ve doğruluğu hakkında makul güvence için, BDS'deki tüm teknikler uygulanarak defter, kayıt ve belgeler üzerinden denetlenip rapora bağlanması.<\/li>\n<\/ul>\n\n<h3>Amaç ve fayda<\/h3>\n<ul>\n<li>Denetim (Güredin): iktisadi faaliyet ve olaylara ilişkin <b>iddiaların önceden saptanmış ölçütlere uygunluk derecesini<\/b> araştırmak ve sonuçları ilgililere bildirmek için tarafsız kanıt toplayan <b>sistematik süreç<\/b>.<\/li>\n<li><b>IFAC<\/b> ve <b>AICPA<\/b> tanım yapmak yerine amacı belirtir: hedef kullanıcıların tablolara duyduğu <b>güven seviyesini artırmak<\/b>. Bu, tabloların tüm önemli yönleriyle geçerli çerçeveye uygun hazırlanıp hazırlanmadığına dair görüşle sağlanır (BDS 200.03).<\/li>\n<li><b>Faydalar:<\/b> yönetime doğru bilgi akışı; tahmin, analiz ve karar desteği; tabloların gerçeği yansıtıp yansıtmadığını göstermek; hile yapılmasını önlemeye yardım; <b>düşük maliyetli finansman<\/b> bulmayı kolaylaştırmak; ortakların haklarını daha iyi korumak.<\/li>\n<li>Yönetim tabloların GKGMİ'ye uygun olduğunu <b>iddia eder<\/b> (varlıkların varlığı, borçların doğru yansıtılması, değerleme, değer düşüklüğü, sınıflama); denetçi bu iddiaları kanıtla araştırır.<\/li>\n<\/ul>\n\n<h3>Denetim ve denetçi türleri<\/h3>\n<table>\n<tr><th>Denetim türü<\/th><th>Ne denetlenir?<\/th><th>Kime raporlanır / not<\/th><\/tr>\n<tr><td>Finansal tablo denetimi<\/td><td>Bilanço, gelir tablosu, nakit akım, kâr dağıtım gibi tabloların GKGMİ'ye uygunluğu<\/td><td>Yönetim, yatırımcılar, bankalar, analistler, resmî kurumlar<\/td><\/tr>\n<tr><td>Uygunluk denetimi<\/td><td>Daha <b>yüksek bir otoritenin<\/b> koyduğu yöntem, kural ve düzenlemelere uyum (iç kurallar, asgari ücret, sözleşmelerdeki yasal gereklilikler, vergi beyannamesi denetimi, iç kontrol etkinliği)<\/td><td>Çoğunlukla işletme personelince yapılır, sonuç <b>yönetime<\/b> raporlanır<\/td><\/tr>\n<tr><td>Faaliyet denetimi<\/td><td>Yöntemlerin <b>etkinlik ve verimliliği<\/b>; muhasebeyle sınırlı değil (bilgisayar işlemleri, örgüt yapısı, üretim, pazarlama)<\/td><td>Yönetim tavsiye bekler; subjektif yargı nedeniyle <b>yönetim danışmanlığı<\/b>na benzer. Etkinlik ve verimlilik için GKGMİ veya yasal kural yoktur.<\/td><\/tr>\n<\/table>\n<p>Faaliyet denetiminde <b>etkinlik<\/b>: amaçlara ulaşma ve yükümlülükleri yerine getirme derecesi; <b>verimlilik<\/b>: kaynakların etkin kullanımı.<\/p>\n<table>\n<tr><th>Denetçi<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Bağımsız denetçi<\/td><td>Hiçbir kişi veya kuruluşa bağlı olmadan, tablo ve finansal bilgilerin ölçütlere uygunluğunu araştırır; makul güvence için yeterli kanıt toplar, sonucu rapor olarak açıklar.<\/td><\/tr>\n<tr><td>İç denetçi<\/td><td>İşletme organizasyonunun parçası; üst yönetime denetim ve danışmanlık; yönetim ve kontrol yapılarını değerlendirir, uygunluk ve faaliyet denetimi yapar.<\/td><\/tr>\n<tr><td>Kamu denetçisi<\/td><td>Bir kamu kurumuna bağlı, kurum yararına; kurumun yasa, yönetmelik ve politikalarını referans alır.<\/td><\/tr>\n<\/table>\n\n<h3>Denetim standartları<\/h3>\n<ul>\n<li>Denetçiye mesleki sorumluluğunda yol gösteren genel ilkeler. <b>1947<\/b>'de geniş kabul gören ve az değişen standartlara <b>genel kabul görmüş denetim standartları (GKGDS)<\/b> denir.<\/li>\n<li>Asgari kurallardır; kısıtlayıcı değil <b>yol göstericidir<\/b>; içerik ve kapsam denetçinin takdirine bırakılmıştır.<\/li>\n<li>Yararları: görev, yetki ve aşamaların anlaşılması ve güven; uygun kalite için çerçeve; planlama-yürütme-raporlama için ortak zemin; yöntem ve aşamaların sınırlarını belirleme; kalite değerlendirme ölçütü; genel kabul görmüş çözümleri bütünleştirme; uluslararası düzeyde yürütme.<\/li>\n<li><b>IFAC<\/b> (Uluslararası Muhasebeciler Federasyonu): kitaba göre 113 ülkeden 155 üye örgüt, 2 milyondan fazla muhasebeci (güncel bilgiye göre 130'dan fazla ülke, 175'in üzerinde üye). Komiteleri muhasebe standartları, etik kurallar ve <b>UDS<\/b>'yi belirler. UDS denetimin temel evrelerini esas alır: <b>planlama, programın yerine getirilmesi, raporlama<\/b>.<\/li>\n<li>UDS, KGK tarafından mevzuata alındığında <b>BDS (Bağımsız Denetim Standartları)<\/b> adını aldı.<\/li>\n<\/ul>\n<table>\n<tr><th>Standart<\/th><th>Konu<\/th><\/tr>\n<tr><td>200<\/td><td>Denetçinin genel amaçları<\/td><\/tr>\n<tr><td>210<\/td><td>Denetim sözleşmesinin şartları<\/td><\/tr>\n<tr><td>220<\/td><td>Kalite kontrol<\/td><\/tr>\n<tr><td>230<\/td><td>Belgelendirme<\/td><\/tr>\n<tr><td>240<\/td><td>Hile ve usulsüzlükte denetçinin sorumluluğu<\/td><\/tr>\n<tr><td>250<\/td><td>Kanun ve düzenlemelerin dikkate alınması<\/td><\/tr>\n<tr><td>260 / 265<\/td><td>Yönetimden sorumlu kişilerle görüşme / iç kontrol eksikliklerinin iletilmesi<\/td><\/tr>\n<tr><td>300<\/td><td>Denetimin planlanması<\/td><\/tr>\n<tr><td>315<\/td><td>İşletme ve çevresinin anlaşılmasıyla önemli yanlışlık riskinin belirlenmesi<\/td><\/tr>\n<tr><td>320<\/td><td>Planlama ve yürütmede önemlilik<\/td><\/tr>\n<tr><td>330<\/td><td>Belirlenen risklere karşı prosedürler<\/td><\/tr>\n<tr><td>402 / 450<\/td><td>Dışarıdan hizmet alan kuruluşlar / tespit edilen yanlışlıkların değerlendirilmesi<\/td><\/tr>\n<tr><td>500 / 501 / 505<\/td><td>Denetim kanıtı / ilave konular / dış kaynaktan doğrulama<\/td><\/tr>\n<tr><td>510 / 520 / 530<\/td><td>İlk denetim-açılış bakiyeleri / analitik prosedürler / örnekleme<\/td><\/tr>\n<tr><td>540 / 550 / 560 / 580<\/td><td>Muhasebe tahminleri ve GUD / ilişkili taraflar / bilanço tarihinden sonraki olaylar / yazılı teyitler<\/td><\/tr>\n<tr><td>600 / 610 / 620<\/td><td>Grup denetimi / iç denetimin kullanılması / uzman çalışmasının kullanılması<\/td><\/tr>\n<tr><td>700 / 701 / 705 / 706<\/td><td>Görüş oluşturma ve raporlama / <b>kilit denetim konuları<\/b> / görüşün değişikliğe uğraması / dikkat çekilecek hususlar<\/td><\/tr>\n<tr><td>710 / 720<\/td><td>Karşılaştırmalı bilgiler / diğer bilgiler<\/td><\/tr>\n<tr><td>800 / 805 / 810<\/td><td>Özel amaçlı çerçeveler / tek tablo veya unsur / özet tablolar<\/td><\/tr>\n<\/table>\n\n<h3>Geleneksel denetim yaklaşımı<\/h3>\n<p>Denetim işin kabulüyle başlar, raporun sunulmasıyla biter. Geleneksel yaklaşımın <b>dört aşaması<\/b>: planlama → kanıt toplama → kanıt değerlendirme → raporlama (sonuçların iletimi). Zamanla <b>risk tabanlı<\/b> yaklaşıma geçilmiştir; güncel UDS bu yaklaşımı benimser.<\/p>\n<h4>Planlama<\/h4>\n<ul>\n<li>Amaç, denetimi etkin yürütülecek şekilde planlamak (BDS 300.04); genel denetim stratejisi + denetim planı. Kapsam ve plan risk değerlendirmesinin sonucu olduğu için sürecin en etkili kısmıdır.<\/li>\n<li><b>Planlamanın katkıları (BDS 300.02):<\/b> önemli alanlara odaklanma; sorunların zamanında belirlenmesi; etkin ve verimli düzenleme; ekibin uygun yetkinlikte seçimi ve iş dağılımı; yönlendirme, gözetim ve gözden geçirme; bağlı birim denetçileri ve uzmanlarla koordinasyon. Ayrıca yeterli kanıt, makul maliyet ve anlaşmazlıkların önlenmesi.<\/li>\n<li>İlk adım: denetimin <b>amacı ve kapsamının<\/b> belirlenmesi; sonra ekip; işletmeyi ve sektörü tanıma. Teknik alanlar için uzman (değerli taş, sigorta, avukat, GUD). <b>Dikkat:<\/b> uzman kullanmak denetçinin sorumluluğunu değiştirmez; uzman raporu görüşü değiştirmedikçe raporda referans gösterilmez.<\/li>\n<li><b>Kabul edilebilir denetim riski:<\/b> önemli yanlışlık varken olumlu görüş verme olasılığını kabul derecesi; düşük belirlendikçe daha fazla kesinlik istenir. <b>Risk %0 kesinlik, %100 belirsizlik<\/b>tir.<\/li>\n<li><b>Doğal risk:<\/b> kontroller dikkate alınmadan önce bir yönetim beyanının önemli yanlışlığa duyarlılığı. <b>Kontrol riski:<\/b> yanlışlığın iç kontrolce zamanında önlenememesi veya tespit edilip düzeltilememesi riski. Standartlarda ikisi birlikte <b>önemli yanlışlık riskleri<\/b> diye anılır.<\/li>\n<li>Son adım: başlangıç denetim programı (testlerin doğası, kapsamı, zamanlaması), bütçe ve görevlendirme. Beklenmedik sorunlarda plan revize edilebilir.<\/li>\n<\/ul>\n<h4>Kanıt toplama ve değerlendirme<\/h4>\n<ul>\n<li>Kanıt: bir iddiayı doğrulayan veya çürüten bilgi. Amaç, makul sonuçlara ulaştıracak <b>yeterli ve uygun<\/b> kanıt (BDS 500.04). Tam ikna beklenmez; makul güvence hedeflenir.<\/li>\n<li>Muhasebe kayıtlarındaki bilgiler ve diğer kaynaklardan gelen bilgiler kanıttır (BDS 500.05). Uygunluk: kanıtın test edilen amaçla ilişkisi. Örneklem büyüdükçe kanıt daha güvenilir.<\/li>\n<li>Geçerlilik karşılaştırmaları: <b>bağımsız dış kaynak<\/b> > işletme içi; <b>etkili iç kontrollü<\/b> işletmenin belgeleri daha güvenilir; <b>doğrudan<\/b> (gözlem, hesaplama, fiziksel muayene) > dolaylı.<\/li>\n<li>En çok çaba harcanan aşama <b>kanıt toplama<\/b>dır. Yönte
