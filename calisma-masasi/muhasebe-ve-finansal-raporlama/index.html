iğer Yükümlülükler<\/b>.<\/li>\n<li>Ertelenen veya taksitlendirilen vergi ve primler <b>bir yıl içinde<\/b> ödenecekse 368'e, <b>daha uzun sürede<\/b> ödenecekse <b>438 Kamuya Olan Ertelenmiş veya Taksitlendirilmiş Borçlar<\/b>'a aktarılır. 368'deki tecil faizinin cari yıla düşen kısmı 689 / 381.<\/li>\n<\/ul>\n\n<h3>37 Borç ve gider karşılıkları<\/h3>\n<ul>\n<li>Bilanço tarihinde ortaya çıkmış ama tutarı kesin bilinmeyen veya tutarı bilinip tahakkuk zamanı bilinmeyen kısa vadeli borç ve giderler için. Karşılık hesapları olsalar da <b>aktifi düzenleyici değildir<\/b>.<\/li>\n<li><b>370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları:<\/b> dönem sonunda <b>691 borç / 370 alacak<\/b>. Tahakkuk kesinleşince 370 borç; 371 (peşin ödenen) alacak; kalan 360 alacak.<\/li>\n<li><b>371 Dönem Kârının Peşin Ödenen Vergi ve Diğer Yükümlülükleri (−):<\/b> 193'ten aktarılır; aktarılan tutar en çok 370 kadar olabilir.<\/li>\n<li><b>372 Kıdem Tazminatı Karşılığı:<\/b> bir yıl içinde ödenecek kıdem tazminatları; 472'den aktarılır. <b>373 Maliyet Giderleri Karşılığı:<\/b> aylık maliyetlere pay vermek için tahmini gider karşılıkları (ikramiye, tamir bakım vb.). <b>379 Diğer Borç ve Gider Karşılıkları.<\/b><\/li>\n<\/ul>\n<p><b>Örnek: Hesaplanan kurumlar vergisi 240.000 TL, yıl içinde peşin ödenen 90.000 TL; beyanname sonrası<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları<\/td><td><\/td><td>240.000<\/td><\/tr><tr><td><\/td><td>371 Dönem Kârının Peşin Ödenen Vergi ve Diğer Yükümlülükleri<\/td><td>90.000<\/td><\/tr><tr><td><\/td><td>360 Ödenecek Vergi ve Fonlar<\/td><td>150.000<\/td><\/tr><\/table>\n<h3>38 Gelecek aylara ait gelirler ve gider tahakkukları<\/h3>\n<ul>\n<li><b>380 Gelecek Aylara Ait Gelirler:<\/b> peşin tahsil edilen ve gelecek dönemlere ait gelirlerin bir yıldan kısa kısmı. <b>381 Gider Tahakkukları:<\/b> gelecek aylarda ödenecek, <b>kesinlikle belgeye dayalı ve tutarı bilinen<\/b> giderler.<\/li>\n<li>Tahsilde gelir olarak kaydedilip sonradan gelecek döneme ait olduğu anlaşılan tutar envanter sırasında gelir hesabından 380'e aktarılır.<\/li>\n<\/ul>\n<p><b>Örnek: 1 Nisan'da 2 yıllık kira olarak 96.000 TL peşin tahsil edildi (aylık 4.000 TL)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>100 Kasa<\/td><td><\/td><td>96.000<\/td><\/tr><tr><td><\/td><td>649 Diğer Olağan Gelir ve Kârlar (9 ay)<\/td><td>36.000<\/td><\/tr><tr><td><\/td><td>380 Gelecek Aylara Ait Gelirler (12 ay)<\/td><td>48.000<\/td><\/tr><tr><td><\/td><td>480 Gelecek Yıllara Ait Gelirler (3 ay)<\/td><td>12.000<\/td><\/tr><\/table>\n<h3>39 Diğer kısa vadeli yabancı kaynaklar<\/h3>\n<ul>\n<li><b>391 Hesaplanan KDV:<\/b> satışlarda hesaplanan KDV; alış iade ve iskontolarının KDV'si de buraya alacak yazılır. Dönem sonunda 191 ve varsa 190 ile karşılaştırılır; fazlası <b>360<\/b>'a aktarılır.<\/li>\n<li><b>392 Diğer KDV<\/b> (teşvikli ithalatta ertelenen ve ihraç kaydıyla satışta tecil edilen KDV), <b>393 Merkez ve Şubeler Cari Hesabı<\/b> (hem borçlu hem alacaklı çalışır, füzyonda kapatılır), <b>397 Sayım ve Tesellüm Fazlaları<\/b>, <b>399 Diğer Çeşitli Yabancı Kaynaklar<\/b>.<\/li>\n<li>Kasa veya stok fazlasının nedeni bulunamaz ve <b>aynı dönemde<\/b> kâr yazılırsa <b>679<\/b>, <b>izleyen dönemde<\/b> kâr yazılırsa <b>671<\/b> kullanılır. Stok fazlaları emsal değeriyle kaydedilir.<\/li>\n<\/ul>\n<p><b>Örnek: 391'de 600.000, 191'de 220.000, 190'da 130.000 TL<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>391 Hesaplanan KDV<\/td><td><\/td><td>600.000<\/td><\/tr><tr><td><\/td><td>191 İndirilecek KDV<\/td><td>220.000<\/td><\/tr><tr><td><\/td><td>190 Devreden KDV<\/td><td>130.000<\/td><\/tr><tr><td><\/td><td>360 Ödenecek Vergi ve Fonlar<\/td><td>250.000<\/td><\/tr><\/table>\n<h3>Uzun vadeli yabancı kaynaklar (4)<\/h3>\n<ul>\n<li>Vadesi bir yıldan uzun borçlar. Hesaplar alacak kaydıyla açılır; vadesine <b>bir yıl veya daha az<\/b> kalan tutarlar 3 grubundaki paralel hesaba aktarılırken 4 grubundaki hesap borçlanır.<\/li>\n<li>Paralellik: 40↔30, 42↔32, 43↔33, 44↔34, 47↔37, 48↔38, 49↔39. 35 ve 36'nın uzun vadede karşılığı yoktur. 43 grubunda <b>438 Kamuya Olan Ertelenmiş Borçlar<\/b>'ın karşılığı 368'dir. <b>493 Tesise Katılma Payları<\/b>'nın 3 grubunda karşılığı yoktur.<\/li>\n<\/ul>\n<table>\n<tr><th>Grup<\/th><th>Hesaplar ve önemli notlar<\/th><\/tr>\n<tr><td>40 Mali Borçlar<\/td><td>400 Banka Kredileri, 401/402 Finansal kiralama, 405 Çıkarılmış Tahviller (nominal bedelle alacak; değiştirilebilir ve erken paraya çevrilebilir tahviller dipnotta), 407 Çıkarılmış Diğer Menkul Kıymetler (VDMK, KZOB gibi; <b>katılma intifa senedi<\/b> 500 Sermaye'de gösterilir, geri alınanlar 11 grubunda), 408 Menkul Kıymetler İhraç Farkı (−) (gelecek yıla ait kısmı 308'e aktarılır), 409<\/td><\/tr>\n<tr><td>42 Ticari Borçlar<\/td><td>420 Satıcılar, 421 Borç Senetleri (vadesi bir yılı aşan çekler dahil), 422 Reeskont (−), 426 Alınan Depozito ve Teminatlar, 429 Diğer Ticari Borçlar<\/td><\/tr>\n<tr><td>43 Diğer Borçlar<\/td><td>431, 432, 433, 436, 437 (−), <b>438 Kamuya Olan Ertelenmiş veya Taksitlendirilmiş Borçlar<\/b><\/td><\/tr>\n<tr><td>44 Alınan Avanslar<\/td><td>440 Alınan Sipariş Avansları, 449 Alınan Diğer Avanslar<\/td><\/tr>\n<tr><td>47 Borç ve Gider Karşılıkları<\/td><td>472 Kıdem Tazminatı Karşılığı, 479 Diğer Borç ve Gider Karşılıkları; <b>pasif karakterlidir<\/b>, aktifi düzenleyici değildir. Alacaklıyla irtibat olmadığından karşılık ayrılırken <b>vergi kesintisi yapılmaz<\/b>.<\/td><\/tr>\n<tr><td>48 Gelecek Yıllara Ait Gelirler ve Gider Tahakkukları<\/td><td>480 (peşin tahsil edilen gelirin bir yıldan uzun kısmı), 481 (ödemesi gelecek yıllarda yapılacak, belgeye dayalı gider tahakkukları)<\/td><\/tr>\n<tr><td>49 Diğer Uzun Vadeli Yabancı Kaynaklar<\/td><td>492 Gelecek Yıllara Ertelenen veya Terkin Edilecek KDV (kısa vadeli kısmı 392'ye), <b>493 Tesise Katılma Payları<\/b> (tesisin ömrüne göre itfa edilip 649'a gelir yazılır), 499<\/td><\/tr>\n<\/table>\n<ul>\n<li>Uzun vadeli kredi faizi <b>dönem sonu ödemeli<\/b> ise 780 / <b>381<\/b>; <b>vade sonu ödemeli<\/b> ve bir yıl içinde ödenmeyecekse 780 / <b>481<\/b>. İstenebilir hale gelen faiz 303'e alınır. Dövize endeksli kredide fark 481'e karşılık gider yazılır.<\/li>\n<li>Yabancı paralı uzun vadeli kredi ve tahvillerde kur farkı yine <b>780 Finansman Giderleri<\/b>'ne yazılır.<\/li>\n<\/ul>\n<p><b>Örnek: 50.000 TL kıdem karşılığı ayrıldı; ertesi yıl emekli olacak personelin 30.000 TL'si 372'ye aktarıldı; ödeme 33.000 TL oldu (fark 472'den karşılanır)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>770 Genel Yönetim Giderleri<\/td><td><\/td><td>50.000<\/td><\/tr><tr><td><\/td><td>472 Kıdem Tazminatı Karşılığı<\/td><td>50.000<\/td><\/tr><tr><td>472 Kıdem Tazminatı Karşılığı<\/td><td><\/td><td>30.000<\/td><\/tr><tr><td><\/td><td>372 Kıdem Tazminatı Karşılığı<\/td><td>30.000<\/td><\/tr><tr><td>372 Kıdem Tazminatı Karşılığı<\/td><td><\/td><td>30.000<\/td><\/tr><tr><td>472 Kıdem Tazminatı Karşılığı<\/td><td><\/td><td>3.000<\/td><\/tr><tr><td><\/td><td>100 Kasa<\/td><td>33.000<\/td><\/tr><\/table><p><b>Örnek: 200.000 TL'lik tazminat davasının %60 olasılıkla aleyhe sonuçlanacağı bekleniyor (ihtiyatlılık)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>689 Diğer Olağandışı Gider ve Zararlar<\/td><td><\/td><td>120.000<\/td><\/tr><tr><td><\/td><td>479 Diğer Borç ve Gider Karşılıkları<\/td><td>120.000<\/td><\/tr><\/table>\n<ul>\n<li>Dava izleyen dönemde sonuçlanacaksa 479 → 379 aktarılır. Beklenenden <b>fazla<\/b> ödenirse fark <b>681 Önceki Dönem Gider ve Zararları<\/b>; <b>az<\/b> ödenirse fark <b>671 Önceki Dönem Gelir ve Kârları<\/b>. Bu karşılıklar aktifi düzenleyici olmadığından <b>644 kullanılmaz<\/b>.<\/li>\n<li>Tesise katılma payı örneği: 80.000 TL tahsil edildi, tesisin ömrü 16 yıl → her yıl 5.000 TL 493 borç / 649 alacak.<\/li>\n<li>Dikkat: Kredi kur farkı 780, ticari borç kur farkı 656; borç senedi reeskontu 647 (dönem sonu), alacak senedi reeskontu 657 (dönem sonu).<\/li>\n<\/ul>", "sorular": [{"q": "İşletme 1 Kasım'da 300.000 TL, yıllık %36 faizli, 3 ay vadeli avans kredisi almıştır. 31 Aralık'ta 381 Gider Tahakkukları hesabına kaç TL alacak yazılır? (Faiz = anapara × gün × oran / 36.500)", "o": ["18.000 TL", "27.000 TL", "9.000 TL", "18.049,32 TL", "17.753,42 TL"], "a": 3, "e": "1 Kasım–31 Aralık arası 61 gün: 300.000 × 61 × 36 / 36.500 = 18.049,32 TL; 780 borç, 381 alacak. 18.000 TL basit 2 aylık hesaptır."}, {"q": "Dönem içinde 1 YP = 1,40 TL kurundan alınan 20.000 YP tutarındaki banka kredisi için dönem sonu kuru 1,55 TL'dir. Değerleme kaydında borçlanan hesap ve tutar hangisidir?", "o": ["780 Finansman Giderleri 3.000 TL", "656 Kambiyo Zararları 3.000 TL", "780 Finansman Giderleri 31.000 TL", "300 Banka Kredileri 3.000 TL", "657 Reeskont Faiz Giderleri 3.000 TL"], "a": 0, "e": "20.000 × (1,55 − 1,40) = 3.000 TL. Borçlanmayla ilgili olumsuz kur farkları kambiyo zararı değil finansman gideridir: 780 borç, 300 alacak."}, {"q": "Yurt dışındaki satıcıya olan yabancı paralı ticari borcun dönem sonunda kurun yükselmesi nedeniyle artan TL karşılığı hangi hesaba borç yazılır?", "o": ["780 Finansman Giderleri", "646 Kambiyo Kârları", "656 Kambiyo Zararları", "659 Diğer Olağan Gider ve Zararlar", "681 Önceki Dönem Gider ve Zararları"], "a": 2, "e": "Kitap örneğinde yabancı paralı satıcı borcundaki kur artışı 656 borç, 320 alacak kaydedilir. Kredilerle ilgili kur farkı ise 780'e yazılır."}, {"q": "Banka, teminat olarak verilen 200.000 TL değerindeki mala %25 marj uygulayarak kredi açmıştır. İşletmenin hesabına aktarılan kredi tutarı kaç TL'dir?", "o": ["200.000 TL", "50.000 TL", "150.000 TL", "160.000 TL", "250.000 TL"], "a": 2, "e": "Marj malın değerinden düşülür: 200.000 × (1 − 0,25) = 150.000 TL; 102 borç, 300 alacak."}, {"q": "Vadesine 20 gün kalan 50.000 TL'lik borç senedi için %45 oranıyla iç iskonto yöntemine göre reeskont tutarı yaklaşık kaç TL'dir?", "o": ["1.232,88 TL", "1.203,21 TL", "1.250 TL", "1.180,33 TL", "1.103,21 TL"], "a": 1, "e": "Reeskont = a × n × t / (36.500 + n × t) = 50.000 × 20 × 45 / (36.500 + 900) = 1.203,21 TL. 1.232,88 TL dış iskonto (36.500'e bölme) sonucudur."}, {"q": "Borç senetleri için dönem sonunda hesaplanan reeskontun kaydı ve izleyen dönem başındaki kapanış kaydı hangi seçenekte doğru verilmiştir?", "o": ["Dönem sonu 657 borç / 322 alacak; dönem başı 322 borç / 647 alacak", "Dönem sonu 322 borç / 657 alacak; dönem başı 647 borç / 322 alacak", "Dönem sonu 780 borç / 322 alacak; dönem başı 322 borç / 780 alacak", "Dönem sonu 322 borç / 647 alacak; dönem başı 657 borç / 322 alacak", "Dönem sonu 122 borç / 647 alacak; dönem başı 657 borç / 122 alacak"], "a": 3, "e": "Borç senedi reeskontu dönem sonunda gelir yaratır (647). Gelir hesabı 690'a kapandığı için izleyen dönem başında düzeltme 657 borç, 322 alacak kaydıyla yapılır."}, {"q": "1 Kasım'da 3 ay vadeli 200.000 TL nominal değerli finansman bonosu 170.000 TL'ye satılmıştır. Dönem sonunda iki aylık ihraç farkı itfa edildikten sonra bilançoda mali borçlar (305 − 308) net kaç TL görünür?", "o": ["170.000 TL", "190.000 TL", "200.000 TL", "180.000 TL", "210.000 TL"], "a": 1, "e": "İhraç farkı 30.000 TL; 2/3'ü (20.000 TL) 780'e itfa edilir, 308'de 10.000 TL kalır. Net mali borç 200.000 − 10.000 = 190.000 TL."}, {"q": "Ay sonunda 391 Hesaplanan KDV'de 600.000 TL, 191 İndirilecek KDV'de 220.000 TL, 190 Devreden KDV'de 130.000 TL vardır. 360 Ödenecek Vergi ve Fonlar hesabına kaç TL alacak yazılır?", "o": ["380.000 TL", "470.000 TL", "250.000 TL", "600.000 TL", "90.000 TL"], "a": 2, "e": "391 kapatılırken 191 ve 190 mahsup edilir: 600.000 − 220.000 − 130.000 = 250.000 TL ödenecek KDV."}, {"q": "Ocak ayı bordrosunda net ücret 150.000, gelir vergisi 40.000, damga vergisi 2.000, SSK işçi payı 30.000 ve işveren payı 45.000 TL'dir. Bordronun tahakkukunda gider hesabına kaç TL borç yazılır?", "o": ["222.000 TL", "192.000 TL", "237.000 TL", "150.000 TL", "267.000 TL"], "a": 4, "e": "Gider = net ücret + kesintiler (brüt 222.000) + işveren payı 45.000 = 267.000 TL. 335'e 150.000, 360'a 42.000, 361'e 75.000 TL alacak yazılır."}, {"q": "İşletme 1 Nisan'da binasını 2 yıllığına kiraya vermiş ve 96.000 TL kirayı peşin tahsil etmiştir. Tahsil kaydında 480 Gelecek Yıllara Ait Gelirler hesabına kaç TL alacak yazılır?", "o": ["12.000 TL", "48.000 TL", "36.000 TL", "24.000 TL", "60.000 TL"], "a": 0, "e": "Aylık kira 4.000 TL. Cari yıl 9 ay (36.000) 649'a, izleyen 12 ay (48.000) 380'e, sonraki 3 ay (12.000) 480'e yazılır."}, {"q": "İşletmenin hesaplanan kurumlar vergisi 240.000 TL, yıl içinde peşin ödediği kurumlar vergisi 90.000 TL'dir. Beyanname sonrası 360 Ödenecek Vergi ve Fonlar hesabına kaç TL alacak yazılır?", "o": ["240.000 TL", "330.000 TL", "90.000 TL", "150.000 TL", "120.000 TL"], "a": 3, "e": "370 borç 240.000; 371 alacak 90.000; kalan 150.000 TL 360'a alacak yazılır."}, {"q": "Önceden ayrılıp 472'den 372'ye aktarılan kıdem tazminatı karşılığı 30.000 TL'dir. Personele 33.000 TL ödenmiştir. Aradaki fark nasıl kaydedilir?", "o": ["3.000 TL 472 Kıdem Tazminatı Karşılığı hesabına borç yazılır", "3.000 TL 770'e gider yazılır", "3.000 TL 681'e yazılır", "3.000 TL 654'e yazılır", "33.000 TL 472'ye borç yazılır"], "a": 0, "e": "Ödeme 372'ye aktarılan tutarı aşarsa ayrıca aktarma yapılmadan fark 472'nin borcu karşılığında ödenir; böylece daha önce gider yazılan tutar yeniden gider yazılmaz."}, {"q": "İşletme aleyhine açılan ve %60 olasılıkla aleyhe sonuçlanacağı düşünülen 200.000 TL'lik dava için karşılık ayrılmıştır. Dava sonraki yıl sonuçlanmış ve 140.000 TL ödenmiştir. Fark hangi hesaba kaydedilir?", "o": ["20.000 TL, 654 Karşılık Giderleri", "20.000 TL, 644 Konusu Kalmayan Karşılıklar", "60.000 TL, 681 Önceki Dönem Gider ve Zararları", "20.000 TL, 671 Önceki Dönem Gelir ve Kârları", "20.000 TL, 681 Önceki Dönem Gider ve Zararları"], "a": 4, "e": "Ayrılan karşılık 200.000 × %60 = 120.000 TL. Fazla ödenen 20.000 TL geçmiş yılla ilgili olduğundan 681'e yazılır; borç ve gider karşılıkları aktifi düzenleyici olmadığından 644 kullanılmaz."}, {"q": "İşletme bir başka şirketten tesisinden yararlandırma karşılığı 80.000 TL tesise katılma payı tahsil etmiştir. Tesisin ekonomik ömrü 16 yıldır. Her yıl 649 Diğer Olağan Gelir ve Kârlar hesabına kaç TL aktarılır?", "o": ["80.000 TL", "4.000 TL", "16.000 TL", "8.000 TL", "5.000 TL"], "a": 4, "e": "493 Tesise Katılma Payları ömür boyunca itfa edilerek gelire dönüştürülür: 80.000 / 16 = 5.000 TL."}, {"q": "İşletmenin çıkardığı tahviller için ertesi yıl ödenecek faiz 8.000 TL hesaplanmış, %15 stopaj ayrılmıştır. Kitaptaki kayda göre 381 Gider Tahakkukları hesabına kaç TL alacak yazılır?", "o": ["8.000 TL", "6.800 TL", "1.200 TL", "9.200 TL", "6.000 TL"], "a": 1, "e": "780 borç 8.000; stopaj 8.000 × %15 = 1.200 TL 360'a, kalan 6.800 TL 381'e alacak yazılır."}, {"q": "50.000 TL nominal bedelli kâr-zarar ortaklığı belgesi nakden 54.000 TL'ye ihraç edilmiştir. Başabaş üstündeki fark hangi hesaba yazılır?", "o": ["4.000 TL, 520 Hisse Senedi İhraç Primleri", "4.000 TL, 649 Diğer Olağan Gelir ve Kârlar", "54.000 TL, 306 Çıkarılmış Diğer Menkul Kıymetler", "4.000 TL, 529 Diğer Sermaye Yedekleri", "4.000 TL, 308 Menkul Kıymetler İhraç Farkları"], "a": 3, "e": "306'ya nominal bedel (50.000) alacak, başabaş üstü fark 4.000 TL kitap örneğinde olduğu gibi 529 Diğer Sermaye Yedekleri'ne alacak yazılır."}, {"q": "Kırtasiye ticareti yapmayan bir işletmenin kredili kırtasiye alımından doğan borcu hangi hesapta izlenir?", "o": ["336 Diğer Çeşitli Borçlar", "320 Satıcılar", "321 Borç Senetleri", "329 Diğer Ticari Borçlar", "381 Gider Tahakkukları"], "a": 0, "e": "Ana faaliyet konusu dışındaki alımlar için borçlanmalar 320'de değil 336'da izlenir; aynı alım kırtasiyeci için 320'de izlenirdi."}, {"q": "Kitaba göre Sermaye Piyasası Kanununa tabi şirketlerde hangi senetsiz borçlar reeskont işlemine tabi tutulur?", "o": ["Vadesi 1 aydan uzun olanlar", "Vadesi 6 aydan uzun olanlar", "Vadesi 3 aydan uzun olanlar", "Vadesi 1 yıldan uzun olanlar", "Senetsiz borçlar hiçbir koşulda reeskonta tabi değildir"], "a": 2, "e": "SPK'ya tabi şirketlerde 3 aydan uzun vadeye sahip senetsiz borçlar reeskonta tabidir (320 borç, 647 alacak)."}, {"q": "İşletmenin talebiyle 175.000 TL'lik vergi borcu 18 ay vadeyle taksitlendirilmiştir. Bilanço tarihinden itibaren bir yıldan sonra ödenecek taksitler hangi hesapta izlenir?", "o": ["368 Vadesi Geçmiş, Ertelenmiş veya Taksitlendirilmiş Vergi ve Diğer Yükümlülükler", "360 Ödenecek Vergi ve Fonlar", "438 Kamuya Olan Ertelenmiş veya Taksitlendirilmiş Borçlar", "436 Diğer Çeşitli Borçlar", "379 Diğer Borç ve Gider Karşılıkları"], "a": 2, "e": "Bir yıl içinde ödenecek kısım 368'de, daha uzun sürede ödenecek kısım 438'de izlenir; vadesi bir yılın altına düşen tutarlar 438'den 368'e aktarılır."}, {"q": "Envanterde saptanan kasa fazlasının nedeni bulunamamış ve aynı dönemde kâr yazılmasına karar verilmiştir. 397 Sayım ve Tesellüm Fazlaları hangi hesap karşılığında kapatılır?", "o": ["671 Önceki Dönem Gelir ve Kârları", "679 Diğer Olağandışı Gelir ve Kârlar", "644 Konusu Kalmayan Karşılıklar", "649 Diğer Olağan Gelir ve Kârlar", "100 Kasa"], "a": 1, "e": "Fazla aynı dönemde kâr yazılırsa 679, izleyen dönemde kâr yazılırsa 671 kullanılır."}, {"q": "İşletmenin ihaleye katılan firmadan aldığı teminat mektubu nasıl izlenir?", "o": ["326 Alınan Depozito ve Teminatlar hesabında", "126 Verilen Depozito ve Teminatlar hesabında", "426 Alınan Depozito ve Teminatlar hesabında", "Nazım hesaplarda", "Kayda alınmaz"], "a": 3, "e": "326 yalnız nakit olarak alınan depozito ve teminatları izler; teminat mektubu, menkul kıymet, senet veya emtia olarak alınan teminatlar nazım hesaplarda izlenir."}, {"q": "381 Gider Tahakkukları hesabına alınabilecek giderlerin niteliği hangisidir?", "o": ["Tutarı tahmin edilen ve gerçekleşip gerçekleşmeyeceği belirsiz giderler", "Gelecek aylarda ödenecek, kesinlikle belgeye dayalı ve tutarı bilinen giderler", "Peşin ödenmiş ve gelecek aylara ait giderler", "Bir yıldan sonra ödenecek giderler", "Yalnızca vergi giderleri"], "a": 1, "e": "381 kesin belgeye dayalı, tutarı bilinen gider tahakkuklarını izler. Tutarı belirsiz olanlar karşılık hesaplarında, peşin ödenenler 180'de, bir yıldan uzun vadeliler 481'de izlenir."}, {"q": "Daha önce 400 Banka Kredileri hesabında izlenen uzun vadeli kredinin ertesi yıl ödenecek taksiti için dönem sonunda yapılacak kayıt hangisidir?", "o": ["303 borç, 400 alacak", "400 borç, 300 Banka Kredileri alacak", "400 borç, 303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri alacak", "780 borç, 303 alacak", "400 borç, 381 Gider Tahakkukları alacak"], "a": 2, "e": "Vadesine bir yıl veya daha az kalan uzun vadeli kredi taksitleri 400'ün borcuna, 303'ün alacağına kaydedilerek kısa vadeye aktarılır."}, {"q": "Uzun vadeli yabancı kaynaklarda kısa vadeli gruplarla paralelliği bozan, 3 grubunda karşılığı bulunmayan hesap hangisidir?", "o": ["400 Banka Kredileri", "420 Satıcılar", "480 Gelecek Yıllara Ait Gelirler", "472 Kıdem Tazminatı Karşılığı", "493 Tesise Katılma Payları"], "a": 4, "e": "49 grubunda 493 Tesise Katılma Payları'nın kısa vadede karşılığı yoktur. Diğer şıkların 300, 320, 380 ve 372 olarak paralelleri vardır."}, {"q": "Önceki yıl alınan, faizi vade sonunda ödenecek ve faizi bilanço tarihinden itibaren bir yıl içinde ödenmeyecek uzun vadeli kredi için dönem sonu faiz tahakkuku hangi hesabın alacağına yazılır?", "o": ["481 Gider Tahakkukları", "381 Gider Tahakkukları", "303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri", "400 Banka Kredileri", "479 Diğer Borç ve Gider Karşılıkları"], "a": 0, "e": "Faiz dönem sonu ödemeli ise 381'e; vade sonu ödemeli ve bir yıl içinde ödenmeyecekse 481'e alacak yazılır."}]}, {"id": 7, "kisa": "Özkaynak, Gelir Tablosu", "baslik": "Özkaynaklar, Gelir Tablosu Hesapları ve Dönem Sonu İşlemleri", "ozet": "Sermaye ve yedek hesapları, yasal yedek akçe hesabı, 6 grubu gelir ve gider hesapları, dönem net kârına ulaşma, mizan ve envanter işlemleri.", "notlar": "<h3>5 Özkaynaklar<\/h3>\n<p>Ortakların işletmeye tahsis ettiği ödenmiş sermaye ile sermaye yedekleri, kâr yedekleri, geçmiş yıllar kârları ve zararları ve dönem net kâr veya zararıdır. Gruplar: <b>50<\/b> Ödenmiş Sermaye, <b>52<\/b> Sermaye Yedekleri, <b>54<\/b> Kâr Yedekleri, <b>57<\/b> Geçmiş Yıllar Kârları, <b>58<\/b> Geçmiş Yıllar Zararları, <b>59<\/b> Dönem Net Kârı (Zararı). Hesaplar pasif karakterlidir; artış alacağa, azalış borca yazılır.<\/p>\n\n<h3>50 Ödenmiş sermaye<\/h3>\n<ul>\n<li><b>500 Sermaye:<\/b> ana sözleşmede yer alan ve ticaret siciline tescil edilmiş sermaye. <b>Kayıtlı sermaye<\/b> sistemindeki ortaklıklarda burada <b>çıkarılmış sermaye<\/b> gösterilir; kayıtlı sermaye tavanı dipnotta açıklanır.<\/li>\n<li><b>501 Ödenmemiş Sermaye (−):<\/b> taahhüt edilip henüz yerine getirilmeyen kısım. Taahhütte <b>501 borç / 500 alacak<\/b>; ödemelerde ilgili varlık borç / 501 alacak. Şahıs işletmesinde işletme sahibinin koyduğu değerler doğrudan 500'e alacak yazılır. Sermaye azaltımında 500 borçlanır.<\/li>\n<li><b>502 Sermaye Düzeltmesi Olumlu Farkları<\/b>, <b>503 Sermaye Düzeltmesi Olumsuz Farkları (−)<\/b>.<\/li>\n<li>Katılma intifa senedi sermayesi 500 Sermaye hesabında gösterilir.<\/li>\n<\/ul>\n<p><b>Örnek: Üç ortak 200.000'er TL taahhüt etti; A nakit, B mevduatla tamamını, C 50.000 TL devlet tahviliyle ödedi (501'de 150.000 TL borç kalanı kalır)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>501 Ödenmemiş Sermaye<\/td><td><\/td><td>600.000<\/td><\/tr><tr><td><\/td><td>500 Sermaye<\/td><td>600.000<\/td><\/tr><tr><td>100 Kasa<\/td><td><\/td><td>200.000<\/td><\/tr><tr><td>102 Bankalar<\/td><td><\/td><td>200.000<\/td><\/tr><tr><td>112 Kamu Kesimi Tahvil, Senet ve Bonoları<\/td><td><\/td><td>50.000<\/td><\/tr><tr><td><\/td><td>501 Ödenmemiş Sermaye<\/td><td>450.000<\/td><\/tr><\/table>\n<h3>52 Sermaye yedekleri<\/h3>\n<table>\n<tr><th>Hesap<\/th><th>Kapsam<\/th><\/tr>\n<tr><td>520 Hisse Senedi İhraç Primleri<\/td><td>Yeni hisselerin nominal değerin üstünde (emisyon primli) satışından doğan fark; sermayeye eklenir veya başka amaçla kullanılırsa borç<\/td><\/tr>\n<tr><td>521 Hisse Senedi İptal Kârları<\/td><td>Taahhüdünü yerine getirmeyen ortağın iptal edilen hisseleri için yapılan ödemelerden, yeni hisselerin hasılat noksanı kapatıldıktan sonra artan kısım<\/td><\/tr>\n<tr><td>522 MDV Yeniden Değerleme Artışları<\/td><td>Maddi duran varlıkların yeniden değerlemesinden doğan net değer artışı<\/td><\/tr>\n<tr><td>523 İştirakler Yeniden Değerleme Artışları<\/td><td>İştirak ve bağlı ortaklıkların yeniden değerleme artışlarını sermayeye eklemesinden işletmeye düşen pay (karşılığında 242 veya 245 borçlanır)<\/td><\/tr>\n<tr><td>529 Diğer Sermaye Yedekleri<\/td><td>Diğer sermaye yedekleri (örneğin primli KZOB ihracındaki fark)<\/td><\/tr>\n<\/table>\n<p><b>Örnek: 300.000 TL nominal hisseler 345.000 TL'den taahhüt edildi (kitaptaki kayıt biçimiyle); ödemede 102 borç, 501 ve 131 alacak<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>501 Ödenmemiş Sermaye<\/td><td><\/td><td>300.000<\/td><\/tr><tr><td>131 Ortaklardan Alacaklar<\/td><td><\/td><td>45.000<\/td><\/tr><tr><td><\/td><td>500 Sermaye<\/td><td>300.000<\/td><\/tr><tr><td><\/td><td>520 Hisse Senedi İhraç Primleri<\/td><td>45.000<\/td><\/tr><\/table>\n<h3>54 Kâr yedekleri<\/h3>\n<ul>\n<li>Kanun, ana sözleşme veya yetkili organ kararıyla olası riskleri karşılamak için işletmede bırakılan kârlar. Ortak özellik: önceki dönem kârlarından ayrılmalarıdır; bu nedenle <b>570 Geçmiş Yıllar Kârları borcu karşılığında<\/b> alacaklanırlar (duran varlık satışı veya sigorta tazmini kârlarının doğrudan bu gruba alınması hariç).<\/li>\n<li><b>540 Yasal Yedekler<\/b> (kanun gereği), <b>541 Statü Yedekleri<\/b> (ana sözleşme gereği), <b>542 Olağanüstü Yedekler<\/b> (genel kurul kararıyla ayrılan yedekler ve dağıtılmayıp işletmede bırakılan kârlar), <b>548 Diğer Kâr Yedekleri<\/b>, <b>549 Özel Fonlar<\/b> (sabit kıymet yenileme fonu, yatırım fonu, sermaye itfa fonu vb.).<\/li>\n<\/ul>\n<table>\n<tr><th>Yedek akçe (TTK)<\/th><th>Kural<\/th><\/tr>\n<tr><td><b>I. tertip<\/b><\/td><td>Her yıl safi kârın <b>%5'i<\/b>, <b>ödenmiş sermayenin beşte birine<\/b> ulaşıncaya kadar<\/td><\/tr>\n<tr><td><b>II. tertip<\/b><\/td><td>Ortaklara ve kârdan pay alanlara dağıtılmasına karar verilen kârın <b>%10'u<\/b>. Kitap örneğinde hesap: (dağıtılacak kâr − I. tertip yedek) × 1/10. Dikkat: kitabın metni ile örneği farklı sonuç verir; soru hangi yöntemi istediğini belirtmelidir.<\/td><\/tr>\n<\/table>\n<ul>\n<li>6102 sayılı TTK'da her iki yedek akçe <b>\"genel kanuni yedek akçe\"<\/b> olarak yer alır. Amaç işletme sermayesini güçlendirmek ve sorumluluğu sermayeyle sınırlı ortaklar karşısında üçüncü kişileri korumaktır.<\/li>\n<li>Örnek (kitaptaki yöntem): sermaye 550.000, mevcut I. tertip 50.000, net kâr 300.000, dağıtılacak 200.000 TL → sınır 110.000, kalan ayrılabilir 60.000; I. tertip 300.000 × %5 = 15.000; II. tertip (200.000 − 15.000) / 10 = 18.500; toplam 33.500 TL: <b>570 borç / 540 alacak<\/b>.<\/li>\n<li>Dikkat: I. tertip hesaplanan %5 tutar, sınıra kalan tutarı aşamaz. Sermayenin beşte birine ulaşılmışsa I. tertip ayrılmaz.<\/li>\n<li>Kâr yeni dönemde 570'e aktarıldığı için yedekler 570'ten ayrılır; aktarma yapılmamışsa 590 borçlanır.<\/li>\n<li>Zararın olağanüstü yedeklerden karşılanması: <b>542 borç / 580 alacak<\/b>.<\/li>\n<li>549'daki MDV yenileme fonu üç yıl sermaye unsuru olarak tutulabilir; yeni varlığın amortismanları fon tükeninceye kadar fondan karşılanır.<\/li>\n<\/ul>\n\n<h3>57–59 Geçmiş yıllar ve dönem sonucu<\/h3>\n<ul>\n<li><b>570 Geçmiş Yıllar Kârları:<\/b> dağıtılmamış ve yedeklere alınmamış kârlar. Yeni dönemde <b>590 borç / 570 alacak<\/b>.<\/li>\n<li><b>580 Geçmiş Yıllar Zararları (−):<\/b> aktif karakterli. Yeni dönemde <b>580 borç / 591 alacak<\/b>; zarar yedeklerle veya kârla kapatılınca alacaklanır.<\/li>\n<li><b>590 Dönem Net Kârı:<\/b> vergi sonrası net kâr; <b>591 Dönem Net Zararı (−)<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Adım<\/th><th>Kâr durumu<\/th><th>Zarar durumu<\/th><\/tr>\n<tr><td>1. Gelir ve gider hesapları 690'a<\/td><td colspan=\"2\">Gelirler 690'ın alacağına, giderler borcuna devredilir (kendileri kapanır)<\/td><\/tr>\n<tr><td>2. Vergi karşılığı<\/td><td colspan=\"2\">691 borç / 370 alacak<\/td><\/tr>\n<tr><td>3. 692'ye aktarma<\/td><td>690 borç; 691 alacak; 692 alacak (net kâr)<\/td><td>692 borç / 690 alacak; varsa 692 borç / 691 alacak<\/td><\/tr>\n<tr><td>4. Bilançoya aktarma<\/td><td>692 borç / <b>590<\/b> alacak<\/td><td><b>591<\/b> borç / 692 alacak<\/td><\/tr>\n<\/table>\n<p><b>Örnek: 690'ın alacak kalanı 500.000 TL (gelirler 1.900.000, giderler 1.400.000), vergi karşılığı 100.000 TL<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>690 Dönem Kârı veya Zararı<\/td><td><\/td><td>500.000<\/td><\/tr><tr><td><\/td><td>691 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları<\/td><td>100.000<\/td><\/tr><tr><td><\/td><td>692 Dönem Net Kârı veya Zararı<\/td><td>400.000<\/td><\/tr><tr><td>692 Dönem Net Kârı veya Zararı<\/td><td><\/td><td>400.000<\/td><\/tr><tr><td><\/td><td>590 Dönem Net Kârı<\/td><td>400.000<\/td><\/tr><\/table>\n<h3>6 Gelir tablosu hesapları<\/h3>\n<ul>\n<li>Gruplar: <b>60<\/b> Brüt Satışlar, <b>61<\/b> Satış İndirimleri (−), <b>62<\/b> Satışların Maliyeti (−), <b>63<\/b> Faaliyet Giderleri (−), <b>64<\/b> Diğer Faaliyetlerden Olağan Gelir ve Kârlar, <b>65<\/b> Diğer Faaliyetlerden Olağan Gider ve Zararlar (−), <b>66<\/b> Finansman Giderleri (−), <b>67<\/b> Olağandışı Gelir ve Kârlar, <b>68<\/b> Olağandışı Gider ve Zararlar (−), <b>69<\/b> Dönem Net Kârı veya Zararı.<\/li>\n<li>Gelir hesapları dönem içinde <b>alacaklı<\/b>, gider hesapları <b>borçlu<\/b> çalışır (düzeltme kayıtları hariç); dönem sonunda hepsi 690'a devredilerek kapanır. Faaliyet giderleri önce 7 sınıfında izlenir, sonra yansıtma ile 6'ya gelir.<\/li>\n<li><b>60–63<\/b> sonucu: <b>faaliyet kârı veya zararı<\/b>. <b>64–66<\/b> netleşmesi: diğer faaliyetlerden kâr veya zarar; faaliyet kârıyla toplamı <b>olağan kâr veya zarar<\/b>. <b>67–68<\/b> eklenince <b>dönem kârı veya zararı<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Grup / hesap<\/th><th>Önemli noktalar<\/th><\/tr>\n<tr><td>600 Yurt İçi, 601 Yurt Dışı Satışlar<\/td><td>Esas faaliyet satışları; <b>KDV dahil edilmez<\/b>. Holding ana şirketinin bağlı ortaklıklardan gelirleri de brüt satıştır. İhracatta para transferine kadar <b>satış dönemi içindeki<\/b> kur farkları ve dönem sonuna kadar tahsil edilmeyen alacağın dönem sonu kur farkı 601'e yazılır; <b>ertesi dönem<\/b> doğan olumlu kur farkı 646'ya.<\/td><\/tr>\n<tr><td>602 Diğer Gelirler<\/td><td>Sübvansiyonlar, vergi iadeleri, <b>faturada ayrı gösterilen vade farkları<\/b>, ihracatta fiyat istikrar destekleme primi. Vade farkı fiyata dahilse 600 veya 601'e yazılır.<\/td><\/tr>\n<tr><td>610 Satıştan İadeler, 611 Satış İskontoları, 612 Diğer İndirimler<\/td><td>611: satıştan sonra yapılan kasa ve miktar iskontoları. 612: alıcı hesabına ödenen sevk giderleri, hatalı veya hasarlı mal nedeniyle zorunlu indirimler, satış vergileri ve fonlar (KDV hariç).<\/td><\/tr>\n<tr><td>620, 621, 622, 623<\/td><td>Satılan mamuller, ticari mallar, hizmet ve diğer satışların maliyeti. Aralıklı yöntemde dönem içinde kullanılmaz; dönem sonunda tek kayıtla (152 borç kalanı − sayım). 622'ye 7/A'da 741 Hizmet Üretim Maliyeti Yansıtma'dan aktarılır.<\/td><\/tr>\n<tr><td>630, 631, 632<\/td><td>Ar-Ge (750 → 751), pazarlama, satış ve dağıtım (760 → 761), genel yönetim (770 → 771) giderleri; dönem sonunda 690'a.<\/td><\/tr>\n<tr><td>64 grubu<\/td><td>640 İştiraklerden Temettü Gelirleri (%10–%50), 641 Bağlı Ortaklıklardan Temettü Gelirleri (%50 üstü), 642 Faiz Gelirleri, 643 Komisyon Gelirleri, <b>644 Konusu Kalmayan Karşılıklar<\/b> (aktifle ilgili karşılıkların iptali), 645 Menkul Kıymet Satış Kârları, 646 Kambiyo Kârları, 647 Reeskont Faiz Gelirleri, 648 Enflasyon Düzeltmesi Kârları, 649 Diğer Olağan Gelir ve Kârlar (kira gelirleri gibi)<\/td><\/tr>\n<tr><td>65 grubu<\/td><td>653 Komisyon Giderleri, 654 Karşılık Giderleri (aktifle ilgili karşılıklar), 655 Menkul Kıymet Satış Zararları, <b>656 Kambiyo Zararları<\/b> (borçlanmayla ilgili kur farkları <b>hariç<\/b>, onlar finansman gideri), 657 Reeskont Faiz Giderleri, 658 Enflasyon Düzeltmesi Zararları, 659 Diğer Olağan Gider ve Zararlar<\/td><\/tr>\n<tr><td>66 grubu<\/td><td>660 Kısa Vadeli Borçlanma Giderleri (bir yıla kadar), 661 Uzun Vadeli Borçlanma Giderleri (bir yıldan uzun); varlık maliyetine eklenmeyen faiz, kur farkı, kredi komisyonu. 7/A'da 780 → 781 → 660/661.<\/td><\/tr>\n<tr><td>67 grubu<\/td><td>671 Önceki Dönem Gelir ve Kârları (hata veya unutma nedeniyle ilgili dönemde yansıtılmayan); 679 Diğer Olağandışı Gelir ve Kârlar (hasar fazlası tazminat, şartname bedeli, alınan ceza ve teminatlar, mali ve maddi duran varlık satış kârları, gelir kaydedilen depozito, sayım fazlası)<\/td><\/tr>\n<tr><td>68 grubu<\/td><td>680 Çalışmayan Kısım Gider ve Zararları (çalışılmayan süreye düşen direkt işçilik ve genel üretim giderleri; 721 ve 731 yansıtmadan), 681 Önceki Dönem Gider ve Zararları, 689 Diğer Olağandışı Gider ve Zararlar (karşılanamayan hasar, ödenen ceza ve tazminat, sayım noksanı, MDV satış zararı, bağış ve yardım vb.)<\/td><\/tr>\n<tr><td>69 grubu<\/td><td>690 Dönem Kârı veya Zararı (vergi öncesi), 691 Vergi Karşılıkları (−), 692 Dönem Net Kârı veya Zararı, 697 Yıllara Yaygın İnşaat Enflasyon Düzeltme, 698 Enflasyon Düzeltme Hesabı (kalanına göre 648 veya 658'e devredilir)<\/td><\/tr>\n<\/table>\n<p><b>Örnek: Peşin fiyatı 20.000 TL olan mal faturada vade farkı ayrı gösterilerek 23.000 TL'ye vadeli satıldı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>120 Alıcılar<\/td><td><\/td><td>23.000<\/td><\/tr><tr><td><\/td><td>600 Yurt İçi Satışlar<\/td><td>20.000<\/td><\/tr><tr><td><\/td><td>602 Diğer Gelirler (vade farkı)<\/td><td>3.000<\/td><\/tr><\/table><p><b>Örnek: 300.000 TL direkt işçiliğin %30'u çalışılmayan süreye ait<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>151 Yarı Mamuller – Üretim<\/td><td><\/td><td>210.000<\/td><\/tr><tr><td>680 Çalışmayan Kısım Gider ve Zararları<\/td><td><\/td><td>90.000<\/td><\/tr><tr><td><\/td><td>721 Direkt İşçilik Giderleri Yansıtma<\/td><td>300.000<\/td><\/tr><\/table>\n<p><b>Gelir tablosu örneği:<\/b> brüt satışlar 1.000.000; satış iadeleri 50.000; SMM 600.000; faaliyet giderleri 150.000 → <b>faaliyet kârı 200.000<\/b>. 64 grubu 40.000, 65 grubu 30.000, finansman giderleri 20.000 → <b>olağan kâr 190.000<\/b>. Olağandışı gelir 10.000, olağandışı gider 15.000 → <b>dönem kârı 185.000 TL<\/b>.<\/p>\n\n<h3>Dönem sonu işlemleri<\/h3>\n<h4>Mizan<\/h4>\n<ul>\n<li><b>Mizan:<\/b> belli bir döneme ait büyük defter hesaplarının borç ve alacak toplamları ile kalanlarını düzenli gösteren cetvel. Yevmiyeden büyük deftere aktarımın doğruluğunu kontrol eder.<\/li>\n<li>Çift taraflı kaydın sonucu: <b>günlük defter toplamı = mizan borç toplamı = mizan alacak toplamı<\/b>; ayrıca <b>borç kalanları toplamı = alacak kalanları toplamı<\/b>.<\/li>\n<li>Dikkat: Eşitlik hesapların kesin doğru olduğunu göstermez. Mizan unutma, kayma gibi nedenlerle oluşan <b>rakam hatalarını<\/b> saptar ama <b>hesap hatalarını<\/b> (yanlış hesaba kayıt gibi) göstermez.<\/li>\n<li>Dönemine göre: günlük, haftalık, aylık, yıllık. Envanter kayıtlarıyla ilişkisine göre: <b>genel geçici mizan<\/b> (envanter öncesi) ve <b>genel kesin mizan<\/b> (envanter sonrası).<\/li>\n<li>Türkiye'de işletmeler <b>aylık<\/b> ve <b>kümülatif<\/b> mizan çıkarır (Nisan mizanı dört ayı kapsar). On iki ayı kapsayan Aralık mizanı \"genel mizan\"dır; envanter kayıtlarından önceki haline genel geçici mizan denir. Genel kesin mizandan sonra o döneme ait deftere <b>kayıt yapılmaz<\/b>; gelir tablosu ve bilanço bu mizandan hazırlanır.<\/li>\n<\/ul>\n<h4>Envanter<\/h4>\n<ul>\n<li>Sürekli işletmelerde <b>dönem başı<\/b> (ilk yılda işe başlama envanteri; açılış veya başlangıç envanteri) ve <b>dönem sonu<\/b> envanteri vardır. Bir yılın dönem sonu envanteri sonraki yılın dönem başı envanteridir. Faaliyet sona ererken: <b>işi bırakma, tasfiye, iflas<\/b> envanteri.<\/li>\n<li><b>Muhasebe dışı (kayıt dışı) envanter:<\/b> mevcutlar, alacaklar ve borçların fiziki sayımı ve kayıtlarla karşılaştırılması. <b>Muhasebe içi envanter:<\/b> saptanan farklara göre düzeltme kayıtları, hata düzeltmeleri ve gelir-gider hesaplarının sonuç hesabıyla kapatılması.<\/li>\n<li><b>Ticari mallar:<\/b> sayıma mülkiyeti işletmeye ait tüm mallar (konsinye, yoldaki, komisyoncudaki mallar dahil) alınır; malın fiilen işletmede olması değil mülkiyet önemlidir. Maliyet bedeliyle değerlenir.<\/li>\n<li><b>Alacaklar:<\/b> <b>değersiz alacak<\/b> = kazai bir hükme veya kanaat verici bir vesikaya göre tahsili imkânsızlaşan alacak; mukayyet değerle zarar yazılır. <b>Şüpheli alacak<\/b> (VUK m.323): dava veya icra safhasındaki alacaklar ile protestoya veya yazıyla birden fazla istenmesine rağmen ödenmeyen, takibe değmeyecek küçük alacaklar; zarar yazılamaz, karşılık ayrılır. Sonradan tahsil edilen şüpheli alacaklar tahsil dönemi kâr veya zararına alınır.<\/li>\n<li>Diğer envanter işlemleri: amortismanlar, kasa ve banka mutabakatı, iştirak kârlarının tahakkuku, kredi faizleri, borç mutabakatı, nazım hesap kontrolü (koşullu işlem sona erdiyse kayıttan silinir), konsinye mal kontrolü, peşin ödenmiş giderler ile peşin tahsil edilmiş gelirlerin dönemlere ayrılması.<\/li>\n<li><b>Hesapların kapatılması:<\/b> raporlardan sonra alacak kalanı veren hesaplar borçlandırılarak, borç kalanı veren hesaplar alacaklandırılarak kapatılır. Genel kesin mizandaki borç kalanları aktifi, alacak kalanları pasifi oluşturur.<\/li>\n<\/ul>\n<ul>\n<li>Dikkat: 644 yalnız <b>aktifle ilgili<\/b> karşılıkların iptalinde kullanılır; pasif karakterli borç ve gider karşılıklarında fark 671 veya 681'e gider.<\/li>\n<li>Dikkat: Kredi kur farkı 66 grubuna (780 üzerinden), diğer yabancı para işlemlerinin kur zararı 656'ya yazılır.<\/li>\n<\/ul>", "sorular": [{"q": "Ödenmiş sermayesi 800.000 TL olan şirketin bugüne kadar ayırdığı I. tertip yedek akçe 150.000 TL, bu yılki safi kârı 400.000 TL'dir. Bu yıl ayrılacak I. tertip yedek akçe kaç TL'dir?", "o": ["10.000 TL", "20.000 TL", "160.000 TL", "40.000 TL", "Hiç ayrılmaz"], "a": 0, "e": "Sınır sermayenin beşte biri: 160.000 TL; ayrılabilecek kalan 10.000 TL. Kârın %5'i 20.000 TL olsa da sınırı aşamayacağı için 10.000 TL ayrılır."}, {"q": "6102 sayılı TTK'da I. tertip ve II. tertip yedek akçe hangi ad altında düzenlenmiştir?", "o": ["Genel kanuni yedek akçe", "Olağanüstü yedek akçe", "Statü yedek akçesi", "İhtiyari yedek akçe", "Özel fon"], "a": 0, "e": "Kitaptaki dipnota göre 6102 sayılı TTK'da her iki yedek akçe de genel kanuni yedek akçe olarak yer alır; statü yedekleri ana sözleşmeden, olağanüstü yedekler genel kurul kararından doğar."}, {"q": "Dönem sonunda gelirler toplamı 1.900.000 TL, giderler toplamı 1.400.000 TL'dir ve 100.000 TL vergi karşılığı hesaplanmıştır. 590 Dönem Net Kârı hesabına kaç TL alacak yazılır?", "o": ["500.000 TL", "600.000 TL", "400.000 TL", "1.900.000 TL", "300.000 TL"], "a": 2, "e": "690 alacak kalanı 500.000 TL; 691'deki 100.000 TL ile birlikte 692'ye aktarılınca net kâr 400.000 TL olur ve 692 borç, 590 alacak yazılır."}, {"q": "690 Dönem Kârı veya Zararı hesabı 80.000 TL borç kalanı vermiştir; ayrıca 691 hesabında 5.000 TL vergi karşılığı vardır. 591 Dönem Net Zararı hesabına kaç TL borç yazılır?", "o": ["80.000 TL", "85.000 TL", "75.000 TL", "5.000 TL", "90.000 TL"], "a": 1, "e": "690'ın borç kalanı 692'nin borcuna, 691 de 692'nin borcuna aktarılır: 80.000 + 5.000 = 85.000 TL; 591 borç, 692 alacak."}, {"q": "Üç ortak 200.000'er TL olmak üzere 600.000 TL sermaye taahhüt etmiştir. Ortak A ve B taahhütlerinin tamamını, Ortak C ise 50.000 TL'sini ödemiştir. 501 Ödenmemiş Sermaye hesabının kalanı nedir?", "o": ["150.000 TL alacak kalanı", "450.000 TL borç kalanı", "50.000 TL borç kalanı", "150.000 TL borç kalanı", "Hesap kapanmıştır"], "a": 3, "e": "Taahhütte 501 borç 600.000; ödemeler 200.000 + 200.000 + 50.000 = 450.000 alacak. Kalan 150.000 TL borç kalanı yerine getirilmemiş taahhüttür."}, {"q": "Şirket nominal değeri 300.000 TL olan yeni hisseleri 345.000 TL'ye satmıştır. 520 Hisse Senedi İhraç Primleri hesabına kaç TL alacak yazılır?", "o": ["345.000 TL", "45.000 TL", "300.000 TL", "15.000 TL", "Fark 649'a yazılır"], "a": 1, "e": "Nominal değer 500 Sermaye'ye, nominal değeri aşan 45.000 TL 520 Hisse Senedi İhraç Primleri'ne alacak yazılır."}, {"q": "Bir işletmenin verileri: brüt satışlar 1.000.000, satış iadeleri 50.000, satışların maliyeti 600.000, faaliyet giderleri 150.000, diğer faaliyetlerden olağan gelir 40.000, diğer faaliyetlerden olağan gider 30.000, finansman giderleri 20.000 TL'dir. Olağan kâr kaç TL'dir?", "o": ["200.000 TL", "210.000 TL", "190.000 TL", "350.000 TL", "170.000 TL"], "a": 2, "e": "Faaliyet kârı 1.000.000 − 50.000 − 600.000 − 150.000 = 200.000; olağan kâr 200.000 + 40.000 − 30.000 − 20.000 = 190.000 TL."}, {"q": "Olağan kârı 190.000 TL olan işletmenin olağandışı gelir ve kârları 10.000, olağandışı gider ve zararları 15.000 TL'dir. Vergi öncesi dönem kârı kaç TL'dir?", "o": ["195.000 TL", "190.000 TL", "215.000 TL", "165.000 TL", "185.000 TL"], "a": 4, "e": "Dönem kârı = olağan kâr + 67 grubu − 68 grubu = 190.000 + 10.000 − 15.000 = 185.000 TL."}, {"q": "Aralıklı sayım yöntemini uygulayan üretim işletmesinde 152 Mamuller hesabı 450.000 TL borç kalanı vermektedir; dönem sonu sayımında 310.000 TL mamul bulunmuştur. Yapılacak kayıt hangisidir?", "o": ["620 Satılan Mamuller Maliyeti borç, 152 Mamuller alacak 140.000 TL", "621 borç, 153 alacak 140.000 TL", "620 borç, 152 alacak 310.000 TL", "152 borç, 620 alacak 140.000 TL", "620 borç, 151 alacak 140.000 TL"], "a": 0, "e": "Aralıklı yöntemde 620 dönem sonunda tek kayıtla çalışır: 450.000 − 310.000 = 140.000 TL satılan mamul maliyetidir."}, {"q": "İhracat yapılan dönem içinde 1 YP = 2,00 TL kurundan kaydedilen 50.000 YP'lik alacak aynı dönemde 1 YP = 2,05 TL kurundan tahsil edilmiştir. Oluşan kur farkı hangi hesaba alacak yazılır?", "o": ["2.500 TL, 646 Kambiyo Kârları", "2.500 TL, 649 Diğer Olağan Gelir ve Kârlar", "102.500 TL, 601 Yurt Dışı Satışlar", "2.500 TL, 601 Yurt Dışı Satışlar", "2.500 TL, 602 Diğer Gelirler"], "a": 3, "e": "50.000 × (2,05 − 2,00) = 2.500 TL. Satışın yapıldığı dönem içindeki ihracat kur farkları 601'e yazılır; ertesi dönem oluşan olumlu kur farkları 646'ya gider."}, {"q": "Peşin fiyatı 20.000 TL olan mal, vade farkı faturada ayrıca gösterilerek 23.000 TL'ye vadeli satılmıştır. Vade farkı hangi hesaba kaydedilir?", "o": ["3.000 TL, 602 Diğer Gelirler", "3.000 TL, 642 Faiz Gelirleri", "3.000 TL, 600 Yurt İçi Satışlar", "23.000 TL, 600 Yurt İçi Satışlar", "3.000 TL, 647 Reeskont Faiz Gelirleri"], "a": 0, "e": "Faturada ayrı gösterilen vade farkı 602 Diğer Gelirler'e yazılır; vade farkı fiyata dahil edilmişse 600 veya 601'e kaydedilirdi."}, {"q": "Temmuz ayında tahakkuk eden 300.000 TL direkt işçilik giderinin %30'u çalışılmayan süreye aittir. 680 Çalışmayan Kısım Gider ve Zararları hesabına kaç TL borç yazılır?", "o": ["210.000 TL", "300.000 TL", "30.000 TL", "9.000 TL", "90.000 TL"], "a": 4, "e": "Çalışılmayan süreye düşen 300.000 × %30 = 90.000 TL 680'e, kalan 210.000 TL 151'e borç; 721 alacak 300.000 TL."}, {"q": "Maliyeti 200.000 TL olan mal için %60 değer kaybı karşılığı ayrılmıştı. Mal 95.000 TL'ye satılmıştır. Kitaptaki kayıt mantığına göre 644 Konusu Kalmayan Karşılıklar hesabına kaç TL alacak yazılır?", "o": ["120.000 TL", "95.000 TL", "25.000 TL", "80.000 TL", "15.000 TL"], "a": 4, "e": "Ayrılan karşılık 120.000 TL; beklenen satış değeri 80.000 TL. Fiili satış 95.000 TL olduğundan beklenen zararın 15.000 TL'si gerçekleşmemiş ve 644'e gelir yazılır."}, {"q": "Kasada defter değeri 12.000 TL olan 5.000 YP bulunmaktadır (1 YP = 2,40 TL). Dönem sonu kuru 1 YP = 2,20 TL'dir. Yapılacak kayıt hangisidir?", "o": ["780 Finansman Giderleri borç, 100 Kasa alacak 1.000 TL", "656 Kambiyo Zararları borç, 100 Kasa alacak 1.000 TL", "100 Kasa borç, 646 Kambiyo Kârları alacak 1.000 TL", "656 borç, 100 alacak 11.000 TL", "659 borç, 100 alacak 1.000 TL"], "a": 1, "e": "5.000 × (2,40 − 2,20) = 1.000 TL değer kaybı kambiyo zararıdır; borçlanmayla ilgili olmadığı için finansman gideri değildir."}, {"q": "Bir dönemin günlük defter maddelerinin borç ve alacak tutarları toplamı 4.750.000 TL'dir. Kayıtların büyük deftere doğru aktarıldığı varsayılırsa mizanın borç tutarları toplamı kaç TL olur?", "o": ["9.500.000 TL", "2.375.000 TL", "Hesap kalanlarına bağlıdır, belirlenemez", "4.750.000 TL", "0 TL"], "a": 3, "e": "Çift taraflı kayıt gereği günlük defter toplamı = mizan borç tutarları toplamı = mizan alacak tutarları toplamı."}, {"q": "Mizanla ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Borç ve alacak toplamlarının eşit olması kayıtların kesinlikle doğru olduğunu gösterir", "Borç kalanları toplamı alacak kalanları toplamına eşittir", "Türkiye'de mizanlar aylık ve kümülatif çıkarılır", "Envanter kayıtlarından sonra düzenlenen mizan genel kesin mizandır", "Genel kesin mizandan sonra o döneme ait deftere kayıt yapılmaz"], "a": 0, "e": "Mizan rakam hatalarını saptar ama yanlış hesaba kayıt gibi hesap hatalarını göstermez; eşitlik kayıtların kesin doğruluğunu kanıtlamaz."}, {"q": "Önceki yılın dönem net kârı yeni dönemin açılış kaydından sonra hangi kayıtla devredilir?", "o": ["570 borç, 590 alacak", "690 borç, 570 alacak", "590 Dönem Net Kârı borç, 570 Geçmiş Yıllar Kârları alacak", "590 borç, 540 Yasal Yedekler alacak", "692 borç, 570 alacak"], "a": 2, "e": "Önceki dönem net kârı yeni dönemde 590'ın borcuna, 570'in alacağına aktarılır; yedekler daha sonra 570'ten ayrılır."}, {"q": "Geçmiş yıllar zararının olağanüstü yedeklerden karşılanmasına karar verilmiştir. Yapılacak kayıt hangisidir?", "o": ["580 borç, 542 alacak", "570 borç, 580 alacak", "542 Olağanüstü Yedekler borç, 580 Geçmiş Yıllar Zararları alacak", "542 borç, 591 alacak", "540 borç, 580 alacak"], "a": 2, "e": "Aktif karakterli 580 zararın kapatılmasıyla alacaklanır; karşılığında kullanılan yedek hesabı (542) borçlanır."}, {"q": "Kâr yedekleri (54 grubu) genellikle hangi hesabın borçlandırılması karşılığında alacaklanır?", "o": ["500 Sermaye", "570 Geçmiş Yıllar Kârları", "690 Dönem Kârı veya Zararı", "520 Hisse Senedi İhraç Primleri", "580 Geçmiş Yıllar Zararları"], "a": 1, "e": "Kâr yedekleri önceki dönem kârlarından ayrılır; bu nedenle duran varlık satışı veya sigorta tazmini kârlarının doğrudan bu gruba alınması hariç 570'in borcu karşılığında alacaklanır."}, {"q": "Kayıtlı sermaye sistemindeki bir ortaklıkta 500 Sermaye hesabında hangi tutar gösterilir?", "o": ["Kayıtlı sermaye tavanı", "Ödenmemiş sermaye", "Piyasa değeri", "Çıkarılmış sermaye; kayıtlı sermaye tavanı dipnotta açıklanır", "Özkaynakların toplamı"], "a": 3, "e": "Kayıtlı sermaye sistemine alınan ortaklıklarda 500 hesabında çıkarılmış sermaye gösterilir; tavan dipnotlarda açıklanır."}, {"q": "İşletmenin sermayesinin %35'ine sahip olduğu şirketten aldığı temettü hangi hesaba alacak yazılır?", "o": ["641 Bağlı Ortaklıklardan Temettü Gelirleri", "640 İştiraklerden Temettü Gelirleri", "642 Faiz Gelirleri", "645 Menkul Kıymet Satış Kârları", "602 Diğer Gelirler"], "a": 1, "e": "En az %10, en fazla %50 paya sahip olunan işletmeler iştiraktir ve temettüleri 640'a yazılır; %50 üstü bağlı ortaklıktır (641)."}, {"q": "Aşağıdaki gelirlerden hangisi 679 Diğer Olağandışı Gelir ve Kârlar hesabında izlenir?", "o": ["Kira geliri", "Mevduat faiz geliri", "Hasar fazlası tazminat geliri", "İhracattan doğan satış geliri", "Senet reeskont faiz geliri"], "a": 2, "e": "679 hasar fazlası tazminat, şartname bedeli, alınan ceza ve teminatlar, duran varlık satış kârları, sayım fazlası gibi arızi gelirleri izler. Kira 649, faiz 642, ihracat 601, reeskont 647'dedir."}, {"q": "Brüt satışlar grubuyla ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Holding ana şirketinin bağlı ortaklıklardan elde ettiği gelirler bu grupta izlenebilir", "Sübvansiyonlar ve vergi iadeleri 602 Diğer Gelirler hesabında izlenir", "Satış dönemi içindeki ihracat kur farkları 601'e yazılır", "Faturada ayrı gösterilen vade farkları 602'de izlenir", "Satışlar üzerinden hesaplanan KDV brüt satışlara dahil edilir"], "a": 4, "e": "Brüt satışlara KDV dahil edilmez; KDV bilançodaki ilgili hesapta (391) izlenir."}, {"q": "Envanter işlemlerinde işletme mevcutları, alacak ve borçların fiziki sayımla kayıtlarla karşılaştırıldığı evreye ne ad verilir?", "o": ["Muhasebe dışı (kayıt dışı) envanter", "Muhasebe içi envanter", "Genel kesin mizan", "Hesapların kapatılması", "İflas envanteri"], "a": 0, "e": "Muhasebe dışı envanterde fiziki sayımla gerçek durum ve farklar saptanır; düzeltme kayıtları muhasebe içi envanterde yapılır."}, {"q": "VUK'a göre kazai bir hükme veya kanaat verici bir vesikaya göre tahsiline artık imkân kalmayan alacak nasıl adlandırılır ve nasıl işlem görür?", "o": ["Şüpheli alacak; karşılık ayrılır", "Değersiz alacak; reeskonta tabi tutulur", "Şüpheli alacak; doğrudan zarar yazılır", "Değersiz alacak; mukayyet değeriyle zarar yazılır", "Takipteki alacak; nazım hesaplarda izlenir"], "a": 3, "e": "Tahsil imkânı kalmayan alacak değersiz alacaktır ve kayıtlı değeriyle zarar yazılır. Şüpheli alacaklar ise zarar yazılamaz, karşılık ayrılır."}]}, {"id": 8, "kisa": "Raporlama Çerçevesi", "baslik": "Finansal Raporlamanın Yasal Zemini ve Kavramsal Çerçeve", "ozet": "TTK ve KGK düzenlemeleri, TFRS–BOBİ FRS–KÜMİ FRS ayrımı, kullanıcılar, niteliksel özellikler, tahakkuk ve ölçüm esasları.", "notlar": "<h3>Yasal zemin: TTK ve KGK<\/h3>\n<ul>\n<li><b>6102 sayılı TTK<\/b>'nın temel felsefesi: şeffaflık, doğru bilgiye engelsiz ulaşma, hesap verilebilirlik ve sorumluluk bilinci. Şirketler dünyasına en önemli katkılarından biri <b>TMS'nin uygulama kapsamını genişletmesi<\/b>dir.<\/li>\n<li>TTK öncesinde SPK, BDDK ve Hazine Müsteşarlığı Sigortacılık Genel Müdürlüğü düzenlemelerine tabi şirketlerin büyük çoğunluğu zaten zorunlu olarak TMS uyguluyordu.<\/li>\n<li><b>KGK (Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu)<\/b>: 2 Kasım 2011'de yayımlanan <b>660 sayılı KHK<\/b> ile kuruldu; standart yapma yetkisini <b>TMSK<\/b>'dan (Türkiye Muhasebe Standartları Kurulu) devraldı. Kamu tüzel kişiliğine sahiptir.<\/li>\n<li>KGK'nın yetkileri: uluslararası standartlarla uyumlu TMS'yi oluşturmak ve yayımlamak; bağımsız denetimde uygulama birliğini, güveni ve kaliteyi sağlamak; denetim standartlarını belirlemek; bağımsız denetçi ve denetim kuruluşlarını yetkilendirip denetlemek; bağımsız denetim alanında kamu gözetimi yapmak.<\/li>\n<li>IFRS'ler TMS olarak iç hukuka önce <b>tebliğlerle<\/b> aktarılıyordu; süreci hızlandırmak için artık <b>Kurul Kararı<\/b> şeklinde yayımlanıyor. Değişiklikte önce mevcut tebliğ yürürlükten kaldırılır, yeni metin Kurul Kararı olarak yayımlanır.<\/li>\n<li>Geniş anlamda \"Türkiye Muhasebe Standartları\" = TMS + TFRS + TMS Yorumları + TFRS Yorumları + KGK'nın özel standart ve düzenlemeleri. Dar anlamda TMS, IFRS ile uyumlu standart setidir.<\/li>\n<\/ul>\n\n<h3>TTK'da yasal kayıt ve finansal tablo ayrımı<\/h3>\n<p>TTK'nın muhasebe ve raporlama hükümleri esas olarak <b>m.64, m.88 ve Geçici m.1<\/b>'dedir. Yeni TTK'da kayıt tutma ile raporlama birbirinden ayrılmıştır.<\/p>\n<table>\n<tr><th>Konu<\/th><th>Dayanak<\/th><th>Kural<\/th><\/tr>\n<tr><td>Yasal muhasebe kayıtları<\/td><td>TTK m.64/5<\/td><td>1 Ocak 2013'ten itibaren tacirler defter tutma ve kayıt zamanında <b>213 sayılı VUK<\/b> hükümlerine ve VUK m.175 ile mükerrer m.257'ye dayanan düzenlemelere (Muhasebe Uygulamaları Genel Tebliğleri) uyar. Vergi ile bağ beklentinin aksine <b>güçlenmiştir<\/b>.<\/td><\/tr>\n<tr><td>Yasal finansal tablolar<\/td><td>TTK m.88 (m.64–88'e tabi kişiler)<\/td><td>Münferit ve konsolide finansal tablolar <b>KGK'nın yayımladığı TMS<\/b>, kavramsal çerçevedeki ilkeler ve yorumlara göre hazırlanır.<\/td><\/tr>\n<tr><td>Eski versiyon<\/td><td>26/6/2012 değişikliği öncesi TTK<\/td><td>Hem yasal kayıtlar hem bireysel ve konsolide tablolar TMS'ye uygun olacaktı; değişiklikle kayıtlar vergi kanunlarına bağlandı.<\/td><\/tr>\n<\/table>\n<ul>\n<li>TTK m.64/5 devamı: TTK'nın defter, envanter, aktifleştirme, karşılık, değerleme, saklama ve ibraz hükümleri, vergi matrahının VUK ve diğer vergi kanunlarına göre tespitine ve buna yönelik mali tabloların hazırlanmasına engel değildir.<\/li>\n<li>Standartları <b>yalnız KGK<\/b> belirler ve yayımlar. KGK işletme büyüklükleri, sektörler ve kâr amacı gütmeyen kuruluşlar için özel ve istisnai standart koyabilir; bunlar TMS'nin <b>cüz'ü<\/b> sayılır.<\/li>\n<li>Kanunla kurulmuş düzenleyici kurumlar, TMS'ye uygun olmak şartıyla kendi alanları için <b>ayrıntıya ilişkin sınırlı<\/b> düzenleme yapabilir.<\/li>\n<li><b>Boşluk doldurma sırası:<\/b> TMS → hüküm yoksa ilgili kurumun ayrıntı düzenlemesi → o da yoksa milletlerarası uygulamada genel kabul görmüş muhasebe ilkeleri.<\/li>\n<li>Geçici m.1/1: TMS iki bileşenden oluşur: (1) TMS/TFRS ve yorumları, (2) KGK'nın belirlediği özel standart ve düzenlemeler. İkinci bileşen TTK'nın yürürlük maddesi <b>m.1534/3<\/b>'te \"özel Türkiye Muhasebe Standartları\" diye anılır. <b>m.88/1<\/b>'e göre kavramsal çerçeve de standartların ayrılmaz parçasıdır.<\/li>\n<\/ul>\n\n<h3>TMS'yi kim uygular? (TTK Geçici m.1/2)<\/h3>\n<ul>\n<li><b>TMS uygulayacaklar:<\/b> (a) SPKn'ye göre araçları borsada veya teşkilatlanmış piyasada işlem gören şirketler, aracı kurumlar, portföy yönetim şirketleri ve konsolidasyona alınan işletmeler; (b) Bankacılık Kanunu m.3'teki bankalar ve bağlı ortaklıkları; (c) 5684 sayılı Kanundaki sigorta ve reasürans şirketleri; (d) 4632 sayılı Kanundaki emeklilik şirketleri; ayrıca zorunlu olmadığı halde TMS'yi tercih edenler.<\/li>\n<li><b>Özel standartları uygulayacaklar:<\/b> TMS zorunluluğu olmayan ve yönetimde yer almayan sahipler, borç verenler, derecelendirme kuruluşları gibi dış kullanıcılar için genel amaçlı tablo düzenleyenler; TMS'yi tercih edip KOBİ/TFRS'ye dönmek isteyen KOBİ'ler.<\/li>\n<li>KGK, Geçici m.1/4 uyarınca muafiyet tanıma ve ayrı düzenleme yapma yetkisine de sahiptir.<\/li>\n<li>26/8/2014 tarihli (RG 29100) Kurul kararı, BOBİ FRS'nin yayımı ve 700 sayılı KHK m.192 ile TTK m.397/4'teki denetime tabi şirketleri belirleme yetkisinin <b>Cumhurbaşkanı<\/b>na verilmesi üzerine, <b>13.09.2018 tarihli ve 03/161 sayılı KGK Kararı<\/b> (RG 19.09.2018, 30540) ile kaldırıldı. Ekli liste 2014 kararındakiyle aynıdır.<\/li>\n<\/ul>\n<table>\n<tr><th>13.09.2018 KGK Kararı m.3<\/th><th>Uygulanacak çerçeve<\/th><\/tr>\n<tr><td>(a) Ekli listedekiler<\/td><td>Münferit ve konsolide tablolarda <b>TFRS<\/b><\/td><\/tr>\n<tr><td>(b) Bağımsız denetime tabi olup listede olmayanlar<\/td><td><b>BOBİ FRS<\/b>; isterse TFRS<\/td><\/tr>\n<tr><td>(c) Kapsam dışındakiler<\/td><td>KGK henüz TMS yayımlamadığından <b>yürürlükteki mevzuat<\/b>; isterse TFRS veya BOBİ FRS<\/td><\/tr>\n<\/table>\n<h4>Ekli liste (TFRS uygulayacaklar)<\/h4>\n<table>\n<tr><th>Grup<\/th><th>Kimler<\/th><\/tr>\n<tr><td>1. SPK'ya tabi (6362)<\/td><td>Araçları borsada işlem gören AŞ'ler; araçlarını yalnız nitelikli yatırımcıya satıp borsada işlem görmeyenler; pay dışı aracı tahsisli ihraç eden halka açık olmayanlar; yatırım kuruluşları; kolektif yatırım kuruluşları; PYŞ; ipotek finansmanı kuruluşları; bağımsız denetim, gayrimenkul değerleme ve derecelendirme kuruluşları; konut ve varlık finansmanı fonları; varlık kiralama şirketleri; merkezî takas, merkezî saklama ve veri depolama kuruluşları.<\/td><\/tr>\n<tr><td>1(p) Borsada işlem görmeyen ama halka açık sayılanlar<\/td><td>Üç ölçütten en az ikisi: aktif toplamı <b>15 milyon TL<\/b> ve üstü; yıllık net satış <b>20 milyon TL<\/b> ve üstü; çalışan <b>50<\/b> ve üstü.<\/td><\/tr>\n<tr><td>2. BDDK'ya tabi (5411)<\/td><td>Bankalar, finansal kiralama, faktoring, finansman, varlık yönetim şirketleri, derecelendirme kuruluşları, finansal holdingler, finansal holdinglerde nitelikli paya sahip şirketler, ödeme ve elektronik para kuruluşları.<\/td><\/tr>\n<tr><td>3. Sigorta<\/td><td>5684 ve 4632 kapsamındaki sigorta, reasürans ve emeklilik şirketleri.<\/td><\/tr>\n<tr><td>4(a) A grubu yetkili müesseseler<\/td><td>Hazine ve Maliye Bakanlığından izinli olup üç ölçütten en az ikisi: brüt satış <b>250 milyon TL<\/b>, aktif <b>7,5 milyon TL<\/b>, çalışan <b>25<\/b> ve üstü.<\/td><\/tr>\n<tr><td>4(b)<\/td><td>Borsa İstanbul piyasalarında izinli yetkili müesseseler, kıymetli maden aracı kurumları, kıymetli maden üretimi veya ticareti yapan AŞ'ler.<\/td><\/tr>\n<\/table>\n\n<h3>BOBİ FRS (Büyük ve Orta Boy İşletmeler İçin FRS)<\/h3>\n<ul>\n<li>Tebliğ ve eki standart <b>29 Temmuz 2017<\/b> tarihli, 30138 sayılı mükerrer RG'de yayımlandı; <b>1/1/2018<\/b> ve sonrasında başlayan hesap dönemleri için, yayımı tarihinde yürürlüğe girdi.<\/li>\n<li>Kapsam: bağımsız denetime tabi olup <b>TFRS uygulamayan<\/b> işletmelerin münferit ve konsolide tabloları (TTK'ya göre genel kurula sunulacak tablolar). Amaç: gerçeğe uygun, ihtiyaca uygun ve karşılaştırılabilir tablolar.<\/li>\n<li><b>Arka plan:<\/b> KGK 2013 hesap dönemi için TFRS kapsamını bağımsız denetim kapsamıyla aynı tuttu. Denetim kapsamı genişledikçe küçük işletmelerin karmaşık TFRS'ye zorlanacağı düşünülünce 2014'te TFRS'yi denetim kapsamından ayırıp genel olarak <b>KAYİK<\/b> (kamu yararını ilgilendiren kuruluşlar) ile sınırladı; AB'de de UFRS borsa şirketleriyle sınırlıdır.<\/li>\n<li>TFRS uygulamayanların geçici çerçevesi: Hazine ve Maliye Bakanlığının <b>MSUGT<\/b>'leri (ilki 26/12/1992, 21447 mükerrer RG). MSUGT vergi odaklı olduğundan 29/12/2014 tarihli ve 41 sayılı KGK Kararıyla <b>\"İlave Hususlar\"<\/b> getirildi (ör. amortisman ve kıdem tazminatı karşılığı ayrılmasının zorunlu olması). BOBİ FRS, MSUGT ve İlave Hususlar'ın yerini aldı.<\/li>\n<li><b>İki yıl kuralı:<\/b> BOBİ FRS uygulayan, <b>iki yıl geçmedikçe<\/b> isteğe bağlı TFRS'ye geçemez; isteğe bağlı TFRS uygulayanın BOBİ FRS'ye dönmesi için <b>en az iki yıl<\/b> TFRS uygulamış olması gerekir.<\/li>\n<li><b>BOBİ FRS 2021 Sürümü<\/b>: 30/3/2021 tarihli, 31439 sayılı mükerrer RG. 2024'te enflasyon muhasebesi sonrası gereklilikler ve kripto varlıklar için değişiklikler yapıldı.<\/li>\n<\/ul>\n<h4>BOBİ FRS'de büyük işletme (2025 için)<\/h4>\n<table>\n<tr><th>Ölçüt<\/th><th>Eşik<\/th><\/tr>\n<tr><td>Aktif toplamı<\/td><td>1 milyar TL ve üstü<\/td><\/tr>\n<tr><td>Yıllık net satış hasılatı<\/td><td>2 milyar TL ve üstü<\/td><\/tr>\n<tr><td>Ortalama çalışan sayısı<\/td><td>250 ve üstü<\/td><\/tr>\n<\/table>\n<ul>\n<li>Üç ölçütten <b>en az ikisini<\/b>, varsa bağlı ortaklıklarıyla birlikte, <b>art arda iki raporlama döneminde<\/b> aşan işletme <b>müteakip<\/b> dönemde büyük işletme sayılır. Art arda iki dönemde en az ikisinin altında kalırsa büyük işletme olmaktan çıkar.<\/li>\n<li>Hesapta BOBİ FRS tabloları kullanılır; BOBİ FRS'ye göre tablo hazırlamayan bağlı ortaklıklar için <b>vergi dairesine verilen<\/b> tablolar esas alınır.<\/li>\n<li>Konsolide olmayan tablolar kullanılıp BOBİ FRS 22.25 (b) ve (c)'deki eliminasyonlar yapılmazsa aktif ve net satış eşikleri <b>%20 artırılarak<\/b> uygulanır (1,2 milyar TL ve 2,4 milyar TL).<\/li>\n<li>Ortalama çalışan sayısında 2022/6434 sayılı CK esas alınır. TFRS tablosu olmayanlar MSUGT ve İlave Hususlar'a (RG 30/12/2014, 29221) göre hazırlanmış tabloları kullanır.<\/li>\n<li>İlave Hususlar m.6/2 uyarınca geçmiş kıdem tazminatını <b>eşit taksitlerle<\/b> yansıtan işletme buna devam edebilir; tahmini toplam tutar ve yansıtılmayan kısım dipnotta açıklanır.<\/li>\n<\/ul>\n\n<h3>KÜMİ FRS (Küçük ve Mikro İşletmeler İçin FRS)<\/h3>\n<ul>\n<li>16/1/2023 tarihli, 32075 sayılı mükerrer RG; <b>1/1/2023<\/b> ve sonrasında başlayan dönemler için yayımı tarihinde yürürlüğe girdi.<\/li>\n<li>Hedef: TTK'ya göre bağımsız denetime tabi olmayan ve ihtiyari olarak TFRS veya BOBİ FRS uygulamayan, TTK m.64–88'e tabi gerçek ve tüzel kişiler.<\/li>\n<li><b>Zorunlu uygulama<\/b> (6434 sayılı CK'ya göre denetime tabi olmayan tacirlerce): (i) CK kapsamı dışında olup <b>diğer mevzuat<\/b> uyarınca denetime tabi tablolar; (ii) düzenleyici kurumlarca istenen denetimden geçmiş tablolar veya KGK standartlarına atıfla istenen tablolar. Bunların dışındaki küçük ve mikro işletmeler için <b>ihtiyari<\/b>.<\/li>\n<li>Özellikleri: <b>22 bölüm, 104 sayfa<\/b>; AB Direktifindeki <b>\"önce küçükleri düşün\"<\/b> yaklaşımı; TFRS ve BOBİ FRS'den daha az maliyetli; genel olarak <b>maliyet esaslı<\/b>; tablo formatları ve terimler sözlüğü içerir; uluslararası uygulamalarla tutarlı. 2024'te enflasyon muhasebesi sonrası değişiklik yapıldı.<\/li>\n<\/ul>\n<table>\n<tr><th>İşletme<\/th><th>Çerçeve<\/th><\/tr>\n<tr><td>Kamu yararını ilgilendiren kuruluşlar (KAYİK)<\/td><td>IFRS ile tam uyumlu <b>TFRS<\/b><\/td><\/tr>\n<tr><td>Bağımsız denetime tabi, TFRS uygulamayan<\/td><td><b>BOBİ FRS<\/b><\/td><\/tr>\n<tr><td>Denetime tabi olmayan, ihtiyari TFRS/BOBİ FRS uygulamayan (TTK m.64–88)<\/td><td><b>KÜMİ FRS<\/b><\/td><\/tr>\n<\/table>\n\n<h3>Finansal raporlama standartlarına uygun hesap planı<\/h3>\n<ul>\n<li>İşletmeler tablolarını TFRS veya BOBİ FRS'ye göre hazırlasa da defterleri <b>1992 MSUGT tekdüzen hesap planı<\/b>na göre tutuluyor; bu plan TFRS/BOBİ tablolarına doğrudan ulaşmaya yetmiyor.<\/li>\n<li>KGK 2019'da taslağı görüşe açtı; <b>30.07.2024 tarih ve 2024-51 sayılı duyuru<\/b> ile yayımlanmasına karar verdi.<\/li>\n<li>Kimin için: finansal kuruluşlar dışında, <b>bilanço esasına göre<\/b> defter tutan ve çerçevesi TFRS veya BOBİ FRS olanlar. Uygulaması <b>zorunlu değil, ihtiyari<\/b>.<\/li>\n<li>Kapsam dışı: bankalar, finansal holdingler, finansal kiralama, faktoring, finansman, ödeme ve e-para kuruluşları, sigorta, bireysel emeklilik, sermaye piyasası kuruluşları gibi otoritesince <b>sektörel hesap planı<\/b> yayımlanmış olanlar.<\/li>\n<\/ul>\n\n<h3>Finansal raporlamanın amacı ve kullanıcılar (2.1.1)<\/h3>\n<ul>\n<li>Amaç: kullanıcılara işletmeye kaynak sağlama ve diğer kararlarında faydalı finansal bilgi sunmak. Kullanıcılar işletmenin <b>paydaşları<\/b>dır.<\/li>\n<li>Raporlanan tablolar <b>genel amaçlı<\/b>dır. Özel amaçlı tablolar çoğunlukla iç kullanıcılar içindir ve raporlama düzenlemelerinin kapsamına girmez; \"finansal tablo\" aksi belirtilmedikçe genel amaçlı tablo demektir.<\/li>\n<\/ul>\n<table>\n<tr><th>Kullanıcı<\/th><th>İlgilendiği bilgi<\/th><\/tr>\n<tr><td>Yatırımcılar (mevcut ve potansiyel, analistler dâhil)<\/td><td>Risk ve getiri; al, elde tut, sat kararı; kâr payı ödeme gücü. Kullanıcıların <b>ilki<\/b>dir.<\/td><\/tr>\n<tr><td>Borç ve kredi verenler<\/td><td>Anapara ve faizin zamanında tahsili; en önemli kısmı bankalar.<\/td><\/tr>\n<tr><td>Çalışanlar<\/td><td>Devamlılık ve kârlılık; ücret, emeklilik gibi yükümlülükleri ödeme ve iş sağlama gücü.<\/td><\/tr>\n<tr><td>Yöneticiler<\/td><td>Karar, plan ve kontrol. İç kaynaklardan bilgi alabildikleri için genel amaçlı raporlara bağlı kalmaları gerekmez.<\/td><\/tr>\n<tr><td>Satıcılar ve tedarikçiler<\/td><td>Borcun vadesinde ödenmesi; kredi verenlere göre <b>kısa vadeli<\/b> performansla daha çok ilgilenir.<\/td><\/tr>\n<tr><td>Müşteriler<\/td><td>Uzun süreli iş ilişkisinde işletmenin devamlılığı.<\/td><\/tr>\n<tr><td>Hükümetler<\/td><td>Kaynak tahsisi, yasal düzenleme, vergi politikası, ulusal gelir istatistikleri.<\/td><\/tr>\n<tr><td>Kamu<\/td><td>Bölgesel istihdam ve tedarik gibi katkılar; geçmiş eğilimler ve son gelişmeler.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Asli kullanıcılar:<\/b> mevcut ve potansiyel yatırımcılar, borç verenler ve kredi verenler. Neden: işletmeden doğrudan bilgi talep etme imkânları yoktur; rasyonel tek yol finansal raporlara güvenmektir.<\/li>\n<li><b>Kısıt:<\/b> kullanıcıların kararları birbirinden çok farklıdır (pay al-tut-sat, yönetimin yeterliliği, ücret ödeme gücü, fonların emniyeti, vergi politikası, dağıtılabilir kâr, ulusal gelir istatistiği, yasal düzenleme). Genel amaçlı tablolar her bilgi ihtiyacını karşılayamaz; ekonomi, siyaset, sektör gibi dış bilgiler de gerekir.<\/li>\n<li>Getiri beklentileri, işletmeye gelecekteki <b>net nakit girişlerinin tutarı, zamanlaması ve belirsizliği<\/b>ne bağlıdır. Kullanıcı için asıl önemli olan işletmenin <b>nakit yaratma kabiliyeti<\/b>dir.<\/li>\n<\/ul>\n\n<h3>Faydalı finansal bilginin niteliksel özellikleri (2.1.2)<\/h3>\n<table>\n<tr><th>Grup<\/th><th>Özellik<\/th><th>Kilit nokta<\/th><\/tr>\n<tr><td>Temel<\/td><td>İhtiyaca uygunluk<\/td><td>Kararları etkileme gücü; <b>tahminlerde kullanılabilme<\/b> ve/veya <b>teyit etme<\/b> özelliği. Bilginin kendisinin tahmin olması gerekmez.<\/td><\/tr>\n<tr><td>Temel<\/td><td>Gerçeğe uygun sunum<\/td><td>Sunum <b>tam, tarafsız ve hatasız<\/b> olmalı.<\/td><\/tr>\n<tr><td>Destekleyici<\/td><td>Karşılaştırılabilirlik<\/td><td>En az <b>iki kalem<\/b> gerekir; tek kalemle ilgili değildir.<\/td><\/tr>\n<tr><td>Destekleyici<\/td><td>Doğrulanabilirlik<\/td><td>Bağımsız gözlemcilerin görüş birliği; tam uzlaşma gerekmez.<\/td><\/tr>\n<tr><td>Destekleyici<\/td><td>Zamanında sunum<\/td><td>Bilgi kararı etkileyebileceği anda mevcut olmalı.<\/td><\/tr>\n<tr><td>Destekleyici<\/td><td>Anlaşılabilirlik<\/td><td>Açık ve öz sınıflandırma, tanımlama, sunum.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Tahmin ve teyit özellikleri birbiriyle ilişkilidir; tahminde kullanılabilen bilgi genellikle teyit özelliği de taşır. Teyit: önceki değerlendirmeleri doğrulayan veya değiştiren geri bildirim.<\/li>\n<li><b>Önemlilik<\/b>, ihtiyaca uygunluğun <b>işletmeye özgü<\/b> hâlidir: bilginin verilmemesi veya yanlış verilmesi kararları etkileyebiliyorsa bilgi önemlidir. Kalemin niteliğine, büyüklüğüne veya her ikisine bağlıdır. <b>Dikkat:<\/b> önemlilik için standart bir sayısal eşik belirlenmez.<\/li>\n<li><b>Tam sunum:<\/b> anlaşılması için gereken tüm bilgi, tanım ve açıklamalar. <b>Tarafsız sunum:<\/b> seçim ve gösterimde önyargı ve yönlendirme yok; tarafsız bilgi, kararlar üzerinde etkisiz bilgi demek değildir. <b>Hatasız sunum:<\/b> tanımlamada hata veya ihmal yok, süreç doğru seçilip uygulanmış. <b>Dikkat:<\/b> hatasız, her açıdan kesin doğru demek değildir.<\/li>\n<li>Belirsizliği çok yüksek bir tahmin, gerçeğe uygun sunulsa da faydalı olmaz.<\/li>\n<li><b>Tutarlılık ≠ karşılaştırılabilirlik:<\/b> tutarlılık aynı kalemler için aynı yöntemin kullanılmasıdır (araç); karşılaştırılabilirlik amaçtır. Benzer şeyler benzer, farklı şeyler farklı görünmelidir. Aynı olay için alternatif yöntemlere izin verilmesi karşılaştırılabilirliği <b>azaltır<\/b>.<\/li>\n<li>Doğrulamada nokta tahmini gerekmez; olası tutarlar aralığı ve olasılıkları da doğrulanabilir. <b>Doğrudan doğrulama:<\/b> nakit sayımı gibi gözlem. <b>Dolaylı doğrulama:<\/b> modeldeki girdileri kontrol edip yeniden hesaplama (ör. stokları aynı maliyet akış varsayımıyla, FIFO, yeniden hesaplamak).<\/li>\n<li>Zamanında sunum: bilgi eskidikçe faydası genellikle azalır; ancak eğilim analizi için uzun süre sonra da yararlı olabilir.<\/li>\n<li>Anlaşılabilirlik: karmaşık olayları rapordan çıkarmak raporu kolaylaştırır ama <b>eksiklik nedeniyle yanıltıcı<\/b> hâle getirebilir.<\/li>\n<\/ul>\n\n<h3>Finansal tablo kalemlerinin tahakkuku (2.1.3)<\/h3>\n<ul>\n<li>Tahakkuk: uygun hesabın belirlenmesi, parasal tutarla tanımlanması ve bilanço ile kâr veya zarar tablosu toplamlarına dâhil edilmesi.<\/li>\n<li>Tanıma giren bir kalem iki koşulla raporlanır: (1) <b>gelecekte ekonomik yarar olasılığı<\/b> (yarar girişi veya çıkışı muhtemel olmalı); (2) <b>ölçümlemenin güvenilirliği<\/b> (bilgi tam, tarafsız ve hatasız olduğunda güvenilirdir). Koşullar sağlanmazsa kalem tablo unsuru olarak muhasebeleştirilmez.<\/li>\n<li>Belirsizlik, tablolar hazırlanırken eldeki verilere göre değerlendirilir. Tahsili olası görünen alacak varlık olarak kaydedilir; çok sayıda alacakta bir kısmının tahsil edilememe olasılığı esas alınır ve beklenen azalma kadar <b>gider<\/b> tahakkuk ettirilir.<\/li>\n<li>Makul tahmin güvenilirliği zayıflatmaz; makul tahmin yapılamıyorsa kalem tahakkuk ettirilmez. Ör. davadan beklenen tazminat güvenilir tahmin edilemiyorsa varlık ve gelir kaydı yapılmaz.<\/li>\n<li><b>Varlık:<\/b> yarar girişi muhtemel ve ölçüm güvenilir ise bilançoda. Harcama sonraki dönemlere yarar sağlamayacaksa varlık değil, <b>gider<\/b>dir. <b>Borç:<\/b> mevcut yükümlülük için kaynak çıkışı gerçekleşecek ve tutar güvenilir ölçülebiliyorsa.<\/li>\n<li>Gelir ve giderde iki soru: <b>kime göre<\/b> tanımlanacak (muhasebe kuramına göre olmalı; Türkiye'de çoğunlukla vergi düzenlemeleri belirleyici) ve <b>hangi döneme<\/b> ait.<\/li>\n<\/ul>\n<table>\n<tr><th>Esas<\/th><th>Gelir<\/th><th>Gider<\/th><\/tr>\n<tr><td>Nakit esası<\/td><td>Tahsil edildiği dönemin geliri<\/td><td>Ödendiği dönemin gideri<\/td><\/tr>\n<tr><td>Tahakkuk esası<\/td><td>Satış veya hizmetin yapıldığı dönemin geliri<\/td><td>Meydana geldiği dönemin gideri<\/td><\/tr>\n<\/table>\n<p><b>Dönemsellik varsayımı<\/b> şu ilkelerin uygulanmasını zorunlu kılar: hesap kesimi, tahakkuk esası, gelirin gerçekleşme noktası ve gelirin ilgili giderle karşılaştırılması.<\/p>\n\n<h3>Ölçüm esasları (2.1.4)<\/h3>\n<table>\n<tr><th>Esas<\/th><th>Tanım<\/th><\/tr>\n<tr><td>Tarihi maliyet<\/td><td>Varlık, edinme tarihinde ödenen nakit veya nakit benzeri ya da verilen varlığın gerçeğe uygun değeriyle; borç, karşılığında elde edilenle veya (gelir vergisi gibi) kapatmak için gereken nakit tutarıyla ölçülür.<\/td><\/tr>\n<tr><td>Cari değer: gerçeğe uygun değer<\/td><td>Ölçüm tarihinde piyasa katılımcıları arasında olağan işlemde varlığın satışıyla alınacak veya yükümlülüğün devriyle ödenecek fiyat.<\/td><\/tr>\n<tr><td>Cari değer: kullanım değeri<\/td><td>Varlığın kullanımı ve nihai elden çıkarılmasından beklenen nakit akışlarının <b>bugünkü değeri<\/b>.<\/td><\/tr>\n<tr><td>Cari değer: ifa değeri<\/td><td>Yükümlülüğün yerine getirilmesiyle devredilmesi beklenen kaynakların bugünkü değeri.<\/td><\/tr>\n<tr><td>Cari değer: cari maliyet<\/td><td>Varlıkta: ölçüm tarihinde ödenecek bedel <b>+<\/b> işlem maliyetleri. Yükümlülükte: alınacak bedel <b>−<\/b> işlem maliyetleri.<\/td><\/tr>\n<\/table>\n<p>Cari değer ölçümleri, önceki ölçümden bu yana nakit akış tahminlerinde ve diğer faktörlerde olan değişiklikleri yansıtacak şekilde güncellenir.<\/p>", "sorular": [{"q": "6102 sayılı TTK'ya göre 1 Ocak 2013'ten itibaren tacirlerin yasal muhasebe kayıtları ile finansal tabloları hangi düzenlemelere göre hazırlanır?", "o": ["Kayıtlar da tablolar da TMS'ye göre", "Kayıtlar TMS'ye göre, finansal tablolar VUK'a göre", "Kayıtlar VUK ve ona dayalı düzenlemelere göre, finansal tablolar TMS'ye göre", "Kayıtlar da tablolar da VUK'a göre", "Kayıtlar SPK düzenlemelerine göre, tablolar BOBİ FRS'ye göre"], "a": 2, "e": "TTK m.64/5 yasal kayıtları VUK'a bağlar; m.88 ise münferit ve konsolide finansal tabloların KGK'nın yayımladığı TMS'ye göre hazırlanmasını ister."}, {"q": "TTK'ya göre Türkiye Muhasebe Standartlarında bir konuda hüküm bulunmaması hâlinde izlenecek sıra hangisidir?", "o": ["Önce ilgili düzenleyici kurumun ayrıntı düzenlemesi, o da yoksa milletlerarası uygulamada genel kabul görmüş muhasebe ilkeleri", "Önce VUK hükümleri, sonra MSUGT", "Önce milletlerarası genel kabul görmüş ilkeler, sonra ilgili kurumun düzenlemesi", "Doğrudan KGK'ya başvurulup görüş alınması", "Yönetim kurulunun serbestçe belirleyeceği politika"], "a": 0, "e": "TMS'de hüküm yoksa ilgili kurum ve kurulların ayrıntı düzenlemesi, o düzenlemede de hüküm yoksa milletlerarası uygulamada genel kabul gören muhasebe ilkeleri uygulanır."}, {"q": "KGK, muhasebe standardı yapma yetkisini hangi kurumdan devralmıştır?", "o": ["Sermaye Piyasası Kurulu", "Hazine Müsteşarlığı Sigortacılık Genel Müdürlüğü", "Bankacılık Düzenleme ve Denetleme Kurumu", "Türkiye Muhasebe Standartları Kurulu (TMSK)", "TÜRMOB"], "a": 3, "e": "660 sayılı KHK ile kurulan KGK, standart yapma yetkisini TMSK'dan devralmıştır."}, {"q": "TTK Geçici m.1/2'ye göre aşağıdakilerden hangisi TMS'yi uygulamak zorunda olan işletmeler arasında sayılmamıştır?", "o": ["Sermaye piyasası araçları borsada işlem gören şirketler", "Bağımsız denetime tabi olmayan limited şirketler", "Sigorta ve reasürans şirketleri", "Emeklilik şirketleri", "Bankacılık Kanunu m.3'te tanımlanan bankalar"], "a": 1, "e": "Geçici m.1/2 SPK kapsamındaki borsa şirketleri, aracı kurumlar ve PYŞ'leri, bankaları, sigorta-reasürans ve emeklilik şirketlerini sayar; denetime tabi olmayan limited şirketler bu listede yoktur."}, {"q": "13.09.2018 tarihli KGK Kararına göre bağımsız denetime tabi olup ekli listede yer almayan bir işletme münferit tablolarında hangi çerçeveyi uygular?", "o": ["Zorunlu olarak TFRS", "Yürürlükteki vergi mevzuatı; TFRS'yi seçemez", "KÜMİ FRS", "Yalnızca MSUGT", "BOBİ FRS; isterse TFRS"], "a": 4, "e": "Karar m.3/b: ekli listede olmayan denetime tabi işletmeler BOBİ FRS uygular, isteğe bağlı olarak TFRS'yi seçebilir."}, {"q": "Payları borsada işlem görmeyen ancak SPKn kapsamında halka açık sayılan bir şirket iki yıldır şu verilere sahiptir: aktif toplamı 18 milyon TL, yıllık net satış 17 milyon TL, çalışan sayısı 55. KGK'nın ekli listesine göre bu şirketin durumu nedir?", "o": ["Hiçbir ölçütü sağlamadığı için TFRS uygulamaz", "Yalnızca bir ölçütü sağladığı için listeye girmez", "Üç ölçütü de sağlamadığı için listede değildir", "Aktif ve çalışan ölçütlerini sağladığı için TFRS uygulayacaklar listesindedir", "Yalnızca net satış ölçütü belirleyicidir"], "a": 3, "e": "Eşikler 15 milyon TL aktif, 20 milyon TL net satış ve 50 çalışandır; en az ikisi yeterlidir. Aktif 18 ≥ 15 ve çalışan 55 ≥ 50 olduğundan iki ölçüt sağlanır."}, {"q": "Hazine ve Maliye Bakanlığınca izin verilmiş A grubu yetkili müesseselerin TFRS uygulayacaklar listesine girmesi için kullanılan eşiklerden hangisi doğrudur?", "o": ["Brüt satış 150 milyon TL, aktif 15 milyon TL, çalışan 50", "Brüt satış 250 milyon TL, aktif 7,5 milyon TL, çalışan 25", "Brüt satış 20 milyon TL, aktif 15 milyon TL, çalışan 50", "Brüt satış 1 milyar TL, aktif 500 milyon TL, çalışan 150", "Brüt satış 250 milyon TL, aktif 25 milyon TL, çalışan 75"], "a": 1, "e": "Ekli listenin 4(a) bendi: brüt satış 250 milyon TL, aktif 7,5 milyon TL, çalışan 25 ve üstü; üç ölçütten en az ikisi."}, {"q": "BOBİ FRS ile TFRS arasındaki geçiş kuralına ilişkin hangisi doğrudur?", "o": ["BOBİ FRS uygulayan bir işletme istediği yıl TFRS'ye geçebilir", "İsteğe bağlı TFRS uygulayan işletme bir yıl sonra BOBİ FRS'ye dönebilir", "BOBİ FRS ile TFRS arasında geçiş yasaktır", "Geçiş için üç yıllık bekleme süresi vardır", "BOBİ FRS uygulayan iki yıl geçmedikçe isteğe bağlı TFRS uygulayamaz; TFRS'den BOBİ FRS'ye dönmek için en az iki yıl TFRS uygulamış olmak gerekir"], "a": 4, "e": "Kitaptaki kural her iki yön için de iki yıldır."}, {"q": "BOBİ FRS'ye göre 2025 yılı için büyük işletme tanımında kullanılan eşiklerden hangisi doğrudur?", "o": ["Aktif 500 milyon TL, net satış 1 milyar TL, çalışan 150", "Aktif 2 milyar TL, net satış 1 milyar TL, çalışan 250", "Aktif 1 milyar TL, net satış 2 milyar TL, ortalama çalışan 250", "Aktif 1 milyar TL, net satış 2 milyar TL, çalışan 500", "Aktif 120 milyon TL, net satış 150 milyon TL, çalışan 100"], "a": 2, "e": "2025 için büyük işletme eşikleri: aktif 1 milyar TL, yıllık net satış 2 milyar TL, ortalama çalışan 250; üçünden en az ikisi art arda iki dönemde aşılmalıdır."}, {"q": "Bir işletme büyük işletme testinde konsolide olmayan tablolarını kullanmakta ve BOBİ FRS 22.25'teki eliminasyonları yapmamaktadır. Art arda iki dönemde aktif toplamı 1,15 milyar TL, net satışı 2,3 milyar TL ve ortalama çalışanı 240'tır. Sonuç nedir?", "o": ["Eliminasyon yapılmadığından eşikler %20 artırılır (1,2 milyar ve 2,4 milyar TL); hiçbir ölçüt aşılmadığı için büyük işletme değildir", "Yalnızca satış eşiğini aştığı için büyük işletmedir", "Aktif ve satış eşiklerini aştığı için büyük işletmedir", "Çalışan sayısı 250'ye yakın olduğu için büyük işletmedir", "Eliminasyon yapılmadığından test yapılamaz"], "a": 0, "e": "Eliminasyon yapılmazsa aktif ve net satış eşikleri %20 artar: 1 milyar × 1,2 = 1,2 milyar; 2 milyar × 1,2 = 2,4 milyar. 1,15 milyar 1,2 milyardan, 2,3 milyar 2,4 milyardan küçüktür; çalışan da 250'nin altındadır."}, {"q": "KÜMİ FRS'ye ilişkin hangisi yanlıştır?", "o": ["22 bölüm ve 104 sayfadan oluşur", "\"Önce küçükleri düşün\" yaklaşımını benimser", "Finansal tablo formatlarına ve terimler sözlüğüne yer verir", "1/1/2023 ve sonrasında başlayan hesap dönemlerinde uygulanır", "Genel itibarıyla gerçeğe uygun değer esaslı bir yaklaşım benimser"], "a": 4, "e": "KÜMİ FRS genel itibarıyla maliyet esaslı bir yaklaşım benimser; gerçeğe uygun değer esaslı değildir."}, {"q": "KGK'nın 2024'te yayımlanmasına karar verdiği \"Finansal Raporlama Standartlarına Uygun Hesap Planı\" için hangisi doğrudur?", "o": ["Tüm işletmeler için zorunludur", "Yalnızca bankalar için hazırlanmıştır", "Çerçevesi TFRS veya BOBİ FRS olan, finansal kuruluş dışı ve bilanço esasına göre defter tutanlarca ihtiyari kullanılabilir", "KÜMİ FRS uygulayanlar için zorunludur", "MSUGT'yi tamamen yürürlükten kaldırmıştır"], "a": 2, "e": "30.07.2024 tarihli 2024-51 sayılı duyuruya göre hesap planının uygulanması zorunlu değildir; sektörel hesap planı olan finansal kuruluşlar kapsam dışıdır."}, {"q": "Finansal tabloların asli kullanıcıları olarak nitelenen grup hangisidir ve bunun temel nedeni nedir?", "o": ["Mevcut ve potansiyel yatırımcılar, borç verenler ve kredi verenler; işletmeden doğrudan bilgi talep etme imkânları yoktur", "Hükümetler; vergi politikası belirlerler", "Yöneticiler; işletmeyi en iyi onlar tanır", "Çalışanlar; ücretleri işletmeye bağlıdır", "Müşteriler; işletmenin devamlılığına ihtiyaç duyarlar"], "a": 0, "e": "Asli kullanıcılar yatırımcılar, borç verenler ve kredi verenlerdir; doğrudan bilgi talep edemedikleri için finansal raporlara güvenmek zorundadırlar."}, {"q": "Finansal tablo kullanıcılarından hangisi, işletmeye finansal borç verenlere kıyasla daha çok kısa vadeli performansla ilgilenir?", "o": ["Yatırımcılar", "Kamu", "Hükümetler", "Satıcılar ve diğer ticari tedarikçiler", "Çalışanlar"], "a": 3, "e": "Satıcılar ve ticari tedarikçiler işletmeye bir şekilde fon kullandırır, ancak finansal borç verenlere göre kısa vadeli performansla daha çok ilgilenirler."}, {"q": "Aşağıdakilerden hangisi faydalı finansal bilginin temel niteliksel özelliklerindendir?", "o": ["Karşılaştırılabilirlik", "Gerçeğe uygun sunum", "Zamanında sunum", "Doğrulanabilirlik", "Anlaşılabilirlik"], "a": 1, "e": "Temel özellikler ihtiyaca uygunluk ve gerçeğe uygun sunumdur; diğer dördü destekleyici özelliktir."}, {"q": "Önemlilik kavramına ilişkin hangisi doğrudur?", "o": ["İhtiyaca uygunluğun işletmeye özgü hâlidir ve kalemin niteliğine, büyüklüğüne ya da her ikisine göre değerlendirilir", "Standartlarda tüm işletmeler için tek bir sayısal eşik belirlenmiştir", "Yalnızca kalemin tutarına göre belirlenir", "Destekleyici niteliksel özelliklerden biridir", "Gerçeğe uygun sunumun alt bileşenidir"], "a": 0, "e": "Önemlilik ihtiyaca uygunluğun işletmeye özgü hâlidir; standart bir sayısal eşik belirlenmez."}, {"q": "Bir işletmenin dönem sonundaki stoklarının defter değerinin, girdi verileri kontrol edilip ilk giren ilk çıkar yöntemiyle yeniden hesaplanarak teyit edilmesi hangi doğrulama türüne örnektir?", "o": ["Doğrudan doğrulama", "Tarafsız sunum", "Teyit edici ihtiyaca uygunluk", "Dolaylı doğrulama", "Zamanında sunum"], "a": 3, "e": "Modelde veya formülde kullanılan verilerin kontrol edilip aynı yöntemle yeniden hesaplanması dolaylı doğrulamadır; nakit sayımı ise doğrudan doğrulamadır."}, {"q": "Tutarlılık ile karşılaştırılabilirlik ilişkisi için hangisi doğrudur?", "o": ["İkisi aynı anlama gelir", "Karşılaştırılabilirlik amaç, tutarlılık bu amaca ulaşmaya yardımcı olan araçtır", "Tutarlılık amaç, karşılaştırılabilirlik araçtır", "Alternatif muhasebe yöntemlerine izin verilmesi karşılaştırılabilirliği artırır", "Karşılaştırılabilirlik tek bir kalemle ilgilidir"], "a": 1, "e": "Tutarlılık aynı kalemler için aynı yöntemlerin kullanılmasıdır; karşılaştırılabilirlik ise amaçtır. Alternatif yöntemler karşılaştırılabilirliği azaltır."}, {"q": "Bir işletmenin dönem sonunda 500.000 TL ticari alacağı vardır ve geçmiş tecrübelere göre bu alacakların %4'ünün tahsil edilemeyeceği öngörülmektedir. Kavramsal çerçeveye göre dönemde tahakkuk ettirilmesi gereken gider tutarı kaçtır?", "o": ["0 TL; alacak tahsil edilmeden gider yazılmaz", "4.000 TL", "480.000 TL", "40.000 TL", "20.000 TL"], "a": 4, "e": "Çok sayıda alacakta beklenen tahsil edilememe oranı esas alınır ve ekonomik yarardaki beklenen azalma kadar gider tahakkuk ettirilir: 500.000 × %4 = 20.000 TL."}, {"q": "Bir işletme Aralık 2026'da 300.000 TL'lik mal satmış, bedeli Ocak 2027'de tahsil etmiştir. Aynı işletme Aralık 2026'da tükettiği 40.000 TL'lik elektriğin faturasını Ocak 2027'de ödemiştir. Tahakkuk esasına göre bu iki işlemin 2026 kârına net etkisi kaçtır?", "o": ["0 TL", "300.000 TL", "260.000 TL", "-40.000 TL", "340.000 TL"], "a": 2, "e": "Tahakkuk esasında gelir satışın yapıldığı, gider meydana geldiği dönemde kaydedilir: 300.000 − 40.000 = 260.000 TL. Nakit esasında 2026'ya etkisi sıfır olurdu."}, {"q": "Bir varlığın ölçüm tarihinde edinilmesi için ödenecek bedel ile o tarihte katlanılacak işlem maliyetlerinin toplamı hangi ölçüm esasıdır?", "o": ["Tarihi maliyet", "Cari maliyet", "Kullanım değeri", "Gerçeğe uygun değer", "İfa değeri"], "a": 1, "e": "Cari maliyet, varlık için ödenecek bedel ile işlem maliyetlerinin toplamıdır; yükümlülükte ise alınacak bedelden işlem maliyetleri düşülür."}, {"q": "Kavramsal çerçeveye göre aşağıdakilerden hangisi dönemsellik varsayımının uygulanmasını zorunlu kıldığı ilkelerden biri değildir?", "o": ["Hesap kesimi", "Tahakkuk esası", "Gelirin gerçekleşme noktası", "
