olasılığı", "Kanıtların çoğunun kesin olmaktan çok ikna edici olması", "Denetçinin yaygın olarak kendi kanaatini kullanması", "Denetim ücretinin sözleşmede önceden belirlenmesi"], "a": 4, "e": "Tebliğ örnekleme, iç kontrolün doğal kısıtları, kanıtların ikna edici niteliği, denetçi kanaati ve ilişkili taraf işlemleri gibi ikna sınırlamalarını sayar."}, {"q": "Tebliğdeki bağımsız denetim riski unsurlarından hangisi işletmenin değil denetçinin riskidir ve hiçbir zaman sıfıra indirilemez?", "o": ["Yapısal risk", "Kontrol riski", "Ticari risk", "Tespit edememe riski", "Önemli yanlışlık içerme riski"], "a": 3, "e": "Yapısal risk ve kontrol riski işletmenin riskleridir; tespit edememe riski denetçinin uygulamalarına bağlıdır ve tüm işlemler incelenemediği için sıfıra indirilemez."}, {"q": "Belirli bir bağımsız denetim risk seviyesi için finansal tabloların önemli yanlışlık içerme riski yüksek değerlendirilirse kabul edilebilir tespit edememe riski için ne söylenebilir?", "o": ["Daha yüksek bir seviyede gerçekleşir", "Daha düşük bir seviyede gerçekleşir", "Değişmez", "Sıfır olur", "Yapısal riske eşitlenir"], "a": 1, "e": "İkisi arasında ters orantı vardır: önemli yanlışlık riski yüksekse kabul edilebilir tespit edememe riski düşük olur."}, {"q": "Tebliğe göre bağımsız denetim kuruluşunda baş denetçi, kıdemli denetçi ve denetçi unvanları için gereken asgari fiilî mesleki deneyim süreleri sırasıyla hangisidir?", "o": ["10 – 6 – 3 yıl", "8 – 5 – 2 yıl", "10 – 5 – 3 yıl", "12 – 6 – 3 yıl", "15 – 10 – 5 yıl"], "a": 0, "e": "Baş denetçi için en az 10, kıdemli denetçi için 6, denetçi için 3 yıl fiilî deneyim gerekir.", "k": 1}, {"q": "Bağımsız denetim kuruluşunda pay sahibi olan, baş denetçi unvanını taşıyan ve kuruluş adına denetim raporlarını imzalamaya yetkili gerçek kişi hangisidir?", "o": ["Kıdemli denetçi", "Baş denetçi", "Sorumlu ortak baş denetçi", "Denetim komitesi başkanı", "Kalite kontrol sorumlusu"], "a": 2, "e": "Sorumlu ortak baş denetçi denetimi kendi kişisel sorumluluğuyla yürütür ve raporları imzalar; raporlar onun imzasıyla kesinleşir."}, {"q": "Mesleki deneyimi olmadan ilk kez işe alınan denetçi yardımcılarının staj ve eğitimi için hangisi doğrudur?", "o": ["Staj en az fiilen 2 yıl; bunun 4 ayı eğitim ve kurslar toplam 200 saatten az olamaz", "Staj 1 yıl, eğitim 2 ay, en az 100 saat", "Staj 3 yıl, eğitim 6 ay, en az 300 saat", "Staj 2 yıl, eğitim 4 ay, en az 100 saat", "Staj zorunlu değildir"], "a": 0, "e": "Staj en az fiilen 2 yıldır; 4 ay süreyle eğitime tabi tutulurlar ve kurslar toplam iki yüz saatten az olamaz."}, {"q": "Mesleki yeterliğe ulaşamayan veya bu özelliğini kaybeden bağımsız denetçinin işine son verildiğinde durum Kurula en geç ne zaman bildirilir?", "o": ["3 iş günü", "30 gün", "10 iş günü", "15 gün", "6 iş günü"], "a": 4, "e": "İşine son verilen denetçinin durumu en geç 6 iş günü içinde Kurula bildirilir."}, {"q": "Tebliğe göre bağımsız denetçiler fiilen denetimini yaptıkları işletmede, en son denetim raporu tarihinden itibaren ne kadar süre geçmedikçe YK üyeliği veya genel müdürlük gibi görevler alamaz?", "o": ["1 yıl", "3 yıl", "2 yıl", "5 yıl", "7 yıl"], "a": 2, "e": "Son bağımsız denetim raporu tarihinden itibaren 2 yıl geçmedikçe bu görevler alınamaz."}, {"q": "Tebliğe göre bağımsız denetim kuruluşu, denetim hizmeti verdiği işletmeye aynı dönemde aşağıdaki hizmetlerden hangisini verebilir?", "o": ["3568 sayılı Kanun çerçevesinde beyannamelerin vergi mevzuatına uygunluğunun incelenmesi ve tasdiki", "Değerleme ve aktüerya hizmeti", "İç denetim fonksiyonuna destek", "Muhasebe defterlerinin tutulması", "Yatırım danışmanlığı"], "a": 0, "e": "Vergi mevzuatına uygunluğun incelenmesi, tasdik ve buna ilişkin yazılı görüş ve rapor yasak faaliyetler kapsamında değerlendirilmez."}, {"q": "Tebliğe göre her bir bağımsız denetim için oluşturulacak ekip ve denetimi fiilen yapacak asgari kişi sayısı hangisidir?", "o": ["En az 2 asil ve 2 yedek; en az 2 kişi", "En az 5 kişi; yedek gerekmez", "En az 4 asil ve 2 yedek; en az 4 kişi", "En az 3 asil ve 3 yedek olmak üzere 6 kişi; denetim en az 3 kişiyle", "Tek sorumlu ortak baş denetçi yeterlidir"], "a": 3, "e": "Her denetim için en az 3 asil ve 3 yedek olmak üzere 6 kişilik ekip oluşturulur; denetim en az 3 kişiyle gerçekleştirilir."}, {"q": "Payları borsada işlem gören ortaklıklarda denetimden sorumlu komiteye ilişkin hangisi yanlıştır?", "o": ["En az iki üyeden oluşur", "Komitenin varlığı yönetim kurulunun TTK'dan doğan sorumluluğunu ortadan kaldırır", "Bağımsız denetim kuruluşunun seçimi komitenin gözetiminde yapılır", "İhtiyaç duyduğu danışmanlık hizmetlerinin maliyeti ortaklıkça karşılanır", "En az üç ayda bir olmak üzere yılda en az dört kez toplanır"], "a": 1, "e": "Komitenin görev ve sorumluluğu YK'nın TTK'dan doğan sorumluluğunu ortadan kaldırmaz."}, {"q": "Tebliğe göre bağımsız denetim kuruluşları yıllık finansal tablolarını gelir-gider dökümüyle birlikte bilanço tarihinden itibaren en geç ne zaman Kurula göndermelidir?", "o": ["10 hafta", "30 gün", "6 iş günü", "Ağustos ayı sonu", "6 ay"], "a": 0, "e": "Kuruluşlar yıllık tablolarını bilanço tarihini izleyen en geç 10 hafta içinde gönderir; değişiklik bildirimleri ve sözleşmeler 6 iş günü, kalite kontrol özetleri Ağustos sonu."}, {"q": "Sermaye piyasasında kesintisiz olarak kaç yıl süreyle fiilen bağımsız denetim faaliyetinde bulunmayan kuruluşun yetkisi Kurulca iptal edilebilir ve etik ihlallerde denetçilere getirilebilecek yasak en az ne kadardır?", "o": ["3 yıl; 1 yıl", "2 yıl; 2 yıl", "5 yıl; 5 yıl", "5 yıl; 2 yıl", "10 yıl; 3 yıl"], "a": 3, "e": "Kesintisiz 5 yıl fiilî faaliyetsizlik iptal sebebidir; etik ihlalde yasak 2 yıldan az olmamak üzere süreli veya süresiz verilir."}, {"q": "2022/6434 sayılı CK'ye göre (I) veya (II) sayılı listede yer almayan ve halka açık sayılmayan bir şirket için 2026 değişikliğiyle geçerli eşik değerler hangisidir?", "o": ["Aktif 120 milyon TL, satış 150 milyon TL, çalışan 100", "Aktif 500 milyon TL, satış 1 milyar TL, çalışan 150", "Aktif 30 milyon TL, satış 40 milyon TL, çalışan 50", "Aktif 1 milyar TL, satış 2 milyar TL, çalışan 250", "Aktif 250 milyon TL, satış 500 milyon TL, çalışan 175"], "a": 1, "e": "11066 sayılı CK ile diğer şirketler için eşikler aktif 500 milyon TL, net satış 1 milyar TL, çalışan 150 olmuştur."}, {"q": "Listelerde yer almayan bir şirketin verileri (milyon TL) şöyledir: 2024'te aktif 520, net satış 900, ortalama çalışan 160; 2025'te aktif 480, net satış 1.100, ortalama çalışan 155. Eşikler 500 milyon TL, 1 milyar TL ve 150 kişi kabul edilirse şirketin 2026 hesap dönemindeki durumu nedir?", "o": ["Her iki yılda farklı ölçütler aşıldığı için denetime tabi değildir", "2027'den itibaren tabi olur", "Yalnız 2025 dikkate alınır; tabi değildir", "Aktif 2025'te düştüğü için tabi değildir", "Her iki yılda da en az iki ölçüt aşıldığından 2026 için denetime tabidir"], "a": 4, "e": "2024: aktif ve çalışan; 2025: satış ve çalışan aşılmıştır. Art arda iki dönemde en az iki ölçüt aşıldığından 2026 için denetime tabidir; aşılan ölçütlerin aynı olması şart değildir."}, {"q": "A şirketinin kendi aktif toplamı 400 milyon TL'dir. Bağlı ortaklığı B'nin A'daki kayıtlı değeri 60 milyon TL, aktif toplamı 150 milyon TL; %30 iştiraki C'nin kayıtlı değeri 20 milyon TL, aktif toplamı 100 milyon TL'dir. Usul ve Esaslara göre A'nın denetime tabiyet testinde kullanılacak aktif toplamı kaçtır?", "o": ["470 milyon TL", "570 milyon TL", "500 milyon TL", "580 milyon TL", "650 milyon TL"], "a": 2, "e": "Kayıtlı değerler çıkarılır, bağlı ortaklığın tamamı ve iştirakin hisse payı eklenir: 400 − 60 − 20 + 150 + (100 × %30) = 500 milyon TL."}, {"q": "A şirketinin yıllık ortalama çalışanı 250, bağlı ortaklığı B'nin 90, A'nın %40 payla iştiraki olan C'nin 120 kişidir. Denetime tabiyet testinde A için ortalama çalışan sayısı kaçtır?", "o": ["250", "388", "340", "412", "460"], "a": 1, "e": "Bağlı ortaklığın tamamı, iştirakin hisse oranı alınır: 250 + 90 + (120 × %40) = 388."}, {"q": "Eşik değerleri aştığı için denetime tabi olan (diğer şirketler grubundaki) bir şirketin bir hesap dönemindeki verileri aktif 390 milyon TL, net satış 850 milyon TL, çalışan 130'dur. Önceki dönem tüm eşikler aşılmıştır. Hangisi doğrudur?", "o": ["Aktif %20'den fazla altında kaldığı için müteakip dönemde kapsamdan çıkar", "Net satış 1 milyarın altında olduğu için çıkar", "Üç ölçütte de eşiğin altında kaldığı için hemen çıkar", "Çalışan sayısı 150'nin altında olduğu için çıkar", "Yalnızca bir ölçütte %20 veya daha fazla altında kalındığından bu tek dönem verisiyle kapsamdan çıkmaz"], "a": 4, "e": "Tek dönemde çıkış için en az iki ölçütte %20 veya daha fazla altında kalmak gerekir (aktif ≤ 400, satış ≤ 800, çalışan ≤ 120). Yalnız aktif bu şartı sağlar; iki dönem art arda altında kalma şartı da henüz oluşmamıştır."}, {"q": "Usul ve Esaslara göre çalışan sayısının hesaplanmasında hangisi doğrudur?", "o": ["Yalnızca yıl sonu çalışan sayısı alınır", "Stajyer öğrenciler dâhil edilir", "Muhtasar beyannamedeki aylık çalışanların toplamı 12'ye bölünür; çıraklar ve stajyer öğrenciler dikkate alınmaz", "Yurt dışındaki çalışanlar dikkate alınmaz", "İştiraklerin çalışanları tamamen eklenir"], "a": 2, "e": "Aylık çalışan sayılarının toplamı on ikiye bölünür; çırak ve stajyerler sayılmaz; yurt içi ve yurt dışı çalışanlar ile iştiraklerin hisse oranındaki çalışanları dâhildir."}, {"q": "Birden fazla takvim yılına sirayet eden inşaat işlerini üstlenen bir şirketin denetime tabiyet testinde hangisi doğrudur?", "o": ["Aktif toplamında 170-177 hesapları dikkate alınmaz; satışta 350-358 hesaplarına yalnız ilgili dönemde kaydedilen tutarlar eklenir", "170-177 Yıllara Yaygın İnşaat ve Onarım Maliyetleri aktif toplamına dâhil edilir", "350-358 hesaplarının tüm birikimli bakiyesi satışa eklenir", "İş bitiminde gelir tablosuna aktarılan tutarlar ayrıca satışa eklenir", "Bu şirketler kapsam dışıdır"], "a": 0, "e": "Aktifte 170-177 hesapları dikkate alınmaz; satışta 350-358'e yalnız ilgili dönemde kaydedilen tutarlar eklenir, iş bitiminde aktarılanlar sayılmaz."}, {"q": "2022/6434 sayılı CK'ye göre aşağıdaki şirketlerden hangisi herhangi bir ölçüte bağlı olmaksızın bağımsız denetime tabi değildir, eşik değerlere göre değerlendirilir?", "o": ["Portföy yönetim şirketi", "Faktoring şirketi", "Sigorta şirketi", "Sermayesinin %60'ı bir belediyeye ait şirket", "TCMB'ye tabi ödeme kuruluşu"], "a": 3, "e": "Sermayesinin en az %50'si belediyelere ait şirketler (II) sayılı listededir ve özel eşiklere tabidir; diğerleri (I) sayılı listede olup ölçütsüz denetime tabidir."}]}];
const P={"1": ["Merhaba, Muhasebe ve Finansal Raporlama dersinin ilk bölümündeyiz. Bugün muhasebenin ne olduğunu, iki temel fonksiyonunu ve 12 temel kavramını konuşacağız. Sonra da temel denklemle bilanço ve gelir tablosunun özelliklerine geçeceğiz.", "Önce tanım. Muhasebe, parayla ifade edilebilen işlemlere ait bilgileri toplar, doğrular, kaydeder, sınıflandırır, raporlar ve analiz eder. Kitap bunu işletme ile karar vericiler arasında kurulan bir köprü olarak anlatıyor. Bu köprü cümlesi sınavda sık karşına çıkar.", "Burada dur bir saniye, çünkü en önemli şart şu. Bir olayın kayda girmesi için parayla güvenilir biçimde ölçülebilmesi gerekir. Şirketin çalışanları çok bilgili olabilir, müşteriler ürünlerin çok sağlam olduğuna inanabilir. Ama bunları liraya çeviremediğin için muhasebe sisteminin dışında kalırlar.", "Muhasebe bilgi sisteminin iki esas fonksiyonu var. Birincisi kaydetme, yani işletmenin hafızası olmak. İkincisi finansal raporlama, yani bu bilgiyi dışarıdaki çıkar sahiplerine düzenli bir biçimde sunmak. Hafıza fonksiyonu yüzünden işletmeler kayıtlarını en az beş yıl korumak zorunda.", "Raporlanan bilgi iki gruptur. Belli bir andaki finansal durum ve belli bir dönemdeki finansal performans. Finansal durumu bilanço, performansı gelir tablosu gösterir. Bu ikisine temel finansal tablolar denir. Nakit akış tablosu ve özkaynak değişim tablosu ise finansal durumdaki değişimi izler, bu yüzden yardımcı tablolardır.", "Biraz da tarih. Çift yanlı kayda dayanan ilk muhasebe kitabı 1.494'te Venedik'te Luca Pacioli tarafından yayımlandı. Max Weber de 1905'te yayımlanan eserinde muhasebeyi kapitalizmin gelişme nedenlerinden biri saydı. Yıl ve isim eşleştirmesine dikkat et, şıklarda sık karıştırılır.", "Gelelim temel kavramlara. Toplam 12 tane var ve genel kabul görmüş ilkeler ile standartlar bunlara aykırı olamaz. İlki sosyal sorumluluk. Muhasebe belli bir grubun değil tüm toplumun çıkarını gözetir. Bilgi bütün çıkar gruplarına eşit uzaklıkta üretilir.", "İkincisi kişilik kavramı. İşletmenin sahiplerinden ayrı bir kişiliği vardır. Şöyle düşün, küçük bir aile şirketinde patron şirket kasasından evin faturasını ödüyorsa kişilik kavramı çiğneniyor demektir. Kitap bu sorunun küçük işletmelerde kurumsallaşmanın en büyük engellerinden biri olduğunu söylüyor.", "Üçüncüsü işletmenin sürekliliği. İşletmenin süresiz yaşayacağı varsayılır, ne tasfiye niyeti ne de ihtiyacı vardır. Bunu sınavda çok soruyorlar. Süreklilik, maliyet esasının temelidir. Çünkü ömrü sınırsız bir işletmede varlıkların piyasa değeri pek bir anlam taşımaz.", "Dördüncüsü dönemsellik. Sınırsız ömrü yıllara bölüp her yılın sonucunu ayrı ölçeriz. Tahakkuk esası ve gelirle giderin aynı dönemde karşılaştırılması bu kavramın zorunlu sonucudur. Kısa bir hafıza ipucu vereyim. Süreklilik maliyet esasını, dönemsellik tahakkuk esasını doğurur.", "Parayla ölçülme kavramı kayıtların ortak ölçü olarak ulusal para birimiyle yapılmasını ister. Maliyet esası ise varlıkların elde etme maliyetiyle kaydedilmesidir. Ama burada iki istisna var. Para mevcudu ve alacaklar maliyetle değil, kendi tutarlarıyla izlenir.", "Tarafsızlık ve belgelendirme kayıtların objektif belgelere dayanmasını ister ve güvenilirliği sağlar. Tutarlılık ise seçilen politikaların yıldan yıla değiştirilmemesidir. Dikkat et, değişiklik tamamen yasak değil. Geçerli bir neden varsa yapılabilir ama değişiklik ve parasal etkisi dipnotta açıklanır.", "Tam açıklama, tabloların karar vermeye yetecek kadar açık ve yeterli olmasıdır. Gerçekleşmesi muhtemel olaylar da açıklanır. İhtiyatlılıkta ise muhtemel zararlar için karşılık ayırırsın ama muhtemel kârı gerçekleşmeden yazmazsın. Bu kavram gizli yedek ayırmanın bahanesi olamaz, sınavda bu tuzak sık görülür.", "Önemlilik, kararları etkileyecek ağırlıktaki kalemlerin mutlaka tablolarda yer almasıdır. Özün önceliği de biçimden çok özün esas alınmasıdır. Mesela ileri tarihli bir çek kâğıt üzerinde çektir ama özünde vadeli bir senettir. Bu yüzden alacak senetleri hesabında izlenir.", "Şimdi temel denkleme geçelim. Varlıklar eşittir borçlar artı özsermaye. Sol taraf ekonomik yapı, sağ taraf finansal yapı. Mesela varlıkların 4.800.000 lira, özsermayen 1.900.000 lira ise borcun 2.900.000 liradır. Bu tip basit çıkarma soruları sınavda puan toplamak için birebir.", "İşlemleri de ikiye ayır. Sonuç doğurmayan işlemler özvarlığı değiştirmez. Kredili mal almak, borç ödemek, alacak tahsil etmek bunlardandır. Sonuç doğuran işlemler ise özvarlığı değiştirir, kira ödemek ya da faiz geliri elde etmek gibi. Bir de şunu bil, bir kalemin varlık sayılması için kontrolünde olması ve yakında kullanılabilmesi gerekir.", "Son olarak tabloların karakteri. Bilanço belli bir anın fotoğrafıdır, statiktir. Gelir tablosu bir dönemin filmidir, dinamiktir ve modern muhasebede daha çok önemsenir. Bilançoda aktifler maliyetle, borçlar tahakkuk esasıyla gösterilir. Gelir tablosunda amortisman elde etme maliyetinden, faiz de anlaşmadaki orandan hesaplanır.", "Toparlayalım. Birincisi, muhasebenin konusu parayla ifade edilebilen işlemlerdir. İkincisi, iki esas fonksiyon kaydetme ve finansal raporlamadır, kayıtlar en az beş yıl saklanır. Üçüncüsü, süreklilik maliyet esasını, dönemsellik tahakkuk esasını doğurur. Dördüncüsü, ihtiyatlılık gizli yedeğe izin vermez ve tutarlılıkta değişiklik dipnotta açıklanır. Beşincisi, varlıklar borçlar artı özsermayeye eşittir ve bilanço fotoğraf, gelir tablosu filmdir."], "2": ["Merhaba, ikinci bölümdeyiz. Bugün muhasebenin mutfağına giriyoruz. Hesap nasıl çalışır, hangi defterler tutulur, hangi belgelerle kayıt yapılır ve Tekdüzen Hesap Planı nasıl kurulmuş, bunları konuşacağız.", "Önce hesap. Hesap aynı nitelikteki değer hareketlerini bir başlık altında toplayan çizelgedir. Sol tarafına borç, sağ tarafına alacak denir. Kitaplarda bunu büyük bir T harfi gibi çizeriz. Burada borç ve alacak kelimelerini günlük anlamıyla düşünme, sadece sol ve sağ demek.", "Şimdi altın kural. Varlık hesaplarında artış borca, azalış alacağa yazılır. Borç ve özsermaye hesaplarında tam tersi, artış alacağa yazılır. Giderler varlık gibi, gelirler kaynak gibi çalışır. Yani gider artışı borç, gelir artışı alacak tarafına gider.", "Bunu sınavda çok soruyorlar. Aktif bir hesabın ilk kaydı borçtan yapılır ve borç tarafı sıfırken alacağa kayıt yapılamaz. Kasa hesabı bu yüzden hiçbir zaman alacak kalanı vermez. Mesela kasaya 540.000 lira girmiş, 385.000 lira çıkmışsa elinde 155.000 liralık borç kalanı vardır.", "Bir de kâr ve zarar hesabı var. Gelir ve gider hesapları önce bu hesapta toplanır, sonra sermayeyle karşılaştırılır. Burada dikkat et. Kâr ve zarar hesabı bir hesaptır, gelir tablosu ise bir finansal tablodur. Şıklarda bu ikisini aynı şeymiş gibi gösterebilirler.", "Hesapları gelişim sırasına göre dörde ayırıyoruz. Asli hesaplar, düzenleyici hesaplar, geçici ve ara hesaplar, nazım hesaplar. Bu sıra aynı zamanda tarihsel gelişimi gösterir. Asli hesaplar varlık, borç, özsermaye, gelir ve gider hesaplarıdır.", "Düzenleyici hesaplar varlıkların ve kaynakların gerçek değerini göstermek için var. Aktifi düzenleyenler birikmiş amortismanlar, stok değer düşüklüğü karşılığı, alacak senetleri reeskontu ve şüpheli alacaklar karşılığıdır. Pasifi düzenleyenler ise ödenmemiş sermaye, borç senetleri reeskontu ve zarardır. Bu ikinci listeyi ezberle, çeldiricilerde hep birinci listeden isim koyarlar.", "Şöyle düşün. 500.000 liralık bir makinen var ve 200.000 lira birikmiş amortisman ayırmışsın. Net değer esaslı bilançoda makine 300.000 lira olarak görünür. Brüt değer esaslı bilançoda ise makine 500.000 lira kalır, birikmiş amortisman pasif tarafa yazılır.", "Geçici ve ara hesaplar tamamlanmamış işlemleri izler, yoldaki mallar ve gümrükteki mallar gibi. Nazım hesaplar ise mülkiyeti sana ait olmayan değerleri ve koşullu işlemleri izler. Bir senedi ciro ettiğinde doğan sorumluluk ya da aldığın teminat mektubu buna güzel bir örnektir.", "Gelelim defterlere. Birinci sınıf tüccar bilanço esasına, ikinci sınıf tüccar işletme hesabı esasına göre kayıt tutar. Bilanço esasında üç zorunlu defter var. Envanter defteri, yevmiye defteri ve büyük defter, yani defterikebir. Envanter defterine her dönemde sadece bir kez kayıt yapılır.", "Yevmiye defterinde işlemler tarih sırasıyla ve madde madde yazılır. Her maddede sıra numarası, tarih, borçlu ve alacaklı hesaplar, tutarlar ve belge bilgisi olur. Büyük defter ise bu kayıtları hesaplara dağıtır, yani sınıflandırır. İki defteri birbirine bağlayan sütuna folyo sütunu denir.", "Güncel düzenlemeleri de unutma. Bilanço esasına göre defter tutanlar 2025 Ocak ayının başından itibaren elektronik defter kullanmak zorunda. 2026 başından itibaren kurulan şirketler pay defterini ve genel kurul toplantı ve müzakere defterini elektronik ortamda tutuyor. Önceden kurulmuş şirketler de bu düzene uymak zorunda.", "Belgelere geçelim. Dört grup var. Faturalar, fatura yerine geçen belgeler, diğer belgeler ve muhasebe fişleri. Gider pusulası, müstahsil makbuzu, serbest meslek makbuzu ve perakende satış belgesi fatura yerine geçer. Ticari mektup ve mahkeme ilamı ise diğer belgeler grubundadır. Kitaba göre 2026 için fatura düzenleme sınırı 12.000 liradır.", "Muhasebe fişleri belge ile defter arasındaki ikinci kademedir. Kasa tahsil fişinde kasa borçlanır, karşı hesaplar alacaklanır. Kasa ödeme fişinde tam tersi olur. Para hareketi olmayan işlemler için mahsup fişi kullanılır. Fişler deftere en geç 45 gün içinde geçirilmeli, Vergi Usul Kanunu genel olarak 10 gün öngörür.", "Akım şemasının mantığı basit. Dönem başı envanteriyle başlarsın, hesapları açarsın, işlemleri yevmiyeye ve büyük deftere kaydedersin. Sonra genel geçici mizanı çıkarırsın. Envanter kayıtlarından sonra genel kesin mizan gelir, en sonda da gelir tablosu ile bilanço hazırlanır.", "Son durak Tekdüzen Hesap Planı. Serbest muhasebecilik kanunu 1989 Haziran ayında yürürlüğe girdi. Muhasebe Sistemi Uygulama Genel Tebliği ise 26 Aralık 1992'de yayımlandı. Amaç, bilanço esasına göre defter tutanların bilgilerini tutarlı ve karşılaştırılabilir hale getirmekti.", "Hesap planında dokuz sınıf var. Bir dönen varlıklar, iki duran varlıklar, üç kısa vadeli, dört uzun vadeli yabancı kaynaklar, beş özkaynaklar. Altı gelir tablosu, yedi maliyet hesapları, sekiz serbest, dokuz nazım hesaplar. Yedili hesaplarda iki seçenek var. Yedi A fonksiyon esaslıdır ve büyük işletmelere, yedi B gider çeşidi esaslıdır ve küçük işletmelere uygundur.", "Toparlayalım. Birincisi, varlık ve gider artışı borca, kaynak ve gelir artışı alacağa yazılır. İkincisi, pasifi düzenleyici hesaplar ödenmemiş sermaye, borç senetleri reeskontu ve zarardır. Üçüncüsü, bilanço esasında zorunlu defterler envanter, yevmiye ve büyük defterdir. Dördüncüsü, fişler en geç 45 günde deftere geçer. Beşincisi, hesap planında sekizinci sınıf serbesttir ve yedi A büyük işletmeler içindir."], "3": ["Merhaba, üçüncü bölümdeyiz. Dönen varlıkların ilk yarısını konuşacağız. Kasa, çek ve bankalar, geçici yatırım amaçlı menkul kıymetler, senetli ve senetsiz alacaklar, reeskont ve şüpheli alacak karşılığı. Bu bölüm sınavda kayıt sorularının en yoğun geldiği yer.", "Önce kapsam. Dönen varlık, bir yıl içinde paraya dönüşmesi ya da tüketilmesi beklenen varlıktır. Hazır değerler grubunda nakit ve hemen paraya çevrilebilen değerler var. Burada küçük bir tuzak var, menkul kıymetler hazır değer sayılmaz, ayrı bir grupta izlenir.", "Kasa hesabı ulusal ve yabancı paraların lira karşılığını izler. Hiçbir zaman alacak kalanı vermez, bunu kesin bil. Akşam sayımda fazla çıkarsa kasa borçlanır, karşısına sayım ve tesellüm fazlaları yazılır. Eksik çıkarsa sayım ve tesellüm noksanları borçlanır, kasa alacaklanır. Mesela kayıtta 145.300 lira varken sayımda 132.800 bulduysan 12.500 lira noksan vardır.", "Çeke gelelim. Çeki yazan keşideci, parayı alacak olan lehtar, ödeyen banka da muhataptır. İbraz sürelerini ezberle. Aynı yerde ödenecekse 10 gün, başka şehirde ödenecekse bir ay. Yurt dışında yazılmışsa aynı kıtada bir ay, farklı kıtalarda üç ay.", "Burada dur bir saniye, çünkü ileri tarihli çek sınavın gözdesi. İleri tarihli çek alınan çekler hesabında izlenmez. Özün önceliği gereği alacak senetleri hesabında izlenir. Senin verdiğin ileri tarihli çek de borç senetlerine gider. Dönem sonunda bunlar reeskonta da tabi tutulur.", "Bankada faiz geliri oluştuğunda banka vergiyi keserek yatırır. Faizin tamamı faiz gelirlerine, kesilen vergi de peşin ödenen vergiler hesabına yazılır. 250.000 liralık faizde %15 stopaj 37.500 liradır. Kurumlar vergisi mükellefinde bu tutar yılsonunda ödenecek vergiden mahsup edilir.", "Verdiğin çekler için ayrı bir hesap var, verilen çekler ve ödeme emirleri. Çeki verdiğinde bu hesap alacaklanır. Banka çeki ödediğinde ise bu hesap borçlanır, bankalar hesabı alacaklanır. Böylece bankadaki parayı çek tahsil edilene kadar doğru takip edersin.", "Menkul kıymetlere geçelim. Bunlar atıl parayı kısa süre değerlendirmek için alınır. Dönen varlıkta yer almaları için piyasada satılabilir olmaları ve bu dönem paraya çevrilme kararının bulunması gerekir. Şöyle düşün, 8.000 adet hisseyi 14 liradan aldın ve aracı kuruma komisyon ödedin. Hisse senetleri hesabına 112.000 lira yazarsın, komisyon maliyete girmez, komisyon giderlerine gider.", "Satışta kâr varsa menkul kıymet satış kârları, zarar varsa menkul kıymet satış zararları hesabı kullanılır. Tahvil alırken işlemiş faiz ödediysen o kısmı tahvilin maliyetine katmazsın, diğer çeşitli alacaklara yazarsın. Vadede tahsil ettiğinde yalnız kalan süreye ait faiz gelir olur, stopaj yine peşin ödenen vergilere gider.", "Borsa değeri ciddi ve kalıcı biçimde düşerse değer düşüklüğü karşılığı ayrılır. Karşılık giderleri borçlanır, menkul kıymetler değer düşüklüğü karşılığı alacaklanır. Hisse sonra satılırsa ya da düşüş gerçekleşmezse karşılık konusu kalmayan karşılıklar hesabına aktarılır. Bu iki gelir gider eşleşmesini sınavda çok soruyorlar.", "Şimdi alacaklar. Ticari alacak, işletmenin asıl faaliyetinden doğar. Senetsiz olan alıcılar hesabında, senetli olan alacak senetleri hesabında izlenir. Ortaklardan, personelden ya da iştiraklerden ticari olmayan alacaklar ise diğer alacaklar grubundadır.", "Senetle ilgili özel durumlar çok önemli. Senedi bankaya iskonto ettirirsen iskonto bedeli finansman giderleridir. Bankanın tahsil komisyonu ise komisyon giderleridir. Senet protesto edilirse protesto gideri genel yönetim giderlerine yazılır, senet ve gider birlikte diğer ticari alacaklara aktarılır. Senet yenilenirse gecikme faizi faiz gelirleri hesabına gider.", "Hatır senedini de unutma. Gerçek bir ticari alacak yokken kredi ihtiyacı için alınan senettir. Alındığında alacak senetleri borçlanır, karşısına diğer çeşitli borçlar yazılır. Giderleri genel yönetim giderleridir. Muhatabı banka olup kabul ederse buna kabul kredisi denir.", "Reeskont, senedi bilanço gününde bugünkü değeriyle göstermek için yapılır. Alacak senetlerinde dönem sonunda reeskont faiz giderleri borçlanır, alacak senetleri reeskontu alacaklanır. Ertesi yılın ilk günü ters kayıt yapılır ve tutar reeskont faiz gelirlerine gider. Yabancı paralı senette faiz yazmıyorsa Londra bankalar arası faiz oranı kullanılır.", "Şüpheli alacak, vadesi birkaç kez uzatılmış, protesto edilmiş, yazıyla birden fazla istenmiş ya da dava veya icra aşamasına gelmiş alacaktır. Teminatlı alacakta karşılık yalnız teminatı aşan kısım için ayrılır. 300.000 liralık alacağın 120.000'i teminatlıysa en fazla 180.000 lira karşılık ayırırsın.", "Perakende satış yöntemini de bir örnekle düşün. Önceki iki yılın tahsil edilemeyen oranları %3 ve %5 ise ortalama yüzde dörttür. Bu yıl 2,5 liralık vadeli satış varsa gereken karşılık 100.000 liradır. Hesapta 130.000 lira duruyorsa 30.000 lira fazlayı konusu kalmayan karşılıklara aktarırsın.", "Bir de şunu bil. Daha önce silinmiş bir alacağı bu yıl tahsil edersen tutar önceki dönem gelir ve kârlarına yazılır. Verdiğin bir teminatı geri alamazsan diğer olağandışı gider ve zararlara yazarsın. Bu iki hesap sınavda sık karşına çıkar.", "Toparlayalım. Birincisi, kasa asla alacak kalanı vermez ve ileri tarihli çek senet hesabında izlenir. İkincisi, menkul kıymet alım komisyonu maliyete eklenmez, komisyon giderlerine yazılır. Üçüncüsü, iskonto finansman gideri, tahsil komisyonu komisyon gideri, protesto gideri genel yönetim gideridir. Dördüncüsü, alacak senedi reeskontu dönem sonunda gider, ertesi yıl başında gelir olur. Beşincisi, şüpheli alacakta karşılık teminatı aşan kısma ayrılır ve silinmiş alacağın tahsili önceki dönem gelirlerine yazılır."], "4": ["Merhaba, dördüncü bölümdeyiz. Bugün stokları ve diğer dönen varlıkları konuşacağız. Aralıklı ve aralıksız sayım yöntemleri, iskontolar ve iadeler, stok değer düşüklüğü, sipariş avansları ve katma değer vergisi hesapları gündemimizde.", "Önce stok hesapları. İlk madde ve malzeme, yarı mamuller, mamuller, ticari mallar, diğer stoklar, stok değer düşüklüğü karşılığı ve verilen sipariş avansları. İlk üçünü üretim yapan işletmeler kullanır. Ticaret işletmesinin kalbi ise ticari mallar hesabıdır.", "Yarı mamuller hesabının iki görevi var. Hem üretim hesabıdır hem de yarı mamul stokunu gösterir. Şöyle düşün, üretime 50.000 liralık madde, işçilik ve genel gider verdin, 38.000 liralık mamul bitti. Hesapta kalan 12.000 lira yarı mamul stokundur.", "Şimdi en önemli konu, iki sayım yöntemi. Aralıklı sayımda ticari mallar hesabı hem değeri hem sonucu taşır. Satışta sadece satış hesabına yazarsın, maliyeti dönem sonuna bırakırsın. Dönem sonunda sayım yapar, ticari mallar hesabının borç kalanından sayım stokunu çıkarırsın. Kalan tutar satılan malın maliyetidir.", "Aralıksız sayımda ise her satıştan sonra ikinci bir madde yaparsın. Satılan ticari mallar maliyeti borçlanır, ticari mallar alacaklanır. Böylece ticari mallar hesabı her an olması gereken stoku gösterir. Bunu sınavda çok soruyorlar. Sayım fazlası ya da noksanı sadece aralıksız yöntemde saptanabilir.", "Bir örnek yapalım. Dönem başında 15.000 lira stok var, 120.000 lira mal aldın, 8.000 lira taşıma ödedin. 6.000 lira iskonto aldın, 7.000 liralık malı iade ettin. Ticari mallar hesabında 130.000 lira birikir. Sayımda 40.000 lira çıkarsa satılan malın maliyeti 90.000 liradır.", "Burada dur bir saniye, çünkü taşıma gideri tuzağı çok yaygın. Malı alırken ödediğin taşıma maliyete eklenir ve ticari mallar hesabına yazılır. Malı müşteriye götürürken ödediğin taşıma ise satış gideridir ve pazarlama satış ve dağıtım giderlerine yazılır. Yani alış tarafı maliyet, satış tarafı dönem gideri.", "İskonto ve iadelerde vergi tarafına dikkat et. Satıcı sana iskonto yaptığında ya da malı iade ettiğinde vergi düzeltmesi hesaplanan katma değer vergisine alacak yazılır. Sen müşterine iskonto yaptığında ya da müşteri iade ettiğinde ise indirilecek katma değer vergisine borç yazılır. Faturada gösterilen iskonto ayrıca kaydedilmez, net tutarla kayıt yapılır.", "Aralıksız yöntemde satış iadesi de iki maddedir. Önce satıştan iadeler ve vergi borçlanır, alıcılar alacaklanır. Sonra iade edilen malın maliyeti ticari mallara borç, satılan malın maliyetine alacak yazılır. Aralıklı yöntemde bu ikinci madde yoktur.", "Gelelim değer düşüklüğüne. Yangın, deprem, bozulma, moda değişikliği gibi nedenlerle stok değer kaybederse karşılık giderleri borçlanır, stok değer düşüklüğü karşılığı alacaklanır. Tekdüzen sistem bunu mal hareketi gideri saymaz, diğer olağan faaliyet gideri sayar. Mal satılınca işlevi biten karşılık konusu kalmayan karşılıklara aktarılır.", "Bir incelik daha var. Değeri düşük mal satılırken satış tutarı maliyeti aşmıyorsa, satış tutarı maliyet kabul edilir. 60.000 liralık malı 45.000 liraya sattıysan satılan malın maliyetine 45.000, karşılıktan 15.000 yazarsın. Kalan 45.000 liralık karşılık da konusu kalmayan karşılıklara gider.", "Sipariş avanslarına geçelim. Mal siparişi için verilen avans verilen sipariş avansları hesabında izlenir. Kitap bu avansların alacak sayılmadığını özellikle vurgular. Çünkü karşılığı sana para olarak değil, mal olarak döner. Avanstan binde 7,5 damga vergisi kesilir ve ödenecek vergi ve fonlara yazılır.", "Mal teslim alındığında avans mal bedelinden düşülür. 600.000 liralık mal ve 108.000 lira vergi geldiyse, 200.000 avansı ve 150.000 liralık çeki çıkarırsın. Kalan 358.000 lira satıcılara borç olur. Sipariş ve teminat mektubu için açılan nazım hesaplar da kapatılır.", "Hasarlı mal için sigorta tazminatı alırsan tazminat ile malın değeri arasındaki fark olağandışı gelir olur. 30.000 liralık hasara 42.000 lira tazminat geldiyse 12.000 lira diğer olağandışı gelir ve kârlara yazılır. Ambalaj için müşteriden depozito alırsan bu bir borçtur, alınan depozito ve teminatlar hesabında izlenir.", "Diğer dönen varlıklarda katma değer vergisi hesapları öne çıkar. İndirilecek vergi hesaplanan vergiden fazlaysa fark devreden katma değer vergisine aktarılır. Teşvikli yatırım malı ithalinde ertelenen vergi diğer katma değer vergisi hesabında izlenir.", "Peşin ödenen vergiler hesabı da önemli. Dönem sonunda bu hesaptaki tutar dönem kârının peşin ödenen vergileri hesabına aktarılır. Ama aktarılan tutar hesaplanan vergi karşılığını aşamaz. 50.000 lira peşin vergi var, vergi karşılığı 42.000 ise 42.000 aktarılır, 8.000 lira hesapta bekler.", "Son olarak sayım ve tesellüm noksanları hesabı. Kasa, stok ya da makine noksanları önce burada geçici olarak izlenir. Yılsonunda hâlâ kesin hesaba aktarılamayan noksanlar fazlaları aşıyorsa, aşan kısım için diğer dönen varlıklar karşılığı ayrılır.", "Toparlayalım. Birincisi, aralıklı yöntemde maliyet dönem sonunda bulunur ve sayım farkı saptanamaz. İkincisi, aralıksız yöntemde her satış ve iade iki maddeyle kaydedilir. Üçüncüsü, alış taşıması maliyete, satış taşıması satış giderine yazılır. Dördüncüsü, alış iskontosu ve iadesinin vergisi hesaplanan vergiye, satış iskontosu ve iadesinin vergisi indirilecek vergiye yazılır. Beşincisi, stok değer düşüklüğü karşılık giderleriyle ayrılır ve sipariş avansları alacak sayılmaz."], "5": ["Merhaba, beşinci bölümdeyiz ve konumuz duran varlıklar. Uzun vadeli alacaklar, mali duran varlıklar, maddi ve maddi olmayan duran varlıklar ile amortismanı konuşacağız. Bu bölümde hem oran eşikleri hem de amortisman hesapları sınavda sıkça çıkıyor.", "Duran varlık, bir yıldan uzun süre faaliyette kullanılmak için alınan ve satmak amacı taşımayan varlıktır. Fiziki yapısı varsa maddi, yoksa ama hak sağlıyorsa maddi olmayan duran varlık deriz. Büro masası taşınabilir olsa da sürekli kullanıldığı için duran varlıktır.", "Uzun vadeli alacaklarda küçük ama önemli bir ayrıntı var. Bu gruplarda şüpheli alacak hesabı yoktur, sadece karşılık hesapları vardır. Vadesi bir yılın altına düşen alacaklar dönen varlıklardaki karşılık hesabına aktarılır.", "Mali duran varlıklarda eşikleri iyi bil. Oy ya da yönetime katılma hakkın yüzde ondan azsa bağlı menkul kıymet. %10 ile %50 arasıysa iştirak. %50'nin üstündeyse bağlı ortaklık. Bunu sınavda çok soruyorlar ve belirlemede sermaye payına değil oy hakkına bakılır.", "Bağlı ortaklıkta bir incelik daha var. Hesap planı yönetim çoğunluğunu seçme hakkını esas alır. İştirak payın yüzde onun altına düşerse pay bağlı menkul kıymetlere, bağlı ortaklık payın %50'nin altına inerse iştiraklere aktarılır. Taahhüt ettiğin ama ödemediğin sermaye ise iştiraklere sermaye taahhütleri hesabında alacak kalanı olarak durur.", "Maddi duran varlıklar alış maliyetiyle kaydedilir. Gümrük vergisi, taşıma, montaj ve varlığı kullanıma hazır hale getiren her şey maliyete girer. Noter, tellaliye, emlak ve taşıt alım vergisinde ise işletme serbesttir, maliyete de ekleyebilir, gider de yazabilir. Şıklarda bu ikisini karıştırırlar.", "Arsa konusu özel. Arsa için amortisman ayrılmaz ve arsa ile bina ayrı hesaplarda izlenir. Şöyle düşün, fabrika kurmak için üzerinde eski bir bina olan arsayı 500.000 liraya aldın. Yıkıma 60.000 ödedin, enkazı 25.000'e sattın. Arsanın maliyeti 535.000 lira olur.", "Duran varlık, kullanılabilir hale gelip fiilen kullanılmaya başladığında kayda alınır. Makine geldi ama kurulumu bitmediyse harcamalar yapılmakta olan yatırımlarda bekler. Binek otomobillerinde katma değer vergisinin indirimi öngörülmemiştir, bunu da not et.", "Maddi olmayan duran varlıklarda beş yıl kuralı öne çıkar. Süresi belli olmayan haklar, şerefiye, kuruluş ve örgütlenme giderleri ve araştırma geliştirme giderleri genelde beş yılda eşit itfa edilir. Şerefiyenin kayda alınması için bedelinin ödenmiş olması gerekir. 750.000 liralık şerefiyede yıllık itfa 150.000 liradır.", "Özel maliyetlerde süre kira süresidir. Ama kira beş yıldan uzunsa beş yılda itfa edersin. Sekiz yıllık kirada 400.000 liralık harcama yaptıysan yıllık 80.000 lira itfa edilir. Kira bitmeden çıkarsan kalan tutar o yıl bir defada gider olur.", "Gelelim amortismana. Amortisman maliyetin hizmet süresine sistemli dağıtımıdır, yani bir tahsis işlemidir. Değerleme yöntemi değildir ve kenara para ayırmak anlamına gelmez. Boş arsa için ayrılmaz, ama meyve bahçesi ve bağ için ayrılır.", "Eşit tutarlar yönteminde maliyetten hurda değeri çıkarıp ömre bölersin. 500.000 liralık makine, 50.000 hurda değer, beş yıl ömür. Yıllık amortisman 90.000 lira, oran %20 olur. Oranı bir bölü ömür olarak da bulabilirsin.", "Azalan bakiyeler yönteminde normal oranın iki katını her yıl kalan değere uygularsın. 400.000 liralık, beş yıllık makinede oran yüzde kırktır. İlk yıl 160.000, ikinci yıl 96.000 lira ayrılır. Vergi Usul Kanunu bu oranın yüzde elliyi geçmesine izin vermez ve son yıla kalan bakiye o yıl tamamen yok edilir.", "Vergi kurallarını da sırala. Seçtiğin oranı sonraki yıllarda değiştiremezsin. Eksik ayırdığın amortisman yüzünden süre uzamaz. Eşit tutarlardan azalan bakiyelere geçemezsin, ama azalan bakiyelerden eşit tutarlara geçebilirsin. Yıllık amortisman tam ayrılır, sadece binek otomobilde aylık hesap yapılır.", "Kayıt tarafında iki yöntem var. Direkt yöntemde amortisman doğrudan varlık hesabından düşülür, bu yüzden maliyet bilgisi kaybolur. Endirekt yöntemde birikmiş amortismanlar hesabı kullanılır ve maliyet korunur. Normal bakım gider olur, kapasiteyi kalıcı artıran harcama ise maliyete eklenir.", "Satışta önce defter değerini bul, maliyetten birikmiş amortismanı çıkar. 900.000 liralık binanın 540.000'i itfa edildiyse defter değeri 360 bindir. 300.000'e satarsan 60.000 lira zarar edersin. Kârlı satışta yerine yenisi alınacaksa kâr özel fonlar hesabında üç yıl bekletilebilir.", "Yenileme fonunda yeni varlığın amortismanı önce fondan karşılanır. Fon bitince amortisman gider olmaya başlar. Sigorta tazminatında da benzer bir mantık var. Tazminat defter değerinden fazlaysa fark kârdır ve yenileme kararı varsa en fazla üç yıl özel fonlarda tutulabilir.", "Toparlayalım. Birincisi, yüzde onun altı bağlı menkul kıymet, %10 ile 50 iştirak, 50'nin üstü bağlı ortaklıktır. İkincisi, gümrük, taşıma ve montaj maliyete girer, noter ve tellaliyede işletme serbesttir. Üçüncüsü, şerefiye ve haklar beş yılda, özel maliyet kira süresinde ama en fazla beş yılda itfa edilir. Dördüncüsü, azalan bakiyelerde oran normalin iki katıdır ve yüzde elliyi geçemez. Beşincisi, satış kârı ve tazminat fazlası yenileme için üç yıl özel fonlarda bekletilebilir."], "6": ["Merhaba, altıncı bölümdeyiz. Bugün işletmenin borçlarını, yani kısa ve uzun vadeli yabancı kaynakları konuşacağız. Banka kredileri, tahvil ve bonolar, ticari borçlar, bordro, vergi yükümlülükleri, karşılıklar ve tahakkuklar sırayla geliyor.", "Önce temel ayrım. Bir yıl içinde ödenecek borçlar kısa vadeli, daha uzun vadeli olanlar uzun vadeli yabancı kaynaktır. Uzun vadeli bir borcun vadesi bir yılın altına inince kısa vadedeki paralel hesaba aktarılır. Mesela uzun vadeli kredinin gelecek yıl ödenecek taksiti dönem sonunda kısa vadeli taksitler hesabına geçer.", "Banka kredisinde faiz hesabını kitap hep aynı şekilde yapıyor. Anaparayı gün sayısı ve faiz oranıyla çarpıp 36.500'e bölüyorsun. Şöyle düşün, bir Kasımda 300.000 lira kredi aldın, faiz %36. Yılsonuna kadar 61 gün geçer ve yaklaşık 18.049 lira faiz tahakkuk ettirirsin.", "Bu faiz finansman giderlerine borç, gider tahakkukları hesabına alacak yazılır. Ertesi yıl kredi ödenirken yalnız o yıla düşen faiz gider olur. Dönemsellik kavramı tam olarak bunu ister.", "Burada dur bir saniye, çünkü kur farkı tuzağı çok yaygın. Yabancı paralı bir kredide kur yükselirse fark kambiyo zararlarına değil finansman giderlerine yazılır. Ama yurt dışındaki satıcıya olan ticari borçta kur yükselirse fark kambiyo zararlarına gider. Yani kredi ise finansman gideri, ticari borç ise kambiyo zararı.", "İskontolu bono da sınavda sevilen konu. Nominali 200.000 lira olan üç aylık bonoyu 170.000'e sattıysan 30.000 liralık fark menkul kıymetler ihraç farkları hesabına yazılır. Bu hesap aktif karakterlidir ama pasifte eksi olarak görünür. İki ay geçince 20.000 lirası finansman giderine itfa edilir, bilançoda net borç 190.000 lira kalır.", "Ticari borçlara geçelim. Burada belirleyici olan borcun kime olduğu değil, ticari faaliyetten doğup doğmadığıdır. Ortağına olan borç bile ticari ise satıcılar hesabında izlenir ve dipnotta açıklanır. Ana faaliyetin dışında kalan bir alım ise diğer çeşitli borçlara yazılır.", "Borç senetlerinde reeskont ters işler. Dönem sonunda borç senetleri reeskontu borçlanır, reeskont faiz gelirleri alacaklanır. Ertesi dönem başında da reeskont faiz giderleri borçlanarak düzeltilir. Formül iç iskontodur. Anapara çarpı gün çarpı oranı, 36.500 artı gün çarpı oran toplamına bölersin.", "Sermaye Piyasası Kanununa tabi şirketlerde vadesi üç aydan uzun senetsiz borçlar da reeskonta tabidir. Bunu ayrıca not et. Alınan depozito ve teminatlar hesabı ise yalnız nakit teminatları izler. Teminat mektubu ya da senet olarak alınan teminatlar nazım hesaplarda izlenir.", "Bordroyu bir örnekle düşün. Net ücret 150.000, gelir vergisi 40.000, damga vergisi 2000, sigorta işçi payı 30.000 lira olsun. Brüt ücret 222.000 lira eder. İşveren payı 45.000'i de eklersen işletmenin toplam gideri 267.000 lira olur. Net ücret personele borçlara, vergiler ödenecek vergi ve fonlara, primler ödenecek sosyal güvenlik kesintilerine yazılır.", "Vergi tarafında üç hesabı ayırt et. Ödenecek vergi ve fonlar normal vergi borcudur. Vadesi geçmiş ya da bir yıl içinde ödenecek şekilde taksitlendirilmiş borçlar ayrı bir hesapta izlenir. Taksitler bir yıldan uzunsa kamuya olan ertelenmiş borçlar hesabına geçer.", "Kurumlar vergisi akışı şöyle. Dönem sonunda vergi karşılığı ayrılır, gelir tablosundaki vergi karşılığı borçlanır, bilançodaki karşılık alacaklanır. Beyanname verilince bu karşılık kapatılır, peşin ödenen vergi düşülür, kalan ödenecek vergiye aktarılır. 240.000 lira vergiden 90.000 lira peşin ödendiyse 150.000 lira ödenecek kalır.", "Gelecek aylara ait gelirlerde dönemlere bölmeyi iyi yap. Bir Nisanda iki yıllık kira olarak 96.000 lira aldıysan aylık 4.000 liradır. Bu yılın dokuz ayı gelir olur, gelecek 12 ay gelecek aylara ait gelirlere, kalan üç ay gelecek yıllara ait gelirlere yazılır. Gider tahakkukları hesabına ise yalnız belgeye dayalı ve tutarı belli giderler alınır.", "Katma değer vergisi mahsubunda hesaplanan vergiden indirilecek ve devreden vergiyi düşersin. 600.000'den 220 ve 130.000'i çıkarırsan 250.000 lira ödenecek vergi kalır. Kasa fazlasının nedeni bulunamazsa aynı dönemde kâr yazılırsa diğer olağandışı gelirlere, ertesi dönemde yazılırsa önceki dönem gelirlerine gider.", "Karşılıklar konusunda önemli bir cümle var. Borç ve gider karşılıkları aktifi düzenleyici değildir, pasif karakterlidir. Kıdem tazminatı her yıl ayrılır, ertesi yıl ödenecek kısım kısa vadeye aktarılır. Ödeme aktarılan tutarı aşarsa fark uzun vadeli kıdem karşılığından ödenir, yeniden gider yazılmaz.", "Dava karşılığı örneğinde 200.000 liralık davanın %60 olasılıkla kaybedileceği düşünülüyorsa 120.000 lira karşılık ayrılır. Ertesi yıl 140.000 ödersen fazla 20.000 lira önceki dönem gider ve zararlarına yazılır. Az ödersen fark önceki dönem gelir ve kârlarına gider. Konusu kalmayan karşılıklar hesabı burada kullanılmaz.", "Uzun vadede birkaç özel hesap kaldı. Faizi vade sonunda ödenecek ve bir yıl içinde ödenmeyecek kredide faiz uzun vadeli gider tahakkuklarına yazılır. Tesise katılma payı ise tesisin ömrü boyunca gelire dönüştürülür. 80.000 liralık payda 16 yıllık ömür varsa her yıl 5.000 lira gelir yazılır. Bu hesabın kısa vadede karşılığı yoktur.", "Toparlayalım. Birincisi, faiz anapara çarpı gün çarpı oran bölü 36.005 yüzdür. İkincisi, kredi kur farkı finansman gideri, ticari borç kur farkı kambiyo zararıdır. Üçüncüsü, borç senedi reeskontu dönem sonunda gelir, ertesi dönem başında gider olur. Dördüncüsü, bir yıl içinde ödenecek taksitlendirilmiş vergi bir hesapta, daha uzunu kamuya olan ertelenmiş borçlarda izlenir. Beşincisi, borç ve gider karşılıkları aktifi düzenleyici değildir ve fark önceki dönem hesaplarına yazılır."], "7": ["Merhaba, yedinci ve bu kısmın son bölümündeyiz. Özkaynakları, gelir tablosu hesaplarını ve dönem sonu işlemlerini konuşacağız. Yedek akçe hesapları ve gelir tablosundaki kâr basamakları sınavda sık sayısal soru olarak geliyor.", "Özkaynaklar ödenmiş sermaye, sermaye yedekleri, kâr yedekleri, geçmiş yıllar kâr ve zararları ile dönem net kâr veya zararından oluşur. Ortaklar sermaye taahhüt ettiğinde ödenmemiş sermaye borçlanır, sermaye alacaklanır. Ödeme geldikçe ödenmemiş sermaye kapanır. Kalan borç bakiyesi ortakların henüz yerine getirmediği taahhüdü gösterir.", "Kayıtlı sermaye sistemindeki şirketlerde sermaye hesabında çıkarılmış sermaye gösterilir, tavan dipnotta açıklanır. Hisseleri nominal değerin üstünde satarsan aradaki fark hisse senedi ihraç primleridir. 300.000 lira nominal hisseyi 345.000'e sattıysan 45.000 lira ihraç primi oluşur.", "Kâr yedeklerinde ilk ezber noktası yasal yedekler. Birinci tertip yedek akçe her yıl safi kârın %5'i kadar ayrılır ve ödenmiş sermayenin beşte birine ulaşınca durur. İkinci tertip yedek akçe ise dağıtılmasına karar verilen kârın yüzde onudur. Yeni Türk Ticaret Kanununda ikisi de genel kanuni yedek akçe olarak geçer.", "Burada dur bir saniye, çünkü sınır tuzağı çok sık sorulur. Sermaye 800.000 lira ise sınır 160.000 liradır. Daha önce 150.000 ayırdıysan bu yıl en fazla 10.000 ayırabilirsin. Kârın %5'i 20.000 lira etse bile 10.000 liradan fazlası ayrılmaz.", "İkinci tertipte kitabın metni dağıtılmasına karar verilen kârın yüzde onu der. Kitaptaki örnek ise dağıtılacak kârdan birinci tertip yedeği çıkarıp onda birini alıyor. Bu iki yol farklı sonuç verir, o yüzden soruda hangi yöntemin istendiğine dikkat et. Kâr yedekleri genellikle geçmiş yıllar kârları hesabından ayrılır.", "Statü yedekleri ana sözleşme gereği, olağanüstü yedekler genel kurul kararıyla ayrılır. Geçmiş yılların zararını olağanüstü yedeklerden kapatırsan olağanüstü yedekler borçlanır, geçmiş yıllar zararları alacaklanır. Yeni dönemin başında da önceki yılın net kârı dönem net kârından geçmiş yıllar kârlarına aktarılır.", "Şimdi dönem sonucuna ulaşma zincirine bakalım. Tüm gelir ve gider hesapları dönem kârı veya zararı hesabına devredilir. Vergi karşılığı ayrılır, sonra bu ikisi dönem net kârı veya zararı hesabında netleşir. En sonda net kâr bilançodaki dönem net kârı hesabına, net zarar ise dönem net zararı hesabına aktarılır.", "Bir örnekle düşün. Gelirlerin 1.900.000, giderlerin 1.400.000 lira. Vergi öncesi kâr 500.000 lira. 100.000 lira vergi karşılığı düşünce 400.000 lira net kâr kalır. Zarar durumunda ise vergi karşılığı zararın üstüne eklenir, 80.000 lira zarar ve 5.000 lira vergi varsa net zarar 85.000 lira olur.", "Gelir tablosunda basamakları sırayla kur. Brüt satışlardan indirimleri, satışların maliyetini ve faaliyet giderlerini düşersen faaliyet kârı çıkar. Diğer faaliyet gelirlerini ekleyip diğer faaliyet giderlerini ve finansman giderlerini düşersen olağan kâra ulaşırsın. Olağandışı gelir ve giderleri de ekleyince dönem kârı bulunur.", "Brüt satışlara katma değer vergisi dahil edilmez. Faturada ayrı gösterilen vade farkı diğer gelirler hesabına yazılır. İhracatta satışın yapıldığı dönemdeki kur farkı yurt dışı satışlara eklenir. Ertesi dönemde oluşan olumlu kur farkı ise kambiyo kârlarına gider.", "Diğer faaliyet gelirlerinde iştirak temettüsü ile bağlı ortaklık temettüsünü ayır. %10 ile 50 arası paya sahip olduğun şirketten gelen temettü iştiraklerden temettü gelirleridir. Konusu kalmayan karşılıklar hesabı yalnız aktifle ilgili karşılıkların iptalinde kullanılır, bunu da unutma.", "Gider tarafında kambiyo zararları hesabına dikkat. Kasadaki dövizin değer kaybı kambiyo zararıdır. Ama borçlanmaya ilişkin kur farkı finansman gideridir ve kısa ya da uzun vadeli borçlanma giderlerine gider. Bir yıla kadar olan borçlanmalar kısa vadeli, daha uzunlar uzun vadeli borçlanma giderleridir.", "Olağandışı gruplarda önceki dönem gelir ve kârları, hata ya da unutma yüzünden ilgili döneme yansıtılmamış tutarlardır. Diğer olağandışı gelirlerde hasar fazlası tazminat, şartname bedeli ve sayım fazlası gibi arızi gelirler bulunur. Çalışmayan kısım gider ve zararları ise üretimde çalışılmayan süreye düşen işçilik ve genel üretim giderleridir.", "Dönem sonu işlemlerine geçelim. Mizan büyük defter hesaplarının toplamlarını ve kalanlarını gösteren cetveldir. Günlük defter toplamı mizanın borç toplamına ve alacak toplamına eşittir. Ama bu eşitlik kayıtların kesin doğru olduğunu göstermez. Yanlış hesaba yapılmış bir kayıt mizanda görünmez.", "Türkiye'de mizan aylık ve birikimli çıkarılır. Envanter öncesindeki mizana genel geçici mizan, envanter sonrasındakine genel kesin mizan denir. Genel kesin mizandan sonra o döneme ait deftere kayıt yapılmaz, tablolar bu mizandan hazırlanır.", "Envanter de ikiye ayrılır. Muhasebe dışı envanterde fiziki sayım yapılır ve farklar ortaya konur. Muhasebe içi envanterde bu farklara göre düzeltme kayıtları yapılır. Mal sayımında mülkiyet esastır, konsinye ve yoldaki mallar da stoka dahil edilir. Tahsil imkânı kalmayan değersiz alacak zarar yazılır, şüpheli alacak için ise karşılık ayrılır.", "Toparlayalım. Birincisi, birinci tertip yedek kârın yüzde beşidir ve sermayenin beşte birini aşamaz. İkincisi, ikinci tertip dağıtılan kârın yüzde onudur ve kitap birinci tertibi düşerek hesaplar. Üçüncüsü, gelir tablosunda faaliyet kârı, olağan kâr ve dönem kârı sırasıyla bulunur. Dördüncüsü, borçlanma kur farkı finansman gideri, diğer kur zararları kambiyo zararıdır. Beşincisi, mizan eşitliği hesap hatalarını göstermez ve genel kesin mizandan sonra kayıt yapılmaz."], "8": ["Merhaba, finansal raporlamanın ilk bölümündeyiz. Bugün iki şeyi konuşacağız. Önce finansal tabloların yasal zeminini, yani kim hangi standardı uyguluyor sorusunu. Sonra da kavramsal çerçeveyi, yani iyi bir finansal bilginin taşıması gereken özellikleri.", "Her şey 6102 sayılı Türk Ticaret Kanunu ile başlıyor. Kanunun felsefesi şeffaflık, doğru bilgiye engelsiz ulaşma, hesap verilebilirlik ve sorumluluk. Standartları yayımlayan kurum ise Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu. Kısaca KGK diyeceğiz. KGK, 660 sayılı kanun hükmünde kararname ile kuruldu ve standart yapma yetkisini eski Türkiye Muhasebe Standartları Kurulundan devraldı.", "Şimdi sınavın sevdiği bir ayrım. Ticaret Kanunu kayıt tutmayı ve raporlamayı birbirinden ayırdı. 2013 başından itibaren defterler Vergi Usul Kanununa göre tutuluyor. Ama genel kurula sunulan yasal finansal tablolar Türkiye Muhasebe Standartlarına göre hazırlanıyor. Yani defter vergiye, tablo standarda bakıyor. Bu ayrımı aklında tut, çünkü şıklarda tersini görebilirsin.", "Standartta hüküm yoksa ne olacak? Sıra şöyle. Önce ilgili düzenleyici kurumun ayrıntıya ilişkin düzenlemesine bakılır. O da yoksa milletlerarası uygulamada genel kabul görmüş muhasebe ilkeleri uygulanır. Bir de şunu bil, standart koyma yetkisi yalnız KGK'dadır. Diğer kurumlar ancak sınırlı ayrıntı düzenlemesi yapabilir.", "Kim Türkiye Finansal Raporlama Standartlarını uygular sorusuna gelelim. KGK'nın 2018 kararı üç kutu çiziyor. Ekli listede olanlar Türkiye Finansal Raporlama Standartlarını uygular. Bağımsız denetime tabi olup listede olmayanlar Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardını, yani BOBİ standardını uygular, isterse Türkiye Finansal Raporlama Standartlarını seçebilir. Kapsam dışındakiler yürürlükteki mevzuatı uygular.", "Ekli listede borsa şirketleri, portföy yönetim şirketleri, yatırım kuruluşları, bankalar, sigorta ve emeklilik şirketleri var. Burada iki eşik seti önemli. Borsada işlem görmeyen ama halka açık sayılan şirketlerde aktif 15.000.000, net satış 20.000.000, çalışan 50. A grubu yetkili müesseselerde ise brüt satış 250.000.000, aktif 7,5, çalışan 25. Her ikisinde de üç ölçütten en az ikisi yeterli.", "BOBİ standardı 2017 Temmuz ayında yayımlandı ve 2018'den itibaren başlayan dönemlerde uygulanıyor. Daha önce bu işletmeler vergi odaklı Muhasebe Sistemi Uygulama Genel Tebliğlerini ve KGK'nın İlave Hususlar düzenlemesini kullanıyordu. BOBİ standardı bunların yerini aldı. Unutma, BOBİ standardını uygulayan iki yıl geçmeden Türkiye Finansal Raporlama Standartlarına geçemez. Tersine dönmek için de en az iki yıl bu standartları uygulamış olmak gerekir.", "Büyük işletme tanımı sınavda sayısal soru olarak gelir. 2025 için eşikler şöyle. Aktif toplamı 1.000.000.000 lira, net satış 2.000.000.000 lira, ortalama çalışan 250. Üç ölçütten en az ikisi, art arda iki dönemde aşılırsa sonraki dönemde büyük işletme sayılırsın. Burada bir tuzak var. Konsolide olmayan tablo kullanıp eliminasyon yapmazsan aktif ve satış eşikleri %20 artırılır. Yani 1,2000000000 ve 2,4000000000 olur.", "Küçükler için de ayrı bir standart var. Küçük ve Mikro İşletmeler İçin Finansal Raporlama Standardı, yani KÜMİ standardı. 2023'ten itibaren uygulanıyor. 22 bölüm ve 104 sayfa. Önce küçükleri düşün yaklaşımını benimsiyor ve genel olarak maliyet esaslı. Özetle kamu yararını ilgilendiren kuruluşlar Türkiye Finansal Raporlama Standartları, denetime tabi diğerleri BOBİ, denetime tabi olmayanlar KÜMİ diye düşün.", "Bir de hesap planı konusu var. KGK 2024'te finansal raporlama standartlarına uygun hesap planını yayımlama kararı aldı. Kritik nokta şu, bu plan zorunlu değil, ihtiyari. Sektörel hesap planı olan bankalar, sigortacılar ve sermaye piyasası kurumları kapsam dışında.", "Şimdi kavramsal çerçeveye geçiyoruz. Finansal raporlamanın amacı kullanıcılara karar verirken faydalı bilgi sunmak. Kullanıcılar çok çeşitli. Yatırımcılar, borç verenler, çalışanlar, yöneticiler, tedarikçiler, müşteriler, hükümetler ve kamu. Ama asli kullanıcılar yatırımcılar, borç verenler ve kredi verenlerdir. Neden mi? Çünkü işletmeye gidip bana şu bilgiyi ver diyemezler. Raporlara güvenmek zorundalar.", "Kullanıcıların küçük farklılıklarını da bil. Tedarikçiler bankalara göre kısa vadeli performansa bakar. Müşteriler devamlılığa bakar. Yöneticiler ise iç kaynaklardan bilgi alabildiği için genel amaçlı raporlara bağlı değildir. Sonuçta herkesin ortak merakı işletmenin nakit yaratma kabiliyetidir.", "Niteliksel özelliklerde iki grup var. Temel özellikler ihtiyaca uygunluk ve gerçeğe uygun sunum. Destekleyici özellikler karşılaştırılabilirlik, doğrulanabilirlik, zamanında sunum ve anlaşılabilirlik. Bunu sınavda çok soruyorlar. Hangisi temel özelliktir diye sorulduğunda karşılaştırılabilirliği seçme.", "İhtiyaca uygun bilgi kararları etkileme gücüne sahip bilgidir. Bunun için tahminde kullanılabilmeli ya da önceki değerlendirmeyi teyit etmeli. Önemlilik ise ihtiyaca uygunluğun işletmeye özgü hâli. Burada dur bir saniye, çünkü önemlilik için standart bir sayısal eşik yoktur. Her işletmede, her işlemde farklıdır.", "Gerçeğe uygun sunumun üç ayağı var. Tam, tarafsız ve hatasız. Hatasız demek her açıdan kesin doğru demek değil. Süreç doğru seçilmiş ve doğru uygulanmışsa tahmin de hatasız sunulmuş olabilir. Karşılaştırılabilirlikte ise şunu bil. Tutarlılık araçtır, karşılaştırılabilirlik amaçtır. Aynı olaya alternatif yöntem tanımak karşılaştırılabilirliği azaltır.", "Doğrulamanın iki türü var. Kasadaki parayı saymak doğrudan doğrulamadır. Stok verilerini kontrol edip ilk giren ilk çıkar yöntemiyle yeniden hesaplamak ise dolaylı doğrulamadır. Gözlemcilerin tam uzlaşması da gerekmez, görüş birliğine varabilmeleri yeterlidir.", "Tahakkukta iki koşul var. Gelecekte ekonomik yarar olasılığı ve güvenilir ölçüm. Mesela 500.000 liralık alacağın yüzde dördü tahsil edilemeyecekse, 20.000 lira gider tahakkuk ettirirsin. Davadan tazminat bekliyorsun ama tutarı güvenilir tahmin edemiyorsan varlık ve gelir kaydetmezsin.", "Tahakkuk esasıyla nakit esasını karıştırma. Nakit esasında gelir tahsil edildiğinde, gider ödendiğinde yazılır. Tahakkuk esasında gelir satış yapıldığında, gider meydana geldiğinde yazılır. Dönemsellik varsayımı da hesap kesimi, tahakkuk esası, gelirin gerçekleşme noktası ve gelirle giderin karşılaştırılması ilkelerini gerektirir.", "Son olarak ölçüm esasları. Tarihi maliyet edinme anındaki bedeldir. Cari değerin içinde gerçeğe uygun değer, kullanım değeri ile ifa değeri ve cari maliyet var. Kullanım değeri gelecekteki nakit akışlarının bugünkü değeridir. Cari maliyette varlık için bedele işlem maliyeti eklenir, yükümlülük için düşülür.", "Toparlayalım. Birincisi, defterler vergiye, finansal tablolar Türkiye Muhasebe Standartlarına göre. İkincisi, listedekiler Türkiye Finansal Raporlama Standartları, denetime tabi diğerleri BOBİ, küçükler KÜMİ uygular. Üçüncüsü, BOBİ standardında büyük işletme eşiği 1.000.000.000 aktif, 2.000.000.000 satış, 250 çalışan. Dördüncüsü, temel nitelikler ihtiyaca uygunluk ve gerçeğe uygun sunumdur. Beşincisi, önemliliğin standart bir sayısal eşiği yoktur."], "9": ["Merhaba, standartlar bölümündeyiz. Bu bölüm geniş, o yüzden sana bir harita çizerek gideceğim. Önce sunum kurallarını, sonra sınavın en çok sayısal soru çıkardığı stoklar, değer düşüklüğü, amortisman, iştirakler ve kur farkı konularını konuşacağız.", "Asgari finansal tablo setiyle başlayalım. Finansal durum tablosu, kâr veya zarar tablosu, nakit akış tablosu, özkaynak değişim tablosu ve dipnotlar. Genel ilkelerden tahakkuk esası önemli. Nakit akış tablosu hariç her şey tahakkuk esasına göre hazırlanır. Raporlama en az yılda bir yapılır ve karşılaştırmalı sunulur. Mahsup yasağını da unutma, izin olmadıkça varlıkla borç, gelirle gider netleştirilmez.", "Dönen varlık ve kısa vadeli borç tanımlarında anahtar süre 12 ay. Bir de nakit benzerlerinde üç ay kuralı var. Edinimden itibaren üç ay veya daha kısa vadeli, değer riski önemsiz yatırım genellikle nakit benzeridir. Kredili mevduat hesabı ise genellikle finansman faaliyetidir.", "Yeni bir standart geliyor. Adı finansal tablolarda sunum ve açıklama standardı. 2027 başından itibaren uygulanacak ve finansal tabloların sunuluşu standardı, yani TMS bir, yürürlükten kalkacak. Kâr veya zarar tablosu beş bölüme ayrılıyor. Esas faaliyetler, yatırım, finansman, vergi ve durdurulan faaliyetler. İki yeni ara toplam geliyor. Esas faaliyet kârı ve finansman ve vergi öncesi kâr. Bir de yönetimin kendi tanımladığı performans ölçütleri dipnotta açıklanacak.", "Politika, tahmin ve hata ayrımını iyi bil. Politika değişikliği geriye dönük uygulanır, sanki baştan beri öyleymiş gibi. Tahmin değişikliği ise yeni bilgiden doğar ve hata sayılmaz. Önemli geçmiş dönem hatasında geriye dönük düzeltme yapılır. Hata sunulan en erken dönemden de önceyse o dönemin açılış bakiyeleri düzeltilir. Şunu da ekle, kasıtlı yapılmış önemsiz bir yanlışlık bile tabloları standarda aykırı hâle getirir.", "Raporlama döneminden sonraki olaylarda soru şu. Olay dönem sonundaki bir durumu mu teyit ediyor, yoksa sonradan mı doğdu? Teyit ediyorsa düzeltme gerektirir, tutarları değiştirirsin. Sonradan doğduysa tutarlara dokunmazsın.", "Hasılatta inşa sözleşmeleri için tamamlanma yüzdesi yöntemi var. Şöyle düşün. 10.000 liralık sözleşme, toplam maliyet 8.000 lira, bu yıl 2000 lira harcadın. İşin dörtte biri bitmiş. Hasılat 2.500, kâr 500 lira olur.", "Stoklara geçelim. Maliyete alış fiyatı, iade alınamayan vergiler, taşıma gibi doğrudan giderler girer. Ticari iskonto düşülür, iade alınacak katma değer vergisi girmez. Normalin üstündeki fireler, gereksiz depolama, genel yönetim giderleri ve satış giderleri ise maliyete girmez, doğrudan gider olur. Bunu sınavda çok soruyorlar.", "Stoklar bilançoda maliyet ile net gerçekleşebilir değerden düşük olanıyla gösterilir. Net gerçekleşebilir değer, satış fiyatından tamamlama ve satış giderlerinin düşülmesiyle bulunur. 120 liralık mamulü düşün. Satış fiyatı 130, tamamlama 15, satış gideri beş. Net değer 110, yani 10 lira değer düşüklüğü var. Bu zarar satışların maliyetine yazılır. İptal ederken de dikkat, stok hiçbir zaman maliyetinin üstüne çıkamaz.", "Finansal araçlarda üç ölçüt var. İtfa edilmiş maliyet, gerçeğe uygun değer ve maliyet değeri. İtfa edilmiş maliyette etkin faiz oranı kullanılır, bu aslında aracın iç verim oranıdır. Maliyet değerine komisyon gibi işlem maliyetleri dâhildir. Finansal varlık, risk ve getirilerin tamamına yakını devredilince ya da haklar sona erince tablo dışı bırakılır.", "İştirak ve bağlı ortaklıkta iki sayı ezberle. Oyların %20'si veya fazlası önemli etki demektir, yani iştirak. Oyların yarısından fazlası kontrol demektir, yani bağlı ortaklık. İş ortaklığında ise müşterek kontrol var ve stratejik kararlar oy birliğiyle alınır.", "Özkaynak yöntemi sayısal soruya çok uygun. %30 iştiraki 1.000 liraya aldın. İştirak 400 lira kâr etti, toplam 100 lira kâr payı dağıttı. Kârdan payın 120 lira yatırımı artırır. Aldığın 30 lira kâr payı ise yatırımı azaltır. Sonuç 1.090 lira. Kâr payını gelir yazma tuzağına düşme, özkaynak yönteminde kâr payı defter değerini düşürür.", "Maddi duran varlıklarda amortisman zorunludur, ama arsa ve araziler amortismana tabi değildir. Amortismana tabi tutar, maliyetten kalıntı değerin düşülmesiyle bulunur. 1.000.000 liralık makine, 100.000 kalıntı değer, beş yıl ömür. Doğrusal yöntemle yılda 180.000 lira. Değerleme modeli seçildiyse o varlık sınıfının tümüne uygulanır. Bir yıldan uzun vadeli alımda da vade farkı ayrılır, peşin fiyat esas alınır.", "Yatırım amaçlı gayrimenkullerde kira geliri ya da değer artışı amaçlanır. İlk kayıt maliyetledir. Sonra gerçeğe uygun değer ya da maliyet yöntemi seçilir ve tüm gayrimenkullere uygulanır. Gerçeğe uygun değeri seçtiysen maliyete geri dönemezsin. Maddi olmayan varlıklarda ise araştırma her zaman giderdir, geliştirme altı şartın tamamı varsa aktifleştirilir.", "Kiralamalarda kiracı iki şey kaydeder. Kullanım hakkı varlığı ve kira yükümlülüğü. Yükümlülük, ödenmemiş kiraların bugünkü değeridir. Zımni faiz oranı kolayca bulunamıyorsa kiracının alternatif borçlanma oranı kullanılır. Kiraya veren tarafta ise risk ve getiriler devrediliyorsa finansal kiralama, devredilmiyorsa faaliyet kiralaması vardır.", "Değer düşüklüğünde formül basit. Geri kazanılabilir tutar, satış maliyeti düşülmüş gerçeğe uygun değer ile kullanım değerinden yüksek olanıdır. Defter değeri 500, satış değeri 420, kullanım değeri 450 ise geri kazanılabilir tutar 450 olur, zarar 50 lira. Kullanım değerini hesaplarken finansman akışlarını ve gelir vergisini katmazsın.", "Karşılıklarda üç şart var. Geçmiş olaydan doğan yükümlülük, kaynak çıkışının muhtemel olması ve tutarın güvenilir tahmini. Çıkış kesinse bu artık ticari borçtur. Her karşılık koşullu borçtur ama her koşullu borç karşılık değildir. Koşullu varlıklar ise tablolara hiç alınmaz.", "Kur farkında parasal ve parasal olmayan ayrımı belirleyici. Nakit, alacak ve borçlar parasaldır, kapanış kuruyla çevrilir ve kur farkı kâr veya zarara gider. 10.000 dolarlık alacak 30 liradan kaydedildi, kapanış 32 ise 20.000 lira kur farkı geliri doğar. Stok, duran varlık ve avans gibi parasal olmayan kalemler tarihi maliyetle ölçülüyorsa işlem kurunda kalır.", "Yüksek enflasyon standardı, yani TMS 29. Türk lirası kullanan işletmeler, tüketici fiyat endeksi son üç dönemde yüzde yüzü ve cari dönemde yüzde onu aşarsa tablolarını düzeltir. Burada bir tuzak var. Yıllık oranları toplama, çarparak bileşik hesapla. %30, 40 ve 15 toplanınca 85 eder ama bileşik artış yaklaşık %100 dokuzdur. Ara dönemde 36 ay ve 12 ay dikkate alınır.", "Toparlayalım. Birincisi, yeni sunum ve açıklama standardı 2027'den itibaren kâr veya zarar tablosunu beş bölüme ayırıyor. İkincisi, stok maliyet ile net gerçekleşebilir değerden düşük olanıyla ölçülür ve maliyetin üstüne çıkamaz. Üçüncüsü, %20 önemli etki, yarıdan fazlası kontroldür. Dördüncüsü, geri kazanılabilir tutar iki değerden yüksek olanıdır. Beşincisi, parasal kalemler kapanış kuruyla çevrilir ve kur farkı kâr veya zarara gider."], "10": ["Merhaba, bu bölümde Sermaye Piyasası Kurulunun finansal raporlama tebliğini konuşuyoruz. Numarası 16 nokta bir. Bu bölüm tamamen süre ve liste ezberi gibi görünür ama mantığını kurarsan çok kolaylaşır.", "Önce kapsam. Tebliğ işletme dediği zaman ihraççıları ve sermaye piyasası kurumlarını kastediyor. Ama yatırım fonları ile konut finansmanı ve varlık finansmanı fonları bu tanımın dışında. Şunu da bil, işlem sırası geçici durdurulan bir şirket yine borsada işlem gören şirket sayılır.", "Birkaç özel durum var. Pay dışında borçlanma aracı ihraç eden halka açık olmayan bir şirket, araçların itfasına kadar tebliğe tabi. Sadece yurt dışında ihraç yapıyorsa tebliğ uygulanmaz. Tablolar ise KGK'nın yayımladığı Türkiye muhasebe ve finansal raporlama standartlarına göre hazırlanır.", "Yıllık rapor herkes için var. Ara dönem raporu ise üç, altı ve dokuz aylık dönemler için şu grupta. Borsa şirketleri, yatırım kuruluşları, yatırım ortaklıkları, portföy yönetim şirketleri ve ipotek finansmanı kuruluşları. Konsolide tablo hazırlayan yatırım ortaklıkları bireysel tablolarını da birlikte hazırlar.", "Şimdi bölümün kalbi, süreler. Yıllık raporda borsa şirketi için konsolide yoksa 60 gün, konsolide varsa 70 gün. Ara dönemde konsolide yoksa 30 gün, varsa 40 gün. Ara dönem tabloları sınırlı denetime yani incelemeye tabiyse ek süre var. Borsa şirketine 10 gün, diğerlerine 15 gün eklenir.", "Hemen bir örnek yapalım. Borsa şirketisin, konsolide tablo hazırlıyorsun, altı aylık tablon incelemeden geçiyor. 40 artı 10, 50 gün. 30 Haziran bitişliyse son gün 19 Ağustos. Borsada işlem görmeyen ve konsolide hazırlamayan bir kurum için ise 30 artı 15, 45 gün eder. Son gün resmî tatile denk gelirse izleyen ilk iş günü son gündür.", "Genel kurulla ilişkili süreler de var. Halka açık ortaklıklar yıllık raporu genel kuruldan en az üç hafta önce bildirir. Diğerleri Ticaret Kanunundaki 15 gün kuralına uyar. Ama her hâlükârda yıllık rapor dönem sonunu izleyen üçüncü ayın sonuna kadar bildirilmek zorunda. Makul gerekçe varsa ek süre istenebilir.", "Kim nereye bildirir? Kamuyu Aydınlatma Platformuna, yani KAP'a bildirenler üç grup. Borsa şirketleri, portföy yönetim şirketleri ve yatırım kuruluşları. Geri kalanların çoğu raporlarını Kurula bildirir. Mesela varlık kiralama şirketleri, bağımsız denetim kuruluşları, değerleme ve derecelendirme kuruluşları, takas ve saklama kuruluşları. Bu ayrımı sınavda çok soruyorlar.", "Bildirimin usulü de önemli. Denetimden geçmiş raporda, denetim raporunun işletmeye ulaştığı ve aynı gün yönetim kurulu kararının alındığı tarihi izleyen ilk iş günü sonuna kadar bildirim yapılır. Borsa şirketleri bu bildirimleri seans saatleri dışında yapar. Bağlı ortaklıklar da ana ortaklıkla aynı anda ya da ondan önce bildirir.", "Tabloları faaliyet raporundan önce bildirmek serbest. Ama o zaman iki ayrı yönetim kurulu kararı ve iki ayrı sorumluluk beyanı gerekir. Sorumluluk beyanını raporlamadan sorumlu yönetim kurulu üyeleri ile genel müdür ya da raporlamadan sorumlu yönetici imzalar.", "Sorumluluk kimde? Raporların doğruluğundan işletme ve kusuruna göre yönetim kurulu üyeleri sorumludur. Yönetim kurulu denetim komitesini, yoksa en az bir üyesini raporlamadan sorumlu belirler. Ama burada dur bir saniye, çünkü bu belirleme yönetim kurulunun sorumluluğunu ortadan kaldırmaz.", "Faaliyet raporu tarafında asgari içerik yönetmeliği uygulanır, ama süreler tebliğden gelir. Ticari sır niteliğindeki bilgiyi sır olduğu sürece yazmayabilirsin. Sır niteliği bitince ilk faaliyet raporunda açıklarsın.", "İnternet sitesi kuralı kısa. Raporlar en az beş yıl sitede kalır. Birden fazla siten varsa tescilli sitede zorunlu, diğerlerinde ihtiyaridir. Halka açık ortaklıklar ayrıca raporları genel kuruldan üç hafta önce merkezde ve şubelerde hazır tutar.", "Sermaye Piyasası Muhasebe Defteri de sınavda çıkar. Tebliğe göre yaptığın düzeltmeler için kanuni defterlere kayıt atamazsın. Bu düzeltmeleri ayrı bir deftere, sermaye piyasası muhasebe defterine yazarsın. Elektronik ya da yazılı tutulabilir ve Ticaret Kanunundaki saklama süresi kadar saklanır.", "Bir de şu kural var. Tebliğe uygun olmayan raporların verilerini kamuya açıklamalarda kullanırsan, önemli hususlarda gerçeğe aykırı veya eksik bilgi vermiş sayılırsın. Özet bilgi açıklayabilirsin ama asıl rapora nasıl ulaşılacağını söylemen gerekir.", "Muafiyetlere geçelim. İşlem sırası 30 günden fazla durdurulanlar, kottan sürekli çıkarılanlar, faaliyeti geçici durdurulan kurumlar ve tasfiye hâlindekiler ara dönem raporundan muaftır. 30 günü aşmayan bir durdurma muafiyet sağlamaz, bu klasik bir tuzak.", "Piyasa Öncesi İşlem Platformundaki şirketler üç ve dokuz aylık ara dönem finansal raporlarından ve ara dönem faaliyet raporundan muaftır. Ama fiili dolaşım oranı %5'in altına düştüğü için bu platforma alınanlara bu muafiyetler uygulanmaz. Gelişen İşletmeler Pazarı kaldırıldığı için oradaki şirketler de Alt Pazar kurallarına tabi oldu.", "Tasfiye hâlindeki işletmeler, tasfiye mevzuatındaki belgeleri düzenleyerek yükümlülüğü yerine getirmiş sayılır ve bunları Kurula bildirir. Payları borsada işlem görmeyen halka açık ortaklıklar ise isterse tam set standartları seçebilir. Ama seçtikten sonra makul gerekçe olmadan standardını değiştiremez.", "Toparlayalım. Birincisi, yıllık rapor borsa şirketinde 60, konsolidede 70 gün. İkincisi, ara dönem 30 ve 40 gün, inceleme varsa borsa şirketine 10, diğerlerine 15 gün eklenir. Üçüncüsü, KAP'a borsa şirketleri, portföy yönetim şirketleri ve yatırım kuruluşları bildirir. Dördüncüsü, raporlar internet sitesinde en az beş yıl kalır. Beşincisi, işlem sırası 30 günden fazla durdurulanlar ara dönemden muaftır."], "11": ["Merhaba, bağımsız denetimin temel kavramları bölümündeyiz. Bu bölümde denetimin neden var olduğunu, türlerini, denetim riskini, önemliliği, kanıtı ve görüş türlerini konuşacağız. Sınavda burada hem tanım hem de küçük hesap soruları çıkıyor.", "Denetim neden var? Şöyle düşün. Bir şirketin sahipleri var, bir de onu yöneten profesyoneller. Sahip asil, yönetici vekil. Asil, vekilin ne yaptığını tam bilemez. Buna bilgi asimetrisi diyoruz. Vekâlet teorisi bu ilişkiyi açıklar ve temelleri Max Weber'e dayanır. Denetim, vekilin sunduğu bilgiler üzerinde bağımsız bir kontrol sağlayarak güven yaratır.", "Uluslararası Muhasebeciler Federasyonu ile Amerikan Yeminli Muhasebeciler Enstitüsü denetimi tanımlamak yerine amacını söyler. Amaç, kullanıcıların finansal tablolara duyduğu güveni artırmak. Bunu da tabloların tüm önemli yönleriyle çerçeveye uygun olup olmadığına dair bir görüşle yapar. Denetimin faydalarından biri de işletmenin daha düşük maliyetle finansman bulmasını kolaylaştırmasıdır.", "Üç denetim türü var. Finansal tablo denetimi tabloların genel kabul görmüş ilkelere uygunluğuna bakar. Uygunluk denetimi daha üst bir otoritenin kurallarına uyulup uyulmadığına bakar, vergi beyannamesi incelemesi gibi. Faaliyet denetimi ise etkinlik ve verimliliği değerlendirir. Subjektif olduğu için yönetim danışmanlığına benzer. Bunu sınavda çok soruyorlar.", "Denetçiler de üçe ayrılır. Bağımsız denetçi kimseye bağlı değildir. İç denetçi işletmenin parçasıdır ve üst yönetime destek olur. Kamu denetçisi bir kamu kurumuna bağlı çalışır. Denetim standartları ise yol göstericidir, kısıtlayıcı değildir. 1947'de genel kabul görmüş denetim standartları ortaya çıktı. Uluslararası denetim standartları ülkemize alındığında bağımsız denetim standartları adını aldı.", "Geleneksel yaklaşımda dört aşama var. Planlama, kanıt toplama, kanıt değerlendirme ve raporlama. Risk tabanlı yaklaşımda ise üç aşama var. Risk değerlendirme, riske karşılık verme ve raporlama. İkisini karıştırma. Bugünkü uluslararası standartlar risk tabanlı yaklaşımı benimser.", "Planlamada bir püf nokta var. Denetçi bazen uzmana başvurur, mesela değerli taşlar ya da sigorta karşılıkları için. Ama uzman kullanmak denetçinin sorumluluğunu değiştirmez. Uzmanın raporu görüşü değiştirmiyorsa denetim raporunda uzmana atıf da yapılmaz.", "Denetçinin karşılaştığı riskler üç grup. İş hayatına ilişkin ya da ticari risk, hile riski ve denetim riski. Ticari risk denetçi açısından dava, yaptırım ya da itibar kaybı yüzünden zarara uğrama olasılığıdır. Standartlara tam uysan bile ortaya çıkabilir. Ticari riski yüksek görürsen daha fazla çalışırsın, ama düşük görmen minimumun altında çalışmana izin vermez.", "Hileye gelince. Hata kasıtsızdır, hile kasıtlıdır. Denetçiyi iki tür hile ilgilendirir. Hileli finansal raporlama ve varlıkların kötüye kullanılması. Hile üçgenini de bil. Baskı ya da teşvik, fırsat ve davranışı kendine makul gösterme. Bu üçgen Donald Cressey'den gelir. Denetçi hile olup olmadığına dair yasal hüküm veremez, ama mesleki şüphecilikle çalışır.", "Denetim riski üç bileşenden oluşur. Doğal risk, iç kontrol hiç yokmuş gibi düşünüldüğünde yanlışlık olma ihtimalidir. Kasa hesabı mesela stoklardan daha risklidir. Kontrol riski, iç kontrolün yanlışlığı önleyememe ihtimalidir. Tespit riski de denetçinin yanlışlığı bulamama ihtimalidir. Bu sonuncusu diğerlerinden etkilenir.", "Şimdi formüle geçelim. Planlanan tespit riski, kabul edilebilir denetim riskinin, doğal risk ile kontrol riskinin çarpımına bölünmesiyle bulunur. Mesela kabul edilebilir risk %5, doğal risk %100, kontrol riski %50. Çarpım %50 eder. Beşi 50'ye bölersin, planlanan tespit riski %10 çıkar.", "Formülden çıkan ilişkileri iyi öğren. Doğal risk artarsa planlanan tespit riski düşer ve daha fazla kanıt toplarsın. İç kontrol güçlüyse kontrol riski düşer, tespit riski yükselebilir, daha az kanıt yeterli olur. Kabul edilebilir denetim riski ile planlanan tespit riski ise aynı yönde hareket eder.", "Önemliliğe gelelim. Denetçi tüm yanlışlıkları değil, önemli olanları arar. Başlangıç önemliliği genellikle bir kalemin yüzdesi alınarak bulunur, en sık kullanılan baz vergi öncesi kârdır. Kitaptaki örnekte net satışların %1'i ya da faaliyet kârının %5'i var. 200.000.000 liralık satışın %1'i 2.000.000 liradır.", "Performans önemliliği ise genel önemliliğin altında belirlenen ikinci bir eşiktir. Neden gerekli? Çünkü tek tek önemsiz görünen hatalar toplanınca önemli hâle gelebilir. Bir de şunu aklında tut. Önemlilik eşiği düştükçe daha fazla kanıt toplarsın. Yani önemlilik ile kanıt miktarı zıt yönlüdür.", "Risk değerlendirme prosedürleri üç tane. Sorgulama, analitik prosedürler ve gözlem ile tetkik. Maddi doğrulama testleri ise riske karşılık verme aşamasında yapılır. İç kontrol güçlüyse denetim programı kısalır, zayıfsa inceleme alanı genişler.", "Kanıtta iki kavram var. Yeterlilik miktardır, uygunluk kalitedir. Kalite arttıkça daha az kanıt yeter. Ama burada dur bir saniye, çünkü daha fazla kanıt toplamak düşük kaliteyi her zaman telafi etmez. Dış ve bağımsız kaynaktan, denetçinin doğrudan elde ettiği ve dönem sonuna yakın kanıtlar daha güvenilirdir.", "Prosedür örnekleri sınavda klasik. Borç anlaşmalarını okumak teftiş etmedir. Amortismanı yeniden hesaplamak yeniden çalıştırmadır. Büyük defterdeki mevduatı banka hesabıyla karşılaştırmak uzlaşma sağlamadır. Kayıttan belgeye geriye gitmek teyit etme, belgeden kayda gitmek iz sürmedir.", "Görüş türlerine gelince. Tablolar uygunsa olumlu görüş. Yanlışlık önemli ama yaygın değilse sınırlı olumlu, yani şartlı görüş. Kanıt elde ettin ve yanlışlık hem önemli hem yaygınsa olumsuz görüş. Kanıt elde edemedin ve olası etki önemli ve yaygınsa görüş vermekten kaçınma. Şartsız görüş diye bir tür yoktur, bu şık sınavda çeldirici olarak çıkar.", "Toparlayalım. Birincisi, geleneksel yaklaşım dört, risk tabanlı yaklaşım üç aşamalıdır. İkincisi, denetim riski doğal risk, kontrol riski ve tespit riskinden oluşur. Üçüncüsü, planlanan tespit riski kabul edilebilir riskin doğal risk ile kontrol riskinin çarpımına bölümüdür. Dördüncüsü, önemlilik eşiği düştükçe kanıt artar. Beşincisi, önemli ve yaygın yanlışlıkta olumsuz görüş, kanıt yoksa kaçınma verilir."], "12": ["Merhaba, bağımsız denetim düzenlemelerinin ilk bölümündeyiz. Bugün Türk Ticaret Kanunundaki denetim hükümlerini, KGK'yı ve Bağımsız Denetim Yönetmeliğini konuşacağız. Burası tam bir sayı bölümü, o yüzden kulağını açık tut.", "Ticaret Kanunu denetime tabi şirketlerin tablolarının Türkiye Denetim Standartlarına göre denetleneceğini söyler. Hangi şirketlerin denetime tabi olacağını ise Cumhurbaşkanı belirler. Çok önemli bir hüküm var. Denetime tabi olduğu hâlde denetlettirilmemiş tablolar düzenlenmemiş hükmündedir. Yani hukuken yok sayılır.", "Denetimin konusu beş başlık. Envanter, muhasebe, iç denetim, riskin erken saptanması komitesinin raporu ve yönetim kurulunun faaliyet raporu. Denetim bir de dürüst resim ilkesine bakar. Tablolar şirketin durumunu tam, anlaşılır, karşılaştırılabilir ve aslına sadık yansıtıyor mu?", "Riskin erken saptanması komitesi borsa şirketlerinde zorunludur. Diğer şirketlerde denetçi gerekli görüp yazılı bildirirse derhâl kurulur ve ilk raporunu bir ayın sonunda verir. Komite yönetim kuruluna her iki ayda bir rapor sunar. Bu iki ay ile bir ay kuralını karıştırma.", "Denetçiyi genel kurul seçer, topluluk denetçisini ise ana şirketin genel kurulu. Seçimden sonra yönetim kurulu bunu ticaret siciline tescil ettirir ve ilan eder. Denetçiyi görevden almak kolay değil. Mahkeme ancak haklı sebep varsa, özellikle taraflılık kuşkusu varsa başka denetçi atayabilir.", "Bu davayı kim açabilir? Yönetim kurulu ya da sermayenin yüzde onunu temsil eden pay sahipleri. Halka açık şirkette bu oran %5. Mesela çıkarılmış sermayesi 80.000.000 olan halka açık şirkette 4.000.000 liralık pay yeterli. Dava seçimin ilanından itibaren üç hafta içinde açılır. Azlık seçimde karşı oy vermiş, tutanağa geçirmiş ve en az üç aydır pay sahibi olmalı.", "Bir de dördüncü ay kuralı var. Faaliyet döneminin dördüncü ayına kadar denetçi seçilmediyse, herhangi bir pay sahibinin istemiyle mahkeme denetçi atar ve bu karar kesindir. Denetçi de sözleşmeyi ancak haklı sebeple feshedebilir. Görüş içeriği hakkında fikir ayrılığı haklı sebep değildir. Bunu sınavda çok soruyorlar.", "Kim denetçi olamaz? Şirkette pay sahibi olan, son üç yılda şirkette çalışmış olan, bağlantılı bir şirkette %20'den fazla payı olan ya da yöneticinin üçüncü dereceye kadar akrabası olan. Bir de gelir bağımlılığı kuralı var. Son beş yılda denetçilik gelirinin yüzde otuzundan fazlası bu şirketten geliyorsa denetçi olamazsın.", "KGK'ya kısaca değinelim. Kamu tüzel kişiliğine ve idari özerkliğe sahip. Kurulu dokuz üyeden oluşur ve üyeleri Cumhurbaşkanı atar. Görevleri standart koymak, denetçileri yetkilendirmek ve gözetim yapmak.", "Şimdi Yönetmeliğe geçiyoruz. Bağımsız denetçi, mali müşavir ya da yeminli mali müşavir olup KGK tarafından yetkilendirilen kişidir. Kamu yararını ilgilendiren kuruluşları, yani halka açık şirketleri, bankaları ve sigortacıları yalnızca denetim kuruluşları denetleyebilir. 2025'te tasarruf finansman şirketleri de bu kapsama alındı.", "Denetçi olmak için en az üç yıl uygulamalı eğitim gerekiyor. 15 yıl tecrübesi olandan bu şart aranmaz. Sürekli eğitim ise sicile tescili izleyen ikinci takvim yılının başında başlar. Sicilde olmayan ya da gayri faal görünen kişi denetim yapamaz.", "Bağımsızlık iki boyutlu. Esasta bağımsızlık, zihninin gerçekten tarafsız olması. Şekilde bağımsızlık ise dışarıdan bakan makul birinin sende taraflılık izlenimi görmemesi. Denetlediğin şirkete vergi danışmanlığı, tasdik ve vergi denetimi dışında hizmet veremezsin. Boşanmış eşler bile bağımsızlık değerlendirmesinde hesaba katılır.", "Rotasyon kuralı sayısal soru için ideal. Son 10 yılda yedi yıl aynı şirketi denetlediysen üç yıl ara vermen gerekir. Mesela 2020'den 2026'ya kadar denetledin. 2027, 28 ve 29 bekleme yılı. En erken 2030 denetimine dönebilirsin. Süre hesabında aynı denetim ağında
