mler: gözlem, belge inceleme, görüşme, fiziksel sayım, dış teyit, yeniden hesaplama, destekleyici belge testi, analitik inceleme.<\/li>\n<li>Değerlendirmede <b>önemlilik<\/b> ve <b>makul güvence<\/b> dikkate alınır. Denetçi mükemmel güvence aramaz (aşırı maliyetli). Doğal veya kontrol riski yüksekse daha fazla güvence ister.<\/li>\n<\/ul>\n<h4>Sonuçların iletimi ve görüş türleri<\/h4>\n<ul>\n<li>Genel amaçlar (BDS 200.11): tabloların hata veya hile kaynaklı önemli yanlışlık içermediğine makul güvence elde edip görüş bildirmek; bulgulara göre raporlamak ve BDS'nin zorunlu kıldığı bildirimleri yapmak.<\/li>\n<li>Değerlendirme, yönetim yargılarındaki taraflılık göstergeleri dâhil muhasebe uygulamalarının nitel yönlerini de içerir (BDS 700.12). Rapor yönetime, denetim komitesine, YK'ya ve ilgililere iletilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Görüş<\/th><th>Ne zaman?<\/th><\/tr>\n<tr><td>Olumlu (standart)<\/td><td>Tablolar tüm önemli yönleriyle çerçeveye uygun; kapsam sınırlaması yok.<\/td><\/tr>\n<tr><td>Olumlu (açıklayıcı ifadelerle)<\/td><td>Görüşü etkilemeyen açıklama gerekir: muhasebe ilkesi değişikliği, işin sürdürülmesine ilişkin önemli şüphe.<\/td><\/tr>\n<tr><td>Sınırlı olumlu (şartlı)<\/td><td>Yanlışlık <b>önemli ama yaygın değil<\/b>; ya da kanıt alınamadı, muhtemel etki önemli olabilir ama yaygın olmayabilir (BDS 705/7).<\/td><\/tr>\n<tr><td>Olumsuz<\/td><td>Yeterli kanıt <b>elde edildi<\/b>; yanlışlıklar <b>önemli ve yaygın<\/b> (BDS 705/8).<\/td><\/tr>\n<tr><td>Görüş vermekten kaçınma<\/td><td>Yeterli kanıt <b>elde edilemedi<\/b>; muhtemel etkiler <b>önemli ve yaygın<\/b> olabilir; veya birden fazla belirsizliğin kümülatif etkisi görüşü imkânsız kılıyor (BDS 705/9-10). Olumlu ya da olumsuz bir vurgu değildir.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Dikkat:<\/b> BDS 705 olumlu dışında üç görüş sayar: sınırlı olumlu, olumsuz, kaçınma. \"Şartsız görüş\" diye bir tür yoktur.<\/li>\n<li>Rapordan sonra önemli yanlışlık fark edilirse: işletme uyarılır → olumlu yanıt yoksa YK bilgilendirilir → mümkünse kullanıcılar rapora güvenmemeleri için uyarılır. Gerekli prosedürlerin atlandığı sonradan anlaşılırsa yasal sınırlar içinde uygulanmaya çalışılır. Sorumluluk rapordan sonra da sürer.<\/li>\n<\/ul>\n\n<h3>Risk tabanlı denetim yaklaşımı<\/h3>\n<ul>\n<li>Amaç geleneksel yaklaşımla aynıdır; fark, yüksek riskli alanlara odaklanma ve daha kapsamlı, sistematik risk değerlemesidir.<\/li>\n<li><b>Üç aşama:<\/b> risk değerlendirme → riske karşılık verme → raporlama. Geleneksel dört aşama bunlarla bütünleşir: planlama risk değerlendirmede; kanıt toplama ve değerlendirme riske karşılık vermede.<\/li>\n<\/ul>\n<h4>Risk türleri<\/h4>\n<table>\n<tr><th>Risk<\/th><th>Tanım<\/th><\/tr>\n<tr><td>İş hayatına ilişkin (ticari) risk<\/td><td>İşletme için: amaçlara ulaşma ve strateji uygulama kabiliyetini olumsuz etkileyen şart, olay, eylem veya eylemsizlikler (BDS 315.04); önemli yanlışlık riskinden <b>daha kapsamlı<\/b>. Denetçi için: dava, yaptırım, itibar kaybı nedeniyle <b>zarara uğrama olasılığı<\/b>; standartlara uyulsa da doğabilir. Denetçinin tüm iş risklerini belirleme sorumluluğu yoktur.<\/td><\/tr>\n<tr><td>Hile riski<\/td><td>Hata kasıtsızdır; hile <b>kasıtlıdır<\/b>. Denetçiyi ilgilendiren iki kasıtlı yanlışlık: <b>hileli finansal raporlama<\/b> ve <b>varlıkların kötüye kullanılması<\/b>. Denetçi hilenin varlığına dair <b>yasal hüküm veremez<\/b>.<\/td><\/tr>\n<tr><td>Denetim riski<\/td><td>Önemli yanlışlık içeren tablolar hakkında olumlu görüş verme ihtimali = doğal risk + kontrol riski + tespit riski birleşimi.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Ticari risk yüksek algılanırsa denetçi minimumdan <b>daha fazla<\/b> çalışır; düşük ticari risk minimumun altında çalışmayı haklı kılmaz.<\/li>\n<li><b>Hile üçgeni<\/b> (Donald R. Cressey, 1940'lar, \"Other People's Money\"): <b>baskı/teşvik, fırsat, davranışı makul gösterme (rasyonalizasyon)<\/b>.<\/li>\n<li>Denetçiden <b>mesleki şüphecilik<\/b> beklenir. Yönetimin dürüstlüğü hakkında yargıya varmaz; yüksek hile riski önyargı demek değildir; yönetimin dürüst olmadığına inanılıyorsa tablolar denetlenemez kabul edilir. Gizli anlaşma ve belge sahteciliği nedeniyle kesin garanti beklenemez; denetçiden yalnız <b>önemli<\/b> hileleri ortaya çıkarması beklenir.<\/li>\n<\/ul>\n<h4>Denetim riskinin bileşenleri<\/h4>\n<table>\n<tr><th>Bileşen<\/th><th>Tanım<\/th><th>Kimin riski / not<\/th><\/tr>\n<tr><td>Doğal risk (IR)<\/td><td>İç kontrol <b>olmadığı varsayımıyla<\/b> önemli yanlışlık olma ihtimali<\/td><td>İşletmenin doğası ve hesap yapısına bağlı; <b>kasa<\/b> stoklardan daha risklidir.<\/td><\/tr>\n<tr><td>Kontrol riski (CR)<\/td><td>İç kontrolün önemli yanlışlığı zamanında önleyememe veya tespit edememe ihtimali<\/td><td>İç kontrol %100 başarılı olamaz; güçlü kontrol CR'yi düşürür.<\/td><\/tr>\n<tr><td>Tespit riski (DR)<\/td><td>Denetçinin prosedürlerinin önemli yanlışlığı ortaya çıkaramama ihtimali<\/td><td>Diğer risk unsurlarından etkilenir; kullanılan denetim yöntemlerinin etkililiğinin fonksiyonudur.<\/td><\/tr>\n<\/table>\n<p>Doğal riski yüksek gösteren faktörler: sektöre göre tutarsız kârlılık, ekonomik faktörlere aşırı duyarlılık, süregelen sorunlar, önceki denetimlerde önemli hatalar, yüksek para devir hızı, tartışmalı başarılar, zayıf muhasebe becerisi.<\/p>\n<h4>Denetim riski modeli<\/h4>\n<p><b>Planlanan tespit riski (PDR) = Kabul edilebilir denetim riski (AAR) / (Doğal risk (IR) × Kontrol riski (CR))<\/b><\/p>\n<table>\n<tr><th>İlişki<\/th><th>Sonuç<\/th><\/tr>\n<tr><td>Doğal risk ↑<\/td><td>PDR ↓ → daha çok kanıt, daha tecrübeli personel (ters orantı)<\/td><\/tr>\n<tr><td>Kontrol riski ↑<\/td><td>PDR ↓; IR ve CR çarpım olarak aynı etkiyi yapar; standartlar ayrı değerlendirilmesini öngörür<\/td><\/tr>\n<tr><td>Etkin iç kontrol<\/td><td>CR ↓ → PDR ↑ → gerekli kanıt ↓<\/td><\/tr>\n<tr><td>Kabul edilebilir denetim riski ↑<\/td><td>PDR ↑ (aynı yönde)<\/td><\/tr>\n<tr><td>PDR düşük<\/td><td>Daha fazla kanıt toplanır<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Örnek<\/th><th>PDR<\/th><\/tr>\n<tr><td>AAR %5, IR %100, CR %50<\/td><td>0,05 / 0,50 = <b>%10<\/b><\/td><\/tr>\n<tr><td>AAR %4, IR %80, CR %25<\/td><td>0,04 / 0,20 = <b>%20<\/b><\/td><\/tr>\n<\/table>\n\n<h3>Risk tabanlı uygulama süreci<\/h3>\n<ul>\n<li><b>Denetim evreni:<\/b> riskli faaliyetleri de kapsayan merkez, şube, bağlı kuruluşlar gibi potansiyel denetim veya danışmanlık projeleri. <b>Denetim kapsamı:<\/b> evrendeki özellikli alanlara ilişkin risklere öncelik verme.<\/li>\n<li><b>Risk değerlendirme aşamasının adımları:<\/b> (1) işin alınması ve sözleşme, (2) planlama, (3) önemlilik düzeyinin belirlenmesi, (4) risk faktörlerinin tespiti ve iç kontrolün tanınması.<\/li>\n<li>Risk değerlemesi = riskin <b>tanımlanması<\/b> (dış: teknoloji, rekabet, ekonomi; iç: personel, faaliyet yapısı, bilgi sistemleri) + <b>analizi<\/b> (tahmin, olasılık ve etki, yönetim) (COSO, 2004). COSO'ya göre risk, örgütün amaçlarına ulaşmasını engelleyen herhangi bir olaydır.<\/li>\n<li><b>İşin alınması:<\/b> denetim şirketleri kötü ünlü işletmelerden kaçınır; geçmiş, yönetici ve hissedarlar, finansal güç ve kredi notu araştırılır. Yüksek riskli örnekler: yazılım teknoloji, sağlık ve kaza sigortası şirketleri.<\/li>\n<li><b>Planlama:<\/b> yeni faaliyetler mevcutlardan, önemli işlemler önemsizlerden daha riskli kabul edilir. Planlama denetim boyunca süren bir süreçtir. <b>Denetim stratejisi<\/b> genel çerçeve; <b>denetim planı<\/b> daha ayrıntılı.<\/li>\n<\/ul>\n<h4>Önemlilik<\/h4>\n<ul>\n<li>Denetim riski sıfıra indirilemez; denetçi tüm yanlışlıkları değil <b>önemli yanlışlıkları<\/b> arar.<\/li>\n<li>Tanımlar: IASB (kararları etkileyen unsur), FASB 1980 (makul kullanıcının yargısını değiştiren), AUS 306.03 (sınırlı kaynak dağıtım kararlarını ters etkileyen).<\/li>\n<li>Başlangıç önemliliği genellikle bir tablo kalemine <b>yüzde<\/b> uygulanarak bulunur; en çok kullanılan baz <b>vergi öncesi kâr<\/b>. Kitaptaki örnek: <b>net satışların %1'i<\/b> veya <b>faaliyet kârının %5'i<\/b>.<\/li>\n<li><b>Performans önemliliği:<\/b> genel önemliliğin <b>altında<\/b> belirlenen ikinci seviye; tek tek önemsiz yanlışlıkların toplamının önemliliği aşma ihtimalini düşük seviyeye indirmek içindir. Mekanik bir hesap değildir; mesleki muhakeme gerektirir (BDS 320.A13).<\/li>\n<li>Önemlilik nitel ve nicel değerlendirilir; finansal tablo düzeyinde ve hesap kalanı düzeyinde kullanılır. Hesap düzeyinde önemsiz bir hata tablo bütününde önemli olabilir.<\/li>\n<li><b>İlişkiler:<\/b> önemlilik ile beklenen kesinlik ve kabul edilebilir risk <b>zıt yönlü<\/b>; risk ile kanıt <b>aynı yönlü<\/b>; dolayısıyla önemlilik eşiği ile kanıt miktarı <b>zıt yönlü<\/b> (düşük eşik → çok kanıt).<\/li>\n<li>Yüksek sorumluluk baskısı altındaki denetçiler önemlilikte daha tutucu, daha az değişken davranır ve daha çok zaman ayırır.<\/li>\n<\/ul>\n<table>\n<tr><th>Örnek<\/th><th>Hesap<\/th><\/tr>\n<tr><td>Net satış 200 milyon TL, ölçüt %1<\/td><td>Önemlilik 2 milyon TL<\/td><\/tr>\n<tr><td>Faaliyet kârı 30 milyon TL, ölçüt %5<\/td><td>Önemlilik 1,5 milyon TL<\/td><\/tr>\n<\/table>\n<h4>Risk faktörleri ve iç kontrol<\/h4>\n<ul>\n<li>Şekildeki zincir: önemli hata (doğal risk) → iç kontrol önleyemezse kontrol riski → denetim prosedürleri bulamazsa tespit riski → reddedilmesi gereken tablolar kabul edilir = <b>denetim riski<\/b>.<\/li>\n<li><b>Risk değerlendirme prosedürleri (BDS 315.06):<\/b> (a) yönetim, iç denetim ve diğer kişilerin <b>sorgulanması<\/b>, (b) <b>analitik prosedürler<\/b>, (c) <b>gözlem ve tetkik<\/b>.<\/li>\n<li>Gözlem ve tetkik: faaliyetlerin gözlenmesi; plan, strateji, kayıt ve iç kontrol rehberinin incelenmesi; ara dönem raporları ve toplantı tutanaklarının okunması; tesis ziyareti; elektronik işlemlerin izlenmesi.<\/li>\n<li><b>Analitik inceleme:<\/b> tablolar ve ilişkiler arasındaki tutarlılığı karşılaştırma; beklenti geliştirilir, kayıtlı rakamlarla fark önemli yanlışlık riskine işaret eder.<\/li>\n<li>Riskler tablo düzeyinde veya yönetim beyanı düzeyinde olabilir (BDS 315.25). Tablo düzeyi değerlendirme: kilit personelin yetkinliği, uzman ihtiyacı, gözetim düzeyi ve <b>süreklilik<\/b> şüphesi.<\/li>\n<li>İç kontrol incelemesi zayıf ve güçlü yönleri gösterir; güçlü kontrol programı kısaltır, zayıf kontrol tetkik alanını genişletir.<\/li>\n<\/ul>\n\n<h3>Riske karşılık verme: kanıt ve prosedürler<\/h3>\n<ul>\n<li>Amaç: değerlendirilmiş risklere karşı uygun işleri tasarlayıp uygulayarak yeterli ve uygun kanıt elde etmek (BDS 330.03). GKGDS çalışma alanı standartlarının <b>üçüncüsü<\/b>: görüşe makul temel için yeterli sayıda ve güvenilirlikte kanıt.<\/li>\n<li>Kanıt <b>kümülatif<\/b>tir; önceki denetimler ve müşteri kabul prosedürleri de kanıt sayılabilir.<\/li>\n<li><b>Yeterlilik<\/b> = kanıtın <b>miktarı<\/b>; <b>uygunluk<\/b> = kanıtın <b>kalitesi<\/b> (ihtiyaca uygunluk ve güvenilirlik). Risk arttıkça daha çok, kalite arttıkça daha az kanıt gerekir. <b>Dikkat:<\/b> daha fazla kanıt düşük kaliteyi telafi etmeyebilir (BDS 500.A4).<\/li>\n<li>Kanıt sayısını belirleyen faktörler: kalemin önemliliği, risk derecesi, kanıt toplama maliyeti. Zorunlu kanıt yüksek maliyet gerekçesiyle terk edilmez; şüphe sürüyorsa kanıt toplamaya devam edilir, aksi hâlde olumsuz veya şartlı görüş.<\/li>\n<\/ul>\n<table>\n<tr><th>Güvenilirlik unsuru<\/th><th>Açıklama<\/th><\/tr>\n<tr><td>İlgili olma<\/td><td>Kanıt amaçla doğrudan ilişkili olmalı. Stok sayımı <b>miktar<\/b> için ilgili; <b>mülkiyet ve maliyet<\/b> için ilgili değil.<\/td><\/tr>\n<tr><td>Kaynak<\/td><td>Bağımsız dış kaynak, etkin iç kontrol, denetçinin doğrudan elde ettiği kanıt daha güvenilir; yetersiz olunan alanda uzman yardımı.<\/td><\/tr>\n<tr><td>Zamanlılık<\/td><td>Dönen varlık, kısa vadeli borç ve gelir tablosu kalemlerinde hesap kesimi önemli. Dönem içi kanıt ucuz; dönem sonu veya sonrası kanıt daha güvenilir.<\/td><\/tr>\n<tr><td>Objektiflik<\/td><td>Farklı denetçiler benzer sonuca varıyorsa objektif; objektif kanıt subjektiften güvenilir.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kanıt toplama yöntemlerine <b>denetim teknikleri<\/b>, uygulamalarına <b>denetim prosedürleri<\/b> denir. Prosedürün niteliği: amacı (<b>kontrol testi<\/b> veya <b>maddi doğrulama<\/b>) ve türü (tetkik, gözlem, sorgulama, teyit, yeniden hesaplama, yeniden uygulama, analitik prosedür). Niteliği, risklere karşılıkta en önemli unsurdur (BDS 330.A5).<\/li>\n<li>Prosedürlerin uygulanmasına ilişkin standart yoktur; işletmeye ve denetçinin yaklaşımına, mesleki yargıya bağlıdır. Yönetim iddiaları denetim amaçlarına çevrilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Prosedür<\/th><th>Örnek<\/th><\/tr>\n<tr><td>Fiziksel kontrol<\/td><td>Demirbaş ve teçhizatın fiziki incelemesi<\/td><\/tr>\n<tr><td>Gözlem<\/td><td>Stok alım yöntemlerini gözlemleme<\/td><\/tr>\n<tr><td>Doğrulama (üçüncü taraf)<\/td><td>Ticari alacak veya borçların varlığını tasdik ettirme<\/td><\/tr>\n<tr><td>İz sürme<\/td><td>Satın alım raporlarını yevmiye kayıtlarıyla karşılaştırma (kayıtların eksiksizliği)<\/td><\/tr>\n<tr><td>Teyit etme (geriye doğru iz sürme)<\/td><td>Yevmiyedeki alımı fatura, rapor, ödenen çekle karşılaştırma (kaydın var olduğu)<\/td><\/tr>\n<tr><td>Teftiş etme<\/td><td>Borç anlaşmalarını okuma<\/td><\/tr>\n<tr><td>Uzlaşma sağlama<\/td><td>Büyük defterdeki mevduat ile banka hesap durumunu uzlaştırma<\/td><\/tr>\n<tr><td>Yeniden çalıştırma<\/td><td>Amortisman giderini yeniden hesaplama<\/td><\/tr>\n<tr><td>Analitik prosedür<\/td><td>Cari yıl oranlarını önceki dönem oranlarıyla karşılaştırma<\/td><\/tr>\n<tr><td>Sorgulama<\/td><td>Kontrolöre görevler ayrılığını sorma<\/td><\/tr>\n<tr><td>Karşılaştırma<\/td><td>Ticari alacak kontrol toplamlarını yevmiye kayıtlarıyla karşılaştırma<\/td><\/tr>\n<\/table>\n\n<h3>Raporlama aşaması<\/h3>\n<ul>\n<li>Yeterli kanıta ulaşılmışsa tabloların UFRS ve GKGMİ'ye uygunluğu ile önemli belirsizliklerin etkisi değerlendirilir; doğru ve adil bakış varsa <b>olumlu<\/b>.<\/li>\n<li>Önemli belirsizlik varsa: doğru ve adil bakışa engel olup olmadığına göre <b>şartlı veya olumsuz<\/b>.<\/li>\n<li>Kanıt yetersizse (kapsam sınırlaması): sınırlamanın derecesine göre <b>şartlı görüş veya görüş bildirmekten kaçınma<\/b>.<\/li>\n<li>Çerçeveden sapma varsa gerekçe ve yönetim açıklamaları değerlendirilir; yetersizse etkinin önemlilik ve <b>yaygınlık<\/b> düzeyine göre şartlı veya olumsuz.<\/li>\n<\/ul>", "sorular": [{"q": "Vekâlet teorisinin temellerinin dayandığı düşünür ve eser hangisidir?", "o": ["Adam Smith – Ulusların Zenginliği", "Shavell – Risk Sharing and Incentives", "Donald R. Cressey – Other People's Money", "Max Weber – Ekonomi ve Toplum", "Elton Mayo – Hawthorne Araştırmaları"], "a": 3, "e": "Kitaba göre vekâlet teorisinin temelleri Max Weber'in 1920 tarihli Ekonomi ve Toplum eserine dayanır; Cressey hile üçgeniyle ilgilidir."}, {"q": "IFAC ve AICPA'ya göre denetimin amacı hangisidir?", "o": ["Tüm hata ve hileleri ortaya çıkarmak", "Hedef kullanıcıların finansal tablolara duyduğu güven seviyesini artırmak", "İşletmenin gelecekteki kârlılığını garanti etmek", "Yönetimin etkinliğini ölçmek", "Vergi matrahını doğrulamak"], "a": 1, "e": "IFAC ve AICPA tanım yerine amacı belirtir: kullanıcıların tablolara güvenini artırmak; bu, tabloların çerçeveye uygunluğuna dair görüşle sağlanır."}, {"q": "Vergi otoritelerinin gelir vergisi beyannamelerini incelemesi hangi denetim türüne örnektir?", "o": ["Finansal tablo denetimi", "Özel bağımsız denetim", "Faaliyet denetimi", "Bağımsız denetim", "Uygunluk denetimi"], "a": 4, "e": "Uygunluk denetimi, daha yüksek bir otoritenin koyduğu kural ve düzenlemelere uyumun denetlenmesidir; vergi beyannamesi denetimi bunun örneğidir."}, {"q": "Subjektif yargı gerektirdiği için denetimden çok yönetim danışmanlığına benzetilen ve genel kabul görmüş ölçütleri bulunmayan denetim türü hangisidir?", "o": ["Uygunluk denetimi", "Finansal tablo denetimi", "Faaliyet denetimi", "Kamu denetimi", "Sınırlı denetim"], "a": 2, "e": "Faaliyet denetimi yöntemlerin etkinlik ve verimliliğini değerlendirir; bu kavramlar için GKGMİ veya yasal kural yoktur."}, {"q": "Denetim standartlarına ilişkin hangisi yanlıştır?", "o": ["Denetim çalışmalarını ayrıntılı biçimde kısıtlayan bağlayıcı prosedürlerdir", "Denetçi için yol göstericidir", "Denetim faaliyetinin kalitesinin değerlendirilmesinde ölçüt olarak kullanılır", "Denetçinin niteliklerini ve sorumluluklarını genel düzeyde belirleyen asgari kurallardır", "Uluslararası düzeyde denetim yapılmasına yardımcı olur"], "a": 0, "e": "Denetim standartları kısıtlayıcı değil, yalnızca yol göstericidir; içerik ve kapsam denetçinin takdirine bırakılmıştır."}, {"q": "Uluslararası Denetim Standartlarından hangisi kilit denetim konularının denetçi raporunda bildirilmesini düzenler?", "o": ["UDS 700", "UDS 720", "UDS 705", "UDS 706", "UDS 701"], "a": 4, "e": "UDS 701 kilit denetim konularını; 700 görüş oluşturmayı, 705 görüşün değişikliğe uğramasını, 706 dikkat çekilecek hususları düzenler."}, {"q": "Geleneksel denetim yaklaşımının aşamaları doğru sırayla hangisidir?", "o": ["Kanıt toplama – planlama – raporlama – değerlendirme", "Planlama – kanıt toplama – kanıt değerlendirme – raporlama", "Risk değerlendirme – riske karşılık verme – raporlama", "Planlama – raporlama – kanıt toplama – değerlendirme", "Sözleşme – önemlilik – iç kontrol – rapor"], "a": 1, "e": "Geleneksel yaklaşım planlama, kanıt toplama, kanıt değerlendirme ve raporlama olmak üzere dört aşamalıdır; üç aşamalı olan risk tabanlı yaklaşımdır.", "k": 1}, {"q": "Denetim sürecinde bir uzmanın çalışmasından yararlanılmasına ilişkin hangisi doğrudur?", "o": ["Uzman kullanmak denetçinin sorumluluğunu değiştirmez; uzman raporu görüşü değiştirmedikçe raporda referans gösterilmez", "Uzman her durumda denetim raporunda referans olarak gösterilir", "Uzman kullanılırsa denetçinin sorumluluğu uzmana geçer", "Uzmanın işletmeyle ilişkisi incelenmez", "Uzman yalnızca hukuki konularda atanabilir"], "a": 0, "e": "Kitaba göre uzmanın yer alması denetçinin sorumluluğunu değiştirmez; görüş değişmedikçe uzman raporda referans gösterilmez."}, {"q": "Kabul edilebilir denetim riski %5, doğal risk %100 ve kontrol riski %50 olarak değerlendirilmiştir. Denetim riski modeline göre planlanan tespit riski kaçtır?", "o": ["%2,5", "%5", "%20", "%10", "%50"], "a": 3, "e": "PDR = AAR / (IR × CR) = 0,05 / (1,00 × 0,50) = 0,10 yani %10."}, {"q": "Bir denetçi kabul edilebilir denetim riskini %4, doğal riski %80 ve kontrol riskini %25 olarak belirlemiştir. Planlanan tespit riski kaçtır?", "o": ["%0,8", "%20", "%10", "%5", "%32"], "a": 1, "e": "PDR = 0,04 / (0,80 × 0,25) = 0,04 / 0,20 = 0,20 yani %20."}, {"q": "Kabul edilebilir denetim riski %5, kontrol riski %50 ve hedeflenen planlanan tespit riski %20 ise modele göre doğal risk kaç olarak değerlendirilmiştir?", "o": ["%50", "%25", "%10", "%75", "%100"], "a": 0, "e": "IR = AAR / (CR × PDR) = 0,05 / (0,50 × 0,20) = 0,50 yani %50."}, {"q": "Bir işletmede iç kontrol sisteminin güçlendirilmesi sonucu kontrol riski düşerse, diğer unsurlar sabitken ne olur?", "o": ["Planlanan tespit riski düşer, daha fazla kanıt gerekir", "Kabul edilebilir denetim riski düşer", "Doğal risk artar", "Planlanan tespit riski artar, gerekli kanıt miktarı azalır", "Hiçbir değişiklik olmaz"], "a": 3, "e": "Etkin iç kontrol kontrol riskini düşürür, planlanan tespit riskini artırır ve gerekli kanıt tutarını azaltır."}, {"q": "Denetim riski modelindeki ilişkilere göre hangisi doğrudur?", "o": ["Doğal risk ile planlanan tespit riski aynı yönde hareket eder", "Doğal risk arttıkça planlanan tespit riski düşer ve daha çok kanıt gerekir", "Kabul edilebilir denetim riski ile planlanan tespit riski ters yönde hareket eder", "Kontrol riski modelde yer almaz", "Planlanan tespit riski düştükçe daha az kanıt toplanır"], "a": 1, "e": "Doğal risk ile planlanan tespit riski ters orantılıdır; tespit riski düşük belirlenince daha fazla kanıt toplanır. Kabul edilebilir risk ise PDR ile aynı yönde çalışır."}, {"q": "Aşağıdakilerden hangisi hile üçgeninin unsurlarından biri değildir?", "o": ["Baskı veya teşvik", "Fırsat", "Davranışı makul hâle getirme", "Hiçbiri; hepsi unsurdur", "Kontrol riski"], "a": 4, "e": "Cressey'nin hile üçgeni baskı veya teşvik, fırsat ve davranışı makul gösterme unsurlarından oluşur; kontrol riski denetim riskinin bileşenidir."}, {"q": "Denetçiyi ilgilendiren iki tür kasıtlı yanlışlık hangileridir?", "o": ["Matematik hataları ve yuvarlama farkları", "Tahmin değişiklikleri ve politika değişiklikleri", "Hileli finansal raporlama ve varlıkların kötüye kullanılması", "Kur farkları ve enflasyon farkları", "Kontrol riski ve tespit riski"], "a": 2, "e": "BDS 240'a göre denetçiyi ilgilendiren kasıtlı yanlışlıklar hileli finansal raporlama ile varlıkların kötüye kullanılmasıdır."}, {"q": "Doğal risk açısından kasa hesabı ile stoklar hesabı karşılaştırıldığında kitaba göre hangisi doğrudur?", "o": ["Stoklar her zaman daha risklidir", "Kasa hesabı yanlışlık yapılmasına veya hatanın gizlenmesine daha açık olduğundan doğal riski daha yüksektir", "İkisinin doğal riski eşittir", "Doğal risk hesap türünden etkilenmez", "Kasa hesabı yalnızca kontrol riski taşır"], "a": 1, "e": "Kasa hesabı yanlışlığa ve hatanın gizlenmesine daha açıktır; bu nedenle doğal risk faktörleri stoklara göre yüksek belirlenir."}, {"q": "Bir denetçi önemlilik düzeyini net satışların %1'i olarak belirlemektedir. Net satışları 200 milyon TL olan işletmede tespit edilen 1,8 milyon TL'lik tek bir yanlışlık için hangisi doğrudur?", "o": ["Önemlilik 20 milyon TL olduğundan yanlışlık önemsizdir", "Önemlilik hesaplanamaz", "Önemlilik 200 bin TL olduğundan yanlışlık önemlidir", "Önemlilik 1,8 milyon TL'dir", "Önemlilik 2 milyon TL'dir; yanlışlık tek başına bu düzeyin altındadır ancak diğer yanlışlıklarla toplu değerlendirilmelidir"], "a": 4, "e": "200 milyon × %1 = 2 milyon TL. 1,8 milyon tek başına altında kalsa da düzeltilmemiş yanlışlıklar toplu olarak da dikkate alınır; performans önemliliği bunun için belirlenir."}, {"q": "Denetçi önemliliği faaliyet kârının %5'i olarak belirlemiştir. Faaliyet kârı 30 milyon TL ise önemlilik düzeyi kaçtır?", "o": ["150 bin TL", "300 bin TL", "1,5 milyon TL", "3 milyon TL", "6 milyon TL"], "a": 2, "e": "30 milyon × %5 = 1,5 milyon TL."}, {"q": "Genel önemlilik düzeyinin altında belirlenen ve münferit olarak önemsiz yanlışlıkların toplamının önemliliği aşma ihtimalini düşürmeyi amaçlayan kavram hangisidir?", "o": ["Performans önemliliği", "Kabul edilebilir denetim riski", "Tespit riski", "Makul güvence", "Yaygınlık"], "a": 0, "e": "Performans önemliliği, düzeltilmemiş ve tespit edilmemiş yanlışlıkların toplamının önemliliği aşma ihtimalini uygun düşük seviyeye indirmek için genel önemliliğin altında belirlenir."}, {"q": "Önemlilik düzeyi ile toplanacak denetim kanıtı miktarı arasındaki ilişki hangisidir?", "o": ["Aynı yönlü; önemlilik düştükçe kanıt azalır", "Yalnızca hesap kalanı düzeyinde ilişkilidir", "İlişki yoktur", "Zıt yönlü; önemlilik eşiği düştükçe daha çok kanıt toplanır", "Önemlilik arttıkça kanıt artar"], "a": 3, "e": "Önemlilik ile kesinlik ve kabul edilebilir risk zıt, risk ile kanıt aynı yönlü olduğundan önemlilik ile kanıt miktarı zıt yönlüdür."}, {"q": "BDS 315.06'ya göre aşağıdakilerden hangisi risk değerlendirme prosedürleri arasında sayılmaz?", "o": ["Yönetim ve ilgili kişilerin sorgulanması", "Analitik prosedürler", "Dış kaynaktan doğrulama ile maddi doğrulama testleri", "Gözlem ve tetkik", "Hiçbiri; hepsi sayılır"], "a": 2, "e": "Risk değerlendirme prosedürleri sorgulama, analitik prosedürler ile gözlem ve tetkiktir; maddi doğrulama riske karşılık verme aşamasındadır."}, {"q": "Denetim kanıtının yeterliliği ve uygunluğu ile ilgili hangisi doğrudur?", "o": ["Yeterlilik miktarın, uygunluk kalitenin ölçüsüdür; daha fazla kanıt düşük kaliteyi telafi etmeyebilir", "Daha fazla kanıt toplamak her zaman düşük kaliteyi telafi eder", "Yeterlilik kanıtın kalitesini, uygunluk miktarını ifade eder", "Risk arttıkça daha az kanıt gerekir", "Kanıtın kalitesi arttıkça daha çok kanıt gerekir"], "a": 0, "e": "BDS 500.A4: yeterlilik miktar, uygunluk kalitedir; risk arttıkça daha çok, kalite arttıkça daha az kanıt gerekebilir; miktar kaliteyi telafi etmeyebilir."}, {"q": "Stok sayımının test edilmesi aşağıdaki amaçlardan hangisi için ilgili bir kanıt değildir?", "o": ["Stok miktarının belirlenmesi", "Stokların fiziksel varlığının tespiti", "Sayım farklarının tespiti", "Stokların mülkiyetinin işletmeye ait olup olmadığının ve maliyetinin belirlenmesi", "Stok miktar kayıtlarının doğrulanması"], "a": 3, "e": "Kanıtın ilgili olması ilkesine göre stok sayımı miktar için ilgilidir; mülkiyet ve maliyet için ilgili kanıt değildir."}, {"q": "Yeterli ve uygun kanıt elde eden denetçi, yanlışlıkların finansal tablolar için hem önemli hem de yaygın olduğu sonucuna varırsa hangi görüşü verir?", "o": ["Olumlu görüş", "Olumsuz görüş", "Sınırlı olumlu görüş", "Görüş vermekten kaçınma", "Açıklayıcı ifadeli olumlu görüş"], "a": 1, "e": "BDS 705/8: kanıt elde edilmiş, yanlışlıklar önemli ve yaygınsa olumsuz görüş verilir; kanıt elde edilemeyip etkiler önemli ve yaygın olabilirse kaçınma söz konusudur."}, {"q": "Denetçinin, yönetim tarafından hazırlanan yevmiye kaydındaki satın alma işlemini fatura, alım raporu ve ödenen çek gibi destekleyici belgelerle karşılaştırarak kaydın gerçekten var olup olmadığını saptaması hangi prosedürdür?", "o": ["İz sürme", "Gözlem", "Uzlaşma sağlama", "Yeniden çalıştırma", "Teyit etme (geriye doğru iz sürme)"], "a": 4, "e": "Kayıttan destekleyici belgelere geriye doğru gidilerek işlemin varlığının saptanması teyit etmedir; belgeden kayda ileri doğru gidiş iz sürmedir."}]}, {"id": 12, "kisa": "TTK, KGK ve Yönetmelik", "baslik": "Bağımsız Denetim Düzenlemeleri I: TTK, 660 sayılı KHK ve Bağımsız Denetim Yönetmeliği", "ozet": "TTK'da denetimin kapsamı, denetçi seçimi ve görevden alma, denetçi olamama hâlleri, KGK, Yönetmelikteki tanımlar, bağımsızlık, rotasyon, ekip, sözleşme, rapor ve yaptırımlar.", "notlar": "<h3>TTK'nın denetim hükümleri<\/h3>\n<ul>\n<li><b>TTK m.397<\/b>: m.397/4 uyarınca denetime tabi AŞ'lerin ve şirketler topluluğunun tabloları, KGK'nın yayımladığı, uluslararası standartlarla uyumlu <b>Türkiye Denetim Standartları<\/b>na (TDS) göre denetlenir. YK yıllık faaliyet raporundaki finansal bilgilerin denetlenen tablolarla <b>tutarlılığı<\/b> ve gerçeği yansıtması da kapsamdadır.<\/li>\n<li>Denetime tabi olanlar, tablonun denetimden geçip geçmediğini ve denetçi görüşünü tablonun <b>başlığında<\/b> açıkça belirtir; faaliyet raporu için de aynı.<\/li>\n<li><b>Dikkat:<\/b> denetime tabi olduğu hâlde denetlettirilmemiş tablolar ve faaliyet raporu <b>düzenlenmemiş hükmündedir<\/b>.<\/li>\n<li>Rapordan sonra tablolar veya faaliyet raporu raporu etkileyecek şekilde değiştirilirse <b>yeniden denetlenir<\/b>; yeniden denetleme raporda özel olarak açıklanır, görüşe uygun ekler konur.<\/li>\n<li>Denetime tabi şirketler <b>Cumhurbaşkanınca<\/b> belirlenir (TTK m.398).<\/li>\n<li><b>Denetimin konusu:<\/b> envanter; muhasebe; TDS ölçüsünde iç denetim; <b>riskin erken saptanması komitesi raporu<\/b>; YK yıllık faaliyet raporu. TMS'ye, kanuna ve esas sözleşmenin tablolara ilişkin hükümlerine uyum da incelenir; KGK esaslarına, meslek gerekleri ve etiğe uygun, özenle yapılır.<\/li>\n<li><b>Dürüst resim ilkesi (TTK m.515):<\/b> tablolar TMS'ye göre malvarlığını, borçları, özkaynakları ve faaliyet sonuçlarını tam, anlaşılabilir, karşılaştırılabilir, ihtiyaca ve işletmenin niteliğine uygun, şeffaf ve güvenilir; gerçeği dürüst, aynen ve aslına sadık yansıtmalıdır. Denetim bunun sağlanıp sağlanmadığını, sağlanmadıysa sebeplerini belirtir.<\/li>\n<\/ul>\n<h4>Riskin erken saptanması (TTK m.378)<\/h4>\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><\/tr>\n<tr><td>Pay senetleri borsada işlem gören şirketler<\/td><td>YK uzman bir komite kurmak, sistemi çalıştırmak ve geliştirmekle <b>yükümlü<\/b>.<\/td><\/tr>\n<tr><td>Diğer şirketler<\/td><td>Denetçi gerekli görüp YK'ya <b>yazılı<\/b> bildirirse <b>derhâl<\/b> kurulur; ilk raporunu kurulmasını izleyen <b>bir ayın sonunda<\/b> verir.<\/td><\/tr>\n<tr><td>Raporlama<\/td><td>Komite YK'ya <b>her iki ayda bir<\/b> rapor verir; rapor denetçiye de gönderilir.<\/td><\/tr>\n<tr><td>Denetçinin ayrı raporu<\/td><td>Sistem ve komitenin kurulup kurulmadığını ve uygulamalarını açıklayan ayrı rapor, denetim raporuyla birlikte YK'ya sunulur; esasları KGK belirler.<\/td><\/tr>\n<\/table>\n<h4>Denetçinin seçimi, görevden alınması ve fesih<\/h4>\n<ul>\n<li>Denetçiyi şirket <b>genel kurulu<\/b>, topluluk denetçisini <b>ana şirketin genel kurulu<\/b> seçer. Seçim her faaliyet dönemi için ve her hâlde o dönem bitmeden yapılır.<\/li>\n<li>YK, seçilen denetçiyi gecikmeksizin <b>ticaret siciline tescil<\/b> ettirir, <b>TTSG<\/b> ve internet sitesinde ilan eder.<\/li>\n<li>Ana şirketin denetçisi, başka denetçi seçilmezse topluluk tablolarının da denetçisidir.<\/li>\n<li>Görev, yalnız aşağıdaki şekilde ve <b>başka denetçi atanmışsa<\/b> geri alınabilir. Şirket merkezindeki <b>asliye ticaret mahkemesi<\/b>, (a) YK'nın veya (b) sermayenin <b>%10<\/b>'unu, halka açık şirkette esas veya çıkarılmış sermayenin <b>%5<\/b>'ini oluşturan pay sahiplerinin istemiyle, denetçinin şahsına ilişkin <b>haklı sebep<\/b> (özellikle taraflılık kuşkusu) varsa başka denetçi atayabilir.<\/li>\n<li>Dava, seçimin <b>TTSG'de ilanından itibaren üç hafta<\/b> içinde açılır. Azlık için: seçime genel kurulda <b>karşı oy<\/b> vermiş, tutanağa geçirtmiş ve genel kurul tarihinden geriye <b>en az üç aydır<\/b> pay sahibi olmak şarttır.<\/li>\n<li><b>Faaliyet döneminin dördüncü ayına<\/b> kadar denetçi seçilmezse, YK'nın, YK üyesinin veya <b>herhangi bir pay sahibinin<\/b> istemiyle mahkeme atar; denetçinin reddi, feshi, kararın iptali, butlanı veya görevini yapamaması hâlinde de aynı. Mahkeme kararı <b>kesindir<\/b>.<\/li>\n<li>Kayyımlığı <b>TMSF<\/b> tarafından yürütülen şirkette dördüncü aya kadar seçim yapılmazsa denetçiyi YK teklifiyle TMSF'nin ilişkili olduğu <b>Bakan<\/b> atar; Bakan yetkisini <b>Fon Kuruluna<\/b> devredebilir.<\/li>\n<li><b>Denetçinin feshi:<\/b> yalnız <b>haklı sebep<\/b> varsa veya aleyhine görevden alma davası açılmışsa. Görüş içeriğine ilişkin fikir ayrılığı, denetimin şirketçe sınırlandırılması veya görüş vermekten kaçınma <b>haklı sebep sayılmaz<\/b>. Fesih yazılı ve gerekçeli olur; denetçi o tarihe kadarki sonuçları genel kurula sunar. YK hemen <b>geçici denetçi<\/b> seçer, feshi genel kurulun bilgisine, geçici denetçiyi onayına sunar.<\/li>\n<\/ul>\n<h4>Kimler denetçi olabilir, kimler olamaz?<\/h4>\n<ul>\n<li>Denetçi: 3568 sayılı Kanuna göre ruhsatlı <b>YMM veya SMMM<\/b> olup <b>KGK'ca yetkilendirilen<\/b> kişiler ve/veya ortakları bu kişilerden oluşan <b>sermaye şirketi<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Denetçi olamama hâli (TTK)<\/th><th>Eşik / süre<\/th><\/tr>\n<tr><td>Denetlenecek şirkette pay sahibi olmak<\/td><td>Pay oranı fark etmez<\/td><\/tr>\n<tr><td>Şirketin yöneticisi veya çalışanı olmak ya da olmuş olmak<\/td><td>Atanmadan önceki <b>üç yıl<\/b> içinde<\/td><\/tr>\n<tr><td>Bağlantılı tüzel kişi veya işletmede temsilci, YK üyesi, yönetici, sahip olmak ya da bunlarda pay sahibi olmak<\/td><td><b>%20'den fazla<\/b> pay<\/td><\/tr>\n<tr><td>Şirketin YK üyesi veya yöneticisinin alt-üst soyu, eşi veya hısmı olmak<\/td><td><b>Üçüncü derece dâhil<\/b> kan veya kayın hısmı<\/td><\/tr>\n<tr><td>Bağlantılı veya %20'den fazla paylı işletmede çalışmak; %20'den fazla paylı gerçek kişiye hizmet vermek<\/td><td><b>%20'den fazla<\/b><\/td><\/tr>\n<tr><td>Defter tutma veya tablo düzenlemeye denetim dışında katkı; bu nedenle denetçi olamayanın temsilcisi, çalışanı, ortağı olmak; denetçi olamayan bir denetçinin yanında çalışmak<\/td><td>—<\/td><\/tr>\n<tr><td>Gelir bağımlılığı<\/td><td>Son <b>beş yıl<\/b>da denetçilik gelirinin <b>%30'undan fazlası<\/b> bu şirket ve ona <b>%20'den fazla<\/b> pay ile iştirak etmiş şirketlerden elde edilmiş ve cari yılda da bekleniyorsa<\/td><\/tr>\n<\/table>\n\n<h3>660 sayılı KHK ve KGK<\/h3>\n<ul>\n<li>KHK'nın amacı, KGK'nın kuruluş, teşkilat, görev, yetki ve sorumluluklarını düzenlemek. KGK'nın yetkileri: uluslararası uyumlu TMS'yi oluşturup yayımlamak; denetimde uygulama birliği, güven ve kalite; denetim standartlarını belirlemek; bağımsız denetçi ve kuruluşları yetkilendirip denetlemek; kamu gözetimi.<\/li>\n<li>KGK: <b>kamu tüzel kişiliği<\/b> ve <b>idari özerklik<\/b>; kitapta Başbakanlıkla ilişkili olarak anılır.<\/li>\n<li><b>Kurul<\/b>: biri Başkan, biri İkinci Başkan olmak üzere <b>Cumhurbaşkanınca atanan dokuz üye<\/b>.<\/li>\n<\/ul>\n\n<h3>Bağımsız Denetim Yönetmeliği (KGK)<\/h3>\n<ul>\n<li>RG <b>26.12.2012<\/b>, 28509. TTK (6102) ve 660 sayılı KHK çerçevesinde bağımsız denetim, denetim kuruluşları ve denetçilere ilişkin usul ve esaslar.<\/li>\n<\/ul>\n<table>\n<tr><th>Tanım<\/th><th>Özü<\/th><\/tr>\n<tr><td>Bağımsız denetçi<\/td><td>YMM veya SMMM ruhsatlı meslek mensupları arasından KGK'ca yetkilendirilen kişi<\/td><\/tr>\n<tr><td>Bağımsız denetim kuruluşu<\/td><td>Ortakları YMM veya SMMM ruhsatlı olan, KGK'ca yetkilendirilen <b>sermaye şirketi<\/b><\/td><\/tr>\n<tr><td>Bağımsız denetim ekibi<\/td><td>Sorumlu denetçi ve onun sorumluluğundaki denetçiler<\/td><\/tr>\n<tr><td>Sicil<\/td><td>KGK'nın elektronik ortamda tuttuğu bağımsız denetim resmi sicili<\/td><\/tr>\n<tr><td>Denetim ağı<\/td><td>Hukuki bağ aranmaksızın kâr/maliyet paylaşımı, ortak mülkiyet-kontrol-yönetim, ortak kalite politikası, iş stratejisi, marka veya mesleki kaynak paylaşımı amaçlı yapı<\/td><\/tr>\n<tr><td>Denetimi üstlenen<\/td><td>Denetlenen işletmeyle sözleşme imzalayan kuruluş veya denetçi<\/td><\/tr>\n<tr><td>Kalite güvence sistemi / kalite kontrol sistemi<\/td><td>Güvence: <b>KGK<\/b>'nın oluşturduğu sistem. Kontrol: denetim kuruluşlarının <b>kendi bünyelerinde<\/b> kurduğu sistem.<\/td><\/tr>\n<tr><td>KAYİK<\/td><td>Halka açık şirketler, bankalar, sigorta-reasürans-emeklilik, faktoring, finansman, finansal kiralama, varlık yönetim şirketleri, emeklilik fonları, SPKn ihraççıları ve SP kurumları ve KGK'nın belirlediği diğerleri. <b>KGK 25.03.2025, 31203 sayılı kararla<\/b> BDDK'ya tabi <b>tasarruf finansman şirketleri<\/b> eklendi.<\/td><\/tr>\n<tr><td>Kilit yönetici<\/td><td>Yönetim organı üyeleri dâhil, planlama, yönetim veya kontrol yetkisi olan kişiler<\/td><\/tr>\n<tr><td>Sorumlu denetçi<\/td><td>Denetimi yürütmekten sorumlu ve raporu imzalamaya yetkili denetçi<\/td><\/tr>\n<tr><td>TDS<\/td><td>Bilgi sistemleri ve <b>sürdürülebilirlik denetimi<\/b> dâhil eğitim, etik, kalite, yönetim ve denetim standartları<\/td><\/tr>\n<tr><td>TMS (Yönetmelikte)<\/td><td>TFRS, BOBİ FRS, KÜMİ FRS ve KGK'nın diğer standartları<\/td><\/tr>\n<tr><td>Yönetim organı<\/td><td>AŞ'de YK; sermayesi paylara bölünmüş komanditte yönetici(ler); limitedde müdür(ler)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Denetim, kullanıcılara konunun kıstasa uyumu hakkında <b>makul veya sınırlı güvence<\/b> sağlar. Mevzuat veya sözleşmede sınırlı güvence açıkça belirtilmemişse <b>makul güvence<\/b> esastır. Unsurları: konu, taraflar, kıstas, kanıtlar, rapor.<\/li>\n<li>Kapsam: TTK'ya göre denetlenecek tablolar, faaliyet raporları, riskin erken saptanması sistemleri ve diğer mevzuatın öngördüğü konular.<\/li>\n<li>KGK'nın <b>Sürdürülebilirlik Denetimi Yönetmeliği<\/b> 17.01.2025 (32785) RG'de yayımlandı. <b>TSRS 1<\/b> ve <b>TSRS 2<\/b> 29/12/2023 RG'de yürürlüğe girdi; açıklamalar \"TSRS Uyumlu Sürdürülebilirlik Raporu\"nda sunulur, güvence denetimi zorunludur; 01.01.2024'ten itibaren zorunlu raporlamaya tabi şirketler aynı tarihli KGK Kararıyla açıklandı.<\/li>\n<\/ul>\n<h4>Yetkilendirme, eğitim ve sicil<\/h4>\n<ul>\n<li>Denetimi yalnız KGK'ca yetkilendirilenler yapar; yetki KGK'nın <b>ilanıyla<\/b> başlar. <b>KAYİK<\/b>'lerin ve KGK'nın belirlediği işletmelerin denetimi <b>yalnızca denetim kuruluşlarınca<\/b>; diğerleri kuruluş veya denetim üstlenen bağımsız denetçilerce.<\/li>\n<li>Uygun görülen sermaye şirketine <b>Bağımsız Denetim Kuruluşu Belgesi<\/b>, meslek mensubuna <b>Bağımsız Denetçi Belgesi<\/b> verilir. Kuruluşların devir, bölünme, birleşme ve tür değişikliği <b>KGK iznine<\/b> tabidir.<\/li>\n<li><b>Uygulamalı mesleki eğitim:<\/b> en az <b>3 yıl<\/b>. 3568 sayılı Kanun kapsamında tasdik ve vergi denetimi süreleri ile kamu denetim süreleri sayılır. <b>En az 15 yıl<\/b> mesleki tecrübesi olanlarda aranmaz.<\/li>\n<li>Sicile yetkilendirme, uyarı, idari para cezası, askıya alma, iptal ve durdurma işlenir; kamuya açıktır. Her kuruluş ve denetçiye <b>sicil numarası<\/b>. Askıya alınan, durdurulan veya faaliyette bulunmayacağını beyan eden <b>gayri faal<\/b> gösterilir; sicilde olmayan veya gayri faal olan denetim yapamaz.<\/li>\n<\/ul>\n<h4>Bağımsızlık<\/h4>\n<ul>\n<li>Denetim <b>esasen ve şeklen<\/b> bağımsız yapılır. <b>Esasta bağımsızlık:<\/b> dürüstlük, tarafsızlık ve şüphecilikle, muhakemeyi etkileyecek tesirlerden ari görüş. <b>Şekilde bağımsızlık:<\/b> makul ve bilgili üçüncü kişilerde ödün verildiği izlenimi yaratacak durumlardan kaçınma.<\/li>\n<li>Denetçi denetlenenin <b>karar alma mekanizmalarına katılamaz<\/b>. Zedelendiği kanaati oluşursa bağımsızlık ortadan kalkmış sayılır.<\/li>\n<li>Zedeleyen hâller: ortak, kilit yönetici, denetçiler ve <b>boşanmış olsalar dahi eşleri<\/b> ile <b>3. derece dâhil<\/b> kan ve kayın hısımlarının denetlenenle menfaat, ortaklık, kilit yöneticilik veya olağan dışı borç-alacak ilişkisi; geçmiş yıl ücretinin geçerli neden olmadan ödenmemesi; ücretin sonuca bağlanması, kaliteye dair belirsizlik veya diğer hizmetlere göre belirlenmesi.<\/li>\n<li>Tehditlere önlem alınır; yetmezse bağımsızlık kalkmış sayılır. Tehdit, önlem ve değerlendirmeler <b>yazılı<\/b> kayda alınıp saklanır. Bağımsızlık kalkarsa KGK'ya bildirilir ve <b>KGK onayıyla<\/b> sözleşme sonlandırılır.<\/li>\n<li>Denetlenene <b>tasdik, vergi danışmanlığı ve vergi denetimi dışında<\/b> danışmanlık veya başka hizmet verilemez; ağ ve ilişkili kuruluşlar aracılığıyla da verilemez.<\/li>\n<\/ul>\n<h4>Reklam yasağı, haksız rekabet, sürekli eğitim<\/h4>\n<ul>\n<li>Doğrudan veya dolaylı reklam yasak; unvan ve tabelada mesleki ve akademik unvan dışında unvan kullanılamaz. Serbest olanlar: kurumsal tanıtıcı broşür, eleman ilanı, bilimsel yayın, seminer, konferans, eğitim. Bunlarda: sonuç vaadi yok; ciddiyet; abartı ve yanıltma yok; somut temelsiz beklenti yok; <b>başka kuruluşla karşılaştırma yok<\/b>.<\/li>\n<li>KGK'nın izin verdiği hâller dışında, başka bir denetçiyle denetim ilişkisi süren işletmenin <b>aynı döneme<\/b> ilişkin talebi kabul edilemez.<\/li>\n<li><b>Sürekli eğitim<\/b>, sicile tescili izleyen <b>ikinci takvim yılı başından<\/b> itibaren başlar; yetkilendirme ile tescil arasında iki yıl veya fazla olanlara ilave yükümlülük getirilebilir; yıllık ve <b>üçer yıllık<\/b> dönem şartları karşılanır.<\/li>\n<\/ul>\n<h4>Denetim kısıtlamaları ve rotasyon<\/h4>\n<ul>\n<li>Üstlenilemeyecek denetimler: TTK'ya göre üstlenilemeyecekler; bağımsızlığı zedeleyenler; kadronun sayı, nitelik veya tecrübe bakımından yetersiz olduğu; KGK sözleşme kabul düzenlemelerine aykırı; mevcut iş yükü nedeniyle sağlıklı yürütülemeyecek denetimler.<\/li>\n<li><b>Rotasyon:<\/b> son <b>on yılda yedi yıl<\/b> denetimini yürüttükleri aynı işletmeyi, <b>üç yıl<\/b> geçmedikçe denetleyemezler. Süre hesabında aynı denetim ağındaki ve ilişkili kuruluşlardaki süreler <b>topluca<\/b>; denetçinin hangi kuruluşta çalıştığına bakılmaksızın aynı işletmedeki süreleri <b>birlikte<\/b> sayılır.<\/li>\n<li><b>Soğuma süresi:<\/b> denetçi görevden ayrıldıktan sonra <b>iki yıl<\/b> geçmedikçe <b>son iki yılda<\/b> denetlediği işletme ve bağlı ortaklıklarında kilit yönetici olamaz.<\/li>\n<li>Denetçi yalnız <b>bir<\/b> kuruluş veya denetim üstlenen denetçi adına çalışabilir.<\/li>\n<\/ul>\n<h4>Denetim ekibi ve unvanlar (KGK)<\/h4>\n<ul>\n<li>Ekip <b>üç denetçiden az olamaz<\/b>; sorumlu denetçi ve belirlenen kademeler için <b>en az birer yedek<\/b>. KGK farklı asgari sayılar belirleyebilir. Ekip sorumlu denetçinin gözetiminde çalışır; denetim üstlenen bağımsız denetçi kendi denetimlerinin sorumlu denetçisidir.<\/li>\n<li>Unvanlar: denetçi, kıdemli denetçi, başdenetçi. Denetçilikte <b>6 yılı<\/b> doldurmayana kıdemli denetçi, <b>10 yılı<\/b> doldurmayana başdenetçi unvanı verilemez.<\/li>\n<\/ul>\n<h4>Denetim sözleşmesi<\/h4>\n<ul>\n<li>Yazılı; asgari içerik: dayanak genel kurul veya mahkeme kararının tarih-sayısı; amaç, kapsam, dönem; konu ve kıstas; tarafların sorumlulukları; TDS'ye uygun yürütüleceği; kayıtlara <b>sınırsız erişim<\/b>; ekip üyeleri (yedekler dâhil), çalışma süreleri ve ücret dökümü; sorumlu denetçi ve yedeğinin imza yetkisi; başlangıç, bitiş ve rapor teslim tarihleri; <b>mesleki sorumluluk sigortası<\/b>; rapor tarihinden sonra ilan tarihinden önceki olaylardan haberdar etme yükümlülüğü; yalnız mevzuata göre feshedilebileceği.<\/li>\n<li>Sözleşmede denetim dışı hizmet öngörülemez; ücret başka şarta bağlanamaz.<\/li>\n<li>Sözleşme, seçimden itibaren <b>en geç 60 gün<\/b> içinde yapılır. Yazılı ihtara rağmen işletme kaçınırsa denetimi üstlenen izleyen <b>10 gün<\/b> içinde KGK'ya bildirir.<\/li>\n<li>Görev yalnız TTK m.399/4'teki şekilde ve başka denetçi atanmışsa geri alınır. Fesih haklı sebep veya görevden alma davası varsa mümkündür; fesih ve gerekçesi <b>10 gün<\/b> içinde KGK'ya yazılı bildirilir. Çalışma notları yeni denetçiye teslim edilir.<\/li>\n<\/ul>\n<h4>Rapor, şeffaflık ve yaptırımlar<\/h4>\n<table>\n<tr><th>Görüş (Yönetmelik)<\/th><th>Koşul<\/th><\/tr>\n<tr><td>Olumlu<\/td><td>Önemli uyumsuzluk veya aykırılık yok<\/td><\/tr>\n<tr><td>Sınırlı olumlu<\/td><td>Önemli uyumsuzluk var veya yeterli kanıt yok, ancak konunun <b>genelini etkilemiyor<\/b><\/td><\/tr>\n<tr><td>Olumsuz<\/td><td>Yeterli kanıt elde edildikten sonra uyumsuzluklar önemli ve konunun <b>genelini etkiliyor<\/b><\/td><\/tr>\n<tr><td>Görüş bildirmekten kaçınma<\/td><td>Genelini etkileyen konularda yeterli kanıt yok ya da kanıta rağmen görüşü engelleyen belirsizlikler sonradan çıktı<\/td><\/tr>\n<\/table>\n<ul>\n<li>TTK denetimlerinde rapor, ilgili olağan genel kuruldan <b>en az 20 gün önce<\/b> ve her durumda TTK'daki azami sürenin sonuna kadar yönetim organına teslim edilir.<\/li>\n<li><b>Şeffaflık raporu:<\/b> bir takvim yılında <b>KAYİK<\/b> denetimi yapan kuruluşlar, takvim yılını (özel hesap döneminde dönem kapanışını) izleyen <b>dördüncü ayın sonuna<\/b> kadar KGK'ya bildirir ve sitesinde yayımlar; orijinal ve güncellenmiş hâlleri <b>beş yıl<\/b> erişime açık tutulur.<\/li>\n<li><b>İdari yaptırımlar<\/b> (Kurul kararıyla): <b>uyarı<\/b>, <b>faaliyet iznini askıya alma<\/b>, <b>faaliyet iznini iptal<\/b>. Ayrıca 660 sayılı KHK m.26/3 uyarınca <b>idari para cezası<\/b>; diğer yaptırımlar para cezasına engel değildir.<\/li>\n<li>TDS'ye aykırı veya yanlış, eksik, yanıltıcı rapordan doğan zararlardan kuruluş ve denetçiler <b>ayrı ayrı<\/b> sorumludur. Yaptırımlar kuruluş ve denetim üstlenen denetçilere uygulanır; gerekirse ekipteki denetçilere de. Denetçi olmayan yardımcıların aykırılıklarından idari yaptırım bakımından <b>gözetimindeki kuruluş veya denetçi<\/b> sorumludur.<\/li>\n<\/ul>", "sorular": [{"q": "TTK'ya göre denetime tabi olduğu hâlde denetlettirilmemiş finansal tablolar ve yıllık faaliyet raporu için hangisi doğrudur?", "o": ["Düzenlenmemiş hükmündedir", "Geçerlidir, yalnızca idari para cezası uygulanır", "Genel kurul onayıyla geçerli olur", "Bir sonraki yıl denetlenerek geçerli hâle gelir", "Yalnızca vergi açısından geçersizdir"], "a": 0, "e": "TTK m.397'ye göre denetime tabi olduğu hâlde denetlettirilmemiş tablolar ve faaliyet raporu düzenlenmemiş hükmündedir."}, {"q": "TTK'ya göre aşağıdakilerden hangisi şirketin finansal tabloları ile YK yıllık faaliyet raporunun denetimi kapsamında sayılmamıştır?", "o": ["Envanter", "Muhasebe", "Riskin erken saptanması komitesi raporu", "Yönetim kurulu üyelerinin ücret pazarlıkları", "TDS'nin öngördüğü ölçüde iç denetim"], "a": 3, "e": "Denetim envanter, muhasebe, TDS ölçüsünde iç denetim, riskin erken saptanması komitesi raporu ve YK faaliyet raporunu kapsar."}, {"q": "Pay senetleri borsada işlem görmeyen bir şirkette riskin erken saptanması komitesi hangi durumda kurulur ve ilk raporunu ne zaman verir?", "o": ["Her durumda kurulur; ilk raporunu üç ay içinde verir", "Denetçi gerekli görüp YK'ya yazılı bildirirse derhâl kurulur; ilk raporunu kurulmasını izleyen bir ayın sonunda verir", "Genel kurul kararıyla kurulur; ilk raporunu yıl sonunda verir", "Hiçbir zaman kurulmaz", "SPK talep ederse kurulur; ilk raporunu iki ayda verir"], "a": 1, "e": "Borsa dışı şirketlerde komite denetçinin yazılı bildirimi üzerine derhâl kurulur ve ilk raporunu kurulmasını izleyen bir ayın sonunda verir."}, {"q": "Riskin erken saptanması komitesi yönetim kuruluna hangi sıklıkla rapor verir?", "o": ["Her ay", "Yılda bir", "Üç ayda bir", "Altı ayda bir", "Her iki ayda bir"], "a": 4, "e": "Komite YK'ya her iki ayda bir vereceği raporda durumu değerlendirir; rapor denetçiye de gönderilir."}, {"q": "Çıkarılmış sermayesi 80 milyon TL olan halka açık bir şirkette, seçilmiş denetçinin taraflı davrandığı kuşkusuyla mahkemeden başka denetçi atanmasını isteyebilmek için pay sahiplerinin en az ne kadar sermayeyi temsil etmesi gerekir?", "o": ["800 bin TL", "8 milyon TL", "4 milyon TL", "16 milyon TL", "40 milyon TL"], "a": 2, "e": "Halka açık şirketlerde esas veya çıkarılmış sermayenin %5'i aranır: 80 milyon × %5 = 4 milyon TL. Halka açık olmayanlarda oran %10'dur."}, {"q": "TTK'ya göre denetçinin görevden alınması ve yeni denetçi atanması davası ne zaman açılmalıdır?", "o": ["Genel kurul tarihinden itibaren 1 ay içinde", "Seçimin TTSG'de ilanından itibaren üç hafta içinde", "Faaliyet döneminin sonuna kadar", "Seçimden itibaren 60 gün içinde", "Denetim raporunun tesliminden itibaren 15 gün içinde"], "a": 1, "e": "Dava, denetçinin seçiminin Türkiye Ticaret Sicili Gazetesinde ilanından itibaren üç hafta içinde açılır."}, {"q": "Azlığın denetçinin görevden alınması davasını açabilmesi için aşağıdakilerden hangisi şart değildir?", "o": ["Seçime genel kurulda karşı oy vermiş olmak", "Karşı oyunu tutanağa geçirtmiş olmak", "Genel kurul tarihinden geriye en az üç aydır pay sahibi olmak", "Halka açık şirkette çıkarılmış sermayenin en az %5'ini temsil etmek", "Denetçiyle önceden yazılı uyuşmazlık yaşamış olmak"], "a": 4, "e": "Karşı oy, tutanağa geçirme, en az üç aylık pay sahipliği ve sermaye oranı şarttır; önceden yazılı uyuşmazlık aranmaz."}, {"q": "Faaliyet döneminin dördüncü ayına kadar denetçi seçilemeyen bir şirkette denetçiyi kim atar?", "o": ["Yönetim kurulu doğrudan", "KGK", "Herhangi bir pay sahibinin, YK'nın veya YK üyesinin istemi üzerine şirket merkezindeki asliye ticaret mahkemesi", "Ticaret Bakanlığı", "SPK"], "a": 2, "e": "Dördüncü aya kadar seçim yapılmazsa YK'nın, YK üyesinin veya herhangi bir pay sahibinin istemiyle mahkeme atar; karar kesindir. Kayyımlığı TMSF'de olan şirketlerde Bakan atar."}, {"q": "Aşağıdakilerden hangisi TTK'ya göre denetçinin denetim sözleşmesini feshetmesi için haklı sebep sayılmaz?", "o": ["Görüş yazısının içeriğine ilişkin fikir ayrılıkları", "Denetçinin sağlık durumu nedeniyle görevini yapamaması", "Denetçiye karşı görevden alınma davası açılmış olması", "Şirketin denetçinin bağımsızlığını zedeleyen bir ilişki kurması", "Şirketin denetçiyi yanıltan belgeler sunması"], "a": 0, "e": "Görüş yazısının içeriğine ilişkin fikir ayrılıkları, denetimin şirketçe sınırlandırılması veya görüş vermekten kaçınma haklı sebep sayılmaz."}, {"q": "Bir SMMM, son beş yılda denetçilik faaliyetinden toplam 10 milyon TL gelir elde etmiş; bunun 3,5 milyon TL'si X A.Ş. ve X'e %25 pay ile iştirak etmiş şirketlere verdiği denetim ve danışmanlık hizmetlerinden gelmiştir. Cari yılda da benzer gelir beklenmektedir. TTK'ya göre durumu nedir?", "o": ["Yalnızca son bir yıla bakılır", "Oran %35 olup %50'nin altında olduğu için denetçi olabilir", "İştirak payı %20'yi aşmadığı için dikkate alınmaz", "Oran %35 olup %30'u aştığı için X A.Ş.'nin denetçisi olamaz", "Gelir sınırı yalnızca bağımsız denetim kuruluşları için geçerlidir"], "a": 3, "e": "Son beş yılda denetçilik gelirinin %30'undan fazlası denetlenecek şirket ve ona %20'den fazla pay ile iştirak etmiş şirketlerden elde edilmişse denetçi olunamaz: 3,5 / 10 = %35."}, {"q": "TTK'ya göre aşağıdakilerden hangisi tek başına denetçi olmaya engel değildir?", "o": ["Denetlenecek şirkette pay sahibi olmak", "Atanmadan önceki üç yıl içinde şirketin çalışanı olmuş olmak", "Atanmasından beş yıl önce şirketten ayrılmış eski bir çalışan olmak", "Şirketin defterlerinin tutulmasına denetim dışında katkıda bulunmuş olmak", "Şirketin bir YK üyesinin üçüncü derece kayın hısmı olmak"], "a": 2, "e": "Çalışanlık engeli atanmadan önceki üç yıl içindir; beş yıl önce ayrılmış olmak engel değildir."}, {"q": "KGK Kurulu kaç üyeden oluşur ve üyeleri kim atar?", "o": ["Dokuz üye; Cumhurbaşkanı", "Yedi üye; Bakanlar Kurulu", "Dokuz üye; TBMM", "On bir üye; Cumhurbaşkanı", "Beş üye; Hazine ve Maliye Bakanı"], "a": 0, "e": "Kurul, biri Başkan ve biri İkinci Başkan olmak üzere Cumhurbaşkanınca atanan dokuz üyeden oluşur."}, {"q": "Bağımsız Denetim Yönetmeliğine göre kamu yararını ilgilendiren kuruluşların (KAYİK) denetimini kimler yapabilir?", "o": ["Yalnızca KGK denetçileri", "Denetim kuruluşları veya denetim üstlenen bağımsız denetçiler", "Yalnızca YMM'ler", "Yalnızca denetim kuruluşları", "SPK'nın izin verdiği herkes"], "a": 3, "e": "KAYİK'lerin ve KGK'nın belirlediği işletmelerin denetimi yalnızca denetim kuruluşlarınca, diğerlerinin denetimi kuruluşlar veya denetim üstlenen bağımsız denetçilerce yapılır."}, {"q": "KGK'nın 25.03.2025 tarihli kararıyla KAYİK kapsamına alınan kuruluşlar hangileridir?", "o": ["Varlık kiralama şirketleri", "BDDK'nın düzenleme ve denetimine tabi tasarruf finansman şirketleri", "Kooperatifler", "Belediye şirketleri", "Lisanslı depo işletmeleri"], "a": 1, "e": "KGK'nın 25.03.2025 tarih ve 31203 sayılı kararıyla BDDK'ya tabi tasarruf finansman şirketleri KAYİK kapsamına alınmıştır."}, {"q": "Bağımsız denetçi olmak isteyenlerin uygulamalı mesleki eğitim süresi ve bu şartın aranmadığı tecrübe süresi hangisidir?", "o": ["2 yıl; 10 yıl", "5 yıl; 15 yıl", "4 yıl; 20 yıl", "3 yıl; 10 yıl", "3 yıl; 15 yıl"], "a": 4, "e": "En az 3 yıl uygulamalı eğitim şarttır; en az on beş yıl mesleki tecrübesi olanlarda aranmaz."}, {"q": "Bağımsız Denetim Yönetmeliğine göre denetim kuruluşları denetlediği işletmeye aşağıdaki hizmetlerden hangisini verebilir?", "o": ["Yönetim danışmanlığı", "İnsan kaynakları hizmeti", "Değerleme hizmeti", "3568 sayılı Kanun çerçevesinde tasdik, vergi danışmanlığı ve vergi denetimi", "İç denetim hizmeti"], "a": 3, "e": "Denetlenen işletmeye tasdik, vergi danışmanlığı ve vergi denetimi dışında danışmanlık veya başka hizmet verilemez."}, {"q": "Bir denetçi X A.Ş.'nin denetimini 2020–2026 yılları arasında kesintisiz yedi yıl yürütmüştür. Yönetmelikteki rotasyon kuralına göre aynı işletmenin denetiminde en erken hangi yılın denetiminde yeniden görev alabilir?", "o": ["2027", "2030", "2029", "2028", "2031"], "a": 1, "e": "Son on yılda yedi yıl denetim yürütülen işletme üç yıl geçmedikçe denetlenemez: 2027, 2028 ve 2029 bekleme yılıdır; en erken 2030 denetimi."}, {"q": "Rotasyon süresinin hesabına ilişkin hangisi doğrudur?", "o": ["Yalnızca aynı kuruluşta geçen süreler sayılır", "Ara verilen yıllar süreyi sıfırlar", "Kuruluş değiştiren denetçinin süresi sıfırlanır", "Yalnızca sorumlu denetçinin süresi sayılır", "Aynı denetim ağındaki ve ilişkili kuruluşlardaki süreler topluca dikkate alınır; denetçinin hangi kuruluşta çalıştığına bakılmaksızın aynı işletmedeki süreleri birlikte sayılır"], "a": 4, "e": "Ağ ve ilişkili kuruluşlardaki süreler topluca; denetçinin aynı işletmedeki süreleri kuruluşa bakılmaksızın birlikte dikkate alınır."}, {"q": "Bir denetçi denetçilik görevinden ayrıldıktan sonra son iki yılda denetlediği işletmede kilit yönetici olarak en erken ne zaman görev alabilir?", "o": ["Hemen", "Ayrılıştan 1 yıl sonra", "Ayrılıştan 2 yıl sonra", "Ayrılıştan 3 yıl sonra", "Ayrılıştan 5 yıl sonra"], "a": 2, "e": "Denetçiler ayrıldıktan itibaren iki yıl geçmedikçe son iki yılda denetledikleri işletme ve bağlı ortaklıklarında kilit yönetici olamaz."}, {"q": "Bağımsız Denetim Yönetmeliğine göre denetim ekipleri ve unvanlar için hangisi doğrudur?", "o": ["Ekip üç denetçiden az olamaz; denetçilikte 6 yılı doldurmayana kıdemli denetçi, 10 yılı doldurmayana başdenetçi unvanı verilemez", "Ekip en az iki denetçiden oluşur", "Yedek denetçi belirlenmesi ihtiyaridir", "Kıdemli denetçi için 3 yıl yeterlidir", "Başdenetçi unvanı için 15 yıl gerekir"], "a": 0, "e": "Ekip en az üç denetçidir ve kademeler için yedek belirlenir; kıdemli denetçi için 6, başdenetçi için 10 yıl şarttır."}, {"q": "Denetim kuruluşu 15 Mart'ta TTK uyarınca denetçi olarak seçilmiştir. Yönetmeliğe göre denetim sözleşmesi en geç hangi tarihte imzalanmalıdır?", "o": ["14 Nisan", "30 Nisan", "Faaliyet döneminin sonu", "15 Haziran", "14 Mayıs"], "a": 4, "e": "Sözleşme seçimden itibaren en geç 60 gün içinde yapılır: 15 Mart + 60 gün = 14 Mayıs. İşletme kaçınırsa 10 gün içinde KGK'ya bildirilir."}, {"q": "Olağan genel kurulunu 30 Mayıs'ta yapacak bir şirketin TTK uyarınca yapılan denetimine ait denetim raporu, Yönetmeliğe göre en geç hangi tarihte yönetim organına teslim edilmelidir?", "o": ["30 Nisan", "15 Mayıs", "10 Mayıs", "20 Mayıs", "29 Mayıs"], "a": 2, "e": "Rapor olağan genel kuruldan en az 20 gün önce teslim edilir: 30 Mayıs − 20 gün = 10 Mayıs."}, {"q": "Yönetmeliğe göre denetim konusunda önemli uyumsuzluklar bulunduğu ancak bunların denetim konusunun genelini etkilemediği durumda hangi görüş verilir?", "o": ["Sınırlı olumlu görüş", "Olumlu görüş", "Olumsuz görüş", "Görüş bildirmekten kaçınma", "Şartsız görüş"], "a": 0, "e": "Önemli uyumsuzluk var veya yeterli kanıt yok, ama konunun genelini etkilemiyorsa sınırlı olumlu görüş verilir."}, {"q": "Bir takvim yılında KAYİK denetimi yapmış denetim kuruluşu yıllık şeffaflık raporunu ne zamana kadar yayımlar ve rapor ne kadar süre erişime açık tutulur?", "o": ["Takvim yılını izleyen ikinci ayın sonu; 3 yıl", "Takvim yılı sonu; 10 yıl", "Takvim yılını izleyen altıncı ayın sonu; 5 yıl", "Takvim yılını izleyen dördüncü ayın sonu; 5 yıl", "Takvim yılını izleyen üçüncü ayın sonu; 2 yıl"], "a": 3, "e": "Şeffaflık raporu izleyen dördüncü ayın sonuna kadar KGK'ya bildirilip yayımlanır; orijinal ve güncellenmiş hâlleri beş yıl açık tutulur."}, {"q": "Bağımsız Denetim Yönetmeliğinde Kurul kararıyla uygulanabilecek idari yaptırımlar arasında aşağıdakilerden hangisi sayılmamıştır?", "o": ["Uyarı", "Hapis cezası", "Faaliyet iznini iptal etme", "Faaliyet iznini askıya alma", "Bunlara ek olarak 660 sayılı KHK m.26/3 uyarınca idari para cezası"], "a": 1, "e": "Yaptırımlar uyarı, askıya alma ve iptaldir; ayrıca idari para cezası verilebilir. Hapis cezası idari yaptırım değildir."}]}, {"id": 13, "kisa": "SPK Denetim Tebliği ve CK", "baslik": "Bağımsız Denetim Düzenlemeleri II: SPK Seri:X No:22 Tebliği ve Denetime Tabi Şirketler (2022/6434 sayılı CK ve Usul Esaslar)", "ozet": "SPK'nın denetim tebliğinde kapsam, makul güvence, risk unsurları, unvanlar, etik ilkeler, raporlar ve yaptırımlar; denetime tabi şirket eşikleri, listeler ve hesaplama esasları.", "notlar": "<h3>SPK Seri:X No:22 Tebliği: kapsam<\/h3>\n<ul>\n<li>Sermaye piyasasında bağımsız denetimin nasıl yapılacağını belirler; Kurulca yetkilendirilecek kuruluş ve denetçilere ilişkin standart, ilke, usul ve esasları düzenler. Türkiye Denetim Standartlarını artık <b>KGK<\/b> yayımlıyor; Tebliğin SPKn kapsamındaki denetim yükümlülüklerine ilişkin genel esas bölümleri yürürlüktedir.<\/li>\n<li>Denetlenecek işletmeler: ortaklıklar ve SP kurumları (araçları borsada işlem görenler dâhil) ile konsolidasyona dâhil bağlı ortaklık, müşterek yönetime tabi teşebbüs ve iştirakler.<\/li>\n<li><b>Yıllık raporlarını denetletmek zorunda olanlar:<\/b> TTK m.397/4 uyarınca Cumhurbaşkanınca belirlenen işletmeler ile <b>yatırım fonları<\/b> ve <b>konut ve varlık finansmanı fonları<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Altı aylık ara dönem tabloları incelemeye (sınırlı denetime) tabi<\/th><th>Tabi değil<\/th><\/tr>\n<tr><td>Yatırım kuruluşları; <b>yatırım fonları hariç<\/b> kolektif yatırım kuruluşları; ipotek finansmanı kuruluşları; araçları borsada işlem gören AŞ'ler<\/td><td>Payları <b>PÖİP<\/b>'te işlem görenler<\/td><\/tr>\n<\/table>\n<ul>\n<li>Borsa şirketlerinin halka arzında (veya mevcut payların hissedarlarca halka arzında) kayda alma düzenlemelerinin öngördüğü ara dönem tabloları da sınırlı denetime tabidir.<\/li>\n<li><b>Özel bağımsız denetim:<\/b> halka arz başvurusu ya da birleşme, bölünme, devir ve tasfiye durumunda, bu amaçla <b>herhangi bir tarih<\/b> itibarıyla düzenlenmiş tabloların denetimi. Tablolar denetimin başladığı <b>ay sonu veya sonrası<\/b> itibarıyla hazırlanmış olmalı; denetim, sözleşmenin <b>imzalandığı tarihte<\/b> başlamış sayılır. Önceki yıllarda süre nedeniyle uygulanamayan teknikler varsa önemlilik kavramı gözetilerek görüş oluşturulur.<\/li>\n<\/ul>\n\n<h3>Amaç ve genel ilkeler<\/h3>\n<ul>\n<li><b>Amaç:<\/b> tabloların finansal durumu ve sonuçları tüm önemli yönleriyle gerçeğe uygun ve doğru gösterip göstermediğine dair görüş bildirmek. <b>Dikkat:<\/b> görüş güvenilirliği artırır ama işletmenin <b>geleceği<\/b> veya yönetimin <b>etkin ve verimli<\/b> yönettiği hakkında bilgi sağladığı şeklinde yorumlanmaz.<\/li>\n<li><b>Kapsam:<\/b> amaca uygun uygulanan denetim yöntem ve teknikleri.<\/li>\n<li><b>Mesleki şüphecilik:<\/b> kanıtların geçerliliğini sorgulayıcı yaklaşımla incelemek ve yönetim açıklamalarıyla çelişip çelişmediğini değerlendirmek. Denetçi yönetimin ne dürüst olmadığı ne de kuşkusuz dürüst olduğu varsayımıyla hareket eder. <b>Dikkat:<\/b> yönetim açıklamaları tek başına yeterli ve uygun kanıt <b>sayılmaz<\/b>.<\/li>\n<li><b>Makul güvence:<\/b> tabloların bütün olarak nitelik ve nicelik bakımından önemli yanlışlık içermediği sonucuna varmak için yeterli ve uygun kanıt toplanması. <b>Mutlak güvence<\/b> mümkün olmayabilir; nedenleri: <b>örnekleme<\/b> kullanımı; yönetimin kontrolleri devre dışı bırakma veya <b>muvazaalı<\/b> işlem olasılığı gibi doğal kısıtlar; kanıtların çoğunun kesin değil <b>ikna edici<\/b> olması; denetçinin yaygın olarak <b>kendi kanaatini<\/b> kullanması; ilişkili taraf işlemleri gibi diğer ikna sınırlamaları. Bu durumda ilave teknikler kullanılır.<\/li>\n<\/ul>\n<h4>Bağımsız denetim riski (Tebliğ terminolojisi)<\/h4>\n<ul>\n<li>Ticari risklerin ortaya çıkarılması esas olarak <b>yönetimin<\/b> sorumluluğundadır; tablolara doğru yansıyıp yansımadığının açıklanmasından denetçi de sorumludur.<\/li>\n<li><b>Bağımsız denetim riski:<\/b> önemli yanlışlık varken uygun olmayan görüş verilmesi riski; önemli yanlışlık içerme riski ile tespit edememe riskinin fonksiyonudur. Kabul edilebilir düşük seviyeye indirildiğinde <b>makul güvence<\/b> elde edilmiş sayılır.<\/li>\n<li>Denetçi önemli yanlışlıklarla ilgilidir; bütün olarak önemli olmayan yanlışlıkları bulmaktan <b>sorumlu değildir<\/b>. Düzeltilmemiş yanlışlıklar münferit ve toplu değerlendirilir. Önemlilik ile risk birbiriyle ilişkilidir.<\/li>\n<\/ul>\n<table>\n<tr><th>Unsur<\/th><th>Tanım<\/th><th>Kimin riski<\/th><\/tr>\n<tr><td>Yapısal risk<\/td><td>Kontrol mekanizması yokken yönetim beyanlarının önemli yanlışlık içerme olasılığı. Karmaşık hesaplar, değerleme belirsizliği yüksek tahminler, teknolojik eskime, yetersiz işletme sermayesi, sektördeki daralma artırır.<\/td><td>İşletmenin<\/td><\/tr>\n<tr><td>Kontrol riski<\/td><td>Önemli yanlışlığın iç kontrolce zamanında engellenememe veya tespit edilip düzeltilememe olasılığı; doğal sınırlamalar nedeniyle daima bir miktar vardır.<\/td><td>İşletmenin<\/td><\/tr>\n<tr><td>Tespit edememe riski<\/td><td>Denetçinin önemli yanlışlığı ortaya çıkaramama olasılığı; <b>hiçbir zaman sıfıra indirilemez<\/b> (tüm işlemleri inceleyememe, uygun olmayan teknik, yanlış uygulama, yanlış yorum).<\/td><td>Denetçinin<\/td><\/tr>\n<\/table>\n<ul>\n<li>Yapısal ve kontrol riski denetimden <b>bağımsız<\/b> olarak ortaya çıkar; birlikte \"önemli yanlışlık içerme riski\" olarak değerlendirilmesi amaçlanır, ayrı da değerlendirilebilir; nitel veya yüzde olarak nicel ifade edilebilir. Kontrol etkinliğine dayanılıyorsa <b>kontrol testleri<\/b> yapılır.<\/li>\n<li><b>Ters orantı:<\/b> önemli yanlışlık riski ne kadar yüksekse kabul edilebilir tespit edememe riski o kadar düşük; risk düşükse kabul edilebilir tespit edememe riski yüksek.<\/li>\n<li>İyi planlama, doğru ekip seçimi ve yönlendirmesi, mesleki şüphecilik ve gözetim diğer risk faktörlerini azaltır.<\/li>\n<\/ul>\n\n<h3>Denetçilerin nitelikleri<\/h3>\n<table>\n<tr><th>Unvan (kıdem sırasıyla)<\/th><th>Asgari fiilî deneyim<\/th><\/tr>\n<tr><td>Sorumlu ortak baş denetçi<\/td><td>Kuruluşta <b>pay sahibi<\/b>, baş denetçi unvanlı; denetimi kişisel sorumluluğuyla yürütür ve <b>raporu imzalar<\/b><\/td><\/tr>\n<tr><td>Baş denetçi<\/td><td><b>10 yıl<\/b><\/td><\/tr>\n<tr><td>Kıdemli denetçi<\/td><td><b>6 yıl<\/b><\/td><\/tr>\n<tr><td>Denetçi<\/td><td><b>3 yıl<\/b><\/td><\/tr>\n<tr><td>Denetçi yardımcısı<\/td><td>— (yardımcılıkta geçen süre deneyime sayılır)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Deneyimde tam zamanlı fiilî çalışma esastır; tablo hazırlama veya denetleme yetkisiyle özel sektör veya kamuda geçen süreler de sayılır. Nitelikleri yetersiz olan süreyi doldursa da <b>terfi ettirilemez<\/b>.<\/li>\n<li><b>Mesleki yeterlik:<\/b> lisans ve sonrası eğitim + deneyim. Yeterliğini kaybeden denetçinin işine son verilir ve durum <b>en geç 6 iş günü<\/b> içinde Kurula bildirilir.<\/li>\n<li><b>Staj:<\/b> deneyimsiz ilk kez işe alınan yardımcılar için <b>en az fiilen 2 yıl<\/b>; bunun <b>4 ayı<\/b> muhasebe, denetim, finansal analiz, iç kontrol, bilgi işlem, para ve sermaye piyasası, şirketler-ticaret hukuku, kurumsal yönetim, vergi ve bankacılık eğitimi; kurslar toplam <b>200 saatten az olamaz<\/b>; sınavla değerlendirilir. Birden çok iş ve denetçi refakatinde çalışma; <b>sorumlu ortak baş denetçinin<\/b> gözetiminde planlı yürütülür.<\/li>\n<li><b>Tam zamanlılık:<\/b> denetçiler kuruluşta tam zamanlı çalışır; <b>yarı zamanlı eğitmen veya öğretim görevlisi<\/b> olmalarına engel değildir.<\/li>\n<\/ul>\n\n<h3>Etik ilkeler<\/h3>\n<ul>\n<li><b>Mesleki şüphecilik:<\/b> kanıtların geçerliliğinin sorgulayıcı anlayışla değerlendirilmesi.<\/li>\n<li><b>Bağımsızlık:<\/b> dürüst ve tarafsız yürütmeyi sağlayan davranış ve anlayışlar bütünü. Denetçi: şüphecilikle hareket eder; çıkar çatışmasından uzak kalır; etik çatışmayı en yakın amirden başlayarak üstlere, çözülemezse yasal düzenleyicilere ve Kurula taşır; müdahaleye izin vermez; görüşünü başkalarının çıkarını düşünmeden açıklar.<\/li>\n<li>Bağımsızlık tehditleri ve önlemler çalışma kâğıtlarında belgelenir, denetimden sorumlu komiteyle tartışılır; denetçi bağımsız olduğunu doğrulayan <b>yazılı beyanı<\/b> müşterinin denetim komitesine sunar.<\/li>\n<li><b>Bağımsızlığın ortadan kalktığı hâller<\/b> (tereddüt bile yeterli): ortak, yönetici, denetçi, yardımcılar ve <b>3. derece dâhil<\/b> kan ve sıhri hısımları ile eşlerinin müşteriden menfaat elde etmesi veya vaadin yazılı bildirilmemesi; müşteriyle ortaklık; müşteri ve iştiraklerinde kurucu, YK üyesi, müdür gibi görev; olağan dışı borç-alacak; geçmiş yıl ücretinin ödenmemesi; ücretin sonuca bağlanması, <b>piyasa rayicinden bariz farklı<\/b> olması veya diğer hizmetlere göre belirlenmesi.<\/li>\n<li>Son denetim raporu tarihinden itibaren <b>2 yıl<\/b> geçmedikçe denetlenen işletmede YK başkan/üyeliği, genel müdür, müdür ve yardımcılığı gibi görevler alınamaz.<\/li>\n<\/ul>\n<table>\n<tr><th>Denetlenen işletmeye aynı dönemde verilemeyecek hizmetler (bedelli/bedelsiz)<\/th><\/tr>\n<tr><td>Defter tutma; finansal bilgi sistemi kurma ve işletmecilik-muhasebe-finans danışmanlığı; değerleme, aktüerya, ekspertiz ve uygunluk raporu; iç denetim veya iç denetime destek; yönetim veya İK fonksiyonu; aracılık veya yatırım danışmanlığı; hukuki ve diğer uzmanlık danışmanlığı; tahkim ve bilirkişilik; Kurulun izin vermediği diğer alanlar.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Yurt dışı merkezli kuruluşla hukuki bağlantılı yurt içi kuruluşlar aracılığıyla da verilemez; kuruluşun hâkim veya ilişkili olduğu danışmanlık şirketi de aynı müşteriye aynı dönem için hizmet veremez. <b>İstisna:<\/b> 3568 sayılı Kanun çerçevesinde tablo ve beyannamelerin vergi mevzuatına uygunluğunu inceleme, <b>tasdik<\/b>, yazılı görüş ve rapor.<\/li>\n<li><b>Mesleki özen ve titizlik:<\/b> basiretli bir denetçinin aynı koşullarda göstereceği önem, dikkat ve gayret; asgari kıstası standartlara eksiksiz uyum.<\/li>\n<li><b>Ticaret yasağı:<\/b> mesleki faaliyet dışında ticari, sınai, zirai işle uğraşamaz (ticaret şirketlerinde YK üyeliği, genel müdürlük dâhil); başka denetim kuruluşunda ortak veya çalışan olamaz (birleşme ve yurt dışı kuruluşun katılımı hariç); meslek onuruna aykırı davranamaz.<\/li>\n<li><b>Reklam yasağı:<\/b> iş elde etmek için reklam yapılamaz, <b>iş önerilemez<\/b>; broşür, eleman ilanı, bilimsel yayın serbest (vaat, abartı, temelsiz beklenti, karşılaştırma olmadan). Denetçiler için de geçerlidir.<\/li>\n<li><b>Sır saklama:<\/b> yöneticiler, denetçiler, çalışanlar ve dışarıdan hizmet verenler sırları açıklayamaz, kullanamaz. Sır sayılmayanlar: standart ve meslek ahlakı gereği zorunlu açıklamalar; kamuyu aydınlatma için mevzuat gereği duyurular; yetkili adli veya idari inceleme ve suç durumlarında yetkililere bilgi.<\/li>\n<li><b>Haksız rekabet:<\/b> meslektaşa zarar verecek rekabet yok; özel bağımsız denetim veya Kurulun gerekli gördüğü hâller dışında başka kuruluşla ilişkisi süren işletmenin <b>aynı döneme<\/b> ilişkin talebi kabul edilemez.<\/li>\n<\/ul>\n\n<h3>Görev, yetki ve raporlar<\/h3>\n<ul>\n<li><b>Ekip:<\/b> her denetim için en az <b>3 asil + 3 yedek = 6 kişi<\/b>; denetim en az <b>3 kişilik<\/b> ekiple yapılır. Sorumlu ortak baş denetçi uygunluk konusunda <b>karar verir<\/b>; baş ve kıdemli denetçi planlama, yürütme, çalışma kâğıdı incelemesi ve müşteri görüşmelerinde sorumluluk paylaşır; denetçi programın hazırlanması gibi ayrıntılı işlerden ve yardımcıların gözetiminden sorumludur.<\/li>\n<li><b>Gözetim ve koordinasyon:<\/b> sorumlu ortak baş denetçide. Kuruluşlar kalite kontrol politikaları ve süreçleri oluşturur.<\/li>\n<li>KGK 2013'te <b>Kalite Kontrol Standardı 1<\/b>'i mevzuata almıştı; yerine <b>KYS 1<\/b> (kalite yönetimi) ve <b>KYS 2<\/b> (denetimin kalitesinin gözden geçirilmesi) geldi: ilk olarak 16.1.2023 RG, <b>31.12.2023<\/b> ve sonrası başlayan dönemlerin denetimine; BDS 220 de değişti.<\/li>\n<li><b>Denetçinin yetkileri:<\/b> genel kurula katılıp açıklama yapmak; sözleşme sona erdirilirse izleyen ilk genel kurula katılmak; tüm bilgileri müşteriden ve gerekirse diğer ilgililerden istemek.<\/li>\n<li><b>Raporların kesinleşmesi:<\/b> sorumlu ortak baş denetçinin imzasıyla. Bir örneği yetkili kişinin imzalı yazısıyla <b>en geç izleyen ilk iş günü<\/b> mesai bitimine kadar müşterinin YK başkanlığına teslim edilir; teslimi izleyen en geç ilk iş günü mesai bitimine kadar ilgili borsaya ve Kurula gönderilir.<\/li>\n<li>TTK çerçevesinde rapor, genel kuruldan <b>en az on beş gün önce<\/b> pay sahiplerinin emrine hazır bulundurulur ve genel kurulda okunur. Kuruluş, tabloların <b>aynen ilan edilip edilmediğini<\/b> izler.<\/li>\n<\/ul>\n<h4>Denetimden sorumlu komite<\/h4>\n<ul>\n<li>Payları borsada işlem gören ortaklıklar KYİ çerçevesinde <b>en az iki üyeli<\/b> komite kurar; zorunluluk yoksa işler YK'ca yürütülür.<\/li>\n<li>Muhasebe sistemi, kamuyu aydınlatma, bağımsız denetim ve iç kontrolün gözetimi; denetim kuruluşunun seçimi ve sözleşme süreci komitenin gözetiminde. Kuruluş ve hizmetler komitece belirlenip <b>genel kurul onayına<\/b> sunulmak üzere YK'ya bildirilir.<\/li>\n<li>Denetim kuruluşu önemli muhasebe konularını, alternatifleri ve önemli yazışmaları <b>derhal<\/b> komiteye yazılı bildirir. Komite şikâyet ve gizli bildirim yöntemlerini belirler; tablolara ilişkin görüşlerini YK'ya yazılı bildirir; bağımsız uzman kullanabilir (maliyeti ortaklık karşılar).<\/li>\n<li><b>En az üç ayda bir, yılda en az dört kez<\/b> toplanır; tutanak YK'ya sunulur. Komitenin görevi YK'nın TTK'dan doğan sorumluluğunu kaldırmaz.<\/li>\n<li>Tabloların denetlenmiş olması YK sorumluluğunu kaldırmaz; sorumluluk beyanı (II-14.1 m.9/1) genel müdür, sorumlu bölüm başkanı ve iş bölümü varsa sorumlu YK üyesince imzalanır.<\/li>\n<\/ul>\n<h4>Bildirimler, geçerlilik ve yaptırımlar<\/h4>\n<table>\n<tr><th>Bildirim<\/th><th>Süre<\/th><\/tr>\n<tr><td>Esas sözleşme, adres, ortak-yönetici-denetçi, sözleşmedeki ekip, yurt dışı bağlantı değişiklikleri<\/td><td><b>6 iş günü<\/b><\/td><\/tr>\n<tr><td>İmzalanan denetim sözleşmeleri<\/td><td><b>6 iş günü<\/b><\/td><\/tr>\n<tr><td>Kalite Kontrol Güvence Komitesi rapor özetleri<\/td><td>Her yıl <b>Ağustos sonu<\/b><\/td><\/tr>\n<tr><td>Kuruluşun yıllık tabloları ve gelir-gider dökümü<\/td><td>Bilanço tarihinden itibaren <b>10 hafta<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Geçersizlik:<\/b> standartlara aykırılık giderilemezse veya bağımsızlık ortadan kalkmışsa denetim <b>hiç yapılmamış sayılır<\/b>; ilan edilmişse geçersizlik aynı usulle yeniden ilan edilir. Denetçinin açık kusuru varsa duyuru masrafı dâhil zararlardan sorumlu ortak baş denetçi ve kuruluş <b>müteselsilen<\/b> sorumludur.<\/li>\n<li>Standartlara aykırılıktan doğan zararlardan kuruluş ile raporu imzalayanlar <b>müteselsilen<\/b> sorumludur; cezai sorumluluk Kanundaki özel hükümlere tabidir.<\/li>\n<li><b>Yetkinin iptali<\/b> hâlleri: kuruluş şartlarının kaybı; görev kabul kurallarına uyulmaması, sözleşmede olmayan denetçi görevlendirme, çalışma kâğıtlarının yetersizliği, uygun teknik kullanılmaması, raporlama ilkelerine uyulmaması; standartlara uyumun kanıtlanamaması; etik ilkelere uyulmaması; bildirimlerin zamanında yapılmaması; hatalı veya yanıltıcı rapor; sermaye piyasasında <b>kesintisiz 5 yıl<\/b> fiilen denetim yapılmaması.<\/li>\n<li>Etik ihlalde Kurul yalnız ilgili denetçilerin SP'de denetim yapmasını <b>2 yıldan az olmamak<\/b> üzere süreli veya süresiz yasaklayabilir; süre sonunda başvurulmazsa yasak süresiz uygulanır; süre içindeki başvurular dikkate alınmaz.<\/li>\n<\/ul>\n\n<h3>Bağımsız denetime tabi şirketler: 2022/6434 sayılı CK<\/h3>\n<ul>\n<li>Tarihçe: 2012/4213 sayılı BKK (RG 23.01.2013) → 2018/11597 sayılı BKK (RG 26/05/2018, 01/01/2018'den geçerli) → <b>29.11.2022 tarihli 6434 sayılı CK<\/b> (RG 30.11.2022 mükerrer, <b>1/1/2023<\/b>'te yürürlük). Değişiklikler: 8313 (5/4/2024), 9774 (30/4/2025), 11066 (16/3/2026) sayılı CK'ler.<\/li>\n<li>Amaç: TTK m.398 kapsamında denetime tabi şirketlere ilişkin usul ve esaslar. Şirket = TTK'daki sermaye şirketleri.<\/li>\n<li><b>(I) sayılı liste<\/b> şirketleri <b>hiçbir ölçüte bağlı olmaksızın<\/b> denetime tabidir; diğerleri üç ölçütten en az ikisinin eşiğini <b>art arda iki hesap döneminde<\/b> aşarsa <b>müteakip<\/b> dönemden itibaren tabidir.<\/li>\n<\/ul>\n<table>\n<tr><th>Grup<\/th><th>Aktif toplamı<\/th><th>Yıllık net satış<\/th><th>Çalışan<\/th><\/tr>\n<tr><td>Borsada işlem görmeyen ama SPKn'ye göre halka açık sayılan<\/td><td>30 milyon TL<\/td><td>40 milyon TL<\/td><td>50<\/td><\/tr>\n<tr><td>(II) sayılı liste şirketleri (2025 değişikliği)<\/td><td>120 milyon TL<\/td><td>150 milyon TL<\/td><td>100<\/td><\/tr>\n<tr><td>Diğer tüm şirketler (2026 değişikliği)<\/td><td><b>500 milyon TL<\/b><\/td><td><b>1 milyar TL<\/b><\/td><td><b>150<\/b><\/td><\/tr>\n<\/table>\n<table>\n<tr><th>(I) sayılı liste (ölçütsüz)<\/th><th>(II) sayılı liste (özel eşik)<\/th><\/tr>\n<tr><td>SPK'ya tabi: yatırım kuruluşları, KYK, PYŞ, ipotek finansmanı, varlık kiralama, merkezi takas, merkezi saklama, veri depolama, derecelendirme, değerleme kuruluşları; araçları borsada işlem gören veya geçerli izahname/ihraç belgesi olan AŞ'ler; halka arz edilmeden pay dışı araç ihraç eden AŞ'ler (itfa dönemi sonuna kadar). BDDK'ya tabi: bankalar, derecelendirme, finansal holding, finansal kiralama, faktoring, finansman, varlık yönetim şirketleri, bankalarda ve holdinglerde nitelikli pay sahipleri, tasarruf finansman şirketleri. Sigorta, reasürans, emeklilik. Borsa İstanbul'da izinli yetkili müesseseler ve kıymetli maden kurumları. Lisanslı depo ve umumi mağazalar. RTÜK'e tabi medya kuruluşları (en az iki hak/lisans veya internetten isteğe bağlı yayın). EPDK lisanslı ve denetim yükümlüsü şirketler. TCMB'ye tabi ödeme ve e-para kuruluşları. KİT'ler ve bağlı ortaklıkları ile %50'den fazlası KİT'lere ait doğal gaz şirketleri.<\/td><td>(1) Çağrı merkezleri hariç BTK'ya tabi şirketler; (2) gayri faal olanlar hariç TMSF iştirakleri ve TMSF'nin yönetimini devraldığı şirketler; (3) sermayesinin <b>en az %50<\/b>'si <b>belediyelere<\/b> ait şirketler.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Kapsam dışı:<\/b> (a) (I) listenin 1-8. sıraları hariç <b>Özelleştirme Kanunu<\/b>na (4046) tabi şirketler; (b) (I) liste ve (II) listenin 3. sırası hariç sermayesinin <b>en az %50<\/b>'si devlete, il özel idarelerine, kanunla kurulmuş vakıflara ve diğer kamu kurumlarına doğrudan veya dolaylı ait şirketler; (c) tasfiyesi TMSF komisyonlarınca yürütülen tasarruf finansman şirketleri.<\/li>\n<li><b>Çıkış (Karar m.5/2):<\/b> art arda iki dönemde en az iki ölçütün altında kalırsa veya <b>bir dönemde<\/b> en az iki ölçütün eşiğinin <b>%20 veya daha fazla altında<\/b> kalırsa müteakip dönemden itibaren kapsamdan çıkar.<\/li>\n<li>Aktif ve satışta son iki yılın tabloları; çalışanda son iki yılın <b>ortalaması<\/b>. Bağlı ortaklıklar ve iştiraklerle birlikte bakılır; iştirakler <b>hisse oranında<\/b>. Ara dönem sınırlı denetim yükümlülüğünü mevzuatta hüküm yoksa KGK belirler.<\/li>\n<\/ul>\n\n<h3>KGK Usul ve Esasları (6434 sayılı CK uygulaması)<\/h3>\n<ul>\n<li>İlk RG 16/1/2023 (32075, 1. mükerrer); değişiklikler 1.08.2024, 16.06.2025 ve 07.07.2026 tarihli RG'lerle (üç kez). Kitapta değişiklik ibaresi \"RG-7/5/2026-33246\" olarak da geçer. 1/1/2023'ten geçerli; yürütme <b>Kurum Başkanı<\/b>.<\/li>\n<li>Birbirini izleyen dönemlerde aşılan iki ölçütün <b>aynı olması şart değildir<\/b>. Örnek: 2024'te aktif ve çalışan, 2025'te aktif ve satış aşıldı → <b>2026<\/b> için denetime tabi.<\/li>\n<li>Eşik değişirse önceki dönemler için o dönemde geçerli eşikler kullanılır (2025'i değerlendiren şirket 2026 eşiklerini değil, 2025 için geçerli eşikleri 2023 ve 2024 verilerine uygular).<\/li>\n<li>Denetim, konsolide tablolarla birlikte <b>münferit<\/b> tabloları da kapsar. Şartları taşımayan şirket, yalnız ana ortaklığı, bağlı ortaklığı veya iştiraki denetime tabi diye denetime tabi olmaz (topluluk denetçisinin yükümlülükleri saklı).<\/li>\n<li><b>Esas alınacak tablolar (giriş testi):<\/b> vergi mevzuatına göre kamu idarelerine sunulan son iki dönemin bilanço ve gelir tablosu; yurt dışı bağlı ortaklıklarda varsa denetlenmiş UMS tabloları, yoksa tabi oldukları mevzuata göre tablolar.<\/li>\n<li><b>Aktif toplamı:<\/b> şirketin aktifi − bağlı ortaklık ve iştiraklerin kayıtlı değerleri + bağlı ortaklıkların aktifinin <b>tamamı<\/b> + iştiraklerin aktifinden <b>hisse payı<\/b>. <b>Satış:<\/b> şirketin satışı + bağlı ortaklıkların tamamı + iştiraklerin hisse payı. Grup içi işlemler: bağlı ortaklıklarla olanların tamamı, iştiraklerle olanların hisse payı elimine edilir.<\/li>\n<li>Dolaylı bağlı ortaklık ve iştirakler de sayılır (A, B'de %70; B, C'de %60 ve D'de %15 → C bağlı ortaklık, D %15 iştirak). İştirakin alt şirketleri ise dikkate alınmaz (A, B'de %40 → yalnız B iştirak; C ve D hesaba girmez). Yurt dışı bağlı ortaklık ve iştirakler de dâhildir.<\/li>\n<li><b>Çalışan sayısı:<\/b> muhtasar (ve prim hizmet) beyannamesindeki aylık çalışanların toplamı <b>÷ 12<\/b>; çıraklar ve stajyer öğrenciler <b>sayılmaz<\/b>. Ana ortaklık + bağlı ortaklıkların tamamı + iştiraklerin hisse oranı; yurt içi ve yurt dışı çalışanlar dâhil. Örnek: A 300, B (bağlı) 170, C (%20 iştirak) 162,08 → 300 + 170 + 32,42 = <b>502,42<\/b>.<\/li>\n<li><b>Yıllara yaygın inşaat:<\/b> aktifte <b>170-177<\/b> hesapları dikkate alınmaz; satışta <b>350-358<\/b> hesaplarına yalnız ilgili dönemde kaydedilen tutarlar eklenir; iş bitiminde bu hesaplardan gelir tablosuna aktarılanlar sayılmaz.<\/li>\n<li><b>Kapsamdan çıkma (Usul ve Esaslar m.10):<\/b> art arda iki dönemde en az iki ölçüt altında (ölçütlerin aynı olması şart değil) veya bir dönemde en az ikisinde <b>%20+<\/b> altında → müteakip dönemden çıkar.<\/li>\n<li><b>Kapsamdaki şirketin sonraki testleri (m.11):<\/b> <b>TMS'ye uygun<\/b> tablolar esas alınır; konsolide hazırlayan bağlı ortaklıkları tam konsolidasyon, iştirakleri özkaynak yöntemiyle. Konsolide hazırlamayanlar (ör. BOBİ FRS uygulayan orta boy) m.7'ye göre hesaplar. BOBİ FRS'yi ilk kez uygulayıp önceki yılı bu standarda göre hazırlamayan, önceki yıl satışında vergi tablolarını kullanır. Kapsamdan çıktıktan sonra yine m.6, 7 ve 9 uygulanır.<\/li>\n<li><b>Geçici m.1 (enflasyon):<\/b> 2024 testi için 2022 tabloları <b>enflasyona göre düzeltilmemiş<\/b> hâliyle; 2025 testi için 2023 aktif ve satışında genel kurulda onaylanan tablolar esas; bu kural enflasyon muhasebesi sürdükçe her dönem uygulanır.<\/li>\n<\/ul>\n<table>\n<tr><th>Örnek hesap<\/th><th>Sonuç<\/th><\/tr>\n<tr><td>A'nın aktifi 400; B (bağlı) kayıtlı değeri 60, aktifi 150; C (%30 iştirak) kayıtlı değeri 20, aktifi 100<\/td><td>400 − 60 − 20 + 150 + 30 = <b>500<\/b> (milyon TL)<\/td><\/tr>\n<tr><td>Diğer şirketler eşiğinde %20 çıkış testi<\/td><td>Aktif ≤ 400 milyon TL, satış ≤ 800 milyon TL, çalışan ≤ 120 (en az ikisinde, tek bir dönemde)<\/td><\/tr>\n<\/table>", "sorular": [{"q": "SPK Seri:X No:22 Tebliğine göre aşağıdakilerden hangisinin altı aylık ara dönem finansal tabloları incelemeye (sınırlı bağımsız denetime) tabi değildir?", "o": ["Yatırım kuruluşları", "İpotek finansmanı kuruluşları", "Yatırım fonları", "Araçları borsada işlem gören anonim ortaklıklar", "Yatırım fonları dışındaki kolektif yatırım kuruluşları"], "a": 2, "e": "İnceleme kapsamı yatırım fonları hariç kolektif yatırım kuruluşlarını sayar; PÖİP'te işlem görenler de kapsam dışıdır."}, {"q": "Özel bağımsız denetime ilişkin hangisi yanlıştır?", "o": ["Tablolar mutlaka bir önceki yılın 31 Aralık tarihi itibarıyla hazırlanmalıdır", "Herhangi bir tarih itibarıyla düzenlenmiş tabloların denetimidir", "Tablolar denetimin başladığı ay sonu veya sonrası itibarıyla hazırlanmış olmalıdır", "Denetim, sözleşmenin imzalandığı tarihte başlamış sayılır", "Halka arz başvurusu veya birleşme, bölünme, devir ve tasfiye durumunda yapılır"], "a": 0, "e": "Özel bağımsız denetim herhangi bir tarih itibarıyla düzenlenmiş tabloları kapsar; tek şart denetimin başladığı ay sonu veya sonrası tarihli olmalarıdır."}, {"q": "Tebliğe göre bağımsız denetçinin görüşü için hangisi doğrudur?", "o": ["İşletmenin gelecekteki durumuna ilişkin güvence verir", "Yönetimin faaliyetleri etkin ve verimli yönettiğini gösterir", "Mutlak güvence sağlar", "Tabloların güvenilirlik derecesini yükseltir ancak gelecek veya yönetim etkinliği hakkında bilgi sağladığı şeklinde değerlendirilmez", "Yalnızca vergi matrahının doğruluğunu gösterir"], "a": 3, "e": "Görüş güvenilirliği artırır; işletmenin geleceği veya yönetimin etkinliği hakkında bilgi sağladığı şeklinde yorumlanmaz."}, {"q": "Mesleki şüphecilik anlayışına göre hangisi doğrudur?", "o": ["Denetçi yönetimin dürüst olmadığını varsayar", "Yönetim açıklamaları tek başına yeterli ve uygun denetim kanıtı kabul edilemez", "Denetçi yönetimin kuşkusuz dürüst olduğunu varsayar", "Yönetim açıklamaları yazılıysa yeterli kanıttır", "Şüphecilik yalnızca hile tespit edildiğinde uygulanır"], "a": 1, "e": "Denetçi yönetimin ne dürüst olmadığı ne de kuşkusuz dürüst olduğu varsayımıyla hareket eder; yönetim açıklamaları yeterli ve uygun kanıt sayılmaz."}, {"q": "Tebliğe göre aşağıdakilerden hangisi denetçinin mutlak güvence elde etmesini engelleyen kısıtlamalardan biri değildir?", "o": ["Örnekleme yönteminin kullanılması", "Yönetimin kontrolleri devre dışı bırakma veya muvazaalı işlem yapma
