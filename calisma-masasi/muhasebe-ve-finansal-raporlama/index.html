<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}

<script>
const S=[{"id": 1, "kisa": "Temel Kavramlar ve İlkeler", "baslik": "Muhasebenin Tanımı, Fonksiyonları, Temel Kavramları ve Temel Denklem", "ozet": "Muhasebenin tanımı ve iki fonksiyonu, on iki temel kavram, muhasebe temel denklemi ile bilanço ve gelir tablosunun nitelikleri.", "notlar": "<h3>Muhasebenin tanımı ve kapsamı<\/h3>\n<ul>\n<li><b>Muhasebe:<\/b> tamamen veya kısmen finansal nitelikli ve <b>parayla ifade edilebilen<\/b> işlemlere ait bilgilerin kaynaklarından toplanması, doğruluğunun saptanması, kaydedilmesi, sınıflandırılması, raporlanması ve analiz edilmesidir. İşletme faaliyetleri ile karar vericiler arasında <b>köprü<\/b> kuran bir bilgi sistemidir.<\/li>\n<li>Tanımın üç parçası: (1) parayla ifade edilen faaliyetler için sistemli ve düzenli bir <b>kayıt sistemi<\/b>; (2) <b>kaydetme ve sınıflandırma<\/b> (muhasebenin teknik boyutu; işlemler sınıflandırılarak finansal tablolara dönüştürülür); (3) raporlanan bilginin <b>analiz ve yorumu<\/b>. Muhasebe, bilgi üretmekten daha geniş kapsamlıdır; asıl amaç bilginin kullanılabilmesidir.<\/li>\n<li><b>Ticari işlem:<\/b> parayla ifade edilebilen değer hareketi. Parayla (güvenilir biçimde) ifade edilemeyen bir olay ne kadar önemli olursa olsun muhasebenin konusu olmaz. Örnek: çalışanların bilgi birikimi, müşterilerdeki \"ürün sağlamdır\" algısı.<\/li>\n<li>Para, kilogram veya metrekare gibi farklı ölçü birimlerini <b>ortak ölçü birimine<\/b> indirger.<\/li>\n<li>Dikkat: Faaliyetler karmaşıklaştıkça bilginin analizi ve yorumu geçmişe göre daha fazla uzmanlık gerektirir.<\/li>\n<\/ul>\n\n<h3>Muhasebe bilgi sisteminin iki esas fonksiyonu<\/h3>\n<table>\n<tr><th>Fonksiyon<\/th><th>İçerik<\/th><\/tr>\n<tr><td><b>Kaydetme (hafıza)<\/b><\/td><td>Geçmişte yapılan ve parayla ifade edilebilen faaliyetler güvenilir ortamda saklanır; herkes için kanıt niteliğinde bilgi oluşur. Bu nedenle hukuk sistemi kaydın ve saklamanın nasıl yapılacağına taraf olur. Kayıtlar <b>en az 5 yıl<\/b> sağlıklı biçimde korunmalı; kayıt bozulamaz, gerçek dışı bilgi kaydedilemez.<\/td><\/tr>\n<tr><td><b>Finansal raporlama<\/b><\/td><td>Kaydedilen bilgi bir formata sokularak esas olarak işletme <b>dışındaki<\/b> çıkar sahiplerine finansal durum ve faaliyet sonuçları hakkında sistematik bilgi olarak sunulur.<\/td><\/tr>\n<\/table>\n\n<h3>Finansal tablolar<\/h3>\n<ul>\n<li>Raporlanan bilgi iki gruptur: belli bir <b>andaki finansal durum<\/b> ve belli bir <b>dönemdeki finansal performans<\/b>.<\/li>\n<li><b>Bilanço (finansal durum tablosu)<\/b> finansal durumu, <b>gelir tablosu (kâr veya zarar tablosu)<\/b> finansal performansı raporlar. Bu ikisi <b>temel finansal tablolardır<\/b>.<\/li>\n<li>Finansal durumdaki <b>değişimi<\/b> gösteren tablolar: nakit akışları açısından <b>nakit akış tablosu<\/b>, özkaynaklar açısından <b>özkaynak değişim tablosu<\/b>. Temel tablolardaki bilgilerle üretildikleri ve onları tamamladıkları için <b>yardımcı finansal tablolar<\/b> denir.<\/li>\n<li>Ek bilgiler ve tamamlayıcı tablolarla birlikte \"finansal tablolar\" kavramı \"<b>finansal raporlar<\/b>\" kavramına dönüşmüştür; özellikle halka açık şirketlerde daha ayrıntılı açıklama zorunlu hale gelmiştir.<\/li>\n<\/ul>\n\n<h3>Tarihsel notlar<\/h3>\n<ul>\n<li>Bugünkü anlamda ilk muhasebe kitabı: <b>1494, Venedik, Luca Pacioli<\/b>; çift yanlı kayıt sistemine dayanır (15. yüzyıl).<\/li>\n<li>Çift yanlı kayıt sayesinde şirket faaliyetleri kaydedilebilmiş, sermaye kolay devredilebilmiş ve işletme <b>ortaklardan bağımsız soyut bir kavram<\/b> haline gelmiştir.<\/li>\n<li><b>Max Weber<\/b> (1864–1920), 1905'te yayımlanan \"Protestan Ahlakı ve Kapitalizmin Ruhu\" eserinde muhasebe uygulamalarını Batı'da kapitalizmin doğuş ve gelişme nedenlerinden biri saymıştır.<\/li>\n<li>Anonim şirketlerin yükselişi, matbaa, Amerika'nın keşfi ve Hindistan ticaret yolunun açılması muhasebedeki gelişmelerle aynı döneme denk gelir.<\/li>\n<\/ul>\n\n<h3>Muhasebenin temel kavramları (12 kavram)<\/h3>\n<p>Temel kavramlar muhasebenin <b>kuramsal temelidir<\/b>; genel kabul görmüş muhasebe ilkeleri ve muhasebe standartları bunlara <b>aykırı olamaz<\/b>. Çift yanlı kayıt gibi evrensel niteliktedir.<\/p>\n<table>\n<tr><th>Kavram<\/th><th>Özü<\/th><th>Akılda tutulacak nokta<\/th><\/tr>\n<tr><td>Sosyal sorumluluk<\/td><td>Muhasebenin organizasyonu, uygulaması ve tabloların sunumunda belli kişi veya grupların değil <b>tüm toplumun<\/b> çıkarının gözetilmesi; gerçeğe uygun, tarafsız ve dürüst bilgi.<\/td><td>Muhasebenin kapsamını, anlamını, yerini ve amacını gösterir. Bilgi, çıkar gruplarına <b>eşit uzaklıkta<\/b> üretilir; sonuç kaynakların adil dağılımıdır.<\/td><\/tr>\n<tr><td>Kişilik<\/td><td>İşletmenin sahip, yönetici, çalışan ve diğer ilgililerden <b>ayrı kişiliği<\/b> vardır; kayıtlar yalnızca bu kişilik adına tutulur.<\/td><td>KOBİ'lerde işletme kasası ile ortağın kasasını ayırmak güçtür; bu, kurumsallaşmanın önündeki en büyük engellerden biridir.<\/td><\/tr>\n<tr><td>İşletmenin sürekliliği<\/td><td>İşletme faaliyetlerini <b>süresiz<\/b> sürdürecektir; ömrü sahiplerin ömrüne bağlı değildir.<\/td><td>Tasfiye niyeti veya ihtiyacı yoktur varsayılır. Aksi durumda tablolar farklı gerekçeyle hazırlanır ve gerekçe açıklanır. <b>Maliyet esasının temelidir.<\/b><\/td><\/tr>\n<tr><td>Dönemsellik<\/td><td>Sınırsız ömrün dönemlere bölünmesi ve her dönemin sonucunun diğerlerinden bağımsız saptanması.<\/td><td>Sürekliliğin doğal sonucudur. <b>Tahakkuk esası<\/b> ve hasılat–maliyet eşleştirmesi bu kavramın zorunlu sonucudur.<\/td><\/tr>\n<tr><td>Parayla ölçülme<\/td><td>İşlemler ortak ölçü olarak para birimiyle kaydedilir.<\/td><td>Kayıt ve raporlama <b>ulusal para birimiyle<\/b> yapılır; yabancı para işlemleri çevrilerek kaydedilir.<\/td><\/tr>\n<tr><td>Maliyet esası<\/td><td>Edinilen varlık ve hizmetler <b>elde etme maliyetiyle<\/b> kaydedilir.<\/td><td>İstisnalar: <b>para mevcudu, alacaklar<\/b> ve maliyeti belirlenemeyen kalemler. Standartlar giderek finansal durumun doğru ölçülmesine kaymaktadır.<\/td><\/tr>\n<tr><td>Tarafsızlık ve belgelendirme<\/td><td>Kayıtlar objektif, usulüne uygun belgelere dayanır; yöntem seçiminde tarafsız davranılır.<\/td><td>Bilginin <b>güvenilirliği<\/b> için önemlidir.<\/td><\/tr>\n<tr><td>Tutarlılık<\/td><td>Seçilen muhasebe politikaları birbirini izleyen dönemlerde <b>değiştirilmeden<\/b> uygulanır.<\/td><td>Amaç <b>karşılaştırılabilirliktir<\/b>. Geçerli neden varsa değişiklik yapılabilir; değişiklik ve parasal etkisi <b>dipnotlarda<\/b> açıklanır.<\/td><\/tr>\n<tr><td>Tam açıklama<\/td><td>Tablolar kullanıcının doğru karar vermesine yetecek ölçüde yeterli, açık ve anlaşılır olmalıdır.<\/td><td>Tablo kalemi olmayan ama kararı etkileyebilecek, <b>gerçekleşmesi muhtemel olaylar<\/b> da açıklanır.<\/td><\/tr>\n<tr><td>İhtiyatlılık<\/td><td>Gelecekte karşılaşılabilecek riskler dikkate alınır.<\/td><td>Muhtemel gider ve zararlar için <b>karşılık ayrılır<\/b>; muhtemel gelir ve kârlar gerçekleşene kadar <b>tahakkuk ettirilmez<\/b>. Gizli yedek veya gereğinden fazla karşılık için gerekçe olamaz.<\/td><\/tr>\n<tr><td>Önemlilik<\/td><td>Bir kalemin göreli ağırlığı kararları etkileyebilecek düzeydeyse önemlidir.<\/td><td>Önemli kalemlerin tablolarda yer alması <b>zorunludur<\/b>.<\/td><\/tr>\n<tr><td>Özün önceliği<\/td><td>İşlemlerin kaydında <b>biçimden çok öz<\/b> esas alınır.<\/td><td>Biçim ile öz ayrıştığında öz önceliklidir. Örnek: ileri tarihli çek, çek hesabında değil senet hesaplarında izlenir.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: İhtiyatlılık \"karşılık ayır\" der ama \"fazla karşılık ayır\" demez. Gizli yedek yaratmak ihtiyatlılığa da aykırıdır.<\/li>\n<li>Dikkat: Tutarlılık politikanın hiç değiştirilemeyeceği anlamına gelmez; değişiklik geçerli nedene dayanmalı ve dipnotta açıklanmalıdır.<\/li>\n<li>Dikkat: Maliyet esasının dayanağı <b>süreklilik<\/b>, tahakkuk esasının dayanağı <b>dönemselliktir<\/b>.<\/li>\n<\/ul>\n\n<h4>Sık karıştırılan kavram çiftleri<\/h4>\n<table>\n<tr><th>Durum<\/th><th>İlgili kavram<\/th><\/tr>\n<tr><td>Ortağın özel harcaması şirket kasasından yapılıyor<\/td><td>Kişilik (ihlal)<\/td><\/tr>\n<tr><td>İşletmenin tasfiye edileceği biliniyor; tablolar farklı esasla hazırlanıp gerekçe açıklanıyor<\/td><td>İşletmenin sürekliliği<\/td><\/tr>\n<tr><td>Aralık ayının tahakkuk etmiş ama ödenmemiş faizi Aralık'ın gideri yazılıyor<\/td><td>Dönemsellik<\/td><\/tr>\n<tr><td>Bina piyasa değeri yükselse de kayıtlarda alış maliyetiyle kalıyor<\/td><td>Maliyet esası<\/td><\/tr>\n<tr><td>Dövizli satış faturası TL karşılığıyla kaydediliyor<\/td><td>Parayla ölçülme<\/td><\/tr>\n<tr><td>Her kayıt fatura, makbuz gibi usulüne uygun belgeye dayanıyor<\/td><td>Tarafsızlık ve belgelendirme<\/td><\/tr>\n<tr><td>Kaybedilmesi muhtemel bir dava dipnotta açıklanıyor<\/td><td>Tam açıklama<\/td><\/tr>\n<tr><td>Tahsili şüpheli alacak için karşılık ayrılıyor, muhtemel bir kazanç ise kaydedilmiyor<\/td><td>İhtiyatlılık<\/td><\/tr>\n<tr><td>Kararları etkilemeyecek küçüklükteki kalemler ayrıntılı gösterilmiyor, büyük kalemler mutlaka gösteriliyor<\/td><td>Önemlilik<\/td><\/tr>\n<\/table>\n<h3>Ticari işlemler ve muhasebe temel denklemi<\/h3>\n<ul>\n<li>İşlemler etkilerine göre ikiye ayrılır: <b>sonuç meydana getirmeyen<\/b> işlemler toplam yapıyı değiştirir ama iç yapıyı (özvarlığı) değiştirmez; <b>sonuç meydana getiren<\/b> işlemler hem toplam yapıyı hem özvarlığı değiştirir.<\/li>\n<li>Temel denklem (temel model, bilanço temel denklemi): <b>Varlıklar (Aktifler) = Kaynaklar (Pasifler)<\/b> ve ayrıntılı haliyle <b>Varlıklar = Borçlar + Özsermaye<\/b>. Denklem işletmenin herhangi bir andaki <b>kesitidir<\/b>.<\/li>\n<li>Aktif taraf = <b>ekonomik yapı<\/b> (sahip olunan değerler); pasif taraf = <b>finansal yapı<\/b> (bu değerlerin kaynakları ve sahipleri). Pasifler, aktifler üzerindeki hukuki hakları temsil eder.<\/li>\n<li>Bir kalemin varlık sayılması için iki koşul: (1) işletmenin <b>kontrolü altında<\/b> olmalı; (2) yakın gelecekte <b>kullanılabilmeli veya satılabilmeli<\/b>, böylece aktiflerde artış sağlayabilmelidir.<\/li>\n<li>Borçlar, borçlanmanın şeklinden çok yapıldığı tarihteki <b>tarihi maliyetle<\/b> (elde edilme maliyetiyle) yer alır.<\/li>\n<li><b>Özsermaye<\/b> = ortakların fiilen getirdiği sermaye + ek yatırım amacıyla işletmede bırakılan dağıtılmamış kârlar.<\/li>\n<\/ul>\n<table>\n<tr><th>İşlem örneği<\/th><th>Varlıklar<\/th><th>Borçlar<\/th><th>Özsermaye<\/th><th>Türü<\/th><\/tr>\n<tr><td>Ortak nakit sermaye koyar<\/td><td>Artar<\/td><td>Değişmez<\/td><td>Artar<\/td><td>Sonuç doğurmayan (kaynak girişi)<\/td><\/tr>\n<tr><td>Kredili mal alımı<\/td><td>Artar<\/td><td>Artar<\/td><td>Değişmez<\/td><td>Sonuç doğurmayan<\/td><\/tr>\n<tr><td>Alacağın tahsili<\/td><td>Değişmez (biri artar, biri azalır)<\/td><td>Değişmez<\/td><td>Değişmez<\/td><td>Sonuç doğurmayan<\/td><\/tr>\n<tr><td>Satıcıya borç ödemesi<\/td><td>Azalır<\/td><td>Azalır<\/td><td>Değişmez<\/td><td>Sonuç doğurmayan<\/td><\/tr>\n<tr><td>Kira giderinin nakden ödenmesi<\/td><td>Azalır<\/td><td>Değişmez<\/td><td>Azalır<\/td><td>Sonuç doğuran<\/td><\/tr>\n<tr><td>Faiz gelirinin bankaya yatması<\/td><td>Artar<\/td><td>Değişmez<\/td><td>Artar<\/td><td>Sonuç doğuran<\/td><\/tr>\n<\/table>\n\n<h3>Temel finansal tabloların nitelikleri<\/h3>\n<table>\n<tr><th><\/th><th>Bilanço<\/th><th>Gelir tablosu<\/th><\/tr>\n<tr><td>Gösterdiği<\/td><td>Belli bir <b>andaki<\/b> finansal durum; varlık, borç ve özsermayenin ayrıntılı listesi<\/td><td>Belli bir <b>döneme<\/b> ait faaliyet sonuçları; gelir ve giderler<\/td><\/tr>\n<tr><td>Benzetme<\/td><td>Fotoğraf, <b>statik<\/b><\/td><td>Film, <b>dinamik<\/b>; modern muhasebede bilançodan daha çok önem verilir<\/td><\/tr>\n<tr><td>Denklem<\/td><td>Varlıklar = Borçlar + Özsermaye<\/td><td>Gelirler − Giderler = Kâr veya Zarar<\/td><\/tr>\n<tr><td>Ortak nitelikler<\/td><td colspan=\"2\">Ulusal para birimiyle düzenlenir; muhasebe kavramlarına ve genel kabul görmüş ilkelere uygun hazırlanır; geçmişe ait (tarihi) belgedir.<\/td><\/tr>\n<tr><td>Ölçüm<\/td><td>Aktifler <b>maliyet değeri<\/b>, borçlar <b>tahakkuk esası<\/b> ile<\/td><td>Maliyet ve tahakkuk esası: amortisman binanın piyasa değerinden değil <b>elde etme maliyetinden<\/b>; faiz piyasa oranından değil <b>anlaşmadaki orandan<\/b><\/td><\/tr>\n<tr><td>Çeşitleri<\/td><td>Hesap tipi, rapor tipi<\/td><td>Hesap tipi, rapor tipi<\/td><\/tr>\n<\/table>\n<ul>\n<li>Bilançoda dönemin faaliyet sonucunu gösteren tek kalem <b>dönem net kârı veya zararıdır<\/b>; bu sonucu oluşturan gelir ve giderlerin ayrıntısını gelir tablosu verir.<\/li>\n<li>Bilançonun sol tarafına ekonomik yapı veya aktif yapı, sağ tarafına finansal yapı veya pasif yapı denir.<\/li>\n<\/ul>", "sorular": [{"q": "Bir olayın muhasebenin konusu olabilmesi için öncelikle sağlaması gereken şart hangisidir?", "o": ["İşletme için büyük ve önemli bir olay olması", "Yazılı bir sözleşmeye dayanması", "Nakit giriş veya çıkışına yol açması", "Parayla güvenilir biçimde ifade edilebilmesi", "Vergi mevzuatında tanımlanmış olması"], "a": 3, "e": "Ticari işlem parayla ifade edilebilen değer hareketidir; parayla ifade edilemeyen olay ne kadar önemli olursa olsun muhasebenin konusu olmaz. Nakit hareketi şart değildir; kredili işlemler de kaydedilir."}, {"q": "Muhasebe bilgi sisteminin iki esas fonksiyonu hangi seçenekte doğru verilmiştir?", "o": ["Kaydetme (hafıza) ve finansal raporlama", "Planlama ve denetim", "Vergilendirme ve finansman", "Bütçeleme ve maliyet kontrolü", "Analiz ve yatırım kararı verme"], "a": 0, "e": "Kitap muhasebe bilgi sisteminin geçmiş faaliyetleri kaydetme (hafıza) ve kaydedilen bilgiyi finansal tablolar halinde raporlama fonksiyonlarını esas fonksiyon sayar."}, {"q": "İşletmelerin geçmiş faaliyetlerini gösteren muhasebe kayıtlarını sağlıklı biçimde koruma yükümlülüğü en az kaç yıldır?", "o": ["3 yıl", "7 yıl", "10 yıl", "2 yıl", "5 yıl"], "a": 4, "e": "Kaydetme fonksiyonu gereği işletmeler kayıtları en az beş yıl korumakla yükümlüdür."}, {"q": "Finansal durumdaki değişimi nakit akışları açısından izleyen ve temel tabloları tamamladığı için yardımcı tablo sayılan finansal tablo hangisidir?", "o": ["Gelir tablosu", "Bilanço", "Envanter cetveli", "Genel kesin mizan", "Nakit akış tablosu"], "a": 4, "e": "Finansal durumdaki değişim nakit açısından izlenirse nakit akış tablosu, özkaynak açısından izlenirse özkaynak değişim tablosu adını alır; bunlar yardımcı finansal tablolardır."}, {"q": "Çift yanlı kayıt sistemini esas alan ilk muhasebe kitabı ile ilgili hangisi doğrudur?", "o": ["1605 yılında Floransa'da Luca Pacioli tarafından yayımlanmıştır", "1494 yılında Venedik'te Luca Pacioli tarafından yayımlanmıştır", "1494 yılında Cenova'da Max Weber tarafından yayımlanmıştır", "1905 yılında Max Weber tarafından yayımlanmıştır", "1394 yılında Venedik'te anonim olarak yayımlanmıştır"], "a": 1, "e": "Bugünkü anlamda ilk muhasebe kitabı 1494'te Venedik'te Luca Pacioli tarafından yayımlanmıştır. Max Weber'in eseri 1905 tarihlidir ve muhasebe kitabı değildir."}, {"q": "Küçük ve orta büyüklükteki işletmelerde işletme kasası ile ortağın kasasının birbirinden ayrılamaması hangi temel kavramın uygulanmasındaki güçlüğü gösterir?", "o": ["İşletmenin sürekliliği", "Tutarlılık", "Önemlilik", "Kişilik", "Parayla ölçülme"], "a": 3, "e": "Kişilik kavramı işletmenin sahip ve ortaklarından ayrı bir kişiliği olduğunu öngörür; KOBİ'lerde bu ayrım güçtür ve kurumsallaşmanın en büyük engellerinden biri sayılır."}, {"q": "Varlıkların piyasa değeri yerine maliyetle ölçülmesini anlamlı kılan ve maliyet esasının temelini oluşturan kavram hangisidir?", "o": ["İşletmenin sürekliliği", "Dönemsellik", "Tam açıklama", "Özün önceliği", "Sosyal sorumluluk"], "a": 0, "e": "Sınırsız ömürlü bir işletmede varlıkların piyasa değeri anlamını yitirir; bu nedenle süreklilik varsayımı maliyet esasının temelidir."}, {"q": "Gelir ve giderlerin tahakkuk esasına göre kaydedilmesi ve hasılatın aynı döneme ait maliyetlerle karşılaştırılması hangi temel kavramın zorunlu sonucudur?", "o": ["Maliyet esası", "İhtiyatlılık", "Dönemsellik", "Tarafsızlık ve belgelendirme", "Kişilik"], "a": 2, "e": "Kitaba göre tahakkuk esası ve gelir-gider eşleştirmesi dönemsellik kavramının zorunlu sonucudur."}, {"q": "Maliyet esası kavramına göre aşağıdaki kalemlerden hangisi elde etme maliyeti ile ölçülme kuralının istisnaları arasında sayılmıştır?", "o": ["Binalar", "Ticari mallar", "Alacaklar", "Makineler", "Satın alınan patentler"], "a": 2, "e": "Maliyet esası; para mevcudu, alacaklar ve maliyeti belirlenemeyen veya belirlenmesi uygun olmayan kalemler hariç tutularak uygulanır."}, {"q": "İhtiyatlılık kavramı ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Muhtemel giderler ve zararlar için karşılık ayrılır", "İşletme ileride çıkabilecek riskler için gizli yedek ayırabilir", "Muhtemel gelir ve kârlar gerçekleşene kadar tahakkuk ettirilmez", "Gelecekte karşılaşılabilecek riskler raporlamada dikkate alınır", "Gereğinden fazla karşılık ayrılmasına gerekçe yapılamaz"], "a": 1, "e": "İhtiyatlılık gizli yedek veya gereğinden fazla karşılık ayrılmasına gerekçe oluşturamaz; diğer ifadeler kavramın doğru tanımıdır."}, {"q": "Bir işletme stok değerleme yöntemini geçerli bir nedenle değiştirmiştir. Tutarlılık kavramına göre işletmenin yapması gereken hangisidir?", "o": ["Değişikliği geri almak, çünkü politikalar hiçbir koşulda değiştirilemez", "Değişikliği yalnızca vergi idaresine bildirmek", "Önceki beş yılın tablolarını yeniden yayımlamak", "Değişikliği ve parasal etkisini finansal tablo dipnotlarında açıklamak", "Değişikliği bir sonraki yılın genel kuruluna bırakmak"], "a": 3, "e": "Tutarlılık politikaların dönemler arasında değiştirilmeden uygulanmasını ister; ancak geçerli nedenle değişiklik yapılabilir ve değişiklik ile parasal etkisi dipnotlarda açıklanır."}, {"q": "İleri tarihli bir çekin, çek hesabı yerine alacak senetleri hesabında izlenmesi hangi temel kavramın gereğidir?", "o": ["Önemlilik", "Özün önceliği", "Parayla ölçülme", "Kişilik", "Tutarlılık"], "a": 1, "e": "İleri tarihli çek biçim olarak çek olsa da özü itibarıyla vadeli bir senettir; biçimden çok özün esas alınması özün önceliği kavramıdır."}, {"q": "Muhasebe bilgisinin tüm çıkar gruplarına eşit uzaklıkta üretilmesini ve böylece uzun dönemde kaynakların adil dağılımını sağlayan kavram hangisidir?", "o": ["İşletmenin sürekliliği", "İhtiyatlılık", "Sosyal sorumluluk", "Dönemsellik", "Maliyet esası"], "a": 2, "e": "Sosyal sorumluluk kavramı belli grupların değil tüm toplumun çıkarının gözetilmesini, bilgi üretiminde tarafsız ve dürüst davranılmasını ifade eder."}, {"q": "Bir işletmenin toplam varlıkları 4.800.000 TL, özsermayesi 1.900.000 TL'dir. Muhasebe temel denklemine göre işletmenin borçları kaç TL'dir?", "o": ["6.700.000 TL", "1.900.000 TL", "4.800.000 TL", "2.400.000 TL", "2.900.000 TL"], "a": 4, "e": "Varlıklar = Borçlar + Özsermaye olduğundan borçlar 4.800.000 − 1.900.000 = 2.900.000 TL'dir."}, {"q": "Varlıkları 1.000.000 TL, borçları 400.000 TL olan işletmede şu işlemler yapılmıştır: ortak 250.000 TL nakit sermaye koymuş, 150.000 TL'lik mal kredili alınmış, satıcıya 100.000 TL borç nakden ödenmiştir. İşlemler sonrası toplam varlıklar kaç TL'dir?", "o": ["1.300.000 TL", "1.400.000 TL", "1.250.000 TL", "1.150.000 TL", "1.500.000 TL"], "a": 0, "e": "Varlıklar: 1.000.000 + 250.000 + 150.000 − 100.000 = 1.300.000 TL. Kontrol: borçlar 450.000, özsermaye 850.000, toplam 1.300.000."}, {"q": "Dönem başında özsermayesi 800.000 TL olan işletmenin dönem sonunda varlıkları 2.000.000 TL, borçları 1.050.000 TL'dir. Dönem içinde ortak işletmeden 60.000 TL çekmiş, ek sermaye konmamıştır. Dönem kârı kaç TL'dir?", "o": ["150.000 TL", "90.000 TL", "950.000 TL", "210.000 TL", "270.000 TL"], "a": 3, "e": "Dönem sonu özsermaye 2.000.000 − 1.050.000 = 950.000 TL. Kâr = 950.000 − 800.000 + 60.000 (çekilen tutar geri eklenir) = 210.000 TL."}, {"q": "Dönem başı özsermayesi 500.000 TL olan işletmenin dönem gelirleri 180.000 TL, giderleri 120.000 TL'dir; ayrıca ortak 50.000 TL ek sermaye koymuştur. Dönem sonu özsermaye kaç TL'dir?", "o": ["610.000 TL", "560.000 TL", "680.000 TL", "550.000 TL", "730.000 TL"], "a": 0, "e": "Kâr 180.000 − 120.000 = 60.000 TL. Dönem sonu özsermaye 500.000 + 60.000 + 50.000 = 610.000 TL."}, {"q": "Ortaklar işletmeyi 300.000 TL nakit ve 200.000 TL'lik demirbaş koyarak kurmuştur. Ardından bankadan 150.000 TL kredi alınmış ve 80.000 TL'lik mal peşin satın alınmıştır. Bu işlemler sonrası toplam kaynaklar (pasif toplamı) kaç TL'dir?", "o": ["730.000 TL", "570.000 TL", "500.000 TL", "800.000 TL", "650.000 TL"], "a": 4, "e": "Kaynaklar: özsermaye 300.000 + 200.000 = 500.000 TL, borç 150.000 TL; toplam 650.000 TL. Peşin mal alımı yalnızca kasa ile stok arasında yer değiştirmedir, toplamı değiştirmez."}, {"q": "Bir işletme alıcıdan olan 40.000 TL alacağını nakden tahsil etmiştir. Bu işlem toplam varlıkları ve özsermayeyi nasıl etkiler?", "o": ["Toplam varlıklar 40.000 TL artar, özsermaye değişmez", "Toplam varlıklar ve özsermaye 40.000 TL artar", "Toplam varlıklar 40.000 TL azalır", "Özsermaye 40.000 TL artar, varlıklar değişmez", "Toplam varlıklar ve özsermaye değişmez"], "a": 4, "e": "Kasa artarken alıcılar aynı tutarda azalır; varlıklar içinde yer değiştirme olur. Sonuç doğurmayan işlemdir, özsermaye etkilenmez."}, {"q": "Aşağıdaki işlemlerden hangisi sonuç meydana getiren (özvarlığı değiştiren) bir işlemdir?", "o": ["Ticari malın kredili satın alınması", "Ofis kirasının nakden ödenmesi", "Bankadan nakit çekilmesi", "Satıcıya olan borcun ödenmesi", "Alıcıdan senet alınması"], "a": 1, "e": "Kira gideri özsermayeyi azaltır. Diğer işlemler varlık ve borçların yapısını değiştirir ama özvarlığı değiştirmez."}, {"q": "Bir işletmenin dönem gelirleri 750.000 TL, giderleri 820.000 TL'dir. Gelir tablosu denklemine göre dönem sonucu hangisidir?", "o": ["70.000 TL kâr", "1.570.000 TL zarar", "820.000 TL zarar", "70.000 TL zarar", "Sonuç sıfırdır"], "a": 3, "e": "Gelirler − Giderler = 750.000 − 820.000 = −70.000 TL, yani 70.000 TL zarar."}, {"q": "Bilanço ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Aktif değerler bilanço günündeki piyasa değeriyle gösterilir", "İşletmenin belli bir andaki fotoğrafıdır", "Borçlar tahakkuk esasına göre gösterilir", "Geçmiş dönem faaliyetlerine ilişkin bir belgedir", "Hesap tipi ve rapor tipi olarak düzenlenebilir"], "a": 0, "e": "Kitaba göre bilançoda aktifler maliyet değeri esasıyla, borçlar tahakkuk esasıyla gösterilir; piyasa değeri esas değildir."}, {"q": "Gelir tablosu ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Belli bir andaki finansal durumu gösterir", "Amortisman binanın piyasa değerinden hesaplanır", "Dinamik bir tablodur; modern muhasebede bilançodan daha fazla önem verilir", "Faiz giderleri piyasa faiz oranıyla hesaplanır", "Yardımcı finansal tablolar arasında yer alır"], "a": 2, "e": "Gelir tablosu döneme ait filmi gösterir ve dinamiktir. Amortisman elde etme maliyetinden, faiz anlaşmadaki orandan hesaplanır; temel finansal tablodur."}, {"q": "Bir kalemin muhasebede varlık (aktif) kabul edilebilmesi için aranan iki koşul hangisidir?", "o": ["Yasal mülkiyetinin işletmede olması ve sigortalanmış olması", "Nakit olarak ödenmiş olması ve faturasının bulunması", "İşletmenin kontrolünde olması ve yakın gelecekte kullanılabilmesi veya satılabilmesi", "Bir yıldan uzun süre kullanılması ve amortismana tabi olması", "Piyasa değerinin maliyetinden yüksek olması ve borsada işlem görmesi"], "a": 2, "e": "Kitap varlık sayılmak için kontrol ve yakın gelecekte kullanılabilme veya satılabilme koşullarını arar."}]}, {"id": 2, "kisa": "Hesap, Kayıt ve THP", "baslik": "Hesabın İşleyişi, Kayıt Araçları, Muhasebe Akım Şeması ve Tekdüzen Muhasebe Sistemi", "ozet": "Hesapların işleyiş kuralları ve sınıflandırması, defterler, belgeler ve fişler, muhasebe akım şeması ile Tekdüzen Hesap Planının yapısı.", "notlar": "<h3>Hesap ve işleyiş kuralları<\/h3>\n<ul>\n<li><b>Hesap:<\/b> ticari işlemlerin saptanmasına ve izlenmesine yarayan, aritmetik işlem sayısını azaltan ve aktif, borç ve özsermayedeki artış ve azalışları cebirsel olarak izleyen çizelgedir. Aynı nitelikteki değer hareketlerini bir başlık altında toplar.<\/li>\n<li>Sol taraf <b>borç<\/b> (debit), sağ taraf <b>alacak<\/b> (credit) tarafıdır. Her iki tarafta tarih, açıklama ve tutar sütunları bulunur. Kısaltılmış gösterime <b>\"T\" hesabı<\/b> veya iskelet hesap denir.<\/li>\n<li><b>Hesabın açılması:<\/b> iki tarafı sıfır veya eşit olan hesabın bir yanına tutar yazılması. <b>Kapatılması:<\/b> iki yanın eşitlenmesi. <b>Kalan (bakiye):<\/b> iki taraf arasındaki fark; sol tarafta oluşursa borç kalanı, sağda oluşursa alacak kalanı.<\/li>\n<\/ul>\n<table>\n<tr><th>Hesap türü<\/th><th>Artış<\/th><th>Azalış<\/th><th>İlk kayıt / kalan<\/th><\/tr>\n<tr><td>Aktif (varlık)<\/td><td>Borç<\/td><td>Alacak<\/td><td>İlk kayıt borçtan; <b>borç kalanı<\/b> verir. Borç tarafı sıfırken alacağa kayıt yapılamaz.<\/td><\/tr>\n<tr><td>Pasif (borç ve özsermaye)<\/td><td>Alacak<\/td><td>Borç<\/td><td>İlk kayıt alacaktan; <b>alacak kalanı<\/b> verir. Alacak tarafı sıfırken borca kayıt yapılamaz.<\/td><\/tr>\n<tr><td>Gider<\/td><td>Borç<\/td><td>Alacak<\/td><td>İlk kayıt borçtan<\/td><\/tr>\n<tr><td>Gelir<\/td><td>Alacak<\/td><td>Borç<\/td><td>İlk kayıt alacaktan<\/td><\/tr>\n<tr><td>Kâr ve zarar hesabı<\/td><td>Alacak (artış)<\/td><td>Borç (azalış)<\/td><td>Gider ve gelir hesapları önce bu hesapla kapatılır, sonra sermaye ile karşılaştırılır.<\/td><\/tr>\n<\/table>\n<p><b>Toplu kural:<\/b> Borç tarafına varlık artışı, borç azalışı, özsermaye azalışı, gider artışı, gelir azalışı ve zarar; alacak tarafına varlık azalışı, borç artışı, özsermaye artışı, gider azalışı, gelir artışı ve kâr yazılır.<\/p>\n<ul>\n<li>Özsermayedeki azalışlar gider hesaplarında, artışlar gelir hesaplarında izlenir. Yararı: gider ve gelir kaynaklarının bilinmesi ve yöneticilerin sürekli ve optimum kâr için bilinçli hareket etmesi.<\/li>\n<li>Dikkat: <b>Kâr ve zarar hesabı<\/b> (income summary) bir hesaptır; <b>gelir tablosu<\/b> (kâr ve zarar cetveli) ise bir finansal tablodur. Karıştırılmamalıdır.<\/li>\n<\/ul>\n\n<h3>Hesapların sınıflandırılması<\/h3>\n<ul>\n<li>Temel tablolara göre: <b>bilanço hesapları<\/b> ve <b>gelir tablosu hesapları<\/b>.<\/li>\n<li>Fonksiyona göre: <b>ana (kontrol) hesaplar<\/b> (toplu bilgi) ve <b>yardımcı (tali, muavin) hesaplar<\/b> (ayrıntı; birinci, ikinci derece gibi çok kademeli olabilir). Örnek: Ticari Mallar ana hesabı altında X malı, Y malı yardımcı hesapları.<\/li>\n<li>Gelişim sırasına göre: <b>asli → düzenleyici → geçici ve ara → nazım<\/b> hesaplar. Bu sıra tarihsel gelişimi de gösterir.<\/li>\n<\/ul>\n<table>\n<tr><th>Grup<\/th><th>Tanım<\/th><th>Örnekler<\/th><\/tr>\n<tr><td>Asli hesaplar<\/td><td>Tamamlanmış işlemlere ait bilanço hesapları ile nominal hesaplar (varlık, borç, özsermaye, gelir, gider)<\/td><td>Kasa, satıcılar, sermaye, satışlar<\/td><\/tr>\n<tr><td>Düzenleyici hesaplar<\/td><td>Aktif ve pasif değerlerin <b>gerçek değerleriyle<\/b> gösterilmesini sağlar; asli hesapların açığını kapatır<\/td><td><b>Aktifi düzenleyici:<\/b> birikmiş amortismanlar, stok değer düşüklüğü karşılığı, alacak senetleri reeskontu, şüpheli alacaklar karşılığı. <b>Pasifi düzenleyici:<\/b> ödenmemiş sermaye, borç senetleri reeskontu, zarar.<\/td><\/tr>\n<tr><td>Geçici ve ara hesaplar<\/td><td>Tamamlanmamış işlemleri izler<\/td><td>Yoldaki mallar, gümrükteki mallar<\/td><\/tr>\n<tr><td>Nazım hesaplar<\/td><td>Fiilen işletmede bulunan ama mülkiyeti işletmeye ait olmayan değerler ile <b>koşullu işlemler<\/b>; genellikle karşılıklı çalışır<\/td><td>Cirolarımız, teminat mektupları, siparişlerimiz<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Brüt değer<\/b> esaslı bilançoda aktifi düzenleyici hesaplar <b>pasifte<\/b>, pasifi düzenleyici hesaplar <b>aktifte<\/b> yer alır. <b>Net değer<\/b> esaslı bilançoda ilgili kalemden indirim olarak gösterilir.<\/li>\n<li>Uygulamada en çok aktifi düzenleyici hesaplara rastlanır. Banka muhasebesinde nazım hesapların asli hesaplarla karşılıklı çalıştığı da görülür.<\/li>\n<\/ul>\n\n<h3>Defterler<\/h3>\n<ul>\n<li>Kâr amacıyla faaliyette bulunan tacirlerin tutmak zorunda olduğu defterlere <b>kanuni (zorunlu) defterler<\/b> denir.<\/li>\n<li><b>Birinci sınıf tüccar<\/b> bilanço esasına, <b>ikinci sınıf tüccar<\/b> işletme hesabı esasına göre kayıt tutar; ikincisinde zorunlu defter <b>işletme hesabı defteridir<\/b>.<\/li>\n<li>Bilanço esasında zorunlu defterler: <b>envanter defteri, günlük (yevmiye) defter, büyük defter (defterikebir)<\/b>. Diğerleri isteğe bağlıdır.<\/li>\n<li><b>e-Defter:<\/b> Sıra No:5 Tebliğ (08/11/2024, RG 32716) ile bilanço esasına göre defter tutanlar ve bunu ihtiyari tercih edenler <b>1 Ocak 2025<\/b>'ten itibaren e-Defter'e geçmek zorundadır.<\/li>\n<li><b>ETDS:<\/b> 1 Ocak 2026'dan itibaren tescil edilecek tüm şirketler <b>pay defteri<\/b> ile <b>genel kurul toplantı ve müzakere defterini<\/b> Elektronik Ticari Defter Sisteminde tutar; bu tarihten önce tescil edilmiş şirketler de düzenlemeye uymak zorundadır.<\/li>\n<\/ul>\n<table>\n<tr><th>Defter<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Envanter defteri<\/td><td>İlk kayıt işe başlama tarihinde (açılış envanteri ve açılış bilançosu). Her dönem sonundaki envanter ve bilanço buraya geçirilir; yani her dönemde <b>bir kez<\/b> kayıt yapılır.<\/td><\/tr>\n<tr><td>Günlük (yevmiye) defter<\/td><td>İşlemler belgelerden çıkarılarak <b>tarih sırasıyla<\/b> ve <b>madde<\/b> halinde kaydedilir. İki tarih çizgisi arasındaki kayıt bir yevmiye maddesidir. Büyük defter numarası sütununa <b>bağlantı (folyo)<\/b> sütunu denir.<\/td><\/tr>\n<tr><td>Büyük defter (defterikebir)<\/td><td>Yevmiyedeki kayıtları hesaplara dağıtır ve sınıflandırır (muhasebenin ikinci fonksiyonu olan sınıflandırma). <b>İki sayfalı<\/b> ve <b>tek sayfalı<\/b> türleri vardır.<\/td><\/tr>\n<tr><td>Yardımcı defter<\/td><td>İsteğe bağlı (ihtiyari) veya <b>muavin<\/b> defter; ayrıntıları izler. Örnek: kasa defteri, ambar defteri, alacaklar ve borç senetleri defterleri. TTK m.66'daki açılış envanteri hükmü işletmelere yardımcı defter tutma yükü getirir.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Bir yevmiye maddesinde bulunması gerekenler: <b>madde sıra numarası, tarih, borçlu ve alacaklı hesaplar, tutarlar, kaydın dayandığı belgenin çeşidi ile varsa tarih ve numarası<\/b>.<\/li>\n<li>Büyük defterde bulunanlar: tarih, yevmiye madde numarası, açıklama, borç veya alacak tutarı. Yevmiye madde numarası iki defter arasında bağlantı ve iç kontrol sağlar.<\/li>\n<\/ul>\n\n<h3>Belgeler<\/h3>\n<ul>\n<li>Kayıt için objektif belge şarttır. Sınıflar: <b>faturalar, fatura yerine geçen belgeler, diğer belgeler, muhasebe fişleri<\/b>.<\/li>\n<li><b>Fatura:<\/b> satılan mal veya yapılan hizmet karşılığında alıcının borçlandığı tutarı göstermek üzere satıcının verdiği temel belge. Asgari bilgiler: düzenleme tarihi, seri ve sıra no; düzenleyenin adı, unvanı, iş adresi, vergi dairesi ve hesap no; alıcının adı, unvanı, adresi, varsa vergi dairesi ve no; malın veya hizmetin türü, miktarı, fiyatı, tutarı; mal faturadan önce teslim edildiyse teslim tarihi ve irsaliye no.<\/li>\n<li>Gerçek kişide ticaret unvanı ad ve soyaddan oluşur. Büyük ve tanınmış işletmelerin adresini yazmak zorunlu değildir.<\/li>\n<li><b>Fatura yerine geçen belgeler (VUK):<\/b> perakende satış belgeleri, gider pusulası, müstahsil makbuzu, serbest meslek makbuzu ve ücret belgeleri, giriş ve yolcu taşıma biletleri.<\/li>\n<li><b>Diğer belgeler:<\/b> ticari mektuplar, kefaletname, mahkeme ilamları, ihbarnameler, karar örnekleri, vergi makbuzları.<\/li>\n<li><b>2026 zorunlu fatura düzenleme sınırı: 12.000 TL.<\/b><\/li>\n<li><b>e-Belge (573 Sıra No'lu Tebliğ, RG 12.11.2024):<\/b> 2025'te vergiler dahil 3.000 TL üzeri faturalar e-Arşiv; 2026 itibarıyla tutara bakılmaksızın tüm faturalar e-Arşiv; 1 Ocak 2027'den itibaren tüm faturalar GİB e-Belge (e-Arşiv) portalından. 2024 ve sonrası brüt satış hasılatı 1 milyon TL ve üzeri olanlar e-İrsaliye kullanır; e-Dekont kapsamına bankalara ek olarak finansman şirketleri alınmıştır.<\/li>\n<\/ul>\n\n<h3>Muhasebe fişleri<\/h3>\n<ul>\n<li>Kayıt belgeleri (evrakı müsbite) ile defterler arasındaki <b>ikinci kademe<\/b> kayıt belgeleridir. İşletme hukuku bakımından <b>isteğe bağlıdır<\/b>; aynı nitelikteki işlemleri topluca kaydetmeyi sağlar.<\/li>\n<li><b>Kasa tahsil fişi:<\/b> tek tutar sütunu; tutarlar açıklamadaki hesaplara <b>alacak<\/b>, kasaya <b>borç<\/b> yazılır.<\/li>\n<li><b>Kasa tediye (ödeme) fişi:<\/b> tutarlar açıklamadaki hesaplara <b>borç<\/b>, kasaya <b>alacak<\/b> yazılır.<\/li>\n<li><b>Mahsup fişi:<\/b> para giriş veya çıkışı olmayan işlemler için; tutar sütunu borç ve alacak olarak ikiye bölünmüştür.<\/li>\n<li>Fişlerin deftere geçirilmesi <b>45 günden fazla geciktirilemez<\/b>; VUK genel olarak kayıt için <b>10 günlük<\/b> süre benimsemiştir.<\/li>\n<\/ul>\n\n<h3>Muhasebe akım şeması<\/h3>\n<p>Bir dönemdeki işlemlerin sırası: dönem başı envanteri ve envanter cetveli → dönem başı bilançosu → envanter defterine kayıt → hesapların açılması → ticari işlemlerin günlük deftere maddeler halinde kaydı → büyük deftere aktarım → <b>genel geçici mizan<\/b> → dönem sonu envanter işlemleri ve envanter cetveli → envanter kayıtları → <b>genel kesin mizan<\/b> → <b>gelir tablosu ve dönem sonu bilançosu<\/b> → hesapların kapatılması.<\/p>\n\n<h3>Tekdüzen Muhasebe Sistemi<\/h3>\n<ul>\n<li><b>3568 sayılı<\/b> Serbest Muhasebecilik, SMMM ve YMM Kanunu <b>13 Haziran 1989<\/b>'da yürürlüğe girdi; meslek yasal statü kazandı. Geçici Kurul meslek odalarını ve TÜRMOB'u örgütledi; görevi Birliğin kurulmasıyla <b>Ekim 1991<\/b>'de sona erdi.<\/li>\n<li>Muhasebe Standartları ve Hesap Planı Komiteleri <b>Ekim 1990–Temmuz 1991<\/b> arasında çalıştı; SPK'nın <b>29 Ocak 1989<\/b> tarihli muhasebe tebliğiyle uyum gözetildi.<\/li>\n<li><b>Muhasebe Sistemi Uygulama Genel Tebliği:<\/b> <b>26 Aralık 1992<\/b>, RG <b>21447<\/b> mükerrer. Beş bölüm: muhasebenin temel kavramları; muhasebe politikalarının açıklanması; mali tablolar ilkeleri; mali tabloların düzenlenmesi ve sunulması; tekdüzen hesap çerçevesi, hesap planı ve açıklamaları.<\/li>\n<li>Amaç: <b>bilanço esasına göre defter tutan<\/b> gerçek ve tüzel kişilerin bilgilerinin <b>tutarlılık ve karşılaştırılabilirlik<\/b> ilkelerine göre üretilmesi; böylece denetim de etkinleşir.<\/li>\n<\/ul>\n<table>\n<tr><th>Sınıf<\/th><th>Ad<\/th><th>Tür<\/th><\/tr>\n<tr><td>1<\/td><td>Dönen Varlıklar<\/td><td rowspan=\"5\">Bilanço hesapları<\/td><\/tr>\n<tr><td>2<\/td><td>Duran Varlıklar<\/td><\/tr>\n<tr><td>3<\/td><td>Kısa Vadeli Yabancı Kaynaklar<\/td><\/tr>\n<tr><td>4<\/td><td>Uzun Vadeli Yabancı Kaynaklar<\/td><\/tr>\n<tr><td>5<\/td><td>Özkaynaklar<\/td><\/tr>\n<tr><td>6<\/td><td>Gelir Tablosu Hesapları<\/td><td>Sonuç hesapları<\/td><\/tr>\n<tr><td>7<\/td><td>Maliyet Hesapları<\/td><td>7/A veya 7/B<\/td><\/tr>\n<tr><td>8<\/td><td>Serbest<\/td><td>Boş bırakılmış<\/td><\/tr>\n<tr><td>9<\/td><td>Nazım Hesaplar<\/td><td>Karşılıklı çalışır<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>7/A seçeneği:<\/b> maliyetler <b>fonksiyon esasına<\/b> göre izlenir; büyük ve orta ölçekli işletmelere uygundur. <b>7/B seçeneği:<\/b> <b>gider çeşitleri<\/b> esas alınır; küçük ölçekli işletmelere uygundur.<\/li>\n<li>7 sınıfındaki maliyet ve giderler her iki seçenekte de <b>yansıtma hesapları<\/b> aracılığıyla 6 grubuna ve oradan 690 Dönem Kârı veya Zararı hesabına devredilir. Örnek akış: 760 → 761 (yansıtma) → 631 → 690.<\/li>\n<li>Dikkat: Hesap kodunda ilk rakam sınıfı, ilk iki rakam grubu, üç rakam hesabı gösterir (örneğin 1 dönen varlıklar, 10 hazır değerler, 100 kasa).<\/li>\n<\/ul>", "sorular": [{"q": "Aşağıdakilerden hangisi bir hesabın alacak tarafına kaydedilir?", "o": ["Borçlardaki artışlar", "Varlıklardaki artışlar", "Giderlerdeki artışlar", "Özsermayedeki azalışlar", "Gelirlerdeki azalışlar"], "a": 0, "e": "Alacak tarafına varlık azalışı, borç artışı, özsermaye artışı, gider azalışı, gelir artışı ve kâr yazılır. Diğer şıklar borç tarafına kaydedilir."}, {"q": "Aktif karakterli hesaplarla ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Artışlar borç tarafına kaydedilir", "İlk kayıt borç tarafına yapılır", "Normalde borç kalanı verir", "Bilançonun sol tarafında yer alır", "Borç tarafı sıfır iken alacak tarafına kayıt yapılabilir"], "a": 4, "e": "Aktif hesaplar borç tarafına yapılan kayıtla açılır; borç tarafı sıfırken alacak tarafına kayıt yapılamaz."}, {"q": "Bir dönem boyunca kasa hesabının borç tarafına toplam 540.000 TL, alacak tarafına toplam 385.000 TL kaydedilmiştir. Hesabın kalanı hangisidir?", "o": ["155.000 TL alacak kalanı", "925.000 TL borç kalanı", "385.000 TL borç kalanı", "Hesap kapanmıştır, kalan yoktur", "155.000 TL borç kalanı"], "a": 4, "e": "Kalan = 540.000 − 385.000 = 155.000 TL ve borç tarafı büyük olduğu için borç kalanıdır. Kasa hiçbir zaman alacak kalanı vermez."}, {"q": "Satıcılar hesabının alacak tarafında 900.000 TL, borç tarafında 650.000 TL bulunmaktadır. Bu hesap için hangisi doğrudur?", "o": ["250.000 TL borç kalanı vardır ve bu tutar işletmenin alacağıdır", "250.000 TL alacak kalanı vardır ve bu tutar işletmenin satıcılara olan borcudur", "1.550.000 TL alacak kalanı vardır", "650.000 TL alacak kalanı vardır", "250.000 TL alacak kalanı vardır ve bu tutar aktifte gösterilir"], "a": 1, "e": "Pasif hesapta artışlar alacağa, azalışlar borca yazılır; 900.000 − 650.000 = 250.000 TL alacak kalanı pasifte borç olarak raporlanır."}, {"q": "Bankalar hesabıyla ilgili dönem içi hareketler şöyledir: hesaba 300.000 TL nakit yatırılmış, 120.000 TL çekilmiş, satıcıya 90.000 TL havale yapılmış, banka 40.000 TL faiz tahakkuk ettirip hesaba eklemiştir. Hesabın kalanı kaç TL'dir?", "o": ["90.000 TL borç kalanı", "170.000 TL borç kalanı", "210.000 TL borç kalanı", "130.000 TL borç kalanı", "130.000 TL alacak kalanı"], "a": 3, "e": "Borç: 300.000 + 40.000 = 340.000; alacak: 120.000 + 90.000 = 210.000; kalan 130.000 TL borç."}, {"q": "Bir hesabın borç ve alacak tarafı toplamlarının birbirine eşitlenmesine ne ad verilir?", "o": ["Hesabın kapatılması", "Hesabın açılması", "Hesabın kalanı", "Hesabın yansıtılması", "Hesabın mahsubu"], "a": 0, "e": "İki yanın eşit hale getirilmesi hesabın kapatılmasıdır; sıfır olan hesaba ilk tutarın yazılması ise hesabın açılmasıdır."}, {"q": "Kâr ve zarar hesabı ile ilgili hangisi doğrudur?", "o": ["Gelir tablosunun diğer adıdır", "Artışlar borç tarafına kaydedilir", "Gider ve gelir hesapları önce bu hesapla kapatılır, sonra bu hesap sermaye ile karşılaştırılır", "Bir bilanço hesabıdır ve aktifte yer alır", "Yalnızca zarar durumunda kullanılır"], "a": 2, "e": "Gider ve gelir hesaplarının doğrudan sermaye ile çalıştırılması güçlük yarattığından önce kâr ve zarar hesabı kullanılır. Bu hesap gelir tablosu ile karıştırılmamalıdır; artışlar alacak tarafına yazılır."}, {"q": "Hesapların tarihsel gelişim sırası hangi seçenekte doğru verilmiştir?", "o": ["Nazım hesaplar, asli hesaplar, düzenleyici hesaplar, geçici ve ara hesaplar", "Düzenleyici hesaplar, asli hesaplar, nazım hesaplar, geçici ve ara hesaplar", "Asli hesaplar, düzenleyici hesaplar, geçici ve ara hesaplar, nazım hesaplar", "Asli hesaplar, geçici ve ara hesaplar, nazım hesaplar, düzenleyici hesaplar", "Geçici ve ara hesaplar, asli hesaplar, düzenleyici hesaplar, nazım hesaplar"], "a": 2, "e": "Kitaptaki sınıflandırma sırası asli, düzenleyici, geçici ve ara, nazım şeklindedir ve bu sıra tarihsel gelişimi de gösterir."}, {"q": "Aşağıdakilerden hangisi pasifi düzenleyici bir hesaptır?", "o": ["Birikmiş amortismanlar", "Ödenmemiş sermaye", "Stok değer düşüklüğü karşılığı", "Alacak senetleri reeskontu", "Şüpheli alacaklar karşılığı"], "a": 1, "e": "Pasifi düzenleyici hesaplar ödenmemiş sermaye, borç senetleri reeskontu ve zarardır. Diğer şıklar aktifi düzenleyici hesaplardır."}, {"q": "Brüt değer esasına göre düzenlenen bir bilançoda birikmiş amortismanlar hangi tarafta yer alır?", "o": ["Aktif tarafta, ilgili varlığın altında artı olarak", "Gelir tablosunda", "Nazım hesaplarda", "Pasif tarafta", "Bilançoda yer almaz, yalnızca dipnotta açıklanır"], "a": 3, "e": "Brüt bilançoda aktifi düzenleyici hesaplar pasifte, pasifi düzenleyici hesaplar aktifte gösterilir. Net bilançoda ise ilgili varlıktan indirilir."}, {"q": "Maliyeti 500.000 TL olan makine için 200.000 TL birikmiş amortisman ayrılmıştır. Net değer esasına göre düzenlenen bilançoda makine hangi tutarla aktifte görünür?", "o": ["500.000 TL", "300.000 TL", "700.000 TL", "200.000 TL", "250.000 TL"], "a": 1, "e": "Net bilançoda aktifi düzenleyici hesap ilgili varlıktan indirim olarak gösterilir: 500.000 − 200.000 = 300.000 TL."}, {"q": "Yoldaki mallar ve gümrükteki mallar hesapları hangi hesap grubuna örnektir?", "o": ["Nazım hesaplar", "Düzenleyici hesaplar", "Geçici ve ara hesaplar", "Asli hesaplar", "Yardımcı hesaplar"], "a": 2, "e": "Geçici ve ara hesaplarda tamamlanmamış işlemler izlenir; kitap bu gruba yoldaki ve gümrükteki malları örnek verir."}, {"q": "Mülkiyeti işletmeye ait olmadığı halde işletmede bulunan değerler ile koşullu işlemler hangi hesaplarda izlenir?", "o": ["Düzenleyici hesaplar", "Geçici ve ara hesaplar", "Gelir tablosu hesapları", "Ana (kontrol) hesaplar", "Nazım hesaplar"], "a": 4, "e": "Nazım hesaplar mülkiyeti işletmeye ait olmayan değerler ve koşullu işlemler için kullanılır ve genellikle karşılıklı çalışır."}, {"q": "Bilanço esasına göre defter tutan tacir için aşağıdakilerden hangisi tutulması zorunlu defterlerden biri değildir?", "o": ["İşletme hesabı defteri", "Envanter defteri", "Günlük (yevmiye) defter", "Büyük defter", "Defterikebir"], "a": 0, "e": "Bilanço esasında zorunlu defterler envanter defteri, günlük defter ve büyük defterdir (defterikebir). İşletme hesabı defteri ikinci sınıf tüccarların tuttuğu defterdir."}, {"q": "Envanter defterine kayıt sıklığı ile ilgili hangisi doğrudur?", "o": ["Her ticari işlem tarih sırasıyla kaydedilir", "Her ay sonunda mizan buraya kaydedilir", "Yalnızca işletme tasfiye edilirken kayıt yapılır", "İlk kayıt işe başlamada yapılır, sonra her muhasebe döneminde bir kez kayıt yapılır", "Her gün kasa sayımı sonuçları kaydedilir"], "a": 3, "e": "Envanter defterine işe başlarken açılış envanteri ve bilançosu, sonra her dönem sonunda envanter ve bilanço kaydedilir; yani dönemde bir kez kayıt yapılır."}, {"q": "Günlük defterde, borç ve alacak tutarlarının büyük defterde hangi hesaba veya sayfaya aktarıldığını gösteren sütuna uygulamada ne ad verilir?", "o": ["Bağlantı (folyo) sütunu", "Madde sütunu", "Mahsup sütunu", "Nazım sütunu", "Bakiye sütunu"], "a": 0, "e": "Büyük defter numarası sütunu iki defter arasında bağlantıyı kurar ve uygulamada bağlantı veya folyo sütunu olarak anılır."}, {"q": "Aşağıdakilerden hangisi fatura yerine geçen belgelerden biri değildir?", "o": ["Gider pusulası", "Müstahsil makbuzu", "Serbest meslek makbuzu", "Perakende satış belgesi", "Ticari mektup"], "a": 4, "e": "Ticari mektuplar saklanması zorunlu diğer belgeler arasındadır. Gider pusulası, müstahsil makbuzu, serbest meslek makbuzu ve perakende satış belgesi fatura yerine geçer."}, {"q": "Kitaptaki bilgiye göre 2026 yılı için zorunlu fatura düzenleme sınırı kaç TL'dir?", "o": ["3.000 TL", "10.000 TL", "9.900 TL", "15.000 TL", "12.000 TL"], "a": 4, "e": "Kitap 2026 yılı zorunlu fatura düzenleme sınırını 12.000 TL olarak verir. 3.000 TL 2025 e-Arşiv eşiğidir."}, {"q": "Bir kasa tahsil fişinde alıcılardan 20.000 TL, kira geliri olarak 15.000 TL ve personelden alacak tahsili olarak 5.000 TL yazılıdır. Bu fiş kayda alındığında kasa hesabı nasıl etkilenir?", "o": ["Kasa hesabı 40.000 TL alacaklanır", "Kasa hesabı 40.000 TL borçlanır", "Kasa hesabı 20.000 TL borçlanır", "Kasa hesabı 35.000 TL borçlanır", "Kasa hesabı etkilenmez, mahsup fişi gerekir"], "a": 1, "e": "Kasa tahsil fişindeki tutarlar açıklamadaki hesaplara alacak, kasaya borç yazılır: 20.000 + 15.000 + 5.000 = 40.000 TL."}, {"q": "Muhasebe fişleri ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Para hareketi içermeyen işlemler için mahsup fişi kullanılır", "Kasa ödeme fişinde açıklamadaki hesaplar borçlanır", "İşletme hukuku bakımından tutulmaları isteğe bağlıdır", "Fişlerin defterlere geçirilmesi 90 güne kadar geciktirilebilir", "Kasa tahsil ve ödeme fişlerinde tek tutar sütunu bulunur"], "a": 3, "e": "Fişlerin deftere geçirilmesi 45 günden fazla geciktirilemez; VUK genel olarak 10 günlük kayıt süresi öngörür."}, {"q": "Kitaptaki bilgiye göre bilanço esasına göre defter tutmak zorunda olanlar hangi tarihten itibaren e-Defter uygulamasına dahil olmak zorundadır?", "o": ["1 Ocak 2025", "1 Ocak 2024", "1 Ocak 2026", "1 Temmuz 2025", "1 Ocak 2027"], "a": 0, "e": "Sıra No:5 Tebliğ (RG 08/11/2024) ile bilanço esasına göre defter tutanlar 1 Ocak 2025'ten itibaren e-Defter'e dahil edilmiştir."}, {"q": "1 Ocak 2026'dan itibaren ticaret siciline tescil edilecek şirketlerin Elektronik Ticari Defter Sisteminde (ETDS) tutması gereken defterler hangileridir?", "o": ["Yevmiye defteri ile büyük defter", "Envanter defteri ile yevmiye defteri", "Pay defteri ile genel kurul toplantı ve müzakere defteri", "Yönetim kurulu karar defteri ile envanter defteri", "Kasa defteri ile ambar defteri"], "a": 2, "e": "Kitaba göre 1 Ocak 2026'dan itibaren tescil edilecek şirketler pay defteri ile genel kurul toplantı ve müzakere defterini ETDS'de tutar."}, {"q": "Muhasebe Sistemi Uygulama Genel Tebliği hangi tarihte Resmi Gazete'de yayımlanmıştır?", "o": ["13 Haziran 1989", "29 Ocak 1989", "26 Aralık 1992", "26 Aralık 1991", "1 Ocak 1994"], "a": 2, "e": "Tebliğ 26 Aralık 1992 tarihli ve 21447 sayılı Resmi Gazete'nin mükerrer sayısında yayımlanmıştır. 13 Haziran 1989 3568 sayılı Kanunun, 29 Ocak 1989 SPK tebliğinin tarihidir."}, {"q": "Tekdüzen hesap çerçevesinde 8 numaralı hesap sınıfı ile ilgili hangisi doğrudur?", "o": ["Nazım hesaplara ayrılmıştır", "Serbest bırakılmıştır", "Maliyet hesaplarına ayrılmıştır", "Gelir tablosu hesaplarına ayrılmıştır", "Özkaynaklara ayrılmıştır"], "a": 1, "e": "Sınıflar: 1 dönen, 2 duran, 3 kısa vadeli yabancı kaynaklar, 4 uzun vadeli yabancı kaynaklar, 5 özkaynaklar, 6 gelir tablosu, 7 maliyet, 8 serbest, 9 nazım."}, {"q": "Maliyetlerin fonksiyon esasına göre izlendiği ve büyük ve orta ölçekli işletmelere uygun olan seçenek hangisidir?", "o": ["7/B seçeneği", "9/A seçeneği", "6/A seçeneği", "7/A seçeneği", "7/C seçeneği"], "a": 3, "e": "7/A seçeneğinde maliyetler fonksiyon esasına göre izlenir; 7/B seçeneği gider çeşitlerine dayanır ve küçük ölçekli işletmelere uygundur."}]}, {"id": 3, "kisa": "Hazır Değer, MK, Alacaklar", "baslik": "Dönen Varlıklar I: Hazır Değerler, Menkul Kıymetler, Ticari ve Diğer Alacaklar", "ozet": "Kasa, çek ve banka işlemleri, geçici yatırım amaçlı menkul kıymetler, senetli ve senetsiz alacaklar, reeskont ve şüpheli alacak karşılığı.", "notlar": "<h3>Dönen varlıkların kapsamı<\/h3>\n<ul>\n<li>Normal koşullarda <b>bir yıl<\/b> veya işletmenin normal faaliyet dönemi içinde paraya çevrilmesi veya tüketilmesi beklenen varlıklardır; elde ve bankadaki nakit de buradadır.<\/li>\n<li>Hesap grupları: <b>10<\/b> Hazır Değerler, <b>11<\/b> Menkul Kıymetler, <b>12<\/b> Ticari Alacaklar, <b>13<\/b> Diğer Alacaklar, <b>15<\/b> Stoklar, <b>17<\/b> Yıllara Yaygın İnşaat ve Onarım Maliyetleri, <b>18<\/b> Gelecek Aylara Ait Giderler ve Gelir Tahakkukları, <b>19<\/b> Diğer Dönen Varlıklar (14 ve 16 boştur).<\/li>\n<\/ul>\n\n<h3>10 Hazır değerler<\/h3>\n<p>Nakit olarak elde veya bankada bulunan ve istenildiğinde değer kaybına uğramadan paraya çevrilebilen varlıklardır (<b>menkul kıymetler hariç<\/b>).<\/p>\n<table>\n<tr><th>Hesap<\/th><th>Kapsam ve işleyiş<\/th><\/tr>\n<tr><td>100 Kasa<\/td><td>Ulusal ve yabancı paraların TL karşılığı. Tahsilat borç, ödeme ve bankaya yatırma alacak. <b>Daima borç kalanı verir veya sıfırdır; alacak kalanı vermez.<\/b> Yabancı para yoğunsa döviz cinslerine göre yardımcı hesap açılır.<\/td><\/tr>\n<tr><td>101 Alınan Çekler<\/td><td>İşletmeye verilmiş, henüz tahsile verilmemiş veya ciro edilmemiş çekler. Alındığında yazılı değerle borç, tahsil veya ciroda alacak. Yardımcı hesaplar: cüzdandaki, tahsildeki çekler.<\/td><\/tr>\n<tr><td>102 Bankalar<\/td><td>Yurt içi ve yurt dışı bankalara yatırılan ve çekilen paralar. Yatırılan borç; çekilen ve üçüncü kişilerce tahsil edildiği anlaşılan çek ve ödeme emirleri alacak. Kayıtlar her ay banka hesap özetiyle karşılaştırılır.<\/td><\/tr>\n<tr><td>103 Verilen Çekler ve Ödeme Emirleri (−)<\/td><td>İndirim kalemi. Çek veya ödeme emri verildiğinde <b>alacak<\/b>; bankadan tahsil edildiği anlaşılınca 103 borç, 102 alacak.<\/td><\/tr>\n<tr><td>108 Diğer Hazır Değerler<\/td><td>Pullar, vadesi gelmiş kuponlar, tahsil edilecek banka ve posta havaleleri (yoldaki paralar).<\/td><\/tr>\n<\/table>\n<h4>Kasa sayım farkları<\/h4>\n<ul>\n<li>Her akşam kasa sayılır. Fazla: <b>100 Kasa borç / 397 Sayım ve Tesellüm Fazlaları alacak<\/b>. Noksan: <b>197 Sayım ve Tesellüm Noksanları borç / 100 Kasa alacak<\/b>. Sonra nedenleri araştırılır.<\/li>\n<li>Dönem sonunda noksanlar fazlalardan büyükse fark <b>olağandışı gider ve zarar<\/b>, fazlalar büyükse <b>olağandışı gelir ve kâr<\/b> olarak kaydedilir. Normalin üstündeki noksanlar sorumlulara ödetilir.<\/li>\n<\/ul>\n<p><b>Örnek: Kayıtlara göre 80.000 TL olması gereken kasada 86.200 TL sayıldı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>100 Kasa<\/td><td><\/td><td>6.200<\/td><\/tr><tr><td><\/td><td>397 Sayım ve Tesellüm Fazlaları<\/td><td>6.200<\/td><\/tr><\/table>\n<h4>Çek<\/h4>\n<ul>\n<li>Çeki düzenleyen <b>keşideci<\/b>, tutarı almaya yetkili <b>lehtar<\/b>, ödeyen banka <b>muhatap<\/b>. Çek görüldüğünde ödenir; ödenmezse lehtar protesto edebilir.<\/li>\n<li><b>İbraz süreleri (TTK):<\/b> keşide yerinde ödenecekse <b>10 gün<\/b>; başka yerde ödenecekse <b>1 ay<\/b>; başka ülkede keşide edilmişse keşide ve ödeme yeri aynı kıtadaysa <b>1 ay<\/b>, ayrı kıtalardaysa <b>3 ay<\/b>.<\/li>\n<li><b>İleri tarihli çekler<\/b> TTK'daki keşide tarihi hükmüne uymadığı ve özün önceliğine aykırı olduğu için 101 veya 103'te izlenemez; <b>alacak senetleri veya borç senetleri<\/b> hesabında izlenir. Dönem sonunda reeskonta tabi tutulmaları <b>dönemsellik<\/b> gereğidir.<\/li>\n<\/ul>\n<p><b>Alıcıdan çek alınması<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>101 Alınan Çekler<\/td><td><\/td><td>75.000<\/td><\/tr><tr><td><\/td><td>120 Alıcılar<\/td><td>75.000<\/td><\/tr><\/table><p><b>Aynı çekin satıcıya ciro edilmesi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>320 Satıcılar<\/td><td><\/td><td>75.000<\/td><\/tr><tr><td><\/td><td>101 Alınan Çekler<\/td><td>75.000<\/td><\/tr><\/table><p><b>Satıcıya çek keşide edilmesi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>320 Satıcılar<\/td><td><\/td><td>200.000<\/td><\/tr><tr><td><\/td><td>103 Verilen Çekler ve Ödeme Emirleri<\/td><td>200.000<\/td><\/tr><\/table><p><b>Çekin bankadan tahsil edildiğinin öğrenilmesi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>103 Verilen Çekler ve Ödeme Emirleri<\/td><td><\/td><td>200.000<\/td><\/tr><tr><td><\/td><td>102 Bankalar<\/td><td>200.000<\/td><\/tr><\/table>\n<h4>Mevduat faizi<\/h4>\n<ul>\n<li>Faiz geliri <b>menkul sermaye iradıdır<\/b>; banka vergi sorumlusu sıfatıyla stopajı keser. Kesinti <b>193 Peşin Ödenen Vergiler ve Fonlar<\/b> hesabına alınır.<\/li>\n<li>193 yılsonunda: <b>kurumlar vergisi<\/b> mükelleflerinde ödenecek vergiden mahsup edilir; <b>gelir vergisi<\/b> mükelleflerinde 131 Ortaklardan Alacaklar ile karşılaştırılarak kapatılır.<\/li>\n<\/ul>\n<p><b>Örnek: 100.000 TL faiz tahakkuk etti, %15 stopaj kesildi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>102 Bankalar<\/td><td><\/td><td>100.000<\/td><\/tr><tr><td><\/td><td>642 Faiz Gelirleri<\/td><td>100.000<\/td><\/tr><tr><td>193 Peşin Ödenen Vergiler ve Fonlar<\/td><td><\/td><td>15.000<\/td><\/tr><tr><td><\/td><td>102 Bankalar<\/td><td>15.000<\/td><\/tr><\/table>\n<h3>11 Menkul kıymetler<\/h3>\n<ul>\n<li>Atıl fonların <b>kısa vadeli geçici yatırımı<\/b>: hisse senedi, tahvil, hazine bonosu, finansman bonosu, yatırım fonu katılma belgesi, kâr-zarar ortaklığı belgesi, gelir ortaklığı senedi vb.<\/li>\n<li>Hesaplar: <b>110<\/b> Hisse Senetleri, <b>111<\/b> Özel Kesim Tahvil, Senet ve Bonoları, <b>112<\/b> Kamu Kesimi Tahvil, Senet ve Bonoları, <b>118<\/b> Diğer Menkul Kıymetler, <b>119<\/b> Menkul Kıymetler Değer Düşüklüğü Karşılığı (−).<\/li>\n<li>Dönen varlıkta yer alabilmek için menkul kıymetin <b>piyasada sürüm yeteneği<\/b> olmalı ve işletme bunu <b>cari dönemde paraya çevirmeye<\/b> karar vermiş olmalıdır.<\/li>\n<li>Edinildiğinde <b>alış bedeliyle<\/b> borç, elden çıkarıldığında aynı bedelle alacak. <b>Satın alma giderleri (komisyon) maliyete eklenmez<\/b>; 653 Komisyon Giderleri (65 grubu) hesabına yazılır.<\/li>\n<li>Satış kârı <b>645 Menkul Kıymet Satış Kârları<\/b> (64 grubu), satış zararı <b>655 Menkul Kıymet Satış Zararları<\/b> (65 grubu).<\/li>\n<li>Hisse senedi (aksiyon) sahibi ortaktır; kâr payına temettü (dividant) denir, kâr yoksa ödenmez. Tahvil (obligasyon) sahibi alacaklıdır; şirket kâr etsin etmesin faizi öder.<\/li>\n<\/ul>\n<p><b>Örnek: 10.000 adet hisse adedi 12 TL'den alındı, 3.000 TL komisyon ödendi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>110 Hisse Senetleri<\/td><td><\/td><td>120.000<\/td><\/tr><tr><td>653 Komisyon Giderleri<\/td><td><\/td><td>3.000<\/td><\/tr><tr><td><\/td><td>102 Bankalar<\/td><td>123.000<\/td><\/tr><\/table><p><b>Bunların 6.000 adedi 15 TL'den satıldı, 1.500 TL komisyon ödendi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>102 Bankalar<\/td><td><\/td><td>88.500<\/td><\/tr><tr><td>653 Komisyon Giderleri<\/td><td><\/td><td>1.500<\/td><\/tr><tr><td><\/td><td>110 Hisse Senetleri<\/td><td>72.000<\/td><\/tr><tr><td><\/td><td>645 Menkul Kıymet Satış Kârları<\/td><td>18.000<\/td><\/tr><\/table>\n<h4>Temettü ve tahvil işlemleri<\/h4>\n<ul>\n<li>Geçici yatırım amaçlı hisse için genel kurul kararıyla tahakkuk eden temettü: <b>136 Diğer Çeşitli Alacaklar borç / 649 Diğer Olağan Gelir ve Kârlar alacak<\/b>; tahsilde banka komisyonu 653'e yazılır.<\/li>\n<li>Tahviller özel kesim (111) veya kamu kesimi (112) ayrımıyla izlenir. Nominal değerin altında (iskontolu) alım ve <b>işlemiş faiz içeren alım<\/b> doğru kaydedilmezse bilançoda tahvil ve gelir tahakkukları, gelir tablosunda faiz geliri yanlış görünür.<\/li>\n<li>İşlemiş faiz içeren alımda faiz kısmı tahvil maliyetine katılmaz, <b>136 Diğer Çeşitli Alacaklar<\/b>'a alınır; tahsilde yalnız kalan süreye ait faiz 642'ye yazılır.<\/li>\n<li>Faiz kuponu vadesi gelince 108 Diğer Hazır Değerler'e alınabilir; stopaj yine 193'e yazılır.<\/li>\n<\/ul>\n<p><b>Örnek: 1 Temmuz'da çıkarılmış, yıllık %30 faizli 400.000 TL nominal tahvil 1 Ağustos'ta 410.000 TL'ye alındı (1 aylık işlemiş faiz 10.000 TL)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>111 Özel Kesim Tahvil, Senet ve Bonoları<\/td><td><\/td><td>400.000<\/td><\/tr><tr><td>136 Diğer Çeşitli Alacaklar<\/td><td><\/td><td>10.000<\/td><\/tr><tr><td><\/td><td>103 Verilen Çekler ve Ödeme Emirleri<\/td><td>410.000<\/td><\/tr><\/table>\n<h4>119 Menkul kıymetler değer düşüklüğü karşılığı (−)<\/h4>\n<ul>\n<li>Borsa veya piyasa değerinde <b>önemli ölçüde veya sürekli<\/b> azalma olduğunda azalışın tamamı kadar: <b>654 Karşılık Giderleri borç / 119 alacak<\/b> (dönemsellik).<\/li>\n<li>Menkul kıymet elden çıkarılırsa veya değer düşüklüğü gerçekleşmezse karşılık <b>644 Konusu Kalmayan Karşılıklar<\/b>'a aktarılarak kapatılır. Mevcut karşılık devam eden düşüşü karşılamıyorsa fark yeniden 654'e yazılır.<\/li>\n<\/ul>\n<p><b>Örnek: Maliyeti 400.000 TL olan hisselerin borsa değeri 330.000 TL'ye indi<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>654 Karşılık Giderleri<\/td><td><\/td><td>70.000<\/td><\/tr><tr><td><\/td><td>119 Menkul Kıymetler Değer Düşüklüğü Karşılığı<\/td><td>70.000<\/td><\/tr><\/table><p><b>Hisseler sonra 380.000 TL'ye satıldı<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>102 Bankalar<\/td><td><\/td><td>380.000<\/td><\/tr><tr><td>119 Menkul Kıymetler Değer Düşüklüğü Karşılığı<\/td><td><\/td><td>70.000<\/td><\/tr><tr><td><\/td><td>110 Hisse Senetleri<\/td><td>400.000<\/td><\/tr><tr><td><\/td><td>644 Konusu Kalmayan Karşılıklar<\/td><td>50.000<\/td><\/tr><\/table>\n<h3>12 Ticari alacaklar<\/h3>\n<p>Bir yıl içinde paraya dönüşmesi beklenen ve <b>ticari ilişkiden<\/b> doğan senetli ve senetsiz alacaklar. Ana kuruluş, iştirak ve bağlı ortaklıklardan ticari alacaklar ilgili hesapların ayrıntısında gösterilir.<\/p>\n<table>\n<tr><th>Hesap<\/th><th>Kapsam<\/th><\/tr>\n<tr><td>120 Alıcılar<\/td><td>Faaliyet konusu mal ve hizmet satışından doğan <b>senetsiz<\/b> alacaklar (açık hesap). Doğunca borç, tahsilde alacak.<\/td><\/tr>\n<tr><td>121 Alacak Senetleri<\/td><td>Faaliyet konusu satışlardan doğan <b>senede bağlanmış<\/b> alacaklar. Yardımcı hesaplar: cüzdandaki, tahsildeki, iskontodaki, cirodaki, teminattaki, protestolu senetler.<\/td><\/tr>\n<tr><td>122 Alacak Senetleri Reeskontu (−)<\/td><td>Senetlerin bilanço gününde tasarruf değeriyle gösterilmesi için.<\/td><\/tr>\n<tr><td>124 Kazanılmamış Finansal Kiralama Faiz Gelirleri (−)<\/td><td>Kiralama alacağı ile kira ödemelerinin bugünkü değeri farkı. Gerçekleşen faiz finansal kiralama şirketinde 60 grubuna, diğerlerinde 64 grubunda faiz gelirine aktarılır.<\/td><\/tr>\n<tr><td>126 Verilen Depozito ve Teminatlar<\/td><td>Geri alınmak üzere verilen depozito ve teminatlar. Vadesi bir yıldan az olanlar dönen, bir yılı aşanlar duran varlıklarda (226) izlenir.<\/td><\/tr>\n<tr><td>127 Diğer Ticari Alacaklar<\/td><td>Tahsili gecikmiş ama henüz şüpheli olmayan alacaklar ve mal veya hizmet satışı dışındaki ticari işlemlerden doğan senetsiz alacaklar (duran varlık veya menkul kıymetin kredili satışı gibi).<\/td><\/tr>\n<tr><td>128 Şüpheli Ticari Alacaklar<\/td><td>Vadesi geçmiş, birkaç kez uzatılmış veya protesto edilmiş, yazıyla birden fazla istenmiş ya da dava veya icra safhasına geçmiş alacaklar.<\/td><\/tr>\n<tr><td>129 Şüpheli Ticari Alacaklar Karşılığı (−)<\/td><td>Şüpheli alacaklar için ayrılan karşılık; teminatlı alacakta yalnız <b>teminatı aşan kısım<\/b> için.<\/td><\/tr>\n<\/table>\n<h4>Senet türleri<\/h4>\n<ul>\n<li><b>Adi senet:<\/b> Borçlar Kanununa göre düzenlenen, biçime bağlı olmayan senet. <b>Kıymetli evrak:<\/b> TTK'ya göre biçime bağlı; hak senede bağlıdır. Kıymetli evrak = <b>kambiyo senetleri<\/b> (poliçe, bono yani emre muharrer senet, çek) + <b>emtia (mal) senetleri<\/b>.<\/li>\n<\/ul>\n<h4>Alacak senetleriyle ilgili özel durumlar<\/h4>\n<table>\n<tr><th>Durum<\/th><th>Kayıt<\/th><\/tr>\n<tr><td>Cüzdandaki senedin tahsili<\/td><td>100 Kasa / 121 (Cüzdandaki)<\/td><\/tr>\n<tr><td>Tahsil için bankaya gönderme<\/td><td>121 (Tahsildeki) / 121 (Cüzdandaki)<\/td><\/tr>\n<tr><td>Bankanın tahsil etmesi<\/td><td>102 Bankalar + 653 Komisyon Giderleri / 121 (Tahsildeki)<\/td><\/tr>\n<tr><td>İskonto ettirme (senedin satılması)<\/td><td>102 Bankalar + <b>780 Finansman Giderleri<\/b> / 121; ciro sorumluluğu nazım hesaplarda (910 Cirolarımız / 911 Cirolarımızdan Borçlar)<\/td><\/tr>\n<tr><td>Ciro ile borç ödeme veya mal alma<\/td><td>320 veya 153 + 191 / 121; nazım hesaplarda sorumluluk izlenir, vade sonunda ters kayıtla kapatılır<\/td><\/tr>\n<tr><td>Protesto<\/td><td>Senet protestolu senetlere alınır, protesto gideri <b>770 Genel Yönetim Giderleri<\/b>'ne; sonra senet ve gider toplamı <b>127 Diğer Ticari Alacaklar<\/b>'a aktarılır<\/td><\/tr>\n<tr><td>Yenileme<\/td><td>Yeni senet (eski tutar + gecikme faizi) 121 borç; eski senet 121 alacak; faiz <b>642 Faiz Gelirleri<\/b><\/td><\/tr>\n<tr><td>İptal<\/td><td>Alacak açık hesaba döner: 120 Alıcılar / 121<\/td><\/tr>\n<\/table>\n<p><b>Örnek: 250.000 TL'lik bono iskonto ettirildi, iskonto ve giderler 18.000 TL<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>102 Bankalar<\/td><td><\/td><td>232.000<\/td><\/tr><tr><td>780 Finansman Giderleri<\/td><td><\/td><td>18.000<\/td><\/tr><tr><td><\/td><td>121 Alacak Senetleri<\/td><td>250.000<\/td><\/tr><tr><td>910 Nazım Hesaplar (Cirolarımız)<\/td><td><\/td><td>250.000<\/td><\/tr><tr><td><\/td><td>911 Nazım Hesaplar (Cirolarımızdan Borçlar)<\/td><td>250.000<\/td><\/tr><\/table>\n<ul>\n<li>İşletmeler ciro ve iskonto sorumluluğunu muhasebe dışında da izleyebilir; bu durumda nazım ve geçici hesaplara kayıt yapılmaz.<\/li>\n<li><b>Hatır senedi:<\/b> gerçek bir ticari alacağa dayanmadan kredi ihtiyacı için alınan senet (finansman senedi). Alındığında <b>121 / 336 Diğer Çeşitli Borçlar<\/b>; düzenleme, ciro, iskonto ve ödeme giderleri <b>770 Genel Yönetim Giderleri<\/b>. Muhatap banka olup kabul etmişse buna <b>kabul kredisi<\/b> denir. Kayıtlarda \"hatır senedi\" başlığı kullanılmaması tercih edilir.<\/li>\n<li>Depozito veya teminat geri alınamazsa (sözleşmeye uyulmaması, ihaleyi kazanıp işten vazgeçme) tutar <b>689 Diğer Olağandışı Gider ve Zararlar<\/b>'a yazılır.<\/li>\n<\/ul>\n<p><b>Kitap örneği: maliyeti 400.000 TL, birikmiş amortismanı 140.000 TL olan bina kredili 300.000 TL'ye satıldı (KDV %18)<\/b><\/p><table><tr><th>Borç<\/th><th>Alacak<\/th><th>Tutar (TL)<\/th><\/tr><tr><td>127 Diğer Ticari Alacaklar<\/td><td><\/td><td>354.000<\/td><\/tr><tr><td>257 Birikmiş Amortismanlar<\/td><td><\/td><td>140.000<\/td><\/tr><tr><td><\/td><td>252 Binalar<\/td><td>400.000<\/td><\/tr><tr><td><\/td><td>391 Hesaplanan KDV<\/td><td>54.000<\/td><\/tr><tr><td><\/td><td>649 Diğer Olağan Gelir ve Kârlar<\/td><td>40.000<\/td><\/tr><\/table>\n<h3>13 Diğer alacaklar<\/h3>\n<ul>\n<li>Ticari nedene dayanmayan ve en çok bir yıl içinde tahsil edilecek alacaklar: <b>131<\/b> Ortaklardan, <b>132<\/b> İştiraklerden, <b>133<\/b> Bağlı Ortaklıklardan, <b>135<\/b> Personelden, <b>136<\/b> Diğer Çeşitli Alacaklar, <b>137<\/b> Diğer Alacak Senetleri Reesk
