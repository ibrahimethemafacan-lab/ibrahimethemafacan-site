açığa satış yapması yasaktır?", "o": ["İhraççının %5 paya sahip ortağı", "İhraççının yönetim kurulu üyesinin eşi", "Rakip bir şirketin yöneticisi", "İhraççının tedarikçisi", "Bireysel yatırımcı"], "a": 1, "e": "YK üyeleri, üst düzey personel, %10 veya fazla paylı ortaklar, birlikte hareket edenler ve bunların eş ve velayeti altındakiler açığa satış yapamaz."}, {"q": "Ödünç alınan sermaye piyasası araçları karşılığında verilecek özkaynak için asgari oran nedir?", "o": ["Cari değerin %50'si", "Cari değerin %75'i", "Cari değerin %100'ü", "Cari değerin %150'si", "Taraflarca serbestçe belirlenir, alt sınır yoktur"], "a": 2, "e": "Ödünç alan, ödünç alınan araçların cari değerinin %100'ünden az olmamak kaydıyla serbestçe belirlenecek tutarda özkaynak verir."}, {"q": "Yıldız Pazarda takası henüz gerçekleşmemiş pay alımlarından doğan açık takas pozisyonu için müşterinin asgari net varlık oranı nedir?", "o": ["%10", "%20", "%35", "%50", "%100"], "a": 1, "e": "Yıldız Pazarda asgari %20, Ana Pazarda %50, Alt Pazar, YİP ve PÖİP'te %100 net varlık bulunması zorunludur."}, {"q": "Üç ay içinde ikiden fazla takas veya özkaynak tamamlama yükümlülüğünü yerine getirmeyen müşteri için hangisi doğrudur?", "o": ["Aracı kurum 10 iş günü içinde Kurula bildirir", "Aracı kurum 2 iş günü içinde Borsaya bildirir ve kimlik bilgileri Borsaca ilan edilir", "Müşteri 1 yıl işlem yasaklı olur", "Bildirim yükümlülüğü yoktur", "Müşteri Birliğe bildirilir"], "a": 1, "e": "Bu müşteriler 2 iş günü içinde Borsaya bildirilir, kimlik bilgileri ilan edilir ve peşin olmayan emirleri 6 ay süreyle hiçbir aracı kurumca kabul edilmez."}]}, {"id": 9, "kisa": "Kitle Fonlaması", "baslik": "III-35/A.2 Kitle Fonlaması Tebliği: Platformlar, Paya ve Borçlanmaya Dayalı Kitle Fonlaması", "ozet": "Platform kuruluşu ve listeye alınma, ortaklık ve yatırım komitesi şartları, platform yasakları, yatırım sınırları, kampanya süreci, borçlanma aracı koşulları ve fon kullanımı.", "notlar": "<h3>Tanım ve gelişim<\/h3><ul><li><b>Kitle fonlaması<\/b> (SPKn m.35/A): bir projenin veya girişim şirketinin fon ihtiyacı için Kurul esasları dahilinde, <b>SPKn'nin yatırımcı tazmini hükümlerine tabi olmaksızın<\/b>, kitle fonlama platformları aracılığıyla halktan para toplanması.<\/li><li>Pay karşılığı: <b>paya dayalı<\/b>; borçlanma aracı karşılığı: <b>borçlanmaya dayalı<\/b> kitle fonlaması.<\/li><li>Paya Dayalı Kitle Fonlaması Tebliği (III-35/A.1) <b>03.10.2019<\/b>'da yürürlüğe girdi; <b>20.02.2020<\/b>'de SPKn m.35/A'ya borçlanmaya dayalı model eklendi; <b>Kitle Fonlaması Tebliği (III-35/A.2)<\/b> <b>27.10.2021<\/b>'de yürürlüğe girdi ve III-35/A.1'i yürürlükten kaldırdı.<\/li><\/ul><h3>Platformun kuruluşu ve listeye alınma<\/h3><table><tr><th>Kuruluş izni şartları<\/th><th>Listeye alınma şartları<\/th><\/tr><tr><td>Anonim ortaklık; sermayesi asgari <b>15.000.000 TL<\/b> ve tamamı nakden ödenmiş, sermaye ve özsermaye bu tutardan az değil; payların tamamı <b>nama yazılı<\/b>; unvanda “<b>Kitle Fonlama Platformu<\/b>” ibaresi; işletme konusu <b>münhasıran<\/b> paya ve/veya borçlanmaya dayalı kitle fonlamasına aracılık; kurucuların şartları sağlaması; yönetim kurulunun <b>asgari 3 kişi<\/b> olması.<\/td><td>Kuruluş şartlarını kaybetmemek; ortak ve YK üyelerinin şartları sağlaması; en az bir <b>yatırım komitesi<\/b>; iç kontrol ve risk yönetim sistemi ile muhasebe-operasyon birimi; <b>dar yetkili aracı kurumlar için öngörülen<\/b> bilgi sistemleri altyapısı; belge-kayıt ve muhasebe biriminde yeterli personel; <b>MKK ve emanet yetkilisiyle<\/b> sözleşme ve altyapı uyumu; borçlanmaya dayalıda MKK <b>Yatırımcı Risk Takip Sistemi<\/b> ile veri akışı; üyelerin girişimcilerle elektronik iletişim altyapısı; yönetim kurulu kararına bağlanmış yazılı <b>çıkar çatışması politikası<\/b>.<\/td><\/tr><\/table><ul><li>Faaliyet için kuruluş izni yetmez; Kurulca <b>listeye alınmak<\/b> zorunludur.<\/li><li>Önemli etkiye sahip tüzel kişi ortakların önemli etkiye sahip ortakları da kurucu şartlarını taşır. Kurul <b>mesleki sorumluluk sigortası<\/b> zorunlu tutabilir.<\/li><li>SPKn m.74'te <b>26.06.2024<\/b>'te yapılan değişiklikle platformlara <b>Birliğe üyelik<\/b> için başvuru zorunluluğu getirildi. <b>27.2.2026<\/b> tarihli Resmi Gazete'deki 10961 sayılı Kararla platformlar TSPB'nin resmi üyesi oldu; TSPB yönetim kurulu <b>13 üyeye<\/b> çıkarıldı ve platformlara temsil hakkı tanındı.<\/li><li>Kuruluş için öngörülen asgari özsermaye şartı, listeye alınmayı izleyen <b>iki yıl<\/b> boyunca <b>yarısı<\/b> oranında uygulanır.<\/li><li>Platformun paya ve/veya borçlanmaya dayalı faaliyetlerden hangilerine yetkili olduğu internet sitesinde belirtilir.<\/li><\/ul><h3>Kurucu, ortak ve yönetim kurulu şartları<\/h3><ul><li>Müflis olmamak, konkordato veya iflas ertelemesi olmamak; izni iptal edilen kuruluşta sorumluluğu bulunmamak; Kanunda yazılı suçlardan mahkumiyet olmamak; Bankerler KHK'sına göre tasfiye kararı olmamak; kasten işlenen suçtan <b>5 yıl veya daha fazla<\/b> hapis veya sayılan ekonomik ve devlete karşı suçlardan mahkum olmamak; dürüstlük ve itibar; SPKn m.101/1-a uyarınca <b>işlem yasaklı olmamak<\/b>.<\/li><li>Dikkat: Platformların <b>en az bir yönetim kurulu üyesinin<\/b> Bireysel Katılım Sermayesi Yönetmeliğinde tanımlanan <b>bireysel katılım yatırımcısı lisansına<\/b> sahip olması zorunludur.<\/li><\/ul><h3>Dışarıdan hizmet ve ortaklık yapısı<\/h3><ul><li>Münhasıran YK ve yatırım komitesince yapılması gerekenler ile platformun idaresi dışındaki görevler için uzman kuruluşlardan sözleşmeyle hizmet alınabilir; platformun sorumluluğu kalkmaz; karar alma gücü platformda kalır. Kurul konuları sınırlayabilir veya izne bağlayabilir.<\/li><li>Listeye alınma sonrası: doğrudan/dolaylı <b>%10 veya fazla<\/b> payla ortak olma veya bir ortağın payının <b>%10, %20 veya %50<\/b>'yi aşması ya da altına düşmesi <b>Kurul onayına<\/b> tabidir. Dikkat: aracı kurumlardaki %33 eşiği burada <b>yoktur<\/b>.<\/li><li>Yönetim kurulunda temsil imtiyazlı payların devri <b>orana bakılmaksızın<\/b> onaya tabidir; imtiyazlı paya sahip tüzel kişide %10/20/50 aşımı ve %10'dan fazla paylı tüzel kişinin imtiyazlı paylarının devri de onaya tabidir.<\/li><li>Aynı kişinin yönetim kontrolündeki <b>grup içi<\/b> devirler onaya tabi değil; devri izleyen <b>10 iş günü<\/b> içinde bildirilir. Eşiklere ulaşmayan devirler de <b>10 iş günü<\/b> içinde bildirilir.<\/li><li>Ortaklık yapısı şeffaf olmalı ve güncel hali <b>daimi olarak internet sitesinde<\/b> yer almalı. Önemli etkiye sahip tüzel kişi ortak halka açıksa devirler <b>temettü hariç ortaklık hakları<\/b> için Kurul onayına tabidir.<\/li><\/ul><h3>Yatırım komitesi<\/h3><table><tr><th>Genel şartlar<\/th><th>Borçlanmaya dayalıda ilave<\/th><\/tr><tr><td>En az <b>3 üye<\/b>; çoğunluğu finans, girişimcilik, işletmecilik, hukuk, teknoloji, sanayi, ticaret gibi alanlarda <b>en az 5 yıl<\/b> tecrübeli; <b>bir üyesi platform YK üyesi<\/b>; en az bir üyesi <b>SPF Düzey 3<\/b> lisanslı; tüm üyeler kurucu şartlarını sağlar.<\/td><td>En az bir üyesi <b>kredi derecelendirme lisansına<\/b> sahip; çoğunluğu istatistik, risk değerleme ve yönetimi, finansal analiz, derecelendirme veya değerleme alanlarında <b>en az 5 yıl<\/b> tecrübeli.<\/td><\/tr><\/table><ul><li>Şartlar sağlanırsa <b>birden fazla<\/b> komite kurulabilir. Üyelik boşalırsa gerekçesi <b>2 iş günü<\/b> içinde Kurula yazılı bildirilir.<\/li><li>Komite, bilgi formu onayı ile paya dayalıda <b>fizibilite raporu<\/b>, borçlanmaya dayalıda <b>kredibilite raporu<\/b> incelemesi için objektif ölçütler içeren bir <b>değerlendirme politikası<\/b> oluşturur; YK kararıyla internet sitesinde duyurulur.<\/li><li>Bilgi formu <b>üye tamsayısının çoğunluğuyla<\/b> onaylanır; platform daha ağır nisap koyabilir.<\/li><li>Üyeler kendileri, eşleri, alt ve üst soylarının ilişkili olduğu projelerin müzakerelerine katılamaz, oy kullanamaz; girişimcilerden ekonomik menfaat sağlayamaz; değerlendirdikleri kampanyalara hedeflenen fonun <b>%5'inden fazla<\/b> fon sağlayamaz.<\/li><\/ul><h3>Listeden çıkma<\/h3><ul><li>Kuruluş izninden sonra <b>6 ay<\/b> içinde listeye alınmak için başvurmayan platformun hakkı düşer.<\/li><li>Şartlardan birini kaybeden platform bunu <b>2 iş günü<\/b> içinde Kurula bildirir; verilen sürede sağlanmazsa resen listeden çıkarılır.<\/li><li>Listeye alındıktan sonra <b>6 ay<\/b> içinde kampanya yürütülebilecek şekilde faaliyete geçmeyen platform resen listeden çıkarılır.<\/li><li>Aykırılık halinde platformlar ile durdurulan veya izni iptal edilen kalkınma ve yatırım bankaları, katılım bankaları ve geniş yetkili aracı kurumlar listeden çıkarılabilir ya da faaliyetleri yalnız paya veya borca dayalı yürütmeye sınırlanabilir.<\/li><li>Listeden çıkarılan platform karar tarihinden itibaren <b>1 yıl<\/b> yeniden başvuramaz; resen çıkarılanın ortakları 1 yıl başka platformda görev alamaz ve ortak olamaz. Çıkarılan veya başvurusu olumsuz olanlar <b>en geç 3 ay<\/b> içinde sona erme kararı alır veya esas sözleşmesini değiştirir.<\/li><\/ul><h3>Platform faaliyet esasları<\/h3><ul><li>Platformlar münhasıran kitle fonlaması yapar. Aykırılık sayılmayanlar: girişimcilere <b>danışmanlık<\/b>; GSYF kuracak PYŞ'lere ve akredite <b>bireysel katılım yatırımcısı ağlarına<\/b> iştirak; her kampanyaya hedeflenen fonun <b>azami %20<\/b>'sine kadar ve toplamda <b>özkaynaklarının azami %50<\/b>'sine kadar fon sağlama.<\/li><li>Platform ile girişimci arasında yazılı <b>kitle fonlaması sözleşmesi<\/b> zorunludur.<\/li><li>Yükümlülükler: her proje için <b>kampanya sayfası<\/b>; onaylı bilgi formunun yayımı ve önemli gelişmelerin (kâr dağıtımı, borca batıklık, sermaye değişikliği, sektör gelişmeleri, yönetim değişikliği, davalar, konkordato) kampanya süresince ve paya dayalıda kampanya yılını izleyen <b>5 yıl<\/b>, borçlanmaya dayalıda <b>itfanın gerçekleştiği yılı izleyen 5 yıl<\/b> boyunca açık tutulması; fonların <b>emanet yetkilisinde<\/b> bloke edilmesi, fonlanan şirkete aktarılması veya iadesi; MKK'da kaydileştirmeye kadar işlemlerin yapılması; yatırımcı korumaya yönelik tedbirler; gizlilik; emanet yetkilisinin <b>nemalandırıp nemalandırmayacağının<\/b>, ücret ve kesintilerin internet sitesinde ilanı.<\/li><li>Platform başvuruları komiteye sunmadan <b>reddedebilir<\/b>, gerekçesini bildirir. Yayın <b>komite onayıyla<\/b> olur; her ölçüte ilişkin değerlendirme raporu ve varsa üyenin <b>şerhi<\/b> gerekçesiyle kampanya sayfasında yayımlanır. Onay için bilgi formunun tutarlı, anlaşılır ve eksiksiz olduğu tespit edilmelidir.<\/li><li>Fon talebi iletilmeden önce üyenin <b>bilgi formunu okuduğu<\/b> tespit edilir; bilgi formunu girişimci yetkilileri ve <b>yatırım komitesi üyeleri<\/b> imzalar.<\/li><li>İnternet sitesinde <b>anlık<\/b>: hedeflenen ve toplanan tutar, yatırımcı sayısı, kalan süre. Sonuçlar kampanya süresinin bitimini izleyen <b>iş günü<\/b> duyurulur.<\/li><li>Platformlar tanıtımlarında yalnızca <b>kampanyası tamamlanmış<\/b> projeleri kullanabilir. Komite kararına dayanak belgeler kampanya bitiminden itibaren <b>5 yıl<\/b> saklanır.<\/li><li>Altı aylık ve yıllık dönemler itibarıyla gerçekleşen, gerçekleşmeyen ve iptal edilen kampanya sayıları ile toplam fon tutarı raporu dönem sonunu izleyen <b>30 gün<\/b> içinde Kurula iletilir ve sitede duyurulur.<\/li><li>Geniş yetkili aracı kurumlar hariç platformlar yıllık finansal tablo ve faaliyet raporlarını takvim yılını izleyen <b>dördüncü ayın sonuna<\/b> kadar Kurula gönderir ve duyurur.<\/li><\/ul><h4>Platformların yapamayacakları<\/h4><ol><li>Yalnızca paya dayalı faaliyet yürütenler kredi veya ödünç para verme işlerine aracılık edemez ve pay dışında araç karşılığı fonlama yapamaz (kalkınma-yatırım ve katılım bankalarına özel hükümler saklı).<\/li><li><b>Gayrimenkul<\/b> ve gayrimenkule dayalı hakların alım satımı, gayrimenkul projesi geliştirme ve <b>diğer şirketlere yatırım<\/b> amaçlı projeler fonlanamaz.<\/li><li>Yurt dışında yerleşiklere Türkiye'den fon toplanması amacıyla kampanya yürütülemez.<\/li><li>Projeler hakkında <b>yatırım tavsiyesi<\/b> niteliğinde değerlendirme yapılamaz.<\/li><li>Kampanyası süren projelerin ticari ürün/hizmet reklamları yayımlanamaz (tanıtıcı bilgi ve yönlendirme hariç).<\/li><li>Kendisinin; sermayesinin <b>%20 veya fazlasına<\/b> veya YK imtiyazına sahip olduğu girişimlerin; ortakları, YK ve komite üyeleri ile eş, alt ve üst soylarının <b>%20 veya fazla<\/b> sahip olduğu girişimlerin kampanyası yürütülemez.<\/li><li>Geniş yetkili aracı kurumlar hariç platformlar <b>ikincil piyasa<\/b> işlemlerine aracılık edemez; üyelerin site üzerinden iletişimi aykırılık değildir.<\/li><\/ol><ul><li>Yurt dışı platformlar: tanıtım-pazarlama yoksa Türkiye'de yerleşiklerin kendi katılımları kapsam dışı; Türkiye'de iş yeri, Türkçe site veya tanıtım-pazarlama varsa Tebliğ uygulanır.<\/li><\/ul><h3>Platforma üyelik<\/h3><ul><li>Yatırımcılar platforma <b>elektronik ortamda üye<\/b> olmak zorundadır.<\/li><li>Türkiye'de yerleşiklerde e-Devlet kimlik doğrulaması ve bilgilerin MKK'ya iletilmesi; yerleşik olmayanlarda MKK hesabı ve sicil tanımlamasının tespiti.<\/li><li>Üyelik sözleşmesi; “<b>Kitle Fonlaması Faaliyetleri Genel Risk Bildirim Formu<\/b>”nun okunup anlaşıldığına dair yazılı veya elektronik beyan.<\/li><li>Üyenin riskleri anlayacak bilgi ve tecrübede olduğu, <b>yatırımının tamamını kaybedebileceğini<\/b> ve payların/borçlanma araçlarının <b>devir imkanının kısıtlı<\/b> olabileceğini anladığı tespit edilir; uygun olmayanların başvurusu <b>reddedilir<\/b>.<\/li><li>Nitelikli yatırımcı üyeliğinden önce MKK nezdinde nitelikli yatırımcılık tespiti; varsa yıllık net gelir beyanı derhal MKK'ya; risk bilgilerinin toplanması ve paylaşılmasına <b>açık rıza<\/b>.<\/li><\/ul><h3>Paya dayalı kitle fonlaması<\/h3><ul><li><b>Yatırım sınırı<\/b>: nitelikli olmayan gerçek kişi bir takvim yılında azami <b>500.000 TL<\/b>; bu sınır <b>2.000.000 TL'yi aşmamak<\/b> kaydıyla beyan edilen <b>yıllık net gelirin %10'u<\/b> olarak uygulanabilir. Kontrolü MKK, en son beyana göre yapar.<\/li><li>Fonlar aktarılmadan önce girişimci yeni <b>anonim şirket<\/b> kurmuş veya limited şirket anonime dönüşmüş olmalı; fonlar yalnızca <b>sermaye artırımıyla<\/b> çıkarılacak paylar karşılığında aktarılır. Dikkat: <b>mevcut payların satışıyla fon toplanamaz<\/b>; fonların tamamı <b>nakden<\/b> ödenir.<\/li><li>Haklar ve imtiyazlar bilgi formunda açıklanır; nitelikli yatırımcılar hariç yatırımcılara verilen paylar arasında <b>imtiyaz farkı yaratılamaz<\/b>.<\/li><li>Bir girişim herhangi bir <b>12 aylık<\/b> dönemde paya dayalı olarak <b>en fazla iki kampanya<\/b> yürütebilir; toplanan tutar Kurulca izahname muafiyeti için her yıl Kurul Bülteniyle ilan edilen <b>ihraç sınırını<\/b> geçemez (çalışma notunda 2026 için “142.500 TL” olarak yazılmıştır). Bilgi formunda açıklanmak ve sınırı aşmamak kaydıyla hedeflenen fonun <b>%20<\/b>'sine kadar <b>ek fon<\/b> toplanabilir. Bir proje için 12 ayda paya ve/veya borca dayalı toplam da bu sınırı geçemez.<\/li><li><b>9.000.000 TL'yi aşan<\/b> fon taleplerinde hedefin <b>en az %5<\/b>'i kampanya süresinde <b>nitelikli yatırımcılarca<\/b> karşılanmalıdır (ek fon için aranmaz). Nitelikli yatırımcı tahsisat oranı belirlenebilir; kontroller MKK'dadır.<\/li><li>Kampanya başlangıcındaki ortaklardan fonlanan şirkette önemli etkiye sahip olacaklar <b>3 yıl<\/b> boyunca paylarını devredemez (miras, mal rejimi, cebri icra ile nitelikli yatırımcılara veya kendi aralarındaki devirler hariç).<\/li><li>Bilgi formunda: artırım öncesi sermayenin nominali, yatırımcılara verilecek payların nominali ve <b>beher pay satış fiyatı<\/b>.<\/li><\/ul><h4>Kampanya süreci (paya ve borca dayalı ortak hatlar)<\/h4><ul><li>Kampanya süreci platforma <b>başvuru anında<\/b> başlar; süreç bitmeden aynı girişimci yeni kampanya başlatamaz. İstisna: paya dayalı kampanya sürerken aynı proje için <b>eş zamanlı borçlanmaya dayalı<\/b> kampanya yürütülebilir (ve tersi); birinde hedefe ulaşılamazsa diğeri de sonlandırılır.<\/li><li><b>Kampanya süresi<\/b> onaylı bilgi formunun yayımıyla başlar ve <b>60 günü geçemez<\/b>. Talepler ve ödeme emirleri kimlik bilgileriyle uyumlu ödeme aracıyla eş zamanlı verilir; platform talepleri <b>anlık<\/b> olarak MKK'ya ve emanet yetkilisine iletir.<\/li><li><b>Cayma hakkı<\/b>: ödeme emrinden itibaren <b>48 saat<\/b> içinde gerekçesiz; emanet yetkilisi bildirimden sonraki iş günü iade işlemini yapar.<\/li><li>Hedefe süre bitmeden ulaşılırsa, tüm yatırımcıların cayma süreleri dolmuşsa kampanya <b>erken sonlandırılabilir<\/b>; fazla toplanan tutar bilgi formundaki dağıtım esaslarına göre eşitsizlik yaratmadan iade edilir.<\/li><li>Hedefe ulaşılamazsa sürenin bitimini izleyen iş günü platform bildirir, ertesi iş günü emanet yetkilisi tutarları ve nemayı <b>iade<\/b> eder. Listeden çıkarılan platformdaki kampanyalar sona ermiş sayılır.<\/li><li>Kampanya süresinde bilgi formunda değişiklik gerekirse girişimci derhal platforma bildirir; komite <b>2 iş günü<\/b> içinde onaylar ve yayımlanır; talep iletmiş üyeler eş anlı bilgilendirilir; onaydan önce ödeme emri verenler için <b>cayma süresi yeniden başlar<\/b>; komite kampanyayı iptal edebilir.<\/li><\/ul><h4>Paya dayalıda kampanya sonrası<\/h4><ul><li><b>Girişimci<\/b>: süre bitiminden itibaren <b>90 gün<\/b> içinde anonim şirket kurulur; fon şirketin bloke hesabına aktarılır ve tescilden itibaren <b>30 iş günü<\/b> içinde toplanan tutar kadar <b>sermaye artırımı<\/b> yapılır. TTK m.332'deki asgari sermaye bloke tutardan girişimciler lehine ödenerek şirket kurulabilir; bu halde artırım kuruluştan sonra <b>en geç 2 iş günü<\/b> içinde TTK m.416'ya göre <b>çağrısız genel kurulda<\/b> tamamlanır; zararlardan platform ve girişimci <b>müteselsilen<\/b> sorumludur.<\/li><li>Proje ve malvarlığı unsurları <b>ayni sermaye<\/b> olarak konabilir; konmazsa bedeli sermayenin <b>binde birini<\/b> aşmamak kaydıyla kuruluştan sonra en geç <b>30 iş günü<\/b> içinde şirkete devredilir.<\/li><li><b>Girişim şirketi<\/b> anonim şirketse: süre bitiminden itibaren <b>30 iş günü<\/b> içinde sermaye artırımı. Limited şirketse: <b>90 gün<\/b> içinde anonime dönüşüm, özkaynak kalemlerinin ayrı gösterildiğine dair <b>mali müşavir raporu<\/b>nun kampanya sayfasında ilanı ve dönüşümden itibaren 30 iş günü içinde artırım.<\/li><li>Artırımdan sonra platform yatırımcı bazındaki bilgileri <b>2 iş günü<\/b> içinde MKK'ya iletir; tüm paylar MKK'da kayden oluşturulur. Fonun şirkete tevdiiyle kampanya süreci sona erer. Süreler kaçırılırsa fon ve neması iade edilir.<\/li><\/ul><h3>Borçlanmaya dayalı kitle fonlaması<\/h3><ul><li><b>Yatırım sınırı<\/b>: nitelikli olmayan gerçek kişi yılda azami <b>500.000 TL<\/b> (2.000.000 TL'yi aşmamak kaydıyla yıllık net gelirin %10'u); ayrıca <b>bir projeye azami 200.000 TL<\/b>.<\/li><li>Borçlanma aracı satışı dışında borç sözleşmesiyle veya başka araç karşılığı yürütülemez; fonların tamamı nakden ödenir.<\/li><li>Komite kredibilite raporunda şirketin <b>geri ödemeleri düzenli yapıp yapamayacağını<\/b> değerlendirir. Faiz, vade, ödeme koşulları komite ve girişimcice belirlenir ve bilgi formunda yer alır. Satış eşitsizlik yaratmadan yapılır; bilgi formundaki orandan <b>daha düşük oranla<\/b> fon toplanamaz.<\/li><li><b>Faiz sınırı<\/b>: vadeye en yakın, biri kısa biri uzun vadeli iki DİBS'in kampanya başlangıcından bir gün önceki faizlerinin ağırlıklı ortalamasının <b>%50 fazlasını<\/b> aşamaz. <b>Vade en fazla 5 yıl.<\/b> Geri ödeme vade tarihinde <b>tek seferde<\/b> yapılamaz.<\/li><\/ul><table><tr><th>Vade<\/th><th>Vadeden önceki son dönemde ödenebilecek azami kısım<\/th><\/tr><tr><td>1–2 yıl<\/td><td>Son <b>3 ay<\/b> içinde en fazla <b>%15<\/b><\/td><\/tr><tr><td>2–3 yıl<\/td><td>Son <b>6 ay<\/b> içinde en fazla <b>%25<\/b><\/td><\/tr><tr><td>3–4 yıl<\/td><td>Son <b>1 yıl<\/b> içinde en fazla <b>%30<\/b><\/td><\/tr><tr><td>4–5 yıl<\/td><td>Son <b>1 yıl<\/b> içinde en fazla <b>%25<\/b><\/td><\/tr><\/table><ul><li>12 ayda en fazla <b>iki kampanya<\/b> ve ihraç sınırı; ayrıca toplanacak tutar, kredibilite raporundaki gelecek nakit akımlarının rapor tarihindeki <b>bugünkü değerinin %50<\/b>'sinden fazla olamaz (indirgenmiş değer platformca MKK'ya bildirilir).<\/li><li>Platformlar kampanyalara ilişkin <b>temerrüt oranları<\/b> ile faiz/getiri oranlarını ana sayfada “<b>Temerrüt ve Faiz/Getiri Oranları<\/b>” başlığıyla sürekli duyurur; kendi verisi yoksa yurt dışında yetkili <b>iki farklı platformun<\/b> verilerini duyurur.<\/li><li>Kurulun borçlanma aracı ihracı, sahipleri kurulu ve teminat yöneticisi düzenlemeleri <b>uygulanmaz<\/b>.<\/li><li>Bilgi formunda öngörülürse geri ödeme, yatırımcının rızasıyla <b>fonlanan şirketin payı<\/b> verilerek yapılabilir; nakit ya da pay seçimi hakkı <b>yatırımcıya<\/b> aittir.<\/li><li>Kampanya sonrası: girişimci <b>90 gün<\/b> içinde anonim şirket kurar, fon şirketin bloke hesabına aktarılır; proje hakları en geç 30 iş günü içinde devredilir. Limited girişim şirketinde 90 gün içinde dönüşüm ve mali müşavir raporu.<\/li><\/ul><h3>Fon kullanımı ve girişim şirketleri<\/h3><table><tr><th>Konu<\/th><th>Paya dayalı<\/th><th>Borçlanmaya dayalı<\/th><\/tr><tr><td>Fon kullanım raporu<\/td><td>Kampanya başında sayfada yayımlanır<\/td><td>Kampanya başında sayfada yayımlanır<\/td><\/tr><tr><td>Dönemsel bilgi<\/td><td>Fonların tamamı kullanılıncaya kadar <b>altı aylık<\/b> dönemlerle ve bitişte<\/td><td>Fonların tamamı kullanıldığında<\/td><\/tr><tr><td>Kullanım denetimi<\/td><td>Listedeki <b>bağımsız denetim kuruluşunun<\/b> özel amaçlı raporu<\/td><td><b>Yatırım komitesinin<\/b> denetim raporu<\/td><\/tr><tr><td>Kısıt<\/td><td>Projeden kaynaklanmayan veya diğer borçların ödenmesinde kullanılamaz<\/td><td>Proje gelirleri önce kitle fonlaması yatırımcılarına ödenir; başka projelerin borçlarında kullanılamaz; projenin işletme sermayesi için fon toplanabilir<\/td><\/tr><\/table><ul><li>Fonların amacına uygun kullanılmasından <b>fonlanan şirketin yönetim kurulu<\/b> sorumludur. Amaca aykırılık bildirilirse Kurul 5237 sayılı TCK çerçevesinde <b>suç ihbarında<\/b> bulunabilir.<\/li><li>Girişim şirketleri <b>teknoloji ve/veya üretim<\/b> faaliyetinde bulunmalı, tescilli ve düzenli izlenen internet sitesine sahip olmalı ve II-16.1 Tebliğinin m.8'indeki finansal tablo eşiklerini aşmamalıdır.<\/li><li>Paya dayalı fon toplayamayanlar: <b>halka açık ortaklıklar<\/b> ile halka açık ortaklıklar ve sermaye piyasası kurumlarının önemli etkiye sahip ortak olduğu şirketler. Borçlanmaya dayalı toplayamayanlar: halka açık ortaklıklar, <b>itfa edilmemiş borçlanma aracı<\/b> bulunan ihraççılar ve bunlar ile halka açık ortaklıklar ve SP kurumlarının önemli etkiye sahip ortak olduğu şirketler.<\/li><li>Borçlanmaya dayalı platformlar etkin ve şeffaf <b>kredi derecelendirme sistemi ve politikası<\/b> kurar; şirketin niteliği, geçmiş faaliyetleri, geri ödeme performansı, fon büyüklüğü, sektör ve teminat yapısını dikkate alır; <b>kredi skoru<\/b> hesaplanıp kredibilite raporuyla komiteye sunulur.<\/li><li>Paylar ve borçlanma araçları <b>MKK<\/b>'da kayden oluşturulur; kaydileştirme fonlar şirket hesabına aktarılmadan önce tamamlanır.<\/li><li>Kamuya açıklama: fesih, konkordato, iflas, tasfiye, yönetim kontrolünün değişmesi, borçlanmaya dayalıda temerrüde düşülen kampanya sayısı ve tutarı; ortaya çıkmasından itibaren <b>2 iş günü<\/b> içinde.<\/li><\/ul>", "sorular": [{"q": "Kitle fonlama platformlarının kuruluşu için aranan asgari sermaye tutarı nedir?", "o": ["5.000.000 TL", "10.000.000 TL", "45.000.000 TL", "50.000.000 TL", "15.000.000 TL"], "a": 4, "e": "Platformun sermayesinin asgari 15.000.000 TL tutarında ve tamamının nakden ödenmiş olması zorunludur."}, {"q": "Kitle fonlama platformları için kuruluşta öngörülen asgari özsermaye şartı listeye alınmayı izleyen iki yıl boyunca nasıl uygulanır?", "o": ["Tamamı uygulanır", "Yarısı oranında uygulanır", "Uygulanmaz", "İki katı uygulanır", "Dörtte biri uygulanır"], "a": 1, "e": "Kuruluş için belirlenen asgari özsermaye şartı listeye alınmayı takip eden iki yıl süresince yarısı oranında uygulanır."}, {"q": "Kitle fonlama platformlarının yönetim kurulu üyelerinden en az birinin sahip olması gereken lisans hangisidir?", "o": ["SPF Düzey 3", "Türev Araçlar", "Bireysel katılım yatırımcısı lisansı", "Kredi derecelendirme lisansı", "Kurumsal yönetim derecelendirme lisansı"], "a": 2, "e": "Platformların en az bir YK üyesinin Bireysel Katılım Sermayesi Yönetmeliği'nde tanımlanan bireysel katılım yatırımcısı lisansına sahip olması zorunludur."}, {"q": "Kitle fonlama platformlarında ortaklık yapısı değişikliğine ilişkin Kurul onayı gerektiren eşikler hangileridir?", "o": ["%5, %10, %25", "%10, %20, %33, %50", "%10, %20, %50", "%25, %50, %75", "%20, %50"], "a": 2, "e": "Platformlarda %10 ile ortak olma ve %10, %20 veya %50 eşiklerinin aşılması ya da altına düşülmesi Kurul onayına tabidir; aracı kurumlardaki %33 eşiği yoktur."}, {"q": "Yatırım komitesine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["En az 3 üyeden oluşur", "Üyelerden biri platform YK üyesidir", "En az bir üye SPF Düzey 3 lisanslıdır", "Bilgi formu üye tamsayısının çoğunluğuyla onaylanır", "Üyeler değerlendirdikleri kampanyaya sınırsız fon sağlayabilir"], "a": 4, "e": "Yatırım komitesi üyeleri değerlendirdikleri kampanyalara hedeflenen fon tutarının %5'inden fazla fon sağlayamaz."}, {"q": "Borçlanmaya dayalı kitle fonlaması yürüten platformun yatırım komitesinde genel şartlara ek olarak en az bir üyede aranan lisans hangisidir?", "o": ["Kredi derecelendirme lisansı", "Türev Araçlar lisansı", "SPF Düzey 2", "Gayrimenkul değerleme lisansı", "Bireysel katılım yatırımcısı lisansı"], "a": 0, "e": "Borçlanmaya dayalıda en az bir üyenin kredi derecelendirme lisansına sahip olması ve çoğunluğun ilgili alanlarda 5 yıl tecrübeli olması gerekir."}, {"q": "Kurul tarafından listeye alındıktan sonra kaç ay içinde faaliyete geçmeyen platform resen listeden çıkarılır?", "o": ["3", "6", "9", "12", "24"], "a": 1, "e": "Listeye alınmayı takiben 6 ay içinde kampanya sürecini fiilen yürütebilecek şekilde faaliyete geçmeyen platform resen listeden çıkarılır."}, {"q": "Listeden çıkarılan bir platform hangi süre boyunca yeniden listeye alınmak için başvuramaz?", "o": ["3 ay", "6 ay", "1 yıl", "2 yıl", "5 yıl"], "a": 2, "e": "Listeden çıkarılan platformlar karar tarihinden itibaren bir yıl süreyle yeniden listeye alınmak için başvuramaz."}, {"q": "Bir platform kendi yürüttüğü kampanyalara toplamda en fazla ne kadar fon sağlayabilir?", "o": ["Hedeflenen fonun %5'i; özkaynağın %10'u", "Her kampanyada hedefin azami %20'si; toplamda özkaynaklarının azami %50'si", "Her kampanyada hedefin %50'si; sınırsız", "Hiç fon sağlayamaz", "Her kampanyada hedefin %10'u; toplamda özkaynağın %25'i"], "a": 1, "e": "Platformlar her kampanyaya hedeflenen fonun azami %20'sine kadar, toplamda özkaynaklarının azami %50'sine kadar fon sağlayabilir."}, {"q": "Aşağıdaki projelerden hangisi için kitle fonlaması faaliyeti yürütülemez?", "o": ["Yazılım geliştiren teknoloji girişimi", "Medikal cihaz üreten şirket", "Gayrimenkul projesi geliştirme", "Tarım teknolojisi üretimi", "Yenilenebilir enerji ekipmanı üretimi"], "a": 2, "e": "Gayrimenkul ve gayrimenkule dayalı hakların alım satımı, gayrimenkul projesi geliştirme ve diğer şirketlere yatırım amaçlı projeler için kitle fonlaması yürütülemez."}, {"q": "Bir platform, ortaklarının sermayesinin hangi oranda veya daha fazlasına sahip olduğu girişim şirketlerinin kampanyasını yürütemez?", "o": ["%5", "%10", "%20", "%25", "%50"], "a": 2, "e": "Ortaklar, YK ve komite üyeleri ile eş, alt ve üst soylarının %20 veya daha fazlasına sahip olduğu girişimlerin kampanyası yürütülemez."}, {"q": "Nitelikli yatırımcı olmayan ve yıllık net gelir beyanı bulunmayan bir gerçek kişi bir takvim yılında paya dayalı kitle fonlamasıyla en fazla ne kadar yatırım yapabilir?", "o": ["200.000 TL", "500.000 TL", "1.000.000 TL", "2.000.000 TL", "Sınırsız"], "a": 1, "e": "Nitelikli olmayan gerçek kişiler bir takvim yılında azami 500.000 TL yatırım yapabilir; bu sınır 2 milyon TL'yi aşmamak kaydıyla beyan edilen yıllık net gelirin %10'u olarak uygulanabilir."}, {"q": "Yıllık net geliri 15.000.000 TL olduğunu beyan eden nitelikli olmayan bir yatırımcının yıllık paya dayalı kitle fonlaması yatırım sınırı ne olur?", "o": ["500.000 TL", "1.000.000 TL", "1.500.000 TL", "2.000.000 TL", "15.000.000 TL"], "a": 2, "e": "Yıllık net gelirin %10'u 1.500.000 TL'dir ve 2.000.000 TL tavanını aşmadığından bu tutar uygulanabilir."}, {"q": "Paya dayalı kitle fonlamasına ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Girişim şirketinin mevcut paylarının satışıyla fon toplanabilir", "Fonlar yalnızca sermaye artırımı yoluyla çıkarılacak paylar karşılığında aktarılır", "Tüm yatırımcılara farklı imtiyazlı paylar verilebilir", "Ayni sermaye ile ödeme yapılabilir", "Fon 12 ayda sınırsız kampanyayla toplanabilir"], "a": 1, "e": "Mevcut payların satışıyla fon toplanamaz; fonlar nakden ödenir ve yalnızca sermaye artırımıyla çıkarılacak paylar karşılığında aktarılır."}, {"q": "9.000.000 TL'yi aşan paya dayalı fon taleplerinde hedeflenen fonun toplanmış sayılması için aranan şart nedir?", "o": ["Hedefin en az %5'inin nitelikli yatırımcılarca karşılanması", "Hedefin en az %20'sinin platformca karşılanması", "Kampanya süresinin 90 gün olması", "Fonun tamamının kurumsal yatırımcılardan toplanması", "Kurul onayı alınması"], "a": 0, "e": "9 milyon TL'yi aşan taleplerde hedeflenen fonun en az %5'inin kampanya süresinde nitelikli yatırımcılarca karşılanması zorunludur; bu şart ek fon için aranmaz."}, {"q": "Paya dayalı kitle fonlamasında kampanya süresi en fazla ne kadar olabilir?", "o": ["60 gün", "30 gün", "45 gün", "90 gün", "120 gün"], "a": 0, "e": "Kampanya süresi onaylı bilgi formunun kampanya sayfasında yayımlandığı tarihte başlar ve altmış günü geçemez."}, {"q": "Kitle fonlamasında yatırımcının cayma hakkını kullanabileceği süre nedir?", "o": ["Ödeme emrinden itibaren 24 saat", "Ödeme emrinden itibaren 48 saat", "Kampanya sonuna kadar", "7 gün", "14 gün"], "a": 1, "e": "Yatırımcılar ödeme emrinin verildiği andan itibaren 48 saat içinde hiçbir gerekçe göstermeksizin cayma hakkını kullanabilir."}, {"q": "Girişimci tarafından yürütülen ve hedefe ulaşan paya dayalı kampanyada anonim şirket en geç ne zamana kadar kurulmalıdır?", "o": ["Kampanya bitimini izleyen 30 gün", "Kampanya bitimini izleyen 60 gün", "Kampanya bitimini izleyen 6 ay", "Kampanya bitimini izleyen 90 gün", "Kampanya başlamadan önce"], "a": 3, "e": "Kampanya süresinin sona ermesini takip eden doksan gün içinde anonim şirket kurulması zorunludur; tescili izleyen 30 iş günü içinde sermaye artırımı yapılır."}, {"q": "Kampanya başlangıcında girişim şirketinin ortağı olup fonlanan şirkette önemli etkiye sahip olacak kişiler paylarını kural olarak ne kadar süre devredemez?", "o": ["1 yıl", "2 yıl", "5 yıl", "Süre sınırı yoktur", "3 yıl"], "a": 4, "e": "Bu kişiler kampanya başlangıcını izleyen 3 yıl içinde miras, mal rejimi, cebri icra ve nitelikli yatırımcılara veya kendi aralarındaki devirler hariç paylarını devredemez."}, {"q": "Borçlanmaya dayalı kitle fonlamasında nitelikli olmayan gerçek kişinin bir projeye yapabileceği azami yatırım ne kadardır?", "o": ["100.000 TL", "200.000 TL", "500.000 TL", "1.000.000 TL", "2.000.000 TL"], "a": 1, "e": "Nitelikli olmayan gerçek kişiler bir projeye azami 200.000 TL, bir takvim yılında toplam azami 500.000 TL yatırım yapabilir."}, {"q": "Borçlanmaya dayalı kitle fonlamasında çıkarılacak borçlanma aracının vadesi en fazla ne kadar olabilir?", "o": ["1 yıl", "2 yıl", "3 yıl", "5 yıl", "10 yıl"], "a": 3, "e": "Borçlanma aracının vadesi 5 yıldan fazla olamaz ve geri ödeme vade tarihinde tek seferde yapılamaz."}, {"q": "Vadesi 3 ile 4 yıl arasında olan borçlanma araçlarında vade tarihinden önceki son bir yıl içinde geri ödeme yükümlülüklerinin en fazla ne kadarı yapılabilir?", "o": ["%30", "%15", "%25", "%50", "%100"], "a": 0, "e": "Vadesi üç yıldan dört yıla kadar olanlarda son bir yıl içinde geri ödeme yükümlülüklerinin en fazla %30'u yapılabilir."}, {"q": "Borçlanmaya dayalı kitle fonlamasında belirlenebilecek azami faiz oranı nasıl hesaplanır?", "o": ["TCMB politika faizinin iki katı", "Vadeye en yakın iki DİBS faizinin ağırlıklı ortalamasının %50 fazlası", "Mevduat faizinin %50 fazlası", "Platformun serbestçe belirlediği oran", "DİBS faizinin %20 fazlası"], "a": 1, "e": "Faiz oranı, vadesi borçlanma aracından biri kısa biri uzun olan iki DİBS faizinin ağırlıklı ortalamasının %50 fazlasını aşamaz."}, {"q": "Borçlanmaya dayalı kitle fonlamasında toplanan fonların bilgi formuna uygun kullanılıp kullanılmadığını kim denetler?", "o": ["Bağımsız denetim kuruluşu", "Yatırım komitesi", "Kurul", "MKK", "Emanet yetkilisi"], "a": 1, "e": "Borçlanmaya dayalıda fon kullanımının kontrolü ve denetimi yatırım komitesince denetim raporu hazırlanarak yapılır; paya dayalıda ise bağımsız denetim kuruluşu özel amaçlı rapor hazırlar."}, {"q": "Kampanya süresi içinde bilgi formunda değişiklik yapılması gerektiğinde değişiklik yatırım komitesince ne kadar süre içinde onaylanmalıdır?", "o": ["Aynı gün", "Bildirim tarihinden itibaren 2 iş günü", "5 iş günü", "10 iş günü", "Kampanya sonunda"], "a": 1, "e": "Değişiklik bildirim tarihinden itibaren iki iş günü içinde komitece onaylanıp derhal yayımlanır; onaydan önce ödeme emri verenler için cayma süresi yeniden başlar."}]}];
const P={"1": ["Merhaba, Yatırım Kuruluşları dersinin ilk bölümündeyiz. Bugün Yatırım Hizmetleri Tebliğinin, yani Roma rakamıyla üç, otuz yedi nokta bir sayılı tebliğin ilk yarısını konuşacağız: yatırım hizmetlerinin listesi, izin ve bildirim ayrımı, aracı kurumların grupları ve alım satıma aracılığın üç türü. Bu bölüm sınavda çok soru üretiyor, çünkü kim neyi yapabilir sorusuna dayanıyor.", "Önce yatırım kuruluşu kavramı. Yatırım kuruluşu; aracı kurumlar, bankalar ve kuruluş esasları Kurulca belirlenecek diğer sermaye piyasası kurumlarıdır. Burada sık düşülen tuzak şu: portföy yönetim şirketleri bazı yatırım hizmetlerini sunabilse de yatırım kuruluşu sayılmaz. Kolektif yatırım kuruluşları da sayılmaz.", "Yatırım hizmetleri listesinde emir iletimine aracılık, işlem aracılığı, portföy aracılığı, bireysel portföy yöneticiliği, yatırım danışmanlığı, aracılık yüklenimi, en iyi gayret aracılığı, çok taraflı alım satım sistemlerinin işletilmesi ve saklama var. Kanundaki portföy yöneticiliği tebliğde bireysel portföy yöneticiliği olarak düzenlenmiş; portföy saklaması ise bu tebliğde değil, ayrı bir tebliğde. Çok taraflı alım satım sistemleri için de tebliğde ayrıntılı düzenleme yok, bunu da aklında tut.", "İzin ve bildirim ayrımı çok net: yatırım hizmetleri Kurul iznine tabi, yan hizmetler ise izne değil bildirime tabi. Bildirimden sonra yirmi iş günü içinde Kurul aksi görüş bildirmezse yan hizmete başlanabilir. Bir de istisna var: kuruluşun müşterisi olmayan taraflarla, hizmet sunma amacı olmaksızın kendi portföyü için yaptığı işlemler izne tabi değil.", "Şimdi aracı kurum grupları. Dar yetkili aracı kurum emir iletimine aracılık ve yatırım danışmanlığı yapar. Kısmi yetkili; işlem aracılığı, en iyi gayret aracılığı, sınırlı saklama ve portföy yöneticiliği yapar. Geniş yetkili ise portföy aracılığı, genel saklama ve aracılık yüklenimi yapar. Akılda tutmak için şöyle düşün: kurumun kendi bilançosunu riske soktuğu her şey, yani karşı taraf olmak, yüklenim yapmak ve başkalarının müşterilerini saklamak, geniş yetkide.", "İki bin yirmi altı için asgari özsermayeler: dar yetkili için kırk beş milyon, kısmi yetkili için yüz doksan milyon, geniş yetkili için üç yüz seksen milyon Türk lirası. Bu üç rakam son bakış listende mutlaka olsun.", "Yurt dışındaki kuruluşlara gelelim. Türkiye'de oturan biri tamamen kendi inisiyatifiyle yurt dışından hizmet alırsa bu tebliğin kapsamı dışında kalır. Ama yabancı kuruluş Türkiye'de iş yeri açar, Türkçe internet sitesi kurar ya da burada tanıtım ve pazarlama yaparsa, faaliyet Türkiye'ye yönelik sayılır ve Kurul düzenlemeleri uygulanır. Üç durumdan biri yeterli.", "Alım satıma aracılığın üç türü var. Emir iletimine aracı emri sadece alır ve iletir; saklama yetkisi yoktur, bu yüzden saklama yetkili bir kuruluşla anlaşması gerekir. İşlem aracısı emri gerçekleştirir, yani execute eder ve saklama yetkisi olmalıdır. Portföy aracısı ise müşterinin karşısına kendisi geçer, emri kendi portföyünden karşılar. Çıkar çatışmasının en yüksek olduğu tür portföy aracılığıdır.", "Emir iletimine aracılıkta bilmen gerekenler: aracı kurumlar ve kaldıraçlı işlemler hariç bankalar yapabilir. Hem emir ileten hem lehine faaliyet gösterilen kuruluş müşteriyle ayrı ayrı çerçeve sözleşme imzalar, ama iki kuruluş anlaşırsa tek sözleşme de olur. Müşteriye bildirimleri lehine faaliyet gösterilen kuruluş yapar. Gişe hizmeti de artık emir iletiminin parçası ve çerçeve sözleşme olmadan sunulabilir. Yurt dışı kuruluşlarla emir iletiminde önce bildirim, sonra yirmi iş günü bekleme var; kaldıraçlı işlemlerde ise yurt dışı emir iletimi hiç yok.", "Güncel bir karar da var: iki bin yirmi altı Haziranında Kurul, mevduat ve katılım bankalarının yurt dışında paylar ile paya ve pay endekslerine dayalı türevlerde emir iletimi yapamayacağına karar verdi. Ancak bu bankalar, müşterinin yurt dışı işlem aracılığına yetkili bir aracı kurumda hesap açmasına aracılık edebilir.", "İşlem aracılığında tablo önemli. Aracı kurum her şeyi yapar. Mevduat, katılım ve kalkınma bankaları payda, kaldıraçlıda ve pay ya da pay endeksine dayalı türevlerde işlem aracılığı yapamaz. Kalkınma ve yatırım bankaları ise halka açık olmayan bir aracı kurum tüm izinlerini iptal ettirip piyasadan çekilirse paylarda da işlem aracılığı yapabilir. Kaldıraçlı işlemleri ise hiçbir banka yapamaz.", "Portföy aracılığında bankalar için bir incelik var: pay endeksine dayalı türevlerde bankalar işlem aracılığı yapamaz ama portföy aracılığı yapabilir. Ayrıca Rehbere göre bankalar Borsa İstanbul'da işlem gören paylar ve bunlara dayalı türevlerde portföy aracılığı yapamaz. Portföy aracılığı birim yöneticisi münhasıran çalışmalı ve en az beş yıl deneyimli olmalı; risk yönetim birimi de şart, ama bankanın kendi risk birimi izliyorsa bankalarda aranmaz.", "Kaldıraçlı işlemlerde teminat koruması sınavın gözdesi. Genel müşteri ve talebe dayalı profesyonel müşteri, yatırdığı teminattan fazla zarara uğratılamaz; piyasa koşullarından doğan fazla zarar ondan istenemez. Talebe dayalı profesyonel müşteri yazılı talep ederse bu koruma ona uygulanmayabilir. Asıl profesyonel müşteri ise bu korumadan hiç yararlanamaz.", "En iyi gerçekleştirme yükümlülüğünde müşterinin açık talimatı varsa kuruluş yükümlülüğü yerine getirmiş sayılır. Kaldıraçlıda fiyat yenilemesi aleyhe uygulanıyorsa lehe her durumda da uygulanmak zorunda. Aleyhe değişiklikte müşteri onayı gerekir ve bu onay pozisyon açmak için fiyat sınırı konan emirlerde zorunlu. Lehe değişikliklerde onay aranmaz.", "Birkaç süre ve rakam daha: tezgahüstü türevde kesinleşmiş nakit alacak talep üzerine en geç üç iş gününde ödenir. Yurt dışı borsa üyeliğinde yabancı otoritenin yaptırımı üç iş günü içinde Kurula bildirilir. Kaldıraçlı fiyat serilerini Birlik bir yıl saklar ve sapmaları haftalık duyurur. Teminatta ise borsada işlem görmeyen özel sektör borçlanma araçları kabul edilmez ve aracı kurum konsantrasyon limiti koymak zorundadır.", "Özetleyelim: bir, yatırım hizmetleri izne, yan hizmetler yirmi iş günlük bildirime tabi. İki, dar, kısmi, geniş yetkinin faaliyetleri ve kırk beş, yüz doksan, üç yüz seksen milyonluk özsermayeler. Üç, emir iletimi saklama yapamaz, işlem aracısı execute eder, portföy aracısı karşı taraf olur. Dört, bankalar payda ve kaldıraçlıda aracılık yapamaz, pay endeksi türevinde sadece portföy aracılığı yapabilir. Beş, kaldıraçlıda teminat üstü zarar genel ve talebe dayalı profesyonel müşteriden istenemez. Şimdi sorulara geçebilirsin."], "2": ["Merhaba, ikinci bölümdeyiz. Bu bölümde Yatırım Hizmetleri Tebliğinin türev araçlar ve kaldıraçlı işlemler kısmını konuşacağız. Burası rakam yoğun bir bölüm; on, elli, altı, yüzde elli gibi sayılar burada saklı. Hepsini tek tek yerine oturtacağız.", "Türev araçlar borsada ya da tezgahüstünde işlem görebilir. Kurul isterse tezgahüstü işlemlerin takasını merkezi karşı tarafta yapılmaya zorlayabilir. Kanuna göre kaldıraçlı işlemler de bir tür türevdir ve döviz, kıymetli maden ile Kurulun belirleyeceği varlıklar üzerine yapılır.", "Tezgahüstü türev yapan kuruluşlar Birlik esaslarına göre türev türleri ve dayanak varlıklar listesi hazırlar, internet sitesinde yayımlar ve Birliğe gönderir. Listede değişiklik olursa ilandan sonra beş iş günü içinde Birliğe bildirilir. Fark kontratları, yatırım kuruluşu varantları, sertifikalar ve ortaklık varantları türev sayılır. Tezgahüstündeki fark kontratları ise kaldıraçlı işlem kurallarının tamamına tabidir.", "Kapsam dışı hallere dikkat. Varlıkların fiziki alım satımı türev değildir. Kişilerin aracı olmadan kendi aralarında yaptığı, ticari sayılmayan işlemler de türev işlemi sayılmaz. Kaldıraçlıda ise bankalar arası işlemler ve bankaların aracı kurumlara likidite sağlamak için yaptığı işlemler kapsam dışıdır.", "Teminatlandırma politikası yönetim kurulu kararıyla oluşturulur ve her müşteri için pozisyon limiti içerir. Risk yönetim birimi bu politikadan sorumludur ve genel müdüre en az haftada bir rapor verir. Risk modelleri de en az altı ayda bir geriye dönük stres testiyle sınanır ve sonuç yönetim kuruluna gider. Haftalık ve altı aylık sürelerini karıştırma.", "Tezgahüstü türevde iki teminat var: başlangıç ve sürdürme. Sürdürme oranının altına düşülürse teminat tamamlama çağrısı yapılır ve müşteri teminatı başlangıç oranına çıkarmak zorundadır, sürdürme oranına değil. Süresinde tamamlamazsa ihbara gerek kalmadan temerrüde düşer; pozisyonları otomatik kapatılabilir ve riskini artıran yeni emirleri kabul edilmez. Otomatik kapatma oranı da sürdürme oranının altında olmalıdır.", "Kaldıraç oranına gelelim. Pozisyon ilk açılırken kaldıraç on bire biri geçemez; yani yüz liralık teminatla en fazla bin liralık pozisyon. Bu bir üst sınır, sözleşmede daha düşüğü konabilir. Kurul oranı değiştirebilir ve varlık bazında ayrı oran da belirleyebilir. Oranın sonradan değiştirilmesi için müşterinin yazılı onayı gerekir.", "Asgari başlangıç teminatı elli bin Türk lirası ya da muadili dövizdir. Burada sınavın sevdiği bir ayrım var: işlemlere başladıktan sonra zarar ettiği için teminatı elli binin altına düşen müşteri işlemlere devam edebilir. Ama nakit çekerek ya da virman yaparak teminatı elli binin altına düşürürse pozisyon açamaz. Teminat hesabında da yalnızca gerçekleşmiş kâr ve zarar dikkate alınır.", "Kaldıraçlıda teminat olarak sadece nakit kabul edilir: Türk lirası ve Merkez Bankasının günlük fiyat ilan ettiği dövizler. Hisse, tahvil ya da fon payı teminat olmaz. Teminatlar Takasbank'ta müşteri adına saklanır, takibini ise aracı kurum yapar.", "Teminatlar en geç ertesi iş günü Takasbank'a raporlanır ve yatırılır. Müşterinin net varlığına karşılık gelen kısım müşteri alt hesaplarına, brüt varlığın net varlığı aşan kısmı ise aracı kurum adına açılan teminat yedekleri hesabına gider. Yedek hesabında, brüt ile net varlık arasındaki farkın en az yüzde ellisi bulunmalıdır.", "Kaldıraçlı işlem yapan müşteriye bu işlemler için bireysel portföy yöneticiliği ya da yatırım danışmanlığı verilemez. Birlik de iki bin on altıda, al sat sinyali gibi adlarla sunulan, aslında danışmanlık niteliğindeki hizmetlerin mevzuata aykırı olduğunu duyurdu.", "Deneme hesabı genel müşteriler için hesap açılışından önce zorunludur. Gerçek zamanlı fiyatlarla çalışır ve müşteri işlem yapacağı her aracı kurumda ayrı ayrı deneme hesabı kullanmalıdır. Asgari altı iş günü ve toplamda elli işlem. Şöyle hatırla: altı gün, elli işlem.", "Hesap açılışında genel müşteriden beş konuda yazılı beyan alınır: işlemler risklidir ve zarar edilebilir, teminatın tamamı kaybedilebilir, deneme hesabında işlem yapılmıştır, uygulanacak kaldıraç oranı ve internet sitesinde duyurulan kâr zarar dağılımı.", "Emir iptalinde kural şu: gerçekleşmiş emir iptal edilemez. Üç istisna var: itiraz üzerine müşteri lehine iyileştirme, platformdaki teknik sorunun giderilmesi ve profesyonel müşterinin otomatik iletilen emrinin karşı tarafça iptali. Son ikisinde uygulama ilgili tüm müşterilere yapılır ve müşterilere gerekçesiyle bildirilir. İptaller merkezi takas kuruluşuna en geç ertesi iş günü raporlanır.", "Son olarak platformlar. Tezgahüstü türevde kullanılan platform, program, modül ve eklentiler kullanılmaya başlandıktan sonra on gün içinde Birliğe bildirilir, bildirilmeyen hiçbir şey kullanılamaz. Bağımsız denetim kuruluşları yılda en az iki kez aracı kurumdan habersiz özel amaçlı denetim yapar ve raporlar beş iş gününde Kurula gider. Olağandışı fiyat hareketleri ve teknik sorunlar da Birliğe raporlanır.", "Özetleyelim: bir, kaldıraç ilk açılışta en fazla on bire bir, başlangıç teminatı elli bin lira. İki, zararla düşen teminat devam ettirir, çekimle düşen teminat pozisyon açtırmaz. Üç, deneme hesabı altı iş günü ve elli işlem. Dört, teminat yedekleri hesabı brüt ile net farkının en az yüzde ellisi. Beş, risk modeli altı ayda bir stres testi, platform bildirimi on gün, habersiz denetim yılda iki kez. Sorulara geçebilirsin."], "3": ["Merhaba, üçüncü bölümdeyiz. Bugün Yatırım Hizmetleri Tebliğinin ikinci yarısını işleyeceğiz: bireysel portföy yöneticiliği, yerindelik testi, yatırım danışmanlığı, halka arza aracılık, saklama ve yan hizmetler. Bu bölümde kim yapabilir, kaç yıl tecrübe gerekir ve hangi test uygulanır sorularına odaklanacağız.", "Bireysel portföy yöneticiliği, müşterinin portföyünün onun adına vekil sıfatıyla yönetilmesidir. Yatırım fonları gibi kolektif portföylerin yönetimi bu kapsamda değildir. Bu hizmeti aracı kurumlar, kalkınma ve yatırım bankaları ve portföy yönetim şirketleri yapabilir; aracı kurumlardan kısmi ve geniş yetkililer. Portföy yöneticisi dört yıllık lisans mezunu ve en az beş yıl tecrübeli olmalı, ayrıca bir araştırma birimi kurulmalı.", "Kopyalama hizmetine dikkat. Başka portföyleri takip etme ya da kopyalama imkânı sunmak yatırım danışmanlığıdır. Ama bu imkân müşterinin kendi portföyünde otomatik işlem yaptıracak şekilde sunulursa bireysel portföy yöneticiliği olur. Kilit kelime otomatik.", "Portföy yöneticisinin uyacağı kurallardan sınavda sık çıkanlar şunlar: getiri garantisi verilemez, belli bir dönem için önceden para toplayıp ortak portföy oluşturulamaz, müşterinin yazılı talimatı olmadan borsada işlem görmeyen varlık portföye alınamaz ve çatışma halinde portföy lehine davranılır. Sözleşmede adı geçen portföy yöneticisi değişirse müşteriye derhal bildirilir ve müşteri sözleşmeyi tek taraflı feshedebilir. Karşılaştırma ölçütü getiri taahhüdü anlamına gelmez.", "Yerindelik testi, bireysel portföy yöneticiliği ve yatırım danışmanlığından önce, sözleşme imzalanmadan yapılır. Üç şeye bakar: yatırım amaçları, mali durum ve bilgi tecrübe. Profesyonel müşterilerden mali durum ve bilgi tecrübe bilgisi almak zorunlu değil, ama talebe dayalı profesyonellerden alınır. Müşteri bilgi vermezse hizmet verilemez ve bu durum yazılı bildirilir. Testin sonucuna aykırı hizmet ise müşteri istese bile verilemez. Uygunluk testinden farkı tam olarak budur.", "Yatırım danışmanlığı, belirli bir kişiye ya da benzer tercihli bir gruba yönelik yönlendirici yorum ve tavsiyedir. Aracı kurumlar, yatırım ve kalkınma bankaları ve portföy yönetim şirketleri yapabilir; ticari bankalar yapamaz. Yatırım danışmanında en az üç yıl tecrübe aranır. Portföy yöneticisinde beş, danışmanda üç yıl; bunu karıştırma.", "Danışmanlığın dışında kalanlar da önemli. Emeklilik şirketlerinin bireysel emeklilik fonlarıyla ilgili tavsiyeleri tebliğe tabi değil. Türkiye Elektronik Fon Dağıtım Platformu, yani TEFAS ya da emeklilik fonu platformu BEFAS'ta işlem gören fonlar, likit fonlar ve kısa vadeli borçlanma araçları fonları hakkındaki tavsiyeler de danışmanlık sayılmaz ve yerindelik testi gerekmez.", "Danışmanlıkta en sağlam, en iyi, en güvenilir gibi abartılı ifadeler yasak, getiri vaadi kesinlikle yok, fiyat hedefleri ise hedef olduğu belirtilerek ve varsayımlarıyla verilir. Al, sat, tut gibi ifadelerin anlamları yatırım süresiyle birlikte açıklanır ve duyarlılık analizi yapılır. İhraççıyla karşılıklı yüzde bir ve üzeri pay sahipliği müşteriye açıklanır. Sözleşmeden önce bir tanıtıcı form verilir.", "Halka arza aracılık ikiye ayrılır: aracılık yüklenimi ve en iyi gayret aracılığı. Yüklenimin dört türü var. Bakiyeyi yüklenimde satılamayan kısmın tamamı süre sonunda alınır; tümünü yüklenimde satış başlamadan önce tamamı alınır. Başında kısmen olanlar ise sadece bir kısmını kapsar. Bu faaliyeti aracı kurumlar ve kalkınma ve yatırım bankaları yapar. Gişe hizmeti artık emir iletimine aracılığın parçasıdır.", "Konsorsiyumda lider, konsorsiyumu Kurula ve üçüncü kişilere karşı temsil eder; eş liderler de belirlenebilir. Sözleşmeden sonra konsorsiyum kurulacaksa ihraççının onayı gerekir. Aracılık ve konsorsiyum sözleşmeleri birleştirilirse metin diğer üyelerle en az iki iş günü önceden paylaşılır.", "Saklamada iki tür var. Sınırlı saklama, kuruluşun kendi aracılık ettiği ya da yönettiği varlıkları saklamasıdır. Genel saklama ise başka kuruluşların müşterilerine de saklama hizmeti vermektir. Genel saklama izni sınırlı saklamayı kapsamaz, ikisi için ayrı izin gerekir. Bankalar sadece genel saklama verebilir, sermaye şartı aranmaz, ama emir iletimine aracılık ettikleri müşterilere genel saklama sunamazlar.", "Mutabakat sürelerini iyi ezberle. Kayıtlar arasında günlük mutabakat yapılır; uyumsuzluk üç iş günü içinde giderilemezse Kurula yazılı bilgi verilir. Müşteriyle mutabakat her takvim yılında en az bir kez yapılır. Müşteriye saklama bakiyesi ayda bir bildirilir. Ve en sevilen tuzak: müşterinin bildirime itiraz etmemesi mutabakat sayılmaz.", "Müşteri nakitleri gün sonunda toplu ya da müşteri bazında değerlendirilebilir; toplu değerlendirmede gelir oransal dağıtılır. Nakitler talep edilince en geç bir iş gününde ödenebilecek şekilde değerlendirilmeli. Bankadaki müşteri hesabı kurumun kendi parasından ayrı tutulur, kredi teminatı gösterilemez; banka on beş iş günü içinde onay vermezse para başka bankaya taşınır.", "Yan hizmetler izne tabi değildir. Sermaye piyasası danışmanlığı ile servet yönetimi ve finansal planlamayı kısmi ve geniş yetkili aracı kurumlar yapar. Aracılık yüklenimiyle ilgili hizmetler ile finansman sağlanmasına aracılığı bankalar sınırsız yapabilir. Döviz konusunda otuz iki sayılı Karar önemli: aracı kurumlar sadece sermaye piyasası faaliyetleriyle sınırlı ve sadece hesap sahibi müşterileriyle döviz alım satımı yapabilir.", "Genel yatırım tavsiyesi kişiye özel değildir, tüm müşterilere giden araştırma raporu gibi düşün; bire bir paylaşılsa da genel tavsiye olarak kalır. Finansal bilgi ise yönlendirici değildir. Genel tavsiyede son on iki ayda farklı strateji verilmişse bu değişiklik ve gerekçesi belirtilir. Uyarı notu yazılıda metnin sonunda, internette sayfa açılmadan önce, radyoda başta ve sonda birer kez, televizyonda başta ve sonda on beşer saniye tam ekran ve ayrıca iki kez akan bant olarak verilir.", "Özetleyelim: bir, portföy yöneticisi beş yıl, yatırım danışmanı üç yıl tecrübe. İki, ticari bankalar danışmanlık yapamaz. Üç, yerindelik testine aykırı hizmet müşteri istese bile verilemez. Dört, genel saklama sınırlıyı kapsamaz ve bankalar başka hiçbir yatırım hizmeti sunmadan sadece genel saklama da verebilir. Beş, uyumsuzluk üç iş günü, müşteri mutabakatı yılda bir, bakiye bildirimi ayda bir, nakit ödemesi bir iş günü. Haydi sorulara."], "4": ["Merhaba, dördüncü bölümdeyiz ve artık Yatırım Kuruluşları Tebliğine, yani Roma rakamıyla üç, otuz dokuz nokta bir sayılı tebliğe geçiyoruz. Bu bölümde aracı kurumun nasıl kurulduğunu, faaliyet iznini, organizasyonu ve personel kurallarını konuşacağız. Sayılar burada da önemli: altı ay, bir yıl, yedi yıl, yedi iş günü gibi.", "Önce tanımlar. Aracı kurum, alım satım aracılığı ve halka arza aracılığı münhasıran yapmak üzere yetkilendirilen yatırım kuruluşudur. Bankalar ise mevduat ve katılım bankaları ile kalkınma ve yatırım bankalarıdır. Tebliğin bazı maddeleri sadece aracı kurumlara, bazıları hem aracı kurumlara hem bankalara uygulanır. Kuruluş, ortaklık yapısı ve dışarıdan hizmet alımı sadece aracı kurumlar için düzenlenmiş.", "Kuruluş şartları yedi tane: anonim ortaklık, payların tamamı nama yazılı, paylar nakit karşılığı, sermaye Kurulun belirlediği tutardan az olmamalı, esas sözleşme mevzuata uygun, kurucular şartları taşımalı ve ortaklık yapısı şeffaf olmalı. Halka açık olma şartı yok, bunu tuzak olarak hatırla.", "Kuruluş sermayesi için İlke Kararı üç yüz milyon lira demişti; iki bin yirmi altı başvuruları için bu tutar dört yüz kırk milyon Türk lirası. Bir de iki yıllık kilit var: kuruluş izni tarihinden itibaren iki yıl boyunca sermayeyi bu tutarın altına düşürecek çıkış yapılamaz.", "Kurucularda iflas etmemiş olmak, kanunda yazılı suçlardan mahkum olmamak, kasten işlenmiş bir suçtan beş yıl ya da daha fazla hapis cezası almamak, dolandırıcılık, rüşvet, zimmet gibi suçlardan mahkum olmamak, mali güç ve itibar aranır. İflas ya da izni iptal edilen kuruluştaki sorumluluk şartı, ilgili kararın kesinleşmesinden on yıl sonra dikkate alınmaz. Tüzel kişi kurucuların önemli etkiye sahip ortakları da bu şartları taşımalı; önemli etki yüzde on ya da yönetim kuruluna üye belirleme imtiyazı demek.", "Ticaret unvanında menkul değerler ya da menkul kıymetler ibaresi zorunlu. Geniş yetkili aracı kurumlar başına yatırım kelimesini ekleyebilir. İşletme adı ya da marka kullanmak Kurul iznine bağlı. Unvan ise ancak yönetim çoğunluğunu değiştiren pay devri, yasal zorunluluk ya da ana ortağın unvanının değişmesi halinde değiştirilebilir.", "Kuruluş izni ile faaliyet izni farklı şeylerdir. Kuruluş izninden sonra altı ay içinde faaliyet izni için başvurulmazsa hak düşer; Kurul bu süreyi toplamda bir yılı aşmamak üzere uzatabilir. Başvurular eksiksiz belgeden itibaren en fazla altı ayda sonuçlanır. Başvurmayan ya da reddedilen kurum üç ay içinde ya tasfiyeye girer ya da esas sözleşmesini değiştirir.", "Faaliyet izni hizmet bazında verilir ama tüm izinler tek bir yetki belgesinde gösterilir ve yetki belgesi alınmadan faaliyete başlanamaz. Harç makbuzu Kurulun bildiriminden sonra bir ay içinde iletilmezse izin iptal edilir. Faaliyet şartları kaybedilirse üç iş günü içinde Kurula bildirilir.", "Faaliyete geçme şartları arasında sermayenin nakden ve tamamen ödenmesi, sermaye yeterliliği, organizasyon, personel, genel müdür şartları, bilgi işlem altyapısı, sigorta dahil güvenlik önlemleri ve teminat var. Bankalar için organizasyon, personel ve güvenlik aranır; Rehber bunlara bilgi işlem altyapısını da ekledi. Tüm yatırım kuruluşları Birliğe üye olmak ve Yatırımcı Tazmin Merkezine katılmak zorunda.", "Çıkar çatışmasında kurum hem kendisiyle müşteri arasındaki hem de müşteriler arasındaki çatışmaları önlemeli. Önlenemiyorsa hizmetten önce müşteriyi bilgilendirmeli ve ispat yükü kurumdadır. Yazılı çıkar çatışması politikası yönetim kurulu kararıyla yürürlüğe girer.", "Eğitim şartları şöyle: yöneticiler, müfettişler, iç kontrol ve risk elemanları, araştırma uzmanı, yatırım danışmanı, kurumsal finansman uzmanı ve portföy yöneticisi en az dört yıllık lisans mezunu olmalı. Yönetim kurulu üyeleri bu şartın dışında. Müşteri temsilcisi, borsa üye temsilcisi ve takas operasyon sorumlusu gibi personel için iki yıllık ön lisans yeterli.", "Genel müdür ve yardımcıları en az yedi yıl deneyimli olmalı. Genel müdür münhasıran çalışır, ancak grup şirketlerinde ya da borsa gibi kuruluşlarda icrai olmayan yönetim kurulu üyeliği alabilir. Genel müdürlüğe altı aydan fazla vekalet edilemez. Atama Kurula bildirilir, yedi iş günü içinde olumsuz görüş gelmezse atama yapılır ve on iş günü içinde Birliğe bildirilir.", "Yönetim kurulu en az üç kişi, çoğunluğu dört yıllık lisans mezunu. Murahhas üye atanacaksa en az iki kişi atanır. Karara taraf olanlarla son iki yılda ilişki ya da üçüncü dereceye kadar akrabalık varsa bildirilir ve tutanağa geçer.", "Personelde dikkat edilecek istisna şu: çağrı merkezinde ya da banka şubesinde sadece yatırım fonu ve Hazine kağıdı emri alıp sisteme giren personel müşteri temsilcisi sayılmaz. Lisans tablosunda iç kontrol elemanı için Düzey iki, müfettiş, yatırım danışmanı ve portföy yöneticisi için Düzey üç aranır. Türev ve türev dışı işlemler birlikte yapılıyorsa sadece Türev Araçlar lisansı yeterlidir.", "Personel dört ilkeye uyar: mesleki yeterlilik, mesleki özen ve titizlik, dürüstlük ve sır saklama. Sır saklamanın istisnaları da var: kamuyu aydınlatma amaçlı zorunlu açıklamalar, resmi taleplere dayalı bilgiler, idari inceleme ve suç teşkil eden durumların yetkililere bildirilmesi sır kapsamında değildir.", "Özetleyelim: bir, kuruluşta yedi şart, halka açıklık yok; iki bin yirmi altı kuruluş sermayesi dört yüz kırk milyon. İki, kuruluş izninden sonra altı ay içinde başvuru, uzatma toplam bir yıl, karar azami altı ay. Üç, harç makbuzu bir ay, şart kaybı bildirimi üç iş günü. Dört, genel müdür yedi yıl, vekalet en fazla altı ay, atamada yedi iş günü bekleme. Beş, yönetim kurulu en az üç kişi, murahhas en az iki kişi. Sorulara geçebilirsin."], "5": ["Merhaba, beşinci bölümdeyiz. Yatırım Kuruluşları Tebliğinin müşteriyle ilişkiler kısmındayız: risk bildirimi, çerçeve sözleşme, internet sitesi, müşteri sınıflandırması ve uygunluk testi. Bu bölümde güncel kararlar var, profesyonel müşteri eşikleri yükseldi; o yüzden rakamları dikkatle dinle.", "Önce genel ilkeler: müşteri emrini en iyi şekilde gerçekleştirmek, basiretli tacir gibi davranmak, kaynakları etkin kullanmak ve şeffaf olmak. Bunlar her hizmette geçerli temel ilkeler.", "Risk bildiriminde genel müşteriye, çerçeve sözleşme imzalanmadan önce Genel Risk Bildirim Formu verilir ve okuyup anladığına dair yazılı beyan alınır. Alım satım aracılığında buna ek olarak işlem yapılacak aracın riskleri anlatılır: komisyon ve vergiler, ikincil piyasa olup olmadığı, karşı taraf, likidite ve piyasa riski, varsa piyasa yapıcı. Yurt dışı işlemlerde paranın nasıl transfer edildiği, varlığın nerede saklandığı ve yatırımcı tazmin sistemi olup olmadığı da açıklanır.", "Açıklamalar mümkün olduğunca sayısal örneklerle yapılır. Kaldıraçlı işlemler gibi kurumun müşteriye karşı taraf olduğu durumlarda çıkar çatışması forma ayrıca yazılır. Bir değişiklik olursa kurum öğrendikten sonra üç iş günü içinde müşteriye bildirir. İspat yükü her zaman kurumdadır.", "Çerçeve sözleşme başlangıçta bir kez imzalanır ve sonraki tüm işlemlerin temelidir. Müteselsil numaralı ve en az bir nüsha düzenlenir, bir sureti müşteriye verilir. Müşteri değişirse, örneğin veraset ya da müşterek hesaba yeni kişi girerse, sözleşme yenilenir. Emirlerin ispatını müşteriye yükleyen hüküm konamaz; hüküm olmayan konularda Türk Borçlar Kanunu uygulanır.", "Müşteri numarası tarafında her yatırımcının tek bir sicil numarası vardır ve farklı aracı kurumlardaki hesapları bu sicille eşleşir. Sicil almamış hesaptan emir alınamaz. Müşteri numarası, sözleşme bittikten sonra on yıl geçmeden başka müşteriye verilemez. İsim ya da unvan değişikliği derhal Merkezi Kayıt Kuruluşuna bildirilir.", "İnternet sitesinde kaldıraçlı işlemler için çok özel bir kural var. Üçer aylık dönemler itibarıyla kârda ve zararda olan hesapların oranı, dönem bitiminden sonra iki iş günü içinde yayımlanır. Bu duyuru ana menünün en solunda, ilk eleman olarak ve Zarar Olasılığınız adıyla yer alır. Reddedilen emir oranı, şikayet sayısı ve fiyat sağlayıcılar da bu menüde açıklanır; likidite sağlayıcılardan işlemlerin yüzde yirmisinden fazlasının yapıldığı kuruluşlar gösterilir.", "Müşteriyi tanımada müşterek hesaplarda her hak sahibinin kimliği ayrı ayrı tespit edilir. Müşterinin hesabında başkası ancak noter vekaletnamesiyle işlem yapabilir. Yabancı banka ve aracı kurumlarla hesap açılırken müşteri kimlik bilgilerini vereceklerine dair taahhütname alınır.", "Gelelim müşteri sınıflandırmasına. Müşteriler profesyonel ve genel olarak ikiye ayrılır. Bankalar, aracı kurumlar, sigorta şirketleri, fonlar, Merkez Bankası, kamu kurumları ve uluslararası kuruluşlar zaten profesyoneldir. Diğer şirketler ise büyüklük kıstaslarından en az ikisini sağlarsa profesyonel olur.", "Bu kıstaslar iki bin yirmi beş Aralığında yükseltildi. Yeni ilk kez profesyonel olacaklar için aktif toplamı beş yüz milyon, yıllık net hasılat bir milyar ve özsermaye elli milyon Türk lirası; bunlardan en az ikisi. Eski rakamlar elli milyon, doksan milyon ve beş milyondu. Profesyonel olmak istemeyen müşterinin yazılı talebi mutlaka dikkate alınır.", "Talebe dayalı profesyonel müşteri olmak için genel müşteri yazılı talep eder ve üç şarttan en az ikisini sağlar. Birincisi, son bir yılda her üç aylık dönemde en az on işlem ve güncel haliyle beş milyon liralık hacim. İkincisi, finansal varlık toplamının güncel haliyle on milyon lirayı aşması. Üçüncüsü, finansta en az iki yıl üst düzey yöneticilik ya da sermaye piyasasında beş yıl ihtisas personelliği ya da İleri Düzey veya Türev Araçlar lisansı.", "Nitelikli yatırımcı kavramına dikkat: tüm profesyonel müşteriler ve sadece finansal varlık şartını sağlayanlar nitelikli yatırımcıdır. İki bin yirmi altı Martındaki kararla, bir kez bu sıfatı kazananlar varlıkları eşiğin altına düşse bile sıfatlarını korur. Yeni yüksek tutarlar ise gayrimenkul ve girişim sermayesi yatırım fonlarının nitelikli yatırımcılarına uygulanmaz.", "Profesyonel müşteri bazı korumalardan yararlanamaz: uygunluk testi zorunlu değil, saklama mutabakatı ve aylık bildirim onay ya da sözleşmeyle kaldırılabilir, kaldıraçlıda teminat üstü zarar koruması yok, yerindelik testinde sadece yatırım amaçları sorulur ve ilave risk bildirimleri talep halinde yapılır. Talebe dayalı profesyonellerin teminat üstü zarar korumasından yararlandığını hatırla.", "Uygunluk testi, müşterinin ürünün risklerini anlayacak bilgi ve tecrübesi olup olmadığını ölçer. Alım satım aracılığı ve halka arza aracılıkta sadece genel müşterilere uygulanır. Yatırım süresi, risk ve getiri tercihleri, müşteri bilgileri ve geçmiş işlemler sorulur; mali durum sorulmaz. Formun asgari içeriğini Birlik hazırlar, Kurul onaylar; iş akış prosedürünü yönetim kurulu onaylar.", "Yatırım fonu payı ve borsada işlem gören Hazine kağıtlarında, ürün müşterinin kendi talebiyle sunulmuşsa ve müşteri bilgilendirilmişse test zorunlu değildir. Diğer tüm araçlarda müşteri kendisi istese de test yapılır. Ürün uygun değilse müşteri yazılı uyarılır ve ona bu ürünle ilgili bire bir genel tavsiye verilemez; müşteri ısrar ederse kurum hizmeti verip vermemekte serbesttir. Testler kayıtlı telefonla yapılamaz.", "Özetleyelim: bir, risk bildirimi sözleşmeden önce, değişiklik bildirimi üç iş günü. İki, müşteri numarası on yıl başkasına verilmez. Üç, Zarar Olasılığınız menüsü en solda, çeyreklik dağılım iki iş gününde. Dört, yeni profesyonel eşikler beş yüz milyon, bir milyar, elli milyon; talebe dayalıda on milyon varlık ve beş milyon hacim, üç şarttan ikisi. Beş, uygunluk testinde mali durum yok ve ısrar eden müşteriye hizmet vermek kurumun takdirinde. Sorulara geçebilirsin."], "6": ["Merhaba, altıncı bölümdeyiz. Yatırım Kuruluşları Tebliğinin son kısmındayız: pay devirleri, bildirim süreleri, iştirak sınırları, reklam kuralları, Birliğin promosyon yönergesi, şube ve irtibat bürosu, dışarıdan hizmet alımı, yasak işler ve Kurulun tedbirleri. Uzun bir bölüm ama mantığı basit; sürelere odaklanalım.", "Pay devirlerinde eşikler yüzde on, yirmi, otuz üç ve elli. Bir kişi yüzde on ve üzeri payla ortak olursa ya da bu eşiklerden birini aşarsa veya altına düşerse Kurul izni gerekir. Yönetim imtiyazlı ya da intifa hakkı taşıyan paylarda oran aranmaz, her devir izne tabidir. Eşiklere ulaşmayan devirler on iş günü içinde Kurula bildirilir. Kurala aykırı devir pay defterine yazılmaz, yazılırsa hükümsüzdür.", "Dolaylı devirlerde çarpım yaparsın. Tüzel kişi aracı kurumun yüzde doksanına sahipse ve tüzel kişide yüzde yirmilik bir devir oluyorsa, aracı kurumdaki etki yüzde on sekizdir. Borsada işlem gören aracı kurum paylarında ise izin temettü hariç ortaklık haklarının kullanılması içindir ve yüzde onun altına düşecek satıştan önce izin alınır.", "Bildirimlerde ayrım şu: personel bilgileri Sermaye Piyasası Lisanslama Sicil ve Eğitim Kuruluşuna, yani SPL'ye, diğer her şey Birliğe gider. Süre neredeyse her zaman on iş günü. Tek istisna murahhas üye kararları: tescilden sonra üç iş günü. Dava ve takipler özsermayenin yüzde onunu aşarsa Kurula da bildirilir.", "İzinsiz faaliyet şüphesinde kurum, birden fazla kişi adına işlem yapan müşterisini araştırır: komisyon alıyor mu, fiilen portföy yönetiyor mu, büro gibi organizasyonu var mı, belge düzenliyor mu. Somut ve güçlü emare varsa hesap kapatılır ve ivedilikle Kurula bildirilir. Bu bildirim için şekil şartı yok.", "İştirak sınırlarında finansal kuruluşlara, yani aracı kurum, sigorta, faktoring, finansal kiralama, varlık yönetimi gibi şirketlere sınırsız iştirak edilebilir. Diğer şirketlere iştiraklerin toplamı özsermayenin yüzde yirmi beşini aşamaz; geniş yetkililerde bu sınır yüzde elli. Ortaklarının ve yöneticilerinin büyük paylarla sahip olduğu şirketlere ise hiç iştirak edilemez.", "Reklamlarda objektiflik esas, getiri garantisi yasak. Kaldıraçlı reklamlarda çeyreklik kâr zarar oranları yer almak zorunda. Hiç zarar etmezsiniz, öğrenciler ve ev hanımları için ek gelir, garantili, kısa eğitimle uzman olun, belirli kur hedefi gibi ifadeler yasak.", "Birliğin Promosyon Kampanyaları Yönergesi ek olarak verilmiş. En önemli kural: kaldıraçlı işlemler ve fark kontratları için promosyon yapılamaz. Nakit ya da hemen nakde çevrilebilir hediye verilemez, sadece komisyon iadesi istisna. Ödülün değeri müşterinin ödediği komisyonu aşamaz; çekilişli kampanyalar hariç. Müşteri getirene ödül, belirli bir hisseye yönlendirme ve işlem öncesi bonus para da yasak.", "Promosyonun süreleri: kampanya en fazla bir yıl, başlamadan en az on iş günü önce Birliğe başvuru, Birlik en fazla on iş günü içinde inceler, uzatma sadece bir kez ve en fazla bir yıl, kampanya bitince on iş günü içinde sonuç bildirimi. Birlik onayı reklamda kullanılamaz ve içeriğe kefalet anlamına gelmez. Eğitim amaçlı yarışmalar da promosyon sayılır.", "Şube her şeyi yapar, nakit de tahsil eder. İrtibat bürosu ise sadece tanıtım yapar ve emirleri aracı kuruma iletir; sorumlusu iki yıllık ön lisans mezunu olabilir. Başvuruda noter onaylı yönetim kurulu kararı ve fizibilite etüdü gerekir, Kurul otuz iş gününde karar verir. Sorumluluk her zaman aracı kurumda.", "Dışarıdan hizmet alımında alınamayacaklar dört grup: yönetim kuruluna özgü işler, izinli hizmetlerin sunumu ve pazarlaması, muhasebe ve finansal raporlama ve iç denetim. Temizlik, avukatlık, eğitim gibi hizmetler zaten kapsam dışı. Hizmet almaya başlayınca on iş günü içinde Kurula bildirilir, erken fesihte derhal. Bilgi sistemleri için yılda en az bir sızma testi şart.", "Yasak işler listesinden sık sorulanlar: sınai ve zirai faaliyet, ticari gayrimenkul alım satımı, mevduat toplama, getiri taahhüdü, geniş yetkili vekaletname almak, fiktif hesap ve özsermayenin binde beşini aşan bağış. Bankalar bu listenin sadece yatırımcıyı koruyan bentlerine tabi.", "Durdurma ve feragatte iki yıl rakamı öne çıkıyor. Kendi isteğiyle durdurmada süre toplam iki yılı geçemez. Kısmen feragat eden kurum aynı izin için iki yıl başvuramaz. Tamamen feragatte ilan, en yüksek tirajlı on gazeteden en az ikisinde ve en az beş iş günü KAP'ta yapılır, ulaşılamayan müşteri varlıkları Takasbank'ta bloke edilir ve yüzde on üzeri ortaklar taahhütname verir. Bloke varlıklar haczedilemez ve iflas masasına girmez.", "Kurul tedbirlerinde iki yıl içinde tüm faaliyetleri iki kez durdurulan kurumun üçüncüde tüm izinleri iptal edilir. İzinden sonra iki yıl hiç faaliyette bulunmamak da tedbir sebebidir. Şart kaybı ve eksik teminat için Kurul en fazla üç ay süre verir. Mali durum bozulursa yatırımcı tazmini, tedrici tasfiye ve iflas gündeme gelir; bankalarda bu kararları BDDK verir. Alacaklıların sayıca yüzde onundan fazlasından ibraname alınırsa faaliyet sürekli durdurulur.", "Kurul adına Takasbank'ta bloke edilen teminatlar nakit, kamu borçlanma aracı, kira sertifikası, ilişkisiz bankadan teminat mektubu ya da kurucusu olunmayan fonların payları olabilir. Takasbank aylık izler ve yıl sonundan sonra yirmi iş günü içinde Kurula rapor verir. Yeniden faaliyete geçen kurumun teminatı bir yıl kesintisiz faaliyetten sonra serbest kalır; tazmin ya da tedrici tasfiye varsa teminat Yatırımcı Tazmin Merkezine gider.", "Özetleyelim: bir, pay eşikleri on, yirmi, otuz üç, elli; altı on iş günü bildirim. İki, personel SPL'ye, diğerleri Birliğe, çoğunlukla on iş günü. Üç, iştirak sınırı yüzde yirmi beş, geniş yetkide yüzde elli. Dört, promosyon en fazla bir yıl, on iş günü önce başvuru, kaldıraçlıda promosyon yok. Beş, iki yılda iki durdurma sonrası iptal, bağış sınırı binde beş. Sorulara geçebilirsin."], "7": ["Merhaba, yedinci bölümdeyiz. Bu bölümde iki tebliği birlikte işleyeceğiz: Belge ve Kayıt Düzeni Tebliği ile Uzaktan Kimlik Tespiti Tebliği. Biri kâğıt ve elektronik kayıtların nasıl tutulacağını, diğeri müşterinin görüntülü görüşmeyle nasıl tanınacağını anlatıyor. Ortak noktaları ispat yükü ve saklama süresi.", "Belge ve Kayıt Tebliği iki bin on beş yılında yayımlandı ve muhasebeleştirme kuralı içermiyor. Muhasebe kayıtları yasal defterlere şu sürelerde işlenir: takası merkezi takas kuruluşunda yapılan işlemler takas süresini izleyen ilk iş günü, diğer işlemler işlem gününü izleyen ilk iş günü. Hesap planı olarak Aracı Kurum Hesap Planı kullanılır.", "Çerçeve sözleşme elektronik ortamda kurulursa kaşeli ve imzalı suret gerekmez, ama suret müşteriye e-postayla iletilir ya da elektronik erişim sağlanır. Sözleşmeyi sonradan elektronik ortamda değiştirmek için önce müşterinin buna onay vermesi gerekir. Halka arzda talep toplananlara hesap açmak zorunlu değil.", "Elektronik hizmetlerde iki bileşenli kimlik doğrulama şart. Bileşenler müşterinin bildiği, sahip olduğu ya da biyometrik özelliği olan şeylerden farklı iki sınıftan seçilir ve birbirinden bağımsız olur. Tek kullanımlık kod şifreleme anahtarıyla üretilir; bu mümkün değilse SMS kullanılabilir. Mobil uygulamada pin ya da biyometrik ile anahtara erişim de iki bileşen sayılır. Sistem hatalı girişte kullanıcı adının mı şifrenin mi yanlış olduğunu söylememeli ve eşzamanlı oturuma izin vermemeli.", "Düzenlenecek belgeleri bir kere say: nakit alındı ve ödendi belgesi, müşteri emir formu, türev piyasalar emir takip formu, seans takip formu, işlem sonuç formları, işlem talimat formu, teminat durum raporu, pozisyon limit aşımı raporu ve aylık hesap ekstresi. Tezgahüstü işlemlerde emir formu yerine işlem talimat formu kullanılır.", "Emirler yazılı ya da sözlü alınabilir. Telefon, faks, ATM ve internetten gelen emirler sözlü emir sayılır. Ses kayıtları, faks dökümleri, IP numaraları ve log kayıtları tutulur. İspat yüküne dikkat: sözlü emrin varlığını yatırım kuruluşu ispatlar; ama emir verdiği halde işlem yapılmadığını iddia eden müşteri, emri verdiğini kendisi ispatlar.", "Emir formları borsaya iletim kanalı bazında müteselsil numaralanır ve en az saniye hassasiyetinde zaman damgası taşır. Müşteri isterse emir alınış numarası verilir. Emirler zaman önceliğine göre seans takip formuna, türevler ise türev piyasalar emir takip formuna aktarılır. Piyasa yapıcının kotasyon emirleri bu kuralın dışında.", "İşlemler müşteriye en geç gün sonunda bildirilir. Hesap ekstresi aylık gönderilir ve ilgili dönemi izleyen beş iş günü içinde müşteriye ulaşmalıdır. İşlem yapmayan müşteriye ve sözleşmeyle profesyonel müşteriye ekstre gönderilmeyebilir. Belli süre geçince ekstre kabul edilmiş sayılır gibi bir hüküm sözleşmeye konamaz, konursa hükümsüzdür.", "Kaldıraçlı ve türev işlemlerde bildirim günlük ve aylıktır. İşlem sonuç formu en geç işlemi izleyen iş günü gönderilir. Türevde teminat durum raporu ve pozisyon limit aşımı raporu açık pozisyon taşınan her gün sonunda hazırlanır; pozisyon limit raporu global hesaplar hariç her hesap için ayrıdır. Takas kurumuyla açık pozisyon mutabakatı da her gün yapılır.", "Saklama süresi on yıl, Türk Ticaret Kanununa dayanıyor. Uzaktan kimlik tespitinin video kayıtları da bu on yıla dahil. İhtilaflı belgeler ise ihtilaf bitene kadar saklanır. Kayıtlar silinemez, değiştirilemez olmalı, kâğıt kayıtlarda boş satır bırakılamaz ve elektronik kayıtlar için günlük dosya bütünlük değeri zaman damgasıyla üretilir. Şikayet kayıtları ve kaldıraçlı işlemlerdeki her türlü iletişim de saklanır.", "Şimdi uzaktan kimlik tespitine geçelim. Dayanağı yedi bin iki yüz kırk yedi sayılı Kanunla Sermaye Piyasası Kanununun kırk ikinci maddesinde yapılan değişiklik. Aracı kurumlar, portföy yönetim şirketleri ve kripto varlık hizmet sağlayıcıları uzaktan, görüntülü görüşmeyle müşteri edinebilir.", "Süreç kritik işlem sayılır ve tek bir aktör tarafından baştan sona yürütülemez. Kişi başlatır, bilgi teknolojileri kontrolleriyle devam eder, personel onayıyla tamamlanır. Riskli görülen işlem ikinci bir personele gider ya da sonlandırılır. Prosedür yılda en az iki kez gözden geçirilir, personel yılda en az bir kez eğitim alır ve erişimi sınırlı ayrı alanlarda çalışır.", "Görüşme gerçek zamanlı, kesintisiz ve uçtan uca şifreli olmalı. Özel nitelikli kişisel verilerden sadece biyometrik veri kullanılabilir ve açık rıza kayda alınır. Sorular ve sıraları değişken olur. Cep telefonu numarası, o işleme özel tek kullanımlık SMS şifresiyle doğrulanır.", "Kimlik belgesi önce yakın alan iletişimiyle, yani NFC ile yongadan doğrulanır. Bu yapılamazsa belgenin en az dört görsel güvenlik unsuru doğrulanır, ama o zaman ilk para hareketi müşteriyi tanıma kurallarını uygulayan başka bir finansal kuruluş üzerinden yapılmak zorundadır. Canlılık testi ve yüzün belge fotoğrafıyla biyometrik karşılaştırması şart. Görüntü kötüyse ya da şüphe varsa görüşme sonlandırılır. Süreç, müşterinin sözlü onayıyla tamamlanır.", "Kimlik tespitinden sonra sözleşme: müşterinin irade beyanı iki bileşenli doğrulamadan sonra alınır; ama beyan görüntülü görüşme sırasında alınırsa bu şart sağlanmış sayılır. Elektronik sözleşme müşteriye özgü şifreleme anahtarıyla imzalanır ve müşteri sadece kendisine gösterilen metni imzalar. Böyle kurulan teminat, kefalet ve temlik sözleşmeleri dahil her sözleşme yazılı şekilde kurulmuş sayılır. İtirazda ispat yükü kurumdadır.", "Özetleyelim: bir, muhasebe kaydı takas ya da işlem gününü izleyen ilk iş günü. İki, sözlü emrin varlığını kurum, emir verdiğini müşteri ispatlar. Üç, işlem bildirimi gün sonu, ekstre aylık ve beş iş günü içinde, sorumsuzluk kaydı hükümsüz. Dört, saklama on yıl, ihtilaflıda ihtilaf bitene kadar. Beş, uzaktan kimlikte NFC yoksa dört güvenlik unsuru ve ilk hareket başka finansal kuruluştan; prosedür yılda iki kez gözden geçirilir. Sorulara geçebilirsin."], "8": ["Merhaba, sekizinci bölümdeyiz. Bugün kredili alım, açığa satış ve ödünç işlemlerini düzenleyen Seri beş, numara altmış beş tebliğini işleyeceğiz. Bu bölüm hesap sorusu üretiyor; yüzde elli, yüzde otuz beş ve özkaynak oranı formülünü çok iyi oturtacağız.", "Bu işlemler yan hizmettir ve izne değil bildirime tabidir. Alım satım aracılığı yetkisi olan aracı kurum şartları belgelendirir ve otuz iş günü içinde Kurul aksini söylemezse başlar. Bankalar kredi verebilir ama aracı kurumlara özgü işlem sınırlarına tabi değildir. Ödünç işlemlerini Takasbank da yapar. DİBS piyasa yapıcısı olmayanlar devlet tahvilini sadece ödünç verebilir, ödünç alamaz.", "Aracı kurum yönetim kurulu kararıyla sorumlu bir genel müdür yardımcısı atar ve bir kredi komitesi kurar. Komitenin başkanı sorumlu bir yönetim kurulu üyesidir ve kararlar noter onaylı karar defterine yazılır.", "Hangi kağıtlar kredili alınabilir ya da açığa satılabilir? Borsa İstanbul'da Alt Pazar, Yakın İzleme Pazarı ve Piyasa Öncesi İşlem Platformu dışındaki tüm paylar ve borsa yatırım fonları. Varant, sertifika, gayrimenkul ve girişim sermayesi yatırım fonlarında hiçbiri yapılamaz. Gayrimenkul sertifikasında ise kredili alım var, açığa satış yok. Listeden çıkan kağıt en fazla üç ay geçici listede kalır.", "Genel işlem sınırı: kredili işlemler ve açığa satışlar ayrı ayrı, önceki üç ayın ay sonu özsermaye ortalamasının iki katını aşamaz. Son ay ortalamadan düşükse son ay alınır. Mesela yüz yirmi, yüz on ve seksen beş milyonsa ortalama yüz beş ama son ay düşük olduğu için seksen beş esas alınır, sınır yüz yetmiş milyon olur.", "Özel sınırlar: bir müşteriye açılan kredi ortalama özsermayenin yüzde onunu aşamaz; sürdürme oranı yüzde elli ve üzerinde uygulanırsa bu iki katına çıkabilir. Tek bir şirketin hisselerindeki toplam kredili pozisyon ise yüzde elliyi aşamaz. Eş ve çocuklar ile yüzde yirmi beş iştirakli şirketler tek müşteri sayılır.", "Kredi hesabı diğer hesaplardan ayrıdır; kredili alım ve açığa satış için ayrı hesap açılır. Başka hesaptaki varlıklar özkaynak açığına teminat sayılmaz, sadece yazılı talimatla virman yapılabilir. Bu tebliğdeki çerçeve sözleşmeler en az iki nüsha düzenlenir; Yatırım Kuruluşları Tebliğinde en az bir nüshaydı, bu farkı unutma.", "Özkaynak olarak nakit, devlet tahvili ve altın yüzde yüz, borsa yatırım fonları yüzde doksan, hisse senedi ve serbest şemsiye fon payları yüzde yetmiş beş, diğer fonlar yüzde doksan oranında kabul edilir. Peşin alınan kağıt ancak yazılı onayla özkaynak olur; kredili alınan kağıt ise açığa satışta hiçbir şekilde özkaynak olamaz.", "Kredili alımda başlangıç özkaynak oranı en az yüzde elli, sürdürme oranı en az yüzde otuz beş. Formül şu: cari değer eksi kredi, bölü cari değer. Beş bin lira nakdi olan müşteri beş bin lira kredi alıp on bin liralık hisse alabilir. Değer sekiz bine düşerse oran yüzde otuz yedi buçuk, çağrı yok. Yedi bin altı yüz doksan iki liranın altına inerse oran yüzde otuz beşin altına düşer ve çağrı başlar.", "Oran yüzde otuz beşin altına düşünce aracı kurum en seri yolla müşteriye ulaşır ve oranı yüzde elliye çıkarmasını ister. Müşteriye en fazla iki iş günü süre verilir; tamamlanmazsa kurum ihbar gerekmeden satış yapıp krediyi kapatır. Bildirim süresince müşterinin hiçbir alım emri yerine getirilmez. Oy hakkı ve temettü müşterinindir, bedelsiz hakları ise aracı kurum müşteri adına kullanır.", "Halka arzda iki yasak var. Aracılık yüklenimi yapan aracı kurum halka arz süresince o kağıtta kredili işlem yapamaz. Borsada satış yoluyla yapılan halka arzlarda ise o kağıtta açığa satış yapılamaz. Kredili alım verileri satış sonuçlarıyla birlikte altı iş gününde Kurula bildirilir.", "Açığa satış, sahip olmadığın kağıdı satmaktır. Ödünç alarak satmaya örtülü, hiç sahip olmadan satış emri vermeye çıplak açığa satış denir. Müşteri emrin açığa satış olduğunu yazılı bildirir; ama takas tarihine kadar kağıdı teslim edeceğini beyan ederse işlem açığa satış sayılmaz. Teslim edilmezse en geç takas tarihini izleyen iki iş günü içinde temerrüt işlemleri başlar.", "Açığa satışta da başlangıç yüzde elli, sürdürme yüzde otuz beş. Bin lira nakdi olan müşteri en fazla bin liralık açığa satış yapar. Sattığı hissenin değeri bin üç yüze çıkarsa oran iki bin eksi bin üç yüz bölü iki bin, yani yüzde otuz beş olur. Oran yüzde otuz beşin altına düşerse eksikliğin tespit edildiği gün yazılı bildirim yapılır ve yine iki iş günü süre verilir.", "Açığa satış emri Borsaya iletilirken açığa satış olduğu belirtilir; belirtilmezse cezai sorumluluk aracı kurumdadır. Borsa ya da Kurul, aç
