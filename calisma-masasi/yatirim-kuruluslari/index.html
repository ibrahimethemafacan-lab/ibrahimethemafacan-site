spat yükü kuruluşta).<\/li><li>Nakitler talep halinde <b>en geç 1 iş günü<\/b> içinde ödenecek şekilde değerlendirilir. Limit altı nakitler (sözleşme hükmüyle) ve getiri istemeyenlerin nakitleri (ayrı yazılı onayla) <b>anapara korunarak<\/b>, getirisi aracı kurumda kalacak şekilde değerlendirilebilir.<\/li><li>Bankadaki müşteri nakdi aracı kurumun kendi nakdinden <b>ayrı hesapta<\/b>; amacı dışında kullanılamaz, kredi teminatı gösterilemez, aracı kurum lehine blokaj/rehin konamaz. Banka <b>15 iş günü<\/b> içinde ayrı hesap onayını vermezse tutar başka bankaya aktarılır.<\/li><\/ul><h4>Yurt dışı ve bireysel portföy saklaması<\/h4><ul><li>Yurt dışında saklama için ülke otoritesinin saklama düzenlemesi olmalı ve saklayıcı buna tabi olmalı; aracın niteliği gereği mümkün değilse <b>müşterinin yazılı onayıyla<\/b> başka kuruluş. Saklayıcı değişirse müşteriye derhal bildirim ve sözleşme güncellemesi (m.67).<\/li><li>Bireysel portföylerde (m.70): her yatırımcı adına <b>ayrı saklama hesabı<\/b>; havuz hesapla toplu takas yapılabilir ama hak takibi bireysel; müşteriye ayda en az 1 bilgilendirme ve internet şubesinden <b>anlık erişim<\/b>; nakit ve varlık hareketleri <b>teslim karşılığı ödeme<\/b> ilkesine göre; portföy yönetimi işlemleri hariç varlık çıkışında müşterinin yazılı talimatı.<\/li><\/ul><h3>Yan hizmetler (SPKn m.38; Tebliğ m.71–80)<\/h3><ul><li>Liste: (a) sermaye piyasası danışmanlığı; (b) yatırım hizmetleriyle sınırlı kredi veya ödünç ve döviz hizmetleri; (c) yatırım araştırması, finansal analiz, <b>genel tavsiye<\/b>; (ç) aracılık yüklenimiyle ilgili hizmetler; (d) finansman sağlanmasına aracılık; (e) <b>servet yönetimi ve finansal planlama<\/b>; (f) Kurulca belirlenecek diğerleri.<\/li><li>Kurul izni gerekmez; yatırım kuruluşu yaparsa Kurul esaslarına uyar. Aracı kurumlar Kurulun <b>uygun görüşüyle<\/b> diğer finansal ürünleri de sunabilir (m.77).<\/li><\/ul><table><tr><th>Yan hizmet<\/th><th>Kim yapabilir<\/th><\/tr><tr><td>Sermaye piyasası danışmanlığı (yatırım planı, mali profil, birleşme-bölünme, yeniden yapılandırma, tasfiye) – m.71<\/td><td>Kısmi ve geniş yetkili aracı kurum<\/td><\/tr><tr><td>Döviz hizmetleri – m.72<\/td><td>İşlem veya portföy aracılığı yetkili aracı kurum; yatırım hizmetleriyle sınırlı<\/td><\/tr><tr><td>Aracılık yüklenimiyle ilgili hizmetler (mali analiz, pazar araştırması, mali tabloların uyumu, esas sözleşme değişikliği, açıklanacak bilgiler) – m.74<\/td><td>Kısmi/geniş yetkili aracı kurum; bankalar sınırsız<\/td><\/tr><tr><td>Finansman sağlanmasına aracılık – m.75<\/td><td>Kısmi/geniş yetkili aracı kurum; bankalar sınırsız<\/td><\/tr><tr><td>Servet yönetimi ve finansal planlama – m.76<\/td><td>Kısmi/geniş yetkili aracı kurum<\/td><\/tr><\/table><ul><li>Kredi ve ödünç işlemleri Seri V No 65 Tebliğle düzenlenir.<\/li><li>32 sayılı Karar: Türkiye'de yerleşikler bankalar, yetkili müesseseler, PTT, kıymetli maden aracı kuruluşlarından döviz alıp satabilir; m.6: <b>aracı kurumlar yalnızca sermaye piyasası faaliyetleriyle sınırlı olarak ve yalnızca hesap sahibi müşterileriyle<\/b> döviz alım satımı yapabilir.<\/li><li>Servet yönetiminde finansal olmayan varlıklar da konu olabilir; danışmanlık veya portföy yöneticiliği gerekirse yetkili kuruluşlarca sunulmalıdır.<\/li><\/ul><h4>Genel yatırım tavsiyesi ve finansal bilgi<\/h4><ul><li><b>Genel yatırım tavsiyesi<\/b> (m.73): belli kişi veya gruba yönelik olmamak kaydıyla bir veya daha fazla SPA/ihraççı hakkında, fiyat yorumu dahil, açık veya zımni strateji öneren yönlendirici araştırma. Müşteriyle <b>bire bir paylaşılması<\/b> da bu kapsamdadır. Örnek: araştırma biriminin tüm müşterilere gönderdiği makro veya hisse raporları.<\/li><li>Yatırım kuruluşları, PYŞ, 6112 sayılı Kanun kapsamındaki medya hizmet sağlayıcılar ve 5187 sayılı Basın Kanunu kapsamındaki süreli yayınlar dahil her türlü genel tavsiye m.78–79'a uygun sunulur.<\/li><li><b>Finansal bilgi<\/b> (m.80): yönlendirici olmayan bilgi; danışmanlık veya genel tavsiye sayılmaz; tarafsız, dürüst ve belirli kişi/portföy ihtiyacına yönelik olmamalıdır.<\/li><li>m.78: 48/2'nin (b)–(ğ) bentleri, 3. ve 4. fıkralar ile m.50 uygulanır. Ayrıca: yenilenme/güncelleme politikası varsa özeti ve önemli değişiklikler; dağıtım için <b>ilk hazırlandığı tarih<\/b> ile tavsiyedeki tüm fiyatların tarih ve zamanı; aynı araç için <b>son 12 ayda<\/b> farklı strateji yayımlanmışsa değişiklik, gerekçesi ve önceki tavsiyenin tarihi.<\/li><\/ul><table><tr><th>Kanal<\/th><th>Uyarı notu (Ek 3) nasıl verilir (m.79)<\/th><\/tr><tr><td>Yazılı dağıtım kanalları<\/td><td>Metnin <b>sonunda<\/b>, tavsiyeyle aynı yazı karakteri ve puntoda, dikkat çekici<\/td><\/tr><tr><td>Bilgisayar ağları<\/td><td>Tavsiye sayfası <b>görüntülenmeden önce<\/b>, aynı karakter ve puntoda<\/td><\/tr><tr><td>Radyo<\/td><td>Programın <b>başında ve sonunda bir defa<\/b> okunur<\/td><\/tr><tr><td>Televizyon<\/td><td>Başında ve sonunda <b>15 saniye<\/b>, ekranın tamamını kaplayacak şekilde; ayrıca program süresince akan bant olarak <b>iki defa<\/b><\/td><\/tr><tr><td>Bire bir sunum<\/td><td>Ek 4'teki uyarı müşteriye yapılır<\/td><\/tr><\/table>", "sorular": [{"q": "Bireysel portföy yöneticiliği faaliyetinde bulunabilecek kuruluşlar arasında aşağıdakilerden hangisi yoktur?", "o": ["Kısmi yetkili aracı kurum", "Geniş yetkili aracı kurum", "Kalkınma ve yatırım bankası", "Portföy yönetim şirketi", "Mevduat bankası"], "a": 4, "e": "BPY'yi Kurul izniyle aracı kurumlar, kalkınma ve yatırım bankaları ve portföy yönetim şirketleri yapabilir; mevduat bankaları sayılmamıştır."}, {"q": "Bireysel portföy yöneticiliği için istihdam edilecek portföy yöneticilerinde aranan finans piyasası tecrübesi en az ne kadardır?", "o": ["5 yıl", "2 yıl", "3 yıl", "4 yıl", "7 yıl"], "a": 0, "e": "4 yıllık lisans eğitimi veren kurumlardan mezun ve finans piyasalarında en az 5 yıllık tecrübesi olan yeterli sayıda portföy yöneticisi istihdam edilmelidir."}, {"q": "Yatırım danışmanlarında aranan finans piyasası tecrübesi en az ne kadardır?", "o": ["1 yıl", "2 yıl", "3 yıl", "5 yıl", "7 yıl"], "a": 2, "e": "Yatırım danışmanlığında 4 yıllık lisans mezunu ve finans piyasalarında en az 3 yıl tecrübeli yatırım danışmanları istihdam edilmelidir."}, {"q": "Aşağıdaki kuruluşlardan hangisi yatırım danışmanlığı faaliyetinde bulunamaz?", "o": ["Aracı kurum", "Ticari banka", "Yatırım ve kalkınma bankası", "Portföy yönetim şirketi", "Geniş yetkili aracı kurum"], "a": 1, "e": "Yatırım danışmanlığını aracı kurumlar, yatırım ve kalkınma bankaları ile portföy yönetim şirketleri yapabilir; ticari bankalar yapamaz."}, {"q": "Yerindelik testinde müşteriden alınan bilgiler arasında aşağıdakilerden hangisi yer almaz?", "o": ["Yatırım süresi", "Risk ve getiri tercihleri", "Gelir düzeyi", "Eğitim durumu", "Müşterinin siyasi görüşü"], "a": 4, "e": "Yerindelik testi yatırım amaçları, mali durum ile bilgi ve tecrübeye ilişkin bilgileri kapsar."}, {"q": "Yerindelik testi için istenen bilgileri vermeyen müşteriye ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Müşteri yazılı talep ederse hizmet sunulur", "Hizmet sunulur, ancak müşteriden ek teminat alınır", "Bireysel portföy yöneticiliği veya yatırım danışmanlığı sunulamaz ve müşteriye yazılı bildirim yapılır", "Hizmet sunulur, müşteri sözlü olarak uyarılır", "Müşteri profesyonel müşteri sınıfına alınır"], "a": 2, "e": "Bilgi verilmemesi veya açıkça eksik/güncel olmayan bilgi verilmesi halinde bu hizmetler sunulamaz ve kuruluş müşteriye yazılı bildirim yapar."}, {"q": "Uygunluk testi ile yerindelik testini sonuçları bakımından ayıran temel fark nedir?", "o": ["Yerindelik testi sonucuna aykırı hizmet müşteri istese de sunulamaz", "Yerindelik testi yalnızca profesyonel müşterilere uygulanır", "Uygunluk testinde mali durum bilgisi zorunlu olarak alınır", "Yerindelik testi hesap açıldıktan sonra yapılır", "Uygunluk testi sonucuna aykırı işlem kesinlikle yapılamaz"], "a": 0, "e": "Yerindelik testi sonucunda uygun olmayan hizmet müşteri istese dahi sunulamaz; uygunluk testinde ise uyarıya rağmen ısrar eden müşteriye hizmet verip vermemekte kuruluş serbesttir."}, {"q": "Bireysel portföy yöneticiliği çerçeve sözleşmesinde belirtilen portföy yöneticisinin değişmesi halinde aşağıdakilerden hangisi doğrudur?", "o": ["Değişiklik bir sonraki aylık ekstrede bildirilir", "Müşteriye bildirim yapılması zorunlu değildir", "Değişiklik en seri iletişim aracıyla derhal bildirilir; müşteri uygun görmezse sözleşmeyi tek taraflı feshedebilir", "Değişiklik için Kurul onayı gerekir", "Müşteri 30 gün içinde itiraz etmezse değişiklik kesinleşir"], "a": 2, "e": "Yönetici ayrılır veya değişirse durum müşteriye derhal en seri iletişim aracıyla bildirilir; müşteri yeni yöneticiyi uygun görmezse tek taraflı fesih hakkına sahiptir."}, {"q": "Elektronik ortamda başka portföylerin takip edilmesini veya kopyalanmasını sağlayan imkânın müşterinin portföyünde otomatik işlem yapacak şekilde sunulması hangi faaliyet kapsamındadır?", "o": ["Genel yatırım tavsiyesi", "Finansal bilgi", "Yatırım danışmanlığı", "Bireysel portföy yöneticiliği", "Emir iletimine aracılık"], "a": 3, "e": "Kopyalama imkânı sunulması yatırım danışmanlığıdır; müşterinin kendi portföyünde otomatik işlem yapılmasını sağlayacak mekanizmayla sunulursa bireysel portföy yöneticiliği sayılır."}, {"q": "Yatırım danışmanlığında ihraççı ile yetkili kuruluşun karşılıklı olarak sermaye veya oy haklarında hangi orandan itibaren sahip oldukları paylar müşteriye açıklanmalıdır?", "o": ["%0,5", "%1", "%5", "%10", "%25"], "a": 1, "e": "Yorum ve tavsiyeye konu ihraççı ile yetkili kuruluşun karşılıklı olarak %1 veya daha fazla oranda sahip oldukları paylar açıklanmalıdır."}, {"q": "Aşağıdakilerden hangisi hakkında risk ve getiri tercihine göre verilen yönlendirici tavsiye yatırım danışmanlığı kapsamında değerlendirilmez?", "o": ["Borsa İstanbul'da işlem gören paylar", "TEFAS'ta işlem gören yatırım fonları", "Özel sektör tahvilleri", "Varantlar", "Yabancı paylar"], "a": 1, "e": "TEFAS veya BEFAS'ta işlem gören fonlar, para piyasası fonları ve kısa vadeli borçlanma araçları fonlarına ilişkin tavsiyeler yatırım danışmanlığı kapsamında değildir."}, {"q": "Sermaye piyasası araçlarının satış süresi sonunda satılamayan kısmının tamamının bedeli tam ve nakden ödenerek satın alınması hangi yüklenim türüdür?", "o": ["Tümünü yüklenim", "Kısmen tümünü yüklenim", "Bakiyeyi yüklenim", "Kısmen bakiyeyi yüklenim", "En iyi gayret aracılığı"], "a": 2, "e": "Halka arz yoluyla satışa sunup satış süresi sonunda satılamayan kısmın tamamını almak bakiyeyi yüklenimdir."}, {"q": "Halka arz sürecinde talep toplama ve bedel tahsiline ilişkin gişe hizmeti Yatırım Hizmetleri Tebliği'ne göre hangi faaliyetin unsurudur?", "o": ["En iyi gayret aracılığı", "Aracılık yüklenimi", "Emir iletimine aracılık", "Portföy aracılığı", "Genel saklama"], "a": 2, "e": "Daha önce halka arza aracılık sayılan gişe hizmetleri Tebliğ ile emir iletimine aracılığın bir unsuru olarak düzenlenmiştir."}, {"q": "Halka arza aracılık sözleşmesi ile konsorsiyum sözleşmesinin tek sözleşmede birleştirilmesi halinde sözleşme konsorsiyuma katılan diğer kuruluşlarla en az ne kadar önce paylaşılmalıdır?", "o": ["1 iş günü", "2 iş günü", "3 iş günü", "5 iş günü", "10 iş günü"], "a": 1, "e": "Birleştirilmiş sözleşme diğer konsorsiyum üyeleriyle en az 2 iş günü öncesinden paylaşılarak birlikte imzalanır."}, {"q": "Saklama hizmetine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Genel saklama izni sınırlı saklama iznini kapsar", "Bankalar başka bir yatırım hizmeti sunmaksızın yalnızca genel saklama hizmeti verebilir", "Bankalara saklama için sermaye şartı aranmaz", "Bankalar emir iletimine aracılık ettikleri müşterilere genel saklama sunamaz", "Portföy saklama kuruluşu olmak için ayrıca yetkilendirme gerekir"], "a": 0, "e": "Genel saklama hizmeti izni sınırlı saklama iznini kapsamaz; her iki hizmet için ayrı ayrı izin alınması gerekir."}, {"q": "Saklama hizmetinde kayıtlar arasındaki mutabakatsızlık bütün önlemlere rağmen kaç iş günü içinde giderilemezse Kurula yazılı bilgi verilmelidir?", "o": ["1", "2", "3", "5", "10"], "a": 2, "e": "Uyumsuzluk 3 iş günü içinde giderilemezse müfettiş veya iç denetimden sorumlu en üst düzey personel derhal yönetim kurulu/iç denetim komitesi ve Kurulu yazılı bilgilendirir."}, {"q": "Saklama hizmeti sunulan müşteriler ile müşteri varlıklarına ilişkin mutabakat en az hangi sıklıkla sağlanmalıdır?", "o": ["Her takvim yılında en az bir defa", "Ayda bir", "Üç ayda bir", "Altı ayda bir", "İki yılda bir"], "a": 0, "e": "İç kontrol birimi veya personeli tarafından her takvim yılında en az 1 defa yazılı veya elektronik ortamda mutabakat sağlanır; profesyonel müşteriden yazılı onay alınırsa zorunlu değildir."}, {"q": "Müşteri hesaplarındaki nakit alacak bakiyelerinin değerlendirilmesine ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Toplu değerlendirmede gelir aracı kurumda kalır", "Bakiyeler talep halinde en geç 1 iş günü içinde ödenecek şekilde değerlendirilebilir", "Müşteri nakitlerinin tutulduğu banka hesabı aracı kurum kredisine teminat gösterilebilir", "Alt limit belirlenmesi yasaktır", "Nakitler yalnızca müşteri bazında değerlendirilebilir"], "a": 1, "e": "Nakit alacak bakiyeleri talep halinde en geç 1 iş günü içinde ödenmek üzere değerlendirilebilir; toplu değerlendirmede gelir oransal dağıtılır, alt limit sözleşmeyle konabilir."}, {"q": "Aracı kurum adına müşteri nakitleri için açılan ayrı banka hesabına ilişkin onay banka tarafından kaç iş günü içinde verilmezse tutar başka bir bankaya aktarılmalıdır?", "o": ["5", "7", "10", "15", "30"], "a": 3, "e": "Banka 15 iş günü içinde onay vermezse yatırım kuruluşu ilgili tutarı başka bir bankaya aktarmak zorundadır."}, {"q": "32 sayılı Karar çerçevesinde aracı kurumların döviz alım satımına ilişkin hangi ifade doğrudur?", "o": ["Aracı kurumlar herkesle sınırsız döviz alım satımı yapabilir", "Aracı kurumlar hiçbir şekilde döviz alım satımı yapamaz", "Aracı kurumlar sermaye piyasası faaliyetleriyle sınırlı olarak yalnızca hesap sahibi müşterileriyle döviz alım satımı yapabilir", "Aracı kurumlar yalnızca yurt dışında yerleşik kişilerle döviz alım satımı yapabilir", "Döviz hizmeti yalnızca dar yetkili aracı kurumlarca sunulabilir"], "a": 2, "e": "32 sayılı Kararın 6. maddesi uyarınca aracı kurumlar sadece sermaye piyasası faaliyetleriyle sınırlı ve sadece hesap sahibi müşterileriyle döviz alım satımı yapabilir."}, {"q": "Televizyonda sunulan genel yatırım tavsiyelerinde uyarı notuna ilişkin kural aşağıdakilerden hangisidir?", "o": ["Programın sonunda bir defa sesli okunur", "Programın başında ve sonunda 15 saniye tam ekran gösterilir, ayrıca akan bant olarak iki defa sunulur", "Yalnızca programın başında 30 saniye gösterilir", "Ekranın alt köşesinde sürekli gösterilir", "Uyarı notu gerekmez"], "a": 1, "e": "Televizyonda uyarı metni programın başında ve sonunda 15 saniye ekranın tamamını kaplayacak şekilde verilir ve program süresince akan bant olarak iki defa sunulur."}, {"q": "Genel yatırım tavsiyesinde, aynı araç için aynı kurumca daha önce farklı strateji içeren tavsiye yayımlanmışsa değişikliğe yer verilmesi hangi geriye dönük dönem için zorunludur?", "o": ["Son 3 ay", "Son 6 ay", "Son 12 ay", "Son 24 ay", "Son 5 yıl"], "a": 2, "e": "Tavsiye, aynı araç veya ihraççı için aynı kurumca geçmiş 12 aylık sürede yayımlanandan farklı strateji içeriyorsa değişiklik, gerekçesi ve önceki tavsiyenin tarihi belirtilir."}, {"q": "Aşağıdaki yan hizmetlerden hangisini bankalar herhangi bir sınırlamaya tabi olmaksızın sunabilir?", "o": ["Servet yönetimi ve finansal planlama", "Sermaye piyasası danışmanlığı", "Finansman sağlanmasına aracılık hizmeti", "Döviz hizmetleri", "Hiçbiri"], "a": 2, "e": "Aracılık yüklenimiyle ilgili hizmetler ve finansman sağlanmasına aracılık hizmetlerini aracı kurumlardan kısmi veya geniş yetkililer, bankalar ise sınırlama olmaksızın sunabilir.", "k": 1}]}, {"id": 4, "kisa": "Kuruluş, İzin ve Personel", "baslik": "III-39.1 Yatırım Kuruluşları Tebliği (I): Kuruluş, Faaliyet İzni, Organizasyon ve Personel", "ozet": "Aracı kurum kuruluş şartları, kurucular, ticaret unvanı, faaliyet izni süreci, organizasyon, genel müdür ve yönetim kurulu, personel unvanları ve davranış ilkeleri.", "notlar": "<h3>Kapsam ve tanımlar<\/h3><ul><li>III-39.1 sayılı <b>Yatırım Kuruluşları Tebliği<\/b>: yatırım kuruluşlarının kuruluşu, kurucu-ortak-personeli, faaliyete geçmesi, yükümlülükleri, merkez dışı örgütleri, dışarıdan hizmet alımı, faaliyetlerin durdurulması ve teminatları.<\/li><li><b>Aracı kurum<\/b>: SPKn m.37/1'deki (a), (b), (c), (e) ve (f) bentlerini, yani <b>alım satım aracılığı ve halka arza aracılığı münhasıran<\/b> yapmak üzere Kurulca yetkilendirilen yatırım kuruluşu.<\/li><li><b>Bankalar<\/b>: Bankacılık Kanunu m.3'te tanımlanan ve BDDK'dan lisanslı <b>mevduat ve katılım bankaları<\/b> ile <b>kalkınma ve yatırım bankaları<\/b>.<\/li><li>Dikkat: Portföy yönetim şirketleri yatırım hizmetinde bulunsa da yatırım kuruluşu sayılmaz.<\/li><li>Tebliğde bazı konular (kuruluş, ortaklık yapısı, ticaret unvanı, dışarıdan hizmet) <b>yalnız aracı kurumlar<\/b> için; bazıları (çerçeve sözleşme, müşteri sınıflandırma, personel şartları) <b>aracı kurum ve bankalar<\/b> için düzenlenmiştir. Hangi kavramın kullanıldığına dikkat et.<\/li><\/ul><h3>Aracı kurumların kuruluşu (m.5)<\/h3><ol><li><b>Anonim ortaklık<\/b> olması,<\/li><li>Paylarının tamamının <b>nama yazılı<\/b> olması,<\/li><li>Paylarının <b>nakit<\/b> karşılığı çıkarılması,<\/li><li>Kuruluş sermayesinin, <b>geniş yetkili<\/b> aracı kurum için aranan asgari özsermayenin altında olmamak kaydıyla Kurulca belirlenen tutardan az olmaması,<\/li><li>Esas sözleşmenin mevzuata uygunluğu,<\/li><li>Kurucuların Kanundaki şartları taşıması,<\/li><li>Ortaklık yapısının <b>şeffaf ve açık<\/b> olması.<\/li><\/ol><ul><li>Madde SPKn m.43'ten aynen alınmıştır.<\/li><li>İlke Kararı i-SPK 39.4 (21/03/2024, 17/452): m.5/1 ve m.63 (yeni kuruluş için yetki iptali) uyarınca kurulacak aracı kurumlar için asgari kuruluş özsermayesi <b>300.000.000 TL<\/b>; kuruluş izni karar tarihini izleyen <b>2 yıl<\/b> boyunca (mücbir haller hariç) bu tutarın altına düşürecek sermaye çıkışı yapılamaz.<\/li><li><b>2026 yılı başvuruları için asgari kuruluş özsermayesi 440.000.000 TL.<\/b><\/li><\/ul><h3>Kurucularda aranan şartlar (m.6)<\/h3><ul><li>Müflis olmamak, konkordato ilan etmemiş, iflas ertelemesi kararı olmamak;<\/li><li>Faaliyet izni Kurulca iptal edilmiş kuruluşlarda bu sonuca yol açan olayda sorumluluğu bulunmamak;<\/li><li>Kanunda yazılı suçlardan kesinleşmiş mahkumiyeti olmamak;<\/li><li>35 sayılı Bankerler KHK'sına göre kendisi veya ortağı olduğu kuruluş hakkında tasfiye kararı olmamak;<\/li><li>TCK m.53'teki süreler geçmiş olsa bile kasten işlenen bir suçtan <b>5 yıl veya daha fazla<\/b> hapis veya devletin güvenliğine karşı suçlar, zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat, bilişim suçları, kart kötüye kullanımı, aklama, terörün finansmanı, kaçakçılık, vergi kaçakçılığı, haksız mal edinme suçlarından mahkum olmamak;<\/li><li>Gerekli <b>mali güç<\/b> ile dürüstlük ve itibara sahip olmak.<\/li><li>İflas/konkordato şartı iflasın kaldırılması vb. kararın, iptal edilen kuruluştaki sorumluluk şartı ise ilgili kararın kesinleşmesinden itibaren <b>10 yıl<\/b> geçmişse dikkate alınmaz.<\/li><li>Tüzel kişi kurucuların <b>önemli etkiye sahip ortakları<\/b> da bu şartları taşır. <b>Önemli etkiye sahip ortak<\/b>: sermaye veya oy haklarının doğrudan/dolaylı <b>%10 veya fazlasına<\/b> sahip olan ya da bu oranın altında olsa da <b>yönetim kuruluna üye belirleme imtiyazı<\/b> veren paylara sahip olan.<\/li><\/ul><h3>Ticaret unvanı, işletme adı ve marka<\/h3><ul><li>Unvanda “<b>menkul değerler<\/b>” veya “<b>menkul kıymetler<\/b>” ibarelerinden biri bulunmalı. <b>Geniş yetkililer<\/b> “<b>yatırım menkul değerler<\/b>” veya “<b>yatırım menkul kıymetler<\/b>” ibaresini kullanabilir.<\/li><li>İşletme adı veya marka kullanımı <b>Kurul iznine<\/b> tabidir; işletme adı ticaret unvanıyla bağ kurulabilir nitelikte olmalı; tüm ilan, reklam ve yazışmalarda işletme adıyla birlikte ticaret unvanı kullanılır.<\/li><li>Ticaret unvanı yalnızca: <b>yönetim çoğunluğunun değişmesine yol açan<\/b> pay sahipliği değişikliğini göstermek, yasal zorunlulukları yerine getirmek veya yönetim/oy çoğunluğuna sahip ortağın unvanı değiştiğinde değiştirilebilir.<\/li><\/ul><h3>Kuruluş ve faaliyet izni<\/h3><ul><li><b>Kuruluş izni faaliyet izni demek değildir<\/b>; faaliyete geçmek için ayrıca başvurulur. Kuruluş şartlarını sağlayanlar esas sözleşmeleriyle kuruluş izni için başvurur.<\/li><li>Başvurular eksik bilgi ve belgelerin tamamlanmasından itibaren <b>azami 6 ay<\/b> içinde sonuçlandırılır.<\/li><li>Kuruluş izninden sonra <b>6 ay<\/b> içinde faaliyet izni için başvurmayan aracı kurumun faaliyet izni alma <b>hakkı düşer<\/b>; Kurul bu süreyi <b>toplam 1 yılı aşmamak<\/b> üzere uzatabilir (m.17).<\/li><li>Süresinde başvurmayan veya başvurusu uygun görülmeyenler, bildirimden itibaren <b>en geç 3 ay<\/b> içinde sona erme kararı alır veya esas sözleşmesini yatırım hizmetlerini kapsamayacak şekilde değiştirir ve TTSG ilanını izleyen <b>10 iş günü<\/b> içinde Kurula gönderir.<\/li><li>Faaliyet izni <b>her yatırım hizmeti bazında<\/b> verilir; izinden sonra da şartlar korunmalıdır. Dönüşüm ve esas sözleşme değişikliklerinde Kurulun <b>uygun görüşü<\/b> zorunludur.<\/li><li>Başvuru dilekçe ve belgelerle yapılır; Kurul standartlarını taşımayanlar <b>değerlendirmeye alınmaksızın iade<\/b> edilir; verilen sürede tamamlanmayan başvurular <b>işlemden kaldırılır<\/b>.<\/li><li>Uygun görülürse yapılabilecek tüm hizmetleri gösteren <b>tek bir yetki belgesi<\/b> verilir; <b>yetki belgesi alınmadan faaliyete başlanamaz<\/b>.<\/li><li>Yetki belgesinden önce 492 sayılı Harçlar Kanunu uyarınca <b>harç<\/b> yatırılır; Kurulun bildiriminden itibaren <b>en geç 1 ay<\/b> içinde makbuz iletilmezse faaliyet izni <b>iptal edilir<\/b>.<\/li><li>İzin almayan veya izni iptal edilenler bu hizmetleri yapamaz; esas sözleşme, unvan, ilan ve reklamlarında bu intibaı uyandıracak ibare kullanamaz. Faaliyeti geçici durdurulanlar da (esas sözleşme ve unvan hariç) bu esasa tabidir.<\/li><li>Faaliyet şartlarını kaybeden yatırım kuruluşu durumu <b>3 iş günü<\/b> içinde Kurula bildirir. Geçici durdurulanlar aykırılık giderilince Kurul uygun görürse yeniden başlar.<\/li><\/ul><h3>Faaliyete geçme genel şartları<\/h3><table><tr><th>Bent<\/th><th>Şart<\/th><th>Bankalarda<\/th><\/tr><tr><td>a<\/td><td>Kuruluş şartlarının kaybedilmemiş olması<\/td><td>–<\/td><\/tr><tr><td>b<\/td><td>Asgari kuruluş sermayesinin <b>nakden ve tamamen<\/b> ödenmiş olması<\/td><td>–<\/td><\/tr><tr><td>c<\/td><td>Hizmetlere göre sermaye yeterliliği yükümlülükleri<\/td><td>–<\/td><\/tr><tr><td>ç<\/td><td>Organizasyon yapısı<\/td><td>Aranır<\/td><\/tr><tr><td>d<\/td><td>Personel şartları<\/td><td>Aranır<\/td><\/tr><tr><td>e<\/td><td>Genel müdür ve yardımcılarına ilişkin şartlar<\/td><td>–<\/td><\/tr><tr><td>f<\/td><td>Bilgi işlem altyapısı<\/td><td>Rehber ile aranır<\/td><\/tr><tr><td>g<\/td><td>Varlıklar için <b>sigorta<\/b> dahil güvenlik önlemleri<\/td><td>Aranır<\/td><\/tr><tr><td>ğ<\/td><td>Varsa mevzuattaki teminatların tesisi<\/td><td>–<\/td><\/tr><\/table><ul><li>Yatırım kuruluşları ayrıca <b>Birliğe üye olmak<\/b> ve <b>Yatırımcı Tazmin Merkezine (YTM) katılmak<\/b> zorundadır.<\/li><\/ul><h3>Organizasyon ve çıkar çatışması (m.10–12)<\/h3><ul><li>Organizasyon: (a) faaliyetlere uygun hizmet birimleri, yeterli mekan ve teknik donanım, nitelikli birim yöneticisi ve personel; (b) belge, kayıt ve muhasebe birimi; (c) iç denetim düzenlemelerine uygun sağlıklı yönetim yapısı, görev tanımları; (d) <b>iç kontrol, teftiş ve risk yönetimi<\/b>nden oluşan iç denetim sistemi; (e) çıkar çatışmasını önleyecek yapı. Bankalarda (a)–(d) aranır.<\/li><li>Çıkar çatışması: kuruluş, ortakları, çalışanları, yöneticileri ve bunlarla ilişkili kişiler ile müşteriler arasında; ayrıca <b>müşteriler arasında<\/b> çıkabilecek çatışmaları önleyecek yapı ve idari tedbirler.<\/li><li>Piyasa işleyişinden kaynaklanan makul nedenlerle önlenemiyorsa, içerik ve nedenleri hakkında hizmet sunulmadan <b>önce<\/b> müşteri bilgilendirilir; <b>ispat yükü kuruluştadır<\/b>.<\/li><li>Yazılı <b>çıkar çatışması politikası<\/b> zorunlu; yönetim kurulu kararıyla yürürlüğe girer.<\/li><\/ul><h3>Personel genel şartları (m.13)<\/h3><ul><li>Yönetici, ihtisas personeli, müfettiş, iç kontrol ve risk yönetim elemanı: kurucu şartlarını (<b>mali güç hariç<\/b>) taşır, <b>işlem yasaklı olmaz<\/b> ve Kurulun lisanslama düzenlemesindeki <b>lisans belgesine<\/b> sahip olur.<\/li><\/ul><table><tr><th>En az 4 yıllık lisans<\/th><th>En az 2 yıllık ön lisans<\/th><\/tr><tr><td>Yöneticiler (<b>yönetim kurulu üyeleri hariç<\/b>), müfettiş, iç kontrol elemanı, risk yönetim elemanı, araştırma uzmanı, yatırım danışmanı, kurumsal finansman uzmanı, portföy yöneticisi<\/td><td>Müşteri temsilcisi, türev araçlar müşteri temsilcisi, borsa üye temsilcisi, takas ve operasyon sorumlusu, türev araçlar muhasebe ve operasyon sorumlusu<\/td><\/tr><\/table><ul><li>Bankaların yatırım hizmeti birimlerindeki yönetici ve ihtisas personeli de bu şartlara tabidir.<\/li><\/ul><h3>Genel müdür ve yardımcıları (m.14)<\/h3><ul><li>Mali piyasalar veya işletmecilik alanında <b>en az 7 yıl<\/b> mesleki deneyim; dürüstlük ve itibar.<\/li><li>Genel müdür <b>münhasıran<\/b> bu görev için istihdam edilir. İstisna: aracı kurumun sermaye ilişkisinde bulunduğu kuruluşlarda, bu kuruluşların yönetim/sermaye kontrolüne sahip olduğu kuruluşlarda, borsalar ve teşkilatlanmış piyasalar ile takas-saklama kuruluşlarında, Kurulca uygun görülecek finansal kuruluşlarda <b>icrai olmayan<\/b> ve görevi aksatmayan yönetim kurulu üyeliği gibi görevler alabilir.<\/li><li>Genel müdürlüğe <b>6 aydan fazla vekalet edilemez<\/b>.<\/li><li>Atanacak kişiler Kurula bildirilir; bildirimden itibaren <b>7 iş günü<\/b> içinde olumsuz görüş yoksa atama yapılır; atama <b>10 iş günü<\/b> içinde Birliğe bildirilir.<\/li><\/ul><h3>Yönetim kurulu (m.15)<\/h3><ul><li>Asgari <b>3 üye<\/b>; üyelerin <b>çoğunluğu 4 yıllık lisans<\/b> mezunu.<\/li><li>Tüzel kişi üye adına belirlenen gerçek kişide aracı kurum personeli şartları aranır.<\/li><li>Yönetim yetkisi murahhas üyelere bırakılacaksa <b>en az iki üye<\/b> murahhas atanır ve yetki alanları tereddütsüz belirlenir.<\/li><li>Üyeler, karara taraf olanlarla <b>son iki yılda<\/b> istihdam, sermaye veya ticari ilişki kurmuşsa ya da eş dahil <b>üçüncü dereceye kadar<\/b> kan veya sıhri hısımlığı varsa bunu gerekçesiyle bildirir ve tutanağa işletir.<\/li><li>TTK'daki müzakereye katılma yasağı, şirketle işlem yapma ve şirkete borçlanma yasağı ile rekabet yasağına tabidirler.<\/li><\/ul><h3>Personel unvanları (m.18)<\/h3><ul><li>Aracı kurum personeli: <b>yöneticiler, ihtisas personeli, müfettişler, iç kontrol elemanları, risk yönetim elemanları<\/b>.<\/li><li><b>Yöneticiler<\/b>: yönetim kurulu üyeleri, genel müdür ve yardımcıları, ihtisas birimlerinin bağlı olduğu tüm kademelerdeki yöneticiler, yönetici ile ihtisas personeli arasındaki kademeler (müdür yardımcısı, yönetmen), şube müdürü ve irtibat bürosu sorumlusu. Banka şubelerinde ihtisas personelinin yöneticisi, işlevsel olarak bağlı olduğu birimin yöneticisidir.<\/li><li><b>İhtisas personeli<\/b>: müşteri temsilcisi, türev araçlar müşteri temsilcisi, borsa üye temsilcisi, araştırma uzmanı, yatırım danışmanı, kurumsal finansman uzmanı, portföy yöneticisi, takas ve operasyon sorumlusu, türev araçlar muhasebe ve operasyon sorumlusu.<\/li><li><b>Müşteri temsilcisi<\/b>: emir alan ve ileten, genel yatırım tavsiyesi veya finansal bilgi sunan, emir sürecinde risk ve teminat takibi yapan, hesap bilgisi veren, nakit alacakları değerlendiren, pazarlama yapan personel. Türevde “türev araçlar müşteri temsilcisi”.<\/li><li>Dikkat: Çağrı merkezlerinde ve banka şubelerinde yalnızca <b>yatırım fonu katılma payları<\/b> ve borsada işlem gören <b>Hazine borçlanma araçlarına<\/b> ilişkin emir alıp sisteme aktaran ve genel hesap bilgisi veren personel <b>müşteri temsilcisi sayılmaz<\/b>.<\/li><li>Araştırma uzmanı (ekonomik araştırma, temel/teknik analiz; kalkınma ve yatırım bankalarının ilgili birimlerindeki personel dahil), yatırım danışmanı, kurumsal finansman uzmanı (fiyat tespit raporu, izahname), portföy yöneticisi, takas ve operasyon sorumlusu (netleştirme, takas, saklama, virman, teminat izleme, sermaye artırımı ve kâr payı takibi) tanımlıdır.<\/li><li>Başka unvanla istihdam edilse de görevi tanıma giriyorsa personel hükümlerine tabidir; ihtisas personeli her halükarda bu <b>unvanları kullanmak zorundadır<\/b>.<\/li><\/ul><table><tr><th>Görev<\/th><th>Lisans<\/th><th>Tecrübe<\/th><\/tr><tr><td>Genel müdür / yardımcısı (bankalar hariç)<\/td><td>SPF Düzey 3 (kısmi veya geniş yetkili için)<\/td><td>Mali piyasalar veya işletmecilikte 7 yıl<\/td><\/tr><tr><td>Portföy aracılığı birim yöneticisi<\/td><td>Düzey 3; türev varsa Türev Araçlar (ikisi birlikteyse yalnız Türev yeterli)<\/td><td>Finans piyasalarında 5 yıl<\/td><\/tr><tr><td>Risk yönetim elemanı / birim yöneticisi<\/td><td>Düzey 3; türevde Türev Araçlar<\/td><td>Sermaye piyasası, banka ve kambiyoda 3 yıl<\/td><\/tr><tr><td>Bireysel portföy yöneticisi<\/td><td>Düzey 3; türevde Türev Araçlar<\/td><td>Finans piyasalarında 5 yıl<\/td><\/tr><tr><td>Yatırım danışmanı<\/td><td>Düzey 3<\/td><td>Finans piyasalarında 3 yıl<\/td><\/tr><tr><td>Müfettiş / teftiş birimi yöneticisi (bankalar hariç)<\/td><td>Düzey 3<\/td><td>İlgili alanlarda 3 yıl<\/td><\/tr><tr><td>İç kontrol elemanı (bankalar hariç)<\/td><td><b>Düzey 2<\/b><\/td><td>İlgili alanlarda 3 yıl<\/td><\/tr><\/table><h3>Personelin uyacağı ilkeler (m.19–23)<\/h3><ul><li><b>Mesleki yeterlilik<\/b>: eğitim ve deneyimin görevi yapabilecek düzeyde olması.<\/li><li><b>Mesleki özen ve titizlik<\/b>: dikkatli ve basiretli bir personelin aynı koşulda göstereceği dikkat; asgari düzeyi çerçeve sözleşme, Tebliğ, Kurul düzenlemeleri, Birlik düzenlemeleri ve iç düzenlemelere tam uyumdur.<\/li><li><b>Dürüstlük<\/b>: çıkar çatışmasından uzak, tarafsızlığı etkileyecek müdahaleye imkan vermeme.<\/li><li><b>Sır saklama<\/b>: kuruluş, personel ve dışarıdan hizmet verenler öğrendikleri sırları açıklayamaz, kendi veya üçüncü kişi menfaatine kullanamaz. Kamuyu aydınlatma amaçlı zorunlu ilanlar, yetkili kurumların resmi talebine dayalı bilgiler, idari inceleme-soruşturma ve suç oluşturan durumlara ilişkin bilgilerin yetkililere verilmesi sır kapsamında değildir.<\/li><\/ul>", "sorular": [{"q": "Yatırım Kuruluşları Tebliği'ne göre aracı kurumların kuruluş şartları arasında aşağıdakilerden hangisi yoktur?", "o": ["Anonim ortaklık olması", "Paylarının tamamının nama yazılı olması", "Paylarının nakit karşılığı çıkarılması", "Halka açık olması", "Ortaklık yapısının şeffaf ve açık olması"], "a": 3, "e": "Kuruluş şartları arasında halka açık olma şartı yoktur; diğerleri Tebliğ m.5'te sayılmıştır."}, {"q": "2026 yılında yapılacak yeni aracı kurum kuruluş başvuruları için asgari kuruluş özsermayesi ne kadardır?", "o": ["300.000.000 TL", "380.000.000 TL", "440.000.000 TL", "190.000.000 TL", "500.000.000 TL"], "a": 2, "e": "İlke kararıyla 300 milyon TL olarak belirlenen asgari kuruluş özsermayesi 2026 başvuruları için 440.000.000 TL'dir."}, {"q": "i-SPK 39.4 sayılı İlke Kararı uyarınca kurulan aracı kurum, kuruluş izni karar tarihini izleyen ne kadar süre boyunca asgari kuruluş özsermayesinin altına düşecek şekilde sermaye çıkışı yapamaz?", "o": ["2 yıl", "6 ay", "1 yıl", "3 yıl", "5 yıl"], "a": 0, "e": "Kuruluş izni verilmesine ilişkin karar tarihini takip eden 2 yıl süreyle (mücbir haller hariç) bu sonucu doğuracak işlem yapılamaz."}, {"q": "Aracı kurum kurucularının iflas kararına ilişkin şartı, iflasın kaldırılmasına ilişkin kararın kesinleşmesinden itibaren kaç yıl geçmişse dikkate alınmaz?", "o": ["3", "5", "7", "10", "15"], "a": 3, "e": "İflas veya konkordato ile faaliyet izni iptal edilen kuruluştaki sorumluluk şartları ilgili kararın kesinleşmesinden itibaren 10 yıl geçmişse dikkate alınmaz."}, {"q": "Yatırım Kuruluşları Tebliği'ne göre önemli etkiye sahip ortak kimdir?", "o": ["Sermayenin en az %5'ine sahip ortak", "Sermaye veya oy haklarının doğrudan veya dolaylı %10 veya fazlasına sahip olan ya da yönetim kuruluna üye belirleme imtiyazı bulunan ortak", "Sermayenin %25'ine sahip ortak", "Yalnızca yönetim kurulu başkanı", "Sermayenin çoğunluğuna sahip ortak"], "a": 1, "e": "Önemli etkiye sahip ortak, sermaye veya oy haklarının %10 veya fazlasına sahip olan ya da bu oranın altında olsa da yönetim kuruluna üye belirleme imtiyazı veren paylara sahip olandır."}, {"q": "Geniş yetkili aracı kurumların ticaret unvanlarında kullanabilecekleri ibare aşağıdakilerden hangisidir?", "o": ["Yatırım menkul değerler", "Yatırım bankası", "Portföy yönetimi", "Finansal hizmetler holding", "Sermaye piyasası kurumu"], "a": 0, "e": "Aracı kurum unvanlarında menkul değerler veya menkul kıymetler ibaresi bulunur; geniş yetkililer yatırım menkul değerler veya yatırım menkul kıymetler ibaresini kullanabilir."}, {"q": "Kuruluş izni alan bir aracı kurum faaliyet izni almak için en geç ne kadar süre içinde Kurula başvurmalıdır?", "o": ["3 ay", "6 ay", "1 yıl", "18 ay", "2 yıl"], "a": 1, "e": "Kuruluş izninden sonra 6 ay içinde başvurmayan aracı kurumun faaliyet izni alma hakkı düşer; Kurul bu süreyi toplam 1 yılı aşmamak üzere uzatabilir."}, {"q": "Kurulun faaliyet iznine ilişkin bildiriminden sonra harç makbuzunun Kurula iletilmesi için öngörülen süre ve sonucu nedir?", "o": ["10 iş günü – başvuru iade edilir", "En geç 1 ay – faaliyet izni iptal edilir", "3 ay – idari para cezası", "6 ay – izin askıya alınır", "Süre yoktur"], "a": 1, "e": "Bildirimden itibaren en geç 1 ay içinde harcın ödendiğine ilişkin makbuz iletilmezse faaliyet izni iptal edilir."}, {"q": "Faaliyet izni aldıktan sonra genel veya özel faaliyet şartlarını kaybeden yatırım kuruluşu bu durumu Kurula ne zaman bildirmelidir?", "o": ["Derhal", "10 iş günü içinde", "1 ay içinde", "Yıllık faaliyet raporunda", "3 iş günü içinde"], "a": 4, "e": "Yatırım kuruluşları şartları kaybetmeleri halinde durumu Kurula 3 iş günü içinde bildirir."}, {"q": "Bankaların yatırım hizmeti sunabilmesi için Tebliğ ve Rehber uyarınca aranan genel şartlar aşağıdakilerden hangisinde doğru verilmiştir?", "o": ["Sermaye ve sermaye yeterliliği", "Organizasyon, personel, güvenlik önlemleri ve bilgi işlem altyapısı", "Yalnızca teminat", "Genel müdür şartları ve kuruluş şartları", "Hiçbir şart aranmaz"], "a": 1, "e": "Tebliğ bankalar için organizasyon, personel ve güvenlik şartlarını arar; Rehber ile bilgi işlem altyapısı şartı da eklenmiştir."}, {"q": "Aşağıdaki personelden hangisi için en az 2 yıllık ön lisans eğitimi yeterlidir?", "o": ["Araştırma uzmanı", "Kurumsal finansman uzmanı", "Müfettiş", "Borsa üye temsilcisi", "Portföy yöneticisi"], "a": 3, "e": "Müşteri temsilcisi, türev araçlar müşteri temsilcisi, borsa üye temsilcisi, takas ve operasyon sorumlusu ve türev muhasebe-operasyon sorumlusu için en az 2 yıllık ön lisans yeterlidir."}, {"q": "Aracı kurum genel müdürü ve yardımcılarında aranan mesleki deneyim süresi en az ne kadardır?", "o": ["3 yıl", "5 yıl", "7 yıl", "10 yıl", "12 yıl"], "a": 2, "e": "Genel müdür ve yardımcılarının mali piyasalar veya işletmecilik alanında en az 7 yıllık mesleki deneyimi olmalıdır."}, {"q": "Aracı kurum genel müdürlüğüne en fazla ne kadar süre vekalet edilebilir?", "o": ["1 ay", "3 ay", "6 ay", "1 yıl", "Süre sınırı yoktur"], "a": 2, "e": "Genel müdürlük görevine 6 aydan fazla vekalet edilemez."}, {"q": "Genel müdür atamasında Kurula bildirim yapıldıktan sonra Kurulca kaç iş günü içinde olumsuz görüş bildirilmezse atama yapılabilir?", "o": ["3", "5", "10", "15", "7"], "a": 4, "e": "Bildirimden itibaren 7 iş günü içinde olumsuz görüş bildirilmezse atama yapılır ve aracı kurum 10 iş günü içinde Birliğe bildirim yapar."}, {"q": "Aracı kurum yönetim kuruluna ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Asgari üç üyeden oluşur", "Üyelerin çoğunluğu 4 yıllık lisans mezunu olmalıdır", "Yönetim yetkisi murahhas üyelere bırakılacaksa en az iki üye atanır", "Üyeler TTK'daki rekabet yasağına tabidir", "Üyeler TTK'daki şirkete borçlanma yasağından muaftır"], "a": 4, "e": "Tebliğ, yönetim kurulu üyelerinin TTK'daki müzakereye katılma yasağı, şirketle işlem yapma, şirkete borçlanma ve rekabet yasağı hükümlerine tabi olduğunu ayrıca vurgular; asgari üç üye, çoğunluğun lisans mezunu olması ve murahhas üyelerde en az iki kişi şartları doğrudur."}, {"q": "Yönetim kurulu üyeleri, karara taraf olan kişilerle geçmişte hangi süre içinde kurdukları istihdam, sermaye veya ticari ilişkiyi yönetim kuruluna bildirmelidir?", "o": ["Son 1 yıl", "Son 2 yıl", "Son 3 yıl", "Son 5 yıl", "Süre sınırı yok"], "a": 1, "e": "Üyeler karara taraf olanlarla son iki yılda kurdukları ilişkileri veya üçüncü dereceye kadar hısımlıklarını gerekçesiyle bildirir ve tutanağa işletir."}, {"q": "Aşağıdakilerden hangisi müşteri temsilcisi sayılmaz?", "o": ["Şubede emir alıp borsaya ileten personel", "Müşterilere genel yatırım tavsiyesi sunan personel", "Çağrı merkezinde yalnızca yatırım fonu katılma payı emri alıp sisteme aktaran personel", "Emir sürecinde teminat takibi yapan personel", "Yatırım hizmetleri pazarlaması yapan personel"], "a": 2, "e": "Çağrı merkezleri ve banka şubelerinde yalnızca yatırım fonu payları ve borsada işlem gören Hazine borçlanma araçları emirlerini alan ve genel bilgi veren personel müşteri temsilcisi sayılmaz."}, {"q": "Aracı kurumda iç kontrol elemanı olarak çalışacak kişide aranan lisans türü hangisidir?", "o": ["Sermaye Piyasası Faaliyetleri Düzey 1", "Sermaye Piyasası Faaliyetleri Düzey 2", "Sermaye Piyasası Faaliyetleri Düzey 3", "Türev Araçlar", "Kurumsal Yönetim Derecelendirme"], "a": 1, "e": "Tabloda iç kontrol elemanı için Sermaye Piyasası Faaliyetleri Düzey 2 lisansı ve ilgili alanlarda 3 yıl tecrübe aranır."}, {"q": "Portföy aracılığı biriminde hem türev hem türev dışı işlemler yapılacaksa birim yöneticisinde aranan lisans hangisidir?", "o": ["Yalnızca Düzey 3", "Yalnızca Türev Araçlar lisansı", "Düzey 2 ve Türev Araçlar birlikte", "Düzey 1", "Lisans aranmaz"], "a": 1, "e": "Türev ve türev dışı işlemler birlikte yapılıyorsa sadece Türev Araçlar Lisansı yeterlidir."}, {"q": "Sır saklama ilkesine ilişkin aşağıdakilerden hangisi sır kapsamında değildir?", "o": ["Müşterinin portföy bilgileri", "Müşteri emirlerinin içeriği", "Suç oluşturan durumlara ilişkin bilgilerin yetkililere verilmesi", "Aracı kurumun yayımlanmamış stratejik planı", "Müşterinin kimlik bilgileri"], "a": 2, "e": "Kamuyu aydınlatma amaçlı zorunlu açıklamalar, idari inceleme-soruşturma halleri ve suç oluşturan durumlara ilişkin bilgilerin yetkililere verilmesi sır kapsamında değildir."}, {"q": "Yatırım kuruluşunun çıkar çatışması politikası nasıl yürürlüğe girer?", "o": ["Yönetim kurulu kararıyla", "Genel müdür onayıyla", "Genel kurul kararıyla", "Birlik onayıyla", "Kurul onayıyla"], "a": 0, "e": "Yatırım kuruluşunun yazılı bir çıkar çatışması politikası oluşturması ve bunun yönetim kurulu kararıyla yürürlüğe girmesi gerekir."}, {"q": "Yatırım kuruluşlarının faaliyet izni başvurularına ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["Her faaliyet için ayrı yetki belgesi verilir", "Yetki belgesi alınmadan da faaliyete başlanabilir", "Kurul standartlarını taşımayan başvurular değerlendirmeye alınmaksızın iade edilir", "Başvurular 1 yıl içinde karara bağlanır", "Faaliyet izni tüm hizmetleri kapsayacak şekilde tek seferde verilir ve sonradan şart aranmaz"], "a": 2, "e": "Standart dışı başvurular iade edilir; izinler hizmet bazında verilir ama tek yetki belgesinde gösterilir, belgeden önce faaliyete başlanamaz, karar azami 6 ay içinde verilir."}]}, {"id": 5, "kisa": "Müşteri Sınıfları ve Testler", "baslik": "III-39.1 Yatırım Kuruluşları Tebliği (II): Faaliyet İlkeleri, Risk Bildirimi, Çerçeve Sözleşme, Müşteri Sınıflandırması ve Uygunluk Testi", "ozet": "Genel faaliyet ilkeleri, risk bildirim yükümlülüğü, çerçeve sözleşme ve müşteri numarası, internet sitesi içeriği, profesyonel-genel müşteri ayrımı ve uygunluk testi.", "notlar": "<h3>Genel ilke ve esaslar (m.24)<\/h3><ul><li>Faaliyetleri çerçeve sözleşme, <b>müşteri emrini en iyi şekilde gerçekleştirme<\/b>, özen ve sadakat borcu çerçevesinde yürütmek;<\/li><li><b>Basiretli tacir<\/b> gibi davranmak, mesleki dikkat ve özen göstermek;<\/li><li>Kaynakları <b>etkin<\/b> kullanmak;<\/li><li>Kaydi sistem, yatırımcı koruma düzenlemeleri ve müşteriyi ilgilendiren konularda yeterli <b>bilgilendirme ve şeffaflık<\/b> sağlamak.<\/li><\/ul><h3>Risk bildirimi (m.25)<\/h3><ul><li>Çerçeve sözleşme imzalanmadan önce <b>genel müşterilere<\/b> asgari içeriği Kurulca belirlenen “<b>Yatırım Hizmet ve Faaliyetleri Genel Risk Bildirim Formu<\/b>” verilir; okunup anlaşıldığına dair <b>yazılı beyan<\/b> alınır, bir örneği müşteriye verilir.<\/li><li>Alım satıma aracılıkta genel risk bildirimine ek olarak işleme konu SPA'nın riskleri açıklanır, yazılı beyan alınır ve bir örnek verilir. Asgari içerik: (a) her türlü komisyon, ücret, vergi tutar/oranları; (b) <b>ikincil piyasa<\/b> olup olmadığı; (c) karşı taraf, likidite ve piyasa riskini içeren <b>risk profili<\/b>; (ç) tezgahüstü türevlerin nasıl yapılandırılıp fiyatlandığı; (d) varsa piyasa yapıcı ve ihraççı; (e) risk takibinin nasıl yapılacağı.<\/li><li>Yurt dışı işlemlerde ayrıca: paranın yurt dışına nasıl transfer edildiği, işlem yapılan borsa ve platformlar, aracın veya varlığın nerede saklandığı, tezgahüstünde karşı taraf bilgisi, <b>yatırımcı tazmin sistemi<\/b> olup olmadığı ve kapsamı.<\/li><li>Açıklamalar genel/muğlak ifadeler veya mevzuat atıfları yerine mümkün olduğunca <b>sayısal veya somut örneklerle<\/b> yapılır; yalın ve anlaşılır olur.<\/li><li>Kuruluşun müşteriye <b>karşı taraf<\/b> olduğu ve müşterinin zararının kuruluşun kârı olduğu durumlarda (kaldıraçlı işlemler gibi) bu çıkar çatışması risk bildirim formunda ayrıca yer alır.<\/li><li>Açıklanan durumlarda değişiklik olursa kuruluşun öğrenmesini izleyen <b>3 iş günü<\/b> içinde müşteriye bildirim ve yazılı beyan; yeni bir araçta işleme başlamadan önce ilgili risk bildirimi yapılmış olmalı. Bildirimler elektronik ortamda da yapılabilir.<\/li><li>Açıklama ve güncellemelerin yapıldığına dair <b>ispat yükü yatırım kuruluşundadır<\/b>.<\/li><li><b>Profesyonel müşteriler<\/b> talep ederse SPA riskleri hakkında açıklama yapılması zorunludur.<\/li><\/ul><h3>Çerçeve sözleşme (m.26)<\/h3><ul><li>İşleme başlamadan önce yazılı sözleşme zorunlu; ilişkiyi genel olarak düzenleyen, <b>başlangıçta bir kez<\/b> akdedilen ve münferit işlemlerin esasını oluşturan sözleşmedir. Asgari hususlar Kurulca belirlenir.<\/li><li>Her biri için asgari unsurlar bulunmak şartıyla birden fazla hizmet için <b>tek çerçeve sözleşme<\/b> imzalanabilir.<\/li><li><b>Müteselsil sıra numaralı ve en az bir nüsha<\/b> düzenlenir; onaylayanın imzası ve kuruluş kaşesini taşıyan bir suret müşteriye verilir; kuruluşta kalan aslın üzerine müşteri suret aldığını yazıp imzalar.<\/li><li>Müşteri devir, birleşme, veraset, müşterek hesaba yeni hak sahibi girmesi veya çıkması gibi nedenlerle değişirse sözleşme <b>yenilenir<\/b>.<\/li><li>Mevzuata aykırı, müşteri haklarını ciddi zedeleyen, kuruluş lehine tek taraflı olağanüstü hak tanıyan ve <b>emirlerin ispatını müşteriye yükleyen<\/b> hükümler konamaz.<\/li><li>Sözleşmede hüküm yoksa <b>Türk Borçlar Kanunu<\/b> genel hükümleri uygulanır.<\/li><\/ul><h3>Müşteri numarası ve hesaplar (m.27)<\/h3><ul><li>Yatırımcı varlıkları Takasbank ve MKK nezdinde saklanır ve yatırımcıca anlık izlenebilir. Her yatırımcının <b>tek bir sicil numarası<\/b> olur; farklı aracı kurumlardaki hesapları bu sicille eşleşir.<\/li><li>Çerçeve sözleşme imzalanan müşteriye <b>müşteri numarası<\/b> verilir; emir kabulünden önce takas-saklama kuruluşu/MKK nezdinde <b>saklama alt hesabı<\/b> açılır ve sicil numarasıyla eşleştirilir.<\/li><li>Müşteri numarasına bağlı birden fazla hesap açılabilir; hesap numaraları MKK alt hesabında da aynen kullanılır.<\/li><li>Bir müşteriye verilen müşteri ve hesap numarası, çerçeve sözleşmenin sona ermesinden itibaren <b>10 yıl<\/b> geçmedikçe başka müşteriye verilemez.<\/li><li><b>Sicil almamış veya sicille eşleşmemiş hesaplardan emir kabul edilemez<\/b> (Kurul araç türü bazında istisna getirebilir).<\/li><li>Gerçek kişi isim, tüzel kişi unvan değişiklikleri öğrenilir öğrenilmez <b>derhal<\/b> takas-saklama kuruluşuna/MKK'ya bildirilir.<\/li><\/ul><h3>İnternet sitesi (m.28)<\/h3><ul><li>Yetkili olunan her yatırım hizmeti için ayrı bölüm içeren site zorunlu. Asgari içerik: sunulan hizmetler; lehine faaliyet gösterilen kuruluşlar; işlemlerin asgari unsurları ve riskleri; kişisel verilerin saklama-kullanım koşulları; emir iletimi, gerçekleştirme ve takas süreci; emir gerçekleştirme politikası; borsada işlem görmeyen SPA için anlık fiyat teklifleri (bire bir türevler hariç); elektronik işlem ve bildirim esasları; araç, borsa ve piyasa bilgileri; profesyonel müşterilerin yararlanamayacağı hükümler; <b>beklenmedik durum planları<\/b> ve acil iletişim bilgileri; “sayfadaki bilgilerin genel nitelikte olduğu” açıklaması; ağ ve şifreleme riskleri; platform özellikleri ve alternatif iletişim; olağanüstü piyasa koşullarına ilişkin açıklamalar.<\/li><li>(m) <b>Fiyat sağlayıcılar<\/b>, nerede yerleşik oldukları ve pay sahipliği ilişkisi (likidite sağlayıcı olarak işlem yapılan kuruluşlardan işlemlerin <b>%20'sinden fazlası<\/b> gerçekleştirilenler açıklanır); (n) <b>reddedilen emirlerin tüm emirlere oranı<\/b>; (o) fiyat ve fark serisinde tespit edilen sapmalar; (ö) <b>müşteri şikayeti sayısı<\/b> ve müşteri sayısına oranı.<\/li><li>Kaldıraçlı işlemlerde <b>Ocak-Mart, Nisan-Haziran, Temmuz-Eylül, Ekim-Aralık<\/b> dönemleri itibarıyla kârda ve zararda olan hesapların oransal dağılımı (gerçekleşmiş kâr/zarar; dönemde kapatılan hesaplar dahil) dönem bitimini izleyen <b>2 iş günü<\/b> içinde duyurulur ve bir sonraki dönem ilanına kadar korunur. Grafik renkleri ayırt edici olmalı (Rehber).<\/li><li>Duyuru ana sayfadaki ana işlem menüsünün <b>en sol köşesinde, ilk eleman<\/b> olarak “<b>Zarar Olasılığınız<\/b>” adıyla yer alır; hesap açılışı, hesap erişimi gibi başlıklar hemen yanında aynı büyüklük ve karakterde olur.<\/li><li>(m), (n), (o), (ö) de çeyreklik dönemlerle “Zarar Olasılığınız” menüsünde ilan edilir. Hesaplama esaslarını <b>TSPB<\/b> belirler; bu bilgiler ve kâr-zarar dağılımları aracı kurum unvanlarıyla TSPB sitesinde de topluca ilan edilir.<\/li><\/ul><h3>Müşteriyi tanıma (m.29)<\/h3><ul><li><b>Müşteri<\/b>: yatırım hizmetleri ve yan hizmetler kapsamında hizmet sunulan tüm gerçek ve tüzel kişiler.<\/li><li>Hesap açmadan önce <b>5549 sayılı Kanun<\/b> uyarınca kimlik tespiti; müşterek hesaplarda <b>her hak sahibi için ayrı ayrı<\/b>.<\/li><li>Müşteri hesabında müşteri dışında yalnızca <b>noter vekaletnamesiyle<\/b> yetkilendirilmiş kişiler işlem yapabilir; vekilin kimliği tespit edilir.<\/li><li>Bilgi ve değişiklikler derhal takas-saklama kuruluşuna/MKK'ya bildirilir.<\/li><li>Yabancı banka ve aracı kurumlara hesap açmadan önce, hesabına işlem yapılan müşterinin kimlik bilgilerini vereceğine dair <b>taahhütname<\/b> alınır.<\/li><\/ul><h3>Müşteri sınıflandırması ve limitler (m.30)<\/h3><ul><li>Amaç: bilgi, tecrübe ve finansal varlığı yüksek yatırımcıları bazı koruyucu hükümlerden muaf tutmak. Dayanak SPKn m.45 (Kurul yatırımcıları sınıflandırmaya yetkili).<\/li><li>Tüm müşteriler <b>profesyonel veya genel<\/b> olarak sınıflandırılır; müşteriye sınıfı, ilgili hükümler ve <b>sınıf değiştirme hakkı<\/b> hakkında bilgi verilir.<\/li><li>Sınıfı etkileyecek durumu müşteri bildirir; bilgilerin doğruluğu ve güncellenmesinden <b>müşteri<\/b> sorumludur. Profesyonelliği tevsik eden belgeler istenir ve belge-kayıt süresince saklanır.<\/li><li>Aracı kurumlar mali durum, risk ve teminat durumunu dikkate alarak işlem türü ve araç bazında <b>işlem/pozisyon limiti<\/b> tahsis eder; limitlere göre müşterileri gruplayabilir.<\/li><\/ul><h4>Profesyonel müşteri (m.31)<\/h4><ul><li>Kendi yatırım kararını verebilecek ve riskleri değerlendirebilecek tecrübe ve uzmanlığa sahip müşteri:<\/li><li>(a) Aracı kurumlar, bankalar, PYŞ, kolektif yatırım kuruluşları, emeklilik yatırım fonları, sigorta şirketleri, ipotek finansman kuruluşları, varlık yönetim şirketleri ve yurt dışı muadilleri;<\/li><li>(b) Emekli ve yardım sandıkları, 506 sayılı Kanun geçici 20. madde sandıkları;<\/li><li>(c) Kamu kurumları, <b>TCMB<\/b>, Dünya Bankası ve IMF gibi uluslararası kuruluşlar;<\/li><li>(ç) Bunlara benzer olduğu Kurulca kabul edilenler;<\/li><li>(d) Büyüklük kıstaslarından <b>en az ikisini<\/b> taşıyan kuruluşlar;<\/li><li>(e) Talebe dayalı profesyonel kabul edilenler.<\/li><\/ul><table><tr><th>Kıstas (d bendi)<\/th><th>Tebliğdeki tutar<\/th><th>19.12.2025'ten itibaren ilk kez profesyonel olacaklar için<\/th><\/tr><tr><td>Aktif toplamı<\/td><td>50.000.000 TL<\/td><td>500.000.000 TL<\/td><\/tr><tr><td>Yıllık net hasılat<\/td><td>90.000.000 TL<\/td><td>1.000.000.000 TL<\/td><\/tr><tr><td>Özsermaye<\/td><td>5.000.000 TL<\/td><td>50.000.000 TL<\/td><\/tr><\/table><ul><li>Güncelleme Kurul Karar Organının <b>18.12.2025 tarih ve 65 sayılı<\/b> toplantısıyla yapılmıştır.<\/li><li>Hizmetten önce profesyonel müşteri, <b>yararlanamayacağı hükümler<\/b> hakkında <b>yazılı<\/b> bilgilendirilir.<\/li><li>Şartları taşıdığı halde profesyonel sayılmak istemediğini <b>yazılı<\/b> bildiren müşterinin talebi dikkate alınmak <b>zorundadır<\/b>.<\/li><li>Profesyonel tanımına girmeyenler <b>genel müşteridir<\/b>.<\/li><\/ul><h4>Talebe dayalı profesyonel müşteri (m.32)<\/h4><ul><li>Genel müşteri <b>yazılı talep<\/b> eder ve aşağıdakilerden <b>en az ikisini<\/b> tevsik ederse profesyonel sıfatıyla hizmet alabilir:<\/li><\/ul><table><tr><th>Şart<\/th><th>Tebliğ<\/th><th>Güncel (18.12.2025, 65 sayılı)<\/th><\/tr><tr><td>(a) Son 1 yıl içinde her 3 aylık dönemde en az … hacimde ve <b>en az 10 adet<\/b> işlem<\/td><td>500.000 TL<\/td><td><b>5.000.000 TL<\/b><\/td><\/tr><tr><td>(b) Nakit mevduat ve SPA dahil finansal varlık toplamı<\/td><td>1.000.000 TL'yi aşması<\/td><td><b>10.000.000 TL<\/b><\/td><\/tr><tr><td>(c) Finansta üst düzey yöneticilik <b>en az 2 yıl<\/b> veya sermaye piyasasında ihtisas personeli olarak <b>en az 5 yıl<\/b> veya <b>İleri Düzey ya da Türev Araçlar lisansı<\/b><\/td><td>Değişmedi<\/td><td>Değişmedi<\/td><\/tr><\/table><ul><li><b>Nitelikli yatırımcı<\/b>: tüm profesyonel müşteriler (talebe dayalılar dahil) ile m.32/1'deki şartlardan yalnızca <b>(b) finansal varlık şartını<\/b> sağlayanlar.<\/li><li>Kurul Karar Organı <b>10.03.2026 tarih ve 14 sayılı<\/b> karar: finansal tutarlar nedeniyle profesyonel/nitelikli yatırımcı sıfatı kazananlar, sonradan tutarların altına düşseler de <b>sıfatlarını korur<\/b>; nitelikli yatırımcılığı tevsik eden belgeler de istenir ve saklanır.<\/li><li>Artırılan tutarlar yalnızca <b>ilk defa<\/b> sıfat kazanacaklara uygulanır; önceden kazananların sıfatı devam eder.<\/li><li>Dikkat: Yeni tutarlar <b>gayrimenkul ve girişim sermayesi yatırım fonlarının<\/b> nitelikli yatırımcıları için uygulanmaz; onlar için eski tutarlar geçerlidir.<\/li><\/ul><h4>Profesyonel müşterilerin yararlanamayacağı hükümler<\/h4><table><tr><th>Hüküm<\/th><th>Profesyonel müşteri için<\/th><\/tr><tr><td>Kaldıraçlıda teminatı aşan zararın istenmemesi (YHT m.19, 24)<\/td><td>Yararlanamaz (talebe dayalı profesyonel yararlanır)<\/td><\/tr><tr><td>Saklamadaki varlıklara ilişkin yıllık mutabakat (YHT m.68)<\/td><td>Yazılı onayla zorunlu değil<\/td><\/tr><tr><td>Saklama bakiyesi aylık bildirimi (YHT m.69)<\/td><td>Sözleşmeyle zorunlu değil<\/td><\/tr><tr><td>Uygunluk testi (YKT m.33)<\/td><td>Zorunlu değil<\/td><\/tr><tr><td>Yerindelik testi (YHT m.40)<\/td><td>Yalnız yatırım amaçları (süre, risk-getiri) alınması yeterli<\/td><\/tr><tr><td>İlave risk bildirimleri (YKT m.25)<\/td><td>Genel form dışındakiler talep halinde açıklanır<\/td><\/tr><\/table><h3>Uygunluk testi (m.33)<\/h3><ul><li><b>Tanım<\/b>: pazarlanan veya müşterinin talep ettiği ürün ya da hizmetin müşteriye uygun olup olmadığını değerlendirmek için müşterinin bu ürünün <b>risklerini anlayabilecek bilgi ve tecrübeye<\/b> sahip olup olmadığının tespiti.<\/li><li><b>Alım satıma aracılık ve halka arza aracılık<\/b> faaliyetlerinde, yalnızca <b>genel müşterilere<\/b> zorunlu; profesyonellere zorunlu değil.<\/li><li>Standart formların asgari içeriğini <b>Birlik<\/b> belirler ve <b>Kurul onayına<\/b> sunar. Bilgilerin sağlanması ve güncellenmesine ilişkin <b>iş akış prosedürü<\/b> yazılı hale getirilir ve <b>yönetim kurulunca<\/b> onaylanır.<\/li><li>Formlarla birlikte hesabı açan/bilgileri toplayan müşteri temsilcisi ile onaylayan yetkilinin ad, soyad ve unvanı saklanır; formlar, belgeler ve uyarılar belge-kayıt süresince saklanır.<\/li><li>Toplanan bilgiler: <b>yatırım süresi, risk tercihleri, getiri tercihleri, müşteri bilgileri, geçmiş işlemler<\/b>. Dikkat: uygunluk testinde <b>mali durum bilgisi alınmaz<\/b>.<\/li><li>İlk bilgiler <b>yazılı<\/b> alınır; güncellemeler <b>elektronik<\/b> yapılabilir. Bilgilerin amacı müşteriye bildirilir; bilgi vermemesi yönünde <b>telkin yasaktır<\/b>.<\/li><li>Müşteri bilgi vermez veya eksik/güncel olmayan bilgi verirse, hangi ürünün uygun olduğunun tespit edilemeyeceği konusunda <b>yazılı uyarı<\/b> yapılır.<\/li><\/ul><table><tr><th>Zorunlu olmayan haller<\/th><th>Şartlar<\/th><\/tr><tr><td><b>Yatırım fonu katılma payları<\/b> ve borsada/teşkilatlanmış pazarda işlem gören <b>Hazine kamu borçlanma araçları<\/b><\/td><td>Ürün/hizmet <b>müşterinin kendi talebiyle<\/b> sunulmuş ve müşteri testin zorunlu olmadığı konusunda bilgilendirilmiş olmalı; ispat yükü kuruluşta.<\/td><\/tr><tr><td>Diğer tüm SPA<\/td><td>Müşteri kendisi talep etse de test yapılır.<\/td><\/tr><\/table><ul><li>Sonuç: ürün uygun değilse müşteri <b>yazılı uyarılır<\/b> ve o ürüne yönelik müşteriye <b>bire bir genel yatırım tavsiyesinde bulunulamaz<\/b>. Uyarıya rağmen müşteri ısrar ederse kuruluş hizmeti verip vermemekte <b>serbesttir<\/b>.<\/li><li>Dikkat: Yerindelik testinde sonuca aykırı hizmet müşteri istese de verilemez; uygunluk testinde ise karar müşteriye ve kuruluşun politikasına bırakılmıştır.<\/li><li>Rehber: testler ve uyarılar yazılı veya elektronik ortamda yapılabilir (ispat yükü kuruluşta); ancak uygunluk ve yerindelik testleri ile uyarıları <b>şube veya çağrı merkezinin kayıtlı telefonları<\/b> üzerinden yapılamaz.<\/li><\/ul>", "sorular": [{"q": "Yatırım Hizmet ve Faaliyetleri Genel Risk Bildirim Formu hangi müşterilere ve ne zaman verilmelidir?", "o": ["Tüm müşterilere, ilk işlemden sonra", "Genel müşterilere, çerçeve sözleşme imzalanmadan önce", "Profesyonel müşterilere, talep halinde", "Yalnızca kaldıraçlı işlem yapan müşterilere", "Genel müşterilere, yılda bir kez"], "a": 1, "e": "Yatırım kuruluşları çerçeve sözleşme imzalamadan önce genel müşterilerine bu formun bir örneğini verir ve okunup anlaşıldığına dair yazılı beyan alır."}, {"q": "Risk bildiriminde açıklanan durumlarda değişiklik olması halinde müşteriye bildirim, değişikliğin öğrenilmesini izleyen ne kadar süre içinde yapılmalıdır?", "o": ["Derhal", "1 iş günü", "3 iş günü", "5 iş günü", "10 iş günü"], "a": 2, "e": "Değişikliğin öğrenilmesini takip eden 3 iş günü içinde müşteriye bildirimde bulunulur ve yazılı beyan alınır."}, {"q": "Alım satıma aracılık faaliyetinde genel risk bildirimine ek olarak yapılacak açıklamalarda aşağıdakilerden hangisinin yer alması zorunlu değildir?", "o": ["İşlemlere ilişkin komisyon ve vergi oranları", "Aracın ikincil piyasası olup olmadığı", "Karşı taraf, likidite ve piyasa riskini içeren risk profili", "Varsa piyasa yapıcısı ve ihraççı", "Aracı kurumun son üç yıllık kârlılığı"], "a": 4, "e": "Ek açıklamalar komisyon-vergi, ikincil piyasa, risk profili, tezgahüstü türev yapısı, piyasa yapıcı-ihraççı ve risk takibini içerir; kuruluşun kârlılığı bunlar arasında değildir."}, {"q": "Yatırım Kuruluşları Tebliği'ne göre çerçeve sözleşmelere ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Birden fazla hizmet için tek sözleşme imzalanabilir", "Müteselsil sıra numaralı düzenlenir", "Müşterek hesaba yeni hak sahibi girerse sözleşme yenilenir", "Emirlerin ispatının müşteriye yüklenmesine ilişkin hüküm konabilir", "Hüküm bulunmayan hallerde Türk Borçlar Kanunu uygulanır"], "a": 3, "e": "Çerçeve sözleşmelerde emirlerin ispatının müşteriye yüklenmesine ilişkin hükümlere yer verilemez."}, {"q": "Bir müşteriye verilen müşteri ve hesap numarası, çerçeve sözleşmenin sona ermesinden itibaren kaç yıl geçmedikçe başka bir müşteriye verilemez?", "o": ["10", "3", "5", "15", "20"], "a": 0, "e": "Müşteri ve hesap numarası çerçeve sözleşmenin sona erme tarihinden itibaren 10 yıl geçmedikçe başka müşteriye verilemez."}, {"q": "Kaldıraçlı işlemlerde kârda ve zararda olan hesapların oransal dağılımı internet sitesinde hangi sürede duyurulmalıdır?", "o": ["Her ay sonunu izleyen 5 iş günü içinde", "Üç aylık dönemlerin bitimini izleyen 2 iş günü içinde", "Yıl sonunu izleyen 20 iş günü içinde", "Altı aylık dönem sonunda", "Her işlem gününün sonunda"], "a": 1, "e": "Ocak-Mart, Nisan-Haziran, Temmuz-Eylül, Ekim-Aralık dönemleri esas alınarak dönem bitimini takip eden 2 iş günü içinde duyurulur."}, {"q": "Kaldıraçlı işlemlerde kâr/zarar dağılımına ilişkin duyurunun internet sitesindeki menü adı ve yeri nedir?", "o": ["Risk Bildirimi – sayfanın alt kısmı", "Zarar Olasılığınız – ana işlem menüsünün en sol köşesinde ilk eleman", "Yatırımcı Bilgilendirme – sağ üst köşe", "Kârlılık Oranları – ayrı bir açılır pencere", "Duyurular – haber bölümü"], "a": 1, "e": "Duyuru, ana işlem menüsünün en sol köşesinde menünün ilk elemanı olarak Zarar Olasılığınız adıyla yer almalıdır."}, {"q": "İnternet sitesinde fiyat sağlayıcılara ilişkin açıklamada, likidite sağlayıcı olarak işlem gerçekleştirilen kuruluşlardan hangileri açıklanır?", "o": ["İşlemlerin %5'inden fazlasının gerçekleştirildiği kuruluşlar", "İşlemlerin %10'undan fazlasının gerçekleştirildiği kuruluşlar", "İşlemlerin %20'sinden fazlasının gerçekleştirildiği kuruluşlar", "İşlemlerin %50'sinden fazlasının gerçekleştirildiği kuruluşlar", "Yalnızca yurt dışında yerleşik olanlar"], "a": 2, "e": "Likidite sağlayıcı olarak işlem gerçekleştirilen kuruluşlardan bu nitelikteki işlemlerin %20'sinden fazlasının gerçekleştirildiği kuruluşlar açıklanır."}, {"q": "Müşteri hesabında müşteri dışında bir kişinin işlem yapabilmesi için gereken şart nedir?", "o": ["Noter marifetiyle düzenlenmiş vekaletname", "Müşterinin sözlü onayı", "Aracı kurum genel müdürünün onayı", "Müşterinin e-posta ile yetki vermesi", "Kurul izni"], "a": 0, "e": "Müşteri hesabına müşteri dışında yalnızca noter marifetiyle düzenlenmiş vekaletname ile yetkilendirilmiş kişiler işlem yapabilir ve vekilin kimliği tespit edilir."}, {"q": "19.12.2025 tarihinden itibaren ilk kez profesyonel müşteri sayılacak kuruluşlar için aranan büyüklük kıstasları aşağıdakilerden hangisinde doğru verilmiştir?", "o": ["Aktif 50 milyon, hasılat 90 milyon, özsermaye 5 milyon TL; en az ikisi", "Aktif 500 milyon, hasılat 1 milyar, özsermaye 50 milyon TL; en az ikisi", "Aktif 500 milyon, hasılat 1 milyar, özsermaye 50 milyon TL; üçü birden", "Aktif 100 milyon, hasılat 200 milyon, özsermaye 10 milyon TL; en az biri", "Aktif 1 milyar, hasılat 2 milyar, özsermaye 100 milyon TL; en az ikisi"], "a": 1, "e": "Kurulun 18.12.2025 tarihli kararıyla aktif toplamı 500 milyon, yıllık net hasılat 1 milyar ve özsermaye 50 milyon TL kıstaslarından en az ikisinin sağlanması gerekir."}, {"q": "Güncel düzenlemeye göre talebe dayalı profesyonel müşteri olmak isteyen bir genel müşterinin finansal varlık şartını sağlayabilmesi için finansal varlık toplamının hangi tutarı aşması gerekir?", "o": ["1.000.000 TL", "5.000.000 TL", "10.000.000 TL", "50.000.000 TL", "500.000 TL"], "a": 2, "e": "Kurul 18.12.2025 tarihli kararla 1 milyon TL olan finansal varlık tutarını 10 milyon TL'ye yükseltmiştir."}, {"q": "Talebe dayalı profesyonel müşteri şartlarından işlem sıklığı kriteri için güncel düzenleme aşağıdakilerden hangisidir?", "o": ["Son 1 yıl içinde her 3 aylık dönemde en az 5.000.000 TL hacimde ve en az 10 adet işlem", "Son 6 ay içinde toplam 1.000.000 TL hacim", "Son 1 yıl içinde her ay en az 20 işlem", "Son 2 yılda toplam 10 milyon TL hacim", "Son 3 ayda en az 50 işlem"], "a": 0, "e": "Son 1 yıl içinde her 3 aylık dönemde en az 10 adet işlem şartı korunmuş, hacim 500 bin TL'den 5 milyon TL'ye yükseltilmiştir."}, {"q": "Talebe dayalı profesyonel müşteri olabilmek için aşağıdaki şartlardan en az kaçının sağlanması gerekir?", "o": ["Biri", "İkisi", "Üçü", "Dördü", "Herhangi bir şart aranmaz, yazılı talep yeterlidir"], "a": 1, "e": "Genel müşteri yazılı talep eder ve sayılan üç şarttan en az ikisini sağladığını tevsik ederse profesyonel sıfatıyla yararlanabilir.", "k": 1}, {"q": "Talebe dayalı profesyonel müşteri şartlarından mesleki tecrübe kriteri için aşağıdakilerden hangisi yeterli değildir?", "o": ["Finans alanında üst düzey yönetici pozisyonunda en az 2 yıl görev", "Sermaye piyasasında en az 5 yıl ihtisas personeli olarak çalışmış olmak", "Sermaye Piyasası Faaliyetleri İleri Düzey Lisansına sahip olmak", "Türev Araçlar Lisansına sahip olmak", "Sermaye Piyasası Faaliyetleri Düzey 1 Lisansına sahip olmak"], "a": 4, "e": "Mesleki kriter üst düzey yöneticilik (2 yıl), ihtisas personelliği (5 yıl) veya İleri Düzey ya da Türev Araçlar lisansı ile sağlanır."}, {"q": "Kurul Karar Organı'nın 10.03.2026 tarihli kararına göre finansal tutarlar nedeniyle profesyonel müşteri sıfatı kazanmış bir müşterinin varlıkları sonradan eşiğin altına düşerse ne olur?", "o": ["Sıfat derhal sona erer", "Sıfat 1 yıl sonra sona erer", "Sıfatı devam eder", "Müşteri yeniden başvurmak zorundadır", "Müşteri otomatik olarak nitelikli yatırımcı sıfatını kaybeder ama profesyonel kalır"], "a": 2, "e": "Bu kararla, sıfatı kazandıktan sonra finansal tutarların altına düşülse dahi profesyonel müşteri ve nitelikli yatırımcı sıfatının devam edeceği kararlaştırılmıştır."}, {"q": "Artırılan profesyonel müşteri ve nitelikli yatırımcı tutarları aşağıdakilerden hangisi bakımından uygulanmaz?", "o": ["Yatırım fonu yatırımcıları", "Gayrimenkul yatırım fonları ve girişim sermayesi yatırım fonlarının nitelikli yatırımcıları", "Kaldıraçlı işlem yapan müşteriler", "Yurt dışında yerleşik müşteriler", "Tüzel kişi müşteriler"], "a": 1, "e": "Yeni tutarlar gayrimenkul ve girişim sermayesi yatırım fonlarının katılma paylarının satılacağı nitelikli yatırımcılar için uygulanmaz; bunlar için eski tutarlar geçerlidir."}, {"q": "Aşağıdakilerden hangisi Yatırım Kuruluşları Tebliği'ne göre kendiliğinden profesyonel müşteri sayılan kuruluşlar arasında değildir?", "o": ["Sigorta şirketleri", "Emeklilik yatırım fonları", "Türkiye Cumhuriyet Merkez Bankası", "Varlık yönetim şirketleri", "Aktif toplamı 10 milyon TL olan bir ticaret şirketi"], "a": 4, "e": "Ticaret şirketleri ancak büyüklük kıstaslarından en az ikisini sağlarsa profesyonel sayılır; diğerleri tanım gereği profesyoneldir."}, {"q": "Profesyonel müşteri olma şartlarını taşıyan bir müşteri profesyonel müşteri olarak dikkate alınmak istemediğini yazılı olarak bildirirse ne olur?", "o": ["Talep reddedilir", "Yatırım kuruluşu bu talebi dikkate almak zorundadır", "Kurul onayı gerekir", "Müşteri yalnızca talebe dayalı profesyonel olabilir", "Talep bir yıl sonra geçerli olur"], "a": 1, "e": "Şartları taşıdığı halde profesyonel sayılmak istemediğini yazılı bildiren müşterinin talebini yatırım kuruluşu dikkate almak zorundadır."}, {"q": "Uygunluk testi kapsamında müşteriden alınmayan bilgi aşağıdakilerden hangisidir?", "o": ["Yatırım süresi", "Risk tercihleri", "Getiri tercihleri", "Mali durum", "Geçmiş işlemler"], "a": 3, "e": "Uygunluk testinde yatırımcının mali durumuna ilişkin bilgi alınmaz; geçmiş tecrübesi, bilgi düzeyi ve yatırım tercihleri sorulur."}, {"q": "Aşağıdaki işlemlerden hangisinde, müşterinin kendi talebi ve bilgilendirilmesi şartıyla uygunluk testi yapılması zorunlu değildir?", "o": ["Borsada işlem gören hisse senedi alımı", "Varant alımı", "Yatırım fonu katılma payı alımı", "Vadeli işlem sözleşmesi", "Özel sektör tahvili alımı"], "a": 2, "e": "Yatırım fonu katılma payları ve borsada işlem gören Hazine kamu borçlanma araçları için, müşterinin talebi ve bilgilendirilmesi şartıyla test zorunlu değildir."}, {"q": "Uygunluk testi sonucunda bir ürünün müşteriye uygun olmadığı anlaşılmasına rağmen müşteri ürünü almakta ısrar ederse hangisi doğrudur?", "o": ["İşlem kesinlikle yapılamaz", "Yatırım kuruluşu hizmeti verip vermemekte serbesttir", "Kurul onayı alınmalıdır", "Müşteri profesyonel müşteri sınıfına alınmalıdır", "Yatırım kuruluşu bire bir genel yatırım tavsiyesinde bulunmak zorundadır"], "a": 1, "e": "Uyarıya rağmen ısrar eden müşteriye hizmet verip vermemekte kuruluş serbesttir; ancak o ürüne yönelik bire bir genel yatırım tavsiyesinde bulunamaz."}, {"q": "Uygunluk testine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Formların asgari içeriğini Birlik belirleyip Kurul onayına sunar", "İş akış prosedürü yönetim kurulunca onaylanır", "İlk bilgiler yazılı alınır, güncellemeler elektronik yapılabilir", "Test ve uyarılar şube veya çağrı merkezinin kayıtlı telefonları üzerinden yapılabilir", "Yalnızca genel müşterilere zorunludur"], "a": 3, "e": "Rehbere göre uygunluk ve yerindelik testleri ile uyarıları şube veya çağrı merkezlerindeki kayıtlı telefonlar aracılığıyla yapılamaz."}, {"q": "Profesyonel müşterilerin yararlanamayacağı mevzuat hükümleri arasında aşağıdakilerden hangisi yoktur?", "o": ["Uygunluk testi yapılması", "Saklama bakiyesinin aylık bildirimi (sözleşme varsa)", "Kaldıraçlıda teminatı aşan zararın talep edilmemesi", "Yerindelik testinde mali durum bilgisinin alınması", "Müşteri emirlerinin en iyi şekilde gerçekleştirilmesi"], "a": 4, "e": "En iyi gerçekleştirme yükümlülüğü tüm müşteriler için geçerlidir; diğerleri profesyonel müşterilerin yararlanamadığı veya kısmen uygulanan hükümlerdir."}]}, {"id": 6, "kisa": "Yükümlülükler ve Tedbirler", "baslik": "III-39.1 Yatırım Kuruluşları Tebliği (III): Ortaklık Yapısı, Bildirimler, İştirak, Reklam ve Promosyon, Merkez Dışı Örgütler, Dışarıdan Hizmet, Yasaklar ve Tedbirler", "ozet": "Pay devirleri, tescil-ilan ve bildirim süreleri, izinsiz faaliyet, iştirak sınırları, reklam kuralları ve TSPB Promosyon Kampanyaları Yönergesi, şube-irtibat bürosu, dışarıdan hizmet, yasak işler, faaliyetlerin durdurulması, Kurul tedbirleri ve teminatlar.", "notlar": "<h3>Ortaklık yapısı değişiklikleri (m.34–35; yalnız aracı kurumlar)<\/h3><ul><li>Bir kişiye ait sayılan paylar: gerçek kişi ile <b>eşi ve velayeti altındaki çocukları<\/b>, bunların sınırsız sorumlu ortak veya YK başkanı/üyesi, genel müdür/yardımcısı oldukları ortaklıklar; kamu tüzel kişileri hariç tüzel kişi veya sayılanların sermayesinin doğrudan/dolaylı <b>%25 veya fazlasına<\/b> iştirak ettiği ortaklıklar; Kurulca birlikte hareket ettiği belirlenenler.<\/li><li>Ortak olmanın riski: iflas veya tedrici tasfiyede sorumluluğu tespit edilen ortağın <b>şahsi iflası<\/b> istenebilir.<\/li><\/ul><table><tr><th>Durum<\/th><th>Rejim<\/th><\/tr><tr><td>Sermaye/oy haklarının <b>%10 veya fazlasını<\/b> edinerek ortak olma; bir ortağın payının <b>%10, %20, %33, %50<\/b>'yi aşması veya bu oranların altına düşmesi<\/td><td><b>Kurul izni<\/b><\/td><\/tr><tr><td>Yönetim imtiyazı veren veya intifa hakkı taşıyan payların devri<\/td><td>Orana bakılmaksızın <b>Kurul izni<\/b><\/td><\/tr><tr><td>Ortak tüzel kişide dolaylı olarak %10/20/33/50 değişiklik doğuran devirler; yönetim imtiyazlı tüzel kişide bu oranlarda değişiklik; %10'dan fazla paylı tüzel kişinin imtiyazlı paylarının devri<\/td><td>Faaliyet şartları bakımından <b>Kurul onayı<\/b> (devir geçerli; Kurul faaliyetin devamını gözden geçirir)<\/td><\/tr><tr><td>Bu oranlara ulaşmayan veya arada kalan devirler<\/td><td>Devri izleyen <b>10 iş günü<\/b> içinde Kurula bildirim<\/td><\/tr><tr><td>Bankaların ortaklık yapısındaki değişiklik (BDDK izniyle)<\/td><td>BDDK iznini izleyen <b>10 iş günü<\/b> içinde Kurula bildirim<\/td><\/tr><tr><td>Aykırı devirler<\/td><td>Pay defterine <b>kaydolunmaz<\/b>; yapılan kayıtlar <b>hükümsüz<\/b><\/td><\/tr><\/table><ul><li>Dolaylı hesap örneği: tüzel kişi aracı kurumun %90'ına sahip, tüzel kişinin bir ortağı oradaki %20 payını devrediyor: 0,9 × 0,2 = <b>%18<\/b> dolaylı değişiklik, izne tabi.<\/li><li><b>Borsada işlem gören<\/b> aracı kurum paylarında: %10 edinimi veya %10/20/33/50 aşımı, <b>temettü hariç ortaklık haklarının kullanılabilmesi<\/b> için Kurul iznine tabidir; başvuruyu oranlara ulaşan kişi yapar. Oranların altına düşüşler <b>10 iş günü<\/b> içinde bildirilir; ancak bir ortağın payını <b>%10'un altına düşürecek satıştan önce<\/b> Kurul izni alınır.<\/li><\/ul><h3>Tescil-ilan ve bildirimler (m.37–38)<\/h3><ul><li>Merkez dışı örgüt açma ve işletme adı/marka izinleri, izin tebliğini izleyen <b>10 iş günü<\/b> içinde ticaret siciline tescil ve TTSG'de ilan. Ayrıca her türlü faaliyet izni ve bu izinler kuruluşun <b>internet sitesi<\/b> ile <b>KAP<\/b>'ta ilan edilir.<\/li><li>Faaliyetlerin geçici durdurulması veya izin iptali Kurulca tebliğ edilince <b>derhal<\/b> internet sitesi ve KAP'ta ilan. Merkez dışı örgütün kapatılmasında tescil 10 iş günü içinde terkin edilir. Masraflar kuruluşa aittir.<\/li><li>Başka kanunlardan kaynaklanmadıkça gazete ilanlarının yerini <b>elektronik ilan<\/b> almıştır.<\/li><\/ul><table><tr><th>Bildirim<\/th><th>Nereye<\/th><th>Süre<\/th><\/tr><tr><td>Yönetici, ihtisas personeli, müfettiş, iç kontrol ve risk elemanının işe alınması (belgeler ve özgeçmişle); ayrılma, unvan/birim değişikliği<\/td><td><b>SPL<\/b><\/td><td>10 iş günü<\/td><\/tr><tr><td>Bu personelin Tebliğde aranan durumlarındaki değişiklik<\/td><td>SPL<\/td><td>10 iş günü<\/td><\/tr><tr><td>Murahhas üye tayini ve yetkilerine ilişkin YK kararı<\/td><td>Birlik<\/td><td>Tescili izleyen <b>3 iş günü<\/b><\/td><\/tr><tr><td>Merkez ve merkez dışı örgüt adresleri ve değişiklikleri<\/td><td>Birlik<\/td><td>10 iş günü<\/td><\/tr><tr><td>İmza sirküleri ve değişiklikleri<\/td><td>Birlik<\/td><td>10 iş günü<\/td><\/tr><tr><td>Açılan ve aleyhe açılan dava ve takipler ile sonuçları<\/td><td>Birlik; tutar <b>özsermayenin %10'unu<\/b> geçerse Kurula da<\/td><td>10 iş günü<\/td><\/tr><tr><td>Bağımsız denetim kuruluşu bilgileri; iletişim, internet adresi, vergi ve sicil numarası değişiklikleri; ilan gazeteleri<\/td><td>Birlik<\/td><td>10 iş günü<\/td><\/tr><\/table><ul><li>Kısaca: <b>personel bilgileri SPL'ye<\/b>, diğer bilgiler <b>Birliğe<\/b>. Birlik ve SPL veri tabanlarını birbirlerinin ve her durumda Kurulun erişimine açar.<\/li><\/ul><h3>İzinsiz sermaye piyasası faaliyeti (m.39)<\/h3><ul><li>Kurul izni olmadan sermaye piyasası faaliyeti bir <b>sermaye piyasası suçudur<\/b> (SPKn m.99 ve 109).<\/li><li>Hesap ilişkisi içindeki kişinin mevzuatın izin verdiği haller dışında <b>birden fazla kişi adına veya temsilci sıfatıyla<\/b> işlem yaptığı öğrenilirse araştırılır: komisyon tahsil edip etmediği; fiilen portföy yöneticiliği sonucu doğuran işlemler; şube/irtibat bürosu benzeri mekan, donanım, personel organizasyonu; çerçeve sözleşme, alındı-ödendi, emir formu gibi belgeler düzenleyip düzenlemediği.<\/li><li><b>Somut ve güçlü emare<\/b> varsa hesap ilişkisi sona erdirilir ve <b>ivedilikle Kurula<\/b> bildirilir; aksi halde bu kişinin işlemlerinden doğan hukuki sorumluluk yatırım kuruluşuna ait olur.<\/li><li>Bu bildirim V-102.1 Tebliğindeki şüpheli işlem bildiriminden farklıdır; <b>şekil şartı olmaksızın<\/b> yapılabilir.<\/li><\/ul><h3>İştirak sınırları (m.40)<\/h3><ul><li>İştirak sayılan haller: bir şirkette <b>%10 veya fazla<\/b> pay, yönetim kuruluna katılma, genel kurulda <b>asaleten oy<\/b>, iktisap edilen payların <b>1 yıldan uzun<\/b> elde tutulması.<\/li><\/ul><table><tr><th>Sınırsız iştirak<\/th><th>Sınırlı iştirak<\/th><th>İştirak edilemez<\/th><\/tr><tr><td>Aracı kurumlar, sermaye piyasası kurumları, borsalar, kıymetli maden aracı kurumları, sigorta, bireysel emeklilik, finansal kiralama, faktoring, finansman, varlık yönetim şirketleri ve Kurulca uygun görülen finansal kuruluşlar<\/td><td>Bunlar dışındaki ortaklıklara iştirakler toplamı <b>özsermayenin %25'ini<\/b> aşamaz; <b>geniş yetkililerde %50<\/b>. Bedelsiz paylar ve fon çıkışı gerektirmeyen değer artışları hesaba katılmaz.<\/td><td>Aracı kurumun ödenmiş sermayesinin <b>%10'undan fazlasına<\/b> sahip ortakları ile yöneticilerinin ayrı ayrı veya birlikte sermayelerinin <b>%25'inden fazlasına<\/b> sahip oldukları ortaklıklar<\/td><\/tr><\/table><h3>İlan, reklam ve promosyon (m.41)<\/h3><ul><li>Tüm mecralarda (basın, internet, telefon, radyo, TV, sinema, açık hava, basılı) <b>objektif<\/b> olunur; yalan, yanlış, yanıltıcı ve tecrübesizliği istismar eden içerik yasaktır.<\/li><li>Mevzuatın izin verdiği haller dışında <b>mutlak getiri veya zarara karşı garanti<\/b> taahhüdü verilemez.<\/li><li>Mali duruma ilişkin sayısal veriler ile portföy büyüklüğü, müşteri sayısı, işlem hacmi gibi kanıtlanabilir ifadeler kullanılabilir; kaynak olarak yalnızca <b>kamu kurumlarının yayınları<\/b> ile <b>mali alandaki meslek örgütlerinin<\/b> kaynakları gösterilir.<\/li><li>Kaldıraçlı işlem reklamlarında çeyreklik dönemlere ait <b>kârda/zararda olan hesap oranları<\/b> yer almalıdır.<\/li><li>Kaldıraçlı reklamlarda yasak ifadeler: her durumda kazanç/hiç zarar etmeme; meslek grupları, <b>üniversite öğrencileri, ev hanımları<\/b> gibi kesimler kullanılarak veya genel olarak ek gelir/kazanç vaadi; garantili-güvenli, Kurul veya kurumların güvencesinde olduğu; risksiz, bilgi gerektirmeyen veya kısa eğitimle öğrenilebilir olduğu; somut veriye dayanmayan haksız rekabet; dini, kültürel, sosyal hassasiyetler; <b>belirli kur veya parite hedefleri<\/b>; yanıltıcı kişi veya subjeler.<\/li><li>Bire bir tanıtımlarda da bu esaslara uyulur; tüm reklam örnekleri belge-kayıt süresince saklanır.<\/li><\/ul><h4>TSPB Promosyon Kampanyaları Yönergesi (Ek-1)<\/h4><ul><li>Amaç: aracı kurumlar ve bankaların sermaye piyasası faaliyetlerine yönelik promosyon kampanyalarının usul ve esasları. Dayanak: SPK'nın <b>20.10.2006 tarih 46<\/b> ve <b>02.02.2012 tarih 4<\/b> sayılı toplantı kararları, Birlik Statüsü ve Meslek Kuralları m.19.<\/li><li>Dikkat: Kurulun <b>15.07.2016 tarih ve 22/802<\/b> sayılı İlke Kararı uyarınca <b>kaldıraçlı işlemler ve fark kontratları<\/b> için promosyon yapılamaz; işlem hacmine bağlı geriye dönük fayda sağlama veya maliyet yansıtmama gibi benzer uygulamalar da yasaktır.<\/li><li>Gelir yaratmayan, finansal okuryazarlığı destekleyen <b>eğitim amaçlı yarışmalar<\/b> promosyon sayılır ve Yönergeye tabidir. Komisyon tarifesine dayalı pazarlama çalışmaları promosyon sayılmaz. Özel günlerde veya etkinliklerde verilen <b>sembolik hediyeler<\/b> ile ajanda, kalem, takvim gibi reklam ürünleri kapsam dışıdır.<\/li><li>Yasaklar: mevzuata aykırı, yatırımcı haklarını zedeleyen, abartılı veya yanıltıcı kampanya; <b>nakit veya anında nakde çevrilebilir<\/b> varlık verilmesi (komisyon iadesi sistemi hariç); birikim veya kredi gerektirecek kadar <b>maddi değeri çok yüksek<\/b> ürünler; sadece ödül güdüsüyle hareket ettirecek ürünler; <b>belirli bir kıymete<\/b> yönlendirme; <b>müşteri getirene<\/b> ve getirdiği müşteriye menfaat; maliyeti öngörülemeyen kampanya.<\/li><li>Ödülün maddi değeri, yatırımcının kampanya döneminde ödediği <b>işlem komisyonundan fazla olamaz<\/b> (çekilişle ve sınırlı sayıda müşteriye makul bütçeli kampanyalarda aranmaz). İade sisteminde de ödenen komisyondan fazla iade yapılamaz. Ödülün nakit karşılığı hesaba yatırılamaz; işlem öncesi bonus veya hediye para yatırılamaz; kampanya boyunca komisyon <b>aleyhe değiştirilemez<\/b>; maliyet müşteriye yansıtılamaz.<\/li><li>Kampanya süresi <b>1 yıldan uzun olamaz<\/b>.<\/li><li>Başvuru: başlamadan <b>en az 10 iş günü önce<\/b> Birliğe resmi yazıyla (yöntem, süre, hedef kitle, bütçe, kaynak, sorumlu kişi; maliyet hesaplanabilir olmalı). Uzatma için dönem bitmeden en az 10 iş günü önce başvurulur; dönem <b>yalnızca bir defa ve azami bir yıl<\/b> uzatılabilir. Birlik incelemesi kayıt tarihinden itibaren <b>azami 10 iş günü<\/b>; kampanya Birlik onayı yazılı tebliğ edildikten sonra başlar.<\/li><li>Bildirim: aylık bilgiler ÜYS üzerinden “Aylık Dönemler İtibarıyla Yapılan Aracılık Komisyonu ve Promosyon Uygulamaları Bildirimi” ile; kampanya bitince yararlanan sayısı ve toplam maliyet <b>en geç 10 iş günü<\/b> içinde resmi yazıyla.<\/li><li>Duyuru ve reklam ancak <b>Birlik onayından sonra<\/b>; ana koşullar reklamda yer alır. Birlik onayı içeriğe <b>kefalet anlamına gelmez<\/b> ve reklamda kullanılamaz. Aykırılıkta <b>Birlik Disiplin Yönetmeliği<\/b> uygulanır.<\/li><\/ul><h3>Merkez dışı örgütler (m.42–48)<\/h3><ul><li>Yurt içinde <b>şube<\/b> ve <b>irtibat bürosu<\/b>; yurt dışında şube, irtibat bürosu veya yetkili yabancı kuruluşla sözleşme. Şube ve irtibat bürosunun işlemlerinden doğan hukuki ve cezai sorumluluk <b>aracı kuruma<\/b> aittir.<\/li><\/ul><table><tr><th>Şube<\/th><th>İrtibat bürosu<\/th><\/tr><tr><td>Aracı kurumun yetkili olduğu <b>tüm faaliyetleri<\/b> yapar; nakit tahsil ve tediye edebilir.<\/td><td>Aracı kurumu ve hizmetlerini <b>tanıtır<\/b>, temsil eder; <b>yalnızca müşteri emirlerini aracı kuruma iletebilir<\/b>.<\/td><\/tr><tr><td>Şartlar: yeterli mekan ve donanım; merkezle irtibatlı yönetim, muhasebe ve belge düzeni; sigorta dahil güvenlik; nitelikli <b>şube müdürü<\/b> ve ihtisas personeli.<\/td><td>Şartlar: mekan ve donanım; <b>en az 2 yıllık ön lisans<\/b> mezunu büro sorumlusu ve yeterli ihtisas personeli.<\/td><\/tr><\/table><ul><li>Başvuru: <b>noter onaylı<\/b> yönetim kurulu kararı, <b>fizibilite etüdü<\/b> ve şartları tevsik eden belgeler. Kurul <b>30 iş günü<\/b> içinde sonuçlandırır; olumluysa YK kararı tescil ve ilan edilerek faaliyete geçilir. Nakilde açılış şartları aranır, eski tescil terkin edilir.<\/li><li>Yurt dışında şube/büro veya yurt dışı müşterilerin emirlerini yurt içinde gerçekleştirmek için yabancı kuruluşla sözleşme <b>Kurul iznine<\/b> tabidir. Başvuru, ülke otoritesiyle bilgi akışı ve mevzuat uyumu dikkate alınarak sonuçlanır. Gerekenler: organizasyon ve faaliyetleri içeren fizibilite, personel bilgileri ve hakkındaki yaptırımlar, ülkenin ilave şartları.<\/li><li>Yurt dışında kuruma veya personeline yaptırım uygulanırsa <b>öğrenilir öğrenilmez<\/b> Kurula yazılı bilgi verilir.<\/li><li>Yabancı kuruluş emir iletimine aracılık yapacaksa çerçeve sözleşme aracı kurum ile yurt dışı müşteri arasında kurulur ve risk bildirimi aracı kurumca yapılır; müşteri yurt içi müşteri haklarına tabidir. Her kuruluş kendi işleminden müşteriye karşı sorumludur.<\/li><\/ul><h3>Dışarıdan hizmet alımı (m.49–55)<\/h3><ul><li>Mevzuat yükümlülüklerine <b>yardımcı nitelikteki<\/b> hizmetler sözleşmeyle başka kuruluştan alınabilir. Kurul konuları belirleyebilir, sınırlayabilir, yasaklayabilir, sorumluluk sigortası veya izin şartı koyabilir.<\/li><li>Çağrı merkezi hizmeti yalnızca: hatırlatma aramaları, teknik destek ve yardım masası, hesap bilgisi verme, kişisel bilgi güncelleme ve <b>emir iletimi dışında<\/b> taleplerin aktarılması.<\/li><li><b>Alınamayacak hizmetler<\/b>: münhasıran yönetim kurulunca yapılması gerekenler; Kurul iznine tabi yatırım hizmetleri ve yan hizmetlerin sunulması ve <b>pazarlanması<\/b>; işlemlerin <b>muhasebeleştirilmesi ve finansal raporlama<\/b>; <b>iç denetim<\/b> sistemi faaliyetleri.<\/li><li>Kapsam dışı (serbestçe alınabilir): danışmanlık, eğitim, reklam, güvenlik, yemek, ulaşım, temizlik, avukatlık, piyasa veri hizmetleri, posta-kargo, donanım-yazılım temini ve bakımı, gizlilik korunarak arşiv; başka şirket bünyesinde istihdam edilip bu işlerde çalıştırılan personel.<\/li><li>Dışarıdan hizmet aracı kurumun sorumluluğunu kaldırmaz; müşteriyle ilişkiden doğan hukuki sorumluluk aracı kurumdadır; kayıt ve belgeleri kendi bünyesinde tutma yükümlülüğü sürer.
