<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.opts2 select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}

<script>
const S=[{"id": 1, "kisa": "Yatırım Hizmetleri, Aracılık", "baslik": "III-37.1 Yatırım Hizmetleri Tebliği (I): Genel Çerçeve, İzin, Gruplandırma ve Alım Satım Aracılığı", "ozet": "Yatırım hizmetlerinin listesi, izin-bildirim ayrımı, aracı kurum grupları ve emir iletimi, işlem aracılığı, portföy aracılığı ile bunlara ilişkin genel hükümler.", "notlar": "<h3>Temel kavramlar<\/h3><ul><li><b>Sermaye piyasası faaliyetleri<\/b> (SPKn m.34): sermaye piyasası kurumlarının Kanun kapsamındaki faaliyetleri + yatırım hizmet ve faaliyetleri + bunlara ek sunulan yan hizmetler.<\/li><li>Yatırım hizmet ve faaliyetleri ile yan hizmetler <b>III-37.1 sayılı Yatırım Hizmetleri Tebliği<\/b> ile düzenlenir.<\/li><li><b>Yatırım kuruluşu<\/b> (SPKn m.35): aracı kurumlar + yatırım hizmetinde bulunmak üzere kuruluş ve faaliyet esasları Kurulca belirlenen diğer sermaye piyasası kurumları + bankalar. 6362 sayılı Kanunla eski “aracı kuruluş” teriminin yerini aldı.<\/li><li>Dikkat: <b>Portföy yönetim şirketleri ve kolektif yatırım kuruluşları<\/b> bazı yatırım hizmetlerinde bulunabilse de yatırım kuruluşu tanımına <b>dahil değildir<\/b>.<\/li><\/ul><h4>Yatırım hizmet ve faaliyetleri (Tebliğ m.4)<\/h4><ol><li>(a) SPA ile ilgili emirlerin alınması ve iletilmesi (emir iletimine aracılık),<\/li><li>(b) SPA ile ilgili emirlerin müşteri adına ve hesabına veya kendi adına müşteri hesabına gerçekleştirilmesi (işlem aracılığı),<\/li><li>(c) SPA'nın kendi hesabından alım satımı (portföy aracılığı),<\/li><li>(ç) Bireysel portföy yöneticiliği,<\/li><li>(d) Yatırım danışmanlığı,<\/li><li>(e) Halka arzda yüklenimde bulunularak satışa aracılık (aracılık yüklenimi),<\/li><li>(f) Halka arzda yüklenimde bulunmaksızın satışa aracılık (en iyi gayret aracılığı),<\/li><li>(g) Çok taraflı alım satım sistemlerinin ve borsa dışı diğer teşkilatlanmış pazar yerlerinin işletilmesi,<\/li><li>(ğ) SPA'nın müşteri namına saklanması ve yönetimi,<\/li><li>(h) Kurulca belirlenecek diğer hizmet ve faaliyetler.<\/li><\/ol><ul><li>Kanun m.37'den iki fark: Kanundaki “portföy yöneticiliği” Tebliğde <b>bireysel<\/b> portföy yöneticiliği olarak düzenlenmiştir (kolektif portföy yönetimi ayrı). Kanundaki “<b>portföy saklaması<\/b>” Tebliğde düzenlenmemiştir; Tebliğ bireysel portföy saklamasını düzenler, kolektif portföylerin saklaması ayrı tebliğe (III-56.1) bırakılmıştır.<\/li><li>Dikkat: (g) bendindeki <b>çok taraflı alım satım sistemleri<\/b> işletilmesine ilişkin Tebliğde ayrıntılı düzenleme yoktur.<\/li><\/ul><h3>İzin ve bildirim<\/h3><table><tr><th>Konu<\/th><th>Rejim<\/th><\/tr><tr><td>Yatırım hizmet ve faaliyetleri (m.5)<\/td><td>Her biri için düzenli uğraşı, ticari ve mesleki faaliyet olarak yapılacaksa <b>Kurul izni<\/b> zorunlu.<\/td><\/tr><tr><td>Kendi portföyü için işlem<\/td><td>Müşteri dışındaki taraflarla, yatırım hizmeti sunma amacı olmaksızın kendi portföyü için yapılan işlemler <b>izne tabi değil<\/b>.<\/td><\/tr><tr><td>Yan hizmetler (m.6–7)<\/td><td>Ayrı izin yok; yetkili olunan yatırım hizmetine bağlı olarak sunulur. <b>Kurula bildirim<\/b> şart; bildirimden sonra <b>20 iş günü<\/b> içinde Kurul aksi görüş bildirmezse başlanabilir.<\/td><\/tr><\/table><ul><li>Yan hizmetlerden kredili işlem, açığa satış ve ödünç işlemleri diğerlerinden daha ayrıntılı düzenlenmiştir (SPKn m.39 ve 128).<\/li><\/ul><h3>Aracı kurumların gruplandırılması (m.8)<\/h3><table><tr><th>Grup<\/th><th>Yürütebileceği faaliyetler<\/th><th>2026 asgari özsermaye<\/th><\/tr><tr><td>Dar yetkili<\/td><td>Emir iletimine aracılık, yatırım danışmanlığı<\/td><td>45.000.000 TL<\/td><\/tr><tr><td>Kısmi yetkili<\/td><td>İşlem aracılığı, en iyi gayret aracılığı, sınırlı saklama, portföy yöneticiliği<\/td><td>190.000.000 TL<\/td><\/tr><tr><td>Geniş yetkili<\/td><td>Portföy aracılığı, genel saklama, aracılık yüklenimi<\/td><td>380.000.000 TL<\/td><\/tr><\/table><ul><li>Sınıflandırmanın temel kriteri: hizmetin aracı kurumun mali yapısına etkisi ve taşıdığı <b>risk<\/b>.<\/li><\/ul><h3>Yurt dışında yerleşik kuruluşlar (m.9)<\/h3><ul><li>Türkiye'de tanıtım, reklam, pazarlama yapılmamışsa, Türkiye'de yerleşiklerin <b>tamamen kendi inisiyatifleriyle<\/b> yurt dışı kuruluşlardan aldıkları hizmetler, hesaplar ve işlemler Tebliğ kapsamı dışındadır.<\/li><li>Şu hallerden <b>herhangi biri<\/b> varsa faaliyet Türkiye'ye yönelik sayılır ve Kurul düzenlemeleri uygulanır: Türkiye'de <b>iş yeri açılması<\/b>, <b>Türkçe internet sitesi<\/b>, doğrudan veya Türkiye'de yerleşikler aracılığıyla <b>tanıtım ve pazarlama<\/b>.<\/li><\/ul><h3>Alım satıma aracılığın üç türü (m.10)<\/h3><table><tr><th>Tür<\/th><th>Özü<\/th><th>Saklama yetkisi<\/th><\/tr><tr><td>Emir iletimine aracılık<\/td><td>Emri alıp işlem/portföy aracısına veya izinli yurt dışı kuruluşa iletir, sonuç hakkında bilgi verir. Lehine faaliyet gösterdiği kurumla sözleşmeyle çalışır.<\/td><td>Yok; müşteri varlıkları için saklama yetkili bir kuruluşla anlaşmalı.<\/td><\/tr><tr><td>İşlem aracılığı<\/td><td>Emri <b>gerçekleştirme (execute)<\/b> yetkisi var; borsaya veya portföy aracısına iletir.<\/td><td>Olmalı (sınırlı saklama).<\/td><\/tr><tr><td>Portföy aracılığı<\/td><td>Müşteri emrini <b>karşı taraf olarak kendi portföyünden<\/b> karşılar.<\/td><td>Olmalı.<\/td><\/tr><\/table><ul><li>Dikkat: Çıkar çatışması en yüksek olan tür <b>portföy aracılığıdır<\/b>; bu yüzden çıkar çatışması politikası ve en iyi gerçekleştirme yükümlülüğü burada özellikle önemlidir.<\/li><\/ul><h3>Emir iletimine aracılık (m.11–15)<\/h3><ul><li>Emir iletimi kapsamında sayılan ve <b>çerçeve sözleşme imzalanmaksızın<\/b> sunulabilen faaliyetler: (a) halka arz, tahsisli satış veya nitelikli yatırımcıya satışta talep toplama, bedel tahsili/iadesi gibi <b>gişe hizmeti<\/b>; (b) lehine faaliyet gösterilen kuruluşun hizmetlerinin tanıtılması, sözleşme akdine aracılık; (c) sözleşme yapmak isteyen tarafların komisyon karşılığı bir araya getirilmesi.<\/li><li>Yapabilecekler (m.12): Kurul izniyle <b>aracı kurumlar<\/b> ve <b>kaldıraçlı işlemler hariç bankalar<\/b>. Bankalar kaldıraçlı işlemlerin tanıtımını da yapamaz.<\/li><li>Özel şartlar (m.13): asgari özsermaye (<b>bankalarda aranmaz<\/b>); sorumlu birim ve birim yöneticisi; merkez ve merkez dışında yeterli ihtisas personeli; emirlerin iletileceği işlem/portföy aracılarının listesi ve süreç politikası.<\/li><li>Yürütme esasları (m.14): emir iletimine aracı ile lehine faaliyet gösterilen kuruluş arasında hak-yükümlülük sözleşmesi; <b>her ikisi de müşteriyle ayrı ayrı<\/b> çerçeve sözleşme imzalar (iki kuruluşun mutabakatıyla <b>tek çerçeve sözleşme<\/b> de mümkün); hesaplar lehine faaliyet gösterilen kuruluşta müşteri bazında izlenir; çerçeve sözleşme, risk bildirimi ve emir belgelerinin bir örneği emir iletimine aracı nezdinde saklanır; müşteriye bildirimleri <b>lehine faaliyet gösterilen kuruluş<\/b> yapar (müşteri isterse emir iletimine aracı da ibraz eder); her iki kuruluş emir gizliliğini korur.<\/li><li>Her yeni sözleşme Kurula ayrıca bildirilir; bir aracı kurum <b>birden fazla kurum lehine<\/b> emir iletebilir.<\/li><li>Yurt dışı kuruluşlarla emir iletimi (m.15): işlemlere başlamadan önce Kurula <b>bildirim<\/b>; her yeni sözleşme ayrıca bildirilir; bilgi akışı ve mevzuat uyumu açısından değerlendirilir; <b>20 iş günü<\/b> içinde olumsuz cevap yoksa başlanır. Yetkili yabancı kuruluşla yazılı sözleşme, müşteriyle ayrı ayrı çerçeve sözleşme, risk bildirimi ve belge saklama şarttır.<\/li><li>Dikkat: <b>Kaldıraçlı işlemlerde<\/b> yurt dışı kuruluşlarla emir iletimine aracılık yapılamaz.<\/li><li>Kurul Karar Organı 17.06.2026 tarih ve 37 sayılı toplantı: <b>mevduat ve katılım bankaları<\/b> yurt dışında <b>paylar<\/b> ile paya ve pay endekslerine dayalı türevlerde emir iletimine aracılık <b>yapamaz<\/b>; bu müşterilerin yurt dışı işlem aracılığına yetkili aracı kurumlarda hesap açmasına aracılık edebilir veya bu kurumlara emir iletebilirler.<\/li><\/ul><h3>İşlem aracılığı (m.16–20)<\/h3><ul><li>Emir borsaya/teşkilatlanmış pazar yerine, kendi portföyünden karşılayacak banka ve aracı kurumlara veya (kaldıraçlı hariç) izinli yurt dışı kuruluşa iletilerek gerçekleştirilir. Dikkat: Aracı kurumlar kaldıraçlı işlemleri işlem aracısı sıfatıyla yurt dışına iletemez.<\/li><\/ul><table><tr><th>Kuruluş<\/th><th>Pay<\/th><th>Diğer menkul kıymet<\/th><th>Türev (kaldıraçlı hariç)<\/th><th>Kaldıraçlı<\/th><\/tr><tr><td>Aracı kurum<\/td><td>Yapabilir<\/td><td>Yapabilir<\/td><td>Yapabilir<\/td><td>Yapabilir<\/td><\/tr><tr><td>Mevduat ve katılım bankası<\/td><td>Yapamaz<\/td><td>Yapabilir<\/td><td>Pay endeksi ve paya dayalılar hariç<\/td><td>Yapamaz<\/td><\/tr><tr><td>Kalkınma ve yatırım bankası<\/td><td>Yapamaz<\/td><td>Yapabilir<\/td><td>Pay endeksi ve paya dayalılar hariç<\/td><td>Yapamaz<\/td><\/tr><tr><td>Kalkınma ve yatırım bankası (bir aracı kurum çekilirse)<\/td><td>Yapabilir<\/td><td>Yapabilir<\/td><td>Yapabilir<\/td><td>Yapamaz<\/td><\/tr><\/table><ul><li>Kalkınma ve yatırım bankalarının <b>paylar ve pay/pay endeksi türevlerinde<\/b> işlem aracılığı yapabilmesi için <b>halka açık olmayan bir aracı kurumun<\/b> tüm faaliyet izinlerinin iptalini talep ederek çekilmesi gerekir. Diğer araçlarda bu şart aranmaz.<\/li><li>Özel şartlar (m.18): <b>sınırlı saklama<\/b> izni almış veya başvurmuş olmak; asgari özsermaye (<b>bankalarda aranmaz<\/b>); piyasalar ve birlikte çalışılacak kuruluşların listesi ile <b>emir gerçekleştirme politikası<\/b>; türev işlem yapacaklarda yeterli sayıda <b>türev araçlar müşteri temsilcisi<\/b> ile <b>türev araçlar muhasebe ve operasyon sorumlusu<\/b>.<\/li><li>Yürütme esasları (m.19): emirler emir gerçekleştirme politikası (<b>yönetim kurulunca belirlenir<\/b>), çerçeve sözleşme, en iyi gerçekleştirme, özen ve sadakat borcu çerçevesinde basiretli tacir gibi yerine getirilir.<\/li><li>Portföy aracısına iletimde: başlamadan önce yazılı sözleşme; hesaplar müşteri bazında izlenir; müşteri emirleri, kendi hesabına veya ilişkili kişiler hesabına verilen <b>aynı fiyatlı emirlerden önce<\/b> yerine getirilir.<\/li><li>Tezgahüstü türevde müşterinin kesinleşmiş nakit alacağı, talep üzerine <b>en geç 3 iş günü<\/b> içinde tam ve nakden ödenir.<\/li><li><b>Kaldıraçlı işlemlerde teminat koruması<\/b>: genel müşteri ve <b>talebe dayalı profesyonel<\/b> müşteriye teminatını aşan kayba uğratacak işlem yaptırılamaz; piyasa koşullarından doğan teminat üstü zarar müşteriden istenemez. Talebe dayalı profesyonel müşteri <b>yazılı talep<\/b> ederse bu hüküm ona uygulanmayabilir.<\/li><li>Emir gizliliği: emir bilgisi müşterinin bilgisi olmadan, müşteri aleyhine ve üçüncü şahıs lehine aktarılamaz, kullanılamaz.<\/li><li>Yurt dışı işlem aracılığı (m.20): yurt dışı borsaya üyelik veya izinli yabancı kuruluşla sözleşme yoluyla; başlamadan önce <b>bildirim<\/b>, her yeni üyelik/sözleşme ayrıca bildirilir; <b>20 iş günü<\/b> (eksik belge için geçen süre hesaba katılmaz). Doğrudan üyelikte, yabancı otoriteye raporlanan önemli hususlar ve uygulanan yaptırımlar ortaya çıkışından itibaren <b>3 iş günü<\/b> içinde Kurula bildirilir. Kaldıraçlıda yurt dışı işlem aracılığı yapılamaz.<\/li><\/ul><h3>Portföy aracılığı (m.21–24)<\/h3><ul><li>Yapabilecekler (m.22): <b>aracı kurumlar<\/b> tüm SPA'da; <b>kalkınma ve yatırım bankaları<\/b> kaldıraçlı hariç (paylar ve paya dayalı türevler için yine bir aracı kurumun çekilmesi şartı); <b>diğer bankalar<\/b> paylar, kaldıraçlı işlemler ve paya dayalı türevler hariç.<\/li><li><b>Pay endekslerine dayalı türevlerde<\/b> portföy aracılığını aracı kurumlar yanında <b>tüm bankalar<\/b> yapabilir. Dikkat: Bankalar pay endeksi türevlerinde <b>işlem aracılığı yapamaz ama portföy aracılığı yapabilir<\/b>; fark burada ortaya çıkar.<\/li><li>Rehber: bankalar Borsa İstanbul'da işlem gören <b>paylar ve bunlara dayalı türevlerde<\/b> portföy aracılığı yapamaz. Bankalar kaldıraçlı işlemleri kendi portföylerine karşı da yapamaz.<\/li><li>Özel şartlar (m.23): sınırlı saklama izni/başvurusu; asgari özsermaye; <b>risk yönetim birimi<\/b>; <b>münhasıran istihdam edilmiş<\/b>, finans piyasalarında <b>en az 5 yıl<\/b> deneyimli birim yöneticisi ve yeterli ihtisas personeli; bunların işlemlerin niteliğine göre <b>İleri Düzey (Düzey 3) veya Türev Araçlar<\/b> lisansı; emir gerçekleştirme politikası.<\/li><li>Bankalarda sermaye şartı ve (bankanın risk birimi bu riskleri izliyorsa) ayrı risk yönetim birimi şartı aranmaz.<\/li><li>Rehber: birim yöneticisinin aynı birimde emir iletimi veya işlem aracılığından da sorumlu olması münhasırlık şartını bozmaz.<\/li><li>Ek esas (m.24): işlem fiyatları genel piyasa koşulları ve <b>gerçeğe uygun değerle uyumlu, nesnel<\/b> belirlenir. Kaldıraçlı teminat koruması burada da geçerlidir.<\/li><\/ul><h3>Alım satım aracılığında genel hükümler<\/h3><h4>En iyi gerçekleştirme (m.30)<\/h4><ul><li>Fiyat, maliyet, hız, takas, saklama, karşı taraf vb. tercihler dikkate alınarak müşteri için mümkün olan en iyi sonuç.<\/li><li>Müşterinin emri belirli kuruluş/piyasaya iletme yönünde <b>açık talimatı<\/b> varsa yükümlülük yerine getirilmiş sayılır.<\/li><li><b>Fiyat yenilemesi<\/b> (kaldıraçlı): müşteri aleyhine uygulanıyorsa lehe olan her durumda da uygulanmalı. Emrin fiyat, miktar vb. unsurunun aleyhe değiştirilmesi için müşteri onayı gerekir; bu onay yalnızca <b>pozisyon açmak için fiyat sınırı konmuş<\/b> emirler bu sınırların dışındaki fiyattan gerçekleşecekse zorunludur.<\/li><li>Müşteri lehine değişikliklerde veya müşterinin belirlediği fiyat aralığı içindeki değişimlerde onay aranmaz.<\/li><li>Çerçeve sözleşmede hüküm varsa emir kabul etmeme hakkı vardır; ancak mevcut açık pozisyonların kapatılmasına ilişkin talepler reddedilemez.<\/li><\/ul><h4>Fiyat farkları ve sorumluluk (m.30/A, 31)<\/h4><ul><li>Kaldıraçlı işlemler portföy aracılığıyla yürütülüyorsa alım-satım fiyat farkını (spread) yatırım kuruluşu belirler; genel piyasa koşullarına uygun ve tutarlı olmalı. Fark <b>sabit veya değişken<\/b> olabilir; sabit fark garantisinde zorunlu değişiklik koşulları çerçeve sözleşmede önceden belirtilir.<\/li><li>Birden fazla yatırım kuruluşu varsa her biri kendi yaptığı işlemden <b>genel hükümlere göre<\/b> sorumludur; sınırlar aralarındaki sözleşmede belirlenir ve çerçeve sözleşmelerde yer alır.<\/li><\/ul><h4>Fiyatların açıklanması (m.32–33)<\/h4><ul><li>Borsada işlem gören SPA için borsa dışı fiyat teklifleri Birliğin belirlediği <b>veri yayın kuruluşu<\/b> aracılığıyla kamuya açıklanır.<\/li><li>Borsada işlem görmeyen SPA'da (müşteriye özel bire bir türevler hariç) teklifler <b>internet sitesinde anlık<\/b> ve veri yayın kuruluşuyla açıklanır.<\/li><li>Kaldıraçlıda fiyatlar ve farklar Birliğe aktarılır; Birlik seriyi <b>bir yıl<\/b> saklar, belirli düzeyi aşan sapmaları kurum bazında <b>haftalık<\/b> kamuya duyurur. Yetkili kuruluşlar periyodik bildirim yapar.<\/li><\/ul><h4>Teminatlar (m.34)<\/h4><ul><li>Mevzuat gereği zorunlu haller dışında yatırım hizmetleri, kredili işlem, ödünç, açığa satış ve diğer yan hizmetler için de teminat istenebilir.<\/li><li>Müşteri nakit ve SPA'sı kuruluş malvarlığından ayrı, müşteri bazında izlenir; müşterinin <b>yazılı açık izni<\/b> olmadan tevdi amacı dışında kullanılamaz.<\/li><li>Teminat olabilecek kıymetler: nakit TL ve <b>TCMB'nin günlük kur ilan ettiği<\/b> dövizler; kamu borçlanma araçları; kredili işleme konu olabilecek SPA; fon katılma payları; borsada işlem görmek kaydıyla özel sektör borçlanma araçları, varlığa dayalı menkul kıymetler, ipotek ve varlık teminatlı menkul kıymetler, kira sertifikaları; Hazine standardındaki altın ve kıymetli madenler; Kurulca uygun görülenler.<\/li><li>Kıymetin cari değerinin tamamı veya bir yüzdesi teminat sayılabilir. Aracı kurum ihraççı/garantör bazında ve araç bazında <b>konsantrasyon limiti<\/b> belirlemek zorundadır. Sözleşmede hüküm varsa müşteri teminatı başka kıymetle değiştirebilir.<\/li><\/ul><h4>Elektronik ortamda emir<\/h4><ul><li>Elektronik ve diğer kanallardan gelen emirler arasında öncelik kurallarına uyulur, farklılıklar açıklanır, eşitsizlik önlenir; risk bildirim formları elektronik ortamda da yer alır; yeterli personel istihdam edilir.<\/li><li>Altyapı: emirleri <b>alınış zamanına göre sıralayabilmeli<\/b>; reddedilen, iptal edilen, değiştirilen emirler dahil tüm unsurları ve müşteriye yansıtılan fiyatları <b>anlık kaydetmeli<\/b>; teminat, borç-alacak, açık pozisyon ve kâr-zararı anlık izleyebilmeli.<\/li><li>Periyodik kapasite ve güvenlik kontrolleri, <b>farklı bir yerde yedekleme<\/b>, üçüncü kişilerin müşteri rızası dışında kullanımını engelleme, veri iletişiminin dinlenmesini/değiştirilmesini önleme.<\/li><\/ul>", "sorular": [{"q": "Yatırım Hizmetleri Tebliği'ne göre aşağıdakilerden hangisi yatırım kuruluşu tanımına girmez?", "o": ["Portföy yönetim şirketi", "Geniş yetkili aracı kurum", "Mevduat bankası", "Katılım bankası", "Kalkınma ve yatırım bankası"], "a": 0, "e": "Yatırım kuruluşu aracı kurumlar, Kurulca esasları belirlenen diğer sermaye piyasası kurumları ve bankalardır; portföy yönetim şirketleri bazı yatırım hizmetlerinde bulunsa da bu tanıma dahil değildir."}, {"q": "Yatırım kuruluşunun planladığı bir yan hizmet için Kurula bildirimde bulunmasından sonra, Kurul aksi yönde görüş bildirmezse hizmete en erken ne zaman başlanabilir?", "o": ["Bildirim tarihinde", "5 iş günü sonunda", "10 iş günü sonunda", "20 iş günü sonunda", "30 iş günü sonunda"], "a": 3, "e": "Yan hizmetler izne değil bildirime tabidir; bildirimi takiben 20 iş günü içinde Kurul aksi görüş bildirmezse yürütülmeye başlanabilir."}, {"q": "2026 yılı için kısmi yetkili aracı kurumların sahip olması gereken asgari özsermaye tutarı nedir?", "o": ["45.000.000 TL", "90.000.000 TL", "190.000.000 TL", "300.000.000 TL", "380.000.000 TL"], "a": 2, "e": "2026 için dar yetkili 45 milyon, kısmi yetkili 190 milyon, geniş yetkili 380 milyon TL asgari özsermaye öngörülmüştür."}, {"q": "Aşağıdaki faaliyetlerden hangisini yürütmek isteyen bir aracı kurumun geniş yetkili olması gerekir?", "o": ["Yatırım danışmanlığı", "En iyi gayret aracılığı", "Sınırlı saklama", "Portföy yöneticiliği", "Aracılık yüklenimi"], "a": 4, "e": "Geniş yetkili aracı kurum portföy aracılığı, genel saklama ve aracılık yüklenimi yapar; en iyi gayret aracılığı, sınırlı saklama ve portföy yöneticiliği kısmi, yatırım danışmanlığı dar yetki kapsamındadır."}, {"q": "Yurt dışında yerleşik bir kuruluşun faaliyetinin Türkiye'de yerleşiklere yönelik kabul edilmesine yol açan durumlar arasında aşağıdakilerden hangisi yoktur?", "o": ["Türkiye'de iş yeri açması", "Türkçe internet sitesi oluşturması", "Türkiye'de yerleşik kişiler aracılığıyla pazarlama yapması", "Doğrudan tanıtım faaliyetinde bulunması", "Türkiye'de yerleşik bir kişinin tamamen kendi inisiyatifiyle hesap açması"], "a": 4, "e": "Kendi inisiyatifiyle yurt dışı kuruluştan alınan hizmet ve açılan hesaplar Tebliğ kapsamı dışındadır; diğer üç durumdan herhangi birinin varlığı faaliyeti Türkiye'ye yönelik kılar."}, {"q": "Emir iletimine aracılık faaliyeti kapsamında olup müşteriyle çerçeve sözleşme imzalanmaksızın sunulabilen hizmet aşağıdakilerden hangisidir?", "o": ["Kaldıraçlı işlemlere ilişkin emirlerin yurt dışına iletilmesi", "Halka arzda talep toplama ve bedel tahsiline ilişkin gişe hizmeti", "Müşteri emirlerinin borsada gerçekleştirilmesi", "Müşteri portföyünün vekaleten yönetilmesi", "Müşteri varlıklarının saklanması"], "a": 1, "e": "Gişe hizmeti, lehine faaliyet gösterilen kuruluşun hizmetlerinin tanıtımı ve tarafların komisyon karşılığı bir araya getirilmesi çerçeve sözleşme olmaksızın sunulabilir."}, {"q": "Emir iletimine aracılık faaliyetinde müşteriye yapılacak bildirimleri kural olarak hangi kuruluş yapar?", "o": ["Emir iletimine aracılık eden kuruluş", "Lehine faaliyet gösterilen yetkili kuruluş", "Takasbank", "Merkezi Kayıt Kuruluşu", "Türkiye Sermaye Piyasaları Birliği"], "a": 1, "e": "Belge ve kayıt düzenlemeleri uyarınca müşteriye bildirimleri lehine faaliyet gösterilen kuruluş yapar; müşteri talep ederse emir iletimine aracı da hesap açılışı ve emir iletimiyle sınırlı belgeleri ibraz eder."}, {"q": "Bir mevduat bankası aşağıdaki araçlardan hangisinde işlem aracılığı faaliyetinde bulunabilir?", "o": ["Borsa İstanbul'da işlem gören paylar", "Pay endeksine dayalı vadeli işlem sözleşmesi", "Döviz üzerine kaldıraçlı işlem", "Devlet iç borçlanma senedi", "Paya dayalı opsiyon"], "a": 3, "e": "Kalkınma ve yatırım bankaları dışındaki bankalar paylar, kaldıraçlı işlemler ile pay ve pay endeksine dayalı türevler hariç sermaye piyasası araçlarında işlem aracılığı yapabilir."}, {"q": "Kalkınma ve yatırım bankalarının paylar üzerinde işlem aracılığı yapabilmesi için aranan şart nedir?", "o": ["Geniş yetkili aracı kurum statüsü almaları", "Payların yalnızca yurt dışı borsalarda işlem görmesi", "Halka açık olmayan bir aracı kurumun tüm faaliyet izinlerinin iptalini talep ederek çekilmesi", "Ayrı bir portföy yönetim şirketi kurmaları", "BDDK'dan ayrıca izin almaları"], "a": 2, "e": "Kalkınma ve yatırım bankaları paylar ve pay ya da pay endeksine dayalı türevlerde ancak halka açık olmayan bir aracı kurumun yatırım hizmetlerinden çekilmesi halinde aracılık yapabilir."}, {"q": "Bankaların pay endekslerine dayalı türev araçlarla ilgili durumu için aşağıdakilerden hangisi doğrudur?", "o": ["Hem işlem hem portföy aracılığı yapabilirler", "İşlem aracılığı yapabilir, portföy aracılığı yapamazlar", "İşlem aracılığı yapamaz, portföy aracılığı yapabilirler", "Hiçbir aracılık faaliyetinde bulunamazlar", "Yalnızca kalkınma ve yatırım bankaları portföy aracılığı yapabilir"], "a": 2, "e": "Bankalar açısından iki faaliyet arasındaki fark pay endeksi türevlerinde ortaya çıkar: işlem aracılığı yapamazlar, Kurul izniyle portföy aracılığı yapabilirler."}, {"q": "Portföy aracılığı faaliyetinde birim yöneticisi için aranan finans piyasası deneyimi en az ne kadardır?", "o": ["5 yıl", "2 yıl", "3 yıl", "4 yıl", "7 yıl"], "a": 0, "e": "Portföy aracılığı biriminde münhasıran istihdam edilen ve finans piyasalarında en az 5 yıllık deneyimi olan bir birim yöneticisi görevlendirilmelidir."}, {"q": "İşlem aracılığı faaliyeti için aranan özel şartlardan hangisi bankaların başvurularında aranmaz?", "o": ["Sınırlı saklama izni almış veya başvurmuş olmak", "Asgari özsermaye yükümlülüğünü yerine getirmiş olmak", "Emir gerçekleştirme politikasını belirlemiş olmak", "Türev işlem yapılacaksa türev araçlar müşteri temsilcisi görevlendirmek", "Birlikte çalışılacak kuruluşların listesini belirlemek"], "a": 1, "e": "İşlem aracılığında olduğu gibi emir iletiminde de bankaların başvurusunda asgari özsermaye şartı aranmaz."}, {"q": "Tezgahüstü türev araç işlemlerinde müşterinin kesinleşmiş nakit alacağı, müşteri talebi üzerine en geç ne kadar sürede ödenmelidir?", "o": ["3 iş günü", "Aynı gün", "1 iş günü", "2 iş günü", "5 iş günü"], "a": 0, "e": "İşlem aracılığı esaslarına göre tezgahüstü türevde kesinleşmiş nakit alacaklar talep üzerine en geç 3 iş günü içinde tam ve nakden ödenir."}, {"q": "Kaldıraçlı işlemlerde teminatı aşan zararın müşteriden talep edilememesi kuralı hangi müşteri grubu için hiç uygulanmaz?", "o": ["Genel müşteriler", "Talebe dayalı profesyonel müşteriler", "Bankalar ve aracı kurumlar gibi profesyonel müşteriler", "Yurt dışında yerleşik genel müşteriler", "Tüzel kişi genel müşteriler"], "a": 2, "e": "Koruma genel müşteriler ve talebe dayalı profesyonel müşteriler için geçerlidir (talebe dayalı olan yazılı talep ederse uygulanmayabilir); tanım gereği profesyonel olan müşteriler bu hükümden yararlanamaz."}, {"q": "Yurt dışı borsaya üye olarak işlem aracılığı yapan yatırım kuruluşu, ilgili otoritenin kendisine uyguladığı yaptırımı Kurula en geç ne zaman bildirmelidir?", "o": ["Derhal", "Ertesi iş günü", "3 iş günü içinde", "10 iş günü içinde", "20 iş günü içinde"], "a": 2, "e": "Mali veya hukuki durumu etkileyebilecek hususlar ve yaptırımlar ortaya çıktığı tarihten itibaren 3 iş günü içinde Kurula bildirilir."}, {"q": "Kaldıraçlı işlemlerde fiyat yenilemesine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Müşteri aleyhine uygulanıyorsa lehe olan her durumda da uygulanmalıdır", "Müşteri lehine değişiklikler için onay aranmaz", "Müşterinin belirlediği fiyat aralığındaki değişimler için onay aranmaz", "Pozisyon kapatmaya ilişkin mevzuata uygun talepler reddedilemez", "Emrin unsurlarındaki her türlü değişiklik için müşteri onayı zorunludur"], "a": 4, "e": "Aleyhe değişiklikte onay gerekir ve bu yalnızca pozisyon açmak için fiyat sınırı konan emirlerde zorunludur; lehe değişikliklerde ve belirlenen fiyat aralığında onay aranmaz."}, {"q": "Kaldıraçlı işlemlerde aracı kurumların açıkladığı fiyat ve fark serilerini Birlik ne kadar süre saklar ve sapmaları hangi sıklıkta kamuya duyurur?", "o": ["1 yıl – haftalık", "6 ay – günlük", "1 yıl – aylık", "2 yıl – haftalık", "5 yıl – üç aylık"], "a": 0, "e": "Birlik her aracı kurumun geçmişe dönük fiyat ve fark serilerini bir yıl saklar, belirli düzeyi aşan sapmaları kurum bazında haftalık olarak duyurur."}, {"q": "Yatırım Hizmetleri Tebliği'ne göre aşağıdakilerden hangisi teminat olarak kabul edilebilecek kıymetler arasında sayılmamıştır?", "o": ["TCMB'nin günlük alım satım kuru ilan ettiği döviz", "Kamu borçlanma araçları", "Fon katılma payları", "Borsada işlem görmeyen özel sektör borçlanma araçları", "Hazine standardındaki altın"], "a": 3, "e": "Özel sektör borçlanma araçları, VDMK, ipotek ve varlık teminatlı menkul kıymetler ile kira sertifikaları ancak borsada işlem görmek kaydıyla teminat olabilir."}, {"q": "Portföy aracılığı faaliyetinde işlem fiyatlarının belirlenmesine ilişkin özel esas aşağıdakilerden hangisidir?", "o": ["Fiyatlar her zaman borsa kapanış fiyatı olmalıdır", "Fiyatlar Birlik tarafından günlük onaylanır", "Fiyatlar genel piyasa koşulları ve gerçeğe uygun değerle uyumlu ve nesnel olmalıdır", "Fiyatlar müşteriyle pazarlıkla serbestçe belirlenir, sınırlama yoktur", "Fiyatlar Kurul tarafından belirlenir"], "a": 2, "e": "Portföy aracısı fiyatı belirleyen konumda olduğundan fiyatların piyasa koşulları ve gerçeğe uygun değerle uyumlu ve nesnel belirlenmesi zorunludur."}, {"q": "İşlem aracılığına yetkili kuruluşun emri portföy aracısına iletmesi halinde aşağıdakilerden hangisi zorunlu değildir?", "o": ["Portföy aracısıyla önceden yazılı sözleşme imzalanması", "Hesapların müşteri bazında izlenmesi", "Müşteri emirlerinin aynı fiyatlı kendi emirlerinden önce yerine getirilmesi", "Portföy aracısının yurt dışında yerleşik olması", "İşlemlerin çerçeve sözleşmeye uygun yürütülmesi"], "a": 3, "e": "Portföy aracısının yurt dışında yerleşik olması gibi bir şart yoktur; diğerleri Tebliğin öngördüğü esaslardır."}, {"q": "Elektronik ortamda emir kabul eden yatırım kuruluşlarının bilgi işlem altyapısına ilişkin aşağıdaki yükümlülüklerden hangisi Tebliğde yer almaz?", "o": ["Emirlerin alınış zamanına göre sıralanabilmesi", "Reddedilen ve iptal edilen emirler dahil tüm unsurların anlık kaydı", "Müşteri teminat ve kâr-zararının anlık takibi", "Verilerin farklı bir yerde yedeklenmesi", "Tüm emirlerin borsaya iletilmeden önce Birlik onayına sunulması"], "a": 4, "e": "Birlik onayına sunma diye bir yükümlülük yoktur; diğerleri elektronik emir altyapısına ilişkin zorunluluklardır."}]}, {"id": 2, "kisa": "Türev ve Kaldıraçlı İşlemler", "baslik": "III-37.1 Yatırım Hizmetleri Tebliği (II): Tezgahüstü Türev Araçlar ve Kaldıraçlı İşlemler", "ozet": "Türev araç kapsamı, tezgahüstü türevde teminatlandırma ve pozisyon limitleri, kaldıraç oranı, teminatların izlenmesi, deneme hesabı, beyan, emir iptali ve platform bildirimleri.", "notlar": "<h3>Türev araçların kapsamı<\/h3><ul><li>Kaldıraçlı işlemler dışındaki türevlere ilişkin emir iletimi, işlem ve portföy aracılığı, işlemin niteliğine göre <b>borsalarda/teşkilatlanmış pazar yerlerinde<\/b> veya <b>tezgahüstü<\/b> piyasada yapılabilir (Tebliğ m.25).<\/li><li>Kurul, tezgahüstü işlemlerin takasının <b>merkezi karşı taraf<\/b> olarak yetkilendirilmiş kuruluşta yapılmasını zorunlu tutabilir (m.36).<\/li><li>SPKn m.3'e göre türev araçlar üç gruptur: (1) menkul kıymetleri alma, satma, değiştirme hakkı verenler; (2) değeri menkul kıymet, döviz, faiz, kıymetli maden/taş, mal fiyatı, istatistik, kredi riski transferi, enerji fiyatı, iklim değişkeni veya bunlardan oluşan endekse bağlı olanlar ve bunların türevleri; (3) <b>döviz ve kıymetli madenler<\/b> ile Kurulca belirlenecek varlıklar üzerine yapılan <b>kaldıraçlı işlemler<\/b>.<\/li><li>Tebliğ türev aracı tanımlamaz; neler olabileceğini ve kapsam dışı halleri sayar.<\/li><\/ul><h4>Tezgahüstü türev listesi (m.25/A)<\/h4><ul><li>Tezgahüstü türev işlemi yapacak kuruluşlar, <b>Birliğin belirlediği esaslar<\/b> çerçevesinde türev türleri ve dayanak varlıklar listesi oluşturur, <b>internet sitesinde yayımlar<\/b> ve <b>Birliğe gönderir<\/b>.<\/li><li>Listedeki değişiklik internet sitesinde ilan edilir ve ilanı izleyen <b>5 iş günü<\/b> içinde Birliğe bildirilir. Talep halinde listeleri Birlik Kurula iletir.<\/li><li><b>Fark kontratları (CFD), yatırım kuruluşu varantları ve sertifikaları ile ortaklık varantları<\/b> diğer düzenlemelerdeki tanımlarından bağımsız olarak türev araç kabul edilir.<\/li><li>Tezgahüstü fark kontratları <b>kaldıraçlı işlem hükümlerine<\/b> tabidir (kaldıraç oranı, teminat izleme, emir iptali, deneme hesabı, internet sitesi, reklam vb.). Fark kontratlarında da işlem aracılığı kapsamında ancak <b>yurt içinde portföy aracılığına yetkili aracı kurum lehine<\/b> işlem yapılabilir.<\/li><\/ul><h4>Kapsam dışı haller<\/h4><table><tr><th>Türev işlemi sayılmayanlar (m.26)<\/th><th>Kaldıraçlı işlem sayılmayanlar (m.28)<\/th><\/tr><tr><td>Döviz, kıymetli maden, kıymetli taş, mal vb. varlıkların <b>fiziki<\/b> alım satımı<\/td><td>Kaldıraçlı işleme konu olabilecek varlıkların <b>fiziki<\/b> alım satımı<\/td><\/tr><tr><td>Kişilerin kendi aralarında, yatırım kuruluşu aracılığı olmaksızın, ticari/mesleki faaliyet sayılmayan türev alım satımları<\/td><td><b>Bankalar arasında<\/b> yapılan işlemler; bankaların aracı kurumlara <b>likidite sağlamak<\/b> amacıyla yaptığı işlemler<\/td><\/tr><\/table><h3>Tezgahüstü türevde teminatlandırma politikası ve pozisyon limiti<\/h3><ul><li>Aracı kurum türev türleri ve dayanak varlıklar için <b>yönetim kurulu kararıyla<\/b> teminatlandırma politikası oluşturur; politikanın parçası olarak her müşterinin alabileceği <b>pozisyon limitini<\/b> belirler (m.25/B-1).<\/li><li>Politika uluslararası kabul görmüş yöntemlerle; müşteriye karşı doğrudan mali yükümlülük altına girilip girilmediği, müşterinin risklilik durumu, olası olumsuz piyasa koşulları, korunma veya fark pozisyonu gibi stratejiler dikkate alınarak hazırlanır.<\/li><li><b>Risk yönetim birimi<\/b>: politikanın oluşturulması, yürütülmesi ve değişikliklerin yönetim kuruluna önerilmesinden sorumludur; müşterilerin teminat durumları hakkında <b>genel müdüre en az haftalık<\/b> raporlama yapar.<\/li><li>Politikanın yürütülmesiyle ilgili süreç <b>iç kontrol prosedürlerinde<\/b> yer alır; değişiklik önerileri <b>yönetim kurulu kararına<\/b> bağlanır (m.25/B-2).<\/li><li>Politikada kullanılan risk modellerinin geçerliliği <b>en az altı ayda bir<\/b> geriye dönük <b>stres testleriyle<\/b> sınanır; sonuçlar yönetim kuruluna raporlanır (m.25/B-3).<\/li><li>Pozisyon limitlerinde müşteriler gruplanabilir. Kıstas örnekleri: bir sözleşme veya sözleşme grubu, <b>teslim ayında olup olmama<\/b>, işlemin <b>korunma amaçlı<\/b> olup olmadığı.<\/li><li>Uç piyasa koşullarında en büyük pozisyonlu müşterilerin bir kısmının temerrüdü halinde aracı kurumun mali yapısının <b>sermaye yeterliliği yükümlülüklerini<\/b> karşılayamayacak hale gelmemesi gözetilir (m.25/C).<\/li><\/ul><h3>Tezgahüstü türevde müşteriden teminat (m.25/Ç)<\/h3><ul><li>Gerekli teminat sağlanmadan işleme başlanamaz. Teminat yapısı asgari <b>başlangıç<\/b> ve <b>sürdürme<\/b> teminatından oluşur.<\/li><\/ul><table><tr><th>Başlangıç teminatı<\/th><th>Sürdürme teminatı<\/th><\/tr><tr><td>İşlem yapıp pozisyon alabilmek için yatırılması gereken asgari tutar. Oran = yatırılan teminat / <b>ilk açılan<\/b> toplam pozisyon tutarı.<\/td><td>İşlem süresince sahip olunması gereken asgari tutar. Oran = <b>değerlenmiş<\/b> teminat / sahip olunan pozisyon büyüklüğü.<\/td><\/tr><\/table><ul><li>Sürdürme oranının altına düşülürse aracı kurum <b>teminat tamamlama çağrısı<\/b> yapar ve oranın <b>başlangıç teminat oranına<\/b> çıkarılması sağlanır.<\/li><li>Sürdürme teminatı için bankaların otomatik ödeme sistemleri kullanılabilir; ancak bu yöntem <b>müşterinin kredilendirilmesi<\/b> sonucunu doğuramaz.<\/li><li>Süresinde tamamlanmazsa müşteri <b>başka ihbara gerek kalmaksızın temerrüde<\/b> düşer: temerrüde neden olan pozisyonlar otomatik kapatılabilir; temerrüt sürerken riski artıracak yeni pozisyon emirleri kabul edilmez.<\/li><li>Aracı kurum <b>otomatik pozisyon kapatma oranı<\/b> belirleyebilir; bu oran <b>sürdürme teminat oranının altında<\/b> olmalıdır.<\/li><li>Çerçeve sözleşmede yer alacak teminat esasları: başlangıç ve sürdürme tutar/oranları, teminatların değerleme esasları, izlenmesi, tamamlama çağrısı ve yükümlülüğü, sürdürme altına veya temerrüde düşülmesinde izlenecek yöntem, pozisyonların netleştirilmesi ve otomatik kapanması, varlıkların fiyatlandırılması ve değerlemesi.<\/li><li>Türev emri başka kuruluşa iletiliyorsa müşteriden <b>asgari o kuruluşun talep ettiği kadar<\/b> teminat istenir.<\/li><\/ul><h3>Kaldıraç oranı ve teminatlar (m.27)<\/h3><ul><li><b>Kaldıraç oranı<\/b>: yatırılan teminat karşılığında alınabilecek pozisyon tutarını gösteren oran. Kaldıraçlı işlemler döviz, kıymetli maden ve Kurulca belirlenecek diğer varlıklar üzerine yapılır.<\/li><li>Pozisyonun <b>ilk açıldığı sırada 10:1'i geçemez<\/b>: 100 TL teminatla en fazla 1.000 TL pozisyon. Bu azami orandır; çerçeve sözleşmede daha düşük oran belirlenebilir. Kurul oranları değiştirebilir ve <b>varlık bazında<\/b> oran belirleyebilir.<\/li><li><b>Asgari başlangıç teminatı: 50.000 TL veya muadili döviz.<\/b><\/li><\/ul><table><tr><th>Durum<\/th><th>Sonuç<\/th><\/tr><tr><td>Teminat hesaplaması<\/td><td>Yalnızca <b>gerçekleşmiş<\/b> kâr ve zarar dikkate alınır; açık pozisyonların kâr/zararı dikkate alınmaz.<\/td><\/tr><tr><td>İşlemlere başladıktan sonra <b>zarar<\/b> nedeniyle teminat 50.000 TL altına düşerse<\/td><td>İşlemlere <b>devam edilebilir<\/b>.<\/td><\/tr><tr><td>Başlamadan önce veya sonra <b>nakit çekme veya virman<\/b> ile 50.000 TL altına düşürülürse<\/td><td><b>Pozisyon açılamaz.<\/b><\/td><\/tr><\/table><ul><li>Teminat olarak nakit <b>TL<\/b> ve <b>TCMB'nin günlük alım satım fiyatı ilan ettiği döviz<\/b> kabul edilir.<\/li><li>Teminatlar <b>Takasbank<\/b> nezdinde müşteri ismine saklanır; takibini <b>aracı kurum<\/b> yapar.<\/li><li>Uygulanacak azami kaldıraç oranı çerçeve sözleşmede belirlenir; sonradan değiştirilmesi için müşterinin <b>yazılı onayı<\/b> gerekir (tevsik edilebilir elektronik araçlarla da alınabilir).<\/li><li>Çerçeve sözleşmede ayrıca teminat oranı hesabı, takibi, tamamlama yükümlülüğü, otomatik kapanma ve teminat nakdinin başka para birimine çevrilmesinde esas alınacak kurlar yer alır.<\/li><\/ul><h3>Teminatların izlenmesi ve raporlanması (m.27/A)<\/h3><ol><li>Teminatlar müşteri bazında takip edilir, bildirilir ve <b>Takasbank'ta<\/b> tutulur.<\/li><li>Müşteriden alınan teminatlar <b>en geç ertesi iş günü<\/b> içinde, Takasbank işlem saatlerine uygun olarak raporlanır ve yatırılır.<\/li><li>İşlem aracılığına yetkili aracı kurum merkezi takas kuruluşunda <b>müşteri bazında<\/b> hesap açar; bunun için önce müşteri adına <b>MKK<\/b> hesabı ve sicil tanımlaması gerekir.<\/li><li>Lehine işlem yapılan portföy aracısı merkezi takas kuruluşunda <b>çoklu hesap<\/b> açar; bu hesap müşteri bazındaki hesaplarla ilişkilendirilir.<\/li><li>İşlem aracısı teminatları müşteri bazında portföy aracısına iletir.<\/li><\/ol><ul><li>Raporlama anı itibarıyla: müşterilerin <b>net varlıklarına<\/b> karşılık gelen kısım Takasbank'ta müşteriler adına açılan <b>alt hesaplara<\/b>; <b>brüt varlığın net varlığı aşan<\/b> kısmı aracı kurum adına açılan <b>kaldıraçlı işlemler teminat yedekleri hesabına<\/b> en geç ertesi iş günü aktarılır.<\/li><li>Teminat yedekleri hesabındaki tutar, tüm müşterilerin toplam brüt ve net varlıkları arasındaki farkın <b>%50'sinden az olamaz<\/b>; eksik aracı kurumca tamamlanır, fazlası çekilebilir.<\/li><li>Bu hükümler yurt dışında yerleşik müşterilerin teminatlarına da uygulanır.<\/li><\/ul><h3>Kaldıraçlı işlemlerde diğer özel hükümler<\/h3><ul><li><b>BPY ve yatırım danışmanlığı yasağı<\/b> (m.27/B): aracı kurumlar kendileriyle kaldıraçlı işlem yapan müşterilerine, bu işlemler için bireysel portföy yöneticiliği veya yatırım danışmanlığı veremez (çıkar çatışması). Birliğin <b>09.09.2016<\/b> tarihli Genel Mektubu: “alım satım stratejisi”, “al-sat sinyali” gibi adlarla, genel tavsiye denilse de yatırım danışmanlığı niteliğindeki hizmetler mevzuata aykırıdır.<\/li><li><b>Deneme hesabı<\/b> (m.27/C, genel müşteri): hesap açılışından önce zorunlu; müşteri işlem yapacağı <b>her aracı kurumun<\/b> deneme hesabında işlem yapmalı; <b>gerçek zamanlı fiyatlarla<\/b> çalışır (sorumluluk aracı kurumda); asgari <b>6 iş günü<\/b> ve toplamda asgari <b>50 işlem<\/b>; yükümlülüğün yerine getirildiğini aracı kurum tevsik eder.<\/li><li><b>Yazılı beyan<\/b> (m.27/Ç, genel müşteri): işlemlerin riskli olduğu ve zarar edilebileceği; <b>teminatın tamamının<\/b> kaybedilebileceği; Birlik esaslı deneme hesabında işlem yapıldığı; uygulanacak kaldıraç oranı; internet sitesinde duyurulan kâr/zarar dağılımı. Elektronik hesap açılışında her husus ayrı ayrı kabul edilecek şekilde alınabilir.<\/li><\/ul><h4>Emir iptali (m.29)<\/h4><ul><li>Kural: gerçekleşmiş müşteri emirleri <b>iptal edilemez<\/b>. İstisnalar: (a) <b>itiraz<\/b> üzerine müşteri lehine iyileştirme; (b) işlem platformundaki <b>teknik sorundan<\/b> doğan mağduriyetin giderilmesi (ilgili tüm müşterilere uygulanır); (c) <b>profesyonel müşteri<\/b> emirlerinin müdahalesiz otomatik sistemle başka kuruluşa iletildiği durumda pozisyonun <b>karşı tarafça iptali<\/b> (en geç <b>ertesi işlem günü<\/b>, tüm ilgili müşterilere).<\/li><li>(b) ve (c)'de müşterilere gerekçeli bildirim <b>en seri iletişim aracıyla<\/b> yapılır.<\/li><li>İptal edilen tüm emirler merkezi takas kuruluşuna <b>en geç iptali takip eden iş günü<\/b> raporlanır: (a)'da itiraz beyanı, (b)'de teknik sorunun ayrıntılı açıklaması ve tüm müşterileri kapsadığı beyanı, (c)'de karşı tarafın iptal yazısı örneği ve kapsam beyanı. Raporlamadaki değişiklikler, tespiti takip eden ilk iş günü bildirilir.<\/li><li>Bekleyen emirlerin iptali/fiyat değişikliği ve hesapların işleme kapatılması koşulları çerçeve sözleşmede belirlenir.<\/li><\/ul><h4>Özel hallerin raporlanması ve platformlar<\/h4><ul><li>Birliğe raporlanacak haller (m.29/A): müşteri işlemlerini engelleyecek düzeyde platform kaynaklı <b>teknik sorunlar<\/b>; <b>olağandışı fiyat hareketleri<\/b>, Birlik oranlarını aşan fiyat boşlukları, bu nedenle pozisyonu kapanan yatırımcı sayısı ve zarar tutarı.<\/li><li>Tezgahüstü türevde kullanılan platform, program, modül ve eklentiler (m.29/B) <b>kullanılmaya başlandıktan itibaren 10 gün içinde<\/b> Birliğe yazılı bildirilir; yatırımcı aleyhine unsur içeremez; <b>Birliğe bildirilmeyenler kullanılamaz<\/b>.<\/li><li>Uyumun denetimi için, Kurul listesindeki ve BDDK'nın bilgi sistemleri denetimine de yetkilendirdiği bağımsız denetim kuruluşlarınca <b>yılda en az iki defa<\/b>, aracı kuruma <b>habersiz<\/b> özel amaçlı bağımsız denetim yapılır; habersizlik sözleşmede yer alır; raporlar <b>5 iş günü<\/b> içinde Kurula iletilir.<\/li><\/ul>", "sorular": [{"q": "Kaldıraçlı işlemlerde pozisyonun ilk açıldığı sırada uygulanabilecek azami kaldıraç oranı nedir?", "o": ["10:1", "5:1", "20:1", "50:1", "100:1"], "a": 0, "e": "Kaldıraç oranı pozisyonun ilk açıldığı sırada 10:1'i geçemez; çerçeve sözleşmede daha düşük oran belirlenebilir."}, {"q": "Bir genel müşteri kaldıraçlı işlem hesabına 60.000 TL teminat yatırmıştır. Azami kaldıraç oranıyla alabileceği pozisyon en fazla ne kadardır?", "o": ["60.000 TL", "300.000 TL", "600.000 TL", "1.200.000 TL", "6.000.000 TL"], "a": 2, "e":  emrinin otomatik iletildiği pozisyonun karşı tarafça iptali", "Aracı kurumun zarar etmesini önlemek amacıyla iptal", "Zararda kapanan pozisyon için müşterinin sonradan iptal talep etmesi"], "a": 3, "e": "Aracı kurumun kendi zararını önlemek için emir iptali yapması mümkün değildir; Tebliğ yalnızca üç istisna sayar.", "k": 1}, {"q": "Kaldıraçlı işlemlerde iptal edilen müşteri emirleri merkezi takas kuruluşuna en geç ne zaman raporlanır?", "o": ["İptalle eş anlı", "İptali takip eden iş günü", "3 iş günü içinde", "5 iş günü içinde", "Ay sonunda toplu olarak"], "a": 1, "e": "İptal edilen tüm emirler merkezi takas kuruluşuna en geç iptali takip eden iş günü raporlanır."}, {"q": "Aracı kurumlar tezgahüstü türev işlemlerinde kullanmaya başladıkları yeni bir platform eklentisini Birliğe ne zamana kadar bildirmelidir?", "o": ["Kullanmaya başlamadan 10 iş günü önce", "Kullanmaya başladıktan itibaren 10 gün içinde", "Kullanmaya başladıktan itibaren 30 gün içinde", "Yıl sonunu izleyen 20 iş günü içinde", "Bildirim zorunlu değildir"], "a": 1, "e": "Platform, program, modül ve eklentiler kullanılmaya başlandıktan itibaren on gün içinde Birliğe yazılı bildirilir; bildirilmeyenler kullanılamaz."}, {"q": "Tezgahüstü türev platformlarına ilişkin habersiz özel amaçlı bağımsız denetim hangi sıklıkla yapılmalıdır?", "o": ["Yılda en az iki defa", "Yılda en az bir defa", "Üç ayda bir", "Ayda bir", "İki yılda bir"], "a": 0, "e": "Yılda en az iki defa, aracı kurumdan habersiz özel amaçlı bağımsız denetim zorunludur; raporlar 5 iş günü içinde Kurula iletilir."}, {"q": "Tezgahüstü türevlerde teminatlandırma politikasında kullanılan risk modellerinin geçerliliği hangi sıklıkta sınanmalıdır?", "o": ["En az ayda bir", "En az üç ayda bir", "En az altı ayda bir", "En az yılda bir", "İki yılda bir"], "a": 2, "e": "Risk modellerinin geçerliliği ve güvenilirliği en az altı ayda bir geriye dönük stres testleriyle sınanır ve sonuçlar yönetim kuruluna raporlanır."}, {"q": "Tezgahüstü türevlerde risk yönetim biriminin müşterilerin teminat durumu hakkında genel müdüre raporlama sıklığı en az ne olmalıdır?", "o": ["Haftalık", "Günlük", "Aylık", "Üç aylık", "Altı aylık"], "a": 0, "e": "Risk yönetim birimi müşterilerin teminat durumları ile ilgili genel müdüre en az haftalık raporlama yapar."}, {"q": "Tezgahüstü türevlerde otomatik pozisyon kapatma oranı için aşağıdakilerden hangisi doğrudur?", "o": ["Başlangıç teminat oranına eşit olmalıdır", "Başlangıç teminat oranının üzerinde belirlenir", "Sürdürme teminat oranının altında belirlenmelidir", "Kurul tarafından tek tip belirlenir", "Belirlenmesi yasaktır"], "a": 2, "e": "Aracı kurumlar otomatik pozisyon kapatma oranı belirleyebilir ve bu oran sürdürme teminat oranının altında olmalıdır."}, {"q": "Tezgahüstü türevde sürdürme teminat oranının altına düşen müşteriye yapılan çağrı sonucunda teminat hangi seviyeye tamamlatılır?", "o": ["Sürdürme teminat oranına", "Başlangıç teminat oranına", "Otomatik kapatma oranına", "%100 seviyesine", "Aracı kurumun serbestçe belirleyeceği herhangi bir seviyeye"], "a": 1, "e": "Teminat tamamlama çağrısında oranın başlangıç teminat oranına çıkarılması sağlanır."}, {"q": "Aşağıdakilerden hangisi Yatırım Hizmetleri Tebliği'ne göre kaldıraçlı işlemler kapsamı dışındadır?", "o": ["Bireysel müşteriyle döviz üzerine yapılan kaldıraçlı işlem", "Bankalar arasında yapılan işlemler", "Tezgahüstü fark kontratı", "Kıymetli maden üzerine kaldıraçlı işlem", "Profesyonel müşteriyle yapılan kaldıraçlı işlem"], "a": 1, "e": "Kaldıraçlı işleme konu varlıkların fiziki alım satımı, bankalar arası işlemler ve bankaların aracı kurumlara likidite sağlama işlemleri kapsam dışıdır."}, {"q": "Tezgahüstü türev listelerinde yapılan değişiklik internet sitesinde ilan edildikten sonra Birliğe en geç ne zaman bildirilir?", "o": ["Aynı gün", "3 iş günü", "5 iş günü", "10 iş günü", "20 iş günü"], "a": 2, "e": "Listedeki değişiklik internet sitesinde ilan edilir ve ilanı takip eden 5 iş günü içinde Birliğe bildirilir."}, {"q": "Aşağıdakilerden hangisi diğer düzenlemelerdeki tanımlarından bağımsız olarak Yatırım Hizmetleri Tebliği'nde türev araç kabul edilenler arasında sayılmaz?", "o": ["Fark kontratları", "Yatırım kuruluşu varantları", "Yatırım kuruluşu sertifikaları", "Ortaklık varantları", "Kira sertifikaları"], "a": 4, "e": "Fark kontratları, yatırım kuruluşu varantları ve sertifikaları ile ortaklık varantları türev araç kabul edilir; kira sertifikası bu listede yoktur."}, {"q": "Kaldıraçlı işlem yapan müşterisine bu işlemler için aracı kurumun sunamayacağı hizmet hangisidir?", "o": ["Alım satıma aracılık", "Deneme hesabı", "Bireysel portföy yöneticiliği", "Hesap ekstresi gönderimi", "Teminat takibi"], "a": 2, "e": "Çıkar çatışmasını önlemek için kaldıraçlı işlem yapan müşterilere bu işlemler için bireysel portföy yöneticiliği veya yatırım danışmanlığı verilemez."}, {"q": "Kaldıraçlı işlemlerde teminat olarak aşağıdakilerden hangisi kabul edilir?", "o": ["Hisse senedi", "Devlet tahvili", "Yatırım fonu katılma payı", "TCMB'nin günlük alım satım fiyatı ilan ettiği döviz", "Altın sertifikası"], "a": 3, "e": "Kaldıraçlı işlemlerde teminat kapsamında yalnızca nakit olarak Türk lirası ve TCMB'nin günlük fiyat ilan ettiği döviz kabul edilir."}]}, {"id": 3, "kisa": "BPY, Danışmanlık, Saklama", "baslik": "III-37.1 Yatırım Hizmetleri Tebliği (III): Bireysel Portföy Yöneticiliği, Yatırım Danışmanlığı, Halka Arza Aracılık, Saklama ve Yan Hizmetler", "ozet": "Bireysel portföy yöneticiliği ve yerindelik testi, yatırım danışmanlığı, halka arza aracılık ve konsorsiyum, sınırlı-genel saklama ile yan hizmetler ve genel yatırım tavsiyesi.", "notlar": "<h3>Bireysel portföy yöneticiliği (m.37–44)<\/h3><ul><li><b>Tanım<\/b>: finansal varlıklardan oluşan portföylerin her bir gerçek veya tüzel kişi müşteri adına, menfaat sağlamak üzere <b>vekil sıfatıyla<\/b> yönetilmesi. Kolektif yatırım kuruluşu portföylerinin yönetimini <b>kapsamaz<\/b>.<\/li><li>Müşterinin mali durumu, risk tercihi, getiri beklentisi ve yatırım süresine göre portföy oluşturma; portföyü düzenli takip ve müşteriyi bilgilendirme de kapsamdadır.<\/li><li>Elektronik ortamda başka gerçek/sanal portföylerin takip veya kopyalanması imkânı, <b>müşterinin portföyünde otomatik işlem<\/b> yapılacak şekilde sunulursa BPY sayılır (otomatik değilse yatırım danışmanlığıdır).<\/li><li>Yapabilecekler (m.38): Kurul izniyle <b>aracı kurumlar<\/b>, <b>kalkınma ve yatırım bankaları<\/b>, <b>portföy yönetim şirketleri<\/b>. Aracı kurumlardan kısmi ve geniş yetkililer.<\/li><li>Özel şartlar (m.39): asgari özsermaye (<b>kalkınma ve yatırım bankalarında aranmaz<\/b>); <b>4 yıllık lisans<\/b> mezunu, finans piyasalarında <b>en az 5 yıl<\/b> tecrübeli yeterli sayıda portföy yöneticisi; <b>araştırma birimi<\/b>, birim yöneticisi ve yeterli araştırma uzmanı.<\/li><li>Başka kuruluştan saklama hizmeti alınacaksa saklayıcıyla sözleşme imzalanır; işlemlerde müşteriden önceden teyit alınması öngörülmüşse saklayıcı <b>blokaj<\/b> koyabilir (m.43/3).<\/li><li>Açık pozisyonların <b>teminatsız<\/b> kalması veya portföy değerinin karşılaştırma ölçütü/eşik değere göre hesaplanan tutarın altına düşmesi halinde <b>hesaplamanın yapıldığı gün<\/b> müşteriye bildirim yapılır (m.44).<\/li><\/ul><h4>Yürütme esasları (m.41)<\/h4><ul><li>İhraççı veya yatırım kuruluşundan komisyon, iskonto vb. menfaat sağlanıyorsa hizmet sunulmadan önce müşteriye açıklanır.<\/li><li>Müşterinin <b>yazılı talimatı olmadan<\/b> borsada işlem görmeyen varlıklar ve rayiç değerin üstündeki varlıklar portföye alınamaz, portföyden rayiç değerin altında satılamaz.<\/li><li>Portföydeki varlıklar üzerinde kendi veya üçüncü kişiler lehine hukuki tasarruf yapılamaz; yazılı talimat olmadan yönetim amacı dışında devir veya teslim edilemez.<\/li><li>Özen ve dikkat; kendine çıkar sağlamak için alım satım yasağı.<\/li><li>Basiretli tacir gibi davranmak; çıkar çatışması yaratmamak kaydıyla <b>kendi nakdini<\/b> portföy yönetimine konu araçlarla değerlendirebilir.<\/li><li>Birden fazla portföy yönetiliyorsa birini diğerleri aleyhine kayıracak işlem yapılamaz.<\/li><li>Kararlar güvenilir gerekçe ve analizlere dayanır; araştırma ve raporlar belge-kayıt düzenlemesindeki süre kadar saklanır.<\/li><li><b>Getiri garantisi<\/b> sözlü veya yazılı verilemez, reklamda bu anlama gelen ifade kullanılamaz.<\/li><li>Çatışmada <b>portföy lehine<\/b> davranılır. Müşteriyle birlikte karşılaştırma ölçütü veya eşik değer belirlenebilir.<\/li><li>Müşterinin bilgisizliğinden yararlanıp gereksiz alım satıma ortam hazırlanamaz.<\/li><li>Portföy yöneticiliği dışında faaliyet çağrıştıran isim kullanılamaz; <b>belirli dönem için önceden para toplayıp ortak portföy<\/b> oluşturulamaz, tasarruf sahipleri böyle bir portföye iştirak ettirilemez.<\/li><li>Araştırma sonuçları müşterilere duyurulmadan önce kendi veya üçüncü kişi lehine kullanılamaz; yönetim sırasında edinilen bilgiler kullanılamaz.<\/li><\/ul><h4>Çerçeve sözleşme (m.42)<\/h4><ul><li>Yazılı çerçeve sözleşme zorunlu. Sözleşmede belirtilen <b>portföy yöneticisi ayrılır veya değişirse<\/b> müşteriye en seri iletişim aracıyla <b>derhal<\/b> bildirilir; müşteri yeni yöneticiyi uygun görmezse sözleşmeyi <b>tek taraflı feshedebilir<\/b>.<\/li><li>Yönetimsel ve mali hakların kullanımı, saklama usul ve esasları yer alır. Karşılaştırma ölçütünün <b>getiri taahhüdü anlamına gelmediği<\/b> sözleşmede belirtilir.<\/li><li>Kopyalama hizmetinde sözleşmede: platformun özelliği; her portföyün yatırım amacı, strateji ve risk bilgisi; dönemsel işlem hacimleri; kâr/zarar durumları; performansın anlık ve geçmişe dönük nasıl görüntüleneceği; geçmiş performansın gelecek için gösterge olmadığı.<\/li><\/ul><h3>Yerindelik testi (m.40)<\/h3><ul><li>BPY ve yatırım danışmanlığı sunulmadan, <b>çerçeve sözleşme imzalanmadan önce<\/b> zorunlu. Amaç: sunulacak hizmetin müşterinin (1) <b>yatırım amaçları<\/b>, (2) <b>mali durumu<\/b>, (3) <b>bilgi ve tecrübesi<\/b> ile uyumunu değerlendirmek.<\/li><li>Asgari içerik Birlikçe hazırlanıp Kurulun <b>15.05.2014<\/b> tarih ve 15 sayılı toplantısında onaylandı; <b>20.06.2014<\/b> tarih ve 19/614 sayılı kararla değişiklik yapıldı.<\/li><\/ul><table><tr><th>Bilgi<\/th><th>İçerik<\/th><th>Profesyonel müşteri<\/th><\/tr><tr><td>Yatırım amaçları<\/td><td>Yatırım süresi, risk ve getiri tercihleri<\/td><td>Alınır<\/td><\/tr><tr><td>Mali durum<\/td><td>Gelir düzeyi ve yatırım amaçlı varlıklar<\/td><td>Zorunlu değil (talebe dayalı hariç)<\/td><\/tr><tr><td>Bilgi ve tecrübe<\/td><td>Yaş, meslek, eğitim, genel/profesyonel müşteri olduğu, geçmiş işlemlerin araçları, türü, hacmi, sıklığı<\/td><td>Zorunlu değil (talebe dayalı hariç)<\/td><\/tr><\/table><ul><li>Mali durum değerlendirmesi müşterinin gelir ve yatırım amaçlı varlık hakkında <b>sunduğu bilgilerle sınırlıdır<\/b>.<\/li><li>Müşteri bilgi vermez veya açıkça eksik/güncel olmayan bilgi verirse BPY veya danışmanlık <b>sunulamaz<\/b>; kuruluş müşteriye <b>yazılı bildirim<\/b> yapar.<\/li><li>Bilgilerin doğruluğundan <b>müşteri<\/b> sorumludur; kuruluş dönemsel güncelleme isteyebilir. Hizmet sırasında eksik veya gerçeğe aykırı bilgi öğrenilirse hizmet <b>sonlandırılır<\/b>. Bilgi vermemesi yönünde <b>telkin yasaktır<\/b>.<\/li><li>Hizmet yerindelik sonucuna uygun sunulmak zorundadır; uygun olmadığı anlaşılan şekilde hizmet <b>verilemez<\/b> (müşteri istese bile).<\/li><li>Belgeler ve uyarılar belge-kayıt düzenlemesindeki süre kadar saklanır.<\/li><li>BPY ve danışmanlık <b>aynı birimde<\/b> yürütülebilir; ancak zorunlu <b>araştırma birimi bunlardan ayrı<\/b> kurulur. Portföy yöneticisi ve yatırım danışmanı aynı zamanda müşteri temsilcisi olabilir (Rehber).<\/li><\/ul><h3>Yatırım danışmanlığı (m.45–50)<\/h3><ul><li><b>Tanım<\/b>: talep olsun olmasın, SPA ve ihraççılar hakkında <b>belli bir kişiye veya mali durumu, risk-getiri tercihi benzer bir gruba<\/b> yönelik yönlendirici yorum ve tavsiye. Üç kavram: yatırım danışmanlığı (yatırım hizmeti), <b>genel yatırım tavsiyesi<\/b> (yan hizmet), <b>finansal bilgi<\/b>. Son ikisi danışmanlık değildir.<\/li><li>Başka portföylerin takip/kopyalanması imkânının sunulması yatırım danışmanlığıdır.<\/li><li>Dikkat – kapsam dışı: <b>emeklilik şirketlerinin<\/b> BES fon payları hakkındaki yönlendirici tavsiyeleri Tebliğe tabi değildir (yerindelik yok). <b>TEFAS<\/b> veya <b>BEFAS<\/b>'ta işlem gören fonlar, para piyasası (likit) fonları ve kısa vadeli borçlanma araçları fonları hakkında risk-getiri tercihine göre verilen tavsiyeler danışmanlık sayılmaz, yerindelik gerekmez; ancak 48/2 (a bendi hariç) ve m.50'ye uyulur.<\/li><li>Yapabilecekler (m.46): <b>aracı kurumlar, yatırım ve kalkınma bankaları, portföy yönetim şirketleri<\/b>. Dikkat: <b>ticari bankalar yatırım danışmanlığı yapamaz.<\/b><\/li><li>Özel şartlar (m.47): asgari özsermaye (kalkınma ve yatırım bankalarında aranmaz); 4 yıllık lisans ve finans piyasalarında <b>en az 3 yıl<\/b> tecrübeli yeterli yatırım danışmanı; araştırma birimi, birim yöneticisi ve araştırma uzmanı.<\/li><\/ul><h4>Yürütme esasları (m.48) ve üç ilke<\/h4><ul><li>Yerindelik testi sözleşmeden önce zorunlu; tavsiye yerindelik bilgileri dikkate alınarak en uygun karara yönelik olur.<\/li><li>Yanıltıcı, istismar edici, gerçek dışı ya da “en sağlam”, “en iyi”, “en güvenilir” gibi <b>öznel ve abartılı<\/b> ifade yok; özenli ve objektif; güvenilir kaynaklarla desteklenir, kaynak kesinliğinden şüphe varsa belirtilir.<\/li><li>Halka arz yorumlarında yayımlanmışsa izahname bilgileri, yayımlanmamışsa izahnamenin yayımlanacağı belirtilir.<\/li><li>Getiri vaadi kesinlikle yok; öngörü, tahmin ve fiyat hedefleri bu nitelikleri açıkça belirtilerek ve önemli varsayımlarıyla verilir; Kurulun alanındaki konularda yalan/mesnetsiz bilgi yok; araştırma sonuçları duyurulmadan önce kullanılamaz.<\/li><li>Üç temel düşünce (Rehber): <b>yatırımcının korunması<\/b>, <b>objektiflik<\/b>, <b>çıkar çatışmasının önlenmesi<\/b>.<\/li><li>m.48/3: hedef fiyatın <b>değerleme esasları ve yöntemi<\/b>; “al”, “sat”, “tut” gibi ifadelerin <b>yatırım süresi dahil anlamları<\/b>, risk uyarıları ve <b>duyarlılık analizleri<\/b>; hazırlayanın kimliği <b>talep halinde<\/b> açıklanır. Bu bilgiler tavsiyeye göre çok uzunsa, yöntem değişmemişse internet sitesine açık atıf yeterli.<\/li><li>m.50 çıkar çatışması: objektifliği etkileyebilecek tüm ilişkiler açıklanır; hazırlayan tüm kişiler için geçerli; ihraççı ile kuruluşun birbirinin sermaye/oy haklarında <b>%1 veya daha fazla<\/b> payı, yönetim imtiyazı, kredi ve kira gibi önemli finansal ilişkileri açıklanır.<\/li><\/ul><h4>Sözleşme (m.49)<\/h4><ul><li>Sözleşmeden önce <b>tanıtıcı form<\/b>: danışmanlık ilkeleri; bilgi kaynakları, stratejiler, analiz yöntemleri; sunuluş biçimi (yazılı, sözlü, günlük, haftalık…); olası çıkar çatışmaları.<\/li><li>Danışman ayrılır veya değişirse en seri iletişimle bildirim; müşteri yeni danışmanı uygun görmezse <b>tek taraflı fesih<\/b>.<\/li><li>Rehber: danışmanlık yetkisi olmayan kuruluşların fonlarla ilgili sunabilecekleri hizmetler (belli fon dağılımı ürünü, standart dağılım tavsiyesi, bu tavsiye çerçevesinde fon önerisi, portföyün izlenmesi ve yeniden düzenlenmesi, genel tavsiye/finansal bilgi).<\/li><\/ul><h3>Halka arza aracılık (m.51–58)<\/h3><ul><li>İki tür: <b>aracılık yüklenimi<\/b> (yüklenimle satışa aracılık) ve <b>en iyi gayret aracılığı<\/b> (yüklenimsiz; satılamayan kısım satıcıya iade edilir veya önceden almayı taahhüt etmiş üçüncü kişilere satılır).<\/li><\/ul><table><tr><th>Yüklenim türü<\/th><th>Özü<\/th><\/tr><tr><td>Bakiyeyi yüklenim<\/td><td>Satış süresi sonunda satılamayan kısmın <b>tamamı<\/b> bedeli ödenerek alınır.<\/td><\/tr><tr><td>Tümünü yüklenim<\/td><td>Satış başlamadan önce bedel ödenerek <b>tamamı<\/b> alınıp halka satılır.<\/td><\/tr><tr><td>Kısmen bakiyeyi yüklenim<\/td><td>Satılamayan kısmın <b>bir bölümü<\/b> süre sonunda alınır.<\/td><\/tr><tr><td>Kısmen tümünü yüklenim<\/td><td>Satış başlamadan önce <b>bir kısmı<\/b> alınıp halka satılır.<\/td><\/tr><\/table><ul><li>Kapsam: ihraç fiyatı, miktarı ve süreç çalışmaları; izahname başvurusu; <b>konsorsiyum<\/b>; talep toplama; yurt içi/dışı satış organizasyonu; halka arz edilmeksizin satışta belli yatırımcı grubuna tahsise aracılık. Dikkat: <b>gişe hizmeti<\/b> artık halka arza aracılık değil, <b>emir iletimine aracılıktır<\/b>.<\/li><li>Yapabilecekler (m.52): <b>aracı kurumlar<\/b> ve <b>kalkınma ve yatırım bankaları<\/b>. Aracılık yüklenimi izni en iyi gayret aracılığını da kapsar.<\/li><li>Şartlar (m.53): asgari özsermaye (kalkınma ve yatırım bankalarında aranmaz); <b>sınırlı saklama<\/b> izni/başvurusu; birim yöneticisi ve yeterli <b>kurumsal finansman uzmanı<\/b>.<\/li><li>Yazılı <b>halka arza aracılık sözleşmesi<\/b> şart (m.55).<\/li><li>Esaslar: izahname ve sözleşmeye uygunluk; piyasa bozucu eylem yok; ücret dışında menfaat yok; ihraççı hakkında detaylı inceleme için en iyi gayret; fiyatın gerçek değeri en doğru göstermesi için azami özen, değerleme standartlarına uyum, fiyat tespit raporunda yöntem seçim gerekçeleri; kamuya açıklanmamış bilgilerin kurum dışı ve birim dışıyla paylaşılmaması; taahhüt tutarı sermaye yeterliliği sınırını aşamaz.<\/li><li>İki temel düşünce: kamunun aydınlatılması yoluyla <b>yatırımcının korunması<\/b> ve <b>çıkar çatışmasının/bilgi suistimalinin önlenmesi<\/b>.<\/li><li>Konsorsiyum (m.56–58): sözleşmeden sonra kurulacaksa <b>ihraççı/halka arz edenin onayı<\/b>; yönetimi <b>konsorsiyum lideri<\/b> üstlenir ve Kurula, resmi kurumlara, üçüncü kişilere karşı temsil eder; <b>eş liderler<\/b> belirlenebilir; yazılı konsorsiyum sözleşmesi. Aracılık ve konsorsiyum sözleşmeleri tek sözleşmede birleştirilebilir; diğer üyelerle <b>en az 2 iş günü<\/b> önceden paylaşılır ve hep birlikte imzalanır.<\/li><\/ul><h3>Saklama hizmeti (m.59–70)<\/h3><ul><li>Kanun saklamayı ikiye ayırır: SPA'nın müşteri namına saklanması ve yönetimi (<b>bu Tebliğ<\/b>) ile <b>portföy saklaması<\/b> (III-56.1). Bireysel portföy varlıklarının saklanması bu Tebliğin saklama kapsamındadır.<\/li><li>Saklama: müşteriye ait SPA'nın merkezi saklama kuruluşunda/kuruluş nezdinde hak sahibi bazında tutulması ve izlenmesi + anapara, faiz, temettü tahsili, yeni ve bedelsiz pay ile oy haklarının kullanılması, teminat takibi gibi hizmetler; nakit de dahil.<\/li><\/ul><table><tr><th>Sınırlı saklama<\/th><th>Genel saklama<\/th><\/tr><tr><td>İşlem aracılığı, portföy aracılığı, yönetilen bireysel portföyler ve halka arzına aracılık edilen SPA ile <b>sınırlı<\/b>; kuruluş kendi müşterisinin varlığını saklar.<\/td><td>Yetkili olunan faaliyetten <b>bağımsız<\/b> saklama; özellikle <b>başka yatırım kuruluşlarının müşterilerine<\/b> saklama.<\/td><\/tr><tr><td>Yapabilecekler: işlem aracılığı, portföy aracılığı, BPY veya halka arza aracılık yetkisi olan yatırım kuruluşları.<\/td><td>Yapabilecekler: <b>bankalar<\/b> ve bu yetkilerden birine sahip <b>aracı kurumlar<\/b>.<\/td><\/tr><\/table><ul><li>Dikkat: <b>Genel saklama izni sınırlı saklamayı kapsamaz<\/b>; ikisi için ayrı izin gerekir.<\/li><li>Bankalar <b>yalnızca genel saklama<\/b> verip başka yatırım hizmeti yapmayabilir. Bankalar <b>emir iletimine aracılık ettikleri müşterilerine<\/b> genel saklama sunamaz; saklama yetkili bir kuruluşla anlaşmalıdır.<\/li><li>Aracı kurumlara asgari özsermaye şartı var; <b>bankalara sermaye şartı yok<\/b>.<\/li><li>Şartlar (m.61): genel saklamada <b>münhasır<\/b> saklama birimi ve yeterli personel; bilgi işlem altyapısı, kötü niyetli yazılımdan korunma; suistimal ve dolandırıcılığa karşı tedbirler; bilgilerin birimler arası paylaşımını engelleyen iş akışı.<\/li><li>Portföy saklama kuruluşu olmak için genel saklama izni yetmez; ayrıca III-56.1 uyarınca yetkilendirilmek gerekir (m.60/4).<\/li><li>Saklama öncesi müşteriyle <b>yazılı sözleşme<\/b> zorunlu. İstisnalar: yurt dışı müşteriye yurt dışındaki saklayıcı ile yurt içi saklayıcı arasında sözleşme varsa; başka kuruluşça yönetilen bireysel portföylerde portföy yöneticisi ile saklayıcı arasında sözleşme varsa.<\/li><li>Kayıtlar (m.63): miktar, yer ve mülkiyeti gösteren tam, doğru, güncel kayıt; her an başka müşteriden ve kuruluş varlığından ayırt edilebilir olmalı. Yurt dışı müşterilerde kayıtlar <b>nakit hariç hak sahibi bazında<\/b>. Kurul bağımsız denetim isteyebilir. Hesap bilgileri <b>gizlidir<\/b>; müşteriyi bilgilendirerek yetkililere bilgi verilmesi ihlal sayılmaz (m.64).<\/li><\/ul><h4>Mutabakat ve bildirim<\/h4><table><tr><th>Konu<\/th><th>Kural<\/th><\/tr><tr><td>Kayıtlar arası mutabakat (m.65)<\/td><td><b>Günlük<\/b>; SPA müşteri bazında, nakit toplu veya müşteri bazında. Uyumsuzluk derhal giderilir; üçüncü taraf sorumluysa açığı telafi zorunlu değil ama çözüm adımları atılır.<\/td><\/tr><tr><td>Giderilemeyen uyumsuzluk<\/td><td><b>3 iş günü<\/b> içinde giderilemezse müfettiş/iç denetimden sorumlu en üst personel derhal aracı kurum yönetim kuruluna, banka iç denetim komitesine ve Kurula <b>yazılı<\/b> bilgi verir. Mali durumu önemli etkileyecekse 3 gün beklenmez.<\/td><\/tr><tr><td>Müşteriyle mutabakat (m.68)<\/td><td>İç kontrol birimince <b>her takvim yılında en az 1 defa<\/b>, yazılı veya elektronik. Sonuç <b>3 iş günü<\/b> içinde yönetim kuruluna/iç denetim komitesine, ihtilaf varsa Kurula. Profesyonel müşteriden <b>yazılı onay<\/b> alınırsa zorunlu değil.<\/td><\/tr><tr><td>Müşteriye bildirim (m.69)<\/td><td><b>Ayda bir<\/b>; asgari tarih ve araç bazında saklama bakiyeleri. Profesyonelle sözleşme veya çerçeve sözleşme hükmüyle yapılmayabilir. Elektronik yapılabilir, <b>ispat yükü kuruluşta<\/b>. Dikkat: müşterinin <b>itiraz etmemesi mutabakat sayılmaz<\/b>.<\/td><\/tr><\/table><h4>Müşteri nakit bakiyeleri (m.66)<\/h4><ul><li>Çerçeve sözleşmedeki yetkiye bağlı olarak, gün içinde emre konu olmayan ve gün sonu alacak bakiye veren nakitler hesap bazında izlenerek <b>toplu veya müşteri bazında<\/b> değerlendirilebilir; toplu değerlendirmede gelir müşterilere <b>oransal<\/b> dağıtılır.<\/li><li>Sözleşmede açıkça belirtilirse <b>alt limit<\/b> konabilir; limit değişikliği yazılı veya en seri iletişimle bildirilir (i
