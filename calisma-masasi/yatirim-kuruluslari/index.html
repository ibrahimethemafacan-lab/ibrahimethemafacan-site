Bilgi sistemlerinde yönetim, erişim, kontrol, denetim gibi fonksiyonlarda <b>karar gücü aracı kurumda<\/b> kalmalıdır.<\/li><li>Müşteri bilgisi hizmet sağlayıcıya iletilecekse çerçeve sözleşmede yer verilir veya müşteriye bildirilir. Riskler, kesinti eylem planı ve ikame edilebilirlik <b>acil durum planında<\/b> yer alır.<\/li><li>VII-128.10 Bilgi Sistemleri Tebliği: <b>yılda en az bir kez sızma testi<\/b>; kritik operasyonları kesecek veya veri sızıntısına yol açacak siber olayda <b>derhal<\/b> Kurul, müşteriler ve ilgili kurumlar bilgilendirilir; siber olay müdahale raporu üst yönetime, kritik sistem etkilenmişse derhal Kurula.<\/li><li>Hizmet sağlayıcı: önemli gelişmeleri derhal bildirir; Kurul ve borsaların istediği bilgileri istenen zaman ve nitelikte verir; sözleşme süresince ve sonrasında sırları korur.<\/li><li>Başlamadan önce: hizmetin uygun olup olmadığı, fayda-maliyet, sağlayıcının donanım, mali güç, tecrübe ve insan kaynağı değerlendirilir; rapor <b>genel müdür<\/b> tarafından <b>yönetim kuruluna<\/b> sunulur. Riskler ile sağlayıcının izlenmesi ve denetimine ilişkin prosedürler oluşturulur.<\/li><li>Kurula bildirim: hizmet almaya başlamayı izleyen <b>10 iş günü<\/b>; süre sonunda yenilemede <b>10 iş günü<\/b>; süre bitmeden <b>fesihte derhal<\/b> (gerekçe ve tedbirlerle). Aykırılık veya şart kaybında Kurul hizmet alımının durdurulmasını isteyebilir.<\/li><\/ul><h3>Yapılamayacak iş ve işlemler (m.56)<\/h3><ol><li>(a) İzinli hizmetler dışında <b>sınai ve zirai<\/b> faaliyet;<\/li><li>(b) Mevzuatın izin verdiği haller dışında SPA dışında kendi mali taahhüdünü içeren evrak çıkarma;<\/li><li>(c) <b>Ticari amaçlı gayrimenkul<\/b> alım satımı;<\/li><li>(ç) Mevzuat dışı <b>ödünç para verme<\/b> (kredili SPA işlemleri serbest);<\/li><li>(d) <b>Mevduat veya katılım fonu<\/b> toplama ya da bu sonucu doğuran işlemler;<\/li><li>(e) SPA'nın <b>belli bir getiri<\/b> sağlayacağı taahhüdü (geçmiş veriler ve istatistik kullanılabilir; önemli olan geleceği kesinmiş gibi sunmamak);<\/li><li>(f) Müşteri varlıkları üzerinde yetkisiz tasarruf;<\/li><li>(g) Çalışan ve müşterilerin olağan ilişki dışı imkanlarla kendi hesabına işlem yapmasına olanak;<\/li><li>(ğ) İzin verilenler hariç <b>kendi ihraç ettiği payları<\/b> alıp satma (geri alım düzenlemeleri ve TTK m.379'a uygun alımlar serbest);<\/li><li>(h) Fiktif hesap, kayıt dışı işlem, gerçeğe aykırı kayıt;<\/li><li>(ı) Portföy yöneticiliği saklı kalmak üzere, çalışanlar aracılığıyla müşteriden emir verme, ordino imzalama, para/SPA yatırma-çekme, virman gibi <b>geniş yetkili vekaletname<\/b> alarak veya sözlü yetkiye dayanarak müşteri adına işlem;<\/li><li>(i) Müşteri haklarını zedeleme, iyi niyete aykırılık, bilgisizlikten yararlanma;<\/li><li>(j) Gelir artırmak için gereksiz/aşırı işleme ortam hazırlama, zarar telafisi veya işlem yaptırmak için kaynak sağlama, <b>talimatsız işlem<\/b>;<\/li><li>(k) Bir mali yılda <b>özsermayenin binde beşini<\/b> aşan <b>bağış<\/b>.<\/li><\/ol><ul><li>Bankalar yalnızca yatırımcı korumasına yönelik <b>(e), (f), (g), (h), (ı), (i), (j)<\/b> bentlerine tabidir.<\/li><\/ul><h3>Faaliyetlerin durdurulması ve feragat (m.57–63)<\/h3><ul><li><b>Kendi isteğiyle geçici durdurma<\/b>: Kurul <b>2 yılı geçmeyen<\/b> süre verir (karar tarihinden başlar); talep üzerine ek süreler <b>toplamı 2 yılı<\/b> geçemez. Yeniden faaliyete geçtikten sonraki <b>5 yıl<\/b> içinde tekrar durdurmada önceki kapalılık süresi de sayılır. Süre sonunda yeniden faaliyet veya yeni kuruluş için iptal başvurusu yapılmazsa <b>tüm izinler iptal<\/b>.<\/li><li><b>Kısmen feragat<\/b>: ilgili izinler iptal; iptal kararını izleyen <b>2 yıl<\/b> içinde o izin için yeniden başvurulamaz (bankalara da uygulanır).<\/li><li><b>Tamamen feragat<\/b> şartları: tüm müşterilerle yazılı mutabakat; Ek'teki ilan metninin ülke çapında tirajı en yüksek <b>on gazeteden en az ikisinde<\/b>, internet sitesinde ve <b>en az 5 iş günü KAP<\/b>'ta ilanı; ulaşılamayan veya mutabakat sağlanamayan müşteri varlıkları ile ihtilaflı tutarların (faiziyle) <b>Takasbank<\/b> nezdinde bloke edilmesi; hiç ihtilaf yoksa bunu tespit eden <b>noter onaylı YK kararı<\/b>; <b>%10'un üzerinde<\/b> paylı tüm ortaklardan (bu yoksa toplamı en az <b>%90<\/b> eden ortaklardan) borçlardan payları oranında sorumluluk taahhütnamesi.<\/li><li>İzin iptalinden sonra <b>en geç 3 ay<\/b> içinde sona erme kararı veya esas sözleşme değişikliği; TTSG ilanını izleyen 10 iş günü içinde Kurula.<\/li><li>Bloke varlıklar: müşteri bazlı liste ve listenin kayıtlarla uyumuna dair <b>bağımsız denetim raporu<\/b> Kurula; liste Takasbank'a iletilir; Takasbank/MKK bloke eder. Müşteri nakitleri <b>anapara korunarak<\/b> değerlendirilir. Bu varlıklar üçüncü kişilere devredilemez, kamu alacağı için bile <b>haczedilemez<\/b>, rehnedilemez, iflas masasına girmez, ihtiyati tedbir konamaz. Mutabakatsızlık nedeniyle blokeler müşterinin <b>doğrudan Takasbank'a<\/b> başvurusuyla, ihtilaflılar <b>kesinleşmiş mahkeme kararı<\/b> veya kesinleşmiş takip belgesiyle getirileriyle iade edilir.<\/li><li><b>Yeni aracı kurum için yetki iptali<\/b> (m.63): halka açık olmayan <b>en az bir<\/b> aracı kurumun tüm izinlerinin iptalini isteyerek çekilmesi halinde, kuruluş şartları sağlanırsa yeni aracı kurum kurulabilir; sermaye dağılımı serbest; eski kurumun izinleri yenisi faaliyete geçtiği gün iptal edilir; %10 üzeri (veya toplam %90) ortaklar taahhütname verir.<\/li><\/ul><h3>Kurulun tedbirleri (m.65 vd.)<\/h3><ul><li>Faaliyeti <b>sınırlandırma<\/b> (araç, piyasa, merkez dışı örgüt veya iş ilişkisi kurulacak kuruluş bazında), <b>geçici durdurma<\/b> veya <b>izin iptali<\/b> halleri: (a) izinden itibaren <b>2 yıl<\/b> o izinle hiç faaliyette bulunmamak; (b) iznin yanlış/yanıltıcı beyanla alınması; (c) şart kaybının tespitinden itibaren <b>3 ayı<\/b> geçmeyen sürede giderilmemesi; (ç) eksik teminatın <b>3 ayı<\/b> geçmeyen sürede yatırılmaması; (d) hukuka aykırı faaliyet; (e) mali durumun bozulması. Bu hallerde yan hizmetler de durdurulabilir.<\/li><li>Geçici durdurmada Kurul <b>2 yılı<\/b> geçmeyen süre verir; talep üzerine veya resen uzatmalar toplamı 2 yılı geçemez; süre sonunda faaliyete geçilemezse tüm izinler iptal.<\/li><li>Dikkat: <b>2 yıl içinde faaliyetlerinin tamamı iki kez<\/b> geçici durdurulan aracı kuruma üçüncü kez bu tedbir uygulanmaz, <b>tüm izinleri iptal<\/b> edilir. Aynı faaliyeti iki kez durdurulana üçüncüsünde yalnızca <b>o izin<\/b> iptal edilir.<\/li><li>Hukuka aykırılıkta sorumlu yönetici ve çalışanların lisansları geçici/sürekli iptal edilebilir; <b>suç duyurusu kararından<\/b> yargılama sonuna kadar imza yetkileri sınırlandırılabilir veya kaldırılabilir. Sorumluluğu <b>mahkeme kararıyla<\/b> tespit edilen YK üyeleri görevden alınabilir, ilk genel kurula kadar yerlerine atama yapılır; banka YK üyeleri için önce <b>BDDK görüşü<\/b> alınır.<\/li><li>Mali durum bozulunca (sermaye yeterliliğini sağlayamama, ödeme/teslim yükümlülüklerini yerine getirememe, mali yapının ciddi zayıflaması): <b>3 ayı geçmeyen<\/b> sürede güçlendirme isteme; süre vermeden durdurma; yetki kaldırma ve izin iptali; <b>yatırımcıları tazmin<\/b> kararı; lisans iptali, imza yetkisi kısıtlama; YK üyelerini görevden alma; <b>tedrici tasfiye<\/b> veya doğrudan <b>iflas<\/b> isteme; diğer tedbirler. Bankalarda (mevzuata aykırılığın giderilmesi ve faaliyete ilişkin tedbirler hariç) karar <b>BDDK<\/b>'nın, TMSF'ye devredilen bankalarda <b>TMSF<\/b>'nin.<\/li><li>Taahhütlerin <b>%10'undan<\/b> veya alacaklıların sayıca <b>%10'undan<\/b> fazlasından ibralaşma veya borcu azaltan kısmi ifa için <b>ibraname<\/b> alınırsa faaliyetler sürekli durdurulur, yetki belgeleri iptal edilir.<\/li><li>İflas veya tedrici tasfiyede sorumluluğu tespit edilen <b>%10'dan fazla paylı ortaklar<\/b>, eski ve mevcut YK üyeleri ve <b>imzaya yetkili yöneticilerin<\/b> şahsen iflası istenebilir.<\/li><li>Konsolidasyon: bir aracı kurumun diğerinde %10 veya fazla payı, YK'ya katılımı, asaleten oy kullanması, yönetim kontrolü veya hakim ortağın aynı olması halinde Kurul tek unvan altında <b>birleşme<\/b> isteyebilir.<\/li><\/ul><h3>Teminatlar<\/h3><ul><li>Kurul, mali durum gerektiriyorsa aracı kurumların tamamından, bir kısmından veya birinden belirli tutar/oranda teminatı belirli süre için <b>Kurul adına Takasbank<\/b> nezdinde bloke ettirebilir. Teminatlar amacı dışında kullanılamaz, devredilemez, haczedilemez, rehnedilemez, iflas masasına girmez, ihtiyati tedbir konamaz.<\/li><li>Türler: <b>nakit<\/b>, <b>kamu borçlanma aracı<\/b>, 4749 sayılı Kanun kapsamında <b>kira sertifikası<\/b>, sermaye/yönetim ilişkisi olmayan bir bankadan <b>teminat mektubu<\/b>, <b>kurucusu olmadıkları<\/b> yatırım fonu katılma payları.<\/li><li>Değerleme sermaye yeterliliği ilkelerine göre; Takasbank <b>aylık<\/b> izler, eksikleri tamamlatır, yıl sonunu izleyen <b>20 iş günü<\/b> içinde Kurula rapor gönderir.<\/li><li>İade: neden ortadan kalkınca veya süre bitince koşulsuz. Faaliyeti geçici durdurulanların teminatı yeniden faaliyete geçinceye veya tüm izinler iptal edilinceye kadar serbest bırakılmaz; yeniden faaliyete geçenlerin teminatı <b>en az 1 yıl kesintisiz<\/b> faaliyetten sonra serbest kalır.<\/li><li>İzinleri iptal edilenlerde: <b>tazmin veya tedrici tasfiye<\/b> kararı varsa teminat <b>YTM'ye<\/b> tevdi edilir; <b>iflas<\/b> halinde iflas tasfiyesi tamamlanıncaya kadar Takasbank'ta tutulur, sonra alacaklılara tamamen veya <b>garameten<\/b> ödenir, bakiye iflas dairesine; ikisi de yoksa başvuru üzerine, denetim/şikayet/uyuşmazlık ve borsa, Takasbank, MKK, Birlik, Kurula borç yoksa ve unvan değiştirilmiş veya sona erme kararı alınmışsa iade edilir.<\/li><li>Borsalar ve takas-saklama kuruluşlarının istediği teminatlar bu esaslara tabi değildir.<\/li><\/ul>", "sorular": [{"q": "Bir tüzel kişi bir aracı kurumun %90'ına sahiptir. Bu tüzel kişinin bir ortağı tüzel kişideki %20 payını devrederse aracı kurumda dolaylı olarak ne kadarlık pay değişikliği gerçekleşir?", "o": ["%2", "%10", "%18", "%20", "%72"], "a": 2, "e": "Dolaylı değişiklik 0,9 × 0,2 = %18 olup %10 eşiğini aştığından faaliyet şartları bakımından Kurul onayına tabidir."}, {"q": "Payları borsada işlem gören bir aracı kurumda bir ortağın payının %10'un altına düşmesi sonucunu verecek satış için ne gereklidir?", "o": ["Satıştan sonra 10 iş günü içinde bildirim", "Satış yapılmadan önce Kurul izni", "Yalnızca KAP açıklaması", "Birlik onayı", "Hiçbir işlem gerekmez"], "a": 1, "e": "Borsada işlem gören paylarda oranların altına düşüşler 10 iş günü içinde bildirilir; ancak %10'un altına düşecek satıştan önce Kurul izni alınmalıdır."}, {"q": "Aracı kurumlar yeni işe aldıkları ihtisas personeline ilişkin bilgileri nereye ve ne kadar sürede bildirir?", "o": ["Kurula, 3 iş günü", "Birliğe, 5 iş günü", "MKK'ya, derhal", "Takasbank'a, 10 iş günü", "SPL'ye, 10 iş günü"], "a": 4, "e": "Personel bilgileri işe alınmayı takiben 10 iş günü içinde SPL'ye bildirilir; diğer bildirimler ise Birliğe yapılır."}, {"q": "Aracı kurumların murahhas üye tayinine ilişkin yönetim kurulu kararları Birliğe hangi süre içinde bildirilir?", "o": ["Tescilini izleyen 3 iş günü", "Tescilini izleyen 10 iş günü", "Karar tarihini izleyen 1 ay", "Derhal", "Yıl sonunda"], "a": 0, "e": "Murahhas üye tayini ve yetkilerine ilişkin YK kararları tescili izleyen 3 iş günü içinde Birliğe bildirilir."}, {"q": "Aracı kurumun taraf olduğu dava ve takiplerin hangi tutarı aşması halinde Birliğin yanı sıra Kurula da bildirim yapılır?", "o": ["Özsermayenin %10'u", "Ödenmiş sermayenin %5'i", "Özsermayenin %25'i", "1 milyon TL", "Aktif toplamının %1'i"], "a": 0, "e": "Dava ve takiplerin tutarı özsermayenin %10'unu geçerse Kurula da bildirimde bulunulur."}, {"q": "İzinsiz sermaye piyasası faaliyetine ilişkin somut ve güçlü emare tespit eden yatırım kuruluşunun yükümlülüğü nedir?", "o": ["Durumu yıllık faaliyet raporunda açıklamak", "Hesap ilişkisini sona erdirip ivedilikle Kurula bildirmek", "Müşteriyi sözlü olarak uyarmak", "Yalnızca MASAK'a şüpheli işlem bildirimi yapmak", "Hesabı 6 ay izlemeye almak"], "a": 1, "e": "Somut ve güçlü emare varsa hesap ilişkisi sona erdirilerek ivedilikle Kurula bildirim yapılır; aksi halde hukuki sorumluluk kuruluşa ait olur."}, {"q": "Geniş yetkili olmayan bir aracı kurumun, sınırsız iştirak edilebilecek kurumlar dışındaki ortaklıklara yapabileceği iştirakler toplamı özsermayesinin en fazla yüzde kaçı olabilir?", "o": ["%10", "%20", "%25", "%50", "%75"], "a": 2, "e": "Bu iştiraklerin toplamı özsermayenin %25'ini aşamaz; geniş yetkili aracı kurumlar için sınır %50'dir."}, {"q": "Aşağıdakilerden hangisine aracı kurumlar herhangi bir sınıra tabi olmaksızın iştirak edebilir?", "o": ["Bir faktoring şirketi", "Bir tekstil şirketi", "Bir inşaat şirketi", "Bir gıda şirketi", "Bir turizm şirketi"], "a": 0, "e": "Aracı kurumlar sermaye piyasası kurumları, borsalar, sigorta, bireysel emeklilik, finansal kiralama, faktoring, finansman ve varlık yönetim şirketleri gibi finansal kuruluşlara sınırsız iştirak edebilir."}, {"q": "Kaldıraçlı işlemlere ilişkin reklamlarda aşağıdaki ifadelerden hangisinin kullanılması yasak değildir?", "o": ["Hiçbir durumda zarar etmeyeceksiniz", "Ev hanımları için ek gelir fırsatı", "Bu yıl dolar/TL 50 olacak", "Kısa bir eğitimle profesyonel olun", "Son çeyrekte müşteri hesaplarımızın belirli oranı kârda, belirli oranı zararda kapanmıştır"], "a": 4, "e": "Çeyreklik kârda/zararda olan hesap oranlarının reklamda yer alması zorunludur; diğerleri yasak ifadelerdir."}, {"q": "TSPB Promosyon Kampanyaları Yönergesi'ne göre aşağıdakilerden hangisi yanlıştır?", "o": ["Kampanya süresi 1 yıldan uzun olamaz", "Başvuru başlangıçtan en az 10 iş günü önce yapılır", "Kaldıraçlı işlemler için promosyon kampanyası düzenlenebilir", "Birlik onayı reklam amacıyla kullanılamaz", "Kampanya dönemi yalnızca bir defa uzatılabilir"], "a": 2, "e": "Kurulun 15.07.2016 tarihli İlke Kararı uyarınca kaldıraçlı işlemler ve fark kontratları için promosyon kampanyası düzenlenemez."}, {"q": "Promosyon kampanyalarında kampanyaya konu ürün veya hediyenin maddi değerine ilişkin kural nedir?", "o": ["Hiçbir sınır yoktur", "Yatırımcının kampanya döneminde ödediği işlem komisyonundan fazla olamaz", "Yatırımcının portföy değerinin %1'ini aşamaz", "10.000 TL'yi aşamaz", "Aracı kurumun aylık kârının %5'ini aşamaz"], "a": 1, "e": "Ödülün değeri yatırımcının kampanya döneminde ödediği/ödeyeceği komisyondan fazla olamaz; çekilişli ve sınırlı sayıda müşteriye makul bütçeli kampanyalarda bu şart aranmaz."}, {"q": "Promosyon Kampanyaları Yönergesi kapsamında aşağıdakilerden hangisi promosyon kampanyası olarak değerlendirilir?", "o": ["Yılbaşında dağıtılan ajanda ve takvim", "Komisyon tarifesine dayalı pazarlama çalışması", "Gelir yaratmayan, finansal okuryazarlığı destekleyen eğitim amaçlı yarışma", "Konferansta verilen sembolik hediye", "Müşterinin doğum gününde gönderilen kalem"], "a": 2, "e": "Gelir yaratmayan ve finansal okuryazarlığı destekleyen eğitim amaçlı yarışmalar promosyon kampanyası sayılır; diğerleri kapsam dışıdır."}, {"q": "Aracı kurum irtibat bürolarına ilişkin aşağıdaki ifadelerden hangisi doğrudur?", "o": ["Nakit tahsil ve tediye edebilir", "Aracı kurumun tüm faaliyetlerini yürütebilir", "Yalnızca müşteri emirlerini aracı kuruma iletebilir", "Büro sorumlusunun 4 yıllık lisans mezunu olması gerekir", "Kurul izni gerekmez"], "a": 2, "e": "İrtibat büroları tanıtım ve temsil amaçlıdır ve sadece müşteri emirlerini aracı kuruma iletebilir; büro sorumlusu için en az 2 yıllık ön lisans yeterlidir."}, {"q": "Şube veya irtibat bürosu açma izin başvuruları Kurul tarafından kaç iş günü içinde sonuçlandırılır?", "o": ["10", "15", "20", "30", "60"], "a": 3, "e": "Şube ve irtibat bürosu izin başvuruları Kurul tarafından 30 iş günü içinde sonuçlandırılır."}, {"q": "Aşağıdakilerden hangisi için aracı kurumlar dışarıdan hizmet alamaz?", "o": ["Temizlik", "Hukuk danışmanlığı", "İşlemlerin muhasebeleştirilmesi ve finansal raporlama", "Kargo", "Piyasa veri hizmeti"], "a": 2, "e": "Muhasebeleştirme ve finansal raporlama, iç denetim faaliyetleri, YK'ya özgü faaliyetler ve izne tabi hizmetlerin sunumu ile pazarlaması dışarıdan alınamaz."}, {"q": "Aracı kurumların dışarıdan hizmet alımına başladıklarında Kurula bildirim süresi nedir?", "o": ["Başlamayı izleyen 10 iş günü", "Başlamadan önce Kurul izni", "Başlamayı izleyen 30 gün", "Yıl sonunda toplu bildirim", "Bildirim gerekmez"], "a": 0, "e": "Hizmet alınmaya başlama tarihini takip eden on iş günü içinde Kurula bildirim yapılır; erken fesih halinde ise derhal bilgi verilir."}, {"q": "VII-128.10 sayılı Bilgi Sistemleri Tebliği uyarınca aracı kurumların sızma testi yaptırma sıklığı en az ne olmalıdır?", "o": ["Ayda bir", "Üç ayda bir", "Altı ayda bir", "Yılda bir", "İki yılda bir"], "a": 3, "e": "Bilgi Sistemleri Yönetimi Tebliği'ne göre yılda en az bir kez sızma testi yaptırılması zorunludur."}, {"q": "Aracı kurumlar bir mali yılda en fazla ne kadar bağış yapabilir?", "o": ["Ödenmiş sermayenin %1'i", "Net kârın %5'i", "Özsermayenin %1'i", "Bağış yasaktır", "Özsermayenin binde beşi"], "a": 4, "e": "Aracı kurumlar bir mali yılda özsermayelerinin binde beşini aşan miktarda bağış yapamaz."}, {"q": "Yatırım hizmetleri sunan bankalar Tebliğ'in yapılamayacak işler maddesinin hangi bentlerine tabidir?", "o": ["Tüm bentlere", "Yalnızca bağış sınırına", "Yatırımcının korunmasına yönelik (e), (f), (g), (h), (ı), (i) ve (j) bentlerine", "Yalnızca gayrimenkul yasağına", "Hiçbirine"], "a": 2, "e": "Bankalar yatırımcı korumasına yönelik getiri taahhüdü, yetkisiz tasarruf, fiktif hesap, vekaletname, iyi niyet ve aşırı işlem yasağı gibi bentlere tabidir."}, {"q": "Faaliyet izinlerinden kısmen feragat eden aracı kurum, iptal kararını izleyen ne kadar süre içinde aynı izin için yeniden başvuramaz?", "o": ["6 ay", "1 yıl", "2 yıl", "3 yıl", "5 yıl"], "a": 2, "e": "Kısmen feragat eden aracı kurumlar iptale ilişkin Kurul kararını izleyen 2 yıl içinde ilgili izin için yeniden başvuramaz."}, {"q": "Faaliyet izinlerinden tamamen feragat eden aracı kurumun ilan yükümlülüğüne ilişkin doğru ifade hangisidir?", "o": ["Yalnızca internet sitesinde ilan", "Tirajı en yüksek on gazeteden en az ikisinde, internet sitesinde ve en az 5 iş günü KAP'ta ilan", "Yalnızca TTSG'de ilan", "Tirajı en yüksek beş gazetenin tamamında ilan", "KAP'ta 1 gün ilan"], "a": 1, "e": "İlan metni tirajı en yüksek on gazeteden en az ikisinde, kendi internet sitesinde ve en az 5 iş günü KAP'ta yayımlanır."}, {"q": "2 yıl içinde faaliyetlerinin tamamı iki kez geçici olarak durdurulan bir aracı kurum hakkında üçüncü aykırılıkta Kurul ne yapar?", "o": ["Üçüncü kez geçici durdurma uygular", "İdari para cezası verir", "Faaliyet izinlerini iptal eder", "Yalnızca uyarır", "Teminat ister"], "a": 2, "e": "Bu durumdaki aracı kuruma tedbir üçüncü kez uygulanmaz, faaliyet izinleri iptal edilir."}, {"q": "Bir aracı kurumun alacaklılarının sayıca hangi orandan fazlasından ibraname alması halinde faaliyetleri sürekli olarak durdurulur?", "o": ["%5", "%10", "%20", "%25", "%50"], "a": 1, "e": "Taahhütlerin %10'undan veya alacaklıların sayı itibarıyla %10'undan fazlasından ibraname alınması halinde faaliyetler sürekli durdurulur ve yetki belgeleri iptal edilir."}, {"q": "Kurulun aracı kurumlardan istediği teminatlar olarak aşağıdakilerden hangisi kabul edilmez?", "o": ["Nakit", "Kamu borçlanma aracı", "Sermaye ilişkisi olmayan bankadan teminat mektubu", "Aracı kurumun kurucusu olduğu yatırım fonunun katılma payları", "4749 sayılı Kanun kapsamında ihraç edilen kira sertifikası"], "a": 3, "e": "Yatırım fonu katılma payları ancak aracı kurumun kurucusu olmadığı fonlara ait ise teminat olabilir."}, {"q": "Faaliyetleri geçici olarak durdurulduktan sonra yeniden faaliyete geçen aracı kurumun teminatı ne zaman serbest bırakılır?", "o": ["Faaliyete geçtiği gün", "Faaliyete geçtikten 3 ay sonra", "En az 1 yıl kesintisiz faaliyetten sonra", "2 yıl sonra", "Hiçbir zaman"], "a": 2, "e": "Yeniden faaliyete geçen aracı kurumun teminatları, en az 1 yıl kesintisiz faaliyet şartıyla Kurulun bildirimi üzerine Takasbank tarafından serbest bırakılır."}]}, {"id": 7, "kisa": "Belge Kayıt, Uzaktan Kimlik", "baslik": "III-45.1 Belge ve Kayıt Düzeni Tebliği ile III-42.1 Uzaktan Kimlik Tespiti Tebliği", "ozet": "Yatırım kuruluşlarının düzenleyeceği belgeler, emir formları, işlem sonuç formu ve hesap ekstresi, saklama süreleri, kimlik doğrulama; uzaktan kimlik tespiti süreci ve elektronik ortamda sözleşme kurulması.", "notlar": "<h3>Belge ve Kayıt Tebliği: genel esaslar<\/h3><ul><li>III-45.1 sayılı Tebliğ <b>01.08.2015<\/b> tarih ve 29432 sayılı Resmi Gazete'de yayımlandı; dayanağı SPKn m.45. Tebliğde <b>muhasebeleştirmeye ilişkin hüküm yoktur<\/b>.<\/li><li>Yatırım kuruluşları form ve belgeleri eksiksiz düzenler ve saklar. Muhasebe kayıtları yasal defterlere: takası <b>merkezi takas kuruluşunda<\/b> yapılan işlemler için <b>takas süresini izleyen ilk iş günü<\/b>, diğer işlemler için <b>işlem gününü izleyen ilk iş günü<\/b> içinde işlenir (m.4).<\/li><li>Kayıtlar merkezde veya şubede tutulabilir; hesapların işleyişinde <b>Seri XI No 7<\/b> Tebliğindeki <b>Aracı Kurum Hesap Planı<\/b> esas alınır.<\/li><li>Bankalar yatırım hizmetleri ve yan hizmetlerle sınırlı olarak bu Tebliğe uyar (m.31).<\/li><\/ul><h3>Çerçeve sözleşme ve müşteri numarası (m.5)<\/h3><ul><li>İşleme başlamadan önce Yatırım Kuruluşları Tebliği uyarınca sözleşme yapılır ve <b>müşteriyi tanıma<\/b> kuralları uygulanır. Sözleşme <b>en az bir nüsha<\/b>; imzalı ve kaşeli suret müşteriye verilir.<\/li><li>Elektronik ortamda kurulan sözleşmelerde III-42.1 m.13 uygulanır; <b>kaşe ve imzalı suret gerekmez<\/b>, ancak suret müşteriye verilir, beyan ettiği e-postaya gönderilir veya elektronik erişimi sağlanır.<\/li><li>Sözleşmenin sonradan elektronik ortamda değiştirilebilmesi için önce müşterinin buna <b>onay vermiş<\/b> olması; ayrıca <b>elektronik imza<\/b> kullanılması veya kuruluşun atadığı <b>şifre<\/b> ile erişim ve müşterinin değişiklikleri okuyup anladığına dair elektronik onayı gerekir.<\/li><li>Her müşteriye ayrı müşteri numarası; onayıyla birden fazla hesap. <b>Halka arzda talepte bulunanlara hesap açılması zorunlu değildir.<\/b><\/li><li>Adres, isim veya unvan değişiklikleri öğrenilince <b>derhal<\/b> takas-saklama kuruluşuna/MKK'ya bildirilir. Numaralar sözleşme bitiminden itibaren <b>10 yıl<\/b> başkasına verilmez.<\/li><\/ul><h3>Kimlik doğrulama ve işlem güvenliği (m.5/A)<\/h3><ul><li>Elektronik ortamdaki hizmetlerde <b>birbirinden bağımsız en az iki bileşenli<\/b> kimlik doğrulama. Bileşenler müşterinin “<b>bildiği<\/b>”, “<b>sahip olduğu<\/b>” veya “<b>biyometrik<\/b> karakteristiği olan” sınıflarından <b>farklı ikisine<\/b> ait olur. Bağımsızlık: birinin ele geçirilmesi diğerini tehlikeye atmaz. Sahip olunan bileşen müşteriye özgü ve taklit edilemez olmalı.<\/li><li>Müşteriye atanmış <b>şifreleme gizli anahtarıyla<\/b> imzalanan <b>tek kullanımlık doğrulama kodu<\/b> üretilir; koddan kimlik unsurları öğrenilemez, başka kod türetilemez, taklit edilemez. Bu mümkün değilse kod <b>SMS<\/b> ile iletilebilir.<\/li><li>Mobil uygulama <b>pini<\/b> veya <b>biyometrik<\/b> bileşenle müşteriye özgü şifreleme anahtarına erişilip müşteriye özgü bilginin çevrim içi doğrulanması iki bileşenli doğrulama sayılır.<\/li><li>Mekanizma: başarısız deneme belirli sayıyı aşınca <b>erişimi engeller<\/b>; hatalı girişte kullanıcı adının mı parolanın mı yanlış olduğunu <b>söylemez<\/b>; hareketsiz oturumu belirli süre sonra sonlandırır/kilitler; bilgi güvenliği sorumlusunun onayı olmadıkça aynı müşteri için <b>eşzamanlı birden fazla oturuma<\/b> izin vermez ve uyarı verir.<\/li><\/ul><h3>Risk bildirimi ve belgeler (m.6–7)<\/h3><ul><li>Genel risk bildirim formu, ilave açıklamalar, değişiklik bildirimleri, müşteriden beyan alınması ve <b>müşteri sınıflandırma<\/b> bilgilendirmesi elektronik ortamda yapılabilir.<\/li><li>Düzenlenecek belgeler: (a) <b>Nakit Alındı / Nakit Ödendi Belgesi<\/b>, (b) <b>Müşteri Emir Formu<\/b>, (c) <b>Türev Piyasalar Emir Takip Formu<\/b>, (ç) <b>Seans Takip Formu<\/b>, (d) <b>İşlem Sonuç Formu<\/b>, Türev Araç İşlem Sonuç Formu ve Kaldıraçlı Alım Satım İşlemleri İşlem Sonuç Formu, (e) <b>İşlem Talimat Formu<\/b>, (f) <b>Türev Piyasalar Teminat Durum Raporu<\/b>, (g) <b>Türev Piyasalar Pozisyon Limit Aşımı Raporu<\/b>, (ğ) <b>Hesap Ekstresi<\/b> (aylık).<\/li><li>Emir iletimi kapsamındaki <b>gişe hizmetinde<\/b>: müşteri emir formu ve işlemin niteliğine göre nakit alındı/ödendi belgesi.<\/li><li><b>Tezgahüstü<\/b> işlemlerde müşteri emir formu yerine <b>işlem talimat formu<\/b> ve aylık hesap ekstresi düzenlenir.<\/li><\/ul><h3>Müşteri emirleri (m.8–14)<\/h3><ul><li>Emir <b>yazılı veya sözlü<\/b> alınabilir. Telefon, faks, ATM, elektronik ortam gibi imzasız yollarla alınanlar genel hükümler açısından <b>sözlü emir<\/b> niteliğindedir.<\/li><li>Saklanacak kayıtlar: telefon <b>ses kayıtları<\/b>; faks talimatı ve günlük faksların tarih-zaman dökümü; elektronik emirlerde tarih, zaman ve müşteri bazında <b>IP numaraları<\/b> ve emrin kaynağını gösteren <b>log<\/b> kayıtları. Bunlar hem emir iletimine aracı hem lehine faaliyet gösterilen kuruluşça tutulur.<\/li><li>Dikkat – ispat yükü: <b>sözlü emrin varlığını<\/b> ispat yatırım kuruluşuna aittir; emir verdiği halde işlem yapılmadığını iddia eden <b>müşteri<\/b> emri verdiğini ispatla yükümlüdür.<\/li><li>Nakit tahsilatta Nakit Alındı, ödemede Nakit Ödendi Belgesi; <b>müteselsil<\/b> numaralı, en az bir örnek, müşteriye imzalatılır ve imzalı örnek müşteriye verilir.<\/li><li>Emir formu, emrin borsaya iletildiği <b>kanal bazında müteselsil<\/b> numarayla serbestçe düzenlenir. Yazılı emirde elektronik formun çıktısı müşteriye imzalatılır, talep halinde imzalı örnek verilir; sözlü emirde imza aranmaksızın elektronik form düzenlenir.<\/li><li>Formda tarih ve <b>asgari saniye<\/b> bazında zaman damgası; faksta göndericinin numarası, tarih ve zaman. Müşteri talep ederse <b>emir alınış numarası<\/b> verilir.<\/li><li>Tüm emirler kanal bazında zaman önceliğine göre otomatik olarak <b>Seans Takip Formuna<\/b> (Ek 1), türevler <b>Türev Piyasalar Emir Takip Formuna<\/b> (Ek 2) aktarılır. Zaman önceliği için sıralama altyapısı zorunlu. <b>Piyasa yapıcı kotasyon emirlerine<\/b> uygulanmaz; kuruluşun kendi işlemlerinde de uyulur.<\/li><li>Emrin hangi kanalla borsaya iletileceğine ilişkin iş akış prosedürünün ilgili bölümü <b>internet sitesinde<\/b> yer alır.<\/li><\/ul><table><tr><th>Form<\/th><th>Öne çıkan asgari bilgiler<\/th><\/tr><tr><td>Müşteri emir formu (m.10; türev ve kaldıraçlı hariç, iptal-değiştirilenler dahil)<\/td><td>Müşteri/hesap no, müşteri ve vekil adı, sıra no, araç, emir tipi, iletilme şekli, alım/satım, fiyat, miktar/nominal, alınış ve iletiliş tarih-zamanı, seans ve geçerlilik, görevlinin adı ve imzası, iletilen kuruluş, borsa-pazar-takas kurumu, para birimi<\/td><\/tr><tr><td>Türev emir formu (m.11)<\/td><td>Ayrıca sözleşme adı/işlem kodu, <b>sözleşme adedi<\/b>, <b>hesap tipi<\/b> (müşteri, global hesap vb.)<\/td><\/tr><tr><td>İşlem talimat formu (m.12; kaldıraçlı hariç tezgahüstü)<\/td><td>Dayanak varlığa göre fiyat/değer/gösterge, <b>vade günü<\/b> (takas, bildirim tarihi-saati), varsa <b>prim ve kullanım fiyatı<\/b>, başlangıçtaki <b>teminat<\/b><\/td><\/tr><tr><td>Kaldıraçlı emir formu (m.13)<\/td><td>Kabul edilmeyen ve gerçekleşmeyenler dahil tüm emirler: hesap no, varlık, emir tipi, iletilme şekli, alım/satım, fiyat ve miktar, tarih-zaman<\/td><\/tr><\/table><ul><li>Talimat alma ile işlemin sonuçlanmasının eş anlı olduğu hallerde işlem talimat formu ile işlem sonuç formu <b>tek form<\/b> olarak düzenlenebilir.<\/li><li>Kuruluş karşı tarafsa çıkar çatışması konusunda bilgilendirir; teminat tamamlama yükümlülüğü varsa uygulamaya ilişkin yazılı açıklama yapılır (çerçeve sözleşmede hüküm varsa gerekmez).<\/li><\/ul><h3>İşlem sonuç formu ve bildirimler (m.15–19)<\/h3><ul><li>İşlem Sonuç Formu (Ek 3), Türev Araçlar İşlem Sonuç Formu (Ek 4), Kaldıraçlı Alım Satım İşlemleri İşlem Sonuç Formu (Ek 5) <b>müteselsil<\/b> numaralı ve elektronik tutulur.<\/li><li>Gerçekleşen işlemler müşteriye <b>en geç gün sonunda<\/b>, sözleşmedeki şekilde bildirilir; form elektronik ortamda veya posta ile gönderilir ya da elektronik erişim sağlanır. Gönderildiğinin ispat yükü kuruluştadır.<\/li><li><b>Hesap ekstresi<\/b> (m.17): <b>aylık<\/b> dönemler itibarıyla, ilgili dönemi izleyen <b>5 iş günü<\/b> içinde müşterinin adresine; müşterinin talebiyle e-postaya veya elektronik erişimle. İçerik: alınan-satılan araçların adı, tarih, zaman, fiyat, miktar; nakit ve varlık hareketleri; komisyon, ücret ve vergiler.<\/li><li>Dönem içinde <b>işlem yapmayan<\/b> müşteriye ekstre gönderilmeyebilir; münhasır sözleşme veya çerçeve sözleşme hükmüyle <b>profesyonel müşterilere<\/b> gönderilmeyebilir.<\/li><li>Dikkat: ekstredeki bilgilerin <b>belirli süre sonra kabul edilmiş sayılacağına<\/b> dair sorumsuzluk kayıtları sözleşmelere konamaz; konursa <b>hükümsüzdür<\/b>.<\/li><li>Yurt dışı işlemlerde aylık ekstre yurt içi kuruluşça gönderilir veya lehine faaliyet gösterilen kuruluşça gönderilmesi sağlanır; hesap açılış belgelerinin örnekleri emri ileten kuruluşta saklanır.<\/li><li><b>Kaldıraçlı<\/b> (m.18): <b>günlük<\/b> işlem sonuç formu ve aylık ekstre; ekstrede pozisyonlar, kapatılan pozisyonlarda kesin kâr-zarar, açık pozisyonlarda mevcut kâr-zarar, varlık hareketleri, komisyon-vergiler, teminat durumu. İşlem sonuç formu <b>en geç işlemi izleyen iş günü<\/b> içinde iletilir.<\/li><li><b>Türev<\/b> (m.19): günlük bildirim ve aylık ekstre. <b>Türev Piyasalar Teminat Durumu Raporu<\/b> (Ek 6) ve <b>Pozisyon Limit Aşımı Raporu<\/b> (Ek 7) açık pozisyon taşınan <b>her gün sonu<\/b> itibarıyla düzenlenir. Teminat raporunda takas kurumunun istediği nakit teminat esas alınır; TL ve konvertibl döviz dışındaki teminatlar takas kurumunun oranlarıyla nakde çevrilir; takas kurumunca kabul edilmeyenler hesaba katılmaz. Pozisyon limit raporu <b>global hesap müşterileri hariç<\/b> her hesap için ayrı hazırlanır ve borsa limitlerine göre değerlendirme yapılır.<\/li><\/ul><h3>Belgelerin saklanması (m.20–31)<\/h3><ul><li>Tüm belgeler, gerçekleşsin gerçekleşmesin tüm emir formları, elektronik emirler, faks ve ses kayıtları ile III-42.1 kapsamında uzaktan kimlik tespitinde alınan belgeler ve <b>video görüntüleri<\/b> dahil kayıtlar TTK m.82 uyarınca <b>10 yıl<\/b> saklanır.<\/li><li>Kopyalar TTK m.64 uyarınca yazılı, görsel veya elektronik ortamda saklanır; elektronik kayıtlar süre boyunca okunabilir olmalı.<\/li><li><b>İhtilaflı<\/b> belge ve kayıtlar 10 yılla sınırlı olmaksızın <b>ihtilaf sonuçlanıncaya kadar<\/b> saklanır.<\/li><li>Kayıtlarda <b>silinemez, değiştirilemez, tahrif edilemez<\/b> yapı; yazılı kayıtlarda silinti-kazıntı yok, düzeltmeler yanlış kaydı göstermeli, boş satır bırakılmaz.<\/li><li>Bilgi işlem altyapısındaki değişiklikler <b>kimin yaptığıyla<\/b> birlikte; güvenlik ihlalleri, hatalar ve iyileştirmeler kayıt altına alınır.<\/li><li>Anlık kaydı zorunlu fiyatlar ve teminat/pozisyon/kâr-zarar kayıtları için <b>dosya bütünlük değerleri günlük<\/b> periyotta <b>zaman damgasıyla<\/b> düzenlenir.<\/li><li>Yatırım danışmanlığında paylaşılan ve BPY kararlarının dayanağı olan bilgi, belge, araştırma ve raporlar saklanır (m.20).<\/li><li>Saklama hizmetinde YHT m.63 esasları; türev teminatlarının hareketleri izlenir, mutabakat sağlanır (m.21).<\/li><li>Türev ve kaldıraçlı işlemlerde açık pozisyon taşınan <b>her gün<\/b> itibarıyla <b>takas kurumu ile mutabakat<\/b> (m.22).<\/li><li>Kaldıraçlı müşteri kayıtları <b>anlık<\/b>: tüm işlemler, varlık giriş-çıkışları, kesin ve mevcut kâr-zarar, komisyon-vergi, teminat durumu; müşteriler bu bilgilere platformdan erişebilmeli (m.23).<\/li><li>Genel yatırım tavsiyesiyle paylaşılan bilgiler (m.24) ve kaldıraçlıda reklam, tanıtım, pazarlama, analiz desteği dahil yatırımcılarla <b>her türlü iletişim<\/b> (m.26) saklanır. Kredili alım, açığa satış ve ödünç işlemlerinde de belge-kayıt hükümlerine uyulur (m.25).<\/li><li><b>Şikayet kayıtları<\/b> (m.28): şikayetçinin adı, adresi, hesap no; tarih; özet ve aykırılık iddiası; varsa ilgili personel; kuruluşun işlemleri. Şikayet birimlerinin iletişim bilgileri müşteriye gönderilen belgelerde ve internet sitesinde yer alır.<\/li><li>Kurul, belirlediği piyasalardaki işlem, teminat ve pozisyon kayıtlarının SPKn m.87'deki <b>veri depolama kuruluşlarınca<\/b> merkezi izlenmesini isteyebilir (m.30).<\/li><\/ul><h3>III-42.1 Uzaktan Kimlik Tespiti Tebliği<\/h3><ul><li>Dayanak: <b>7247 sayılı Kanun<\/b> ile SPKn <b>m.42<\/b>'de yapılan değişiklik. Aracı kurumlar, <b>portföy yönetim şirketleri<\/b> ve <b>kripto varlık hizmet sağlayıcıları<\/b> uzaktan kimlik tespiti yapabilir; mesafeli olarak veya bilişim cihazı üzerinden yazılı şeklin yerine geçecek sözleşme kurabilir.<\/li><li>Uzaktan kimlik tespiti: personel ile kişinin fiziksel olarak aynı ortamda bulunmadan, <b>çevrim içi görüntülü görüşme<\/b> ile iletişim kurmasıyla yapılır. Yöntem <b>yüz yüze tespite benzer<\/b> ve asgari seviyede risk içerecek şekilde tasarlanır; belgeler, doğrulanabilir özellikleri ve doğrulama kriterleri için ayrıntılı dokümanlar oluşturulur.<\/li><li>Uzaktan kimlik tespiti <b>kritik işlem<\/b> sayılır: tek başına BT veya personel tarafından başlatılıp tamamlanamaz. Süreç <b>kişi tarafından başlatılır<\/b>, <b>BT kontrolleriyle devam eder<\/b>, <b>personel onayıyla tamamlanır<\/b>; riskli bulunursa <b>ikinci bir personele<\/b> onaya gönderilir veya sonlandırılır.<\/li><li>Sistemlerde III-39.1 m.50 ve VII-128.10 m.19 esaslarına uyulur. Uygulamadan önce iş akış prosedürü oluşturulur, etkinliği test edilip yazılı hale getirilir; başarısızsa süreç uygulanmaz.<\/li><li>Prosedür <b>yılda en az iki defa<\/b> gözden geçirilir; güvenlik ihlali, mevzuat değişikliği, dolandırıcılık bilgisi veya yöntem zayıflığında ayrıca güncellenir.<\/li><li>Personel: görüntülü görüşme <b>eğitimli personelce<\/b> yapılır; eğitim <b>yılda en az bir defa<\/b> ve her güncellemeden sonra (kişisel verilerin korunması dahil); belge güvenlik özellikleri ve dolandırıcılık konusunda eğitim; <b>erişimi sınırlandırılmış ayrı alanlarda<\/b> çalışma; kurum adına çalıştığını yansıtan ortam. <b>Engelli<\/b> kişiler için gerekli önlemler alınır.<\/li><li>Başlangıç: görüntülü görüşmeden önce başvuru kurumun uygulamasındaki elektronik formla alınır ve <b>risk değerlendirmesi<\/b> yapılır. Özel nitelikli kişisel verilerden <b>yalnızca biyometrik veri<\/b> kullanılabilir ve <b>açık rıza<\/b> elektronik ortamda kayda alınır. Görevin önceden tahmin edilebilir şekilde belirli personele atanmasını önleyen mekanizmalar; asgari sorular belirlenir, sıra ve türü <b>değişkenlik<\/b> gösterir.<\/li><li>Görüşme <b>gerçek zamanlı ve kesintisiz<\/b>, <b>uçtan uca güvenli<\/b>; görüntü kalitesi belgeyi <b>beyaz ışık altında<\/b> doğrulamaya yeterli olmalı. Yalnızca o işlem için geçerli, merkezi üretilen <b>SMS OTP<\/b> gönderilir; uygulama ara yüzünden geri girilmesiyle <b>cep telefonu numarası doğrulanır<\/b>.<\/li><li>Sürekli iş ilişkisinde suç gelirlerinin aklanmasının önlenmesine dair Yönetmeliğin m.18 ve m.20 tedbirleri ile MASAK Genel Tebliği (Sıra No 19) m.6 dikkate alınarak <b>risk temelli sıkılaştırılmış tedbirler<\/b> uygulanır; karmaşık ve olağandışı işlemlere özel dikkat gösterilir.<\/li><\/ul><h4>Yöntem ve doğrulama<\/h4><ul><li>Kimlik belgesi: beyaz ışıkta görülebilen güvenlik ögeleri, <b>fotoğraf ve imza<\/b> taşımalı.<\/li><li>Öncelikli yöntem: <b>yakın alan iletişimi (NFC)<\/b> ile belgenin yongasındaki bilgilerin doğrulanması: belgenin yetkili makamca verildiği ve yonga bilgilerinin değiştirilmediği, yonga anahtarlarının kopyalanmadığı kontrol edilir.<\/li><li>NFC doğrulaması yapılamazsa: görsel güvenlik unsurlarından seçilen <b>en az dört adedinin<\/b> şekil ve içerik bakımından doğrulanması. Dikkat: bu durumda sürekli iş ilişkisinden önce <b>ilk finansal hareketin<\/b> müşteriyi tanıma kurallarının uygulandığı <b>başka bir finansal kuruluş<\/b> üzerinden yapılması zorunludur.<\/li><li>Görsel doğrulamada kişiden belgeyi kameraya yatay/dikey eğmesi, sistemin rastgele belirlediği kısımlara <b>parmağını koyması<\/b> istenir; personel ön-arka yüz fotoğrafları veya ekran görüntüleri oluşturur ve tahrifat izi olmadığından emin olur.<\/li><li>Belge kontrolleri: karakterlerin yazı tipi, düzeni, aralığı; belgenin zarar görmemiş, sonradan fotoğraf yapıştırılmamış olması; geçerlilik süresinin standarda uygunluğu; <b>MRZ<\/b> bilgileriyle uyum; bilgilerin <b>Kimlik Paylaşımı Sistemi<\/b> ve diğer bilgilerle eşleşmesi; belgedeki <b>seri numarasının<\/b> görüşmede okutularak doğrulanması.<\/li><li><b>Canlılık tespiti<\/b> zorunlu; sahte yüz teknolojilerine karşı ilave tedbir. Yüz, NFC ile alınabiliyorsa yongadaki fotoğrafla, alınamıyorsa belge üzerindeki fotoğrafla <b>biyometrik karşılaştırılır<\/b>.<\/li><li>Personel kimlik avı, sosyal mühendislik ve baskı altında hareket gibi dolandırıcılıklara karşı fotoğraf-bilgi uyumundan ve beyan edilen niyetin inandırıcılığından emin olur. Süreç sonunda verilecek hizmetler belirtilir ve kişiden müşteri olacağına dair <b>sözlü onay<\/b> alınmasıyla tamamlanır.<\/li><li>Zayıf ışık, düşük görüntü kalitesi, sözlü iletişim kurulamaması, tutarsızlık veya belirsizlik, belge geçerliliği ya da dolandırıcılık şüphesinde süreç <b>sonlandırılır<\/b>.<\/li><li>Sürecin tamamı denetlenebilir şekilde kayda alınır; saklama Belge Kayıt Tebliğine göre.<\/li><li>Yanlış tespit riskini en aza indirme sorumluluğu kurumdadır; uzaktan tanınan kişiler <b>farklı risk profilinde<\/b> izlenir; itirazda <b>ispat yükü kurumdadır<\/b>. Kurul uzaktan kimlik tespitini kısıtlayabilir veya durdurabilir.<\/li><\/ul><h4>Kimlik tespitinden sonra sözleşme<\/h4><ul><li>Mesafeli sözleşmede müşterinin irade beyanı, Belge Kayıt Tebliği <b>m.5/A/1<\/b>'e uygun kimlik doğrulamadan sonra alınır. İrade beyanı uzaktan kimlik tespiti <b>görüşmesi sırasında<\/b> veya görüşme sonlanmadan alınırsa bu şart yerine getirilmiş sayılır; ayrıca doğrulama bilgisi istenmez.<\/li><li>Bilişim cihazı üzerinden yazılı şeklin yerine geçecek sözleşme için: (1) sözleşmenin tüm şartları okunabilir şekilde elektronik ortamda müşteriye iletilir; (2) sözleşme ve irade beyanı <b>müşteriye özgü şifreleme gizli anahtarıyla imzalanarak<\/b> kuruma iletilir; (3) müşteri yalnızca kendisine gösterilen bilgileri imzalar.<\/li><li>Bu şekilde kurulan teminat, kefalet, temlik dahil her türlü sözleşme <b>yazılı şekilde kurulmuş sayılır<\/b>; portföy yönetim şirketleri için de geçerlidir.<\/li><\/ul>", "sorular": [{"q": "Belge ve Kayıt Düzeni Tebliği'ne göre takası merkezi takas kuruluşunda yapılan sermaye piyasası aracı işlemlerinin muhasebe kayıtları yasal defterlere en geç ne zaman işlenmelidir?", "o": ["İşlem günü", "İşlem gününü izleyen ilk iş günü", "Takas süresini izleyen ilk iş günü", "Ay sonunda", "Takas süresini izleyen 5 iş günü"], "a": 2, "e": "Takası merkezi takas kuruluşunda yapılanlar takas süresini, diğerleri işlem gününü takip eden ilk iş günü içinde yasal defterlere işlenir."}, {"q": "Elektronik ortamda sunulan yatırım hizmetlerinde uygulanacak iki bileşenli kimlik doğrulamaya ilişkin hangisi doğrudur?", "o": ["İki bileşen aynı sınıftan seçilebilir", "Bileşenler bildiği, sahip olduğu veya biyometrik sınıflarından farklı ikisine ait olmalıdır", "Yalnızca parola yeterlidir", "Bileşenlerden biri ele geçirilirse diğeri de geçersiz olmalıdır", "SMS hiçbir şekilde kullanılamaz"], "a": 1, "e": "İki bileşen müşterinin bildiği, sahip olduğu veya biyometrik karakteristiği olan unsur sınıflarından farklı ikisine ait olmalı ve birbirinden bağımsız olmalıdır."}, {"q": "Kimlik doğrulama mekanizmasının yerine getirmesi gereken fonksiyonlar arasında aşağıdakilerden hangisi yoktur?", "o": ["Belirli sayıyı aşan başarısız denemelerde erişimi engellemek", "Hatalı girişte kullanıcı adının mı parolanın mı yanlış olduğunu belirtmemek", "Hareketsiz oturumu belirli süre sonra sonlandırmak", "Kural olarak aynı müşteri için eşzamanlı birden fazla oturuma izin vermemek", "Başarısız girişte doğru parolayı SMS ile müşteriye göndermek"], "a": 4, "e": "Doğru parolanın gönderilmesi gibi bir fonksiyon yoktur; diğerleri m.5/A'da sayılan zorunlu fonksiyonlardır."}, {"q": "Tezgahüstü piyasalarda (kaldıraçlı hariç) müşterilerle gerçekleştirilecek işlemlerde müşteri emir formu yerine hangi belge düzenlenir?", "o": ["Seans takip formu", "İşlem talimat formu", "Nakit alındı belgesi", "Pozisyon limit aşımı raporu", "Türev piyasalar emir takip formu"], "a": 1, "e": "Tezgahüstü işlemlerde müşteri emri formu yerine işlem talimat formu ve aylık hesap ekstresi düzenlenir."}, {"q": "Telefonla alınan bir müşteri emrine dayanılarak yapılan işlemde sözlü emrin varlığını ispat yükü kime aittir?", "o": ["Yatırım kuruluşuna", "Müşteriye", "Borsaya", "Takasbank'a", "Taraflar arasında eşit paylaşılır"], "a": 0, "e": "Sözlü emirlere dayanılarak yapılan işlemlerde sözlü emrin varlığını ispat yükü yatırım kuruluşuna aittir."}, {"q": "Emir verdiği halde işlem gerçekleştirilmediğini iddia eden müşteri için aşağıdakilerden hangisi doğrudur?", "o": ["İspat yükü yatırım kuruluşundadır", "Kurul re'sen inceleme yapar", "Ses kaydı yoksa müşteri haklı sayılır", "Müşteri emri verdiğini ispatla yükümlüdür", "Uyuşmazlık Birlik tarafından çözülür"], "a": 3, "e": "Alım veya satım emri vermesine rağmen işlem yapılmadığını iddia eden müşteri emri verdiğini ispatla yükümlüdür."}, {"q": "Müşteri emir formunda emrin alındığı zamanı gösteren damga en az hangi hassasiyette olmalıdır?", "o": ["Saniye", "Dakika", "Salise", "Saat", "Gün"], "a": 0, "e": "Emir formunda tarih ile asgari saniye bazında olmak üzere mümkün olan en küçük birimde zamanı gösteren ibare bulunmalıdır."}, {"q": "Seans öncesi ve seans sırasında alınan türev araç emirleri zaman önceliğine göre hangi forma aktarılır?", "o": ["Seans Takip Formu", "Türev Piyasalar Emir Takip Formu", "İşlem Talimat Formu", "Hesap Ekstresi", "Kaldıraçlı İşlem Sonuç Formu"], "a": 1, "e": "Türev araçlar için alınan emirler Ek 2'deki Türev Piyasalar Emir Takip Formuna kanal bazında zaman önceliğine göre aktarılır; diğer emirler Seans Takip Formuna."}, {"q": "Türev araç emir formunda standart emir formundan farklı olarak yer alması gereken bilgi aşağıdakilerden hangisidir?", "o": ["Müşteri numarası", "Emir tipi", "Hesap tipi (müşteri, global hesap vb.)", "Emrin alındığı tarih ve zaman", "Para birimi"], "a": 2, "e": "Türev emir formunda sözleşme adı/işlem kodu, sözleşme adedi ve hesap tipi gibi türeve özgü bilgiler yer alır."}, {"q": "Gerçekleşen işlemler müşteriye en geç ne zaman bildirilmelidir?", "o": ["İşlem anında", "Ertesi iş günü", "Hafta sonunda", "Ay sonunda", "En geç gün sonunda"], "a": 4, "e": "Gerçekleşen işlemler müşteriye en geç gün sonunda olmak üzere çerçeve sözleşmede belirtilen süre ve şekilde bildirilir."}, {"q": "Hesap ekstreleri müşterilere hangi sürede gönderilmelidir?", "o": ["Her işlem sonrasında", "Üç aylık dönemler itibarıyla, 10 iş günü içinde", "Yıllık olarak, yıl sonunu izleyen 1 ay içinde", "Müşteri talep ettiğinde", "Aylık dönemler itibarıyla, ilgili dönemi izleyen 5 iş günü içinde"], "a": 4, "e": "Hesap ekstresi aylık dönemler itibarıyla ilgili dönemi izleyen beş iş günü içinde gönderilir."}, {"q": "Hesap ekstresine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["İşlem yapmayan müşterilere gönderilmeyebilir", "Sözleşmeyle profesyonel müşterilere gönderilmeyebilir", "Gönderildiğinin ispat yükü kuruluştadır", "Belirli süre geçtikten sonra bilgilerin kabul edilmiş sayılacağına dair hüküm çerçeve sözleşmeye konabilir", "Komisyon, ücret ve vergilere yer verilir"], "a": 3, "e": "Ekstredeki bilgilerin belirli süre sonra kabul edilmiş sayılacağına ilişkin sorumsuzluk kayıtlarına yer verilemez; konursa hükümsüzdür."}, {"q": "Kaldıraçlı alım satım işlemlerinde işlem sonuç formu müşteriye en geç ne zaman iletilir?", "o": ["İşlem anında", "İşlemin yapıldığı günü izleyen iş günü içinde", "3 iş günü içinde", "Haftalık", "Aylık ekstreyle birlikte"], "a": 1, "e": "Aracı kurumlar en geç her işlemin yapıldığı günü izleyen iş günü içinde, önceki gün alınan tüm pozisyonları içeren işlem sonuç formunu iletir."}, {"q": "Türev Piyasalar Pozisyon Limit Aşımı Raporu hangi müşteriler için ayrı ayrı hazırlanmaz?", "o": ["Genel müşteriler", "Profesyonel müşteriler", "Global hesap müşterileri", "Tüzel kişi müşteriler", "Yurt dışı müşteriler"], "a": 2, "e": "Pozisyon Limit Aşımı Raporu, borsa mevzuatında tanımlanan global hesap müşterileri hariç her müşteri hesabı için ayrı hazırlanır."}, {"q": "Yatırım kuruluşlarının yatırım hizmetleriyle ilgili belgeleri ve uzaktan kimlik tespitine ilişkin video kayıtlarını saklama süresi nedir?", "o": ["5 yıl", "8 yıl", "10 yıl", "15 yıl", "20 yıl"], "a": 2, "e": "Belgeler ve uzaktan kimlik tespiti video görüntüleri dahil kayıtlar TTK m.82 uyarınca 10 yıl süreyle saklanır."}, {"q": "İhtilaflı belge ve kayıtların saklama süresi için aşağıdakilerden hangisi doğrudur?", "o": ["10 yıl sonunda imha edilir", "İhtilaf sonuçlanıncaya kadar saklanır", "5 yıl saklanır", "Kurula teslim edilir", "İhtilaf başlayınca saklama yükümlülüğü sona erer"], "a": 1, "e": "İhtilaflı belge ve kayıtlar 10 yıllık süreyle sınırlı olmaksızın ihtilaf sonuçlanıncaya kadar muhafaza edilir."}, {"q": "Türev araç işlemlerinde açık pozisyonların tutarı ve niteliği hakkında takas kurumu ile mutabakat hangi sıklıkta yapılır?", "o": ["Açık pozisyon taşınan her gün", "Haftalık", "Aylık", "Yıllık", "Pozisyon kapandığında"], "a": 0, "e": "Yatırım kuruluşları açık pozisyon taşıdıkları her gün itibarıyla takas kurumu ile mutabakata varmak zorundadır."}, {"q": "Uzaktan Kimlik Tespiti Tebliği (III-42.1) kapsamında uzaktan kimlik tespiti yapabilecek kuruluşlar arasında aşağıdakilerden hangisi sayılmamıştır?", "o": ["Aracı kurumlar", "Portföy yönetim şirketleri", "Kripto varlık hizmet sağlayıcıları", "Bağımsız denetim kuruluşları", "Bunların tamamı sayılmıştır"], "a": 3, "e": "Tebliğ aracı kurumlar, portföy yönetim şirketleri ve kripto varlık hizmet sağlayıcılarını kapsar; bağımsız denetim kuruluşları kapsamda değildir.", "k": 1}, {"q": "Uzaktan kimlik tespiti sürecinin işleyişine ilişkin doğru sıralama aşağıdakilerden hangisidir?", "o": ["Personel başlatır, BT onaylar, kişi tamamlar", "Kişi başlatır, BT kontrolleriyle devam eder, personel onayıyla tamamlanır", "BT başlatır ve tamamlar", "Personel başlatır ve tek başına tamamlar", "Kişi başlatır ve tamamlar"], "a": 1, "e": "Süreç kişi tarafından başlatılır, bilgi teknolojileri kontrolleriyle devam eder ve personel onayı ile ek kontrollerle tamamlanır.", "k": 1}, {"q": "Uzaktan kimlik tespiti iş akış prosedürü en az hangi sıklıkla gözden geçirilmelidir?", "o": ["Ayda bir", "Üç ayda bir", "Yılda en az iki defa", "Yılda bir", "İki yılda bir"], "a": 2, "e": "Uzaktan kimlik tespiti prosedürü yılda en az iki defa gözden geçirilir; ihlal veya mevzuat değişikliği gibi durumlarda ayrıca güncellenir."}, {"q": "Uzaktan kimlik tespitinde yakın alan iletişimi ile yonga doğrulaması yapılamazsa kimlik belgesinin görsel güvenlik unsurlarından en az kaç tanesi doğrulanmalıdır?", "o": ["İki", "Üç", "Dört", "Beş", "Altı"], "a": 2, "e": "NFC doğrulaması yapılamazsa görsel güvenlik unsurlarından seçilen en az dört adedinin şekil ve içerik bakımından doğrulanması gerekir."}, {"q": "Uzaktan kimlik tespiti yalnızca görsel güvenlik unsurlarının doğrulanmasıyla yapılmışsa sürekli iş ilişkisi kurulmadan önce aranan ilave şart nedir?", "o": ["Müşterinin şubeye gelmesi", "İlk finansal hareketin müşteriyi tanıma esaslarının uygulandığı başka bir finansal kuruluş üzerinden yapılması", "Noter onaylı vekaletname alınması", "Müşterinin profesyonel olması", "İkinci bir görüntülü görüşme yapılması"], "a": 1, "e": "Sadece görsel unsurlarla yapılan tespitte ilk finansal hareketin müşteri tanıma esaslarının uygulandığı başka bir finansal kuruluş üzerinden yapılması zorunludur."}, {"q": "Uzaktan kimlik tespiti sürecinde kişinin cep telefonu numarası nasıl doğrulanır?", "o": ["Müşterinin beyanıyla", "Operatörden yazı alınarak", "E-posta doğrulamasıyla", "Yalnızca o işlem için geçerli, merkezi üretilen SMS OTP'nin uygulama ara yüzünden geri gönderilmesiyle", "Görüntülü görüşmede numaranın sesli okunmasıyla"], "a": 3, "e": "Kişiye yalnızca o kimlik tespiti işlemi için geçerli, merkezi üretilen SMS OTP iletilir ve kişinin bunu çevrim içi geri göndermesiyle numara doğrulanır."}, {"q": "Uzaktan kimlik tespiti görüşmesi sırasında alınan mesafeli sözleşme irade beyanı için aşağıdakilerden hangisi doğrudur?", "o": ["Ayrıca iki bileşenli kimlik doğrulama yapılması zorunludur", "Belge Kayıt Tebliği m.5/A'daki kimlik doğrulama şartı yerine getirilmiş sayılır", "İrade beyanı geçersizdir", "Noter onayı gerekir", "Müşterinin şubeye gelmesi gerekir"], "a": 1, "e": "İrade beyanı uzaktan kimlik tespiti görüşmesi esnasında veya görüşme sonlanmadan alınırsa m.5/A/1'in gerekleri yerine getirilmiş sayılır ve ayrıca doğrulama bilgisi istenmez."}, {"q": "Uzaktan kimlik tespiti personeline ilişkin hangi ifade yanlıştır?", "o": ["Görüntülü görüşme eğitimli personelce yapılır", "Personel yılda en az bir defa eğitim alır", "Personel erişimi sınırlandırılmış ayrı alanlarda çalışır", "Riskli bulunan işlem ikinci bir personelin onayına gönderilebilir", "Personel görüşmeyi evinden kişisel cihazıyla yapabilir"], "a": 4, "e": "Personelin güvenlik zafiyetlerini önlemeye yönelik tedbirlerin alındığı, erişimi sınırlandırılmış ayrı alanlarda çalışması sağlanır."}]}, {"id": 8, "kisa": "Kredili, Açığa Satış, Ödünç", "baslik": "Seri V No 65 Tebliğ: Sermaye Piyasası Araçlarının Kredili Alımı, Açığa Satışı ve Ödünç Alma-Verme İşlemleri", "ozet": "Yetkili kuruluşlar, işlem listeleri, genel ve özel işlem sınırları, özkaynak oranları ve tamamlama, kredili alım ve açığa satış hesaplamaları, ödünç işlemleri, takas süresi teminatı ve temerrüt bildirimi.", "notlar": "<h3>Dayanak ve yetkili kuruluşlar<\/h3><ul><li>SPKn m.38: yatırım hizmetleriyle sınırlı kredi veya ödünç verilmesi bir <b>yan hizmettir<\/b>. SPKn m.39: Kurul ödünç ve açığa satış esaslarını belirler; kredili işlemlerde <b>Hazine ve Maliye Bakanlığı ile TCMB'nin görüşünü<\/b> alarak düzenleme yapar. SPKn geçici m.1 uyarınca Seri V No 65 Tebliğin Kanuna aykırı olmayan hükümleri uygulanır.<\/li><li>Aracı kurumların bu işlemleri yapabilmesi için <b>alım satıma aracılık yetkisi<\/b> yeterlidir; ayrıca izin gerekmez (<b>bildirime tabi<\/b>). Mekan, donanım, personel ve muhasebe şartlarını tevsik ederler; <b>30 iş günü<\/b> içinde aksi bildirilmezse işlemlere başlayabilirler (m.4).<\/li><li><b>Bankaların<\/b> müşterilere SPA alımı için özkaynak karşılığı açtığı krediler, aracı kurumlara özgü <b>genel ve özel işlem sınırları dışındaki<\/b> esaslara tabidir.<\/li><li>Ödünç alma-verme işlemlerini aracı kurumlar ve bankalara ek olarak <b>Takasbank<\/b> da izin almaksızın yapabilir. Takasbank piyasasının kuralları Takasbank yönetim kurulunun önerisi ve Kurul onayıyla yönetmelikle belirlenir; <b>Takasbank Ödünç Pay Piyasası<\/b>'nda merkezi karşı taraf uygulanır.<\/li><li>Dikkat: <b>DİBS piyasa yapıcısı olmayan<\/b> bankalar ve aracı kurumlar DİBS'leri yalnızca <b>ödünç verebilir<\/b>, ödünç <b>alamaz<\/b>.<\/li><\/ul><h3>Genel şartlar (m.5)<\/h3><ul><li>Gerekli teknik donanım; özkaynak oranlarının uygunluğu, müşteri risklerinin <b>günlük<\/b> takibi ve raporlanmasıyla görevli bir personel.<\/li><li>Genel müdüre raporlama için <b>yönetim kurulu kararıyla<\/b> sorumlu bir <b>genel müdür yardımcısı<\/b> (yoksa bir birim yöneticisi) atanır.<\/li><li><b>Kredi komitesi<\/b>: YK kararıyla, <b>sorumlu bir yönetim kurulu üyesinin başkanlığında<\/b>, genel müdür veya genel müdür yardımcısı ile ilgili birim yöneticilerinden oluşur; görev ve yetkileri iç kontrol prosedürlerinde belirlenir. Kararlar <b>noter onaylı karar defterine<\/b> tarih ve sıra numarasıyla kaydedilir.<\/li><\/ul><h3>İşleme konu olabilecek araçlar (m.6)<\/h3><ul><li>Kredili alım ve açığa satışa konu araçlar, ilgili borsanın yetkili organlarınca piyasa değeri, likidite, dolaşımdaki pay, işlem sıklığı gibi kriterlerle bir veya daha fazla gruba ayrılıp listelenir, <b>Kurula bildirilir<\/b> ve <b>Kurul onayından sonra<\/b> ilan edilir. Kurul bazı araçların listeden çıkarılmasını isteyebilir.<\/li><li>Borsa İstanbul listesi: <b>Alt Pazar, Yakın İzleme Pazarı (YİP) ve Piyasa Öncesi İşlem Platformu (PÖİP) hariç<\/b> pay piyasasındaki tüm paylar ve <b>BYF<\/b>'ler. Yani Yıldız Pazar, Ana Pazar, Girişim Sermayesi Pazarı payları ve BYF'ler hem kredili alıma hem açığa satışa konu olabilir.<\/li><li>Dikkat: <b>Varant, sertifika, sahipliğe dayalı kira sertifikası, GYF ve GSYF<\/b>'de kredili alım ve açığa satış <b>yapılamaz<\/b>. <b>Gayrimenkul sertifikasında<\/b> kredili alım <b>yapılabilir<\/b>, açığa satış <b>yapılamaz<\/b>.<\/li><li>Listeden çıkarılan araçlar tasfiye için <b>3 ayı geçmemek<\/b> üzere bir sonraki değişiklik dönemine kadar <b>geçici liste<\/b>ye alınır. Müşteri talebi ve aracı kurumun kabulüyle kredi listedeki başka bir araçla değiştirilerek sürdürülebilir.<\/li><li>İşlem sırası <b>sürekli kapatılan<\/b> paylar <b>hemen<\/b>; geçici durdurulan paylar kapalılık <b>5 iş gününden fazla<\/b> sürer ve Borsa yönetim kurulu devamına karar verirse listeden çıkarılır.<\/li><li>DİBS piyasa yapıcılarının ödünç işlemlerine konu araçlar Hazinenin belirlediği <b>ölçüt kağıtlardır<\/b>; diğer DİBS'ler Hazinenin görüşüyle Borsaca belirlenir.<\/li><li>Satış hasılatının <b>T+2 beklenmeden T veya T+1<\/b>'de müşteri hesabına aktarılması mümkündür; bunu yapacak aracı kurumlar Kurula bildirimde bulunur. Bu tutar <b>kredi<\/b> sayılır, genel ve özel işlem sınırlarında dikkate alınır; satışın <b>açığa satış niteliğinde olmaması<\/b> gerekir.<\/li><\/ul><h3>İşlem sınırları (m.7–8)<\/h3><table><tr><th>Sınır<\/th><th>Kural<\/th><\/tr><tr><td><b>Genel işlem sınırı<\/b><\/td><td>Belirli bir anda kullandırılan kredilerin toplamı ile müşteri ve/veya kendi hesabına açığa satılan hisselerin değeri, <b>her faaliyet için ayrı<\/b> hesaplanmak üzere, içinde bulunulan aydan önceki <b>3 ayın ay sonu özsermayelerinin ortalamasının 2 katını<\/b> geçemez. Son ayın özsermayesi ortalamadan düşükse <b>son ay<\/b> rakamı esas alınır.<\/td><\/tr><tr><td><b>Bir müşteriye kredi<\/b><\/td><td>Ortalama özsermayenin <b>%10<\/b>'unu aşamaz. Sürdürme özkaynak oranı işlem süresince <b>%50 ve üzerinde<\/b> uygulanırsa <b>iki katına<\/b> kadar artırılabilir (sermaye güçlendirme özel hükümlerinden yararlananlar hariç).<\/td><\/tr><tr><td><b>Tek şirket sınırı<\/b><\/td><td>Tüm müşteri hesaplarındaki kredili işleme konu hisselerin bir şirketçe ihraç edilen kısmının toplam değeri ortalama özsermayenin <b>%50<\/b>'sini aşamaz.<\/td><\/tr><\/table><ul><li>Genel sınırları Kurul <b>TCMB'nin görüşünü<\/b> alarak değiştirebilir; aracı kurumun mali yapısına göre düşürebilir veya işlemleri <b>yasaklayabilir<\/b>.<\/li><li>Bir müşteriye açılmış sayılan krediler: gerçek kişi ile <b>eşi ve velayeti altındaki çocukları<\/b>, bunların sınırsız sorumlu ortağı veya YK başkanı/üyesi, genel müdür/yardımcısı olduğu ortaklıklar; bu kişilerin veya bir tüzel kişinin doğrudan/dolaylı <b>%25 veya fazla<\/b> iştirak ettiği ortaklıklar; işlemlerde birlikte hareket edenler.<\/li><\/ul><h3>Kredi hesabı ve çerçeve sözleşme (m.10–11)<\/h3><ul><li>Kredili alım ve açığa satış yapacaklar adına <b>kredi hesabı<\/b> açılır; ikisi aynı anda varsa <b>her biri için ayrı hesap<\/b>. Kredi hesabı diğer hesaplardan ayrı işler.<\/li><li>Bu işlemlerden doğan özkaynak yükümlülükleri müşterinin diğer hesaplarındaki varlıklar teminat gösterilerek kapatılamaz; <b>grup şirketleri veya banka-aracı kurum<\/b> arasındaki varlıklar da teminat sayılmaz. İstisna: özkaynak açığı için hesaplar arası mahsuba dair <b>yazılı müşteri talimatı<\/b> varsa virman yapılabilir.<\/li><li>Üç ayrı çerçeve sözleşme: kredili alım, açığa satış, ödünç alma ve verme. Ayrı ayrı, tek sözleşmede bölümler hâlinde veya alım satım aracılığı sözleşmesinin eki olarak imzalanabilir.<\/li><li>Dikkat: bu sözleşmeler müteselsil sıra numaralı ve <b>en az iki nüsha<\/b> düzenlenir, biri müşteriye verilir. Emir ispatını müşteriye yükleyen ve tek taraflı olağanüstü haklar tanıyan hükümler konamaz; hüküm yoksa genel hükümler uygulanır.<\/li><\/ul><h3>Özkaynak olarak kabul edilen kıymetler (m.12)<\/h3><ul><li>Nakit <b>TL ve konvertibl döviz<\/b>; listedeki SPA; yatırım fonu payları; borsada işlem görmek kaydıyla devlet tahvili ve hazine bonosu; BYF payları; BİAŞ'ta işlem gören Hazine standardındaki altın ve kıymetli madenler; Kurulca uygun görülenler. Kriter: riski az ve kolayca nakde çevrilebilir olmaları.<\/li><\/ul><table><tr><th>Kıymet<\/th><th>Özkaynak hesabında kabul oranı<\/th><\/tr><tr><td>Nakit, devlet tahvili, hazine bonosu, BİAŞ'taki standart altın ve kıymetli madenler, Kurulca uygun görülenler<\/td><td>%100<\/td><\/tr><tr><td>Paylar<\/td><td>Borsa İstanbul düzenlemelerindeki oranlar<\/td><\/tr><tr><td>Borsa yatırım fonu payları<\/td><td>%90<\/td><\/tr><tr><td>Hisse senedi şemsiye fonu ve serbest şemsiye fonu payları<\/td><td><b>%75<\/b><\/td><\/tr><tr><td>Diğer yatırım fonu payları<\/td><td>%90<\/td><\/tr><\/table><ul><li>Sözleşmede hüküm varsa müşteri özkaynak kıymetlerini değiştirebilir.<\/li><li>Dikkat: <b>peşin alınan<\/b> SPA müşterinin <b>yazılı onayı olmadan<\/b> kredili ve açığa satış işlemlerinde özkaynak olarak kullanılamaz; <b>kredi ile alınan<\/b> SPA ise <b>hiçbir şekilde açığa satışta<\/b> özkaynak olamaz.<\/li><li>Aracı kurum müşterinin mali yapısı ve aracın riskine göre <b>daha yüksek<\/b> oran uygulayabilir; cari değerin tamamını veya bir yüzdesini kabul edebilir. Kurul oranı genel olarak (TCMB görüşüyle) veya aracı kurum, araç ya da pazar bazında değiştirebilir.<\/li><li>Borsa'nın özkaynak oranını <b>%0<\/b> belirlediği paylar ve brüt takasa tabi paylar dahil, payların satıldığı andan itibaren satış tutarı nakit değeri üzerinden özkaynağa dahil edilebilir; takas günü nakit bulundurma sorumluluğu kuruluş ve müşteridedir.<\/li><\/ul><h3>Değerleme (m.13)<\/h3><ul><li>Alım günü: <b>alış fiyatı ve komisyonlar<\/b>; takip eden günler: bir önceki seansın <b>ağırlıklı ortalama fiyatı<\/b>; işlem yoksa son seansın en iyi alış ve en iyi satış emirlerinin <b>aritmetik ortalaması<\/b>.<\/li><li>Yatırım fonu payları gün sonunda kurucunun açıkladığı <b>alış fiyatı<\/b>; konvertibl döviz borsa fiyatı, yoksa <b>TCMB döviz alış kuru<\/b>; DİBS sermaye yeterliliği değerleme ilkeleri.<\/li><li>İşlem sırası sürekli kapatılan veya geçici durdurulup kapalılığı <b>5 iş gününü aşan<\/b> ve Borsa YK'nın devam kararı verdiği hisseler <b>teminat niteliğini kaybeder<\/b>; yeni özkaynak olarak alınmaz, eskileri hesaba katılmaz.<\/li><\/ul><h3>Korunma ve halka arz yasağı (m.14–15)<\/h3><ul><li>İşlemlere konu kıymetler ve özkaynak olarak tevdi edilen nakit ve SPA <b>rehnedilemez<\/b>, amacı dışında kullanılamaz, üçüncü kişilere devredilemez.<\/li><li>SPKn m.46: teminatlar tevdi amacı dışında kullanılamaz, devredilemez, kamu alacağı için dahi <b>haczedilemez<\/b>, rehnedilemez, iflas masasına girmez, ihtiyati tedbir konamaz. İşleme konu kıymetler de aracı kurum için teminat niteliğinde olduğundan Tebliğ ile Kanun arasında çelişki yoktur.<\/li><li>Kurul kaydındaki SPA'nın halka arzına <b>aracılık yüklenimi<\/b> şeklinde aracılık eden aracı kurum, halka arz süresince o kıymetlerde <b>kredili işlem yapamaz<\/b>. Yasak kapsamı dışındaki konsorsiyum üyeleri halka arz süresince yaptıkları kredili alım verilerini satış sonuçlarıyla birlikte <b>6 iş günü<\/b> içinde Kurula bildirir.<\/li><li>Halka açılma amacıyla <b>borsada satış<\/b> yoluyla yapılan halka arzlarda aracı kurumlar o kıymetlerde <b>açığa satış<\/b> yapamaz. Fiyat istikrarı düzenlemeleri saklıdır.<\/li><\/ul><h3>Kredili alım (m.16–23)<\/h3><ul><li>Kredi kullanarak SPA alınması; emrin kredili olduğu <b>emir sırasında<\/b> bildirilmelidir.<\/li><li>Kredili olmayan alımda takas günü bedel ödenmezse işlem, ek bildirim gerekmeksizin <b>genel ve özel sınırlar açısından kredili<\/b> sayılır. Takas tarihini izleyen <b>3 iş günü<\/b> içinde: (a) kredili sözleşmesi olan müşterinin yazılı onayıyla veya olmayanla sözleşme yapılarak işlem kredili alım sayılır; ya da (b) alım satım sözleşmesinde hüküm varsa ve emrin yerine getirildiği bildirilmişse alınan kıymetlerin yükümlülüğe denk kısmı satılarak borç tahsil edilir; ya da (c) borsa düzenlemeleri veya genel hükümlerle temerrüt tasfiye edilir. Listede olmayan araçlarda (b) ve (c) uygulanır.<\/li><li><b>Özkaynak<\/b> = işleme konu kıymetlerin cari değeri + kâr payı, faiz vb. gelirler − kredi tutarı ve tahakkuk eden faiz.<\/li><li><b>Başlangıç özkaynak oranı en az %50<\/b>; işlem süresince <b>sürdürme oranı en az %35<\/b>.<\/li><li>Formül: <b>Özkaynak oranı = (cari piyasa değeri − kredi tutarı) / cari piyasa değeri<\/b>.<\/li><li>Müşteri zararı durdurmak için daha yüksek bir oranda <b>resen satış<\/b> emri uygulanmasını sözleşmeye koydurabilir.<\/li><\/ul><table><tr><th>Örnek<\/th><th>Hesap<\/th><\/tr><tr><td>5.000 TL nakdi olan müşterinin alabileceği azami kredi<\/td><td>Başlangıç %50 → kredi = 5.000 TL; toplam alım 10.000 TL<\/td><\/tr><tr><td>2 TL'den 5.000 adet alınan hisse 1,8 TL'ye düşerse<\/td><td>(9.000 − 5.000) / 9.000 ≈ 0,44<\/td><\/tr><tr><td>Hangi fiyatta oran %35 olur?<\/td><td>0,35 = (X − 5.000)/X → X = 7.692,31 TL → fiyat ≈ 1,5385 TL<\/td><\/tr><tr><td>Fiyat 1,5 TL olursa<\/td><td>(7.500 − 5.000)/7.500 ≈ 0,33 → %35'in altında, %50'ye tamamlama çağrısı<\/td><\/tr><\/table><ul><li><b>Özkaynak tamamlama<\/b> (m.18): özkaynak her iş günü hesaplanır ve raporlanır. Oran <b>%35'in altına<\/b> düşerse en seri iletişim aracıyla müşteriye oranı <b>%50'ye<\/b> çıkaracak tutar için bildirim yapılır ve teyit alınır. Bildirimden itibaren <b>2 iş gününü geçmeyecek<\/b> sözleşme süresinde tamamlanmazsa aracı kurum ihbara gerek olmadan kredili alınan ve/veya özkaynak SPA'yı satarak krediyi kapatabilir. Bildirim gününden tamamlanana kadar müşterinin <b>hiçbir alım emri<\/b> yerine getirilmez.<\/li><li>Örnek tablo: başlangıçta 10.000 değer, 5.000 kredi (%50); özkaynak kıymeti 2.000 düşünce %37 (bildirim yok); 3.000 düşünce %28 → 3.000 TL ek özkaynakla %50'ye dönülür.<\/li><li>Özkaynak, asgari oranı sağlayan tutarın üzerine çıkarsa fazlası nakit çekilebilir veya (aracı kurum kabul ederse) yeni kredili alımda özkaynak olarak kullanılabilir (m.19).<\/li><li>Haklar (m.20): faiz ve temettü <b>müşteriye<\/b> aittir, aksi hüküm yoksa aracı kurum tahsil eder; <b>oy hakkı müşterinin<\/b>; bedelsiz ve yeni pay alma haklarını müşteri hesabına <b>aracı kurum<\/b> kullanır.<\/li><li>Aracı kurumun kredi alması (m.21): bankalar, Takasbank, Kurulca uygun görülen kurumlar ve organize ödünç piyasalarından SPA teminatı karşılığında alabilir; ancak müşteri bazında kredi kuruluşunun istediğinden fazla SPA teminat verilemez, bir müşterinin teminatı başka müşterinin kredisi için kullanılamaz; kredi veren kurum bu SPA'yı satamaz, teminat gösteremez, ödünç veremez. Bankadan kredi kullandırılacaksa müşteriden varlıklarının gönderileceğine dair yetki alınır.<\/li><li>Muacceliyet (m.22): özkaynak tamamlama bildirimine rağmen <b>tamamlanmaması<\/b>; sözleşmedeki <b>kredi süresinin sona ermesi<\/b>; kıymetin <b>listeden çıkarılması<\/b>. Sözleşmede hüküm varsa özkaynak kıymetleri nakde çevrilerek tasfiye edilir veya aracı kurum hesabına geçirilir.<\/li><li>Saklama (m.23): kredili alınan veya özkaynak SPA aracı kurum adına ve müşteriler itibarıyla; bankadan kredi kullandırılıyorsa teminat SPA <b>kredi veren kuruluş adına<\/b> takas-saklama kuruluşunda saklanır. Rehin kararlaştırılmışsa takas-saklama kuruluşunda kurulur.<\/li><\/ul><h3>Açığa satış (m.24–30)<\/h3><ul><li><b>Tanım<\/b>: sahip olunmayan SPA'nın satılması, satış emri verilmesi veya takas yükümlülüğünün <b>ödünç alınan<\/b> SPA ile yerine getirilmesi. <b>Örtülü açığa satış<\/b>: ödünç alarak satış; <b>çıplak açığa satış<\/b>: sahip olunmayan araç için satış emri.<\/li><li>Satış emrinden önce satın alınmış veya bağlayıcı devir sözleşmesi yapılmış ama teslim edilmemiş araçlarda satıcı <b>sahip kabul edilir<\/b>.<\/li><li>Müşteri emrin açığa satış olduğunu emir sırasında <b>yazılı<\/b> bildirir; sözlü emirlerde iletişim aracına uygun bildirilir ve saklanır.<\/li><li>Satım anında araç hesapta yoksa veya ödünçle teslim edilecekse ek bildirim gerekmeden açığa satış sayılır. Ancak müşteri aracı takas tarihine kadar teslim edeceğini <b>beyan<\/b> ederse açığa satış sayılmaz; beyanın doğruluğundan müşteri, araştırılması ve belgelenmesinden aracı kurum sorumludur.<\/li><li>Takas süresinde teslim edilmezse temerrüt hükümleri uygulanarak <b>en geç takas tarihini izleyen 2 iş günü<\/b> içinde: sözleşmede hüküm ve bildirim varsa satış tutarıyla piyasadan alım yapılır veya borsa/genel hükümler uygulanır; ayrıca Borsaya bildirim yapılır.<\/li><li>Açığa satış sayılmayanlar: Hazinece yetkilendirilen <b>DİBS piyasa yapıcılarının<\/b> işlemleri; Borsa İstanbul'ca yetkilendirilen <b>piyasa yapıcıların<\/b> portföyünde karşılığı bulunmayan kotasyon satışlarını alıştan önce gerçekleştirmesi.<\/li><li>Özkaynak = işleme konu kıymetlerin cari değeri + açığa satış hasılatı. <b>Başlangıç %50<\/b>, <b>sürdürme %35<\/b>.<\/li><li>Formül: <b>Özkaynak oranı = (işleme konu kıymetlerin cari değeri − açığa satılan aracın piyasa değeri) / işleme konu kıymetlerin cari değeri<\/b>.<\/li><li>Örnek: 1.000 TL nakdi olan müşteri en fazla <b>1.000 TL<\/b> açığa satış yapabilir (0,50 = 1.000/(1.000+X) → X = 1.000). Satılan hissenin değeri 1.300'e çıkarsa: (2.000 − 1.300)/2.000 = <b>0,35<\/b>.<\/li><li>Tamamlama (m.26): her iş günü hesaplanır; %35 altına düşülürse <b>eksikliğin tespit edildiği gün<\/b> %50'ye tamamlama için <b>yazılı<\/b> bildirim; <b>2 iş günü<\/b> içinde tamamlanmazsa açığa satış hasılatı veya özkaynak SPA kullanılarak pozisyon kapatılabilir. Tablo örneği: 10 milyon değer, 5 milyon satış (%50); satılan değer 7 milyona çıkınca %30 → <b>4 milyon TL<\/b> ek özkaynakla %50.<\/li><li>Fazla özkaynak nakit çekilebilir veya yeni açığa satışta kullanılabilir (m.27).<\/li><li>Bildirim (m.28): müşterinin yazılı bildirdiği veya aracı kurumun tespit ettiği ya da kendi hesabına yaptığı açığa satışlarda aracı kurum emri Borsaya iletirken <b>açığa satış olduğunu açıkça belirtir<\/b>. Bildirilmeyen emirlerden doğan <b>cezai sorumluluk aracı kurumdadır<\/b>; müşteri ve aracı kurum kendi bildirim yükümlülüklerinden ayrı ayrı sorumludur.<\/li><li>Fiyat sınırı (m.29, yukarı adım kuralı): Borsa, açığa satışın ancak <b>son işlem fiyatından yüksek<\/b> fiyattan, son fiyat bir öncekinden yüksekse <b>son fiyattan<\/b> yapılmasına karar verebilir (aracı kurum, piyasa veya araç bazında) ve gerekçesiyle Kurula bildirir; Kurul da bu zorunluluğu resen getirebilir veya kaldırabilir.<\/li><li>Açığa satış yasağı (m.30): ihraççının <b>YK üyeleri, üst düzey personeli, %10 veya fazla paylı ortakları<\/b>, birlikte hareket edenler ve bunların <b>eş ve velayeti altındakiler<\/b> o ihraççının araçlarında açığa satış yapamaz.<\/li><\/ul><h3>Ödünç alma ve verme (m.31–34)<\/h3><ul><li>Ödünç: çerçeve sözleşme esaslarına göre ödünç verenin belirli bir dönem için SPA vermesi ve <b>aynı cins aracın mislen<\/b> geri alınması.<\/li><li>Aracı kurumlar kendi araçlarını ve yetki verilmişse müşterilerin araçlarını, <b>her ödünç verme işleminden önce<\/b> müşterinin yazılı veya iletişim aracıyla talimatını alarak ödünç verebilir.<\/li><li>Haklar (m.32): ödünç süresinde ödenen <b>temettü veya faiz<\/b> ödünç alan tarafından ödünç verene ödenir; bedelsiz ve yeni pay haklarında yükümlülükler sözleşmede <b>serbestçe<\/b> belirlenir. Fark “ödünç alınan menkul kıymetler izleme formu” ile izlenir.<\/li><li>Özkaynak (m.33): ödünç alan, ödünç alınan aracın cari değerinin <b>%100'ünden az olmamak<\/b> üzere serbestçe belirlenen özkaynak verir. DİBS piyasa yapıcılarında kabul edilecek kıymetleri <b>TCMB ve Hazinenin görüşüyle<\/b> Borsa belirler.<\/li><li>Fark aracı kurumca <b>günlük<\/b> izlenir; özkaynak %100'ün altına düşerse <b>aynı gün<\/b> en seri iletişimle yazılı bildirim; ödünç alan aracı kurum, veren kendi müşterisiyse bildirim gerekmeden aracı kurum tamamlar. Özkaynağın <b>bildirimin alındığı gün<\/b> tamamlanması esastır; tamamlanmazsa özkaynak ve/veya açığa satış özkaynağı kullanılarak yükümlülük yerine getirilir, negatif fark tazmin edilir.<\/li><li>Ödünç işlem gününde değerlemede yalnızca <b>bir önceki seansın ağırlıklı ortalama fiyatı<\/b> esas alınır.<\/li><li>Muacceliyet (m.34): özkaynak tamamlanmaması, <b>ödünç süresinin sona ermesi<\/b>, açığa satılan aracın <b>listeden çıkarılması<\/b>.<\/li><\/ul><h3>Takas süresi teminatı (m.9)<\/h3><ul><li>Takası gerçekleşmemiş pay alımlarından doğan açık takas pozisyonunun oranı Borsa İstanbul düzenlemeleriyle belirlenir; Kurul araç veya pazar bazında değiştirebilir; aracı kurum daha yüksek oran koyabilir.<\/li><\/ul><table><tr><th>Pazar<\/th><th>Açık takas pozisyonuna karşı asgari net varlık<\/th><\/tr><tr><td>Yıldız Pazar<\/td><td><b>%20<\/b><\/td><\/tr><tr><td>Ana Pazar<\/td><td><b>%50<\/b><\/td><\/tr><tr><td>Alt Pazar, YİP, PÖİP<\/td><td><b>%100<\/b><\/td><\/tr><\/table><ul><li>Yıldız Pazarda 20 TL varlıkla 100 TL alım yapılabilir; bir hissede günlük kayıp azami <b>%21<\/b> olabileceğinden %20'lik özkaynak bir günlük kaybı karşılayacak düzeydedir.<\/li><li>Hesaplamada önce aynı paydaki alım ve satımlar netleştirilir. Net varlık özkaynak sayılabilen kıymetlerden oluşur; takası yerine getirilmemiş ve başka işlemin teminatı olan kıymetler sayılmaz.<\/li><li>Oran sağlanamazsa oranı düşürecek emirler kabul edilmez; gün sonunda sağlanamazsa <b>ertesi gün ilk seansın başında<\/b> yeterli kıymet <b>resen satılır<\/b>.<\/li><li>Teminatsız alım emri (takas süresini aşmamak kaydıyla): müşterinin mali gücünün araştırılmış olması, ödeme gücünü gösteren belgelerle <b>kredi komitesinin olumlu görüşü<\/b> ve <b>yönetim kurulu kararıyla limit<\/b> tanınmış olması. Bu esaslar alım satım çerçeve sözleşmesinde yer alır.<\/li><\/ul><h3>Temerrüt bildirimi (m.35)<\/h3><ul><li><b>3 ay içinde ikiden fazla<\/b> nakit ve SPA takas yükümlülüğünü ve/veya özkaynak tamamlama yükümlülüğünü yerine getirmeyen müşteriler aracı kurumca <b>2 iş günü<\/b> içinde <b>Borsaya<\/b> bildirilir; kimlik bilgileri Borsaca ilan edilir.<\/li><li>Temerrüt tarihi itibarıyla Kurulca belirlenen tutarın altında kalanlar (<b>2026 için 403.359 TL<\/b>) veya müşterinin net varlığının <b>%5'ini<\/b> geçmeyen tutarlar bildirilmeyebilir.<\/li><li>İlan edilen müşterilerin, emre konu nakit veya kıymet hesapta yoksa veya peşin tevdi edilmemişse emirleri hiçbir aracı kurumca <b>6 ay<\/b> süreyle kabul edilmez. Bu kişiler (bildirimden önceki vekaletnameler hariç) yükümlülükleri sona erinceye kadar <b>vekaleten<\/b> başkalarının hesabında işlem yapamaz.<\/li><\/ul>", "sorular": [{"q": "Aracı kurumların kredili alım, açığa satış ve ödünç işlemlerine başlayabilmesi için aşağıdakilerden hangisi doğrudur?", "o": ["Kuruldan ayrı faaliyet izni almaları gerekir", "Birlik onayı yeterlidir", "TCMB izni gerekir", "Yalnızca geniş yetkili aracı kurumlar yapabilir", "Alım satım aracılığı yetkisi yeterlidir; şartları tevsik etmeleri halinde 30 iş günü içinde aksi bildirilmezse başlayabilirler"], "a": 4, "e": "Bu işlemler izne değil bildirime tabidir; alım satım aracılığı yetkisi olan aracı kurum şartları tevsik eder ve 30 iş günü içinde aksi bildirilmezse başlar."}, {"q": "DİBS piyasa yapıcısı olarak yetkilendirilmemiş bir aracı kurum DİBS'lerle ilgili hangi işlemi yapabilir?", "o": ["Hem ödünç alabilir hem ödünç verebilir", "Yalnızca ödünç alabilir", "Yalnızca ödünç verebilir", "Hiçbir ödünç işlemi yapamaz", "Yalnızca açığa satış yapabilir"], "a": 2, "e": "DİBS piyasa yapıcısı olmayan bankalar ve aracı kurumlar DİBS'leri yalnızca ödünç verebilir, ödünç alma işleminde bulunamaz."}, {"q": "Borsa İstanbul'da aşağıdaki pazarların hangisinde işlem gören paylar kredili alım ve açığa satış listesine dahil değildir?", "o": ["Yıldız Pazar", "Ana Pazar", "Girişim Sermayesi Pazarı", "Yakın İzleme Pazarı", "BYF'ler (pazar olarak)"], "a": 3, "e": "Liste Alt Pazar, Yakın İzleme Pazarı ve Piyasa Öncesi İşlem Platformu hariç tutularak belirlenmiştir."}, {"q": "Gayrimenkul sertifikaları için aşağıdakilerden hangisi doğrudur?", "o": ["Kredili alım yapılabilir, açığa satış yapılamaz", "Kredili alım ve açığa satış yapılabilir", "Açığa satış yapılabilir, kredili alım yapılamaz", "İkisi de yapılamaz", "Yalnızca ödünç verilebilir"], "a": 0, "e": "Gayrimenkul sertifikalarında kredili alım yapılabilmekle birlikte açığa satış yapılamaz; varant, sertifika, GYF ve GSYF'de ise ikisi de yapılamaz."}, {"q": "Bir aracı kurumun son üç ayın ay sonu özsermayeleri sırasıyla 100, 110 ve 120 milyon TL'dir. Kredili alım faaliyeti için genel işlem sınırı ne kadardır?", "o": ["110 milyon TL", "200 milyon TL", "220 milyon TL", "240 milyon TL", "330 milyon TL"], "a": 2, "e": "Ortalama özsermaye 110 milyon TL'dir; son ay ortalamadan düşük olmadığından ortalama esas alınır ve sınır 2 × 110 = 220 milyon TL olur."}, {"q": "Bir aracı kurumun son üç ay sonu özsermayeleri sırasıyla 120, 110 ve 85 milyon TL'dir. Genel işlem sınırı hesaplamasında hangi rakam esas alınır?", "o": ["105 milyon TL ortalama", "120 milyon TL en yüksek rakam", "110 milyon TL", "85 milyon TL son ay rakamı", "Üç rakamın toplamı"], "a": 3, "e": "Son ayın özsermayesi (85) üç aylık ortalamadan (105) düşük olduğundan limit hesaplamasında son ay rakamı esas alınır; sınır 170 milyon TL olur."}, {"q": "Aracı kurumların bir müşteriye açabilecekleri kredi tutarı, ortalama özsermayenin en fazla yüzde kaçı olabilir (artırım hükmü hariç)?", "o": ["%10", "%5", "%20", "%25", "%50"], "a": 0, "e": "Bir müşteriye açılacak kredi ortalama özsermayenin %10'unu aşamaz; sürdürme oranı %50 ve üzerinde uygulanırsa iki katına çıkabilir."}, {"q": "Aracı kurumun tüm müşteri hesaplarındaki kredili işleme konu hisselerden tek bir şirket tarafından ihraç edilenlerin toplam değeri ortalama özsermayenin en fazla yüzde kaçı olabilir?", "o": ["%10", "%20", "%25", "%50", "%100"], "a": 3, "e": "Tek bir şirketin ihraç ettiği kredili hisselerin toplam değeri aracı kurumun ortalama özsermayesinin %50'sini aşamaz."}, {"q": "Kredili alım, açığa satış ve ödünç çerçeve sözleşmelerine ilişkin aşağıdakilerden hangisi doğrudur?", "o": ["En az bir nüsha düzenlenir", "Sözlü olarak yapılabilir", "Kurul onayından sonra geçerli olur", "Yalnızca elektronik ortamda yapılabilir", "En az iki nüsha düzenlenir ve bir örneği müşteriye verilir"], "a": 4, "e": "Bu çerçeve sözleşmeler müteselsil sıra numaralı ve en az iki nüsha olarak düzenlenir ve bir örneği müşteriye verilir."}, {"q": "Kredili işlemlerde hisse senedi şemsiye fonu katılma payları özkaynak hesabında hangi oranda dikkate alınır?", "o": ["%100", "%90", "%75", "%50", "%0"], "a": 2, "e": "Hisse senedi şemsiye fonlara ve serbest şemsiye fonlara bağlı fon payları %75, BYF payları ve diğer fon payları %90, nakit ve DİBS %100 oranında kabul edilir."}, {"q": "Kredili alım ve açığa satış işlemlerinde özkaynak kullanımına ilişkin hangi ifade yanlıştır?", "o": ["Peşin alınan SPA müşterinin yazılı onayıyla özkaynak olarak kullanılabilir", "Kredi ile alınan SPA açığa satış işlemlerinde özkaynak olarak kullanılamaz", "Aracı kurum daha yüksek özkaynak oranı uygulayabilir", "Kredi ile alınan SPA müşterinin yazılı onayıyla açığa satışta özkaynak olarak kullanılabilir", "Kurul özkaynak oranını genel olarak değiştirirken TCMB'nin görüşünü alır"], "a": 3, "e": "Kredi ile alınan sermaye piyasası araçları her ne suretle olursa olsun açığa satış işlemlerinde özkaynak olarak kullanılamaz."}, {"q": "Kredili işleme konu bir hissenin alımının yapıldığı günü takip eden günlerde değerlemede esas alınan fiyat nedir?", "o": ["Kapanış fiyatı", "Bir önceki seansın ağırlıklı ortalama fiyatı", "Alış fiyatı ve komisyon", "Gün içi en düşük fiyat", "Taban fiyat"], "a": 1, "e": "Alım günü alış fiyatı ve komisyon, takip eden günlerde bir önceki seans ağırlıklı ortalama fiyatı, işlem yoksa en iyi alış ve satış fiyatlarının ortalaması kullanılır."}, {"q": "Aracılık yüklenimi şeklinde halka arza aracılık eden aracı kurum için hangi yasak geçerlidir?", "o": ["Halka arz süresince o kıymetlerle ilgili kredili işlem yapamaz", "Halka arzdan sonra 1 yıl kredili işlem yapamaz", "Hiçbir müşterisine kredi açamaz", "Yalnızca açığa satış yapabilir", "Herhangi bir yasak yoktur"], "a": 0, "e": "Aracılık yüklenimi yapan aracı kurumlar halka arz süresince bu menkul kıymetlerle ilgili kredili işlem yapamaz; yasak dışındaki konsorsiyum üyeleri verileri 6 iş günü içinde Kurula bildirir."}, {"q": "Kredili olmayan bir alımda müşteri takas günü bedeli ödemezse aracı kurum takas tarihini izleyen kaç iş günü içinde Tebliğde sayılan işlemlerden birini yapmak zorundadır?", "o": ["1", "2", "3", "5", "10"], "a": 2, "e": "Takas tarihini izleyen üç iş günü içinde işlem kredili alıma dönüştürülür, kıymet satılarak borç tahsil edilir veya temerrüt tasfiyesi başlatılır."}, {"q": "Kredili alımda başlangıç ve sürdürme özkaynak oranları aşağıdakilerden hangisinde doğru verilmiştir?", "o": ["%50 – %25", "%50 – %35", "%60 – %40", "%40 – %30", "%35 – %50"], "a": 1, "e": "Başlangıçta asgari %50 özkaynak yatırılır; işlem süresince özkaynak oranının asgari %35 olması zorunludur."}, {"q": "Bir yatırımcı 10.000 TL'lik hisseyi 5.000 TL özkaynak ve 5.000 TL kredi ile almıştır. Hisselerin değeri 8.000 TL'ye düşerse özkaynak oranı yaklaşık kaçtır ve tamamlama çağrısı gerekir mi?", "o": ["%62,5 – gerekmez", "%37,5 – gerekmez", "%37,5 – gerekir", "%30 – gerekir", "%25 – gerekir"], "a": 1, "e": "Oran = (8.000 − 5.000) / 8.000 = %37,5; sürdürme oranı %35'in üzerinde olduğundan çağrı gerekmez."}, {"q": "4.000 adet hisseyi 6.000 TL kredi kullanarak almış bir müşteride özkaynak oranının tam %35 olacağı hisse fiyatı yaklaşık kaçtır?", "o": ["1,95 TL", "2,10 TL", "2,31 TL", "2,50 TL", "3,00 TL"], "a": 2, "e": "0,35 = (X − 6.000)/X → 0,65X = 6.000 → X ≈ 9.230,77 TL; 9.230,77 / 4.000 ≈ 2,31 TL. Bu fiyatın altında özkaynak tamamlama çağrısı yapılır."}, {"q": "Kredili alımda özkaynak tamamlama bildirimine ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Özkaynak her iş günü hesaplanır", "Oran %35'in altına düşünce bildirim yapılır", "Tamamlama oranı %50'dir", "Bildirimden itibaren 2 iş gününü geçmeyecek süre verilir", "Bildirim süresince müşterinin alım emirleri yerine getirilmeye devam eder"], "a": 4, "e": "Özkaynak tamamlama bildirimi gönderilen müşterinin hiçbir alım emri, bildirim gününden özkaynak tamamlanıncaya kadar yerine getirilmez."}, {"q": "Kredili olarak alınan hisselerden doğan oy hakkı ve bedelsiz pay alma hakkı için aşağıdakilerden hangisi doğrudur?", "o": ["Oy hakkını ve bedelsiz hakkı aracı kurum kendi adına kullanır", "Oy hakkı aracı kuruma, temettü müşteriye aittir", "Tüm haklar kredi kapanana kadar askıya alınır", "Oy hakkı müşteriye aittir; bedelsiz ve yeni pay alma haklarını müşteri hesabına aracı kurum kullanır", "Haklar kredi veren bankaya geçer"], "a": 3, "e": "Faiz ve temettü gelirleri ile oy hakkı müşteriye aittir; bedelsiz ve yeni pay alma haklarını müşteri hesabına aracı kurum kullanır."}, {"q": "3.000 TL nakdi bulunan bir müşteri, başlangıç özkaynak oranı dikkate alındığında en fazla ne kadar açığa satış yapabilir?", "o": ["1.500 TL", "3.000 TL", "6.000 TL", "8.571 TL", "15.000 TL"], "a": 1, "e": "0,50 = 3.000/(3.000 + X) eşitliğinden X = 3.000 TL bulunur; başlangıç oranı %50 olduğundan özkaynak kadar açığa satış yapılabilir."}, {"q": "Açığa satış emrinin Borsaya bildirilmemesinden doğan cezai sorumluluk için aşağıdakilerden hangisi doğrudur?", "o": ["Yalnızca müşteriye aittir", "Borsaya aittir", "Takasbank'a aittir", "Sorumluluk doğmaz", "Müşterinin yazılı bildirdiği veya aracı kurumun tespit ettiği açığa satışı Borsaya bildirmeyen aracı kuruma aittir"], "a": 4, "e": "Müşterinin yazılı bildirdiği veya aracı kurumca açığa satış olduğu tespit edilen emirleri Borsaya bildirmeyen aracı kurum cezai olarak sorumludur."}, {"q": "Aşağıdakilerden hangisinin ilgili ihraççının sermaye piyasası araçlarında
