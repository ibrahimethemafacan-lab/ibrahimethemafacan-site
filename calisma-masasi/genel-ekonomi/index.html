karşılık oranı %2 olan tek bankalı bir sisteme 5.000 TL mevduat yatırılırsa yaratılabilecek kaydi para kaçtır?", "o": ["62.500 TL", "40.000 TL", "250.000 TL", "5.500 TL", "50.000 TL"], "a": 4, "e": "M = A × 1/(r + s) = 5.000 × 1/(0,08 + 0,02) = 50.000 TL."}, {"q": "Para çarpanı ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Para çarpanı 1'den büyüktür", "Zorunlu karşılık oranı artarsa para çarpanı azalır", "Reeskont faizinin artırılması para çarpanını artırır", "Nakit-mevduat oranı küçüldükçe para çarpanı büyür", "Formülü (1 + nakit/mevduat) / (zorunlu karşılık + nakit/mevduat) şeklindedir"], "a": 2, "e": "Reeskont faizi artınca bankalar serbest karşılık tutar, para çarpanı ve para arzı düşer; bu daraltıcı bir politikadır."}, {"q": "Krediyi parayla eşdeğer gören, para arzı yerine likidite arzı kavramını benimseyen ve en geniş para arzı tanımını yapan yaklaşım hangisidir?", "o": ["Radcliffe yaklaşımı", "Klasik yaklaşım", "Chicago yaklaşımı", "Gurley-Shaw yaklaşımı", "Cambridge yaklaşımı"], "a": 0, "e": "Radcliffe yaklaşımında para arzı, borç veren tüm kurumların verdiği kredi toplamına eşittir."}, {"q": "Türkiye'de kullanılan para arzı tanımlarına göre M2 nasıl bulunur?", "o": ["Dolaşımdaki para + vadesiz mevduat", "M1 + repo + para piyasası fonları", "M2 + ihraç edilen menkul kıymetler", "M1 + vadeli mevduat (TL ve YP)", "Emisyon + zorunlu karşılıklar"], "a": 3, "e": "M2 = M1 + vadeli mevduat (TL, YP). M3 ise M2'ye repo, para piyasası fonları ve ihraç edilen menkul kıymetlerin eklenmesiyle bulunur."}, {"q": "Repo işlemiyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Menkul kıymet işlem başında satılıp vade sonunda geri alınır", "Repo yapan taraf fon arz eden taraftır", "Repo yapan taraf menkul kıymeti satan taraftır", "Ters repoda menkul kıymet geri satma taahhüdüyle alınır", "Repo özü itibarıyla rehin sözleşmesine benzer"], "a": 1, "e": "Repo yapan, menkul kıymeti satarak fon temin eden, yani fon talep eden taraftır."}, {"q": "Nominal GSYH'nin 20 milyar TL, para miktarının 4 milyar TL olduğu bir ekonomide Fisher denklemine göre paranın dolaşım hızı kaçtır?", "o": ["0,2", "4", "16", "80", "5"], "a": 4, "e": "M × V = P × Y olduğundan V = P × Y / M = 20 / 4 = 5."}, {"q": "Cambridge denklemindeki k katsayısı ile ilgili hangisi doğrudur?", "o": ["Paranın dolaşım hızının kendisidir", "Faiz oranına sonsuz duyarlıdır", "Gelirin para olarak tutulmak istenen kısmıdır ve 1/V'ye eşittir", "Spekülasyon güdüsünü ölçer", "Para çarpanına eşittir"], "a": 2, "e": "Md = k × P × Y denkleminde k gelirin para olarak tutulan kısmıdır, kısa dönemde sabittir ve 1/V olarak da gösterilir."}, {"q": "Keynes'e göre yalnızca faiz oranının negatif bir fonksiyonu olan ve Klasik yaklaşımda yer almayan para talebi güdüsü hangisidir?", "o": ["Spekülasyon güdüsü", "İşlem güdüsü", "İhtiyat güdüsü", "Servet tutma güdüsü", "Sürekli gelir güdüsü"], "a": 0, "e": "Spekülasyon güdüsü yalnız faizin negatif fonksiyonudur ve Keynesyen yaklaşıma özgüdür."}, {"q": "Likidite tuzağı ile ilgili hangisi doğrudur?", "o": ["Marshall ve Pigou tarafından geliştirilmiştir", "Faiz en düşük seviyedeyken tahvil alımı artar", "Para politikası bu durumda tam etkindir", "Faiz en düşük seviyedeyken para talebi faize sonsuz esnektir ve LM yataydır", "LM eğrisi dikeydir"], "a": 3, "e": "Keynes'in likidite tuzağında faiz alt sınırdadır, herkes faizin yükseleceğini bekler, para talebi sonsuz esnektir ve tahvil alınmaz."}, {"q": "Friedman'ın modern miktar teorisine göre aşağıdakilerden hangisi yanlıştır?", "o": ["Para talebi sürekli gelirin fonksiyonudur", "Beşeri sermaye para talebini etkilemez", "Beklenen enflasyon para talebini etkiler", "Para ve reel aktifler ikame varlıklardır", "Faiz oranının para talebine etkisi çok azdır"], "a": 1, "e": "Friedman'a göre beşeri sermaye ne kadar yüksekse birey o kadar çok para tutmak ister; beşeri sermaye para talebini etkiler."}, {"q": "25 Nisan 2001 tarihli 1211 sayılı Kanun değişikliği sonrası TCMB'nin bağımsızlığı için hangisi doğrudur?", "o": ["Araç bağımsızlığı yoktur, yalnız yasal bağımsızlığı vardır", "Amaç bağımsızlığı vardır, araç bağımsızlığı yoktur", "Hiçbir bağımsızlığı yoktur", "Yalnız finansal bağımsızlığı vardır", "Araç bağımsızlığı vardır, temel amaç kanunla verildiği için amaç bağımsızlığı yoktur"], "a": 4, "e": "Temel amaç olan fiyat istikrarı kanunla verildiğinden amaç bağımsızlığı yoktur; araçları kendisi seçip kullandığından araç (fonksiyonel) bağımsızlığı vardır. (Kitabın para finansmanı bölümündeki 'bir anlamda amaç bağımsızlığına kavuştu' ifadesi gevşek bir kullanımdır; esas tanım bağımsızlık başlığındakidir.)"}, {"q": "Bretton Woods sistemiyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["1944 yılında kurulmuştur", "Toplantıya 44 ülke katılmıştır", "Sistem 1985 yılında sona ermiştir", "1 ons altın 35 dolara sabitlenmiştir", "IMF ve Dünya Bankası 1946'da faaliyete geçmiştir"], "a": 2, "e": "Bretton Woods sistemi ABD'nin büyük dış ticaret açığı nedeniyle 1971'de sona ermiştir."}, {"q": "Reel faizin %2, gerçekleşen enflasyonun %10, hedef enflasyonun %5 olduğu, hasılanın potansiyel düzeyde bulunduğu bir ekonomide α = 0,5 ise Taylor kuralına göre nominal politika faizi kaç olmalıdır?", "o": ["%14,5", "%12", "%17", "%9,5", "%7"], "a": 0, "e": "i = r + π + α(π - π*) + β(Y - Y*) = 2 + 10 + 0,5 × (10 - 5) + 0 = 14,5."}, {"q": "TCMB Kanunu m.42 kapsamında aşağıdakilerden hangisi doğru değildir?", "o": ["Başkan her yıl nisan ve ekim aylarında Cumhurbaşkanına rapor sunar", "Banka yılda iki defa TBMM Plan ve Bütçe Komisyonunu bilgilendirir", "Hedefe ulaşılamazsa nedenler ve önlemler Hükümete yazılı bildirilir ve kamuoyuna açıklanır", "Hedeften sapma yalnız Hükümete bildirilir, kamuoyuna açıklanmaz", "Hükümete yapılan bu yazılı bildirime açık mektup denir"], "a": 3, "e": "Hedefe ulaşılamaması halinde nedenler ve önlemler hem Hükümete yazılı bildirilir hem de kamuoyuna açıklanır."}, {"q": "TCMB'nin ihraç edebileceği likidite senetlerinin azami vadesi ne kadardır?", "o": ["30 gün", "91 gün", "60 gün", "180 gün", "1 yıl"], "a": 1, "e": "TCMB Kanunu m.52'ye göre TCMB kendi nam ve hesabına vadesi 91 günü geçmeyen likidite senetleri ihraç edebilir."}, {"q": "TCMB gösterge niteliğindeki döviz kurlarına ilişkin aşağıdakilerden hangisi yanlıştır?", "o": ["Her iş günü saat 15:30'da ilan edilir", "10:00-15:00 arasında her saat başı alınan 6 değerin ortalaması orta değeri verir", "Ertesi gün Resmi Gazete'de yayımlanır", "Resmi tatil ve hafta sonlarında belirlenmez", "Tüm gerçek ve tüzel kişiler arasındaki işlemlerde uygulanması zorunludur"], "a": 4, "e": "Gösterge kurlar kimseyi bağlamaz; TCMB dışındaki kişiler arasındaki işlemlerde hangi kurun uygulanacağına taraflar karar verir."}, {"q": "Aşağıdakilerden hangisi bir para politikası aracı değildir?", "o": ["Zorunlu karşılıklar", "Açık piyasa işlemleri", "İç borçlanma", "Reeskont oranı", "Selektif krediler"], "a": 2, "e": "Para politikası araçları zorunlu karşılıklar, selektif krediler, kredi tavanı ve tabanı, açık piyasa işlemleri ve reeskont oranıdır. İç borçlanma maliye politikası aracıdır."}, {"q": "TCMB'nin döviz alım ihaleleriyle piyasada oluşan TL likidite fazlasını TL depo alım ihaleleriyle çekmesine ne ad verilir?", "o": ["Sterilizasyon", "Parasal hedefleme", "Rezerv opsiyonu", "Para finansmanı", "Doğrudan alım"], "a": 0, "e": "Döviz müdahalesinin TL likiditesine etkisini açık piyasa işlemleriyle nötrlemeye sterilizasyon denir."}, {"q": "LM eğrisinin sağında kalan noktalar için hangisi doğrudur?", "o": ["Para arz fazlası vardır", "Mal talep fazlası vardır", "Mal arz fazlası vardır", "Para talep fazlası vardır", "Para piyasası dengededir"], "a": 3, "e": "LM'nin sağında veri gelir için faiz olması gerekenden düşüktür, para talebi para arzını aşar; solunda ise para arz fazlası vardır."}, {"q": "Aşağıdakilerden hangisi LM eğrisini sola kaydırır?", "o": ["Genişletici para politikası", "Para arzının azaltılması", "Kredi kartı kullanımının artması", "Servetin azalması", "Alternatif finansal araçların yaygınlaşması"], "a": 1, "e": "Para arzının azaltılması (daraltıcı para politikası) LM'yi sola kaydırır; diğerleri para talebini azaltarak veya arzı artırarak LM'yi sağa kaydırır."}, {"q": "Ekonomide bir sorunun ortaya çıkması ile politika yapıcıların bunu fark edip politika gereğine kanaat getirmesi arasındaki süre hangi gecikme türüdür?", "o": ["Karar gecikmesi", "Uygulama gecikmesi", "Etki gecikmesi", "Dışsal gecikme", "Tanı gecikmesi"], "a": 4, "e": "Sorunun fark edilmesine kadar geçen süre tanı gecikmesidir; tanı, karar ve uygulama içsel gecikmeler, etki gecikmesi dışsal gecikmedir."}]}, {"id": 4, "kisa": "Maliye Politikaları", "baslik": "Maliye Politikaları", "ozet": "Kamu giderleri ve gelirleri, vergi kavramları, bütçe ilkeleri, çarpanlar, IS eğrisi, IS-LM dengesi, dışlama etkisi ve iktisat okullarının görüşleri.", "notlar": "<h3>Maliye politikasının kapsamı<\/h3>\n<ul>\n<li><b>Maliye politikası:<\/b> ekonomik hedeflere ulaşmak için mali araçların (vergi, transfer, kamu mal-hizmet alımı) kullanılması. Etkisi milli gelir, işsizlik ve enflasyon gibi makro büyüklüklerde görülür.<\/li>\n<li>Kamunun rolü özellikle <b>piyasa başarısızlıklarında<\/b> öne çıkar.<\/li>\n<\/ul>\n<h3>Kamu giderleri<\/h3>\n<ul>\n<li>Sınıflandırma: <b>yönetsel<\/b> (harcamayı yapan kuruma göre), <b>işlevsel<\/b> (amaca göre), <b>ekonomik<\/b>.<\/li>\n<li><b>Ekonomik sınıflandırma:<\/b>\n<ul>\n<li><b>Cari harcamalar:<\/b> devletin işleyişi için; mal ve hizmet talebi yaratır; en büyük pay <b>personel ödemeleri<\/b>.<\/li>\n<li><b>Yatırım harcamaları:<\/b> alt ve üst yapı (baraj, okul, köprü).<\/li>\n<li><b>Transfer harcamaları:<\/b> yapıldıkları dönemde doğrudan mal-hizmet talebi yaratmaz; etki alanın davranışına bağlı. Türleri: kamu borç <b>faiz ödemeleri<\/b>, <b>mali transferler<\/b> (vergi muafiyeti, mali yardım; yatırımı özendirir), <b>sosyal yardımlar<\/b> (harcanabilir geliri artırır).<\/li>\n<\/ul><\/li>\n<li>Kamu harcamalarını etkileyenler: politika değişiklikleri, nüfus artışı, bilim-teknoloji, bütçe tekniklerindeki yenilikler.<\/li>\n<\/ul>\n\n<h3>Kamu gelirleri<\/h3>\n<ul>\n<li>Türleri: vergi, harç, şerefiye, resim, parafiskal gelirler, fon gelirleri, mali tekel, mülk ve teşebbüs gelirleri, senyoraj, bağış ve yardımlar, para ve vergi cezaları. Temel özellik <b>zorunluluk<\/b> (cebir); mülk-teşebbüs gelirleri ve gönüllü borçlanmada cebir yoktur.<\/li>\n<li><b>Borçlanma<\/b> kamu harcamalarının finansmanında kullanılan bir araçtır; kitap onu kamu geliri sayılmayan, sürekli değil <b>geçici<\/b> bir kaynak olarak niteler (borç çevrilerek ödeniyorsa süreklileşebilir). İç borçlanmada cebir olabilir, dış borçlanma isteğe bağlıdır.<\/li>\n<li><b>Borç vadeleri:<\/b> 1 yıldan az <b>kısa<\/b>, 1 yıldan çok <b>orta<\/b>, 5 yıldan fazla <b>uzun<\/b> vadeli. İç borçlanma devlet tahvili ve hazine bonosuyla yapılır.<\/li>\n<\/ul>\n<table>\n<tr><th>Gelir<\/th><th>Tanım / örnek<\/th><\/tr>\n<tr><td>Vergi<\/td><td>Kanuna dayanan, <b>karşılıksız ve zorunlu<\/b> ödeme; kamu gelirlerinin yarısından fazlası; mali güce göre alınır<\/td><\/tr>\n<tr><td>Harç<\/td><td>Kamu hizmetinden yararlananlardan alınan bedel (yargı, tapu, pasaport harcı)<\/td><\/tr>\n<tr><td>Şerefiye<\/td><td>Bayındırlık-imar hizmetiyle değeri artan gayrimenkul sahibinden alınan bedel; belediyelerde \"harcamalara katılma payı\"<\/td><\/tr>\n<tr><td>Resim<\/td><td>Bir işe izin/yetki verilmesi karşılığı; karşılığı olduğu ve mali güce göre alınmadığı için harca yakın; payı çok küçük (eğlence resmi bugün eğlence vergisi)<\/td><\/tr>\n<tr><td>Parafiskal gelir<\/td><td>Meslek odası aidatları, SGK aidatları; <b>bütçe dışıdır<\/b>, kurumun bütçesinde yer alır<\/td><\/tr>\n<tr><td>Fon geliri<\/td><td>Belli amaçla bütçe içi/dışı özel hesapta tutulan kaynak<\/td><\/tr>\n<tr><td>Mali tekel<\/td><td>Devletin tekelindeki malı maliyet üstü satması (eski Tekel); önemi azalmıştır<\/td><\/tr>\n<tr><td>Mülk ve teşebbüs<\/td><td>En eski gelirlerden; teşebbüs gelirinin payı mülk gelirinden yüksek; cebir unsuru yok<\/td><\/tr>\n<tr><td>Senyoraj<\/td><td>Para basmaktan gelir: basılan paranın değeri - basım maliyeti; enflasyon varsa para arzı artışının reel değeri<\/td><\/tr>\n<tr><td>Para ve vergi cezaları<\/td><td>Asıl amaç gelir değil, kurallara uyumu sağlamak<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Anayasa m.73:<\/b> herkes kamu giderlerini karşılamak üzere <b>mali gücüne göre<\/b> vergi ödemekle yükümlüdür; vergi, resim, harç ve benzeri yükümlülükler <b>kanunla<\/b> konulur, değiştirilir, kaldırılır (kanunilik).<\/li>\n<li>Verginin asli amacı <b>mali<\/b> amaçtır; mali olmayan amaçlar: gelirin yeniden dağılımı, ekonomik istikrar, büyüme ve kalkınma.<\/li>\n<\/ul>\n<h4>Laffer eğrisi ve Ricardocu denklik<\/h4>\n<ul>\n<li><b>Laffer eğrisi<\/b> (Arthur Laffer): vergi oranı ile vergi geliri arasında doğrusal ilişki yoktur; bir eşiğe kadar oran artışı geliri artırır, eşikten sonra azaltır. Ters çan biçimli; vergi gelirini maksimize eden <b>optimal oran<\/b> vardır. Düşük oranlarda gelir etkisi (daha çok çalışma) ikame etkisinden büyüktür; eşik aşılınca ikame etkisi (daha çok dinlenme) baskın gelir.<\/li>\n<li><b>Ricardocu denklik:<\/b> bugünkü vergi indirimi gelecekte vergi artışı demektir; rasyonel bireyler sürekli gelirleri değişmediği için tüketimi artırmaz, tasarruf eder. Maliye politikası reel ekonomiye karşı <b>nötrdür<\/b>.<\/li>\n<\/ul>\n<h4>Vergi kavramları<\/h4>\n<ul>\n<li><b>Adam Smith'in vergi ilkeleri:<\/b> <b>adalet<\/b> (mali güç oranında), <b>kesinlik<\/b> (miktar, zaman, biçim açık), <b>uygunluk<\/b> (en uygun zaman ve biçimde tahsil), <b>iktisadilik<\/b> (düşük toplama masrafı, ekonomiye az zarar).<\/li>\n<li><b>Verginin konusu:<\/b> üzerine vergi konulan ekonomik unsur (kurumlar vergisinin konusu kurum kazancı). <b>İstisna<\/b> konuyu, <b>muafiyet<\/b> kişiyi vergi dışı bırakır.<\/li>\n<li><b>Vergiyi doğuran olay:<\/b> konu ile mükellef arasında kanunun aradığı ilişkinin gerçekleşmesi (ithalat gibi maddi; sözleşme imzası gibi hukuki).<\/li>\n<li><b>Mükellef:<\/b> kanuna göre vergi borcu olan kişi. <b>Aracı mükellef<\/b> vergiyi fiyata yansıtıp başkasına ödetir; <b>fiili mükellef<\/b> yansıma sonucu vergiyi fiilen öder. KDV'de satıcı aracı, alıcı fiili mükelleftir.<\/li>\n<li><b>Yansıma:<\/b> <b>ileri<\/b> (fiyata yansıtma), <b>çapraz<\/b> (esnekliği düşük başka bir mala yansıtma), <b>geri<\/b> (hammadde, ücret gibi girdilere yansıtma).<\/li>\n<li><b>Vergi sorumlusu:<\/b> vergi dairesine karşı ödemeden sorumlu kişi (vergi kesenler dahil).<\/li>\n<li><b>Matrah:<\/b> vergi hesabının dayandığı değer veya miktar. Miktar esaslı = <b>spesifik<\/b>; değer esaslı = <b>ad valorem<\/b> (vergi adaletine daha uygun, uygulaması genişliyor).<\/li>\n<\/ul>\n<table>\n<tr><th>Sınıflandırma<\/th><th>Açıklama<\/th><\/tr>\n<tr><td>Objektif / Sübjektif<\/td><td>Objektif kişisel durumu dikkate almaz; sübjektif kişisel ve ailevi durumu dikkate alır. Bugün yarı-şahsi vergiler tercih edilir<\/td><\/tr>\n<tr><td>Nakdi / Ayni / Bedeni<\/td><td>Bugün hepsi nakdi; ayniye örnek Toprak Mahsulleri Vergisi; tek bedeni vergi köydeki <b>imece<\/b><\/td><\/tr>\n<tr><td>Dolaylı<\/td><td>KDV, ÖTV, BSMV, Şans Oyunları, Özel İletişim, Damga, Gümrük Vergisi; içinde en büyük pay <b>KDV<\/b><\/td><\/tr>\n<tr><td>Dolaysız<\/td><td>Gelir, Kurumlar, Veraset ve İntikal, Motorlu Taşıtlar, Emlak ve Çevre Temizlik; içinde en büyük pay <b>Gelir Vergisi<\/b><\/td><\/tr>\n<tr><td>Düz oranlı<\/td><td>Her matrahta aynı oran; Kurumlar Vergisi <b>%25<\/b> (31.12.2024 itibarıyla)<\/td><\/tr>\n<tr><td>Artan oranlı<\/td><td>Matrah arttıkça oran artar; genelde dolaysız vergilerde; Gelir Vergisi, Veraset ve İntikal Vergisi<\/td><\/tr>\n<tr><td>Azalan oranlı<\/td><td>Bugün kullanılmaz; adalet ilkesine aykırı<\/td><\/tr>\n<tr><td>Gelir / Harcama / Servet<\/td><td>Gelir: gelir ve kurumlar vergisi; harcama: KDV, ÖTV; servet: Emlak, Motorlu Taşıtlar<\/td><\/tr>\n<\/table>\n<ul>\n<li>Az gelişmiş ve gelişmekte olan ülkelerde (Türkiye dahil) <b>dolaylı vergilerin payı dolaysızlardan yüksektir<\/b>; bu vergi adaleti sorunudur.<\/li>\n<li><b>Vergi yükü<\/b> = ödenen vergi / gelir. <b>Vergi tazyiki<\/b> = verginin yarattığı psikolojik baskı.<\/li>\n<li><b>Gerçek vergi yükü<\/b> = [(ödenen vergi + yansıyan vergi) - (sağlanan fayda + yansıtılan vergi)] / gelir.<\/li>\n<li><b>Toplam vergi yükü<\/b> = toplam vergi hasılatı / GSMH.<\/li>\n<\/ul>\n\n<h3>Bütçe<\/h3>\n<ul>\n<li>Kamu kurumlarının belirli dönemdeki gelir ve giderlerinin tahmin edildiği ve izin verildiği belge; yürürlük süresi genellikle <b>bir yıl<\/b> olan bir kanun.<\/li>\n<\/ul>\n<table>\n<tr><th>Bütçe ilkesi<\/th><th>Anlamı<\/th><\/tr>\n<tr><td>Genellik<\/td><td>Tüm gelir ve giderler ayrı ayrı ve tam gösterilir; bir gelir belirli bir gidere tahsis edilmez<\/td><\/tr>\n<tr><td>Birlik<\/td><td>Tüm gelir ve giderler tek bütçede<\/td><\/tr>\n<tr><td>Yıllık olma<\/td><td>İzin genellikle bir yıllık<\/td><\/tr>\n<tr><td>Önceden izin alma<\/td><td>Yetki mali yıl başlamadan meclisçe yürütmeye verilir<\/td><\/tr>\n<tr><td>Alenilik<\/td><td>Belgeler gerçeği yansıtır ve kamuoyuna sunulur<\/td><\/tr>\n<tr><td>Anlaşılır olma<\/td><td>Herkesçe kolay anlaşılır<\/td><\/tr>\n<tr><td>Sübjektif doğruluk (samimiyet)<\/td><td>Tahmin yapanların dürüst olması<\/td><\/tr>\n<tr><td>Objektif doğruluk<\/td><td>Ekonomik koşullara uygun rasyonel tahmin<\/td><\/tr>\n<tr><td>Denklik<\/td><td>Gelir ve giderlerin denk olması<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Bütçe açığı nedenleri:<\/b> kamu harcamalarının hızlı artışı, kamu gelirlerinin yavaş artışı (kayıt dışılık, istisna ve muafiyetler), borçlanma döngüsü ve yüksek faiz.<\/li>\n<li>Finansman: para basma, iç borçlanma, dış borçlanma. Para basma kısa vadede en kolay yol görünse de <b>enflasyonun en önemli nedenlerinden<\/b> biridir. Durgunlukta bütçe açığı talep yaratmak için bilinçli kullanılabilir.<\/li>\n<li><b>Bütçe sistemleri:<\/b> geleneksel (kurum ihtiyacına göre, <b>girdi odaklı<\/b>); <b>performans<\/b> (eldeki kaynakla en yüksek çıktı; <b>Türkiye uygular<\/b>); program (hangi hizmetle en yüksek fayda); planlama-programlama-bütçeleme (fayda-maliyet analizi); <b>sıfır tabanlı<\/b> (geçmiş ödeneklere bakmadan, her yıl hizmet ilk kez yapılıyormuş gibi).<\/li>\n<\/ul>\n\n<h3>Araçlar, amaçlar ve otomatik istikrarlandırıcılar<\/h3>\n<ul>\n<li><b>Araçlar:<\/b> kamu harcamaları (tutar kadar <b>kompozisyon<\/b> değişikliği de araçtır), vergiler (<b>en önemli araç<\/b>; muafiyetle teşvik, vergiyle caydırma), borçlanma.<\/li>\n<li><b>Amaçlar (üç):<\/b> ekonomik istikrar (fiyat istikrarı + tam istihdam), gelir dağılımında adalet, ekonomik büyüme ve kalkınma (<b>uzun dönemli amaç<\/b>; gelişmişte büyüme, az gelişmişte kalkınma). Dikkat: faiz oranı istikrarı maliye politikasının amaçları arasında sayılmaz.<\/li>\n<li><b>Amaç çatışmaları:<\/b> tam istihdam - enflasyon; ekonomik istikrar - büyüme; büyüme - adil gelir dağılımı (düşük gelirliye aktarım tasarrufu azaltır).<\/li>\n<li><b>Tasarruf paradoksu:<\/b> bireysel tasarruf artışı bireyi zenginleştirir; herkes aynı şeyi yaparsa toplam harcama ve üretim düşer, milli gelir azalır.<\/li>\n<li><b>Deflasyonist açık:<\/b> denge geliri potansiyel gelirin (Y*) altında; açık = Y* - Y. Genişletici maliye politikası (vergi indirimi, harcama artışı) toplam talebi artırır ama faizi yükselterek özel yatırımı dışlayabilir.<\/li>\n<li><b>Otomatik istikrarlandırıcılar:<\/b> müdahale olmadan krizi yumuşatan unsurlar: <b>işsizlik sigortası<\/b>, <b>artan oranlı gelir vergisi<\/b> (hem daralma hem genişlemede), <b>tarımsal destek alımları<\/b>, <b>bireylerin tasarrufları<\/b>.<\/li>\n<li><b>Duesenberry - Nispi Gelir Hipotezi:<\/b> gelir artınca tüketim hemen uyum sağlar, gelir düşünce eski tüketim alışkanlığı tasarruflarla korunur; buna <b>klike (ratchet) etkisi<\/b> denir (mandal, zemberek, takoz, raket etkisi).<\/li>\n<li><b>Monetaristler<\/b> (Milton Friedman; 1970'lerdeki stagflasyonla öne çıktı): maliye politikası yalnız <b>kısa dönemde<\/b> geçici etkilidir; uzun dönemde tek etkisi <b>fiyatların yükselmesidir<\/b> (ücret-fiyat esnekliği, uzun dönemde tam istihdam).<\/li>\n<\/ul>\n\n<h3>Maliye politikası çarpanları<\/h3>\n<ul>\n<li>Y = C + I + G; C = C0 + cY (c = marjinal tüketim eğilimi). Çözüm: Y = [1/(1 - c)] × (C0 + I + G).<\/li>\n<li><b>Kamu harcamaları çarpanı<\/b> = 1 / (1 - c).<\/li>\n<li><b>Vergi çarpanı<\/b> = -c / (1 - c).<\/li>\n<li><b>Transfer harcamaları çarpanı<\/b> = c / (1 - c).<\/li>\n<li><b>Denk bütçe çarpanı<\/b> = 1/(1 - c) - c/(1 - c) = <b>1<\/b>. Harcama ve vergi aynı tutarda artarsa gelir o tutar kadar artar.<\/li>\n<li><b>Örnek (c = 0,9):<\/b> harcama çarpanı 10 → 100 birimlik harcama geliri 1.000 artırır; vergi çarpanı -9 → 100 birimlik vergi artışı geliri 900 azaltır; transfer çarpanı 9 → 900 artış.<\/li>\n<li><b>Açık ekonomi ve gelire bağlı vergi:<\/b> M = m0 + mY, T = T0 + tY. Harcama çarpanı = 1 / [1 - c(1 - t) + m]; vergi çarpanı = -c / [1 - c(1 - t) + m]; transfer çarpanı = c / [1 - c(1 - t) + m].<\/li>\n<li>İthalat ve vergiler <b>sızıntıdır<\/b>: t ve m arttıkça çarpan küçülür; c arttıkça büyür. Açık ekonomide çarpan, kapalı ve otonom vergili ekonomiye göre küçüktür. Otonom tüketim çarpanı değil, geliri etkiler.<\/li>\n<\/ul>\n\n<h3>Maliye politikası türleri ve IS eğrisi<\/h3>\n<ul>\n<li><b>Daraltıcı:<\/b> harcama azaltma veya vergi artırma; enflasyonda; milli gelir ve faiz düşer. <b>Genişletici:<\/b> harcama artırma veya vergi indirme; durgunlukta; milli gelir ve faiz yükselir.<\/li>\n<li>C = C0 + c(Y - T0); I = I0 - bi (b yatırımların faize duyarlılığı); AD = C + I + G0 + NX0 = A0 + cY - bi; A0 = C0 - cT0 + I0 + G0 + NX0.<\/li>\n<li><b>IS denklemi:<\/b> i = [A0 - Y(1 - c)] / b. IS, mal piyasasını dengede tutan faiz-gelir bileşimleri; <b>negatif eğimli<\/b> (faiz düşer → yatırım artar → gelir artar).<\/li>\n<li>Otonom harcama (A0) artışı IS'yi yukarı/sağa kaydırır. Komşu ülkenin geliri artarsa ihracat ve NX0 artar, IS sağa kayar.<\/li>\n<li>IS'nin <b>solunda<\/b>: yatırım &gt; tasarruf, <b>mal talep fazlası<\/b>. <b>Sağında<\/b>: yatırım &lt; tasarruf, <b>mal arz fazlası<\/b>.<\/li>\n<li><b>IS'yi yatıklaştıranlar:<\/b> marjinal tüketim eğiliminin artması, marjinal vergi oranının azalması, marjinal ithalat eğiliminin azalması, yatırımların faiz esnekliğinin artması.<\/li>\n<li><b>LM'yi dikleştirenler:<\/b> para talebinin faize duyarlılığının azalması (sıfırsa dikey), gelire duyarlılığının artması (sonsuzsa dikey). Faize duyarlılık sonsuzsa LM yatay.<\/li>\n<\/ul>\n<h4>IS-LM dengesi<\/h4>\n<table>\n<tr><th>Politika<\/th><th>Eğri<\/th><th>Milli gelir<\/th><th>Faiz<\/th><\/tr>\n<tr><td>Genişletici maliye<\/td><td>IS sağa<\/td><td>Artar<\/td><td>Artar<\/td><\/tr>\n<tr><td>Daraltıcı maliye<\/td><td>IS sola<\/td><td>Azalır<\/td><td>Azalır<\/td><\/tr>\n<tr><td>Genişletici para<\/td><td>LM sağa<\/td><td>Artar<\/td><td>Azalır<\/td><\/tr>\n<tr><td>Daraltıcı para<\/td><td>LM sola<\/td><td>Azalır<\/td><td>Artar<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Dışlama etkisi (crowding out):<\/b> borçla finanse edilen kamu harcaması faizi yükseltir, özel yatırımı azaltır (adı monetaristlerce verilmiştir). <b>LM dikleştikçe dışlama artar<\/b>; LM tam dikeyse <b>tam dışlama<\/b>: harcama artışı yalnız faizi yükseltir, çıktı değişmez.<\/li>\n<li><b>Politika karması:<\/b> para ve maliye politikasının eşanlı kullanımı. Örnek: genişletici maliye politikasına genişletici para politikası eşlik ederse faiz sabit kalırken gelir artar.<\/li>\n<\/ul>\n\n<h3>İktisat okullarının görüşleri<\/h3>\n<table>\n<tr><th>Okul<\/th><th>Temel görüş<\/th><\/tr>\n<tr><td>Klasik<\/td><td>Ekonomi tam istihdamda; ücret ve fiyatlar esnek; piyasa sorunu kendisi çözer; para <b>nötr<\/b> (klasik dikotomi); rasyonel birimler; tam rekabet; <b>denk bütçe<\/b> öne çıkar; bütçe açığı faizi artırır; para pasif işlem aracı<\/td><\/tr>\n<tr><td>Keynesyen<\/td><td>Eksik istihdam; fiyat ve ücretler <b>katı (yapışkan)<\/b>; denge planlanan harcama = gelir; faiz para arz ve talebiyle belirlenir; devlet müdahalesi gerekli; toplam talebe yönelik vergi-harcama düzenlemesi<\/td><\/tr>\n<tr><td>Monetarist<\/td><td>Enflasyon <b>para kaynaklıdır<\/b>; para arzının kontrolü önemli; para arzı artarsa nominal GSYH artar; para kısa dönemde önemli, <b>uzun dönemde nötr<\/b>; nominal gelir para miktarıyla doğrudan ilişkili<\/td><\/tr>\n<tr><td>Yeni Klasik<\/td><td><b>Rasyonel beklentiler<\/b>; esnek ücret ve fiyat; <b>politika etkisizliği<\/b>: para ve maliye politikası kısa ve uzun dönemde reel değişkenleri etkilemez<\/td><\/tr>\n<tr><td>Yeni Keynesyen<\/td><td>Rasyonel beklentiler olabilir ama ücret ve fiyatlar kısa dönemde esnek değil; para ve maliye politikası hasılayı etkiler<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Likidite tuzağında (yatay LM):<\/b> genişletici maliye politikası faizi değiştirmez, dışlama olmaz, <b>maliye politikası tam etkindir<\/b>; para arzı artışı faizi düşüremez, <b>para politikası etkisizdir<\/b>.<\/li>\n<\/ul>", "sorular": [{"q": "Kamu harcamalarının ekonomik sınıflandırmasında, yapıldığı dönemde doğrudan mal ve hizmet talebi yaratmayan harcama türü hangisidir?", "o": ["Cari harcamalar", "Yatırım harcamaları", "Personel harcamaları", "Transfer harcamaları", "Savunma harcamaları"], "a": 3, "e": "Transfer harcamaları cari ve yatırım harcamalarının aksine yapıldıkları dönemde doğrudan talep yaratmaz; etkisi transferi alanların davranışına bağlıdır."}, {"q": "Belediyelerin yol, su, kanalizasyon gibi hizmetler nedeniyle değeri artan gayrimenkullerin sahiplerinden \"harcamalara katılma payı\" adıyla aldığı gelir hangisidir?", "o": ["Harç", "Şerefiye", "Resim", "Parafiskal gelir", "Mali tekel geliri"], "a": 1, "e": "Bayındırlık ve imar hizmetleri sonucu değeri artan gayrimenkul sahiplerinden alınan değer artış bedeli şerefiyedir."}, {"q": "Meslek odası aidatları ve Sosyal Güvenlik Kurumu aidatları hangi kamu geliri türüne girer?", "o": ["Vergi", "Harç", "Şerefiye", "Senyoraj", "Parafiskal gelir"], "a": 4, "e": "Parafiskal gelirler kamu veya yarı kamu kuruluşlarının üyelerinden aldığı bütçe dışı gelirlerdir."}, {"q": "Vadesi 3 yıl olan bir kamu borcu vade bakımından nasıl sınıflandırılır?", "o": ["Kısa vadeli", "Uzun vadeli", "Orta vadeli", "Çok uzun vadeli", "Konsolide"], "a": 2, "e": "Kitaba göre 1 yıldan az kısa, 1 yıldan çok orta, 5 yıldan fazla uzun vadelidir; 3 yıl orta vadeye girer."}, {"q": "Laffer eğrisi ile ilgili hangisi doğrudur?", "o": ["Vergi gelirini maksimize eden optimal bir vergi oranı vardır", "Vergi oranı ile vergi geliri arasında her zaman doğrusal pozitif ilişki vardır", "Vergi geliri vergi oranı yükseldikçe sürekli azalır", "Eğri U biçimlidir", "Eğriyi Ricardo geliştirmiştir"], "a": 0, "e": "Laffer eğrisi ters çan biçimlidir; belli bir eşiğe kadar oran artışı geliri artırır, sonra azaltır; geliri maksimize eden optimal oran vardır."}, {"q": "Bugünkü bir vergi indiriminin ileride vergi artışıyla finanse edileceğini bilen rasyonel bireylerin tüketimlerini değiştirmeyeceğini, dolayısıyla maliye politikasının nötr olduğunu savunan yaklaşım hangisidir?", "o": ["Laffer eğrisi", "Hoş olmayan monetarist aritmetik", "Nispi gelir hipotezi", "Ricardocu denklik hipotezi", "Tasarruf paradoksu"], "a": 3, "e": "Ricardocu denklik hipotezine göre vergi indirimi sürekli geliri değiştirmez; bireyler tasarruf eder ve maliye politikası reel ekonomiye etki etmez."}, {"q": "Katma Değer Vergisi'nde malın satıcısı ve alıcısı sırasıyla nasıl nitelendirilir?", "o": ["Fiili mükellef – aracı mükellef", "Aracı mükellef – fiili mükellef", "Vergi sorumlusu – vergi alacaklısı", "Kanuni mükellef – vergi sorumlusu", "Fiili mükellef – vergi sorumlusu"], "a": 1, "e": "KDV'de satıcı vergiyi fiyata yansıtan aracı mükellef, malı satın alan ise vergiyi fiilen ödeyen fiili mükelleftir."}, {"q": "Ödenen verginin talep esnekliği düşük başka bir mal veya hizmete yansıtılmasına ne ad verilir?", "o": ["İleri yansıma", "Geri yansıma", "Vergi tazyiki", "Vergi kaçakçılığı", "Çapraz yansıma"], "a": 4, "e": "Verginin ilgili mal yerine esnekliği düşük başka bir mala yansıtılması çapraz yansımadır."}, {"q": "Aşağıdakilerden hangisi dolaysız bir vergidir?", "o": ["Katma Değer Vergisi", "Özel Tüketim Vergisi", "Veraset ve İntikal Vergisi", "Damga Vergisi", "Banka ve Sigorta Muameleleri Vergisi"], "a": 2, "e": "Gelir, Kurumlar, Veraset ve İntikal, Motorlu Taşıtlar ile Emlak vergileri dolaysızdır; diğer seçenekler dolaylı vergidir."}, {"q": "Geçmiş yıllarda tahsis edilen ödeneklere bakılmaksızın her hizmetin ilk kez yapılıyormuş gibi değerlendirildiği bütçe sistemi hangisidir?", "o": ["Sıfır tabanlı bütçe", "Geleneksel bütçe", "Performans bütçe", "Program bütçe", "Planlama-programlama-bütçeleme sistemi"], "a": 0, "e": "Sıfır tabanlı bütçelemede ödenekler geçmiş tutarlardan bağımsız olarak her yıl yeniden belirlenir. Türkiye'de performans bütçe uygulanır."}, {"q": "Devletin tüm gelir ve giderlerinin tek bir bütçede yer alması hangi bütçe ilkesidir?", "o": ["Genellik ilkesi", "Denklik ilkesi", "Alenilik ilkesi", "Birlik ilkesi", "Önceden izin alma ilkesi"], "a": 3, "e": "Tüm gelir ve giderlerin tek bütçede toplanması birlik ilkesidir. Genellik ilkesi ise gelir ve giderlerin ayrı ayrı ve tam gösterilmesidir."}, {"q": "Aşağıdakilerden hangisi otomatik istikrarlandırıcılara örnek değildir?", "o": ["İşsizlik sigortası", "Meclis kararıyla yapılan ek kamu yatırımı", "Artan oranlı gelir vergisi", "Tarımsal destek alımları", "Bireylerin tasarrufları"], "a": 1, "e": "Otomatik istikrarlandırıcılar müdahale gerektirmeden devreye girer. Meclis kararıyla yapılan ek yatırım ihtiyari bir politikadır."}, {"q": "Marjinal tüketim eğiliminin 0,75 olduğu kapalı bir ekonomide (vergiler otonom) kamu harcamaları 200 birim artırılırsa milli gelir ne kadar artar?", "o": ["150", "200", "600", "1.000", "800"], "a": 4, "e": "Harcama çarpanı = 1/(1 - 0,75) = 4; milli gelir artışı 200 × 4 = 800."}, {"q": "Marjinal tüketim eğiliminin 0,8 olduğu bir ekonomide vergiler 100 birim artırılırsa milli gelir nasıl değişir?", "o": ["500 azalır", "400 artar", "400 azalır", "100 azalır", "80 azalır"], "a": 2, "e": "Vergi çarpanı = -c/(1 - c) = -0,8/0,2 = -4; gelir 400 birim azalır."}, {"q": "Kamu harcamaları ve vergiler aynı anda 300 birim artırılırsa (denk bütçe) milli gelir ne kadar değişir?", "o": ["300 artar", "Değişmez", "300 azalır", "Marjinal tüketim eğilimine göre değişir", "600 artar"], "a": 0, "e": "Denk bütçe çarpanı 1'dir; harcama ve vergi aynı tutarda artarsa gelir o tutar kadar, yani 300 artar."}, {"q": "Marjinal tüketim eğiliminin 0,8, marjinal vergi oranının 0,25, marjinal ithalat eğiliminin 0,2 olduğu açık bir ekonomide harcama çarpanı kaçtır?", "o": ["5", "2,5", "2", "1,67", "1,25"], "a": 3, "e": "Çarpan = 1 / [1 - c(1 - t) + m] = 1 / [1 - 0,8 × 0,75 + 0,2] = 1 / 0,6 ≈ 1,67."}, {"q": "Harcama çarpanıyla ilgili hangisi doğrudur?", "o": ["Marjinal vergi oranının artması çarpanı büyütür", "Marjinal tüketim eğiliminin artması çarpanı büyütür", "Marjinal ithalat eğiliminin artması çarpanı büyütür", "Otonom tüketimin artması çarpanı büyütür", "Açık ekonomide çarpan kapalı ekonomiye göre her zaman büyüktür"], "a": 1, "e": "Vergi ve ithalat sızıntı olduğu için çarpanı küçültür; marjinal tüketim eğilimi arttıkça çarpan büyür."}, {"q": "IS eğrisinin solundaki noktalar için hangisi doğrudur?", "o": ["Mal arz fazlası vardır", "Para talep fazlası vardır", "Mal piyasası dengededir", "Tasarruflar yatırımlardan büyüktür", "Yatırımlar tasarruflardan büyüktür, mal talep fazlası vardır"], "a": 4, "e": "IS'nin solunda faiz dengeyi sağlayan faizden düşüktür; yatırım tasarrufu aşar ve mal talep fazlası oluşur. Sağında mal arz fazlası vardır."}, {"q": "IS-LM modelinde vergi oranlarının artırılması durumunda aşağıdakilerden hangisi gerçekleşmez?", "o": ["IS eğrisi sola kayar", "Milli gelir azalır", "LM eğrisi sağa kayar", "Faiz oranı düşer", "Toplam talep azalır"], "a": 2, "e": "Vergi artışı daraltıcı maliye politikasıdır ve yalnız IS'yi sola kaydırır; gelir ve faiz düşer. LM etkilenmez."}, {"q": "Aşağıdakilerden hangisi IS eğrisini daha yatık hale getirir?", "o": ["Yatırımların faiz esnekliğinin artması", "Marjinal tüketim eğiliminin azalması", "Marjinal vergi oranının artması", "Marjinal ithalat eğiliminin artması", "Para talebinin gelire duyarlılığının artması"], "a": 0, "e": "Yatırımların faiz esnekliği ve marjinal tüketim eğilimi arttıkça, marjinal vergi oranı ve ithalat eğilimi azaldıkça IS yatıklaşır."}, {"q": "Tam dışlama etkisi (full crowding out) hangi durumda ortaya çıkar?", "o": ["LM eğrisi yatay olduğunda", "IS eğrisi dikey olduğunda", "Likidite tuzağında", "LM eğrisi tam dikey olduğunda", "Yatırımlar faize duyarsız olduğunda"], "a": 3, "e": "LM tam dikeyse kamu harcaması artışı yalnız faizi yükseltir; çıktı değişmez ve maliye politikasının etkisi tamamen yok olur."}, {"q": "Politika etkisizliği kavramı hangi iktisadi yaklaşıma aittir?", "o": ["Klasik", "Yeni Klasik", "Keynesyen", "Monetarist", "Yeni Keynesyen"], "a": 1, "e": "Yeni Klasik iktisatta rasyonel beklentiler ve esnek fiyatlar nedeniyle para ve maliye politikaları kısa ve uzun dönemde reel değişkenleri etkilemez."}, {"q": "Monetarist görüşe göre aşağıdakilerden hangisi söylenemez?", "o": ["Enflasyon para kaynaklıdır", "Para arzının kontrolü önemlidir", "Para arzı artarsa nominal GSYH artar", "Nominal gelir para miktarıyla doğrudan ilişkilidir", "Para kısa dönemde nötrdür"], "a": 4, "e": "Monetaristlere göre para kısa dönemde önemli, uzun dönemde nötrdür."}, {"q": "Likidite tuzağı durumunda para ve maliye politikalarının etkinliği hakkında hangisi doğrudur?", "o": ["Para politikası tam etkin, maliye politikası etkisizdir", "İkisi de tam etkindir", "Maliye politikası dışlama etkisi olmadığı için tam etkindir, para politikası etkisizdir", "İkisi de etkisizdir", "Maliye politikası tam dışlamaya uğrar"], "a": 2, "e": "Yatay LM'de genişletici maliye politikası faizi yükseltmez, dışlama olmaz; para arzı artışı faizi düşüremediği için para politikası etkisizdir."}]}, {"id": 5, "kisa": "Makroekonomik Göstergeler", "baslik": "Makroekonomik Göstergeler ve Yorumu", "ozet": "GSYH ve milli gelir hesapları, istihdam ve işsizlik, enflasyon göstergeleri, TCMB verileri, konjonktür, potansiyel büyüme, Solow modeli ve orta gelir tuzağı.", "notlar": "<h3>Milli gelir kavramları<\/h3>\n<ul>\n<li><b>Gelir-harcama akımı:<\/b> hane halkı emeğini arz eder, ücret alır, tüketir; firmalar emek, sermaye, doğal kaynak kullanıp ücret, faiz, kira öder; devlet mal alır, vergi toplar, transfer yapar; dış âlemle ithalat-ihracat yapılır.<\/li>\n<li><b>GSYH:<\/b> belirli dönemde <b>ülke sınırları içinde<\/b> üretilen <b>nihai<\/b> mal ve hizmetlerin piyasa fiyatlarıyla değeri. Çifte sayımı önlemek için <b>ara mallar dahil edilmez<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Kavram<\/th><th>Hesap<\/th><\/tr>\n<tr><td>GSMH<\/td><td>GSYH + dış âlem net faktör gelirleri (yurt dışındaki vatandaşların gelirleri dahil)<\/td><\/tr>\n<tr><td>Safi Milli Hasıla (SMH)<\/td><td>GSMH - amortismanlar<\/td><\/tr>\n<tr><td>Milli gelir (faktör fiyatlarıyla SMH)<\/td><td>SMH - dolaylı vergiler = ücret + rant + faiz + kâr<\/td><\/tr>\n<tr><td>Kişisel gelir<\/td><td>Milli gelir - dağıtılmamış kurum kârları - sosyal güvenlik aidatları - kurumlar vergisi + transfer ödemeleri<\/td><\/tr>\n<tr><td>Harcanabilir (kullanılabilir) gelir<\/td><td>Kişisel gelir - kurumlar vergisi dışındaki dolaysız vergiler<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Potansiyel GSYH:<\/b> tüm faktörlerin tam kapasiteyle istihdamında ulaşılabilecek çıktı. <b>Fiili GSYH:<\/b> mevcut çıktı. Fark GSYH açığı veya fazlasıdır.<\/li>\n<li><b>Nominal GSYH:<\/b> cari yıl fiyatlarıyla. <b>Reel GSYH:<\/b> baz yıl fiyatlarıyla (fiyat etkisi arındırılır). Baz yılda ikisi eşittir.<\/li>\n<li><b>Örnek:<\/b> 2020'de buğday 150 kg (fiyat 10), elma 200 kg (fiyat 20); 2019 fiyatları buğday 5, elma 8; 2019 miktarları 120 ve 150. 2020 nominal GSYH = 150×10 + 200×20 = <b>5.500<\/b>; 2020 reel GSYH (2019 fiyatıyla) = 150×5 + 200×8 = <b>2.350<\/b>; 2019 nominal = reel = 120×5 + 150×8 = <b>1.800<\/b>.<\/li>\n<li><b>Ekonomik büyüme oranı<\/b> = [(Yt - Yt-1) / Yt-1] × 100 (reel GSYH ile).<\/li>\n<li><b>GSYH (zımni) deflatörü<\/b> = (nominal GSYH / reel GSYH) × 100.<\/li>\n<li><b>Milli gelirin yansıtamadıkları:<\/b> çevre kirliliği, boş zaman, ürün kalitesindeki iyileşme, kayıt dışı ekonomi, gelirin dağılımı; ayrıca fiyatı olmayan mal ve hizmetler (ev hanımlarının işi).<\/li>\n<\/ul>\n<h4>GSYH hesaplama yöntemleri<\/h4>\n<ul>\n<li><b>Harcama yöntemi:<\/b> AE = C + I + G + (X - M). G'ye <b>transfer harcamaları dahil edilmez<\/b> (karşılıksızdır). X - M negatifse dış açık, pozitifse dış fazla.<\/li>\n<li><b>Üretim yöntemi:<\/b> katma değerlerin toplamı (tarım, sanayi, hizmetler).<\/li>\n<li><b>Gelir yöntemi:<\/b> GSYH = ücret + rant + faiz + kâr + amortismanlar + dolaylı vergiler.<\/li>\n<\/ul>\n<h4>Milli gelirin oluşumu<\/h4>\n<ul>\n<li><b>Tüketim:<\/b> gelire bağlı (düşük gelirlide tüketim eğilimi yüksek); reel faizle ters ilişkili; zevk, eğitim, fiyat beklentisi (gelecekte fiyat artışı beklentisi bugünkü tüketimi artırır). <b>Tasarruf<\/b> = gelir - tüketim (harcanabilir gelire bağlı).<\/li>\n<li><b>Yatırım:<\/b> fiziki sermayeye net ilave. Etkileyenler: nüfus artışı, teknolojik gelişme, beklentiler (+/-), <b>faiz (ters yönlü)<\/b>. Sabit yatırım (ekipman, bina) ve stok yatırımı (stok değişimi).<\/li>\n<li><b>Toplam talep:<\/b> daraltıcı para/maliye politikası azaltır, genişletici artırır. <b>Toplam arz:<\/b> enerji maliyet artışı <b>negatif arz şoku<\/b> (arzı azaltır), düşüşü pozitif arz şoku.<\/li>\n<\/ul>\n<h4>Türkiye verileri (TÜİK)<\/h4>\n<ul>\n<li>GSYH'de en büyük pay <b>hizmetler<\/b> (2012-2021 boyunca yarıdan fazla); sanayi yaklaşık <b>%20<\/b> düzeyinde istikrarlı; tarım ve inşaatın payı azaldı. 2021: GSYH 802.678 milyon dolar, reel büyüme <b>%11,0<\/b>; payları tarım 5,6, sanayi 26,0, inşaat 5,1, hizmetler 52,7.<\/li>\n<li><b>Kişi başına GSYH<\/b> = GSYH / <b>yıl ortası nüfus<\/b>. 2013'te 12.582 dolar (dönemin zirvesi), 2020'de 8.597, 2021'de <b>9.539<\/b> dolar.<\/li>\n<\/ul>\n<h4>Gelir dağılımı<\/h4>\n<ul>\n<li><b>Lorenz eğrisi<\/b> tam eşitlik doğrusundan uzaklaştıkça adaletsizlik artar.<\/li>\n<li><b>Gini katsayısı = A / (A + B)<\/b> (A: eşitlik doğrusu ile Lorenz eğrisi arasındaki alan). 0 ile 1 arasında; 0 tam eşitlik, 1'e yaklaştıkça eşitsizlik artar.<\/li>\n<li>Türkiye Gini katsayısı (kullanılabilir gelire göre) <b>2020<\/b>'de bir önceki yıla göre %3,87 artarak <b>0,402<\/b>.<\/li>\n<\/ul>\n<h4>Bütçe dengesi ve borç<\/h4>\n<ul>\n<li>Kamu gelirlerinde en büyük pay vergilerin; Türkiye'de dolaylı vergilerin payı yüksek, gelişmiş ülkelerde tersi.<\/li>\n<li><b>Hoş olmayan monetarist aritmetik<\/b> (T. Sargent ve N. Wallace): kısa dönem bütçe açıklarının iç borçla finansmanı uzun dönemde enflasyonisttir (borç-faiz sarmalı sonunda para basılır). <b>Üç ön koşul:<\/b> borç faizinin reel büyüme hızından yüksek olması; para otoritesinin senyoraj elde edebilmesi; para otoritesinin bağımsız olmaması. Sonuç: iç borç yerine hemen para basmak daha az enflasyonist olur.<\/li>\n<li>Merkezi bütçe 2012-2021 arasında <b>her yıl açık<\/b> verdi; açık/GSYH 2020'de -3,5, 2021'de -2,7; <b>faiz dışı denge 2019'dan itibaren negatife döndü<\/b>.<\/li>\n<li>Merkezi yönetim iç borç stoku 2012'de 386,5 milyar TL'den 2021'de <b>1.321,2 milyar TL<\/b>'ye çıktı. İç borçlanma DİBS ile yapılır; hazine bonosu kısa, devlet tahvili uzun vadelidir.<\/li>\n<\/ul>\n\n<h3>İstihdam ve işsizlik<\/h3>\n<ul>\n<li><b>İstihdam:<\/b> işgücünün ücret karşılığı üretimde bulunması. <b>Tam istihdam:<\/b> cari ücrette çalışmak isteyen herkesin çalışması.<\/li>\n<li><b>İşsiz:<\/b> kitaba göre <b>15-65<\/b> yaş çalışma çağında olup çalışmayan veya iş arayan. <b>İşgücü<\/b> = çalışanlar + işsizler.<\/li>\n<li><b>İşsizlik oranı<\/b> = (işsiz sayısı / işgücü) × 100. <b>İşgücüne katılım oranı<\/b> = (işgücü / yetişkin nüfus) × 100.<\/li>\n<li><b>İradi işsiz<\/b> daha yüksek ücret ya da daha iyi iş istediği için çalışmaz ve <b>işsiz sayılmaz<\/b>; <b>gayri iradi işsiz<\/b> cari ücrete razı olduğu halde iş bulamaz.<\/li>\n<\/ul>\n<table>\n<tr><th>İşsizlik türü<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Yapısal<\/td><td>Ekonominin yapısından; beceri-coğrafya uyumsuzluğu, teknoloji, politika değişikliği<\/td><\/tr>\n<tr><td>Friksiyonel (arızi)<\/td><td>Kısa süreli iş arama ve değiştirme; önemli refah kaybı yaratmaz<\/td><\/tr>\n<tr><td>Gizli<\/td><td>Marjinal verimliliği sıfır olanlar; çalışıyor görünür ama katkı yok<\/td><\/tr>\n<tr><td>Reel ücret<\/td><td>Yüksek reel ücretten kaynaklanır<\/td><\/tr>\n<tr><td>Konjonktürel<\/td><td><b>Eksik talep işsizliği<\/b>; daralma dönemlerinde<\/td><\/tr>\n<tr><td>Mevsimsel<\/td><td>Mevsim koşullarına bağlı, özellikle tarım<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Doğal işsizlik oranı (NAIRU):<\/b> enflasyonu hızlandırmayan işsizlik oranı = <b>friksiyonel + yapısal<\/b>; konjonktürel işsizlik yoktur; <b>sıfır olamaz<\/b>; ülkeden ülkeye değişmekle birlikte <b>%4-5<\/b> civarında kabul edilir.<\/li>\n<li><b>Doğal oranı artıranlar:<\/b> demografik değişimler, işsizlik sigortası (iş arama yavaşlar), arz şoku sonrası yapısal işsizlik artışı.<\/li>\n<li><b>Asgari ücret<\/b> bir <b>fiyat tabanıdır<\/b>; denge ücretin üzerinde belirlenirse emek arz fazlası, yani işsizlik oluşur; denetim zayıfsa kayıt dışı istihdam doğar.<\/li>\n<li><b>Phillips eğrisi:<\/b> Phillips (Yeni Zelandalı) <b>1958<\/b>'de işsizlik ile <b>nominal ücret artışı<\/b> arasında ters ilişki buldu. <b>1960<\/b>'ta Samuelson ve Solow ücret yerine <b>enflasyonu<\/b> kullandı. Friedman ve Phelps: ilişki <b>geçicidir<\/b>, beklentiler önemlidir; uzun dönem Phillips eğrisi doğal oranda <b>dikeydir<\/b>.<\/li>\n<li><b>Okun Yasası:<\/b> işsizlikteki her %1 artış GSMH'yi yaklaşık <b>%2<\/b> düşürür. Formül: Δu = -0,5 × (gy - gy*) (gy cari, gy* potansiyel büyüme). Nedensellik sorunu vardır; işsizliğin doğal orana yakın olması gerektiği için genellikle <b>gelişmekte olan ülkelerde tutmaz<\/b>.<\/li>\n<li><b>Türkiye 2021 (TÜİK):<\/b> işsizlik oranı <b>%12,0<\/b>, işgücüne katılım %51,4, istihdam oranı %45,2; işsizlik 2019'da %13,7 ile dönemin en yükseğiydi; istihdamda hizmetlerin payı <b>%55,3<\/b>, tarım %17,2 (10 yılın en düşüğü), sanayi %19-21 bandında.<\/li>\n<\/ul>\n\n<h3>Enflasyon<\/h3>\n<ul>\n<li><b>Enflasyon:<\/b> fiyatlar genel düzeyindeki artış; <b>deflasyon:<\/b> düşüş (üretim ve istihdamı daraltır); <b>dezenflasyon:<\/b> fiyat artış hızının düşmesi.<\/li>\n<li><b>Talep enflasyonu:<\/b> toplam talep arzı aşar; \"<b>daha fazla para daha az malı kovalar<\/b>\"; AD sağa kayar.<\/li>\n<li><b>Maliyet (arz) enflasyonu:<\/b> ücret, hammadde artışı, güçlü sendika ve monopoller; AS sola kayar; fiyat artarken çıktı düşer ve işsizlik artar: <b>stagflasyon<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Hızına göre<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Ilımlı (sürünen, sinsi)<\/td><td>Yıllık <b>%1-10<\/b>; beklentiler istikrarlı; nominal sözleşme yapılabilir; üretici için avantajlı<\/td><\/tr>\n<tr><td>Aşırı (yüksek)<\/td><td>İki, hatta üç haneli; uzun sürerse <b>kronik<\/b>; sözleşmeler dövize endekslenir; konut, arsaya yönelim<\/td><\/tr>\n<tr><td>Hiperenflasyon<\/td><td>Genel olarak <b>aylık %50<\/b> civarı ve üstü; savaş ve afet dönemi politikaları, üretimi aşan para arzı; <b>yabancı para yerli paranın yerini alır<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Etkileri:<\/b> nispi fiyatları bozar, alım gücünü düşürür, gelir ve servet dağılımını bozar, büyümeyi düşürür, bireyleri üst vergi dilimine iter, para ikamesine yol açar, ithalatı artırır ve sermaye kaçışına neden olur. Bankalar krediyi kısar; reel faiz düştüğü için finansal aracılık aksar; iş değişimleri artar.<\/li>\n<li><b>Mücadele:<\/b> daraltıcı maliye (harcama azaltma, vergi artırma) ve daraltıcı para (para arzını kısma, faiz artırma) politikaları.<\/li>\n<li><b>TÜFE<\/b> = (mal sepetinin cari yıl fiyatı / sabit yıl fiyatı) × 100. <b>Enflasyon oranı<\/b> = [(Pt - Pt-1) / Pt-1] × 100. Örnek: endeks 120'den 150'ye → %25.<\/li>\n<li><b>TÜFE sepeti:<\/b> gıda ve alkolsüz içecekler <b>en yüksek<\/b> (2021: %25,94), eğitim <b>en düşük<\/b> (2021: %2,28) ağırlık. 2021'de sepette <b>415 madde<\/b> vardı.<\/li>\n<li><b>ÜFE:<\/b> 2005'ten itibaren TEFE (Toptan Eşya Fiyat Endeksi) yerine kullanılır.<\/li>\n<li><b>Çekirdek enflasyon:<\/b> enerji gibi dışsal etkili kalemler çıkarılarak hesaplanır.<\/li>\n<li><b>TÜFE - GSYH deflatörü farkları:<\/b> deflatör yalnız yurt içinde üretilenleri, TÜFE <b>ithal malları da<\/b> kapsar; deflatörün mal bileşimi yıldan yıla daha çok değişir; deflatör tüm mal ve hizmetleri, TÜFE yalnız tüketim sepetini ölçer; <b>TÜFE Laspeyres<\/b>, <b>deflatör Paasche<\/b> endeksidir.<\/li>\n<li><b>Hoşnutsuzluk endeksi<\/b> = enflasyon oranı + işsizlik oranı.<\/li>\n<li><b>Tarihçe:<\/b> 1973 petrol krizi (OPEC kararları) dünyada enflasyonun en önemli süreci. Türkiye'de 2000 programı (üç yıllık, 2002 hedefi %7), ardından Güçlü Ekonomiye Geçiş Programı; 2004'te enflasyon tek haneye indi; 2004-2016 %6-12 bandı; 2021 sonunda <b>%36,08<\/b> (hedef %5).<\/li>\n<\/ul>\n\n<h3>TCMB verileri, güven endeksleri ve kapasite kullanımı<\/h3>\n<ul>\n<li><b>TCMB rezervleri<\/b> politika gücünü gösterir; 2021 sonu altın 38,5 milyar dolar, döviz varlıkları yaklaşık 65 milyar dolar.<\/li>\n<li><b>Analitik bilanço:<\/b> aktifte net dış varlıklar ve net iç varlıklar (<b>Hazineden alacak<\/b>, değerleme hesabı, IMF acil yardım takip hesabı, bankacılık sektörüne kredi, TMSF'ye kredi). Pasifte döviz yükümlülükleri ve rezerv para.<\/li>\n<li><b>Rezerv para<\/b> = emisyon + bankaların mevduatı (zorunlu karşılıklar + serbest rezervler) + fon hesapları + banka dışı kesim mevduatı. <b>Parasal taban<\/b> = rezerv para + APİ (borçlar). <b>Merkez bankası parası<\/b> = parasal taban + kamu mevduatı.<\/li>\n<li>Dikkat: Hazineden alacaklar TCMB'nin <b>varlığıdır<\/b>, yükümlülüğü değildir.<\/li>\n<li><b>Güven endeksleri<\/b> 0-200 arası değer alır; <b>100'ün üstü iyimserlik<\/b>, altı kötümserlik. Nisan 2020'de (Covid-19) hizmet sektörü 53,8, inşaat 50,9'a düştü.<\/li>\n<li><b>Kapasite kullanım oranı:<\/b> imalat sanayinde TCMB'nin <b>İktisadi Yönelim Anketi<\/b> ile ölçülür; tam kapasite %100; Aralık 2021'de <b>%78,7<\/b>.<\/li>\n<\/ul>\n\n<h3>Konjonktürel dalgalanmalar<\/h3>\n<ul>\n<li><b>Aşamalar:<\/b> <b>dip<\/b> (ağır depresyon, yatırım yok), <b>canlanma<\/b> (üretim, istihdam, talep artar), <b>zirve<\/b> (tam kapasite, hatta potansiyelin üstü), <b>gerileme<\/b> (resesyon; üretim, istihdam, gelir düşer).<\/li>\n<li><b>Negatif talep şoku:<\/b> AD sola; fiyat ve üretim düşer; ücretler düşünce kısa dönem arz sağa kayar; üretim eski düzeye döner ama fiyat daha düşüktür.<\/li>\n<li><b>Pozitif talep şoku<\/b> (ör. vergi indirimi): üretim tam istihdamın üstüne çıkar; ücret talepleri maliyeti artırır; uzun dönemde üretim eski düzeyde, fiyat daha yüksek: <b>enflasyon<\/b>.<\/li>\n<li><b>Talep şoklarının kaynakları:<\/b> tüketim, yatırım (çarpanla büyür), kamu harcamaları, net ihracat.<\/li>\n<li><b>Negatif arz şoku<\/b> (petrol fiyatı artışı, ürünlere dış talebin azalması): fiyat artar, üretim düşer, resesyon. <b>Pozitif arz şoku<\/b>: tersi.<\/li>\n<li><b>Okullar:<\/b> Klasiklere göre esnek fiyatlarla etkiler sınırlıdır; <b>Keynes<\/b> Büyük Buhran'da talep sorununu görüp Say Yasası'nın aksine devlet müdahalesini savundu; <b>monetaristlere<\/b> göre istikrarsızlık para kaynaklıdır.<\/li>\n<li><b>Politik nedenler:<\/b> seçim öncesi genişletici (popülist) politikalar, seçim sonrası daraltıcı politikalar.<\/li>\n<li><b>İç denge:<\/b> tam istihdam (doğal işsizlik oranında) + fiyat istikrarı. <b>Dış denge:<\/b> ödemeler dengesinde fazla veya açık olmaması. Birlikte analiz Mundell-Fleming modeliyle yapılır.<\/li>\n<\/ul>\n\n<h3>Ekonomik büyüme<\/h3>\n<ul>\n<li>Büyüme <b>reel GSYH<\/b>'deki artıştır; kişi başı reel GSYH refah göstergesidir.<\/li>\n<li><b>Potansiyel büyüme oranı:<\/b> faktörlerin tam ve verimli kullanımıyla sürdürülebilir maksimum büyüme; doğrudan gözlenemez, tahmin edilir. Reel büyüme kısa dönemde dalgalanır (piyasa döngüsü), uzun dönemde potansiyele döner.<\/li>\n<li><b>Pozitif çıktı açığı<\/b> (potansiyelin üstü): enflasyon baskısı → <b>sıkılaştırıcı<\/b> politika. <b>Negatif çıktı açığı<\/b>: resesyon riski → <b>gevşek<\/b> politika.<\/li>\n<li>Potansiyel büyüme artışı ülke risk primini düşürür, borçlanma maliyetini azaltır, risk iştahını ve sermaye girişini artırır.<\/li>\n<\/ul>\n<h4>Cobb-Douglas ve büyüme muhasebesi<\/h4>\n<ul>\n<li><b>Cobb-Douglas:<\/b> Y = A × K üzeri α × L üzeri (1 - α). A = toplam faktör verimliliği (TFV); α = sermayenin GSYH'den aldığı pay (sermayenin çıktı esnekliği), 1 - α = emeğin payı. α 0 ile 1 arasında.<\/li>\n<li><b>Varsayımlar:<\/b> ölçeğe göre sabit getiri (tüm girdiler %10 artarsa çıktı %10 artar); azalan marjinal verimlilik (sermaye %10 artar, esneklik 0,65 ise çıktı %6,5; 0,50 ise %5 artar). Rekabetçi piyasada faktörün marjinal ürünü fiyatına eşittir.<\/li>\n<li><b>Büyüme muhasebesi<\/b> (ilk kez Solow): %ΔY = %ΔA + α × %ΔK + (1 - α) × %ΔL. Örnek: α = 0,40, emek %3 artarsa katkı (1 - 0,40) × 3 = <b>%1,8<\/b>.<\/li>\n<li><b>Emek verimliliği:<\/b> %Δ(Y/L) = %ΔA + α × %Δ(K/L) (TFV + sermaye yoğunluğu katkısı). Örnek: TFV %1,5, sermaye yoğunluğu katkısı %2 → %3,5. Pratik yol: <b>%ΔY = %ΔL + %Δ(Y/L)<\/b>; emek %1 artarsa potansiyel büyüme 1 + 3,5 = <b>%4,5<\/b>.<\/li>\n<\/ul>\n<h4>Potansiyel büyümenin belirleyicileri<\/h4>\n<ul>\n<li><b>Emek:<\/b> çalışma çağı <b>15-64<\/b>; demografi, işgücüne katılım (konjonktüre duyarlı), ortalama çalışma saati (OECD Nisan 2023 raporu: 2000-2022'de azaldı), <b>beşeri sermaye<\/b>.<\/li>\n<li><b>Sermaye stoku:<\/b> fiziki (fabrika, altyapı) ve fiziki olmayan (bilişim); fiziki olmayan daha homojen olduğu için pozitif dışsallığı daha fazla. Gelişmiş ülkelerde sermaye/emek oranı yüksek, marjinal verim düşük; yatırım gelişmekte olanlara yönelir.<\/li>\n<li><b>Teknoloji:<\/b> uzun dönemde sürdürülebilir büyümenin temel kaynağı; azalan verimler yasasını ortadan kaldırır; ana kaynağı Ar-Ge. Örnek Çin: dünya GSYH'sinin yaklaşık %18'i, satın alma gücü paritesine göre en büyük ekonomi, yaklaşık 800 milyon kişi yoksulluktan kurtuldu.<\/li>\n<li><b>Doğal kaynaklar:<\/b> zenginlik büyümeyi garanti etmez. <b>Hollanda Hastalığı:<\/b> 1960'larda Hollanda'da doğal gaz keşfi → döviz girişi → yerli paranın aşırı değerlenmesi → diğer ihracatın rekabet gücü kaybı → üretim sektörünün küçülmesi. Örnek: Suudi Arabistan.<\/li>\n<li><b>Kamu harcamaları:<\/b> altyapı, eğitim, sağlık, Ar-Ge harcamaları uzun vadeli büyümeyle güçlü pozitif ilişkili; açıklar dışlama etkisi yaratabilir.<\/li>\n<li><b>Yakınsama:<\/b> <b>koşullu<\/b> (benzer yapıdaki ülkeler yakınsar), <b>mutlak/koşulsuz<\/b> (ön koşulsuz), <b>kulüp yakınsaması<\/b> (belirli standartları sağlayanlar gelişmiş kulübe katılır; koşulluya benzer).<\/li>\n<li><b>Rekabet endeksi:<\/b> i = (X - M) / (X + M). Kapalı ekonomide 0; hiç ihracatı olmayan ekonomide -1; ihracat ithalatı aşarsa 0'ın üstü, 1'e yaklaştıkça rekabet gücü artar.<\/li>\n<li><b>Dışa doğru büyüme<\/b> (yabancı sermaye, teknoloji transferi) istatistiklere göre <b>içe doğru büyümeden<\/b> (ithal ikamesi, tarife, kota) daha faydalı; genel kabul kademeli geçiştir.<\/li>\n<\/ul>\n<h4>Solow modeli ve orta gelir tuzağı<\/h4>\n<ul>\n<li><b>Solow büyüme modeli<\/b> (Neoklasik, Robert Solow): Cobb-Douglas'a dayanır; sermayenin marjinal verimi azaldıkça ekonomi dengeye (k*) ulaşır; büyüme durağanlaşır. Teknoloji <b>dışsal<\/b> değişkendir.<\/li>\n<li><b>Durağan büyüme oranı:<\/b> %ΔY = %ΔN + %ΔA (nüfus artışı + teknolojik ilerleme). Çalışan başına çıktı büyümesi: %Δ(Y/L) = <b>%ΔA<\/b>. Örnek: nüfus %1, teknoloji %0,5 → büyüme %1,5; kişi başı %0,5.<\/li>\n<li>Denge koşulları: MPK marjinal maliyete eşitlenir ve minimumdadır; %ΔK = %ΔY.<\/li>\n<li>Örnek <b>Güney Kore:<\/b> 1960'ların sonundaki reformlarla 2010'lara kadar yıllık %7'nin üzerinde büyüdü; sermaye yoğunlaşmasıyla büyüme yavaşladı.<\/li>\n<li><b>Orta gelir tuzağı:<\/b> ilk kez <b>2007<\/b>'de Dünya Bankası raporunda (\"Doğu Asya'nın Rönesansı\"); orta gelire ulaşan ekonominin yüksek gelire geçememesi. En önemli faktör <b>beşeri sermaye / emek kalitesi eksikliği<\/b>. Çıkış yolu verimlilik ve inovasyon odaklı büyüme.<\/li>\n<\/ul>", "sorular": [{"q": "GSMH ile GSYH arasındaki fark aşağıdakilerden hangisidir?", "o": ["Amortismanlar", "Dolaylı vergiler", "Transfer ödemeleri", "Kurumlar vergisi", "Dış âlem net faktör gelirleri"], "a": 4, "e": "GSMH = GSYH + dış âlem net faktör gelirleri."}, {"q": "Safi milli hasıladan dolaylı vergiler çıkarıldığında hangi büyüklüğe ulaşılır?", "o": ["Kişisel gelir", "Harcanabilir gelir", "Milli gelir", "GSMH", "Potansiyel GSYH"], "a": 2, "e": "SMH - dolaylı vergiler = faktör fiyatlarıyla SMH, yani milli gelirdir (ücret + rant + faiz + kâr)."}, {"q": "İki mallı bir ekonomide cari yıl nominal GSYH 5.500, reel GSYH 2.350'dir. GSYH deflatörü yaklaşık kaçtır?", "o": ["234", "42,7", "100", "305", "550"], "a": 0, "e": "Deflatör = nominal GSYH / reel GSYH × 100 = 5.500 / 2.350 × 100 ≈ 234."}, {"q": "Reel GSYH'si bir önceki yıl 1.800, bu yıl 2.350 olan bir ekonominin büyüme oranı yaklaşık kaçtır?", "o": ["%23,4", "%55", "%76,6", "%30,6", "%13"], "a": 3, "e": "Büyüme = (2.350 - 1.800) / 1.800 × 100 ≈ %30,6."}, {"q": "Harcama yöntemiyle GSYH hesaplanırken aşağıdakilerden hangisi dahil edilmez?", "o": ["Hane halkı tüketim harcamaları", "Kamunun transfer harcamaları", "Firmaların yatırım harcamaları", "Kamunun personel ücret ödemeleri", "Net ihracat"], "a": 1, "e": "Transfer harcamaları karşılıksız olduğundan ve karşılığında mal ya da hizmet alınmadığından GSYH'ye dahil edilmez."}, {"q": "Aşağıdakilerden hangisi milli gelirin tam olarak yansıtamadığı konulardan biri değildir?", "o": ["Çevre kirliliği", "Boş zamanın refaha etkisi", "Kayıt dışı ekonomi", "Ürün kalitesindeki iyileşmeler", "Üretim faktörlerinin geliri"], "a": 4, "e": "Milli gelir zaten üretim faktörlerinin gelirlerinin (ücret, rant, faiz, kâr) toplamıdır; diğerleri milli gelirin yansıtamadığı unsurlardır."}, {"q": "Gini katsayısı ile ilgili hangisi yanlıştır?", "o": ["Lorenz eğrisi kullanılarak hesaplanır", "A / (A + B) formülüyle bulunur", "1'den büyük değerler alabilir", "0'a yaklaştıkça eşitsizlik azalır", "1'e yaklaştıkça eşitsizlik artar"], "a": 2, "e": "Gini katsayısı 0 ile 1 arasında değer alır."}, {"q": "Hoş olmayan monetarist aritmetiğin ortaya çıkması için gereken ön koşullardan biri değildir?", "o": ["Merkez bankasının tam bağımsız olması", "Borç faizinin reel büyüme hızından yüksek olması", "Para otoritesinin senyoraj geliri elde edebilecek konumda olması", "Para otoritesinin bağımsız olmaması", "Maliye tarafının baskılarına boyun eğilmesi"], "a": 0, "e": "Sargent ve Wallace'a göre koşullardan biri para otoritesinin bağımsız olmamasıdır; tam bağımsızlık bu aritmetiği engeller."}, {"q": "İşgücünün 40 milyon, işsiz sayısının 4,8 milyon, yetişkin nüfusun 80 milyon olduğu bir ekonomide işsizlik oranı ve işgücüne katılım oranı nedir?", "o": ["%6 ve %50", "%12 ve %40", "%6 ve %40", "%12 ve %50", "%10 ve %50"], "a": 3, "e": "İşsizlik oranı = 4,8 / 40 = %12; işgücüne katılım oranı = 40 / 80 = %50."}, {"q": "\"Eksik talep işsizliği\" olarak da bilinen işsizlik türü hangisidir?", "o": ["Yapısal işsizlik", "Konjonktürel işsizlik", "Friksiyonel işsizlik", "Gizli işsizlik", "Mevsimsel işsizlik"], "a": 1, "e": "Toplam talebin yetersiz kaldığı daralma dönemlerinde görülen konjonktürel işsizliğe eksik talep işsizliği denir."}, {"q": "Doğal işsizlik oranı ile ilgili hangisi yanlıştır?", "o": ["NAIRU olarak da bilinir", "Friksiyonel ve yapısal işsizliğin toplamıdır", "Konjonktürel işsizliğin olmadığı durumdur", "İşsizlik sigortası bu oranı yükseltebilir", "Sıfır olabilir"], "a": 4, "e": "Yüksek istihdamlı ekonomilerde bile yapısal ve friksiyonel işsizlik bulunduğundan doğal işsizlik oranı sıfır olamaz."}, {"q": "İşsizlik oranı ile nominal ücret artışı arasındaki ters ilişkiyi 1958'de ortaya koyan iktisatçı kimdir?", "o": ["Okun", "Friedman", "Phillips", "Samuelson", "Phelps"], "a": 2, "e": "Phillips 1958'de nominal ücret artışı ile işsizlik arasında ters ilişki buldu; 1960'ta Samuelson ve Solow ücret yerine enflasyonu kullandı."}, {"q": "Okun Yasası'na göre (Δu = -0,5 × (gy - gy*)) potansiyel büyümenin %5, cari büyümenin %1 olduğu bir yılda işsizlik oranı nasıl değişir?", "o": ["2 puan artar", "2 puan azalır", "4 puan artar", "0,5 puan artar", "Değişmez"], "a": 0, "e": "Δu = -0,5 × (1 - 5) = -0,5 × (-4) = +2 puan."}, {"q": "Aylık yaklaşık %50 düzeyindeki fiyat artışlarını ifade eden ve yabancı paranın yerli paranın yerini aldığı enflasyon türü hangisidir?", "o": ["Ilımlı enflasyon", "Aşırı enflasyon", "Maliyet enflasyonu", "Hiperenflasyon", "Kronik enflasyon"], "a": 3, "e": "Hiperenflasyon genel olarak aylık %50 civarındaki artışlardır; yerli para tahrip olur ve yabancı para onun yerini alır."}, {"q": "Maliyetlerdeki artışla toplam arz eğrisinin sola kayması sonucu fiyatlar yükselirken üretimin daralması durumuna ne ad verilir?", "o": ["Deflasyon", "Stagflasyon", "Dezenflasyon", "Talep enflasyonu", "Likidite tuzağı"], "a": 1, "e": "Enflasyonla birlikte üretim hacminin daraldığı ve işsizliğin arttığı duruma stagflasyon denir."}, {"q": "TÜFE endeksi bir yıl 160, ertesi yıl 200 olmuştur. Yıllık enflasyon oranı kaçtır?", "o": ["%20", "%40", "%80", "%125", "%25"], "a": 4, "e": "Enflasyon = (200 - 160) / 160 × 100 = %25."}, {"q": "TÜFE ile GSYH deflatörü arasındaki farklarla ilgili hangisi yanlıştır?", "o": ["TÜFE ithal malları da kapsar", "Deflatör yalnız yurt içinde üretilen malları dikkate alır", "Deflatör yalnızca tüketim sepetindeki malları ölçer", "TÜFE Laspeyres, deflatör Paasche endeksidir", "Deflatöre konu mallar yıldan yıla daha fazla değişebilir"], "a": 2, "e": "Tüketim sepetiyle sınırlı olan TÜFE'dir; deflatör tüm mal ve hizmetlerin fiyat değişimini ölçer."}, {"q": "Enflasyonun %15, işsizlik oranının %10 olduğu bir ekonomide hoşnutsuzluk endeksi kaçtır?", "o": ["25", "5", "1,5", "150", "12,5"], "a": 0, "e": "Hoşnutsuzluk endeksi = enflasyon oranı + işsizlik oranı = 15 + 10 = 25."}, {"q": "Aşağıdakilerden hangisi TCMB analitik bilançosunda bir yükümlülük kalemi değildir?", "o": ["Emisyon", "Zorunlu karşılıklar", "Serbest rezervler", "Hazineden alacak", "Kamu mevduatı"], "a": 3, "e": "Hazineden alacak net iç varlıklar içinde yer alan bir aktif (varlık) kalemidir."}, {"q": "Güven endeksleriyle ilgili hangisi doğrudur?", "o": ["0-100 arasında değer alır", "0-200 arasında değer alır, 100'ün üstü iyimser beklentiyi gösterir", "100'ün altındaki değerler iyimserliği gösterir", "Yalnızca TCMB tarafından hesaplanır", "Mevsimsellikten hiçbir zaman arındırılmaz"], "a": 1, "e": "Güven endeksleri 0-200 arasında değer alır; 100'ün üstü iyimser, altı kötümser beklentiye işaret eder."}, {"q": "Sermayenin GSYH'den aldığı payın 0,30 olduğu bir ekonomide emek miktarı yıllık %2 artarsa bunun potansiyel büyümeye katkısı kaçtır (büyüme muhasebesi)?", "o": ["%0,6", "%2", "%2,6", "%0,3", "%1,4"], "a": 4, "e": "Emeğin katkısı = (1 - α) × %ΔL = (1 - 0,30) × 2 = %1,4."}, {"q": "Solow modeline göre nüfus artışının %1,5, teknolojik ilerlemenin %1 olduğu bir ekonomide durağan büyüme oranı ve çalışan başına çıktının durağan büyüme oranı nedir?", "o": ["%2,5 ve %1,5", "%1 ve %2,5", "%2,5 ve %1", "%1,5 ve %1", "%0,5 ve %1"], "a": 2, "e": "Durağan büyüme = %ΔN + %ΔA = 1,5 + 1 = %2,5; çalışan başına çıktı büyümesi yalnız teknolojik ilerlemeye bağlıdır: %1."}, {"q": "Doğal kaynak ihracatından gelen döviz girişlerinin yerli parayı aşırı değerlendirip diğer sektörlerin rekabet gücünü azaltması olgusuna ne ad verilir?", "o": ["Hollanda Hastalığı", "Orta gelir tuzağı", "Leontief Paradoksu", "Kulüp yakınsaması", "Stagflasyon"], "a": 0, "e": "Hollanda Hastalığı ilk kez 1960'larda Hollanda'da doğal gaz rezervlerinin keşfiyle gözlenmiştir."}, {"q": "İhracatı 60, ithalatı 140 milyar dolar olan bir ülkenin rekabet endeksi kaçtır?", "o": ["0,4", "-0,8", "0,43", "-0,4", "-0,57"], "a": 3, "e": "i = (X - M) / (X + M) = (60 - 140) / 200 = -0,4."}, {"q": "Orta gelir tuzağı kavramı ilk kez hangi kurumun raporunda yer almıştır ve en önemli nedeni nedir?", "o": ["IMF, 2001 – yüksek enflasyon", "Dünya Bankası, 2007 – beşeri sermaye ve emek kalitesi eksikliği", "OECD, 2023 – çalışma saatlerinin azalması", "Dünya Bankası, 1997 – döviz kuru rejimi", "DTÖ, 1994 – gümrük tarifeleri"], "a": 1, "e": "Kavram ilk kez 2007'de Dünya Bankası raporunda yer almıştır; en önemli faktör beşeri sermaye veya emek kalitesindeki eksikliktir."}]}, {"id": 6, "kisa": "Dış Ticaret ve Döviz", "baslik": "Dış Ticaret ve Uluslararası Ekonomi", "ozet": "Dış ticaret teorileri, ödemeler dengesi, dış ticaret politikası araçları, döviz piyasası ve kotasyon, vadeli kur, parite koşulları, kur rejimleri ve Mundell-Fleming modeli.", "notlar": "<h3>Dış ticaret teorileri<\/h3>\n<ul>\n<li><b>Merkantilizm<\/b> (16. ve 17. yüzyıl): dış ticaret <b>sıfır toplamlı<\/b> oyundur; dış ticaret fazlası ve altın-gümüş biriktirmek faydalıdır; ithalat kısıtlanmalı, ihracat teşvik edilmeli; güçlü devlet müdahalesi.<\/li>\n<li><b>Mutlak üstünlükler<\/b> (Adam Smith): ülke daha az kaynakla ürettiği malda uzmanlaşmalı. Örnek: Türkiye çay 6 ton / pamuk 2 ton, Fransa çay 2 / pamuk 6 → Türkiye çayda, Fransa pamukta mutlak üstün.<\/li>\n<li><b>Karşılaştırmalı (mukayeseli) üstünlükler<\/b> (David Ricardo): bir ülke her iki malda mutlak üstün olsa bile <b>göreli üstünlüğü daha büyük<\/b> malda uzmanlaşır. Örnek: Türkiye çay 6 / pamuk 4, Fransa çay 2 / pamuk 1; Türkiye çayda 6:2 = 3, pamukta 4:1 = 4 kat üstün → <b>Türkiye pamukta, Fransa çayda<\/b> uzmanlaşır.<\/li>\n<li><b>Heckscher-Ohlin (faktör donatımı)<\/b>: İsveçli Eli Heckscher ve Bertil Ohlin; ülke nispeten bol olan faktörü yoğun kullanan malı üretip ihraç eder.<\/li>\n<li><b>Faktör fiyatlarının eşitlenmesi:<\/b> bol faktörün fiyatı artar, kıt faktörünki düşer; uzun dönemde faktör fiyatları eşitlenir.<\/li>\n<li><b>Stolper-Samuelson:<\/b> serbest ticaret ülkenin bol olduğu faktör lehine gelir dağılımını değiştirir; kısıtlamalar kıt faktörü etkiler.<\/li>\n<li><b>Leontief paradoksu:<\/b> faktör donatımına göre sermaye yoğun mal ihraç etmesi beklenen <b>ABD<\/b>'nin <b>emek yoğun mal ihraç edip sermaye yoğun mal ithal etmesi<\/b>. Açıklama: ABD işçilerinin verimliliğinin yüksek olması.<\/li>\n<\/ul>\n\n<h3>Ödemeler dengesi<\/h3>\n<ul>\n<li>Bir ekonominin belirli dönemde yurt dışıyla tüm ekonomik işlemlerinin kaydıdır; <b>çift taraflı kayıt<\/b> esası geçerlidir.<\/li>\n<li><b>Cari işlemler hesabı:<\/b> mal ticareti (dış ticaret dengesi), görünmeyen kalemler/hizmetler (turizm, navlun, sigorta, yurt dışı müteahhitlik, bankacılık, işgücü gelirleri), <b>tek taraflı transferler<\/b>.<\/li>\n<li><b>Sermaye ve finans hesabı:<\/b> <b>sermaye hesabı<\/b> (üretilemeyen, finansal olmayan varlıklar; sermaye transferleri); <b>finans hesabı<\/b> (doğrudan yatırımlar, portföy yatırımları, diğer yatırımlar/dış borçlanma, <b>rezerv varlıklar<\/b>).<\/li>\n<li><b>Net hata ve noksan:<\/b> kayıtlarla açıklanamayan fark. Nedenleri: (1) mal hareketi ile ödemenin farklı dönemlere düşmesi, (2) beyan ile fiili durumun uyuşmaması, (3) kayıt dışı işlemler, (4) veri toplama ve kayıt hataları. Bankalar ve merkez bankası açısından yalnız (4) söz konusu olabilir. Küçük ve değişen işaretli tutar sağlıklı veri; <b>büyük ve sürekli aynı işaretli<\/b> tutar kayıt dışılık veya sistematik hata işaretidir.<\/li>\n<li><b>Muhasebe eşitliği:<\/b> cari işlemler hesabı ± net hata noksan = sermaye ve finans hesabı.<\/li>\n<li><b>Makro karşılık:<\/b> X - M = S - I. X - M cari işlemler; S - I sabit kurda sermaye ve finans hesabı + resmi rezerv hareketi, tam esnek kurda sermaye ve finans hesabı.<\/li>\n<li>X &gt; M → sermaye girişi, yerli para değer kazanır; X &lt; M → yerli para değer kaybeder, dış finansman ihtiyacı doğar. Sabit kurda kur hareketi önce rezervlerle önlenir.<\/li>\n<li><b>BP eğrisi<\/b> pozitif eğimlidir; sermaye hareketlerinin faize duyarlılığı arttıkça yatıklaşır; tam sermaye hareketliliğinde <b>yataydır<\/b>.<\/li>\n<li><b>Dış borç stoku:<\/b> kamu, TCMB ve özel sektör borçları; uluslararası kuruluşlardan, devletlerden borçlanma veya tahvil ihracıyla.<\/li>\n<\/ul>\n\n<h3>Dış ticaret politikası<\/h3>\n<ul>\n<li><b>Amaçlar:<\/b> dış ödemeler dengesizliğini gidermek, otarşi (kendine yetme), tam istihdam ve iç istikrar, hazineye gelir, yeni endüstrileri dış rekabetten koruma, kalkınma ve refah, piyasa aksaklıklarını gidermek, sosyal ve siyasal nedenler.<\/li>\n<li><b>Gümrük tarifeleri:<\/b> ithal (ve bazen ihraç) mallardan alınan vergi; devlete gelir sağlar, arzı düşürüp fiyatı artırır.<\/li>\n<li><b>Tarife dışı araçlar<\/b> (en önemli pay miktar kısıtlamalarında; asıl amaç döviz çıkışını kısıtlamak): <b>miktar kısıtlamaları<\/b> (kota, yasak, kambiyo denetimi), <b>tarife benzeri faktörler<\/b>, <b>görünmez engeller<\/b> (kamu güvenliği, halk sağlığı gerekçeli), <b>gönüllü ihracat kısıtlamaları<\/b> (iki ülke anlaşmasıyla ithalatçının koyduğu kota).<\/li>\n<li><b>İhracatın özendirilmesi:<\/b> döviz gelirini artırmak için ihracatçının teşvik edilmesi.<\/li>\n<li><b>Bağlı ticaret:<\/b> devlet kanalıyla, döviz tasarrufu amaçlı. <b>Takas<\/b> (iki, üç veya dört taraflı; döviz transferi olmayabilir) ve <b>kliring<\/b> (takasın gelişmiş hali; ithalatçı-ihracatçı doğrudan ilişkide değil; kliring ofisleri ve merkez bankaları aracılığıyla, ödeme yerli parayla). Modern biçimleri: switch, karşı satın alım, geri satın alım, dengeleme (offset).<\/li>\n<li>Dikkat: <b>açık piyasa işlemleri<\/b> dış ticaret politikası aracı değil, para politikası aracıdır.<\/li>\n<li><b>Dış ticaret dengesi<\/b> = ihracat (X) - ithalat (M). <b>İhracatın ithalatı karşılama oranı<\/b> = (X / M) × 100; olumlu olması için <b>%100'e yaklaşması<\/b> gerekir.<\/li>\n<li>IS, LM ve BP eğrilerinin kesiştiği noktada iç ve dış denge birlikte sağlanır.<\/li>\n<\/ul>\n<h4>Diğer kavramlar<\/h4>\n<ul>\n<li><b>En çok kayrılan ülke kuralı:<\/b> DTÖ üyeleri arasında <b>1994<\/b> tarihli Gümrük Tarifeleri ve Genel Ticaret Anlaşmasına dayanır; bir üyeye tanınan ayrıcalık diğer üyelere de tanınmalıdır. <b>İstisnalar:<\/b> gümrük birliği, serbest ticaret anlaşmaları, genelleştirilmiş tercihler sistemi (gelişmişlerden az gelişmişlere indirim), anti-damping ve telafi edici vergiler.<\/li>\n<li><b>Uluslararası yatırım pozisyonu<\/b> = yurt dışından varlıklar - yurt dışına yükümlülükler. Eksi ise ülke <b>net borçlu<\/b>. Varlıklarda rezervler (parasal altın, özel çekme hakları) de vardır.<\/li>\n<li><b>Sermaye koruma tamponu:<\/b> bankaların kriz kayıplarına karşı tutması beklenen ilave çekirdek sermaye; <b>Basel III<\/b>'e göre çekirdek sermaye yeterliliğine ilaveten <b>%2,5<\/b>.<\/li>\n<li><b>Damping:<\/b> malın yurt dışına yurt içi fiyatın, hatta maliyetin altında satılması (uluslararası fiyat farklılaştırması); karşı önlem <b>anti-damping vergisi<\/b>.<\/li>\n<li><b>SWIFT kodu:<\/b> <b>11 hane<\/b>: ilk 4 banka, sonraki 2 ülke, sonraki 2 şehir, son 3 şube. Şube belirtilmezse <b>8 hane<\/b> ve transfer merkeze gider (AAAA BB CC DDD).<\/li>\n<\/ul>\n\n<h3>Döviz piyasası<\/h3>\n<ul>\n<li>Döviz kuru arz ve talep kesişiminde oluşur. Bir ülkeden ithalat kısılırsa o ülke parasına talep düşer ve kur düşer (yerli para değer kazanır).<\/li>\n<li><b>Döviz kuru:<\/b> yerli paranın yabancı para karşısındaki değeri (fiyatı). <b>Reel döviz kuru<\/b> = nominal kur × (yurt dışı fiyat düzeyi / yurt içi fiyat düzeyi).<\/li>\n<li><b>Düz kur:<\/b> yerli ve yabancı paranın doğrudan birbiri cinsinden ifadesi. <b>Çapraz kur:<\/b> iki para arasındaki kurun üçüncü bir para üzerinden hesaplanması (1 USD = 2,61 TL, 1 EUR = 2,84 TL ise 1 EUR ≈ 1,08 USD).<\/li>\n<li>Dünyanın en büyük piyasası; 24 saat, elektronik; hacim Londra ve New York gündüz saatlerinde zirve, Asya açılışında en düşük. 50'den fazla para birimi; hacimde sıra <b>USD, EUR, JPY<\/b>; en çok işlem gören çiftler USD/EUR, USD/JPY, USD/GBP; merkezler Londra, New York, Singapur, Hong Kong.<\/li>\n<li><b>2022:<\/b> tezgah üstü günlük ortalama hacim <b>7,5 trilyon dolar<\/b>, küresel finansal hacmin %51'i; <b>swap %50'den fazla<\/b>, spot %28, vadeli yaklaşık %15.<\/li>\n<li><b>Katılımcılar:<\/b> satım tarafı bankalar/aracılar; alım tarafı kurumsal yatırımcılar, portföy yönetim şirketleri, hedge fonlar, merkez bankaları, bireyler (finansal ve finansal olmayan müşteriler). Finansal olmayan müşterilerin payı daha düşüktür.<\/li>\n<li><b>Özellikler:<\/b> işlemler genelde tezgah üstü ve gün boyu; likidite yüksek; çift taraflı (bid/ask) kotasyon; kurları <b>satıcılar kote eder<\/b>; satış fiyatı daima alış fiyatından büyüktür. Amaçlar: hedge, spekülasyon, arbitraj.<\/li>\n<\/ul>\n<h4>Kotasyon<\/h4>\n<ul>\n<li>Kitabın gösterimi: <b>pay = fiyat para birimi (P), payda = baz para birimi (B)<\/b>. USD/EUR = 1,1012 → <b>1 EUR = 1,1012 USD<\/b>.<\/li>\n<li><b>Doğrudan kotasyon:<\/b> fiyat para birimi yerli para (ABD'li için USD/EUR). <b>Dolaylı kotasyon:<\/b> yerli para baz paradır (aynı kotasyon Alman için dolaylıdır).<\/li>\n<li><b>Bid<\/b> satıcının alış, <b>ask<\/b> satıcının satış fiyatıdır. <b>Pip<\/b> = virgülden sonraki 4. basamak; 1,1010/1,1015 arasındaki fark 5 pip = alım-satım makası.<\/li>\n<\/ul>\n<table>\n<tr><th>Faktör<\/th><th>Artarsa makas<\/th><\/tr>\n<tr><td>Likidite<\/td><td>Daralır<\/td><\/tr>\n<tr><td>İşlem büyüklüğü<\/td><td>Genişler<\/td><\/tr>\n<tr><td>Risk (dalgalanma)<\/td><td>Genişler<\/td><\/tr>\n<tr><td>Vade (vadeli piyasada)<\/td><td>Genişler<\/td><\/tr>\n<\/table>\n<ul>\n<li>Türkiye saatiyle Londra'da 17:00, New York'ta 23:00'ten sonra likidite azalır, makas açılır. Vadeli piyasada makas spot piyasadan geniştir (daha az likit).<\/li>\n<li><b>Çapraz kur:<\/b> AUD/USD = 1,2028, USD/EUR = 1,1015 → AUD/EUR = 1,2028 × 1,1015 = <b>1,3248<\/b>. CHF/USD = 1,2129 ise USD/CHF = 1/1,2129 = 0,8244; CHF/EUR = 1,4246 ise USD/EUR = 0,8244 × 1,4246 = <b>1,1744<\/b>.<\/li>\n<li><b>Üçlü arbitraj:<\/b> bankalararası piyasadan hesaplanan örtük çapraz kur ile efektif piyasa kuru farklıysa ucuz piyasadan alıp pahalıya satarak risksiz kâr. Kitap örneği: örtük JPY/GBP 97,92/98,07, efektif 96,83/96,94 → GBP efektiften 96,94'ten alınıp bankalararasında 97,92'den satılır.<\/li>\n<\/ul>\n<h4>Vadeli döviz piyasası<\/h4>\n<ul>\n<li>Vadeler genelde <b>30, 60, 90, 180 gün<\/b>; tezgah üstü (forward) veya borsada (future). Vadeli kur = spot kur ± vade puanı (puan/10.000).<\/li>\n<li>Vadeli kur spottan büyükse baz para <b>primli<\/b>, küçükse <b>iskontolu<\/b>. Örnek: spot 1,1218, 1 yıl vadeli 1,1427 → +209 puan primli; 1,1039 olsaydı -179 iskontolu. USD/GBP spot 1,2520, 1 ay +40 → 1,2560.<\/li>\n<li><b>Korumalı faiz oranı paritesi:<\/b> F(f/d) × (1 + id) = S(f/d) × (1 + if). P/B gösterimiyle: <b>F = S × [1 + ip × (N/360)] / [1 + ib × (N/360)]<\/b>. Örnek: S = 3,6749, ip = %7, ib = %5 → 1 yıl F = 3,6749 × 1,07/1,05 = <b>3,7448<\/b> (699 puan primli); 3 ay F = 3,6930 (181 puan). Vade kısaldıkça puan azalır. Fiyat parasının faizi baz paradan düşükse iskonto: EUR/CHF 1,0510, %1,5 ve %2, 6 ay → 1,0483 (-27).<\/li>\n<li><b>Hedge:<\/b> statik (güncelleme yok) veya dinamik (periyodik güncelleme). <b>Uzun pozisyon<\/b> vadeli sözleşme almak, <b>kısa pozisyon<\/b> satmaktır. Vadeden önce değer, ters işlemle netleştirme ve basit faizle iskonto ile bulunur (mark to market). Örnek: 9 ay vadeli 1,2198'den 1 milyon GBP kısa; 3 ay sonra 6 aylık alış 1,2165 → vadedeki değer 3.300 USD; bugünkü değer 3.300 / (1 + 0,05 × 0,5) = 3.219,51 USD.<\/li>\n<\/ul>\n<h4>Uluslararası parite koşulları<\/h4>\n<table>\n<tr><th>Koşul<\/th><th>Formül<\/th><th>Kitap örneği<\/th><\/tr>\n<tr><td>Korumasız faiz paritesi<\/td><td>%ΔS(f/d) = if - id<\/td><td>Yabancı faiz %15, yerli %7 → yerli para %8 değer kazanır (yüksek faizli para değer kaybeder)<\/td><\/tr>\n<tr><td>Vadeli kur paritesi<\/td><td>(F - S)/S = %ΔS = if - id; F = S × (1 + if)/(1 + id)<\/td><td>S = 2,2340, id %4, if %5 → F = 2,2554 (%1)<\/td><\/tr>\n<tr><td>Mutlak SAGP<\/td><td>Pf = S(f/d) × Pd (tek fiyat kanunu)<\/td><td>-<\/td><\/tr>\n<tr><td>Göreceli SAGP<\/td><td>%ΔS = πf - πd; Se = S × (1 + πf)/(1 + πd)<\/td><td>S = 1,0508, πf %6, πd %4 → 1,0710 (%2)<\/td><\/tr>\n<tr><td>Fisher etkisi<\/td><td>i = r + πe<\/td><td>A: π %10, i %12; B: π %15 → B'de i %17 (reel faizler eşit)<\/td><\/tr>\n<tr><td>Reel faiz farkı modeli<\/td><td>%ΔS = rf - rd<\/td><td>Reel faizler farklıysa kullanılır<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Vadeli kur paritesi:<\/b> vadeli kur gelecekteki spot kurun <b>yansız tahmin edicisidir<\/b>; ampirik olarak kısa dönemde değil uzun dönemde geçerli (forward rate bias). Koşul hem korumalı hem korumasız paritenin geçerli olduğu durumda ortaya çıkar.<\/li>\n<li>Arbitraj örneği: spot 1,2115 ve 3 ay vade puanı +20 ise kur 1,2135 olmalı; vadeli 1,2125 ise ucuz olan <b>vadeli piyasadan alınır, spotta satılır<\/b>.<\/li>\n<li><b>Göreceli SAGP (TL örneği):<\/b> (S1 - S0)/S0 = Türkiye enflasyonu - ABD enflasyonu. 1 dolar = 2 TL, enflasyon %10 ve %4 → (S1 - 2)/2 = 0,06 → <b>S1 = 2,12<\/b>. Kısa dönemde geçerliliği düşüktür.<\/li>\n<li><b>Basit SAGP örneği:<\/b> X malı ABD'de 4 dolar, Türkiye'de 2 TL → SAGP = 2/4 = <b>0,5 TL/dolar<\/b>.<\/li>\n<\/ul>\n\n<h3>Döviz kuru rejimleri<\/h3>\n<table>\n<tr><th>Rejim<\/th><th>Tür<\/th><th>Uygun ülke / para politikası<\/th><\/tr>\n<tr><td>Para kurulu<\/td><td>Sert sabit<\/td><td>Yerli para yasal olarak sabitlenir ve döviz rezervi karşılığında basılır; finansal istikrara ihtiyaç duyan, yüksek enflasyonlu, kredibilitesi düşük ülkeler<\/td><\/tr>\n<tr><td>Dolarizasyon<\/td><td>Sert sabit<\/td><td>Yabancı para (çoğunlukla dolar) kullanılır; büyük ülkeye komşu küçük ülkeler; bağımsız para politikası yok<\/td><\/tr>\n<tr><td>Para birliği<\/td><td>Sert sabit<\/td><td>Ortak para (euro); dış ticaret ağı gelişmiş ülkeler<\/td><\/tr>\n<tr><td>Geleneksel sabit kur, bant içinde sabitleme, sürünen parite, sürünen bant<\/td><td>Yumuşak sabit<\/td><td>Finansal entegrasyonu zayıf, piyasası sığ, ihraç çeşidi az gelişmekte olan ülkeler; para politikası sınırlı<\/td><\/tr>\n<tr><td>Bağımsız dalgalı<\/td><td>Esnek<\/td><td>Derin piyasalı sanayileşmiş ülkeler; müdahale yok; para politikası bağımsız<\/td><\/tr>\n<tr><td>Yönetilen dalgalı<\/td><td>Esnek<\/td><td>Hedef olmadan müdahale; disiplinli gelişmekte olan ülkeler; para politikası göreli bağımsız<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>SDR (Özel Çekme Hakları):<\/b> IMF'nin rezerv varlığı; değeri <b>beş para<\/b> (USD, EUR, JPY, GBP, CNY) esas alınarak belirlenir.<\/li>\n<li><b>Sabit kurun dezavantajları:<\/b> para arzını ayarlama imkânını kısıtlar; zamanla yerli para değerlenip ithalat ve dış açık artar (en büyük dezavantaj ödemeler dengesi sorunları); devalüasyon her zaman çözüm olmaz.<\/li>\n<li><b>Esnek kurun avantajları:<\/b> ödemeler dengesi piyasada kendiliğinden sağlanır, devlet müdahalesine gerek kalmaz; para politikası daha etkin.<\/li>\n<li><b>Karma rejimler:<\/b> <b>kayan kur<\/b> (sürekli takip, en ufak değişikliğe müdahale), <b>ayarlanabilir kur<\/b> (sabite yakın, süreli sabit), <b>ortak dalgalanma<\/b> (birkaç ülke parası birlikte; Avrupa Para Sistemi'ne benzer), <b>gözetimli dalgalanma<\/b> (aşırı dalgalanmada müdahale), <b>döviz kuru bandı<\/b> (önceden ilan edilen alt-üst sınırlar; dar veya geniş bant).<\/li>\n<\/ul>\n<table>\n<tr><th>Faktör<\/th><th>Esnek<\/th><th>Sert sabit<\/th><th>Yumuşak sabit<\/th><\/tr>\n<tr><td>İstikrar<\/td><td>-<\/td><td>+<\/td><td>+<\/td><\/tr>\n<tr><td>Döviz krizine dayanıklılık<\/td><td>+<\/td><td>+<\/td><td>-<\/td><\/tr>\n<tr><td>Şoklara dayanıklılık<\/td><td>+<\/td><td>-<\/td><td>+<\/td><\/tr>\n<tr><td>Para politikası bağımsızlığı<\/td><td>+<\/td><td>-<\/td><td>+/-<\/td><\/tr>\n<\/table>\n<ul>\n<li>Yumuşak sabit kurun en büyük dezavantajı <b>döviz krizlerine duyarlılık<\/b>; güçlü rezerv gerekir.<\/li>\n<\/ul>\n\n<h3>Döviz kuru yaklaşımları<\/h3>\n<ul>\n<li><b>Dış ticaret akımları:<\/b> büyüyen ülkede ithalat ve döviz talebi artar, yerli para değer kaybeder; dünyadan yavaş büyüyenin parası değer kazanır.<\/li>\n<li><b>Parasalcı yaklaşım:<\/b> para talebi sabitken para arzı artışı harcama, ithalat ve döviz talebini artırır; yerli para değer kaybeder.<\/li>\n<li><b>Portföy denge modeli:<\/b> finansal varlık arz-talebi ve <b>ülke risk primi<\/b> belirleyicidir; kalıcı cari ve bütçe açıkları risk primini artırarak yerli parayı uzun dönemde değer kaybettirir.<\/li>\n<li><b>Mundell-Fleming açısından:<\/b> genişletici maliye politikası faizi artırır, sermaye girer, yerli para kısa dönemde değer kazanır, cari açık oluşur; açıklar kalıcılaşınca risk primi artar, sermaye çıkar, para değer kaybeder.<\/li>\n<li><b>Ara kazanç ticareti (carry trade):<\/b> düşük faizli paradan borçlanıp yüksek faizli paraya yatırım; korumasız faiz paritesinin kısa dönemde tutmamasından yararlanır. Getiri dağılımı <b>sola çarpık<\/b> (sık küçük kazanç, nadir büyük kayıp); krizlerde ve kaldıraçla risk büyür.<\/li>\n<\/ul>\n\n<h3>Mundell-Fleming modeli<\/h3>\n<ul>\n<li>Robert Mundell ve Marcus Fleming; IS-LM modelinin <b>açık ekonomiye<\/b> uyarlanmış hali (IS-LM-BP). İki temel varsayım: <b>tam sermaye hareketliliği<\/b> ve <b>sabit döviz kuru<\/b>.<\/li>\n<li><b>Üçlü açmaz:<\/b> tam sermaye hareketliliği ve sabit kur altında para politikası özerkliğini yitirir. BP = 0 doğrusunda yerli faiz dünya faizine eşittir; tam hareketlilikte BP <b>yataydır<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Tam sermaye hareketliliği<\/th><th>Para politikası<\/th><th>Maliye politikası<\/th><\/tr>\n<tr><td>Sabit kur<\/td><td>Etkin değil<\/td><td>Etkin<\/td><\/tr>\n<tr><td>Esnek kur<\/td><td>Etkin<\/td><td>Etkin değil<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Sabit kur + para politikası:<\/b> LM sağa → faiz dünya faizinin altına → sermaye çıkışı → yerli para değer kaybetmeye başlar → MB döviz satıp yerli para çeker → LM eski yerine döner; gelir değişmez.<\/li>\n<li><b>Sabit kur + maliye politikası:<\/b> IS sağa → faiz yükselir → sermaye girişi → MB döviz alıp para arzını artırır → LM de sağa kayar; aynı faizde daha yüksek gelir.<\/li>\n<li><b>Esnek kur + para politikası:<\/b> LM sağa → faiz düşer → sermaye çıkışı → yerli para değer kaybeder → ihracat artar, ithalat azalır → IS sağa; aynı faizde daha yüksek gelir.<\/li>\n<li><b>Esnek kur + maliye politikası:<\/b> IS sağa → faiz yükselir → sermaye girişi → yerli para değer kazanır → ithalat artar, net ihracat düşer → IS eski yerine döner; gelir değişmez.<\/li>\n<\/ul>\n<table>\n<tr><th>Sınırlı sermaye hareketliliği<\/th><th>Para politikası<\/th><th>Maliye politikası<\/th><\/tr>\n<tr><td>Sabit kur<\/td><td>Etkin değil<\/td><td>Etkin değil<\/td><\/tr>\n<tr><td>Esnek kur<\/td><td>Etkin<\/td><td>Etkin<\/td><\/tr>\n<\/table>\n<ul>\n<li>Sınırlı hareketlilikte BP pozitif eğimlidir (daha dik). Genişletici para politikası faizi düşürür, geliri artırır; hem sermaye çıkışı hem ithalat artışıyla dış açık oluşur. Genişletici maliye politikasında faiz artışı sermaye çeker ama gelir artışı ithalatı artırır; net etki büyüklüklere bağlıdır.<\/li>\n<li>İç faiz dünya faizinden yüksekse yerli para değer kazanır, ihracat azalır, ithalat artar; düşükse tersi.<\/li>\n<\/ul>", "sorular": [{"q": "Türkiye tüm kaynaklarıyla 6 ton çay veya 4 ton pamuk, Fransa 2 ton çay veya 1 ton pamuk üretebilmektedir. Karşılaştırmalı üstünlükler teorisine göre hangisi doğrudur?", "o": ["Türkiye pamukta, Fransa çayda uzmanlaşmalıdır", "Türkiye çayda, Fransa pamukta uzmanlaşmalıdır", "Türkiye her iki malı da üretmeli, ticaret olmamalıdır", "Fransa her iki malda da üstündür", "Ticaret yalnız mutlak üstünlükle açıklanabilir"], "a": 0, "e": "Türkiye'nin üstünlüğü çayda 6:2 = 3 kat, pamukta 4:1 = 4 kattır; göreli üstünlüğü pamukta daha büyük olduğu için Türkiye pamukta, Fransa çayda uzmanlaşır."}, {"q": "Faktör donatımı teorisine göre sermaye yoğun mal ihraç etmesi beklenen ABD'nin emek yoğun mal ihraç edip sermaye yoğun mal ithal etmesi nasıl adlandırılır?", "o": ["Hollanda Hastalığı", "Gresham Kanunu", "Stolper-Samuelson Teoremi", "Leontief Paradoksu", "Değer paradoksu"], "a": 3, "e": "Leontief Paradoksu'nun açıklaması olarak ABD işçilerinin verimliliğinin yüksek olması gösterilmektedir."}, {"
