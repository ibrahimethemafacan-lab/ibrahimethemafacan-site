<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.opts2 select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}
.opts2 .rates{display:inline-flex;background:var(--line2);border-radius:9px;padding:2px}
.opts2 .rates button{border:0;background:transparent;padding:4px 8px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}

<script>
const S=[{"id": 1, "kisa": "Arz, Talep ve Esneklik", "baslik": "Temel Kavramlar I: Ekonominin Temelleri, Arz-Talep ve Esneklik", "ozet": "Ekonominin temel soruları, fayda ve tüketici dengesi, üretim olanakları eğrisi, arz-talep kanunları, piyasa dengesi ve esneklik hesapları.", "notlar": "<h3>Ekonominin tanımı ve sınıflandırmalar<\/h3>\n<ul>\n<li><b>Ekonomi:<\/b> sınırsız ihtiyaçların sınırlı (kıt) kaynaklarla en iyi nasıl karşılanacağını inceler. <b>Kıtlık<\/b> = kaynakların ihtiyaçlar karşısında sınırlı kalması.<\/li>\n<li><b>Ekonomik birimler (aktörler):<\/b> hane halkları, firmalar, devlet, dış âlem. Temel nokta birey ve ailedir.<\/li>\n<\/ul>\n<table>\n<tr><th>Ayrım<\/th><th>Birinci<\/th><th>İkinci<\/th><\/tr>\n<tr><td>Normatif / Pozitif<\/td><td><b>Normatif:<\/b> ne olması gerektiği (\"işsizlik oranı ne olmalı?\")<\/td><td><b>Pozitif:<\/b> sebep-sonuç ilişkisi (\"reel faiz artışı tüketimi nasıl etkiler?\")<\/td><\/tr>\n<tr><td>Kısmi / Genel denge<\/td><td><b>Kısmi:<\/b> diğer faktörlerin etkisi ihmal edilir<\/td><td><b>Genel:<\/b> diğer unsurlar da aynı anda incelemeye katılır<\/td><\/tr>\n<tr><td>Statik / Dinamik<\/td><td><b>Statik:<\/b> zaman boyutu ihmal edilir<\/td><td><b>Dinamik:<\/b> zaman boyutu öne çıkar<\/td><\/tr>\n<tr><td>Mikro / Makro<\/td><td><b>Mikro:<\/b> birey ve firma; fayda, bütçe, kâr, maliyet, fiyat mekanizması, piyasa türleri, bir malın fiyatı<\/td><td><b>Makro:<\/b> toplum geneli; milli gelir, istihdam, fiyatlar genel düzeyi, enflasyon, yatırım, tasarruf, büyüme, ödemeler bilançosu<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Üç temel soru:<\/b> ne ve ne miktarda üretilecek; nasıl üretilecek; kimin için üretilecek (bölüşüm). İlk soru <b>fiyat teorisinin<\/b> altyapısını oluşturur. İkinci soru maliyetleri en aza indirme amacıyla ilgilidir.<\/li>\n<li><b>Ceteris paribus:<\/b> \"diğer her şey sabitken\". Bir değişkenin etkisi incelenirken diğer tüm değişkenler sabit varsayılır.<\/li>\n<\/ul>\n<h4>Ekonomik sistemler<\/h4>\n<table>\n<tr><th>Sistem<\/th><th>Özellik<\/th><\/tr>\n<tr><td>Merkezi (planlı)<\/td><td>Üretim araçları ve mülkiyet kamuda; fiyat mekanizması işlemez.<\/td><\/tr>\n<tr><td>Liberal (serbest piyasa)<\/td><td>Homo economicus (rasyonel, kendi çıkarını gözeten birey); üreticide kâr, tüketicide fayda maksimizasyonu; özel mülkiyet; \"Laissez faire, laissez passer\" (bırakınız yapsınlar, bırakınız geçsinler); fiyat mekanizması işler.<\/td><\/tr>\n<tr><td>Karma<\/td><td>Özel mülkiyet ile kamu mülkiyeti bir arada; piyasa çözemezse devlet politikayla müdahale eder. Günümüzde en yaygın uygulanan.<\/td><\/tr>\n<\/table>\n\n<h3>İhtiyaç, fayda ve değer<\/h3>\n<ul>\n<li><b>İhtiyacı belirleyenler:<\/b> çevre; alışkanlık, toplumsal değer, moda, beklenti; dini unsurlar; biyolojik faktörler; etik.<\/li>\n<li>Yalnız mal ve hizmetle giderilen ihtiyaçlar <b>ekonomik<\/b>tir (beslenme ekonomik; daha uzun boylu olma isteği değil).<\/li>\n<li><b>Özellikleri:<\/b> sınırsızdır; şiddeti kişiye göre değişir ve giderildikçe azalır; süreklidir; karşılayan mallar birbirinin yerine geçebilir.<\/li>\n<\/ul>\n<h4>Kardinal fayda<\/h4>\n<ul>\n<li>Fayda <b>util<\/b> ile ölçülebilir. <b>Marjinal fayda (MU)<\/b> = her ilave birimin toplam faydaya katkısı. İlave birimlerin faydasının düşmesi = <b>azalan marjinal fayda kanunu<\/b>.<\/li>\n<li>Diğer varsayımlar: bir malın faydası herkes için aynıdır (fayda objektif); amaç maksimum fayda; bütçe kısıtı vardır; malların faydaları birbirini etkilemez.<\/li>\n<li><b>Tüketici dengesi:<\/b> MU(A)/P(A) = MU(B)/P(B) = MU(C)/P(C).<\/li>\n<\/ul>\n<table>\n<tr><th>Bardak<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr>\n<tr><td>Toplam fayda<\/td><td>8<\/td><td>14<\/td><td>17<\/td><td>19<\/td><td>19<\/td><td>17<\/td><\/tr>\n<tr><td>Marjinal fayda<\/td><td>8<\/td><td>6<\/td><td>3<\/td><td>2<\/td><td>0<\/td><td>-2<\/td><\/tr>\n<\/table>\n<ul>\n<li>Toplam faydanın maksimum olduğu nokta = <b>doyum noktası<\/b>; burada <b>marjinal fayda = 0<\/b>. Toplam fayda azalırken marjinal fayda negatiftir.<\/li>\n<\/ul>\n<h4>Ordinal fayda ve kayıtsızlık eğrileri<\/h4>\n<ul>\n<li>Fayda ölçülemez, yalnız <b>tercih sırası<\/b> kurulabilir; kayıtsızlık (farksızlık) eğrileriyle gösterilir. Eksenlerde iki malın <b>tüketim miktarları<\/b> vardır.<\/li>\n<li><b>Özellikler:<\/b> negatif eğimli; eğim = <b>marjinal ikame oranı<\/b>, MRS = -ΔA/ΔB; eğri üzerindeki her nokta aynı faydayı verir; eğriler <b>kesişmez<\/b>; orijine göre <b>dışbükey<\/b> (nedeni <b>azalan MRS<\/b>); orijinden uzaklaştıkça fayda artar.<\/li>\n<li><b>Bütçe doğrusu:<\/b> M = P(A) × A + P(B) × B. Dikey eksende A varken eksen kesişimleri M/P(A) ve M/P(B); eğim = -P(B)/P(A).<\/li>\n<li><b>Tüketici dengesi:<\/b> kayıtsızlık eğrisinin bütçe doğrusuna <b>teğet<\/b> olduğu nokta: ΔA/ΔB = P(B)/P(A) = MU(B)/MU(A).<\/li>\n<li><b>Özel eğriler:<\/b> tam tamamlayıcı mallar → <b>L şekli<\/b> (kitapta MRS sıfır); tam ikame mallar → iki ekseni kesen doğru, <b>MRS sabit<\/b>; bir mal kötü (ör. hava kirliliği), diğeri normalse → <b>pozitif eğimli<\/b>.<\/li>\n<\/ul>\n<h4>Değer<\/h4>\n<ul>\n<li>Değer, mal ve hizmete verilen <b>sübjektif<\/b> önemdir. Kişisel değer = <b>kullanım değeri<\/b>; takastan doğan = <b>mübadele değeri<\/b>. Paranın mal karşısındaki mübadele değeri <b>fiyattır<\/b>; mallar arası karşılaştırma <b>nispi fiyatı<\/b> verir.<\/li>\n<li><b>Elmas-su (değer) paradoksu:<\/b> suyun toplam faydası yüksek ama bol olduğu için değeri düşük; elmas nadir olduğu için değerli. Elmas daha yüksek fiyatlı ve daha dik talep eğrili olup daha <b>düşük tüketici rantı<\/b> sağlar.<\/li>\n<\/ul>\n\n<h3>Mal, hizmet, üretim ve faktörler<\/h3>\n<ul>\n<li><b>Hizmet<\/b> bir meta olmadan ihtiyacı karşılar; <b>akım değişkendir<\/b>, stoklanamaz.<\/li>\n<li><b>Serbest mal:<\/b> bol, bedelsiz (hava, güneş ışığı); fiyat, piyasa ve sahiplik kavramı yoktur. <b>Ekonomik mal:<\/b> kıt ve bedel karşılığı.<\/li>\n<li>Ekonomik mal → <b>tüketim malı<\/b> (dayanıklı: buzdolabı; dayanıksız: ekmek) ve <b>üretim malı<\/b> (sermaye malı: üretimde yapısı değişmeyen, ör. bina; ara mal: un; hammadde: buğday).<\/li>\n<li>Diğer ayrımlar: taşınır-taşınmaz; <b>tamamlayıcı<\/b> (çay-şeker) - <b>ikame<\/b> (beyaz et-kırmızı et); çoğaltılabilen (ekmek) - çoğaltılamayan (heykeltıraşı ölmüş heykel).<\/li>\n<li><b>Üretim:<\/b> malın miktarını ya da faydasını artırma. Fayda artırma türleri: <b>şekil<\/b> (deriden giysi), <b>mekân<\/b> (kabanın soğuk bölgeye taşınması), <b>zaman<\/b> (portakalın yaza saklanması), <b>mülkiyet<\/b> (malın en çok ihtiyacı olana geçmesi).<\/li>\n<\/ul>\n<table>\n<tr><th>Üretim faktörü<\/th><th>Geliri<\/th><th>Not<\/th><\/tr>\n<tr><td>Emek<\/td><td>Ücret<\/td><td>Kas ve zihin gücü<\/td><\/tr>\n<tr><td>Sermaye (fiziksel ve beşeri)<\/td><td>Faiz<\/td><td>İnsan eliyle üretilir; fakirlik ve orta gelir tuzağından çıkışta en önemli unsur <b>beşeri sermaye<\/b> birikimidir<\/td><\/tr>\n<tr><td>Doğal kaynaklar<\/td><td>Rant<\/td><td>Eşit dağılmamaları bölgesel farklılıkların en önemli nedeni<\/td><\/tr>\n<tr><td>Girişimci<\/td><td>Kâr<\/td><td>Diğer faktörleri birleştirir, risk alır<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Üretim fonksiyonu:<\/b> Q = A × f(K, L). A = teknoloji parametresi (emek ve sermaye dışındaki faktörlerin etkisi).<\/li>\n<li><b>Fırsat maliyeti:<\/b> bir seçim yapılırken vazgeçilen alternatif. Eğitim almanın fırsat maliyeti, o süre çalışılsaydı alınacak ücrettir.<\/li>\n<li><b>Engel eğrisi:<\/b> fiyat ve tercihler sabitken her gelir düzeyinde alınan mal miktarını gösterir; <b>talebin gelir esnekliğinin<\/b> grafiğidir. Ernst Engel gelir-tüketim ilişkisini ampirik olarak inceleyen ilk bilim insanıdır.<\/li>\n<\/ul>\n\n<h3>Üretim olanakları eğrisi (ÜOE)<\/h3>\n<ul>\n<li><b>Varsayımlar:<\/b> kısa dönemde faktörler artırılamaz ve tam kullanılır; azalan verimler yasası geçerlidir; yalnız iki mal üretilir.<\/li>\n<li>Negatif eğimli, orijine göre <b>içbükey<\/b>; <b>artan fırsat maliyeti<\/b>. Eğim = <b>marjinal dönüşüm oranı<\/b>, MRT = -ΔBuğday/ΔBilgisayar = fırsat maliyeti.<\/li>\n<li><b>İçbükeyliğin iki nedeni:<\/b> (1) kaydırılan girdilerin önce yeni mala en uygun olanlardan, sonra uygun olmayanlardan seçilmesi; (2) azalan verimler yasası.<\/li>\n<li>Sabit fırsat maliyeti → eğri <b>doğru<\/b>; azalan fırsat maliyeti → orijine göre <b>dışbükey<\/b>.<\/li>\n<li>Eğrinin <b>içindeki<\/b> nokta: eksik kapasite, atıl kaynak, işsizlik (üretim mümkün ama etkin değil). <b>Dışındaki<\/b> nokta: kaynak yetersiz, üretim imkânsız.<\/li>\n<li><b>Sağa kayma:<\/b> emek veya sermaye artışı, teknolojik gelişme, verim artırıcı inovasyon. Sola kayma: bu faktörlerde düşüş.<\/li>\n<\/ul>\n\n<h3>Arz<\/h3>\n<ul>\n<li>Belirli zaman ve fiyatta malın piyasaya <b>satmak amacıyla<\/b> sunulmasıdır. <b>Arz kanunu:<\/b> fiyat ile arz edilen miktar aynı yönlü; arz eğrisi <b>pozitif eğimli<\/b>. Fonksiyon: Qs = a + bP.<\/li>\n<li><b>Piyasa arzı:<\/b> her fiyatta bireysel arz miktarlarının toplamı (kitap örneği: fiyat 3 iken 50, fiyat 4 iken 64).<\/li>\n<li><b>Malın kendi fiyatı<\/b> değişirse eğri <b>üzerinde hareket<\/b> olur (arz edilen miktar değişir). Diğer faktörler değişirse eğri <b>kayar<\/b> (arz değişir).<\/li>\n<li><b>Arzı artıran (sağa kaydıran):<\/b> üretim maliyetinin düşmesi; teknolojik gelişme; üretici sayısının artması; üretici tercihinin o mala yönelmesi; malın fiyatının <b>ileride düşeceği<\/b> beklentisi.<\/li>\n<li>Aynı girdilerle üretilen <b>diğer malın fiyatı artarsa<\/b> bu malın arzı azalır (sola kayar).<\/li>\n<\/ul>\n\n<h3>Talep<\/h3>\n<ul>\n<li><b>Talep kanunu:<\/b> fiyat ile talep edilen miktar ters yönlü; talep eğrisi <b>negatif eğimli<\/b>. Fonksiyon: Qd = a - bP. Piyasa talebi bireysel taleplerin toplamıdır.<\/li>\n<li>Kendi fiyat değişimi → eğri üzerinde hareket (kitap örneği: fiyat 3'ten 4'e çıkınca miktar 64'ten 50'ye). Fiyat dışı faktörler → kayma.<\/li>\n<li><b>Talebi artıran (sağa kaydıran):<\/b> gelir artışı (normal malda); tüketici sayısı/nüfus artışı; <b>tamamlayıcı malın fiyatının düşmesi<\/b>; <b>ikame malın fiyatının artması<\/b>; zevkin o mala yönelmesi; fiyatın <b>ileride artacağı<\/b> beklentisi.<\/li>\n<li>Örnekler: benzin fiyatı artarsa araba talebi azalır (tamamlayıcı); kırmızı et pahalanırsa beyaz et talebi artar (ikame).<\/li>\n<li><b>Tüketici rantı:<\/b> ödemeye razı olunan en yüksek fiyat ile ödenen fiyat arasındaki fark. Doğrusal talepte: Tüketici rantı = (P1 - P0) × Q / 2 (üçgen alanı; P1 eğrinin dikey ekseni kestiği fiyat).<\/li>\n<\/ul>\n<h4>Normal, düşük, Giffen ve Veblen mallar<\/h4>\n<ul>\n<li><b>Normal mal:<\/b> gelir artınca talebi artar; talep yasası her zaman geçerli (et, araba, kıyafet).<\/li>\n<li><b>Düşük mal:<\/b> gelir artınca talebi azalır; talep eğrisi negatif ya da pozitif eğimli olabilir.<\/li>\n<li><b>Giffen malı:<\/b> fiyatı artarken talep edilen miktarı da artar. Henry Giffen, İrlanda'da yoksul işçilerin patates talebinde gözlemledi. Şartları: tüketici bütçesinde çok önemli yer tutması, gerekli mal olması, düşük mal olması.<\/li>\n<li>Dikkat: <b>Her Giffen malı düşük maldır; her düşük mal Giffen malı değildir.<\/b><\/li>\n<li><b>Veblen malı:<\/b> gösteriş amaçlı; fiyatı arttıkça talebi artar.<\/li>\n<\/ul>\n<h4>Gelir etkisi ve ikame etkisi<\/h4>\n<ul>\n<li><b>İkame etkisi<\/b> (Hicksgil/net ikame etkisi) nispi fiyat değişiminden doğar ve <b>her zaman negatiftir<\/b>. <b>Gelir etkisi<\/b> reel alım gücündeki değişimden doğar.<\/li>\n<\/ul>\n<table>\n<tr><th>Mal<\/th><th>İkame etkisi<\/th><th>Gelir etkisi<\/th><th>Toplam etki / talep eğrisi<\/th><\/tr>\n<tr><td>Normal<\/td><td>Negatif<\/td><td>Negatif<\/td><td>Negatif / negatif eğimli<\/td><\/tr>\n<tr><td>Düşük<\/td><td>Negatif (mutlak değerce büyük)<\/td><td>Pozitif (küçük)<\/td><td>Negatif / negatif eğimli<\/td><\/tr>\n<tr><td>Giffen<\/td><td>Negatif (küçük)<\/td><td>Pozitif (büyük)<\/td><td>Pozitif / pozitif eğimli<\/td><\/tr>\n<tr><td>Veblen<\/td><td>Negatif (küçük)<\/td><td>Pozitif (büyük)<\/td><td>Pozitif / pozitif eğimli<\/td><\/tr>\n<\/table>\n\n<h3>Piyasa dengesi<\/h3>\n<ul>\n<li>Denge, arz ve talep eğrilerinin kesiştiği noktadır; arz veya talep fazlası yoktur.<\/li>\n<li>Kitap örneği: denge fiyatı 6, miktar 15. Fiyat 8 olursa talep 10, arz 20 → <b>10 birim arz fazlası<\/b>. Fiyat 4 olursa talep 20, arz 10 → <b>10 birim talep fazlası<\/b>.<\/li>\n<li><b>Hesap:<\/b> Qs = 4 + 4P, Qd = 40 - 5P → 4 + 4P = 40 - 5P → 9P = 36 → <b>P = 4, Q = 20<\/b>.<\/li>\n<li>Maliyet düşüşü → arz sağa → fiyat düşer, miktar artar. Maliyet artışı → arz sola → fiyat artar, miktar azalır.<\/li>\n<li>Gelir artışı → talep sağa → fiyat ve miktar artar. Gelir azalışı → ikisi de azalır.<\/li>\n<\/ul>\n<table>\n<tr><th>Arz ve talep değişimi<\/th><th>Denge miktarı<\/th><th>Denge fiyatı<\/th><\/tr>\n<tr><td>Arz ve talep aynı oranda artar<\/td><td>Artar<\/td><td>Değişmez<\/td><\/tr>\n<tr><td>Arz ve talep aynı oranda azalır<\/td><td>Azalır<\/td><td>Değişmez<\/td><\/tr>\n<tr><td>Arz artar, talep aynı oranda azalır<\/td><td>Değişmez<\/td><td>Düşer<\/td><\/tr>\n<tr><td>Arz azalır, talep aynı oranda artar<\/td><td>Değişmez<\/td><td>Artar<\/td><\/tr>\n<tr><td>Arz artışı talep artışından büyük<\/td><td>Artar<\/td><td>Düşer<\/td><\/tr>\n<tr><td>Arz artışı talep artışından küçük<\/td><td>Artar<\/td><td>Artar<\/td><\/tr>\n<tr><td>Arz azalışı talep artışından büyük<\/td><td>Azalır<\/td><td>Artar<\/td><\/tr>\n<\/table>\n\n<h3>Esneklik<\/h3>\n<ul>\n<li><b>Talebin fiyat esnekliği<\/b> = talep miktarındaki % değişim / fiyattaki % değişim = [(Q2 - Q1)/Q1] / [(P2 - P1)/P1].<\/li>\n<li><b>Örnek:<\/b> fiyat 10 TL'den 15 TL'ye, miktar 200'den 160'a: (-40/200) / (5/10) = -0,2 / 0,5 = <b>-0,4<\/b>. Fiyat %1 artınca talep %0,4 azalır (inelastik).<\/li>\n<li><b>Nokta esnekliği<\/b> = (ΔQ/ΔP) × (P/Q); sürekli fonksiyonda türev: (dQ/dP) × (P/Q).<\/li>\n<li><b>Yay esnekliği (orta nokta):<\/b> [(Q2 - Q1) / ((Q1 + Q2)/2)] / [(P2 - P1) / ((P1 + P2)/2)] = (ΔQ/ΔP) × (P1 + P2)/(Q1 + Q2).<\/li>\n<li><b>Çapraz esneklik<\/b> = A malının talep miktarındaki % değişim / B malının fiyatındaki % değişim. <b>Negatif → tamamlayıcı; pozitif → ikame; sıfır → bağımsız<\/b>.<\/li>\n<li><b>Gelir esnekliği<\/b> = talep miktarındaki % değişim / gelirdeki % değişim = [(Q2 - Q1)/Q1] / [(Y2 - Y1)/Y1].<\/li>\n<li><b>Birim esnek talep eğrisi:<\/b> Q = A × P üzeri -1; her noktada esneklik 1 (mutlak değer).<\/li>\n<\/ul>\n<table>\n<tr><th>Durum<\/th><th>Esneklik (mutlak)<\/th><th>Eğri<\/th><\/tr>\n<tr><td>Tam esnek (sonsuz esnek)<\/td><td>Sonsuz<\/td><td>Yatay eksene paralel<\/td><\/tr>\n<tr><td>Esnek<\/td><td>1'den büyük<\/td><td>Yatık<\/td><\/tr>\n<tr><td>Birim esnek<\/td><td>1<\/td><td>Fiyat ve miktar aynı % değişir<\/td><\/tr>\n<tr><td>İnelastik<\/td><td>0 ile 1 arası<\/td><td>Dike yakın<\/td><\/tr>\n<tr><td>Tam inelastik<\/td><td>0<\/td><td>Dikey eksene paralel<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Arz esnekliği<\/b> = arz miktarındaki % değişim / fiyattaki % değişim. 0 ile 1 arası inelastik, 1 birim esnek, 1'den büyük esnek. Arz esnekliği pozitiftir (arz kanunu).<\/li>\n<li>Dikkat: Talep eğrisi dikey ise talep <b>tam inelastiktir<\/b> (esneklik 0); yatay ise <b>sonsuz esnektir<\/b>.<\/li>\n<\/ul>", "sorular": [{"q": "\"Yıllık büyüme hızı ne olmalıdır?\" sorusu ekonominin hangi yaklaşımının alanına girer?", "o": ["Normatif ekonomi", "Pozitif ekonomi", "Kısmi denge analizi", "Dinamik analiz", "Mikro ekonomi"], "a": 0, "e": "Ne olması gerektiğini tartışan sorular normatif ekonominin konusudur. Pozitif ekonomi sebep-sonuç ilişkisini inceler."}, {"q": "Aşağıdakilerden hangisi makro ekonominin inceleme alanına girer?", "o": ["Bir firmanın marjinal maliyeti", "Tüketicinin bütçe kısıtı", "Monopol firmanın dengesi", "Fiyatlar genel düzeyi ve enflasyon", "Bir malın piyasa fiyatı"], "a": 3, "e": "Fiyatlar genel düzeyi, enflasyon, milli gelir, istihdam gibi toplam büyüklükler makro ekonominin konusudur; diğerleri mikro konulardır."}, {"q": "Bir tüketicinin tükettiği 4. bardak sodanın toplam faydası 19, 5. bardağın toplam faydası da 19 util ise 5. bardağın marjinal faydası ve bu noktanın adı nedir?", "o": ["19 – doyum noktası", "0 – doyum noktası", "19 – denge noktası", "-2 – kapanma noktası", "2 – başabaş noktası"], "a": 1, "e": "Marjinal fayda = 19 - 19 = 0. Toplam faydanın maksimum olduğu, marjinal faydanın sıfır olduğu nokta doyum noktasıdır."}, {"q": "Kayıtsızlık eğrilerinin orijine göre dışbükey olmasının nedeni nedir?", "o": ["Azalan marjinal fayda", "Artan fırsat maliyeti", "Azalan marjinal teknik ikame oranı", "Azalan verimler yasası", "Azalan marjinal ikame oranı"], "a": 4, "e": "Kayıtsızlık eğrilerinin dışbükeyliği azalan marjinal ikame oranından (MRS) kaynaklanır. Eş ürün eğrisinde ise neden azalan marjinal teknik ikame oranıdır."}, {"q": "İki maldan birinin hava kirliliği gibi kötü bir mal, diğerinin normal mal olduğu durumda kayıtsızlık eğrisinin biçimi nasıldır?", "o": ["L şeklindedir", "İki ekseni kesen negatif eğimli bir doğrudur", "Pozitif eğimlidir", "Yatay eksene paraleldir", "Orijine göre içbükeydir"], "a": 2, "e": "Aynı fayda düzeyinde kalmak için kötü malın tüketimi arttığında normal malın tüketimi de artmalıdır; bu yüzden eğri pozitif eğimlidir."}, {"q": "Ordinal fayda yaklaşımında tüketici dengesi hangi noktada gerçekleşir?", "o": ["Kayıtsızlık eğrisinin bütçe doğrusuna teğet olduğu noktada", "Arz ve talep eğrilerinin kesiştiği noktada", "Eş ürün eğrisinin eş maliyet doğrusuna teğet olduğu noktada", "Bütçe doğrusunun yatay ekseni kestiği noktada", "Marjinal faydanın sıfır olduğu noktada"], "a": 0, "e": "Tüketici dengesi kayıtsızlık eğrisi ile bütçe doğrusunun teğet olduğu, eğimlerinin eşitlendiği noktadır. Eş ürün ve eş maliyet teğetliği üretici dengesidir."}, {"q": "Üretim faktörü ve elde ettiği gelir eşleştirmelerinden hangisi yanlıştır?", "o": ["Emek – ücret", "Sermaye – faiz", "Doğal kaynak – rant", "Sermaye – rant", "Girişimci – kâr"], "a": 3, "e": "Sermayenin geliri faizdir; rant doğal kaynakların geliridir."}, {"q": "Unu buğdaydan üreten bir değirmen için buğday ve un sırasıyla hangi mal türüne örnektir?", "o": ["Sermaye malı – tüketim malı", "Hammadde – ara mal", "Ara mal – hammadde", "Dayanıklı tüketim malı – ara mal", "Serbest mal – ekonomik mal"], "a": 1, "e": "Kitaptaki örnekte ekmeğin üretiminde buğday hammadde, buğdayın öğütülmesiyle elde edilen un ara maldır."}, {"q": "Üretim olanakları eğrisinin iç kısmındaki bir nokta neyi gösterir?", "o": ["Mevcut kaynaklarla ulaşılamayan üretimi", "Etkin üretimi", "Sabit fırsat maliyetini", "Teknolojik gelişmeyi", "Atıl kaynak ve eksik kapasiteyle yapılan üretimi"], "a": 4, "e": "Eğrinin içi üretimin mümkün ama etkin olmadığı, kaynakların tam kullanılmadığı ve işsizliğin bulunduğu durumdur. Eğrinin dışı ise imkânsız üretimdir."}, {"q": "Aşağıdakilerden hangisi bir malın arz eğrisini sağa kaydırmaz?", "o": ["Üretim maliyetlerinin düşmesi", "Teknolojik gelişme", "Malın kendi fiyatının artması", "Üretici sayısının artması", "Malın fiyatının ileride düşeceği beklentisi"], "a": 2, "e": "Malın kendi fiyatındaki değişme eğri üzerinde harekete yol açar, kaymaya değil. Diğer seçenekler arzı artırarak eğriyi sağa kaydırır."}, {"q": "Benzin fiyatlarındaki sert artışın otomobil talebine etkisi nasıl olur?", "o": ["Otomobil talep eğrisi sola kayar", "Otomobil talep eğrisi sağa kayar", "Otomobil talep eğrisi üzerinde aşağı hareket olur", "Otomobil arz eğrisi sola kayar", "Otomobil talebi değişmez"], "a": 0, "e": "Benzin ile otomobil tamamlayıcı mallardır; tamamlayıcı malın fiyatının artması diğer malın talebini azaltır, talep eğrisi sola kayar."}, {"q": "Arz fonksiyonu Qs = 4 + 4P, talep fonksiyonu Qd = 40 - 5P olan bir malın denge fiyatı ve miktarı nedir?", "o": ["P = 5, Q = 24", "P = 3, Q = 16", "P = 4, Q = 16", "P = 4, Q = 20", "P = 6, Q = 28"], "a": 3, "e": "4 + 4P = 40 - 5P → 9P = 36 → P = 4. Yerine konulursa Q = 4 + 16 = 20."}, {"q": "Bir malda arz artışı oransal olarak talep artışından büyükse denge fiyatı ve miktarı nasıl değişir?", "o": ["Fiyat artar, miktar artar", "Fiyat düşer, miktar artar", "Fiyat değişmez, miktar artar", "Fiyat düşer, miktar değişmez", "Fiyat artar, miktar azalır"], "a": 1, "e": "Arz artışı talep artışından fazlaysa denge fiyatı düşer, denge miktarı artar."}, {"q": "Bir malın fiyatı 20 TL'den 25 TL'ye çıktığında talep edilen miktar 400 birimden 300 birime düşmüştür. Talebin fiyat esnekliği (ilk değerler esas alınarak) kaçtır ve talep nasıldır?", "o": ["-0,25 – inelastik", "-1,25 – inelastik", "-0,8 – esnek", "-1 – tam esnek", "-1 – birim esnek"], "a": 4, "e": "Miktar değişimi -100/400 = -%25; fiyat değişimi 5/20 = %25. Esneklik = -25/25 = -1, mutlak değer 1 olduğu için birim esnektir."}, {"q": "A malının talebi B malının fiyatındaki %10'luk artış karşısında %4 artmıştır. Çapraz esneklik ve iki mal arasındaki ilişki nedir?", "o": ["-0,4 – tamamlayıcı", "2,5 – ikame", "0,4 – ikame", "0 – bağımsız", "-2,5 – tamamlayıcı"], "a": 2, "e": "Çapraz esneklik = %4 / %10 = 0,4. Pozitif çapraz esneklik malların birbirinin ikamesi olduğunu gösterir."}, {"q": "Bir ailenin aylık geliri 10.000 TL'den 12.000 TL'ye çıktığında bir maldan talebi 50 birimden 45 birime düşüyorsa, talebin gelir esnekliği ve malın türü nedir?", "o": ["-0,5 – düşük mal", "0,5 – normal mal", "-2 – düşük mal", "2 – lüks mal", "-0,5 – Giffen malı"], "a": 0, "e": "Talep değişimi -5/50 = -%10, gelir değişimi %20; gelir esnekliği = -10/20 = -0,5. Gelir artınca talebi azalan mal düşük maldır; gelir esnekliğinden Giffen olup olmadığı anlaşılamaz."}, {"q": "Talep eğrisi dikey eksene paralel olan bir mal için hangisi doğrudur?", "o": ["Talep sonsuz esnektir", "Talep birim esnektir", "Talep esnektir", "Talep tam inelastiktir, esneklik sıfırdır", "Fiyat artışı talep edilen miktarı en çok bu durumda azaltır"], "a": 3, "e": "Dikey talep eğrisinde talep edilen miktar fiyattan etkilenmez; esneklik sıfırdır (tam inelastik)."}, {"q": "Giffen malı ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Fiyatı arttıkça talep edilen miktarı artar", "Her düşük mal Giffen malıdır", "Pozitif gelir etkisi negatif ikame etkisinden mutlak değerce büyüktür", "Her Giffen malı düşük maldır", "Tüketici bütçesinde önemli yer tutar"], "a": 1, "e": "Her Giffen malı düşük maldır ama her düşük mal Giffen malı değildir; düşük malların çoğunda talep yasası geçerlidir."}, {"q": "Talep eğrisi üzerinde fiyatın 10, talep edilen miktarın 30 olduğu bir noktada eğrinin dikey ekseni kestiği fiyat 16 ise tüketici rantı kaçtır?", "o": ["180", "240", "60", "480", "90"], "a": 4, "e": "Tüketici rantı = (P1 - P0) × Q / 2 = (16 - 10) × 30 / 2 = 90."}]}, {"id": 2, "kisa": "Üretim, Maliyet, Piyasalar", "baslik": "Temel Kavramlar II: Üretim, Maliyetler ve Piyasa Türleri", "ozet": "Kısa ve uzun dönem üretim, maliyet eğrileri, ölçek ekonomileri, tam rekabet, monopol, monopolcü rekabet ve oligopol (düopol) modelleri.", "notlar": "<h3>Kısa dönem üretim<\/h3>\n<ul>\n<li><b>Üretim fonksiyonu:<\/b> Q = f(K, L). K sermaye, L emek.<\/li>\n<li><b>Sabit girdi:<\/b> kısa dönemde miktarı değiştirilemez. <b>Değişken girdi:<\/b> değiştirilebilir. Kısa dönemde <b>emek değişken, sermaye sabit<\/b>; uzun dönemde ikisi de değişken.<\/li>\n<li><b>Toplam ürün (TP):<\/b> toplam çıktı. <b>Ortalama ürün:<\/b> AP = TP / L. <b>Marjinal ürün:<\/b> MP = ΔTP / ΔL (her ilave işçinin katkısı).<\/li>\n<\/ul>\n<table>\n<tr><th>Emek<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><th>10<\/th><\/tr>\n<tr><td>TP<\/td><td>20<\/td><td>60<\/td><td>120<\/td><td>160<\/td><td>180<\/td><td>198<\/td><td>208<\/td><td>216<\/td><td>216<\/td><td>200<\/td><\/tr>\n<tr><td>AP<\/td><td>20<\/td><td>30<\/td><td>40<\/td><td>40<\/td><td>36<\/td><td>33<\/td><td>29<\/td><td>27<\/td><td>24<\/td><td>20<\/td><\/tr>\n<tr><td>MP<\/td><td>20<\/td><td>40<\/td><td>60<\/td><td>40<\/td><td>20<\/td><td>18<\/td><td>10<\/td><td>8<\/td><td>0<\/td><td>-16<\/td><\/tr>\n<\/table>\n<ul>\n<li>3. işçiye kadar <b>artan verim<\/b>; 4. işçiden itibaren MP azalır: <b>azalan verimler kanunu<\/b> (değişken faktör arttıkça verimliliği azalır).<\/li>\n<li>MP = AP olduğu düzeyde (4. işçi) <b>AP en yüksektir<\/b>. Bu noktadan sonra MP, AP'nin altında kalır.<\/li>\n<li><b>TP maksimumken MP = 0<\/b> (9. işçi). 10. işçide MP negatif; üretime zarar verir.<\/li>\n<li>MP, AP'nin <b>üzerindeyken AP artar<\/b> (MP azalıyor olsa bile); MP, AP'nin altına inince AP düşer.<\/li>\n<li><b>Üç bölge:<\/b> I. bölgede MP ve AP birlikte artar; II. bölgede MP düşerken AP artmaya devam eder; III. bölgede MP negatiftir.<\/li>\n<li>Dikkat: \"MP'nin azaldığı her yerde AP de azalır\" ifadesi <b>yanlıştır<\/b>.<\/li>\n<\/ul>\n\n<h3>Uzun dönem: eş ürün analizi<\/h3>\n<ul>\n<li><b>Eş ürün eğrileri<\/b> aynı üretim düzeyini veren K ve L bileşimlerini gösterir (dikey eksen K, yatay eksen L).<\/li>\n<li><b>Özellikler:<\/b> negatif eğimli; eğim = <b>marjinal teknik ikame oranı<\/b>, MRTS = -ΔK/ΔL; her nokta aynı üretim; birbirini kesmez; orijine göre dışbükey (nedeni <b>azalan MRTS<\/b>); orijinden uzak eğri daha yüksek üretim (Q3 &gt; Q2 &gt; Q1).<\/li>\n<li><b>Eş maliyet doğrusu:<\/b> C = P(K) × K + P(L) × L. P(K) = sermayenin fiyatı, yani <b>faiz (r)<\/b>; P(L) = emeğin fiyatı, yani <b>ücret (w)<\/b>. Eksen kesişimleri C/P(K) ve C/P(L); eğim = -P(L)/P(K).<\/li>\n<li><b>Üretici dengesi:<\/b> eş ürün eğrisinin eş maliyet doğrusuna <b>teğet<\/b> olduğu nokta: ΔK/ΔL = P(L)/P(K) = MP(L)/MP(K).<\/li>\n<\/ul>\n<table>\n<tr><th>Kavram<\/th><th>Eğri<\/th><th>Eğimi<\/th><\/tr>\n<tr><td>Tüketici dengesi<\/td><td>Kayıtsızlık eğrisi + bütçe doğrusu<\/td><td>MRS<\/td><\/tr>\n<tr><td>Üretici dengesi<\/td><td>Eş ürün eğrisi + eş maliyet doğrusu<\/td><td>MRTS<\/td><\/tr>\n<tr><td>Üretim olanakları<\/td><td>ÜOE<\/td><td>MRT (fırsat maliyeti)<\/td><\/tr>\n<\/table>\n\n<h3>Maliyetler<\/h3>\n<table>\n<tr><th>Maliyet<\/th><th>Tanım / formül<\/th><\/tr>\n<tr><td>Toplam sabit maliyet (TFC)<\/td><td>Üretim miktarından bağımsız (kira, bakım)<\/td><\/tr>\n<tr><td>Ortalama sabit maliyet (AFC)<\/td><td>TFC / Q; üretim arttıkça düşer<\/td><\/tr>\n<tr><td>Toplam değişken maliyet (TVC)<\/td><td>Üretimle değişir (işçi ücretleri)<\/td><\/tr>\n<tr><td>Ortalama değişken maliyet (AVC)<\/td><td>TVC / Q<\/td><\/tr>\n<tr><td>Toplam maliyet (TC)<\/td><td>TFC + TVC<\/td><\/tr>\n<tr><td>Ortalama toplam maliyet (ATC)<\/td><td>TC / Q<\/td><\/tr>\n<tr><td>Marjinal maliyet (MC)<\/td><td>ΔTC / ΔQ<\/td><\/tr>\n<\/table>\n<ul>\n<li>ATC ile AVC arasındaki fark = <b>AFC<\/b>; üretim arttıkça AFC düştüğü için iki eğri birbirine yaklaşır.<\/li>\n<li>MC eğrisi AVC ve ATC eğrilerini <b>minimum noktalarında<\/b> keser.<\/li>\n<li>MC = ATC'nin minimumu → <b>başabaş noktası<\/b>. MC = AVC'nin minimumu → <b>kapanma noktası<\/b>.<\/li>\n<li>MC eğrisinin AVC minimumunun <b>üstünde kalan kısmı<\/b> firmanın <b>kısa dönem arz eğrisidir<\/b>.<\/li>\n<li>Fiyat başabaş ile kapanma noktası arasındaysa firma <b>üretmeye devam eder<\/b>; çünkü üretimi durdurursa en az toplam sabit maliyet kadar zarara katlanır. Fiyat kapanma noktasının altına inerse üretimi durdurur.<\/li>\n<li><b>Uzun dönem ortalama maliyet (LAC)<\/b> eğrisi kısa dönem eğrilerinden türetilir; <b>zarf eğrisi<\/b> de denir.<\/li>\n<\/ul>\n<h4>Ölçek ekonomileri ve ölçeğe göre getiri<\/h4>\n<ul>\n<li>Maliyet düşüşü firma içinden kaynaklanıyorsa <b>içsel<\/b>, dış çevre ya da diğer firmaların kararlarından kaynaklanıyorsa <b>dışsal<\/b> ekonomi.<\/li>\n<li>Pozitif içsel ekonomi → LAC <b>negatif eğimli<\/b>; negatif içsel → LAC <b>pozitif eğimli<\/b>. Pozitif dışsal → LAC <b>aşağı kayar<\/b>; negatif dışsal → <b>yukarı kayar<\/b>.<\/li>\n<li><b>Ölçeğe göre getiri<\/b> (girdiler %10 artarsa): çıktı %15 artarsa <b>artan<\/b>, %10 artarsa <b>sabit<\/b>, %5 artarsa <b>azalan<\/b> getiri.<\/li>\n<\/ul>\n\n<h3>Tam rekabet piyasası<\/h3>\n<ul>\n<li>Alıcı ve satıcıların fiyat üzerinde etkisi yoktur; fiyat piyasada belirlenir, firma <b>fiyat alıcıdır<\/b>.<\/li>\n<li><b>Dört koşul:<\/b> <b>mobilite (akışkanlık)<\/b>: giriş-çıkış serbest; <b>atomisite<\/b>: çok sayıda alıcı ve satıcı; <b>homojenlik<\/b>: aynı ürün; <b>şeffaflık<\/b>: tam bilgi.<\/li>\n<li>Kısa dönemde aşırı kâr olabilir; uzun dönemde yeni firmalar girdiği için aşırı kâr oluşmaz (normal kâr). Bunun asıl nedeni <b>mobilite<\/b>dir.<\/li>\n<li>Firmanın talep eğrisi <b>yatay, sonsuz esnek<\/b>; fiyat = ortalama gelir = marjinal gelir (P = AR = MR).<\/li>\n<li><b>Denge koşulu<\/b> kısa ve uzun dönemde: <b>P = MC = MR<\/b>.<\/li>\n<li>TR = P × Q; fiyat sabit olduğundan TR miktarla orantılı artar (fiyat 6 iken 1 birim 6, 2 birim 12; MR = AR = 6).<\/li>\n<li>TR = TC olan noktalar <b>başabaş noktalarıdır<\/b>; aradaki aralıkta kâr vardır, TR ile TC arasındaki mesafenin en büyük olduğu yerde kâr maksimumdur.<\/li>\n<\/ul>\n\n<h3>Monopol<\/h3>\n<ul>\n<li><b>Özellikler:<\/b> tek satıcı, çok sayıda alıcı; piyasaya giriş engeli (aşırı kâr olanağı); tek firma endüstrinin kendisidir; malın <b>yakın ikamesi yoktur<\/b>.<\/li>\n<li><b>Monopolleşme nedenleri:<\/b> devletin tek yetkili kılması; ölçek ekonomileri; lisans veya patent; firmalar arası anlaşmalar; tek ithalatçı olma.<\/li>\n<li>Monopol <b>negatif eğimli<\/b> talep eğrisiyle karşılaşır; D = AR = P. Doğrusal talepte marjinal gelir eğrisi talep eğrisinin <b>iki katı eğimle<\/b> iner ve talebin altında kalır.<\/li>\n<li><b>Denge:<\/b> <b>MR = MC<\/b>. Ortalama maliyeti düşük monopolün kârı daha yüksektir.<\/li>\n<li><b>Lerner endeksi:<\/b> L = (P - MC) / P; 0 ile 1 arası; 1'e yaklaştıkça monopol gücü artar.<\/li>\n<\/ul>\n<table>\n<tr><th>Fiyat farklılaştırması<\/th><th>Özellik<\/th><\/tr>\n<tr><td>1. derece (tam)<\/td><td>Her birim ayrı fiyattan; tüketici rantının tamamı alınır; monopole en çok kâr getiren; teoride mümkün, pratikte pek değil<\/td><\/tr>\n<tr><td>2. derece<\/td><td>Mal kümelerine/kullanım miktarına göre farklı fiyat (elektrikte kW kademeleri)<\/td><\/tr>\n<tr><td>3. derece<\/td><td>Piyasa alt piyasalara bölünür; esnekliği yüksek piyasada düşük, düşük piyasada yüksek fiyat. Şart: farklı esneklikler ve piyasalar arası <b>arbitraj olmaması<\/b><\/td><\/tr>\n<\/table>\n\n<h3>Monopolcü (monopollü) rekabet<\/h3>\n<ul>\n<li>Hem monopol hem tam rekabet özellikleri taşır: çok alıcı, çok satıcı; firmaların fiyat üzerinde bir miktar kontrolü olabilir.<\/li>\n<li>Giriş-çıkış serbesttir; bu nedenle aşırı kâr oluşmaz.<\/li>\n<li><b>Ürün farklılaştırması<\/b> yapılır (sakız örneği); tam rekabetten temel farkı budur. Pratikte <b>en sık<\/b> karşılaşılan piyasa türüdür.<\/li>\n<li>Firmanın talep eğrisi monopolden daha esnek, tam rekabetten daha inelastiktir.<\/li>\n<li>Üretim MR = MC'de yapılır; ancak P = MC sağlanmadığı için <b>etkinlik yoktur<\/b>. Fiyat tam rekabetten yüksek, üretim düşüktür.<\/li>\n<\/ul>\n\n<h3>Oligopol<\/h3>\n<ul>\n<li>Birkaç firma piyasayı oluşturur ve fiyatı etkiler; firmalar birbirine <b>bağımlıdır<\/b>, birbirinin tepkisini hesaba katar.<\/li>\n<li>Birkaç satıcı, çok alıcı; homojen veya farklılaştırılmış ürün; giriş-çıkışta engeller (ölçek ekonomileri, gizli anlaşmalar).<\/li>\n<li>İki firmalı oligopol <b>düopol<\/b>, üç firmalı <b>triopol<\/b>. Anlaşmalı ve anlaşmasız oligopol vardır.<\/li>\n<\/ul>\n<table>\n<tr><th>Düopol modeli<\/th><th>Rekabet<\/th><th>Öne çıkan bilgi<\/th><\/tr>\n<tr><td>Cournot<\/td><td>Miktar<\/td><td>Homojen mal, aynı maliyet; eşanlı giriş, tam bilgi; firmalar <b>saf<\/b> (rakip miktarını değiştirmeyecek sanır). n firmada her firma tam rekabetçi üretimin 1/(n+1)'ini, toplam n/(n+1)'ini üretir: 2 firma 2/3, 3 firma 3/4, 4 firma 4/5. Fiyat tam rekabetten yüksek, monopolden düşük. Denge tepki eğrilerinin kesişiminde.<\/td><\/tr>\n<tr><td>Stackelberg<\/td><td>Miktar<\/td><td>Bir firma <b>lider<\/b>, diğeri saf takipçi. Lider Cournot'ya göre daha iyi, takipçi daha kötü. Fiyat Cournot'dan düşük, üretim yüksek. Denge istikrarlı; iki firma da lider gibi davranırsa istikrarsız.<\/td><\/tr>\n<tr><td>Bertrand<\/td><td>Fiyat<\/td><td>Her firma rakibin fiyatını değiştirmeyeceğini varsayar (saf). Fiyat rekabeti <b>P = MC<\/b>'ye kadar sürer; tam rekabet sonucuna ulaşılır. <b>En düşük denge fiyatlı<\/b> düopol.<\/td><\/tr>\n<tr><td>Edgeworth<\/td><td>Fiyat ve miktar<\/td><td>Cournot üzerine kurulu; toplam talebin tamamı karşılanamaz. <b>İstikrarlı denge yoktur<\/b>; fiyat ve miktar sürekli değişir.<\/td><\/tr>\n<tr><td>Chamberlin<\/td><td>-<\/td><td>Firmalar birbirinin kararlarından etkilendiğinin farkında, hatalardan ders çıkarır. \"<b>Paylaşılmış monopol<\/b>\": toplam talebin yarısı karşılanır, her firma 1/4. Toplam üretim ve fiyat <b>monopolle aynı<\/b>.<\/td><\/tr>\n<tr><td>Sweezy<\/td><td>Fiyat<\/td><td>İki talep eğrisi (firma ve endüstri): fiyat artışına rakipler uymaz, indirime uyar → <b>dirsekli talep eğrisi<\/b>. Denge istikrarlı, <b>fiyatlar katı<\/b>; marjinal hasıla eğrisi kesiklidir, bu aralıkta MC değişimi fiyat ve miktarı etkilemez.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: <b>Cournot<\/b> ve <b>Stackelberg<\/b> miktar; <b>Bertrand<\/b> ve <b>Sweezy<\/b> fiyat rekabetidir. İstikrarlı dengesi olmayan model <b>Edgeworth<\/b>, monopol sonucunu veren model <b>Chamberlin<\/b>dir.<\/li>\n<\/ul>\n<table>\n<tr><th>Piyasa<\/th><th>Satıcı<\/th><th>Ürün<\/th><th>Giriş<\/th><th>Denge<\/th><\/tr>\n<tr><td>Tam rekabet<\/td><td>Çok<\/td><td>Homojen<\/td><td>Serbest<\/td><td>P = MC = MR<\/td><\/tr>\n<tr><td>Monopolcü rekabet<\/td><td>Çok<\/td><td>Farklılaştırılmış<\/td><td>Serbest<\/td><td>MR = MC (P &gt; MC)<\/td><\/tr>\n<tr><td>Oligopol<\/td><td>Birkaç<\/td><td>Homojen veya farklı<\/td><td>Engelli<\/td><td>Modele göre<\/td><\/tr>\n<tr><td>Monopol<\/td><td>Tek<\/td><td>Yakın ikamesiz<\/td><td>Engelli<\/td><td>MR = MC<\/td><\/tr>\n<\/table>", "sorular": [{"q": "Kısa dönem üretim analizinde aşağıdakilerden hangisi doğrudur?", "o": ["Emek ve sermaye birlikte değişkendir", "Emek değişken, sermaye sabittir", "Emek sabit, sermaye değişkendir", "Tüm girdiler sabittir", "Yalnız teknoloji değişkendir"], "a": 1, "e": "Kısa dönemde emek değişken, sermaye sabit kabul edilir; uzun dönemde ikisi de değişkendir."}, {"q": "Değişken girdi miktarı 4 birimden 5 birime çıktığında toplam ürün 160'tan 180'e yükselmiştir. 5. birimin marjinal ürünü ve 5 birimdeki ortalama ürün nedir?", "o": ["20 ve 40", "36 ve 20", "180 ve 36", "40 ve 36", "20 ve 36"], "a": 4, "e": "MP = 180 - 160 = 20; AP = 180 / 5 = 36."}, {"q": "Toplam ürünün maksimum olduğu noktada marjinal ürün hakkında ne söylenebilir?", "o": ["Ortalama ürüne eşittir", "En yüksek düzeyindedir", "Sıfırdır", "Negatiftir", "Ortalama ürünün iki katıdır"], "a": 2, "e": "Toplam ürün en yüksek düzeydeyken ilave işçinin katkısı, yani marjinal ürün sıfırdır."}, {"q": "Marjinal ürün ve ortalama ürün ilişkisiyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["MP'nin azaldığı her bölgede AP de azalır", "MP ile AP, AP'nin maksimum olduğu noktada kesişir", "MP, AP'nin üzerinde olduğu sürece AP artar", "MP negatif olabilir", "MP belli bir girdi düzeyine kadar artar sonra azalır"], "a": 0, "e": "MP azalmaya başladığında AP'nin üzerinde kaldığı sürece AP artmaya devam eder (ikinci bölge). Bu yüzden ifade yanlıştır."}, {"q": "Eş ürün eğrisinin eğimi aşağıdakilerden hangisine eşittir?", "o": ["Marjinal ikame oranı", "Marjinal dönüşüm oranı", "Marjinal maliyet", "Marjinal teknik ikame oranı", "Lerner endeksi"], "a": 3, "e": "Eş ürün eğrisinin eğimi marjinal teknik ikame oranıdır (MRTS = -ΔK/ΔL)."}, {"q": "Eş maliyet doğrusu C = P(K) × K + P(L) × L ile ilgili hangisi doğrudur?", "o": ["P(K) emeğin fiyatı olan ücrettir", "Doğrunun eğimi -P(L)/P(K)'dır", "P(L) sermayenin fiyatı olan faizdir", "Üretici dengesi doğrunun kayıtsızlık eğrisine teğet olduğu noktadadır", "Doğru orijine göre dışbükeydir"], "a": 1, "e": "Dikey eksende K varken eksen kesişimleri C/P(K) ve C/P(L) olduğundan eğim -P(L)/P(K)'dır. P(K) faiz, P(L) ücrettir; denge eş ürün eğrisiyle teğetlikte oluşur."}, {"q": "Ortalama toplam maliyet eğrisi ile ortalama değişken maliyet eğrisi arasındaki dikey uzaklık neyi gösterir?", "o": ["Marjinal maliyeti", "Toplam sabit maliyeti", "Toplam değişken maliyeti", "Normal kârı", "Ortalama sabit maliyeti"], "a": 4, "e": "ATC - AVC = AFC'dir. Üretim arttıkça AFC düştüğü için iki eğri birbirine yaklaşır."}, {"q": "Marjinal maliyet eğrisinin ortalama değişken maliyet eğrisini kestiği minimum nokta nedir?", "o": ["Başabaş noktası", "Doyum noktası", "Kapanma noktası", "Optimum ölçek noktası", "Maksimum kâr noktası"], "a": 2, "e": "MC'nin AVC minimumunu kestiği nokta kapanma, ATC minimumunu kestiği nokta başabaş noktasıdır."}, {"q": "Piyasa fiyatı başabaş noktasının altında fakat kapanma noktasının üzerinde olan bir tam rekabet firması kısa dönemde ne yapar?", "o": ["Üretmeye devam eder, çünkü durdurursa sabit maliyetin tamamı kadar zarar eder", "Üretimi hemen durdurur", "Fiyatı yükseltir", "Piyasadan çıkıp yeniden girer", "Üretimi sıfıra indirip sabit maliyetini de sıfırlar"], "a": 0, "e": "Bu aralıkta fiyat değişken maliyeti karşılayıp sabit maliyetin bir kısmını da kapattığından firma üretime devam eder."}, {"q": "Girdiler %10 artırıldığında çıktı %6 artıyorsa hangi durum söz konusudur?", "o": ["Ölçeğe göre artan getiri", "Ölçeğe göre sabit getiri", "Pozitif dışsal ekonomi", "Ölçeğe göre azalan getiri", "Azalan marjinal fayda"], "a": 3, "e": "Çıktı girdilerden daha az oranda artıyorsa ölçeğe göre azalan getiri vardır."}, {"q": "Negatif dışsal ekonomilerin uzun dönem ortalama maliyet eğrisine etkisi nedir?", "o": ["LAC negatif eğimli olur", "LAC yukarı kayar", "LAC pozitif eğimli olur", "LAC aşağı kayar", "LAC yatay olur"], "a": 1, "e": "Dışsal ekonomiler eğriyi kaydırır: pozitif dışsal aşağı, negatif dışsal yukarı. İçsel ekonomiler ise eğimi belirler."}, {"q": "Tam rekabet piyasasında uzun dönemde aşırı kâr oluşmamasının asıl nedeni hangi koşuldur?", "o": ["Atomisite", "Homojenlik", "Şeffaflık", "Ürün farklılaştırması", "Mobilite"], "a": 4, "e": "Piyasaya giriş-çıkışın serbest olması (mobilite) yeni firmaların girişiyle aşırı kârın ortadan kalkmasını sağlar."}, {"q": "Tam rekabet piyasasındaki bir firmanın talep eğrisi için hangisi doğrudur?", "o": ["Negatif eğimlidir ve marjinal gelir talebin altındadır", "Dikeydir ve tam inelastiktir", "Yataydır ve sonsuz esnektir; fiyat, ortalama gelir ve marjinal gelire eşittir", "Dirseklidir", "Pozitif eğimlidir"], "a": 2, "e": "Tam rekabetçi firma fiyat alıcıdır; veri fiyatta yatay, sonsuz esnek talep eğrisiyle karşılaşır ve P = AR = MR olur."}, {"q": "Fiyatı 50 TL, marjinal maliyeti 30 TL olan bir monopolün Lerner endeksi kaçtır?", "o": ["0,4", "0,6", "1,67", "0,2", "2,5"], "a": 0, "e": "L = (P - MC) / P = (50 - 30) / 50 = 0,4."}, {"q": "Bir monopolün piyasayı talep esnekliği farklı alt piyasalara bölüp esnekliği yüksek piyasada düşük fiyat uygulaması hangi fiyat farklılaştırmasıdır?", "o": ["Birinci derece", "İkinci derece", "Tam fiyat farklılaştırması", "Üçüncü derece", "Damping"], "a": 3, "e": "Üçüncü derece fiyat farklılaştırmasında alt piyasalara esnekliklerine göre fiyat verilir; şartı piyasalar arası arbitraj olmamasıdır."}, {"q": "Monopolcü rekabet piyasası hakkında hangisi yanlıştır?", "o": ["Ürün farklılaştırması yapılır", "Piyasada tek alıcı, çok satıcı vardır", "Giriş ve çıkış serbesttir", "Pratikte en sık karşılaşılan piyasa türüdür", "Fiyat tam rekabete göre yüksek, üretim düşüktür"], "a": 1, "e": "Monopolcü rekabette çok sayıda alıcı ve çok sayıda satıcı vardır."}, {"q": "Cournot modelinde piyasada 3 firma varsa toplam üretim tam rekabetçi üretim miktarının ne kadarı olur?", "o": ["1/4", "2/3", "4/5", "1/2", "3/4"], "a": 4, "e": "n firmada toplam üretim n/(n+1) olur; 3 firma için 3/4. Her bir firma 1/4 üretir."}, {"q": "Fiyat rekabetinin fiyat marjinal maliyete eşit oluncaya kadar sürdüğü ve en düşük denge fiyatının oluştuğu düopol modeli hangisidir?", "o": ["Cournot", "Stackelberg", "Bertrand", "Chamberlin", "Sweezy"], "a": 2, "e": "Bertrand modelinde fiyat rekabeti P = MC'ye kadar sürer; tam rekabet sonucuna ulaşılır."}, {"q": "Toplam talebin yarısının karşılandığı, her firmanın 1/4 pay aldığı ve sonucun monopolle aynı olduğu \"paylaşılmış monopol\" modeli hangisidir?", "o": ["Chamberlin", "Edgeworth", "Cournot", "Bertrand", "Stackelberg"], "a": 0, "e": "Chamberlin modelinde firmalar hatalarından ders çıkarır; toplam üretim ve fiyat monopol piyasası ile aynıdır."}, {"q": "Fiyatların katı olduğu, rakiplerin fiyat artışına uymayıp indirime uyduğu dirsekli talep eğrisi modeli hangisidir?", "o": ["Cournot", "Edgeworth", "Bertrand", "Sweezy", "Stackelberg"], "a": 3, "e": "Sweezy modelinde asimetrik tepki nedeniyle talep eğrisi dirseklidir, marjinal hasıla kesiklidir ve fiyatlar katıdır."}, {"q": "Aşağıdaki düopol modellerinden hangisinde istikrarlı bir denge oluşmaz?", "o": ["Cournot", "Edgeworth", "Stackelberg", "Chamberlin", "Sweezy"], "a": 1, "e": "Edgeworth modelinde fiyat ve miktar sürekli değişir, istikrarlı denge oluşmaz."}]}, {"id": 3, "kisa": "Para Politikaları", "baslik": "Para Politikaları", "ozet": "Paranın işlevleri, kaydi para ve para çarpanı, para arzı tanımları, para talebi teorileri, TCMB ve para politikası araçları, LM eğrisi.", "notlar": "<h3>Paranın işlevleri ve özellikleri<\/h3>\n<ul>\n<li>Para, mal ve hizmet değişiminde kullanılan, <b>genel kabul görmüş<\/b> metadır; taşınabilir, bölünebilir ve dayanıklı olmalıdır.<\/li>\n<li><b>Üç işlev:<\/b> (1) <b>hesap birimi<\/b> (değer ölçüsü, muhasebe birimi); (2) <b>mübadele (değişim) aracı<\/b>: takastaki \"isteklerin karşılıklı çakışması\" zorunluluğunu kaldırır, işbölümü ve uzmanlaşmayı hızlandırır; (3) <b>servet saklama aracı<\/b>: servetin para olarak tutulmasının fırsat maliyeti diğer tasarruf araçlarının getirisidir.<\/li>\n<li><b>Paranın özellikleri:<\/b> standart olmalı, genel kabul görmeli, taşınabilir olmalı, taklit edilememeli, bölünebilir olmalı, dayanıklı olmalı.<\/li>\n<li>Dikkat: \"standart olma\" bir <b>özelliktir<\/b>, işlev değildir.<\/li>\n<li><b>Para ikamesi:<\/b> yerli paranın işlevlerinin başka bir ülke parasınca üstlenilmesi. Nedenleri: sürekli ve yüksek <b>enflasyon<\/b> ile yerli paranın sürekli ve güçlü <b>değer kaybı<\/b>. Sonucu: merkez bankası para politikası yeterli etkiyi doğuramaz. Yerli paranın hiç talep edilmemesi = tam para ikamesi.<\/li>\n<\/ul>\n<h4>Para çeşitleri<\/h4>\n<ul>\n<li><b>Mal para ve madeni para:<\/b> gümüş, altın ve çift metal sistemleri. Altın sistemi üç aşama: <b>altın sikke → altın külçe → altın kambiyo<\/b>. Çift metalde devlet altın-gümüş kurunu belirler.<\/li>\n<li><b>Gresham Kanunu:<\/b> \"<b>Kötü para iyi parayı kovar<\/b>\" (değeri düşen gümüşün elden çıkarılıp altının saklanması; bugün yıpranmış banknotların önce harcanması).<\/li>\n<li><b>İtibari-kâğıt para:<\/b> Türkiye'de basma yetkisi <b>TCMB<\/b>'dedir; egemenlik sembolüdür. Avantaj: taşıma/basma kolaylığı, devletin gelir toplamasına yardım. Dezavantaj: kur farkları, fiyat artışına yol açabilmesi.<\/li>\n<li><b>Kaydi para (banka parası):<\/b> fiziken olmayan, banka hesaplarında izlenen para.<\/li>\n<li><b>Asli para:<\/b> TCMB matbaasında basılan kâğıt para + <b>Hazine ve Maliye Bakanlığı darphanesinde<\/b> basılan bozukluklar.<\/li>\n<\/ul>\n\n<h3>Kaydi para yaratma ve para çarpanı<\/h3>\n<ul>\n<li>Varsayımlar: tek banka, serbest karşılık yok, sızıntı yok, krediler mevduat olarak geri döner.<\/li>\n<li>Örnek: 1.000 TL mevduat, zorunlu karşılık %10 → 100 TL merkez bankasında, 900 TL kredi; 900 TL'nin 90'ı karşılık, 810'u kredi... Toplam: <b>1.000 × 1/0,10 = 10.000 TL<\/b>.<\/li>\n<li><b>Formül:<\/b> M = A × 1/r (A ilk mevduat, r zorunlu karşılık oranı). Serbest karşılık oranı s ise: <b>M = A × 1/(r + s)<\/b>. Karşılık oranları arttıkça (sızıntı arttıkça) yaratılan kaydi para azalır.<\/li>\n<li><b>Para çarpanı<\/b> = (1 + nakit/mevduat oranı) / (zorunlu karşılık oranı + nakit/mevduat oranı). Para çarpanı <b>1'den büyüktür<\/b>; zorunlu karşılık oranı artarsa <b>azalır<\/b>; nakit/mevduat oranı küçüldükçe <b>büyür<\/b>.<\/li>\n<li><b>Zorunlu (munzam) karşılık oranı<\/b> artarsa ödünç verilebilir kısım ve para arzı azalır; düşerse para arzı artar.<\/li>\n<li>Zorunlu karşılıklar, <b>TCMB Kanunu m.40-II<\/b> uyarınca çıkarılan <b>2013/15 sayılı Zorunlu Karşılıklar Tebliği<\/b>'ne göre tesis edilir. Tabi yükümlülükler: mevduat/katılım fonu; repo fonları (<b>Borsa İstanbul piyasalarındakiler hariç<\/b>); kullanılan krediler (<b>Hazine garantilisi hariç<\/b>); ihraç edilen menkul kıymetler (net); sermayeye dahil edilmeyen borçlanma araçları; yurt dışı merkeze yükümlülükler (net); kredi kartı ödemelerinden borçlar; müstakriz fonları.<\/li>\n<\/ul>\n\n<h3>Para arzı<\/h3>\n<table>\n<tr><th>Yaklaşım<\/th><th>Para arzı<\/th><\/tr>\n<tr><td>Klasik<\/td><td>Değişim aracı olanlar: nakit + vadesiz mevduat (dar tanım, M1)<\/td><\/tr>\n<tr><td>Chicago (Friedman-Meiselman)<\/td><td>Nakit + vadesiz + vadeli mevduat (M2'ye karşılık gelir)<\/td><\/tr>\n<tr><td>Gurley-Shaw<\/td><td>Tüm likit değerler, ikame derecesine göre 0 ile 1 arası ağırlıkla toplanır; sorun ikame derecesini belirlemenin zorluğu<\/td><\/tr>\n<tr><td>Radcliffe (krediyi içeren geniş görüş)<\/td><td>Para = kredi; tüm kurumların kredi toplamı; para arzı yerine <b>likidite arzı<\/b>. En geniş tanım<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Genel tanımlar:<\/b> M1 = nakit + vadesiz mevduat + diğer çek yazılabilir mevduat; M2 = M1 + vadeli mevduat ve benzerleri; M3 = M2 + repo fonları + para piyasası fonları.<\/li>\n<li><b>Türkiye:<\/b> M1 = dolaşımdaki para + vadesiz mevduat (TL, YP); M2 = M1 + vadeli mevduat (TL, YP); M3 = M2 + repo + para piyasası fonları + ihraç edilen menkul kıymetler.<\/li>\n<li>Para arzını merkez bankası belirlediği için para arzı eğrisi faize göre <b>dikey<\/b> çizilir; artış sağa, azalış sola kaydırır.<\/li>\n<\/ul>\n<h4>Repo ve ters repo<\/h4>\n<ul>\n<li><b>Repo:<\/b> menkul kıymetin işlem başlangıcında satılıp vade sonunda geri alınması. Repo yapan, menkul kıymeti <b>satan<\/b>, yani <b>fon talep eden<\/b> taraftır; karşı taraf fon arz edendir. Özü rehin sözleşmesine benzer.<\/li>\n<li><b>Ters repo:<\/b> geri satma taahhüdüyle menkul kıymet <b>alımı<\/b> (fon veren taraf).<\/li>\n<li><b>Konu olabilecek kıymetler:<\/b> hazine bonosu, devlet tahvili, banka (finansman) bonosu, kamu borçlanma araçları, 4749 sayılı Kanun kapsamında varlık kiralama şirketlerinin kira sertifikaları, TCMB likidite senetleri, ÖİB/TOKİ/KİT/mahalli idare borçlanma araçları, yerleşik ihraççıların borçlanma araçları, kira sertifikaları, varlığa ve ipoteğe dayalı/teminatlı menkul kıymetler, Borsa İstanbul'un belirlediği paylar.<\/li>\n<li><b>TCMB uygulaması:<\/b> likidite vermek için bankalardan <b>bir hafta vadeli<\/b>, geri satma taahhüdüyle menkul kıymet alır; fazla likiditeyi çekmek için menkul kıymet verir. Dikkat: kitap likidite veren işlemi bir yerde TCMB açısından \"ters repo\", para politikası araçları kısmında ise \"repo\" (likidite sıkışıklığında yapılan işlem) diye adlandırır. Sınavda işlemin <b>yönüne<\/b> bak: TCMB menkul kıymet alıyorsa likidite verir, satıyorsa likidite çeker.<\/li>\n<\/ul>\n\n<h3>Para talebi<\/h3>\n<ul>\n<li><b>Etkileyen faktörler:<\/b> nüfus; ödeme sistemleri (kredi kartı, kaydi para); fiyatlar genel düzeyi ve beklentiler; faiz oranı. Fiyat düzeyi artınca para talebi artar; faiz artınca azalır.<\/li>\n<li><b>Reel para talebi:<\/b> Md/P = L(Y, i) → reel gelirle <b>pozitif<\/b>, faizle <b>negatif<\/b> ilişkili.<\/li>\n<\/ul>\n<table>\n<tr><th>Teori<\/th><th>Kim<\/th><th>Formül / öz<\/th><\/tr>\n<tr><td>Miktar teorisi<\/td><td>Irving Fisher (Klasik)<\/td><td><b>M × V = P × Y<\/b>. Para talebinin faiz esnekliği <b>sıfır<\/b>; kısa dönemde V ve Y sabit; para arzı değişimi yalnız fiyatları etkiler; gelir tamamen harcanır; fiyatlar esnek.<\/td><\/tr>\n<tr><td>Cambridge yaklaşımı<\/td><td>Alfred Marshall, A. C. Pigou (Klasik)<\/td><td><b>Md = k × P × Y<\/b>; k = gelirin para olarak tutulan kısmı = <b>1/V<\/b>. Pigou Y yerine reel servet w kullanır: Md = k × P × w. Güdüler: <b>işlem<\/b> ve <b>servet tutma<\/b>.<\/td><\/tr>\n<tr><td>Likidite tercihi<\/td><td>Keynes<\/td><td><b>İşlem, ihtiyat, spekülasyon<\/b> güdüleri. k ve V faize duyarlı → para talebi istikrarsız. Servet araçları: para ve \"konsol\" tahvil.<\/td><\/tr>\n<tr><td>Modern miktar teorisi<\/td><td>Milton Friedman (Monetarist)<\/td><td>Para talebi <b>sürekli gelirin<\/b> fonksiyonu; Cp = k × Yp. Belirleyiciler: fiyat düzeyi, enflasyon beklentisi, reel (sürekli) gelir, faiz, <b>beşeri sermaye<\/b> (yüksekse daha çok para tutulur), zevk ve tercihler.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Dolaşım hızı hesabı:<\/b> V = (P × Y) / M. Nominal GSYH 10 milyar, para miktarı 5 milyar ise V = 2 (her lira nihai alımda 2 kez kullanılmış).<\/li>\n<li><b>Fisher ile Cambridge farkı:<\/b> Fisher harcama ile, Pigou servet ile para talebi arasında ilişki kurar; Fisher dolaşım hızıyla, Pigou servetin para olarak tutulan kısmıyla ilgilenir; Pigou işlem güdüsüne servet tutma isteğini ekler.<\/li>\n<li><b>Keynes'te:<\/b> işlem ve ihtiyat talebi gelirle pozitif, faizle negatif; <b>spekülasyon talebi yalnız faizin negatif fonksiyonudur<\/b>. Spekülasyon güdüsü Klasiklerde yoktur. Toplam para talebi: Md = L(Y, r).<\/li>\n<li><b>Likidite tuzağı:<\/b> faiz düşebileceği en alt sınırdadır; herkes faizin yükseleceğini (tahvil fiyatının düşeceğini) bekler; para talebi faize <b>sonsuz esnektir<\/b>, tahvil alınmaz, <b>LM yataydır<\/b>.<\/li>\n<li><b>Friedman ile Keynes farkı:<\/b> Friedman'a göre para ve reel aktifler ikamedir; para talebi sürekli gelire bağlıdır; faizin etkisi çok azdır; beklenen enflasyon para talebini etkiler; paranın birçok alternatifi vardır (Keynes tümünü \"konsol\" tahvilde toplar).<\/li>\n<\/ul>\n\n<h3>Finansal piyasalar<\/h3>\n<table>\n<tr><th>Para piyasası<\/th><th>Sermaye piyasası<\/th><\/tr>\n<tr><td>Kısa vadeli fon (dönemsel ihtiyaç)<\/td><td>Uzun vadeli fon (sürekli yatırımlar)<\/td><\/tr>\n<tr><td>Risk finansal kurumda; en önemli unsur bankalar<\/td><td>Riski hisse/tahvil alan yatırımcı üstlenir<\/td><\/tr>\n<tr><td>Faiz ve getiri düşük, likidite yüksek<\/td><td>Risk ve getiri yüksek<\/td><\/tr>\n<tr><td>Hazine bonosu, finansman bonosu<\/td><td>Hisse senedi, şirket ve devlet tahvili (vadesi 1 yıldan fazla)<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Hazine bonosu:<\/b> vadesi <b>1 yıldan kısa<\/b>; 3, 6 ve 12 aylık; devlet güvenceli; fiyatını enflasyon, faiz ve beklentiler etkiler. <b>Finansman bonosu:<\/b> anonim ortaklıkların kısa vadeli borçlanması; hazine bonosuna göre riski yüksek, likiditesi düşük.<\/li>\n<\/ul>\n\n<h3>Merkez bankaları ve TCMB<\/h3>\n<ul>\n<li>Merkez bankası <b>bankaların bankasıdır<\/b>; genellikle kâr amacı gütmez. Görevleri: banknot basmak (emisyon tekeli); para politikası amaçlarını gerçekleştirmek ve yerli paranın değerini korumak; kredi politikasını icra; altın ve döviz rezervi yönetimi; <b>son kredi mercii<\/b> olmak. Dikkat: <b>madeni para<\/b> merkez bankasınca değil Hazine darphanesince basılır.<\/li>\n<li><b>Bağımsızlık türleri:<\/b> <b>amaç bağımsızlığı<\/b> (amacı kendisinin seçmesi); <b>araç bağımsızlığı<\/b> = fonksiyonel bağımsızlık (araçları onaysız seçip kullanma); yasal ve fiili (kurumsal) bağımsızlık; finansal bağımsızlık.<\/li>\n<li><b>25 Nisan 2001<\/b>'de <b>1211 sayılı Kanun<\/b> değişikliği: TCMB'nin temel amacı <b>fiyat istikrarını sağlamak ve sürdürmek<\/b>. Amaç kanunla verildiği için <b>amaç bağımsızlığı yoktur<\/b>; araçları kendisi belirlediği için <b>araç bağımsızlığı vardır<\/b>. Merkez bankaları için bağımsızlık çoğunlukla araç bağımsızlığıdır.<\/li>\n<li>Aynı değişiklikle TCMB'nin Hazine ve kamu kuruluşlarına <b>avans vermesi, kredi açması<\/b> ve bunların borçlanma araçlarını <b>birincil piyasadan satın alması yasaklandı<\/b>; bütçe açıklarının parasallaşması önlendi. (Kitap bir yerde bu yasakla TCMB'nin \"amaç bağımsızlığına kavuştuğunu\" söyler; esas alınacak sonuç amaç bağımsızlığının olmadığı, araç bağımsızlığının olduğudur.)<\/li>\n<li><b>Banknot (tedavül) ilkesi:<\/b> Ricardo; kâğıt paranın <b>%100 altın karşılığı<\/b> olmalı. <b>Bankacılık ilkesi:<\/b> altının yanında reeskont gibi alacaklar da karşılık sayılmalı (esneklik).<\/li>\n<li><b>Bretton Woods:<\/b> 1944, New Hampshire; <b>44 ülke<\/b>; dolar altına çevrilebilen tek para, <b>1 ons altın = 35 dolar<\/b>; diğer paralar dolara bağlı (altına endeksli sabit kur). IMF ve Dünya Bankası kuruldu, <b>1946<\/b>'da faaliyete geçti. ABD'nin büyük dış ticaret açığıyla <b>1971<\/b>'de sona erdi. Öncesindeki sistem altın standardıydı.<\/li>\n<li>TCMB'de para politikası kararlarını <b>Para Politikası Kurulu (PPK)<\/b> alır.<\/li>\n<li><b>TCMB bilançosu:<\/b> aktifler dış varlıklar ve iç varlıklar; pasifler döviz yükümlülükleri ve TCMB parası (rezerv para: emisyon, bankalar mevduatı, fon hesapları, bankacılık dışı kesim mevduatı; diğer merkez bankası parası: APİ, kamu mevduatı).<\/li>\n<li><b>Parasal taban = rezerv para + net açık piyasa işlemleri<\/b>. <b>TCMB parası = parasal taban + kamu mevduatı<\/b>.<\/li>\n<\/ul>\n<h4>Taylor kuralı ve enflasyon hedeflemesi<\/h4>\n<ul>\n<li><b>Taylor kuralı:<\/b> i = r + π + α(π - π*) + β(Y - Y*). r reel faiz, π gerçekleşen, π* hedef enflasyon, Y gerçekleşen, Y* potansiyel hasıla. α ve β pozitif: enflasyon hedefi aşarsa veya hasıla potansiyelin üzerindeyse <b>nominal faiz artırılmalıdır<\/b>. ABD verisiyle türetildiğinden katsayılar her ülkeye göre belirlenmelidir.<\/li>\n<li><b>Enflasyon hedeflemesi:<\/b> rakamsal hedef kamuoyuna duyurulur; ara hedef kullanılmadan doğrudan enflasyon hedeflenir; beklenen enflasyon kontrol edilir. Ön koşul: bağımsız ve güvenilir merkez bankası. İlk uygulayan <b>Yeni Zelanda<\/b>. Türkiye'de 2001 sonrası <b>örtük<\/b>, <b>2006<\/b>'dan itibaren <b>açık<\/b> enflasyon hedeflemesi.<\/li>\n<li>Fiyat istikrarı olmazsa: finansal piyasalar etkin çalışmaz, nominal ve reel faizler yükselir, maliye politikasına güven azalır, gelir eşitsizliği artar.<\/li>\n<\/ul>\n<h4>Diğer TCMB kavramları<\/h4>\n<ul>\n<li><b>Faiz koridoru:<\/b> gecelik borç verme faizi ile borçlanma faizi arasındaki alan. Bant genişledikçe politika esnekliği artar; bandın daralması kredi maliyetini düşürür, para akışını artırır, yerli parada değer kaybına yol açabilir. TCMB <b>2010<\/b>'a kadar politika faizi olarak borçlanma faizini kullandı; 2010'da <b>bir haftalık repo faizi<\/b> politika faizi oldu.<\/li>\n<li><b>Açık mektup (TCMB Kanunu m.42):<\/b> Cumhurbaşkanı Bankanın işlem ve hesaplarını denetletebilir; Banka bilançosunu bağımsız denetime verebilir; Başkan her yıl <b>nisan ve ekim<\/b> aylarında Cumhurbaşkanına rapor sunar; Banka <b>yılda iki defa<\/b> TBMM Plan ve Bütçe Komisyonunu bilgilendirir; hedefe ulaşılamaz veya ulaşılamama olasılığı doğarsa nedenler ve önlemler <b>Hükümete yazılı<\/b> bildirilir ve <b>kamuoyuna açıklanır<\/b> (bu yazıya açık mektup denir).<\/li>\n<li><b>Kontrol ufku:<\/b> politika faizi değişikliği ile enflasyondaki nihai etki arasındaki süre; genelde <b>12-24 ay<\/b>.<\/li>\n<li><b>Bankalararası Para Piyasası (BPP):<\/b> <b>2 Nisan 1986<\/b>'da kuruldu; TCMB <b>2002<\/b>'de aracılığa son verdi, yalnız taraf olduğu işlemleri yapar; limitler dahilinde TL alım-satımı; son kredi mercii işlevi.<\/li>\n<li><b>Döviz rezervi amaçları:<\/b> para ve kur politikasını desteklemek, kredibilite, kamunun döviz borç servisi, dış şoklara karşı likidite. Dalgalı kur ve fiyat istikrarı hedefindeki bir merkez bankasının kuru belli düzeyde tutmak için rezerv kullanması iktisadi rasyonele uymaz.<\/li>\n<li><b>Parasal hedefleme:<\/b> parasal taban, rezerv para, M1, M2 gibi değişkenler için hedef. TCMB <b>2002<\/b>'de parasal tabanı (emisyon + zorunlu karşılıklar + serbest mevduat) milli gelirle aynı hızda büyütmeyi hedefledi. <b>Ara hedef<\/b> daha geniş (faiz, kur da olabilir); şartları: fiyat istikrarıyla doğrudan ilişki, <b>ölçülebilir, kontrol edilebilir, belirlenebilir<\/b> olmak.<\/li>\n<li><b>Reeskont faizi<\/b> artarsa bankalar serbest karşılık tutar, para çarpanı ve para arzı düşer → <b>daraltıcı<\/b>. Düşürülmesi genişleticidir. <b>Kredi kullanım oranının<\/b> artması genişleticidir. Reeskont penceresinin temel amacı <b>son ödünç verme<\/b> işlevidir.<\/li>\n<li><b>Gösterge kurlar:<\/b> her iş günü <b>15:30<\/b>'da ilan edilir (<b>2 Ocak 2015<\/b>'ten beri bu yöntem). 10:00-15:00 arası her saat başı bankaların alım-satım ortalaması alınır; <b>6 değerin<\/b> ortalaması orta değerdir; iskonto ve prim uygulanarak alış-satış kuru bulunur. Ertesi gün Resmi Gazete'de yayımlanır; saatlik ortalamalar ertesi iş günü web sitesinde. Kurlar <b>kimseyi bağlamaz<\/b>; belirlendikten bir iş günü sonra TCMB gişe ve bazı muhasebe işlemlerinde kullanılabilir. Resmi tatil, hafta sonu ve yarım günlerde belirlenmez.<\/li>\n<li><b>Emisyon hacmi<\/b> temelde para talebince belirlenir; enflasyon veya beklentisi yükselirse para talebi ve emisyon düşer. Emisyon arzını APİ, DİBS ve döviz alım-satımı, zorunlu karşılık değişiklikleri etkiler.<\/li>\n<\/ul>\n\n<h3>Para politikası araçları<\/h3>\n<ul>\n<li><b>Ekonomi politikası araçları:<\/b> para politikası, maliye politikası, dış ticaret politikaları, fiyat ve gelir politikaları.<\/li>\n<li><b>Para politikası araçları:<\/b> zorunlu karşılıklar, <b>selektif krediler<\/b> (seçilen faaliyet koluna kredi kolaylığı), <b>kredi tavanı ve tabanı<\/b> (kaydi paraya etki için kredilere üst-alt sınır), <b>açık piyasa işlemleri<\/b>, <b>reeskont oranı<\/b>. Dikkat: iç borçlanma bir para politikası aracı değildir.<\/li>\n<li><b>APİ:<\/b> merkez bankasının menkul kıymet alması para arzını artırır, menkul kıymet fiyatını yükseltir, faizi düşürür; satması tersini yapar. APİ türleri: depo, repo, ters repo, doğrudan alım, doğrudan satım, likidite senedi ihracı, TL depo alım ihalesi.<\/li>\n<li><b>Doğrudan alım:<\/b> çoğunlukla <b>kalıcı<\/b> parasal sıkışıklıkta; <b>doğrudan satım:<\/b> kalıcı parasal fazlada; APİ yapmaya yetkili kuruluşlarla.<\/li>\n<li><b>Likidite senedi (TCMB Kanunu m.52):<\/b> TCMB kendi nam ve hesabına <b>vadesi 91 günü geçmeyen<\/b> senet ihraç edebilir; fazla likiditeyi çeker; ikincil piyasada işlem görür; erken itfa edilebilir; alternatif yatırım aracı değildir.<\/li>\n<li><b>Para finansmanı:<\/b> 2001 öncesi TCMB devlet borçlanma senetlerini birincil piyasadan para basarak alabiliyordu; enflasyonist sonuç doğurdu; 2001 değişikliğiyle yasaklandı.<\/li>\n<li><b>Sterilizasyon:<\/b> döviz alım-satımının TL likiditesi üzerindeki etkisini APİ ile nötrlemek. Örnek: döviz alımıyla oluşan likidite fazlasını TL depo alım ihalesiyle çekmek.<\/li>\n<li><b>Rezerv Opsiyon Mekanizması (ROM):<\/b> bankaların TL zorunlu karşılıklarının bir kısmını <b>döviz ve altın<\/b> cinsinden tutabilmesi; sermaye akımı kaynaklı kur ve likidite oynaklığını sınırlamak için otomatik dengeleyici. <b>ROO<\/b> (rezerv opsiyonu oranı) = tutulabilecek üst limit; <b>ROK<\/b> (rezerv opsiyonu katsayısı) = her birim TL karşılık yerine tutulması gereken döviz/altın oranı. Sermaye girişinde ROM kullanımı artar, çıkışta azalır. TCMB 2022 Para ve Kur Politikası Raporu'nda <b>2022 başı itibarıyla ROM'a son verdiğini<\/b> açıkladı; <b>ROK uygulaması devam<\/b> ediyor.<\/li>\n<\/ul>\n<h4>Amaçlar ve türler<\/h4>\n<ul>\n<li><b>Para politikası amaçları:<\/b> fiyat istikrarı, tam istihdam, finansal piyasalarda istikrar, döviz kurlarında istikrar (ödemeler dengesinin denkliği), faiz oranlarında istikrar, ekonomik büyüme, dış ödemeler dengesi.<\/li>\n<li><b>Daraltıcı (sıkı) para politikası:<\/b> para arzı azaltılır, faiz yükselir, tasarruf artar, talep baskısı azalır; enflasyonda kullanılır.<\/li>\n<li><b>Genişletici (gevşek) para politikası:<\/b> para arzı artırılır, faiz düşer, tüketim artar; durgunluk ve işsizlikte kullanılır; enflasyonist etki yapabilir.<\/li>\n<\/ul>\n<h4>LM eğrisi<\/h4>\n<ul>\n<li>LM, para piyasasını dengede tutan faiz-gelir bileşimleridir; <b>pozitif eğimlidir<\/b>. Reel para talebi L = kY - hi (k gelire, h faize duyarlılık); denklem: <b>i = (1/h) × (kY - M/P)<\/b>.<\/li>\n<li>Reel para arzı artışı LM'yi aşağı/sağa kaydırır. <b>k azaldıkça, h arttıkça<\/b> LM yatıklaşır.<\/li>\n<li>LM'nin <b>solunda para arz fazlası<\/b>, <b>sağında para talep fazlası<\/b> vardır.<\/li>\n<li><b>Sağa kaydıranlar:<\/b> genişletici para politikası; ödeme sistemlerindeki değişim (kredi kartı); servetin azalması; alternatif finansal araçların artması (hepsi para talebini azaltır).<\/li>\n<li>Para talebinin faiz esnekliği sıfır → LM <b>dikey (Klasik durum)<\/b>; sonsuz → LM <b>yatay (Keynesyen durum, likidite tuzağı)<\/b>.<\/li>\n<\/ul>\n<h4>Politikada gecikmeler<\/h4>\n<ul>\n<li><b>İçsel gecikmeler:<\/b> <b>tanı<\/b> (sorunun fark edilmesi), <b>karar<\/b> (analiz ve veri toplama), <b>uygulama<\/b> (karar ile uygulama arası).<\/li>\n<li><b>Dışsal gecikme (etki gecikmesi):<\/b> uygulama ile etkinin görülmesi arası.<\/li>\n<\/ul>", "sorular": [{"q": "Aşağıdakilerden hangisi paranın işlevlerinden biri değildir?", "o": ["Hesap birimi olma", "Mübadele aracı olma", "Standart olma", "Servet saklama aracı olma", "Değer ölçüsü olma"], "a": 2, "e": "Paranın üç işlevi hesap birimi (değer ölçüsü), mübadele aracı ve servet saklama aracıdır. Standart olma paranın sahip olması gereken bir özelliktir."}, {"q": "Para ikamesinin ortaya çıkmasının temel nedeni aşağıdakilerden hangisidir?", "o": ["Sürekli ve yüksek enflasyon ile yerli paranın sürekli değer kaybetmesi", "Faiz oranlarının düşük olması", "Merkez bankası bağımsızlığının artması", "Bütçe fazlası verilmesi", "Kaydi paranın yaygınlaşması"], "a": 0, "e": "Para ikamesinin iki temel nedeni sürekli yüksek enflasyon ve yerli paranın sürekli, güçlü değer kaybıdır; en önemli sonucu para politikasının etkinliğinin azalmasıdır."}, {"q": "\"Kötü para iyi parayı kovar\" görüşü hangi isimle bilinir?", "o": ["Say Kanunu", "Engel Kanunu", "Okun Yasası", "Gresham Kanunu", "Wagner Kanunu"], "a": 3, "e": "Gresham Kanunu'na göre değeri düşük para dolaşımda kalır, değerli para saklanır."}, {"q": "Tek bankalı ve serbest karşılık tutulmayan bir sistemde 2.000 TL mevduat yatırılmıştır. Zorunlu karşılık oranı %20 ise sistemde oluşabilecek toplam kaydi para (mevduat) tutarı kaçtır?", "o": ["400 TL", "10.000 TL", "1.600 TL", "8.000 TL", "20.000 TL"], "a": 1, "e": "M = A × 1/r = 2.000 × 1/0,20 = 10.000 TL."}, {"q": "Zorunlu karşılık oranı %8, serbest
