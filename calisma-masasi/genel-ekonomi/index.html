q": "Dış ticareti sıfır toplamlı bir oyun olarak gören, ihracatın teşvikini ve altın-gümüş biriktirilmesini savunan yaklaşım hangisidir?", "o": ["Mutlak üstünlükler teorisi", "Merkantilizm", "Karşılaştırmalı üstünlükler teorisi", "Heckscher-Ohlin teorisi", "Dış ticaret akımları yaklaşımı"], "a": 1, "e": "16. ve 17. yüzyılda etkili olan merkantilizm dış ticaret fazlasını ve kıymetli maden birikimini savunur."}, {"q": "Aşağıdakilerden hangisi ödemeler dengesinin kalemlerinden biri değildir?", "o": ["Cari işlemler hesabı", "Sermaye hesabı", "Finans hesabı", "Net hata ve noksan", "Döviz kuru hesabı"], "a": 4, "e": "Ödemeler dengesi cari işlemler hesabı, sermaye ve finans hesabı ile net hata ve noksan kaleminden oluşur."}, {"q": "Net hata ve noksan kaleminin büyük tutarlı ve sürekli aynı işaretli olması neye işaret eder?", "o": ["Verilerin sağlıklı derlendiğine", "Cari fazla verildiğine", "Kayıt dışılığın yüksek olduğuna ve/veya sistematik ölçüm hatasına", "Sabit kur rejimine geçildiğine", "Rezervlerin arttığına"], "a": 2, "e": "Küçük ve değişen işaretli tutarlar sağlıklı veriye, büyük ve sürekli aynı işaretli tutarlar kayıt dışılığa veya sistematik hatalara işaret eder."}, {"q": "Aşağıdakilerden hangisi dış ticaret politikası araçlarından biri değildir?", "o": ["Açık piyasa işlemleri", "Gümrük tarifeleri", "İthalat kotaları", "Bağlı ticaret", "İhracatın özendirilmesi"], "a": 0, "e": "Açık piyasa işlemleri bir para politikası aracıdır."}, {"q": "İthalatçı ile ihracatçının doğrudan ilişki kurmadığı, ödemelerin kliring ofisleri ve merkez bankaları aracılığıyla yerli parayla yapıldığı bağlı ticaret yöntemi hangisidir?", "o": ["Takas", "Switch", "Offset", "Kliring", "Gönüllü ihracat kısıtlaması"], "a": 3, "e": "Kliring takasın gelişmiş halidir; ticarette döviz kullanılmaz ve taraflar doğrudan ilişki içinde olmaz."}, {"q": "İhracatı 180, ithalatı 240 milyar dolar olan bir ülkenin ihracatın ithalatı karşılama oranı kaçtır?", "o": ["%33", "%75", "%60", "%133", "%25"], "a": 1, "e": "Karşılama oranı = X / M × 100 = 180 / 240 × 100 = %75."}, {"q": "DTÖ'nün \"en çok kayrılan ülke\" kuralının istisnaları arasında aşağıdakilerden hangisi yer almaz?", "o": ["Gümrük birliği", "Serbest ticaret anlaşmaları", "Genelleştirilmiş tercihler sistemi", "Anti-damping ve telafi edici vergiler", "İki üye arasındaki kültürel benzerlik nedeniyle tanınan ayrıcalıklar"], "a": 4, "e": "Kurala göre kültürel veya siyasi benzerlik nedeniyle bir üyeye tanınan ayrıcalık diğer üyelere de tanınmalıdır; bu bir istisna değil kuralın kendisidir."}, {"q": "Basel III kriterlerine göre sermaye koruma tamponu, çekirdek sermaye yeterliliğine ilaveten ne kadar olmalıdır?", "o": ["%1", "%2", "%2,5", "%4,5", "%8"], "a": 2, "e": "Sermaye koruma tamponu Basel III'e göre çekirdek sermaye yeterliliğine ilaveten %2,5'tir."}, {"q": "Şube bilgisi içeren bir SWIFT kodu kaç haneden oluşur ve ilk dört karakter neyi gösterir?", "o": ["11 hane – banka", "8 hane – ülke", "11 hane – şehir", "8 hane – şube", "12 hane – banka"], "a": 0, "e": "SWIFT kodu 11 hanedir: ilk 4 banka, sonraki 2 ülke, sonraki 2 şehir, son 3 şube. Şube belirtilmezse 8 hanedir."}, {"q": "Nominal döviz kurunun 30, yurt dışı fiyat düzeyinin 120, yurt içi fiyat düzeyinin 180 olduğu durumda reel döviz kuru kaçtır?", "o": ["30", "45", "24", "20", "15"], "a": 3, "e": "Reel kur = nominal kur × (yurt dışı fiyat / yurt içi fiyat) = 30 × 120 / 180 = 20."}, {"q": "Döviz piyasasında alım-satım makası ile ilgili hangisi yanlıştır?", "o": ["Likidite arttıkça makas daralır", "Vadeli piyasada makas spot piyasaya göre daha dardır", "İşlem büyüklüğü arttıkça makas genişler", "Risk arttıkça makas genişler", "Vadeli piyasada vade uzadıkça makas genişler"], "a": 1, "e": "Vadeli piyasa spot piyasaya göre daha az likit olduğu için makas daha geniştir."}, {"q": "Kitaptaki gösterimle (pay fiyat, payda baz para birimi) AUD/USD = 1,20 ve USD/EUR = 1,10 ise AUD/EUR çapraz kuru kaçtır?", "o": ["1,09", "0,92", "2,30", "0,76", "1,32"], "a": 4, "e": "AUD/EUR = (AUD/USD) × (USD/EUR) = 1,20 × 1,10 = 1,32; yani 1 EUR = 1,32 AUD."}, {"q": "Spot kuru 1,2520 olan bir döviz çiftinde 3 aylık vade puanı +90 ise 3 ay vadeli kur kaçtır?", "o": ["1,2430", "1,3420", "1,2610", "1,2529", "1,2511"], "a": 2, "e": "Vadeli kur = spot + vade puanı / 10.000 = 1,2520 + 0,0090 = 1,2610; puan pozitif olduğu için baz para primlidir."}, {"q": "Spot kurun 4,00, fiyat para biriminin yıllık faizinin %10, baz para biriminin yıllık faizinin %5 olduğu durumda korumalı faiz paritesine göre 1 yıl vadeli kur yaklaşık kaçtır?", "o": ["4,19", "3,82", "4,00", "4,20", "4,40"], "a": 0, "e": "F = S × (1 + ip) / (1 + ib) = 4,00 × 1,10 / 1,05 ≈ 4,19."}, {"q": "Korumasız faiz oranı paritesine göre yabancı ülkede faiz %12, yerli ülkede %4 ise ne beklenir?", "o": ["Yerli paranın %8 değer kaybetmesi", "Kurun değişmemesi", "Yerli paranın %16 değer kazanması", "Yerli paranın %8 değer kazanması", "Yabancı paranın %8 değer kazanması"], "a": 3, "e": "%ΔS = if - id = 12 - 4 = %8; yüksek faizli yabancı para değer kaybeder, yerli para %8 değer kazanır."}, {"q": "Başlangıçta 1 dolar = 5 TL iken bir yılda Türkiye'de enflasyon %20, ABD'de %4 olmuştur. Kitaptaki göreceli satın alma gücü paritesi formülüne, (S1 - S0)/S0 = fT - fA, göre yıl sonu kuru kaç olmalıdır?", "o": ["5,20", "5,80", "6,00", "6,20", "4,20"], "a": 1, "e": "(S1 - S0)/S0 = 0,20 - 0,04 = 0,16 → S1 = 5 × 1,16 = 5,80 TL. Yüksek enflasyonlu ülkenin parası (TL) değer kaybeder, dolar kuru yükselir."}, {"q": "Fisher hipotezine göre A ülkesinde beklenen enflasyon %8 ve nominal faiz %11, B ülkesinde beklenen enflasyon %20 ise B ülkesinde nominal faiz kaç olmalıdır?", "o": ["%20", "%31", "%9", "%28", "%23"], "a": 4, "e": "Reel faiz A'da 11 - 8 = %3'tür; reel faizler eşit olacağından B'de nominal faiz 3 + 20 = %23."}, {"q": "Döviz kurunun önceden ilan edilen minimum ve maksimum sınırlar içinde dalgalanmaya bırakıldığı karma rejim hangisidir?", "o": ["Kayan kur", "Ayarlanabilir kur", "Döviz kuru bandı", "Ortak dalgalanma", "Gözetimli dalgalanma"], "a": 2, "e": "Döviz kuru bandı rejiminde alt ve üst sınırlar önceden ilan edilir; sınırlar aşılırsa otorite müdahale eder."}, {"q": "Yerli paranın yasal olarak bir yabancı paraya sabitlendiği ve yalnız döviz rezervi karşılığında basıldığı sert sabit kur rejimi hangisidir?", "o": ["Para kurulu", "Dolarizasyon", "Para birliği", "Sürünen parite", "Yönetilen dalgalı kur"], "a": 0, "e": "Para kurulunda (currency board) yerli para yasal olarak sabitlenir ve döviz rezervleri karşılığında basılır."}, {"q": "SDR'nin değerini belirleyen rezerv paralar arasında aşağıdakilerden hangisi yer almaz?", "o": ["ABD doları", "Euro", "Japon yeni", "İsviçre frangı", "Çin yuanı"], "a": 3, "e": "SDR'nin değeri USD, EUR, JPY, GBP ve CNY olmak üzere beş rezerv para esas alınarak belirlenir."}, {"q": "Mundell-Fleming modeline göre tam sermaye hareketliliği altında sabit kur rejiminde hangisi doğrudur?", "o": ["Para politikası etkin, maliye politikası etkin değildir", "Para politikası etkin değil, maliye politikası etkindir", "İkisi de etkindir", "İkisi de etkin değildir", "Para politikası yalnız faizi düşürür"], "a": 1, "e": "Sabit kurda para genişlemesi sermaye çıkışı ve müdahaleyle geri alınır; maliye genişlemesinde ise müdahale para arzını artırarak etkiyi büyütür."}, {"q": "Tam sermaye hareketliliği ve esnek kur altında genişletici maliye politikasının sonucu nedir?", "o": ["Sermaye çıkar, yerli para değer kaybeder, gelir artar", "Merkez bankası döviz alır, LM sağa kayar", "Faiz kalıcı olarak dünya faizinin üstünde kalır", "Gelir ve faiz kalıcı olarak artar", "Sermaye girer, yerli para değer kazanır, net ihracat düşer ve gelir değişmez"], "a": 4, "e": "Faiz artışı sermaye girişi yaratır, yerli para değer kazanır, ithalat artar; IS eski yerine döner ve maliye politikası etkisiz kalır."}, {"q": "Sınırlı sermaye hareketliliği altında para ve maliye politikalarının etkinliği hangi seçenekte doğru verilmiştir?", "o": ["Sabit kurda ikisi de etkin, esnek kurda ikisi de etkin değil", "Sabit kurda yalnız maliye etkin", "Sabit kurda ikisi de etkin değil, esnek kurda ikisi de etkin", "Esnek kurda yalnız para etkin", "Her rejimde yalnız maliye etkin"], "a": 2, "e": "Kitaptaki tabloya göre sınırlı sermaye hareketliliğinde sabit kurda her iki politika da etkin değil, esnek kurda her ikisi de etkindir."}]}];
const P={"1": ["Merhaba, Genel Ekonomi dersinin ilk bölümündeyiz. Bugün temel kavramlarla başlıyoruz: ekonominin temel soruları, fayda, üretim olanakları, arz, talep ve esneklik. Bu bölüm hem tanım soruları hem de kısa hesap soruları açısından çok verimli, o yüzden formülleri de birlikte konuşacağız.", "Ekonomi, sınırsız ihtiyaçları kıt kaynaklarla en iyi nasıl karşılayacağımızı inceler. Ekonominin dört aktörü var: hane halkları, firmalar, devlet ve dış âlem. Sınavda sık görülen bir ayrım normatif ve pozitif ekonomi. İşsizlik ne olmalı, büyüme ne olmalı gibi olması gerekeni tartışan sorular normatif; faiz artarsa tüketim nasıl etkilenir gibi sebep sonuç soruları pozitif ekonominin alanıdır.", "Mikro ve makro ayrımını da netleştirelim. Bireyin geliri, bir malın fiyatı, firmanın maliyeti mikro; milli gelir, enflasyon, istihdam, ödemeler bilançosu makrodur. Ekonominin üç temel sorusu ise şunlar: ne üretilecek, nasıl üretilecek ve kimin için üretilecek. İlk soru fiyat teorisinin temelini oluşturur. Ekonomik sistemlerde de merkezi sistemde fiyat mekanizmasının işlemediğini, karma sistemde özel ve kamu mülkiyetinin bir arada bulunduğunu hatırla.", "Şimdi faydaya geçelim. Kardinal fayda yaklaşımında fayda util ile ölçülebilir. Marjinal fayda, her ilave birimin toplam faydaya katkısıdır ve tükettikçe azalır; buna azalan marjinal fayda kanunu denir. Toplam faydanın en yüksek olduğu noktaya doyum noktası denir ve burada marjinal fayda sıfırdır. Toplam fayda düşmeye başladığında marjinal fayda negatife döner.", "Ordinal yaklaşımda ise fayda ölçülmez, sadece sıralanır ve kayıtsızlık eğrileri kullanılır. Bu eğriler negatif eğimlidir, birbirini kesmez, orijine göre dışbükeydir ve orijinden uzaklaştıkça daha yüksek faydayı gösterir. Dışbükeyliğin nedeni azalan marjinal ikame oranıdır. Burada bir tuzak var: eş ürün eğrisinde aynı soru sorulursa cevap azalan marjinal teknik ikame oranıdır, karıştırma.", "Tüketici dengesi, kayıtsızlık eğrisinin bütçe doğrusuna teğet olduğu noktadır. Özel durumları da ezberle: tam tamamlayıcı mallarda eğri L şeklinde, tam ikame mallarda iki ekseni kesen düz bir doğru, bir mal kötü bir mal normal ise eğri pozitif eğimlidir.", "Üretim faktörleri ve gelirleri klasik bir soru tipidir. Emek ücret, sermaye faiz, doğal kaynak rant, girişimci kâr kazanır. Sınavda sermaye ile rant eşleştirilmişse o yanlış şıktır. Ayrıca kitap, bir ülkenin orta gelir tuzağından çıkması için en önemli unsurun beşeri sermaye birikimi olduğunu vurguluyor.", "Üretim olanakları eğrisi iki malın üretilebileceği en yüksek bileşimleri gösterir. Orijine göre içbükeydir ve artan fırsat maliyetine sahiptir. Eğimi marjinal dönüşüm oranıdır ve fırsat maliyetine eşittir. Eğrinin içi atıl kaynak ve işsizlik demektir, dışı ise mevcut kaynaklarla imkânsızdır. Teknoloji, emek ya da sermaye artışı eğriyi sağa kaydırır.", "Arz ve talepte en çok sorulan nokta hareket ile kayma ayrımıdır. Malın kendi fiyatı değişirse eğri üzerinde hareket olur. Fiyat dışındaki her şey eğriyi kaydırır. Arzı artıran faktörler: maliyetin düşmesi, teknolojik gelişme, üretici sayısının artması ve fiyatın ileride düşeceği beklentisi. Talebi artıranlar ise gelir artışı, nüfus artışı, tamamlayıcı malın ucuzlaması, ikame malın pahalanması ve fiyatın ileride artacağı beklentisidir.", "Mal türlerine dikkat. Normal malda gelir artınca talep artar. Düşük malda gelir artınca talep azalır. Giffen malı fiyatı artınca talebi de artan özel bir düşük maldır; Henry Giffen bunu İrlanda'daki yoksul işçilerin patates talebinde gördü. Şu cümle çok sorulur: her Giffen malı düşük maldır ama her düşük mal Giffen malı değildir. Gösteriş amaçlı Veblen mallarında da fiyat arttıkça talep artar.", "Piyasa dengesinde hesap sorusu çok kolay puandır. Arz ve talep fonksiyonlarını birbirine eşitlersin. Mesela arz dört artı dört P, talep kırk eksi beş P ise dokuz P otuz altı eder, fiyat dört, miktar yirmi bulunur. Arz ve talep aynı oranda artarsa fiyat değişmez ama miktar artar; arz artışı talep artışından büyükse fiyat düşer, miktar artar.", "Esnekliğe gelelim. Talebin fiyat esnekliği, talep miktarındaki yüzde değişimin fiyattaki yüzde değişime oranıdır. Kitaptaki örnekte fiyat on liradan on beş liraya çıkıyor, miktar iki yüzden yüz altmışa düşüyor; eksi yüzde yirmi bölü yüzde elli, sonuç eksi sıfır virgül dört. Mutlak değeri birden küçük olduğu için talep inelastiktir.", "Esneklik türlerini grafikle eşleştir: yatay talep eğrisi sonsuz esnek, dikey talep eğrisi tam inelastik, yani esneklik sıfır. Yay esnekliğinde orta nokta formülü kullanılır, yani değişimleri iki değerin ortalamasına bölersin. Sürekli bir fonksiyonda nokta esnekliği, türev çarpı fiyat bölü miktardır. Q eşittir A çarpı P üzeri eksi bir olan eğri her noktada birim esnektir.", "Çapraz esneklikte işarete bak: negatifse mallar tamamlayıcı, pozitifse ikame, sıfırsa bağımsızdır. Gelir esnekliği de talep miktarındaki yüzde değişimin gelirdeki yüzde değişime oranıdır; negatif çıkarsa düşük mal demektir. Engel eğrisi de gelir ile talep arasındaki bu ilişkinin, yani gelir esnekliğinin grafiğidir.", "Bölümü özetleyelim. Bir: normatif olması gerekeni, pozitif sebep sonucu inceler. İki: doyum noktasında marjinal fayda sıfırdır ve kayıtsızlık eğrilerinin dışbükeyliği azalan marjinal ikame oranındandır. Üç: kendi fiyat değişimi eğri üzerinde hareket, diğer faktörler kayma yaratır. Dört: her Giffen malı düşük maldır, tersi doğru değildir. Beş: çapraz esneklik negatifse tamamlayıcı, pozitifse ikame. Şimdi sorulara geçebilirsin."], "2": ["Merhaba, Genel Ekonomi dersinin ikinci bölümündeyiz. Bugün üretim, maliyetler ve piyasa türlerini konuşacağız. Bu bölümde hem tablolardan hesap soruları hem de piyasa modellerinin karşılaştırması sık soruluyor.", "Önce kısa dönem üretim. Kısa dönemde emek değişken, sermaye sabittir; uzun dönemde ise ikisi de değişkendir. Üç kavramı ayır: toplam ürün, ortalama ürün ve marjinal ürün. Ortalama ürün toplam ürünün emek sayısına bölümüdür. Marjinal ürün ise eklenen her işçinin toplam ürüne katkısıdır, yani toplam üründeki değişimdir.", "Kitaptaki tabloda üçüncü işçiye kadar marjinal ürün artıyor, dördüncü işçiden itibaren azalıyor. Bu azalan verimler kanunudur. Dördüncü işçide marjinal ürün ortalama ürüne eşit ve tam bu noktada ortalama ürün en yüksek değerinde, kırk birim. Dokuzuncu işçide toplam ürün maksimum ve marjinal ürün sıfır; onuncu işçide marjinal ürün eksi on altı.", "Burada çok sorulan bir tuzak var. Marjinal ürün azalmaya başladığında ortalama ürün hemen düşmez. Marjinal ürün ortalamanın üzerinde kaldıkça ortalama artmaya devam eder. Yani marjinal ürünün azaldığı her yerde ortalama da azalır cümlesi yanlıştır.", "Uzun dönemde eş ürün eğrileri kullanılır. Bu eğriler aynı üretimi veren sermaye ve emek bileşimlerini gösterir. Eğimleri marjinal teknik ikame oranıdır ve orijine göre dışbükeydirler. Eş maliyet doğrusunda sermayenin fiyatı faiz, emeğin fiyatı ücrettir. Üretici dengesi eş ürün eğrisinin eş maliyet doğrusuna teğet olduğu noktadır. Tüketici dengesiyle karıştırma: orada kayıtsızlık eğrisi ve bütçe doğrusu vardı.", "Maliyetlere geçelim. Sabit maliyet üretimden bağımsızdır, kira gibi. Değişken maliyet üretimle değişir, ücret gibi. Ortalama toplam maliyet ile ortalama değişken maliyet arasındaki fark ortalama sabit maliyettir ve üretim arttıkça bu fark daralır. Marjinal maliyet, toplam maliyetteki değişimin üretimdeki değişime oranıdır.", "Şimdi en önemli iki nokta. Marjinal maliyet eğrisi ortalama değişken ve ortalama toplam maliyet eğrilerini minimum noktalarından keser. Ortalama toplam maliyetin minimumu başabaş noktası, ortalama değişken maliyetin minimumu kapanma noktasıdır. Marjinal maliyet eğrisinin kapanma noktasının üstünde kalan kısmı firmanın kısa dönem arz eğrisidir. Fiyat bu iki nokta arasındaysa firma zarar etse de üretmeye devam eder, çünkü kapanırsa sabit maliyetin tamamını kaybeder.", "Ölçeğe göre getiriyi bir örnekle akılda tut. Girdileri yüzde on artırdın; çıktı yüzde on beş artarsa artan, yüzde on artarsa sabit, yüzde beş artarsa azalan getiri. Ölçek ekonomilerinde de içsel ekonomiler uzun dönem maliyet eğrisinin eğimini, dışsal ekonomiler ise konumunu değiştirir. Pozitif dışsal ekonomi eğriyi aşağı, negatif dışsal ekonomi yukarı kaydırır.", "Tam rekabet piyasasının dört koşulu var: mobilite yani giriş çıkış serbestliği, atomisite yani çok sayıda alıcı satıcı, homojenlik ve şeffaflık. Uzun dönemde aşırı kâr olmamasının asıl nedeni mobilitedir. Tam rekabetçi firmanın talep eğrisi yatay ve sonsuz esnektir; fiyat, ortalama gelir ve marjinal gelir eşittir. Denge koşulu fiyat eşittir marjinal maliyet eşittir marjinal gelir.", "Monopolde tek satıcı, çok alıcı, giriş engeli ve yakın ikamesi olmayan bir ürün vardır. Monopolleşmenin nedenleri: devletin tek yetki vermesi, ölçek ekonomileri, patent ya da lisans, firmalar arası anlaşma ve tek ithalatçı olma. Monopol dengesi marjinal gelirin marjinal maliyete eşit olduğu noktadır. Monopol gücünü Lerner endeksi ölçer: fiyattan marjinal maliyeti çıkarıp fiyata bölersin. Fiyat elli, marjinal maliyet otuz ise endeks sıfır virgül dörttür.", "Fiyat farklılaştırmasının üç derecesini ayır. Birinci derece her birimi ayrı fiyattan satıp tüketici rantının tamamını almaktır, en kârlısıdır ama pratikte zordur. İkinci derece kullanım miktarına göre fiyat vermektir, elektrik kademeleri gibi. Üçüncü derece piyasayı esnekliklere göre bölmektir; esnek piyasaya düşük fiyat verilir ve piyasalar arasında arbitraj olmaması gerekir.", "Monopolcü rekabet hem monopolün hem tam rekabetin özelliklerini taşır. Çok alıcı ve çok satıcı vardır, giriş serbesttir ama en önemli fark ürün farklılaştırmasıdır. Hayatta en sık karşılaştığımız piyasa budur. Etkinlik sağlanmaz, çünkü fiyat marjinal maliyete eşit değildir; fiyat tam rekabetten yüksek, üretim düşüktür.", "Oligopolde birkaç firma vardır ve firmalar birbirine bağımlıdır. Düopol modellerini şöyle grupla. Cournot ve Stackelberg miktar rekabeti yapar. Cournot'da n firma varsa toplam üretim n bölü n artı birdir; iki firmada üçte iki, üç firmada dörtte üç. Stackelberg'de lider firma kazançlıdır, takipçi kaybeder ve fiyat Cournot'dan düşüktür.", "Bertrand fiyat rekabetidir ve fiyat marjinal maliyete kadar iner; en düşük denge fiyatı buradadır. Edgeworth'te istikrarlı bir denge yoktur. Chamberlin'de firmalar ders çıkarır, talebin yarısını paylaşırlar ve sonuç monopolle aynıdır. Sweezy'de ise dirsekli talep eğrisi vardır: rakipler fiyat artışına uymaz, indirime uyar, bu yüzden fiyatlar katıdır.", "Bölümü özetleyelim. Bir: marjinal ürün ortalama ürünün üzerindeyse ortalama ürün artar. İki: başabaş noktası ortalama toplam maliyetin, kapanma noktası ortalama değişken maliyetin minimumudur. Üç: tam rekabette denge fiyat eşittir marjinal maliyet eşittir marjinal gelir, monopolde marjinal gelir eşittir marjinal maliyet. Dört: Lerner endeksi fiyat eksi marjinal maliyet bölü fiyattır. Beş: Bertrand en düşük fiyat, Chamberlin monopol sonucu, Edgeworth istikrarsız, Sweezy dirsekli talep. Şimdi sorulara geçebilirsin."], "3": ["Merhaba, Genel Ekonomi dersinde para politikaları bölümündeyiz. Bu bölüm geniş ama sınavda en çok soru çıkan yerlerden biri. Paranın işlevlerinden başlayıp kaydi para hesabına, para talebi teorilerine, Türkiye Cumhuriyet Merkez Bankasına ve para politikası araçlarına kadar ilerleyeceğiz.", "Paranın üç işlevi var: hesap birimi yani değer ölçüsü, mübadele aracı ve servet saklama aracı. Paranın özellikleri ise ayrı bir listedir: standart olmak, genel kabul görmek, taşınabilir, taklit edilemez, bölünebilir ve dayanıklı olmak. Sınavda standart olmak işlev olarak sorulursa yanlış şıktır. Bir de Gresham kanununu hatırla: kötü para iyi parayı kovar.", "Para ikamesi, yerli paranın işlevlerini başka bir ülkenin parasının üstlenmesidir. İki temel nedeni var: sürekli yüksek enflasyon ve yerli paranın sürekli değer kaybı. En önemli sonucu da merkez bankasının para politikasının etkisini kaybetmesidir. Asli para ise merkez bankasının bastığı kâğıt para ile Hazine ve Maliye Bakanlığı darphanesinin bastığı bozukluklardır; yani madeni parayı merkez bankası basmaz.", "Şimdi kaydi para hesabı. Tek banka, serbest karşılık yok ve sızıntı yok varsayımıyla, yatırılan mevduatı zorunlu karşılık oranına bölersin. Bin lira mevduat ve yüzde on karşılıkta toplam on bin liraya ulaşılır. Banka serbest karşılık da tutuyorsa paydaya zorunlu ve serbest karşılık oranlarının toplamını koyarsın. Para çarpanı da bir artı nakit mevduat oranının, zorunlu karşılık oranı artı nakit mevduat oranına bölümüdür; zorunlu karşılık artarsa çarpan küçülür.", "Para arzı yaklaşımlarında sıralama önemli. Klasik yaklaşım en dar tanımı yapar: nakit artı vadesiz mevduat. Chicago yaklaşımı yani Friedman ve Meiselman vadeli mevduatı da ekler, bu da M iki demektir. Gurley ve Shaw tüm likit değerleri ağırlıklandırarak toplar. Radcliffe ise krediyi parayla eş görür ve likidite arzı kavramıyla en geniş tanımı yapar. Türkiye'de M bir dolaşımdaki para artı vadesiz mevduat, M iki buna vadeli mevduatın eklenmesi, M üç ise repo, para piyasası fonları ve ihraç edilen menkul kıymetlerin eklenmesiyle bulunur.", "Repoda kim ne yapıyor sorusuna dikkat. Repo yapan menkul kıymeti satan ve fon talep eden taraftır. Ters repoda ise menkul kıymet geri satma taahhüdüyle alınır. Merkez bankası açısından şunu aklında tut: bankalardan geri satma taahhüdüyle menkul kıymet alıyorsa piyasaya likidite veriyor, menkul kıymet veriyorsa likidite çekiyor. Kitap bu işlemleri farklı yerlerde farklı adlarla anıyor, o yüzden işlemin yönüne bak.", "Para talebi teorilerine geçelim. Klasiklerde Irving Fisher'ın miktar teorisi var: para miktarı çarpı dolaşım hızı, fiyat düzeyi çarpı hasılaya eşittir. Burada para talebinin faiz esnekliği sıfırdır ve kısa dönemde dolaşım hızı ile hasıla sabittir. Hesap sorusu kolay: nominal gelir yirmi milyar, para miktarı dört milyar ise dolaşım hızı beştir. Cambridge yaklaşımında Marshall ve Pigou para talebini k çarpı fiyat çarpı gelir olarak yazar; k, dolaşım hızının tersidir ve Pigou gelir yerine serveti kullanır.", "Keynes likidite tercihi teorisinde üç güdü sayar: işlem, ihtiyat ve spekülasyon. Spekülasyon güdüsü yalnızca faizin negatif fonksiyonudur ve Klasiklerde yoktur. Faiz en alt sınıra indiğinde para talebi sonsuz esnek olur, kimse tahvil almaz ve LM eğrisi yatay hale gelir; buna likidite tuzağı denir. Friedman'ın modern miktar teorisinde ise para talebi sürekli gelire bağlıdır, faizin etkisi azdır ve beşeri sermaye yüksek olan daha çok para tutar.", "Merkez bankasına gelelim. Yirmi beş Nisan iki bin bir tarihli bin iki yüz on bir sayılı Kanun değişikliğiyle Türkiye Cumhuriyet Merkez Bankasının temel amacı fiyat istikrarını sağlamak ve sürdürmek olarak belirlendi. Amaç kanunla verildiği için amaç bağımsızlığı yoktur, ama araçları kendisi seçtiği için araç bağımsızlığı yani fonksiyonel bağımsızlık vardır. Aynı değişiklikle Hazineye avans ve kredi verme ile birincil piyasadan devlet borçlanma senedi alımı yasaklandı.", "Bretton Woods'u rakamlarla hatırla: bin dokuz yüz kırk dört, kırk dört ülke, bir ons altın otuz beş dolar. Uluslararası Para Fonu ve Dünya Bankası bin dokuz yüz kırk altıda faaliyete geçti, sistem bin dokuz yüz yetmiş birde sona erdi. Banknot ilkesinde Ricardo yüzde yüz altın karşılığı ister, bankacılık ilkesi ise reeskont gibi alacakları da karşılık sayar.", "Taylor kuralında nominal faiz; reel faiz, enflasyon, enflasyon sapması ve çıktı açığına göre belirlenir. Enflasyon hedefi aşar ya da hasıla potansiyelin üstüne çıkarsa faiz artırılmalıdır. Enflasyon hedeflemesini ilk uygulayan Yeni Zelanda'dır; Türkiye'de iki bin bir sonrası örtük, iki bin altıdan itibaren açık enflasyon hedeflemesi uygulandı. Kontrol ufku, yani faiz kararının enflasyona tam etkisi, genelde on iki ile yirmi dört ay arasıdır.", "Açık mektup çok sorulur. Merkez Bankası Kanununun kırk ikinci maddesine göre Başkan her yıl nisan ve ekim aylarında Cumhurbaşkanına rapor sunar, Banka yılda iki kez Türkiye Büyük Millet Meclisi Plan ve Bütçe Komisyonunu bilgilendirir. Hedefe ulaşılamazsa nedenler ve önlemler Hükümete yazılı olarak bildirilir ve kamuoyuna açıklanır. Faiz koridoru ise gecelik borç verme ve borçlanma faizleri arasındaki alandır; iki bin onda politika faizi bir haftalık repo faizi oldu.", "Bazı rakamlar: Bankalararası Para Piyasası iki Nisan bin dokuz yüz seksen altıda kuruldu, iki bin ikide Merkez Bankası aracılığı bıraktı. Likidite senedinin vadesi doksan bir günü geçemez. Gösterge kurlar her iş günü on beş otuzda ilan edilir; ondan on beşe kadar her saat başı alınan altı değerin ortalaması orta değerdir. Bu kurlar kimseyi bağlamaz ve ertesi gün Resmi Gazetede yayımlanır.", "Para politikası araçları beş tanedir: zorunlu karşılıklar, selektif krediler, kredi tavanı ve tabanı, açık piyasa işlemleri ve reeskont oranı. İç borçlanma bu listede yoktur. Merkez bankasının menkul kıymet alması para arzını artırır ve faizi düşürür. Kalıcı sıkışıklıkta doğrudan alım, kalıcı fazlada doğrudan satım yapılır. Döviz müdahalesinin likidite etkisini açık piyasa işlemleriyle nötrlemeye sterilizasyon denir. Rezerv opsiyon mekanizmasına iki bin yirmi iki başında son verildi, ancak rezerv opsiyonu katsayısı uygulaması sürüyor.", "LM eğrisi para piyasasının dengesidir ve pozitif eğimlidir. Genişletici para politikası, kredi kartı kullanımının artması, servetin azalması ve alternatif finansal araçlar LM'yi sağa kaydırır. LM'nin solunda para arz fazlası, sağında para talep fazlası vardır. Para talebinin faiz esnekliği sıfırsa LM dikeydir, yani Klasik durum; sonsuzsa yataydır, yani Keynesyen likidite tuzağı. Gecikmelerde de tanı, karar ve uygulama içsel; etki gecikmesi dışsaldır.", "Bölümü özetleyelim. Bir: kaydi para eşittir mevduat bölü karşılık oranları toplamı. İki: Fisher'da dolaşım hızı nominal gelir bölü para miktarıdır ve para talebinin faiz esnekliği sıfırdır. Üç: spekülasyon güdüsü yalnız Keynes'te vardır ve likidite tuzağında LM yataydır. Dört: Merkez Bankasının amaç bağımsızlığı yok, araç bağımsızlığı var. Beş: likidite senedi en fazla doksan bir gün, kontrol ufku on iki ile yirmi dört ay, gösterge kur on beş otuz. Şimdi sorulara geçebilirsin."], "4": ["Merhaba, Genel Ekonomi dersinde maliye politikaları bölümündeyiz. Bu bölümde kamu harcamaları, kamu gelirleri ve vergi kavramları, bütçe, çarpan hesapları ve IS LM analizi var. Sınavda en çok hesap sorusu çarpanlardan, en çok tanım sorusu da vergi kavramlarından gelir.", "Kamu harcamaları ekonomik açıdan üçe ayrılır: cari, yatırım ve transfer harcamaları. Cari harcamalarda en büyük pay personel ödemeleridir. Yatırım harcamaları baraj, okul, köprü gibi alt ve üst yapıya gider. Transfer harcamaları ise yapıldıkları dönemde doğrudan mal ve hizmet talebi yaratmaz; faiz ödemeleri, vergi muafiyeti gibi mali transferler ve sosyal yardımlar bu gruptadır.", "Kamu gelirlerinde tanımları iyi ayır. Vergi karşılıksız ve zorunludur, mali güce göre alınır ve kamu gelirlerinin yarısından fazlasını oluşturur. Harç, hizmetten yararlanandan alınır; tapu ve pasaport harcı gibi. Şerefiye, kamu hizmetiyle değeri artan gayrimenkulün sahibinden alınır; belediyelerde harcamalara katılma payı olarak bilinir. Meslek odası ve Sosyal Güvenlik Kurumu aidatları parafiskal gelirdir ve bütçe dışıdır. Senyoraj ise para basmaktan elde edilen gelirdir.", "Anayasanın yetmiş üçüncü maddesi herkesin mali gücüne göre vergi ödemekle yükümlü olduğunu ve vergilerin kanunla konulacağını söyler. Borçlanmada vade sınıflaması da sorulur: bir yıldan az kısa, bir yıldan çok orta, beş yıldan fazla uzun vadelidir. Para ve vergi cezalarının asıl amacı gelir elde etmek değil, kurallara uyumu sağlamaktır.", "Laffer eğrisi, vergi oranı ile vergi geliri arasında ters çan biçimli bir ilişki olduğunu söyler. Bir noktaya kadar oran artarsa gelir artar, sonra azalır; yani geliri maksimize eden bir optimal oran vardır. Ricardocu denklik hipotezinde ise bugünkü vergi indiriminin yarın vergi artışı demek olduğunu bilen rasyonel bireyler tüketmez, tasarruf eder; bu yüzden maliye politikası nötrdür.", "Vergi kavramlarına geçelim. Adam Smith'in dört ilkesi adalet, kesinlik, uygunluk ve iktisadiliktir. İstisna verginin konusunu, muafiyet ise kişiyi vergi dışı bırakır. Katma değer vergisinde satıcı aracı mükellef, alıcı fiili mükelleftir. Yansımanın üç türü var: fiyata yansıtma ileri yansıma, esnekliği düşük başka bir mala yansıtma çapraz yansıma, girdilere yansıtma geri yansımadır. Matrah miktara dayanıyorsa spesifik, değere dayanıyorsa ad valoremdir.", "Dolaylı ve dolaysız vergi listesi mutlaka sorulur. Katma değer vergisi, özel tüketim vergisi, damga vergisi, gümrük vergisi ve banka ve sigorta muameleleri vergisi dolaylıdır; dolaylılar içinde en büyük pay katma değer vergisinindir. Gelir, kurumlar, veraset ve intikal, motorlu taşıtlar ve emlak vergisi dolaysızdır; bunların içinde en büyük pay gelir vergisindir. Türkiye'de dolaylı vergilerin payı daha yüksektir. Kurumlar vergisi yüzde yirmi beşlik düz oranlı, gelir vergisi artan oranlı bir vergidir.", "Bütçenin dokuz ilkesini hatırla: genellik, birlik, yıllık olma, önceden izin alma, alenilik, anlaşılır olma, sübjektif doğruluk, objektif doğruluk ve denklik. Birlik ilkesi tüm gelir ve giderlerin tek bütçede olmasıdır; genellik ilkesi ise bunların ayrı ayrı ve tam gösterilmesi, bir gelirin belli bir gidere bağlanmamasıdır. Bütçe sistemlerinde Türkiye performans bütçe uygular; sıfır tabanlı bütçede her hizmet her yıl ilk kez yapılıyormuş gibi ele alınır.", "Maliye politikasının üç amacı var: ekonomik istikrar, gelir dağılımında adalet ve ekonomik büyüme ile kalkınma. Faiz istikrarı bu listede yoktur. Otomatik istikrarlandırıcılar ise kimse müdahale etmeden krizi yumuşatan unsurlardır: işsizlik sigortası, artan oranlı gelir vergisi, tarımsal destek alımları ve bireylerin tasarrufları. Duesenberry'nin klike etkisi de gelir düşse bile tüketim alışkanlığının tasarruflarla korunmasıdır.", "Şimdi çarpanlar. Kamu harcamaları çarpanı bir bölü bir eksi marjinal tüketim eğilimidir. Vergi çarpanı eksi c bölü bir eksi c, transfer çarpanı c bölü bir eksi c, denk bütçe çarpanı ise birdir. Kitaptaki örnekte marjinal tüketim eğilimi sıfır virgül dokuz: harcama çarpanı on, vergi çarpanı eksi dokuz, transfer çarpanı dokuz. Yani yüz birimlik harcama geliri bin, yüz birimlik transfer dokuz yüz artırır.", "Açık ekonomide ve gelire bağlı vergide çarpanın paydasına vergi oranı ve marjinal ithalat eğilimi girer: bir bölü, bir eksi c çarpı bir eksi t, artı m. Vergi ve ithalat sızıntıdır, bu yüzden arttıkça çarpan küçülür; marjinal tüketim eğilimi arttıkça çarpan büyür. Otonom tüketimin artması çarpanı değil, gelir düzeyini etkiler.", "IS eğrisi mal piyasasının dengesidir ve negatif eğimlidir. Genişletici maliye politikası IS'yi sağa kaydırır, gelir ve faiz birlikte artar. IS'nin solunda yatırım tasarruftan büyüktür, yani mal talep fazlası; sağında mal arz fazlası vardır. Marjinal tüketim eğilimi ve yatırımların faiz esnekliği arttıkça, vergi oranı ve ithalat eğilimi azaldıkça IS yatıklaşır. Komşu ülkenin geliri artarsa ihracat artar ve IS sağa kayar.", "IS LM dengesinde dört durumu ezberle. Genişletici maliye: gelir artar, faiz artar. Genişletici para: gelir artar, faiz düşer. Daraltıcı maliye: gelir ve faiz düşer. Daraltıcı para: gelir düşer, faiz artar.", "Kamunun borçlanması faizi yükseltip özel yatırımı azaltırsa buna dışlama etkisi denir. LM dikleştikçe dışlama artar; LM tamamen dikeyse tam dışlama olur ve çıktı hiç değişmez. Likidite tuzağında ise tam tersi: LM yatay, maliye politikası tam etkin, para politikası etkisizdir.", "Okullara gelince: Klasiklerde ekonomi tam istihdamdadır, fiyat ve ücretler esnek, para nötrdür ve denk bütçe esastır. Keynes'te eksik istihdam ve katı fiyatlar vardır, devlet müdahalesi gerekir. Monetaristler enflasyonun para kaynaklı olduğunu ve paranın uzun dönemde nötr olduğunu söyler; maliye politikası onlara göre yalnız kısa dönemde etkilidir. Yeni Klasikler rasyonel beklentilerle politika etkisizliğini savunur; Yeni Keynesyenler ise kısa dönem katılıklar nedeniyle politikaların etkili olduğunu söyler.", "Bölümü özetleyelim. Bir: transfer harcamaları dönemde doğrudan talep yaratmaz. İki: katma değer vergisinde satıcı aracı, alıcı fiili mükelleftir. Üç: harcama çarpanı bir bölü bir eksi c, vergi çarpanı eksi c bölü bir eksi c, denk bütçe çarpanı birdir. Dört: genişletici maliye politikası gelir ve faizi birlikte artırır, LM dikeyse tam dışlama olur. Beş: politika etkisizliği Yeni Klasiklere aittir. Şimdi sorulara geçebilirsin."], "5": ["Merhaba, Genel Ekonomi dersinde makroekonomik göstergeler bölümündeyiz. Bu bölümde milli gelir hesapları, işsizlik, enflasyon, merkez bankası verileri, konjonktür ve büyüme var. Sınavda en çok formül ve tanım soruları buradan geliyor, o yüzden hesaplara özellikle dikkat edeceğiz.", "Gayri safi yurt içi hasıla, ülke sınırları içinde üretilen nihai mal ve hizmetlerin piyasa değeridir; ara mallar çifte sayımı önlemek için dahil edilmez. Zinciri şöyle ezberle: yurt içi hasılaya dış âlem net faktör gelirlerini eklersen gayri safi milli hasıla; ondan amortismanı düşersen safi milli hasıla; ondan dolaylı vergileri düşersen milli gelir bulunur. Milli gelir, ücret, rant, faiz ve kârın toplamıdır.", "Kişisel gelire geçmek için milli gelirden dağıtılmamış kârları, sosyal güvenlik aidatlarını ve kurumlar vergisini çıkarıp transferleri eklersin. Harcanabilir gelir de kişisel gelirden kurumlar vergisi dışındaki dolaysız vergilerin çıkarılmasıyla bulunur.", "Nominal ve reel ayrımı hesap sorusu olarak gelir. Nominal hasıla cari yıl fiyatlarıyla, reel hasıla baz yıl fiyatlarıyla hesaplanır. Kitaptaki örnekte iki bin yirmi nominal hasıla beş bin beş yüz, reel hasıla iki bin üç yüz elli. Deflatör, nominali reele bölüp yüzle çarparak bulunur; burada yaklaşık iki yüz otuz dört. Büyüme oranı ise reel hasıladaki yüzde değişimdir.", "Harcama yönteminde tüketim, yatırım, kamu harcaması ve net ihracat toplanır. Kamu harcamasına transferler dahil edilmez, çünkü karşılıksızdır. Gelir yönteminde ise ücret, rant, faiz, kâr, amortisman ve dolaylı vergiler toplanır. Milli gelirin yansıtamadıkları da sorulur: çevre kirliliği, boş zaman, kalite iyileşmesi, kayıt dışı ekonomi ve gelirin dağılımı.", "Gelir dağılımında Lorenz eğrisi ve Gini katsayısı var. Gini, A bölü A artı B formülüyle hesaplanır ve sıfır ile bir arasındadır; sıfır tam eşitlik, bire yaklaştıkça eşitsizlik artar. Türkiye'nin Gini katsayısı iki bin yirmide sıfır virgül dört yüz iki oldu. Sargent ve Wallace'ın hoş olmayan monetarist aritmetiği de iç borçla finansmanın uzun dönemde enflasyonist olacağını söyler; bunun için para otoritesinin bağımsız olmaması gerekir.", "İşsizlik oranı, işsiz sayısının işgücüne bölümüdür; işgücüne katılım oranı ise işgücünün yetişkin nüfusa bölümüdür. Daha iyi iş beklediği için çalışmayan iradi işsiz, işsiz sayılmaz. İşsizlik türlerinde konjonktürel işsizliğe eksik talep işsizliği dendiğini, gizli işsizliğin marjinal verimliliği sıfır olanlar olduğunu ve friksiyonel işsizliğin önemli bir refah kaybı yaratmadığını hatırla.", "Doğal işsizlik oranı, enflasyonu hızlandırmayan işsizlik oranıdır ve friksiyonel ile yapısal işsizliğin toplamıdır. Sıfır olamaz ve yüzde dört ile beş civarında kabul edilir. Phillips bin dokuz yüz elli sekizde işsizlik ile ücret artışı arasındaki ters ilişkiyi buldu; Samuelson ve Solow bin dokuz yüz altmışta enflasyonu kullandı; Friedman ve Phelps ise ilişkinin geçici olduğunu, uzun dönem eğrisinin dikey olduğunu gösterdi.", "Okun Yasasına göre işsizlikteki her yüzde birlik artış hasılayı yaklaşık yüzde iki düşürür. Formülde işsizlikteki değişim, eksi sıfır virgül beş çarpı cari büyüme eksi potansiyel büyümedir. Mesela potansiyel beş, cari büyüme bir ise işsizlik iki puan artar. Bu yasa genellikle gelişmekte olan ülkelerde tutmaz.", "Enflasyonda nedenine göre talep ve maliyet enflasyonu ayrılır. Daha fazla paranın daha az malı kovalaması talep enflasyonudur. Maliyet enflasyonunda arz sola kayar, fiyat artarken üretim düşer; buna stagflasyon denir. Hızına göre ılımlı enflasyon yıllık yüzde bir ile on arası, aşırı enflasyon iki hatta üç haneli, hiperenflasyon ise aylık yaklaşık yüzde ellidir ve yabancı para yerli paranın yerini alır.", "Tüketici fiyat endeksiyle enflasyon hesabı basittir: yeni endeksten eskiyi çıkarıp eskiye bölersin. Yüz yirmiden yüz elliye çıkan endeks yüzde yirmi beş enflasyon demektir. Sepette en yüksek ağırlık gıda, en düşük ağırlık eğitimdir. Üretici fiyat endeksi iki bin beşten beri toptan eşya fiyat endeksinin yerine kullanılır. Tüketici fiyat endeksi ithal malları kapsar ve Laspeyres endeksidir; deflatör yalnız yurt içi üretimi kapsar ve Paasche endeksidir. Hoşnutsuzluk endeksi de enflasyon ile işsizliğin toplamıdır.", "Merkez bankası bilançosunda rezerv para; emisyon, bankaların mevduatı, fon hesapları ve banka dışı kesimin mevduatından oluşur. Parasal taban, rezerv paraya açık piyasa işlemlerinin eklenmesiyle; merkez bankası parası ise buna kamu mevduatının eklenmesiyle bulunur. Hazineden alacak bir varlıktır, yükümlülük değildir. Güven endeksleri sıfır ile iki yüz arasında değer alır ve yüzün üstü iyimserliktir. Kapasite kullanım oranı İktisadi Yönelim Anketiyle ölçülür; iki bin yirmi bir Aralıkta yüzde yetmiş sekiz virgül yediydi.", "Konjonktürün dört aşaması dip, canlanma, zirve ve gerilemedir. Pozitif talep şoku uzun dönemde yalnızca fiyatları artırır, yani enflasyona yol açar. Negatif arz şoku, mesela petrol fiyatlarının artması, hem fiyatı yükseltir hem üretimi düşürür. İç denge tam istihdam ve fiyat istikrarı, dış denge ise ödemeler dengesinde açık ya da fazla olmamasıdır.", "Büyümeye geçelim. Potansiyelin üstünde büyüme pozitif çıktı açığıdır ve sıkı politika gerektirir; altında büyüme negatif çıktı açığıdır ve gevşek politika gerektirir. Cobb Douglas fonksiyonunda alfa sermayenin, bir eksi alfa emeğin payıdır. Büyüme muhasebesinde emeğin katkısı bir eksi alfa çarpı emek artışıdır; alfa sıfır virgül dört ve emek artışı yüzde üç ise katkı yüzde bir virgül sekiz olur.", "Solow modelinde durağan büyüme oranı nüfus artışı ile teknolojik ilerlemenin toplamıdır; çalışan başına çıktı ise yalnızca teknolojiye bağlı büyür. Teknoloji modelde dışsaldır. Hollanda Hastalığı, doğal kaynak ihracatından gelen dövizin yerli parayı aşırı değerlendirip diğer sektörleri çökertmesidir. Orta gelir tuzağı kavramı iki bin yedide Dünya Bankası raporunda geçti ve en önemli nedeni beşeri sermaye eksikliğidir. Rekabet endeksi de ihracat eksi ithalatın, ihracat artı ithalata bölümüdür.", "Bölümü özetleyelim. Bir: yurt içi hasılaya net faktör gelirini ekle milli hasıla, amortismanı çıkar safi, dolaylı vergiyi çıkar milli gelir. İki: deflatör nominal bölü reel çarpı yüz, transferler hasılaya girmez. Üç: doğal işsizlik friksiyonel artı yapısal, sıfır olamaz. Dört: Okun'da işsizlikteki yüzde birlik artış hasılayı yaklaşık yüzde iki düşürür, hiperenflasyon aylık yüzde elli civarıdır. Beş: Solow'da durağan büyüme nüfus artı teknoloji, kişi başı büyüme yalnız teknoloji. Şimdi sorulara geçebilirsin."], "6": ["Merhaba, Genel Ekonomi dersinin son bölümündeyiz: dış ticaret ve uluslararası ekonomi. Bu bölümde dış ticaret teorileri, ödemeler dengesi, döviz piyasası, vadeli kur ve parite hesapları, kur rejimleri ve Mundell Fleming modeli var. Hesap soruları özellikle parite koşullarından gelir, o yüzden formülleri basit tutarak anlatacağım.", "Dış ticaret teorileriyle başlayalım. Merkantilizm dış ticareti sıfır toplamlı bir oyun olarak görür; ihracatı teşvik, ithalatı kısıtlamayı ve altın biriktirmeyi savunur. Adam Smith mutlak üstünlükler teorisini, David Ricardo ise karşılaştırmalı üstünlükler teorisini geliştirdi. Karşılaştırmalıda bir ülke iki malda da üstün olsa bile üstünlüğünün daha büyük olduğu malda uzmanlaşır. Kitaptaki örnekte Türkiye çayda üç, pamukta dört kat üstün; bu yüzden Türkiye pamukta, Fransa çayda uzmanlaşır.", "Heckscher ve Ohlin faktör donatımı teorisini geliştirdi: ülke bol olan faktörü yoğun kullanan malı ihraç eder. Leontief bunu ABD'de test etti ve ters sonuç buldu: ABD emek yoğun mal ihraç edip sermaye yoğun mal ithal ediyordu. Buna Leontief paradoksu denir ve açıklaması ABD'li işçilerin yüksek verimliliğidir.", "Ödemeler dengesi iki ana hesaptan oluşur: cari işlemler hesabı ile sermaye ve finans hesabı. Cari işlemlerde mal ticareti, turizm, navlun, sigorta gibi hizmetler ve tek taraflı transferler vardır. Finans hesabında doğrudan yatırımlar, portföy yatırımları, diğer yatırımlar ve rezerv varlıklar bulunur. Açıklanamayan fark net hata ve noksandır. Bu kalem büyük ve sürekli aynı işaretliyse kayıt dışılık yüksek demektir. Döviz kuru hesabı diye bir kalem yoktur.", "Dış ticaret politikası araçları gümrük tarifeleri, tarife dışı araçlar, ihracatın özendirilmesi ve bağlı ticarettir. Tarife dışı araçlarda en önemli pay kota, yasak ve kambiyo denetimi gibi miktar kısıtlamalarındadır. Bağlı ticarette takas ve kliring var; kliringde ithalatçı ve ihracatçı doğrudan ilişki kurmaz, ödeme yerli parayla merkez bankaları üzerinden yapılır. Açık piyasa işlemleri bir dış ticaret aracı değildir. İhracatın ithalatı karşılama oranı ise ihracatın ithalata bölümünün yüzle çarpımıdır ve yüzde yüze yaklaşması istenir.", "Bazı kısa kavramlar: En çok kayrılan ülke kuralı Dünya Ticaret Örgütünde bin dokuz yüz doksan dört tarihli anlaşmaya dayanır ve istisnaları gümrük birliği, serbest ticaret anlaşmaları, genelleştirilmiş tercihler sistemi ve anti damping vergileridir. Sermaye koruma tamponu Basel üç kurallarına göre yüzde iki buçuktur. SWIFT kodu on bir hanelidir: dört hane banka, iki hane ülke, iki hane şehir, üç hane şube. Uluslararası yatırım pozisyonu eksi ise ülke net borçludur.", "Döviz piyasası dünyanın en büyük piyasasıdır. İki bin yirmi ikide günlük hacim yedi buçuk trilyon dolardı ve swap işlemleri hacmin yarısından fazlasını oluşturuyordu. İşlem hacminde sıra dolar, euro ve Japon yeni şeklindedir. Reel döviz kuru, nominal kurun yurt dışı fiyat düzeyinin yurt içi fiyat düzeyine oranıyla çarpımıdır.", "Kotasyonda kitabın gösterimine dikkat et: payda baz para birimi, pay fiyat para birimidir. Yani dolar bölü euro bir virgül on demek, bir euro bir virgül on dolar demektir. Fiyat para birimi yerli para ise doğrudan, yerli para baz para ise dolaylı kotasyondur. Pip virgülden sonraki dördüncü basamaktır. Makas likidite artınca daralır; işlem büyüklüğü, risk ve vade artınca genişler. Vadeli piyasada makas spot piyasadan geniştir.", "Çapraz kur hesabında kesirleri çarpar gibi düşün. Avustralya doları bölü dolar ile dolar bölü euroyu çarparsan Avustralya doları bölü euro bulunur. Kitaptaki örnekte bir virgül iki sıfır iki sekiz çarpı bir virgül bir sıfır bir beş, bir virgül üç iki dört sekiz eder. Üçlü arbitrajda örtük çapraz kur ile efektif piyasa kuru farklıysa ucuz yerden alıp pahalı yerde satarak risksiz kâr elde edilir.", "Vadeli kurda vade puanını on binle bölüp spot kura eklersin. Vadeli kur spottan büyükse baz para primli, küçükse iskontoludur. Korumalı faiz paritesinde vadeli kur, spot kur çarpı bir artı fiyat parasının faizi, bölü bir artı baz paranın faizidir. Örnekte spot üç virgül altı yedi dört dokuz, faizler yüzde yedi ve beş; vadeli kur üç virgül yedi dört dört sekiz çıkar. Vade kısaldıkça faizi gün bölü üç yüz altmış ile çarparsın ve puan küçülür.", "Parite koşullarını tek tek ayır. Korumasız faiz paritesinde kurdaki beklenen değişim faiz farkına eşittir; yüksek faizli para değer kaybeder. Göreceli satın alma gücü paritesinde kurdaki değişim enflasyon farkına eşittir. Mesela bir dolar iki lira iken Türkiye'de enflasyon yüzde on, ABD'de yüzde dört ise kur iki virgül on iki olur. Fisher etkisinde nominal faiz, reel faiz artı beklenen enflasyondur ve iki ülkenin reel faizleri eşitlenir.", "Kur rejimlerinde sert sabit kurlar para kurulu, dolarizasyon ve para birliğidir. Para kurulunda yerli para yalnızca döviz rezervi karşılığında basılır. Yumuşak sabit kurlar geleneksel sabit kur, bant içinde sabitleme, sürünen parite ve sürünen banttır; en büyük zaafları döviz krizlerine duyarlılıktır. Esnek kurlar bağımsız dalgalı ve yönetilen dalgalıdır. Karma rejimlerde kayan kur sürekli müdahale, döviz kuru bandı ise ilan edilen alt ve üst sınırlar demektir. Özel çekme hakkının değeri beş paraya göre belirlenir: dolar, euro, yen, sterlin ve yuan.", "Kur yaklaşımlarında portföy denge modeli ülke risk primini öne çıkarır: kalıcı cari ve bütçe açıkları risk primini yükseltir ve yerli parayı değer kaybettirir. Ara kazanç ticaretinde düşük faizli paradan borçlanıp yüksek faizli paraya yatırım yapılır. Bu stratejinin getiri dağılımı sola çarpıktır; yani çoğu zaman küçük kazanç, nadiren büyük kayıp verir.", "Mundell Fleming modeli IS LM modelinin açık ekonomiye uyarlanmış halidir. Tam sermaye hareketliliğinde tabloyu ezberle: sabit kurda para politikası etkisiz, maliye politikası etkin; esnek kurda para politikası etkin, maliye politikası etkisizdir. Nedeni şu: sabit kurda merkez bankası kuru korumak için müdahale eder ve para genişlemesini geri alır, maliye genişlemesini ise destekler. Esnek kurda para genişlemesi yerli parayı ucuzlatıp ihracatı artırır; maliye genişlemesi ise yerli parayı değerlendirip net ihracatı düşürür.", "Sınırlı sermaye hareketliliğinde kitaptaki tablo farklıdır: sabit kurda iki politika da etkisiz, esnek kurda ikisi de etkindir. Üçlü açmazı da hatırla: tam sermaye hareketliliği ve sabit kur birlikteyse para politikası özerkliğini kaybeder.", "Bölümü ve dersi özetleyelim. Bir: karşılaştırmalı üstünlükte göreli üstünlüğün büyük olduğu malda uzmanlaşılır, Leontief paradoksunda ABD emek yoğun mal ihraç eder. İki: net hata noksanın büyük ve aynı işaretli olması kayıt dışılık işaretidir. Üç: vadeli kur eşittir spot çarpı bir artı fiyat parası faizi bölü bir artı baz para faizi. Dört: korumasız faiz paritesinde faiz farkı, satın alma gücü paritesinde enflasyon farkı kurdaki değişimi verir. Beş: tam hareketlilikte sabit kurda maliye, esnek kurda para politikası etkindir. Şimdi sorulara geçebilirsin."]};
</script>
<script>
(function(){
const L="ABCDE";
const KEY="d1008-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2","#4F46E5","#BE185D","#15803D","#B45309","#0369A1","#9333EA","#0F766E","#C2410C","#1D4ED8"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("d1008"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){
  const s=S[si], col=HUE[si];
  const tab=st.tab[si]||"notlar";
  const f=st.tab["f"+si]||"tum";
  const x=secStats(si), kb=s.sorular.filter(q=>q.k).length;
  let h=`<div style="--c:${col};display:contents">
  <div class="crumb"><a href="#genel">Genel bakış</a> / Bölüm ${s.id}</div>
  <section class="hero"><div><span class="pill">Bölüm ${s.id} / ${S.length} · ${s.sorular.length} soru</span><h1>${esc(s.baslik)}</h1><p>${esc(s.ozet)}</p></div>${ring(x.c,x.n,col,"doğru")}</section>
  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,S.length>8?2:3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();
  const list=st.karma.list, x=statsOf(list,st.karma.ans);
  let h=`<div class="crumb"><a href="#genel">Genel bakış</a> / Karma deneme</div>
  <section class="hero" style="--c:#141A2B"><div><span class="pill">Tüm bölümler · ${list.length} soru</span><h1>Karma deneme</h1><p>Her bölümden en az ${S.length>8?"iki":"üç"} soru içeren rastgele set. Buradaki cevaplar bölüm skorlarını etkilemez.</p></div>${ring(x.c,list.length,"#0E8F7E","doğru")}</section>
  ${bar(x,`<button class="btn pri" data-newkarma="1">Yeni set oluştur</button>`)}<div class="qlist">`;
  const saved=st.ans; st.ans=st.karma.ans;
  list.forEach(([s,qi],n)=>{h+=qCard(s,qi,n+1,true)});
  st.ans=saved;
  return h+`</div>`;
}

function renderHome(){
  let tA=0,tC=0;S.forEach((s,i)=>{const x=secStats(i);tA+=x.a;tC+=x.c});
  let h=`<section class="hero"><div><span class="pill">SPL · Genel Ekonomi</span><h1>Genel Ekonomi Sınav Defteri</h1>
  <p>Temel kavramlardan para ve maliye politikasına, makro göstergelerden dış ticarete bölüm notları ve notlardan hazırlanmış özgün sorular.</p>
  <div class="row" style="margin-top:18px"><a class="btn pri" href="#b1">Bölüm 1'den başla</a><a class="btn" href="#karma">Karma deneme</a></div></div>${ring(tC,TOTAL,"#0E8F7E","toplam doğru")}</section>
  <div class="tiles"><div class="tile"><span>Yanıtlanan</span><b>${tA}<small style="font-size:14px;color:var(--muted)"> / ${TOTAL}</small></b></div><div class="tile"><span>Doğru</span><b style="color:var(--ok)">${tC}</b></div><div class="tile"><span>Başarı oranı</span><b>${tA?"%"+Math.round(tC/tA*100):"–"}</b></div></div>
  <div class="sec-h"><h2>Bölümler</h2><span class="stat">${TOTAL} soru</span></div>
  <div class="grid">`;
  S.forEach((s,i)=>{const x=secStats(i);const kb=s.sorular.filter(q=>q.k).length;h+=`<a class="card" href="#b${s.id}" style="--c:${HUE[i]}"><div class="top"><span class="no">Bölüm ${s.id}</span><span class="stat">${s.sorular.length} soru</span></div><span class="t">${esc(s.kisa)}</span><span class="d">${esc(s.ozet)}</span>${meter(x.a,x.c,x.n)}<span class="p"><span>${x.c}/${x.n} doğru</span><span>${x.a} yanıt</span></span></a>`});
  h+=`</div>
  <section class="facts"><h2>Sınav öncesi son bakış</h2><dl>
  <div><dt>Talebin fiyat esnekliği</dt><dd>%ΔQ / %ΔP; |E| &gt; 1 esnek</dd></div>
  <div><dt>Harcama çarpanı</dt><dd>1/(1-c); c = 0,9 ise 10</dd></div>
  <div><dt>Vergi / transfer / denk bütçe</dt><dd>-c/(1-c) · c/(1-c) · 1</dd></div>
  <div><dt>Kaydi para (tek banka)</dt><dd>Mevduat × 1/(r + s)</dd></div>
  <div><dt>TCMB bağımsızlığı (2001)</dt><dd>Araç var, amaç yok (fiyat istikrarı)</dd></div>
  <div><dt>Kontrol ufku</dt><dd>12–24 ay</dd></div>
  <div><dt>Likidite senedi vadesi</dt><dd>En fazla 91 gün</dd></div>
  <div><dt>Gösterge kur ilanı</dt><dd>Her iş günü 15:30</dd></div>
  <div><dt>Hiperenflasyon</dt><dd>Aylık yaklaşık %50</dd></div>
  <div><dt>Mundell-Fleming (tam hareketlilik)</dt><dd>Sabit kur: maliye; esnek kur: para etkin</dd></div>
  </dl></section>`;
  return h;
}

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b(\d+)$/.exec(r);
  if(m&&+m[1]>=1&&+m[1]<=S.length) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const PK="d1008-ses-v1";
let pref={rate:1,voice:"",follow:true,mode:"podcast"};
try{const r=localStorage.getItem(PK);if(r)pref=Object.assign(pref,JSON.parse(r))}catch(e){}
const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(pref))}catch(e){}};

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["SWIFT", "Dünya Bankalararası Finansal İletişim Kuruluşu"],["NAIRU", "enflasyonu hızlandırmayan işsizlik oranı"],["GSYH", "gayri safi yurt içi hasıla"],["GSMH", "gayri safi milli hasıla"],["TCMB", "Türkiye Cumhuriyet Merkez Bankası"],["TÜİK", "Türkiye İstatistik Kurumu"],["TÜFE", "tüketici fiyatları endeksi"],["TEFE", "toptan eşya fiyat endeksi"],["DİBS", "devlet iç borçlanma senetleri"],["OPEC", "Petrol İhraç Eden Ülkeler Örgütü"],["OECD", "Ekonomik İşbirliği ve Kalkınma Örgütü"],["SAGP", "satın alma gücü paritesi"],["MRTS", "marjinal teknik ikame oranı"],["BSMV", "banka ve sigorta muameleleri vergisi"],["TMSF", "Tasarruf Mevduatı Sigorta Fonu"],["TOKİ", "Toplu Konut İdaresi"],["TBMM", "Türkiye Büyük Millet Meclisi"],["SMH", "safi milli hasıla"],["PPK", "Para Politikası Kurulu"],["ÜFE", "üretici fiyatları endeksi"],["APİ", "açık piyasa işlemleri"],["BPP", "Bankalararası Para Piyasası"],["ROM", "rezerv opsiyon mekanizması"],["ROO", "rezerv opsiyonu oranı"],["ROK", "rezerv opsiyonu katsayısı"],["IMF", "Uluslararası Para Fonu"],["DTÖ", "Dünya Ticaret Örgütü"],["SDR", "özel çekme hakları"],["TFV", "toplam faktör verimliliği"],["ÜOE", "üretim olanakları eğrisi"],["MRS", "marjinal ikame oranı"],["MRT", "marjinal dönüşüm oranı"],["MPK", "sermayenin marjinal ürünü"],["LAC", "uzun dönem ortalama maliyet"],["TFC", "toplam sabit maliyet"],["TVC", "toplam değişken maliyet"],["AFC", "ortalama sabit maliyet"],["AVC", "ortalama değişken maliyet"],["ATC", "ortalama toplam maliyet"],["KDV", "katma değer vergisi"],["ÖTV", "özel tüketim vergisi"],["SGK", "Sosyal Güvenlik Kurumu"],["ÖİB", "Özelleştirme İdaresi Başkanlığı"],["KİT", "kamu iktisadi teşebbüsü"],["MC", "marjinal maliyet"],["TC", "toplam maliyet"],["TR", "toplam gelir"],["MR", "marjinal gelir"],["AR", "ortalama gelir"],["TP", "toplam ürün"],["AP", "ortalama ürün"],["MP", "marjinal ürün"],["MU", "marjinal fayda"],["YP", "yabancı para"],["IS", "yatırım-tasarruf"],["LM", "para piyasası dengesi"],["BP", "ödemeler dengesi"],["AD", "toplam talep"],["AS", "toplam arz"],["NX", "net ihracat"],["SPKn","Sermaye Piyasası Kanunu"],["TTSG","Türkiye Ticaret Sicili Gazetesi"],["TRİK","teminat, rehin, ipotek ve kefalet"],["YİB","yatırımcı ilişkileri bölümü"],["KYBF","Kurumsal Yönetim Bilgi Formu"],["URF","Uyum Raporu"],["KSS","kurumsal sosyal sorumluluk"],["NBD","net bugünkü değer"],["KGK","Kamu Gözetimi Kurumu"],["KYD","kurumsal yönetim derecelendirme"],["TTK","Türk Ticaret Kanunu"],["YK","yönetim kurulu"],["GK","genel kurul"],["KY","kurumsal yönetim"],["PD","piyasa değeri"],["FD","fiili dolaşımdaki"],["GM","genel müdür"],["SP","sermaye piyasası"],["ÇSY","çevresel, sosyal ve kurumsal yönetim"],["AB","Avrupa Birliği"],["ABD","Amerika Birleşik Devletleri"],["SOX","Sarbanes Oxley"]];
function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}
  t=t.replace(/(\p{Ll})[’'](\p{L})/gu,"$1$2").replace(/\s+/g," ");
  return t.trim();
}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;
}
function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){
  const vs=synth.getVoices();const tr=trVoices();
  return vs.find(v=>v.name===pref.voice)||tr[0]||null;
}
function fillVoices(){
  if(!synth)return;
  const vs=synth.getVoices();const tr=trVoices();const list=tr.length?tr:vs;
  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth){return}
  let si=curSi>=0?curSi:(qSi>=0?qSi:0);
  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}
  playing=true;speak();
}
function pause(){playing=false;utt=null;synth.cancel();ui()}
function stop(finished){playing=false;utt=null;if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}
  navByPlayer=false;ui();
});
window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
})();

</script>
