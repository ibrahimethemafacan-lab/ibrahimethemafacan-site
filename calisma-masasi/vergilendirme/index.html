d><\/tr>\n<\/table>\n<ul>\n<li>Bağış nakden yapılmazsa malın maliyet bedeli veya kayıtlı değeri, yoksa takdir komisyonunca belirlenen değer esas alınır.<\/li>\n<li>Transit ticaret indiriminde kazanç beyanname tarihine kadar Türkiye'ye transfer edilmeli; aracılıkta satıcı ve alıcı Türkiye'de olmamalı. Cumhurbaşkanı (i) oranlarını sıfıra indirebilir, %100'e çıkarabilir; (j) oranlarını %50'ye indirebilir, %100'e çıkarabilir.<\/li>\n<\/ul>\n<h4>Nakdi sermaye artışı indirimi (KVK m.10/1-ı)<\/h4>\n<ul>\n<li>Kapsam dışı: <b>finans, bankacılık, sigortacılık<\/b> kurumları ve <b>kamu iktisadi teşebbüsleri<\/b>.<\/li>\n<li>Formül: <b>Nakdi sermaye artışı x TCMB ticari kredi faiz oranı x indirim oranı x süre<\/b>. Faiz oranı: indirim yılı için TCMB'nin en son açıkladığı TL ticari kredi ağırlıklı ortalama faizi. Süre: tescilden hesap dönemi sonuna kadar.<\/li>\n<li>Genel indirim oranı (2015/7910 sayılı BKK) <b>%50<\/b>. Halka açık şirketlerde yılın son günü MKK'da borsada işlem görebilir payların nominalinin ödenmiş sermayeye oranı <b>%50 ve altındaysa +25 puan<\/b>, <b>%50'nin üzerindeyse +50 puan<\/b>.<\/li>\n<li>1/7/2015'ten itibaren tescil edilen nakdi artışlar dikkate alınır. 5/7/2022'den sonraki artırımlarda indirim, tescil dönemi dahil <b>5 hesap dönemi<\/b> ayrı ayrı uygulanır; öncekiler 2022 dahil 5 dönem yararlanır.<\/li>\n<li>Sonradan sermaye azaltılırsa azaltılan tutar kadarı hesaptan çıkar. Kazanç yetersizliğiyle kullanılamayan indirim <b>süre sınırı olmadan ve endekslenmeden<\/b> sonraki dönemlere taşınır.<\/li>\n<\/ul>\n\n<h3>İndirilecek giderler (KVK m.8)<\/h3>\n<ul>\n<li>Ticari kazanç gibi hesaplanan kurum kazancından ayrıca: <b>menkul kıymet ihraç giderleri<\/b>; kuruluş ve örgütlenme giderleri; genel kurul, birleşme, devir, bölünme, fesih ve tasfiye giderleri; sermayesi paylara bölünmüş komandit şirkette <b>komandite ortağın kâr payı<\/b>; katılım bankalarının katılma hesaplarına ödediği kâr payları; sigorta şirketlerinin teknik karşılıkları.<\/li>\n<li>Teknik karşılıklar: muallak hasar ve tazminat; kazanılmamış prim (nakliyat emtiada saklama payındaki yıllık primin <b>%25<\/b>'ini geçemez; gün esası mümkün değilse <b>1/8 yöntemi<\/b>); hayat sigortasında matematik karşılıklar (sözleşme bazında); dengeleme karşılığı (yalnız deprem ve mühendislik branşlarında deprem teminatı). Ayrılan karşılıklar ertesi dönemde aynen kâra eklenir.<\/li>\n<\/ul>\n\n<h3>Kanunen kabul edilmeyen indirimler (KVK m.11)<\/h3>\n<ul>\n<li>(a) <b>Öz sermaye<\/b> üzerinden ödenen veya hesaplanan faizler.<\/li>\n<li>(b) <b>Örtülü sermaye<\/b> üzerinden faiz, kur farkı ve benzeri giderler.<\/li>\n<li>(c) <b>Transfer fiyatlandırması<\/b> yoluyla örtülü dağıtılan kazançlar.<\/li>\n<li>(ç) Her türlü <b>yedek akçe<\/b> (TTK, ana statü, bankaların genel karşılıkları dahil).<\/li>\n<li>(d) Hesaplanan <b>KV<\/b>, para ve vergi cezaları, 6183'e göre cezalar, <b>gecikme zamları<\/b> ve <b>gecikme faizleri<\/b>.<\/li>\n<li>(e) Menkul kıymetlerin itibari değerin altında ihracından doğan zararlar ve buna ilişkin komisyonlar (kanuni hadler saklı).<\/li>\n<li>(f) Esas faaliyetle ilgisi olmayan yat, kotra, sürat teknesi, uçak, helikopter gibi taşıtların gider ve amortismanları.<\/li>\n<li>(g) Kurumun, ortaklarının, yöneticilerinin ve çalışanlarının <b>suçlarından<\/b> doğan tazminatlar (sözleşmedeki ceza şartı tazminatları hariç).<\/li>\n<li>(h) Basın, radyo ve televizyon yoluyla verilen zararlar için ödenen tazminatlar.<\/li>\n<li>(ı) Alkol ve tütün ürünleri ilan ve reklam giderlerinin <b>%50<\/b>'si (Cumhurbaşkanı %100'e çıkarabilir, sıfıra indirebilir).<\/li>\n<li>(i) <b>Finansman gider kısıtlaması:<\/b> kredi kuruluşları, finansal kuruluşlar, finansal kiralama, faktoring ve finansman şirketleri dışındaki işletmelerde yabancı kaynak öz kaynağı aşıyorsa, aşan kısma isabet eden faiz, komisyon, kur farkı vb. giderlerin <b>%10<\/b>'unu aşmamak üzere Cumhurbaşkanınca belirlenen kısmı. 3490 sayılı CK (04.02.2021) ile oran <b>%10<\/b>. Yatırımın maliyetine eklenenler hariç.<\/li>\n<li>(j) 5651 sayılı Kanunun ek 4. maddesine göre reklam yasağı getirilenlere verilen reklam giderleri. (k) Şans ve bahis oyunlarının ilan ve reklam giderleri.<\/li>\n<\/ul>\n\n<h3>Zarar mahsubu (KVK m.9)<\/h3>\n<ul>\n<li>Geçmiş yıl zararları, beyannamede her yıl ayrı gösterilmek şartıyla <b>5 yıldan fazla nakledilmemek<\/b> üzere indirilir.<\/li>\n<li>Devralınan kurum zararları (devir tarihindeki öz sermayeyi aşmayan) ve tam bölünmede devralınan zararlar için ek şartlar: son <b>5 yıla<\/b> ait beyannamelerin süresinde verilmesi ve devralınan faaliyetin en az <b>5 yıl<\/b> sürdürülmesi. İhlalde vergi ziyaı doğar.<\/li>\n<li>Yurt dışı faaliyet zararları (Türkiye'de istisna kazançlarla ilgili olanlar hariç) 5 yıl taşınabilir; şart: o ülkede yetkili denetim kuruluşunca her yıl rapora bağlanması ve raporun aslı ile tercümesinin vergi dairesine ibrazı. Denetim kuruluşu yoksa beyannamenin Türk elçilik veya konsolosluğuna onaylatılması yeterlidir. Zarar o ülkede de mahsup edilirse Türkiye'deki beyana mahsup öncesi kazanç girer.<\/li>\n<\/ul>\n\n<h3>Beyan ve ödeme<\/h3>\n<ul>\n<li>KV mükellefin beyanı üzerine tarh edilir; her mükellef kazancının tamamı için beyanname verir (KVK m.14).<\/li>\n<li>Beyanname, hesap döneminin kapandığı ayı izleyen <b>dördüncü ayın son günü<\/b> akşamına kadar bağlı vergi dairesine verilir; vergi <b>aynı ayın sonuna<\/b> kadar ödenir (KVK m.21).<\/li>\n<li>Takvim yılı kullananlar: izleyen <b>Nisan sonu<\/b>. Özel hesap dönemi kullananlar: dönemin bittiği ayı izleyen dördüncü ayın son günü.<\/li>\n<\/ul>\n\n<h3>Dar mükellef kurumlar<\/h3>\n<ul>\n<li>Kanuni ve iş merkezlerinin ikisi de Türkiye'de olmayan kurumlar yalnız Türkiye'de elde ettikleri kazanç üzerinden vergilenir (KVK m.3).<\/li>\n<li><b>Birinci grup:<\/b> Türkiye'de iş yeri (VUK m.156) veya daimi temsilci vasıtasıyla elde edilen <b>ticari kazanç<\/b>; tam mükellefler gibi GVK'nın ticari kazanç hükümleriyle vergilenir.<\/li>\n<li><b>İkinci grup:<\/b> iş yeri veya daimi temsilci olmadan (ya da bunları kullanmadan) elde edilen <b>MSİ<\/b> ve <b>değer artışı kazançları<\/b>; ÇVÖA saklı kalmak kaydıyla GVK'nın MSİ ve DAK hükümlerine göre vergilenir.<\/li>\n<li>Dikkat (KVK m.26/2): bu yabancı kurumların DAK'ında, Türkiye'ye bizzat getirilen sermaye karşılığı alınan menkul kıymet ve iştirak hisselerinin satışındaki <b>kur farkı<\/b> hükmü hariç, GVK'daki istisna, kayıt, şart ve süre sınırlamaları <b>dikkate alınmaz<\/b>.<\/li>\n<li>VUK m.156'ya göre iş yeri: mağaza, yazıhane, şube, depo, şantiye, maden, tarla gibi ticari, sınai, zirai veya mesleki faaliyete tahsis edilen yer.<\/li>\n<\/ul>", "sorular": [{"q": "7456 sayılı Kanun sonrasında bir aracı kurumun (sermaye piyasası kurumu) kurum kazancına uygulanan KV oranı kaçtır?", "o": ["%20", "%30", "%22", "%25", "%23"], "a": 1, "e": "7456 ile genel oran %25'e, bankalar ve sermaye piyasası kurumları dahil finans sektörü için %30'a yükseltilmiştir."}, {"q": "Payları ilk kez Borsa İstanbul'da işlem görmek üzere halka arz edilen kurumların 2 puan indirimli KV'den yararlanmasıyla ilgili hangisi yanlıştır?", "o": ["En az %20 oranında halka arz şartı vardır", "İndirim ilk halka arz dönemi dahil 5 hesap dönemi uygulanır", "Bankalar ve sermaye piyasası kurumları yararlanamaz", "Şart kaybedilirse eksik vergi vergi ziyaı cezasıyla birlikte alınır", "Amaç halka arzları özendirmektir"], "a": 3, "e": "Pay oranı şartı 5 dönem içinde kaybedilirse eksik vergi vergi ziyaı cezası uygulanmaksızın gecikme faiziyle tahsil edilir."}, {"q": "Genel KV oranının %25 olduğu bir yılda, payları en az %20 oranında ilk kez halka arz edilmiş ve ikinci hesap döneminde bulunan bir şirketin münhasıran ihracattan elde ettiği kazanca uygulanacak oran kaçtır?", "o": ["%18", "%25", "%23", "%20", "%12,5"], "a": 0, "e": "Halka arz indirimi 2 puan, ihracat indirimi 5 puan: 25 - 2 - 5 = %18."}, {"q": "7582 sayılı Kanunla değişik KVK m.32/8'e göre sanayi sicil belgeli ve fiilen üretim yapan bir kurumun münhasıran üretim faaliyetinden elde ettiği kazanca uygulanacak KV oranı kaçtır?", "o": ["%24", "%20", "%15", "%10", "%12,5"], "a": 4, "e": "Bu kazançlara oran %12,5 olarak uygulanır ve bu orandan yararlanan kazanca ihracat indirimi ayrıca uygulanmaz."}, {"q": "7555 sayılı Kanunla yapılan düzenlemeye göre yatırım teşvik belgeli yatırımlarda indirimli KV uygulaması ilk dönem dahil en fazla kaç hesap dönemiyle sınırlandırılmıştır?", "o": ["4", "5", "10", "15", "20"], "a": 2, "e": "İndirimli KV en fazla 10 hesap dönemiyle sınırlandırılmış, indirim oranı %60 (indirimli oran %10) olarak belirlenmiştir; diğer faaliyet kazançlarında kullanım 4 yılla sınırlıdır."}, {"q": "Nisan-Mayıs-Haziran dönemine ait geçici vergi beyannamesinin verilmesi ve verginin ödenmesi için son gün hangisidir?", "o": ["17 Temmuz", "17 Ağustos", "26 Temmuz", "31 Ağustos", "17 Eylül"], "a": 1, "e": "Geçici vergi, dönemi izleyen ikinci ayın 17'sine kadar beyan edilip ödenir; ikinci dönem için 17 Ağustos."}, {"q": "Hesap dönemi takvim yılı olan bir kurumun 2026 yılı KV beyannamesini vermesi ve vergiyi ödemesi gereken son gün hangisidir?", "o": ["31 Mart 2027", "25 Nisan 2027", "31 Mayıs 2027", "30 Nisan 2027", "17 Şubat 2027"], "a": 3, "e": "Beyanname hesap döneminin kapandığı ayı izleyen dördüncü ayın son günü verilir ve vergi aynı ay sonuna kadar ödenir: 30 Nisan 2027."}, {"q": "Özel hesap dönemi 30 Haziran'da sona eren bir kurumun KV beyannamesini verme süresi hangi ayın son günü dolar?", "o": ["Ekim", "Eylül", "Kasım", "Aralık", "Ağustos"], "a": 0, "e": "Dönemin bittiği ay Haziran; izleyen dördüncü ay Ekim'dir."}, {"q": "Kurum kazancı 4.000.000 TL olan şirketin kamu yararına çalışan bir derneğe makbuz karşılığı yaptığı 300.000 TL bağışın indirilebilecek kısmı kaç TL'dir?", "o": ["300.000", "150.000", "120.000", "400.000", "200.000"], "a": 4, "e": "KVK m.10/1-c'ye göre bu bağışlar kurum kazancının %5'ine kadar indirilebilir: 4.000.000 x %5 = 200.000 TL."}, {"q": "Bir kurum profesyonel spor dalına 1.000.000 TL, amatör spor dalına 300.000 TL sponsorluk harcaması yapmıştır. Kurum kazancından indirilebilecek toplam tutar kaç TL'dir?", "o": ["650.000", "1.300.000", "800.000", "500.000", "1.150.000"], "a": 2, "e": "Profesyonel sporda %50 (500.000), amatör sporda %100 (300.000) indirilir: toplam 800.000 TL."}, {"q": "Beyan edilen geliri 5.000.000 TL olan kurumun VUK m.325/A uyarınca girişim sermayesi fonu olarak ayırıp indirebileceği azami tutar kaç TL'dir?", "o": ["250.000", "500.000", "750.000", "1.000.000", "5.000.000"], "a": 1, "e": "Girişim sermayesi fonu olarak ayrılan tutar beyan edilen gelirin %10'unu aşmamak üzere indirilebilir: 500.000 TL."}, {"q": "Payları borsada işlem görmeyen bir sermaye şirketi 10.000.000 TL nakdi sermaye artışını 1 Temmuz'da tescil ettirmiştir. TCMB ticari kredi faiz oranı %40 ise o hesap dönemi için indirilebilecek tutar kaç TL'dir? (Süre 6/12 kabul edilsin)", "o": ["4.000.000", "2.000.000", "500.000", "1.000.000", "1.500.000"], "a": 3, "e": "10.000.000 x %40 x %50 x 6/12 = 1.000.000 TL."}, {"q": "Halka açık bir şirket 10.000.000 TL nakdi sermaye artışını yıl ortasında tescil ettirmiştir (süre 6/12). TCMB ticari kredi faiz oranı %40, yıl sonunda MKK'da borsada işlem görebilir pay oranı %60'tır. İndirilebilecek tutar kaç TL'dir?", "o": ["2.000.000", "1.000.000", "1.500.000", "1.250.000", "3.000.000"], "a": 0, "e": "Borsada işlem görebilir pay oranı %50'nin üzerinde olduğundan genel orana 50 puan eklenir (%100): 10.000.000 x %40 x %100 x 6/12 = 2.000.000 TL."}, {"q": "Bir şirket 8.000.000 TL nakdi sermaye artışını tamamen yurt dışından getirdiği nakitle karşılamış ve tescil hesap dönemi sonundan 3 ay önce yapılmıştır. Faiz oranı %45 ise indirim tutarı kaç TL'dir?", "o": ["450.000", "900.000", "2.700.000", "1.350.000", "675.000"], "a": 4, "e": "Yurt dışından getirilen nakitle karşılanan artışta oran %75'tir: 8.000.000 x %45 x %75 x 3/12 = 675.000 TL."}, {"q": "Nakdi sermaye artışı indirimiyle ilgili hangisi yanlıştır?", "o": ["Bankacılık ve sigortacılık sektöründeki kurumlar yararlanamaz", "Kamu iktisadi teşebbüsleri yararlanamaz", "Kazanç yetersizliğiyle kullanılamayan tutar en fazla 5 yıl devredilebilir", "İndirim artışın tescil edildiği dönem dahil 5 hesap dönemi uygulanır", "Sonradan sermaye azaltılırsa azaltılan kısım hesaptan çıkarılır"], "a": 2, "e": "Kullanılamayan indirim süre sınırı olmaksızın ve endekslemeye tabi tutulmaksızın sonraki dönemlere devredilir."}, {"q": "Korumalı işyeri indiriminde yıllık brüt asgari ücret 400.000 TL ise bir engelli çalışan için yıllık indirilebilecek azami tutar kaç TL'dir?", "o": ["400.000", "600.000", "500.000", "800.000", "200.000"], "a": 1, "e": "Yıllık indirim, her çalışan için asgari ücretin yıllık brüt tutarının %150'sini aşamaz: 400.000 x 1,5 = 600.000 TL. İndirim çalışan başına en fazla 5 yıl uygulanır."}, {"q": "Aşağıdakilerden hangisi KVK m.8'e göre kurum kazancından indirilebilecek giderlerden biri değildir?", "o": ["Menkul kıymet ihraç giderleri", "Kuruluş ve örgütlenme giderleri", "Genel kurul toplantı giderleri", "Öz sermaye üzerinden hesaplanan faizler", "Komandite ortağın kâr payı"], "a": 3, "e": "Öz sermaye üzerinden ödenen veya hesaplanan faizler KVK m.11'e göre kanunen kabul edilmeyen indirimlerdendir."}, {"q": "Aşağıdakilerden hangisi kanunen kabul edilmeyen indirimler arasında yer almaz?", "o": ["Sözleşmelerde ceza şartı olarak konulan tazminatlar", "Ayrılan yedek akçeler", "Hesaplanan kurumlar vergisi ve gecikme zamları", "Örtülü sermaye üzerinden ödenen faizler", "Esas faaliyetle ilgisi olmayan yat ve helikopter giderleri"], "a": 0, "e": "Suçlardan doğan tazminatlar kabul edilmez; ancak sözleşmelerde ceza şartı olarak konulan tazminatlar bu yasağın dışındadır."}, {"q": "Bir kurumun alkollü içki reklam gideri 900.000 TL'dir. Kurum kazancının tespitinde gider yazılamayacak tutar kaç TL'dir?", "o": ["0", "225.000", "675.000", "900.000", "450.000"], "a": 4, "e": "Alkol ve tütün ürünleri ilan ve reklam giderlerinin %50'si kabul edilmez: 450.000 TL."}, {"q": "Finans sektörü dışında faaliyet gösteren bir kurumun yabancı kaynakları 50.000.000 TL, öz kaynakları 30.000.000 TL ve yabancı kaynaklara ilişkin finansman giderleri 8.000.000 TL'dir. Finansman gider kısıtlaması nedeniyle KKEG yazılacak tutar kaç TL'dir?", "o": ["800.000", "200.000", "320.000", "480.000", "3.200.000"], "a": 2, "e": "Aşan kısım 20.000.000 / 50.000.000 = %40; buna isabet eden gider 3.200.000 TL; bunun %10'u 320.000 TL kabul edilmez."}, {"q": "Ticari bilanço kârı 5.000.000 TL, KKEG 600.000 TL, iştirak kazancı istisnası 1.200.000 TL ve mahsup edilebilir geçmiş yıl zararı 400.000 TL olan bir sermaye piyasası kurumunun hesaplanan KV'si kaç TL'dir?", "o": ["1.000.000", "1.200.000", "1.080.000", "1.320.000", "1.500.000"], "a": 1, "e": "Matrah 5.000.000 + 600.000 - 1.200.000 - 400.000 = 4.000.000 TL. Sermaye piyasası kurumu için oran %30: 1.200.000 TL."}, {"q": "Geçmiş yıl zararlarının mahsubuyla ilgili hangisi doğrudur?", "o": ["Zararlar süresiz olarak devredilebilir", "Zararlar en fazla 3 yıl nakledilebilir", "Yurt dışı zararlar hiçbir koşulda indirilemez", "Zararlar her yıl ayrı gösterilmek şartıyla 5 yıldan fazla nakledilmemek üzere indirilir", "Devralınan kurum zararları için ek şart aranmaz"], "a": 3, "e": "KVK m.9'a göre zararlar 5 yıldan fazla nakledilemez; devralınan zararlar ve yurt dışı zararlar ek şartlarla indirilebilir."}, {"q": "Devralınan kurumun zararlarının mahsup edilebilmesi için aşağıdakilerden hangisi şarttır?", "o": ["Devralınan faaliyetin en az 5 yıl sürdürülmesi ve son 5 yılın beyannamelerinin süresinde verilmiş olması", "Devralınan kurumun faaliyetine en az 2 yıl devam edilmesi", "Son 3 yılın beyannamelerinin süresinde verilmiş olması", "Zararın devralan kurumun öz sermayesini aşması", "Devrin GİB tarafından onaylanması"], "a": 0, "e": "Son beş yıla ilişkin beyannamelerin süresinde verilmesi ve devralınan faaliyetin en az beş yıl sürdürülmesi gerekir; zarar devir tarihindeki öz sermayeyi aşamaz."}, {"q": "Türkiye'de iş yeri veya daimi temsilcisi olmayan dar mükellef kurumun elde ettiği değer artışı kazançlarıyla ilgili hangisi doğrudur?", "o": ["Tam mükellefler gibi ticari kazanç hükümlerine göre vergilenir", "Hiçbir durumda Türkiye'de vergilendirilmez", "Yalnızca ÇVÖA yoksa vergilendirilir", "Özel beyanname verilmesi yasaktır", "GVK'daki istisna, kayıt, şart ve süre sınırlamaları dikkate alınmaz (kur farkı hükmü hariç)"], "a": 4, "e": "KVK m.26/2'ye göre bu kurumların DAK'ında, getirilen sermayeyle alınan kıymetlerdeki kur farkı hükmü hariç, GVK'daki vergilendirmeme istisna, şart ve süre sınırlamaları dikkate alınmaz."}]}, {"id": 4, "kisa": "Türev ve Örtülü Sermaye", "baslik": "Türev Ürün Kazançları, Devir-Bölünme-Hisse Değişimi, Örtülü Sermaye, Transfer Fiyatlandırması ve Sermaye Azaltımında Vergilendirme", "ozet": "Forward, swap, opsiyon, VİOP ve varant kazançlarının tespiti; dar mükellef kesintisi; birleşme, devir, bölünme; örtülü sermaye ve transfer fiyatlandırması; KVK m.32/B sermaye azaltımı.", "notlar": "<h3>Türev ürünlerden elde edilen kurum kazancı<\/h3>\n<table>\n<tr><th>Araç<\/th><th>Kazanç ne zaman kurum kazancına girer?<\/th><\/tr>\n<tr><td><b>Forward<\/b><\/td><td>Taahhüt niteliğinde; vadeye kadar yapılan değerlemeler (reeskont) kazançla ilişkilendirilmez. Kâr veya zarar <b>vade sonunda<\/b>, vadeden önce bozulursa <b>bozulma tarihinde<\/b> kazanca girer. Kazanç = dayanak kıymetin piyasa fiyatına göre değeri − işlem fiyatına göre değeri.<\/td><\/tr>\n<tr><td><b>Para swapı<\/b><\/td><td>Spot bacakta döviz alım satımının kâr veya zararı o tarihte; forward bacakta değerlemeler dikkate alınmaz, kâr veya zarar <b>vadede<\/b> tespit edilir.<\/td><\/tr>\n<tr><td><b>Faiz swapı<\/b><\/td><td>Aynı para birimindeki borçların yalnız faiz yapısı değişir; <b>anapara değişimi olmaz<\/b>.<\/td><\/tr>\n<tr><td><b>Opsiyon primi<\/b><\/td><td>Hakkı satan (yazan) için tahakkuk esasına göre <b>sözleşme tarihinde gelir<\/b>; hakkı alan için hakkın kullanıldığı veya sözleşmenin sona erdiği tarihte <b>gider<\/b>.<\/td><\/tr>\n<tr><td><b>Tezgâh üstü opsiyon<\/b><\/td><td>Elde etme hakkın kullanılmasıyla olur; o tarihe kadar değerleme yapılmaz. Nakdi uzlaşmada uzlaşma kâr veya zararı kazanca girer.<\/td><\/tr>\n<tr><td><b>VİOP sözleşmeleri<\/b><\/td><td>VUK m.289'a göre <b>borsa rayici<\/b> (uzlaşma fiyatı) ile değerlenir; değerleme farkı kazanca girer. Ters pozisyonla kapatmada ve vadede nakdi uzlaşmada gerçekleşen kâr veya zarar kazanca girer. Teslimatlı sonuçlanırsa varlık sözleşmedeki birim değerle kayda alınır. Takasbank'ın nakdi teminatları nemalandırmasından doğan gelir de kazanca dahildir.<\/td><\/tr>\n<tr><td><b>Aracı kuruluş varantı<\/b><\/td><td>Aracı kurumlarca ihraç edilen, kaydi teslimat veya nakit uzlaşıyla kullanılan, opsiyonun menkul kıymetleştirilmiş türü; geliri kurum kazancına dahil edilir.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kitaptaki forward örneği: 1.000.000 USD x (1,5268 − 1,4890) = 37.800 TL kazanç, vade tarihinde kazanca girer. Swap örneğinde 20.000.000 USD için spot bacakta 30.224.000 TL ödenir, vadede 30.440.000 TL alınır; 216.000 TL kazanç vadede tanınır, karşı bankada aynı tutar zarar olur.<\/li>\n<\/ul>\n<h4>Dar mükellef kurumların türev kazançlarında kesinti (iş yeri ve daimi temsilci yoksa)<\/h4>\n<table>\n<tr><th>İşlem<\/th><th>Niteliği<\/th><th>KVK m.30 kesintisi<\/th><\/tr>\n<tr><td>Forward, para swapı, tezgâh üstü opsiyon ve opsiyon primi, aracı kuruluş varantı<\/td><td>Ticari kazanç<\/td><td><b>Yapılmaz<\/b><\/td><\/tr>\n<tr><td>Faiz swapı<\/td><td><b>Alacak faizi<\/b><\/td><td>KVK m.30/1-ç uyarınca <b>yapılır<\/b><\/td><\/tr>\n<tr><td>VİOP vadeli işlem ve opsiyon<\/td><td>GVK Geçici 67/1 kapsamında kesintiye tabi<\/td><td>Ayrıca yapılmaz; özel beyanname de söz konusu olmayabilir<\/td><\/tr>\n<\/table>\n\n<h3>Birleşme, devir, bölünme ve hisse değişimi<\/h3>\n<ul>\n<li><b>Birleşme (KVK m.18):<\/b> birleşme nedeniyle infisah eden kurum için <b>tasfiye hükmündedir<\/b>; tasfiye kârı yerine <b>birleşme kârı<\/b> vergilenir. Ortaklara verilen değerler tasfiyede dağıtılan değerler yerine geçer ve VUK'a göre değerlenir. Tasfiye memurlarının ödevleri birleşilen kuruma geçer.<\/li>\n<li><b>Devir (KVK m.19/1):<\/b> şu şartlarla birleşme devir hükmündedir: (a) infisah eden ve birleşilen kurumun kanuni veya iş merkezinin Türkiye'de olması; (b) münfesih kurumun bilanço değerlerinin <b>bir bütün halinde<\/b> devralınıp aynen bilançoya geçirilmesi. Aynı şartlarla <b>tür değiştirme<\/b> de devir hükmündedir.<\/li>\n<\/ul>\n<table>\n<tr><th>İşlem<\/th><th>Tanım<\/th><th>Nakit ödeme sınırı<\/th><\/tr>\n<tr><td><b>Tam bölünme<\/b><\/td><td>Tam mükellef sermaye şirketinin tasfiyesiz infisah ederek tüm varlık ve borçlarını kayıtlı değerle <b>iki veya daha fazla<\/b> tam mükellef sermaye şirketine devretmesi; ortaklara devralan şirket hisseleri verilir<\/td><td>Verilecek hisselerin itibari değerinin <b>%10<\/b>'una kadar nakit<\/td><\/tr>\n<tr><td><b>Kısmi bölünme<\/b><\/td><td>Bilançodaki <b>en az 2 tam yıl<\/b> elde tutulan iştirak hisseleri ya da üretim veya hizmet işletmelerinin kayıtlı değerle ayni sermaye olarak tam mükellef sermaye şirketine devri. İşletme devrinde işletme bütünlüğü korunmalı. Hisseler devreden şirkette kalabilir veya ortaklara verilebilir; iştirak hisseleri ortaklara verilirse ilgili borçlar da devredilir<\/td><td>—<\/td><\/tr>\n<tr><td><b>Hisse değişimi<\/b><\/td><td>Tam mükellef sermaye şirketinin diğer bir sermaye şirketinin <b>yönetimini ve hisse çoğunluğunu<\/b> elde edecek şekilde hisselerini devralıp karşılığında kendi hisselerini vermesi<\/td><td>İtibari değerin <b>%10<\/b>'una kadar nakit<\/td><\/tr>\n<\/table>\n<ul>\n<li>7456 ile taşınmazların vergisiz kısmi bölünmeye konu edilmesi <b>01.01.2024<\/b>'ten itibaren kaldırıldı (kanun metninden \"taşınmaz\" çıkarıldı).<\/li>\n<li>Düzenleyici aktif ve pasif hesaplar ilgili hesapla birlikte devrolunur. Usulleri belirlemeye Maliye Bakanlığı yetkilidir.<\/li>\n<\/ul>\n\n<h3>Örtülü sermaye (KVK m.12)<\/h3>\n<ul>\n<li>Tanım: kurumun <b>ortaklarından veya ortakla ilişkili kişilerden<\/b> doğrudan veya dolaylı temin edip işletmede kullandığı borcun, hesap dönemi içinde herhangi bir tarihte <b>öz sermayenin üç katını<\/b> aşan kısmı.<\/li>\n<li><b>Ortak:<\/b> ortaklık payı sınırı yoktur. Ancak <b>Borsa İstanbul'da işlem gören<\/b> hisseler üzerinden ortaklıkta, borç alınan kurumla ortaklık payı en az <b>%10<\/b> olmalı. Örnek: %5 iştirak edilen bir Ltd. Şti.'den borç (borsada değilse) örtülü sermaye olabilir.<\/li>\n<li><b>Ortakla ilişkili kişi:<\/b> ortağın doğrudan veya dolaylı en az <b>%10<\/b> sermaye, oy veya kâr payı hakkına sahip olduğu kurum ya da ortağın veya bu kurumun en az %10'una sahip gerçek kişi veya kurum.<\/li>\n<li><b>Dolaylı temin:<\/b> araya üçüncü kişi, hatta birden fazla kurum girmesi örtülü sermayeyi engellemez.<\/li>\n<li><b>İşletmede kullanma:<\/b> borç aynı şartlarla başka kuruma aktarılırsa aktaran için o kısım örtülü sermaye değildir; borcu nihai kullanan için hesaba girer. Ortaktan alacak, ortağa olan borca <b>mahsup edilmez<\/b>.<\/li>\n<li><b>Öz sermaye:<\/b> VUK m.192'ye göre <b>hesap dönemi başındaki<\/b> aktif toplamı (mevcutlar + alacaklar) eksi borçlar. Yeni kurulanlarda kuruluş tarihindeki öz sermaye. Dönem başı öz sermaye sıfır veya negatifse ortak ve ilişkili kişilerden alınan borcun <b>tamamı<\/b> örtülü sermayedir. Geçmiş yıl zararı ayrıca düşülmez (sonucu değiştirmez).<\/li>\n<li>Ortak veya ilişkili kişi olan <b>banka veya benzeri kredi kurumlarından<\/b> (ana faaliyetine uygun) borçlar hesaba <b>%50<\/b> oranında girer; yalnız grup şirketlerine finansman sağlayan kredi şirketlerinde %50 uygulanmaz.<\/li>\n<li>Yabancı para borçta borcun alındığı tarihteki kur esas alınır; izleyen yıla sarkan borç bilanço günü VUK değerlemesiyle hesaplanır.<\/li>\n<li>Emsal vadeli mal ve hizmet alımlarından doğan borçlar dikkate alınmaz; olağan süreyi aşan vadeli alımlar dikkate alınır. <b>Alınan avanslar<\/b> borç sayılır; inşaat işlerinde iş kısmına göre ödenen istihkak bedelleri avans sayılmaz.<\/li>\n<li>Sonuç: yalnız <b>üç katı aşan kısım<\/b> örtülü sermayedir; bu kısma ait faiz, kur farkı ve benzeri giderler geçici vergi dönemleri dahil gider yazılamaz. Ödenen veya hesaplanan faizler, şartların gerçekleştiği dönemin son günü itibarıyla <b>dağıtılmış kâr payı<\/b> (dar mükellefte ana merkeze aktarılan tutar) sayılır; kur farkları bu kapsamda değildir. TL'nin değer kazanmasıyla oluşan kur farkı gelirleri de gelir sayılmaz.<\/li>\n<\/ul>\n<h4>Örtülü sermaye sayılmayan borçlanmalar<\/h4>\n<ul>\n<li>Ortak veya ilişkili kişilerin <b>gayrinakdi teminatı<\/b> karşılığında üçüncü kişilerden alınan borçlar. Nakdi teminatlı krediler ise hesaba girer. Nakit, çek, altın, devlet tahvili, hazine bonosu, TOKİ senetleri ve BİST'te işlem gören hisse, tahvil ve bonolar <b>nakdi<\/b>, dışındakiler gayrinakdi teminattır.<\/li>\n<li>İştirak, ortak veya ilişkili kişilerin banka, finans kurumu veya sermaye piyasasından temin edip <b>aynı şartlarla<\/b> (vade, faiz değişmeden) kullandırdığı borçlar.<\/li>\n<li>5411 sayılı Kanuna göre faaliyet gösteren <b>bankaların<\/b> borçlanmaları.<\/li>\n<li>Finansal kiralama, finansman, faktoring şirketleri ve ipotek finansmanı kuruluşlarının faaliyetleriyle ilgili olarak ortak veya ilişkili <b>bankalardan<\/b> borçlanmaları.<\/li>\n<\/ul>\n<ul><li>Kitaptaki örnek: öz sermaye 160.000 TL; ortak A 160.000, ortak C 240.000, ortak D Bankası 800.000 (yarısı, 400.000) hesaba girer; teminatlı ve aynı şartla kullandırılan borçlar girmez. Toplam 800.000 − 480.000 = <b>320.000 TL<\/b> örtülü sermaye, borç oranında dağıtılır (A 64.000, C 96.000, D 160.000).<\/li><\/ul>\n\n<h3>Transfer fiyatlandırması yoluyla örtülü kazanç dağıtımı (KVK m.13)<\/h3>\n<ul>\n<li>İlişkili kişilerle <b>emsallere uygunluk ilkesine<\/b> aykırı bedelle mal veya hizmet alım satımı yapılırsa kazanç örtülü dağıtılmış sayılır. Alım, satım, imalat, inşaat, kiralama, <b>ödünç para<\/b>, ücret ve ikramiye gerektiren işlemler her halde mal veya hizmet alım satımıdır.<\/li>\n<li><b>İlişkili kişi:<\/b> ortaklar; idare, denetim veya sermaye bakımından bağlı olunan ya da nüfuz altındaki kişiler; ortakların eşleri, üstsoy ve altsoyu, <b>üçüncü derece dahil<\/b> yansoy ve kayın hısımları.<\/li>\n<li>Ortaklık kanalıyla ilişki için en az <b>%10<\/b> ortaklık, oy veya kâr payı hakkı aranır; ortaklık olmadan %10 oy veya kâr payı hakkı da ilişki sayılır. Oranlar ilişkili kişiler açısından <b>topluca<\/b> dikkate alınır. Cumhurbaşkanı oranı <b>%1'e indirebilir, %25'e çıkarabilir<\/b>, oran şartını kaldırabilir.<\/li>\n<li>Cumhurbaşkanınca ilan edilen (vergilendirme kapasitesi ve bilgi değişimi açısından yetersiz) ülke veya bölgelerdeki kişilerle tüm işlemler ilişkili kişiyle yapılmış sayılır.<\/li>\n<li>Hesaplamalara ait kayıt ve belgeler ispat edici kâğıt olarak saklanmalıdır.<\/li>\n<\/ul>\n<table>\n<tr><th>Yöntem<\/th><th>Özü<\/th><\/tr>\n<tr><td>Karşılaştırılabilir fiyat<\/td><td>İlişkisiz kişilerin karşılaştırılabilir işlemdeki piyasa fiyatı<\/td><\/tr>\n<tr><td>Maliyet artı<\/td><td>Maliyet + makul <b>brüt kâr<\/b> oranı; özellikle hammadde, yarı mamul ve imal edilen mallar<\/td><\/tr>\n<tr><td>Yeniden satış fiyatı<\/td><td>İlişkisiz kişiye yeniden satış fiyatı − makul brüt satış kârı<\/td><\/tr>\n<tr><td>İşleme dayalı net kâr marjı<\/td><td>Maliyet, satış veya varlık temelinde <b>net faaliyet kâr marjı<\/b>; işlev farkından brüt marja göre daha az etkilenir<\/td><\/tr>\n<tr><td>Kâr bölüşüm<\/td><td>Toplam faaliyet kârının üstlenilen işlev ve riskler oranında bölüşülmesi; karşılaştırılabilir işlem yoksa ve işlemler iç içeyse<\/td><\/tr>\n<\/table>\n<ul>\n<li>İlk üçü <b>geleneksel<\/b>, son ikisi <b>işlemsel kâr<\/b> yöntemleridir. Hiçbiri uygun değilse mükellef kendi yöntemini kullanabilir.<\/li>\n<li><b>İç emsal<\/b> (mükellefin ilişkisiz kişilerle işlemi) önceliklidir; yoksa veya güvenilir değilse <b>dış emsal<\/b>; birlikte kullanım da mümkündür.<\/li>\n<li><b>Peşin fiyatlandırma anlaşması:<\/b> mükellef GİB ile yöntem üzerinde anlaşabilir; anlaşma <b>3 yılı aşmamak<\/b> üzere kesindir ve eleştirilemez. 01.01.2009'dan itibaren tüm KV mükelleflerinin ilişkili kişilerle yurt dışı işlemleri ve serbest bölge işlemleri için başvurulabilir; iki veya çok taraflı anlaşma talep edilebilir. Geçmiş dönemlere uygulanırsa önceden ödenen vergiler iade edilmez.<\/li>\n<li>Örtülü dağıtılan kazanç, şartların gerçekleştiği dönemin son günü itibarıyla <b>dağıtılmış kâr payı<\/b> sayılır. Karşı kurumda düzeltme için dağıtan kurum adına tarh edilen vergilerin <b>kesinleşip ödenmiş<\/b> olması gerekir. Kâr payı başka kuruma aktarılmışsa iştirak kazancıdır; gerçek kişi, dar mükellef veya muafa aktarılmışsa net kabul edilip <b>brüte tamamlanarak<\/b> stopaj yapılır.<\/li>\n<li>Kitaptaki örnek (yeniden satış fiyatı): 220.000 / 1,10 − 10.000 = <b>190.000 TL<\/b>.<\/li>\n<\/ul>\n\n<h3>Sermaye azaltımında vergileme (KVK m.32/B, 7420 sayılı Kanun)<\/h3>\n<table>\n<tr><th>Sınıf<\/th><th>Sermaye unsuru<\/th><th>Azaltımda vergileme<\/th><\/tr>\n<tr><td>I (a)<\/td><td>Başka hesaba aktarılınca KV'ye ve kâr dağıtımı stopajına tabi öz sermaye kalemleri (yeniden değerleme fonları, enflasyon düzeltmesi olumlu farkları, VUK 280/A özel fon vb.)<\/td><td><b>KV + stopaj<\/b>; stopaj matrahı = tutar − hesaplanan KV<\/td><\/tr>\n<tr><td>II (b)<\/td><td>Yalnız kâr dağıtımı stopajına tabi kalemler (geçmiş yıl kârları vb.)<\/td><td>Yalnız <b>stopaj<\/b><\/td><\/tr>\n<tr><td>III (c)<\/td><td>Ayni ve nakdi sermaye<\/td><td>Vergilenmez<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Beş tam yıl geçtikten sonra azaltım:<\/b> azaltılan tutar, unsurların toplam sermaye içindeki <b>oranına göre<\/b> dağıtılır (yalnız bu üç sınıf).<\/li>\n<li><b>Beş tam yıl dolmadan azaltım:<\/b> azaltım <b>sırasıyla<\/b> I, II, III sınıflarından yapılmış sayılır.<\/li>\n<li>Karma durumda önce eklenme tarihi <b>beş tam yılı geçmemiş<\/b> unsurlar azaltılmış sayılır, kalan için oransal yöntem uygulanır.<\/li>\n<li><b>Geçmiş yıl zararlarının mahsubu<\/b> için azaltımda ortağa ödeme olmadığından <b>stopaj yapılmaz<\/b>; ancak azaltılan unsur içinde KV'ye tabi kalem (ör. VUK 280/A özel fon) varsa onun payına <b>KV hesaplanır<\/b>.<\/li>\n<li><b>Devir ve tam bölünme<\/b> sonrası: sermaye unsurları devralana kayıtlı değerle geçer, o aşamada vergi yok. Devralan sonradan azaltırsa vergilenir; beş yıllık sürede devreden şirketteki süre de sayılır.<\/li>\n<li><b>Kısmi bölünme<\/b>: devralan şirket hisseleri ortaklara verilirse devreden şirkette sermaye azaltımı gerekir (TTK). Unsurlar devralana aktarılıp orada izlenirse bu aşamada vergi yoktur; devralan azaltırsa vergilenir ve devreden şirketteki süre de sayılır.<\/li>\n<li>Kitaptaki örnekler KV oranını %20 ve stopajı %10 varsayar; sınavda verilen varsayımı kullan. Örnek: 1.000.000 TL sermaye (%60 nakdi, %30 enflasyon farkı, %10 geçmiş yıl kârı), beş yıl sonra 400.000 TL azaltım: 120.000 enflasyon farkı (KV 24.000; stopaj 96.000 x %10 = 9.600), 40.000 geçmiş yıl kârı (stopaj 4.000), 240.000 nakdi (vergisiz).<\/li>\n<\/ul>\n<h4>Kendi paylarını iktisap eden şirketler (GVK m.94/4)<\/h4>\n<ul>\n<li>Tam mükellef sermaye şirketi iktisap ettiği kendi paylarını sermaye azaltımıyla itfa ederse, <b>iktisap bedeli ile itibari değer arasındaki fark<\/b> dağıtılmış kâr payı sayılır; kesinti tescil tarihinde yapılır. Bu, m.32/B'den farklı bir konudur.<\/li>\n<li>7343 sayılı CK: payları <b>Borsa İstanbul'da işlem gören<\/b> şirketlerde oran <b>%0<\/b>; işlem görmeyen şirketlerin <b>7 Temmuz 2023<\/b>'ten itibaren iktisap ettiği kendi paylarında <b>%15<\/b>.<\/li>\n<\/ul>", "sorular": [{"q": "Bir kurum 500.000 USD tutarında, sözleşme kuru 34,80 olan 3 ay vadeli forward döviz alım sözleşmesi yapmıştır. Vadede spot kur 35,40 olursa kurum kazancına dahil edilecek tutar ve tarihi nedir?", "o": ["300.000 TL – her ay sonu değerlemesinde", "300.000 TL – vade tarihinde", "17.400.000 TL – sözleşme tarihinde", "600.000 TL – vade tarihinde", "Kazanç oluşmaz, yalnızca kur farkı dipnotu verilir"], "a": 1, "e": "Kazanç 500.000 x (35,40 - 34,80) = 300.000 TL'dir. Forward taahhüt niteliğinde olduğundan ara değerlemeler dikkate alınmaz, kâr vadede kazanca girer."}, {"q": "Bir kurum para swapında işlem tarihinde 10.000.000 USD'yi 32,50 kurdan alıp vadede 32,80 sözleşme kurundan geri satacaktır. Vadede kurum lehine doğan ve o tarihte kazanca dahil edilecek tutar kaç TL'dir?", "o": ["300.000", "328.000.000", "30.000.000", "3.000.000", "325.000.000"], "a": 3, "e": "Vadede alınacak TL (328.000.000) ile işlem tarihinde ödenen TL (325.000.000) arasındaki fark 3.000.000 TL'dir ve vade tarihinde kazanca girer."}, {"q": "Opsiyon priminin kurumlar vergisi karşısındaki durumuyla ilgili hangisi doğrudur?", "o": ["Hakkı satan taraf için sözleşmenin düzenlendiği tarihte gelir olarak dikkate alınır", "Hakkı satan taraf için opsiyonun kullanıldığı tarihte gelir yazılır", "Hakkı alan taraf primi ödediği tarihte gider yazar", "Prim hiçbir tarafta kazanç hesabına girmez", "Prim her iki tarafta da vade sonunda kayda alınır"], "a": 0, "e": "Tahakkuk esası gereği prim, hakkı satan için sözleşme tarihinde kesinleştiğinden gelirdir; alan taraf için hakkın kullanıldığı veya sözleşmenin sona erdiği tarihte gider olur."}, {"q": "Vadeli İşlem ve Opsiyon Piyasasındaki açık pozisyonların dönem sonu değerlemesi nasıl yapılır?", "o": ["Maliyet bedeliyle değerlenir", "Değerleme yapılmaz, yalnız vadede kazanç tanınır", "Emsal bedelle değerlenir", "Mukayyet değerle değerlenir", "VUK m.289'a göre borsa rayici (uzlaşma fiyatı) ile değerlenir"], "a": 4, "e": "VİOP sözleşmeleri borsa rayici ile değerlendiğinden uzlaşma fiyatına göre oluşan fark kurum kazancıyla ilişkilendirilir."}, {"q": "Türkiye'de iş yeri ve daimi temsilcisi olmayan dar mükellef bir kurumun aşağıdaki türev işlemlerinden hangisinden elde ettiği kazanç üzerinden KVK m.30 uyarınca vergi kesintisi yapılır?", "o": ["Forward", "Para swapı", "Faiz swapı", "Tezgâh üstü opsiyon primi", "Aracı kuruluş varantı"], "a": 2, "e": "Faiz swapı kazancı alacak faizi sayılır ve KVK m.30/1-ç uyarınca kesintiye tabidir; diğerleri ticari kazanç kabul edilir ve kesinti yapılmaz."}, {"q": "KVK m.19'a göre tam bölünme ve hisse değişiminde, ortaklara verilecek hisselerin itibari değerinin en fazla ne kadarlık kısmı nakit ödenebilir?", "o": ["%5", "%10", "%20", "%25", "%50"], "a": 1, "e": "İtibari değerin %10'una kadarlık kısmının nakit ödenmesi işlemin bölünme veya hisse değişimi sayılmasına engel değildir."}, {"q": "Tam bölünmede ortaklara verilecek hisselerin toplam itibari değeri 2.000.000 TL ise işlemin bölünme sayılmasını bozmadan ödenebilecek azami nakit kaç TL'dir?", "o": ["100.000", "400.000", "500.000", "200.000", "1.000.000"], "a": 3, "e": "%10 sınırı: 2.000.000 x %10 = 200.000 TL."}, {"q": "Kısmi bölünmeyle ilgili hangisi yanlıştır?", "o": ["01.01.2024'ten itibaren taşınmazlar da vergisiz kısmi bölünmeye konu edilebilir", "Devredilen iştirak hisselerinin en az 2 tam yıl elde tutulmuş olması gerekir", "Üretim veya hizmet işletmesinin devrinde işletme bütünlüğü korunmalıdır", "Edinilen hisseler devreden şirkette kalabilir veya ortaklara verilebilir", "Varlıklar kayıtlı değerleri üzerinden ayni sermaye olarak devredilir"], "a": 0, "e": "7456 sayılı Kanunla taşınmazların vergiye tabi olmaksızın kısmi bölünmeye konu edilmesi 01.01.2024'ten itibaren kaldırılmıştır."}, {"q": "Birleşmenin KVK açısından devir hükmünde sayılması için hangisi şarttır?", "o": ["Birleşilen kurumun yalnızca kanuni merkezinin yurt dışında olması", "Ortaklara %10'dan fazla nakit ödenmesi", "Birleşme kârının ayrıca vergilendirilmesi", "Devralan kurumun halka açık olması", "Münfesih kurumun bilanço değerlerinin bir bütün halinde devralınıp aynen bilançoya geçirilmesi"], "a": 4, "e": "Devir için her iki kurumun kanuni veya iş merkezinin Türkiye'de olması ve bilanço değerlerinin bir bütün halinde devralınıp aynen bilançoya geçirilmesi gerekir."}, {"q": "Bir kurumun hesap dönemi başında mevcutları 300, alacakları 200, borçları 80 ve geçmiş yıl zararları 20 birimdir. Örtülü sermaye hesabında dikkate alınacak öz sermaye kaç birimdir?", "o": ["400", "440", "420", "500", "520"], "a": 2, "e": "Öz sermaye = (mevcutlar + alacaklar) - borçlar = 500 - 80 = 420. Geçmiş yıl zararları ayrıca düşülmez."}, {"q": "Dönem başı öz sermayesi 200.000 TL olan kurum; ortak A'dan doğrudan 500.000 TL, ortağı olan bir bankadan 600.000 TL, ortağın gayrimenkulünü teminat göstererek üçüncü kişiden 400.000 TL borç almıştır. Örtülü sermaye tutarı kaç TL'dir?", "o": ["0", "200.000", "500.000", "700.000", "900.000"], "a": 1, "e": "Gayrinakdi teminatlı borç hesaba girmez; ortak banka borcu %50 (300.000) dikkate alınır. Toplam 800.000 - (3 x 200.000) = 200.000 TL."}, {"q": "Örtülü sermaye hesabında dikkate alınan borçlar toplamı 800.000 TL (ortak A 500.000 TL, ortak banka 300.000 TL) ve örtülü sermaye 200.000 TL'dir. Örtülü sermayenin ortak A'ya isabet eden kısmı kaç TL'dir?", "o": ["75.000", "100.000", "200.000", "125.000", "62.500"], "a": 3, "e": "Dağıtım dikkate alınan borç oranında yapılır: (500.000 / 800.000) x 200.000 = 125.000 TL."}, {"q": "Aşağıdaki borçlanmalardan hangisi örtülü sermaye hesabında dikkate alınır?", "o": ["Ortağın verdiği nakdi teminat karşılığında alınan kredi", "Ortağın gayrinakdi teminatı karşılığında bankadan alınan kredi", "Grup şirketinin bankadan alıp aynı vade ve faizle kullandırdığı kredi", "5411 sayılı Kanuna göre faaliyet gösteren bir bankanın ortağından borçlanması", "Faktoring şirketinin faaliyetiyle ilgili olarak ortağı olan bankadan borçlanması"], "a": 0, "e": "Nakdi teminat karşılığında sağlanan krediler borç/öz sermaye hesabında işletmeye verilen borç olarak dikkate alınır; diğerleri örtülü sermaye sayılmaz."}, {"q": "Örtülü sermayeyle ilgili hangisi yanlıştır?", "o": ["Dönem başı öz sermaye negatifse ortaktan alınan borcun tamamı örtülü sermayedir", "Borsa İstanbul'da işlem gören hisseler üzerinden ortaklıkta en az %10 pay aranır", "Alınan avanslar borç olarak değerlendirilir", "Örtülü sermaye üzerinden ödenen faizler dönemin son günü itibarıyla dağıtılmış kâr payı sayılır", "Ortaktan olan alacak, ortağa olan borçtan mahsup edilerek hesaplama yapılır"], "a": 4, "e": "Borcu kullanan kurumun aynı ortaktan alacağı olsa bile bu alacak borca mahsup edilmez."}, {"q": "Transfer fiyatlandırmasında ortaklık kanalıyla ilişkili kişi sayılmak için aranan asgari ortaklık, oy veya kâr payı oranı kaçtır ve Cumhurbaşkanı bu oranı hangi aralıkta değiştirebilir?", "o": ["%5 – %1 ile %20 arası", "%10 – %5 ile %50 arası", "%10 – %1 ile %25 arası", "%20 – %10 ile %25 arası", "%25 – %1 ile %50 arası"], "a": 2, "e": "Oran %10'dur; Cumhurbaşkanı %1'e kadar indirmeye, %25'e kadar çıkarmaya veya oran şartını kaldırmaya yetkilidir."}, {"q": "Aşağıdakilerden hangisi transfer fiyatlandırmasında işlemsel kâr yöntemlerinden biridir?", "o": ["Karşılaştırılabilir fiyat yöntemi", "İşleme dayalı net kâr marjı yöntemi", "Maliyet artı yöntemi", "Yeniden satış fiyatı yöntemi", "İç emsal yöntemi"], "a": 1, "e": "İşlemsel kâr yöntemleri işleme dayalı net kâr marjı ve kâr bölüşüm yöntemleridir; ilk üçü geleneksel işlem yöntemleridir."}, {"q": "İlişkili yurt dışı şirketten makine alan Türk dağıtıcının makineyi ilişkisiz kişilere satış fiyatı 330.000 TL'dir. Sektördeki makul kâr marjı satış fiyatı üzerinden %10 (yöntem gereği 1,10'a bölünerek) ve dağıtıcının üstlendiği reklam-garanti maliyeti 15.000 TL'dir. Yeniden satış fiyatı yöntemine göre emsal alış fiyatı kaç TL'dir?", "o": ["282.000", "300.000", "297.000", "285.000", "315.000"], "a": 3, "e": "330.000 / 1,10 - 15.000 = 300.000 - 15.000 = 285.000 TL."}, {"q": "Peşin fiyatlandırma anlaşmasıyla belirlenen yöntem en fazla ne kadar süre için kesinlik taşır?", "o": ["3 yıl", "1 yıl", "2 yıl", "5 yıl", "Süresiz"], "a": 0, "e": "KVK m.13/5'e göre anlaşılan yöntem üç yılı aşmamak üzere belirlenen süre ve koşullarda kesinlik taşır ve eleştiri konusu yapılamaz."}, {"q": "Toplam sermayesi 2.000.000 TL olan şirketin sermayesi 1.200.000 TL nakdi sermaye, 500.000 TL enflasyon düzeltmesi olumlu farkı ve 300.000 TL geçmiş yıl kârından oluşmaktadır; unsurlar sermayeye 6 yıl önce eklenmiştir. 800.000 TL sermaye azaltımında enflasyon düzeltmesi farkından azaltıldığı kabul edilecek tutar ve bunun üzerinden hesaplanacak KV kaç TL'dir? (KV %25)", "o": ["500.000 – 125.000", "320.000 – 80.000", "200.000 – 40.000", "120.000 – 30.000", "200.000 – 50.000"], "a": 4, "e": "Beş tam yıl geçtiğinden oransal dağıtım yapılır: 800.000 x (500.000 / 2.000.000) = 200.000 TL; KV = 200.000 x %25 = 50.000 TL."}, {"q": "Sermayeye 6 yıl önce eklenen unsurlarla birlikte 2.000.000 TL olan sermayenin %60'ı nakdi, %25'i enflasyon düzeltmesi farkı, %15'i geçmiş yıl kârıdır. 800.000 TL azaltımda KV %25, kâr dağıtımı stopajı %15 ve ortaklar gerçek kişi ise toplam stopaj kaç TL'dir?", "o": ["48.000", "30.000", "40.500", "22.500", "52.500"], "a": 2, "e": "Enflasyon farkı payı 200.000, KV 50.000, stopaj (200.000 - 50.000) x %15 = 22.500. Geçmiş yıl kârı payı 120.000, stopaj 18.000. Toplam 40.500 TL; nakdi sermaye payı (480.000) vergilenmez."}, {"q": "Sermayesi 1.200.000 TL nakdi, 500.000 TL enflasyon düzeltmesi farkı ve 300.000 TL geçmiş yıl kârından oluşan şirket, farkları ve kârı sermayeye ekledikten 2 yıl sonra 600.000 TL sermaye azaltımı yapmıştır. Azaltım hangi unsurlardan yapılmış sayılır?", "o": ["360.000 nakdi, 150.000 enflasyon farkı, 90.000 geçmiş yıl kârı", "500.000 enflasyon farkı, 100.000 geçmiş yıl kârı", "300.000 geçmiş yıl kârı, 300.000 enflasyon farkı", "600.000 nakdi sermaye", "500.000 enflasyon farkı, 100.000 nakdi sermaye"], "a": 1, "e": "Beş tam yıl dolmadan azaltımda sırasıyla KV ve stopaja tabi kalemler (enflasyon farkı 500.000), sonra yalnız stopaja tabi kalemler (geçmiş yıl kârı 100.000) azaltılmış sayılır."}, {"q": "Geçmiş yıl zararlarının mahsubu amacıyla yapılan sermaye azaltımıyla ilgili hangisi doğrudur?", "o": ["Azaltılan tüm unsurlar üzerinden stopaj yapılır", "Hiçbir koşulda vergi doğmaz", "Yalnızca nakdi sermaye azaltılmış sayılır", "Ortaklara ödeme olmadığından stopaj yapılmaz; ancak KV'ye tabi unsur varsa onun için KV hesaplanır", "Azaltılan tutar tamamen KV'ye tabidir"], "a": 3, "e": "Mahsup işleminde ortaklara nakden veya hesaben ödeme olmadığından stopaj yapılmaz; VUK 280/A özel fon gibi KV'ye tabi unsurların payına KV hesaplanır."}, {"q": "Payları Borsa İstanbul'da işlem görmeyen bir tam mükellef A.Ş.'nin 2025'te iktisap edip sermaye azaltımıyla itfa ettiği kendi paylarına ilişkin dağıtılmış kâr payı sayılan tutara uygulanacak tevkifat oranı kaçtır?", "o": ["%15", "%0", "%5", "%10", "%20"], "a": 0, "e": "7343 sayılı CK'ya göre borsada işlem görmeyen şirketlerin 7 Temmuz 2023'ten itibaren iktisap ettikleri kendi paylarında oran %15; borsada işlem görenlerde %0'dır."}]}, {"id": 5, "kisa": "Asgari KV ve Varlık Barışı", "baslik": "Yurt İçi ve Küresel Asgari Kurumlar Vergisi, Vergiye Uyumlu Mükellef İndirimi ve Varlık Barışı", "ozet": "KVK m.32/C yurt içi asgari KV, yerel ve küresel asgari tamamlayıcı KV, GVK mük. m.121 %5 indirimi ve KVK geçici m.19 varlık barışı.", "notlar": "<h3>Yurt içi asgari kurumlar vergisi (KVK m.32/C)<\/h3>\n<ul>\n<li>KVK m.32 ve 32/A'ya göre hesaplanan KV, <b>indirim ve istisnalar düşülmeden önceki kurum kazancının %10<\/b>'undan az olamaz.<\/li>\n<li>İndirim ve istisnalar düşülmeden önceki kurum kazancı = dönem sonu <b>ticari bilanço kârı (veya zararı) + kanunen kabul edilmeyen giderler<\/b>. Bu toplam sıfırdan büyükse asgari KV hesaplanır.<\/li>\n<li><b>Mükellefler:<\/b> KVK m.1'deki tüm mükellefler (sermaye şirketleri, kooperatifler, iktisadi kamu kuruluşları, dernek ve vakıf iktisadi işletmeleri, iş ortaklıkları). Kazancını KV beyannamesiyle beyan etmek zorunda olan <b>dar mükellef kurumlar<\/b> da tabidir; KVK m.30 kapsamında tevkif edilmiş kazançlar için ihtiyari beyanname veren dar mükellefler de tabi olur.<\/li>\n<li><b>Uygulanmayanlar:<\/b> KV'den <b>muaf<\/b> olanlar; ilk defa faaliyete başlayan kurumlarda <b>üç hesap dönemi<\/b>; GVK m.113'e göre <b>hasılat esasında<\/b> vergilenenler.<\/li>\n<li>Dikkat: Birleşme, devir, tür değişikliği, kısmi veya tam bölünmeyle kurulan şirketler <b>ilk defa faaliyete başlayan sayılmaz<\/b>.<\/li>\n<li>Yürürlük: takvim yılı kullananlarda <b>2025<\/b> ve izleyen dönemler; özel hesap dönemlilerde 2025'te başlayan dönemden itibaren. Asgari KV <b>geçici vergi dönemlerinde de<\/b> hesaplanır.<\/li>\n<li>Hesaplanan asgari vergiden, döneme ait <b>tevkif yoluyla ödenen KV<\/b> ve <b>ödenen geçici vergiler<\/b> mahsup edilebilir. Tasfiye, birleşme, devir ve tam bölünme beyannamelerinde de asgari KV hesaplanır.<\/li>\n<\/ul>\n<table>\n<tr><th>Asgari KV matrahından düşülen istisnalar<\/th><th>Asgari KV matrahından düşülen indirimler<\/th><\/tr>\n<tr><td>İştirak kazançları (KVK 5/1-a)<br>Emisyon primi (5/1-ç)<br>Yatırım fon ve ortaklıkları kazancı, taşınmaz kazançları hariç (5/1-d)<br>Risturn (5/1-i)<br>Sat-kirala-geri al (5/1-j)<br>Varlık kiralama (5/1-k)<br>Türk Uluslararası Gemi Sicili gemileri (4490 m.12)<br>Serbest bölge kazançları (3218 geçici m.3)<br>Teknoloji geliştirme bölgesi kazançları (4691 geçici m.2)<\/td><td>Girişim sermayesi fonu (10/1-g)<br>Korumalı işyeri (10/1-h)<br>Transit ticaret ve aracılık (10/1-i)<br>Nitelikli hizmet merkezi (10/1-j)<br>Ar-Ge ve tasarım indirimi (5746 m.3 ve 3/A)<\/td><\/tr>\n<\/table>\n<ul>\n<li>Beyannamenin \"diğer indirimler\" satırına yazılan ama mahiyeten indirim veya istisna olmayan tutarlar (TMS/TFRS ile VUK değerleme farkları, örtülü sermayede TL'nin değer kazanmasından doğan kur farkı gelirleri, kıdem tazminatı karşılığı iptali, mükerrer 121 indirimi gibi) üzerinden asgari KV hesaplanmaz.<\/li>\n<li>ÇVÖA gereği Türkiye'nin vergileme hakkı olmayan veya istisna edilmesi gereken kazançlar ile diğer uluslararası anlaşmalara göre istisna kazançlar da kapsam dışıdır.<\/li>\n<\/ul>\n\n<h3>Yerel ve küresel asgari tamamlayıcı kurumlar vergisi<\/h3>\n<ul>\n<li><b>Kapsam:<\/b> nihai ana işletmenin konsolide finansal tablosundaki yıllık konsolide hasılatı, raporlama döneminden önceki <b>dört hesap döneminin en az ikisinde<\/b> <b>750 milyon avro<\/b> karşılığı TL'yi aşan <b>çok uluslu işletme gruplarının<\/b> bağlı işletmeleri. Daha küçük veya tamamen yerel gruplar kapsam dışıdır.<\/li>\n<li>Cari dönem hasılatı hesaba katılmaz. Dönem 12 aydan farklıysa hasılat <b>yıllığa iblağ<\/b> edilir. Grup içi işlemler konsolidasyonda elendiğinden hasılat sınırı, işletmelerin ayrı hasılatlarının toplamı değil <b>konsolide hasılat<\/b>la belirlenir; azınlık payları olsa da işletmenin tüm hasılatı dikkate alınır.<\/li>\n<li>Yeni kurulan grupta önceki iki hesap dönemi oluşunca ve iki dönemde sınır aşılmışsa <b>üçüncü dönem<\/b> ilk uygulama dönemi olur.<\/li>\n<li>Sınırın TL karşılığı, Avrupa Merkez Bankasının <b>önceki yıl Aralık ayı ortalama kuru<\/b>yla <b>Ocak ayında<\/b> hesaplanıp GİB internet sitesinde ilan edilir.<\/li>\n<li>Hesap dönemi: nihai ana işletmenin konsolide tablolarda kullandığı dönem.<\/li>\n<\/ul>\n<table>\n<tr><th>Tanım<\/th><th>Kritik eşik / özellik<\/th><\/tr>\n<tr><td>Çok uluslu işletme grubu<\/td><td>Nihai ana işletmenin ülkesi dışında en az bir ülkede işletme veya iş yeri olan grup<\/td><\/tr>\n<tr><td>Nihai ana işletme<\/td><td>Başkasını kontrol eden, kendisi kontrol edilmeyen işletme. Kamu niteliğindeki <b>varlık fonları<\/b> nihai ana işletme sayılmaz<\/td><\/tr>\n<tr><td>Kısmen sahip olunan ana işletme<\/td><td>Mülkiyet payının <b>%20'den fazlası<\/b> grup dışı kişilerde olan bağlı işletme<\/td><\/tr>\n<tr><td>İş ortaklığı<\/td><td>Nihai ana işletmenin en az <b>%50<\/b> payına sahip olduğu ve öz kaynak yöntemiyle raporlanan işletme<\/td><\/tr>\n<tr><td>Yatırım işletmesi<\/td><td>En az <b>%95<\/b>'i fon veya gayrimenkul yatırım araçlarına ait; ya da değerinin en az <b>%85<\/b>'i bunlara ait ve gelirinin en az <b>%51<\/b>'i belirli kazançlardan oluşan işletme<\/td><\/tr>\n<tr><td>Nitelikli iade edilebilir vergi kredisi<\/td><td><b>Dördüncü hesap dönemi<\/b> sonuna kadar mahsup edilemeyen bakiyenin nakden iadesini öngören teşvik<\/td><\/tr>\n<tr><td>Güvenli liman<\/td><td>Küresel asgari tamamlayıcı KV'nin sıfır kabul edildiği yerler<\/td><\/tr>\n<tr><td>Net ülkesel bazlı kazanç<\/td><td>Bir ülkedeki bağlı işletmelerin ülkesel bazlı kazancının sıfırdan büyük olması<\/td><\/tr>\n<\/table>\n<h4>Muafiyet ve istisnalar (KVK ek m.3)<\/h4>\n<ul>\n<li><b>Muaf olanlar:<\/b> kamu kurum ve kuruluşları ile uluslararası kuruluşlar; kâr amacı gütmeyen kuruluşlar; <b>emeklilik yatırım fonları<\/b>; nihai ana işletme niteliğindeki yatırım fonları; nihai ana işletme niteliğindeki gayrimenkul yatırım araçları.<\/li>\n<li>Ayrıca muaf: değerinin en az <b>%95<\/b>'i muaf işletmelere ait olup onlar yararına varlık tutan veya yardımcı faaliyet gösterenler; değerinin en az <b>%85<\/b>'i muaf işletmelere ait olup kazancının en az <b>%51<\/b>'i belirli kazançlardan oluşanlar (emeklilik hizmeti veren kuruluşların payı hariç).<\/li>\n<li>Muafların hasılatı, konsolide hasılat sınırının hesabına <b>dahil edilir<\/b>.<\/li>\n<li>Muafiyetten isteğe bağlı vazgeçilebilir; bilgi beyannamesini veren bağlı işletmenin talebiyle olur ve en az <b>beş hesap dönemi<\/b> vazgeçilmiş sayılır.<\/li>\n<li><b>Uluslararası deniz taşımacılığı<\/b> kazançları istisnadır: yük ve yolcu gemilerinin işletilmesi, mürettebatlı kiralama, ilgili ortaklıklara iştirak, en az <b>bir yıl<\/b> elde tutulan gemilerin satışı.<\/li>\n<li>Bağlantılı faaliyet kazançları (grup dışına <b>üç yılı<\/b> geçmeyen yüksüz gemi kiralama, yurt içi parkur bilet satışı, konteyner kiralama ve <b>üç aydan<\/b> kısa depolama, personel hizmetleri, ayrılmaz yatırımlar) uluslararası deniz taşımacılığı kazancının <b>%50<\/b>'sini aşmamak şartıyla istisnadır.<\/li>\n<li>İstisna kazançlara ait giderler ve istisna faaliyet zararları istisna dışı kazançlardan indirilemez.<\/li>\n<\/ul>\n\n<h3>Vergiye uyumlu mükellefler için indirim (GVK mük. m.121)<\/h3>\n<ul>\n<li>Şartları taşıyan GV ve KV mükellefleri, <b>01.01.2018<\/b>'den itibaren verilecek yıllık beyannamelerde hesaplanan verginin <b>%5<\/b>'ini ödenecek vergiden indirebilir.<\/li>\n<li>Yararlananlar: ticari, zirai veya mesleki kazanç nedeniyle GV mükellefleri ve KV mükellefleri. <b>Yararlanamayanlar:<\/b> finans ve bankacılık sektörü, sigorta ve reasürans şirketleri, emeklilik şirketleri ve emeklilik yatırım fonları.<\/li>\n<li>Tam ve dar mükellef ayrımı yoktur (301 ve 312 Seri No.lu GV Genel Tebliğleri); şartları sağlayan dar mükellefler de yararlanabilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Şart<\/th><th>İçerik<\/th><\/tr>\n<tr><td>Süresinde beyan<\/td><td>İndirim yılı ve önceki <b>son iki yıl<\/b> beyannameleri (yıllık GV ve KV, geçici, muhtasar ve prim hizmet, KDV, ÖTV) kanuni süresinde verilmiş olmalı. Süresinde verilene sonradan düzeltme veya pişmanlıkla verilen beyanname ihlal sayılmaz<\/td><\/tr>\n<tr><td>Tarhiyat yokluğu<\/td><td>Bu sürede kesinleşmiş ikmalen, re'sen veya idarece tarhiyat bulunmamalı. Kesinleşen tarhiyat yıllık indirim sınırının <b>%1<\/b>'ini aşmıyorsa ihlal sayılmaz<\/td><\/tr>\n<tr><td>Ödeme<\/td><td>Beyanname tarihinde kapsamdaki vergiler ödenmiş olmalı; <b>1.000 TL<\/b>'nin üzerinde vadesi geçmiş borç (ceza ve fer'iler dahil) bulunmamalı<\/td><\/tr>\n<\/table>\n<ul>\n<li>İndirim tutarı <b>01.01.2026<\/b>'dan itibaren verilecek beyannamelerde <b>12.000.000 TL<\/b>'yi aşamaz.<\/li>\n<li>İndirim ödenecek vergiden fazlaysa kalan, beyannamenin verilmesi gereken tarihi izleyen <b>bir tam yıl<\/b> içinde diğer beyana dayalı vergilerden mahsup edilir; mahsup edilemeyen <b>iade edilmez<\/b>.<\/li>\n<li>Şartların sağlanmadığı sonradan anlaşılırsa ödenmeyen vergi <b>vergi ziyaı cezası uygulanmadan<\/b> tarh edilir.<\/li>\n<\/ul>\n\n<h3>Varlık barışı (KVK geçici m.19, 7582 sayılı Kanun m.10, 21.05.2026)<\/h3>\n<ul>\n<li>Amaç: vergiye gönüllü uyumu artırmak.<\/li>\n<li><b>Yurt dışındaki<\/b> para, altın, döviz, menkul kıymet ve diğer sermaye piyasası araçları <b>31.07.2027<\/b>'ye kadar banka veya aracı kurumlara bildirilir. Bildirimden itibaren <b>iki ay<\/b> içinde Türkiye'deki hesaplara transfer edilmeli veya fiziken getirilip yatırılmalıdır. Fiziki getirme gümrük beyan belgeleriyle tevsik edilir; Gümrük İdaresi beyanları izleyen ayın sonuna kadar GİB'e bildirir.<\/li>\n<li><b>Türkiye'de olup kanuni defterlerde yer almayan<\/b> aynı varlıklar da 31.07.2027'ye kadar bildirilir ve bildirim tarihinde banka veya aracı kuruma yatırılarak tevsik edilir.<\/li>\n<li>Banka ve aracı kurumlar varlık değeri üzerinden <b>%5<\/b> vergiyi peşin tahsil eder; bildirimi izleyen ayın <b>15'inci günü<\/b> akşamına kadar vergi sorumlusu olarak beyan eder ve öder.<\/li>\n<\/ul>\n<table>\n<tr><th>Vadeli hesap, DİBS, kira sertifikası veya GSYF'de tutma taahhüdü<\/th><th>Oran (2026 bildirimleri)<\/th><\/tr>\n<tr><td>Taahhüt yok<\/td><td>%5<\/td><\/tr>\n<tr><td>En az 1 yıl<\/td><td>%4<\/td><\/tr>\n<tr><td>En az 2 yıl<\/td><td>%3<\/td><\/tr>\n<tr><td>En az 3 yıl<\/td><td>%2<\/td><\/tr>\n<tr><td>En az 4 yıl<\/td><td>%1<\/td><\/tr>\n<tr><td>En az 5 yıl<\/td><td>%0<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>01.01.2027–31.07.2027<\/b> (dahil) arasındaki bildirimlerde taahhüde bağlı bu oranlara <b>yarım puan<\/b> eklenir (ör. 3 yıl taahhütte %2,5; 5 yıl taahhütte %0,5). Süre yetkiyle uzatılırsa sonraki bildirimlerde ilave yarım puanla toplam <b>1 puan<\/b> artırım uygulanır.<\/li>\n<li>Bildirilen varlıklara isabet eden tutarlar için <b>vergi incelemesi ve tarhiyat yapılmaz<\/b>; diğer mevzuattaki tedbirler etkilenmez.<\/li>\n<li>Başka nedenle başlayan incelemede bulunan matrah farkı bildirilen varlıktan kaynaklanıyorsa ve varlık tutarı farka eşit veya büyükse tarhiyat yapılmaz; fark varlıktan büyükse yalnız aradaki fark için tarhiyat yapılır. Matrah farkı başka nedenlerden doğmuşsa bildirilen tutar mahsup edilmez.<\/li>\n<\/ul>", "sorular": [{"q": "Yurt içi asgari kurumlar vergisine göre hesaplanan KV, hangi tutarın %10'undan az olamaz?", "o": ["Beyan edilen kurum kazancının", "İndirim ve istisnalar düşülmeden önceki kurum kazancının", "Hasılatın", "Ticari bilanço kârının", "Öz sermayenin"], "a": 1, "e": "KVK m.32/C'ye göre KV, indirim ve istisnalar düşülmeden önceki kurum kazancının (ticari bilanço kârı veya zararı + KKEG) %10'undan az olamaz."}, {"q": "İndirim ve istisnalar düşülmeden önceki kurum kazancı 20.000.000 TL olan kurumun KVK m.32'ye göre hesaplanan KV'si 1.500.000 TL'dir. Asgari KV kuralı gereği hesaplanacak KV kaç TL olur?", "o": ["1.500.000", "3.500.000", "500.000", "2.000.000", "5.000.000"], "a": 3, "e": "Asgari KV 20.000.000 x %10 = 2.000.000 TL'dir; hesaplanan KV bunun altında kaldığından 2.000.000 TL esas alınır."}, {"q": "Ticari bilanço kârı 12.000.000 TL, KKEG 1.000.000 TL olan kurumun 3.000.000 TL iştirak kazancı vardır. İştirak kazancının asgari KV matrahından düşülebildiği dikkate alınırsa asgari KV kaç TL'dir?", "o": ["1.000.000", "1.300.000", "1.200.000", "900.000", "1.600.000"], "a": 0, "e": "Asgari matrah 12.000.000 + 1.000.000 - 3.000.000 = 10.000.000 TL; %10'u 1.000.000 TL."}, {"q": "Asgari KV'si 2.000.000 TL olan kurumun döneme ait 1.200.000 TL geçici vergisi ve 300.000 TL tevkif yoluyla ödenmiş KV'si vardır. Yıllık beyanname üzerinden ödenecek tutar kaç TL'dir?", "o": ["2.000.000", "800.000", "1.700.000", "0", "500.000"], "a": 4, "e": "Asgari vergiden ödenen geçici vergi ve tevkif edilen KV mahsup edilebilir: 2.000.000 - 1.200.000 - 300.000 = 500.000 TL."}, {"q": "Aşağıdakilerden hangisi için yurt içi asgari KV hükümleri uygulanır?", "o": ["Kurumlar vergisinden muaf kurumlar", "İlk defa faaliyete başlayan kurumun ikinci hesap dönemi", "Tam bölünme sonucu yeni kurulan şirketin ilk hesap dönemi", "Hasılat esasına göre vergilendirilen kurum", "İlk defa faaliyete başlayan kurumun ilk hesap dönemi"], "a": 2, "e": "Birleşme, devir, tür değişikliği veya bölünmeyle kurulan şirketler ilk defa faaliyete başlayan şirket sayılmaz; üç dönemlik muafiyetten yararlanamaz."}, {"q": "Aşağıdakilerden hangisi asgari KV matrahından düşülebilen istisna veya indirimlerden biri değildir?", "o": ["İştirak kazançları istisnası", "Yatırım fon ve ortaklıklarının taşınmazlardan elde ettiği kazançlar", "Emisyon primi kazancı istisnası", "Teknoloji geliştirme bölgesi kazanç istisnası", "Ar-Ge ve tasarım indirimi"], "a": 1, "e": "Yatırım fon ve ortaklıklarının kazanç istisnası asgari matrahtan düşülür ama taşınmazlardan elde edilen kazançlar hariç tutulmuştur."}, {"q": "Yurt içi asgari KV'nin takvim yılını hesap dönemi olarak kullanan mükelleflere uygulanmaya başladığı dönem hangisidir?", "o": ["2023", "2024", "2026", "2025", "2027"], "a": 3, "e": "Takvim yılı kullananlarda 2025 ve izleyen dönemlerde, özel hesap dönemlilerde 2025'te başlayan dönemden itibaren uygulanır."}, {"q": "Yerel ve küresel asgari tamamlayıcı KV'nin kapsamına girmek için nihai ana işletmenin konsolide hasılatının hangi koşulu sağlaması gerekir?", "o": ["Önceki dört hesap döneminin en az ikisinde 750 milyon avroyu aşması", "Son yılda 750 milyon avroyu aşması", "Önceki üç hesap döneminin tamamında 500 milyon avroyu aşması", "Önceki dört hesap döneminin en az birinde 750 milyon doları aşması", "Cari dönem dahil iki dönemde 750 milyon avroyu aşması"], "a": 0, "e": "Gelirin raporlandığı dönemden önceki dört hesap döneminin en az ikisinde 750 milyon avro karşılığı TL aşılmalıdır; cari dönem hasılatı hesaba katılmaz."}, {"q": "Konsolide hasılatı sırasıyla 2022'de 700, 2023'te 780, 2024'te 720 ve 2025'te 760 milyon avro olan çok uluslu bir grup 2026 hesap dönemi için yerel ve küresel asgari tamamlayıcı KV kapsamında mıdır?", "o": ["Hayır, son yıl 750'yi aşmadığı için", "Hayır, dört dönemin ortalaması 750'nin altında olduğu için", "Evet, ancak yalnızca 2027'den itibaren", "Hayır, çünkü üst üste iki yıl aşım yok", "Evet, önceki dört dönemin en az ikisinde sınır aşıldığı için"], "a": 4, "e": "2023 ve 2025'te 750 milyon avro aşılmıştır; ardışık olma veya ortalama şartı yoktur, dört dönemin en az ikisinde aşım yeterlidir."}, {"q": "Yerel ve küresel asgari tamamlayıcı KV düzenlemesine göre hangisi yanlıştır?", "o": ["Emeklilik yatırım fonları muaftır", "Muafların hasılatı konsolide hasılat sınırının hesabına dahil edilir", "Kamu niteliğindeki varlık fonları nihai ana işletme sayılır", "Muafiyetten vazgeçen işletme en az beş hesap dönemi vazgeçmiş sayılır", "Uluslararası deniz taşımacılığı kazançları istisnadır"], "a": 2, "e": "Kamu kurum ve kuruluşu niteliğindeki varlık fonları nihai ana işletme sayılmaz."}, {"q": "Asgari tamamlayıcı KV uygulamasında 'kısmen sahip olunan ana işletme' tanımı için mülkiyet payının ne kadarından fazlasının grup dışındaki kişilerde olması gerekir?", "o": ["%10", "%20", "%25", "%50", "%5"], "a": 1, "e": "Mülkiyet payının %20'den fazlası çok uluslu grubun bağlı işletmesi olmayan kişilerce tutulan bağlı işletme kısmen sahip olunan ana işletmedir."}, {"q": "Uluslararası deniz taşımacılığıyla bağlantılı faaliyet kazançlarının asgari tamamlayıcı KV'den istisna olması için bu kazançlar, uluslararası deniz taşımacılığı kazançlarının en fazla yüzde kaçı olabilir?", "o": ["%10", "%25", "%75", "%50", "%100"], "a": 3, "e": "Bağlantılı faaliyet kazançları, uluslararası deniz taşımacılığı kazançları toplamının %50'sini geçmemek şartıyla istisnadır."}, {"q": "Vergiye uyumlu mükellef indiriminden aşağıdakilerden hangisi yararlanabilir?", "o": ["Şartları sağlayan dar mükellef bir sanayi kurumu", "Bir banka", "Bir sigorta şirketi", "Bir emeklilik yatırım fonu", "Bir reasürans şirketi"], "a": 0, "e": "Tam veya dar mükellef ayrımı yoktur; finans ve bankacılık, sigorta ve reasürans, emeklilik şirketleri ve emeklilik yatırım fonları ise yararlanamaz."}, {"q": "Hesaplanan KV'si 2.000.000 TL olan uyumlu mükellefin indirim tutarı ne kadardır ve ödenecek vergisi 60.000 TL ise kalan tutar ne olur?", "o": ["100.000 TL; kalan 40.000 TL nakden iade edilir", "200.000 TL; kalan 140.000 TL süresiz devredilir", "100.000 TL; kalan 40.000 TL kaybedilir", "60.000 TL; kalan oluşmaz", "100.000 TL; kalan 40.000 TL bir tam yıl içinde diğer vergilerden mahsup edilir"], "a": 4, "e": "İndirim 2.000.000 x %5 = 100.000 TL. Ödenecek vergiyi aşan 40.000 TL, beyanname süresini izleyen bir tam yıl içinde diğer beyana dayalı vergilerden mahsup edilir; mahsup edilemezse iade edilmez."}, {"q": "2026'dan itibaren verilecek beyannamelerde hesaplanan KV'si 300.000.000 TL olan uyumlu mükellefin yararlanabileceği indirim kaç TL'dir?", "o": ["15.000.000", "10.000.000", "12.000.000", "3.000.000", "6.000.000"], "a": 2, "e": "%5 hesabı 15.000.000 TL çıkar; ancak indirim 01.01.2026'dan itibaren 12.000.000 TL'yi aşamaz."}, {"q": "Vergiye uyumlu mükellef indiriminin şartlarıyla ilgili hangisi yanlıştır?", "o": ["İndirim yılı ve önceki son iki yılın beyannameleri kanuni süresinde verilmiş olmalıdır", "Şartların sonradan sağlanmadığı anlaşılırsa vergi, vergi ziyaı cezasıyla birlikte tarh edilir", "Süresinde verilen beyannameye ilişkin pişmanlıkla verilen düzeltme beyannamesi şartı ihlal etmez", "1.000 TL'nin üzerinde vadesi geçmiş borç bulunmamalıdır", "Kesinleşen tarhiyat yıllık indirim sınırının %1'ini aşmıyorsa şart ihlal edilmiş sayılmaz"], "a": 1, "e": "Şartların taşınmadığının sonradan tespitinde ödenmeyen vergiler vergi ziyaı cezası uygulanmaksızın tarh edilir."}, {"q": "Varlık barışı kapsamında yurt dışındaki varlıkların bildirimi için son tarih ve bildirimden sonra Türkiye'ye transfer süresi hangisidir?", "o": ["31.12.2026 – 1 ay", "31.07.2027 – 3 ay", "30.06.2027 – 2 ay", "31.07.2027 – 2 ay", "31.12.2027 – 6 ay"], "a": 3, "e": "Varlıklar 31.07.2027'ye kadar bildirilir ve bildirimden itibaren iki ay içinde Türkiye'deki hesaplara transfer edilmeli veya getirilip yatırılmalıdır."}, {"q": "2026'da 10.000.000 TL değerindeki yurt dışı varlığını bildiren ve en az 3 yıl vadeli hesapta tutmayı taahhüt eden kişiden tahsil edilecek vergi kaç TL'dir?", "o": ["200.000", "500.000", "300.000", "100.000", "0"], "a": 0, "e": "En az üç yıl taahhüdünde oran %2'dir: 10.000.000 x %2 = 200.000 TL."}, {"q": "Mart 2027'de 10.000.000 TL değerindeki yurt dışı varlığını bildiren ve en az 3 yıl vadeli hesapta tutmayı taahhüt eden kişiden tahsil edilecek vergi kaç TL'dir?", "o": ["200.000", "300.000", "550.000", "220.000", "250.000"], "a": 4, "e": "01.01.2027–31.07.2027 arası bildirimlerde taahhüde bağlı oranlar yarım puan artırılır: %2,5 x 10.000.000 = 250.000 TL."}, {"q": "Şubat 2027'de 4.000.000 TL tutarında varlık bildiren ve varlığı en az 5 yıl vadeli hesapta tutmayı taahhüt eden mükellefin ödeyeceği vergi kaç TL'dir?", "o": ["0", "40.000", "20.000", "200.000", "220.000"], "a": 2, "e": "5 yıl taahhütte oran %0'dır; 2027 bildirimlerinde yarım puan eklenerek %0,5 olur: 4.000.000 x %0,5 = 20.000 TL."}, {"q": "Varlık barışında banka ve aracı kurumların tahsil ettikleri vergiyi beyan edip ödeme süresi hangisidir?", "o": ["Bildirim günü", "Bildirimi izleyen ayın 15'inci günü akşamına kadar", "Bildirimi izleyen ayın 26'sına kadar", "Bildirimden itibaren 2 ay içinde", "Yıllık beyanname ile"], "a": 1, "e": "Banka ve aracı kurumlar %5 (veya indirimli) vergiyi bildirimi izleyen ayın on beşinci günü akşamına kadar vergi sorumlusu sıfatıyla beyan eder ve öder."}, {"q": "Varlık barışından yararlanan bir kurumda başka nedenle başlayan incelemede bildirilen varlıktan kaynaklandığı tespit edilen 3.000.000 TL matrah farkı bulunmuştur. Bildirilen varlık 2.000.000 TL ise tarhiyat hangi tutar üzerinden yapılır?", "o": ["0", "2.000.000", "3.000.000", "1.000.000", "5.000.000"], "a": 3, "e": "Matrah farkı bildirilen varlıktan büyükse yalnız aradaki fark (3.000.000 - 2.000.000 = 1.000.000 TL) üzerinden tarhiyat yapılır."}]}, {"id": 6, "kisa": "Gelir Türleri: MSİ ve DAK", "baslik": "Sermaye Piyasası Araçları, Gelirlerin Sınıflandırılması, Menkul Sermaye İratları ve Değer Artışı Kazançları", "ozet": "Finansal araçlardan doğan gelirin kâr payı/faiz (MSİ) mi alım-satım kazancı (DAK) mı olduğunu, olağan rejimde nasıl hesaplandığını ve Geçici 67 ile kurulan ikili rejimi özetler.", "notlar": "\n<h3>Sermaye piyasası aracı ve menkul kıymet<\/h3>\n<ul>\n<li><b>Sermaye piyasası araçları (SPKn m.3/ş):<\/b> menkul kıymetler, türev araçlar ve yatırım sözleşmeleri dahil, Kurulca bu kapsamda olduğu belirlenen araçlar.<\/li>\n<li>Eski (2499 sayılı) Kanundaki <b>menkul kıymet<\/b> tanımı: ortaklık veya alacaklılık sağlayan, belli bir meblağı temsil eden, yatırım aracı olarak kullanılan, dönemsel gelir getiren, misli nitelikte, seri halinde çıkarılan, ibareleri aynı kıymetli evrak. Bu tanımdan <b>6 özellik<\/b> çıkar:\n<ol><li>Ortaklık veya alacaklılık hakkı sağlar.<\/li><li>Belli bir meblağı temsil eder.<\/li><li>Yatırım aracıdır.<\/li><li>Dönemsel (yıllık, altı aylık vb.) gelir getirir.<\/li><li>Misli niteliktedir (belli bedel veya katları kupürler).<\/li><li>Seri halinde çıkarılır, üzerindeki ifadeler aynıdır.<\/li><\/ol><\/li>\n<li><b>6362 sayılı SPKn'deki tanım:<\/b> para, çek, poliçe ve bono <b>hariç<\/b>; (1) paylar, pay benzeri kıymetler ve bunlara ilişkin depo sertifikaları, (2) borçlanma araçları veya menkul kıymetleştirilmiş varlık/gelire dayalı borçlanma araçları ve bunlara ilişkin depo sertifikaları. Tanım genişletilmiştir.<\/li>\n<li><b>Diğer sermaye piyasası araçları:<\/b> menkul kıymet dışında kalan ve şartlarını Kurulun belirlediği evrak. Örnek: borsada veya teşkilatlanmış piyasada işlem gören vadeli işlem ve opsiyon sözleşmeleri, menkul kıymet niteliği taşımayan yatırım fonu katılma belgeleri.<\/li>\n<li>Menkul kıymet niteliğindeki örnekler: hisse senedi, tahvil, banka bonosu, finansman bonosu, varlığa dayalı menkul kıymet, kâr-zarar ortaklığı belgesi, BYF katılma belgesi, depo sertifikası.<\/li>\n<li>Kitap para ve sermaye piyasası araçlarının ikisini birden kapsamak için <b>\"finansal araç\"<\/b> terimini kullanır.<\/li>\n<\/ul>\n\n<h3>Gelirlerin sınıflandırılması<\/h3>\n<ul>\n<li>Gerçek kişiler finansal araçlardan iki tür gelir elde eder: <b>menkul sermaye iradı (MSİ)<\/b> = faiz/kâr payı; <b>değer artışı kazancı (DAK)<\/b> = alım-satım kazancı. DAK, \"diğer kazanç ve iratlar\" içinde yer alır.<\/li>\n<li><b>Ticari faaliyet kapsamında<\/b> yapılan işlemler: kazanç <b>ticari kazançtır<\/b>. GVK m.37: kendi nam ve hesabına menkul kıymet alım-satımıyla <b>devamlı<\/b> uğraşanların kazancı ticari kazançtır. Bu durumda MSİ/DAK hükümleri, istisnalar, süre ve şartlar uygulanmaz.<\/li>\n<li>Kurumlar vergisi mükelleflerinin bu kazançları <b>kurum kazancıdır<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Finansal araç<\/th><th>MSİ (faiz/kâr payı)<\/th><th>DAK (alım-satım kazancı)<\/th><\/tr>\n<tr><td>Hisse senedi<\/td><td>Kâr payı<\/td><td>Var<\/td><\/tr>\n<tr><td>Tahvil, bono, Eurobond<\/td><td>Faiz<\/td><td>Var<\/td><\/tr>\n<tr><td>MKYF katılma belgesi<\/td><td>Kâr payı<\/td><td>-<\/td><\/tr>\n<tr><td>BYF katılma payı<\/td><td>Kâr payı<\/td><td>Var<\/td><\/tr>\n<tr><td>Ters repo<\/td><td>Faiz<\/td><td>-<\/td><\/tr>\n<tr><td>Mevduat / borsa para piyasası<\/td><td>Faiz<\/td><td>-<\/td><\/tr>\n<\/table>\n<ul><li>Eurobond = Hazine tarafından yurt dışında ihraç edilen menkul kıymetler.<\/li><\/ul>\n\n<h3>Menkul sermaye iradı (MSİ)<\/h3>\n<ul>\n<li><b>Tanım (GVK m.75):<\/b> sahibinin ticari, zirai veya mesleki faaliyeti <b>dışında<\/b> nakdi sermaye veya para ile temsil edilen değerlerden oluşan sermaye dolayısıyla elde ettiği kâr payı, kira ve benzeri iratlar. MSİ, GVK'daki <b>yedi gelir unsurundan<\/b> biridir.<\/li>\n<li>Kaynağına bakılmaksızın MSİ sayılanlar:\n<ul><li>Her tür hisse senedi kâr payları;<\/li><li>her tür tahvil ve Hazine bonosu faizleri;<\/li><li>mevduat faizleri;<\/li><li>hisse senedi ve tahvillerin <b>vadesi gelmemiş kuponlarının<\/b> satışından doğan gelir;<\/li><li>faizsiz kredi verenlere ödenen kâr payları, <b>KZOB<\/b> karşılığı kâr payları, katılım bankalarının katılma hesabı kâr payları;<\/li><li>tahvil/Hazine bonosunun geri alım veya satım taahhüdüyle elde edilmesi ya da elden çıkarılmasından doğan gelir (<b>repo<\/b>);<\/li><li>bunlar dışında SPKn'ye göre ihraç edilen her türlü sermaye piyasası aracından elde edilen gelirler.<\/li><\/ul><\/li>\n<li><b>Vergilendirme sırası:<\/b> (1) vergiye tabi irat tutarını bul, irat sayılmayanları ayıkla; (2) indirimleri yap (indirim oranı + indirilecek giderler); (3) kalan tutar <b>beyan sınırını<\/b> aşıyorsa beyannameye al ve GV tarifesini uygula.<\/li>\n<\/ul>\n<h4>İrat sayılmayan haller (GVK m.76/1)<\/h4>\n<ul>\n<li>Menkul kıymetlerin <b>kuponlu veya kuponsuz satılması<\/b>, iştirak hisselerinin devir ve temliki, menkul kıymet ve iştirak hisselerinin tamamen veya kısmen <b>itfası<\/b> karşılığı alınan paralar ve itfa dolayısıyla verilen <b>ikramiyeler<\/b> MSİ sayılmaz.<\/li>\n<li>Dikkat: Kuponun <b>tek başına<\/b> (vadesi gelmeden) satışı MSİ'dir; menkul kıymetin kuponuyla birlikte satışı MSİ değildir (DAK konusudur).<\/li>\n<\/ul>\n<h4>İndirim oranı<\/h4>\n<ul>\n<li>Enflasyonun nominal gelirdeki şişirici etkisini gidermek için konmuştu (m.76/2). <b>5281 sayılı Kanunla 01.01.2006'dan itibaren kaldırıldı.<\/b><\/li>\n<li>Geçici 67 uyarınca 01.01.2006'dan <b>önce ihraç<\/b> edilmiş tahvil ve Hazine bonoları ile TKKOİ menkul kıymetlerinde 31.12.2005 hükümleri geçerli olduğundan, indirim oranı bugün yalnızca bunlarda (döviz cinsinden veya dövize, altına ya da başka bir değere <b>endeksli olmayanlarda<\/b>) uygulanabilir.<\/li>\n<li>Hesap: VUK'a göre o yıl için belirlenen <b>yeniden değerleme oranı / aynı dönemde DT ve HB ihalelerinde oluşan bileşik ortalama faiz oranı<\/b>. Hazine ve Maliye Bakanlığı tespit edip yayımlar.<\/li>\n<li>Oran 1'den büyükse (ör. 2011) bu gelirler hiç beyan edilmez.<\/li>\n<\/ul>\n<h4>İndirilecek giderler (GVK m.78)<\/h4>\n<ul>\n<li>Muhafaza giderleri: depo etme ve sigorta ücretleri (kiralık kasa kirası ve sigortası).<\/li>\n<li>Temettü ve faizlerin <b>tahsil giderleri<\/b> (tahsil sırasında aracı kuruma ödenen masraf; genel kurula katılma giderleri değil).<\/li>\n<li>Menkul kıymet ve iratları için ödenen her türlü vergi, resim ve harç. Dikkat: <b>kâr payı üzerinden kesilen stopaj gider olarak indirilemez<\/b> (hesaplanan vergiden mahsup edilir).<\/li>\n<\/ul>\n<table>\n<tr><th>Adım<\/th><th>Kalem<\/th><\/tr>\n<tr><td>A<\/td><td>MSİ brüt tutarı<\/td><\/tr>\n<tr><td>B<\/td><td>(-) Giderler<\/td><\/tr>\n<tr><td>C = A - B<\/td><td>Gider sonrası brüt MSİ<\/td><\/tr>\n<tr><td>D<\/td><td>(-) İndirim oranı uygulaması (yalnızca 2006 öncesi ihraçlı, endekssiz TL tahvil/bono)<\/td><\/tr>\n<tr><td>E<\/td><td>Vergilendirilecek MSİ<\/td><\/tr>\n<\/table>\n<ul>\n<li>Geçici 67 kapsamındaki MSİ'lerde: %0, %10, %15 gibi stopaj bazı mükellefler için <b>nihai<\/b> vergidir, beyanname yoktur, indirim oranı yoktur, indirilebilecek giderler de farklıdır.<\/li>\n<\/ul>\n\n<h3>Değer artışı kazancı (DAK)<\/h3>\n<ul>\n<li>GVK <b>mükerrer m.80<\/b>: menkul kıymetlerin ve diğer sermaye piyasası araçlarının <b>elden çıkarılmasından<\/b> doğan kazançlar DAK'tır. Uygulamada \"alım-satım kazancı\" denir; yedinci gelir unsuru olan \"diğer kazanç ve iratlar\" içindedir.<\/li>\n<li><b>Vergilendirme sırası:<\/b> kazancı tespit et (kazanç sayılmayanları ayıkla) → indirimler (ÜFE endekslemesi + giderler) → <b>istisna<\/b> → kalanı beyan et, GV tarifesini uygula.<\/li>\n<\/ul>\n<h4>Elden çıkarma sayılan işlemler<\/h4>\n<ol>\n<li>Satılması<\/li><li>Bir ivaz karşılığında devir ve temliki<\/li><li>Trampa edilmesi<\/li><li>Takası<\/li><li>Kamulaştırılması<\/li><li>Devletleştirilmesi<\/li><li>Ticaret şirketlerine sermaye olarak konulması<\/li>\n<\/ol>\n<ul><li>Dikkat: Miras veya bağış gibi <b>ivazsız<\/b> intikaller elden çıkarma listesinde yoktur.<\/li><\/ul>\n<h4>Kazancın tespiti<\/h4>\n<ul>\n<li><b>DAK = elden çıkarma karşılığı alınan para, ayın ve para ile temsil edilen menfaatler - maliyet bedeli - satıcının üzerinde kalan elden çıkarma giderleri (komisyon, kurtaj) - ödenen vergi ve harçlar.<\/b><\/li>\n<li><b>ÜFE endekslemesi:<\/b> maliyet bedeli, <b>elden çıkarıldığı ay hariç<\/b> olmak üzere TÜİK aylık ÜFE ile artırılır. <b>31.12.2005'ten sonra ihraç<\/b> edilenlerde endeksleme için artışın <b>%10 veya üzerinde<\/b> olması şarttır. Amaç: enflasyonun yarattığı fiktif değer artışını vergilememek.<\/li>\n<li>Örnek: 200.000 TL'ye alınan kıymet 260.000 TL'ye satılsın, satış komisyonu 2.000 TL, ÜFE artışı %15 → endeksli maliyet 230.000; DAK = 260.000 - 230.000 - 2.000 = <b>28.000 TL<\/b>. ÜFE artışı %8 olsaydı endeksleme yapılmaz: DAK = 58.000 TL.<\/li>\n<\/ul>\n<h4>Zarar mahsubu<\/h4>\n<ul>\n<li>Beyan edilen gelir unsurlarından birinin zararı diğerlerinin kazancından mahsup edilebilir. <b>Tek istisna: diğer kazanç ve iratlar.<\/b> Bu unsurda doğan zarar diğer gelir unsurlarına mahsup edilemez.<\/li>\n<li>DAK'ın <b>kendi içinde<\/b> mahsup mümkündür: A hissesinden kâr, B tahvilinden zarar varsa netleştirilir. Kalan zarar kâr payına (MSİ) veya faiz gelirine mahsup edilemez.<\/li>\n<li>Geçici 67 kapsamında zarar mahsubu sistemi önemli ölçüde değişmiştir (üç aylık dönem, aynı tür menkul kıymet).<\/li>\n<\/ul>\n<h4>Geçici 67 kapsamındaki DAK<\/h4>\n<ul>\n<li>01.01.2006'dan itibaren yürürlükte, <b>31.12.2030'a kadar<\/b> geçerli (Dikkat: kitap 2.3.6'da çelişkili olarak 31.12.2016 ve '2025'e kadar' der; güncel 10680 sayılı CK esas). Bu rejimde stopaj bazı mükellefler için nihaidir, beyanname yoktur, <b>ÜFE endekslemesi yoktur<\/b>, zarar mahsubu ve indirilebilecek giderler farklıdır.<\/li>\n<\/ul>\n\n<h3>Uygulanacak vergileme rejimi: ikili sistem<\/h3>\n<ul>\n<li>Geçici 67'nin amacı finansal araç gelirlerinin vergilendirilmesini <b>basitleştirmek<\/b>; birçok mükellef için stopaj nihai vergidir. İşleme aracılık eden <b>banka ve aracı kurumlar<\/b> stopajdan vergi idaresine karşı sorumludur.<\/li>\n<li>Geçici 67 her araç ve her gelir için değil, kapsamı kanun ve tebliğle çizilmiş durumlar için geçerlidir. Dışında kalanlara GVK/KVK'nın <b>olağan<\/b> hükümleri uygulanır. Böylece 01.01.2006 - 31.12.2030 arasında iki rejim birlikte yürür.<\/li>\n<\/ul>\n<table>\n<tr><th>Olağan rejim<\/th><th>Geçici 67 rejimi<\/th><\/tr>\n<tr><td>Geçici 67 kapsamına girmeyen kazançlar<\/td><td>Yalnızca belli araçlar ve belli işlemler<\/td><\/tr>\n<tr><td>Beyan usulü<\/td><td>Stopaj nihai vergi<\/td><\/tr>\n<tr><td>Artan oranlı tarife<\/td><td>Ticari faaliyet dışındaysa beyanname yok<\/td><\/tr>\n<tr><td>ÜFE endekslemesi, indirim oranı, istisna<\/td><td>Endeksleme ve indirim oranı yok<\/td><\/tr>\n<\/table>\n<ul>\n<li>Dikkat: Kitapta Geçici 67'nin MSİ bölümünde \"31.12.2016'ya kadar\" ve \"2025'e kadar\" ifadeleri de geçer; rejimin genel süresi için kitabın 2.4.7 ve 2.5 başlıklarındaki <b>31.12.2030<\/b> esas alınmalıdır.<\/li>\n<\/ul>\n", "sorular": [{"q": "6362 sayılı SPKn'ye göre aşağıdakilerden hangisi menkul kıymet tanımının dışında bırakılmıştır?", "o": ["Paylara ilişkin depo sertifikaları", "Çek", "Pay benzeri kıymetler", "Menkul kıymetleştirilmiş varlığa dayalı borçlanma araçları", "Borçlanma araçları"], "a": 1, "e": "Kanun para, çek, poliçe ve bonoyu menkul kıymet tanımı dışında tutar; diğerleri tanımın içindedir."}, {"q": "Eski SPKn'deki menkul kıymet tanımından çıkan altı özellik arasında aşağıdakilerden hangisi yoktur?", "o": ["Belli bir meblağı temsil etme", "Misli nitelikte ihraç edilme", "Dönemsel gelir getirme", "Seri halinde çıkarılma", "Borsada işlem görme zorunluluğu"], "a": 4, "e": "Altı özellik: ortaklık/alacaklılık hakkı, belli meblağ, yatırım aracı, dönemsel gelir, misli nitelik, seri halinde ve aynı ibarelerle çıkarılma. Borsada işlem görme şartı yoktur."}, {"q": "Aşağıdakilerden hangisi kitapta 'diğer sermaye piyasası aracı' örneği olarak verilmiştir?", "o": ["Hisse senedi", "Finansman bonosu", "Borsada işlem gören vadeli işlem ve opsiyon sözleşmeleri", "Kâr ve zarar ortaklığı belgesi", "Varlığa dayalı menkul kıymet"], "a": 2, "e": "Vadeli işlem ve opsiyon sözleşmeleri ile menkul kıymet niteliği taşımayan fon katılma belgeleri diğer sermaye piyasası aracıdır; diğer şıklar menkul kıymettir."}, {"q": "Kendi nam ve hesabına menkul kıymet alım-satımıyla devamlı olarak uğraşan bir gerçek kişinin bu faaliyetten elde ettiği kazanç hangi gelir unsurunda vergilendirilir?", "o": ["Ticari kazanç", "Değer artışı kazancı", "Menkul sermaye iradı", "Arızi kazanç", "Serbest meslek kazancı"], "a": 0, "e": "GVK m.37'ye göre devamlılık arz eden alım-satım ticari kazançtır; MSİ ve DAK hükümleri ile istisnaları uygulanmaz."}, {"q": "Aşağıdaki gelirlerden hangisi GVK m.76/1 uyarınca menkul sermaye iradı sayılmaz?", "o": ["Hisse senedi kâr payı", "Tahvilin vadesi gelmemiş kuponunun tek başına satışından elde edilen gelir", "Katılım bankasının katılma hesabına ödediği kâr payı", "Tahvilin kuponuyla birlikte satışından elde edilen bedel", "Ters repo geliri"], "a": 3, "e": "Menkul kıymetin kuponlu veya kuponsuz satılması MSİ sayılmaz, DAK konusudur. Vadesi gelmemiş kuponun ayrı satışı ise açıkça MSİ sayılmıştır."}, {"q": "Menkul kıymetin itfası dolayısıyla verilen ikramiye vergi açısından nasıl nitelendirilir?", "o": ["Menkul sermaye iradıdır", "Menkul sermaye iradı sayılmaz", "Değer artışı kazancıdır", "Ticari kazançtır", "Arızi kazanç olarak beyan edilir"], "a": 1, "e": "GVK m.76/1: itfa karşılığı alınan paralar ve itfa dolayısıyla verilen ikramiyeler MSİ sayılmaz."}, {"q": "İndirim oranı uygulamasıyla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Tüm tahvil faizlerine uygulanmaya devam eder", "Eurobond faizlerinde uygulanır", "Yeniden değerleme oranının ÜFE'ye bölünmesiyle bulunur", "SPK tarafından her yıl ilan edilir", "Bugün yalnızca 01.01.2006'dan önce ihraç edilmiş, dövize veya başka bir değere endeksli olmayan tahvil, bono ve TKKOİ menkul kıymetlerinin gelirlerinde uygulanabilir"], "a": 4, "e": "5281 sayılı Kanunla 01.01.2006'dan itibaren kaldırılmış; Geçici 67 gereği yalnızca 2006 öncesi ihraçlı, endekssiz TL kıymetlerde 31.12.2005 hükümleriyle yaşamaktadır."}, {"q": "İndirim oranı nasıl hesaplanır?", "o": ["ÜFE artış oranının TÜFE artış oranına bölünmesiyle", "Politika faizinin enflasyona bölünmesiyle", "Yeniden değerleme oranının, aynı dönemde DT ve HB ihalelerinde oluşan bileşik ortalama faiz oranına bölünmesiyle", "Yeniden değerleme oranının mevduat faizine bölünmesiyle", "Bileşik faizin yeniden değerleme oranına bölünmesiyle"], "a": 2, "e": "Oran, VUK'a göre o yıl için tespit edilen yeniden değerleme oranı / DT ve HB ihalelerindeki bileşik ortalama faiz oranı olarak Hazine ve Maliye Bakanlığınca belirlenir."}, {"q": "2005 yılında döviz cinsinden ihraç edilmiş bir tahvilden 40.000 TL faiz elde eden kişi, kıymetleri için 1.000 TL kiralık kasa kirası ve faizin tahsili sırasında aracı kuruma 400 TL masraf ödemiştir. Vergilendirilecek MSİ kaç TL'dir?", "o": ["38.600 TL", "40.000 TL", "39.000 TL", "39.600 TL", "34.740 TL"], "a": 0, "e": "Muhafaza (kasa) ve tahsil giderleri indirilir: 40.000 - 1.000 - 400 = 38.600. Döviz cinsinden olduğu için indirim oranı uygulanmaz."}, {"q": "GVK m.78'e göre aşağıdakilerden hangisi menkul sermaye iradından indirilemez?", "o": ["Kiralık kasa kirası", "Kasa için yaptırılan sigorta bedeli", "Temettünün tahsili için aracı kuruma ödenen masraf", "Kâr payı üzerinden kesilen stopaj", "Menkul kıymet için ödenen harç"], "a": 3, "e": "Muhafaza giderleri, tahsil giderleri ve vergi-resim-harçlar indirilir; ancak kâr payından kesilen stopaj gider olarak indirilemez, hesaplanan vergiden mahsup edilir."}, {"q": "Aşağıdakilerden hangisi GVK'da 'elden çıkarma' olarak sayılan işlemlerden değildir?", "o": ["Trampa", "Mirasçılara intikal", "Kamulaştırma", "Ticaret şirketine sermaye olarak konulması", "İvaz karşılığı devir ve temlik"], "a": 1, "e": "Elden çıkarma: satış, ivazlı devir, trampa, takas, kamulaştırma, devletleştirme, sermaye olarak konulma. Miras ivazsız intikaldir."}, {"q": "Olağan rejime tabi, 31.12.2005'ten sonra ihraç edilmiş bir menkul kıymet 200.000 TL'ye alınıp 260.000 TL'ye satılmış, satışta 2.000 TL komisyon ödenmiştir. Elden çıkarıldığı ay hariç ÜFE artışı %15'tir. DAK kaç TL'dir?", "o": ["58.000 TL", "30.000 TL", "26.000 TL", "31.000 TL", "28.000 TL"], "a": 4, "e": "Artış %10'u aştığı için maliyet 200.000 x 1,15 = 230.000 olur. DAK = 260.000 - 230.000 - 2.000 = 28.000 TL."}, {"q": "31.12.2005 sonrası ihraç edilmiş bir menkul kı
