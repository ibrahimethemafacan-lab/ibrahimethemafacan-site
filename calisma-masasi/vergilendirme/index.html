edir?", "o": ["20 TL; alıcının maliyeti 21,5 TL'dir", "21,5 TL; alıcının maliyeti 20 TL'dir", "21,5 TL; alıcının maliyeti de 21,5 TL'dir", "22 TL; alıcının maliyeti 22 TL'dir", "20 TL; alıcının maliyeti 20 TL'dir"], "a": 2, "e": "Fiyat %10 marj içinde olduğundan kabul edilir ve satan müşterinin bildirdiği fiyat alıcı için de maliyettir."}, {"q": "Geçici 67/1 kapsamında gelirleri üzerinden tevkifat yapılmayacak olanlar hangisinde birlikte verilmiştir?", "o": ["Borsa yatırım fonları ve emeklilik yatırım fonları", "Dar mükellef kurumlar ve vakıflar", "Vergiden muaf kurumlar ve dernekler", "Sermaye şirketleri ve kooperatifler", "Bankalar ve sigorta şirketleri"], "a": 0, "e": "SPKn'ye göre kurulan BYF ve EYF dışındaki herkes kapsamdadır; muafiyet, istisna, tam/dar mükellefiyet önemsizdir."}, {"q": "Aşağıdaki gelirlerden hangisi Geçici 67/1 kapsamında tevkifata tabidir?", "o": ["Eurobond alım-satım kazancı", "Hisse senedi kâr payı", "2005'te ihraç edilmiş devlet tahvilinin faizi", "Ödünç verilen hisseye ilişkin ödünç alanın ödediği temettü telafi tazminatı", "2004'te edinilmiş hissenin satış kazancı"], "a": 3, "e": "Temettü ödemesi kapsam dışı olsa da telafi tazminatı ödünç verenin lehine kalan gelir olduğundan tevkifata tabidir. Diğerleri fıkra 1, 9 ve 10 ile kapsam dışıdır."}, {"q": "Değişken bir fonda portföyün %51'inin BİST hisselerinden oluşması şartı Takasbank'ın günlük verilerine göre ihlal edilirse ne olur?", "o": ["Fon tasfiye edilir", "Ertesi günden itibaren katılma belgelerinin elden çıkarılmasından elde edilen gelirler tevkifata tabi olur", "İhlal gününden geriye dönük 1 yıl için tevkifat yapılır", "Ancak yıl sonunda tevkifat yapılır", "Tevkifat yapılmaz, yatırımcı beyanname verir"], "a": 1, "e": "İhlal durumunda ertesi günden itibaren tevkifat yapılır; Takasbank'ın sorumluluğu gelen bilgi-belge ile sınırlıdır."}, {"q": "Bir bankanın Nisan, Mayıs ve Haziran aylarında Geçici 67 kapsamında yaptığı tevkifatlar en geç hangi gün akşamına kadar ödenir?", "o": ["20 Temmuz akşamına kadar", "31 Temmuz akşamına kadar", "26 Haziran akşamına kadar", "28 Temmuz akşamına kadar", "26 Temmuz akşamına kadar"], "a": 4, "e": "Ödeme, üç aylık dönemi izleyen ayın 26'sı akşamına kadardır. Dikkat: beyan günü kitapta çelişkilidir (2.8'de 26, 2.12'de 20); ödeme günü her iki bölümde 26'dır."}, {"q": "Yurt dışında yerleşik yatırımcılar için saklama hizmeti veren kuruluşlarca takvim yılının ilk üç aylık döneminde yapılan tevkifat ne zaman beyan edilir?", "o": ["Nisan ayının 26'sı akşamına kadar", "Mayıs ayının 26'sı akşamına kadar", "Haziran ayının 26'sı akşamına kadar", "Mart ayının son günü", "Temmuz ayının 26'sı akşamına kadar"], "a": 2, "e": "Bu tevkifatlar ilk üç aylık döneme münhasır olarak Haziran'ın 26'sına kadar beyan edilip ödenir."}, {"q": "Banka ve aracı kurumların Hazine ve Maliye Bakanlığına bildirim yapması gereken hallerden biri aşağıdakilerden hangisidir?", "o": ["Menkul kıymetin sahibi tarafından fiziken teslim alınması", "Hisse senedinin borsada satılması", "Kâr payı ödenmesi", "Tevkifata tabi tutulmuş mülkiyet devri virmanı", "Fon katılma payının fona iadesi"], "a": 0, "e": "Bildirim; başka kişi adına nakil, fiziken teslim alma ve fiziken teslim etme hallerinde yapılır. Tevkifata tabi tutulan mülkiyet devri virmanları ayrıca bildirilmez."}, {"q": "Bir yatırımcının aynı çeyrekte aynı aracı kurumda yaptığı tahvil alım-satımlarının sonuçları +40.000 TL, -15.000 TL ve +5.000 TL'dir. Kârlı işlemlerde işlem bazında %10 tevkifat kesilmiştir. Dönem sonunda müşterinin hesabına aktarılacak fazla vergi kaç TL'dir?", "o": ["3.000 TL", "4.500 TL", "0 TL", "1.500 TL", "2.000 TL"], "a": 3, "e": "Kesilen: 45.000 x %10 = 4.500. Konsolide kazanç 30.000 x %10 = 3.000. Fazla kesilen 1.500 TL müşteriye aktarılır."}, {"q": "Aynı çeyrekte bir yatırımcının sonuçları: hisseler +17.000 TL (net), MKYO hisseleri +5.000 TL, devlet tahvili -15.000 TL. Hangisi doğrudur?", "o": ["Tahvil zararı hisse kârına mahsup edilir, vergi doğmaz", "Tahvil zararı hisse ve MKYO kârlarına mahsup edilemez; MKYO kârından 500 TL tevkifat yapılır", "Hisse ve MKYO kârları birleştirilir, 2.200 TL tevkifat yapılır", "Tahvil zararı MKYO kârına mahsup edilir", "Tüm sonuçlar netleşir ve 7.000 TL üzerinden %10 tevkifat yapılır"], "a": 1, "e": "Sabit getirili, değişken getirili ve fon/YO sınıfları farklı türdür. Hisselerde oran %0, MKYO'da 5.000 x %10 = 500 TL. Tahvil zararı yıl içinde sonraki tahvil kazancına devreder."}, {"q": "Geçici 67 kapsamında takvim yılının son üç aylık döneminde oluşan alım-satım zararı için hangisi doğrudur?", "o": ["İzleyen yılın ilk çeyreğine aktarılır", "5 yıl boyunca devreder", "Diğer gelir unsurlarına mahsup edilir", "Bir sonraki yılın kazancına mahsup edilmek üzere bankaca saklanır", "İzleyen döneme aktarılamaz"], "a": 4, "e": "Zarar izleyen çeyreğe yalnızca takvim yılını aşmamak kaydıyla devreder; son çeyrekteki zarar aktarılamaz."}, {"q": "Geçici 67 zarar mahsubunda 'aynı tür' sınıflandırması için hangisi yanlıştır?", "o": ["Değişken faizli tahviller sabit getirili sınıftadır", "Yatırım fonu katılma belgeleri ayrı bir sınıftır", "Dövize endeksli tahviller değişken getirili menkul kıymet sayılır", "Menkul kıymete bağlı olmayan türevler diğer SPA sınıfındadır", "Hisse senedine bağlı türevler hisse senedinin sınıfında değerlendirilir"], "a": 2, "e": "Endeksli olma niteliği göz ardı edilir; tahvil ve bonolar endeksli olsa da sabit getirili sınıftadır."}, {"q": "Geçici 67/11'e göre ihtiyari beyan için hangisi doğrudur?", "o": ["Yalnızca tam ve dar mükellef gerçek kişiler, yalnızca alım-satım kazançları için verebilir", "Kurumlar da verebilir", "Faiz ve itfa gelirleri de beyan edilebilir", "Mahsup edilemeyen zarar izleyen yıla devreder", "Artan oranlı GV tarifesi uygulanır"], "a": 0, "e": "İhtiyari beyan gerçek kişilere ve elden çıkarma kazançlarına özgüdür; tek oran uygulanır, zarar devredilmez."}, {"q": "Bir gerçek kişinin bir yılda yalnızca tahvil alım-satımları vardır: 1. çeyrekte 60.000 TL kâr (%10 tevkifatla 6.000 TL kesilmiş), 3. çeyrekte 40.000 TL zarar; 4. çeyrekte işlem yoktur. İhtiyari beyanda %10 oranla hesaplama yapılırsa iade edilecek tutar kaç TL'dir?", "o": ["2.000 TL", "6.000 TL", "0 TL", "4.000 TL", "1.000 TL"], "a": 3, "e": "Yıl içindeki aynı tür zararların tamamı mahsup edilir: 60.000 - 40.000 = 20.000; vergi 2.000 TL. Kesilen 6.000 TL'den mahsup sonrası 4.000 TL iade edilir."}, {"q": "Dar mükellef gerçek kişiler Geçici 67/11 kapsamındaki ihtiyari beyannamelerini hangi vergi dairesine verir?", "o": ["Ankara VDB Başkent Vergi Dairesi", "İstanbul VDB Boğaziçi Vergi Dairesi Müdürlüğü", "İşlemi yapan aracı kurumun bağlı olduğu vergi dairesi", "Büyük Mükellefler Vergi Dairesi", "İstanbul VDB Kozyatağı Vergi Dairesi"], "a": 1, "e": "Dar mükellefler ihtiyari beyanı Boğaziçi Vergi Dairesine, tam mükellefler ikametgâh vergi dairesine yapar."}, {"q": "Kitaba göre Cumhurbaşkanının Geçici 67'deki tevkifat oranlarıyla ilgili yetkisi nedir?", "o": ["%5'e kadar indirmek veya %25'e kadar artırmak", "Yalnızca sıfıra kadar indirmek", "%10'a kadar artırmak", "Yalnızca fonlar için oran belirlemek", "Sıfıra kadar indirmek veya %15'e kadar artırmak"], "a": 4, "e": "Kitap 2.12.6'da Cumhurbaşkanının oranları kazanç türü ve elde edenler itibarıyla sıfıra kadar indirebileceğini veya %15'e kadar artırabileceğini belirtir."}, {"q": "Bir yatırımcının 2026'nın ilk çeyreğinde tahvil alım-satımlarından net 30.000 TL zararı, ikinci çeyreğinde ise 50.000 TL kârı oluşmuş ve bu kârdan işlem bazında %10 oranında 5.000 TL kesilmiştir. İkinci çeyrek sonunda müşterinin hesabına aktarılacak tutar kaç TL'dir?", "o": ["2.000 TL", "5.000 TL", "3.000 TL", "0 TL", "1.500 TL"], "a": 2, "e": "Zarar takvim yılı içinde sonraki çeyreğe devreder: 50.000 - 30.000 = 20.000; vergi 2.000 TL. Fazla kesilen 3.000 TL müşteriye aktarılır."}, {"q": "Bir yatırımcının 2025'in son çeyreğinde tahvil alım-satımından 10.000 TL zararı, 2026'nın ilk çeyreğinde ise 25.000 TL tahvil alım-satım kârı vardır (oran %10). İhtiyari beyan verilmezse 2026'nın ilk çeyreğinde ödenecek tevkifat kaç TL'dir?", "o": ["2.500 TL", "1.500 TL", "1.000 TL", "0 TL", "3.500 TL"], "a": 0, "e": "Yılın son çeyreğindeki zarar izleyen döneme aktarılamaz: 25.000 x %10 = 2.500 TL."}, {"q": "Bir gerçek kişinin bir yıl içinde yalnızca MKYO hissesi alım-satımları vardır: 1. çeyrekte 30.000 TL kâr (3.000 TL kesilmiş), 4. çeyrekte 20.000 TL zarar. İhtiyari beyanda %10 oranla hesaplanan vergi ve iade tutarı nedir?", "o": ["Vergi 3.000 TL, iade yok", "Vergi 2.000 TL, iade 1.000 TL", "Vergi 0, iade 3.000 TL", "Vergi 1.000 TL, iade 2.000 TL", "Vergi 1.000 TL, iade 3.000 TL"], "a": 3, "e": "İhtiyari beyanda aynı türün yıl içindeki zararlarının tamamı mahsup edilir: 10.000 x %10 = 1.000 TL; kesilen 3.000 TL'den 2.000 TL iade edilir."}]}, {"id": 11, "kisa": "Tevkifat Matrahı Hesapları", "baslik": "Geçici 67: Tevkifat Matrahının Tespiti (FIFO, Sermaye Artırımı, Rüçhan Kuponu, Kuponlu Tahvil, Döviz, Türev, İtfa ve Diğer Haller)", "ozet": "Alım-satım, itfa, dönemsel getiri ve ödünç işlemlerinde tevkifat matrahının nasıl bulunduğunu formüller ve sayısal örneklerle verir.", "notlar": "\n<h3>Alım-satımda matrah: temel kurallar<\/h3>\n<ul>\n<li><b>Matrah = satış bedeli - alış bedeli.<\/b> Alış ve satışta ödenen <b>komisyon ve BSMV<\/b> dikkate alınır; bunlar dışında hiçbir gider indirilemez.<\/li>\n<li><b>Komisyon iadeleri:<\/b> doğduğu işleme bağlanmaz, <b>iadenin gerçekleştiği dönemin<\/b> matrahına eklenir.<\/li>\n<li>Aynı kıymetten farklı tarihlerde alınıp bir kısmı satılırsa alış bedeli <b>FİFO (ilk giren ilk çıkar)<\/b> ile bulunur. Aynı gün içindeki işlemlerde <b>AOF (ağırlıklı ortalama fiyat)<\/b> kullanılabilir ama matrah yine FİFO'ya göre belirlenir. AOF seçilip kıymetlerin tamamı gün içinde satılmazsa izleyen günlere AOF maliyeti aktarılır.<\/li>\n<li>Seçilen maliyet yöntemi, müşterinin o kurumdaki portföyü <b>tamamen elden çıkarılıncaya kadar değiştirilemez<\/b>.<\/li>\n<li>Maliyet yöntemleri yalnızca <b>01.01.2006'dan sonra iktisap<\/b> edilenlere uygulanır; 31.12.2005 öncesi iktisap edilenler hesaba katılmaz, onlara 31.12.2005 hükümleri uygulanır.<\/li>\n<\/ul>\n<table>\n<tr><th>FİFO örneği (kitap)<\/th><th>Adet<\/th><th>Fiyat<\/th><th>Tutar<\/th><\/tr>\n<tr><td>3 Ocak alış<\/td><td>10.000<\/td><td>5<\/td><td>50.000<\/td><\/tr>\n<tr><td>2 Şubat alış<\/td><td>5.000<\/td><td>4<\/td><td>20.000<\/td><\/tr>\n<tr><td>8 Mayıs satış<\/td><td>6.000<\/td><td>6<\/td><td>36.000 → maliyet 6.000 x 5 = 30.000; matrah 6.000<\/td><\/tr>\n<tr><td>9 Mayıs alış<\/td><td>8.000<\/td><td>4,5<\/td><td>36.000<\/td><\/tr>\n<tr><td>12 Mayıs satış<\/td><td>12.000<\/td><td>5<\/td><td>60.000 → maliyet 4.000 x 5 + 5.000 x 4 + 3.000 x 4,5 = 53.500; matrah 6.500<\/td><\/tr>\n<\/table>\n<ul><li>Hisse ise işlem bazında %0, MKYO hissesi ise %10 tevkifat yapılır. Örneklerde komisyonların bedellere dahil olduğu varsayılır.<\/li><\/ul>\n\n<h3>Özel durumlar<\/h3>\n<ul>\n<li><b>Teminat ve ödünç:<\/b> kıymetler müşteri portföyünde sayılır; ancak maliyet hesabında <b>ödünç verilenler portföy dışında<\/b>, <b>teminat verilenler portföy içinde<\/b> varsayılır. Kitap örneği: 100 adet @2 alınır, 40 ödünç, 60 teminat verilir, 100 adet @3 alınır, 100 adet @4 satılır → maliyet 60 x 2 + 40 x 3 = 240; matrah 400 - 240 = 160.<\/li>\n<li><b>Açığa satış:<\/b> kıymet alınmadan satılırsa, satıştan <b>sonraki ilk alım<\/b> esas alınır. Örnek: 100.000 adet @4 açığa satış, sonra 100.000 @3,80 ve 150.000 @3,60 alım → matrah 400.000 - 380.000 = 20.000.<\/li>\n<li><b>Geç gelen virman / geçmiş tarihli kıymet:<\/b> matrah hesaplanıp işlem tamamlandıktan sonra portföye geçmiş tarihli bir kıymet girerse <b>geriye dönük düzeltme yapılmaz<\/b>.<\/li>\n<li><b>Hatalı işlemler<\/b> (yanlış hesap, hatalı fiyat veya miktar): geriye dönük düzeltilir; beyanname verildikten sonra fark edilirse VUK hükümlerine göre <b>düzeltme beyannamesi<\/b> verilebilir.<\/li>\n<li><b>Veraset ve ivazsız edinim:<\/b> VİV Kanunu m.10 ve VUK m.294'e göre borsa rayici, borsaya kayıtlı değilse emsal bedel. Mirasta edinme tarihi <b>ölüm tarihi<\/b>, diğer bedelsiz intikallerde <b>hukuki iktisap tarihi<\/b>; alış bedeli bu tarihteki borsa rayici veya emsal bedeldir. Varis satınca fark üzerinden Geçici 67 tevkifatı yapılır.<\/li>\n<\/ul>\n\n<h3>Sermaye artırımlarında alış tarihi ve bedeli<\/h3>\n<ul>\n<li><b>Alış tarihi:<\/b> iç kaynaktan (sermaye ve kâr yedekleri) gelen bedelsizlerde ve rüçhan hakkı kullanılarak alınan bedellilerde <b>eski hisselerin alış tarihi<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Artırım türü<\/th><th>Yeni birim maliyet<\/th><\/tr>\n<tr><td>Sermaye yedeklerinden (bedelsiz)<\/td><td>Eski hisselerin alış bedeli / artırım sonrası toplam hisse sayısı<\/td><\/tr>\n<tr><td>Kâr yedeklerinden<\/td><td>(Eski alış bedeli + yeni hisselerin itibari değerleri) / toplam hisse sayısı<\/td><\/tr>\n<tr><td>Bedelli (rüçhan kullanılarak)<\/td><td>(Eski alış bedeli + yeni hisseler için ödenen bedel) / toplam hisse sayısı<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kitap örneği (bedelsiz): 2.000 hisse 15.000 TL, %50 bedelsiz → 3.000 hisse, birim 5 TL; 2.000 hisse 16.000 TL'ye satılırsa matrah 16.000 - 10.000 = 6.000.<\/li>\n<li>Kitap örneği (bedelli): 1.000 hisse 4.000 TL, %50 bedelli, rüçhan fiyatı 1 TL → 500 TL ödenir; birim (4.000 + 500) / 1.500 = 3 TL; 800 hisse 5.000 TL'ye satılırsa matrah 5.000 - 2.400 = 2.600.<\/li>\n<\/ul>\n<h4>Rüçhan hakkı kuponunun ayrı satışı<\/h4>\n<ul>\n<li><b>Kupon maliyeti = [(mevcut hisselerin alış bedeli + rüçhan hakkı kullanma maliyeti) / (mevcut hisse sayısı + elde edilecek hisse sayısı) - rüçhan kullanım fiyatı] x sermaye artırım oranı.<\/b><\/li>\n<li>Kupon maliyeti hissenin orijinal maliyetinden düşülür; elde tutulan hissenin maliyeti böyle izlenir.<\/li>\n<li>Kitap örneği: 1.000 hisse 10.000 TL, %50 bedelli, fiyat 1 TL → [(10.000 + 500) / 1.500 - 1] x 0,5 = <b>3 TL<\/b>; kalan hisse maliyeti 10 - 3 = 7 TL. Baz fiyatla: ({[10 + 1 x 0,5] / 1,5} - 1) x 0,5 = 3.<\/li>\n<\/ul>\n\n<h3>Kuponlu tahvillerde alış bedeli ve matrah<\/h3>\n<ul>\n<li>İşlemiş faiz varsa: <b>işlemiş faiz = kupon alış bedeli<\/b>; <b>temiz fiyat = sözleşme (kirli) fiyatı - işlemiş faiz = tahvilin alış bedeli<\/b>.<\/li>\n<li><b>İşlemiş faiz = ödenecek kupon x (son kupon tarihinden valör tarihine geçen gün / kupon dönemi gün sayısı).<\/b> BİST esaslarına göre hesaplanır veya BİST'in açıkladığı tutar kullanılabilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Temiz fiyat nominalin altındaysa<\/th><th>Matrah<\/th><\/tr>\n<tr><td>İlk kupon<\/td><td>Kupon - işlemiş faiz<\/td><\/tr>\n<tr><td>Ara kuponlar<\/td><td>Kupon tutarı<\/td><\/tr>\n<tr><td>Son kupon + anapara<\/td><td>Kupon + (anapara - alış temiz fiyatı)<\/td><\/tr>\n<tr><td>Vadeden önce satış<\/td><td>Satış fiyatı - alış temiz fiyatı<\/td><\/tr>\n<\/table>\n<ul><li>Kitap örneği: 100.000 nominal, 6 ayda bir %7,5 kupon (7.500 TL), 182 günlük dönemin 99 günü geçmiş → işlemiş faiz 4.079,67; kirli 103.000 → temiz 98.920,33. İlk kupon matrahı 3.420,33; son dönem 7.500 + 1.079,67 = 8.579,67; 102.000'e satışta 3.079,67.<\/li><\/ul>\n<table>\n<tr><th>Temiz fiyat nominalin üstündeyse<\/th><th>Matrah<\/th><\/tr>\n<tr><td>Kupon başına fazla ödeme<\/td><td>(Temiz fiyat - nominal) / kalan kupon sayısı<\/td><\/tr>\n<tr><td>İlk kupon<\/td><td>Kupon - (işlemiş faiz + kupon başına fazla ödeme)<\/td><\/tr>\n<tr><td>Sonraki kuponlar<\/td><td>Kupon - kupon başına fazla ödeme<\/td><\/tr>\n<tr><td>Vadeden önce satış<\/td><td>Satış fiyatı - (alış temiz fiyatı - önceki kuponlarda dikkate alınan fazla ödemeler)<\/td><\/tr>\n<\/table>\n<ul><li>Kitap örneği: kirli 106.000 → temiz 101.920,33; fazla ödeme 1.920,33 / 4 = 480,08. İlk kupon 7.500 - (4.079,67 + 480,08) = 2.940,25; sonrakiler 7.019,92; iki kupondan sonra 102.000'e satışta 102.000 - (101.920,33 - 960,16) = 1.039,83.<\/li><\/ul>\n\n<h3>Döviz ve endeksli kıymetler<\/h3>\n<ul>\n<li><b>Dövize, altına veya başka değere endeksli<\/b> kıymetlerde alış ve satış bedeli olarak <b>işlem tarihlerindeki TL karşılıkları<\/b> esas alınır.<\/li>\n<li><b>Yabancı para cinsinden ihraç<\/b> edilenlerde <b>kur farkı dikkate alınmaz<\/b>: döviz cinsinden kazanç, satış tarihindeki kurla TL'ye çevrilir. Kur: işlem anında kullanılan kur; yoksa <b>TCMB döviz alış kuru<\/b>.<\/li>\n<li>Kitap örneği: 100.000 $ alış (kur 2,05), 101.000 $ satış (kur 2,10) → matrah 1.000 $ x 2,10 = 2.100 TL; sermaye şirketlerine %0, diğer yatırımcılara %10.<\/li>\n<\/ul>\n\n<h3>Vadeli işlem ve opsiyon sözleşmeleri<\/h3>\n<ul>\n<li>Fıkra 14: banka ve aracı kurumların taraf olduğu veya aracılık ettiği vadeli işlem ve opsiyonlar diğer SPA'dır. Matrah, sözleşmeden yararlanıldığı anda <b>dayanağın piyasa fiyatına göre değeri - işlem fiyatına göre değeri<\/b>; tevkifat <b>sözleşmenin sona erdiği tarih<\/b> itibarıyla yapılır.<\/li>\n<li>Oranlar: dar ve tam mükellef <b>sermaye şirketleri %0<\/b>; diğer kurumsal ve bireysel yatırımcılar <b>%10<\/b>. Hisse ve hisse endeksine dayalılarda %0 (2009/14580 BKK).<\/li>\n<li>Kazancın bir kısmı sözleşme devam ederken ödenirse tevkifat gerekmez; ancak banka/aracı kurum sözleşme sonundaki vergiyi güvenceye alacak önlemleri alır.<\/li>\n<li>Birden fazla yıla yayılan ve dönemsel ödemeli türevlerde her ödeme döneminde lehdara yapılan ödemeden tevkifat yapılır; dönem zararları <b>takvim yılı aşılmamak<\/b> kaydıyla mahsup edilir.<\/li>\n<li>Komisyon ve BSMV matrahta dikkate alınır. Tam ve dar mükellef kurumların (işyeri/daimi temsilcisi olmayan dar mükellefler hariç) kendi aralarındaki işlemlerde tevkifat yoktur; banka ve benzeri finans kurumlarına işyeri şartı aranmaz.<\/li>\n<\/ul>\n<table>\n<tr><th>Yatırımcı (Tablo 6)<\/th><th>VİOP<\/th><th>Tezgâh üstü<\/th><\/tr>\n<tr><td>Tam mükellef gerçek kişi<\/td><td>%10<\/td><td>%10<\/td><\/tr>\n<tr><td>Tam mükellef sermaye şirketi (SPK denetimindeki fonlar dahil)<\/td><td>%0<\/td><td>Tevkifata tabi değil<\/td><\/tr>\n<tr><td>Diğer tam mükellef kurum<\/td><td>%10<\/td><td>Tevkifata tabi değil<\/td><\/tr>\n<tr><td>Dar mükellef gerçek kişi<\/td><td>%10<\/td><td>%10<\/td><\/tr>\n<tr><td>Dar mükellef sermaye şirketi ve fon benzeri dar mükellefler (işyeri yok, banka değil)<\/td><td>%0<\/td><td>%0<\/td><\/tr>\n<tr><td>Bunlar dışındaki dar mükellefler (işyeri yok, banka değil)<\/td><td>%10<\/td><td>%10<\/td><\/tr>\n<tr><td>Türkiye'de işyeri/daimi temsilcisi olan dar mükellef kurum<\/td><td>%0<\/td><td>Tevkifata tabi değil<\/td><\/tr>\n<tr><td>Dar mükellef banka ve benzeri finans kurumu<\/td><td>%0<\/td><td>Tevkifata tabi değil<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Türev<\/th><th>Matrah<\/th><\/tr>\n<tr><td>Forward alım (kâr)<\/td><td>Tutar x (vadedeki spot kur - forward kur); zararda tevkifat yok, zarar yıl içinde aynı tür kazanca mahsup<\/td><\/tr>\n<tr><td>Opsiyon alıcısı (kullanırsa)<\/td><td>Tutar x (vadedeki spot - opsiyon kuru) - opsiyon primi (prim sözleşme tarihindeki kurla TL)<\/td><\/tr>\n<tr><td>Opsiyon alıcısı (kullanmazsa)<\/td><td>Ödenen prim zarardır; yıl içinde aynı tür kazanca mahsup<\/td><\/tr>\n<tr><td>Opsiyon satıcısı (karşı taraf kullanmazsa)<\/td><td>Alınan prim kazançtır; matrah = prim<\/td><\/tr>\n<tr><td>Faiz swapı<\/td><td>Lehine kalan net fark; zarar izleyen üç aylık dönemlere takvim yılı içinde devreder; yıl sonunda kalan zarar ihtiyari beyanla mahsup edilebilir<\/td><\/tr>\n<\/table>\n<ul><li>Spot kur: işleme taraf bankanın işlem anındaki kuru, yoksa TCMB döviz alış kuru. Swapta banka müşteri lehine ödediği farka isabet eden stopajı müşteriden ayrıca tahsil eder.<\/li><\/ul>\n\n<h3>İtfa, dönemsel getiri, ödünç<\/h3>\n<ul>\n<li><b>İtfa:<\/b> matrah = itfa bedeli - alış bedeli (komisyon ve BSMV dikkate alınır).<\/li>\n<li><b>Dönemsel getiri<\/b> (başka kıymete bağlı olmayan): matrah = getiri tutarı (komisyon, BSMV dikkate alınır).<\/li>\n<li><b>Ödünç:<\/b> ödünç verenin lehine kalan tutar; tevkifatı, kazancı nihai olarak elde edene ödemeyi yapan piyasa üyesi banka veya aracı kurum yapar.<\/li>\n<\/ul>\n\n<h3>Fiziken teslim, virman ve tevkifatsız alımlar<\/h3>\n<ul>\n<li><b>Fiziken teslim:<\/b> alış bedeli ve tarihi, tevsik edilirse kıymet sahibinin beyanıdır. Tevsik edici belge: menkul kıymet giriş-çıkış fişi, işlem sonuç formu, hesap ekstresi, dağıtım listesi, teslim belgesi. Tevsik edilemezse teslim alındığı yılda, teslim tarihine kadar borsada işlem gördüğü <b>son seansın AOF'si<\/b>; borsada işlem görmemişse <b>bir yıl önce<\/b> alındığı kabul edilip o yılın son seans AOF'si; yine belirlenemezse yargı mercilerince bilirkişi raporuyla tespit edilen değer.<\/li>\n<li><b>Virman:<\/b> nakli yapan kurum alış bedelini (<b>komisyon dahil<\/b>) ve tarihini bildirir; nakledilecek kıymet FİFO ile belirlenir; kuponlularda <b>kirli alış fiyatı<\/b> bildirilir, alan kurum temiz fiyatı ve fazla ödemeyi hesaplar. 2006 öncesi ihraç/iktisaplarda bunun belirtilmesi yeterlidir. Teminat ve ödünç dışındaki müşteri talimatlı aktarımlar mülkiyet devri sayılır.<\/li>\n<li><b>Tevkifatsız alınan kıymetler (fıkra 3):<\/b> banka/aracı kurum, fıkra 1 tevkifatına tabi tutulmadan bir kıymet satın alırsa satan adına (satış - alış) farkından <b>%10<\/b> keser. Kıymet daha önce banka/aracı kurumdan alınmamışsa alış yerine <b>ihraç bedeli<\/b>, çoklu fiyatlıysa ihaledeki <b>en yüksek fiyat<\/b>. Hisse senetleri, MKYF katılma belgeleri (BYF hariç) ve Eurobondlar bu fıkra dışındadır. Bu tevkifat da fıkra 1 esaslarına göre beyan edilir.<\/li>\n<li>Örnek (kitap): banka aracılığı olmadan 55.000 TL ihraç bedelli tahvil alan yatırımcı tahvili bankaya 63.000 TL'ye satarsa banka 8.000 TL üzerinden %10 keser.<\/li>\n<\/ul>\n", "sorular": [{"q": "Geçici 67 kapsamında alım-satım işlemlerinde tevkifat matrahının tespitinde hangi giderler dikkate alınır?", "o": ["Komisyon, BSMV ve saklama ücretleri", "Yalnızca alış ve satışta ödenen komisyon ve BSMV", "Tüm işlem ve finansman giderleri", "Yalnızca satış komisyonu", "Hiçbir gider dikkate alınmaz"], "a": 1, "e": "Komisyon ve BSMV dışında hiçbir gider tevkifat matrahında indirim konusu yapılamaz."}, {"q": "Bir yatırımcı X hissesinden 01.02'de 8.000 adedi 10 TL'den, 03.03'te 4.000 adedi 12 TL'den almış; 10.04'te 10.000 adedi 14 TL'den satmıştır. FİFO'ya göre tevkifat matrahı kaç TL'dir?", "o": ["30.000 TL", "32.000 TL", "40.000 TL", "33.333 TL", "36.000 TL"], "a": 4, "e": "Maliyet: 8.000 x 10 + 2.000 x 12 = 104.000 TL. Matrah: 140.000 - 104.000 = 36.000 TL."}, {"q": "Bir yatırımcının elinde FİFO sırasıyla yalnızca 12 TL'den alınmış 2.000 adet X hissesi kalmıştır. Bunlardan 1.000 adedini 15 TL'den satarsa tevkifat matrahı kaç TL olur?", "o": ["5.000 TL", "4.000 TL", "3.000 TL", "2.500 TL", "1.000 TL"], "a": 2, "e": "Satılan 1.000 adedin maliyeti 12 TL'dir: 1.000 x (15 - 12) = 3.000 TL."}, {"q": "Bir müşteri 200 adet hisseyi 5 TL'den almış, 80 adedini ödünç, 120 adedini teminat olarak vermiştir. Sonra 200 adedi 7 TL'den almış ve 200 adedi 9 TL'den satmıştır. Tevkifat matrahı kaç TL'dir?", "o": ["640 TL", "400 TL", "800 TL", "1.000 TL", "560 TL"], "a": 0, "e": "Ödünç verilenler portföy dışında, teminattakiler içinde sayılır. Satılan 200 adedin maliyeti: 120 x 5 + 80 x 7 = 1.160. Matrah: 1.800 - 1.160 = 640 TL."}, {"q": "Bayan B, 50.000 adet hisseyi 8 TL'den açığa satmış; daha sonra 50.000 adedi 7,20 TL'den, ertesi gün 80.000 adedi 7 TL'den almıştır. Tevkifat matrahı kaç TL'dir?", "o": ["50.000 TL", "45.000 TL", "10.000 TL", "40.000 TL", "0 TL"], "a": 3, "e": "Açığa satışta satıştan sonraki ilk alım esas alınır: 400.000 - 360.000 = 40.000 TL."}, {"q": "Veraset yoluyla edinilen ve Geçici 67 kapsamındaki bir hissenin varis tarafından satışında alış bedeli ve tarihi nasıl belirlenir?", "o": ["Murisin alış tarihi ve alış bedeli", "Ölüm tarihi ve o tarihteki borsa rayici", "Veraset ilamının tarihi ve nominal değer", "Satış tarihinden bir yıl önceki AOF", "Mirasın paylaşıldığı tarih ve emsal bedel"], "a": 1, "e": "Mirasta kıymetler ölüm tarihinde edinilmiş sayılır; alış bedeli bu tarihteki borsa rayici, borsaya kayıtlı değilse emsal bedeldir."}, {"q": "Bay A, 4.000 hisseyi 36.000 TL'ye almıştır. Şirket tamamı sermaye yedeklerinden %100 bedelsiz sermaye artırımı yapmıştır. Bay A daha sonra 3.000 hisseyi 18.000 TL'ye satarsa matrah kaç TL'dir?", "o": ["-9.000 TL", "9.000 TL", "0 TL", "6.000 TL", "4.500 TL"], "a": 4, "e": "Yeni birim maliyet: 36.000 / 8.000 = 4,5 TL. Matrah: 18.000 - 3.000 x 4,5 = 4.500 TL."}, {"q": "Bay C, 1.000 hisseyi 5.000 TL'ye almıştır. Şirket kâr yedeklerinden %25 oranında sermaye artırımı yapmış, nominali 1 TL olan 250 yeni hisse verilmiştir. 500 hissenin 3.000 TL'ye satışında matrah kaç TL'dir?", "o": ["500 TL", "1.000 TL", "900 TL", "1.000,50 TL", "875 TL"], "a": 2, "e": "Kâr yedeklerinde birim maliyet (5.000 + 250) / 1.250 = 4,2 TL. Matrah: 3.000 - 500 x 4,2 = 900 TL."}, {"q": "Bayan D, 2.000 hisseyi 11.000 TL'ye almıştır. %50 bedelli artırımda rüçhan fiyatı 1 TL'dir ve hakkını kullanarak 1.000 hisse için 1.000 TL ödemiştir. 1.000 hissenin 6.500 TL'ye satışında matrah kaç TL'dir?", "o": ["2.500 TL", "1.000 TL", "3.000 TL", "5.500 TL", "2.833 TL"], "a": 0, "e": "Birim maliyet (11.000 + 1.000) / 3.000 = 4 TL. Matrah: 6.500 - 4.000 = 2.500 TL."}, {"q": "Bayan E, 1.000 hisseyi 16.000 TL'ye almıştır. Şirket %50 bedelli sermaye artırımına gitmiş, rüçhan kullanım fiyatı 1 TL'dir. Bayan E rüçhan kuponlarını ayrı satarsa hisse başına kupon maliyeti kaç TL'dir?", "o": ["10 TL", "7,5 TL", "5,5 TL", "5 TL", "11 TL"], "a": 3, "e": "Kupon maliyeti = [(16.000 + 500) / 1.500 - 1] x 0,5 = (11 - 1) x 0,5 = 5 TL."}, {"q": "Rüçhan kuponunun maliyeti 5 TL, hissenin orijinal birim maliyeti 16 TL ise elde tutulmaya devam edilen hissenin birim maliyeti kaç TL olur?", "o": ["16 TL", "11 TL", "21 TL", "10,5 TL", "8 TL"], "a": 1, "e": "Kupon maliyeti hissenin orijinal maliyetinden düşülür: 16 - 5 = 11 TL."}, {"q": "100.000 TL nominal, 6 ayda bir 10.000 TL kupon ödeyen bir tahvil, 182 günlük kupon döneminin 91. gününde 104.000 TL kirli fiyatla alınmıştır. Alıştaki temiz fiyat kaç TL'dir?", "o": ["104.000 TL", "94.000 TL", "100.000 TL", "98.500 TL", "99.000 TL"], "a": 4, "e": "İşlemiş faiz = 10.000 x 91 / 182 = 5.000 TL. Temiz fiyat = 104.000 - 5.000 = 99.000 TL."}, {"q": "Temiz fiyatı 99.000 TL, işlemiş faizi 5.000 TL olan ve 10.000 TL kupon ödeyen tahvilde, alıştan sonraki ilk kupon ödemesinde tevkifat matrahı kaç TL'dir?", "o": ["10.000 TL", "6.000 TL", "5.000 TL", "4.000 TL", "1.000 TL"], "a": 2, "e": "İlk kupon matrahı = kupon - işlemiş faiz = 10.000 - 5.000 = 5.000 TL."}, {"q": "Alış temiz fiyatı 99.000 TL olan 100.000 TL nominalli tahvil itfaya kadar tutulmuştur. Son kupon 10.000 TL ise son ödemedeki tevkifat matrahı kaç TL'dir?", "o": ["11.000 TL", "10.000 TL", "1.000 TL", "110.000 TL", "9.000 TL"], "a": 0, "e": "Son dönem matrahı = kupon + (anapara - alış temiz fiyatı) = 10.000 + 1.000 = 11.000 TL."}, {"q": "Alış temiz fiyatı 99.000 TL olan tahvil (nominalin altında alınmış) vadeden önce 101.500 TL'ye satılmıştır. Tevkifat matrahı kaç TL'dir?", "o": ["1.500 TL", "6.500 TL", "-2.500 TL", "2.500 TL", "1.000 TL"], "a": 3, "e": "Satışta matrah = satış fiyatı - alış temiz fiyatı = 101.500 - 99.000 = 2.500 TL."}, {"q": "Nominali 100.000 TL, kuponu 10.000 TL olan tahvil 107.000 TL kirli fiyatla alınmış; işlemiş faiz 5.000 TL, kalan kupon sayısı 4'tür. İlk kupon ödemesinde tevkifat matrahı kaç TL'dir?", "o": ["5.000 TL", "4.500 TL", "3.000 TL", "9.500 TL", "2.000 TL"], "a": 1, "e": "Temiz fiyat 102.000; kupon başına fazla ödeme (102.000 - 100.000) / 4 = 500. İlk kupon matrahı = 10.000 - (5.000 + 500) = 4.500 TL."}, {"q": "Temiz fiyatı 102.000 TL (nominal 100.000), kupon başına fazla ödemesi 500 TL olan tahvilde iki kupon tahsil edildikten sonra tahvil 102.500 TL'ye satılmıştır. Tevkifat matrahı kaç TL'dir?", "o": ["500 TL", "2.500 TL", "1.000 TL", "0 TL", "1.500 TL"], "a": 4, "e": "Matrah = satış - (alış temiz fiyatı - önceki kuponlarda dikkate alınan fazla ödeme) = 102.500 - (102.000 - 1.000) = 1.500 TL."}, {"q": "Döviz cinsinden ihraç edilmiş bir devlet tahvili 50.000 USD'ye (kur 30 TL) alınmış, 51.000 USD'ye (kur 34 TL) satılmıştır. Geçici 67'ye göre tevkifat matrahı kaç TL'dir?", "o": ["234.000 TL", "30.000 TL", "34.000 TL", "200.000 TL", "32.000 TL"], "a": 2, "e": "Yabancı para cinsinden ihraçta kur farkı dikkate alınmaz: 1.000 USD x satış tarihindeki kur 34 = 34.000 TL."}, {"q": "Dövize endeksli (TL ödemeli) bir menkul kıymette tevkifat matrahı nasıl bulunur?", "o": ["Alış ve satış bedelleri işlem tarihlerindeki TL karşılıklarıyla alınır", "Kur farkı hariç tutulur", "Döviz cinsinden kazanç alış tarihindeki kurla çevrilir", "Yalnızca TCMB efektif satış kuru kullanılır", "Matrah sıfır kabul edilir"], "a": 0, "e": "Endeksli kıymetlerde işlem tarihlerindeki TL karşılıkları esas alınır; kur farkını dışarıda bırakma kuralı yabancı para cinsinden ihraç edilenlere özgüdür."}, {"q": "Tam mükellef Bay F, bankayla 500.000 USD tutarında 3 ay vadeli forward alım sözleşmesi yapmıştır. Forward kur 35,00, vadedeki spot kur 35,40'tır. Kesilecek tevkifat kaç TL'dir?", "o": ["200.000 TL", "0 TL", "30.000 TL", "20.000 TL", "17.500 TL"], "a": 3, "e": "Matrah = 500.000 x (35,40 - 35,00) = 200.000 TL. Tam mükellef gerçek kişide oran %10: 20.000 TL."}, {"q": "Bay G, 1.000.000 USD tutarında USD alım opsiyonu almıştır: opsiyon kuru 34,00, prim tutarın %1'i, sözleşme günü kur 34,20, vadede spot kur 34,60. Opsiyonu kullanırsa tevkifat matrahı kaç TL'dir?", "o": ["600.000 TL", "258.000 TL", "342.000 TL", "260.000 TL", "400.000 TL"], "a": 1, "e": "Fark: 1.000.000 x 0,60 = 600.000 TL. Prim 10.000 USD x 34,20 = 342.000 TL. Matrah = 600.000 - 342.000 = 258.000 TL."}, {"q": "Bir yatırımcı banka aracılığı olmadan 80.000 TL ihraç bedelli bir özel sektör tahvili almış ve bankaya 92.000 TL'ye satmıştır. Banka fıkra 3'e göre kaç TL tevkifat yapar?", "o": ["9.200 TL", "1.800 TL", "0 TL", "8.000 TL", "1.200 TL"], "a": 4, "e": "Daha önce banka/aracı kurumdan alınmadığı için ihraç bedeli esas alınır: (92.000 - 80.000) x %10 = 1.200 TL."}, {"q": "Fıkra 3 kapsamında 'tevkifatsız olarak satın alınan' kıymetler için hangisi yanlıştır?", "o": ["Daha önce banka/aracı kurumdan alınmamışsa ihraç bedeli esas alınır", "Çoklu fiyatlı ihraçta ihaledeki en yüksek fiyat esas alınır", "Hisse senetleri de bu kapsamda %10 tevkifata tabidir", "Eurobondlar kapsam dışıdır", "BYF hariç MKYF katılma belgeleri kapsam dışıdır"], "a": 2, "e": "Hisse senetleri, MKYF katılma belgeleri (BYF hariç) ve Eurobondlar fıkra 3 kapsamında tevkifata tabi değildir."}, {"q": "Alış bedeli tevsik edilemeyen ve fiziken bankaya teslim edilen borsada işlem gören bir hissenin alış bedeli nasıl belirlenir?", "o": ["Teslim alındığı yılda teslim tarihine kadar borsada işlem gördüğü son seansın AOF'si", "Nominal değer", "Teslim günündeki kapanış fiyatı", "Kıymet sahibinin beyanı, belge aranmaz", "Sıfır kabul edilir"], "a": 0, "e": "Tevsik edilemeyen fiziki teslimlerde o yıl teslim tarihine kadar işlem gördüğü son seansın AOF'si esas alınır."}, {"q": "Bir yatırımcı 95.000 TL'ye aldığı tahvili itfaya kadar tutmuş ve 100.000 TL itfa bedeli almıştır; alışta 200 TL komisyon ödemiştir. Tevkifat matrahı kaç TL'dir?", "o": ["5.000 TL", "5.200 TL", "100.000 TL", "4.800 TL", "4.500 TL"], "a": 3, "e": "İtfada matrah = itfa bedeli - alış bedeli; alıştaki komisyon dikkate alınır: 100.000 - 95.200 = 4.800 TL."}]}, {"id": 12, "kisa": "Fonlar, Eurobond, Darphane", "baslik": "Yatırım Fon ve Ortaklıklarının Vergilendirilmesi, Yabancı Fonlar, Hazine Eurobondları, Darphane Sertifikaları ve 2006 Öncesi Kıymetler", "ozet": "Yatırım fon ve ortaklıklarının portföy kazançları ile gelirlerinde tevkifatı, KVK 5/A yabancı fon rejimini, Eurobond faiz ve alım-satım kazançlarını, darphane sertifikalarını, 2006 öncesi kıymetlerde geçiş kurallarını ve ÇVÖA belgelerini toplar.", "notlar": "\n<h3>Türkiye'de yerleşik yatırım fon ve ortaklıkları<\/h3>\n<ul>\n<li>Geçici 67/8: SPKn'ye göre kurulan yatırım fonları ve yatırım ortaklıklarının Geçici 67 kapsamında elde ettiği gelirler üzerinden tevkifat sorumlularınca hesaplanan stopaj <b>%0<\/b>.<\/li>\n<li>Fon ve ortaklıkların kazancı <b>portföy işletmeciliği kazancıdır<\/b> ve KVK uyarınca <b>KV'den istisnadır<\/b>.<\/li>\n<li>2006/10731 sayılı BKK: KV'den istisna portföy kazançları <b>dağıtılsın veya dağıtılmasın %0<\/b> tevkifata tabi; GVK m.94'e göre ayrıca tevkifat yok. Sonuç: fon ve ortaklıkların vergi yükü <b>sıfırdır<\/b>.<\/li>\n<li>Vergileme <b>yatırımcı bünyesinde<\/b> olur: MKYF katılma belgesinin fona iadesi, BYF katılma belgeleri ve borsa YO hisselerinin satışı tevkifat kapsamındadır (5527 sayılı Kanun ve 2006/10731 BKK). Kitaptaki genel çerçeve: tam mükellef sermaye şirketleri %0, diğer tam mükellef kurumsal ve bireysel %10; dar mükellef sermaye şirketleri %0, diğer dar mükellefler %10. Güncel oran takvimi için fon katılma payı tablosuna bakılmalıdır.<\/li>\n<li>Portföyünün sürekli en az %51'i BİST hissesi olan fonlarda <b>1 yıldan fazla<\/b> tutulan katılma belgelerinin satışında stopaj yapılmaz.<\/li>\n<\/ul>\n<h4>Tarihsel oranlar: MKYF ve MKYO portföy kazançları ve gelirleri<\/h4>\n<table>\n<tr><th>Dönem<\/th><th>Portföy kazancı tevkifatı (fıkra 8)<\/th><th>Fon/ortaklık gelirleri tevkifatı (fıkra 1-4)<\/th><\/tr>\n<tr><td>01.01.2006 - 23.07.2006<\/td><td>%15<\/td><td>%15<\/td><\/tr>\n<tr><td>23.07.2006 - 01.10.2006<\/td><td>%10<\/td><td>%10<\/td><\/tr>\n<tr><td>01.10.2006'dan itibaren<\/td><td><b>%0<\/b><\/td><td><b>%0<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Kıst dönemlere ilgili oranlar uygulanır. <b>BYF, konut finansmanı fonları (KFF) ve varlık finansmanı fonları (VFF)<\/b> 5527 sayılı Kanunla 01.10.2006'dan itibaren portföy kazancı tevkifatına dahil edilmiş ve %0 uygulanmıştır.<\/li>\n<li>31.12.2005'te mevcut portföylerin 01.01.2006 - 01.10.2006 arasındaki kazançlarında eski hükümler geçerlidir.<\/li>\n<li><b>Serbest (döviz) fonlar:<\/b> 2604 sayılı CK (RG 03.06.2020) ile portföy işletmeciliği kazançlarından <b>%15<\/b> tevkifat. Hisse yoğun fonlar dışındaki fonlarda gerçek kişi ile vakıf, dernek gibi tüzel kişilere %10 stopaj devam ettiğinden, döviz fonunda hem fon bünyesinde %15 hem de katılma payının iadesi veya satışında yatırımcıdan %10 stopaj söz konusu olur. Uygulama 3 Haziran 2020'den itibaren.<\/li>\n<li><b>Emeklilik yatırım fonları<\/b> Geçici 67 kapsamında vergilendirilmez; ne fon bünyesinde ne de gelirlerinde tevkifat yapılır.<\/li>\n<\/ul>\n<h4>Giderlerin dağıtımı<\/h4>\n<ul>\n<li>MKYF ve MKYO'lar 31.12.2005'te mevcut portföylerini (I. kısım) sonradan alınanlardan (II. kısım) <b>ayrı izlemek<\/b> zorundadır.<\/li>\n<li>Genel giderler (fon yönetim ücreti vb.) kısımların toplam portföy içindeki <b>ağırlığına göre<\/b> dağıtılır; belli bir kısımla doğrudan ilgili giderler yalnızca o kısma yazılır.<\/li>\n<li>Kitap örneği: I. kısım 4.000.000, II. kısım 6.000.000 → %40 / %60; 50.000 TL yönetim ücreti 20.000 / 30.000 dağılır; II. kısma ait 1.000 TL gider yalnız II. kısma.<\/li>\n<\/ul>\n<h4>2006 öncesi portföy kısmında A tipi / B tipi<\/h4>\n<ul>\n<li>Fon ve ortaklıkların 2006 öncesi iktisap edilen hisseler ve 2006 öncesi ihraç edilen tahvil/HB'den doğan, KV'den istisna portföy kazançlarında, bu kısım portföyün <b>en az %25'i hisse<\/b> ise (A tipi) GVK m.94'e göre <b>%0<\/b>, değilse (B tipi) <b>%10<\/b>.<\/li>\n<li>Dikkat (kaynakta çelişki): 2.12.1.7.1 bölümü MKYF/MKYO portföy kazançlarının ve 2006 sonrası kıymet kazançlarının <b>%15<\/b> tevkifata tabi olduğunu söyler; bu, 2006/10731 BKK öncesi eski orandır. 2.9 bölümüne göre 01.10.2006'dan itibaren oran <b>%0<\/b>'dır (serbest döviz fonları %15 hariç).<\/li>\n<li>2006'dan sonra fon 2006 öncesi ve sonrasında portföyde olan aynı hisseden satış yaparsa, satış <b>I. kısımdan<\/b> yapılmış sayılır; bu, I. kısmın A tipinden B tipine dönüşmesine yol açabilir. 2006 sonrası alınan hisse I. kısma konulamaz.<\/li>\n<li>Fonun portföy kazancı tevkifatından, kendi gelirleri üzerinden tevkif edilmiş vergiler mahsup edilir; artan iade edilir.<\/li>\n<\/ul>\n\n<h3>Dar mükellefiyete tabi yatırım fonları<\/h3>\n<ul>\n<li>5281 sayılı Kanunla KVK m.2/2 kaldırıldı; Türkiye'de münhasıran portföy işletmeciliği yapan dar mükellef fonların SPKn'ye göre kurulmuş fon sayılmasına <b>01.01.2006<\/b>'dan itibaren son verildi.<\/li>\n<li>Geçiş: 31.12.2005'e kadar bu statüdeki fonlar, hisse dışındaki 2006 öncesi ihraçlı kıymetler için bunlar <b>itfa edilip dolaşımdan kalkana kadar<\/b>, 31.12.2005 portföyündeki hisseler için <b>ilk kez elden çıkarılıncaya kadar<\/b> statülerini korur. Bu kazançlarda Geçici 67 tevkifatı yok; 31.12.2005 hükümleri ve GVK m.94'e göre hisse ağırlığına göre %0 veya %10.<\/li>\n<li>2006'dan sonra alınan hisseler ve sonra ihraç edilen kıymetler fon portföyüne alınamaz; fon üzerinden yapılan alımlar doğrudan müşterinin işlemi sayılır ve müşteriden fıkra 1 ve 4'e göre tevkifat yapılır. Satılan hisseler önce fon statüsündeki 2006 öncesi hisselerden çıkmış sayılır.<\/li>\n<li>31.12.2005'te portföyü boş olan fonlar o tarihte <b>tasfiye edilmiş<\/b> sayılır; portföy sonradan boşalırsa da statü kalkar. 31.12.2005'te fon statüsü olmayanlar sonradan bu statüyü alamaz.<\/li>\n<\/ul>\n\n<h3>Yabancı fonlar ve portföy yöneticisi şirketler (KVK m.5/A)<\/h3>\n<ul>\n<li>6322 sayılı Kanun m.35 ile KVK'ya eklenen <b>5/A<\/b>, yabancı fonlar ile bunların işlemlerini yürüten portföy yöneticiliği yetki belgeli <b>tam mükellef<\/b> şirketlerin vergisel durumunu düzenler.<\/li>\n<li>Kapsamdaki işlemler (borsada işlem görsün görmesin): her türlü menkul kıymet ve SPA, vadeli işlem ve opsiyon, varant, döviz, emtiaya dayalı vadeli işlem ve opsiyon, kredi ve benzeri finansal varlıklar, kıymetli maden borsası emtia işlemleri.<\/li>\n<li>Şartlar sağlanırsa portföy yöneticisi şirket fonun <b>daimi temsilcisi sayılmaz<\/b>, işyeri fonun işyeri sayılmaz; fon bu kazançlar için <b>beyanname vermez<\/b>. Türkiye kaynaklı gelirlerden yapılan vergi kesintisine etkisi yoktur.<\/li>\n<li>Kapsam dışı: Türkiye'deki taşınmazlar; aktifinin <b>%51'inden fazlası<\/b> taşınmaz olan şirketlerin hisseleri ve bunlara ilişkin türevler; nakdi uzlaşmalı olanlar dışındaki emtia türevleri; sigorta sözleşmeleri ve bunlara ilişkin türevler.<\/li>\n<\/ul>\n<table>\n<tr><th>Dört şart (birlikte)<\/th><th>Açıklama<\/th><\/tr>\n<tr><td>1) Mutat faaliyet<\/td><td>Fon adına işlemler portföy yönetiminde olağan faaliyetlerden olmalı<\/td><\/tr>\n<tr><td>2) Bağımsızlık<\/td><td>Fon ile şirket arasındaki ilişki emsallere uygun, bağımsız kişiler arasındaki gibi olmalı<\/td><\/tr>\n<tr><td>3) Emsale uygun bedel ve TF raporu<\/td><td>Transfer fiyatlandırması raporu <b>KV beyannamesi verilme süresi içinde<\/b> GİB'e verilmeli; verilmezse o dönem şirket fonun daimi temsilcisi sayılır ve fon kazancı genel hükümlere göre vergilenir. Rapor verilip bedel düşükse yalnız şirket adına TF tarhiyatı yapılır<\/td><\/tr>\n<tr><td>4) Hak sahipliği sınırı<\/td><td>Şirket ve ilişkili kişilerin fon kazancı üzerinde doğrudan veya dolaylı hak sahipliği <b>%20'yi aşmamalı<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>Şartlar sağlanırsa şirketin yabancı fondaki <b>pay sahipliği kazançları KV'den istisnadır<\/b>; yönetim ücreti, teşvik, prim, performans ücreti <b>her hâlükârda<\/b> kurum kazancına girer.<\/li>\n<li>%20 aşılırsa istisna yok; %20'lik kısım dahil fondan elde edilen kazancın <b>tamamı<\/b> genel hükümlere göre vergilenir.<\/li>\n<li>Fonun katılımcı ve kurucuları arasında tam mükellef gerçek kişi veya kurumların kazanç payı <b>%5'i geçerse<\/b> şirket bunların tamamını GİB'e bildirir; bildirmezse vergi ve cezalardan <b>müştereken ve müteselsilen<\/b> sorumlu olur.<\/li>\n<\/ul>\n\n<h3>Hazine Eurobondları<\/h3>\n<ul>\n<li>Yasal dayanak: GVK m.85 (gelirin toplanması), m.86 (toplama yapılmayan haller), m.75, 76, mük. 80, 81 ve <b>Geçici 59<\/b>. Yabancı memlekette elde edilen kazanç, Türkiye'de hesaplara intikal ettirildiği yılda (iradesi dışında intikal etmediyse tasarruf edebildiği yılda) elde edilmiş sayılır.<\/li>\n<li>GVK m.86/1-d: tevkifata ve istisnaya konu olmayan MSİ ve GMSİ toplamı belli tutarı (2022 için 3.800 TL) aşmıyorsa beyanname verilmez.<\/li>\n<li><b>Geçici 59:<\/b> 31.12.2007'ye kadar, <b>26.07.2001 - 31.12.2005<\/b> arasında ihraç edilen DT ve HB faiz ve elden çıkarma kazançları toplamının 2001'de 50 milyar lirası (sonraki yıllarda yeniden değerleme oranıyla artırılmış tutarı) istisnaydı; yararlananlar mük. 80 ve geçici 56 istisnalarından ayrıca yararlanamazdı; ticari işletmelere uygulanmazdı.<\/li>\n<li>Vergi bakımından Eurobond, DT ve HB gibi değerlendirilir. Faizi GVK <b>m.94/7-a<\/b>'ya göre <b>%0<\/b> tevkifata tabidir ve \"<b>tevkifatlı<\/b>\" sayılır. Döviz cinsinden olduğu için <b>indirim oranı uygulanmaz<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Eurobond<\/th><th>Tam mükellef gerçek kişi<\/th><th>Dar mükellef gerçek kişi<\/th><\/tr>\n<tr><td>Faiz<\/td><td>26.07.2001 öncesi ve 2006 sonrası ihraçlarda Geçici 59 istisnası yok; tarifenin 2. dilimindeki beyan sınırı aşılırsa <b>tamamı<\/b> beyan. 2001-2005 ihraçlarında 2007'ye kadar istisna düşülürdü<\/td><td>Tevkif yoluyla vergilenmiş sayılır; tutarı ne olursa olsun beyan edilmez<\/td><\/tr>\n<tr><td>Alım-satım kazancı<\/td><td>Stopaj yok. 26.07.2001 öncesi ihraçta endeksleme ve mük. 80 istisnası sonrası kalan beyan; <b>2006 sonrası ihraçta istisna yok, tutarı ne olursa olsun beyan<\/b>. Endeksleme: TEFE, 2006'dan itibaren ÜFE; 2006 öncesi ihraçlarda %10 şartı aranmaz<\/td><td>5527 sayılı Kanun (07.07.2006) ile münferit veya özel beyanname verilmez; ihraç tarihi önemsiz<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kazanç: satıştaki döviz tutarının TL karşılığı - alıştaki döviz tutarının TL karşılığı - alım-satım giderleri.<\/li>\n<li>Eskiden dar mükellef GVK m.101'e göre <b>15 gün<\/b> içinde münferit beyanname verirdi; m.107'ye göre daimi temsilci, yoksa kazancı sağlayan tarhiyata muhataptı.<\/li>\n<li>Tam mükelleflerin yurt dışında ödediği benzer vergiler <b>GVK m.123<\/b>'e göre mahsup edilir; birden fazla gelir unsurunda 11.02.2004 tarihli <b>16 No.lu GV Sirküleri<\/b> dikkate alınır. Ticari işletmelerde ticari kazanç hükümleri uygulanır.<\/li>\n<\/ul>\n\n<h3>Darphane sertifikaları<\/h3>\n<ul>\n<li>SPK'nın <b>VII-128.3 Varantlar ve Yatırım Kuruluşu Sertifikaları Tebliği<\/b> kapsamında 2022'de düzenlendi; kamu kurumlarınca ihraç edilen, fiziki teslimi mümkün altın ve gümüşü temsil eden sermaye piyasası aracı.<\/li>\n<li>Darphane ve Damga Matbaası Genel Müdürlüğüne <b>5.000 kg (5 ton)<\/b>, <b>0,995 saflıkta<\/b> altın ihraç tavanı verildi. Her sertifika <b>0,01 gram<\/b> altını temsil eder, <b>vadesizdir<\/b>; KAP'taki izahnameye göre fiziki altına dönüştürülebilir.<\/li>\n<li><b>6036 sayılı CK<\/b> (RG 15.09.2022) ile 2006/10731 BKK'ya eklendi: kazançlarda stopaj <b>%0<\/b>; Geçici 67/11 ihtiyari beyannamesinde de <b>%0<\/b> vergi.<\/li>\n<\/ul>\n\n<h3>2006 öncesi ihraç ve iktisaplar<\/h3>\n<ul>\n<li><b>Fıkra 9:<\/b> 01.01.2006'dan önce <b>ihraç<\/b> edilen tahvil, HB, TKİ ve ÖİB kıymetlerinin gelirlerinde Geçici 67 uygulanmaz; 31.12.2005 hükümleri geçerli. İktisap tarihi önemsizdir: 2006'dan sonra satın alınsa da aynı. Dar mükellef kurumlar bu kıymetlerin elden çıkarma kazancını <b>özel beyanname<\/b> ile beyan eder; elde tutma gelirlerini de bu beyannameye katar.<\/li>\n<li><b>Fıkra 10:<\/b> 01.01.2006'dan önce <b>iktisap<\/b> edilen kıymetlerin elden çıkarma ve elde tutma gelirlerinde de tevkifat yok, 31.12.2005 hükümleri geçerli; dar mükellef kurumlar özel beyanname verir.<\/li>\n<\/ul>\n\n<h3>ÇVÖA uygulaması (Geçici 67)<\/h3>\n<ul>\n<li>Dar mükellefin Türk finansal araçlarına yatırım yapabilmesi ve ÇVÖA'dan yararlanması için <b>vergi kimlik numarası<\/b> gerekir: gerçek kişi pasaportun noter onaylı örneği (veya aslı ve fotokopisi), kurum kuruluş belgesinin konsolosluk onaylı Türkçe örneği veya tercümesi; KKTC vatandaşına nüfus cüzdanı yeterli. Banka ve aracı kurumlar toplu talepleri <b>Boğaziçi Vergi Dairesine<\/b> gönderir.<\/li>\n<li>Anlaşmadan yararlanmak için yetkili makamca düzenlenen <b>mukimlik belgesi<\/b> aslı ve tercümesi, tevkifattan <b>önce<\/b> vergi dairesine (doğrudan veya banka/aracı kurum vasıtasıyla) verilir. Bir yıla ait belge <b>izleyen yılın dördüncü ayına kadar<\/b> geçerlidir, her yıl yenilenir. Dikkat: giriş bölümüne göre dar mükellef kurumlarda mukimlik belgesi 3 yılda bir yenilenir.<\/li>\n<li>Belge verilmezse anlaşma dikkate alınmadan <b>%15<\/b> tevkifat yapılır; sonradan belge verilerek fazla kesinti iadesi istenebilir. İade, gelir sahibine ödenmek üzere tevkifatı yapan banka/aracı kurum adına yapılır.<\/li>\n<li>Bakanlık gerekirse <b>gerçek hak sahibi (beneficial owner)<\/b> belgesi isteyebilir; süresinde verilmezse vergi ziyaı doğmuş sayılır.<\/li>\n<\/ul>\n", "sorular": [{"q": "Geçici 67/8 uyarınca SPKn'ye göre kurulan yatırım fonları ve yatırım ortaklıklarının Geçici 67 kapsamındaki gelirleri üzerinden tevkifat oranı kaçtır?", "o": ["%10", "%0", "%15", "%17,5", "%5"], "a": 1, "e": "2.9.1'e göre fon ve ortaklıkların Geçici 67 kapsamındaki gelirlerinden hesaplanan stopaj %0'dır; 01.10.2006'dan itibaren portföy kazançlarına da %0 uygulanır. Dikkat: 2.12.1.7.1'de eski %15 oranı da geçer, güncel bölüm 2.9 esas alınır."}, {"q": "MKYF ve MKYO'ların KV'den istisna portföy kazançları üzerinden 23.07.2006 - 01.10.2006 arasında uygulanan tevkifat oranı kaçtır?", "o": ["%15", "%0", "%5", "%20", "%10"], "a": 4, "e": "01.01.2006 - 23.07.2006 %15, 23.07.2006 - 01.10.2006 %10, 01.10.2006'dan itibaren %0."}, {"q": "2604 sayılı CK ile serbest (döviz) fonlarının portföy işletmeciliği kazançları üzerinden öngörülen tevkifat oranı kaçtır?", "o": ["%0", "%10", "%15", "%17,5", "%25"], "a": 2, "e": "03.06.2020'de RG'de yayımlanan 2604 sayılı CK ile serbest (döviz) fonlarda portföy kazançlarından %15 tevkifat yapılır."}, {"q": "Bir serbest (döviz) fonu portföy işletmeciliğinden 200.000 TL kazanç elde etmiştir. Fon bünyesinde yapılacak tevkifat kaç TL'dir?", "o": ["30.000 TL", "20.000 TL", "0 TL", "35.000 TL", "50.000 TL"], "a": 0, "e": "Serbest (döviz) fonlarda portföy kazancından %15: 200.000 x 0,15 = 30.000 TL."}, {"q": "Emeklilik yatırım fonlarının Geçici 67 karşısındaki durumu için hangisi doğrudur?", "o": ["Portföy kazançları %15 tevkifata tabidir", "Gelirlerinden %10 tevkifat yapılır", "Yalnızca hisse kazançları %0 tevkifata tabidir", "Geçici 67 kapsamında vergilendirilmez; ne fon bünyesinde ne gelirlerinde tevkifat yapılır", "Katılımcılar ihtiyari beyan vermek zorundadır"], "a": 3, "e": "EYF'ler Geçici 67 kapsamında vergilendirilmez."}, {"q": "Bir MKYF'nin I. kısım portföyü 3.000.000 TL, II. kısım portföyü 9.000.000 TL'dir. Dönemde 80.000 TL fon yönetim ücreti ve yalnızca II. kısımla ilgili 2.000 TL gider vardır. II. kısma yüklenecek toplam gider kaç TL'dir?", "o": ["60.000 TL", "62.000 TL", "40.000 TL", "61.500 TL", "20.000 TL"], "a": 1, "e": "Genel gider ağırlığa göre: II. kısım %75 x 80.000 = 60.000. Doğrudan ilgili 2.000 TL de eklenir: 62.000 TL."}, {"q": "Bir yatırım ortaklığının 2006 öncesi portföy kısmında hisse oranı %25'in altındadır (B tipi). Bu kısımdan 120.000 TL KV'den istisna portföy kazancı doğmuştur. GVK m.94'e göre tevkifat kaç TL'dir?", "o": ["0 TL", "18.000 TL", "30.000 TL", "6.000 TL", "12.000 TL"], "a": 4, "e": "B tipi (hisse oranı %25'in altında) kısımda oran %10: 120.000 x 0,10 = 12.000 TL. A tipinde %0 olurdu."}, {"q": "2006 öncesi portföy kısmında hangi şart sağlanırsa portföy kazançları GVK m.94'e göre %0 oranında tevkifata tabi olur?", "o": ["En az %51'inin BİST hissesi olması", "En az %50'sinin tahvil olması", "Bu kısım portföyün en az %25'inin hisse senedinden oluşması", "1 yıldan fazla elde tutulması", "Fonun TEFAS'ta işlem görmesi"], "a": 2, "e": "En az %25'i hisse olan (A tipi) kısımda %0, diğerlerinde (B tipi) %10 uygulanır."}, {"q": "Aşağıdakilerden hangisi KVK m.5/A kapsamında portföy yöneticisi şirketin yabancı fonun daimi temsilcisi sayılmaması için aranan şartlardan biri değildir?", "o": ["Şirketin yabancı fonun en az %51'ine sahip olması", "Fon adına işlemlerin şirketin mutat faaliyetlerinden olması", "Fon ile şirket arasındaki ilişkinin bağımsız kişiler arasındaki gibi olması", "Emsale uygun bedel alınması ve transfer fiyatlandırması raporunun süresinde verilmesi", "Şirket ve ilişkili kişilerin fon kazancı üzerindeki hak sahipliğinin %20'yi aşmaması"], "a": 0, "e": "Dört şart: mutat faaliyet, bağımsızlık, emsale uygun bedel ve TF raporu, %20 hak sahipliği sınırı."}, {"q": "Portföy yöneticisi şirket ve ilişkili kişilerin yabancı fonun kazançları üzerindeki hak sahipliği %25 ise hangisi doğrudur?", "o": ["Yalnızca %20'yi aşan %5'lik kısım vergilenir", "Kazancın %20'si istisna, kalanı vergilenir", "Yalnızca yönetim ücreti vergilenir", "İstisna uygulanmaz; %20'lik kısım dahil fondan elde edilen kazancın tamamı genel hükümlere göre vergilenir", "Fon dar mükellef olduğu için vergi doğmaz"], "a": 3, "e": "%20 aşılırsa istisnadan yararlanılamaz ve kazancın tamamı vergilenir."}, {"q": "KVK m.5/A kapsamında transfer fiyatlandırması raporu süresinde verilmezse ne olur?", "o": ["Yalnızca usulsüzlük cezası kesilir", "O dönem için şirket fonun Türkiye'deki daimi temsilcisi sayılır ve fon kazançları genel hükümlerle vergilenir", "Şirketin yetki belgesi iptal edilir", "Fon kazançlarının yarısı vergilenir", "Hiçbir sonuç doğmaz"], "a": 1, "e": "Rapor KV beyannamesi süresinde GİB'e verilmezse şirket o dönem daimi temsilci sayılır."}, {"q": "Yabancı fonun katılımcı ve kurucuları arasında tam mükellef gerçek kişi veya kurumların kazanç payı hangi oranı geçerse portföy yöneticisi şirket bunları GİB'e bildirmek zorundadır?", "o": ["%10", "%20", "%25", "%1", "%5"], "a": 4, "e": "Tam mükelleflerin kazanç payı %5'i geçerse bildirim zorunludur; bildirilmezse şirket müştereken ve müteselsilen sorumludur."}, {"q": "Hazine'nin yurt dışında ihraç ettiği Eurobondların faizi GVK m.94/7-a'ya göre hangi oranda tevkifata tabidir ve vergi uygulamasında nasıl kabul edilir?", "o": ["%10; tevkifatlı kabul edilir", "%0; tevkifatsız kabul edilir", "%0; tevkifatlı kabul edilir", "%15; nihai vergi", "Tevkifata tabi değildir; beyana tabidir"], "a": 2, "e": "Tevkifat oranı sıfır olarak belirlenmiş kazançlar vergi uygulamasında tevkifatlı kabul edilir."}, {"q": "Tam mükellef gerçek kişinin 2006 sonrası ihraç edilmiş bir Eurobonddan elde ettiği alım-satım kazancı için hangisi doğrudur?", "o": ["İstisna uygulanmaz; endeksleme sonrası kazanç tutarı ne olursa olsun beyan edilir", "Geçici 67 kapsamında %10 stopajla nihai vergilenir", "Geçici 59 istisnası düşülür", "Beyan sınırını aşmazsa beyan edilmez", "Kazanç tümüyle istisnadır"], "a": 0, "e": "2006 sonrası ihraçlarda Geçici 59 ve mük. 80 istisnaları uygulanmaz; kazanç tutarı ne olursa olsun beyan edilir."}, {"q": "Geçici 59. madde istisnası hangi tarihler arasında ihraç edilen DT ve HB'leri kapsıyordu?", "o": ["01.01.2001 - 31.12.2005", "26.07.2001 - 31.12.2007", "01.01.2006 - 31.12.2007", "26.07.2001 - 31.12.2005", "26.07.2000 - 31.12.2004"], "a": 3, "e": "Geçici 59, 31.12.2007'ye kadar uygulanmak üzere 26.07.2001 - 31.12.2005 arasında ihraç edilen DT ve HB gelirlerini kapsıyordu."}, {"q": "Dar mükellef gerçek kişilerin Hazine Eurobondlarından elde ettiği faiz gelirleri için hangisi doğrudur?", "o": ["15 gün içinde münferit beyanname ile beyan edilir", "Tevkif yoluyla vergilenmiş sayıldığından tutarı ne olursa olsun beyan edilmez", "Beyan sınırını aşarsa beyan edilir", "%10 stopaja tabidir", "Yarısı beyan edilir"], "a": 1, "e": "GVK m.86/2 uyarınca tamamı Türkiye'de tevkif yoluyla vergilenmiş MSİ için dar mükellef beyanname vermez."}, {"q": "Bir yatırımcının 2.500 adet darphane sertifikası vardır. Bu sertifikalar kaç gram altını temsil eder?", "o": ["2,5 gram", "250 gram", "24,875 gram", "2.500 gram", "25 gram"], "a": 4, "e": "Her sertifika 0,995 saflıkta 0,01 gram altını temsil eder: 2.500 x 0,01 = 25 gram."}, {"q": "Darphane sertifikalarından elde edilen kazançlarda stopaj oranı ve dayanak hangisidir?", "o": ["%10, 6036 sayılı CK", "%0, 2010/926 sayılı BKK", "%0, 6036 sayılı CK", "%15, VII-128.3 Tebliğ", "%17,5, 10041 sayılı CK"], "a": 2, "e": "15.09.2022 tarihli 6036 sayılı CK ile oran %0'dır; ihtiyari beyanda da %0 vergi hesaplanır."}, {"q": "01.01.2006'dan önce ihraç edilmiş bir devlet tahvilini 2006'dan sonra satın alan kişinin bu tahvilden elde ettiği gelir için hangisi doğrudur?", "o": ["Geçici 67 uygulanmaz; 31.12.2005 hükümleriyle vergilenir", "İktisap 2006'dan sonra olduğu için Geçici 67 uygulanır", "%10 stopajla nihai vergilenir", "Gelir tümüyle istisnadır", "Yalnızca faiz geliri Geçici 67'ye tabidir"], "a": 0, "e": "Fıkra 9'da ihraç tarihi belirleyicidir; iktisap tarihi önemsizdir."}, {"q": "Kitabın 2.12.1.10 bölümüne göre ÇVÖA'dan yararlanmak isteyen dar mükellef gerçek kişinin ibraz ettiği bir takvim yılına ait mukimlik belgesi ne zamana kadar geçerlidir?", "o": ["Düzenlendiği yılın sonuna kadar", "İzleyen yılın ilk üç ayı sonuna kadar", "Süresiz", "İzleyen yılın dördüncü ayına kadar", "Düzenlendiği tarihten itibaren 6 ay"], "a": 3, "e": "2.12.1.10'a göre bir takvim yılına ilişkin mukimlik belgesi izleyen yılın dördüncü ayına kadar geçerlidir; gerçek kişide her yıl yenilenir. Dikkat: kitabın giriş bölümüne göre dar mükellef kurumlarda yenileme 3 yılda birdir."}, {"q": "Mukimlik belgesini tevkifattan önce ibraz etmeyen dar mükellef için hangisi doğrudur?", "o": ["İşlem yapamaz", "ÇVÖA dikkate alınmadan iç mevzuattaki oranla tevkifat yapılır; belge sonradan ibraz edilerek iade istenebilir", "%0 tevkifat yapılır", "Anlaşma oranı otomatik uygulanır", "Fazla kesinti iade edilmez"], "a": 1, "e": "Belge tevkifattan önce verilmezse anlaşma dikkate alınmadan tevkifat yapılır (kitap 2.12'de %15 der); sonradan belgeyle yersiz kesintinin iadesi istenir ve iade tevkifatı yapan kurum adına yapılır."}, {"q": "Bir MKYF'nin I. kısım portföyü 4.500.000 TL, II. kısım portföyü 1.500.000 TL'dir. Dönemde 40.000 TL fon yönetim ücreti ödenmiştir. I. kısma yüklenecek genel gider kaç TL'dir?", "o": ["10.000 TL", "20.000 TL", "40.000 TL", "33.750 TL", "30.000 TL"], "a": 4, "e": "I. kısmın ağırlığı 4.500.000 / 6.000.000 = %75; 40.000 x 0,75 = 30.000 TL."}, {"q": "Tam mükellef bir gerçek kişi 2010'da ihraç edilmiş bir Hazine Eurobondunu 10.000 USD'ye (kur 30 TL) almış, 10.400 USD'ye (kur 33 TL) satmış ve 1.200 TL alım-satım gideri ödemiştir. Endeksleme şartı oluşmamıştır. Beyan edilecek kazanç kaç TL'dir?", "o": ["43.200 TL", "13.200 TL", "42.000 TL", "12.000 TL", "30.000 TL"], "a": 2, "e": "Satış 10.400 x 33 = 343.200; alış 10.000 x 30 = 300.000; gider 1.200. Kazanç 42.000 TL; 2006 sonrası ihraçta istisna yok, tutarı ne olursa olsun beyan edilir."}, {"q": "Bir yatırım ortaklığının 2006 öncesi kıymetlerinden doğan portföy kazançlarından 115.000 TL'si en az %25'i hisse olan (A tipi) kısımdan, 235.000 TL'si B tipi kısımdan gelmiştir. GVK m.94'e göre toplam tevkifat kaç TL'dir?", "o": ["23.500 TL", "35.000 TL", "11.500 TL", "52.500 TL", "0 TL"], "a": 0, "e": "A tipi %0, B tipi %10: 235.000 x 0,10 = 23.500 TL."}, {"q": "Bir MKYF'nin 2006 yılı portföy kazançlarından 100.000 TL'si 01.01 - 22.07.2006, 50.000 TL'si 23.07 - 30.09.2006, 80.000 TL'si 01.10.2006 sonrası döneme isabet etmektedir. Kıst dönem oranlarıyla toplam tevkifat kaç TL'dir?", "o": ["23.000 TL", "34.500 TL", "15.000 TL", "20.000 TL", "28.000 TL"], "a": 3, "e": "100.000 x %15 = 15.000; 50.000 x %10 = 5.000; 80.000 x %0 = 0. Toplam 20.000 TL."}]}];
const P={"1": ["Merhaba, Kurumlarda ve Sermaye Piyasasında Vergilendirme dersinin ilk bölümündeyiz. Bugün işin temeline iniyoruz. Vergi sistemi nasıl kurulmuş, mükellef kimdir, vergi nasıl doğar ve nasıl tahsil edilir, bunları konuşacağız. Sonra cezalar ve zamanaşımı ile bitireceğiz. Bu bölüm sınavda kavram ve süre sorusu olarak çok geliyor.", "Şöyle başlayalım. Türkiye'de vergi dört kaynaktan alınıyor. Gelir, harcama, servet ve servet transferi. Gelir vergilerinde temel ilke yıllık safi kazancın beyan edilmesi. Ama bazı gelirlerde kaynakta kesinti yapılıyor ve bu kesinti son vergi oluyor. Buna tevkifat ya da stopaj diyoruz.", "Burada Gelir Vergisi Kanunu geçici altmış yedinci maddeyi hatırla. İki bin altı başında yürürlüğe girdi. Bazı finansal araç gelirlerine yüzde sıfır, yüzde on ve yüzde on beş oranlı stopaj getirdi. Süresi bir Cumhurbaşkanı Kararıyla iki bin otuz yılının sonuna kadar uzatıldı. Kitabın bazı bölümlerinde eski bitiş tarihleri de geçiyor, sen güncel kararı esas al. Dikkat et, bu madde herkes için son vergi değil ve bütün araçları kapsamıyor.", "Gelir vergisi tarifesi artan oranlı. İki bin yirmi altı için ilk dilim yüz doksan bin liraya kadar yüzde on beş. Sonra yüzde yirmi, yüzde yirmi yedi, yüzde otuz beş ve en üstte yüzde kırk geliyor. Ücretlilerde oranlar aynı, sadece dilim sınırları farklı. Mesela altı yüz bin lira ücret dışı gelirde vergi yüz yirmi dört bin beş yüz lira çıkıyor.", "Anayasa'nın yetmiş üçüncü maddesi bu dersin anayasası gibi. Herkes mali gücüne göre vergi öder. Vergi ancak kanunla konur, değiştirilir ya da kaldırılır. Ama oranlar, istisnalar ve indirimlerde kanunun koyduğu alt ve üst sınırlar içinde değişiklik yetkisi Cumhurbaşkanına verilebilir. Sınavda Bakanlık ya da Gelir İdaresi şıkkı görürsen ele.", "Bir de yatay ve dikey adalet var. Aynı durumdaki iki kişiye aynı vergi yatay adalet. Kurumlar vergisi oranının herkese aynı olması buna örnek. Çok kazananın çok, az kazananın az ödemesi dikey adalet. Artan oranlı gelir vergisi tarifesi de bunun örneği.", "Şimdi kavramlara geçelim. Matrah, verginin üzerinden hesaplandığı değer. Mükellef, vergi borcu yüklenen kişi, yani gelirin gerçek sahibi. Vergi sorumlusu ise vergi dairesine karşı ödemeden muhatap olan kişi.", "Burada dur bir saniye, çünkü vergi ehliyeti sorusu çok çıkıyor. Medeni hakları kullanma ehliyeti gerekmez. Anne karnındaki bebek bile sağ doğarsa mükellef olabilir.", "Muafiyet ile istisnayı karıştırma. Muafiyet kişiye uygulanır, yani mükellefiyeti kaldırır. İstisna ise bir işleme ya da gelire uygulanır. Tamamen, belli bir tutarda ya da oransal olabilir. Kısa bir hafıza ipucu, muaf olan kişidir, istisna olan gelirdir.", "Vergilendirme süreci dört adım. Tarh, tebliğ, tahakkuk ve tahsil, ilk üçü Vergi Usul Kanunu kapsamında yürür. Ödeme yapılmazsa tahsil aşaması Amme Alacaklarının Tahsil Usulü Hakkında Kanun ile devam eder. Tarh türlerini de bil, beyana dayalı, ikmalen, re'sen ve idarece tarh. Matrah belgelerle bulunamıyorsa re'sen tarh yapılır ve yetki ilke olarak takdir komisyonundadır.", "Tahakkuk sorusu klasik bir tuzak. Tahakkuk verginin ödenebilir hale gelmesi. Bir idari işlem değil, bu yüzden dava konusu edilemez. Mükellef dava açmazsa ya da açtığı dava reddedilirse vergi tahakkuk eder.", "Gelelim tam ve dar mükellefiyete. Ayrım yerleşme esasına dayanıyor. Tam mükellef dünya çapındaki kazancından, dar mükellef sadece Türkiye'deki kazancından vergilenir. Gerçek kişi ikametgâhı Türkiye'deyse ya da bir takvim yılında altı aydan fazla burada oturuyorsa yerleşmiş sayılır. Tedavi, tahsil ya da seyahat için gelen yabancı ise altı ayı geçse de yerleşmiş sayılmaz.", "Kurumlarda iki merkez var, kanuni merkez ve iş merkezi. Birinin Türkiye'de olması tam mükellefiyet için yeterli. Şöyle düşün, bir yatırımcı Bahama'da şirket kuruyor ama bütün kararları Üsküdar'daki evinden veriyor. İş merkezi Türkiye'de olduğu için şirket tam mükellef. Dar mükellef savunması tutmaz.", "Dar mükellefler Türk sermaye piyasasına yatırım yapacaksa vergi kimlik numarası alır. Çifte vergilendirmeyi önleme anlaşmasından yararlanmak için de mukimlik belgesi verir. Bu belgeyi tevkifattan önce vermek gerekiyor.", "Geç verilirse önce normal kesinti yapılır, sonra fazlası iade istenir. Yenileme süresini ezberle. Gerçek kişide her yıl, kurumda üç yılda bir. Anlaşma yoksa kurum için kuruluş belgesi yeterli.", "Beyanname türleri de soruluyor. Yıllık beyanname gelirlerin toplanması için. Muhtasar, kesinti yapanların kestiklerini bildirmesi için. Münferit, dar mükellef gerçek kişiler için. Özel beyanname ise dar mükellef kurumların bazı diğer kazançları için ve on beş gün içinde veriliyor.", "Gelir unsurları yedi tane. Ticari kazanç, zirai kazanç, ücret, serbest meslek kazancı, gayrimenkul sermaye iradı, menkul sermaye iradı ve diğer kazanç ve iratlar. Bunların dışında kalan gelir vergilenemez. Elde etme ölçütünü de bil. Ticari ve zirai kazançta tahakkuk esası, serbest meslek ve kira gelirinde tahsil, menkul sermaye iradında hukuki ve ekonomik tasarruf.", "Cezalara gelelim. Usulsüzlük cezası şekil kurallarına uymamaktan doğar. Vergi ziyaı cezası ise verginin eksik ya da geç tahakkukundan doğar. Normalde ziyaa uğratılan verginin bir katı, kaçakçılık varsa üç katı. Kendiliğinden geç beyanda bulunursan ceza yarıya iner. Beyan edip ödemediysen ceza yok ama aylık yüzde üç virgül yedi gecikme zammı işler.", "Gecikme faizi ile gecikme zammını karıştırma. Gecikme faizi ikmalen, re'sen ya da idarece tarh edilen vergilere uygulanır ve ay kesirleri dikkate alınmaz. Gecikme zammı ödenmeyen tüm kamu alacaklarına uygulanır, ay kesri için günlük hesaplanır. Cezalara gecikme faizi işlemez, ama ödenmeyen vergi ziyaı cezasına gecikme zammı işler.", "Son konu zamanaşımı. Tarh, tahsil ve düzeltme zamanaşımı beş yıl. Hepsi ilgili yılı izleyen yılın başından başlıyor. Ceza kesmede vergi ziyaı cezası için beş yıl, usulsüzlük için iki yıl, kaçakçılıkta sekiz yıla kadar. Mesela iki bin yirmi altıda doğan vergi alacağı için tarh zamanaşımı iki bin otuz birin sonunda dolar.", "Toparlayalım. Birincisi, Anayasa'ya göre vergi kanunla konur, sınırlar içinde değişiklik yetkisi Cumhurbaşkanında. İkincisi, muafiyet kişiye, istisna işleme uygulanır. Üçüncüsü, kurumda kanuni ya da iş merkezinden biri Türkiye'deyse tam mükellefiyet var. Dördüncüsü, mukimlik belgesi gerçek kişide her yıl, kurumda üç yılda bir yenilenir. Beşincisi, vergi ziyaı cezası bir kat, kaçakçılıkta üç kat, zamanaşımları ise beş yıl, usulsüzlük cezasında iki yıl."], "2": ["Merhaba, ikinci bölümdeyiz. Bugün kurumlar vergisinin kime uygulandığını ve hangi kazançların vergi dışında kaldığını konuşacağız. Bu bölüm istisna dolu. Oranlar ve süreler çok soruluyor, o yüzden sana bol sayı vereceğim ama hepsini bir mantığa bağlayacağız.", "Önce mükellefler. Sermaye şirketleri, kooperatifler, iktisadi kamu kuruluşları, dernek ve vakıf iktisadi işletmeleri ve iş ortaklıkları. Sermaye şirketi deyince anonim, limited ve sermayesi paylara bölünmüş komandit şirketi anla. Yatırım fonları da sermaye şirketi sayılıyor, ama kazançları istisna. Sınavda kollektif şirket ya da adi komandit şirket görürsen dikkat et. Bunlar kurumlar vergisi mükellefi değil.", "Sermayesi paylara bölünmüş komandit şirkette kazanç ikiye bölünür. Komanditer ortağın payı kurumlar vergisine, komandite ortağın payı ise o ortağın gelir vergisine girer. Kurum kazancı hesaplanırken de ticari kazanç hükümleri uygulanıyor.", "İlk büyük istisna iştirak kazançları. Bir şirket tam mükellef başka bir şirketten kâr payı alıyorsa, bu kâr payı istisna. Çünkü o kazanç ilk şirkette zaten vergilendi.", "Burada dur bir saniye. Oran şartı yok, süre şartı yok. Yüzde bir hisse için bile, bir gün tutsan bile istisna. Ama dağıtan şirket tam mükellef olmalı.", "Fonlardan gelen kâr paylarında bir değişiklik var. On beş Temmuz iki bin yirmi üçten sonra alınan yatırım fonu katılma payları için iştirak istisnası kaldırıldı. Öncesinde alınanlarda devam ediyor. Girişim sermayesi fonu ve ortaklığında ise istisna hâlâ geçerli.", "Yurt dışı iştirak kazancı için şartlar daha sıkı. Şirket anonim ya da limited olacak, en az yüzde on paya sahip olacaksın, en az bir yıl tutacaksın. Kazanç en az yüzde on beş vergi yükü taşıyacak ve beyanname tarihine kadar Türkiye'ye gelecek. Şartlar birlikte aranıyor. Bir tanesi eksikse istisna yok.", "Vergi yükünü hesaplamak kolay. Yurt dışında ödenen vergiyi, vergiden önceki toplam kazanca böl. Mesela bir milyon lira kazançta yüz yirmi bin lira vergi varsa yük yüzde on iki çıkar. Yüzde on beşin altında olduğu için istisna yok.", "Bir de alternatif kural var. En az yüzde elli payın varsa ve kazancı getirirsen yarısı istisna. İki bin yirmi altıdan itibaren en az yüzde yirmi payda bu oran yüzde seksen.", "Yurt dışı iştirak hisselerini satmak ise ayrı bir istisna. Sadece tam mükellef anonim şirketler yararlanıyor. Nakit dışı aktiflerin en az yüzde yetmiş beşi, her birinde en az yüzde on pay olan yurt dışı iştiraklerden oluşmalı. Satılan hisseler en az iki tam yıl, yani yedi yüz otuz gün aktifte kalmalı. Yüzde onun altındaki iştirakler yüzde yetmiş beş hesabına girmiyor, bunu unutma.", "Emisyon primi de istisna. Şirket kendi çıkardığı payı itibari değerin üstünde satarsa aradaki kazanç vergi dışı. Ama portföydeki başka şirket hissesini satarsa bu istisna değil.", "Türkiye'de kurulu fonların ve yatırım ortaklıklarının kazançları istisna. Menkul kıymet, altın, girişim sermayesi, gayrimenkul, emeklilik, konut ve varlık finansmanı fonları bu kapsamda. Ama istisna, bu kazançlardan stopaj alınmasını engellemiyor. Yeni bir şart da var. İki bin yirmi beşten itibaren taşınmaz kazancının en az yarısı, beyanname ayını izleyen ikinci ayın sonuna kadar dağıtılmalı. Emeklilik fonları hariç.", "Bu dağıtım şartında tuzaklar var. Kanuni yedek akçe düşülebilir, kalanın yarısı dağıtılır. Kârı sermayeye eklemek dağıtım sayılmaz. Şart sağlanmazsa sadece taşınmaz geliri değil, tüm gelirler için istisna gider. Süre geçtikten sonra dağıtmak da kurtarmaz.", "Şimdi satış kazancı istisnasına gelelim. En az iki tam yıl aktifte tutulan iştirak hisseleri, kurucu senetleri, intifa senetleri ve rüçhan haklarında kanuni oran yüzde yetmiş beş. Ama bir Cumhurbaşkanı Kararıyla yüzde elliye indirildi. Taşınmazda ise on beş Temmuz iki bin yirmi üçten önce alınanlar için yüzde yirmi beş, sonrası için hiç istisna yok.", "Bu istisnanın iki süresi var, karıştırma. İstisna tutarı beş yıl özel fon hesabında bekler. Satış bedeli ise satışı izleyen ikinci takvim yılının sonuna kadar tahsil edilmeli. Tahsil edilmeyen kısma düşen istisna yanar. Menkul kıymet ya da taşınmaz ticareti yapan şirketler bu istisnadan yararlanamaz.", "Sat kirala geri al ve varlık kiralama işlemlerinde de istisna var. Şirket varlığını kira sertifikası ihracı için varlık kiralama şirketine satıp sonra geri alırsa kazanç vergilenmez. İşlem tamamlanmazsa vergi, ceza olmadan, gecikme faiziyle alınır. Kanuni takipteki borcu için bankaya varlık devreden şirketin kazancı ise tamamen istisna.", "İstanbul Finans Merkezi teşviklerini de bil. Finansal hizmet ihracatı kazancı iki bin yirmi iki ile iki bin kırk yedi arasında tamamen indiriliyor. Transit ticaret kazancı iki bin yirmi altıdan itibaren yüzde yüz indiriliyor. Personel ücretinde yurt dışında beş yıl tecrübe varsa yüzde altmış, on yıl varsa yüzde seksen istisna. Ama son üç yılda Türkiye'de çalışmamış olmalı.", "Yabancı fonlar için de özel bir kural var. Yabancı fon Türkiye'deki yetkili bir portföy yönetim şirketiyle çalışırsa, bu şirket fonun daimi temsilcisi sayılmaz. Şartlardan biri, portföy yöneticisinin fon kazancında yüzde yirmiden fazla hakkı olmaması. Transfer fiyatlandırması raporu da süresinde verilmeli. Rapor gecikirse yönetici o yıl için daimi temsilci sayılır.", "Sınai mülkiyet istisnasında patentli buluş kazancının yarısı istisna. Gelir vergisi mükelleflerine de uygulanıyor. Ama teknoloji geliştirme bölgesi istisnasıyla birlikte kullanılamıyor. Son olarak kâr payı stopajı. Gerçek kişilere dağıtılan kâr payında oran şu an yüzde on beş.", "Toparlayalım. Birincisi, kollektif ve adi komandit şirket kurumlar vergisi mükellefi değil. İkincisi, yurt içi iştirak kazancında oran ve süre şartı yok. Üçüncüsü, yurt dışı iştirakte yüzde on pay, bir yıl, yüzde on beş vergi yükü ve transfer şartı var. Dördüncüsü, iştirak hissesi satışında oran yüzde elli, eski taşınmazda yüzde yirmi beş. Beşincisi, fonlar taşınmaz kazancının yarısını dağıtmazsa istisnayı tamamen kaybeder."], "3": ["Merhaba, üçüncü bölümdeyiz. Bugün kurum kazancından vergiye nasıl ulaşıldığını konuşacağız. Önce oranlar, sonra indirimler, indirilecek ve indirilemeyecek giderler, zarar mahsubu ve en sonda beyan. Bu bölümde hesap sorusu çok çıkıyor, kalemleri iyi otur.", "Kurumlar vergisi oranı yıllar içinde çok değişti. İki bin on yediye kadar yüzde yirmi idi. Sonra yüzde yirmi ikiye, yüzde yirmi beşe, yüzde yirmi üçe çıktı indi. Bugün geçerli olanı bil yeter. Genel oran yüzde yirmi beş. Bankalar, sigorta şirketleri ve sermaye piyasası kurumları gibi finans sektörü için yüzde otuz.", "Şimdi indirimli oranlar. Payları ilk kez borsada işlem görmek üzere en az yüzde yirmi oranında halka arz edilen şirket, beş hesap dönemi boyunca oranı iki puan düşük öder. Finans sektörü bundan yararlanamaz. Şart kaybedilirse eksik vergi alınır ama vergi ziyaı cezası kesilmez, sadece gecikme faizi işler.", "İhracat kazancına beş puan indirim var. Bunlar üst üste binebilir. Yeni halka arz olmuş, ihracat yapan bir şirket düşün. Yüzde yirmi beşten iki puan, sonra beş puan düşersin, yüzde on sekize inersin. Sanayi sicil belgeli üretim kazancında ise oran doğrudan yüzde on iki virgül beş. Bu kazanca ihracat indirimi ayrıca uygulanmıyor.", "Geçici vergi de sınavda sık çıkıyor. Yılda dört kez, üçer aylık dönemler halinde ödeniyor. Beyan ve ödeme, dönemi izleyen ikinci ayın on yedisi. Yani on yedi Mayıs, on yedi Ağustos, on yedi Kasım ve on yedi Şubat. Ödenen geçici vergi yıllık vergiden düşülür.", "Yıllık kurumlar vergisi beyannamesi ise hesap dönemini izleyen dördüncü ayın son günü verilir. Takvim yılı kullanan şirket için Nisan sonu. Vergi de aynı ayın sonuna kadar ödenir. Özel hesap dönemi Haziran'da biten bir şirket düşün, onun beyanı Ekim sonuna kadar.", "Gelelim kurum kazancından yapılan indirimlere. Bağışta temel sınır kurum kazancının yüzde beşi. Kamu idarelerine, kamu yararına derneklere yapılan bağışlar bu sınıra tabi. Ama okul, sağlık tesisi, Kızılay, Yeşilay, Darülaceze ya da Cumhurbaşkanınca başlatılan kampanyalara bağışın tamamı indirilir. Sponsorlukta amatör sporun tamamı, profesyonel sporun yarısı indirilir.", "Girişim sermayesi fonu için ayrılan tutar, beyan edilen gelirin yüzde onuna kadar indiriliyor. Yurt dışına verilen hizmetlerin kazancında kanuni oran yüzde seksen, bir Cumhurbaşkanı Kararıyla yüzde yüze çıkarıldı. Korumalı işyerinde engelli çalışan ücretinin tamamı indiriliyor. Ama çalışan başına en fazla beş yıl ve yıllık brüt asgari ücretin bir buçuk katıyla sınırlı.", "Nakdi sermaye artışı indirimi ayrıca önemli, çünkü hesap sorusu çıkıyor. Formülü şöyle anlatayım. Artış tutarını Merkez Bankası ticari kredi faiziyle çarp, sonra indirim oranıyla çarp, en son da yılın kalan süresiyle çarp. İndirim oranı genelde yüzde elli. Yurt dışından getirilen parayla yapılan artışta yüzde yetmiş beş.", "Halka açık şirketlerde bu orana ek yapılıyor. Borsada işlem görebilir pay oranı yüzde elli ve altındaysa yirmi beş puan, yüzde ellinin üstündeyse elli puan eklenir. Mesela on milyon liralık artışta faiz yüzde kırk, süre altı ay ise normal şirket bir milyon lira indirir. Halka açıklığı yüzde altmış olan şirket iki milyon lira indirir. Finans sektörü ve kamu iktisadi teşebbüsleri bu indirimden yararlanamaz.", "Bu indirim beş hesap dönemi boyunca ayrı ayrı uygulanıyor. Kazanç yetmezse kullanılamayan tutar süre sınırı olmadan, endekslenmeden sonraki yıllara taşınıyor. Burada sınavda yanlış şık olarak beş yıl sınırı verilebilir, dikkat et.", "İndirilecek giderler kısa bir liste. Menkul kıymet ihraç giderleri, kuruluş giderleri, genel kurul, birleşme ve tasfiye giderleri, komandite ortağın kâr payı, katılım bankalarının ödediği kâr payları ve sigorta şirketlerinin teknik karşılıkları. Kazanılmamış prim karşılığında gün esası uygulanamıyorsa sekizde bir yöntemi kullanılabiliyor.", "Kanunen kabul edilmeyen indirimler daha çok soruluyor. Öz sermayeye faiz, örtülü sermayeye faiz, transfer fiyatlandırmasıyla örtülü dağıtılan kazanç, yedek akçeler, kurumlar vergisinin kendisi, cezalar, gecikme zammı ve gecikme faizi. Bir de suçtan doğan tazminatlar. Ama sözleşmedeki ceza şartı tazminatı bu yasağa girmez, burası tuzak.", "Alkol ve tütün reklamlarının yarısı gider yazılamıyor. Finansman gider kısıtlaması da önemli. Yabancı kaynağı öz kaynağını aşan şirkette, aşan kısma düşen finansman giderlerinin yüzde onu gider yazılmaz. Mesela yabancı kaynak elli, öz kaynak otuz milyon ise aşan kısım yüzde kırk. Sekiz milyon lira faizin yüzde kırkı üç virgül iki milyon, bunun yüzde onu üç yüz yirmi bin lira kabul edilmez.", "Zarar mahsubunda kural basit. Geçmiş yıl zararları beş yıl taşınabilir. Devralınan şirketin zararları için iki ek şart var. Son beş yılın beyannameleri süresinde verilmiş olacak ve devralınan faaliyet en az beş yıl sürdürülecek. Yurt dışı zararlar da beş yıl taşınır, ama o ülkede denetim raporuna bağlanması gerekiyor.", "Son konu dar mükellef kurumlar. Türkiye'de iş yeri ya da daimi temsilcisi aracılığıyla ticari kazanç elde eden yabancı kurum, tam mükellef gibi vergilenir. İş yeri olmadan menkul sermaye iradı ya da değer artışı kazancı elde eden ise gelir vergisi hükümlerine göre vergilenir. Ama bu kurumların değer artışı kazancında gelir vergisindeki istisna ve süre şartları dikkate alınmaz.", "Toparlayalım. Birincisi, genel kurumlar vergisi oranı yüzde yirmi beş, sermaye piyasası kurumları için yüzde otuz. İkincisi, halka arzda iki puan, ihracatta beş puan indirim var, üretim kazancında oran yüzde on iki virgül beş. Üçüncüsü, beyanname dördüncü ayın son günü, geçici vergi ikinci ayın on yedisi. Dördüncüsü, bağışta sınır yüzde beş, nakdi sermaye indiriminde temel oran yüzde elli. Beşincisi, zararlar beş yıl taşınır."], "4": ["Merhaba, dördüncü bölümdeyiz. Bugün dört konu konuşacağız. Türev ürünlerden kazancın ne zaman vergilendiği, birleşme ve bölünme, örtülü sermaye ve transfer fiyatlandırması, en son da sermaye azaltımında vergileme. Hesap soruları bu bölümde yoğun, örneklerle gideceğiz.", "Türevde ana kural şu. Forward ve swap birer taahhüt. Vadeye kadar yapılan değerlemeler kurum kazancını etkilemez. Kâr ya da zarar vadede tanınır. Sözleşme vadeden önce bozulursa bozulma tarihinde.", "Mesela beş yüz bin dolarlık forwardda sözleşme kuru otuz dört virgül seksen, vadede kur otuz beş virgül kırk olsun. Altmış kuruşluk fark beş yüz binle çarpılır, üç yüz bin lira kazanç vadede kayda girer.", "Opsiyon priminde iki taraf farklı davranır. Hakkı satan taraf primi sözleşme tarihinde gelir yazar, çünkü tahakkuk esası geçerli. Hakkı alan taraf ise primi hakkı kullandığı ya da sözleşme sona erdiği tarihte gider yazar. Vadeli İşlem ve Opsiyon Piyasasında ise durum farklı. Orada pozisyonlar borsa rayiciyle, yani uzlaşma fiyatıyla değerlenir ve fark kazanca girer.", "Dar mükellef yabancı kurumlarda kesinti meselesi sınavın sevdiği bir yer. İş yeri yoksa forward, para swapı, tezgâh üstü opsiyon ve varant kazancı ticari kazanç sayılır, kesinti yapılmaz. Tek istisna faiz swapı. Faiz swapı kazancı alacak faizi sayılır ve kesintiye tabi. Vadeli işlem piyasası kazançları ise geçici altmış yedinci madde kapsamında zaten kesintiye tabi.", "Şimdi birleşme ve bölünme. Birleşme, kapanan şirket için tasfiye gibidir. Ama tasfiye kârı yerine birleşme kârı vergilenir. Şirketlerin merkezi Türkiye'de olur ve bilanço değerleri bir bütün halinde devralınırsa bu birleşme devir sayılır ve vergisiz olur.", "Bölünmenin iki türü var. Tam bölünmede şirket tasfiyesiz kapanır ve her şeyini en az iki şirkete devreder. Kısmi bölünmede ise en az iki tam yıl tutulan iştirak hisselerini ya da bir üretim veya hizmet işletmesini devreder. Hisse değişiminde bir şirket diğerinin yönetimini ve çoğunluğunu alır. Tam bölünme ve hisse değişiminde ortaklara itibari değerin yüzde onuna kadar nakit ödenebilir. Taşınmazlar iki bin yirmi dörtten itibaren vergisiz kısmi bölünmeye konu edilemiyor.", "Örtülü sermayeye geçelim. Şöyle düşün. Bir şirket sermaye koymak yerine ortağından borç alıyor ve faizini gider yazıyor. Kanun buna sınır koyuyor. Ortaktan ya da ortakla ilişkili kişiden alınan borcun, dönem başı öz sermayenin üç katını aşan kısmı örtülü sermaye sayılır.", "Öz sermaye Vergi Usul Kanununa göre hesaplanır. Mevcutlar artı alacaklar, eksi borçlar. Dönem başı değer esas alınır. Öz sermaye sıfır ya da negatifse ortaktan alınan borcun tamamı örtülü sermaye olur. Ortak bir bankadan alınan borç ise hesaba yarı oranında girer.", "Bazı borçlar hiç hesaba girmez, bunu sınavda soruyorlar. Ortağın gayrinakdi teminatıyla üçüncü kişiden alınan kredi. Grup şirketinin bankadan alıp aynı faiz ve vadeyle kullandırdığı kredi. Bankaların kendi borçlanmaları. Ama nakdi teminatla alınan kredi hesaba girer, burası tuzak.", "Bir örnek yapalım. Öz sermaye iki yüz bin lira. Ortaktan beş yüz bin, ortak bankadan altı yüz bin, ortağın arsası teminatıyla dört yüz bin borç alınmış. Arsalı kredi hesaba girmez. Banka borcunun yarısı, yani üç yüz bin girer. Toplam sekiz yüz bin.", "Sınır öz sermayenin üç katı, yani altı yüz bin. Aşan iki yüz bin lira örtülü sermaye. Bu kısmın faizi gider yazılamaz ve dönem sonunda dağıtılmış kâr payı sayılır.", "Transfer fiyatlandırmasında konu ilişkili kişilerle emsale aykırı fiyat. İlişki için en az yüzde on ortaklık ya da oy hakkı aranıyor. Cumhurbaşkanı bu oranı yüzde bire indirebilir, yüzde yirmi beşe çıkarabilir. Ortakların eşleri, çocukları, üçüncü dereceye kadar akrabaları da ilişkili sayılıyor.", "Yöntemleri ikiye ayır. Geleneksel olanlar karşılaştırılabilir fiyat, maliyet artı ve yeniden satış fiyatı. İşlemsel kâr yöntemleri ise net kâr marjı ve kâr bölüşüm. Önce iç emsale, yani şirketin kendi ilişkisiz işlemlerine bakılır. Peşin fiyatlandırma anlaşmasıyla yöntem en fazla üç yıl için kesinleştirilebilir.", "Yeniden satış fiyatı yöntemine küçük bir örnek. Dağıtıcı makineyi üç yüz otuz bin liraya satıyor. Bir virgül ona bölersen üç yüz bin çıkar. Dağıtıcının üstlendiği on beş bin liralık reklam ve garanti maliyetini de düşersen emsal alış fiyatı iki yüz seksen beş bin lira olur.", "Gelelim sermaye azaltımına. Sermayenin içinde üç tür unsur var. Birincisi çekilince hem kurumlar vergisi hem stopaj doğuran kalemler, mesela enflasyon düzeltmesi farkı. İkincisi sadece stopaj doğuranlar, mesela geçmiş yıl kârı. Üçüncüsü nakdi ya da ayni sermaye, bunlar vergisiz.", "Kritik süre beş tam yıl. Unsurlar sermayeye eklendikten sonra beş tam yıl geçmişse azaltım oransal yapılır. Beş yıl dolmadan azaltımda ise önce birinci grup, sonra ikinci grup, en son nakdi sermaye azaltılmış sayılır. Yani vergi idaresi önce en çok vergi doğuranı alır. Karma durumda önce beş yılı dolmamış unsurlar azaltılmış kabul edilir.", "Bir örnekle oturtalım. İki milyonluk sermayenin yüzde altmışı nakdi, yüzde yirmi beşi enflasyon farkı, yüzde on beşi geçmiş yıl kârı. Altı yıl sonra sekiz yüz bin azaltım yapılırsa iki yüz bin enflasyon farkından gelir. Yüzde yirmi beşten elli bin kurumlar vergisi çıkar. Kalan yüz elli bin üzerinden stopaj hesaplanır. Bir de unutma, geçmiş yıl zararını kapatmak için yapılan azaltımda stopaj yok.", "Son olarak kendi payını geri alan şirketler. Payları borsada işlem gören şirkette oran yüzde sıfır. Borsada işlem görmeyen şirketin yedi Temmuz iki bin yirmi üçten sonra aldığı kendi paylarında oran yüzde on beş.", "Toparlayalım. Birincisi, forward ve swapta kâr vadede tanınır, borsadaki vadeli işlemler ise borsa rayiciyle değerlenir. İkincisi, dar mükellefte kesinti sadece faiz swapında yapılır. Üçüncüsü, tam bölünme ve hisse değişiminde yüzde on nakit sınırı var. Dördüncüsü, örtülü sermaye öz sermayenin üç katını aşan kısımdır ve or
