ymet 200.000 TL'ye alınıp 260.000 TL'ye satılmış, 2.000 TL satış komisyonu ödenmiştir. Elden çıkarıldığı ay hariç ÜFE artışı %8 ise olağan rejimde DAK kaç TL'dir?", "o": ["42.000 TL", "44.000 TL", "58.000 TL", "60.000 TL", "28.000 TL"], "a": 2, "e": "2005 sonrası ihraçlarda endeksleme için artışın %10 veya üzerinde olması gerekir; %8'de endeksleme yapılmaz: 260.000 - 200.000 - 2.000 = 58.000 TL."}, {"q": "ÜFE endekslemesinde aşağıdakilerden hangisi doğrudur?", "o": ["Maliyet, elden çıkarıldığı ay hariç olmak üzere ÜFE artışıyla güncellenir", "Maliyet, alış ayı hariç satış ayı dahil endekslenir", "TÜFE kullanılır", "2005 sonrası ihraçlarda artış %5'i aşarsa endeksleme yapılır", "Satış bedeli ÜFE ile indirgenir"], "a": 0, "e": "Satın alma bedeli, elden çıkarıldığı ay hariç TÜİK aylık ÜFE ile artırılır; 31.12.2005 sonrası ihraçlarda artış %10 veya üzerinde olmalıdır."}, {"q": "Elden çıkarma tarihine kadar ÜFE artışı tam %10 olan, 2010 ihraçlı bir menkul kıymetin olağan rejimdeki satışında endeksleme için doğru ifade hangisidir?", "o": ["Endeksleme yapılamaz, artış %10'u aşmalıdır", "Endeksleme yalnızca 2006 öncesi ihraçlarda yapılır", "Endeksleme TÜFE ile yapılır", "Endeksleme yapılabilir, çünkü şart artışın %10 veya üzerinde olmasıdır", "Endeksleme yalnızca hisse senetlerinde yapılır"], "a": 3, "e": "Kitapta şart 'artış oranının %10 veya üzerinde olması' olarak geçer; tam %10 şartı sağlar."}, {"q": "Bir gerçek kişi aynı yıl A hisse senedinin alım-satımından 50.000 TL kâr, B tahvilinin alım-satımından 20.000 TL zarar etmiş ve C şirketinden 30.000 TL kâr payı almıştır (olağan rejim). Mahsup sonrası DAK ve MSİ tutarları nedir?", "o": ["DAK 30.000 TL, MSİ 10.000 TL", "DAK 30.000 TL, MSİ 30.000 TL", "DAK 50.000 TL, MSİ 10.000 TL", "DAK 0, MSİ 60.000 TL", "DAK 50.000 TL, MSİ 30.000 TL"], "a": 1, "e": "DAK kendi içinde netleşir: 50.000 - 20.000 = 30.000. Diğer kazanç ve iratlardaki zarar MSİ'ye mahsup edilemez; MSİ 30.000 olarak kalır."}, {"q": "Geçici 67 kapsamındaki DAK rejimi için aşağıdakilerden hangisi yanlıştır?", "o": ["Stopaj bazı mükellefler için nihai vergidir", "Beyanname verilmesi gerekmez", "Zarar mahsubu sistemi değişmiştir", "İndirilebilecek giderler bakımından farklar vardır", "Maliyet bedeline ÜFE endekslemesi uygulanır"], "a": 4, "e": "Geçici 67 rejiminde ÜFE endekslemesi uygulanmaz; diğer ifadeler doğrudur."}, {"q": "Kitabın girişine göre 10680 sayılı Cumhurbaşkanı Kararı (RG 11.12.2025) ile Geçici 67 nci maddenin yürürlük süresi hangi tarihe kadar uzatılmıştır?", "o": ["31.12.2027", "31.12.2028", "31.12.2030", "31.12.2035", "31.12.2032"], "a": 2, "e": "Giriş bölümüne göre 10680 sayılı CK ile süre 31.12.2030'a uzatılmıştır. Dikkat: kitabın 2.3.6 bölümünde eski '31.12.2016' ve '2025'e kadar' ifadeleri de geçer; güncel karar esas alınmalıdır."}, {"q": "Geçici 67 rejiminde stopajın uygulanmasından vergi idaresine karşı kural olarak kim sorumludur?", "o": ["İşleme aracılık eden banka ve aracı kurumlar", "Menkul kıymeti ihraç eden şirket", "Yatırımcının kendisi", "Merkezi Kayıt Kuruluşu", "Sermaye Piyasası Kurulu"], "a": 0, "e": "Sistemin temeli, işleme aracılık eden banka ve aracı kurumların stopajı yapması ve bundan sorumlu olmasıdır."}, {"q": "Aşağıdaki gelirlerden hangisi kaynağına bakılmaksızın MSİ sayılanlar arasında değildir?", "o": ["KZOB karşılığı ödenen kâr payı", "Faizsiz kredi verenlere ödenen kâr payı", "Mevduat faizi", "Hisse senedinin borsada satışından doğan kazanç", "Repo geliri"], "a": 3, "e": "Hisse satış kazancı elden çıkarma kazancıdır (DAK); diğerleri GVK m.75'te MSİ olarak sayılmıştır."}, {"q": "Olağan rejime tabi bir menkul kıymet 120.000 TL'ye alınmış ve 180.000 TL'ye satılmıştır. Satıcı 1.500 TL komisyon ve 500 TL harç ödemiştir; elden çıkarıldığı ay hariç ÜFE artışı %20'dir (2005 sonrası ihraç). Vergilendirilecek kazanç kaç TL'dir?", "o": ["36.000 TL", "34.000 TL", "58.000 TL", "35.500 TL", "60.000 TL"], "a": 1, "e": "Endeksli maliyet 120.000 x 1,20 = 144.000. Kazanç = 180.000 - 144.000 - 1.500 - 500 = 34.000 TL."}, {"q": "Bir gerçek kişinin olağan rejime tabi üç alım-satım işleminden sonuçları şöyledir: X hissesi +40.000 TL, Y tahvili -25.000 TL, Z hissesi +10.000 TL. DAK'ın kendi içinde mahsubu sonrası net tutar kaç TL'dir?", "o": ["50.000 TL", "75.000 TL", "15.000 TL", "40.000 TL", "25.000 TL"], "a": 4, "e": "DAK kendi içinde mahsup edilir: 40.000 + 10.000 - 25.000 = 25.000 TL."}, {"q": "Maliyet bedeli 75.000 TL olan ve 2008'de ihraç edilmiş bir menkul kıymetin elden çıkarıldığı ay hariç ÜFE artışı %12'dir. Endekslenmiş maliyet kaç TL'dir?", "o": ["75.000 TL", "83.250 TL", "84.000 TL", "90.000 TL", "66.000 TL"], "a": 2, "e": "Artış %10'u aştığı için endeksleme yapılır: 75.000 x 1,12 = 84.000 TL."}, {"q": "Tam mükellef bir gerçek kişi yabancı bir şirketten 30.000 TL brüt kâr payı almıştır. Kiralık kasa kirası 600 TL, tahsil masrafı 400 TL'dir; yurt dışında 3.000 TL vergi kesilmiştir. Vergilendirilecek MSİ kaç TL'dir?", "o": ["29.000 TL", "26.000 TL", "30.000 TL", "29.400 TL", "14.500 TL"], "a": 0, "e": "Muhafaza ve tahsil giderleri düşülür: 30.000 - 600 - 400 = 29.000. Kesilen vergi gider olarak değil, hesaplanan vergiden mahsup yoluyla dikkate alınır; yabancı kâr payında yarı istisna yoktur."}, {"q": "2010'da ihraç edilmiş bir menkul kıymet 40.000 TL'ye alınmış, 52.000 TL'ye satılmış ve 500 TL satış komisyonu ödenmiştir. Elden çıkarıldığı ay hariç ÜFE artışı %25'tir. Olağan rejimde DAK kaç TL'dir?", "o": ["11.500 TL", "2.000 TL", "12.000 TL", "1.500 TL", "0 TL"], "a": 3, "e": "Endeksli maliyet 40.000 x 1,25 = 50.000. DAK = 52.000 - 50.000 - 500 = 1.500 TL."}]}, {"id": 7, "kisa": "Hisse ve Tahvil Gelirleri", "baslik": "Tam Mükellef Gerçek Kişiler: Hisse Senedi ve Tahvil-Bono Gelirleri, Beyan ve Ödeme", "ozet": "Tam mükellef gerçek kişinin kâr payı, hisse alım-satım kazancı, tahvil faizi ve tahvil alım-satım kazancının olağan rejimde ve Geçici 67 kapsamında nasıl vergilendiğini; stopaj oranlarını, beyan sınırlarını ve elde tutma sürelerini toplar.", "notlar": "\n<h3>Hisse senedi kâr payları<\/h3>\n<ul>\n<li>Kâr payı alma hakkı, dağıtım tarihinde elde bulunan pay miktarına göre doğar; cari yıl kârı veya geçmiş yıl kârlarının genel kurulca dağıtılmasına karar verilmesi gerekir.<\/li>\n<li>Kâr payı tam mükellef gerçek kişiye ödenirken <b>dağıtan kurum stopaj keser<\/b>, bakiyeyi öder.<\/li>\n<li>Kâr payları <b>Geçici 67 kapsamında değildir<\/b>; olağan rejimle vergilenir.<\/li>\n<li>Hissenin nasıl edinildiği (bedelli, bedelsiz, ivazsız, miras) kâr payı vergilemesinde <b>önemsizdir<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Dönem<\/th><th>Kâr payı stopaj oranı<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>22.12.2021 öncesi<\/td><td>%15<\/td><td>-<\/td><\/tr>\n<tr><td>22.12.2021'den itibaren<\/td><td>%10<\/td><td>4936 sayılı CK (RG 22.12.2021, 31697)<\/td><\/tr>\n<tr><td>22.12.2024'ten itibaren<\/td><td>%15<\/td><td>9286 sayılı CK (RG 22.12.2024, 32760)<\/td><\/tr>\n<\/table>\n<h4>Yarı istisna ve beyan sınırı<\/h4>\n<ul>\n<li><b>Tam mükellef kurumlardan<\/b> alınan kâr paylarının <b>1/2'si<\/b> gelir vergisinden istisnadır.<\/li>\n<li>İstisna sonrası kalan tutar, stopaja tabi tutulmuş diğer gelirlerle (ücret, MSİ, GMSİ) birlikte <b>beyan sınırını<\/b> aşarsa kalan tutarın <b>tamamı<\/b> yıllık beyannameyle beyan edilir. Kurumun <b>kâr payının tamamı üzerinden<\/b> kestiği stopaj hesaplanan vergiden mahsup edilir.<\/li>\n<li>Tam mükellef kurum: kanuni veya iş merkezinden <b>biri<\/b> Türkiye'de olan kurum. İkisi de yurt dışındaysa dar mükelleftir; dar mükellef kurumdan alınan kâr payında yarı istisna yoktur, tamamı dikkate alınır.<\/li>\n<\/ul>\n<table>\n<tr><th>Yıl<\/th><th>Beyan sınırı (GVK 103 tarifesi 2. dilim)<\/th><th>Yurt dışı kâr payı / faiz beyan sınırı (GVK 86/1-d)<\/th><\/tr>\n<tr><td>2022<\/td><td>70.000 TL<\/td><td>3.800 TL<\/td><\/tr>\n<tr><td>2024<\/td><td>230.000 TL<\/td><td>13.000 TL<\/td><\/tr>\n<tr><td>2025<\/td><td>330.000 TL<\/td><td>18.000 TL<\/td><\/tr>\n<tr><td>2026<\/td><td>400.000 TL<\/td><td>22.000 TL<\/td><\/tr>\n<\/table>\n<ul>\n<li>Örnek (2026): tam mükellef A.Ş.'den 1.000.000 TL brüt kâr payı → stopaj %15 = 150.000 TL; beyana giren tutar 500.000 TL (> 400.000). 2026 tarifesine göre vergi: 400.000 TL için 70.500 + 100.000 x %27 = <b>97.500 TL<\/b>; kesilen 150.000 TL mahsup edilir.<\/li>\n<li>Örnek: 760.000 TL brüt kâr payının yarısı 380.000 TL → 2026'da 400.000'i aşmadığı için beyan yok; aynı tutar 2025'te 330.000'i aştığı için beyan edilirdi.<\/li>\n<li>Kitaptaki 1.500.000 TL'lik örnekte beyana yalnızca 750.000 TL girdiği, stopaj ise tamamı üzerinden kesildiği için ek vergi düşük kalır; aynı tutar yabancı kurumdan alınsa tamamı beyana girer ve yük çok artar.<\/li>\n<\/ul>\n<h4>Yurt dışı kurumlardan kâr payı<\/h4>\n<ul>\n<li>Kanuni ve iş merkezi Türkiye'de olmayan kurumlardan alınan kâr paylarının <b>brüt toplamı<\/b> beyan sınırını (2025: 18.000 TL, 2026: 22.000 TL) aşarsa <b>tamamı<\/b> beyan edilir. <b>Yarı istisna uygulanmaz.<\/b><\/li>\n<li>Yurt dışında stopajla ödenen vergiler mahsup edilir (koşullar GVK m.123). ÇVÖA varsa tevkifat ve beyan konusunda anlaşma hükümleri geçerlidir.<\/li>\n<\/ul>\n\n<h3>Hisse senedi alım-satım kazancı<\/h3>\n<ul>\n<li><b>01.01.2006'dan sonra iktisap edilen ve SPK kaydındaki<\/b> hisseler → <b>Geçici 67<\/b>.<\/li>\n<li>01.01.2006'dan <b>önce<\/b> iktisap edilen SPK kayıtlı hisseler ile 2006 sonrası iktisap edilse de <b>SPK kaydına alınmamış<\/b> hisseler → <b>olağan rejim<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Durum (olağan rejim)<\/th><th>Vergiden istisna olma şartı<\/th><th>Şart sağlanmazsa<\/th><\/tr>\n<tr><td>İvazsız edinilen hisse (miras, bağış)<\/td><td>Her durumda vergilenmez<\/td><td>-<\/td><\/tr>\n<tr><td>2006 öncesi edinilen, BİST'te işlem gören<\/td><td><b>3 ay<\/b> elde tutma<\/td><td>Endeksleme ve giderler sonrası, diğer DAK ile birlikte istisnayı aşan kısım beyan<\/td><\/tr>\n<tr><td>2006 öncesi edinilen, tam mükellef kuruma ait, BİST'te işlem görmeyen<\/td><td><b>1 yıldan fazla<\/b> elde tutma<\/td><td>Endeksleme ve giderler sonrası istisnayı aşan kısım beyan<\/td><\/tr>\n<tr><td>2006 sonrası edinilen, SPK kaydına alınmamış, tam mükellef kuruma ait, ivazlı<\/td><td><b>2 yıldan fazla<\/b> elde tutma<\/td><td>Endeksleme (ÜFE artışı %10'u aşarsa) ve giderler sonrası yıllık beyan<\/td><\/tr>\n<tr><td>Yabancı hisse, ivazsız edinilmiş<\/td><td>Vergilenmez<\/td><td>-<\/td><\/tr>\n<\/table>\n<ul>\n<li>Diğer hisse senetleri için kitapta, endeksleme ve giderler sonrası diğer DAK ile birlikte <b>2025'te 330.000 TL'yi, 2026'da 400.000 TL'yi aşan<\/b> kısmın beyan edileceği yazılıdır; alım-satım zararları kârlara mahsup edilir.<\/li>\n<li><b>Bedelsiz hisseler:<\/b> ivazsız edinilen hisseye bağlı gelen bedelsizlerin satışı vergilenmez. İvazlı edinilen hisseye bağlı bedelsizlerde süre, <b>\"kök\"<\/b> (bedel ödenerek alınan) hissenin edinim tarihinden hesaplanır.<\/li>\n<\/ul>\n<h4>Geçici 67'nin etkisi (hisse alım-satımı)<\/h4>\n<ul>\n<li>Kapsam: Türkiye'de ihraç edilmiş ve SPK kaydına alınmış ve/veya Türkiye'deki borsalarda işlem gören hisseler.<\/li>\n<li>Tam mükellef gerçek kişide stopaj %10 iken <b>2008/14272 sayılı BKK<\/b> (RG 13.11.2008) ile <b>%0<\/b>'a indirildi. Stopaj nihai vergidir.<\/li>\n<li><b>MKYO hisseleri: %10<\/b> stopaj devam eder; MKYO hissesi <b>1 yıldan fazla<\/b> elde tutulursa stopaj yoktur.<\/li>\n<li>Tam mükellef bireysel yatırımcı yıllık beyanname vermez, diğer gelirler için verdiği beyannameye bu kazancı katmaz. Ticari faaliyet kapsamındaysa kazanç ticari kazanca girer, stopaj mahsup edilir.<\/li>\n<li><b>BİST'te işlem gören ve 1 yıldan fazla elde tutulan<\/b> (tam mükellef kurum) hisselerin satışında Geçici 67 ve mük. m.80 uygulanmaz: kazanç <b>tümüyle GV'den istisnadır<\/b>.<\/li>\n<\/ul>\n\n<h3>Beyan ve ödeme<\/h3>\n<ul>\n<li>Beyan: gelirin elde edildiği yılı izleyen yılın <b>Mart ayının son gününe<\/b> kadar, ikametgâh vergi dairesine. Elden, iadeli taahhütlü posta (postaya veriliş en geç <b>31 Mart<\/b>) veya İnternet Vergi Dairesi ile.<\/li>\n<li>Ödeme: tarh edilen verginin <b>1/2'si Mart<\/b> ayında (31 Mart'a kadar), kalan <b>1/2'si Temmuz<\/b> ayında (31 Temmuz'a kadar). Ödeme bankadan, vezneden veya İVD'den kredi kartıyla yapılabilir; vergi tahsil alındısı ve tahakkuk fişi saklanmalıdır.<\/li>\n<li>Aile bireylerinin her biri kendi durumuna göre beyanname verir. Küçük, kısıtlı veya mümeyyiz olmayan için beyanname gelir sahibinin adına düzenlenir; veli, vasi veya kayyım sıfatını belirterek imzalar.<\/li>\n<\/ul>\n\n<h3>Devlet ve özel sektör tahvil-bono faizleri<\/h3>\n<ul>\n<li>GVK: her tür tahvil ve HB faizleri ile TKİ, KOİ ve ÖİB menkul kıymet gelirleri MSİ'dir. İhraççının devlet veya özel sektör olması MSİ sayılmayı etkilemez, <b>vergilendirmeyi<\/b> etkiler.<\/li>\n<li>01.01.2006'dan <b>sonra ihraç<\/b> edilenlerin faizi → Geçici 67; <b>önce ihraç<\/b> edilenler → olağan rejim.<\/li>\n<li>Olağan rejim ilkeleri:\n<ul><li>Kuponlu veya kuponsuz satış geliri MSİ değil DAK'tır.<\/li>\n<li>Dövize, altına veya başka değere endeksli tahvillerin itfasındaki değer artışı MSİ sayılmaz.<\/li>\n<li>Endeksli olmayanlarda faize <b>indirim oranı<\/b> uygulanır; endeksli/dövizlilerde uygulanmaz.<\/li>\n<li>Giderler (muhafaza, tahsil, vergi-resim-harç) düşüldükten sonra stopajlı diğer gelirlerle birlikte beyan sınırı (2025: 330.000, 2026: 400.000 TL) aşılırsa <b>tüm faiz<\/b> beyan edilir; stopaj mahsup edilir.<\/li>\n<li>Yabancı para tahvilin itfasında <b>anapara kur farkı gelir sayılmaz<\/b>.<\/li><\/ul><\/li>\n<\/ul>\n<h4>Faiz stopaj oranları<\/h4>\n<table>\n<tr><th>Araç<\/th><th>Oran<\/th><\/tr>\n<tr><td>DT ve HB (Eurobond hariç), Türkiye'de satılan ÖST - genel<\/td><td>%10 (Geçici 67'de 23.07.2006 sonrası %10)<\/td><\/tr>\n<tr><td>Finansman bonosu (SPK onaylı)<\/td><td>%15 (2569 sayılı CK, RG 24.05.2020)<\/td><\/tr>\n<tr><td>Hazine ve Maliye Bakanlığınca ihraç edilen DT ve HB; 22.12.2021 - 31.12.2026 arasında iktisap<\/td><td><b>%0<\/b> (4937 sayılı CK ile 2006/10731 BKK'ya eklenen Geçici Madde 4; uzatmalar 9769, 10154, 10706 ve son olarak 11444 sayılı CK)<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Bankalarca ihraç edilen tahvil ve bonolar (iktisap tarihine göre)<\/th><th>23.12.2020 - 30.04.2024<\/th><th>01.05.2024 - 31.10.2024<\/th><th>01.11.2024 - 31.01.2025<\/th><th>01.02.2025 - 30.06.2026<\/th><\/tr>\n<tr><td>Vade 6 aya kadar (dahil)<\/td><td>%5<\/td><td>%7,5<\/td><td>%10<\/td><td>%15<\/td><\/tr>\n<tr><td>Vade 1 yıla kadar (dahil)<\/td><td>%3<\/td><td>%5<\/td><td>%7,5<\/td><td>%15<\/td><\/tr>\n<tr><td>Vade 1 yıldan uzun<\/td><td>%0<\/td><td>%2,5<\/td><td>%5<\/td><td>%10<\/td><\/tr>\n<\/table>\n<ul><li>Dikkat: Bu tablo kitapta bazı yerlerde son sütun \"01.02.2025 - 31.12.2025\" başlığıyla da verilir; oranlar aynıdır.<\/li><\/ul>\n<table>\n<tr><th>Tam mükellef kurumların yurt dışında ihraç ettiği tahvillerde faiz stopajı (2010/1182 BKK; 842 sayılı CK)<\/th><th>21.03.2019 öncesi<\/th><th>21.03.2019'dan itibaren<\/th><\/tr>\n<tr><td>1 yıla kadar<\/td><td>%10<\/td><td>%7<\/td><\/tr>\n<tr><td>1 - 3 yıl<\/td><td>%7<\/td><td>%3<\/td><\/tr>\n<tr><td>3 - 5 yıl<\/td><td>%3<\/td><td>%0 (3 yıl ve üstü)<\/td><\/tr>\n<tr><td>5 yıl ve üstü<\/td><td>%0<\/td><td>%0<\/td><\/tr>\n<tr><td>Bunlar dışındaki ÖST<\/td><td>%10<\/td><td>-<\/td><\/tr>\n<\/table>\n<h4>Eurobond faizleri<\/h4>\n<ul>\n<li>Tüm açıklamalar geçerlidir; yalnızca <b>indirim oranı uygulanmaz<\/b>. Kazanç, faizin <b>tahsil edildiği tarihteki TL karşılığıdır<\/b>; anapara kur farkı kazanca girmez.<\/li>\n<li><b>Eurobond ve yurt dışına ihraç edilen ÖST faizleri Geçici 67 kapsamında değildir<\/b>: olağan rejim.<\/li>\n<\/ul>\n<h4>Geçici 67'nin etkisi (faiz)<\/h4>\n<ul>\n<li>Aracı banka ve aracı kurumlar 23.07.2006 sonrası <b>%10<\/b> (finansman bonosu <b>%15<\/b>) stopaj keser; stopaj nihaidir, bireysel yatırımcı beyanname vermez. Geçici olarak yukarıdaki tablolar uygulanır.<\/li>\n<\/ul>\n\n<h3>Tahvil-bono alım-satım kazancı<\/h3>\n<ul>\n<li>2006 sonrası ihraç → Geçici 67; 2006 öncesi ihraç → olağan rejim.<\/li>\n<li>Olağan rejimde: <b>elde tutma süresi yoktur<\/b> (bir gün bile tutulsa vergilenir); alım-satımda <b>stopaj yapılmaz<\/b>; satış bedelinden maliyet, satıcının üzerinde kalan giderler, vergi ve harçlar düşülür; maliyet satış ayı hariç ÜFE ile endekslenir.<\/li>\n<li>Döviz cinsinden tahvilde kazanç, alış ve satış tarihlerindeki <b>döviz alış kurlarıyla bulunan TL karşılıkları<\/b> farkıdır. Eurobond da aynı: satış tarihindeki TL tutarı - alış tarihindeki TL tutarı.<\/li>\n<li>Geçici 67: DT, HB ve Türkiye'de ihraç edilen ÖST'lerin DAK'ında <b>%10<\/b> nihai stopaj; DİBS'te 22.12.2021 - 31.12.2026 iktisaplarında %0.<\/li>\n<li>Dikkat (kaynakta çelişki): DİBS %0 oranının iktisap bitişi metinde 31.12.2026 iken Ek 1'de 31.12.2025 yazar; ara uzatmalarda var olmayan '31 Haziran 2026' tarihi geçer, banka tahvili tablolarının başlığı da bir yerde 30.06.2026, dar mükellef bölümünde 31.12.2025'tir. Sınavda en son uzatma (31.12.2026) esas alınmalıdır.<\/li>\n<li>Eurobond ve yurt dışına ihraç edilen ÖST'lerin alım-satım kazancı Geçici 67 dışında, olağan rejimdedir.<\/li>\n<\/ul>\n<ul><li>Dikkat: Kitap kâr payı örneğinde 2022 tarifesini ve %10 stopajı kullanır; güncel kâr payı stopajı <b>%15<\/b>'tir.<\/li><\/ul>\n", "sorular": [{"q": "22.12.2024'ten itibaren tam mükellef gerçek kişilere dağıtılan kâr paylarında stopaj oranı kaçtır?", "o": ["%10", "%15", "%5", "%20", "%0"], "a": 1, "e": "4936 sayılı CK ile %10'a inen oran, 9286 sayılı CK ile 22.12.2024'ten itibaren yeniden %15 olmuştur."}, {"q": "Tam mükellef bir gerçek kişi 2026 yılında tam mükellef bir A.Ş.'den 1.200.000 TL brüt kâr payı almıştır. Dağıtım sırasında kesilen stopaj kaç TL'dir?", "o": ["120.000 TL", "90.000 TL", "60.000 TL", "240.000 TL", "180.000 TL"], "a": 4, "e": "Stopaj brüt kâr payının tamamı üzerinden %15'tir: 1.200.000 x 0,15 = 180.000 TL."}, {"q": "Başka geliri olmayan tam mükellef Bay K, 2026'da tam mükellef bir A.Ş.'den 1.000.000 TL brüt kâr payı almıştır. Yıllık beyannameye girecek kâr payı tutarı kaç TL'dir?", "o": ["1.000.000 TL", "850.000 TL", "500.000 TL", "600.000 TL", "Beyan edilmez"], "a": 2, "e": "Tam mükellef kurumdan alınan kâr payının yarısı istisnadır; kalan 500.000 TL, 2026 beyan sınırı olan 400.000 TL'yi aştığı için tamamı beyan edilir."}, {"q": "Bay K'nın 2026'da beyan ettiği kâr payı 500.000 TL'dir. 2026 tarifesi: 190.000 TL'ye kadar %15; 400.000 TL'nin 190.000 TL'si için 28.500 TL, fazlası %20; 1.000.000 TL'nin 400.000 TL'si için 70.500 TL, fazlası %27. Hesaplanan gelir vergisi kaç TL'dir?", "o": ["97.500 TL", "135.000 TL", "98.500 TL", "70.500 TL", "117.500 TL"], "a": 0, "e": "400.000 TL için 70.500 TL, aşan 100.000 TL için %27 = 27.000 TL; toplam 97.500 TL."}, {"q": "Hesaplanan gelir vergisi 97.500 TL olan bir mükellef Mart ayında ilk taksit olarak kaç TL öder?", "o": ["97.500 TL", "32.500 TL", "24.375 TL", "48.750 TL", "65.000 TL"], "a": 3, "e": "Vergi iki eşit taksitte ödenir: yarısı Mart, yarısı Temmuz. 97.500 / 2 = 48.750 TL."}, {"q": "Tam mükellef bir gerçek kişinin tek geliri, tam mükellef bir A.Ş.'den aldığı 760.000 TL brüt kâr payıdır. Beyan yükümlülüğüyle ilgili hangisi doğrudur?", "o": ["Her iki yılda da beyan edilir", "2026'da elde edilseydi beyan edilmez, 2025'te elde edilseydi beyan edilirdi", "Her iki yılda da beyan edilmez", "2026'da beyan edilir, 2025'te edilmez", "Yarı istisna olmadığı için 760.000 TL beyan edilir"], "a": 1, "e": "Yarısı 380.000 TL'dir. 2026 sınırı 400.000 TL'yi aşmaz; 2025 sınırı 330.000 TL'yi aşar."}, {"q": "Tam mükellef bir gerçek kişi 2026'da yurt dışında kurulu bir şirketten 25.000 TL brüt kâr payı almıştır, başka geliri yoktur. Beyan edilecek tutar kaç TL'dir?", "o": ["12.500 TL", "3.000 TL", "Beyan edilmez", "21.250 TL", "25.000 TL"], "a": 4, "e": "Yurt dışı kâr paylarında yarı istisna yoktur. Brüt toplam 22.000 TL'lik 2026 sınırını aştığı için tamamı beyan edilir."}, {"q": "Yurt dışındaki kurumlardan elde edilen kâr payları için aşağıdakilerden hangisi doğrudur?", "o": ["Yarısı istisnadır", "Tutarı ne olursa olsun beyan dışıdır", "Yarı istisna uygulanmaz; yurt dışında ödenen vergiler GVK m.123 koşullarıyla mahsup edilebilir", "Geçici 67 kapsamında %0 stopajla nihai vergilenir", "Yurt dışı stopaj gider olarak indirilir"], "a": 2, "e": "Yarı istisna yalnızca tam mükellef kurumlardan alınan kâr paylarına uygulanır; yurt dışı vergiler mahsup edilir."}, {"q": "Kanuni merkezi yurt dışında, iş merkezi Türkiye'de olan bir kurum KVK açısından nasıl nitelendirilir?", "o": ["Tam mükellef kurum", "Dar mükellef kurum", "Daimi temsilci", "Yabancı fon", "Vergiden muaf kurum"], "a": 0, "e": "Kanuni veya iş merkezinden biri Türkiye'de olan kurum tam mükelleftir; ikisi de yurt dışındaysa dar mükelleftir."}, {"q": "Olağan rejimde, 01.01.2006'dan önce edinilmiş ve BİST'te işlem gören bir hisse senedinin satış kazancı en az ne kadar elde tutulursa vergiye tabi olmaz?", "o": ["1 yıl", "2 yıl", "6 ay", "3 ay", "1 ay"], "a": 3, "e": "2006 öncesi edinilen BİST hisseleri 3 ay elde tutulduktan sonra satılırsa kazanç vergilenmez."}, {"q": "01.01.2006'dan sonra ivazlı olarak edinilmiş, tam mükellef kuruma ait ve SPK kaydına alınmamış hisse senedinin satış kazancının vergiden istisna olması için şart nedir?", "o": ["3 aydan fazla elde tutulması", "2 yıldan fazla elde tutulması", "1 yıldan fazla elde tutulması", "Borsada satılması", "5 yıldan fazla elde tutulması"], "a": 1, "e": "SPK kaydında olmayan hisseler olağan rejimdedir; ivazlı edinilip 2 yıldan fazla elde tutulanların kazancı vergilenmez."}, {"q": "İvazlı edinilen hisselere bağlı olarak kâr yedeklerinin sermayeye eklenmesiyle alınan bedelsiz hisselerin satışında elde tutma süresi neye göre hesaplanır?", "o": ["Bedelsiz hissenin kayda alındığı tarihe", "Genel kurul tarihine", "Sermaye artırımının tescil tarihine", "Satıştan geriye doğru 2 yıla", "Bedel ödenerek alınan kök hissenin edinim tarihine"], "a": 4, "e": "Bedelsizlerin süresi, bedelsiz alma hakkını veren kök hissenin edinim tarihinden başlar."}, {"q": "Geçici 67 kapsamındaki hisse senetlerinden tam mükellef gerçek kişilerin elde ettiği alım-satım kazançlarında (MKYO hariç) stopaj oranı kaçtır?", "o": ["%10", "%15", "%0", "%17,5", "%5"], "a": 2, "e": "2008/14272 sayılı BKK ile %10'dan %0'a indirilmiştir; stopaj nihai vergidir."}, {"q": "Geçici 67 kapsamında MKYO hisse senetlerinin alım-satım kazancı için aşağıdakilerden hangisi doğrudur?", "o": ["%10 stopaj uygulanır; 1 yıldan fazla elde tutulursa stopaja tabi değildir", "%0 stopaja tabidir", "Her durumda %15 stopaja tabidir", "Tutarı ne olursa olsun yıllık beyannameyle beyan edilir", "2 yıldan fazla elde tutulursa stopaj yoktur"], "a": 0, "e": "MKYO hisselerinde %10 oran sürer; 1 yıldan fazla elde tutulanlar stopaja tabi değildir."}, {"q": "Tam mükellef kuruma ait, BİST'te işlem gören ve 1 yıldan fazla elde tutulan hisse senedinin satış kazancı için doğru olan hangisidir?", "o": ["%10 stopajla nihai vergilenir", "Beyan sınırını aşarsa beyan edilir", "ÜFE endekslemesi sonrası beyan edilir", "Geçici 67 ve mük. m.80 uygulanmaz; kazanç tümüyle GV'den istisnadır", "%0 stopaj kesilir ve ihtiyari beyan zorunludur"], "a": 3, "e": "Kitap bu kazançların tümüyle gelir vergisinden istisna olduğunu belirtir."}, {"q": "2025 yılı gelirleri için verilecek yıllık gelir vergisi beyannamesi posta ile gönderilecekse, en geç hangi tarihte postaya verilmelidir?", "o": ["31 Ocak 2026", "31 Mart 2026", "28 Şubat 2026", "30 Nisan 2026", "31 Temmuz 2026"], "a": 1, "e": "Beyan süresi izleyen yılın Mart ayının son günüdür; posta ile gönderimde postaya veriliş tarihi en geç 31 Mart olmalıdır."}, {"q": "Olağan rejimde tahvil ve bono alım-satım kazançları için aşağıdakilerden hangisi doğrudur?", "o": ["3 aydan fazla elde tutulursa vergilenmez", "1 yıldan fazla elde tutulursa vergilenmez", "%10 stopajla nihai vergilenir", "ÜFE endekslemesi yapılamaz", "Asgari elde tutma süresi yoktur ve kazanç elde edilirken stopaj yapılmaz"], "a": 4, "e": "Olağan rejimde tahvil alım-satım kazancı bir gün tutulsa bile vergilenir, stopaj yoktur, maliyet ÜFE ile endekslenir."}, {"q": "Bir yatırımcı olağan rejime tabi bir Eurobond'u 20.000 USD'ye, kurun 32 TL olduğu gün almış; 20.500 USD'ye, kurun 36 TL olduğu gün satmıştır. Endeksleme ve giderler ihmal edilirse kazanç kaç TL'dir?", "o": ["18.000 TL", "16.000 TL", "98.000 TL", "80.000 TL", "500 TL"], "a": 2, "e": "Olağan rejimde kazanç TL karşılıkları farkıdır: 20.500 x 36 = 738.000; 20.000 x 32 = 640.000; fark 98.000 TL."}, {"q": "Bir yatırımcı 10.03.2025'te bankaca ihraç edilen 6 ay vadeli bir bono satın almış ve 40.000 TL faiz geliri elde etmiştir. Kesilecek stopaj kaç TL'dir?", "o": ["6.000 TL", "4.000 TL", "3.000 TL", "2.000 TL", "1.200 TL"], "a": 0, "e": "01.02.2025 - 30.06.2026 arasında iktisap edilen 6 aya kadar vadeli banka bonolarında oran %15'tir: 40.000 x 0,15 = 6.000 TL."}, {"q": "15.06.2024'te iktisap edilen, bankaca ihraç edilmiş 2 yıl vadeli tahvilden 80.000 TL faiz elde edilmiştir. Stopaj kaç TL'dir?", "o": ["4.000 TL", "8.000 TL", "0 TL", "2.000 TL", "12.000 TL"], "a": 3, "e": "01.05.2024 - 31.10.2024 arasında iktisap edilen 1 yıldan uzun vadelilerde oran %2,5'tir: 80.000 x 0,025 = 2.000 TL."}, {"q": "Tam mükellef bir kurumun 2025'te yurt dışında ihraç ettiği 2 yıl vadeli tahvilden tam mükellef bir gerçek kişi 50.000 TL faiz almıştır. Stopaj kaç TL'dir?", "o": ["3.500 TL", "1.500 TL", "5.000 TL", "0 TL", "7.500 TL"], "a": 1, "e": "842 sayılı CK sonrası 1 - 3 yıl vadede oran %3'tür: 50.000 x 0,03 = 1.500 TL."}, {"q": "Hazine ve Maliye Bakanlığınca ihraç edilen bir devlet tahvilini 15.04.2025'da satın alan tam mükellef gerçek kişinin faiz gelirine uygulanacak stopaj oranı kaçtır?", "o": ["%10", "%15", "%5", "%2,5", "%0"], "a": 4, "e": "4937 sayılı CK ile eklenen Geçici Madde 4 kapsamında 22.12.2021'den itibaren iktisap edilen DT ve HB'de oran %0'dır; 15.04.2025 kitaptaki tüm uzatma tarihlerinin (Ek 1'deki 31.12.2025 ve metindeki 31.12.2026) kapsamındadır."}, {"q": "Finansman bonosu faizlerine Geçici 67 kapsamında uygulanan stopaj oranı kaçtır?", "o": ["%10", "%0", "%15", "%7,5", "%17,5"], "a": 2, "e": "2569 sayılı CK (RG 24.05.2020) ile SPK onaylı finansman bonosu gelirlerinde oran %15'tir."}, {"q": "Eurobond faizleriyle ilgili aşağıdakilerden hangisi yanlıştır?", "o": ["Geçici 67 kapsamında %10 stopajla nihai vergilenir", "İndirim oranı uygulanmaz", "Kazanç, tahsil tarihindeki TL karşılığıdır", "Anapara kur farkı kazanca dahil edilmez", "Olağan vergileme rejimine tabidir"], "a": 0, "e": "Eurobond ve yurt dışına ihraç edilen ÖST faizleri Geçici 67 kapsamında değildir; olağan rejim uygulanır."}, {"q": "Olağan rejimde, döviz cinsinden veya dövize endeksli tahvil faizleri için aşağıdakilerden hangisi doğrudur?", "o": ["İndirim oranı uygulanır", "Tutarı ne olursa olsun beyan edilmez", "Yarısı istisnadır", "İndirim oranı uygulanmaz; giderler düşüldükten sonra beyan sınırı aşılırsa tüm faiz beyan edilir", "İtfadaki değer artışı da MSİ sayılır"], "a": 3, "e": "Endeksli ve dövizli tahvillerde indirim oranı yoktur ve itfadaki değer artışı MSİ sayılmaz."}]}, {"id": 8, "kisa": "Mevduat, Repo, Fon, Varant", "baslik": "Tam Mükellef Gerçek Kişiler: Kira Sertifikası, Ters Repo, Mevduat, Fon Katılma Payı, Yatırım Ortaklığı Kâr Payı ve Varant Gelirleri", "ozet": "Kira sertifikası, ters repo, mevduat, yatırım fonu ve BYF katılma payı, yatırım ortaklığı kâr payı ve varant gelirlerinde stopaj oranlarını iktisap/açılış tarihlerine göre tablo hâlinde verir.", "notlar": "\n<h3>Kira sertifikaları<\/h3>\n<ul>\n<li><b>Kira sertifikası (sukuk):<\/b> varlık kiralama şirketlerinin (VKŞ) satın alma veya kiralama yoluyla devraldığı varlıkların finansmanı için ihraç edilen ve sahiplerine bu varlıklardan doğan gelirde payları oranında hak veren menkul kıymet. Gelirleri <b>MSİ<\/b>'dir.<\/li>\n<li><b>Yurt içinde ihraç<\/b> edilenler → Geçici 67: aracı banka/aracı kurum tam ve dar mükellef gerçek kişi ve kurumların gelirinden <b>%10<\/b> keser. Stopaj <b>nihaidir<\/b>, ayrıca beyan yoktur. 2006 sonrası yurt içinde ihraç edilen tüm ÖST'lerin faiz ve kâr payları için de beyanname verilmez.<\/li>\n<li><b>2569 sayılı CK<\/b> (23.05.2020; RG 24.05.2020): SPK onaylı <b>finansman bonoları<\/b> ve VKŞ'lerin <b>1 yıldan kısa vadeli<\/b> kira sertifikalarının gelirleri ve elden çıkarma kazançlarında <b>%15<\/b>.<\/li>\n<li>KVK m.2/1 mükellefleri (sermaye şirketleri: AŞ, LTD, sermayesi paylara bölünmüş komandit ve benzeri yabancı kurumlar) ile münhasıran menkul kıymet getirisi ve DAK elde etmek amacıyla faaliyet gösterip yatırım fonu ve ortaklıklarına benzer olduğu Bakanlıkça belirlenenler için oran <b>%0<\/b>.<\/li>\n<li><b>4749 sayılı Kanuna göre kurulan VKŞ<\/b> (Hazine) kira sertifikaları: 22.12.2021 - 31.12.2022 arasında iktisaplarda %0 (4937 sayılı CK, Geçici Madde 4); son uzatmayla <b>31.12.2026'ya kadar<\/b> iktisaplar.<\/li>\n<li>Dikkat (kaynakta çelişki): Ek 1 ve Ek 2'de aynı %0 oran '22.12.2021 - 31.12.2023 tarihleri arasında <b>ihraç<\/b> edilen' kira sertifikaları için, Ek 1'in kira geliri satırında ise '22.12.2021 - 31.12.2026 ihraç' olarak verilir; metin iktisap tarihini (31.12.2026) esas alır.<\/li>\n<\/ul>\n<table>\n<tr><th>Bankaların fon kullanıcısı olduğu VKŞ kira sertifikaları (iktisap tarihi)<\/th><th>23.12.2020 - 30.04.2024<\/th><th>01.05.2024 - 31.10.2024<\/th><th>01.11.2024 - 31.01.2025<\/th><th>01.02.2025 - 30.06.2026<\/th><\/tr>\n<tr><td>Vade 6 aya kadar (dahil)<\/td><td>%5<\/td><td>%7,5<\/td><td>%10<\/td><td>%15<\/td><\/tr>\n<tr><td>Vade 1 yıla kadar (dahil)<\/td><td>%3<\/td><td>%5<\/td><td>%7,5<\/td><td>%15<\/td><\/tr>\n<tr><td>Vade 1 yıldan uzun<\/td><td>%0<\/td><td>%2,5<\/td><td>%5<\/td><td>%10<\/td><\/tr>\n<\/table>\n<ul><li>İlk farklı oranlar 3321 sayılı CK (RG 23.12.2020) ile 23.12.2020 - 31.03.2021 iktisapları için getirilmiş, sonra uzatılmıştır.<\/li><\/ul>\n<h4>Tam mükellef kurumlarca yurt dışında ihraç edilen kira sertifikaları<\/h4>\n<ul>\n<li>GVK m.75/5'teki bu gelirler <b>Geçici 67 dışındadır<\/b>; GVK <b>m.94<\/b> kapsamında vadeye göre tevkifat yapılır (842 sayılı CK, 21.03.2019):<\/li>\n<\/ul>\n<table>\n<tr><th>Vade<\/th><th>Oran<\/th><\/tr>\n<tr><td>1 yıla kadar<\/td><td>%7<\/td><\/tr>\n<tr><td>1 - 3 yıl<\/td><td>%3<\/td><\/tr>\n<tr><td>3 yıldan fazla<\/td><td>%0<\/td><\/tr>\n<\/table>\n<ul>\n<li>Tam mükellef gerçek kişi elde ederse beyan sınırını (2025: 330.000, 2026: 400.000 TL) aşınca yıllık beyan; <b>dar mükellef<\/b> elde ederse beyan yok. Kitap, 2006 öncesi ihraç edilen diğer ÖST faizlerinde %10 tevkifat olduğunu ve 2024'te 230.000 TL'yi aşan bu gelirlerin beyan edileceğini de belirtir.<\/li>\n<\/ul>\n\n<h3>Ters repo<\/h3>\n<ul>\n<li>Her türlü tahvil, HB ve TKİ, KOİ, ÖİB menkul kıymetlerinin <b>geri alım veya satım taahhüdüyle<\/b> elde edilmesi veya elden çıkarılmasından sağlanan menfaat MSİ'dir (ters repo). 31.12.2005'e kadar gerçek kişiler bunun için beyanname vermiyordu.<\/li>\n<li>Geçici 67: ödeme yapan, hak sahibine ödenen tutardan <b>%15<\/b> stopaj keser; tam mükellef bireysel yatırımcı beyanname vermez, bu geliri diğer beyannameye katmaz.<\/li>\n<\/ul>\n\n<h3>Mevduat faizleri<\/h3>\n<ul>\n<li>Mevduat faizi sayılanlar: bankalara, bankerlere, tasarruf sandıklarına ve tevdiat kabul eden diğer müesseselere yatırılan vadeli ve vadesiz paralara ödenen faizler; bunlardan devamlı para toplayanların sağladığı gelir ve menfaatler; bankalar ile aracı kurumlar arasındaki <b>borsa para piyasasında<\/b> değerlendirilen paralara ödenen faizler.<\/li>\n<li><b>02.01.2013'ten önce açılmış<\/b> DTH ve TL hesaplara ödenen faizler vadeye bakılmaksızın <b>%15<\/b>.<\/li>\n<li>Stopaj <b>nihai<\/b>; tam mükellef bireysel yatırımcı beyanname vermez.<\/li>\n<li><b>Yurt dışı banka / offshore<\/b> faizleri: stopaj yok; 2025'te <b>18.000 TL<\/b>, 2026'da <b>22.000 TL<\/b> beyan sınırı aşılırsa <b>tamamı<\/b> beyan edilir. Yurt dışında kesilen vergi mahsup edilebilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Döviz tevdiat hesabı (DTH) vadesi<\/th><th>21.03.2019'a kadar<\/th><th>21.03.2019'dan itibaren<\/th><th>28.06.2023'ten itibaren<\/th><\/tr>\n<tr><td>6 aya kadar (vadesiz, ihbarlı dahil)<\/td><td>%18<\/td><td>%20<\/td><td>%25<\/td><\/tr>\n<tr><td>6 - 12 ay (1 yıl dahil)<\/td><td>%15<\/td><td>%20<\/td><td>%25<\/td><\/tr>\n<tr><td>1 yıldan uzun<\/td><td>%13<\/td><td>%18<\/td><td>%25<\/td><\/tr>\n<\/table>\n<ul><li>02.01.2013'ten itibaren açılan veya yenilenen DTH'lerde başlangıç oranları %18, %15, %13'tür; 21.03.2019'dan itibaren açılan veya temdit edilenler için yükseltilmiştir.<\/li><\/ul>\n<table>\n<tr><th>TL mevduat vadesi<\/th><th>01.05.2019 öncesi ve sonrası<\/th><th>30.09.2020 - 30.04.2024<\/th><th>01.05.2024 - 31.10.2024<\/th><th>01.11.2024 - 31.01.2025<\/th><th>01.02.2025 - 08.07.2025<\/th><th>09.07.2025'ten itibaren<\/th><\/tr>\n<tr><td>Vadesiz, ihbarlı ve 6 aya kadar (dahil)<\/td><td>%15<\/td><td>%5<\/td><td>%7,5<\/td><td>%10<\/td><td>%15<\/td><td><b>%17,5<\/b><\/td><\/tr>\n<tr><td>1 yıla kadar (dahil)<\/td><td>%12<\/td><td>%3<\/td><td>%5<\/td><td>%7,5<\/td><td>%12<\/td><td><b>%15<\/b><\/td><\/tr>\n<tr><td>1 yıldan uzun<\/td><td>%10<\/td><td>%0<\/td><td>%2,5<\/td><td>%5<\/td><td>%10<\/td><td><b>%10<\/b><\/td><\/tr>\n<tr><td>Enflasyona bağlı değişken faizli, 1 yıldan uzun<\/td><td>01.05.2019'dan itibaren %0<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>%0<\/td><td>%0<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>Kur korumalı (KKM) ve DTH/altından TL'ye dönüşen hesaplar<\/th><th>01.05.2019'dan itibaren<\/th><th>01.08.2024 - 31.10.2024<\/th><th>01.11.2024'ten itibaren<\/th><th>01.02.2025 - 08.07.2025<\/th><th>09.07.2025'ten itibaren<\/th><\/tr>\n<tr><td>KKM ve DTH'den dönüşen<\/td><td>%0<\/td><td>6 aya kadar %7,5; 1 yıla kadar %5<\/td><td>6 aya kadar %10; 1 yıla kadar %7,5; 1 yıldan uzun %5<\/td><td>6 aya kadar %15; 1 yıla kadar %12; 1 yıldan uzun %10<\/td><td>6 aya kadar %17,5; 1 yıla kadar %15; 1 yıldan uzun %10<\/td><\/tr>\n<tr><td>Altın hesabından dönüşen<\/td><td>%0<\/td><td>6 aya kadar %7,5; 1 yıla kadar %5<\/td><td>6 aya kadar %10; 1 yıla kadar %7,5<\/td><td>6 aya kadar %15; 1 yıla kadar %12<\/td><td>6 aya kadar %17,5; 1 yıla kadar %15<\/td><\/tr>\n<\/table>\n\n<h3>Yatırım fonu (MKYF) katılma payları<\/h3>\n<ul>\n<li>Katılma belgesinin <b>fona iadesinden<\/b> elde edilen gelir kâr payı sayılır; SPKn'ye göre kurulan fonların katılma belgelerine ödenen kâr payları MSİ'dir.<\/li>\n<li>Fonların KV'den istisna <b>portföy kazançları<\/b>: dağıtılsın dağıtılmasın <b>%0<\/b> tevkifat; ayrıca GVK m.94 tevkifatı yok.<\/li>\n<li>Katılma belgesinin iadesi ve YO hisselerinin alım-satımı: genel oran <b>%10<\/b>; beyanname yok, diğer beyannameye dahil edilmez. Ticari işletmeye dahil gelirler beyannameye girer.<\/li>\n<\/ul>\n<table>\n<tr><th>Fonun iktisap tarihi<\/th><th>Stopaj oranı<\/th><th>Dayanak<\/th><\/tr>\n<tr><td>23.12.2020 - 30.04.2024<\/td><td>%0 (değişken, karma, eurobond, yabancı, serbest ve unvanında \"döviz\" geçen fonlar hariç)<\/td><td>3321 sayılı CK; uzatmalar, son 8002 sayılı CK<\/td><\/tr>\n<tr><td>01.05.2024 - 31.10.2024<\/td><td>%7,5<\/td><td>8434 ve 8775 sayılı CK<\/td><\/tr>\n<tr><td>01.11.2024 - 31.01.2025<\/td><td>%10 (genel orana dönüş)<\/td><td>9075 sayılı CK<\/td><\/tr>\n<tr><td>01.02.2025'ten itibaren<\/td><td>%15<\/td><td>9487 sayılı CK<\/td><\/tr>\n<tr><td>09.07.2025'ten itibaren<\/td><td><b>%17,5<\/b><\/td><td>10041 sayılı CK<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Hisse senedi yoğun fonlar<\/b>: elden çıkarma gelirleri Geçici 67'de hisse senedi esaslarına tabi → <b>%0<\/b> (2012/3141 sayılı BKK).<\/li>\n<li><b>GYF ve GSYF<\/b> katılma payları <b>2 yıldan fazla<\/b> elde tutulursa <b>%0<\/b> (4454 sayılı CK, 03.09.2021); beyanname yok.<\/li>\n<li>Portföyünün <b>sürekli en az %51'i BİST hisselerinden<\/b> oluşan fonların <b>1 yıldan fazla<\/b> elde tutulan katılma paylarının satışı tevkifat kapsamı dışında; Geçici 67 uygulanmaz. Süre <b>iktisap tarihinden<\/b> hesaplanır.<\/li>\n<li>Dikkat: Yalnızca nitelikli yatırımcıya satılan, <b>TEFAS'ta işlem görmeyen<\/b> ve oransal sınırlamaya tabi olmayan <b>serbest fonlarda<\/b> 1 yıl geçse bile tevkifat vardır.<\/li>\n<li><b>İpotek finansmanı kuruluşlarının<\/b> (ve kurdukları VFF, KFF) VDMK, İDMK, İTMK ve VTMK gelirleri: 5752 sayılı CK ile 31.12.2022'ye kadar iktisaplarda %5 → 9075 sayılı CK ile %7,5 → 9487 sayılı CK ile genel orana (%10) dönüş.<\/li>\n<li>Yabancı MKYF kâr payları: yerli fonlara özgü düzenleme uygulanmaz; <b>tutarı ne olursa olsun<\/b> yıllık beyanname ile beyan edilir; yurt dışı stopaj mahsup edilir.<\/li>\n<li>01.10.2006'dan itibaren MKYF katılma belgelerinin fona iadesi ve MKYO hisselerinin alım-satımı tevkifat kapsamına alınmıştır.<\/li>\n<\/ul>\n\n<h3>Borsa yatırım fonları (BYF)<\/h3>\n<ul>\n<li>BYF katılma paylarının alım-satım kazancında aracı banka ve aracı kurum genel olarak <b>%10<\/b> keser; iktisap tarihine göre MKYF ile <b>aynı oran takvimi<\/b> geçerlidir (%0 → %7,5 → %10 → %15 → %17,5). Stopaj nihaidir.<\/li>\n<\/ul>\n\n<h3>MKYO, GSYO, GYO kâr payları<\/h3>\n<ul>\n<li>Anonim şirket olarak kurulmak zorunda olan bu ortaklıkların kâr payları, hisse senedi kâr payı esaslarıyla vergilenir: <b>1/2'si istisna<\/b>, kalan tutar diğer stopajlı gelirlerle beyan sınırını (2022: 70.000; 2024: 230.000; 2025: 330.000; 2026: 400.000 TL) aşarsa beyan. Geçici 67 bu konuda olağan rejimi korumuştur.<\/li>\n<\/ul>\n\n<h3>Varantlar<\/h3>\n<ul>\n<li><b>2010/926 sayılı BKK<\/b> (30.09.2010) varantların menkul kıymet sayılacağını belirtti. BİST'te işlem görmesinden doğan gelir, niteliği ne olursa olsun Geçici 67 kapsamında tevkifatla vergilenir.<\/li>\n<li>Hisse senedi veya hisse endeksine dayalı aracı kuruluş varantları: <b>%0<\/b>. Döviz gibi diğer dayanaklara bağlı varantlar: <b>%10<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Özet<\/th><th>Oran<\/th><\/tr>\n<tr><td>Ters repo<\/td><td>%15<\/td><\/tr>\n<tr><td>Yurt içi kira sertifikası (genel)<\/td><td>%10<\/td><\/tr>\n<tr><td>1 yıldan kısa vadeli kira sertifikası, finansman bonosu<\/td><td>%15<\/td><\/tr>\n<tr><td>Hisse yoğun fon, hisse/endeks varantı<\/td><td>%0<\/td><\/tr>\n<tr><td>Diğer varantlar<\/td><td>%10<\/td><\/tr>\n<tr><td>0 nu"], "a": 2, "e": "İndirimli oran değişken, karma, eurobond, yabancı, serbest ve unvanında 'döviz' geçen fonları kapsamaz."}, {"q": "Gayrimenkul yatırım fonu ve girişim sermayesi yatırım fonu katılma paylarından elde edilen kazançlarda %0 oran hangi şartla uygulanır?", "o": ["Katılma paylarının 2 yıldan fazla elde tutulması", "1 yıldan fazla elde tutulması", "Portföyün %51'inin hisse olması", "TEFAS'ta işlem görmesi", "3 aydan fazla elde tutulması"], "a": 0, "e": "4454 sayılı CK ile 2 yıldan fazla elde tutulan GYF ve GSYF katılma paylarında oran %0'dır."}, {"q": "Portföyünün sürekli en az %51'i BİST hisselerinden oluşan bir fonun katılma paylarıyla ilgili hangisi yanlıştır?", "o": ["1 yıldan fazla elde tutulanların satışı tevkifat kapsamı dışındadır", "1 yıllık süre iktisap tarihinden hesaplanır", "Bu satışlarda Geçici 67 uygulanmaz", "TEFAS'ta işlem görmeyen serbest fon olsa bile 1 yıldan fazla tutulunca tevkifat yapılmaz", "1 yıldan önce satışta hisse yoğun fon esasları uygulanır"], "a": 3, "e": "TEFAS'ta işlem görmeyen, yalnızca nitelikli yatırımcıya satılan serbest fonlarda 1 yıl geçse de tevkifat vardır."}, {"q": "Yabancı bir menkul kıymet yatırım fonundan kâr payı elde eden tam mükellef gerçek kişi için hangisi doğrudur?", "o": ["%17,5 stopajla nihai vergilenir", "Tutarı ne olursa olsun yıllık beyanname ile beyan etmelidir", "Beyan sınırını aşmadıkça beyan etmez", "Yarısını beyan eder", "Gelir vergisinden istisnadır"], "a": 1, "e": "Yerli fonlara özgü düzenleme yabancı MKYF'lere uygulanmaz; kâr payı tutarı ne olursa olsun beyan edilir, yurt dışı stopaj mahsup edilir."}, {"q": "Bir GYO'dan 2026'da 900.000 TL brüt kâr payı alan ve başka geliri olmayan tam mükellef gerçek kişi beyannameye kaç TL dahil eder?", "o": ["900.000 TL", "Beyan etmez", "500.000 TL", "50.000 TL", "450.000 TL"], "a": 4, "e": "GYO kâr payı hisse kâr payı esaslarına tabidir: yarısı istisna; kalan 450.000 TL 400.000 TL sınırını aştığı için tamamı beyan edilir."}, {"q": "BİST'te işlem gören ve dövize dayalı bir varanttan 12.000 TL kazanç elde eden tam mükellef gerçek kişiden kaç TL tevkifat yapılır?", "o": ["0 TL", "1.800 TL", "1.200 TL", "2.100 TL", "600 TL"], "a": 2, "e": "Hisse veya endeks dışındaki dayanaklara bağlı varantlarda oran %10'dur: 12.000 x 0,10 = 1.200 TL."}, {"q": "Varantların menkul kıymet olarak nitelendirilmesi gerektiğini belirten düzenleme hangisidir?", "o": ["2010/926 sayılı BKK", "2008/14272 sayılı BKK", "2012/3141 sayılı BKK", "4454 sayılı CK", "2006/10731 sayılı BKK"], "a": 0, "e": "30.09.2010 tarihli ve 2010/926 sayılı BKK varantlarla ilgili tartışmalara son vermiştir."}, {"q": "Hisse senedi yoğun fonların katılma paylarının elden çıkarılmasından doğan gelirlere uygulanan stopaj oranı ve dayanağı hangisidir?", "o": ["%10, 2006/10731 sayılı BKK", "%17,5, 10041 sayılı CK", "%15, 9487 sayılı CK", "%0, 2012/3141 sayılı BKK", "%0, 4454 sayılı CK"], "a": 3, "e": "Hisse yoğun fonlar Geçici 67'de hisse senedi esaslarına tabidir ve %0 oran 2012/3141 sayılı BKK'ya dayanır."}]}, {"id": 9, "kisa": "Dar Mükellefler ve Kurumlar", "baslik": "Dar Mükellef Gerçek Kişiler, Vadeli İşlem ve Opsiyon, Kurumların Menkul Kıymet Gelirleri ve Beyan Takvimi", "ozet": "Dar mükellef gerçek kişilerin menkul kıymet gelirlerini, ÇVÖA etkisini, türev işlemlerde tevkifatı, tam ve dar mükellef kurumların bu gelirlerini ve vergilerde beyan-ödeme zamanlarını özetler.", "notlar": "\n<h3>Dar mükellef gerçek kişiler ve ÇVÖA<\/h3>\n<ul>\n<li>Kitaptaki açıklamalar Türkiye'de <b>işyeri veya daimi temsilcisi bulunmayan<\/b> dar mükellef gerçek kişilere yöneliktir.<\/li>\n<li>Türkiye ile <b>89 ülke<\/b> arasında gelir üzerinden alınan vergilerde çifte vergilendirmeyi önleme anlaşması (ÇVÖA) vardır. Anlaşmalar esas olarak <b>ikamet<\/b> esasına göre vergileme yetkisini paylaştırır; MSİ ve DAK için kaynak ülkede vergileme koşulları ve <b>üst tevkifat oranları<\/b> yer alır.<\/li>\n<li>Örnek: <b>Hollanda<\/b> ÇVÖA m.13'e göre Türk sermaye piyasasına kayıtlı hisse ve tahvillerin elden çıkarılmasından Türkiye'de elde edilen kazanç Türkiye'de vergilenemez (Bakanlık DT ve HB'nin bu istisnadan yararlanamayacağı görüşündedir). Aynı durum Türk vatandaşları için Hollanda'da da geçerlidir.<\/li>\n<\/ul>\n<h4>ÇVÖA Genel Tebliği (Seri No: 4) ve serbest meslek ödemeleri<\/h4>\n<ul>\n<li>Tebliğ 26.09.2017'de RG'de yayımlandı; tevkifat uygulaması Madde 4.2'de.<\/li>\n<li>Serbest meslek (GVK m.65): sermayeden çok şahsi mesaiye, ilmi veya mesleki bilgiye dayanan, ticari olmayan, işverene bağlı olmadan kendi nam ve hesabına yapılan iş. Dar mükellefte Türkiye'de elde edilmiş sayılması için Türkiye'de <b>icra<\/b> edilmesi veya Türkiye'de <b>değerlendirilmesi<\/b> gerekir.<\/li>\n<li><b>GVK m.94<\/b>: serbest meslek ödemelerinden GVK m.18 kapsamındaki işler için <b>%17<\/b>, diğerleri için <b>%20<\/b> tevkifat (noterlere yapılan ödemeler hariç).<\/li>\n<li><b>KVK m.30<\/b> (dar mükellef kurumlar, 2009/14593 sayılı karar, 03.02.2009'dan itibaren): petrol arama faaliyetleri <b>%5<\/b>, diğer serbest meslek kazançları <b>%20<\/b>.<\/li>\n<li>GVK m.86/2: dar mükellefiyette tamamı Türkiye'de tevkif yoluyla vergilenmiş ücret, serbest meslek, MSİ, GMSİ ve diğer kazançlar için yıllık beyanname verilmez. KVK m.30/9: bu kazançlar için beyanname vermek <b>ihtiyaridir<\/b>. Tevkifat <b>nihai<\/b> vergidir.<\/li>\n<\/ul>\n<table>\n<tr><th>ÇVÖA durumu<\/th><th>Tevkifat<\/th><\/tr>\n<tr><td>1. Faaliyet Türkiye'ye gelinmeden sunuluyor<\/td><td>Vergileme hakkı yalnızca mukim ülkenin; tevkifat yok, 1 ve 2 no.lu form gerekmez<\/td><\/tr>\n<tr><td>2. Türkiye'de işyeri veya sabit yer vasıtasıyla<\/td><td>Anlaşmada sınırlama yoksa iç hukuka göre kesinti<\/td><\/tr>\n<tr><td>3. Hizmet anlaşmadaki süreyi aşıyor<\/td><td>Vergileme yetkisi Türkiye'ye geçer; iç hukuka göre kesinti<\/td><\/tr>\n<tr><td>4. Ödeme Türkiye'den yapılıyor (İsveç anlaşması gibi)<\/td><td>İşyeri ve süreye bakılmaksızın kesinti<\/td><\/tr>\n<\/table>\n<ul>\n<li>Kesinti yapılmayan durumlar: hizmetin Türkiye'de ifa edilmemesi, konunun gayrimaddi hak olmaması, Türkiye'nin vergileme yetkisinin olmadığının açıkça tespiti.<\/li>\n<li><b>1 no.lu form:<\/b> hizmet sunucu doldurur, hizmet alımına başlandığı tarihten itibaren <b>30 gün<\/b> içinde vergi sorumlusuna verir. <b>2 no.lu form:<\/b> vergi sorumlusu doldurur, 1 no.lu form ve varsa sözleşmeyle birlikte <b>ödemeden önce<\/b> vergi dairesine verir. Kısım kısım ödemede ilk ödemeden önce vermek yeterli; aynı dönemde birden çok hizmette tek 2 no.lu form ve isim listesi verilebilir.<\/li>\n<li>Süre veya yetki belirsizse vergi sorumlusu <b>kesinti yapmak zorundadır<\/b>; sonradan yetki doğarsa önceki dönemler dahil tevkifat yapılır.<\/li>\n<\/ul>\n\n<h3>Dar mükellef gerçek kişi: araç bazında<\/h3>\n<table>\n<tr><th>Gelir<\/th><th>Vergilendirme<\/th><\/tr>\n<tr><td>Hisse kâr payı<\/td><td>Dağıtan kurumun stopajı nihai; beyan yok. Oran ÇVÖA'daki oranı <b>aşamaz<\/b>.<\/td><\/tr>\n<tr><td>Hisse alım-satımı (olağan rejim)<\/td><td>Tam mükellef ilkeleriyle hesaplanır; kazancın elde edildiği tarihten itibaren <b>15 gün<\/b> içinde, işlemin yapıldığı yer vergi dairesine <b>münferit beyanname<\/b>; vergi de ödenir. Hazine izniyle alınan hisselerde kur farkı dikkate alınmaz.<\/td><\/tr>\n<tr><td>Hisse alım-satımı (Geçici 67)<\/td><td>%0 nihai stopaj; MKYO %10 (1 yıldan fazla tutulursa yok); münferit beyanname yok. BİST'te 1 yıldan fazla tutulan hisse: tümüyle istisna.<\/td><\/tr>\n<tr><td>DT, HB, Türkiye'de satılan ÖST faizi<\/td><td>%10 stopaj nihai (DİBS 22.12.2021 - 31.12.2026 iktisap %0; banka bonoları vade tablosu)<\/td><\/tr>\n<tr><td>Eurobond faizi<\/td><td>%0 stopaj; Geçici 67 dışında<\/td><\/tr>\n<tr><td>Yurt dışı ihraç ÖST faizi (2010/1182 BKK)<\/td><td>21.03.2019'dan itibaren 1 yıla kadar %7, 1 - 3 yıl %3, 3 yıl ve üstü %0<\/td><\/tr>\n<tr><td>Tahvil alım-satımı (olağan)<\/td><td>15 gün içinde münferit beyanname<\/td><\/tr>\n<tr><td>Tahvil alım-satımı (Geçici 67)<\/td><td>%10 (finansman bonosu %15) nihai; DİBS %0<\/td><\/tr>\n<tr><td>Eurobond ve yurt dışı ÖST alım-satımı<\/td><td>Geçici 67 dışı; stopaj yok, münferit beyanname de verilmez<\/td><\/tr>\n<tr><td>Kira sertifikası (yurt içi)<\/td><td>Tam mükellefle aynı tablo; nihai<\/td><\/tr>\n<tr><td>Kira sertifikası (yurt dışı)<\/td><td>Tablo 5 oranları; dar mükellef için beyan yok<\/td><\/tr>\n<tr><td>Ters repo<\/td><td>%15; ÇVÖA oranı daha düşükse anlaşma oranı<\/td><\/tr>\n<tr><td>Mevduat<\/td><td>Vadeye göre stopaj; ÇVÖA varsa anlaşma oranı; beyanname yok<\/td><\/tr>\n<tr><td>Fon katılma payı, BYF<\/td><td>Tam mükellefle aynı oran takvimi; beyanname yok<\/td><\/tr>\n<tr><td>MKYO, GSYO, GYO kâr payı<\/td><td>%0 stopaj; ÇVÖA varsa anlaşma oranı; beyanname yok<\/td><\/tr>\n<tr><td>Varant<\/td><td>Hisse/endeks dayalı %0, diğer %10<\/td><\/tr>\n<\/table>\n\n<h3>Vadeli işlem ve opsiyon sözleşmeleri<\/h3>\n<ul>\n<li>Türkiye'deki vadeli işlem ve opsiyon borsalarında <b>31.12.2008'e kadar<\/b> tevkifat oranı sıfırdı; <b>01.01.2009<\/b>'dan itibaren bu uygulamaya son verildi.<\/li>\n<li><b>2009/14580 sayılı BKK<\/b>: 01.01.2009'dan itibaren tam mükellef gerçek kişi ve kurumların <b>hisse senedi veya hisse endeksine dayalı<\/b> vadeli işlem ve opsiyon kazançlarında <b>%0<\/b>.<\/li>\n<li><b>2010/926 sayılı BKK<\/b>: diğer sözleşmelerde tam mükellef <b>sermaye şirketleri %0<\/b>, diğer tam mükellef kurumsal ve bireysel yatırımcılar <b>%10<\/b>; dar mükellef sermaye şirketleri %0, diğer dar mükellefler %10.<\/li>\n<li>Türev işlemler ayrıca <b>BSMV<\/b>'ye tabidir. 2017 sonuna kadar yalnızca Türkiye'deki borsalarda yapılanlar BSMV'den istisnaydı; <b>7061 sayılı Kanun<\/b> ile <b>2018 başından<\/b> itibaren işlem yerine bakılmaksızın tüm vadeli işlem ve opsiyon muameleleri istisnadır.<\/li>\n<\/ul>\n\n<h3>Kurumların menkul kıymet gelirleri<\/h3>\n<ul>\n<li>Kurumun elde ettiği her gelir <b>safi kurum kazancına<\/b> dahildir. Geçici 67'de tevkif edilen vergi, kurumlar vergisinden <b>mahsup<\/b> edilir; KV çıkmazsa diğer vergi borçlarına mahsup edilir; artan tutar genel hükümlerle <b>red ve iade<\/b> edilir.<\/li>\n<li>Dikkat: Tevkif edilen verginin, <b>kazanç x o kazancın tabi olduğu tevkifat oranı<\/b> tutarını aşan kısmı mahsup edilemez.<\/li>\n<li>Örnek: Market işletmesi banka aracılığı olmadan 100.000 TL ihraç bedelli tahvil alıp bankaya 110.000 TL'ye satarsa, daha önce banka/aracı kurumdan alınmadığı için matrah <b>satış - ihraç bedeli = 10.000 TL<\/b> olur; tevkif edilen vergi yıllık beyannamede mahsup edilir.<\/li>\n<li>Tevkifat oranlarının çoğu gerçek kişilerle aynıdır; bazı gelirler KVK m.5 ile KV'den istisnadır.<\/li>\n<\/ul>\n<h4>23.07.2006 geçişi ve üç aylık konsolidasyon<\/h4>\n<ul>\n<li>Geçici 67'nin (1), (2), (3) fıkralarındaki %15 tevkifat <b>23.07.2006<\/b>'dan itibaren (2006/10731 sayılı BKK'nın RG tarihi) <b>%10<\/b>'a indi.<\/li>\n<li>257 Seri No.lu GV Genel Tebliği: aynı tür menkul kıymette üç aylık dönem içindeki işlemler konsolide edilir. Geçiş döneminde 23.07.2006 <b>öncesi ve sonrası ayrı ayrı<\/b> konsolide edilir:\n<ul><li>İki taraf da kârda → her kısma kendi oranı (öncesi %15, sonrası %10).<\/li>\n<li>Bir taraf kâr, diğeri zarar → net kâr, <b>kârlı tarafın oranıyla<\/b> vergilenir.<\/li>\n<li>Toplam zarar → vergi yok, zarar sonraki döneme aktarılır.<\/li><\/ul><\/li>\n<li>Örnek: öncesi kümülatif 130, sonrası -40 → 90 x %15 = 13,5. Öncesi -90, sonrası 180 → 90 x %10 = 9. Öncesi 30, sonrası 40 → 30 x %15 + 40 x %10 = 8,5.<\/li>\n<\/ul>\n\n<h3>Ek 1 ve Ek 2: Kurumlar için özet<\/h3>\n<table>\n<tr><th>Kurumlar vergisi oranı<\/th><th>Oran<\/th><\/tr>\n<tr><td>Genel (eski)<\/td><td>%20<\/td><\/tr>\n<tr><td>2018, 2019, 2020 (7061 sayılı Kanun)<\/td><td>%22<\/td><\/tr>\n<tr><td>2021<\/td><td>%25<\/td><\/tr>\n<tr><td>2022<\/td><td>%23<\/td><\/tr>\n<tr><td>2023, 2024, 2025<\/td><td>%25<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Tam mükellef kurum:<\/b> hisse alım-satım kazancı KV'ye tabi; KVK'daki şartlar sağlanırsa kazancın <b>%50<\/b>'si istisna. BİST'te işlem gören hisselerde stopaj %0 (MKYO: sermaye şirketi %0, diğer kurumlar %10; 1 yıldan fazla tutulan MKYO stopajsız); BİST dışı hisse stopajsız.<\/li>\n<li>Tam mükellef kurumdan alınan <b>temettü KV'den istisna<\/b>; fon ve yatırım ortaklığı kâr payları istisnadan yararlanamaz (GSYF katılma payı ve GSYO hissesi kâr payları hariç). Menkul ve gayrimenkul YO temettüleri stopajsız, KV'ye tabi (GSYO hariç).<\/li>\n<li>DT ve HB faiz ve alım-satım kazancı: sermaye şirketi %0, diğer kurumsal %10 (Ek 1'de 22.12.2021 - 31.12.2025 iktisaplarda %0; Dikkat: metin ve Ek 2 bu tarihi 31.12.2026 olarak verir); altına dayalı devlet tahvilleri tüm yatırımcılar için %0.<\/li>\n<li>Eurobond faizi %0 stopaj, alım-satım stopajsız; her ikisi de KV'ye tabi. Repo %15. Offshore mevduat stopajsız, yurt dışı vergi mahsup edilir. VİOP teminat nemaları %15.<\/li>\n<li><b>Dar mükellef kurum:<\/b> 2006 öncesi edinilen veya BİST dışı hisse alım-satım kazancı ile 2006 öncesi ihraçlı ÖST alım-satımı KV'ye tabi, <b>15 gün içinde özel beyanname<\/b>; KV sonrası kalan tutar <b>%15<\/b> stopaja tabi; kur farkı vergilenmez; ÜFE endekslemesi yapılabilir. Geçici 67 kapsamındaki gelirlerde stopaj nihai, beyan yok.<\/li>\n<li>Dar mükellef kurumun temettüsü: %15 (22.12.2024'ten itibaren) nihai stopaj; YO temettüsü %10 (GSYO %0).<\/li>\n<\/ul>\n\n<h3>Ek 5: Beyan ve ödeme zamanları<\/h3>\n<table>\n<tr><th>Beyanname<\/th><th>Verme süresi<\/th><th>Ödeme<\/th><\/tr>\n<tr><td>Gelir vergisi<\/td><td>Mart ayının son günü akşamına kadar<\/td><td>1. taksit Mart, 2. taksit Temmuz<\/td><\/tr>\n<tr><td>GV muhtasar (GVK m.94)<\/td><td>Kesinti ayını izleyen ayın 28'i; üç ayda bir verilenler Ocak, Nisan, Temmuz, Ekim<\/td><td>28'i akşamına kadar<\/td><\/tr>\n<tr><td>Kurumlar vergisi<\/td><td>Hesap döneminin kapandığı ayı izleyen <b>4. ayın son günü<\/b> (genelde Nisan)<\/td><td>Nisan (tek ödeme)<\/td><\/tr>\n<tr><td>KV muhtasar (KVK m.31)<\/td><td>İzleyen ayın 28'i<\/td><td>28'i<\/td><\/tr>\n<tr><td>KDV<\/td><td>İzleyen ayın 28'i<\/td><td>28'i<\/td><\/tr>\n<tr><td>Damga vergisi<\/td><td>Ertesi ayın 26'sı<\/td><td>26'sı<\/td><\/tr>\n<tr><td>Gider vergisi<\/td><td>Ertesi ayın 15'i<\/td><td>Beyan süresi içinde<\/td><\/tr>\n<\/table>\n", "sorular": [{"q": "Kitaba göre Türkiye ile kaç ülke arasında gelir üzerinden alınan vergilerde çifte vergilendirmeyi önleme anlaşması imzalanmıştır?", "o": ["79", "89", "99", "69", "109"], "a": 1, "e": "Kitapta Türkiye ile 89 yabancı ülke arasında ÇVÖA imzalandığı belirtilir."}, {"q": "Hollanda ile imzalanan ÇVÖA'nın 13. maddesine göre, Türk sermaye piyasasına kayıtlı hisse ve tahvillerin elden çıkarılmasından Hollanda mukimi bir kişinin Türkiye'de elde ettiği kazanç için hangisi doğrudur?", "o": ["Türkiye'de %15 stopajla vergilenir", "15 gün içinde münferit beyanname ile beyan edilir", "Yarısı Türkiye'de vergilenir", "Türkiye'de %10 stopajla nihai vergilenir", "Türkiye'de vergilendirilemez"], "a": 4, "e": "Anlaşmanın 13. maddesine göre bu kazançlar Türkiye'de vergilendirilemez; aynı durum Türk vatandaşları için Hollanda'da geçerlidir."}, {"q": "Olağan rejime tabi hisse senedi alım-satım kazancı elde eden dar mükellef gerçek kişi bu kazancı nasıl beyan eder?", "o": ["İzleyen yılın Mart ayında yıllık beyanname ile", "Üç aylık dönemi izleyen ayın 26'sına kadar", "Kazancın elde edildiği tarihten itibaren 15 gün içinde münferit beyanname ile", "30 gün içinde özel beyanname ile", "Beyan etmez, stopaj nihaidir"], "a": 2, "e": "Dar mükellef gerçek kişi olağan rejimdeki alım-satım kazancını 15 gün içinde işlemin yapıldığı yer vergi dairesine münferit beyanname ile beyan eder ve vergiyi öder."}, {"q": "ÇVÖA kapsamında hizmet sunan diğer ülke mukimi, kesinti yapılmaması gereken durumlarda 1 no.lu formu vergi sorumlusuna hangi süre içinde vermelidir?", "o": ["Hizmet alımına başlandığı tarihten itibaren 30 gün içinde", "Ödeme tarihinden itibaren 15 gün içinde", "İzleyen yılın Mart ayı sonuna kadar", "Hizmet bitiminden itibaren 60 gün içinde", "Ödemeden sonra 7 gün içinde"], "a": 0, "e": "1 no.lu form, hizmet alımına başlandığı tarihten itibaren 30 gün içinde vergi sorumlularına verilir; 2 no.lu form ödemeden önce vergi dairesine verilir."}, {"q": "GVK m.94'e göre GVK m.18 kapsamına giren serbest meslek işleri dolayısıyla yapılan ödemelerden yapılacak tevkifat oranı kaçtır?", "o": ["%20", "%15", "%10", "%17", "%5"], "a": 3, "e": "GVK m.94: m.18 kapsamındaki serbest meslek işleri için %17, diğerleri için %20."}, {"q": "KVK m.30 uyarınca dar mükellef kurumların petrol arama faaliyetleri dolayısıyla sağladığı kazançlarda tevkifat oranı kaçtır?", "o": ["%20", "%5", "%10", "%15", "%0"], "a": 1, "e": "2009/14593 sayılı karar uyarınca 03.02.2009'dan itibaren petrol arama faaliyetlerinde %5, diğer serbest meslek kazançlarında %20."}, {"q": "Dar mükellef gerçek kişinin ters repo gelirinde ilgili ÇVÖA'da %10 oran öngörülmüşse hangi oran uygulanır?", "o": ["%15", "%25", "%0", "%12,5", "%10"], "a": 4, "e": "Anlaşmadaki oran daha düşükse stopaj %15 değil anlaşma oranında yapılır."}, {"q": "Dar mükellef gerçek kişinin Eurobond ve yurt dışına ihraç edilen ÖST alım-satım kazançları için hangisi doğrudur?", "o": ["%10 stopajla nihai vergilenir", "15 gün içinde münferit beyanname verilir", "Geçici 67 kapsamında değildir; stopaja tabi değildir ve münferit beyanname verilmez", "%0 stopaj kesilir ve ihtiyari beyan zorunludur", "Yarısı istisnadır"], "a": 2, "e": "Kitap bu kazançların stopaja tabi olmadığını ve GVK uyarınca münferit beyanname verilmediğini belirtir."}, {"q": "2010/926 sayılı BKK'ya göre VİOP'ta hisse senedine dayalı olmayan bir vadeli işlem sözleşmesinden kazanç elde eden tam mükellef bir dernek için tevkifat oranı kaçtır?", "o": ["%10", "%0", "%15", "%17,5", "%5"], "a": 0, "e": "Tam mükellef sermaye şirketleri için %0, diğer tam mükellef kurumsal ve bireysel yatırımcılar için %10."}, {"q": "Tam mükellef gerçek kişilerin hisse senedi veya hisse endeksine dayalı vadeli işlem ve opsiyon sözleşmelerinden elde ettiği kazançlarda 01.01.2009'dan itibaren uygulanan oran hangi düzenlemeyle sıfır olarak belirlenmiştir?", "o": ["2010/926 sayılı BKK", "2008/14272 sayılı BKK", "7061 sayılı Kanun", "2009/14580 sayılı BKK", "2006/10731 sayılı BKK"], "a": 3, "e": "2009/14580 sayılı BKK ile bu sözleşmelerden elde edilen DAK'larda oran %0 olarak belirlenmiştir."}, {"q": "Vadeli işlem ve opsiyon sözleşmelerinin BSMV karşısındaki durumu için hangisi doğrudur?", "o": ["Yalnızca Türkiye'deki borsalarda yapılanlar istisnadır", "7061 sayılı Kanunla 2018 başından itibaren işlemin yapıldığı yere bakılmaksızın tamamı istisnadır", "Tümü BSMV'ye tabidir", "Yalnızca tezgâh üstü işlemler istisnadır", "2009'dan itibaren yalnızca hisse kontratları istisnadır"], "a": 1, "e": "2017 sonuna kadar yalnızca Türkiye'deki borsalarda yapılanlar istisnaydı; 7061 sayılı Kanunla 2018'den itibaren tüm işlemler istisna oldu."}, {"q": "Geçici 67 kapsamında tevkifata tabi tutulan geliri ticari faaliyet kapsamında elde eden bir kurumun, mahsup sonrası artan tevkifat tutarı için hangisi doğrudur?", "o": ["Gelecek yıllara devredilmez ve yanar", "Yalnızca KDV borcuna mahsup edilir", "Gider olarak yazılır", "Yatırımcının hesabına aktarılmaz, Hazine'de kalır", "Genel hükümler çerçevesinde red ve iade edilir"], "a": 4, "e": "Tevkif yoluyla ödenen vergi KV'den mahsup edilir; artan tutar genel hükümlerle red ve iade edilir."}, {"q": "Bir kurumdan 10.000 TL'lik alım-satım kazancı üzerinden hatalı olarak 1.500 TL tevkifat yapılmıştır; kazancın tabi olduğu oran %10'dur. Kurumlar vergisinden mahsup edilebilecek tutar kaç TL'dir?", "o": ["1.500 TL", "500 TL", "1.000 TL", "0 TL", "2.500 TL"], "a": 2, "e": "Tevkif edilen verginin, kazanç x tabi olduğu tevkifat oranını aşan kısmı mahsup edilemez: 10.000 x %10 = 1.000 TL."}, {"q": "2006'da aynı tür menkul kıymette Bay A'nın işlemleri: 10.07 kâr 300 TL (%15), 15.07 zarar 100 TL (%15), 25.07 kâr 50 TL (%10), 28.07 zarar 80 TL (%10). Üç aylık konsolidasyonla hesaplanan vergi kaç TL'dir?", "o": ["25,5 TL", "17 TL", "30 TL", "22,5 TL", "45 TL"], "a": 0, "e": "23.07.2006 öncesi kümülatif 200, sonrası -30; net 170 kâr, kârlı tarafın oranı %15 ile: 170 x 0,15 = 25,5 TL."}, {"q": "Aynı tür menkul kıymette 23.07.2006 öncesi dönem kümülatif sonucu -50 TL, sonrası +200 TL'dir. Hesaplanan vergi kaç TL'dir?", "o": ["22,5 TL", "20 TL", "30 TL", "15 TL", "0 TL"], "a": 3, "e": "Net 150 TL kâr, kârlı olan sonraki dönemin oranı %10 ile vergilenir: 150 x 0,10 = 15 TL."}, {"q": "Aynı tür menkul kıymette 23.07.2006 öncesi kümülatif kâr 80 TL, sonrası kümülatif kâr 120 TL'dir. Hesaplanan vergi kaç TL'dir?", "o": ["30 TL", "24 TL", "20 TL", "18 TL", "12 TL"], "a": 1, "e": "Her iki dönem kârlı olduğundan ayrı oranlar uygulanır: 80 x 0,15 + 120 x 0,10 = 12 + 12 = 24 TL."}, {"q": "Tam mükellef bir A.Ş., KVK'daki şartları sağlayan bir hisse satışından 400.000 TL kazanç elde etmiştir. KV oranı %25 ise bu kazanca isabet eden kurumlar vergisi kaç TL'dir?", "o": ["100.000 TL", "25.000 TL", "75.000 TL", "0 TL", "50.000 TL"], "a": 4, "e": "Şartlar sağlanınca kazancın %50'si istisnadır: 200.000 x 0,25 = 50.000 TL."}, {"q": "Dar mükellef bir kurum, BİST'te işlem görmeyen bir hissenin satışından 200.000 TL kazanç elde etmiştir. KV %25 ve KV sonrası kalan tutara %15 stopaj uygulanırsa toplam vergi kaç TL'dir?", "o": ["50.000 TL", "80.000 TL", "72.500 TL", "22.500 TL", "65.000 TL"], "a": 2, "e": "KV = 50.000 TL; kalan 150.000 x 0,15 = 22.500 TL; toplam 72.500 TL. Beyan 15 gün içinde özel beyannameyle yapılır."}, {"q": "2018, 2019 ve 2020 yılları için uygulanan kurumlar vergisi oranı kaçtır?", "o": ["%22", "%20", "%25", "%23", "%30"], "a": 0, "e": "7061 sayılı Kanunla bu üç yıl için oran %22'ye çıkarılmıştır; 2021 %25, 2022 %23, 2023 - 2025 %25."}, {"q": "Tam mükellef bir kurumun aşağıdaki gelirlerinden hangisi kurumlar vergisinden istisnadır?", "o": ["Off-shore mevduat faizi", "Repo geliri", "Eurobond faizi", "Tam mükellef bir A.Ş.'den aldığı temettü", "Menkul kıymet yatırım fonu katılma belgesinden elde ettiği kâr payı"], "a": 3, "e": "Tam mükellef kurumlardan alınan temettü istisnadır; fon kâr payları (GSYF hariç) istisnadan yararlanamaz, diğerleri KV'ye tabidir."}, {"q": "Kurumlar vergisi beyannamesi, hesap dönemi takvim yılı olan bir kurum için hangi ayın sonuna kadar verilir?", "o": ["Mart", "Nisan", "Mayıs", "Şubat", "Temmuz"], "a": 1, "e": "KV beyannamesi hesap döneminin kapandığı ayı izleyen 4. ayın son gününe kadar (genel olarak Nisan) verilir."}, {"q": "Ek 5'e göre aşağıdaki eşleştirmelerden hangisi yanlıştır?", "o": ["Damga vergisi beyannamesi - ertesi ayın 26'sı", "KDV beyannamesi - izleyen ayın 28'i", "GV muhtasar - izleyen ayın 28'i", "Gelir vergisi - Mart ayının son günü", "Gider vergisi beyannamesi - ertesi ayın 26'sı"], "a": 4, "e": "Gider vergisi beyannamesi ertesi ayın 15'i akşamına kadar verilir."}, {"q": "Dar mükellef bir gerçek kişiye 2026'da 100.000 TL brüt kâr payı dağıtılmıştır. İç mevzuattaki oran %15, mukim olduğu ülkeyle yapılan ÇVÖA'daki üst oran %10'dur. Kesilecek vergi kaç TL'dir?", "o": ["15.000 TL", "25.000 TL", "10.000 TL", "5.000 TL", "0 TL"], "a": 2, "e": "Dar mükellefin kâr payı stopajı ÇVÖA'daki oranı aşamaz: 100.000 x %10 = 10.000 TL; stopaj nihaidir."}, {"q": "Dar mükellef bir gerçek kişinin 2026'da açtığı 6 ay vadeli TL mevduatına 40.000 TL faiz ödenmiştir. İç mevzuat oranı %17,5, ilgili ÇVÖA'daki oran %10'dur. Kesilecek vergi kaç TL'dir?", "o": ["4.000 TL", "7.000 TL", "6.000 TL", "5.000 TL", "0 TL"], "a": 0, "e": "ÇVÖA bulunduğunda stopaj anlaşmadaki oranda yapılır: 40.000 x %10 = 4.000 TL."}, {"q": "Dar mükellef bir kuruma Türkiye'de icra ettiği ve ÇVÖA'ya göre Türkiye'nin vergileme yetkisinin bulunduğu serbest meslek hizmeti için 200.000 TL ödenecektir. Anlaşmada özel bir sınırlama yoksa KVK m.30'a göre kesilecek vergi kaç TL'dir?", "o": ["34.000 TL", "10.000 TL", "30.000 TL", "40.000 TL", "0 TL"], "a": 3, "e": "Dar mükellef kurumların serbest meslek kazançlarında (petrol arama dışı) oran %20'dir: 200.000 x 0,20 = 40.000 TL."}]}, {"id": 10, "kisa": "Geçici 67: Kapsam ve Usul", "baslik": "GVK Geçici 67: Tevkifat Sorumluları, Tevkifata Tabi Gelirler, İstisnalar, Zarar Mahsubu, İhtiyari Beyan ve Bildirimler", "ozet": "Geçici 67'nin (1) numaralı fıkrası kapsamında kimin tevkifat yapacağını, hangi gelirlerin kapsam içinde ve dışında olduğunu, üç aylık dönem ve zarar mahsubunu, ihtiyari beyanı ve Bakanlığa bildirimleri anlatır.", "notlar": "\n<h3>Kapsam: dört tür getiri<\/h3>\n<ul>\n<li>Geçici 67/1'e göre <b>bankalar ve aracı kurumlar<\/b> şu tutarlar üzerinden tevkifat yapar:\n<ol><li>Alım-satımına aracılık ettikleri menkul kıymet ve diğer SPA'nın <b>alış ve satış bedelleri farkı<\/b>;<\/li>\n<li>Alımına aracılık ettiklerinin <b>alış ve itfa bedelleri farkı<\/b>;<\/li>\n<li>Tahsiline aracılık ettikleri, başka bir menkul kıymete bağlı olmayan <b>dönemsel getiriler<\/b>;<\/li>\n<li><b>Ödünç işlemlerinde<\/b> ödünç verenin lehine kalan tutar.<\/li><\/ol><\/li>\n<li>Geçici 67'de başka tevkifat halleri de vardır: komisyon iadeleri, mevduat faizi, ters repo, vadeli işlem ve opsiyon gelirleri. Mevduat, repo ve katılım bankası kâr paylarında (GVK m.75/7, 12, 14) tevkifatı <b>ödemeyi yapan<\/b> yapar (fıkra 4).<\/li>\n<li>Maddedeki hükümlerin ayrıntısı <b>257 ve 258 Seri No.lu GV Genel Tebliğlerinde<\/b> yer alır.<\/li>\n<\/ul>\n<h4>\"Menkul kıymet ve diğer sermaye piyasası aracı\" tanımı<\/h4>\n<ul>\n<li>(a) Türkiye'de ihraç edilmiş ve SPK kaydına alınmış ve/veya (b) Türkiye'deki menkul kıymet ve vadeli işlem-opsiyon borsalarında işlem gören kıymetler; (c) kayda alınmamış veya borsada işlem görmese de <b>Hazine ve diğer kamu tüzel kişilerince<\/b> ihraç edilenler.<\/li>\n<li>Banka ve aracı kurumların taraf olduğu veya aracılık ettiği, ekonomik veya finansal göstergeye dayalılar dahil <b>vadeli işlem ve opsiyon sözleşmeleri<\/b> \"diğer SPA\" sayılır (fıkra 14). Bakanlık görüşüne göre forward ve benzeri türevler de buna dahildir.<\/li>\n<li>Türkiye'de kurulu şirketin yurt dışında ihraç ettiği tahviller de SPK kaydına alındığı için kapsamdadır. Yabancı şirketin yurt dışında ihraç ettiği ama Türk borsasında işlem gören kıymet de kapsamdadır.<\/li>\n<li>Bu tanım dışındaki kıymetlerin alım-satım veya itfa getirileri fıkra 1 kapsamında tevkifata tabi değildir.<\/li>\n<\/ul>\n\n<h3>Tevkifat sorumluları<\/h3>\n<ul>\n<li>Türkiye'de faaliyet gösteren <b>bankalar ve TCMB<\/b> ile SPKn kapsamında Türkiye'de faaliyet gösteren <b>aracı kurumlar<\/b>. Bunlar dışındaki kurumların fıkra 1 kapsamında tevkifat sorumluluğu yoktur.<\/li>\n<li><b>Sınırlı sorumluluk:<\/b> her kurumun sorumluluğu kendisine gelen bilgi-belge ile sınırlıdır; eksik, yanlış veya yanıltıcı bilgi nedeniyle ziyaa uğrayan vergi, cezalı olarak <b>bildirimi yapan<\/b> adına tarh edilir. Sorumluluk <b>kusur sorumluluğudur<\/b>; kurumdan basiretli tacir özeni beklenir.<\/li>\n<li>Tevkifat, aracılık edilen kazançlarla ilgilidir; banka ve aracı kurumların <b>kendi portföylerinden<\/b> elde ettikleri kazançlar kapsam dışıdır (ihaleden alıp itfaya kadar tutulan DT faizi, kendi portföyünden müşteriye veya başka bankaya satış). Banka başka bir kurumu aracı kılarak alırsa tevkifat yapılır.<\/li>\n<li>Örnek: Banka kendi portföyündeki bonoyu 3.000.000 TL'den alıp yatırımcıya 3.115.000 TL'ye satarsa bankanın 115.000 TL'si tevkifata tabi değildir; yatırımcı bonoyu bankaya 3.275.000 TL'ye geri satarsa yatırımcının <b>160.000 TL<\/b> kazancından (tam veya dar mükellef gerçek kişiyse) <b>%10<\/b> kesilir.<\/li>\n<\/ul>\n<h4>Saklamacı kuruluşlar<\/h4>\n<ul>\n<li><b>Takasbank veya MKK dışındaki<\/b> saklamacıdan saklama hizmeti alan yatırımcılarda tevkifat, varlıkların bulunduğu <b>saklamacı kuruluşça<\/b> yapılır (fıkra 17'nin Bakanlığa verdiği yetki). Gerekçe: maliyet ve fiyat bilgisini en sağlıklı saklamacı izler; bazı tezgâh üstü işlemler saklamacı nezdinde gerçekleşir.<\/li>\n<li>Aracı kurum, işlem tarihi, alış maliyeti veya satış fiyatı bilgisini <b>işlem günü<\/b> saklamacıya bildirir. Saklamacı ikinci işlem gelince <b>FİFO<\/b> veya gün içi işlemlerde <b>AOF<\/b> ile kazancı bulur ve tevkifat yapar; sorumluluğu gelen bilgi-belge ile sınırlıdır.<\/li>\n<li>Tahvil itfa ve kupon ödemesi saklamacıya yapılırken ödeyen tevkifat yapmaz; saklamacı <b>nihai sahibine öderken<\/b> keser. MKK/Takasbank hesaplarındaki tahvillerde aracı kurum yoksa tevkifatı bildirilen alış maliyetine göre <b>Takasbank<\/b> yapar.<\/li>\n<li>Müşteri, işlem talimatında MKK dışı saklamacı kullandığını ve tevkifatın saklamacıca yapılacağını <b>yazılı<\/b> belirtirse banka/aracı kurumun sorumluluğu yoktur; bilgiler (komisyon dahil) saklamacıya iletilir. Yazılı bildirim yoksa tevkifatı banka/aracı kurum yapar. Bildirimi saklamacı da yapabilir.<\/li>\n<li>Virman işlemleri 257 Seri No.lu Tebliğin \"virman işlemlerinde tarih ve maliyet bildirimi\" esaslarına göre yürür.<\/li>\n<\/ul>\n<h4>Tezgâh üstü işlemler<\/h4>\n<ul>\n<li>Müşteri talimatıyla <b>mülkiyet devri<\/b> öngören, aynı veya başka saklamacıdaki başka bir müşteri hesabına aktarım <b>alım-satım sayılır<\/b>; teşkilatlanmış piyasada tescil edilmese de tevkifata tabidir. Teminat ve ödünç sözleşmesine dayanan aktarımlar hariçtir.<\/li>\n<li>İşlem fiyatı: toplam bedelli virmanda toplam bedel / adet; bedelsiz virmanda müşterinin <b>yazılı<\/b> bildirdiği fiyat. Bu fiyat alıcı için de maliyettir.<\/li>\n<li>Bildirilen fiyat, virmandan <b>önceki günün AOF'sinin %10 altında veya üstünde<\/b> olabilir; %10 marj aşılırsa önceki günün AOF'si esas alınır.<\/li>\n<li>Fiyat bildirilmemişse: o gün işlem görmüyorsa bir önceki günün BİST AOF'si (Tebliğe göre ikinci seans, yoksa ilk seans); önceki gün de işlem görmemişse hisse için <b>son işlem gördüğü gün<\/b> AOF'si, DT ve HB için <b>TCMB fiyatları<\/b>.<\/li>\n<li>ADR, GDR, DR gibi araçlara dönüştürülerek yurt dışı hesaba gönderilen hisselerde dönüşüm tarihi elden çıkarma sayılır, o tarihe kadarki kazanç tevkifata tabidir; geri dönüşte bu hasılat yeni maliyettir.<\/li>\n<\/ul>\n\n<h3>Gelirleri üzerinden tevkifat yapılacaklar<\/h3>\n<ul>\n<li>SPKn'ye göre kurulan <b>borsa yatırım fonları (BYF) ve emeklilik yatırım fonları (EYF)<\/b> dışındaki tüm gerçek ve tüzel kişiler.<\/li>\n<li>Gelir sahibinin gerçek/tüzel, tam/dar mükellef, mükellefiyeti olup olmaması, vergiden muaf olması veya gelirin istisna olması <b>önemsizdir<\/b>.<\/li>\n<\/ul>\n\n<h3>Kapsam dışında kalan gelirler<\/h3>\n<ul>\n<li><b>Fıkra 1 gereği:<\/b> Hazine'nin yurt dışında ihraç ettiği kıymetlerin (Eurobond) alım-satım, itfa ve dönemsel getirileri; <b>hisse senedi kâr payları<\/b>; tam mükellef kurumlara ait, BİST'te işlem gören ve <b>1 yıldan fazla<\/b> tutulan hisselerin satışı; portföyünün sürekli en az <b>%51<\/b>'i BİST hissesi olan fonların <b>1 yıldan fazla<\/b> tutulan katılma belgeleri.<\/li>\n<li><b>Fıkra 9:<\/b> 01.01.2006'dan <b>önce ihraç<\/b> edilmiş her nevi tahvil, HB ile TKİ ve ÖİB menkul kıymetleri.<\/li>\n<li><b>Fıkra 10:<\/b> 01.01.2006'dan <b>önce iktisap<\/b> edilmiş menkul kıymet ve diğer SPA.<\/li>\n<li>Kâr paylarının kapsam dışında tutulma nedeni başka maddede stopaja tabi olmaları (mükerrer vergilemeyi önlemek); 1 yıl ve %51 şartları uzun vadeli hisse yatırımını teşvik içindir.<\/li>\n<li><b>Değişken fonlar:<\/b> Takasbank'ın günlük açıkladığı bilgilere göre %51 şartı ihlal edilirse <b>ertesi günden<\/b> itibaren tevkifat yapılır; Takasbank'ın sorumluluğu gelen bilgi-belge ile sınırlı.<\/li>\n<li>Ödünç işlemi: temettü ödemesi Geçici 67 dışında olsa da ödünç alanın ödünç verene ödediği <b>temettü telafi tazminatı<\/b> ödünç verenin lehine kalan gelir olduğundan tevkifata tabidir.<\/li>\n<li>5527 sayılı Kanunla MKYF katılma belgelerinin fona iadesi ve MKYO hisselerinin alım-satımı kapsama alınmış, %51 şartlı fonlar kapsam dışına çıkarılmıştır.<\/li>\n<\/ul>\n\n<h3>Tevkifat dönemi, beyan ve ödeme<\/h3>\n<table>\n<tr><th>Dönem<\/th><th>Aylar<\/th><th>Beyan ve ödeme<\/th><\/tr>\n<tr><td>1<\/td><td>Ocak - Şubat - Mart<\/td><td>26 Nisan akşamı<\/td><\/tr>\n<tr><td>2<\/td><td>Nisan - Mayıs - Haziran<\/td><td>26 Temmuz akşamı<\/td><\/tr>\n<tr><td>3<\/td><td>Temmuz - Ağustos - Eylül<\/td><td>26 Ekim akşamı<\/td><\/tr>\n<tr><td>4<\/td><td>Ekim - Kasım - Aralık<\/td><td>26 Ocak akşamı<\/td><\/tr>\n<\/table>\n<ul>\n<li>Tevkifat <b>üçer aylık<\/b> dönemler itibarıyla yapılır; matrah işlem günündeki bilgilere göre bulunur, tevkifat <b>takas tarihinde<\/b> yapılır.<\/li>\n<li>Banka ve aracı kurumlar internet ortamında beyannameyle, dönemi izleyen ayın <b>26'sı akşamına kadar<\/b> beyan eder ve öder; <b>genel müdürlük<\/b> bağlı olduğu vergi dairesine yapar. Saklamacılar kendi vergi dairelerine beyan eder.<\/li>\n<li>Dikkat (kaynakta çelişki): 2.8 bölümü beyan ve ödemeyi 26'sı olarak verirken 2.12 bölümü beyanı <b>20'si<\/b>, ödemeyi 26'sı olarak verir; Ek 5'te GVK m.94 muhtasarı ise <b>28'i<\/b>dir. Ödeme günü (26) her iki bölümde aynıdır.<\/li>\n<li>Yurt dışında yerleşik yatırımcılar için saklamacıların tevkifatı, yalnızca <b>ilk üç aylık döneme<\/b> münhasır olarak <b>Haziran'ın 26'sına<\/b> kadar beyan edilip ödenir.<\/li>\n<li>Birden fazla banka/aracı kurum kullanılırsa her biri kendi işlemleri için ayrı tevkifat yapar. Aynı kurumda birden fazla hesap <b>tek hesap<\/b> sayılır (müşteri isterse ayrı). <b>Müşterek hesaplar<\/b> tek hesap sayılır ve bireysel hesapla ilişkilendirilmez.<\/li>\n<\/ul>\n<h4>Hazine ve Maliye Bakanlığına bildirim<\/h4>\n<ul>\n<li>Bildirim gereken haller: kıymetin <b>başka bir kişi adına nakli<\/b> (aynı veya başka kurumda); sahibince <b>fiziken teslim alınması<\/b>; sahibince <b>fiziken teslim edilmesi<\/b>.<\/li>\n<li>Süre: üç aylık dönemi izleyen <b>ayın sonuna kadar<\/b> internet ortamında; genel müdürlükler yapar.<\/li>\n<li>Tevkifata tabi tutulan mülkiyet devri virmanları ayrıca bildirilmez.<\/li>\n<\/ul>\n\n<h3>Alım-satımların bir kısmının zararla sonuçlanması<\/h3>\n<ul>\n<li>Üç aylık dönemde <b>aynı tür<\/b> menkul kıymetteki birden çok alım-satım <b>tek işlem<\/b> sayılır; işlemler konsolide edilerek vergi bulunur. Fazla kesilen vergi <b>müşterinin hesabına<\/b> aktarılır.<\/li>\n<li>Dönem sonucu zarar ise izleyen üç aylık döneme <b>takvim yılını aşmamak<\/b> kaydıyla devredilir. <b>Yılın son üç aylık dönemindeki zarar devredilemez.<\/b><\/li>\n<li>Zarar mahsubu yalnızca aynı tür kıymetlerin <b>alım-satım kazançlarına<\/b> uygulanır; alım-satım zararı <b>itfa gelirine mahsup edilemez<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Aynı tür sınıflandırması<\/th><th>Not<\/th><\/tr>\n<tr><td>1) Sabit getirili menkul kıymetler<\/td><td>Değişken faizli, dövize/altına endeksli tahvil ve bonolar da burada<\/td><\/tr>\n<tr><td>2) Değişken getirili menkul kıymetler<\/td><td>Hisse senetleri<\/td><\/tr>\n<tr><td>3) Diğer SPA (vadeli işlem ve opsiyon)<\/td><td>Menkul kıymete bağlı olmayan türevler; bağlı olanlar ilgili kıymetin sınıfında<\/td><\/tr>\n<tr><td>4) Yatırım fonu katılma belgeleri ve YO hisseleri<\/td><td>5527 sayılı Kanun ve 2006/10731 BKK ile ayrı sınıf<\/td><\/tr>\n<\/table>\n<ul>\n<li>Sınıflandırmada endeksli olma niteliği göz ardı edilir; temel getiri türüne (sabit/değişken) bakılır. Tebliğ ilk hâliyle üç sınıf ihdas etmiştir; fon katılma belgeleri sonradan ayrı sınıf olmuştur.<\/li>\n<li>Dikkat (kaynakta çelişki): kitap aynı bölümde sınıflandırmayı bir yerde dört sınıf, bir yerde 'üç sınıf ihdas edilmiştir' diye verir; ikinci anlatımda fon katılma belgeleri ayrı (dördüncü) sınıf olarak eklenir. Sonuç değişmez: hisse, tahvil, türev ve fon/YO payları birbirine mahsup edilemez.<\/li>\n<li>Örnek: aynı çeyrekte hisseler +22.000 / -5.000, MKYO +5.000, DT/HB -15.000 → hisse kârı 17.000, MKYO kârı 5.000 ayrı; tahvil zararı hisseye mahsup edilemez, yıl içinde sonraki tahvil kazancına devreder.<\/li>\n<\/ul>\n\n<h3>İhtiyari beyan (fıkra 7 ve 11)<\/h3>\n<ul>\n<li>Fıkra 7: (1)-(4) fıkralara göre tevkifata tabi kazançlar için gerçek kişiler yıllık veya münferit beyanname <b>vermez<\/b>. Dar mükelleflerce Hazine, 4749 sayılı Kanuna göre kurulan VKŞ ve tam mükellef kurumların yurt dışında ihraç ettiği kıymet gelirleri için münferit veya özel beyanname verilmez. Ticari kazançta tevkifat mahsup edilir; ancak (2) ve (3) fıkradaki tevkifatın kazanç x tabi oran tutarını aşan kısmı mahsup edilmez.<\/li>\n<li>Fıkra 11: dar mükellefler dahil, tevkifata tabi <b>elden çıkarma<\/b> kazançları için takvim yılı itibarıyla <b>ihtiyari yıllık beyanname<\/b> verilebilir. Aynı tür kıymetlerin <b>yıl içindeki zararlarının tamamı<\/b> mahsup edilir.<\/li>\n<li>Yalnızca <b>gerçek kişiler<\/b> (tam ve dar) verebilir; yalnızca <b>alım-satım<\/b> kazançları için, <b>faiz ve itfa gelirleri<\/b> için değil. Türevlerde yalnızca alım-satım kazancı/zararı \"diğer SPA\" kategorisinde beyan edilebilir.<\/li>\n<li>Oran: başlangıçta %15 tek oran; <b>23.07.2006'dan %10<\/b>; <b>14.11.2008'den MKYO hariç hisselerde %0<\/b>; artan oranlı tarife uygulanmaz. Kitap 9487 (%15) ve 10041 (%17,5) sayılı CK'ları da not eder.<\/li>\n<li>Hesaplanan vergiden yıl içinde tevkif edilen (beyana dahil kazançlara ait) vergiler mahsup edilir; artan <b>red ve iade<\/b> edilir (252 Seri No.lu Tebliğ). Ödeme gerekirse Mart ve Temmuz'da iki eşit taksit (GVK m.117). Süre GVK m.92.<\/li>\n<li>Mahsup edilemeyen zarar <b>başka gelir unsuruna mahsup edilmez ve izleyen yıla devredilmez<\/b>.<\/li>\n<li>Vergi dairesi: tam mükellef → ikametgâh (öteden beri mükellefse bağlı olduğu) VD; <b>dar mükellef → İstanbul VDB Boğaziçi Vergi Dairesi<\/b>.<\/li>\n<li>İhtiyari beyanı tercih ettiren asıl etken, yıl içindeki zararların mahsup imkânıdır.<\/li>\n<\/ul>\n\n<h3>Dar mükellefler, yetki ve diğer<\/h3>\n<ul>\n<li>Dar mükellef gerçek kişi ve kurumların fıkra 1 kapsamındaki gelirlerine <b>07.07.2006<\/b>'dan itibaren <b>%0<\/b> tevkifat uygulanır (2.12.2). Kitap, dar mükelleflere %0 oranın iptaline ilişkin bir Anayasa Mahkemesi kararı bulunduğunu dipnotlarda belirtir.<\/li>\n<li>Tam mükellef kurumlar ile Türkiye'de işyeri veya daimi temsilcisi olan dar mükellef kurumların <b>kendi aralarındaki<\/b> vadeli işlem ve opsiyon kazançlarında tevkifat yapılmaz (fıkra 14); banka ve benzeri finans kurumlarında işyeri şartı aranmaz.<\/li>\n<li><b>Yetki:<\/b> Cumhurbaşkanı tevkifat oranlarını kazanç türü ve elde edenler itibarıyla, fonlarda portföy yapısına göre ayrı ayrı <b>sıfıra kadar indirmeye veya %15'e kadar artırmaya<\/b> yetkilidir (kitaptaki ifade).<\/li>\n<li>Gerçek kişilerde Geçici 67 kazançları için tutarı ne olursa olsun beyanname verilmez (tam veya dar fark etmez); ticari faaliyet kapsamındaysa ticari kazanca girer. Dar mükellef kurumların işyerine atfedilmeyen veya tamamı tevkifata tabi tutulmuş kazançları için yıllık veya özel beyanname verilmez.<\/li>\n<\/ul>\n", "sorular": [{"q": "Geçici 67/1 kapsamında banka ve aracı kurumların tevkifat yapacağı tutarlar arasında aşağıdakilerden hangisi yoktur?", "o": ["Alış ve satış bedelleri farkı", "Hisse senedi kâr payları", "Alış ve itfa bedelleri farkı", "Menkul kıymete bağlı olmayan dönemsel getiriler", "Ödünç işlemlerinde ödünç verenin lehine kalan tutar"], "a": 1, "e": "Hisse senedi kâr payları fıkra 1 kapsamı dışında bırakılmıştır; diğer dördü tevkifata tabi getirilerdir."}, {"q": "Geçici 67/1 kapsamında tevkifat yapmakla sorumlu olanlar aşağıdakilerden hangisinde doğru verilmiştir?", "o": ["Yalnızca aracı kurumlar", "Menkul kıymeti ihraç eden şirketler", "MKK ve Borsa İstanbul", "Portföy yönetim şirketleri ve yatırım fonları", "Türkiye'de faaliyet gösteren bankalar, TCMB ve aracı kurumlar"], "a": 4, "e": "Tevkifatı bankalar ve TCMB ile SPKn kapsamında faaliyet gösteren aracı kurumlar yapar; diğer kurumların fıkra 1 kapsamında sorumluluğu yoktur."}, {"q": "Banka ve aracı kurumların Geçici 67 tevkifatındaki sorumluluğu için hangisi doğrudur?", "o": ["Kusursuz ve sınırsız sorumluluktur", "Yalnızca yatırımcı sorumludur", "Kendisine gelen bilgi-belge ile sınırlı bir kusur sorumluluğudur", "Sorumluluk MKK'ya aittir", "Yanlış bilgi verilse de ziyaa uğrayan vergi bankadan alınır"], "a": 2, "e": "Sınırlı sorumluluk ilkesi geçerlidir; yanlış bilgi nedeniyle ziyaa uğrayan vergi cezalı olarak bildirimi yapan adına tarh edilir."}, {"q": "2015 yılında bir banka kendi portföyündeki Hazine bonosunu 5.000.000 TL'ye almış, yatırımcı A'ya 5.200.000 TL'ye satmıştır. A bonoyu daha sonra bankaya 5.450.000 TL'ye geri satmıştır. Tevkifat oranı %10 ise A tam mükellef gerçek kişiyken banka A adına kaç TL tevkifat yapar?", "o": ["25.000 TL", "45.000 TL", "20.000 TL", "0 TL", "37.500 TL"], "a": 0, "e": "Bankanın kendi portföy kazancı (200.000 TL) tevkifata tabi değildir. A'nın kazancı 5.450.000 - 5.200.000 = 250.000 TL; %10 = 25.000 TL. (2021 sonrası iktisap edilen DİBS'te oran %0'dır; soru kitabın 2015 tarihli örneğine dayanır.)"}, {"q": "Takasbank veya MKK dışındaki bir saklamacı kuruluştan saklama hizmeti alan yatırımcının Geçici 67 tevkifatını kural olarak kim yapar?", "o": ["İşleme aracılık eden aracı kurum", "Menkul kıymetin ihraççısı", "Yatırımcının kendisi", "Saklama hizmeti veren saklamacı kuruluş", "Borsa İstanbul"], "a": 3, "e": "Bakanlık, fıkra 17'deki yetkiyle bu yatırımcılar için tevkifatın saklamacı kuruluşça yapılmasını uygun bulmuştur."}, {"q": "MKK nezdindeki hesaplarda bulunan tahvillerin itfa ve kupon ödemelerinde tahsile aracılık eden başka bir kurum yoksa tevkifatı kim yapar?", "o": ["Hazine", "Takasbank", "MKK", "Menkul kıymeti ihraç eden kurum", "Yatırımcının bağlı olduğu vergi dairesi"], "a": 1, "e": "Bu durumda tevkifat, kendisine bildirilen alış maliyeti esas alınarak Takasbank tarafından yapılır."}, {"q": "Müşteri talimatıyla bedelsiz olarak başka bir müşteri hesabına virmanlanan bir hissenin önceki gün AOF'si 20 TL'dir. Müşteri yazılı olarak 23 TL fiyat bildirmiştir. Tevkifata esas işlem fiyatı kaç TL'dir?", "o": ["23 TL", "22 TL", "21,5 TL", "18 TL", "20 TL"], "a": 4, "e": "Bildirilen fiyat önceki günün AOF'sinin en fazla %10 üstünde (22 TL) olabilir; 23 TL marjı aştığı için önceki günün AOF'si (20 TL) esas alınır."}, {"q": "Önceki gün AOF'si 20 TL olan hisse için müşteri bedelsiz virmanda 21,5 TL fiyat bildirmiştir. Esas alınacak fiyat ve alıcının maliyeti n
