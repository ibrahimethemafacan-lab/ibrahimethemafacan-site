<style>
/* Layout: beyaz sol menü + ferah içerik alanı; kartlar, ilerleme halkaları, bölüm başına renk. Bilinçli olarak tek (açık) tema. */
:root{
  color-scheme:light;
  --bg:#F2F7FD; --surface:#FFFFFF; --ink:#141A2B; --ink2:#3B4458; --muted:#6B7488; --line:#E6EAF2; --line2:#F0F3F8;
  --accent:#0E8F7E; --accent-ink:#0B6F62; --accent-soft:#E3F5F2; --mark:#FFF1B8;
  --ok:#16A34A; --ok-soft:#EAF8EF; --bad:#DC3B3B; --bad-soft:#FDEDED; --book:#B7791F; --book-soft:#FDF4E3;
  --shadow:0 1px 2px rgba(20,26,43,.04),0 6px 20px rgba(20,26,43,.06);
  --shadow-h:0 2px 4px rgba(20,26,43,.05),0 12px 32px rgba(20,26,43,.10);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* Sol menü */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#12A594,#0B6F62);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:0 6px 16px rgba(14,143,126,.28);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.nav .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.nav .grp{display:flex;flex-direction:column;gap:3px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);background:var(--line2);border-radius:12px;padding:12px 14px}

/* İçerik */
main{padding-block:32px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.18;margin:0;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
h2{letter-spacing:-.015em}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 26px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--c,#0E8F7E) 16%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 100%,color-mix(in srgb,var(--c,#0E8F7E) 8%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,#0E8F7E) 12%,#fff);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:62ch}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
.ring .v span{font-size:11px;color:var(--muted);font-weight:600}

/* Segment kontrol */
.seg{display:inline-flex;background:#E9EDF4;border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,43,.12)}

/* Notlar */
.notes{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 34px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.notes h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.015em;color:var(--ink);margin:36px 0 12px}
.notes h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.notes h3:first-child{margin-top:0}
.notes h4{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px}
.notes p,.notes li{max-width:72ch}
.notes b{color:var(--ink);font-weight:700}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:5px 0}
.notes li::marker{color:var(--c,var(--accent))}
.notes mark{background:var(--mark);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.notes .small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line2)}
.notes tr:last-child td{border-bottom:0}
.notes tr:nth-child(even) td{background:#FAFBFD}
.notes th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F8FB}
.notes td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .key{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);padding:14px 16px;border-radius:12px;margin:16px 0;color:var(--ink)}

/* Quiz */
.qbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);font-weight:500}
.stat b{color:var(--ink);font-size:16px;font-weight:800}
.meter{flex:1 1 140px;height:8px;background:var(--line2);border-radius:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:#F3A0A0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:#C9D1DE}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1DE}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(14,143,126,.25)}
.btn.pri:hover{background:var(--accent-ink)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;border:1px solid transparent}
.q.done-ok{border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.q.done-bad{border-color:color-mix(in srgb,var(--bad) 25%,#fff)}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--line2);border-radius:8px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.book{background:var(--book-soft);color:var(--book)}
.tag.own{background:var(--line2);color:var(--muted)}
.tag.src{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.qt{font-size:15.5px;line-height:1.6;white-space:pre-line;margin:0 0 14px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);background:#FBFEFD}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line2);color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:14px;padding:12px 14px;border-radius:12px;background:#F7F9FC;color:var(--ink2);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.exp .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.exp.ok .dot{background:var(--ok)} .exp.bad .dot{background:var(--bad)}
.exp b{display:block;color:var(--ink);margin-bottom:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center;background:var(--surface);border-radius:var(--r)}

/* Genel bakış */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s;border-top:4px solid var(--c)}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 10px;border-radius:999px}
.card .t{font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .d{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;display:flex;justify-content:space-between}
.card .meter{flex:none;height:6px}
.facts{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.facts h2{font-size:18px;font-weight:800;margin:0 0 12px}
.facts dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:#F7F9FC;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.facts dt{color:var(--ink2);font-size:13.5px} .facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:8;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .logo{width:32px;height:32px;border-radius:10px;font-size:13px}
  .brand span,.navlbl,.rail .foot,.nav .pc{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{flex-direction:row;gap:6px}
  .nav a{grid-template-columns:auto auto;white-space:nowrap;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;gap:8px}
  .nav a.on{border-color:transparent}
  .nav .ic{width:24px;height:24px;border-radius:999px;font-size:11px}
  .qbar{position:static}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .ring{width:84px;height:84px}
  .notes{padding:22px 18px}
  .notes td:first-child{white-space:normal}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .facts dl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .tiles{grid-template-columns:minmax(0,1fr)} .seg{align-self:stretch} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Sesli anlatım oynatıcısı */
.btn.listen{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-soft)}
.btn.listen:hover{border-color:var(--accent)}
.notes .speaking{background:#FFF6D1;box-shadow:0 0 0 6px #FFF6D1;border-radius:6px;transition:background .2s}
.notes tr.speaking td{background:#FFF6D1!important}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 28px rgba(20,26,43,.28)}
.fab-btn .disc{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.fab-btn.live .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}50%{box-shadow:0 0 0 8px rgba(18,165,148,0)}}
.panel{width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(20,26,43,.18);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel .ph small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .ph b{display:block;font-size:14.5px;line-height:1.3;letter-spacing:-.01em}
.panel .x{border:0;background:var(--line2);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:16px;line-height:1;color:var(--muted)}
.panel .now{font-size:13.5px;line-height:1.5;color:var(--ink2);background:#F7F9FC;border-radius:12px;padding:10px 12px;min-height:62px;max-height:120px;overflow:auto}
.panel .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.panel .prog .meter{height:6px}
.panel .prog .meter i{background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,143,126,.3)}
.ctrls .play:hover{background:var(--accent-ink)}
.opts2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.opts2 select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}

<script>
const S=[{"id": 1, "kisa": "Vergi Hukuku Temelleri", "baslik": "Giriş ve Vergi Hukukuna İlişkin Temel Kavram ve Tanımlar", "ozet": "Vergi sisteminin yapısı, Anayasa m.73, vergilendirme süreci, tam-dar mükellefiyet, mukimlik belgesi, gelir unsurları, cezalar ve zamanaşımı.", "notlar": "<h3>Türk vergi sisteminin genel yapısı<\/h3>\n<ul>\n<li>Vergi dört kaynaktan alınır: <b>gelir<\/b> (kişi gelirleri ve safi kurum kazançları), <b>harcama<\/b> (mal teslimi ve hizmet ifası, işlemler), <b>servet<\/b> ve <b>servet transferi<\/b>. Belediye Gelirleri Kanunundaki yerel vergiler bu tasnifin dışında kalır.<\/li>\n<li>Gelir üzerinden alınan vergilerde ilke, <b>yıllık safi kazancın beyan esasına göre<\/b> vergilendirilmesidir. Bazı mükellef ve gelirlerde kaynakta kesinti (tevkifat, stopaj) nihai vergi olur.<\/li>\n<li><b>GVK Geçici 67:<\/b> 5281 sayılı Kanunla 31.12.2004'te eklendi, <b>01.01.2006<\/b>'da yürürlüğe girdi. Bazı finansal araç gelirlerinde <b>%0, %10 ve %15<\/b> oranlı, bazı mükellefler için nihai stopaj getirdi. İlk süresi 31.12.2015'ti; 10680 sayılı Cumhurbaşkanı Kararıyla <b>31.12.2030<\/b>'a kadar uzatıldı. Uygulanmadığı hallerde GVK ve KVK'nın normal hükümleri geçerlidir.<\/li>\n<li>Dikkat (kaynakta çelişki): kitabın 2.3.6 bölümünde maddenin süresi '31.12.2016' ve '2025'e kadar', bazı bölümlerde '2006-2025 yılları' olarak geçer. Güncel bilgi: 10680 sayılı CK ile <b>31.12.2030<\/b>.<\/li>\n<li>Dikkat: Geçici 67 her mükellef için nihai vergileme değildir ve yalnızca bazı araç ve gelir türlerini kapsar.<\/li>\n<li>Gerçek kişilerin geliri GVK'da, bazı tüzel kişilerin kazancı KVK'da düzenlenir. İş ortaklıkları da KV mükellefi olduğundan \"KV yalnız tüzel kişilere uygulanır\" genellemesi tam doğru değildir.<\/li>\n<li>Geçici 67 ile farklı araçlar üzerindeki vergi yükü eşitlendi; kolektif yatırım araçlarını teşvik politikası önemli ölçüde terk edildi.<\/li>\n<li>Sermaye piyasası teşvikleri <b>arz yönlü<\/b> (halka açık şirket sayısını artırmak) ve <b>talep yönlü<\/b> (doğrudan yatırımcıya) olarak ikiye ayrılır; çalışmalar <b>1981<\/b>'de başladı.<\/li>\n<li>BSMV, \"lehe kalan paralar\" üzerinden alındığından bazı KV mükellefleri ayrıca BSMV'nin de muhatabıdır.<\/li>\n<\/ul>\n\n<h3>Gelir vergisi tarifesi (GVK m.103)<\/h3>\n<table>\n<tr><th>2026 gelir dilimi (ücret dışı)<\/th><th>Vergi<\/th><\/tr>\n<tr><td>190.000 TL'ye kadar<\/td><td>%15<\/td><\/tr>\n<tr><td>400.000 TL'nin 190.000 TL'si için 28.500 TL, fazlası<\/td><td>%20<\/td><\/tr>\n<tr><td>1.000.000 TL'nin 400.000 TL'si için 70.500 TL, fazlası (ücrette üst sınır 1.500.000 TL)<\/td><td>%27<\/td><\/tr>\n<tr><td>5.300.000 TL'nin 1.000.000 TL'si için 232.500 TL, fazlası (ücrette 1.500.000 TL'si için 367.500 TL)<\/td><td>%35<\/td><\/tr>\n<tr><td>5.300.000 TL'den fazlasının 5.300.000 TL'si için 1.737.500 TL (ücrette 1.697.500 TL), fazlası<\/td><td>%40<\/td><\/tr>\n<\/table>\n<ul>\n<li>2025 tarifesinin dilimleri: 158.000 / 330.000 / 800.000 (ücrette 1.200.000) / 4.300.000 TL; oranlar aynı (%15–%40).<\/li>\n<li>Ücretlere ayrı tarife getiren düzenleme (6009 sayılı Kanun) Anayasa Mahkemesince 2010'da iptal edildi; tek tarife uygulanır, ücret için yalnız dilim sınırları farklıdır.<\/li>\n<li>Artan oranlı tarife <b>dikey adaletin<\/b> örneğidir.<\/li>\n<\/ul>\n\n<h3>Anayasa m.73 ve vergi adaleti<\/h3>\n<ul>\n<li>Herkes kamu giderlerini karşılamak üzere <b>mali gücüne göre<\/b> vergi öder. Vergi yükünün adaletli ve dengeli dağılımı maliye politikasının sosyal amacıdır.<\/li>\n<li>Vergi, resim, harç ve benzeri mali yükümlülükler <b>kanunla<\/b> konur, değiştirilir, kaldırılır (kanunilik ilkesi).<\/li>\n<li>Muaflık, istisna, indirim ve oranlarda kanunun belirttiği <b>alt ve üst sınırlar içinde<\/b> değişiklik yetkisi <b>Cumhurbaşkanına<\/b> verilebilir (2017 değişikliği, 6771 sayılı Kanun).<\/li>\n<li><b>Yatay adalet:<\/b> aynı ekonomik durumdakilere aynı vergi; örnek: KV oranının tüm işletmelere aynı uygulanması. <b>Dikey adalet:<\/b> farklı ödeme gücüne farklı vergi; örnek: GVK m.103 artan oranlı tarife.<\/li>\n<\/ul>\n\n<h3>Temel kavramlar<\/h3>\n<table>\n<tr><th>Kavram<\/th><th>Kısa tanım<\/th><\/tr>\n<tr><td>Vergi<\/td><td>Devletin vergileme yetkisine dayanarak, tek taraflı olarak, kamu giderleri için gelir ve servetten aldığı ekonomik değer.<\/td><\/tr>\n<tr><td>Verginin konusu<\/td><td>Verginin konulduğu iktisadi unsur: gelir (GV, KV), işlem (BSMV), kâğıt (damga vergisi).<\/td><\/tr>\n<tr><td>Matrah<\/td><td>Verginin üzerinden hesaplandığı değer veya miktar. GV'de kazanç ve iratlar, KV'de kurum kazancı, KDV'de teslim bedeli.<\/td><\/tr>\n<tr><td>Mükellef<\/td><td>Vergi borcu yüklenen gerçek veya tüzel kişi; gelirin gerçek sahibi (beneficial owner).<\/td><\/tr>\n<tr><td>Vergi sorumlusu<\/td><td>Verginin ödenmesi bakımından vergi dairesine muhatap olan kişi. Birden fazla kişinin sorumluluğu: <b>müteselsil (zincirleme) sorumluluk<\/b>.<\/td><\/tr>\n<tr><td>Vergi ehliyeti<\/td><td><b>Medeni hakları kullanma ehliyeti gerekmez<\/b>; hak ehliyeti yeterlidir. Sağ doğmak şartıyla cenin, temyiz kudreti olmayanlar da mükellef olabilir.<\/td><\/tr>\n<tr><td>Vergiyi doğuran olay<\/td><td>Vergi alacağı, kanunun vergiyi bağladığı olayın vukuu veya hukuki durumun tekemmülü ile doğar. Olayın kanunla yasak olması mükellefiyeti kaldırmaz.<\/td><\/tr>\n<tr><td>Tevkifat (stopaj)<\/td><td>GVK m.94'te sayılan gelirlerden, kanundaki ve Cumhurbaşkanınca belirlenen oranlarda yapılan kesinti. MSİ genelde tevkifata tabidir.<\/td><\/tr>\n<tr><td>Muafiyet<\/td><td>Kişinin vergi dışı bırakılması; <b>mükellefiyete<\/b> (kişiye) uygulanır.<\/td><\/tr>\n<tr><td>İstisna<\/td><td>Bir olay veya gelirin tamamen, belli tutarda ya da oransal olarak vergi dışı bırakılması; <b>işlem veya olaya<\/b> uygulanır.<\/td><\/tr>\n<tr><td>Yorum / Atıf<\/td><td>Yorum: kuralın olaya en uygun anlamını bulma. Atıf: kanunun düzenlemediği konuda başka kanun hükmüne yollama.<\/td><\/tr>\n<tr><td>Yürürlük<\/td><td>Ayrı hüküm yoksa Resmî Gazete'de yayımı günü; tarih belirtilmişse o tarih.<\/td><\/tr>\n<\/table>\n<ul>\n<li>Vergi türleri: dolaysız (GV, KV) ve dolaylı (KDV); gelir üzerinden; harcama, işlem ve kâğıt üzerinden (KDV, BSMV, damga vergisi, harçlar); servet üzerinden (veraset ve intikal vergisi).<\/li>\n<li><b>Vergi kesenlerin sorumluluğu (VUK m.11):<\/b> kesinti yapmaya mecbur olanlar verginin tam kesilip ödenmesinden sorumludur; asıl mükellefe <b>rücu hakları<\/b> saklıdır. Dar mükellefin daimi temsilcisi yoksa kazancı sağlayan kişi tarhiyatın muhatabıdır (GVK m.107/4).<\/li>\n<\/ul>\n\n<h3>Vergilendirme süreci: tarh, tebliğ, tahakkuk, tahsil<\/h3>\n<ul>\n<li>Tarh, tebliğ ve tahakkuk <b>VUK<\/b> kapsamında; ödenmeyen vergide tahsil aşaması <b>6183 sayılı AATUHK<\/b> kapsamında yürür.<\/li>\n<li><b>Tarh:<\/b> vergi dairesinin matrah ve oran üzerinden alacağı hesaplayıp miktarını tespit eden idari işlemi.<\/li>\n<\/ul>\n<table>\n<tr><th>Tarh türü<\/th><th>Ne zaman?<\/th><\/tr>\n<tr><td>Beyana dayalı<\/td><td>Matrahı mükellef beyannameyle bildirir, tarhı vergi dairesi yapar.<\/td><\/tr>\n<tr><td>İkmalen<\/td><td>Tarh edilmiş vergiye ilişkin sonradan ortaya çıkan defter, kayıt, belge veya kanuni ölçülerle tespit edilen matrah farkı üzerinden.<\/td><\/tr>\n<tr><td>Re'sen<\/td><td>Matrah defter, kayıt ve belgelerle tespit edilemiyorsa, takdir yoluyla. Yetki ilke olarak <b>takdir komisyonlarında<\/b>; vergi inceleme elemanlarının da takdir yetkisi var.<\/td><\/tr>\n<tr><td>İdarece<\/td><td>İkmalen ve re'sen kapsamı dışındaki, zamanında tarh edilemeyen vergiler için; uygulama alanı çok dar.<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Tebliğ:<\/b> hüküm ifade eden hususların yetkili makamlarca mükellefe veya ceza sorumlusuna <b>yazıyla<\/b> bildirilmesi.<\/li>\n<li><b>Tahakkuk:<\/b> tarh ve tebliğ edilen verginin ödenmesi gereken safhaya gelmesi. Beyan üzerine alınan vergiler tahakkuk fişiyle tarh ve tahakkuk ettirilir. Dikkat: tahakkuk idari işlem olmadığından <b>dava konusu edilemez<\/b>. Dava açılmaz veya dava reddedilirse vergi tahakkuk eder.<\/li>\n<li><b>Tahsil:<\/b> verginin VUK ve 6183'e uygun ödenmesi. Ödeme süresinin son günü verginin vadesidir. Ödenirken tahakkuk edenlere <b>tahakkuku tahsile bağlı vergiler<\/b> denir.<\/li>\n<\/ul>\n\n<h3>Tam ve dar mükellefiyet<\/h3>\n<ul>\n<li>Ayrım <b>yerleşme esasına<\/b> dayanır. Tam mükellef Türkiye içi ve dışı tüm kazancından, dar mükellef yalnız Türkiye'de elde ettiğinden vergilenir.<\/li>\n<li><b>Tam mükellef gerçek kişi (GVK m.3):<\/b> Türkiye'de yerleşmiş olanlar; resmi daire veya merkezi Türkiye'de teşekküllere bağlı olarak onların işi için yurt dışında oturan Türk vatandaşları (bulundukları ülkede vergilenen kazançları Türkiye'de ayrıca vergilenmez).<\/li>\n<li><b>Yerleşme:<\/b> ikametgâhı Türkiye'de olmak veya <b>bir takvim yılı içinde<\/b> devamlı <b>altı aydan fazla<\/b> oturmak (geçici ayrılmalar süreyi kesmez). Dikkat: 1 Ağustos'ta gelip ertesi yıl 1 Haziran'da ayrılan kişi toplam 10 ay kalsa da süre aynı takvim yılında dolmadığı için ölçüt sağlanmayabilir.<\/li>\n<li><b>Yerleşmiş sayılmayanlar<\/b> (altı aydan fazla kalsalar da): belli ve geçici görev için gelen iş, ilim, fen adamları, uzmanlar, memurlar, muhabirler; tahsil, tedavi, istirahat, seyahat için gelenler; tutukluluk, hükümlülük, hastalık gibi elde olmayan sebeplerle kalanlar.<\/li>\n<li><b>Tam mükellef kurum (KVK m.3):<\/b> <b>kanuni merkezi veya iş merkezi<\/b> Türkiye'de olan. Birinin Türkiye'de olması yeterli; ikisinin birden olması gerekmez. Kanuni merkez: kuruluş kanunu, CBK, tüzük, ana statü veya sözleşmede gösterilen merkez. İş merkezi: işlemlerin fiilen toplandığı ve yönetildiği yer.<\/li>\n<li>Dikkat: Esas sözleşmesi yurt dışında olsa da yatırım kararları fiilen Türkiye'den alınan şirketin iş merkezi Türkiye'dedir; \"dar mükellef kurum\" savunması geçerli olmaz.<\/li>\n<li><b>Dar mükellef:<\/b> Türkiye'de yerleşmemiş gerçek kişiler ile kanuni ve iş merkezlerinin <b>ikisi de<\/b> yurt dışında olan kurumlar.<\/li>\n<\/ul>\n\n<h3>VKN, mukimlik belgesi ve ÇVÖA<\/h3>\n<ul>\n<li>Dar mükelleflerin Geçici 67 kapsamında Türk finansal araçlarına yatırım yapması ve ÇVÖA'dan yararlanması için <b>vergi kimlik numarası<\/b> alması gerekir.<\/li>\n<li>VKN için: gerçek kişi pasaportun noter onaylı örneği (veya aslı ve fotokopisi); kurum kendi ülkesindeki kuruluş belgesinin Türk temsilciliğince onaylı Türkçe örneği ya da tercüme bürosunca çevrilmiş örneği. <b>KKTC<\/b> vatandaşlarına nüfus cüzdanı yeterlidir. Banka, aracı kurum ve saklamacılar \"Yabancılar İçin Vergi Kimlik Numarası Talep Formu\" ile toplu VKN alabilir.<\/li>\n<li><b>Mukimlik belgesi:<\/b> ÇVÖA'nın 3. maddesindeki yetkili makamca düzenlenir; aslı ve tercümesi <b>tevkifattan önce<\/b> vergi dairesine (banka ve aracı kurum vasıtasıyla veya doğrudan) verilir. Önceden verilmezse ÇVÖA dikkate alınmadan kesinti yapılır; sonradan ibrazla fazla kesinti iade istenebilir. İade, gelir sahibine ödenmek üzere tevkifatı yapan banka veya aracı kurum adına yapılır.<\/li>\n<li>Bakanlık gerektiğinde <b>gerçek hak sahibi<\/b> olunduğuna dair belge isteyebilir; süresinde verilmezse vergi ziyaı doğmuş sayılır.<\/li>\n<\/ul>\n<table>\n<tr><th>Durum<\/th><th>DM gerçek kişi<\/th><th>DM kurum<\/th><\/tr>\n<tr><td>ÇVÖA uygulanması için<\/td><td>VKN + mukimlik belgesi; belge <b>her yıl<\/b> yenilenir<\/td><td>VKN + mukimlik belgesi; belge <b>3 yılda bir<\/b> yenilenir (Dikkat: 2.12.1.10'da belgenin izleyen yılın 4. ayına kadar geçerli olup her yıl yenileneceği yazar)<\/td><\/tr>\n<tr><td>ÇVÖA yoksa %0 tevkifat için<\/td><td>VKN + mukimlik belgesi; <b>her yıl<\/b><\/td><td>VKN + <b>kuruluş belgesi<\/b>; yenileme gerekmez (kitabın görüşü)<\/td><\/tr>\n<\/table>\n\n<h3>Beyanname türleri<\/h3>\n<table>\n<tr><th>Beyanname<\/th><th>Kapsam<\/th><\/tr>\n<tr><td>Yıllık<\/td><td>Bir takvim yılında çeşitli kaynaklardan elde edilen kazanç ve iratların toplanıp bildirilmesi.<\/td><\/tr>\n<tr><td>Muhtasar<\/td><td>İşverenler ve tevkifat yapanların kestikleri vergileri matrahlarıyla toplu bildirmesi.<\/td><\/tr>\n<tr><td>Münferit<\/td><td>Dar mükellef gerçek kişilerin yıllık beyana tabi olmayan ve vergisi kesilmemiş kazançları.<\/td><\/tr>\n<tr><td>Özel<\/td><td>Dar mükellef kurumun vergiye tabi kazancı bazı \"diğer kazanç ve iratlar\"dan ibaretse, <b>15 gün içinde<\/b> verilir.<\/td><\/tr>\n<\/table>\n\n<h3>Gelirin özellikleri ve gelir unsurları<\/h3>\n<ul>\n<li>GV, gerçek kişinin bir <b>takvim yılında<\/b> (1 Ocak–31 Aralık) elde ettiği kazanç ve iratların safi tutarı üzerinden hesaplanır.<\/li>\n<li>Özellikler: <b>şahsilik<\/b> (yalnız gerçek kişiler; sermaye şirketleri GV dışında), <b>yıllık oluş<\/b> (istisnası özel hesap dönemi), <b>gerçek ve safi oluş<\/b>, <b>elde edilmiş olma<\/b> (hukuken tasarruf edebilme), <b>genel toplam<\/b> (tek beyanname, zarar mahsubu, indirim ve istisnalar).<\/li>\n<li><b>Yedi gelir unsuru:<\/b> ticari kazanç, zirai kazanç, ücret, serbest meslek kazancı, gayrimenkul sermaye iradı (GMSİ), menkul sermaye iradı (MSİ), diğer kazanç ve iratlar. Bunların dışındaki hiçbir gelir vergilendirilemez.<\/li>\n<li>Dikkat: \"Diğer kazanç ve iratlar\" ilk altıya girmeyen her şey değildir; yalnız kanunda sayılan <b>değer artışı kazançları<\/b> ve <b>arızi kazançlardır<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Gelir unsuru<\/th><th>Elde etme ölçütü<\/th><\/tr>\n<tr><td>Ticari ve zirai kazanç<\/td><td>Tahakkuk esası (mahiyet ve tutar olarak kesinleşme yeterli)<\/td><\/tr>\n<tr><td>Serbest meslek kazancı<\/td><td>Fiili tasarruf (tahsil)<\/td><\/tr>\n<tr><td>GMSİ<\/td><td>Fiili tasarruf (tahsilat)<\/td><\/tr>\n<tr><td>MSİ ve diğer unsurlar<\/td><td>Hukuki ve ekonomik tasarruf<\/td><\/tr>\n<\/table>\n<ul><li>Kurum kazancı GV'ye giren gelir unsurlarından oluşur; istisna veya muafiyet yoksa kurumun her kazancı vergiye tabidir.<\/li><\/ul>\n\n<h3>Vergi suç ve cezaları<\/h3>\n<ul>\n<li>VUK m.331: aykırı davrananlara vergi ziyaı cezası, usulsüzlük cezası ve diğer cezalar uygulanır.<\/li>\n<li><b>Usulsüzlük cezası:<\/b> şekil ve usul hükümlerine uyulmaması. Kendi içinde usulsüzlük ve özel usulsüzlük; usulsüzlük de I. ve II. derece. Beyannamenin süresinde verilmemesi I. derece usulsüzlüktür; re'sen takdiri gerektirdiği hallerde (VUK m.30/1) ceza <b>iki kat<\/b> uygulanır.<\/li>\n<li><b>Vergi ziyaı cezası:<\/b> verginin zamanında veya tam tahakkuk ettirilmemesi; ziyaa uğratılan verginin <b>bir katı<\/b>. Kaçakçılık fiilleriyle (VUK m.359) ziyaa uğratılmışsa <b>üç katı<\/b>. İnceleme başlamadan veya takdire sevk edilmeden kendiliğinden verilen süre geçmiş beyannamelerde ceza <b>%50<\/b> uygulanır.<\/li>\n<li>Kaçakçılık fiillerinde hürriyeti bağlayıcı ceza: <b>18 aydan 3 yıla<\/b> ve <b>3 yıldan 5 yıla<\/b>. Normal vergi ziyaında hapis cezası yoktur.<\/li>\n<li>Beyan edilip ödenmeyen vergide ceza kesilmez, <b>gecikme zammı<\/b> işler: 13.11.2025 tarihli Cumhurbaşkanlığı Kararıyla <b>aylık %3,7<\/b>.<\/li>\n<\/ul>\n<table>\n<tr><th>Gecikme faizi<\/th><th>Gecikme zammı<\/th><\/tr>\n<tr><td>VUK m.112<\/td><td>AATUHK (6183) m.51<\/td><\/tr>\n<tr><td>İkmalen, re'sen veya idarece tarh edilen vergiler<\/td><td>Vadesinde ödenmeyen tüm kesinleşmiş kamu alacakları<\/td><\/tr>\n<tr><td>Normal vadeden tarhiyatın tahakkukuna kadar; dava açılırsa yargı kararının tebliğine kadar<\/td><td>Vadenin bitiminden ödeme gününe kadar (vadeyi izleyen gün başlar, ödeme günü dahil)<\/td><\/tr>\n<tr><td>Aylık hesaplanır, <b>ay kesirleri dikkate alınmaz<\/b><\/td><td>Her ay için aylık, ay kesirleri için <b>günlük<\/b> hesaplanır<\/td><\/tr>\n<tr><td>Cezalara gecikme faizi uygulanmaz<\/td><td>Vadesinde ödenmeyen <b>vergi ziyaı cezasına<\/b> uygulanır; diğer cezalara uygulanmaz<\/td><\/tr>\n<\/table>\n\n<h3>Zamanaşımı<\/h3>\n<table>\n<tr><th>Tür<\/th><th>Süre ve başlangıç<\/th><\/tr>\n<tr><td>Tarh (tahakkuk) zamanaşımı<\/td><td>Vergi alacağının doğduğu takvim yılını izleyen yılın başından itibaren <b>5 yıl<\/b><\/td><\/tr>\n<tr><td>Tahsil zamanaşımı (AATUHK)<\/td><td>Vadenin rastladığı takvim yılını izleyen yıl başından itibaren <b>5 yıl<\/b><\/td><\/tr>\n<tr><td>Ceza kesme – vergi ziyaı<\/td><td>Vergi alacağının doğduğu yılı izleyen yıldan itibaren <b>5 yıl<\/b><\/td><\/tr>\n<tr><td>Ceza kesme – usulsüzlük<\/td><td>Usulsüzlüğün yapıldığı yılı izleyen yıldan itibaren <b>2 yıl<\/b><\/td><\/tr>\n<tr><td>Ceza kesme – kaçakçılık<\/td><td><b>8 yıla<\/b> kadar çıkabilir<\/td><\/tr>\n<tr><td>Düzeltme zamanaşımı (VUK m.116)<\/td><td>Vergiyi doğuran olayın yılını izleyen yıl başından itibaren <b>5 yıl<\/b>; hak düşürücü süre<\/td><\/tr>\n<\/table>\n<ul>\n<li>Örnek: 2019 kazancı 2020 Mart sonuna kadar beyan edilmeliydi; hiç beyan yoksa ve idare aramazsa 2024 sonunda tarh zamanaşımı dolar. Tahakkuk edip vadesi 2020'de olan ve ödenmeyen vergi 2025 sonunda tahsil zamanaşımına uğrar.<\/li>\n<li>Kısmi ödeme, vergi veya ceza ihbarnamesi gönderilmesi gibi hallerde zamanaşımı <b>kesilir<\/b>.<\/li>\n<li>Vergi hatası: hesaplarda veya vergilendirmede yapılan hata nedeniyle haksız fazla veya eksik vergi istenmesi ya da alınması.<\/li>\n<\/ul>", "sorular": [{"q": "Anayasa m.73'e göre vergi, resim ve harçların muaflık, istisna, indirim ve oranlarında kanunun belirttiği sınırlar içinde değişiklik yapma yetkisi kime verilebilir?", "o": ["Hazine ve Maliye Bakanına", "Cumhurbaşkanına", "Gelir İdaresi Başkanlığına", "Türkiye Büyük Millet Meclisi Plan ve Bütçe Komisyonuna", "Sermaye Piyasası Kuruluna"], "a": 1, "e": "2017 değişikliğiyle m.73'ün son fıkrası bu yetkinin, kanunun yukarı ve aşağı sınırları içinde Cumhurbaşkanına verilebileceğini öngörür."}, {"q": "Kurumlar vergisi oranının bütün işletmelere aynı oranda uygulanması hangi ilkenin örneğidir?", "o": ["Dikey adalet", "Kanunilik", "Verginin şahsiliği", "Yatay adalet", "Artan oranlılık"], "a": 3, "e": "Aynı ekonomik koşuldakilerin aynı oranda vergilendirilmesi yatay adalettir; artan oranlı GV tarifesi ise dikey adaletin örneğidir."}, {"q": "Muafiyet ve istisna kavramlarıyla ilgili hangisi doğrudur?", "o": ["Muafiyet mükellefiyete, istisna işlem veya olaya uygulanır", "Muafiyet işleme, istisna kişiye uygulanır", "Her ikisi de yalnızca kişiye uygulanır", "İstisna yalnızca tam tutar olarak uygulanabilir, oransal olamaz", "Muafiyet yalnızca dar mükelleflere tanınabilir"], "a": 0, "e": "Muafiyet kişiyi (mükellefiyeti) vergi dışı bırakır; istisna bir olay veya geliri tamamen, belli tutarda ya da oransal olarak vergi dışı bırakır."}, {"q": "Vergi ehliyetiyle ilgili hangisi yanlıştır?", "o": ["Medeni hakları kullanma ehliyeti aranmaz", "Sağ doğmak şartıyla cenin de mükellef olabilir", "Temyiz kudreti olmayan kişi mükellef olabilir", "Mükellef olmak için medeni haklardan yararlanma ehliyeti yeterlidir", "Vergi sorumluluğu için yasal (fiil) ehliyet şarttır"], "a": 4, "e": "Mükellefiyet ve vergi sorumluluğu için yasal ehliyet şart değildir; hak ehliyeti yeterlidir."}, {"q": "Tahakkuk aşamasıyla ilgili hangisi doğrudur?", "o": ["Tahakkuk bir idari işlem olduğundan dava konusu edilebilir", "Tahakkuk 6183 sayılı Kanun kapsamında yapılır", "Tahakkuk, verginin ödenebilir aşamaya gelmesidir ve dava konusu edilemez", "Tahakkuk, matrahın mükellef tarafından bildirilmesidir", "Tahakkuk tebliğden önce gerçekleşir"], "a": 2, "e": "Tahakkuk tarh ve tebliğ edilen verginin ödenmesi gereken safhaya gelmesidir; idari işlem olmadığı için dava konusu yapılamaz."}, {"q": "Vergi matrahının defter, kayıt ve belgelerle kısmen veya tamamen tespit edilemediği durumlarda yapılan tarh türü hangisidir?", "o": ["Beyana dayalı tarh", "Re'sen tarh", "İkmalen tarh", "İdarece tarh", "Tahakkuku tahsile bağlı tarh"], "a": 1, "e": "Re'sen tarhta matrah takdir yoluyla bulunur; takdir yetkisi ilke olarak takdir komisyonlarındadır, inceleme elemanlarının da takdir yetkisi vardır."}, {"q": "Bir kurumun esas sözleşmesindeki merkezi yurt dışında, fakat tüm yönetim kararları fiilen İstanbul'daki ofisten alınıyorsa kurumun vergisel durumu nedir?", "o": ["Dar mükellef kurumdur, çünkü kanuni merkezi yurt dışındadır", "Mükellefiyeti yoktur", "Ancak ÇVÖA varsa tam mükellef olur", "Tam mükellef kurumdur, çünkü iş merkezi Türkiye'dedir", "Kanuni merkez ile iş merkezinin ikisi de Türkiye'de olmadığı için dar mükelleftir"], "a": 3, "e": "KVK m.3'e göre kanuni merkez veya iş merkezinden birinin Türkiye'de olması tam mükellefiyet için yeterlidir; iş merkezi işlemlerin fiilen yönetildiği yerdir."}, {"q": "Aşağıdaki yabancılardan hangisi Türkiye'de altı aydan fazla kalsa bile Türkiye'ye yerleşmiş sayılmaz?", "o": ["Tedavi amacıyla gelip yedi ay kalan yabancı", "İkametgâhını Türkiye'de kuran yabancı", "Türkiye'de süresiz iş kurup takvim yılı boyunca kalan yabancı", "Türkiye'de ev alıp ailesiyle sürekli yaşayan yabancı", "Türkiye'deki şirketinde süresiz yöneticilik yapan yabancı"], "a": 0, "e": "Tahsil, tedavi, istirahat veya seyahat amacıyla gelenler altı aydan fazla kalsalar da yerleşmiş sayılmaz."}, {"q": "Çifte vergilendirmeyi önleme anlaşmasından yararlanmak isteyen dar mükellef kurum ile dar mükellef gerçek kişinin mukimlik belgesini yenileme sıklıkları sırasıyla nedir?", "o": ["Her yıl – her yıl", "Her yıl – 3 yılda bir", "5 yılda bir – 3 yılda bir", "Yenileme gerekmez – her yıl", "3 yılda bir – her yıl"], "a": 4, "e": "Mukimlik belgesi dar mükellef kurumlarda 3 yılda bir, dar mükellef gerçek kişilerde her yıl yenilenir."}, {"q": "ÇVÖA bulunmayan bir ülkenin dar mükellef kurumunun Geçici 67 kapsamında %0 tevkifattan yararlanması için VKN'nin yanında hangi belge yeterlidir?", "o": ["Her yıl yenilenen mukimlik belgesi", "Gerçek hak sahipliği beyanı", "Kuruluş belgesinin onaylı Türkçe örneği", "Noter onaylı pasaport örneği", "Vergi dairesinden alınan borcu yoktur yazısı"], "a": 2, "e": "Dar mükellef kurumlarda %0 tevkifat için kuruluş belgesinin onaylı Türkçe örneği yeterlidir; kitap bu belge için yenileme gerekmediği görüşündedir."}, {"q": "Dar mükellef kurumun Türkiye'deki vergiye tabi kazancı yalnızca bazı diğer kazanç ve iratlardan ibaretse verilen beyanname ve süresi hangisidir?", "o": ["Münferit beyanname – 15 gün", "Özel beyanname – 15 gün", "Muhtasar beyanname – ertesi ayın 26'sı", "Yıllık beyanname – Mart sonu", "Özel beyanname – 30 gün"], "a": 1, "e": "Özel beyanname dar mükellef kurum veya onun namına hareket edenlerce 15 gün içinde verilir; münferit beyanname dar mükellef gerçek kişilere aittir."}, {"q": "GVK'ya göre gelir unsurları ve elde etme ölçütleri eşleştirmelerinden hangisi yanlıştır?", "o": ["Ticari kazanç – tahakkuk esası", "Zirai kazanç – tahakkuk esası", "Serbest meslek kazancı – fiili tasarruf", "Gayrimenkul sermaye iradı – tahakkuk esası", "Menkul sermaye iradı – hukuki ve ekonomik tasarruf"], "a": 3, "e": "Gayrimenkul sermaye iratlarında elde etme fiili tasarrufu ifade eden tahsilata bağlıdır."}, {"q": "2026 gelir vergisi tarifesine göre ücret dışı geliri 600.000 TL olan bir kişinin hesaplanan gelir vergisi kaç TL'dir?", "o": ["124.500", "108.000", "126.500", "162.000", "90.000"], "a": 0, "e": "400.000 TL için 70.500 TL, aşan 200.000 TL için %27'den 54.000 TL: toplam 124.500 TL."}, {"q": "2026 tarifesine göre ücret dışı geliri 2.000.000 TL olan mükellefin gelir vergisi kaç TL'dir?", "o": ["700.000", "617.500", "532.500", "800.000", "582.500"], "a": 4, "e": "1.000.000 TL için 232.500 TL, aşan 1.000.000 TL için %35'ten 350.000 TL: toplam 582.500 TL."}, {"q": "2026 tarifesine göre yıllık ücret geliri 1.500.000 TL olan bir çalışanın gelir vergisi kaç TL'dir?", "o": ["407.500", "232.500", "367.500", "337.500", "420.000"], "a": 2, "e": "Ücret gelirlerinde %27'lik dilim 1.500.000 TL'ye kadar uzanır: 70.500 + (1.500.000 - 400.000) x %27 = 367.500 TL. Ücret dışı tarife uygulansaydı 232.500 + 500.000 x %35 = 407.500 TL olurdu."}, {"q": "Ziyaa uğratılan vergi 80.000 TL olup kaçakçılık fiilleriyle gerçekleşmişse kesilecek vergi ziyaı cezası kaç TL'dir?", "o": ["40.000", "240.000", "80.000", "160.000", "120.000"], "a": 1, "e": "Kaçakçılık fiilleriyle ziyaa uğratılan vergide ceza üç kattır: 80.000 x 3 = 240.000 TL."}, {"q": "İnceleme başlamadan, kanuni süresi geçtikten sonra kendiliğinden verilen beyanname nedeniyle 80.000 TL vergi ziyaı doğmuşsa kesilecek vergi ziyaı cezası kaç TL'dir?", "o": ["20.000", "80.000", "160.000", "40.000", "0"], "a": 3, "e": "Kendiliğinden verilen beyannamelerde vergi ziyaı cezası %50 oranında uygulanır: 80.000 x 0,50 = 40.000 TL."}, {"q": "Beyan edilip vadesinde ödenmeyen 200.000 TL vergi için tam 3 ay gecikme olmuşsa, aylık %3,7 orana göre gecikme zammı kaç TL'dir?", "o": ["22.200", "7.400", "14.800", "24.000", "22.940"], "a": 0, "e": "Basit hesap: 200.000 x 0,037 x 3 = 22.200 TL. Gecikme zammı bileşik değil, aylık oranla hesaplanır."}, {"q": "Gecikme faizi ile gecikme zammı karşılaştırmasında hangisi yanlıştır?", "o": ["Gecikme faizi VUK m.112'de, gecikme zammı 6183 sayılı Kanun m.51'de düzenlenmiştir", "Gecikme faizinde ay kesirleri dikkate alınmaz", "Gecikme zammında ay kesirleri için günlük hesaplama yapılır", "Vadesinde ödenmeyen vergi ziyaı cezasına gecikme zammı uygulanır", "Cezalar için de gecikme faizi hesaplanır"], "a": 4, "e": "Cezalar için gecikme faizi hesaplanmaz; gecikme zammı ise yalnızca vergi ziyaı cezasına uygulanır."}, {"q": "Usulsüzlük cezalarında ceza kesme zamanaşımı süresi ne kadardır?", "o": ["1 yıl", "5 yıl", "2 yıl", "8 yıl", "10 yıl"], "a": 2, "e": "Usulsüzlük cezalarında süre, usulsüzlüğün yapıldığı yılı izleyen yıldan itibaren 2 yıldır; vergi ziyaı cezasında 5 yıl, kaçakçılıkta 8 yıla kadardır."}, {"q": "Vergi alacağı 2026 yılında doğmuş ve hiç beyan edilmemiştir. İdare herhangi bir işlem yapmazsa tarh zamanaşımı hangi tarihte dolar?", "o": ["31.12.2029", "31.12.2031", "31.12.2030", "31.12.2032", "31.12.2034"], "a": 1, "e": "Tarh zamanaşımı alacağın doğduğu yılı izleyen yılın başından (01.01.2027) itibaren 5 yıldır; 31.12.2031'de dolar."}, {"q": "Kasım 2024'te yapılan bir vergi hatasının düzeltme zamanaşımı ne zaman dolar?", "o": ["31.12.2026", "31.12.2028", "31.12.2030", "31.12.2029", "Kasım 2029"], "a": 3, "e": "Düzeltme zamanaşımı olayın yılını izleyen yılın başından (01.01.2025) itibaren 5 yıldır; 31.12.2029'da dolar."}, {"q": "GVK Geçici 67. maddeyle ilgili hangisi doğrudur?", "o": ["01.01.2006'dan itibaren yürürlüktedir ve bazı mükellefler için nihai vergileme sağlar", "Tüm mükellefler için nihai vergileme sağlar", "Bütün finansal araç gelirlerini kapsar", "İlk kez 01.01.2004'te yürürlüğe girmiştir", "Yalnızca %15 oranlı stopaj öngörür"], "a": 0, "e": "Madde 5281 sayılı Kanunla eklenmiş, 01.01.2006'da yürürlüğe girmiştir; %0, %10 ve %15 oranlar içerir, yalnızca bazı araç ve gelirleri kapsar ve stopaj bazı mükellefler için nihaidir. (Bitiş tarihi kitapta çelişkili verildiğinden şıklara alınmamıştır.)"}, {"q": "Vergi kesmekle sorumlu olanların sorumluluğuyla ilgili hangisi doğrudur?", "o": ["Ödedikleri vergi için asıl mükellefe rücu edemezler", "Yalnızca kestikleri vergiyi beyan etmekle yükümlüdür, ödemeden sorumlu değildir", "Bu sorumluluk GVK m.94'te düzenlenmiştir", "Dar mükellefin daimi temsilcisi varsa kazancı sağlayan kişi tarhiyatın muhatabıdır", "Verginin tam kesilip ödenmesinden sorumludur ve asıl mükellefe rücu hakları saklıdır"], "a": 4, "e": "VUK m.11'e göre vergi kesenler verginin tam kesilip ödenmesinden sorumludur; asıl mükellefe rücu hakkı saklıdır."}]}, {"id": 2, "kisa": "KV Mükellefi ve İstisnalar", "baslik": "Tam Mükellef Kurumlar: Kurumlar Vergisi Mükellefleri, Kurum Kazancı ve İstisnalar", "ozet": "KV mükellefleri, iştirak ve yurt dışı iştirak istisnaları, fon kazançları, satış kazancı istisnaları, İFM teşvikleri, yabancı fonlar, sınai mülkiyet ve KKM istisnası.", "notlar": "<h3>Kurumlar vergisi mükellefleri (KVK m.1)<\/h3>\n<ul>\n<li><b>Sermaye şirketleri:<\/b> anonim, limited, sermayesi paylara bölünmüş komandit şirketler, <b>yatırım fonları<\/b> (kazançları KV'den istisna) ve benzer yabancı kurumlar.<\/li>\n<li><b>Kooperatifler<\/b>, <b>iktisadi kamu kuruluşları<\/b>, <b>dernek ve vakıflara ait iktisadi işletmeler<\/b>, <b>iş ortaklıkları<\/b>.<\/li>\n<li>KVK m.2: SPK'nın düzenleme ve denetimine tabi fonlar ile benzer yabancı fonlar <b>sermaye şirketi<\/b> sayılır.<\/li>\n<li>Anonim ve limited şirket kazancının tamamı KV'ye tabidir. Sermayesi paylara bölünmüş komandit şirkette <b>komanditer<\/b> ortak payına düşen kazanç KV'ye, <b>komandite<\/b> ortak payına düşen kazanç bu ortakların beyanıyla GV'ye tabidir.<\/li>\n<li>Dikkat: <b>Kollektif ve adi komandit şirketler<\/b> tüzel kişi olsa da sermaye şirketi değildir; KV mükellefi değildir.<\/li>\n<\/ul>\n\n<h3>Kurum kazancı<\/h3>\n<ul>\n<li>Bir hesap döneminde elde edilen safi kazanç KVK m.6'ya göre <b>kurum kazancı<\/b>dır. Tespitinde GVK'nın <b>ticari kazanç<\/b> hükümleri uygulanır.<\/li>\n<li>Kanunla istisna edilenler hariç kurumun her türlü kazancı vergiye tabidir. Sermaye piyasasına ilişkin başlıca istisnalar KVK m.5'te sayılır.<\/li>\n<\/ul>\n\n<h3>İştirak kazançları istisnası (KVK m.5/1-a)<\/h3>\n<ul>\n<li>İstisna kapsamı: <b>tam mükellef<\/b> başka bir kurumun sermayesine katılmadan elde edilen kazançlar; tam mükellef kurumun kurucu senedi ve diğer intifa senetlerinden kâr payları; tam mükellef <b>GSYF<\/b> katılma payları ve <b>GSYO<\/b> hisselerinden kâr payları ile katılma paylarının fona iadesinden doğan gelirler.<\/li>\n<li>Diğer yatırım ortaklıklarının hisse senetlerinden elde edilen kâr payları istisnadan yararlanamaz.<\/li>\n<li>GSYF ve GSYO kâr payı istisnası 6322 sayılı Kanunla <b>01.01.2013<\/b>'ten itibaren uygulanır.<\/li>\n<li><b>7456 sayılı Kanun:<\/b> diğer yatırım fonlarının kâr payları, fona iade gelirleri ve VUK m.279 değerleme artışları için istisna (a bendi 3 ve 4 numaralı alt bentler) kaldırıldı. Kaldırma <b>15.07.2023'ten itibaren iktisap edilen<\/b> katılma payları için geçerli; öncesinde alınan paylarda istisna sürer. GSYF ve GSYO istisnası devam eder.<\/li>\n<li>Kâr payını <b>dağıtan<\/b> kurumun tam mükellef olması şarttır; <b>alan<\/b> kurumun tam veya dar mükellef olması önemsizdir. Dar mükellef kurumdan alınan kâr payı bu istisnadan yararlanamaz.<\/li>\n<li>Amaç <b>mükerrer vergilemeyi önlemek<\/b>tir. Dağıtılan kazancın genel rejimde vergilenmiş ya da istisna olması, düşük stopajlı olması istisnayı engellemez.<\/li>\n<li>Dikkat: <b>İştirak oranı ve elde tutma süresi şartı yoktur<\/b>; kâr payının tamamı istisnadır.<\/li>\n<\/ul>\n\n<h3>Yurt dışı iştirak kazançları istisnası<\/h3>\n<table>\n<tr><th>Şart<\/th><th>İçerik<\/th><\/tr>\n<tr><td>Şirket türü<\/td><td>İştirak edilen kurum anonim veya limited şirket niteliğinde<\/td><\/tr>\n<tr><td>Merkez<\/td><td>Kanuni ve iş merkezi Türkiye'de değil<\/td><\/tr>\n<tr><td>Oran<\/td><td>Ödenmiş sermayenin en az <b>%10<\/b>'una sahip olmak<\/td><\/tr>\n<tr><td>Süre<\/td><td>Kazancın elde edildiği tarihte kesintisiz en az <b>1 yıl<\/b> elde tutmak<\/td><\/tr>\n<tr><td>Vergi yükü<\/td><td>Kâr payına kaynak kazancın en az <b>%15<\/b> GV ve KV benzeri vergi yükü taşıması; esas faaliyet finansman, sigorta veya menkul kıymet yatırımıysa en az Türkiye'deki <b>KV oranı<\/b> kadar<\/td><\/tr>\n<tr><td>Transfer<\/td><td>Kazancın ilgili dönem KV beyannamesinin verilme tarihine kadar Türkiye'ye transferi<\/td><\/tr>\n<\/table>\n<ul>\n<li>Şartlar <b>topluca<\/b> sağlanmalı; oran %10'u aşsa da süre veya vergi yükü şartı yoksa istisna yoktur.<\/li>\n<li><b>Vergi yükü<\/b> = yurt dışında ödenen vergi / (dağıtılabilir kazanç + vergi). Kitaptaki örnekte 400.000 TL ticari kazanç, 80.000 TL KKEG, 300.000 TL istisna, %25 oranla 45.000 TL vergi çıkar; yük %11,25 olduğundan istisna yoktur.<\/li>\n<li><b>Alternatif %50 istisna:<\/b> ödenmiş sermayenin en az %50'sine sahip olup kazancı beyanname tarihine kadar Türkiye'ye getiren kurum, diğer şartlar aranmaksızın kazancın %50'sini istisna edebilir.<\/li>\n<li>11257 sayılı Cumhurbaşkanı Kararı (29.04.2026): <b>01.01.2026<\/b>'dan başlayan dönemlerde, yurt dışı iştirakin ödenmiş sermayesinin en az <b>%20<\/b>'sine sahip olunması halinde istisna oranı <b>%80<\/b>.<\/li>\n<\/ul>\n\n<h3>Yurt dışı iştirak hisselerinin satışı istisnası<\/h3>\n<ul>\n<li>Yalnız <b>tam mükellef anonim şirketler<\/b> yararlanır.<\/li>\n<li>Kazancın elde edildiği tarihte kesintisiz en az <b>1 yıl<\/b> süreyle, nakit varlıklar dışındaki aktif toplamının <b>%75 veya fazlası<\/b>, her birine en az <b>%10<\/b> oranında iştirak edilen yurt dışı (tam mükellef olmayan) A.Ş. veya Ltd. hisselerinden oluşmalı.<\/li>\n<li>Satılan hisseler en az <b>2 tam yıl (730 gün)<\/b> aktifte tutulmuş olmalı.<\/li>\n<li>Dikkat: %10'un altındaki iştirak %75 hesabına katılmaz. Kitaptaki örnekte %5'lik iştirak dışlanınca oran %70'e düşer ve istisna kaybedilir; %75 şartı diğer iştiraklerle sağlanıyor olsaydı %10'un altındaki iştirakin satış kazancı da istisna olurdu.<\/li>\n<\/ul>\n\n<h3>Emisyon primi istisnası<\/h3>\n<ul><li>Anonim şirketlerin kuruluşta veya sermaye artırımında çıkardıkları payları <b>itibari değerin üzerinde<\/b> satmasından doğan kazanç istisnadır. Portföydeki başka şirket hisselerinin satış kazancı kapsam dışıdır.<\/li><\/ul>\n\n<h3>Türkiye'de kurulu fon ve ortaklıkların kazanç istisnası<\/h3>\n<ul>\n<li>Kapsam: MKYF ve MKYO'nun portföy işletmeciliği kazançları; portföyü Türkiye'deki borsalarda işlem gören <b>altın ve kıymetli madenlere<\/b> dayalı fon ve ortaklıkların portföy kazançları; <b>GSYF ve GSYO<\/b> kazançları; <b>GYF ve GYO<\/b> kazançları (esas faaliyeti gayrimenkul portföyü işletmek olanlar); <b>emeklilik yatırım fonları<\/b>; <b>konut finansmanı<\/b> ve <b>varlık finansmanı fonları<\/b>.<\/li>\n<li>Şart: <b>Türkiye'de kurulmuş<\/b> olmak. İstisna, bu kazançlar üzerinden <b>kesinti yoluyla vergi alınmasına engel değildir<\/b>.<\/li>\n<li><b>7524 sayılı Kanun<\/b> (01.01.2025'ten itibaren elde edilen kazançlar): fon ve ortaklıklar (<b>emeklilik yatırım fonları hariç<\/b>) taşınmazlardan elde ettikleri kazancın en az <b>%50<\/b>'sini, KV beyannamesinin verilmesi gereken ayı izleyen <b>ikinci ayın sonuna<\/b> kadar kâr payı olarak dağıtmalıdır. Avans kâr payları hesaba katılır.<\/li>\n<li>Taşınmaz kazancı: alım satım kazançları, kira gelirleri, taşınmaza dayalı hakların devri, inşaat projeleri ve işletme gelirleri gibi doğrudan taşınmazdan elde edilenler (ticari mal niteliğindekiler dahil).<\/li>\n<li>Dağıtım şartı sadece taşınmaz kazancı için aranır; ama şart sağlanmazsa <b>tüm gelirler<\/b> için istisna kaybedilir ve vergiler ziyaa uğramış sayılır. Süreden sonra dağıtım istisnayı kurtarmaz.<\/li>\n<li>Taşınmaz kazancı = taşınmaz hasılatı eksi ilgili gider ve maliyet. Taşınmaz faaliyeti veya toplam faaliyet zararsa dağıtım şartı yoktur. Taşınmaz faaliyeti kârlı, diğerleri zararlı ve toplam kazanç taşınmaz kazancından düşükse <b>toplam kazancın yarısını<\/b> dağıtmak yeterlidir.<\/li>\n<li>Müşterek genel giderler cari yıl maliyetlerinin oranına göre; ortak kullanılan sabit kıymet amortismanları <b>kullanılan gün sayısına<\/b> göre dağıtılır.<\/li>\n<li>Dağıtılacak tutar hesabında TTK'ya göre ayrılması zorunlu <b>kanuni yedek akçe<\/b> düşülür; kalan taşınmaz kazancının %50'si dağıtılır. <b>Kârın sermayeye eklenmesi dağıtım sayılmaz.<\/b> SPK mevzuatına göre net dağıtılabilir kâr esas alınır; ancak VUK kayıtlarındaki kârı aşamaz, daha düşükse SPK kârı dikkate alınır.<\/li>\n<li>Faaliyet alanı gereği taşınmaz edinemeyen ve inşaat yapamayan fonlarda dağıtım şartı aranmaz.<\/li>\n<\/ul>\n\n<h3>Taşınmaz ve iştirak hissesi satış kazancı istisnası (KVK m.5/1-e)<\/h3>\n<table>\n<tr><th>Varlık (en az 2 tam yıl aktifte)<\/th><th>İstisna oranı<\/th><\/tr>\n<tr><td>İştirak hisseleri, kurucu senetleri, intifa senetleri, rüçhan hakları, (a) bendi kapsamındaki istisnaya kaynak fon katılma payları<\/td><td>Kanunda <b>%75<\/b>; 9160 sayılı CK ile <b>%50<\/b> (yürürlük 27.11.2024)<\/td><\/tr>\n<tr><td>Taşınmazlar – 15.07.2023'ten önce iktisap edilenler<\/td><td><b>%25<\/b> (7061 ile %75'ten %50'ye, 7456 ile %25'e)<\/td><\/tr>\n<tr><td>Taşınmazlar – 15.07.2023 ve sonrası iktisap edilenler<\/td><td>İstisna <b>yok<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>İstisna <b>satış döneminde<\/b> uygulanır; istisna kısmı satışı izleyen <b>beşinci yılın sonuna kadar<\/b> pasifte <b>özel fon hesabında<\/b> tutulur.<\/li>\n<li>Satış bedeli satışı izleyen <b>ikinci takvim yılı sonuna kadar<\/b> tahsil edilmelidir; tahsil edilmeyen kısma düşen istisna için vergi ziyaı doğar. Tahsil edilmeyen bedelden istisnaya düşen pay = tahsil edilmeyen bedel x (satış kârı / satış bedeli) x istisna oranı.<\/li>\n<li>Özel fondan 5 yıl içinde sermayeye ilave dışında başka hesaba aktarılan, çekilen veya dar mükellefçe ana merkeze gönderilen kısım için vergi ziyaı doğar; aynı sürede tasfiye halinde de (KVK'ya göre devir ve bölünme hariç).<\/li>\n<li>Bedelsiz veya rüçhan hakkıyla itibari değerden alınan hisselerde elde etme tarihi <b>eski hisselerin<\/b> tarihidir. Devir veya bölünmeyle devralınan varlıklarda devreden kurumdaki süre de sayılır.<\/li>\n<li>Dikkat: Menkul kıymet veya taşınmaz <b>ticareti ve kiralamasıyla uğraşan<\/b> kurumların bu amaçla tuttuğu değerler kapsam dışıdır.<\/li>\n<\/ul>\n\n<h3>Sat-kirala-geri al, varlık kiralama ve kanuni takip istisnaları<\/h3>\n<ul>\n<li><b>KVK m.5/1-j:<\/b> taşınır ve taşınmazların 6361 kapsamında geri kiralama ve sözleşme sonunda geri alma şartıyla finansal kiralama şirketleri, katılım bankaları, kalkınma ve yatırım bankalarına satışı ve sözleşme sonunda devrinden doğan kazanç istisnadır. Kazanç kiracıda pasifte özel fonda tutulur, yalnız bu varlıkların amortismanlarının itfasında kullanılır. Yükümlülükler yerine getirilmediği için işlem tamamlanmazsa vergiler <b>vergi ziyaı cezası olmadan, gecikme faiziyle<\/b> alınır.<\/li>\n<li><b>KVK m.5/1-k:<\/b> kaynak kuruluşun <b>kira sertifikası<\/b> ihracı için varlıklarını <b>varlık kiralama şirketine<\/b> geri alma şartıyla satışı ve VKŞ'nin bunları geri devrinden doğan kazanç istisnadır. Kaynak kuruluş varlığı üçüncü kişiye satarsa vergileme kaynak kuruluşta; VKŞ üçüncü kişiye satarsa kazanç VKŞ'de KV'ye tabi olur ve kaynak kuruluşun ertelenen vergisi ceza olmadan gecikme faiziyle alınır.<\/li>\n<li><b>KVK m.5/1-f:<\/b> bankalara, finansal kiralama veya finansman şirketlerine borcu nedeniyle kanuni takipte olan ya da TMSF'ye borçlu kurumlar ile kefil ve ipotek verenlerin varlıklarını borca karşılık devrinden doğan kazancın (borç tasfiyesinde kullanılan kısım) <b>tamamı<\/b> istisnadır. Bu yolla edinilen varlıkları satan bankalarda taşınmaz satış kazancının <b>%50<\/b>'si, diğerlerinin <b>%75<\/b>'i istisnadır.<\/li>\n<\/ul>\n\n<h3>İstanbul Finans Merkezi (7412 sayılı Kanun, 28.06.2022)<\/h3>\n<table>\n<tr><th>Teşvik<\/th><th>Oran / şart<\/th><\/tr>\n<tr><td>Katılımcı belgeli finansal kuruluşların İFM'deki finansal hizmet ihracatı kazancı<\/td><td>%75 indirim; <b>2022–2047<\/b> dönem kazançları için <b>%100<\/b><\/td><\/tr>\n<tr><td>Transit ticaret ve yurt dışı mal alım satımına aracılık kazancı (İFM katılımcıları)<\/td><td>%50; 01.01.2026'dan başlayan dönem kazançları için (01.07.2026'dan sonra verilecek beyannamelerle) <b>%100<\/b><\/td><\/tr>\n<tr><td>Finansal hizmet ihracatı işlemleri<\/td><td>BSMV, harç ve damga vergisinden istisna<\/td><\/tr>\n<tr><td>Personel ücret istisnası<\/td><td>Yurt dışında en az <b>5 yıl<\/b> tecrübe: %60; en az <b>10 yıl<\/b>: %80. Son <b>3 yılda<\/b> Türkiye'de çalışmamış olmak gerekir<\/td><\/tr>\n<\/table>\n<ul>\n<li>Transit ticaret indirimi şartları: katılımcı belgesi; mal Türkiye'ye getirilmeden yurt dışında satılmalı; kazanç beyanname tarihine kadar Türkiye'ye transfer edilmeli; aracılıkta satıcı ve alıcı Türkiye'de olmamalı. Süresinde getirilmeyen kazanç sonradan getirilse de indirimden yararlanamaz.<\/li>\n<li>İndirim tutarı: hasılat eksi gider ve maliyet. Kazanç yetersizliğiyle kullanılamayan kısım <b>sonraki döneme devredilmez<\/b>; faaliyet zararlıysa indirim yoktur. Faiz, kur farkı, varlık satışı gibi diğer gelirler kapsam dışıdır.<\/li>\n<li>Katılımcı belgesi örneği ilk indirim döneminin beyanname süresinde; transferi gösteren belgeler beyanname ayını izleyen ayın sonuna kadar vergi dairesine verilir.<\/li>\n<li><b>Nitelikli hizmet merkezi:<\/b> en az <b>3 ülkede<\/b> faaliyet gösteren ilişkili şirketlere hizmet veren ve yıllık hasılatının en az <b>%80<\/b>'ini yurt dışındaki ilişkili şirketlerden elde eden sermaye şirketi. Bu merkezlerin İFM ücret istisnasından yararlanan personeline GVK m.23/1-20 istisnası uygulanmaz.<\/li>\n<\/ul>\n\n<h3>Yurt dışı şube kazançları (KVK m.5/1-g)<\/h3>\n<ul>\n<li>Yurt dışı iş yeri veya daimi temsilci kazancı: doğduğu ülkede en az <b>%15<\/b> GV ve KV benzeri vergi yükü taşımalı ve beyanname tarihine kadar Türkiye'ye transfer edilmeli.<\/li>\n<li>Ana faaliyet finansman (finansal kiralama dahil), sigorta veya menkul kıymet yatırımıysa vergi yükü en az Türkiye'deki KV oranı kadar olmalı.<\/li>\n<\/ul>\n\n<h3>Yabancı fon kazançları (KVK m.5/A)<\/h3>\n<ul>\n<li>Yabancı fonlar, SPK'dan <b>portföy yöneticiliği yetki belgesi<\/b> almış tam mükellef şirketler aracılığıyla işlem yaptığında, aşağıdaki şartlar birlikte sağlanırsa portföy yöneticisi <b>daimi temsilci<\/b>, iş yeri de fonun iş yeri sayılmaz; bu kazançlar için beyanname verilmez.<\/li>\n<li>Şartlar: (a) işlemler portföy yöneticisinin <b>mutat faaliyeti<\/b>; (b) ilişki <b>emsale uygun<\/b> ve bağımsız; (c) emsal bedel alınması ve <b>transfer fiyatlandırması raporunun<\/b> KV beyanname süresinde GİB'e verilmesi; (ç) portföy yöneticisi ve ilişkili kişilerin fon kazancında hizmet bedeli düşüldükten sonra <b>%20'den fazla<\/b> hakkı olmaması.<\/li>\n<li>Rapor süresinde verilmezse o dönem için portföy yöneticisi fonun <b>daimi temsilcisi<\/b> sayılır. Rapor verilip bedel düşükse yalnız portföy yöneticisi adına transfer fiyatlandırması tarhiyatı yapılır.<\/li>\n<li>Portföy yöneticisinin fondaki pay kazancı şartlarla istisnadır; yönetim ve performans ücretleri bu hesaba katılmaz. %20'yi aşan kısım genel hükümlere göre vergilenir.<\/li>\n<li>Tam mükellef katılımcı ve kurucuların kazanç payı <b>%5'i<\/b> geçerse portföy yöneticisi bunların tamamını GİB'e bildirir; bildirmezse <b>müteselsilen sorumludur<\/b>.<\/li>\n<li>Kapsam dışı: Türkiye'deki taşınmazlar, aktifinin <b>%51'inden fazlası<\/b> taşınmaz olan şirket hisseleri ve bunlara ilişkin türevler, nakdi uzlaşmalı olanlar hariç emtia türevleri, sigorta sözleşmeleri. İstisna Türkiye kaynaklı gelirlerden yapılan <b>vergi kesintisini<\/b> kapsamaz.<\/li>\n<li>Cumhurbaşkanı: %20 ve %5 oranlarını sıfıra kadar indirebilir veya iki katına çıkarabilir; %51 oranını yarısına indirebilir veya %50'sine kadar artırabilir.<\/li>\n<\/ul>\n\n<h3>Sınai mülkiyet haklarında istisna (KVK m.5/B)<\/h3>\n<ul>\n<li>Türkiye'de yapılan Ar-Ge, yenilik ve yazılım faaliyetleri sonucu buluşların kiralanması, devri veya satışı, Türkiye'de seri üretimle pazarlanması, Türkiye'deki üretimde kullanılmasıyla üretilen ürün satışının buluşa atfedilen kısmından elde edilen kazancın <b>%50<\/b>'si <b>01.01.2015<\/b>'ten itibaren istisnadır.<\/li>\n<li>Buluş patent veya faydalı model belgesiyle (incelemeli sistem veya araştırma raporu sonucunda) korunmalı; yararlanan belge sahibi veya tekel nitelikli özel ruhsat sahibi olmalı.<\/li>\n<li>İstisna belgenin verildiği tarihten başlar, koruma süresi aşılamaz. Ürün satışında buluşa düşen kısım transfer fiyatlandırması esaslarıyla ayrıştırılır. Madde <b>gelir vergisi mükelleflerine de<\/b> uygulanır.<\/li>\n<li>Kesinti yoluyla alınan vergilere şümulü yok; ancak serbest meslek kazancı ve GMSİ kesintisi <b>%50 indirimli<\/b> uygulanır, beyanname vermeyenlerde en fazla <b>5 yıl<\/b>.<\/li>\n<li>Bu istisnadan yararlanan, 4691 sayılı Teknoloji Geliştirme Bölgeleri istisnasından <b>ayrıca yararlanamaz<\/b>. Cumhurbaşkanı %50 oranını sıfıra indirebilir, %100'e çıkarabilir.<\/li>\n<\/ul>\n\n<h3>Kâr payı stopajı ve SP kurumlarının durumu<\/h3>\n<ul>\n<li>GVK m.94: tam mükellef kurumların tam mükellef olmayan gerçek kişilere, GV ve KV mükellefi olmayanlara ve muaflara dağıttığı kâr payları stopaja tabidir. Oran: 23.07.2006'dan itibaren %15 → 4936 sayılı CK ile (22.12.2021) %10 → <b>9286 sayılı CK ile (22.12.2024) yeniden %15<\/b>.<\/li>\n<li>KV ve kâr payı stopajında halka açık ve kapalı şirket arasında genel bir fark yoktur (halka arz indirimi hariç).<\/li>\n<li>Yatırım ortaklıklarının istisnası dışında <b>sermaye piyasası kurumlarının<\/b> KV ve kâr payı stopajında özellik arz eden durumu yoktur.<\/li>\n<\/ul>\n\n<h3>TL mevduata dönüşüm (KKM) istisnası (KVK geçici m.14)<\/h3>\n<ul>\n<li>7352 sayılı Kanunla eklendi, 7407 ile 4 ve 5. fıkralar eklendi. Kurumların 31.12.2021 bilançosundaki yabancı paralarını dönüşüm kuru üzerinden TL'ye çevirip <b>en az 3 ay vadeli<\/b> TL mevduat ve katılma hesabında değerlendirmesi halinde kur farkı ve faiz kazançları istisnadır.<\/li>\n<li>Birinci fıkrada çevirme süresi 2021 dördüncü geçici vergi beyannamesi tarihine kadar; ikinci ve üçüncü fıkralarda (yabancı para ve altın hesapları) <b>2022 sonuna<\/b> kadar. 31.03.2022 bilançosundaki yabancı paralar da 2022 sonuna kadar çevrilebilir; Cumhurbaşkanı 31.12.2023'e kadar uygulatmaya yetkilidir.<\/li>\n<li>İstisna bilanço esasına göre defter tutan GV mükelleflerine de uygulanır. Vadeden önce çekim yapılırsa vergiler <b>vergi ziyaı cezası ve gecikme faiziyle<\/b> alınır.<\/li>\n<\/ul>", "sorular": [{"q": "Aşağıdakilerden hangisi kurumlar vergisi mükellefi değildir?", "o": ["Sermayesi paylara bölünmüş komandit şirket", "Kollektif şirket", "İş ortaklığı", "Dernek veya vakfa ait iktisadi işletme", "Yatırım fonu"], "a": 1, "e": "Kollektif ve adi komandit şirketler tüzel kişi olsa da sermaye şirketi niteliğinde olmadığından KV mükellefi değildir; yatırım fonları mükelleftir ancak kazançları istisnadır."}, {"q": "Sermayesi paylara bölünmüş komandit şirketin kazancının vergilendirilmesiyle ilgili hangisi doğrudur?", "o": ["Kazancın tamamı kurumlar vergisine tabidir", "Komandite ortak payı KV'ye, komanditer ortak payı GV'ye tabidir", "Kazancın tamamı ortakların gelir vergisine tabidir", "Komanditer ortak payı KV'ye, komandite ortak payı ortakların beyanıyla GV'ye tabidir", "Şirket KV mükellefi değildir"], "a": 3, "e": "Bu şirketlerde KV mükellefiyeti komanditer ortağın hissesine yöneliktir; komandite ortak payı gelir vergisine tabidir."}, {"q": "İştirak kazançları istisnasıyla ilgili hangisi doğrudur?", "o": ["Kâr payını dağıtan kurumun tam mükellef olması şarttır", "En az %10 iştirak oranı şarttır", "Hisselerin en az bir yıl elde tutulması şarttır", "Kâr payını alan kurumun tam mükellef olması şarttır", "Dar mükellef kurumdan alınan kâr payı da istisnadır"], "a": 0, "e": "İstisna tam mükellef kurumdan alınan kâr paylarını kapsar; iştirak oranı ve süre şartı yoktur, alan kurumun mükellefiyet türü önemsizdir."}, {"q": "7456 sayılı Kanunla yatırım fonu katılma paylarından elde edilen kâr paylarına ilişkin iştirak kazancı istisnası hangi tarihten itibaren iktisap edilen paylar için kaldırılmıştır?", "o": ["01.01.2013", "22.01.2022", "01.01.2025", "27.11.2024", "15.07.2023"], "a": 4, "e": "İstisna 15.07.2023'ten itibaren iktisap edilen katılma payları için kaldırılmıştır; öncekiler için devam eder. GSYF ve GSYO istisnası sürmektedir."}, {"q": "Aşağıdakilerden hangisi yurt dışı iştirak kazançları istisnasının şartlarından biri değildir?", "o": ["Yurt dışı iştirakin ödenmiş sermayesinin en az %10'una sahip olmak", "İştirak payını kesintisiz en az 1 yıl elde tutmak", "İştirakin en az 2 tam yıl aktifte bulunması", "Kazancın en az %15 vergi yükü taşıması", "Kazancın beyanname verilme tarihine kadar Türkiye'ye transferi"], "a": 2, "e": "Yurt dışı iştirak kazancında süre şartı en az 1 yıldır; 2 tam yıl şartı yurt dışı iştirak hisselerinin satış kazancı istisnasına aittir."}, {"q": "Yurt dışındaki iştirakin ticari kazancı 1.000.000 TL, gider kabul edilmeyen harcamaları 200.000 TL, o ülkede istisna kazancı 600.000 TL ve KV oranı %20'dir. Vergi yükü ve istisna durumu nedir?", "o": ["%20 – istisnadan yararlanılır", "%12 – istisnadan yararlanılamaz", "%15 – istisnadan yararlanılır", "%8 – istisnadan yararlanılamaz", "%16 – istisnadan yararlanılır"], "a": 1, "e": "Matrah 1.000.000 + 200.000 - 600.000 = 600.000; vergi 120.000. Yük 120.000 / 1.000.000 = %12, %15'in altında olduğundan istisna yoktur."}, {"q": "11257 sayılı Cumhurbaşkanı Kararına göre 2026 dönemi için yurt dışı iştirakin ödenmiş sermayesinin en az %20'sine sahip kurum, kazancı süresinde Türkiye'ye getirirse istisna oranı kaçtır?", "o": ["%50", "%75", "%100", "%80", "%25"], "a": 3, "e": "01.01.2026'dan başlayan dönemlerde en az %20 pay sahipliğinde istisna oranı %80 olarak belirlenmiştir; kanundaki temel kural %50 pay ile %50 istisnadır."}, {"q": "Yukarıdaki %80 istisna kapsamında 1.000.000 TL yurt dışı iştirak kazancı elde eden kurumun bu kazanç için ödeyeceği KV kaç TL'dir? (KV oranı %25)", "o": ["50.000", "0", "125.000", "200.000", "250.000"], "a": 0, "e": "İstisna dışı kısım 1.000.000 x %20 = 200.000 TL; KV = 200.000 x %25 = 50.000 TL."}, {"q": "Tam mükellef bir A.Ş.'nin nakit dışı aktif toplamı 600.000 TL'dir. Yurt dışı iştiraklerinden %40 oranlı olanın kayıtlı değeri 300.000 TL, %15 oranlı olanınki 150.000 TL, %5 oranlı olanınki 90.000 TL'dir. Diğer şartlar sağlanıyorsa yurt dışı iştirak hissesi satış istisnası açısından aktif oranı ve sonuç nedir?", "o": ["%90 – şart sağlanır", "%65 – şart sağlanmaz", "%50 – şart sağlanmaz", "%75 – şart sağlanmaz, çünkü bir iştirak %10'un altındadır", "%75 – şart sağlanır"], "a": 4, "e": "%10'un altındaki iştirak hesaba katılmaz: (300.000 + 150.000) / 600.000 = %75. Şart sağlanır ve %5'lik iştirakin satış kazancı da istisnadan yararlanabilir."}, {"q": "Yurt dışı iştirak hisselerinin satış kazancı istisnasında satılan hisselerin aktifte tutulma süresi en az ne kadardır?", "o": ["1 yıl", "3 tam yıl", "2 tam yıl (730 gün)", "5 yıl", "Süre şartı yoktur"], "a": 2, "e": "Satışa konu iştirak hisseleri elden çıkarma tarihinde en az iki tam yıl (730 gün) aktifte tutulmuş olmalıdır."}, {"q": "Emisyon primi kazancı istisnasıyla ilgili hangisi doğrudur?", "o": ["Portföydeki başka şirket hisselerinin satış kazancını da kapsar", "Anonim şirketin kendi çıkardığı payları itibari değerin üzerinde satmasından doğan kazancı kapsar", "Yalnızca limited şirketlere uygulanır", "Kazancın %50'si istisnadır", "Sadece kuruluşta çıkarılan paylar için geçerlidir"], "a": 1, "e": "İstisna, A.Ş.'lerin kuruluşta veya sermaye artırımında çıkardığı payların itibari değerin üzerinde satışından doğan kazancı tamamen kapsar."}, {"q": "7524 sayılı Kanunla getirilen kâr dağıtım şartıyla ilgili hangisi yanlıştır?", "o": ["Taşınmazlardan elde edilen kazancın en az %50'si dağıtılmalıdır", "Dağıtım KV beyannamesinin verilmesi gereken ayı izleyen ikinci ayın sonuna kadar yapılmalıdır", "Emeklilik yatırım fonları şarttan muaftır", "Kârın sermayeye eklenmesi dağıtım sayılır", "Şart sağlanmazsa tüm gelirler için istisna kaybedilir"], "a": 3, "e": "Kârın sermayeye eklenmesi kâr dağıtımı sayılmaz; şart bu yolla sağlanamaz."}, {"q": "Bir GYO'nun taşınmazlardan elde ettiği kazanç 10.000.000 TL, bu kazanca isabet eden kanuni yedek akçe 500.000 TL'dir. İstisnanın korunması için dağıtılması gereken asgari kâr payı kaç TL'dir?", "o": ["4.750.000", "5.000.000", "5.250.000", "9.500.000", "2.500.000"], "a": 0, "e": "Kanuni yedek akçe düşülür: (10.000.000 - 500.000) x %50 = 4.750.000 TL."}, {"q": "İki tam yıldan uzun süredir aktifte bulunan iştirak hissesinin satışından 2.000.000 TL kazanç elde edilmiştir. Güncel istisna oranı ve KV oranı %25'e göre bu satıştan doğan KV kaç TL'dir?", "o": ["125.000", "375.000", "500.000", "0", "250.000"], "a": 4, "e": "9160 sayılı CK ile oran %50'dir. Vergiye tabi kısım 1.000.000 TL; KV = 1.000.000 x %25 = 250.000 TL."}, {"q": "2020'de alınıp 2026'da satılan bir taşınmazdan 4.000.000 TL kazanç doğmuştur. İstisna tutarı kaç TL'dir?", "o": ["0", "2.000.000", "1.000.000", "3.000.000", "4.000.000"], "a": 2, "e": "15.07.2023'ten önce iktisap edilen taşınmazlarda istisna oranı %25'tir: 4.000.000 x %25 = 1.000.000 TL."}, {"q": "Maliyeti 500.000 TL olan iştirak hissesi 2.000.000 TL'ye vadeli satılmıştır. Satış bedelinin 600.000 TL'si satışı izleyen ikinci takvim yılından sonra tahsil edilmiştir. İstisna oranı %50 ise bu gecikmiş tahsilata isabet eden ve istisnadan yararlanamayacak kazanç kaç TL'dir?", "o": ["300.000", "225.000", "450.000", "600.000", "150.000"], "a": 1, "e": "Kâr oranı 1.500.000 / 2.000.000 = 0,75. İstisnadan düşecek kısım 600.000 x 0,75 x %50 = 225.000 TL."}, {"q": "Satış kazancı istisnasında istisna edilen tutar pasifte özel fon hesabında ne kadar süre tutulmalıdır?", "o": ["Satış yılının sonuna kadar", "Satışı izleyen ikinci yılın sonuna kadar", "Satışı izleyen üçüncü yılın sonuna kadar", "Satışı izleyen beşinci yılın sonuna kadar", "Süresiz"], "a": 3, "e": "İstisna kısmı satış yılını izleyen beşinci yılın sonuna kadar özel fonda tutulur; satış bedelinin tahsil süresi ise izleyen ikinci takvim yılı sonudur."}, {"q": "İstanbul Finans Merkezinde katılımcı belgesiyle faaliyet gösteren kurumun personeline ödenen ücretin %80'inin gelir vergisinden istisna olması için personelin yurt dışında en az kaç yıllık mesleki tecrübesi olmalıdır?", "o": ["10 yıl", "3 yıl", "5 yıl", "7 yıl", "15 yıl"], "a": 0, "e": "En az 5 yıl tecrübede %60, en az 10 yıl tecrübede %80 istisna uygulanır; personelin son 3 yılda Türkiye'de çalışmamış olması gerekir."}, {"q": "İFM'de katılımcı belgeli bir kurum 2026 hesap döneminde, ürünleri Türkiye'ye getirmeden yurt dışında satarak 500.000 TL kazanç elde etmiş ve kazancı süresinde Türkiye'ye getirmiştir. İndirilebilecek tutar kaç TL'dir?", "o": ["125.000", "250.000", "375.000", "475.000", "500.000"], "a": 4, "e": "01.01.2026'dan başlayan dönem kazançları için oran %100'e çıkarılmıştır; 500.000 TL'nin tamamı indirilebilir. 2023 için aynı kazancın %50'si (250.000 TL) indirilebilirdi."}, {"q": "KVK m.5/A kapsamında yabancı fonun portföy yöneticisinin daimi temsilci sayılmaması için portföy yöneticisi ve ilişkili kişilerin fon kazancı üzerindeki hakkı en fazla ne kadar olabilir?", "o": ["%5", "%10", "%20", "%15", "%51"], "a": 2, "e": "Portföy yöneticisi ve ilişkili kişiler, hizmet bedeli düşüldükten sonra fon kazancı üzerinde doğrudan veya dolaylı %20'den fazla hak sahibi olmamalıdır."}, {"q": "KVK m.5/A uyarınca transfer fiyatlandırması raporu süresinde verilmezse sonuç ne olur?", "o": ["Fon tasfiye edilir", "Portföy yöneticisi o dönem için fonun Türkiye'de daimi temsilcisi sayılır", "Yalnızca usulsüzlük cezası kesilir", "Fonun tüm kazancı stopaja tabi tutulur", "Portföy yöneticisinin yetki belgesi iptal edilir"], "a": 1, "e": "Rapor süresinde verilmezse ilgili hesap dönemi için portföy yöneticisi fonun daimi temsilcisi sayılır."}, {"q": "Patentli bir buluşun satışından 800.000 TL kazanç elde eden kurum, şartları sağlıyorsa ne kadarını kurum kazancından istisna edebilir?", "o": ["0", "200.000", "600.000", "400.000", "800.000"], "a": 3, "e": "KVK m.5/B'ye göre patent veya faydalı model belgeli buluş kazancının %50'si istisnadır: 400.000 TL."}, {"q": "Sınai mülkiyet hakları istisnasıyla ilgili hangisi yanlıştır?", "o": ["Kesinti yoluyla alınan vergileri tamamen ortadan kaldırır", "Gelir vergisi mükelleflerine de uygulanır", "İstisnadan yararlananlar Teknoloji Geliştirme Bölgeleri istisnasından ayrıca yararlanamaz", "Serbest meslek kazancı kesintisi %50 indirimli uygulanır", "İstisna patent veya faydalı model belgesinin verildiği tarihten başlar"], "a": 0, "e": "İstisnanın kesinti yoluyla alınan vergilere şümulü yoktur; yalnızca serbest meslek ve GMSİ kesintisi %50 indirimli uygulanır."}, {"q": "9286 sayılı Cumhurbaşkanı Kararı sonrasında tam mükellef kurumların tam mükellef olmayan gerçek kişilere dağıttığı kâr payları üzerinden yapılan stopaj oranı kaçtır?", "o": ["%0", "%5", "%10", "%20", "%15"], "a": 4, "e": "Oran 22.12.2021'de %10'a indirilmiş, 22.12.2024 tarihli 9286 sayılı CK ile yeniden %15'e çıkarılmıştır."}]}, {"id": 3, "kisa": "Matrah, Oran ve Beyan", "baslik": "Kurum Kazancından İndirimler, İndirilecek ve Kabul Edilmeyen Giderler, Zarar Mahsubu, Oranlar, Beyan ve Dar Mükellef Kurumlar", "ozet": "KVK m.10 indirimleri, m.8 indirilecek giderler, m.11 kabul edilmeyen indirimler, zarar mahsubu, KV oranları ve indirimli oranlar, geçici vergi, beyan-ödeme ve dar mükellef kurumlar.", "notlar": "<h3>Kurumlar vergisi oranı<\/h3>\n<table>\n<tr><th>Dönem / düzenleme<\/th><th>Genel oran<\/th><th>Finans sektörü*<\/th><\/tr>\n<tr><td>2017'ye kadar<\/td><td>%20<\/td><td>%20<\/td><\/tr>\n<tr><td>2018–2020 (7061 sayılı Torba Kanun)<\/td><td>%22<\/td><td>%22<\/td><\/tr>\n<tr><td>2021 (7316, geçici m.13)<\/td><td>%25<\/td><td>%25<\/td><\/tr>\n<tr><td>2022 (7316 / 7394)<\/td><td>%23<\/td><td>%25 (7394 ile)<\/td><\/tr>\n<tr><td>7456 sayılı Kanun (15.07.2023) sonrası<\/td><td><b>%25<\/b><\/td><td><b>%30<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>*Finans sektörü: bankalar, 6361 kapsamındaki şirketler (finansal kiralama, faktoring, finansman, tasarruf finansman), elektronik ödeme ve para kuruluşları, yetkili döviz müesseseleri, varlık yönetim şirketleri, <b>sermaye piyasası kurumları<\/b>, sigorta ve reasürans şirketleri, emeklilik şirketleri.<\/li>\n<li><b>Halka arz indirimi (7256, KVK m.32):<\/b> payları Borsa İstanbul Pay Piyasasında ilk kez işlem görmek üzere <b>en az %20<\/b> oranında halka arz edilen kurumlara, ilk halka arz dönemi dahil <b>5 hesap dönemi<\/b> KV oranı <b>2 puan<\/b> indirimli uygulanır. Finans sektörü kurumları (yukarıdaki liste) yararlanamaz. 5 dönem içinde pay oranı şartı kaybedilirse eksik vergi <b>vergi ziyaı cezası olmadan, gecikme faiziyle<\/b> alınır.<\/li>\n<li><b>İhracat indirimi (KVK m.32/7):<\/b> münhasıran ihracattan elde edilen kazanca KV oranı <b>5 puan<\/b> indirimli.<\/li>\n<li><b>Üretim (KVK m.32/8, 7582 sayılı Kanunla değişik):<\/b> sanayi sicil belgeli ve fiilen üretim yapan kurumların münhasıran üretim kazançları ile zirai üretim kazançlarına KV oranı <b>%12,5<\/b>. Bu orandan yararlanan kazanca ihracat indirimi ayrıca uygulanmaz.<\/li>\n<li>Örnek: en az %20 halka arz edilen şirket ilk 5 dönemde 2 puan, ihracat kazancında ayrıca 5 puan indirim alabilir (25 − 2 − 5 = %18). Sanayi sicil belgeli üretim kazancında ise oran %12,5'tir.<\/li>\n<li><b>Yatırım teşvik belgesi (7555, 24.07.2025):<\/b> indirimli KV uygulaması ilk dönem dahil en fazla <b>10 hesap dönemi<\/b>; indirim oranı <b>%60<\/b>, yani indirimli oran <b>%10<\/b>. Kazanç olduğu halde kullanılmayan yatırıma katkı tutarı sonraki dönemlere taşınamaz. Diğer faaliyet kazançlarına indirimli oranla kullanım ilk dönem dahil en fazla <b>4 yıl<\/b>. İndirimli oran, KVK m.32'deki diğer indirimler uygulandıktan sonraki oran üzerine uygulanır.<\/li>\n<\/ul>\n\n<h3>Geçici vergi<\/h3>\n<ul>\n<li>Kurumlar ve bazı GV mükellefleri üçer aylık dönemler halinde <b>yılda dört kez<\/b> geçici vergi öder. Beyan ve ödeme, dönemi izleyen <b>ikinci ayın 17'si<\/b>dir.<\/li>\n<li>Oran: GV'de <b>%15<\/b>; KV'de dönemin KV oranı (2018–2020 %22, 2021 %25, 2022 %23, 2023–2025 %25). Ödenen geçici vergi yıllık beyannamedeki vergiden indirilir.<\/li>\n<\/ul>\n<table>\n<tr><th>Dönem<\/th><th>Aylar<\/th><th>Beyan ve ödeme<\/th><\/tr>\n<tr><td>1<\/td><td>Ocak–Şubat–Mart<\/td><td>17 Mayıs<\/td><\/tr>\n<tr><td>2<\/td><td>Nisan–Mayıs–Haziran<\/td><td>17 Ağustos<\/td><\/tr>\n<tr><td>3<\/td><td>Temmuz–Ağustos–Eylül<\/td><td>17 Kasım<\/td><\/tr>\n<tr><td>4<\/td><td>Ekim–Kasım–Aralık<\/td><td>17 Şubat<\/td><\/tr>\n<\/table>\n<ul><li>Tevkif yoluyla kesilen vergiler de, gelir beyan ediliyorsa beyannamede hesaplanan vergiden indirilir; beyan zorunluluğu yoksa kesinti nihai vergi olur.<\/li><\/ul>\n\n<h3>Kurum kazancından indirimler (KVK m.10)<\/h3>\n<ul><li>Beyannamede ayrıca gösterilmek şartıyla <b>sırasıyla<\/b> yapılır. (a) bendi 6728 ile kaldırıldığından sıralama (b) ile başlar.<\/li><\/ul>\n<table>\n<tr><th>Bent<\/th><th>İndirim<\/th><th>Oran / sınır<\/th><\/tr>\n<tr><td>b<\/td><td>Sponsorluk harcamaları (3289 ve 3813 sayılı Kanunlar)<\/td><td>Amatör spor <b>%100<\/b>, profesyonel spor <b>%50<\/b><\/td><\/tr>\n<tr><td>c<\/td><td>Kamu idareleri, belediyeler, köyler, vergi muafiyetli vakıflar, kamu yararına dernekler, bilimsel Ar-Ge kuruluşlarına makbuz karşılığı bağış<\/td><td>Kurum kazancının <b>%5<\/b>'ine kadar<\/td><\/tr>\n<tr><td>ç<\/td><td>Okul, sağlık tesisi, öğrenci yurdu (en az <b>100 yatak<\/b>, kalkınmada öncelikli yörede <b>50<\/b>), çocuk yuvası, huzurevi, ibadethane, gençlik merkezi vb. inşa harcaması ve bağışları<\/td><td>Tamamı<\/td><\/tr>\n<tr><td>d<\/td><td>Kültür ve sanat faaliyetlerine ilişkin harcama ve bağışlar<\/td><td><b>%100<\/b> (Cumhurbaşkanı yarısına indirebilir)<\/td><\/tr>\n<tr><td>e<\/td><td>Cumhurbaşkanınca başlatılan yardım kampanyalarına bağış<\/td><td>Tamamı<\/td><\/tr>\n<tr><td>f<\/td><td>Darülaceze, Türkiye Kızılay Derneği, Türkiye Yeşilay Cemiyetine nakdi bağış (iktisadi işletmeleri hariç)<\/td><td>Tamamı<\/td><\/tr>\n<tr><td>g<\/td><td>VUK m.325/A girişim sermayesi fonu olarak ayrılan tutar<\/td><td>Beyan edilen gelirin <b>%10<\/b>'una kadar<\/td><\/tr>\n<tr><td>ğ<\/td><td>Yurt dışındakilere verilen ve yurt dışında yararlanılan mimarlık, mühendislik, tasarım, yazılım, tıbbi raporlama, çağrı merkezi, veri işleme vb. hizmet kazançları; yerleşik olmayanlara eğitim ve sağlık hizmeti<\/td><td>Kanunda <b>%80<\/b>; 11257 sayılı CK ile <b>%100<\/b>. Kazancın tamamı beyanname tarihine kadar Türkiye'ye transfer edilmeli, fatura yurt dışındaki müşteri adına düzenlenmeli<\/td><\/tr>\n<tr><td>h<\/td><td>Korumalı işyerinde çalışan zihinsel veya ruhsal engelli çalışanların ücretleri<\/td><td>Yıllık brüt ücretin <b>%100<\/b>'ü; her çalışan için en fazla <b>5 yıl<\/b>, yıllık tutar asgari ücretin yıllık brüt tutarının <b>%150<\/b>'sini aşamaz<\/td><\/tr>\n<tr><td>ı<\/td><td>Nakdi sermaye artışı faiz indirimi<\/td><td>Hesaplanan tutarın <b>%50<\/b>'si; yurt dışından getirilen nakitle artışta <b>%75<\/b><\/td><\/tr>\n<tr><td>i<\/td><td>Transit ticaret ve yurt dışı mal alım satımına aracılık kazancı<\/td><td><b>%95<\/b>; uygun endüstri bölgeleri ve İFM katılımcıları için <b>%100<\/b><\/td><\/tr>\n<tr><td>j<\/td><td>Nitelikli hizmet merkezlerinin yurt dışından elde ettiği kazanç<\/td><td><b>%95<\/b> (endüstri bölgesi ve İFM'de %100); faaliyete geçtiği dönemden itibaren <b>20 hesap dönemi<\/b><\/t
