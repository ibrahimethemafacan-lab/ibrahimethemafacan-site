tak banka borcu yarı oranda sayılır. Beşincisi, sermaye azaltımında beş yıl geçtiyse oransal, geçmediyse sırayla azaltım yapılır."], "5": ["Merhaba, beşinci ve bu kısmın son bölümündeyiz. Bugün dört yeni düzenlemeyi konuşacağız. Yurt içi asgari kurumlar vergisi, çok uluslu gruplar için küresel asgari vergi, vergiye uyumlu mükellef indirimi ve varlık barışı. Hepsi sayı dolu, sınavda doğrudan oran ve tarih olarak çıkıyor.", "Önce yurt içi asgari kurumlar vergisi. Mantığı şu. Bir şirket istisna ve indirimlerle vergisini çok düşürebilir. Kanun bir taban koyuyor. Hesaplanan vergi, indirim ve istisnalar düşülmeden önceki kazancın yüzde onundan az olamaz.", "Peki bu kazanç nedir. Ticari bilanço kârına kanunen kabul edilmeyen giderleri ekliyorsun. Sonuç sıfırdan büyükse asgari vergi hesaplanıyor. Mesela bu tutar yirmi milyon lira olsun. Asgari vergi iki milyon. Şirketin normal hesapladığı vergi bir buçuk milyonsa, iki milyon ödemek zorunda.", "Ama bazı istisnalar asgari matrahtan da düşülebiliyor. İştirak kazançları, emisyon primi, fon kazançları, serbest bölge ve teknoloji geliştirme bölgesi kazançları bunlardan. Fon kazancında bir ayrıntı var. Fonların taşınmazlardan elde ettiği kazanç bu listeye dahil değil. İndirimler tarafında da girişim sermayesi fonu, korumalı işyeri, transit ticaret, nitelikli hizmet merkezi ve Ar Ge indirimi düşülebiliyor.", "Kimlere uygulanmaz, onu iyi bil. Kurumlar vergisinden muaf olanlara, ilk defa faaliyete başlayan şirketlere üç hesap dönemi boyunca ve hasılat esasında vergilenenlere. Burada dur bir saniye. Birleşme, devir ya da bölünmeyle kurulan şirket yeni başlamış sayılmaz. Yani üç yıllık muafiyet alamaz.", "Asgari vergi iki bin yirmi beşten itibaren uygulanıyor ve geçici vergi dönemlerinde de hesaplanıyor. Hesaplanan asgari vergiden, o döneme ait geçici vergiler ve kesinti yoluyla ödenen kurumlar vergisi düşülebiliyor.", "Şimdi küresel asgari vergiye geçelim. Bu vergi büyük çok uluslu grupları hedefliyor. Ölçüt yedi yüz elli milyon avro. Grubun konsolide hasılatı, önceki dört hesap döneminin en az ikisinde bu sınırı aşıyorsa kapsamdasın. Cari yılın hasılatı hesaba girmez. Aşımların art arda olması da gerekmez.", "Hasılat, şirketlerin tek tek toplamı değil konsolide rakam. Grup içi satışlar elenir. Sınırın lira karşılığı her yıl Ocak ayında, Avrupa Merkez Bankasının önceki Aralık ortalama kuruyla hesaplanıp Gelir İdaresi tarafından ilan ediliyor.", "Muaf olanlar da var. Kamu kurumları, uluslararası kuruluşlar, kâr amacı gütmeyen kuruluşlar ve emeklilik yatırım fonları. Ana işletme niteliğindeki yatırım fonları ve gayrimenkul yatırım araçları da muaf. Ama muafların hasılatı yedi yüz elli milyon sınırı hesabına yine giriyor. Muafiyetten vazgeçen işletme en az beş hesap dönemi vazgeçmiş sayılıyor. Kamu niteliğindeki varlık fonları ise nihai ana işletme sayılmıyor.", "Uluslararası deniz taşımacılığı kazançları da istisna. Bununla bağlantılı yan faaliyetler de istisna, ama bir şartla. Bu yan kazançlar, ana deniz taşımacılığı kazancının yarısını geçmemeli. Bir de kısmen sahip olunan ana işletme tanımını hatırla. Payların yüzde yirmisinden fazlası grup dışındakilerdeyse bu tanıma giriyor.", "Gelelim vergiye uyumlu mükellef indirimine. Şartları sağlayan mükellef, yıllık beyannamede hesaplanan verginin yüzde beşini indirebiliyor. İki bin yirmi altıdan itibaren bu indirim en fazla on iki milyon lira. Bankalar, sigorta ve reasürans şirketleri, emeklilik şirketleri ve emeklilik yatırım fonları yararlanamıyor. Şartları sağlayan dar mükellefler ise yararlanabiliyor.", "Şartlar üç tane. Son üç yılın, yani indirim yılı ve önceki iki yılın beyannameleri süresinde verilmiş olacak. Kesinleşmiş bir tarhiyat olmayacak, ama tutarı yıllık sınırın yüzde birini aşmıyorsa sorun yok. Ve bin liranın üzerinde vadesi geçmiş borç bulunmayacak.", "İndirim ödenecek vergiden büyükse ne olur. Mesela indirim yüz bin, ödenecek vergi altmış bin lira. Kalan kırk bin lira, beyanname tarihinden sonraki bir tam yıl içinde diğer vergilerden düşülebilir. Bu sürede kullanılmazsa iade edilmez. Şartları sağlamadığın sonradan anlaşılırsa vergi alınır ama vergi ziyaı cezası kesilmez.", "Son konu varlık barışı. İki bin yirmi altıda yürürlüğe giren bir kanunla geldi. Yurt dışındaki para, altın, döviz ve menkul kıymetler otuz bir Temmuz iki bin yirmi yediye kadar bankaya ya da aracı kuruma bildiriliyor. Bildirimden sonra iki ay içinde Türkiye'ye getirilmeli. Türkiye'de olup kayıtlarda görünmeyen varlıklar da aynı tarihe kadar bildirilebiliyor.", "Vergi oranı yüzde beş. Ama varlığı vadeli hesapta, devlet tahvilinde, kira sertifikasında ya da girişim sermayesi fonunda tutmayı taahhüt edersen oran düşüyor. Bir yıla yüzde dört, iki yıla yüzde üç, üç yıla yüzde iki, dört yıla yüzde bir, beş yıla yüzde sıfır. Kolay bir hafıza ipucu, her yıl taahhüt bir puan indirim.", "Zamanlama da önemli. İki bin yirmi yedinin Ocak ayından Temmuz sonuna kadar yapılan bildirimlerde taahhütlü oranlar yarım puan artıyor. Mesela on milyon liralık varlık için üç yıl taahhütte iki bin yirmi altıda iki yüz bin, iki bin yirmi yedide iki yüz elli bin lira ödenir. Banka bu vergiyi bildirimi izleyen ayın on beşine kadar beyan edip öder.", "Varlık barışının asıl faydası şu. Bildirilen varlıklar için vergi incelemesi ve tarhiyat yapılmaz. Başka bir nedenle inceleme açılırsa ve bulunan matrah farkı bildirilen varlıktan kaynaklanıyorsa, varlık tutarı kadar kısım için tarhiyat yapılmaz. Fark büyükse sadece aşan kısım vergilenir.", "Toparlayalım. Birincisi, yurt içi asgari kurumlar vergisi, istisnalar düşülmeden önceki kazancın yüzde onu ve yeni şirketlerde üç dönem uygulanmaz. İkincisi, küresel asgari vergi, dört dönemin en az ikisinde yedi yüz elli milyon avroyu aşan gruplar için. Üçüncüsü, uyumlu mükellef indirimi yüzde beş ve en fazla on iki milyon lira. Dördüncüsü, varlık barışında son tarih otuz bir Temmuz iki bin yirmi yedi, temel oran yüzde beş. Beşincisi, taahhüt süresi uzadıkça oran her yıl bir puan düşer, beş yılda sıfır olur."], "6": ["Merhaba, kurumlarda ve sermaye piyasasında vergilendirme dersinin ikinci kısmına başlıyoruz. Bu bölümde temeli atacağız. Bir yatırımcı finansal araçtan hangi tür gelir elde eder, bu gelir nasıl hesaplanır, onu konuşacağız. Sonra da iki ayrı vergileme rejiminin neden yan yana yaşadığını göreceğiz.", "Önce kavram. Sermaye piyasası aracı, menkul kıymetleri, türev araçları ve yatırım sözleşmelerini kapsayan geniş bir şemsiye. Menkul kıymet ise bunun içindeki özel bir grup. Eski kanundaki tanımdan altı özellik çıkar. Ortaklık ya da alacaklılık sağlar, belli bir meblağı temsil eder, yatırım aracıdır, dönemsel gelir getirir, misli niteliktedir ve seri halinde çıkarılır.", "Yeni Sermaye Piyasası Kanunu tanımı genişletti ama bir şeyi açıkça dışarıda bıraktı. Para, çek, poliçe ve bono menkul kıymet değildir. Sınavda bu dörtlüyü sorarlar, aklında tut. Vadeli işlem ve opsiyon sözleşmeleri ise diğer sermaye piyasası aracı sayılır.", "Şimdi gelirin türüne geçelim. Bir gerçek kişi finansal araçtan iki tür gelir elde eder. Birincisi menkul sermaye iradı, yani faiz ve kâr payı. İkincisi değer artışı kazancı, yani alım satım kazancı. Hisse senedinden ikisi birden doğabilir. Mevduat ve ters repodan ise yalnızca faiz doğar.", "Burada dur bir saniye, çünkü bir tuzak var. Eğer kişi kendi adına ve devamlı olarak menkul kıymet alıp satıyorsa, artık bu ticari kazançtır. O zaman menkul sermaye iradı ve değer artışı kazancı hükümleri, onların istisnaları ve süreleri uygulanmaz. Kurumların bu gelirleri ise doğrudan kurum kazancına girer.", "Menkul sermaye iradının tanımı şöyle. Kişinin ticari, zirai ya da mesleki faaliyeti dışında, nakdi sermayesinden elde ettiği kâr payı, faiz ve benzeri iratlar. Kanun bazılarını kaynağına bakmadan bu gruba sokmuş. Hisse kâr payı, tahvil faizi, mevduat faizi, katılım bankası kâr payı, repo geliri ve vadesi gelmemiş kuponun satışı bunlardan.", "Peki ne menkul sermaye iradı sayılmaz? Menkul kıymetin kuponlu ya da kuponsuz satılması, itfa karşılığı alınan para ve itfada verilen ikramiye. Şöyle düşün. Kuponu tek başına satarsan irat, kuponuyla birlikte tahvili satarsan alım satım kazancı. Bu ayrımı sınavda çok soruyorlar.", "İndirim oranına gelelim. Bu mekanizma enflasyonun nominal geliri şişirmesini dengelemek için vardı. İki bin altıdan itibaren kaldırıldı. Ama iki bin altıdan önce ihraç edilmiş, dövize ya da başka bir değere endeksli olmayan tahvil ve bonolarda hâlâ yaşıyor. Oranı bulmak için yeniden değerleme oranını, Hazine ihalelerindeki bileşik ortalama faize bölersin.", "Menkul sermaye iradından hangi giderler düşülür? Kiralık kasa kirası ve sigortası gibi muhafaza giderleri. Faizin ya da temettünün tahsilinde aracı kuruma ödenen masraf. Bir de menkul kıymet için ödenen vergi, resim ve harçlar. Ama dikkat, kâr payından kesilen stopaj gider olarak düşülmez. O, hesaplanan vergiden mahsup edilir.", "Değer artışı kazancına geçelim. Bu kazanç elden çıkarmayla doğar. Elden çıkarma yedi şekilde olur. Satış, ivazlı devir, trampa, takas, kamulaştırma, devletleştirme ve şirkete sermaye olarak koyma. Miras ya da bağış bu listede yok, çünkü bunlar karşılıksız intikallerdir.", "Kazanç basit bir çıkarmayla bulunur. Satıştan elde ettiğin tutardan maliyeti, komisyon gibi satış giderlerini ve ödediğin vergi ve harçları düşersin. Ancak maliyet bedeli enflasyona göre güncellenir. Bunu üretici fiyat endeksiyle yaparsın ve satış ayını hesaba katmazsın.", "Endekslemenin bir şartı var. İki bin beşten sonra ihraç edilen kıymetlerde, artışın yüzde on veya üzerinde olması gerekir. Örnek verelim. İki yüz bin liraya aldığın kıymeti iki yüz altmış bine sattın, iki bin lira komisyon ödedin. Artış yüzde on beşse maliyet iki yüz otuz bin olur ve kazanç yirmi sekiz bin liradır. Artış yüzde sekiz olsaydı endeksleme olmaz, kazanç elli sekiz bin olurdu.", "Zarar mahsubu da önemli. Normalde bir gelir unsurundaki zarar, diğerlerinin kârından düşülebilir. Tek istisna diğer kazanç ve iratlar. Yani alım satım zararını kâr payına ya da faize mahsup edemezsin. Ama alım satım kazançlarını kendi içinde netleştirebilirsin. Hisseden kâr, tahvilden zarar etmişsen ikisini birbirinden düşersin.", "Şimdi büyük resme bakalım. Geçici altmış yedinci madde iki bin altıda yürürlüğe girdi ve kitabın girişindeki güncel karara göre iki bin otuz sonuna kadar geçerli. Kitabın bu bölümünde eski tarihler de yazıyor, onlara takılma. Amacı vergilemeyi basitleştirmek. Bu rejimde aracı kurum ya da banka stopajı keser ve çoğu yatırımcı için stopaj nihai vergidir. Beyanname yok, endeksleme yok, indirim oranı yok.", "Ama bu madde her araç için geçerli değil. Kapsamı kanunla ve tebliğle çizilmiş. Dışında kalan gelirler için olağan rejim işler. Olağan rejimde beyan usulü ve artan oranlı tarife vardır. İşte bu yüzden iki rejim yan yana yaşıyor ve her soruda önce hangi rejimdeyim diye sormalısın.", "Toparlayalım. Birincisi, para, çek, poliçe ve bono menkul kıymet değildir. İkincisi, kuponlu satış ve itfa menkul sermaye iradı sayılmaz, kuponun tek başına satışı sayılır. Üçüncüsü, kâr payı stopajı gider olarak düşülmez. Dördüncüsü, endeksleme satış ayı hariç yapılır ve iki bin beş sonrası ihraçlarda yüzde on şartı aranır. Beşincisi, alım satım zararı yalnızca alım satım kazancına mahsup edilir."], "7": ["Merhaba, bu bölümde tam mükellef gerçek kişiyi masaya koyuyoruz. Hisse senedinden ve tahvilden elde ettiği gelirleri tek tek ele alacağız. Kâr payı, hisse alım satım kazancı, tahvil faizi ve tahvil alım satım kazancı. En sonda da beyan ve ödeme takvimini konuşacağız.", "Kâr payıyla başlayalım. Şirket kârı dağıtırken stopajı kendisi keser, kalanını sana öder. Bu oran iki bin yirmi bir sonunda yüzde ona inmişti. Ama yirmi iki Aralık iki bin yirmi dörtten itibaren yeniden yüzde on beş oldu. Kâr payları geçici altmış yedi kapsamına girmez, olağan rejimde kalır.", "Şimdi en sevilen kural geliyor. Tam mükellef bir kurumdan aldığın kâr payının yarısı vergiden istisnadır. Kalan yarı, stopajlı diğer gelirlerinle birlikte beyan sınırını aşarsa beyan edersin. İki bin yirmi beşte sınır üç yüz otuz bin, iki bin yirmi altıda dört yüz bin lira.", "Bir örnekle oturtalım. İki bin yirmi altıda bir milyon lira brüt kâr payı aldın. Şirket yüzde on beşten yüz elli bin lira kesti. Beyana yarısı, yani beş yüz bin lira girer. Tarifeye göre vergi doksan yedi bin beş yüz lira çıkar. Kesilen yüz elli bin liranın tamamı bu vergiden mahsup edilir.", "Burada dur bir saniye, çünkü sınavda tam da bu sınırla oynarlar. Yedi yüz altmış bin lira kâr payı düşün. Yarısı üç yüz seksen bin. İki bin yirmi altı sınırını aşmaz, beyan yok. Ama aynı tutar iki bin yirmi beşte olsaydı üç yüz otuz bini aşar ve beyan edilirdi.", "Yabancı şirketten kâr payı aldıysan kural sertleşir. Yarı istisna yok. Brüt toplam iki bin yirmi altıda yirmi iki bin lirayı aşarsa tamamını beyan edersin. İki bin yirmi beşte bu sınır on sekiz bin liraydı. Yurt dışında kesilen vergiyi ise mahsup edebilirsin.", "Hisse alım satım kazancına geçelim. Ayrım tarihe ve kayda göre yapılır. İki bin altıdan sonra alınan ve Sermaye Piyasası Kurulu kaydındaki hisseler geçici altmış yedi rejimindedir. İki bin altıdan önce alınanlar ile kayda alınmamış hisseler olağan rejimde kalır.", "Olağan rejimde elde tutma süreleri önemli. İki bin altıdan önce alınmış ve borsada işlem gören hisse üç ay tutulursa kazanç vergilenmez. Borsada işlem görmeyen tam mükellef şirket hissesinde bu süre bir yıldan fazladır. İki bin altıdan sonra alınmış ama kayda alınmamış hissede ise iki yıldan fazla tutman gerekir.", "Miras ya da bağış gibi karşılıksız edindiğin hisseyi satarsan vergi yok. Bedelsiz hisselerde de bir incelik var. Bedel ödeyerek aldığın hisseye bağlı bedelsizlerde süre, o kök hissenin alındığı günden başlar. Bunu kök kuralı diye aklında tut.", "Geçici altmış yedi tarafında tablo çok sade. Hisse alım satım kazancında stopaj iki bin sekizden beri yüzde sıfır. Yalnız menkul kıymet yatırım ortaklığı hisselerinde yüzde on kesilir. O hisseyi de bir yıldan fazla tutarsan stopaj yok. Borsada işlem gören ve bir yıldan fazla tutulan hissenin kazancı ise tümüyle istisnadır.", "Şimdi beyan ve ödeme takvimi. Beyanname, geliri elde ettiğin yılı izleyen yılın Mart ayı sonuna kadar verilir. Postayla gönderiyorsan en geç otuz bir Mart'ta postaya vermelisin. Vergiyi iki eşit taksitte ödersin. İlk yarı Mart'ta, ikinci yarı Temmuz sonuna kadar.", "Tahvil faizine bakalım. Faizin menkul sermaye iradı olması için devlet ya da şirket ayrımı fark etmez. Fark vergilendirmede çıkar. İki bin altıdan sonra ihraç edilen tahvilin faizi geçici altmış yedi kapsamında stopajla vergilenir. Önce ihraç edilenler olağan rejimde, indirim oranı ve beyan sınırıyla vergilenir.", "Oranları sırayla söyleyeyim. Genel oran yüzde on. Finansman bonosunda yüzde on beş. Hazine ve Maliye Bakanlığının çıkardığı devlet tahvili ve hazine bonosunda ise iki bin yirmi bir sonundan iki bin yirmi altı sonuna kadar alınanlarda oran sıfır. Bu sıfır oran defalarca uzatıldı, sınavda son tarihi sorarlar. Kitabın ekinde iki bin yirmi beş sonu yazan bir yer de var, ama metindeki en son uzatma iki bin yirmi altı sonu.", "Bankaların çıkardığı bonolarda oran hem vadeye hem alış tarihine göre değişir. Bir Şubat iki bin yirmi beşten sonra alınanlarda bir yıla kadar vadede yüzde on beş, bir yıldan uzunda yüzde on. Örneğin altı ay vadeli bonodan kırk bin lira faiz aldıysan altı bin lira kesilir. İki bin yirmi dört ortasında alınmış uzun vadeli tahvilde ise oran yüzde iki buçuktu.", "Şirketlerin yurt dışında çıkardığı tahvillerde oran vadeye bağlı. Yirmi bir Mart iki bin on dokuzdan beri bir yıla kadar yüzde yedi, bir ila üç yıl arası yüzde üç, üç yıl ve üzeri sıfır. Eurobond tarafında ise faiz geçici altmış yedi kapsamında değil. İndirim oranı uygulanmaz ve kazanç, faizi tahsil ettiğin günkü lira karşılığıdır.", "Son olarak tahvil alım satım kazancı. Olağan rejimde elde tutma süresi yok, bir gün bile tutsan vergilenir. Satışta stopaj kesilmez, maliyet enflasyona göre güncellenir. Dövizli tahvilde alış ve satış günlerinin kurlarıyla lira karşılıklarını bulur, farkı alırsın. Yani olağan rejimde kur farkı kazancın içine girer.", "Toparlayalım. Birincisi, kâr payı stopajı yüzde on beş ve tam mükellef kurumdan gelen kâr payının yarısı istisna. İkincisi, beyan sınırı iki bin yirmi beşte üç yüz otuz bin, iki bin yirmi altıda dört yüz bin lira. Üçüncüsü, yabancı kâr payında yarı istisna yok. Dördüncüsü, borsada bir yıldan fazla tutulan hisse kazancı tümüyle istisna. Beşincisi, Hazine kâğıtlarında iki bin yirmi altı sonuna kadar alımlarda stopaj sıfır."], "8": ["Merhaba, bu bölümde oran tablolarının en yoğun olduğu kısma geliyoruz. Kira sertifikası, ters repo, mevduat, yatırım fonu, borsa yatırım fonu ve varant. Burada her şey iki soruya bağlı. Hangi araç ve ne zaman aldın ya da hesabı ne zaman açtın.", "Kira sertifikasıyla başlayalım. Bunu varlık kiralama şirketi çıkarır. Sertifika sahibi, şirketin devraldığı varlıkların gelirinden payı oranında hak kazanır. Elde ettiğin gelir menkul sermaye iradıdır. Yurt içinde ihraç edildiyse geçici altmış yedi kapsamında yüzde on stopaj kesilir ve bu nihai vergidir.", "Burada dur bir saniye, çünkü bir istisna var. Vadesi bir yıldan kısa kira sertifikalarında ve finansman bonolarında oran yüzde on beş. Bir de bankaların fon kullanıcısı olduğu sertifikalar var. Onlarda oran vadeye ve alış tarihine göre değişiyor, tıpkı banka bonoları gibi. Bir Şubat iki bin yirmi beşten sonra alınanlarda bir yıla kadar vade yüzde on beş, daha uzun vade yüzde on.", "Şirketlerin yurt dışında çıkardığı kira sertifikaları ise geçici altmış yediye girmez. Vadeye göre kesinti yapılır. Bir yıla kadar yüzde yedi, bir ila üç yıl arası yüzde üç, üç yıldan uzun vadede sıfır. Örneğin iki yıl vadeli sertifikadan otuz bin lira aldıysan dokuz yüz lira kesilir.", "Ters repoya geçelim. Bankaya parayı verirsin, banka sana tahvil satar ve geri almayı taahhüt eder. Senin kazancın menkul sermaye iradıdır. Oran yüzde on beş ve nihai. Yirmi bin liralık ters repo gelirinde üç bin lira kesilir. Bu oranı akılda tutmak kolay, çünkü yıllardır değişmedi.", "Mevduatta önce tanım. Bankalara, bankerlere, tasarruf sandıklarına yatırılan paraya ödenen faiz mevduat faizidir. Borsa para piyasasında değerlendirilen paranın faizi de bu gruba girer. İki Ocak iki bin on üçten önce açılmış hesaplarda vadeye bakılmaz, oran yüzde on beş.", "Türk lirası mevduatta güncel tabloyu ezberle. Dokuz Temmuz iki bin yirmi beşten itibaren altı aya kadar vadede yüzde on yedi buçuk. Bir yıla kadar vadede yüzde on beş. Bir yıldan uzun vadede yüzde on. Ondan hemen önceki dönemde, yani Şubat ile Temmuz iki bin yirmi beş arasında, oranlar yüzde on beş, on iki ve on idi.", "Bir örnek yapalım. Eylül iki bin yirmi beşte altı ay vadeli hesap açtın ve altmış bin lira faiz aldın. Yüzde on yedi buçuktan on bin beş yüz lira kesilir. Aynı faizi Mart iki bin yirmi beşte açtığın bir yıl vadeli hesaptan elli bin lira olarak alsaydın, yüzde on ikiden altı bin lira kesilirdi.", "Döviz tevdiat hesaplarında iş daha kolay. Yirmi sekiz Haziran iki bin yirmi üçten beri tüm vadelerde oran yüzde yirmi beş. Dört bin dolar faiz aldıysan bin dolar kesilir. Kur korumalı mevduatta ise uzun süre sıfır oran vardı, sonra kademeli olarak normal oranlara dönüldü.", "Yurt dışındaki bankadan faiz alırsan stopaj yok, ama beyan sınırı var. İki bin yirmi beşte on sekiz bin, iki bin yirmi altıda yirmi iki bin lira. Sınırı aşarsan tamamını beyan edersin. Yurt dışında kesilen bir vergi varsa onu mahsup edebilirsin.", "Şimdi yatırım fonları. Fonun kendi portföy kazancı için stopaj sıfır. Senin fondan çıkışta elde ettiğin kazanç ise alış tarihine göre vergilenir.", "Bunu bir zaman çizelgesi gibi düşün. Mayıs iki bin yirmi dörde kadar çoğu fonda sıfır. Sonra yüzde yedi buçuk, ardından yüzde on. Şubat iki bin yirmi beşten itibaren yüzde on beş, dokuz Temmuz iki bin yirmi beşten itibaren yüzde on yedi buçuk.", "Sınavda bu çizelgeden hesap sorarlar. Ağustos iki bin yirmi beşte aldığın fondan yirmi bin lira kazandıysan üç bin beş yüz lira kesilir. Mart iki bin yirmi beşte aldığın fondan kırk bin lira kazandıysan altı bin lira. Haziran iki bin yirmi dörtte aldığın fonda ise oran yüzde yedi buçuk, kırk bin liraya üç bin lira düşer.", "Bazı fonlar ayrı tutulur. Hisse senedi yoğun fonlarda oran sıfır. Gayrimenkul ve girişim sermayesi yatırım fonlarında iki yıldan fazla tutarsan sıfır. Portföyünün sürekli en az yüzde elli biri borsa hissesinden oluşan fonu bir yıldan fazla tutarsan tevkifat yok. Ama dikkat, Türkiye Elektronik Fon Alım Satım Platformunda işlem görmeyen serbest fonlarda bir yıl geçse de kesinti var.", "Yabancı bir yatırım fonundan kâr payı aldıysan kural tamamen farklı. Tutarı ne olursa olsun beyan edersin. Yurt dışında kesilen vergiyi mahsup edersin. Borsa yatırım fonlarında ise yerli fonlarla aynı oran takvimi geçerli ve stopaj nihai.", "Yatırım ortaklıklarından alınan kâr payları hisse kâr payı gibi vergilenir. Gayrimenkul yatırım ortaklığından dokuz yüz bin lira aldıysan yarısı istisna. Kalan dört yüz elli bin, iki bin yirmi altı sınırını aştığı için beyan edilir. Bunu sıradan bir hisse kâr payından ayırmana gerek yok.", "Son olarak varantlar. İki bin on yılındaki bir kararla varantların menkul kıymet olduğu netleşti. Hisseye ya da hisse endeksine dayalı varantta oran sıfır. Döviz gibi başka bir dayanağa bağlı varantta yüzde on. On iki bin liralık döviz varantı kazancından bin iki yüz lira kesilir.", "Toparlayalım. Birincisi, ters repo yüzde on beş ve nihai. İkincisi, dokuz Temmuz iki bin yirmi beşten beri Türk lirası mevduatta oranlar yüzde on yedi buçuk, on beş ve on. Üçüncüsü, döviz tevdiat hesabında oran yüzde yirmi beş. Dördüncüsü, aynı tarihten itibaren alınan fonlarda oran yüzde on yedi buçuk, ama hisse yoğun fonlarda sıfır. Beşincisi, yabancı fon kâr payı tutarı ne olursa olsun beyan edilir."], "9": ["Merhaba, bu bölümde iki yeni oyuncu var. Dar mükellef gerçek kişiler ve kurumlar. Dar mükellefte işin anahtarı çifte vergilendirmeyi önleme anlaşmaları. Kurumlarda ise anahtar kelime mahsup. Sonunda da vergilerin beyan ve ödeme takvimine kısaca bakacağız.", "Önce kim dar mükellef, onu netleştirelim. Burada konuştuğumuz kişi Türkiye'de işyeri ya da daimi temsilcisi olmayan yabancı yatırımcı. Türkiye'nin seksen dokuz ülkeyle çifte vergilendirmeyi önleme anlaşması var. Bu anlaşmalar hangi ülkenin vergi alacağını ve kaynak ülkenin en fazla hangi oranda kesinti yapabileceğini belirler.", "Klasik örnek Hollanda. Bu anlaşmanın on üçüncü maddesine göre, Hollanda mukimi Türkiye'de kayıtlı hisse ya da tahvil satıp kazanç elde ederse Türkiye bunu vergileyemez. Aynı kural Türk vatandaşı için Hollanda'da da işler. Sınavda böyle bir kişiye ne olur diye sorarlarsa, cevap vergilenmez.", "Serbest meslek ödemelerinde de anlaşmalar devreye girer. İç hukukta Gelir Vergisi Kanununun doksan dördüncü maddesine göre oran yüzde yirmi. On sekizinci madde kapsamındaki işler için yüzde on yedi. Dar mükellef kurumlarda petrol arama faaliyetine yüzde beş, diğer serbest meslek kazancına yüzde yirmi uygulanır.", "Anlaşma kesinti yapılmasını engelliyorsa iki form devreye girer. Bir numaralı formu hizmeti sunan yabancı doldurur ve hizmet başladıktan sonra otuz gün içinde ödemeyi yapana verir. İki numaralı formu ödemeyi yapan doldurur ve ödemeden önce vergi dairesine verir. Süre ya da yetki belirsizse, kesinti yapmak zorundasın.", "Şimdi dar mükellefin menkul kıymet gelirlerine bakalım. Kâr payında şirketin kestiği stopaj nihai vergidir, beyan yok. Ama oran anlaşmadaki oranı aşamaz. Ters repoda ve mevduatta da aynı mantık var. Anlaşmadaki oran yüzde on beşten düşükse, düşük oran uygulanır.", "Olağan rejimdeki alım satım kazancında ise dar mükellef işini hızlı görmeli. Kazancı elde ettiği tarihten itibaren on beş gün içinde münferit beyanname verir ve vergiyi öder. Bu on beş gün sınavın gözde sayılarından biri. Geçici altmış yedi kapsamındaki kazançta ise stopaj nihai ve münferit beyanname yok.", "Eurobond ve şirketlerin yurt dışında çıkardığı tahvillerin alım satım kazancı biraz farklı. Geçici altmış yedi kapsamına girmez, stopaj da yok. Ama dar mükellef bunun için münferit beyanname de vermez. Eurobond faizinde ise oran sıfır.", "Vadeli işlem ve opsiyona geçelim. İki bin sekiz sonuna kadar borsadaki işlemlerde oran sıfırdı. İki bin dokuzdan itibaren hisseye ya da hisse endeksine dayalı sözleşmelerde oran yine sıfır kaldı. Diğer sözleşmelerde sermaye şirketleri için sıfır, öteki yatırımcılar için yüzde on. Bu ayrım hem tam hem dar mükellefte aynı.", "Bu işlemler bir de banka ve sigorta muameleleri vergisine tabi olabilir. İki bin on yedi sonuna kadar yalnızca Türkiye'deki borsalarda yapılan işlemler istisnaydı. İki bin on sekizden itibaren yeri ne olursa olsun tüm vadeli işlem ve opsiyon muameleleri istisna oldu.", "Kurumlara gelelim. Kurumun elde ettiği her gelir kurum kazancına girer. Aracı kurumun kestiği vergi, kurumlar vergisinden mahsup edilir. Kurumlar vergisi çıkmazsa diğer vergi borçlarına mahsup edilir, yine artarsa iade edilir. Ama bir sınır var. Kazanç çarpı o kazancın tabi olduğu oran kadar mahsup yapabilirsin, fazlası olmaz.", "Tarihi bir geçiş kuralı da sınavda çıkar. Yirmi üç Temmuz iki bin altıda oran yüzde on beşten yüzde ona indi. Üç aylık dönemde aynı tür kıymetteki işlemler, bu tarihten önce ve sonra ayrı ayrı toplanır. İki taraf da kârdaysa her biri kendi oranıyla vergilenir. Biri kâr biri zarardaysa net kâr, kârlı tarafın oranıyla vergilenir.", "Bir örnek yapalım. Önceki dönem iki yüz lira kâr, sonraki dönem otuz lira zarar. Net yüz yetmiş lira kâr kalır ve önceki dönemin oranı olan yüzde on beşle vergilenir. Sonuç yirmi beş lira elli kuruş. Tersi olsaydı, net kâr yüzde onla vergilenirdi.", "Kurumların ekteki özetinden birkaç kritik bilgi. Kurumlar vergisi oranı iki bin on sekizden yirmiye kadar yüzde yirmi iki. İki bin yirmi birde yüzde yirmi beş, yirmi ikide yüzde yirmi üç, sonra yine yüzde yirmi beş. Şartları sağlayan hisse satış kazancının yarısı istisna. Tam mükellef şirketten alınan temettü ise kurumlar vergisinden istisna.", "Dar mükellef kurum için de bir hesap kalıbı var. Borsa dışı hisse satışından iki yüz bin lira kazandıysa önce yüzde yirmi beşten elli bin lira kurumlar vergisi öder. Kalan yüz elli bin liraya yüzde on beş stopaj uygulanır, yani yirmi iki bin beş yüz lira. Bu kazanç on beş gün içinde özel beyannameyle beyan edilir.", "Son olarak takvim. Gelir vergisi beyannamesi Mart sonuna kadar verilir, vergi Mart ve Temmuz'da iki taksitte ödenir. Kurumlar vergisi beyannamesi dönemin kapandığı ayı izleyen dördüncü ayın sonuna kadar, yani genelde Nisan'da. Muhtasar ve katma değer vergisi ayın yirmi sekizinde, damga vergisi yirmi altısında, gider vergisi ise on beşinde.", "Toparlayalım. Birincisi, dar mükellefin olağan rejimdeki alım satım kazancı on beş gün içinde münferit beyannameyle beyan edilir. İkincisi, kâr payı, repo ve mevduatta anlaşmadaki düşük oran uygulanır. Üçüncüsü, hisseye dayalı vadeli işlemlerde oran sıfır, diğerlerinde sermaye şirketi dışındakiler için yüzde on. Dördüncüsü, kurumun mahsup edebileceği vergi, kazanç çarpı tabi olduğu orandan fazla olamaz. Beşincisi, kurumlar vergisi beyannamesi dördüncü ayın sonuna kadar verilir."], "10": ["Merhaba, bu bölümde geçici altmış yedinci maddenin işleyişini konuşacağız. Kim keser, neyi keser, ne zaman yatırır, zarar olursa ne olur. Sonunda da ihtiyari beyan dediğimiz, yatırımcının elindeki kozu anlatacağım. Bu bölüm sınavda en çok soru çıkan yerlerden biri.", "Önce kapsam. Banka ve aracı kurumlar dört şey üzerinden tevkifat yapar. Alış ile satış arasındaki fark, alış ile itfa arasındaki fark ve bir menkul kıymete bağlı olmayan dönemsel getiriler. Bir de ödünç işleminde ödünç verenin lehine kalan tutar. Bu dörtlüyü bir kez yüksek sesle say.", "Peki hangi kıymetler? Türkiye'de ihraç edilip Sermaye Piyasası Kurulu kaydına alınanlar ya da Türkiye'de borsada işlem görenler. Hazinenin ve diğer kamu kurumlarının çıkardıkları ise kayıt ya da borsa şartı olmadan kapsamda. Vadeli işlem ve opsiyon sözleşmeleri de diğer sermaye piyasası aracı sayılır.", "Tevkifatı kim yapar? Türkiye'de faaliyet gösteren bankalar, Merkez Bankası ve aracı kurumlar. Bunların sorumluluğu kendilerine gelen bilgi ve belgeyle sınırlı. Biri yanlış bilgi verdiyse, kaybedilen vergi cezasıyla birlikte o bilgiyi verenden alınır. Yani bu bir kusur sorumluluğu.", "Burada dur bir saniye. Banka kendi portföyü için aldığı tahvilden kazanç sağlarsa tevkifat yok. Örnek verelim. Banka bonoyu beş milyondan alıp sana beş milyon iki yüz bine satıyor. Bankanın iki yüz bin lirası kesintiye girmez. Sen bonoyu bankaya beş milyon dört yüz elli bine geri satarsan, kitaptaki eski örnekte olduğu gibi senin iki yüz elli bin liralık kazancından yüzde on, yani yirmi beş bin lira kesilir.", "Saklamacılar da işin içinde. Yatırımcı Merkezi Kayıt Kuruluşu ya da Takasbank dışındaki bir saklamacıyla çalışıyorsa tevkifatı o saklamacı yapar. Çünkü maliyet bilgisini en iyi o bilir. Aracı kurum işlem günü bilgileri saklamacıya iletir. Saklamacı da ilk giren ilk çıkar yöntemiyle ya da gün içinde ağırlıklı ortalama fiyatla kazancı bulur.", "Tezgâh üstü virmanlar da alım satım sayılır. Bir hesaptan başka birinin hesabına mülkiyet devriyle aktarım yaparsan tevkifat doğar. Fiyatı müşteri yazılı bildirir. Ama bu fiyat önceki günün ağırlıklı ortalamasının en fazla yüzde on altında ya da üstünde olabilir. Ortalama yirmi liraysa yirmi üç lira kabul edilmez, yirmi lira esas alınır.", "Şimdi kimin gelirinden kesilir sorusu. Cevap çok geniş. Borsa yatırım fonları ve emeklilik yatırım fonları hariç herkesin. Tam ya da dar mükellef, muaf ya da değil, gelir istisna olsa bile fark etmez. Bu iki istisnayı sınavda sıkça sorarlar.", "Kapsam dışında kalanları da bilmelisin. Eurobond gelirleri ve hisse kâr payları. Borsada bir yıldan fazla tutulan tam mükellef şirket hisseleri. Portföyünün yüzde elli biri hisse olan fonlarda bir yıldan fazla tutulan paylar. Bir de iki bin altıdan önce ihraç edilen tahviller ile iki bin altıdan önce satın alınan kıymetler. Ödünçteki temettü telafi tazminatı ise kapsamda, buna dikkat.", "Tevkifat üçer aylık dönemlerle yapılır. Dönemi izleyen ayın yirmi altısı akşamına kadar beyan edilir ve aynı gün ödenir. Kitabın sonraki bir bölümünde beyan için yirminci gün yazıyor, ama ödeme her yerde yirmi altı. Yani Nisan, Mayıs, Haziran dönemi yirmi altı Temmuz'da. Beyanı genel müdürlükler yapar. Yabancı yatırımcıların saklamacısı ise yılın ilk çeyreği için Haziran'ın yirmi altısına kadar süre kazanır.", "Bakanlığa bildirim de üç durumda gerekir. Kıymet başka birinin adına nakledilirse, kıymet fiziken teslim alınırsa ve fiziken teslim edilirse. Bu bildirimler çeyreği izleyen ayın sonuna kadar yapılır. Tevkifata tabi tutulmuş mülkiyet devri virmanlarını ayrıca bildirmene gerek yok.", "Zarar konusuna gelelim. Aynı çeyrekte aynı tür kıymetteki işlemler tek işlem sayılır ve fazla kesilen vergi müşteriye iade edilir. Örneğin kırk bin kâr, on beş bin zarar, beş bin kâr. Kârlı işlemlerden dört bin beş yüz lira kesilmişti. Net otuz bin lira için üç bin lira yeterli, bin beş yüz lira sana döner.", "Çeyrek sonunda zarar varsa sonraki çeyreğe devreder, ama takvim yılını aşamaz. Yılın son çeyreğindeki zarar devredilemez.", "Aynı tür demek dört sınıf demek. Sabit getirililer, yani tahviller. Değişken getirililer, yani hisseler. Diğer sermaye piyasası araçları, yani türevler. Bir de fon payları ve yatırım ortaklığı hisseleri. Kitap bir yerde üç sınıf deyip fon paylarını ayrıca ekliyor, sonuç aynı. Tahvil zararını hisse kârına mahsup edemezsin.", "İhtiyari beyan ise bir kurtarma kapısı. Gerçek kişi, ister tam ister dar mükellef olsun, yıl sonunda alım satım kazançlarını beyan edip yıl içindeki aynı tür zararların tamamını mahsup edebilir. Faiz ve itfa gelirleri bu beyana girmez. Kurumlar ise bu imkândan yararlanamaz.", "Bir örnek verelim. İlk çeyrekte tahvilden altmış bin kâr ettin ve altı bin lira kesildi. Üçüncü çeyrekte kırk bin zarar ettin ve son çeyrekte işlem yapmadın. İhtiyari beyanda net yirmi bin lira kalır. Yüzde ondan iki bin lira vergi hesaplanır ve dört bin lira sana iade edilir. Mahsup edilemeyen zarar ise ertesi yıla geçmez.", "İhtiyari beyanda oran tektir, artan oranlı tarife yok. Yirmi üç Temmuz iki bin altıdan itibaren yüzde on, on dört Kasım iki bin sekizden itibaren menkul kıymet yatırım ortaklığı dışındaki hisselerde sıfır. Tam mükellef ikametgâh vergi dairesine, dar mükellef ise İstanbul'daki Boğaziçi Vergi Dairesine beyan verir.", "Toparlayalım. Birincisi, tevkifatı bankalar, Merkez Bankası ve aracı kurumlar yapar, kendi portföy kazançları kapsam dışıdır. İkincisi, borsa yatırım fonu ve emeklilik fonu dışında herkesin geliri kapsamdadır. Üçüncüsü, beyan ve ödeme çeyreği izleyen ayın yirmi altısıdır. Dördüncüsü, zarar aynı tür kıymette ve yıl içinde devreder, son çeyrek zararı devretmez. Beşincisi, ihtiyari beyanı yalnızca gerçek kişiler ve yalnızca alım satım kazancı için verebilir."], "11": ["Merhaba, bu bölüm hesap makinesi bölümü. Geçici altmış yedi kapsamında tevkifat matrahının nasıl bulunduğunu adım adım konuşacağız. İlk giren ilk çıkar, sermaye artırımı, rüçhan kuponu, kuponlu tahvil, döviz ve türevler. Kâğıt kalemi yanına al.", "Temel kural çok basit. Matrah, satış bedelinden alış bedelini çıkarınca bulunur. Hesaba yalnızca alış ve satışta ödenen komisyon ve banka sigorta muameleleri vergisi girer. Başka hiçbir gider düşülmez. Komisyon iadesi alırsan, o iade iadenin yapıldığı dönemin matrahına eklenir.", "Aynı hisseden farklı tarihlerde aldıysan ilk giren ilk çıkar yöntemini kullanırsın. Şöyle düşün. Önce on liradan sekiz bin adet, sonra on iki liradan dört bin adet aldın. On dört liradan on bin adet sattın. Önce sekiz bin ucuz hisse çıkar, sonra iki bin pahalı hisse. Maliyet yüz dört bin, satış yüz kırk bin, matrah otuz altı bin lira.", "Gün içinde alıp sattıysan ağırlıklı ortalama fiyat kullanılabilir. Ama matrah sonunda yine ilk giren ilk çıkara göre belirlenir. Bir de kural var. Seçtiğin yöntemi, o kurumdaki portföyün tamamen bitene kadar değiştiremezsin.", "Ödünç ve teminat ayrımı sınavın sevdiği bir tuzak. Ödünç verdiğin hisseler maliyet hesabında portföy dışında sayılır. Teminata verdiklerin ise portföy içinde kalır. Yani satış yaptığında önce teminattaki eski hisseler, sonra yeni aldıkların maliyete girer.", "Açığa satışta kural şu. Elinde olmayan hisseyi sattıysan, satıştan sonraki ilk alımın fiyatı maliyet olur. Sekiz liradan elli bin adet açığa sattın, sonra yedi yirmiden elli bin adet aldın. Matrah dört yüz bin eksi üç yüz altmış bin, yani kırk bin lira.", "Mirasla gelen hissede maliyet, ölüm tarihindeki borsa değeridir. Bağış gibi diğer bedelsiz edinmelerde ise hukuken edindiğin tarihteki borsa değeri. Borsada değilse emsal bedel. Varis bu hisseyi satınca, aradaki fark üzerinden tevkifat yapılır.", "Sermaye artırımına gelelim. Alış tarihi her durumda eski hisselerin alış tarihidir. Maliyet ise artırımın türüne göre değişir. Sermaye yedeklerinden bedelsiz artırımda eski maliyeti yeni toplam hisse sayısına bölersin. Otuz altı bin liraya aldığın dört bin hisse yüzde yüz bedelsizle sekiz bine çıkarsa birim maliyet dört buçuk liradır.", "Kâr yedeklerinden artırımda bir fark var. Eski maliyete yeni hisselerin nominal değerini de eklersin, sonra toplam hisseye bölersin. Bedelli artırımda ise eski maliyete ödediğin bedeli eklersin. On bir bin liralık iki bin hisseye bin lira ödeyip bin hisse eklediysen, on iki bini üç bine bölersin, birim maliyet dört lira.", "Rüçhan kuponunu hisseden ayrı satarsan kupon maliyetini bulman gerekir. Önce eski maliyet ile rüçhan için ödeyeceğin bedeli topla. Bunu eski ve yeni hisselerin toplam sayısına böl. Çıkan sayıdan rüçhan fiyatını çıkar ve artırım oranıyla çarp. On altı bin liraya bin hisse, yüzde elli artırım ve bir lira rüçhan fiyatı için kupon maliyeti beş lira. Elde kalan hissenin maliyeti de on bir liraya iner.", "Kuponlu tahvilde önce işlemiş faizi ayırırsın. İşlemiş faiz, kupon tutarı çarpı geçen gün bölü kupon dönemi gün sayısı. Ödediğin kirli fiyattan işlemiş faizi düşünce temiz fiyatı bulursun. Temiz fiyat tahvilin alış bedelidir, işlemiş faiz ise kuponun alış bedeli.", "Sayıyla görelim. Yüz bin nominal, on bin liralık kupon, yüz seksen iki günlük dönemin doksan biri geçmiş. İşlemiş faiz beş bin lira. Yüz dört bine aldıysan temiz fiyat doksan dokuz bin. İlk kuponda matrah on bin eksi beş bin, yani beş bin. Son kuponda ise kupon artı anapara ile temiz fiyat farkı, yani on bir bin lira.", "Temiz fiyat nominalin üstündeyse fazlası kalan kupon sayısına bölünür ve her kupondan düşülür. Yüz iki bin temiz fiyat ve dört kupon varsa kupon başına beş yüz lira düşersin. İlk kuponda bir de işlemiş faizi düşersin. Satış yaparsan, önceki kuponlarda düştüğün fazla ödemeleri temiz fiyattan çıkararak maliyeti bulursun.", "Döviz konusu çok karıştırılır. Yabancı para cinsinden ihraç edilmiş kıymette kur farkı vergilenmez. Dolar cinsinden kazancı bulur, satış günündeki kurla liraya çevirirsin. Elli bin dolara alıp elli bir bin dolara sattıysan, bin dolar çarpı satış kuru otuz dört, yani otuz dört bin lira. Dövize endeksli lira kıymette ise iki tarihin lira karşılıklarını alırsın.", "Türevlerde matrah, dayanağın piyasa değeri ile sözleşme fiyatına göre değeri arasındaki farktır. Forward alımda vadede spot kur yüksekse kâr edersin. Beş yüz bin dolarda kırk kuruşluk fark iki yüz bin lira matrah, yüzde ondan yirmi bin lira vergi. Spot kur düşükse zarar edersin, tevkifat yok, zararı yıl içinde aynı tür kazanca mahsup edersin.", "Opsiyonda alıcı hakkını kullanırsa matrah, kazancından ödediği primi düşerek bulunur. Prim sözleşme günündeki kurla liraya çevrilir. Opsiyonu satan taraf için ise karşı taraf hakkını kullanmazsa aldığı prim kazançtır ve matrah primin kendisidir.", "Son olarak tevkifatsız alımlar. Banka, tevkifat görmeden gelen bir tahvili senden satın alırsa, senin kazancından yüzde on keser. Tahvili hiç aracı kurumdan almadıysan alış yerine ihraç bedeli esas alınır. Seksen bin liralık ihraç bedelli tahvili doksan iki bine sattıysan bin iki yüz lira kesilir. Hisse, fon payı ve Eurobond bu kuralın dışında.", "Toparlayalım. Birincisi, matrahta yalnızca komisyon ve banka sigorta muameleleri vergisi düşülür. İkincisi, farklı tarihli alımlarda ilk giren ilk çıkar kullanılır, ödünç portföy dışı, teminat portföy içidir. Üçüncüsü, bedelsizde eski maliyet yeni hisse sayısına bölünür, bedellide ödenen bedel eklenir. Dördüncüsü, kuponlu tahvilde temiz fiyat alış bedelidir. Beşincisi, yabancı para kıymette kur farkı matraha girmez."], "12": ["Merhaba, son bölümdeyiz. Bugün yatırım fonlarının kendisini, yabancı fonları, Hazine Eurobondlarını ve darphane sertifikalarını konuşacağız. Sonra iki bin altı öncesinden kalan kıymetlere ve çifte vergilendirmeyi önleme anlaşmalarının pratiğine bakacağız.", "Önce fonun kendisi. Sermaye Piyasası Kanununa göre kurulan fon ve yatırım ortaklıklarının kazancına portföy işletmeciliği kazancı denir. Bu kazanç kurumlar vergisinden istisnadır. Üstüne kesilen stopaj da sıfır. Kitabın son bölümünde eski yüzde on beş oranı da geçiyor, güncel kural sıfır. Yani fonun vergi yükü sıfır. Vergi, yatırımcının fondan çıktığı anda, yatırımcının üzerinde doğar.", "Tarihsel bir çizelge sınavda çıkar. Portföy kazancında iki bin altının başından yirmi üç Temmuza kadar yüzde on beş, oradan bir Ekim'e kadar yüzde on, bir Ekim iki bin altıdan itibaren sıfır. Borsa yatırım fonları, konut finansmanı fonları ve varlık finansmanı fonları da bir Ekim iki bin altıda bu sisteme girdi.", "Burada dur bir saniye, çünkü bir istisna var. Serbest döviz fonları. İki bin yirmi Haziran'dan beri bu fonların portföy kazancından yüzde on beş kesiliyor. Yatırımcı tarafında da ayrıca stopaj var. Yani döviz fonunda hem fon bünyesinde hem yatırımcıda kesinti olur. İki yüz bin liralık portföy kazancında fon otuz bin lira öder.", "Emeklilik yatırım fonlarını ayrı tut. Bunlar geçici altmış yedi kapsamında hiç vergilendirilmez. Ne fonun kendisinde ne gelirlerinde tevkifat var. Sınavda emeklilik fonu ile borsa yatırım fonu çoğu zaman birlikte istisna olarak geçer.", "Fonların iki bin altı öncesi portföyü bir de ayrı izlenir. Eski kısım ve yeni kısım. Yönetim ücreti gibi genel giderler bu kısımların ağırlığına göre dağıtılır. Örneğin eski kısım üç milyon, yeni kısım dokuz milyonsa, seksen bin liralık ücretin altmış bini yeni kısma yazılır. Yalnızca yeni kısma ait bir gider varsa o doğrudan yeni kısma eklenir.", "Eski kısımda bir ölçü daha var. Hisse oranı en az yüzde yirmi beşse buna A tipi deniyor ve oran sıfır. Altındaysa B tipi ve oran yüzde on. Yüz yirmi bin liralık B tipi kazançta on iki bin lira kesilir. Fon iki bin altıdan sonra eski kısımdaki bir hisseyi satarsa, satış önce eski kısımdan yapılmış sayılır.", "Dar mükellef yatırım fonları için de bir geçiş dönemi var. İki bin altı başından itibaren bu fonlar Türk fonu sayılmıyor. Ama ellerindeki eski kıymetler için statüleri bir süre devam ediyor. Tahviller itfa olana kadar, hisseler ilk kez satılana kadar. İki bin beş sonunda portföyü boş olan fon ise tasfiye edilmiş sayılır.", "Yabancı fonlara geçelim. Kurumlar Vergisi Kanununun beş A maddesi bir güvenli liman kuruyor. Yabancı fonu Türkiye'de yöneten tam mükellef şirket, dört şart sağlanırsa fonun daimi temsilcisi sayılmaz. Böylece fon Türkiye'de beyanname vermez. Şartlar şunlar. İşlem mutat faaliyet olmalı, ilişki bağımsız olmalı, bedel emsale uygun olmalı ve şirketin fon kazancındaki payı yüzde yirmiyi geçmemeli.", "Bu şartlarda iki sayı çok önemli. Yüzde yirmi aşılırsa istisna tamamen gider, yüzde yirmilik kısım dahil kazancın tamamı vergilenir. Yüzde beş ise bildirim eşiği. Fonda tam mükellef Türk yatırımcıların payı yüzde beşi geçerse şirket bunları Gelir İdaresine bildirir. Bildirmezse vergiden müteselsilen sorumlu olur. Transfer fiyatlandırması raporunu da beyanname süresinde vermek şart.", "Eurobondlara gelelim. Bunlar Hazinenin yurt dışında çıkardığı tahviller. Faizleri sıfır oranlı tevkifata tabi ve vergi hukukunda tevkifatlı sayılır. Döviz cinsinden oldukları için indirim oranı uygulanmaz. Dar mükellef bu faizi tutarı ne olursa olsun beyan etmez.", "Tam mükellef ise beyan sınırını aşınca faizin tamamını beyan eder. Alım satım kazancında ise stopaj yok. İki bin altıdan sonra ihraç edilen Eurobondda istisna da yok, kazancı tutarı ne olursa olsun beyan edersin. Kazancı bulmak için satışın lira karşılığından alışın lira karşılığını düşersin. Dar mükellef ise iki bin altı Temmuz'dan beri bu kazanç için münferit beyanname vermez.", "Geçici elli dokuzuncu madde de sınavda sorulur. Yirmi altı Temmuz iki bin bir ile iki bin beş sonu arasında ihraç edilen devlet kâğıtları için, iki bin yedi sonuna kadar bir istisna tutarı vardı. Bu tarihleri bir kez not et, sonra unutmazsın.", "Darphane sertifikası daha yeni bir araç. İki bin yirmi ikide düzenlendi. Her sertifika sıfır virgül dokuz yüz doksan beş saflıkta, yüzde bir gram altını temsil eder ve vadesizdir. Toplam ihraç tavanı beş ton. Kazançlarda stopaj sıfır, ihtiyari beyanda da sıfır. İki bin beş yüz sertifika yirmi beş gram altın eder.", "İki bin altı öncesine kısa bir dönüş. Önce ihraç edilmiş tahvillerde ihraç tarihi belirleyici, sen ne zaman aldıysan al, geçici altmış yedi uygulanmaz. Önce satın alınmış kıymetlerde de aynı. Bu gelirler iki bin beş sonundaki eski hükümlerle vergilenir. Dar mükellef kurumlar bunları özel beyannameyle beyan eder.", "Son olarak anlaşmaların pratiği. Yabancı yatırımcı önce vergi kimlik numarası alır. Anlaşmadan yararlanmak için kendi ülkesinden mukimlik belgesi getirir. Bu belge izleyen yılın dördüncü ayına kadar geçerli ve gerçek kişide her yıl yenilenir. Kurumda ise kitabın ilk bölümü üç yılda bir yenilemeyi söylüyor. Belge tevkifattan önce verilmezse anlaşma dikkate alınmadan, kitaba göre yüzde on beş kesilir, sonra belgeyle iade istenir.", "Toparlayalım. Birincisi, fonların portföy kazancı kurumlar vergisinden istisna ve stopajı sıfır, ama serbest döviz fonlarında yüzde on beş. İkincisi, emeklilik fonları geçici altmış yedi dışında. Üçüncüsü, yabancı fon rejiminde yüzde yirmi hak sahipliği ve yüzde beş bildirim eşiği var. Dördüncüsü, Eurobond faizi sıfır oranlı tevkifatlı, iki bin altı sonrası Eurobond kazancı tutarı ne olursa olsun beyan edilir. Beşincisi, darphane sertifikası yüzde bir gram altın ve stopajı sıfır."]};
const AUD={"1": 21, "2": 20, "3": 17, "4": 20, "5": 18, "6": 16, "7": 17, "8": 18, "9": 17, "10": 18, "11": 18, "12": 17};
</script>
<script>
(function(){
const L="ABCDE";
const KEY="d1013-defter-v1";
const HUE=["#0E8F7E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#0891B2","#4F46E5","#BE185D","#15803D","#B45309","#0369A1","#9333EA","#0F766E","#C2410C","#1D4ED8"];
let st={ans:{},karma:null,tab:{}};
try{const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const TOTAL=S.reduce((n,x)=>n+x.sorular.length,0);
// Şıklar sabit bir tohumla karıştırılır
function order(sec,qi){const q=S[sec].sorular[qi];const idx=[0,1,2,3,4];if(q.k)return idx;const r=rng("d1013"+sec+"-"+qi);for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const id=(sec,qi)=>sec+"-"+qi;
function secStats(sec){let a=0,c=0;S[sec].sorular.forEach((q,qi)=>{const v=st.ans[id(sec,qi)];if(v!==undefined){a++;if(v===q.a)c++}});return{a,c,n:S[sec].sorular.length}}
function meter(a,c,n){return `<div class="meter" aria-hidden="true"><i class="g" style="width:${c/n*100}%"></i><i class="r" style="width:${(a-c)/n*100}%"></i></div>`}
function ring(c,n,color,label){const R=44,C=2*Math.PI*R,f=n?c/n:0;return `<div class="ring" role="img" aria-label="${c}/${n} doğru"><svg viewBox="0 0 104 104" width="100%" height="100%"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#EDF0F5" stroke-width="10"/>${c?`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/>`:""}</svg><div class="v"><div><b>${c}/${n}</b><span>${label}</span></div></div></div>`}

function nav(cur){
  let h=`<div class="grp"><a href="#genel" class="${cur==="genel"?"on":""}" style="--c:#0E8F7E"><span class="ic">◎</span><span>Genel bakış</span><span class="pc"></span></a>`;
  S.forEach((s,i)=>{const x=secStats(i);h+=`<a href="#b${s.id}" class="${cur==="b"+s.id?"on":""}" style="--c:${HUE[i]}"><span class="ic">${s.id}</span><span>${esc(s.kisa)}</span><span class="pc">${x.c}/${x.n}</span></a>`});
  h+=`<a href="#karma" class="${cur==="karma"?"on":""}" style="--c:#141A2B"><span class="ic">∑</span><span>Karma deneme</span><span class="pc"></span></a></div>`;
  const n=document.getElementById("nav");n.innerHTML=h;
  const on=n.querySelector("a.on");
  if(on&&n.scrollWidth>n.clientWidth){n.scrollLeft=on.offsetLeft-n.clientWidth/2+on.offsetWidth/2}
}

function qCard(sec,qi,num,showSrc){
  const q=S[sec].sorular[qi], k=id(sec,qi), v=st.ans[k], done=v!==undefined, ord=order(sec,qi);
  let o="";
  ord.forEach((oi,pos)=>{
    let cls="";
    if(done){ if(oi===q.a) cls="ok"; else if(oi===v) cls="bad"; }
    o+=`<button class="opt ${cls}" data-k="${k}" data-o="${oi}" ${done?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  let ex="",qc="";
  if(done){const ok=v===q.a;qc=ok?"done-ok":"done-bad";const corr=L[ord.indexOf(q.a)];ex=`<div class="exp ${ok?"ok":"bad"}"><span class="dot">${ok?"✓":"✕"}</span><div><b>${ok?"Doğru":"Yanlış — doğru cevap "+corr}</b>${esc(q.e)}</div></div>`}
  const src=showSrc?`<span class="tag src" style="--c:${HUE[sec]}">Bölüm ${S[sec].id}</span>`:"";
  return `<article class="q ${qc}" id="q${k}"><div class="qh"><span class="qn">${num}</span>${src}</div><p class="qt">${esc(q.q)}</p><div class="opts">${o}</div>${ex}</article>`;
}

function statsOf(list,ans){let a=0,c=0;list.forEach(([s,qi])=>{const v=ans[id(s,qi)];if(v!==undefined){a++;if(v===S[s].sorular[qi].a)c++}});return{a,c,n:list.length}}
function bar(x,extra){return `<div class="qbar"><span class="stat"><b>${x.a}</b>/${x.n} yanıtlandı · <b>${x.c}</b> doğru${x.a?` · %${Math.round(x.c/x.a*100)}`:""}</span>${meter(x.a,x.c,x.n)}${extra||""}</div>`}

function renderSection(si){
  const s=S[si], col=HUE[si];
  const tab=st.tab[si]||"notlar";
  const f=st.tab["f"+si]||"tum";
  const x=secStats(si), kb=s.sorular.filter(q=>q.k).length;
  let h=`<div style="--c:${col};display:contents">
  <div class="crumb"><a href="#genel">Genel bakış</a> / Bölüm ${s.id}</div>
  <section class="hero"><div><span class="pill">Bölüm ${s.id} / ${S.length} · ${s.sorular.length} soru</span><h1>${esc(s.baslik)}</h1><p>${esc(s.ozet)}</p></div>${ring(x.c,x.n,col,"doğru")}</section>
  <div class="row"><div class="seg" role="tablist"><button role="tab" data-tab="notlar" class="${tab==="notlar"?"on":""}" aria-selected="${tab==="notlar"}">Notlar</button><button role="tab" data-tab="sorular" class="${tab==="sorular"?"on":""}" aria-selected="${tab==="sorular"}">Sorular · ${s.sorular.length}</button></div><button class="btn listen" data-listen="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Bu bölümü podcast olarak dinle</button></div>`;
  if(tab==="notlar"){
    h+=`<div class="notes">${s.notlar.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>")}</div>
    <div class="row"><button class="btn pri" data-tab="sorular">Bu bölümün sorularına geç →</button></div>`;
  }else{
    const all=s.sorular.map((q,qi)=>[si,qi]);
    const fl=all.filter(([a,qi])=>{const q=S[a].sorular[qi],v=st.ans[id(a,qi)];if(f==="yanlis")return v!==undefined&&v!==q.a;if(f==="bos")return v===undefined;return true});
    const chips=`<div class="filters">${[["tum","Tümü"],["bos","Yanıtlanmamış"],["yanlis","Yanlışlarım"]].map(([k,t])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div><button class="btn" data-reset="${si}">Sıfırla</button>`;
    h+=bar(statsOf(all,st.ans),chips)+`<div class="qlist">`+(fl.length?fl.map(([a,qi])=>qCard(a,qi,qi+1,false)).join(""):`<div class="empty">Bu filtrede soru yok.</div>`)+`</div>`;
  }
  return h+`</div>`;
}

function newKarma(){
  const pool=[];S.forEach((s,si)=>s.sorular.forEach((q,qi)=>pool.push([si,qi])));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];S.forEach((s,si)=>{pool.filter(p=>p[0]===si).slice(0,S.length>8?2:3).forEach(p=>pick.push(p))});
  pool.forEach(p=>{if(pick.length<25&&!pick.some(x=>x[0]===p[0]&&x[1]===p[1]))pick.push(p)});
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
  st.karma={list:pick,ans:{}};save();
}
function renderKarma(){
  if(!st.karma||!st.karma.list) newKarma();
  const list=st.karma.list, x=statsOf(list,st.karma.ans);
  let h=`<div class="crumb"><a href="#genel">Genel bakış</a> / Karma deneme</div>
  <section class="hero" style="--c:#141A2B"><div><span class="pill">Tüm bölümler · ${list.length} soru</span><h1>Karma deneme</h1><p>Her bölümden en az ${S.length>8?"iki":"üç"} soru içeren rastgele set. Buradaki cevaplar bölüm skorlarını etkilemez.</p></div>${ring(x.c,list.length,"#0E8F7E","doğru")}</section>
  ${bar(x,`<button class="btn pri" data-newkarma="1">Yeni set oluştur</button>`)}<div class="qlist">`;
  const saved=st.ans; st.ans=st.karma.ans;
  list.forEach(([s,qi],n)=>{h+=qCard(s,qi,n+1,true)});
  st.ans=saved;
  return h+`</div>`;
}

function renderHome(){
  let tA=0,tC=0;S.forEach((s,i)=>{const x=secStats(i);tA+=x.a;tC+=x.c});
  let h=`<section class="hero"><div><span class="pill">SPL · Kurumlarda ve Sermaye Piyasasında Vergilendirme</span><h1>Vergilendirme Sınav Defteri</h1>
  <p>Vergi hukuku temel kavramları, kurumlar vergisi, sermaye piyasası kurumlarının ve araçlarının vergilendirilmesi için bölüm notları ve sorular.</p>
  <div class="row" style="margin-top:18px"><a class="btn pri" href="#b1">Bölüm 1'den başla</a><a class="btn" href="#karma">Karma deneme</a></div></div>${ring(tC,TOTAL,"#0E8F7E","toplam doğru")}</section>
  <div class="tiles"><div class="tile"><span>Yanıtlanan</span><b>${tA}<small style="font-size:14px;color:var(--muted)"> / ${TOTAL}</small></b></div><div class="tile"><span>Doğru</span><b style="color:var(--ok)">${tC}</b></div><div class="tile"><span>Başarı oranı</span><b>${tA?"%"+Math.round(tC/tA*100):"–"}</b></div></div>
  <div class="sec-h"><h2>Bölümler</h2><span class="stat">${TOTAL} soru</span></div>
  <div class="grid">`;
  S.forEach((s,i)=>{const x=secStats(i);const kb=s.sorular.filter(q=>q.k).length;h+=`<a class="card" href="#b${s.id}" style="--c:${HUE[i]}"><div class="top"><span class="no">Bölüm ${s.id}</span><span class="stat">${s.sorular.length} soru</span></div><span class="t">${esc(s.kisa)}</span><span class="d">${esc(s.ozet)}</span>${meter(x.a,x.c,x.n)}<span class="p"><span>${x.c}/${x.n} doğru</span><span>${x.a} yanıt</span></span></a>`});
  h+=`</div>
  <section class="facts"><h2>Sınav öncesi son bakış</h2><dl>
  <div><dt>KV oranı</dt><dd>%25; SP kurumları ve finans sektörü %30</dd></div>
  <div><dt>KV beyanı ve ödemesi</dt><dd>Dönemi izleyen 4. ayın son günü</dd></div>
  <div><dt>Örtülü sermaye</dt><dd>Öz sermayenin 3 katını aşan ortak borcu</dd></div>
  <div><dt>Yurt içi asgari KV</dt><dd>İndirim-istisna öncesi kazancın %10&#x27;u</dd></div>
  <div><dt>Uyumlu mükellef indirimi</dt><dd>%5, en fazla 12 milyon TL (2026)</dd></div>
  <div><dt>Kâr payı stopajı (22.12.2024&#x27;ten)</dt><dd>%15; tam mükellef kurumdan ½&#x27;si istisna</dd></div>
  <div><dt>GV beyan sınırı</dt><dd>2025: 330.000 TL; 2026: 400.000 TL</dd></div>
  <div><dt>TL mevduat stopajı (09.07.2025&#x27;ten)</dt><dd>6 aya kadar %17,5; 1 yıla kadar %15; daha uzun %10</dd></div>
  <div><dt>Fon payı stopajı (09.07.2025&#x27;ten iktisap)</dt><dd>%17,5; hisse yoğun fon %0</dd></div>
  <div><dt>BİST hissesi, 1 yıldan fazla</dt><dd>Tevkifat yok, GV&#x27;den istisna</dd></div>
  </dl></section>`;
  return h;
}

function route(){
  let r=(location.hash||"#genel").slice(1);
  const v=document.getElementById("view");
  let si=-1;const m=/^b(\d+)$/.exec(r);
  if(m&&+m[1]>=1&&+m[1]<=S.length) si=+m[1]-1; else if(r!=="karma") r="genel";
  v.innerHTML= si>=0?renderSection(si): r==="karma"?renderKarma():renderHome();
  v.dataset.sec=si; v.dataset.mode=r;
  nav(si>=0?"b"+(si+1):r);
  document.dispatchEvent(new CustomEvent("ky:route",{detail:{si}}));
}

document.addEventListener("click",e=>{
  const v=document.getElementById("view");const si=+v.dataset.sec;const mode=v.dataset.mode;
  const op=e.target.closest(".opt");
  if(op&&!op.disabled){
    const k=op.dataset.k,o=+op.dataset.o;
    if(mode==="karma"){st.karma.ans[k]=o}else{st.ans[k]=o}
    save();
    const y=window.scrollY; route(); window.scrollTo(0,y); return;
  }
  const t=e.target.closest("[data-tab]");
  if(t&&si>=0){st.tab[si]=t.dataset.tab;save();route();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");
  if(f&&si>=0){st.tab["f"+si]=f.dataset.f;save();route();return}
  const rs=e.target.closest("[data-reset]");
  if(rs){
    if(rs.dataset.armed){const s=+rs.dataset.reset;S[s].sorular.forEach((q,qi)=>delete st.ans[id(s,qi)]);save();route();}
    else{rs.dataset.armed="1";rs.textContent="Emin misin? Tekrar tıkla";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Sıfırla"}},3000)}
    return;
  }
  if(e.target.closest("[data-newkarma]")){newKarma();route();window.scrollTo(0,0);return}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const AU=new Audio();AU.preload="auto";
const PK="d1013-ses-v1";
let pref={rate:1,voice:"",follow:true,mode:"podcast"};
try{const r=localStorage.getItem(PK);if(r)pref=Object.assign(pref,JSON.parse(r))}catch(e){}
const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(pref))}catch(e){}};

let curSi=-1, qSi=-1, items=[], idx=0, playing=false, utt=null, navByPlayer=false;
const SEL="h3,h4,p,li,tr,.key";

// Kısaltmaları ve sembolleri sesli okunacak hale getir
const ABBR=[["AATUHK", "Amme Alacaklarının Tahsil Usulü Hakkında Kanun"],["Ar-Ge", "araştırma geliştirme"],["TKKOİ", "Toplu Konut ve Kamu Ortaklığı İdaresi"],["TEFAS", "Türkiye Elektronik Fon Alım Satım Platformu"],["ÇVÖA", "çifte vergilendirmeyi önleme anlaşması"],["GMSİ", "gayrimenkul sermaye iradı"],["BSMV", "banka ve sigorta muameleleri vergisi"],["GSYF", "girişim sermayesi yatırım fonu"],["GSYO", "girişim sermayesi yatırım ortaklığı"],["MKYF", "menkul kıymetler yatırım fonu"],["MKYO", "menkul kıymetler yatırım ortaklığı"],["TMSF", "Tasarruf Mevduatı Sigorta Fonu"],["TCMB", "Türkiye Cumhuriyet Merkez Bankası"],["KKEG", "kanunen kabul edilmeyen giderler"],["VİOP", "Vadeli İşlem ve Opsiyon Piyasası"],["BİST", "Borsa İstanbul"],["DİBS", "devlet iç borçlanma senetleri"],["TFRS", "Türkiye Finansal Raporlama Standartları"],["KKTC", "Kuzey Kıbrıs Türk Cumhuriyeti"],["TOKİ", "Toplu Konut İdaresi"],["TEFE", "toptan eşya fiyat endeksi"],["KZOB", "kâr ve zarar ortaklığı belgesi"],["SPKn", "Sermaye Piyasası Kanunu"],["FİFO", "ilk giren ilk çıkar"],["VDMK", "varlığa dayalı menkul kıymet"],["İDMK", "ipoteğe dayalı menkul kıymet"],["İTMK", "ipotek teminatlı menkul kıymet"],["VTMK", "varlık teminatlı menkul kıymet"],["KVK", "Kurumlar Vergisi Kanunu"],["GVK", "Gelir Vergisi Kanunu"],["VUK", "Vergi Usul Kanunu"],["VKN", "vergi kimlik numarası"],["MSİ", "menkul sermaye iradı"],["DAK", "değer artışı kazancı"],["KDV", "katma değer vergisi"],["ÖTV", "özel tüketim vergisi"],["GYF", "gayrimenkul yatırım fonu"],["GYO", "gayrimenkul yatırım ortaklığı"],["İFM", "İstanbul Finans Merkezi"],["VKŞ", "varlık kiralama şirketi"],["GİB", "Gelir İdaresi Başkanlığı"],["CBK", "Cumhurbaşkanlığı kararnamesi"],["BKK", "Bakanlar Kurulu Kararı"],["MKK", "Merkezi Kayıt Kuruluşu"],["KKM", "kur korumalı mevduat"],["TMS", "Türkiye Muhasebe Standartları"],["SPK", "Sermaye Piyasası Kurulu"],["ÜFE", "üretici fiyat endeksi"],["ÖST", "özel sektör tahvili"],["BYF", "borsa yatırım fonu"],["EYF", "emeklilik yatırım fonu"],["KFF", "konut finansmanı fonu"],["VFF", "varlık finansmanı fonu"],["TKİ", "Toplu Konut İdaresi"],["KOİ", "Kamu Ortaklığı İdaresi"],["ÖİB", "Özelleştirme İdaresi Başkanlığı"],["DTH", "döviz tevdiat hesabı"],["VİV", "veraset ve intikal vergisi"],["SPA", "sermaye piyasası aracı"],["AOF", "ağırlıklı ortalama fiyat"],["İVD", "İnternet Vergi Dairesi"],["VDB", "Vergi Dairesi Başkanlığı"],["ADR", "Amerikan depo sertifikası"],["GDR", "global depo sertifikası"],["KV", "kurumlar vergisi"],["GV", "gelir vergisi"],["CK", "Cumhurbaşkanı Kararı"],["DM", "dar mükellef"],["DT", "devlet tahvili"],["HB", "Hazine bonosu"],["YF", "yatırım fonu"],["YO", "yatırım ortaklığı"],["RG", "Resmî Gazete"],["VD", "vergi dairesi"],["TF", "transfer fiyatlandırması"],["İO", "indirim oranı"],["SPKn","Sermaye Piyasası Kanunu"],["TTSG","Türkiye Ticaret Sicili Gazetesi"],["TRİK","teminat, rehin, ipotek ve kefalet"],["YİB","yatırımcı ilişkileri bölümü"],["KYBF","Kurumsal Yönetim Bilgi Formu"],["URF","Uyum Raporu"],["KSS","kurumsal sosyal sorumluluk"],["NBD","net bugünkü değer"],["KGK","Kamu Gözetimi Kurumu"],["KYD","kurumsal yönetim derecelendirme"],["TTK","Türk Ticaret Kanunu"],["YK","yönetim kurulu"],["GK","genel kurul"],["KY","kurumsal yönetim"],["PD","piyasa değeri"],["FD","fiili dolaşımdaki"],["GM","genel müdür"],["SP","sermaye piyasası"],["ÇSY","çevresel, sosyal ve kurumsal yönetim"],["AB","Avrupa Birliği"],["ABD","Amerika Birleşik Devletleri"],["SOX","Sarbanes Oxley"]];
function speakable(t){
  t=" "+t.replace(/\s+/g," ")+" ";
  t=t.replace(/\(Z\)/g,"(zorunlu ilke)").replace(/\bmd\.\s?/g,"madde ").replace(/\bvb\./g,"ve benzeri").replace(/\bort\./g,"ortalaması").replace(/\börn\./g,"örneğin")
   .replace(/1\/3/g,"üçte bir").replace(/1\/10/g,"onda bir").replace(/1\/20/g,"yirmide bir")
   .replace(/%\s?(\d+(?:,\d+)?)/g,"yüzde $1").replace(/≥/g,"en az ").replace(/→/g,", sonra ").replace(/×/g," çarpı ").replace(/·/g,". ")
   .replace(/(\d)\s?[–-]\s?(\d)/g,"$1 ile $2").replace(/\s[–—]\s/g,", ").replace(/"/g,"");
  const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  t=t.replace(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/g,(m,d,mo,y)=>(+mo>=1&&+mo<=12)?(+d)+" "+AY[+mo-1]+" "+y:m);
  t=t.replace(/\b(\d)\.(\d{1,2})\.(\d{1,2})\.?(?!\d)/g,"$1 nokta $2 nokta $3").replace(/\b(\d)\.(\d)\.?(?=\s)/g,"$1 nokta $2");
  for(const [a,b] of ABBR){t=t.replace(new RegExp("(?<![\\p{L}\\d])"+a+"(?![\\p{L}\\d])","gu"),b)}
  t=t.replace(/(\p{Ll})[’'](\p{L})/gu,"$1$2").replace(/\s+/g," ");
  return t.trim();
}
function elemsOf(root){return [...root.querySelectorAll(SEL)].filter(el=>!el.querySelector(SEL)&&!(el.tagName==="TR"&&el.querySelector("th")))}
function textOf(el){
  if(el.tagName!=="TR")return el.textContent;
  const tbl=el.closest("table"), head=tbl&&tbl.querySelector("tr th")?[...tbl.querySelector("tr").children].map(c=>c.textContent.trim()):null;
  const cells=[...el.children];
  return cells.map((c,i)=>{const v=c.textContent.trim();if(!v||v==="–")return "";if(i>0&&head&&cells.length>2&&head[i])return head[i]+": "+v;return v}).filter(Boolean).join(". ");
}
function intro(){return pref.mode==="podcast"&&typeof AUD!=="undefined"?"Bu bölümün podcast'i hazır bir kayıttır; oynat düğmesine bas, anlatılan paragrafı burada takip et.":pref.mode==="podcast"?"Podcast modunda bu bölüm, sohbet havasında, örnekler ve akılda tutma ipuçlarıyla anlatılır. Anlatılan cümleyi burada takip edebilirsin.":"Bu modda notlar olduğu gibi sırayla okunur ve okunan kısım notlarda sarıyla işaretlenir."}
function split(t){
  if(t.length<=230)return [t];
  const parts=t.match(/[^.;!?]+[.;!?]*/g)||[t];const out=[];let cur="";
  parts.forEach(p=>{if((cur+p).length>230&&cur){out.push(cur.trim());cur=p}else cur+=p});
  if(cur.trim())out.push(cur.trim());return out;
}
function build(si){
  if(pref.mode==="podcast"&&typeof P!=="undefined"&&P[si+1]){
    items=[];if(typeof AUD!=="undefined"&&AUD[si+1])P[si+1].forEach((par,k)=>items.push({el:-1,raw:par,say:par,src:"audio/b"+(si+1)+"-"+(k+1)+".mp3"}));else P[si+1].forEach(par=>split(par).forEach(r=>items.push({el:-1,raw:r,say:speakable(r)})));
    qSi=si;idx=0;return;
  }
  const box=document.createElement("div");box.innerHTML=S[si].notlar;
  const els=elemsOf(box);items=[];
  items.push({el:-1,raw:"Bölüm "+S[si].id+". "+S[si].baslik+".",say:speakable("Bölüm "+S[si].id+". "+S[si].baslik+".")});
  els.forEach((el,i)=>{let raw=textOf(el).trim();if(!raw)return;if(/^H[34]$/.test(el.tagName))raw=raw+".";split(raw).forEach(r=>items.push({el:i,raw:r,say:speakable(r)}))});
  qSi=si;idx=0;
}
function liveEls(){const n=document.querySelector(".notes");return n?elemsOf(n):null}
function highlight(){
  document.querySelectorAll(".notes .speaking").forEach(e=>e.classList.remove("speaking"));
  if(qSi!==curSi||!items[idx]||(!playing&&idx===0))return;
  const els=liveEls();if(!els)return;const el=els[items[idx].el];if(!el)return;
  el.classList.add("speaking");
  if(playing&&pref.follow){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
function fmtLeft(){let c=0;for(let i=idx;i<items.length;i++)c+=items[i].say.length;const m=Math.ceil(c/(14*pref.rate)/60);return items.length?"~"+m+" dk kaldı":""}
function ui(){
  $("pTitle").textContent=qSi>=0?"Bölüm "+S[qSi].id+" · "+S[qSi].kisa:(curSi>=0?"Bölüm "+S[curSi].id+" · "+S[curSi].kisa:"Bölüm 1 · "+S[0].kisa+" ile başlar");
  $("pIdx").textContent=items.length?(idx+1)+"/"+items.length:"0/0";
  $("pBar").style.width=items.length?((idx+1)/items.length*100)+"%":"0%";
  $("pTime").textContent=fmtLeft();
  if(items[idx]&&(playing||idx>0))$("pNow").textContent=items[idx].raw;
  $("pIco").innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $("pPlay").setAttribute("aria-label",playing?"Duraklat":"Oynat");
  $("fabBtn").classList.toggle("live",playing);
  document.querySelectorAll("#pRates button").forEach(b=>b.classList.toggle("on",+b.dataset.r===pref.rate));
  $("pFollow").checked=pref.follow;
  document.querySelectorAll("#pMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===pref.mode));
  $("pFollowL").hidden=pref.mode==="podcast";
  {const au=pref.mode==="podcast"&&typeof AUD!=="undefined";$("pVoice").parentNode.hidden=au;if(au)$("pWarn").hidden=true;}
  highlight();
}
// Doğal (bulut/nöral) sesler ve kadın sesleri önce; masaüstü robotik sesler sona
function score(v){const n=v.name.toLowerCase();let x=0;if(/natural|online|neural|premium|enhanced/.test(n))x+=50;if(/google/.test(n))x+=35;if(/emel|yelda|filiz|seda|google/.test(n))x+=20;if(!v.localService)x+=5;if(/tolga|espeak/.test(n))x-=20;return x}
function trVoices(){return synth.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}
function pickVoice(){
  const vs=synth.getVoices();const tr=trVoices();
  return vs.find(v=>v.name===pref.voice)||tr[0]||null;
}
function fillVoices(){
  if(!synth)return;
  const vs=synth.getVoices();const tr=trVoices();const list=tr.length?tr:vs;
  const cur=pickVoice();
  $("pVoice").innerHTML=list.map((v,i)=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${cur&&cur.name===v.name?"selected":""}>${i===0&&tr.length&&score(v)>=50?"★ ":""}${v.name.replace(/^Microsoft /,"")}</option>`).join("")||"<option>Ses bulunamadı</option>";
  const w=$("pWarn");
  if(vs.length&&!tr.length){w.hidden=false;w.textContent="Bu cihazda Türkçe ses bulunamadı; okuma yabancı aksanla olabilir. Chrome veya Edge'de ya da telefonun ayarlarından Türkçe ses indirerek daha doğal bir okuma elde edebilirsin."}
  else if(cur&&score(cur)<35){w.hidden=false;w.textContent="Şu anki ses robotik olabilir. En doğal Türkçe ses için Microsoft Edge'de \"Emel Online (Natural)\", Chrome'da \"Google Türkçe\" sesini seç; iPhone ve Mac'te Ayarlar > Erişilebilirlik > Seslendirilen İçerik > Sesler bölümünden \"Yelda (Gelişmiş)\" sesini indirebilirsin."}
  else w.hidden=true;
}
function speak(){
  if(!items[idx]){stop(true);return}
  if(items[idx].src){if(synth)synth.cancel();const tok={};utt=tok;AU.src=items[idx].src;AU.playbackRate=pref.rate;
    AU.onended=()=>{if(utt!==tok||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
    AU.onerror=()=>{if(utt!==tok)return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses dosyası yüklenemedi; bağlantını kontrol edip tekrar dene."};
    AU.play().catch(()=>{});ui();return}
  AU.pause();
  synth.cancel();
  const u=new SpeechSynthesisUtterance(items[idx].say);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="tr-TR";
  u.rate=pref.rate;
  u.onend=()=>{if(utt!==u||!playing)return;idx++;if(idx>=items.length){stop(true);$("pNow").textContent="Bölüm tamamlandı. Şimdi bu bölümün sorularını çözebilirsin.";return}ui();speak()};
  u.onerror=e=>{if(utt!==u)return;if(e.error==="interrupted"||e.error==="canceled")return;playing=false;ui();const w=$("pWarn");w.hidden=false;w.textContent="Ses çalınamadı ("+e.error+"). Sayfaya bir kez dokunup tekrar dene."};
  utt=u;synth.speak(u);ui();
}
function play(){
  if(!synth&&typeof AUD==="undefined"){return}
  let si=curSi>=0?curSi:(qSi>=0?qSi:0);
  if(curSi<0){navByPlayer=true;location.hash="#b"+(si+1)}
  if(qSi!==si)build(si);
  const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){navByPlayer=true;tb.click()}
  playing=true;speak();
}
function pause(){playing=false;utt=null;AU.pause();if(synth)synth.cancel();ui()}
function stop(finished){playing=false;utt=null;AU.pause();if(synth)synth.cancel();if(finished)idx=Math.max(0,items.length-1);ui()}
function step(d){if(!items.length&&curSi>=0)build(curSi);idx=Math.min(Math.max(0,idx+d),Math.max(0,items.length-1));if(playing)speak();else ui()}
function openPanel(o){$("panel").hidden=!o;$("fabBtn").setAttribute("aria-expanded",o)}

if(!synth&&typeof AUD==="undefined"){$("pWarn").hidden=false;$("pWarn").textContent="Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü dene.";$("pPlay").disabled=true}
else{fillVoices();if("onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices}

$("fabBtn").onclick=()=>openPanel($("panel").hidden);
$("pClose").onclick=()=>openPanel(false);
$("pPlay").onclick=()=>playing?pause():play();
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("pRates").onclick=e=>{const b=e.target.closest("button");if(!b)return;pref.rate=+b.dataset.r;savePref();if(playing&&items[idx]&&items[idx].src){AU.playbackRate=pref.rate;ui()}else if(playing)speak();else ui()};
$("pMode").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.m===pref.mode)return;pref.mode=b.dataset.m;savePref();const was=playing;if(playing)pause();items=[];qSi=-1;idx=0;$("pNow").textContent=intro();if(was)play();else ui()};
$("pFollow").onchange=e=>{pref.follow=e.target.checked;savePref()};
$("pVoice").onchange=e=>{pref.voice=e.target.value;savePref();if(playing)speak()};
document.addEventListener("click",e=>{if(e.target.closest("[data-listen]")){openPanel(true);if(curSi>=0&&qSi!==curSi)build(curSi);idx=0;play()}});
document.addEventListener("ky:route",e=>{
  const si=e.detail.si;const changed=si!==curSi;curSi=si;
  if(changed&&!navByPlayer&&si>=0&&qSi!==si){if(playing)stop();items=[];qSi=-1;idx=0;$("pNow").textContent=intro()}
  if(navByPlayer){const tb=document.querySelector('.seg [data-tab="notlar"]');if(tb&&!tb.classList.contains("on")){tb.click();return}}
  navByPlayer=false;ui();
});
window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});
$("pNow").textContent=intro();
const v=document.getElementById("view");curSi=+(v.dataset.sec||-1);ui();
